findings:
- about: data
  kind: other
  severity: major
  datasets:
  - sparc-60
  statement: The rat traces changed between version 1 (2020-02-28) and version 2 of sparc-60 and are the
    same from version 2 to 5; the outer perineurium boundaries moved inward, so the effective nerve diameters
    of monofascicular samples are 0.3 to 3.5% smaller and the perineurium thinner (rat perineurium fit
    R2 0.57 with version 1, 0.77 with version 5, the paper's value). The changelog says only 'initial
    dataset creation'. The output metrics file deposited in the datasets matches the version 1 traces,
    not the current ones.
- about: data
  kind: metadata_error
  severity: major
  datasets:
  - sparc-60
  - sparc-65
  statement: The deposited output metrics file (files/derivative/CadaverVNMorphology_OutputMetrics.mat
    in sparc-65, identical to RatVNMorphology_OutputMetrics.mat in sparc-60) gives pig fascicle diameters
    about 1.40 times those measured from the pig masks of sparc-64 and reported in the paper (pig MT mean
    134.6 um from the masks, paper 135 um), and its pig fascicle counts are those of the version 1 masks
    of sparc-64, which differ from version 4 in 11 of 18 samples. Its human values match the masks exactly.
    Nothing in the files says which values are current.
- about: data
  kind: other
  severity: minor
  datasets:
  - sparc-60
  - sparc-65
  statement: For the three multifascicular rat samples (R16-1, R22-1, R23-1) the output metrics file gives
    the connective tissue boundary as the nerve diameter, while the Methods and the Results' means use
    the outer perineurium of the largest fascicle (subdiaphragmatic mean 135.2 um against 174.7 um with
    the file's values).
- about: data
  kind: format_error
  severity: minor
  datasets:
  - sparc-64
  - sparc-65
  statement: 18 of the 212 binary masks read (17 in sparc-64, 1 in sparc-65, C54-3 NerveMask) are stored
    with TIFF photometric MinIsWhite, so readers that return the raw bits (tifffile, PIL) give them inverted
    relative to the others and to MATLAB's imread; for example the sparc-64 fascicle masks of most samples
    then appear as one object with the fascicles as holes. The paper's outputs match only after inversion.
- about: data
  kind: metadata_error
  severity: minor
  datasets:
  - sparc-60
  - sparc-16
  statement: The readmes of sparc-60 and sparc-16 give the rats' ages as 65 to 268 days; the subjects
    sheets give 75 to 268 days, as the paper does.
- about: data
  kind: metadata_error
  severity: minor
  datasets:
  - sparc-61
  statement: In sparc-61 the micrograph named C48-2 is in files/primary/sub-48/sam-2, which has no row
    in samples.xlsx, while samples.xlsx lists sub-48/sam-1 (right cervical) with no folder. Copies of
    the C51-3 and C63-1 derivatives are also filed under sub-50/sam-2 and sub-62/sam-1, and C63-1's derivative
    is under sub-63/ without a sample folder.
- about: data
  kind: metadata_error
  severity: minor
  datasets:
  - sparc-89
  statement: In sparc-89, sub-9_sam3_P9-3ScaleBar.tif is byte-identical to P11-1's scale bar files; the
    paper's code reads the separate P9-3ScaleMask.tif, so the analysis is unaffected.
- about: data
  kind: other
  severity: none
  datasets:
  - sparc-65
  - sparc-64
  - sparc-89
  - sparc-60
  statement: Emulating the deposited MATLAB code reproduces the deposited human output metrics exactly
    (nerve diameters, fascicle counts and diameters of all 18 samples) and the pig IF tissue proportions
    of PigIFMorphology.mat, and the current masks reproduce the paper's reported means, SDs, counts and
    fits to the stated precision.
- about: paper
  kind: paper_inconsistency
  statement: The Discussion's rat ratio of subdiaphragmatic to cervical nerve diameter (0.68) is reproduced
    only with the connective tissue boundary for the three multifascicular samples (0.678), while the
    Results' rat means, which use the largest fascicle as the Methods state, give 0.52.
- about: paper
  kind: methods_unavailable
  statement: 'Questions for the authors. (1) Which JMP settings gave the mixed model F tests: the nerve
    diameter interaction is non-significant only with an unbounded (negative) subject variance, and the
    per-species fascicle diameter contrasts (fascicles-larger-cervical) depend on the degrees of freedom
    method (pig p = 0.048 with Satterthwaite, 0.0016 with containment df; paper 0.0009). (2) What test,
    if any, supports ''did not suggest a difference'' between levels in the perineurium fits; separate
    cervical and subdiaphragmatic fits differ in humans and pigs (F about 20, p < 0.0001). (3) Whether
    Supplement 6 tested age trends; 3 of 27 Pearson correlations have p < 0.05 in pigs. (4) The rule for
    counting carotid sheath bundles (Supplementary Figure 16) and for calling adipose tissue (Supplement
    3).'
