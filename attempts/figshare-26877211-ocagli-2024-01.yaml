inputs:
- what: The FAS derivations of the paper's code (R/process_df.R, R/add_metadata.R and
    R/extract_jecfa_tox_abbr.R), re-implemented in jecfa.py to check the deposited fas column and to
    run the second FAS reading that the criteria of table1-availability and fas-codes name. The
    notebook fetches these R functions at the commit and prints them beside the Python ports. No data
    are taken from it.
  source: https://github.com/UBESP-DCTV/jecfa at commit 2d8a5340d5322cbae28eb3095d948313932f6c7e
outcomes:
- claim: data-records-rows
  outcome: reproduced
  notebook: reproduce_ocagli_2024.ipynb
  output: claim:data-records-rows
  measured: 6552
  notes: jecfa.rds has 6552 rows and 17 columns, one for each field of Table 1, named as in
    R/process_df.R in lower case with "." replaced by "_".
    JECFA.csv holds the same 6552 rows and 17 columns, with no differing cell. The MD5 of both files
    read matches the archive's computed_md5. The columns R/add_metadata.R adds are absent, so the
    deposit is the output of process_df.R. The "May 2024" date cannot be checked from the files,
    which carry no scrape date.
- claim: unique-pages
  outcome: reproduced
  notebook: reproduce_ocagli_2024.ipynb
  output: claim:unique-pages
  measured: 6550
  notes: D1 (distinct URLs) gives 6552, 3 from 6549 and outside the tolerance of 2, as no URL is
    repeated. D2 (distinct JECFA names less page 5883) and D3 (rows less page 5883 and less the
    second row of page 6316's chemical) give 6550, within tolerance. Page 6316's chemical appears
    twice, at pages 6316 (name only) and 6319 (full record); page 5883 is named TEST and carries
    nothing else. The paper's 6549 is reached, for example, by removing both rows of that chemical
    with the test page (the one variant tested).
  deviations:
  - The criterion's readings D1 to D3 are all run; measured is the first that matches (D2). D1 does
    not match.
- claim: table1-availability
  outcome: reproduced
  notebook: reproduce_ocagli_2024.ipynb
  output: claim:table1-availability
  measured: [100, 100, 82.57, 78.30, 35.36, 70.80, 64.99, 46.26, 98.32, 98.20, 97.62, 97.62, 92.86,
    92.86, 91.82, 91.82, 81.38]
  notes: Over all 6552 rows (U1 and U2 are the same, as no URL repeats), 16 of 17 shares are within
    tolerance with the deposited fas column (reading A), FAS being 81.38% against 93% (lower bound
    83.7%), and 17 of 17 with fas after the step of R/add_metadata.R (reading B, 86.74%). Over the
    6550 rows left after cleaning, no share moves by more than 0.05 points. Rounded to whole
    numbers 12 of 17 equal Table 1 (Chemical names 83, Synonyms 78, Report and its link 98 differ
    by one point, FAS by 12 under A). Counting the 752 empty fas strings as present gives 92.86%,
    which suggests Table 1 counted every non-NA value; the claims file's reading E counts them as
    absent. The outcome rests on 16 of 17 under A, or 17 under B, and does not depend on how the
    empty strings are counted.
  deviations:
  - The criterion names the FAS column of both process_df.R and add_metadata.R; the deposit holds
    the first. Both are run (A and B), and both give reproduced.
- claim: table2-evaluation-year
  outcome: reproduced
  notebook: reproduce_ocagli_2024.ipynb
  output: claim:table2-evaluation-year
  measured: [2357, 3099, 778, 200, 118, 36.63, 48.17, 12.09, 3.11]
  notes: The four bins and the unknowns equal Table 2 exactly; shares are over the 6434 rows with a
    year. Counts are compared with the claims file's tolerances (236, 310, 78, 20 and 12). All years
    lie between 1958 and 2023. The text's 2,356 for the first bin differs by one from
    Table 2 and from the data.
- claim: table2-functional-class
  outcome: reproduced
  notebook: reproduce_ocagli_2024.ipynb
  output: claim:table2-functional-class
  measured: [4635, 1453, 77, 277, 110, 71.95, 22.56, 1.20, 4.30]
  notes: The counts equal Table 2 exactly; shares are over the 6442 rows with a class. Every
    functional_class string starts with one of the four class names (the data spell "Flavouring
    Agent"), so none is left unmatched. Flavouring agents are the largest class.
- claim: unknowns-name-only
  outcome: not_reproduced
  notebook: reproduce_ocagli_2024.ipynb
  output: claim:unknowns-name-only
  measured: [86.4, 80.5]
  notes: 95 rows carry only a URL and a JECFA name, and each of them has both class and year
    unknown. They are 95 of 110 rows with an unknown class (86.4%) and 95 of 118 with an unknown
    year (80.5%), both below the criterion's 90%. The criterion states only when the claim is
    reproduced, so the outcome is not reproduced (changed from partially reproduced after
    verification round 1). The other 15 rows with an unknown class carry a year, a report and
    identifiers; 13 of them lie between pages 6385 and 6450 and 13 were evaluated in 2008. The
    other 23 with an unknown year all carry a functional class (13 food additives, 9 food
    contaminants, 1 flavouring agent), 15 of them chemical names and 14 synonyms; 11 of them are
    pages 6476 to 6533. The statement holds exactly for the 95 rows unknown on both class and year.
    Whether "the unknowns" means those rows is asked of a reader in
    questions/figshare-26877211.yaml; the claim is tested as the claims file has it.
- claim: fas-codes
  outcome: partially_reproduced
  notebook: reproduce_ocagli_2024.ipynb
  output: claim:fas-codes
  measured: 46.34
  notes: The seven named codes hold 3036 rows, 46.34% of all 6552 rows (F1, within 5 points of 50%)
    under both FAS readings; over the rows with a FAS code (F2) 56.94% with the deposited column (A,
    outside tolerance) and 53.42% after add_metadata.R (B, within). They are not the seven most
    frequent; FAS 59 (351 rows) and FAS 54 (287) are more frequent than FAS 52 (286) under both
    readings, and FAS 60 (353) too under B; the named codes rank 1 to 6 and 9 (A) or 10 (B). The deposited column has 81
    distinct non-empty values, which meets the 77 the criterion takes for "almost all 85", and 73
    after add_metadata.R, which does not. The 81 include malformed values (eight such as "77 JECFA
    86", five decimals such as "67.29", and "617") and "86", above 85. Counting only whole numbers
    from 1 to 85 gives 66 codes (A) and 71 (B), both below 77, so "almost all 85" does not hold
    under a cleaned reading; codes 2, 3, 4, 7, 9, 11, 61, 63, 66, 76, 79, 81, 84 and 85 are absent
    under both. The criterion sets the outcome by the share and the ranking, so this does not
    change it.
  deviations:
  - The criterion names the FAS column of both process_df.R and add_metadata.R; the deposit holds
    the first. Both are run (A and B), and both give partially reproduced.
- claim: validation-failures
  outcome: blocked
  blocked_by: data_missing
  notes: The test needs the manual extraction of the 700 sampled pages, entered in REDCap at the
    University of Padova. It is not among the item's two files (the scraped table as RDS and CSV),
    not in the paper's GitHub repository at commit 2d8a5340, and the paper names no other place for
    it. The portal has changed since May 2024, so the check cannot be repeated on the pages as
    scraped.
- claim: portal-search-count
  outcome: partially_reproduced
  notebook: reproduce_ocagli_2024.ipynb
  output: claim:portal-search-count
  notes: The portal's 6547 is outside data, not public in its May 2024 state, and is not tested. In
    the dataset all 6552 rows carry a JECFA name, within the tolerance of the paper's 6551 but one
    more. After the cleaning of unique-pages, D2 and D3 give 6550, 3 more than 6547 and outside the
    margin of 2 the criterion takes for "aligns"; D1 gives 6552. The paper's own numbers (6551 less
    2 is 6549) are within 2 of 6547; the one extra row in the deposit is what puts the count outside.
    The data do not explain the gap between 6552 and 6551; leaving out the test page, named
    "TEST", gives 6551, but the paper then removes the test page again. Removing both rows of page
    6316's chemical with the test page gives 6549, within 2 of 6547, but that is none of the
    readings D1 to D3 and is not used. The criterion states only when the dataset's part is
    reproduced; partially reproduced is recorded because one of its two conditions holds and the
    portal part cannot be tested. No measured value is given, as the first
    expected value (the portal count) cannot be measured.
  proposed:
    outcome: not_reproduced
    reason: The criterion states only when the dataset's part is reproduced, and of its two
      conditions the one that carries the claim, within 2 of 6547 after cleaning, fails (6550 under
      D2 and D3, a difference of 3; 6552 under D1). The criterion gives no partial level, and for
      unknowns-name-only, whose criterion is written the same way, the outcome is not reproduced
      when the condition fails. The portal part stays untested. Verification round 2 found the
      partial level an unstated assumption. Notebook cells 42 and 43.
findings:
- kind: data_missing
  statement: The manual extraction of 700 portal pages used for the Technical Validation (REDCap,
    University of Padova) is not deposited, so the discrepancy rates of the validation cannot be
    checked.
- kind: paper_inconsistency
  statement: The Methods say the 6552 scraped entries were cleaned of a duplicate and a test page to
    6549 unique pages, and Data Records says each entry corresponds to a unique chemical, but the
    deposited table holds all 6552 rows, including the test page 5883 (named TEST, with no other
    field) and page 6316, a name-only stub of the chemical whose full record is page 6319.
- kind: metadata_error
  statement: The item's description calls FAS a "FAO/WHO Food Additive Specification identifier".
    The column is the number of the Food Additives Series toxicological monograph, derived from the
    Tox monograph by R/process_df.R in every row, as the paper's Table 1 describes it.
- kind: code_mismatch
  statement: The deposited fas column, from R/process_df.R, is empty for 355 rows whose Tox
    monograph is a FAS monograph (339 FAS 60, 10 FAS 74, 2 FAS 27, 4 written "FAS79"), which its
    "^FAS " pattern misses; 349 of the 752 empty values have a Tox monograph starting with the stray
    characters '">'. It holds 752 empty strings beside 468
    NA, and some values keep a session or page ("77 JECFA 86", "67.29", "617"). R/add_metadata.R
    repairs part of this but its output is not deposited. With empty strings counted as absent the
    FAS share is 81.4%, against 93% in Table 1.
- kind: metadata_error
  statement: Table 1 describes the COE number as assigned by the Codex Alimentarius Commission; the
    item's description calls it the Council of Europe number. COE numbers are present for 3022
    flavouring agents and 9 food additives and for no other class, which is consistent with the
    Council of Europe numbering of flavourings, not with Codex.
- kind: other
  statement: Scraped values carry formatting residue. 602 report, 349 Tox monograph and 398
    specification values start with '">' (the Usage Notes mention this for Report); 33 FEMA numbers
    are plain integers padded with spaces; 31 JECFA numbers are not plain integers ("506a,b", "632.1"); 46 of 2127
    plain CAS numbers fail the CAS check digit, and 190 CAS values hold several numbers or notes.
