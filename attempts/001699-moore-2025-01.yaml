- claim: figs1d-probe-in-posub
  outcome: blocked
  blocked_by: other
  notes: Every one of the 36 files holds RGB histology images (acquisition/histology_images, for example
    H3001_D2 and H3001_D3), including the four whose asset names lack +image (H3001 on both days, H4822,
