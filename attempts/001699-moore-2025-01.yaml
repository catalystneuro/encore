- claim: figs1c-juvenile-behaviour-similar
  outcome: reproduced
  notebook: reproduce_moore_2025.ipynb
  output: claim:figs1c-juvenile-behaviour-similar
  notes: t-tests on the means of 7 WT and 5 Fmr1-/y rats; time inactive (speed below 1 cm/s) 0.179
    against 0.105, t(10) = -0.95, p = 0.37; time in the centre 0.082 against 0.178, t(10) = 1.91,
    p = 0.085; speed while active 4.86 against 5.77 cm/s, t(10) = 2.22, p = 0.0504. With 2 cm/s
    thresholds and a larger centre, p = 0.21, 0.096 and 0.22. With the first day of each rat alone the
    active speed differs (t(10) = 2.50, p = 0.031), so the absence of a speed difference is fragile.
  deviations:
  - The paper does not define inactivity, the centre or the active period; the thresholds were fixed
    in the criterion and variants are shown.
