  notes: Under reading (a), all units, juvenile recordings hold 8 to 83 units (paper 8 to 83) and adult
    recordings 55 to 114 (paper 30 to 114), so the juvenile pair and the adult maximum match and the
    adult minimum does not. Under reading (b), putative excitatory units by trough-to-peak duration,
