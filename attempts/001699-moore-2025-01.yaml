  notes: Mean absolute decoder drift over rat means is 17.5 degrees in 5 Fmr1-/y rats and 34.6 in 7 WT
    rats, the paper's direction, but t(10) = -1.95, p = 0.079 (paper t(10) = 2.44, P < 0.05; version 2
    t(10) = 3.17). With version 2's 1.5 cm/s threshold p = 0.064, for the SD of drift p = 0.13, with
    the first day alone p = 0.079, with the archive's labels p = 0.22. H3019 210618-1 is left out (5
    cells) and H3001 200201 is decoded on 22 bins, as the rat barely moved in the second half.
  deviations:
