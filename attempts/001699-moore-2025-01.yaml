    location string per channel but no histological confirmation. Judging whether a tract passes through
    PoSub from the images needs an anatomist; it was not attempted.
findings:
- kind: metadata_error
  statement: The paper's unit counts (406 units in 7 juvenile WT rats, 372 in 5 juvenile Fmr1-/y rats,
    543 in 6 adult WT rats) and its range of 8 to 83 units per juvenile recording are matched exactly
    only if H3026, labelled WT, is a juvenile Fmr1-/y rat and H3029, whose date of birth makes it 97 days
    old, is a juvenile WT rat. With the archive's labels the juvenile groups have 5 WT and 4 Fmr1-/y rats,
    and the juvenile effects weaken (HD information p = 0.23, offsets p = 0.17).
- kind: metadata_error
  statement: The dates of birth of H3023 (2022-08-13) and H3026 (2022-09-13) are after their recordings
    in 2021, so the archive's asset metadata, which derive the age from the date of birth, give them negative
    ages (P-366D to P-344D). H3029 shares H4830's date of birth. No NWB file sets the subject's age.
- kind: data_missing
  statement: The file of H4825 holds the recording of H4824 (identical waveforms, unit and spike counts,
    and spike times up to 1248 s), with its spike and tracking times shifted piece by piece onto H4825's
    epoch table and clipped at its end, where 131373 spikes share the last spike time and 12970 tracking
    frames repeat a timestamp. H4825's own recording is not in the dandiset, so the adult Fmr1-/y group
    has 5 rats and 440 units where the paper has 6 and 507.
- kind: selection_undocumented
  statement: The units table holds all curated units with only spike times, mean waveforms, electrode
    group and sampling rate; no cell type, contamination or depth. The paper excluded cells recorded in
    the part of PoSub already recorded on the previous day, and the files give no probe depth per day,
    so that selection cannot be repeated.
- kind: metadata_error
  statement: The epochs and processing/tasks tables do not mark the exploration sessions reliably. In
    H3001 200202 task epoch 1 is called wake but lasts 94 min without tracking; in H3026 211003 epoch
    1 spans 112 min of waking and sleep; in H3023 210813-1 epoch 2 runs from the end of the first session
    into the second; H4823 has a single epoch and no sleep task. Every file's session description mentions
    a cue rotation, and most files hold a third tracked session (`wake_cue_rot`), which version 1 of the
    paper does not describe.
- kind: metadata_error
  statement: In H3015 210417 and H4823 221108 position is stated in centimetres but spans about 300 and
    700 units, so it is in pixels, and head direction runs from -pi to pi where the other files use 0
    to 2 pi.
- kind: format_error
  statement: One unit of H3023 210812 has spike times out of order. 22 of the 24 juvenile files have one
    to three tracking frames whose timestamp does not increase.
- kind: metadata_error
  statement: The dandiset's `about` field lists "Fmr1 protein, rat" as an anatomy term with the MeSH identifier
    of Fragile X Syndrome (D005600).
- kind: methods_unavailable
  statement: The paper's analysis code (Matlab and R, per its Methods) is not public; its Code Availability
    says it will be released at publication. The repository the dandiset links, woodcode (commit 61ee178),
    is the lab's general library and does not hold the paper's analysis. Version 1 does not describe the
    Bayesian decoder; version 2 does.
- kind: paper_inconsistency
  statement: The Methods exclude units with contamination scores "below 0.5", which would remove nearly
    every unit (1727 of 1761 are below). The ranges of units per recording mix counts of all units (8
    to 83, maximum 114) with a count of putative excitatory units (minimum 30), while the text calls them
    all putative excitatory. Version 2 gives the adult counts as 372 and 406 units in 6 rats each, the
    juvenile numbers repeated.
