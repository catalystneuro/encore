  - 114
  notes: Under reading (a), all units, juvenile recordings hold 8 to 83 units (paper 8 to 83) and adult
    recordings 55 to 114 (paper 30 to 114), so the juvenile pair and the adult maximum match and the adult
    minimum does not. Under reading (b), putative excitatory units by trough-to-peak duration, juvenile
    5 to 50 and adult 30 to 81; under (c), cells of session 1, juvenile 5 to 49 and adult 30 to 80. The
    paper's adult minimum of 30 is the putative excitatory count of H4822, while its other three bounds
    are counts of all units, so the reported ranges mix two readings.
  deviations:
  - The paper calls these putative excitatory units; three of its four bounds match all units instead.
- claim: figs1c-juvenile-behaviour-similar
  outcome: reproduced
  notebook: reproduce_moore_2025.ipynb
  output: claim:figs1c-juvenile-behaviour-similar
  notes: t-tests on the means of 7 WT and 5 Fmr1-/y rats; time inactive (speed below 1 cm/s) 0.177 against
    0.107, t(10) = -0.90, p = 0.39; time in the centre 0.084 against 0.180, t(10) = 1.86, p = 0.093; speed
    while active 4.88 against 5.74 cm/s, t(10) = 2.10, p = 0.063. With 2 cm/s thresholds and a larger
    centre, p = 0.25, 0.11 and 0.26. With the first day of each rat alone the active speed differs (t(10)
    = 2.45, p = 0.034), so the absence of a speed difference is fragile.
  deviations:
  - The paper does not define inactivity, the centre or the active period; the thresholds were fixed in
    the criterion and variants are shown.
  - Sessions are cut to their first 20 min, the paper's session length, where the claims file cuts only
    tracking blocks over 30 min, to 1300 s; the change was made after the first round of verification,
    and the claims file's definition is shown as a variant in the notebook.
