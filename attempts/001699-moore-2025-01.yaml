- claim: fig1ef-juvenile-sharper-tuning
  outcome: partially_reproduced
  notebook: reproduce_moore_2025.ipynb
  output: claim:fig1ef-juvenile-sharper-tuning
  notes: HD information is higher in Fmr1-/y cells (median 0.603 against 0.184 bits/spike, LME
    coefficient 0.33, p = 0.033; first day alone p = 0.038). It is not significant on log values
    (p = 0.12), with uniform occupancy as in version 2 (p = 0.081), on rat means (t(10) = 2.07,
    p = 0.065) or with the archive's labels (p = 0.24). The half-width does not differ (median 50
    against 64 degrees, p = 0.69; 27 Fmr1-/y and 48 WT cells never fall below half their peak).
  deviations:
  - Cells re-recorded on consecutive days could not be excluded as in the paper; the first day alone
    is a variant.
  - A linear mixed model on raw values; the paper chose linear or generalized models by the
    distribution.
