- claim: unit-counts
  outcome: partially_reproduced
  notebook: reproduce_moore_2025.ipynb
  output: claim:unit-counts
  measured:
  - 406
  - 7
  - 372
  - 5
  - 543
  - 6
  - 440
  - 5
  notes: Counting all units of each recording once (reading a), juvenile WT 406 units in 7 rats,
    juvenile Fmr1-/y 372 in 5 and adult WT 543 in 6 match the paper exactly; adult Fmr1-/y has 440
    units in 5 rats against 507 in 6, as H4825's file holds H4824's recording. Counting H4825's file as
    a recording of its own gives 528 units in 6 rats, within tolerance, but counts one recording twice.
    As putative excitatory units (reading b) no group matches (326, 249, 399, 289). With the archive's
    labels no group matches (juvenile WT 328 units in 5 rats, juvenile Fmr1-/y 221 in 4, adult WT 575 in
    7). Version 2 of the paper gives 372 units in 6 adult Fmr1-/y rats and 406 in 6 adult WT rats, the
    juvenile numbers repeated.
  deviations:
  - H3026 is counted as a juvenile Fmr1-/y rat and H3029 as a juvenile WT rat, where the archive labels
    H3026 WT and gives H3029 a birth date that makes it an adult; this grouping is the one that matches
    the paper's counts, and it was chosen from those counts.
  - H4825's file is left out as a copy of H4824's recording.
