- claim: eye-position-no-difference
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_shi_2013.ipynb
  output: claim:eye-position-no-difference
  notes: The data set holds no documented eye position. The analog channels are named only AD01 to
    AD16, and the layout of the .plxAnaAD.dat files is undocumented. Read as 7 channels of 12-bit
    samples at 1 kHz at the end of each file, no channel of three sessions differs between targets
    in the hold (one-way ANOVA P 0.15 to 1.00) or correlates with the record's hand position beyond
    |r| = 0.25; most saturate at +/-2047, and one spans the 16-bit range, so the layout reading is
    at least partly wrong. The 24 field record (224 of the 359 sessions) ends with two numbers near
    (0, -1.8) that might be an eye position averaged over the hold, but nothing names them; their
    SD within a session (0.05 to 0.07) is below the tracker's 0.25 degree resolution, which a mean
    of about 100 samples could reach, so the spread does not settle what they are. Tested on them
    for the record only (trials pooled over sessions), no target shows a V against NV difference by
    MANOVA, and one shows one by Levene's test (90 degrees, second value, P = 0.012 centred on the
    mean, 0.28 on the median); 8.7% of session and target pairs differ by MANOVA.
