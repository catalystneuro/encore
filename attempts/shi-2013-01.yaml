- claim: movement-epoch-tuning
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_shi_2013.ipynb
  output: claim:movement-epoch-tuning
  measured: 179
  notes: With movement onset at event code 8, 187 of 359 units (52.1%, 179 scaled to 343) have a
    target main effect or interaction in the 500 ms centred on it, against 139 +/- 13.9 (41%). All
    483 units give 49.9% (171 scaled). A window centred on the target-code event (the cursor
    entering the target window) gives 65.5%, and one on code 3 (target onset) 6.1%. Question for
    the paper's authors, how movement onset was defined (methods_unavailable finding).
  deviations:
  - Movement onset is taken as event code 8 (reading (a) of the criterion, an event code). The
    data set does not document the codes; code 8 comes 0.22 to 0.58 s after code 3 (read as target
    onset) and 0.03 to 0.38 s before the target code event, which fits the cursor leaving the start
    window, the definition of reading (b). No continuous arm position is in the data set to run
    reading (b) directly. This reading of the code is an assumption.
  - Monkey X only, 359 units; counts compared as percentages, scaled to 343.
