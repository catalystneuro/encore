- claim: behavior-mean-position-sessions
  outcome: not_reproduced
  notebook: reproduce_shi_2013.ipynb
  output: claim:behavior-mean-position-sessions
  measured: 16.12
  notes: In 2,872 session and target pairs of 359 monkey X sessions, 16.1% show a significant V against
    NV difference by the two-group MANOVA (Hotelling T squared), both as the mean of the 8 target
    percentages (16.12, SD 4.27 over targets) and pooled (16.12), against 6.9 +/- 1.5%. Per target
    the percentage runs from 9.2 to 22.8%. With the V and NV labels shuffled within each session and
    target the MANOVA rejects in 5.7% of pairs, and the conditions are interleaved within sessions
    (median 39 runs of one condition against 41 for a random order), so neither the test nor slow
    drift accounts for the 16%. Within a session the five trials at a target spread by a median SD
    of 0.29, 0.29 and 0.19 cm in x, y, z.
  deviations:
  - Monkey X only; the data set holds no monkey B session, so the average is over 8 targets of one
    animal, not 16 animal and target cells.
  - Each trial has one hand position in the data (fields 19 to 21 of the trial's text record), not
    a position trace, so the MANOVA uses that value in place of the trial's mean over the 800 ms hold
    (Fig. 2 legend). That it is the hold endpoint is read from the data (its target means match Table
    1 within its SDs); the data set does not say whether it is a hold mean or one sample. No analog
    channel of the three sessions summarised follows the hand, so it cannot be checked against a trace.
  - V and NV are codes 4 and 7 of the record's field 14 under an assumed mapping; the test is symmetric
    in V and NV, so the mapping does not change it.
