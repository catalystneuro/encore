- claim: correlation-endpoint-datasets
  outcome: reproduced
  assumed: true
  notebook: reproduce_shi_2013.ipynb
  output: claim:correlation-endpoint-datasets
  measured:
  - 0.9237
  - 0.9154
  notes: With each cell's V and NV mean hold rates at a target as one pair (reading (a)), Spearman r
    is 0.9237 for the 463 cell and target pairs whose session and target had a significant MANOVA
    (data set 1) and 0.9154 for the 2,409 others (data set 2), both within 0.093 of 0.9301 and
    0.9281; the permutation test finds no difference (difference 0.0083, P = 0.469). With single
    trials paired by order (reading (b)), r is 0.794 and 0.767, outside tolerance, and the
    difference of 0.027 is significant (P = 0.025). All 483 units give P = 0.267 (a) and 0.001 (b).
    Data set 1 is larger here than the paper's would be, as 16% of pairs had a significant MANOVA
    (behavior-mean-position-sessions).
  deviations:
  - The readings give different outcomes. Reading (a) is adopted as an assumption, as its r values
    are of the size the paper reports (0.93) and the paper speaks of correlations between the
    responses in the two conditions; reading (b) gives r near 0.78. Question for the paper's
    authors (methods_unavailable finding).
  - Monkey X only; one hand position per trial for the MANOVA that forms the data sets.
