findings:
- kind: data_missing
  statement: The data descriptor gives 343 cells, 219 from monkey X and 124 from monkey B. Every
    session with a trial record has monkey X's target layout (targets about 9.2 cm apart
    horizontally and 7.4 cm vertically, middle row at y near -4 cm, depth near 10 cm, as in Table 1
    for monkey X); none has monkey B's square layout at a depth near 14.5 cm. Monkey B's data appear
    not to be in the data set.
- kind: selection_undocumented
  statement: The data set holds 359 monkey X sessions with the paper's complete design (5 completed
    trials per target and condition) and 485 sorted units in them (83 sessions have 2 units, 21 have
    3 or 4), against the paper's 219 monkey X sessions and neurons, plus 47 sessions with an
    incomplete design. Which sessions and units the paper analysed is not documented.
- kind: metadata_insufficient
  statement: The condition of a trial (Vision or No Vision) is coded only as 4 or 7 in field 14 of
    an undocumented ASCII record strobed after each trial. Nothing says which is Vision. Code 7 trials
    are aborted more often after the end of the reach (5,688 against 4,423) and not before it (6,040
    against 6,006), which suggests 7 is No Vision; this attempt assumes so. Question for the data
    owners, which code is Vision.
- kind: metadata_insufficient
  statement: The event codes are not described. EventCodes.txt is a generic list (TAPE = 1, DISPLAY
    = 10 and so on) that does not match the codes in the files (0, 1, 55, 3 to 8, the target codes
    44 to 66, 10, 12, 13, 14, 255). Their meaning, and that of the 19, 22 or 24 fields of the
    per-trial text record (task parameters, target, condition, hand position, two further values),
    had to be read from their timing and values.
- kind: metadata_insufficient
  statement: The analog channels (in .plx and .plxAnaAD files) are named AD01 to AD16 without
    description, and the descriptor does not say what they record. No continuous arm or eye
    position could be identified; the trial record gives one hand position per trial.
- kind: metadata_insufficient
  statement: The descriptor gives no units for the time stamps. In the .mat files spike times are in
    milliseconds and event times in seconds; they agree with the .plx file of the session checked
    (010609_1).
- kind: other
  statement: Nine early files (d1 to d14.mat, 2008) have a 19 field record without hand positions
    and a minimum hold (record field 11) of 500 or 600 ms where the other sessions have 800 to 1,100
    ms, below the paper's 800 ms hold.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) How movement onset was defined for the 500 ms
    movement epoch; this attempt used event code 8, which fits the cursor leaving the start window.
    (2) What a response pair is in the Spearman correlations between V and NV (each cell's mean rate
    at a target, adopted here, or single trials). (3) Which cells were outliers in Fig. 5 (the Fig. 4
    outliers were adopted here). (4) Whether CV2 pools the ISIs of a cell's trials (adopted here) or
    averages per trial values. (5) Which sessions and units form the 219 monkey X neurons.
