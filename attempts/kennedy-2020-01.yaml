    agrees: true
    outcome: partially_reproduced
    reason: 'Summed over the 5 mice, cells per day are 203, 183 and 176. That is a mean of 187.33 with an SEM
      of 8.09 over the 3 days, against 187.3 +/- 8.1, so this part is within tolerance (cell 20). The 78 tracked
      cells cannot be measured: the files hold no cross-day registration, no IDs and no footprints, and cell
      17 finds no index-matched identity (0 of 15 day pairs at p < 0.05). The criterion needs both counts,
      so the claim is only partly reproduced. The header table (cell 0) lists the claim only as ''Tested (tracked
      count not measurable)'', with no outcome. Dataset identity rests on the cell count alone; the metadata
      contradict the paper (VMHvl, GCaMP6m, DF/F against a.u., 11 Hz in every file with no mouse standing out
      as the 20 Hz one), and the notebook does not test them further, for example by comparing the frame-to-frame
      autocorrelation timescale across mice; the near-exact match of 187.33 +/- 8.09 is good evidence that
      these are the paper''s cells. The tracked-cell bound of 158 is correct and is not used as a test. Helper
      functions were not tested on synthetic inputs by the verifier; it checked cells_per_day by hand (mean
      187.33, SD 14.01, SEM 8.09 with ddof = 1).'
    response: 'No change of outcome. The header table now gives the outcome, partially reproduced. A new section
      checks which mouse was imaged at 20 Hz from the frame-to-frame structure and a slow timescale per file:
      M5 stands apart on all three days (lag-1 autocorrelation of the first differences -0.07 to -0.18 against
      -0.35 to -0.47 in M1 to M4), so it is the likely 20 Hz mouse, brought to 11 Hz by a processing the files
      do not describe; its timescale and step spacing give no sign of a misstated rate. The metadata_error
      finding on the rate now says so. A new cell runs the helpers (step_times, step_counts, frame_noise_structure,
      max_cross_file_correlation, cells_per_day) on synthetic inputs with known answers; each returns them.
      The cell counts and the outcome are unchanged on the re-run.'
