findings:
- kind: metadata_insufficient
  statement: 'No file holds the time or the identity of any stimulus presentation: there are no stimulus,
    intervals, trials or acquisition entries, and the only annotation is ''Ch1: baseline''. Every imaging
    finding of the paper except the cell count rests on the five stimuli (rat, mouse, toy rat, USS, tone)
    presented twice a day, so 15 of the paper''s imaging claims, and the 3 model claims that use them,
    cannot be tested. The paper''s code reads them from a MATLAB struct that is not public, and its mouse
    indices (1, 3, 4, 5, 7) have no stated mapping to the files'' M1 to M5.'
- kind: identifier_missing
  statement: The files hold no cell identifiers, spatial footprints or cross-day registration, so the
    78 cells the paper tracks across days (used by its decoder, PCA and cross-day analyses) cannot be
    found. Columns are ordered by amplitude within each file (Spearman rho of index with SD -0.93 to -0.35
    in 14 of 15 files), and beyond that ordering per-cell SDs do not match by column index across days
    (0 of 15 day pairs at p < 0.05).
- kind: data_missing
  statement: The dandiset holds only the microendoscopic imaging. The fiber photometry, the open field
    and home cage behaviour with optogenetics, the tetanus toxin photometry, the slice electrophysiology
    and imaging, and the silicon probe recordings are not in it nor elsewhere on DANDI; the paper says
    its data are available from the corresponding author on request. 20 of the paper's 39 claims rest
    on them.
- kind: metadata_error
  statement: The trace description says 'Calcium imaging neural trace in VMHvl' and its comments 'GCaMP6m
    was used'; the paper imaged VMHdm/c SF1 neurons expressing GCaMP6s (Methods, Virus, AAV1.Syn.Flex.GCaMP6s).
- kind: metadata_error
  statement: Each file's subject_id joins the mouse and the day (M1_session1), so the archive's summary
    counts 15 subjects where the file names hold 5 mice imaged on 3 days each.
- kind: metadata_error
  statement: All 15 files have the same session_start_time, 2020-09-16T00:00:00-07:00, so recording dates
    and the order of the days are given only by the file names.
- kind: metadata_insufficient
  statement: The traces' comments say 'Units are DF/F' and their unit is 'a.u.'. The values (-45.2 to
    349.3, per-cell medians -0.42 to 2.89) are not in the baseline SD units the Methods report (in the
    annotated baselines of M1 and M2 the median per-cell SD is 2.3 to 3.7), and whether they are DF/F
    as a fraction or in percent is not stated.
- kind: metadata_insufficient
  statement: 'The annotation ''Ch1: baseline'' (''Intervals where baseline was ocurring'') holds three
    intervals in each M1 and M2 file (33.6 to 134.2 s long, the first from 0 s) and is empty in the 9
    files of M3, M4 and M5. What a baseline is here is not described, and the dandiset''s description
    promises behavioural annotation that the files do not hold.'
- kind: other
  statement: Steps shared by many cells recur about every 100 s (median 101.8 s) in 14 of 15 files, and
    all 30 starts and ends of the baseline intervals of M1 and M2 fall on transitions at or above the
    99.71th percentile of the mean step. This is consistent with each file joining separate recordings,
    as the Methods' concatenation of a day's frames would give; any joins are not marked, and the files
    last 25 to 34 minutes where 10 presentations at least five minutes apart need at least 45. Outside
    the baselines a day holds room for 16.0 to 18.6 segments of the regular spacing (about 102 s in M1,
    M3 and M4, 92.5 s in M5, 89 to 101 s in M2), against 10 presentations, so segments do not map one
    to one onto presentations.
- kind: metadata_error
  statement: Every file states a rate of 11 Hz, while the Methods say one of the five mice was imaged
    at 20 Hz. No mouse has about twice the frames of the others, so that mouse was either resampled before
    deposit or its rate is misstated; the files do not say which. M5 stands apart on all three days, its
    frames not independent (lag-1 autocorrelation of the first differences -0.07 to -0.18 and lag 2 -0.145
    to -0.185, against -0.35 to -0.47 and within 0.03 of 0 in M1 to M4), which marks it as the likely
    20 Hz mouse, brought to 11 Hz by a processing the files do not describe. Its slow timescale and its
    92.5 s step spacing give no sign of a stretched time axis.
