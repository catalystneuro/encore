- claim: mc-deeper
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:mc-deeper
  notes: In the 17 files that give each unit's shank (4 mice; 153 GC, 243 MC), the DS2 amplitude at
    the unit's site has a median of +271 uV for MC and -38 uV for GC (Mann-Whitney P = 5.7e-09);
    73% of MC and 40% of GC sit where DS2 is positive. In one mouse (YutaMouse33) the MC median is
    below the GC median.
  deviations:
  - Depth is read from the DS2 amplitude at the site, as the files give no site coordinates; the
    paper measures distance from the DS2 reversal.
  - 17 of 101 files only; the site is the shank channel with the largest mean waveform, taking
    waveform channel i as the shank's i-th electrode.
  - DS2 amplitude from about 220 s of LFP per file (the two LFP chunks with the most DS2 peaks).
- claim: gc-mc-classification
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:gc-mc-classification
  measured: 0.944
  notes: On 391 GC and MC of the 17 files, k-means on the four features agrees with the labels for
    94.4% of units (91% to 97% by mouse). Without the NREM to wake ratio or without the first
    waveform component the agreement falls to 77.2%; without the DS2 amplitude it is 92.6%.
  deviations:
  - Run on 17 of 101 files (391 of 1177 GC and MC); the paper ran it on all excitatory units.
  - The four features are standardised and clustered directly; the paper took a second PCA before
    k-means, which does not change k-means on all components.
  - The second-derivative window starts at the trough; the Methods say 0 to 0.8 ms without naming
    the origin.
- claim: gc-mc-distance
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Needs the positions of the recording sites in um. The electrodes tables give x, y and z as
    NaN in every file, the order of sites along a shank is not stated, and 83 of 101 files do not
    say which shank a unit was on. The paper's own monosynaptic pairs were not converted either.
- claim: gc-backpropagation
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Needs each unit's waveform along the shank with the sites' vertical positions; the files
    give no site coordinates (x, y, z are NaN) and the stored waveforms span 1.6 ms at the channels
    of the shank without their positions. In 83 files the shank itself is not given.
findings:
- kind: format_error
  statement: In 24 files the end index of the first unit in the units table is short by a multiple
    of 65,536 spikes (k = 1 to 7). The missing spikes open the second unit's spike train, which then
    restarts at the beginning of the recording, so the second unit's times are not sorted. The
    first moved spike follows the first unit's last stored spike by 2 ms to 0.5 s. This looks like an
    integer overflow at conversion; the waveforms follow the same boundaries.
- kind: metadata_error
  statement: The genotypes in the files (6 SST-Cre, 5 Drd2-Cre::Ai35, 4 POMC-Cre::Arch, 1
    POMC-Cre::Ai35) do not match the paper's 16 mice (7 SST-Cre, 5 DRD2-Cre::Ai35, 3 POMC-Cre::Ai35
    and 1 wild type).
- kind: metadata_insufficient
  statement: 83 of 101 files do not say which shank each unit was recorded on (`shank_id` is a
    cluster number, and there is no `electrode_group`), and no file gives site coordinates (x, y, z
    are NaN). The paper's depth measures can be computed for 17 files only, and distances between
    cells not at all.
- kind: metadata_insufficient
  statement: The T-maze position series (`twhl_linearized`, `twhl_norm`) are not described. The
    values show column 0 of `twhl_linearized` runs along the central arm (0 to 2) and column 1 is an
    angle along the circular side arms, negative for the left arm, which fits the maze in the
    Methods but is not stated.
- kind: metadata_insufficient
  statement: The states table holds `awake`, `quiet`, `nrem`, `rem` and `transit` without a
    description; the paper names wake, NREM and REM, and whether `quiet` counts as wake is not
    stated.
- kind: metadata_insufficient
  statement: The interneuron labels (narrow-waveform, wide-waveform) do not say whether the unit is in
    the dentate gyrus or CA3, which the paper separates; only the excitatory label was split by
    region (granule cell or CA3 pyramidal cell).
- kind: data_missing
  statement: The monosynaptic connections the authors detected and curated (`MonoSynConvClick.mat`)
    were not converted (the conversion code comments them out), so the pair-based results (Figures
    3, 4 and 7) cannot be checked on the authors' pairs.
- kind: other
  statement: The dandiset holds 568 mossy cells and 609 granule cells against the paper's 500 and 586,
    and 237 units labelled `missing` (units of the spike sorting with no row in the authors' unit
    summary).
- kind: format_error
  statement: The light-pulse series PulseStim_5V_20ms_LD12 of YutaMouse57-161006 holds 89,086 times of
    which 24,286 are duplicates, and its times decrease once.
- kind: other
  statement: The units table has two layouts. 18 files (mice 33, 41, 42 and 54) carry an
    `electrode_group` column naming each unit's shank, one of them without waveforms
    (YutaMouse33-150218, which the conversion script lists as excluded); the other 83 files do not.
- kind: metadata_insufficient
  statement: Seven dates hold two files of one mouse (the second named with `b`). They share no
    spike trains, so they are different recordings, but the metadata do not say whether they come
    from a second probe or a second session.
- kind: paper_inconsistency
  statement: The Methods give a burst index threshold of 1.2 for excitatory cells, and the Figure 1A
    legend gives 1.8.
