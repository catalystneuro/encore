- claim: monosyn-gc-to-mc
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:monosyn-gc-to-mc
  measured: 0.1067
  notes: Among 4713 GC-MC pairs the automatic test finds 65 GC to MC pairs and 8 MC to GC pairs. The fraction
    is 0.107 (pairs over GC), 0.0805 (GC with a target over GC) or 0.0138 (pairs over tested pairs), none
    within 0.0495 to 0.0605. GC to MC pairs outnumber MC to GC pairs 65 to 8. Stricter thresholds lower
    both counts (56 and 6 at the 99.99999th percentile). For 22 GC to MC pairs the largest bin is the
    first of the window (1.5 to 2 ms); without them 43 pairs remain (0.0706 of GC). Of the 8 MC to GC
    pairs, 6 are in YutaMouse33, 4 involve one GC (unit 3 of YutaMouse33-150224) that is also synchronous
    with each of those MC, and 5 are also detected as GC to MC pairs, which fits common input. In the
    17 files that give the shank, 17 of 39 GC to MC pairs are on one shank.
  deviations:
  - The paper inspected and refined each detection by hand; the automatic test alone is used here.
  - The fraction 5.5% can be read three ways; all are shown.
- claim: burst-facilitation
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:burst-facilitation
  notes: For the 65 detected pairs, the median transmission probability is 0.0066 for first and 0.0334
    for second burst spikes, higher in 58 pairs (Wilcoxon P = 1.2e-09); it holds with bursts at 4 ms (P
    = 4.4e-08) and 10 ms (P = 5.5e-10). The detected pairs are partly reproduced (see monosyn-gc-to-mc)
    and number 65 against the paper's 32. It also holds with only burst intervals of 3.5 to 6 ms, where
    the two response windows do not overlap (58 of 65, P = 7.6e-10), with a baseline hollowed by 60% (P
    = 1.2e-09), and without the 22 first-bin pairs (41 of 43, P = 3.8e-11). First spikes transmit less
    than single spikes (0.0066 against 0.0147), which the outputs do not explain.
  deviations:
  - Bursts are spikes at most 6 ms apart, a choice; the paper does not define them.
  - Transmission is the excess over the plain Gaussian baseline of the Methods.
- claim: state-transmission
  outcome: not_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:state-transmission
  notes: For 65 detected pairs, median transmission 0.0125 from GC spikes in awake periods and 0.0108
