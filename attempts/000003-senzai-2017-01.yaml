outcomes:
- claim: unit-counts
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:unit-counts
  measured:
  - 609
  - 568
  notes: The files hold 609 GC (paper 586, within tolerance) and 568 MC (paper 500, outside the tolerance
    of 450 to 550), from all 16 mice, counting each of the 101 files once.
  deviations:
  - Counts come from the dandiset's labels; the paper's classification was not re-run on all files.
- claim: first-stage-labels
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:first-stage-labels
  notes: Under both burst thresholds (1.2 in the Methods, 1.8 in the Figure 1A legend), 98.2% of GC and
    MC are wide-waveform and bursty and 91.7% or 93.3% of wide-waveform interneurons are wide and not
    bursty, but 82.5% of narrow-waveform interneurons have a latency below 0.425 ms (40% to 100% by mouse),
    short of the 90% criterion. The labels pool dentate and CA3 interneurons; 92.7% are below 0.525 ms,
    the paper's CA3 threshold, and in the 17 files that give the shank 94.4% of the 71 narrow-waveform
    interneurons on shanks with GC or MC and no CA3 unit are below 0.425 ms (variants). The stored waveforms
    have their trough at 0.80 ms, so latencies above about 0.75 ms cannot be measured. On the wide-band
    signal of the 17 files, 64.7% (unfiltered) or 88.5% (300 Hz high-pass) of narrow-waveform interneurons
    are below 0.425 ms.
  deviations:
  - Latency measured on the mean of the first 200 stored waveforms (1.6 ms long, filtering not stated
    in the files); the paper used unfiltered waveforms.
  - The Methods and the Figure 1A legend give different burst thresholds (1.2 and 1.8); both were tested.
- claim: interneuron-rates
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:interneuron-rates
  measured:
  - 5.96
  - 2.57
  notes: Narrow-waveform interneurons fire faster than wide-waveform ones (Kruskal-Wallis P = 5.3e-17
    over the recording span, 1.4e-15 in awake periods), but the medians are outside tolerance under both
    readings (5.96 and 2.57 Hz over the recording; 8.75 and 3.08 Hz awake). In the 17 files that give
    the shank, interneurons on shanks with GC or MC and no CA3 unit have medians of 8.56 and 2.29 Hz over
    the recording, both within tolerance (P = 3.7e-08); this variant does not decide the outcome.
  deviations:
  - The interneuron labels include CA3 interneurons, which the paper counts apart, and the files do not
    say which region an interneuron is in.
  - The paper does not define the rate; two readings were tested.
- claim: gc-narrower-waveform
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:gc-narrower-waveform
  notes: GC median trough-to-peak latency 0.710 ms against MC 0.740 ms (Mann-Whitney P = 2.3e-14). The
    stored waveforms have their trough at 0.80 ms of 1.6 ms, and 43% of GC and 67% of MC have their peak
    at the end, so the result partly reflects how often each type is cut off; among units with the peak
    inside the window GC are not narrower (0.660 against 0.645 ms, P = 0.057). On the wide-band signal
    of the 17 files (window to 2.4 ms), the unfiltered waveform the Methods use gives GC 0.755 against
    MC 0.840 ms (P = 0.017); after a 300 Hz high-pass they do not differ (0.710 against 0.720 ms, P =
    0.4).
  deviations:
  - Measured as trough-to-peak latency on the stored waveforms, where the paper describes the waveform
    shape through a PCA of its second derivative.
- claim: optotag-drd2
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:optotag-drd2
  measured: 0.642
  notes: In 26 DRD2-Cre::Ai35 sessions with 20 ms pulses (4 mice), 68 of 106 MC (0.642) are suppressed
    by at least 20% with the baseline before the pulse and 71 (0.670) with the baseline later in the cycle,
    against 6 (0.030) and 13 (0.066) of 198 GC. Wide-waveform interneurons 20 of 88, narrow-waveform 14
    of 132. The MC fraction is far above the paper's 29 of 107 and GC are not zero; MC exceed four times
    the GC fraction under both readings. At a 50% threshold the MC fraction is 0.066. Adding a one-sided
    Poisson test (P < 0.05) to the 20% rule keeps all 68 MC and 5 GC. The 37 units of the Figure 1H legend
    equal the 29 MC and 8 wide-waveform interneurons of the text.
  deviations:
  - The Methods do not define the baseline of the light-pulse histogram; two readings were tested.
  - The fifth DRD2 mouse (YutaMouse45) has no 20 ms pulses and is not included.
- claim: mc-more-active
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:mc-more-active
  notes: MC median 0.736 Hz against GC 0.077 Hz in awake periods (Kruskal-Wallis P = 1.8e-114), 0.727
    against 0.083 Hz with quiet wake, and 0.913 against 0.391 Hz in NREM (P = 2e-29). With home-cage awake
    time as wake (a variant), 0.692 against 0.077 Hz (P = 8.1e-102).
  deviations:
  - Wake is read as the `awake` periods, or `awake` with `quiet`; the states table does not describe its
    labels.
- claim: gc-nrem-highest
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:gc-nrem-highest
  notes: GC fire most in NREM (median 0.391 Hz against 0.077 Hz awake and 0.198 Hz REM; adjusted P 1.3e-86
    and 8.7e-31), but REM rates exceed wake rates (adjusted P = 1.4e-25 with awake periods, 6.3e-23 with
    quiet wake), so wake and REM are not similar by the paper's test. With home-cage awake time as wake
    (a variant), wake and REM still differ (adjusted P = 3.3e-24).
  deviations:
  - The post hoc test is taken as Bonferroni-corrected Mann-Whitney tests; the paper names Kruskal-Wallis
    only.
- claim: ca3-wake-highest
  outcome: not_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:ca3-wake-highest
  notes: CA3 pyramidal cells fire least in REM (0.287 Hz; adjusted P = 1.1e-15 against NREM and 5.4e-09
    against wake), but the NREM median (0.459 Hz) is above the wake median (0.441 Hz awake, 0.433 Hz with
    quiet wake) and the two do not differ (adjusted P = 0.77 and 0.59). The REM part of the claim holds.
    With home-cage awake time as wake (a variant), the wake median is 0.412 Hz and NREM against wake gives
    adjusted P = 0.14; CA3 units fire at similar rates awake in the home cage and during behaviour (0.424
    and 0.415 Hz).
  deviations:
  - The paper's CA3 units come from a separate classification (Figure S2); here the dandiset's `pyramidal
    cell` label is used.
- claim: nrem-wake-ratio
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:nrem-wake-ratio
  notes: Median NREM to wake ratio 4.63 for GC and 1.11 for MC (Mann-Whitney P = 3.9e-141; 4.28 and 1.11
    with quiet wake), and the GC ratio is above the MC ratio in every mouse with both. The part saying
    MC fire at equivalent rates does not fully hold, as MC NREM rates are slightly above wake rates (Wilcoxon
    P = 1.4e-06). With home-cage awake time, 4.56 and 1.10.
- claim: theta-modulation
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:theta-modulation
  notes: Modulated units 483 GC and 532 MC. Theta MRL GC 0.422 against MC 0.339 (Kruskal-Wallis P = 1.5e-20);
    GC fire later (circular means 30.8 and 12.0 degrees from the peak; P = 1e-17 with phases on (-pi,
    pi], 0.82 on [0, 2 pi)). After subtracting the uniform-phase expectation for the spike count (GC have
    fewer spikes), GC are still higher, at P = 0.00056. The bias-corrected MRL comparison (P = 0.00056)
    does not reach the paper's P < 0.0001. In the 17 files where it can be checked the theta-reference
    channel has a positive DS2 (+459 to +786 uV), so it lies below the DS2 reversal.
  deviations:
  - Phases from the theta-reference channel the conversion flagged, during up to an hour of awake periods
    per file; the paper's periods and reference channel are not stated.
  - Phase comparisons depend on where the cycle is cut; both cuts are shown and the claim holds on one.
- claim: gamma-modulation
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:gamma-modulation
  notes: Modulated units 345 GC and 475 MC. Gamma MRL GC 0.319 against MC 0.212 (P = 4.8e-43; 0.219 against
    0.166, P = 4.1e-18, after subtracting the uniform-phase expectation); GC fire earlier (circular means
    -20.2 and 1.7 degrees; P = 1.2e-23 on (-pi, pi], 0.18 on [0, 2 pi)).
  deviations:
  - As theta-modulation.
