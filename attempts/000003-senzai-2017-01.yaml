- claim: tmaze-central-active
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:tmaze-central-active
  notes: The central-arm median fraction of active units is above the side-arm median for GC (0.020
    against 0.018, P = 0.043), MC (0.314 against 0.272, P = 2.2e-06) and CA3 (0.214 against 0.189, P =
    0.048); only MC reach P < 0.00001.
  deviations:
  - T-maze runs are taken from the start of the central arm to 10 cm before the reward port in
    trials without light; the paper uses the time from gate opening to arrival at the reward.
  - The meaning of the linearised T-maze positions is inferred from the values and the maze
    dimensions.
- claim: tmaze-multiple-fields
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:tmaze-multiple-fields
  measured:
  - 0.043
  - 0.637
  - 0.431
  notes: Of all units, 4.3% of GC (253), 63.7% of MC (303) and 43.1% of CA3 (341) have two or more
    fields; of units with a field, 24.4%, 78.1% and 66.8%. No reading puts all three in tolerance (MC
    misses by 0.001 under reading a). GC have the fewest fields (KS P = 3.2e-53 against MC). The
    units come from 7 mice; the paper reports 213, 225 and 249 units from 9 mice.
  deviations:
