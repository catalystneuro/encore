- claim: inheritance-openfield
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:inheritance-openfield
  notes: 18 comparisons from 6 pairs in 4 sessions; median r = -0.038, Wilcoxon P = 0.67; 5 of 18
    above 0.5 (paper 2 of 19).
