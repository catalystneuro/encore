- claim: mc-deeper
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:mc-deeper
  notes: In the 17 files with the wide-band signal and shanks (4 mice; 139 GC, 226 MC with at least 20
    spikes in the wide-band window), the DS2 amplitude at the unit's site, read from the wide-band signal,
    has a median of +580 uV for MC and +232 uV for GC (Mann-Whitney P = 2e-40); 100% of MC (to two decimals)
    and 80% of GC sit where DS2 is positive, and MC are deeper in each of the 4 mice. With the site the
    electrodes table gives (a variant), +271 against -38 uV (P = 5.7e-09), with YutaMouse33 reversed;
    the two sites share the LFP column for 9% of units and the DS2 sign for 63%.
  deviations:
  - Depth is read from the DS2 amplitude at the site, as the files give no site coordinates; the paper
    measures distance from the DS2 reversal.
  - 17 of 101 files only. The site is the wide-band column where the unit's spike is largest (300 Hz high-pass,
    about 150 s of signal per file), as the electrodes table's channel map disagrees with the wide-band
    signal; the criterion's shank channel taken through the table is shown as a variant.
  - DS2 amplitude from about 220 s of LFP per file (the two LFP chunks with the most DS2 peaks).
- claim: gc-mc-classification
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:gc-mc-classification
  measured: 0.953
  notes: On 364 GC and MC of the 17 files (32 dropped for fewer than 20 spikes in the wide-band window,
    no DS2 site or a zero awake rate), k-means on the DS2 amplitude at the wide-band site, the Methods'
    NREM to wake ratio and two components of the second derivative of the unfiltered wide-band waveform
    agrees with the labels for 95.3% of units (93% to 97% by mouse). Without the DS2 amplitude 89.0%,
    without the first waveform component 88.5%, without the ratio 94.2%. With the log ratio 95.6%, with
    home-cage awake time 94.8%, with the stored waveforms and the table's site 92.8%.
  deviations:
  - Run on 17 of 101 files (364 of 1177 GC and MC); the paper ran it on all excitatory units.
  - The site and the waveform are read from the wide-band signal (about 150 s per file), as the electrodes
    table's channel map disagrees with it; the stored waveforms with the table's site are a variant.
  - Wake is the `awake` periods, as fixed in the criterion; the Methods name awake time in the home cage,
    shown as a variant.
  - The four features are standardised and clustered directly; the paper took a second PCA before k-means,
    which does not change k-means on all components.
  - The second-derivative window starts at the trough; the Methods say 0 to 0.8 ms without naming the
    origin.
- claim: gc-mc-distance
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Needs the positions of the recording sites in um. The electrodes tables give x, y and z as NaN
    in every file, the order of sites along a shank is not stated, and 83 of 101 files do not say which
    shank a unit was on. The paper's own monosynaptic pairs were not converted either. The Methods give
    8 sites per shank on the 8-shank probes and 10 on the 6-shank probes, staggered with 20 um vertical
    separation, but the table's site numbers do not follow depth (the DS2 profile along them crosses zero
    more than once on 43 of 64 shanks with a crossing), and a unit's largest wide-band column lies on the
    shank the table gives for only 45% of units. In the 17 files that give the shank, the order of each
    shank's stored waveform channels can be recovered from the units' spikes in the wide-band signal,
    and along it the DS2 profile crosses zero once on 43 of the 51 shanks that cross, so it is consistent
    with depth. This attempt wrote no criterion for the claim and ran no test on that order; a new attempt
    could test it on these 17 files (39 detected GC to MC pairs).
- claim: gc-backpropagation
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Needs each unit's waveform along the shank with the sites' vertical positions; the files give
    no site coordinates (x, y, z are NaN) and the stored waveforms span 1.6 ms at the channels of the
    shank without their positions. In 83 files the shank itself is not given. The wide-band signal gives
    each unit's spike on every column, and in those 17 files the order of each shank's stored channels,
    recovered from the units' spikes, is consistent with depth (see gc-mc-distance). This attempt wrote
    no criterion for the claim and ran no test of a delay along that order; a new attempt could.
findings:
- kind: format_error
  statement: In 24 files the end index of the first unit in the units table is short by a multiple of
    65,536 spikes (k = 1 to 7). The missing spikes open the second unit's spike train, which then restarts
    at the beginning of the recording, so the second unit's times are not sorted. The first moved spike
    follows the first unit's last stored spike by 2 ms to 0.5 s. This looks like an integer overflow at
    conversion; the waveforms follow the same boundaries.
- kind: metadata_error
  statement: The genotypes in the files (6 SST-Cre, 5 Drd2-Cre::Ai35, 4 POMC-Cre::Arch, 1 POMC-Cre::Ai35)
    do not match the paper's 16 mice (7 SST-Cre, 5 DRD2-Cre::Ai35, 3 POMC-Cre::Ai35 and 1 wild type).
- kind: metadata_insufficient
  statement: 83 of 101 files do not say which shank each unit was recorded on (`shank_id` is a cluster
    number, and there is no `electrode_group`), and no file gives site coordinates (x, y, z are NaN).
    The paper's depth measures can be computed for 17 files only, and distances between cells not at all.
- kind: metadata_insufficient
  statement: The T-maze position series (`twhl_linearized`, `twhl_norm`) are not described. The values
    show column 0 of `twhl_linearized` runs along the central arm (0 to 2) and column 1 is an angle along
    the circular side arms, negative for the left arm, which fits the maze in the Methods but is not stated.
- kind: metadata_insufficient
  statement: The states table holds `awake`, `quiet`, `nrem`, `rem` and `transit` without a description;
    the paper names wake, NREM and REM, and whether `quiet` counts as wake is not stated.
- kind: metadata_insufficient
  statement: The interneuron labels (narrow-waveform, wide-waveform) do not say whether the unit is in
    the dentate gyrus or CA3, which the paper separates; only the excitatory label was split by region
    (granule cell or CA3 pyramidal cell).
- kind: data_missing
  statement: The monosynaptic connections the authors detected and curated (`MonoSynConvClick.mat`) were
    not converted (the conversion code comments them out), so the pair-based results (Figures 3, 4 and
    7) cannot be checked on the authors' pairs.
- kind: other
  statement: The dandiset holds 568 mossy cells and 609 granule cells against the paper's 500 and 586,
    and 237 units labelled `missing` (units of the spike sorting with no row in the authors' unit summary).
- kind: format_error
  statement: The light-pulse series PulseStim_5V_20ms_LD12 of YutaMouse57-161006 holds 89,086 times of
    which 24,286 are duplicates, and its times decrease once.
- kind: other
  statement: The units table has two layouts. 18 files (mice 33, 41, 42 and 54) carry an `electrode_group`
    column naming each unit's shank, one of them without waveforms (YutaMouse33-150218, which the conversion
    script lists as excluded); the other 83 files do not.
- kind: metadata_insufficient
  statement: Seven dates hold two files of one mouse (the second named with `b`). They share no spike
    trains, so they are different recordings, but the metadata do not say whether they come from a second
    probe or a second session.
- kind: paper_inconsistency
  statement: The Methods give a burst index threshold of 1.2 for excitatory cells, and the Figure 1A legend
    gives 1.8.
- kind: metadata_error
  statement: In the 17 files with the wide-band signal and each unit's shank, the electrodes table's assignment
    of columns to shanks and sites disagrees with the data. The column where a unit's spike is largest
    in the wide-band signal lies on the shank the units table gives for 45% of units (11% to 79% by file)
    and is the table's own site for 9%, and the DS2 amplitude along the table's site numbers crosses zero
    more than once on 43 of 64 shanks where it crosses at all. The wide-band and LFP columns match each
    other. The units' shanks (`electrode_group`) and stored waveform channels fit the wide-band signal
    under one fixed map of columns, the same in all 4 mice (a map from three mice gives the column of
    a unit's largest spike for 78% to 89% of units in the fourth, against 5% to 13% for the table), so
    the error is in the table, whose blocks of 8 rows do not match the probe's columns.
- kind: metadata_insufficient
  statement: The stored spike waveforms are about 5 times larger than the same spikes in the wide-band
    signal (median peak-to-peak 421 against 81 uV, 300 Hz high-pass), and their filtering and scaling
    are not described. They match the wide-band spike best after a 300 Hz high-pass (median correlation
    0.987, against 0.981 unfiltered and 0.867 at 800 Hz), with a gain of 5.08, close to 5.13, the inverse
    of the wide-band conversion of 0.195 uV per count, which is consistent with waveforms stored in ADC
    counts and read as microvolts. Each holds 1.6 ms with the trough at 0.8 ms, which cuts off the peak
    of 43% of GC, 67% of MC and 78% of CA3 waveforms.
