outcomes:
- claim: unit-counts
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:unit-counts
  measured:
  - 609
  - 568
  notes: The files hold 609 GC (paper 586, within tolerance) and 568 MC (paper 500, outside the
    tolerance of 450 to 550), from all 16 mice, counted once per recording day.
  deviations:
  - Counts come from the dandiset's labels; the paper's classification was not re-run on all files.
- claim: first-stage-labels
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:first-stage-labels
  notes: Under both burst thresholds (1.2 in the Methods, 1.8 in the Figure 1A legend), 98.2% of GC
    and MC are wide-waveform and bursty and 91.7% or 93.3% of wide-waveform interneurons are wide
    and not bursty, but 82.5% of narrow-waveform interneurons have a latency below 0.425 ms (40% to
    100% by mouse), short of the 90% criterion.
  deviations:
  - Latency measured on the mean of the first 200 stored waveforms (1.6 ms long, filtering not
    stated in the files); the paper used unfiltered waveforms.
  - The Methods and the Figure 1A legend give different burst thresholds (1.2 and 1.8); both were
    tested.
- claim: interneuron-rates
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:interneuron-rates
  measured:
  - 5.96
  - 2.57
  notes: Narrow-waveform interneurons fire faster than wide-waveform ones (Kruskal-Wallis P = 5.3e-17
    over the recording span, 1.4e-15 in awake periods), but the medians are outside tolerance
    under both readings (5.96 and 2.57 Hz over the recording; 8.75 and 3.08 Hz awake).
  deviations:
  - The interneuron labels include CA3 interneurons, which the paper counts apart, and the files do
    not say which region an interneuron is in.
  - The paper does not define the rate; two readings were tested.
- claim: gc-narrower-waveform
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:gc-narrower-waveform
  notes: GC median trough-to-peak latency 0.710 ms against MC 0.740 ms (Mann-Whitney P = 2.3e-14).
    43% of GC and 67% of MC have their peak at the end of the stored 1.6 ms, so their latency is a
    lower bound; among units with the peak inside the window GC are not narrower (0.660 against
    0.645 ms, P = 0.057).
  deviations:
  - Measured as trough-to-peak latency on the stored waveforms, where the paper describes the
    waveform shape through a PCA of its second derivative.
- claim: optotag-drd2
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:optotag-drd2
  measured: 0.642
  notes: In 26 DRD2-Cre::Ai35 sessions with 20 ms pulses (4 mice), 68 of 106 MC (0.642) are
    suppressed by at least 20% with the baseline before the pulse and 71 (0.670) with the baseline
    later in the cycle, against 6 (0.030) and 13 (0.066) of 198 GC. Wide-waveform interneurons 20 of
    88, narrow-waveform 14 of 132. The MC fraction is far above the paper's 29 of 107 and GC are
    not zero; MC exceed four times the GC fraction under both readings. At a 50% threshold the MC
    fraction is 0.066.
  deviations:
  - The Methods do not define the baseline of the light-pulse histogram; two readings were tested.
  - The fifth DRD2 mouse (YutaMouse45) has no 20 ms pulses and is not included.
- claim: mc-more-active
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:mc-more-active
  notes: MC median 0.736 Hz against GC 0.077 Hz in awake periods (Kruskal-Wallis P = 1.8e-114), 0.727
    against 0.083 Hz with quiet wake, and 0.913 against 0.391 Hz in NREM (P = 2e-29).
  deviations:
  - Wake is read as the `awake` periods, or `awake` with `quiet`; the states table does not
    describe its labels.
- claim: gc-nrem-highest
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:gc-nrem-highest
  notes: GC fire most in NREM (median 0.391 Hz against 0.077 Hz awake and 0.198 Hz REM; adjusted P
    1.3e-86 and 8.7e-31), but REM rates exceed wake rates (adjusted P = 1.4e-25 with awake periods,
    6.3e-23 with quiet wake), so wake and REM are not similar by the paper's test.
  deviations:
  - The post hoc test is taken as Bonferroni-corrected Mann-Whitney tests; the paper names
    Kruskal-Wallis only.
- claim: ca3-wake-highest
  outcome: not_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:ca3-wake-highest
  notes: CA3 pyramidal cells fire least in REM (0.287 Hz; adjusted P = 1.1e-15 against NREM and
    5.4e-09 against wake), but the NREM median (0.459 Hz) is above the wake median (0.441 Hz awake,
    0.433 Hz with quiet wake) and the two do not differ (adjusted P = 0.77 and 0.59). The REM part
    of the claim holds.
  deviations:
  - The paper's CA3 units come from a separate classification (Figure S2); here the dandiset's
    `pyramidal cell` label is used.
- claim: nrem-wake-ratio
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:nrem-wake-ratio
  notes: Median NREM to wake ratio 4.63 for GC and 1.11 for MC (Mann-Whitney P = 3.9e-141; 4.28 and
    1.11 with quiet wake), and the GC ratio is above the MC ratio in every mouse with both. The
    part saying MC fire at equivalent rates does not fully hold, as MC NREM rates are slightly
    above wake rates (Wilcoxon P = 1.4e-06).
- claim: theta-modulation
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:theta-modulation
  notes: Modulated units 483 GC and 532 MC. Theta MRL GC 0.422 against MC 0.339 (Kruskal-Wallis P =
    1.5e-20); GC fire later (circular means 30.8 and 12.0 degrees from the peak; P = 1e-17 with
    phases on (-pi, pi], 0.82 on [0, 2 pi)). After subtracting the uniform-phase expectation for
    the spike count (GC have fewer spikes), GC are still higher, at P = 0.00056.
  deviations:
  - Phases from the theta-reference channel the conversion flagged, during up to an hour of awake
    periods per file; the paper's periods and reference channel are not stated.
  - Phase comparisons depend on where the cycle is cut; both cuts are shown and the claim holds on
    one.
- claim: gamma-modulation
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:gamma-modulation
  notes: Modulated units 345 GC and 475 MC. Gamma MRL GC 0.319 against MC 0.212 (P = 4.8e-43; 0.219
    against 0.166, P = 4.1e-18, after subtracting the uniform-phase expectation); GC fire earlier
    (circular means -20.2 and 1.7 degrees; P = 1.2e-23 on (-pi, pi], 0.18 on [0, 2 pi)).
  deviations:
  - As theta-modulation.
- claim: gamma-rate-correlation
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:gamma-rate-correlation
  measured:
  - -0.177
  - -0.161
  notes: Over all units with a gamma MRL, GC r = -0.177 (P = 3.6e-05, within tolerance) and MC r =
    -0.161 (P = 0.00013, just outside the tolerance and above P = 0.0001). Over modulated units,
    GC -0.397 and MC -0.253, both P below 0.0001 and outside tolerance.
  deviations:
  - The paper does not say which units or which rate the correlation uses; two unit sets were
    tested with the rate over the recording span.
- claim: ds2-recruitment
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:ds2-recruitment
  notes: Median DS2 peak ratio GC 6.88 against MC 4.82 (Kruskal-Wallis P = 1.1e-10); median peak time
    -3.0 against +1.0 ms (P = 2.2e-09). 10 GC and 14 MC dropped for a zero baseline.
  deviations:
  - The DS2 events are those stored in the files; the peak-ratio baseline (50 to 100 ms on both
    sides) is a choice, as the paper does not give it.
- claim: monosyn-gc-to-mc
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:monosyn-gc-to-mc
  measured: 0.1067
  notes: Among 4713 GC-MC pairs the automatic test finds 65 GC to MC pairs and 8 MC to GC pairs. The
    fraction is 0.107 (pairs over GC), 0.0805 (GC with a target over GC) or 0.0138 (pairs over
    tested pairs), none within 0.0495 to 0.0605. GC to MC pairs outnumber MC to GC pairs 65 to 8.
    Stricter thresholds lower both counts (56 and 6 at the 99.99999th percentile).
  deviations:
  - The paper inspected and refined each detection by hand; the automatic test alone is used here.
  - The fraction 5.5% can be read three ways; all are shown.
- claim: burst-facilitation
  outcome: reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:burst-facilitation
  notes: For the 65 detected pairs, the median transmission probability is 0.0066 for first and
    0.0334 for second burst spikes, higher in 58 pairs (Wilcoxon P = 1.2e-09); it holds with bursts
    at 4 ms (P = 4.4e-08) and 10 ms (P = 5.5e-10). The detected pairs are partly reproduced (see
    monosyn-gc-to-mc) and number 65 against the paper's 32.
  deviations:
  - Bursts are spikes at most 6 ms apart, a choice; the paper does not define them.
  - Transmission is the excess over the plain Gaussian baseline of the Methods.
- claim: state-transmission
  outcome: not_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:state-transmission
  notes: For 65 detected pairs, median transmission 0.0125 from GC spikes in awake periods and 0.0108
    in NREM, lower in NREM for 34 pairs; Wilcoxon P = 0.39. The pairs are the automatic detections
    (see monosyn-gc-to-mc), not the paper's 31.
  deviations:
  - Uses the automatic pair detections in place of the paper's curated pairs.
- claim: zero-lag-synchrony
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:zero-lag-synchrony
  measured:
  - 0.0766
  - 0.012
  - 0.0013
  notes: GC pairs 4 of 3155 (0.0013, within the claim). MC 0.0766 of pairs or 0.433 of cells; CA3
