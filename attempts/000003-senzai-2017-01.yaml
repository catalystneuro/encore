- claim: tmaze-central-active
  outcome: partially_reproduced
  notebook: reproduce_senzai_2017.ipynb
  output: claim:tmaze-central-active
  notes: The central-arm median fraction of active units is above the side-arm median for GC (0.020 against
    0.018, P = 0.043), MC (0.314 against 0.272, P = 2.2e-06) and CA3 (0.214 against 0.189, P = 0.048);
    only MC reach P < 0.00001. The bin-wise test treats smoothed, neighbouring bins as independent; compared
    unit by unit (a variant) the central arm is more active for MC (P = 2.8e-05) but not for GC (higher
    in 17, lower in 31 of 253 units, P = 0.83) or CA3 (P = 0.21).
  deviations:
  - T-maze runs are taken from the start of the central arm to 10 cm before the reward port in trials
    without light; the paper uses the time from gate opening to arrival at the reward.
  - The meaning of the linearised T-maze positions is inferred from the values and the maze dimensions.
- claim: tmaze-multiple-fields
