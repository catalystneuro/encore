findings:
- kind: data_missing
  statement: For Lee et al. (2014) the data set holds only the current-step sweeps of 17 PCs and 6
    PVBCs behind Figures S1E to S1H, S3F and Table S1. The paired recordings, optogenetics, imaging,
    anatomy and retrograde labelling behind the paper's main figures are not in it, and the paper
    names no other deposit; 26 of its 34 claims cannot be tested.
- kind: other
  statement: PV34 is deposited twice, as PVBC_PV34.atf and PV34_PVBC_mouse.atf, with identical
    bytes. The descriptor lists 36 cells; the zip holds 37 files.
- kind: metadata_insufficient
  statement: The ATF files record only the membrane voltage, with no injected current and no
    holding current. The step levels can be taken only from the descriptor's table, and the
    voltage responses are consistent with them in sweep order. Because the PCs were held at -70 mV
    with an unrecorded current, their resting potential (Figure S1G, Table S1) cannot be measured.
- kind: metadata_insufficient
  statement: No file or the descriptor gives the animal, slice, sex, hippocampal region (septal or
    temporal) or soma distance from the Pyr/Rad border of a cell, so the sublayer assignment rests
    on the file names alone and results cannot be grouped by animal.
- kind: other
  statement: In PVBC PV37 the sweep order breaks between the sweeps the descriptor gives as -250 and
    -200 pA (steady-state deflection -8.7 then -9.1 mV; -13.1 mV at -300 pA); its other sweeps
    rise with the step as in every other cell.
verifications:
- date: 2026-11-06
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the
    notebook)
  reviewed: Round 1. The executed notebook of the first run with the conclusion cells and the
    summary removed, the helper module hc10.py and the claims file, with the paper and the data
    descriptor under paper/.
  results:
  - claim: figs1e-if-curves
    agrees: true
    outcome: reproduced
    reason: The two-way ANOVA finds no group effect, p = 0.411 under reading (a) and 0.866 under
      (b). Rates at +550 pA are sPC 31.62 and dPC 30.56 Hz (a) and 33.63 and 31.24 Hz (b), all
      within tolerance. The ANOVA treats each cell-by-step value as independent, which inflates the
      degrees of freedom; that is the paper's test as written, and the mixed ANOVA variant (p =
      0.759 and 0.951) gives the same. Under rate reading (b) a sweep with one spike gets 0 Hz but
      two close spikes give a high rate (PV34 at +350 pA, 14.9 Hz under (b) against 2.0 Hz under
      (a)), so the reading is unreliable near rheobase.
    response: No change of outcome. The notebook now prints the PC sweeps with one or two spikes (2
      sweeps with one spike, none with two), and the conclusion and notes say reading (b) bears
      little on this test.
  - claim: figs1f-input-resistance
    agrees: true
    outcome: reproduced
    reason: Reading (a) gives sPC 118.7 and dPC 124.9 MOhm, reading (b) 118.9 and 123.7 MOhm, all
      within tolerance, and Mann-Whitney p = 1.000. The -100 to +100 pA window includes sweeps with
      spikes at +100 pA in D1_25abf, D4_11abf and S1_47abf, which raises their resistance; this
      follows the paper's protocol, and the spike-free variant still shows no group difference,
      though its dPC mean (101.8 MOhm) falls outside tolerance.
    response: No change; the spiking cells and the spike-free variant were already shown and stated
      in the conclusion and notes.
  - claim: figs1g-resting-potential
    agrees: true
    outcome: blocked
    reason: The criterion's blocking condition holds. No PC file has a current channel, and every 0
      pA baseline sits at the -70 mV holding level (-72.2 to -67.4 mV). Table S1's footnote says the
      holding current was given but not recorded. The notebook's header table listed it as blocked
      with no reason code.
    response: No change of outcome. The header table now gives the reason, data missing.
  - claim: figs1h-sag
    agrees: true
    outcome: reproduced
    reason: Reading (a), -400 pA, gives sPC 8.71 +- 0.67 and dPC 5.69 +- 0.48 mV, t test p = 0.0020,
      both within tolerance. Readings (b) and (c) keep the difference, but their means fall outside
      tolerance. The 1 ms smoothing variant does not change this.
    response: No change.
  - claim: tables1-rheobase
    agrees: true
    outcome: partially_reproduced
    reason: The median gives sPC 200 and dPC 150 pA, the rounded mean 200 pA for both, so the groups
      give the same step under (b) but it is not +150 pA, the criterion's definition of partial.
      D5_15abf and D6_19abf reach rheobase on a single 0 mV crossing at +150 pA, and the threshold
      check reports only total spike counts, not each cell's rheobase; if either moved to +200 pA
      the outcome would stay partial. SimTracker's CellData tool, which the data descriptor names,
      may hold the definition behind Table S1 and was not consulted.
    response: No change of outcome. The notebook now gives each cell's rheobase under spike
      thresholds of -20, 0 and +10 mV and under the CellData tool's definition, read from
      SimTracker's tools/CellData.m (least depolarized positive step with an upward crossing of -20
      mV anywhere in the sweep). No cell's rheobase changes. It also prints the peak of the spike at
      rheobase; the single spikes of D5_15abf and D6_19abf peak at 46.1 and 42.0 mV.
  - claim: figs3f-pvbc-firing
    agrees: true
    outcome: reproduced
    reason: Reading (a) on PV34 with rate reading (a) gives silence from 0 to +300 pA, then 2.0,
      17.0, 36.0 and 52.0 Hz at +350 to +500 pA, matching all four values exactly. Choosing the
      best-matching of six cells is permissive; PV34 matches exactly at four steps, so the match is
      not a chance hit, but its identity as the figure's cell is never stated. Rate reading (b) is
      unreliable near rheobase (PV34 at +350 pA, 14.9 Hz under (b) against 2.0 Hz under (a)).
    response: No change of outcome. The conclusion and notes now say the paper does not name the
      figure's cell and that taking the best of six is permissive.
