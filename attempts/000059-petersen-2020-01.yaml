inputs:
- what: The paper's MATLAB analysis code, read and not run. It supplies the lists of sessions of
    the behavioural analysis and of Figure 5 (BatchProcessing.m), the recording list that marks
    which sessions have a temperature channel and which are controls without cooling
    (MedialSeptum_Recordings.m), and the parameters of the theta measures, trial averages and
    onset-aligned series (calcInstantaneousTheta.m, BatchProcessing.m, calc_trial_averages.m).
    It brings in no measurements.
  source: https://github.com/petersenpeter/Code_Petersen_Buzsaki_Neuron_2020 at commit
    aec2f7e4ffac79abaa71bb3515c1da7a6d383990
outcomes:
- claim: session-structure
  outcome: reproduced
  notebook: reproduce_petersen_2020.ipynb
  output: claim:session-structure
  measured: 143.8
  notes: Over 45 BEH sessions the mean is 143.8 trials (80 to 204); medians of 39 pre-cooling, 47
    cooling and 44 post-cooling trials. 12 sessions have two cooling blocks, which the paper does
    not mention, and 'Cooling off' trials (median 14 per session) are counted in no state.
  deviations:
  - 45 of the paper's 53 sessions.
- claim: cooling-time-course
  outcome: partially_reproduced
  notebook: reproduce_petersen_2020.ipynb
  output: claim:cooling-time-course
  measured: 121.0
  notes: Over 37 sessions with a recorded temperature the minimum comes a median 121 s after the
    onset (IQR 89 to 138 s; 119 to 122 s for onset thresholds of 0.5 to 2 C), against 60 s. The
    duration holds under reading (b), 12.16 minutes until the temperature is within 1 C of
    baseline; under reading (a) the temperature is below 32 C for 8.77 minutes. The median
    minimum is 21.2 C.
  deviations:
  - The onset is taken from the temperature trace (1 C below the pre-cooling median), as the
    files have no time of dry-ice placement; the Methods do not define the onset.
- claim: fig2g-theta-freq-temperature
  outcome: reproduced
  notebook: reproduce_petersen_2020.ipynb
  output: claim:fig2g-theta-freq-temperature
  measured: 0.789
  notes: With the code's aligned series, R = 0.789 (P = 2.8e-43, 198 positions) over 37 TEMP
    sessions under reading (a), and R = 0.758 (P = 3e-38) with the MS10 temperature curves under
    reading (b); both are within tolerance. Over single trials pooled R = 0.672, slope 0.065 Hz per
    C. Per rat R is 0.685 to 0.954.
  deviations:
  - 37 sessions with a recorded temperature, where the paper used 53; the MS10 temperature in the
    dandiset is not a recording.
  - The theta electrode is the one flagged theta_reference in the files; the code's channel
    numbers could not be mapped to the files' electrodes.
- claim: fig2h-theta-power-temperature
  outcome: not_reproduced
  notebook: reproduce_petersen_2020.ipynb
  output: claim:fig2h-theta-power-temperature
  measured: -0.056
  notes: Theta power does not follow temperature, R = -0.056 (P = 0.44) over TEMP sessions and
    R = 0.123 (P = 0.085) with the MS10 curves; over single trials pooled R = 0.107. Power is the
    spectrogram magnitude of the band-passed LFP as in calcInstantaneousTheta.m, minus each
    session's mean, at frames above 30 cm/s, and the 10 cm/s variant gives R = 0.135. Per rat the
    power R ranges from -0.346 to 0.376.
  deviations:
  - The theta electrode is the one flagged theta_reference in the files, which may differ from the
    paper's; power depends on the electrode more than frequency does.
