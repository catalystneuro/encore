    explain them. The effect is small, and the outcome follows the paper's test as written; it
    does not show that cooling changes the waveforms.
  deviations:
  - Waveforms from 120 s windows of the wide-band data at 20 kHz, high-passed at 300 Hz, on the
    channel of largest amplitude; the paper's measure is in its supplement, which could not be
    read.
