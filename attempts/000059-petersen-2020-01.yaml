- claim: suppl1g-waveforms-unchanged
  outcome: not_reproduced
  notebook: reproduce_petersen_2020.ipynb
  output: claim:suppl1g-waveforms-unchanged
  notes: Over 646 units, trough-to-peak differs (P = 4.9e-10, median change 0 as most units do not
    move by a whole 0.05 ms sample) and amplitude rises by a median 0.8% (P = 0.00057). The windows
    start 7.1 to 31.8 minutes apart (5.1 to 29.8 minutes from the end of the pre window), so drift cannot be separated from cooling; for interneurons alone
    neither differs (P = 0.066 and 0.2). Fewer spikes are averaged in the cooling window (median
    200 against 247.5), but in the 208 units whose two means both use the 300-spike cap the changes
