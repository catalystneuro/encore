- claim: fig5d-ccg-period
  outcome: partially_reproduced
  notebook: reproduce_petersen_2020.ipynb
  output: claim:fig5d-ccg-period
  measured: 109.2
  notes: Over 9 sessions the period lengthens from 109.2 to 114.0 ms (8 of 9, P = 0.0195) and the
    phase period does not change (1.740 and 1.760 pi rad, P = 0.59); the control period is not
    85 +- 8.5 ms. The criterion's estimator takes the largest neighbouring peak 60 to 200 ms from
    the main peak, and in 47.7% of pre pairs that peak is more than 1.25 times as far as the
    nearest one, so it often picks the second neighbour and the 109.2 ms is biased upward. With
    the nearest neighbouring peak (a variant) the control period is 91.0 ms, within tolerance, and
    it lengthens to 95.5 ms (7 of 9, P = 0.031); pairs with |Ltr| below 10 cm give 91.0 ms. Under
    that variant the phase period, also from the nearest peak, does not change (1.285 pi rad in both,
    P = 0.367), so all three parts of the criterion hold; but that estimator is biased downward, as
    211 of 3499 pre pairs give 60 to 70 ms, at the floor of the search window and below any plausible
    theta period, so its 91.0 ms is not a clean test of 85 ms either. The outcome follows the
    criterion's estimator. Both control periods are shorter than the LFP theta period (115.7 ms).
  deviations:
  - The period is measured per pair and summarised per session; the paper reads it from the sum
    over pairs. The criterion was changed to this before the analysis across sessions, after a
    pilot session showed that the summed correlogram's spectrum follows its envelope; the summed
    correlogram is shown as a variant (99 to 200 ms).
  - 9 sessions in 4 rats, against 18 in 5.
  - The criterion's period estimator often takes the second neighbouring peak; the nearest-peak
    estimator is shown as a variant.
- claim: fig5cg-compression
  outcome: not_reproduced
  notebook: reproduce_petersen_2020.ipynb
  output: claim:fig5cg-compression
  measured: 0.273
  notes: Pooled pre compression 0.273 cm/ms against 0.54. Per session it is lower during cooling
    in 8 of 9 sessions without significance (0.298 against 0.191, P = 0.0547); phase compression
    does not change (P = 0.426). Lag and distance correlate weakly (R = 0.195), so the slope depends
    on the fit (inverse regression over pooled pre pairs 7.175 cm/ms). The 70 ms window can hold
    more than one candidate peak; in 10.5% of pre pairs the lag changes when the window is narrowed
    to half the theta period, which gives 0.156 cm/ms. The compression magnitude cannot be judged
    from this method. The direction of the change agrees with the paper under the criterion's fit;
    the inverse slope goes the other way (control 9.085, cooling 10.420 cm/ms, lower in 1 of 9).
  deviations:
  - Lags from each pair's correlogram peak and compression from a regression, where the paper fits
    a surface to the density of all pairs; pairs without a peak within 70 ms are dropped.
