findings:
- kind: metadata_error
  statement: The temperature series of the nine MS10 sessions and of the two control sessions of
    2018-07-19 (MS21 and MS22) is not a recording. The paper's code lists no temperature channel
    for these sessions. In the files ten of them run from 17.0 to 37.0 C (exactly in nine; MS10-170313
    reaches 16.98 C) and sit at exactly 37.0 C for 16% to 35% of samples, and MS10-170307 is a constant 37.0 C, while no recorded trace
    repeats its maximum. Nothing in the files says the series is modelled.
- kind: metadata_error
  statement: The two sessions of 2018-07-19, which the paper's code lists as controls without
    cooling (cooling_session 0, no onsets), have trials labelled Pre-Cooling, Cooling on, Cooling
    off and Post-Cooling and a temperature dip; their theta frequency during 'Cooling on' differs
    from pre by -0.20 and +0.44 Hz, against a median of -0.82 Hz in the cooled sessions.
- kind: data_missing
  statement: Six of the paper's 53 behavioural sessions are not in the dandiset (MS12-170712,
    MS12-170715, MS13-171204, MS13-171205, MS13-171206, MS21-180806); four of them were in version
    0.210812.1514 as files without behaviour.
- kind: data_missing
  statement: MS21-180627 has trials without the cooling state and MS21-180712 has no trials, so
    two more of the paper's sessions cannot be used for the cooling comparisons.
- kind: metadata_insufficient
  statement: The files hold no cell types, no place field definitions and no electrode locations
    (every location is 'unknown'), so the putative pyramidal cells and interneurons and the place
    fields of the paper have to be made again.
- kind: metadata_insufficient
  statement: The trial state 'Cooling off' (a median 14 trials per session between cooling and
    recovery) is not described in the files or the paper.
- kind: other
  statement: In seven sessions (the six MS10 sessions with units and MS12-170723) every unit has
    quality 'unsorted', so no curated unit can be selected; MS10 has no usable units.
- kind: other
  statement: In MS21-180621 and MS22-180621 the units carry no spatial information (0.23 and 0.12
    bits/spike, the same as with spikes shifted by 60 s), although they are locked to theta, so
    the clock of spikes and position could not be established there.
- kind: selection_undocumented
  statement: The dandiset holds three sessions that are not in the paper's behavioural analysis
    (the two 2018-07-19 controls and MS10-170307, whose temperature is constant) without saying
    so; they carry the same cooling labels as the analysed sessions.
- kind: other
  statement: The first published version (0.210812.1514) has no trials table in its files, so the
    cooling states and choice errors are only in the later versions.
- kind: other
  statement: The Methods give position tracking at 120 Hz; the MS10 sessions are sampled at 40 Hz
    (six), 30 Hz (one) and 120 Hz (two).
- kind: paper_inconsistency
  statement: The legend of Figure 5H gives P = 8.0e-5 by a sign rank test with N = 10 sessions; an
    exact signed-rank test over 10 sessions cannot give a P below 0.002, so the test must be over
    pairs or the N refers to something else.
- kind: paper_inconsistency
  statement: The Discussion gives a 12% decrease of LFP theta frequency during cooling, while the
    Results give within-field LFP theta of 8.4 Hz before and 7.7 Hz during cooling, a decrease of
    about 8%, which this attempt reproduces (9% over trials).
