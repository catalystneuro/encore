findings:
- kind: metadata_insufficient
  statement: The LFP channels the analyses used are not in the data set. The scripts in code.zip take
    them from batch files (SessionsReactivations1-Channels.batch) that are not included, and the xml files
    do not mark the pyramidal-layer or theta channels. This attempt chose them from the data.
- kind: metadata_insufficient
  statement: The place cells, theta cycles and candidate events the scripts load (the BatchPlaceCells_20170104
    database, the .tcy.evt and .tuw.evt files, LinearizeTrainTrack, ReconstructPosition2, FindReplayScore)
    are not in the data set or code.zip, so the selections cannot be compared with the paper's. The place-cell
    counts obtained here (207, 203 and 228 under the Methods' definition) differ from the paper's 94,
    150 and 135.
- kind: code_mismatch
  statement: DiscriminateUnits.m clusters units on waveform width and trough-to-peak duration only, while
    the Methods add the firing rate; and its rate exclusion of putative pyramidal cells above 5 Hz never
    applies, because it tests strcmp(rate,'on') on the numeric rate array instead of the ratelim option.
    ClusterIsolation.m stores each L-ratio at a counter that is not advanced for skipped clusters, so
    after a skipped cluster the L-ratios are assigned to the wrong units.
- kind: code_mismatch
  statement: BatchPlaceFields.m smooths firing curves with 5 bins (12 cm), drops fields wider than 3/4
    of the track and requires 50 or 30 spikes, none of which the Methods state (they give a 4.5 cm kernel
    and no size limit); the place-cell counts change from 207, 203 and 228 to 61, 104 and 100.
- kind: methods_unavailable
  statement: 'Questions for the authors. (1) Field size limits: is a field required to span at least 10
    bins and at most 3/4 of the track, as BatchPlaceFields.m sets, and is the kernel 4.5 cm or 5 bins?
    The field-size comparison (Fig. 1C) and the remapping bootstrap (Fig. 1D, 1E, S2D) depend on it. (2)
    Theta burst frequency (Fig. 2D): what spectrogram windows were used on the spike trains in theta-cycle
    units? A spectrum over a whole session peaks at exactly 1 cycle^-1. (3) Which LFP channel was used
    for theta power (Fig. 2B)? With the largest-theta channel per rat the power difference is not significant.
    (4) Was the FMAToolbox MTSpectrogram window for SWS detection its default, and how many k-means clusters
    were used?'
- kind: other
  statement: The head-tracking LED is lost for 40.6% of samples in rat 292 and 22.8% in rat 314 (under
    1% in the other rats), almost all during sleep. The track perimeter traced by the head is 656 to 706
    cm with the scripts' pixel sizes, against the 6 m track length the paper uses.
- kind: other
  statement: Rats 292 and 314 were recorded at 20 kHz, though the data descriptor does not say so; the
    others at 32552 Hz. The LFP of rat 272 saturates (|x| at 32767) in about 1% of sleep samples.
