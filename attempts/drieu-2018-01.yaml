- claim: figs11-sleep-sessions-similar
  outcome: not_reproduced
  notebook: reproduce_drieu_2018_travel_sleep.ipynb
  output: claim:figs11-sleep-sessions-similar
  notes: 'SWS duration 35.8, 37.2, 37.7 and 33.6 min (baseline and the three post-travel sessions), RM-ANOVA
    P = 0.96. Candidate events 2004, 1819 and 1610 per session (P = 0.69), 49.4, 49.0 and 47.4 per min
    of SWS (P = 0.63); ripples 54.3, 57.2 and 55.0 per min of SWS (P = 0.57). The KS tests of event peak
    minus nearest ripple peak find a difference: after Passive 1 against after Active P = 0.011 (D = 0.028,
    n about 6000 each) with the SWS threshold, and after Passive 1 against after Passive 2 P = 0.025 with
    the whole-session threshold. About 26 to 52% of events lie within 0.1 s of a ripple peak.'
  deviations:
  - SWS by k-means with 5 clusters (SWSDetection.m's default) on the z-scored theta/delta ratio of 5-s
    windows; the window is an assumption on FMAToolbox's MTSpectrogram default. Windows with saturated
    samples are left out, as SWSDetection.m drops them.
  - Ripple peak threshold 3 s.d. for every rat (Methods); BatchFindRipples.m uses 4 for rat 272.
  - The event-to-ripple timing is the event's peak minus the nearest ripple peak within 0.5 s; the paper
    does not define the measure.
