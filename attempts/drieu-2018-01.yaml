- claim: figs1-travel-similar
  outcome: not_reproduced
  notebook: reproduce_drieu_2018_travel_sleep.ipynb
  output: claim:figs1-travel-similar
  measured:
  - 45.6
  - 47.34
  - 45.41
  - 37.4
  - 29.4
  - 31.2
  - 9.21
  - 6.42
  - 7.63
  notes: Velocity and laps hold, travel duration does not. Mean train velocity over samples above 5 cm/s (reading
    b) is 45.6, 47.3 and 45.4 cm/s, all within tolerance, RM-ANOVA P = 0.487; over all samples (reading a) 42.2,
    47.3 and 43.4 cm/s, two of three outside tolerance, P = 0.193. Laps 37.4, 29.4 and 31.2, all within tolerance,
    P = 0.053. Travel duration from the events file 9.21, 6.42 and 7.63 min (Passive 1 outside tolerance), P = 0.023;
    time moving 8.26, 6.41 and 7.14 min, all within tolerance, P = 0.045. The duration ANOVA finds an effect under
    both readings, so the claim of absence fails for duration. Measured values are velocity reading (b), laps and
    the events-file duration.
  deviations:
  - Velocity from head position smoothed by a Gaussian of 30 samples, as LinearVelocity(x,30) in the scripts of
    code.zip.
  - Laps as completed turns of the unwrapped linear position; the paper does not say how laps were counted.
  - Time moving (v > 5 cm/s, periods of at least 10 s) is shown as a variant of duration; the paper does not define
    travel duration.
  - The paper's LinearizeTrainTrack is not in code.zip. Positions are mapped to their angle around the track centre
    and then to arc length along the median path, an assumption; the measured perimeter is 656 to 706 cm, and slopes
    use the paper's 6 m.
- claim: figs2b-place-cell-count
  outcome: partially_reproduced
  notebook: reproduce_drieu_2018_travel_sleep.ipynb
  output: claim:figs2b-place-cell-count
  notes: 'Under field reading (c), adopted, the totals are 138, 158 and 171 place cells (Passive 1, Active, Passive
    2) against 94, 150 and 135: Active within tolerance, the others not; Passive 1 is lowest and the RM-ANOVA of
    per-rat counts gives P = 0.037. The order and the test hold, the totals do not, which the criterion calls partial.
    Under the claims file''s readings (a) and (b) the totals are 207, 203, 228 and 183, 195, 207, none within tolerance,
    P = 0.055 and 0.128; with the settings of BatchPlaceFields.m (12 cm kernel) 61, 104 and 100, P = 0.092. Well-isolated
    pyramidal cells number 43, 25, 83, 31 and 103 per rat.'
  deviations:
  - Pyramidal cells by k-means on the z-scored width, trough-to-peak duration and Active firing rate (Methods);
    DiscriminateUnits.m clusters on the two durations only. The two agree on 604 of 685 units, with rat 292 the
    exception (85 against 19 pyramidal).
  - Mean waveforms from each unit's first 800 spikes among the first 80 MB of its group's .spk file (memory bound);
    every unit reached 800 spikes by median.
  - Clusters 0 and 1 (Klusters artefact and noise) are not units.
  - Firing curves with a Gaussian of s.d. 4.5 cm (Methods); BatchPlaceFields.m smooths with 5 bins (12 cm), shown
    as the code variant.
  - Other fields of a cell are runs above 30% of its peak whose own peak reaches the minimum peak rate; the Methods
    define only the field holding the peak.
  - 'Assumed field reading (c): the Methods'' 4.5 cm kernel and 30% threshold with the limits BatchPlaceFields.m
    sets (fields of at least 10 bins and at most 3/4 of the track, at least 50 spikes in Active and 30 in the passive
    travels). Added after round 1 of verification, which found that under reading (a) nearly every pyramidal cell
    is a place cell. The claims file''s readings (a) and (b) are shown and do not reproduce.'
  assumed: true
  measured:
  - 138
  - 158
  - 171
- claim: fig1c-field-size-similar
  outcome: not_reproduced
  notebook: reproduce_drieu_2018_travel_sleep.ipynb
  output: claim:fig1c-field-size-similar
  notes: 'Under the adopted field reading (c), Kruskal-Wallis P = 0.0004 for the field holding the peak (medians
    100.8, 142.8 and 98.4 cm; 138, 158 and 171 cells) and P = 0.0009 for every field. Reading (a): P = 0.0065 and
    < 0.0001; reading (b): P = 0.070 (peak field) and 0.0017 (every field); the code''s settings: P = 0.53 and 0.033.
    Six of eight combinations find a difference. Fields are large: under reading (a), 45 of 207 Passive 1 place
    cells have a peak field over 450 cm, place cells have a median of 3 to 5 fields, and the median spatial information
    is 0.14 to 0.22 bits per spike.'
