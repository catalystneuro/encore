- claim: figs1-travel-similar
  outcome: not_reproduced
  notebook: reproduce_drieu_2018_travel_sleep.ipynb
  output: claim:figs1-travel-similar
  measured:
  - 45.6
  - 47.34
  - 45.41
  - 37.4
  - 29.4
  - 31.2
  - 9.21
  - 6.42
  - 7.63
  notes: Velocity and laps hold, travel duration does not. Mean train velocity over samples above 5 cm/s
    (reading b) is 45.6, 47.3 and 45.4 cm/s, all within tolerance, RM-ANOVA P = 0.487; over all samples
    (reading a) 42.2, 47.3 and 43.4 cm/s, two of three outside tolerance, P = 0.193. Laps 37.4, 29.4 and
    31.2, all within tolerance, P = 0.053. Travel duration from the events file 9.21, 6.42 and 7.63 min
    (Passive 1 outside tolerance), P = 0.023; time moving 8.26, 6.41 and 7.14 min, all within tolerance,
    P = 0.045. The duration ANOVA finds an effect under both readings, so the claim of absence fails for
    duration. Measured values are velocity reading (b), laps and the events-file duration.
  deviations:
  - Velocity from head position smoothed by a Gaussian of 30 samples, as LinearVelocity(x,30) in the scripts
    of code.zip.
  - Laps as completed turns of the unwrapped linear position; the paper does not say how laps were counted.
  - Time moving (v > 5 cm/s, periods of at least 10 s) is shown as a variant of duration; the paper does
    not define travel duration.
  - The paper's LinearizeTrainTrack is not in code.zip. Positions are mapped to their angle around the
    track centre and then to arc length along the median path, an assumption; the measured perimeter is
    656 to 706 cm, and slopes use the paper's 6 m.
- claim: figs2b-place-cell-count
  outcome: not_reproduced
  notebook: reproduce_drieu_2018_travel_sleep.ipynb
  output: claim:figs2b-place-cell-count
  notes: Totals over rats are 207, 203 and 228 place cells (Passive 1, Active, Passive 2) under field
    reading (a) and 183, 195 and 207 under reading (b), against 94, 150 and 135; none is within tolerance.
    RM-ANOVA of per-rat counts P = 0.055 (a) and 0.128 (b). Passive 1 is lowest only under (b). With the
    settings of BatchPlaceFields.m (kernel 5 bins, minimum 10 bins, fields over 3/4 of the track dropped,
    at least 50 or 30 spikes) the totals are 61, 104 and 100, with Passive 1 lowest, P = 0.092. Well-isolated
    pyramidal cells number 43, 25, 83, 31 and 103 per rat.
  deviations:
  - Pyramidal cells by k-means on the z-scored width, trough-to-peak duration and Active firing rate (Methods);
    DiscriminateUnits.m clusters on the two durations only. The two agree on 604 of 685 units, with rat
    292 the exception (85 against 19 pyramidal).
  - Mean waveforms from each unit's first 800 spikes among the first 80 MB of its group's .spk file (memory
    bound); every unit reached 800 spikes by median.
  - Clusters 0 and 1 (Klusters artefact and noise) are not units.
  - Firing curves with a Gaussian of s.d. 4.5 cm (Methods); BatchPlaceFields.m smooths with 5 bins (12
    cm), shown as the code variant.
  - Other fields of a cell are runs above 30% of its peak whose own peak reaches the minimum peak rate;
    the Methods define only the field holding the peak.
- claim: fig1c-field-size-similar
  outcome: reproduced
  notebook: reproduce_drieu_2018_travel_sleep.ipynb
  output: claim:fig1c-field-size-similar
  notes: 'Under the adopted reading (fields of at least 10 bins, field holding the peak) Kruskal-Wallis
    P = 0.070, medians 139, 170 and 134 cm, n 183, 195 and 207. Under the other readings it differs. No
    minimum size: P = 0.0065 (peak field), P < 10^-4 (every field). Minimum 10 bins, every field: P =
    0.0017. Code settings, peak field: P = 0.53. Fields are large here (medians 108 to 235 cm); the paper''s
    Fig. 1C sizes are not in the claims file.'
  deviations:
  - Assumed, as the reading the paper best supports, the minimum field size of 10 bins that BatchPlaceFields.m
    sets (minSize = 10); the Methods give no minimum, and the claims file lists this as reading (b). Reading
    the Methods as having no minimum gives a significant difference. A question for the authors is in
    the findings.
  - The field holding the peak is the field the Methods define (contiguous bins containing the location
    of maximal firing rate).
  assumed: true
