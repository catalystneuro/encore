findings:
- kind: metadata_insufficient
  statement: The LFP channels the analyses used are not in the data set. The scripts in code.zip take them from
    batch files (SessionsReactivations1-Channels.batch) that are not included, and the xml files do not mark the
    pyramidal-layer or theta channels. This attempt chose them from the data.
- kind: metadata_insufficient
  statement: The place cells, theta cycles and candidate events the scripts load (the BatchPlaceCells_20170104 database,
    the .tcy.evt and .tuw.evt files, LinearizeTrainTrack, ReconstructPosition2, FindReplayScore) are not in the
    data set or code.zip, so the selections cannot be compared with the paper's. The place-cell counts obtained
    here (207, 203 and 228 under the Methods' definition; 138, 158 and 171 with the size and spike limits of BatchPlaceFields.m)
    differ from the paper's 94, 150 and 135.
- kind: code_mismatch
  statement: DiscriminateUnits.m clusters units on waveform width and trough-to-peak duration only, while the Methods
    add the firing rate; and its rate exclusion of putative pyramidal cells above 5 Hz never applies, because it
    tests strcmp(rate,'on') on the numeric rate array instead of the ratelim option. ClusterIsolation.m stores each
    L-ratio at a counter that is not advanced for skipped clusters, so after a skipped cluster the L-ratios are
    assigned to the wrong units.
- kind: code_mismatch
  statement: BatchPlaceFields.m smooths firing curves with 5 bins (12 cm), drops fields wider than 3/4 of the track
    and requires 50 or 30 spikes, none of which the Methods state (they give a 4.5 cm kernel and no size limit);
    the place-cell counts change from 207, 203 and 228 to 61, 104 and 100.
- kind: methods_unavailable
  statement: 'Questions for the authors. (1) Field limits: is a field required to span at least 10 bins and at most
    3/4 of the track, with at least 50 or 30 spikes, as BatchPlaceFields.m sets, and is the kernel 4.5 cm or 5 bins?
    The place-cell counts (fig. S2B), the field-size comparison (Fig. 1C) and the remapping bootstrap (Fig. 1D,
    1E, S2D) depend on it. (2) Theta burst frequency (Fig. 2D): what spectrogram windows were used on the spike
    trains in theta-cycle units, and were the spectra averaged? A spectrum over a whole session peaks at 1.000 cycle^-1;
    16-cycle windows give an Active effect under one phase reading only. (3) Which LFP channel was used for theta
    power and phase? Four of rat 272''s channels have reversed theta, and in rats 292 and 314 pyramidal cells fire
    near the theta peak on every channel; was their signal inverted? Inverting it reverses those rats'' theta sequences
    and removes the pooled Active effects on slopes and quadrant scores. (4) Was the FMAToolbox MTSpectrogram window
    for SWS detection its default, and how many k-means clusters were used? (5) For fig. S10, was each lap decoded
    with its own firing curves, as BatchSequenceReconstructLapByLap.m does? (6) Were decoding errors for fig. S9
    cross-validated?'
- kind: other
  statement: The head-tracking LED is lost for 40.6% of samples in rat 292 and 22.8% in rat 314 (under 1% in the
    other rats); in those two rats 98.7% and 99.7% of the lost samples are in sleep. The track perimeter traced
    by the head is 656 to 706 cm with the scripts' pixel sizes, against the 6 m track length the paper uses.
- kind: other
  statement: Rats 292 and 314 were recorded at 20 kHz, though the data descriptor does not say so; the others at
    32552 Hz. The sleep LFP reaches the 16-bit limit (|x| = 32767) in 2.4% of samples on the theta channel of rat
    261, 0.39% in rat 272, 0.04% in rat 242 and never in rats 292 and 314.
- kind: other
  statement: Theta phase of pyramidal-cell spikes differs between channels and rats. In rat 272, four of the twelve
    channels with isolated pyramidal cells (24, 28, 32, 36) have spikes at 111 to 150 deg from the theta peak, against
    -67 to -124 deg on the others, so their theta is reversed and they are not in the pyramidal layer, though units
    were recorded on them. In rats 292 and 314, the two recorded at 20 kHz, spikes fall at -5 to -51 deg on every
    channel, against -91 to -175 deg and 149 to 168 deg in rats 242 and 261, which fits an inverted signal polarity
    in that recording system; the data set does not say. The theta channel used here leaves out reversed channels
    within a rat but does not correct a polarity common to all channels of a rat.
