- claim: fig2cd-spike-bursts-slower
  outcome: not_reproduced
  notebook: reproduce_drieu_2018_travel_sleep.ipynb
  output: claim:fig2cd-spike-bursts-slower
  notes: 'The spectral mode of place-cell spike trains in theta-cycle units sits at 1.000 cycle^-1 in
    all conditions: medians 0.9999, 1.0003 and 1.0000 (phase reading a), Kruskal-Wallis P = 0.62; reading
    (b) 1.0000, 1.0006, 1.0002, P = 0.024, Active against Passive 1 P = 0.0061 and against Passive 2 P
    = 0.41. Active is above both, but by less than 0.001 cycle^-1, and only one difference is significant.'
  deviations:
  - One multitaper spectrum (time-bandwidth 3, 5 tapers, a standard choice) per cell over its whole travel
    session; the paper computes spectrograms and does not give their windows. A spectrum over the whole
    session is dominated by phase locking at exactly 1 cycle^-1; windowed spectrograms may not be. A question
    for the authors is in the findings.
