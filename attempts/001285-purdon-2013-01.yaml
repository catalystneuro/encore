outcomes:
- claim: fig1c-clicks-lost-before-verbal
  outcome: blocked
  blocked_by: data_missing
  notes: Needs each subject's time series of responses to the click and verbal stimuli. The NWB file
    holds no stimuli, button presses, trials, events or intervals, and the dandiset holds 1 of the
    10 subjects. Searched the file (every group), the dandiset's assets (one file), and DANDI for
    other dandisets of the study (001286 and 001287 carry the same description and hold no files).
- claim: eon-loc-duration
  outcome: blocked
  blocked_by: data_missing
  notes: EON and LOC are defined from the response-probability curves, and the responses are not in
    the dandiset (see fig1c-clicks-lost-before-verbal). The file holds no time markers either, and
    only 1 of 10 subjects, so the across-subject median and quartiles cannot be formed.
- claim: fig1e-group-induction
  outcome: blocked
  blocked_by: data_missing
  notes: The group curves pool the responses of 10 subjects aligned at LOC; no responses are
    deposited and 9 of 10 subjects are absent.
- claim: fig1e-group-emergence
  outcome: blocked
  blocked_by: data_missing
  notes: As fig1e-group-induction, aligned at ROC.
- claim: eoff-not-reached
  outcome: blocked
  blocked_by: data_missing
  notes: EOFF is defined from Pclicks, which needs the responses to the click stimuli, not in the
    dandiset; the count is over 10 subjects, of which 1 is deposited.
- claim: roc-eoff-duration
  outcome: blocked
  blocked_by: data_missing
  notes: ROC and EOFF come from the responses, not in the dandiset; 1 of 10 subjects.
- claim: fig2bc-gamma-beta-before-loc
  outcome: blocked
  blocked_by: data_missing
  notes: The spectrogram is aligned at LOC, which the paper derives from the behavioural responses
    (not deposited), and significance is a sign test across 10 subjects (1 deposited). The channel
    near Fz and the Laplacian also cannot be formed, as the 64 channels have no names or positions
    (metadata_insufficient). In the deposited subject, beta power (median over the 64 unnamed
    channels) steps to about 2 times the first 15 min of the file at minute 17 and to 5.5 to 9.9
    times (median 7.6 over minutes 33 to 47) at minute 33, which describes the file and tests
    nothing.
- claim: fig2bc-alpha-slow-at-loc
  outcome: blocked
  blocked_by: data_missing
  notes: Needs LOC (from the responses, not deposited) and the sign test across 10 subjects (1
    deposited); the channel near Fz cannot be identified (no channel names or positions;
    metadata_insufficient).
- claim: fig2d-spatial-loc15
  outcome: blocked
  blocked_by: data_missing
  notes: Needs LOC (not deposited) and the median map across 10 subjects (1 deposited). The channel
    groups (frontal, temporal, parietal, occipital) also cannot be formed, as the channels have no
    names or positions (metadata_insufficient).
- claim: fig2-emergence-reverse
  outcome: blocked
  blocked_by: data_missing
  notes: Needs ROC and EOFF (from the responses, not deposited) and the sign test across 10 subjects
    (1 deposited); no channel names for Fz (metadata_insufficient).
- claim: slow-power-tenfold
  outcome: blocked
  blocked_by: data_missing
  notes: The claim's quantity is the group median across 10 subjects of low-frequency power in the
    unconscious state (between LOC and ROC, or at LOC + 15 min) over baseline, at the channel near
    Fz or over channels. LOC and ROC are not deposited, 9 of 10 subjects are absent, and the
    channels have no names (metadata_insufficient). As a description of the file only, low-frequency
    power, median over the 64 unnamed channels without a Laplacian, is 6.5 to 34 times its level in
    the first 15 min from minute 49 to minute 97 (median 15.4 over minutes 60 to 100; 16.3 over the
    55 channels with SDs below 300 uV). The reference period was chosen after looking at the data,
    and the period is not shown to be the unconscious state, so this is no evidence for the claim.
- claim: fig3a-induction-traveling-peak
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the group spectrogram aligned at LOC, with the start of the transition at EON or 30
    min before LOC; LOC and EON come from the responses, not deposited, and 9 of 10 subjects are absent.
    No channel names for Fz (metadata_insufficient).
- claim: fig3a-emergence-traveling-peak
  outcome: blocked
  blocked_by: data_missing
  notes: As fig3a-induction-traveling-peak, aligned at ROC with EOFF; neither is deposited.
- claim: fig3b-frontal-median-frequency-power
  outcome: blocked
  blocked_by: data_missing
  notes: Needs all seven behavioural time points (from the responses, not deposited), the group
    median across 10 subjects (1 deposited), and channel groups, which cannot be formed without
    channel names or positions (metadata_insufficient).
- claim: figs2-band-spatial-shift
  outcome: blocked
  blocked_by: data_missing
  notes: As fig3b-frontal-median-frequency-power; the frontal and occipital groups cannot be formed
    either.
- claim: fig4ab-occipital-alpha-mode
  outcome: blocked
  blocked_by: data_missing
  notes: The timing part needs LOC and ROC (not deposited) and the group mean over 10 subjects (1
    deposited). The spatial part, whether the baseline mode is occipital, needs channel positions or
    names, which the file does not hold (metadata_insufficient); the full baseline period is not
    marked either.
- claim: fig4cd-frontal-alpha-mode
  outcome: blocked
  blocked_by: data_missing
  notes: The unconscious cross-spectral matrix is taken from LOC to ROC (not deposited); group over
    10 subjects (1 deposited); frontal channels cannot be identified (no names or positions;
    metadata_insufficient).
- claim: fig4-no-low-frequency-mode
  outcome: blocked
  blocked_by: data_missing
  notes: The paper's test uses the unconscious mode between LOC and ROC and the group mean over 10
    subjects; LOC and ROC are not deposited and 9 of 10 subjects are absent. The test is that of
    fig4cd-frontal-alpha-mode, defined as fig4ab-occipital-alpha-mode, which applies the Laplacian
    (the paper applies it to "this and subsequent analyses"); the Laplacian needs channel names or
    positions, which the file does not hold (metadata_insufficient).
- claim: fig5-trough-max-induction
  outcome: blocked
  blocked_by: data_missing
  notes: The epochs are placed relative to LOC (not deposited) and the count is over 10 subjects (1
    deposited); the frontal channel near Fz and its Laplacian cannot be formed without channel names
    or positions (metadata_insufficient).
- claim: fig5-peak-max
  outcome: blocked
  blocked_by: data_missing
  notes: As fig5-trough-max-induction, 10 to 40 min after LOC.
- claim: fig5-trough-max-emergence
  outcome: blocked
  blocked_by: data_missing
  notes: As fig5-trough-max-induction, aligned at ROC (not deposited).
- claim: figs3-broadband-modulation
  outcome: blocked
  blocked_by: data_missing
  notes: The epochs are centred at LOC and LOC + 30 min (LOC not deposited) and averaged across 10
    subjects (1 deposited); no channel names for Fz (metadata_insufficient).
