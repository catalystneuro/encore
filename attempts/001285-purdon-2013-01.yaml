outcomes:
- claim: fig1c-clicks-lost-before-verbal
  outcome: blocked
  blocked_by: data_missing
  notes: Needs each subject's time series of responses to the click and verbal stimuli. The NWB file
    holds no stimuli, button presses, trials, events or intervals, and the dandiset holds 1 of the
    10 subjects. Searched the file (every group), the dandiset's assets (one file), and DANDI for
    other dandisets of the study (001286 and 001287 carry the same description and hold no files).
- claim: eon-loc-duration
  outcome: blocked
  blocked_by: data_missing
  notes: EON and LOC are defined from the response-probability curves, and the responses are not in
    the dandiset (see fig1c-clicks-lost-before-verbal). The file holds no time markers either, and
    only 1 of 10 subjects, so the across-subject median and quartiles cannot be formed.
- claim: fig1e-group-induction
  outcome: blocked
  blocked_by: data_missing
  notes: The group curves pool the responses of 10 subjects aligned at LOC; no responses are
    deposited and 9 of 10 subjects are absent.
- claim: fig1e-group-emergence
  outcome: blocked
  blocked_by: data_missing
  notes: As fig1e-group-induction, aligned at ROC.
- claim: eoff-not-reached
  outcome: blocked
  blocked_by: data_missing
  notes: EOFF is defined from Pclicks, which needs the responses to the click stimuli, not in the
