- claim: slow-power-tenfold
  outcome: blocked
  blocked_by: data_missing
  notes: The claim's quantity is the group median across 10 subjects of low-frequency power in the
    unconscious state (between LOC and ROC, or at LOC + 15 min) over baseline, at the channel near
