findings:
- kind: data_missing
  statement: The dandiset holds none of the recordings behind the paper's figures. Its 72 files are one
    FluoVolt experiment of 2023-06-22 in 12 fields of view, single 1-us pulses (2 fields) and pulse pairs
    at intervals of 1, 5, 25, 125 and 250 us (2 fields each), at 150 to 1570 V/cm. The paper's
    Di-8-ANEPPS escalations (Figs. 1, 2B to D, 4B to D), its FluoVolt escalation (Figs. 2A, 3, 4A), the
    Gd3+ experiments (Fig. 5), the Fluo-4 calcium imaging (Fig. 6) and the Di-8-ANEPPS two-pulse
    recordings at a 5-us interval (Fig. 7) are absent. 31 of the 32 claims cannot be tested.
- kind: metadata_error
  statement: The dandiset's metadata names the paper as the publication of its data (dcite:IsPublishedIn),
    but the paper reports no FluoVolt two-pulse experiment and no interval other than 5 us, and its
    Discussion names varying the interval as future work. The files' descriptions also differ from the
    paper's Methods on the electrode spacing (1.00 mm against 1.6 mm) and the frames per set (20 sham and 40
    pulse against 40 and 60).
- kind: metadata_error
  statement: The general description in every file gives the inter-pulse intervals as 1, 5, 25 and 125 us,
    but fields of view c5 and c12 hold pairs at 250 us.
- kind: format_error
  statement: The ImageSeries starting_time holds the Unix time of each set's acquisition (1687481119 to
    1687486631 s), the same instant as the file's session_start_time, where NWB defines it as the offset
    from the session's reference time; every recording thus starts about 53 years after its session.
- kind: metadata_insufficient
  statement: The pulse protocol of each set (sham, single or paired, amplitudes, interval) is only in the
    free text of session_description; there is no stimulus or trial table, and no frame is labelled as sham
    or pulse (the data confirm 20 sham frames, then 40). The field direction, the pixel size and the
    imaging delay per set are not recorded.
- kind: metadata_insufficient
  statement: The amplitudes are given in volts (50 to 250 V) and the description lists the field strengths
    0.15, 0.52, 0.9, 1.27 and 1.57 kV/cm without mapping them to amplitudes. Read in order, these are not
    proportional to voltage (5 times the voltage for 10.5 times the field), while the paper states that the
    current scaled linearly with voltage.
- kind: metadata_insufficient
  statement: The 12 subjects (CHO_20230622_c1 to c12) are fields of view holding several cells each, some
    of them touching (29 whole, round cells, 2 or 3 per field of view, are measured in the notebook), and
    the files do not say which cell was the experiment's cell; the paper reports one cell per experiment.
- kind: metadata_error
  statement: Subject metadata describe a cell line as an organism, with age P1D and sex U, and the archive's
    summary gives the species as "Cricetulus griseus - Cricetulus aureus" for NCBITaxon_10029 (Cricetulus
    griseus).
- kind: other
  statement: On the cells, the 40 frames after the sham frames are 13.3 to 16.2% dimmer than sham frames 1
    to 19 in the sham sets, with no pulse (9.4 to 16.8% with frame 0 in the baseline), and the per-frame
    pole dF falls within the pulse frames of the sham sets (by 12.1 and 12.2 points between pulse frames
    20-29 and 50-59) and within their baseline (by 15.9 and 16.3 points between frames 1-9 and 10-19). In
    65 of the 72 files the first frame is more than 10% dimmer than frames 1 to 19 (median 0.64, range
    0.52 to 1.11 over files). This uniform offset enters the paper's collapsed dF measure at both poles.
- kind: paper_inconsistency
  statement: Results 3.5 states that a 10-fold rise in effective membrane conductivity yields a ~2% IMP
    reduction by Eq. (2), but Eq. (2) with the constants of Methods 2.3 gives 1.33% (1.20% relative to the
    intact membrane); a 2% reduction needs a 15- to 16-fold rise. The 100-fold value (12%) agrees.
