- claim: fig8a-proportion-by-property
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig8a-proportion-by-property
  measured:
  - 56
  - 62
  - 27
  - 16
  - 64
  notes: The property groups give 95 amplitude, 110 frequency and 137 higher-order probes, as
    Table 1, but 39 AM and 25 FM probes against 96 and 82 (the MHT probes of Table 1 are not in
    the data set, see methods-recording-counts). Significant probes are 56 of 95 (paper 77), 62
    of 110 (73), 27 of 39 (62 of 96) and 16 of 25 (47 of 82), none within tolerance. Amplitude
    (0.589) exceeds frequency (0.564) and AM (0.692) exceeds FM (0.640). Higher-order depends on
    how the colored noises are grouped. With each natural sound tested against its own colored
    noise (the reading adopted), 64 of 131 probes are significant in at least one pair (0.489,
    within 59 +/- 5.9), and 109 of 336 single tests (0.324); with every fragment its own context
    75 of 131 (0.573); with all natural sounds of a file pooled into one context and all noises
    into another, 88 of 137 (0.642). AM > FM > higher-order holds under the first three and fails
    under pooling, so the partial rule holds under the adopted reading. Without the natural-sound
    level and frequency variants, amplitude is 35 of 61 and frequency 44 of 75.
  deviations:
  - Assumption. For higher-order, each natural sound is tested against its own colored noise(s),
    as Table 1's legend describes ("comparing natural sounds and corresponding modulated colored
    noise"), and a probe counts once, as significant when it is in at least one pair; Table 1
    counts probes. The pooled grouping used in round 1 and every fragment as its own context are
    shown. 6 probes (each fragment) and 18 tests (pairs) have fewer than 4 trials and are dropped.
  - The groups are read from the files (asari.property_tests; per-file table in the notebook).
    Where a file varies two properties on a grid (AM rate by FM rate in the MHT grid files, level
    by playing direction in natural-sound files), fragments that share the tested property's
    value are pooled into one context so that each probe is tested once per property; this
    reproduces the paper's totals for amplitude and frequency. The same pooling of the colored-noise
    files (all natural sounds against all noises) reproduces the total of 137 higher-order probes
    and is shown as a reading.
  - Natural-sound level and frequency variants (files of type naturalistic) are counted under
    amplitude and frequency; Table 1 has no row for them, and the variant without them is shown.
