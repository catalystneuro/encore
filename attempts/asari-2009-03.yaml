    empty descriptions. The sequences can be matched by their content.
- kind: methods_unavailable
  statement: Question for the authors. Over which probes is the proportion of significant probes at time
    t taken in Figure 3A, all 305 or only those still running at t? Probes last 2 to 6 s, so the two differ
    after 2 s; with the data set, the late fraction is 0.255 over all probes (matching 23.7%) and 0.270
    over running probes. The same question applies to the power averages of Figures 3B, 4 and 8.
- kind: methods_unavailable
  statement: Question for the authors. What is counted in each column of Table 1 and Figure 8? With the
    sets of conditioning stimuli formed here, counting each probe with each set reproduces the AM (96)
    and FM (82) totals, and counting each probe once reproduces the amplitude (95), frequency (110) and
    higher-order (137) totals; neither reproduces all five, and the proportions keep the paper's order
    under each but not under the mix. Was each probe of the natural-and-noise ensembles counted once,
    or once per natural-noise pair?
- kind: methods_unavailable
  statement: Question for the authors. How were A1 spikes detected for the firing rates (the code in the
    data set extracts whole-cell spikes by hand), and which windows define spontaneous and evoked rates?
    A 15-mV threshold on the raw trace minus its 10-ms median gives 0.481 and 0.547 Hz, matching 0.47
    and 0.57 Hz, but the MGB evoked rate is 4.99 Hz with the authors' automatic detector against 11.4
    Hz in the paper.
- kind: methods_unavailable
  statement: Question for the authors. Over what time range were the exponentials of Figures 3, 4 and
    8 fitted, with what bounds on the sizes? Fitted from probe onset, the proportion curve of Figure 3A
    rises over the first tens of milliseconds, so a free fit to 4.72 s returns a negative fast component;
    and the fitted constant of Q(t) depends on the noisy values after 3 s.
