- claim: fig3a-proportion-significant
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig3a-proportion-significant
  measured:
  - 187
  - 0.613
  - 0.276
  notes: With silence counted, 187 of 305 probes (0.613) are significant, within 204 +/- 20.4 and
    0.669 +/- 0.067; without silence 165 of 303 (0.545). The late fraction is 0.276 (all probes
    as denominator) or 0.295 (running probes) with silence, 0.198 or 0.211 without, none within
    0.237 +/- 0.024. The cumulative curve peaks at 4.78 s (paper 4.72 s); the mean noise floor
    is 2.2 x 10^-3 (all probes) or 2.8 x 10^-3 (running probes), the paper 2.8 x 10^-3. Under the
    claim's seed and the four others the mean noise floor at 1 ms ranges 2.85 to 2.95 x 10^-3
    (3.4%), and the late fraction 0.2756 to 0.2773, so the outcome is the same under all five.
    4 of 39 cells have no significant probe. Midranks with the tie correction, a variant of the
    ordinal ranks of CxtDep.m (lines 300 to 304, printed in the notebook), give the same 187 of
    305; on average 3.3% of values at a time point are tied with another trial (0.7% to 13.4% by
    probe), and the significant points differ at 0.02% of all points.
  deviations:
  - The seed spread of the noise floor is measured at 1-ms resolution with 100 shuffles per
    probe, since repeating the 1000 shuffles at 0.1 ms under four more seeds would double the
    run; the late fraction under each seed is recomputed with the full-resolution floor scaled
    by that seed's ratio.
- claim: fig3a-significance-decay
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig3a-significance-decay
  measured:
  - 0.159
  - 0.287
  - 0.064
  - 1.179
  - 0.0022
  notes: Measured is the first reading under the adopted bounds (silence counted, all probes,
    0 to 4.72 s, sizes at least 0) in the order alpha1, tau1, alpha2, tau2, kappa. Two
    exponentials are kept under every silence-counted reading with sizes at least 0, with alpha1
    0.15 to 0.17, tau1 0.28 to 0.31 s, alpha2 0.05 to 0.07 and tau2 1.1 to 1.5 s; tau1, alpha2 and
    tau2 are outside tolerance, and tau2 is between 0.5 and 2 s (the partial rule). With free
    sizes the fit takes the rise of the curve at onset as a negative component (-0.17 at
    0.015 s, then 0.22 at 0.47 s) and the partial rule fails. Without silence and with sizes at
    least 0 only one exponential is kept (0.16 at 0.26 to 0.27 s).
  deviations:
  - Assumption. The claims file leaves bounds open; sizes are held at 0 or above, as Eq. 44
    describes decays with positive sizes and the curve rises over its first 50 ms, which a free
    fit models as a negative exponential. Free sizes are shown as a reading.
  - Fits at 1-ms resolution, with 1 to 3 exponentials and the paper's one-tenth rule; start
    values from a grid (a standard choice).
