    stimulus, each of the 406 MHT fragments in those files has exactly one conditioning stimulus, so the
    row cannot be formed under that reading either. The paper's 57 FM probes equal the 76 per-set natural-probe
    FM tests of the 19 files with 16 MHT fragments less one per file (76 - 19 = 57), and its 71 AM probes
    equal 57 plus the 14 AM tests on MHT probes, which suggests the row split counts tests differently.
