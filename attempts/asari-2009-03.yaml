- claim: fig4-strf-performance-low
  outcome: not_reproduced
  assumed: true
  notebook: strf_wehr.ipynb
  output: claim:fig4-strf-performance-low
  measured: 0.139
  notes: On 16 Wehr cells with repeats, mean validation performance stays at or below 0.139 for
    the STRF and 0.096 for the LN model at all nine windows (training estimates up to 0.302 and
    0.326). But the STRF improves from 180 to 4052 ms in 13 of 16 cells, median change 0.039,
    one-sided Wilcoxon p = 0.0046 (Friedman p = 0.0052); the LN model p = 0.065. The improvement
    of the STRF is significant also with a 20-ms Hann window (p = 0.0046) and with folds by
    whole sound (p = 0.017), so under the claims file's test the claim of absence fails. The gain
    comes from the 6 cells of 2003, which have two trials per sound (all 6 improve, STRF 0.122 to
    0.174, p = 0.016); in the 10 cells of 2002, 7 improve and p = 0.12 (0.093 to 0.118), so with
    those cells alone the claim of absence would hold, and the outcome depends on the cell set the
    paper does not name. The LN model is worse than the STRF on validation data (mean difference
    -0.073), not slightly better; per cell, it falls more than 0.1 below the STRF at some window
    in 6 of 16 cells (down to -1.81 in 20020604-mw-002, where the lowess fit on the training data
    does not carry over) and never in the other 10. The shifted-stimulus control drops the 180-ms
    validation performance from 0.104 to 0.014. The ridge parameter is interior in 140 of 144
    fits. Measured is the largest mean STRF validation performance.
  deviations:
  - Assumption. 16 cells (all Wehr cells with at least two trials of a sound, which Eq. 52
    needs) against the paper's 20 unnamed cells of Machens et al. (2004); 6 of the 16 have only
    two trials per sound.
  - The response is binned at 4 ms; the spectrogram is 17 one-third-octave bands from 0.4 kHz
    (centres 0.4 to 16 kHz; 17 bins at 3 per octave cannot reach the 22 kHz the Methods also give)
    from a Hann-window STFT every 4 ms, each frame shifted so that it is centred on its 4-ms bin;
    folds are contiguous blocks; the lowess uses a delta of 1% of the range for speed. Readings at 180 and 4052 ms with a 20-ms window and with folds by
    sound are shown.
  - The test (paired one-sided Wilcoxon at 0.05) is the claims file's, not the paper's.
