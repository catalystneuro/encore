- claim: fig3a-proportion-significant
  outcome: reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig3a-proportion-significant
  measured:
  - 186
  - 0.61
  - 0.255
  notes: With silence counted as a context, 186 of 305 probes are significant (0.610), within 204
    +/- 20.4 and 0.669 +/- 0.067. The late fraction is 0.255 when the proportion at time t is taken
    over all 305 probes (within 0.237 +/- 0.024) and 0.270 when it is over the probes still running
    (outside); the cumulative curve peaks at 4.78 s (paper 4.72 s), and the mean noise floor over 0
    to 4.72 s is 0.00281 over running probes (paper 0.0028). Over the five seeds the late fraction
    is 0.254 to 0.255 (all probes) and 0.270 to 0.271 (running). Without silence as a context, 165
    of 305 (0.541) are significant and the late fraction is 0.174 to 0.182, outside. Probes come
    from 34 animal-days; significant fractions by animal-day are printed.
  deviations:
  - Silence (the intersequence interval) is a context of the first fragment of each sequence, as in
    the authors' CxtDep.m; the variant without it is shown.
  - The criterion's two readings of the denominator of the proportion at time t are run; the claim
    matches under the all-probes reading only. The ambiguity is recorded as a question for the
    authors.
  - The Kruskal-Wallis test uses ordinal ranks with no tie correction, and a significant run needs
    its last and first points 50 samples apart, as in CxtDep.m.
- claim: fig3a-significance-decay
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig3a-significance-decay
  measured:
  - 0.159
  - 0.26
  - 0.072
  - 1.053
  - 0.00276
  notes: Measured values are for running probes fitted from 0 to 6 s. Two exponentials are selected,
    sizes 0.159 and 0.072 with constants 0.26 and 1.05 s (paper 0.17, 0.20 s, 0.09, 0.90 s); over
    all probes, 0.151 and 0.081 with 0.25 and 0.98 s. No reading puts all four values within
    tolerance; the slow constant is between 0.5 and 2 s under every reading that selects two
    decaying exponentials, and under all five seeds for the 0-6 s readings. Fitted from 0 to 4.72 s
    with sizes free in sign, the fast component is a rise at the onset (size -0.172, 15 ms) with a
    slow constant of 0.44 s; with sizes held non-negative over running probes, the claim's seed
    selects one exponential (0.205, 0.50 s) and the other four seeds two. The noise floor is the
    one from fig3a-proportion-significant's shuffles.
  deviations:
  - Fitted at 1-ms resolution (means of ten 0.1-ms points), a standard choice.
  - Sizes free in sign and held non-negative are both run, as the paper gives no bounds.
