- claim: fig4-strf-performance-low
  outcome: not_reproduced
  notes: Measured value is the largest mean validation performance of the STRF model over the nine windows
    (10-ms Hann window, contiguous folds). 16 of Wehr's cells are used (the 10 of 2002 and 6 of 2003 with
    at least two trials of a natural sound); the paper's 20 are not marked in the files. Under the four
    readings that score every bin, the mean validation performance is at most 0.148 for STRF and 0.111
    for LN at every window, below 0.22, while the training estimates reach 0.245 to 0.268 (STRF) and 0.281
    to 0.311 (LN). In each of those four readings the one-sided Wilcoxon test finds that STRF improves
    from 180 to 4052 ms (p = 0.0026, 0.037, 0.0011, 0.029; mean 0.115 at 180 ms to 0.147 at 4052 ms with
    10-ms Hann and contiguous folds, most of it by 548 ms); for LN p is 0.017 and 0.015 with contiguous
    folds and 0.11 and 0.25 with folds by stimulus. Scoring only bins at least 4052 ms after onset removes
    the significant change (STRF p 0.065 and 0.052) but the mean then exceeds 0.22 (1.26 and 1.14), as
    one cell has negative predictable power in 6 of 10 folds. So no reading meets both conditions. The
    outcome depends on the cells used. With only the ten 2002 cells (5 to 25 trials per stimulus), three
    of the four all-bins readings meet the full criterion (STRF p 0.053 and LN p 0.22 with 10-ms Hann
    and contiguous folds, 0.31 and 0.50 with 10-ms Hann and folds by stimulus, 0.28 and 0.86 with 20-ms
    Hann and folds by stimulus, all means at most 0.14); with 20-ms Hann and contiguous folds STRF p is
    0.042. The six 2003 cells with two trials per stimulus are kept because the paper's 20 cells cannot
    be the ten 2002 cells alone; Summary.mat lists 10 cells of 2002 and 15 of 2003, so at least 10 of
    the 20 are 2003 cells, and only these six have repeats that Eq. 52 can use. The statement's "the LN
    model did only slightly better" does not hold on validation data. The LN model is better than STRF
    on training data (+0.013 to +0.049) and worse on validation data (gain -0.025 to -0.34; one cell, 20020602-mw-001, has LN validation performance -0.85),
    which suggests that the robust lowess fitted to training predictions does not carry over to held-out
    folds. The Friedman variant gives STRF p 0.016 to 0.31. No result uses random draws.
  notebook: strf_wehr.ipynb
  output: claim:fig4-strf-performance-low
  measured: 0.148
  assumed: true
  deviations:
  - 'Cells: every Wehr cell with at least two trials of a natural sound (16), as Eq. 52 needs repeats;
    the paper''s 20 cells of Machens et al. (2004) cannot be identified from the files.'
  - 'From the authors'' STRFanalysis.m in the data set: per-trial mean subtraction, fitting to the trial-averaged
    response, the spectrogram centred per frequency, 10 contiguous folds, one ridge value for all folds
    chosen by the mean linear validation score, the LN model on that filter, Eq. 53 per fold (LNperformance).'
  - 'Assumed: 17 frequencies 400 * 2^(k/3) Hz for k = 0 to 16 (logspectrogram.m''s rule would give 18);
    4-ms response bins (Wehr''s traces are at 4 kHz, so the 10-kHz reading does not exist); spectrogram
    history before onset set to the stimulus mean; a ridge grid of 33 values from 1e-6 to 1e2 times the
    mean eigenvalue; one lowess fit plus five robustness iterations.'
  - The Wilcoxon test is the one the claims file fixes; the outcome rests on it.
