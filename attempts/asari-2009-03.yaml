outcomes:
- claim: methods-recording-counts
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:methods-recording-counts
  notes: Whether silence counts as a conditioning stimulus or not, 305 natural sound probes in 39
    cells meet the criterion (at least two contexts, at least 4 effective repeats), and 93 MGB
    probes in 14 cells (at least 10 repeats), as in Table 1; these four counts match exactly. The
    data set holds no voltage-clamp recordings (Summary.mat lists four experiments, all current
    clamp or cell-attached), so the 29 voltage-clamp probes in 14 cells cannot be counted. 133
    current-clamp cells have at least one probe meeting the criterion (39 natural, 96 synthetic,
    2 in both), not 123; the data set lists 145 current-clamp A1 cells where the paper recorded
    194. By ensemble, TORC 14 and MCN 27 cells match the paper, DMR 15 against 6 and MHT 26 against
    39 do not. The property columns formed here total amplitude 104, frequency 120, AM 96, FM 82 and
    higher-order 354 tests, against 95, 110, 96, 82 and 137; the DMR cells (8 probes in 2 cells, 20
    in 5) match Table 1. The probes that make the difference are those of the synthetic ensembles,
    where each probe is tested once with each set of conditioning stimuli that differ in one
    property; the higher-order column differs most, as each probe of the natural-and-noise ensembles
    is tested with each natural-noise pair.
  deviations:
  - The voltage-clamp counts are not tested; the data set holds no voltage-clamp recordings.
  - The inclusion rule follows the authors' CxtDep.m, in the data set, for what the Methods leave
    open (the first "Effective repeats" presentations of each sequence, each context truncated to
    the smallest trial count over contexts, a probe kept with at least two distinct contexts).
  - The sets of conditioning stimuli for the property columns are formed here from the stimulus
    parameters and descriptions (asari.py, property_classes), as no file or passage of the paper
    lists them.
- claim: a1-mgb-firing-rates
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:a1-mgb-firing-rates
  measured:
  - 0.481
  - 0.547
  - 0.768
  - 7.07
  notes: Measured values are for the reading on which the outcome rests (A1 detector at 15 mV, MGB
    detector at half the authors' threshold, whole intersequence silences). A1 over 133 cells,
    spontaneous 0.481 +/- 0.597 Hz and evoked 0.547 +/- 0.677 Hz with the 15-mV detector (both means
    within 10%); 0.533 and 0.608 at 10 mV, 0.406 and 0.457 at 20 mV; below 1 Hz under every reading.
    MGB over 14 cells, the authors' detector gives spontaneous 0.551 +/- 1.236 and evoked 4.99 +/-
    11.45 Hz; half its threshold gives 0.768 +/- 1.309 (within tolerance of 0.78) and 7.07 +/- 12.25
    Hz. The MGB evoked mean is outside 11.4 +/- 1.14 under every reading, and above 5 Hz only with
    the lower threshold. Leaving out the first second of each silence changes the spontaneous means
    by at most 0.03 Hz. One MGB cell fires at 43 Hz during sounds and nine below 1.5 Hz. The partial
    rule (A1 below 1 Hz, MGB evoked above 5 Hz) holds under the lower MGB threshold and not under the
    authors' own detector (4.99 Hz).
  assumed: true
  deviations:
  - Assumed A1 spike detector, since the authors extracted whole-cell spikes by hand (GetSpikes.m
    with auto = 0) and the paper gives no detector. A spike is a peak of the raw trace more than
    10, 15 or 20 mV above its 10-ms median, at least 2 ms apart; all three are shown.
  - MGB spikes by the authors' automatic detector in the data set (GetSpikes.m, ExtractSpikes, a
    high-pass FIR filter and a threshold at two thirds of the largest filtered value) and, as a
    variant, half that threshold. The Methods say only "a high-pass filter and thresholding".
  - Rates use the context-design files only (the tuning-curve files are not read); A1 rates are
    over the 133 cells with natural or synthetic context files, and MGB rates over the 14 cells in
    the data set, where the paper's are over 194 and 16 cells.
  - Evoked rates are over all sound periods; as every fragment is a probe, the probe periods are
    the same samples, so the claims file's two readings coincide.
