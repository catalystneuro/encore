- claim: methods-recording-counts
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:methods-recording-counts
  notes: With probes formed as the data set's CxtDep.m forms them (at least two different
    contexts, trials cut to the smallest count over contexts, at least 4 trials in A1 and 10 in
    MGB), the natural-sound counts are 305 probes in 39 cells with silence counted as a context
    (303 without), and the MGB counts 93 probes in 14 cells, all as the paper. 133 A1 cells meet
    the current-clamp criterion against 123; by ensemble 14 TORC (paper 14), 15 DMR (6), 26 MHT
    (39) and 27 colored-noise cells (27), plus 14 cells tested with level or frequency variants
    of natural sounds, which Table 1 does not list. The data set holds 145 A1 current-clamp
    cells against the paper's 194, and 14 MGB cells against 16. The voltage-clamp counts (29
    probes, 14 cells) cannot be tested, as no voltage-clamp file is in the data set. Table 1 rows
    are printed; per property the totals are amplitude 95, frequency 110, AM 39, FM 25 and
    higher-order 137 (paper 95, 110, 96, 82, 137). Counted by their synthetic probes, as the rows
    of Table 1 count them, the ensembles hold 14 TORC cells (paper 14), 6 DMR (6), 26 colored-noise
    (27) and 2 MHT cells (39), and the DMR probes match Table 1 (8 amplitude probes in 2 cells, 20
    frequency probes in 5). The per-file table of experiment 2 gives the probes that make the
    difference in AM and FM. The 27 MHT files hold 14 MHT probes with at least two MHT contexts,
    against 178 MHT probe tests in Table 1, and in the files with an AM by FM grid only the natural
    sound follows more than one MHT. The notes of the 6 files that list variant groups are all
    parsed (no line names a property the parser does not know), so the shortfall is in the files,
    not in the parser.
  deviations:
  - Probes, contexts and the trial count are formed as asari/Tools/CxtDep.m in the data set does
    (the paper's Methods give the inclusion rule, not how trials of a context are pooled).
  - The ensembles are assigned from each file's trigger type and stimulus descriptions
    (asari.property_tests), so the cell counts per ensemble rest on that reading.
