findings:
- kind: data_missing
  about: data
  statement: The data set holds no voltage-clamp recordings. The paper analyses 29 probes in 14
    voltage-clamped A1 cells (Figures 5 and 6, Table 1); Summary.mat lists four experiments and
    every file is a current-clamp (mV) or cell-attached recording.
- kind: data_missing
  about: data
  statement: The data set holds 145 current-clamp A1 cells and 14 MGB cells, where the paper reports
    194 and 16 recorded (Methods, Electrophysiology). The analysed natural sound and MGB samples
    are complete (305 probes in 39 cells, 93 probes in 14 cells); the cells recorded but not
    analysed are not all there.
- kind: metadata_error
  about: data
  statement: In 20051107-ha1-001-003.mat and 20051107-ha1-001-004.mat the trigger descriptions
    number the sequences 2, 4, 6 and 8 while the notes number them 1 to 4, and the triggers between
    them have empty descriptions. The sequences can be matched by their content.
- kind: methods_unavailable
  statement: Question for the authors. Over which probes is the proportion of significant probes at
    time t taken in Figure 3A, all 305 or only those still running at t? Probes last 2 to 6 s, so
    the two differ after 2 s; with the data set, the late fraction is 0.255 over all probes
    (matching 23.7%) and 0.270 over running probes. The same question applies to the power averages
    of Figures 3B, 4 and 8.
- kind: methods_unavailable
  statement: Question for the authors. Which sets of conditioning stimuli form each column of Table 1
    and Figure 8? Forming them as sets of fragments that differ in one property, as done here,
    reproduces the AM (96) and FM (82) totals but gives 104, 120 and 354 tests for amplitude,
    frequency and higher-order properties against 95, 110 and 137, and the row split (natural
    against MHT probes) differs. Was each probe of the natural-and-noise ensembles counted once, or
    once per natural-noise pair?
- kind: methods_unavailable
  statement: Question for the authors. How were A1 spikes detected for the firing rates (the code in
    the data set extracts whole-cell spikes by hand), and which windows define spontaneous and
    evoked rates? A 15-mV threshold on the raw trace minus its 10-ms median gives 0.481 and 0.547
    Hz, matching 0.47 and 0.57 Hz, but the MGB evoked rate is 4.99 Hz with the authors' automatic
    detector against 11.4 Hz in the paper.
- kind: methods_unavailable
  statement: Question for the authors. Over what time range were the exponentials of Figures 3, 4
    and 8 fitted, with what bounds on the sizes? Fitted from probe onset, the proportion curve of
    Figure 3A rises over the first tens of milliseconds, so a free fit to 4.72 s returns a negative
    fast component; and the fitted constant of Q(t) depends on the noisy values after 3 s.
