  about: data
  statement: Nothing in Wehr's recordings marks the 20 cells of Machens et al. (2004) used for Figure
    4. wehr/Summary.mat lists two experiments citing that paper; 9 of their cells have only single presentations
    of each natural sound, which the predictable power of Eq. 52 cannot use, leaving 16.
