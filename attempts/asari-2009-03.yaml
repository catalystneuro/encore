- claim: fig4-strf-performance-low
  outcome: not_reproduced
  assumed: true
  notebook: strf_wehr.ipynb
  output: claim:fig4-strf-performance-low
  measured: 0.143
  notes: On 16 Wehr cells with repeats, mean validation performance stays at or below 0.143 for
    the STRF and 0.099 for the LN model at all nine windows (training estimates up to 0.303 and
    0.329). But the STRF improves from 180 to 4052 ms in 13 of 16 cells, median change 0.038,
    one-sided Wilcoxon p = 0.0031 (Friedman p = 0.0044); the LN model p = 0.058. The improvement
    of the STRF is significant also with a 20-ms Hann window (p = 0.0038) and with folds by
    whole sound (p = 0.0145), so under the claims file's test the claim of absence fails. The
    LN model is worse than the STRF on validation data (mean difference -0.068), not slightly
    better; its lowess fit overfits on several cells. The shifted-stimulus control drops the
    180-ms validation performance from 0.106 to 0.015. The ridge parameter is interior in 142 of
    144 fits. Measured is the largest mean STRF validation performance.
  deviations:
  - Assumption. 16 cells (all Wehr cells with at least two trials of a sound, which Eq. 52
    needs) against the paper's 20 unnamed cells of Machens et al. (2004); 6 of the 16 have only
    two trials per sound.
  - The response is binned at 4 ms; the spectrogram is 17 one-third-octave bands from 0.4 kHz
    from a Hann-window STFT every 4 ms; folds are contiguous blocks; the lowess uses a delta of 1%
    of the range for speed. Readings at 180 and 4052 ms with a 20-ms window and with folds by
    sound are shown.
  - The test (paired one-sided Wilcoxon at 0.05) is the claims file's, not the paper's.
