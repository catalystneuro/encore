- claim: fig6bc-inhibitory-correlations-higher
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:fig6bc-inhibitory-correlations-higher
  notes: On pooled neurons, reading (b), II noise correlations exceed EE in every mouse for noise, spontaneous and activity-matched
    correlations (largest p 5.8e-10), with EI between them in every case, so (b) gives reproduced. Across sessions, reading
    (a), II exceeds EE in every mouse for noise correlations (largest p 0.025), but not for spontaneous correlations
    in mouse 3 (p = 0.15) or matched correlations in mice 1 and 3 (p = 0.092, 0.094), so (a) gives not reproduced. The
    readings differ, so the claim is blocked. With neurons matched on mean activity (a variant), II exceeds EE across
    sessions only in mouse 4 (p = 0.028), on pooled neurons not in mouse 3 (p = 0.058, II 0.0006 below EE 0.0048), and
    EI is not between in mice 3 and 4. Mouse 1 has exactly 11867 excitatory and 1583 inhibitory neurons, the expected
    counts, so it is the example mouse. The matching keeps the lowest activity bin, as the median activity is zero for
