  notes: The dandiset holds 135 sessions (45, 48, 7, 35 per mouse, matching the paper's mice 1 to 4 by count). Median
    trials per session over all trials in the table are 213, 253, 264 and 222, the paper's values exactly; with a correct
    or incorrect choice they are 166, 190.5, 152 and 188. Means per session are 477.4 neurons, 330.0 excitatory and 41.0
