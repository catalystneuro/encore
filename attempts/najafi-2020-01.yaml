- claim: fig1b-psychometric
  outcome: reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:fig1b-psychometric
  notes: The logistic slope of high-rate choice on stimulus rate is positive in every mouse (0.082, 0.139, 0.210 and
    0.092 per Hz, all p below 1e-98). The 16 Hz trials (10, 122, 0 and 6 with a response) are rewarded on a random side,
    so their choice side is unknown and the fraction of high choices at 16 Hz that the criterion asks to report cannot
    be given; they are left out of the fit. The per-rate table is grouped on rates rounded to 1 Hz.
  deviations:
  - Only the 4 imaged mice are in the dandiset; Figure 1B uses 10.
  - Trials are those with trial_is_good true and a correct or incorrect response (the file's flag is false for every
    other response, as the notebook shows); trials without a choice-aligned trace (1982 of 25883) are left out.
  - 16 Hz trials are rewarded on a random side (Methods) and all carry trial_type High-rate, so their choice side is
    unknown; they are left out of every analysis (138 trials with a response). The trial table has no column for helped
    trials or the first trials of a session, and trial_is_good is exactly a correct or incorrect response, so the code's
    other exclusions (setTrs2rmv.m) could not be applied.
- claim: figs1b-trial-history
  outcome: blocked
  blocked_by: data_missing
  notes: The model needs the inter-trial interval (previous choice to current stimulus onset). The trial table gives
    start_time, stop_time and event times relative to each trial's own start (start_time -0.48 to 0.21 s over all trials),
    and the files hold no session clock or absolute trial times, so the ITI and its 7 s split cannot be formed. The stimulus-strength
    part of the model alone would not test the claim.
- claim: fig1gi-inferred-spiking-differs
  outcome: not_reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:fig1gi-inferred-spiking-differs
  measured:
  - 44546
  - 5530
  notes: Inhibitory activity is higher than excitatory activity in the bin before the choice in every mouse (ratios of
    day means 1.11 to 1.79). By the t-test across days, reading (a), p is 0.05, 8.7e-10, 0.1 and 0.03; on pooled neurons,
    reading (b), it is 0.0013, below 1e-300 (printed as 0), 8.2e-10 and 3.5e-05. So p < 0.001 holds in no reading for
    every mouse, mouse 1 missing at 0.0013 under (b). Under reading (a), p < 0.001 holds in 14 of 15 bins of mouse 2
    and no bin of the other mice, so no mouse has it in every bin. The criterion has no partial band. The pooled counts
    (44546 E, 5530 I) are within the expected 41723 +/- 4172 and 5142 +/- 514.
  deviations:
  - Correct trials; the time course is tested on the choice-aligned bins present in every session of a mouse (15 to 18
    bins).
- claim: fig2a-example-session
  outcome: not_reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:fig2a-example-session
  measured:
  - 11.5
  - 1.0
  notes: One session (mouse 4, 170625231642) has 285 excitatory and 29 inhibitory neurons. Over 20 repetitions of the
    50-shuffle rule, the median number of selective neurons is 11.5 excitatory and 1 inhibitory, against the expected
    24 and 5. The empirical-p variant gives 28 and 2.
