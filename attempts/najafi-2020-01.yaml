  - 0.1104
  notes: The dandiset holds 135 sessions (45, 48, 7, 35 per mouse, matching the paper's mice 1 to 4 by count). Median
    trials per session over all trials in the table are 213, 253, 264 and 222, the paper's values exactly; with
    a correct or incorrect choice they are 166, 195, 152 and 188. Means per session are 477.4 neurons, 330.0 excitatory
    and 41.0 inhibitory, all within tolerance. The inhibitory fraction is 0.1104 of excitatory plus inhibitory neurons,
    reading (b), within tolerance, and 0.0854 of all neurons, reading (a), outside.
  deviations:
  - Neurons are the good ROIs, the ones the traces hold. Trials per session are all trials in the table, reading
    (a), and the inhibitory fraction is over excitatory plus inhibitory neurons, reading (b); the other readings
    are shown.
- claim: fig1b-psychometric
  outcome: reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:fig1b-psychometric
  notes: The logistic slope of high-rate choice on stimulus rate is positive in every mouse (0.082, 0.139, 0.210
    and 0.092 per Hz, all p below 1e-98). The fraction of high-rate choices at exactly 16 Hz is 0.70 (10 trials),
    0.55 (122), none and 0.83 (6). Some files store non-integer pulse rates, so the per-rate table is grouped on
    rounded rates and is only indicative.
  deviations:
  - Only the 4 imaged mice are in the dandiset; Figure 1B uses 10.
  - Trials are those with trial_is_good true and a correct or incorrect response (the file's flag is false for every
    other response, as the notebook shows); trials without a choice-aligned trace (1983 of 26021) are left out.
- claim: figs1b-trial-history
  outcome: blocked
  blocked_by: data_missing
  notes: The model needs the inter-trial interval (previous choice to current stimulus onset). The trial table gives
    start_time, stop_time and event times relative to each trial's own start (start_time -0.48 to 0.21 s over all
    trials), and the files hold no session clock or absolute trial times, so the ITI and its 7 s split cannot be
    formed. The stimulus-strength part of the model alone would not test the claim.
- claim: fig1gi-inferred-spiking-differs
  outcome: partially_reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:fig1gi-inferred-spiking-differs
  measured:
  - 44546
  - 5530
  notes: Inhibitory activity is higher than excitatory activity in the bin before the choice in every mouse (ratios
    of day means 1.11 to 1.79). By the t-test across days, reading (a), p is 0.05, 7.5e-10, 0.1 and 0.031; on pooled
    neurons, reading (b), it is 0.0013, below 1e-300, 8.2e-10 and 3.7e-05. So p < 0.001 holds in 3 of 4 mice and
    mouse 1 misses at 0.0013. Under reading (a), p < 0.001 holds in 14 of 15 bins of mouse 2 and no bin of the other
    mice, so no mouse has it in every bin. The pooled neuron counts (44546 E, 5530 I) are within the expected 41723
    +/- 4172 and 5142 +/- 514.
  deviations:
  - Correct trials; the time course is tested on the choice-aligned bins present in every session of a mouse (15
    to 18 bins).
- claim: fig2a-example-session
  outcome: not_reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:fig2a-example-session
  measured:
  - 11.5
  - 1.0
  notes: One session (mouse 4, 170625231642) has 285 excitatory and 29 inhibitory neurons. Over 20 repetitions of
    the 50-shuffle rule, the median number of selective neurons is 11.5 excitatory and 1 inhibitory, against the
    expected 24 and 5. The empirical-p variant gives 28 and 2.
  deviations:
  - The ROC uses correct trials without 16 Hz trials (claims file); the example session has 31 and 37 such trials
    of each choice.
- claim: fig2bc-fraction-selective-similar
  outcome: not_reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:fig2bc-fraction-selective-similar
  measured:
  - 0.1288
  - 0.1719
  - 42.2
  - 6.8
  notes: The medians across mice of the fractions selective are E 0.1288 and I 0.1719, both within tolerance, and
    42.2 excitatory neurons per session is within tolerance; 6.8 inhibitory is above 6 +/- 0.6. The unpaired t-test
    across sessions finds a difference in mouse 4 (p = 0.013), as the paper reports, but also in mouse 2 (p = 0.040),
    where the criterion requires none; in both, inhibitory neurons are more often selective. The criterion has no
    band for medians that hold with a failed t-test, so the outcome is not reproduced. With the empirical-p variant
    only mouse 4 differs (p = 0.031), but the medians (0.212, 0.253) are then outside tolerance.
  deviations:
  - 127 of 135 sessions have at least 10 correct trials of each choice; 8 are left out.
  - The files name no lick side; choices are coded as the high-rate or low-rate side from trial_type and the outcome.
    Every measure used (AUC distance from 0.5, decoding accuracy, same or opposite preference) does not depend on
    which side is called left.
- claim: fig2bd-selectivity-time-course
  outcome: reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:fig2bd-selectivity-time-course
  notes: 'In the example mouse (mouse 1, 41 sessions) the fraction selective and the magnitude rise from the earliest
    bin to the bin before the choice for both types. Their peaks fall at bin 2 (E) and bin 1 (I), 97 to 291 ms after
    the choice: within 300 ms, reading (b), but not in the first bin after the choice, reading (a). Reading (b)
    is adopted as an assumption. Mice 2 and 4 peak at bins -1 to 3, and in mouse 3 inhibitory selectivity peaks
    early (bin -9 or -10, 7 sessions).'
  deviations:
  - The peak is judged on bins present in at least half of a mouse's sessions (a standard choice).
  - 'Assumption: "just after the choice" is read as within 300 ms after it, reading (b), the window of the confirmation
    lick in the Methods; the first bin after the choice, reading (a), fails, as the peak falls 97 to 291 ms after
    the choice. The claims file''s opening comment says a claim whose readings disagree is blocked; protocol step
    1.6 allows adopting the best-supported reading, which is done here.'
  assumed: true
