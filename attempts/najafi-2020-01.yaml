- claim: figs6de-incorrect-trials
  outcome: not_reproduced
  notebook: 02_decoders.ipynb
  output: claim:figs6de-incorrect-trials
  notes: Decoders trained on correct trials predict the choice on incorrect trials above the shuffle in mice 1 and 2
    for all three populations (p below 6e-6). In mice 3 and 4 they do not (mouse 3 p 0.086 to 0.7; mouse 4 accuracy 44.0
    to 47.8 percent, below the shuffle). The reduction from correct to incorrect trials does not differ between inhibitory
    and excitatory decoders in any mouse (p 0.278 to 0.993), and it is largest in mouse 4 for the all-neuron decoder (43.2
    points, others 7.4 to 8.6). The variant with at least 10 incorrect trials of each choice gives the same pattern for
    the cell-type decoders. The criterion has no partial band. Whether the criterion's above-shuffle rule in every mouse
    reads the paper correctly is asked of a reader (questions/najafi-2020.yaml).
  deviations:
  - The SVM regularisation is chosen from 10^-6 to 10^6 in steps of 1 in log10 where the code uses steps of 0.2, for
    runtime; on four sessions the accuracy differs by 0 to 0.44 points.
  - Excitatory populations are 5 random subsamples per session where the paper uses 50, for runtime.
  - The paper gives no minimum of incorrect trials; sessions with at least one incorrect trial of each choice are used,
    with at least 10 as a variant; both give the same pattern. Incorrect trials are z-scored with the correct-trial mean
