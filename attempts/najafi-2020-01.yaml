- claim: figs3e-correct-error-correlation
  outcome: partially_reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:figs3e-correct-error-correlation
  notes: In 94 sessions with at least 10 error trials of each choice, the mean correct-to-error AUC correlation
    is positive for both types in mice 1 to 3 (0.27 to 0.49). Mouse 4 has the lowest r for both types (E 0.041,
    I -0.027), so its inhibitory mean is not positive. No mouse shows a difference between the types (p = 0.14,
