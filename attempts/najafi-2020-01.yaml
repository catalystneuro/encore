- claim: fig3bc-decoding-similar
  outcome: reproduced
  notebook: 02_decoders.ipynb
  output: claim:fig3bc-decoding-similar
  notes: 'In every mouse the inhibitory and subsampled excitatory decoders are above their shuffles (p below 0.003),
    and they do not differ: mean accuracies E 65.2, 64.4, 60.1, 67.3 and I 64.7, 65.6, 58.8, 69.7 percent (p = 0.71,
    0.35, 0.66, 0.15). The all-neuron decoder reaches 73.3 to 87.0 percent.'
  deviations:
  - The SVM regularisation is chosen from 10^-6 to 10^6 in steps of 1 in log10 where the code uses steps of 0.2,
    for runtime; on four sessions the accuracy differs by 0 to 0.67 points.
  - Excitatory populations are 5 random subsamples per session where the paper uses 50, for runtime.
  - Choices are matched once per session by random subsampling; the paper does not say whether this is redone per
    repetition.
- claim: fig3b-decoding-time-course
  outcome: partially_reproduced
  notebook: 03_learning_decoders.ipynb
  output: claim:fig3b-decoding-time-course
  notes: In every mouse the all-neuron accuracy on correct trials rises from the earliest bin (59 to 70 percent)
    to the bin before the choice (72 to 86). The peak falls at bin 2 in mice 1 and 4 (within 300 ms, reading (b)),
    at bin 3 in mouse 2 (86.1 against 86.0 at bin 2) and at bin 6 in mouse 3. It is never in bins -1 or 0, reading
    (a). So the peak lies within 300 ms in two of four mice.
  deviations:
  - The SVM regularisation is chosen from 10^-6 to 10^6 in steps of 1 in log10 where the code uses steps of 0.2,
    for runtime; on four sessions the accuracy differs by 0 to 0.67 points.
  - The time courses train a decoder at every bin with the C chosen at bin -1 (the paper chooses C at every bin),
    with 25 random splits per bin (the paper 50), and 3 excitatory subsamples, for runtime.
  - C chosen at bin -1 could favour that bin; the peak still falls after it in every mouse.
