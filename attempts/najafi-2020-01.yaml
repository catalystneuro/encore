- claim: fig3bc-decoding-similar
  outcome: reproduced
  notebook: 02_decoders.ipynb
  output: claim:fig3bc-decoding-similar
  notes: In every mouse the inhibitory and subsampled excitatory decoders are above their shuffles (p below 0.003), and
    they do not differ. Mean accuracies are E 65.3, 64.3, 60.2, 67.2 and I 64.6, 66.1, 58.9, 69.6 percent (p = 0.671,
    0.185, 0.64, 0.153). The all-neuron decoder reaches 73.3 to 87.2 percent.
  deviations:
  - The SVM regularisation is chosen from 10^-6 to 10^6 in steps of 1 in log10 where the code uses steps of 0.2, for
    runtime; on four sessions the accuracy differs by 0 to 0.44 points.
  - Excitatory populations are 5 random subsamples per session where the paper uses 50, for runtime.
  - Choices are matched once per session by random subsampling; the paper does not say whether this is redone per repetition.
  - 16 Hz trials are rewarded on a random side (Methods) and all carry trial_type High-rate, so their choice side is
    unknown; they are left out of every analysis (138 trials with a response). The trial table has no column for helped
    trials or the first trials of a session, and trial_is_good is exactly a correct or incorrect response, so the code's
    other exclusions (setTrs2rmv.m) could not be applied.
- claim: fig3b-decoding-time-course
  outcome: not_reproduced
  notebook: 03_learning_decoders.ipynb
  output: claim:fig3b-decoding-time-course
  notes: With C chosen at bin -1 and 25 splits (03), all-neuron accuracy on correct trials rises from the earliest bin
    (59.4 to 70.2 percent) to the bin before the choice (72.4 to 86.4) in every mouse; the peak falls at bin 2 in mice
    1 and 4, bin 3 in mouse 2 (86.6) and bin 6 in mouse 3. With C chosen at every bin and 50 splits (04, mice 1, 2 and 3), mouse
    1 peaks at bin 3 (89.5, next 88.5), mouse 2 at bin 2 (88.4, next 88.2) and mouse 3 at bin 6 (83.6). The peak
    is never in bins -1 or 0, reading (a), and in mouse 3 it lies outside 300 ms, reading (b), under both C rules, so
    the claim fails under both readings; the criterion has no partial band.
  deviations:
  - The SVM regularisation is chosen from 10^-6 to 10^6 in steps of 1 in log10 where the code uses steps of 0.2, for
    runtime; on four sessions the accuracy differs by 0 to 0.44 points.
  - The time courses train a decoder at every bin with the C chosen at bin -1 (the paper chooses C at every bin), with
    25 random splits per bin (the paper 50), and 3 excitatory subsamples, for runtime.
  - C chosen at bin -1 could favour that bin; the peak still falls after it in every mouse.
  - Notebook 04 repeats the test for mice 1, 2 and 3 with C chosen at every bin and 50 splits (claims file, opening
    comment), on the earliest bin and bins -3 to the last, for runtime; mouse 4 is not repeated.
- claim: fig3df-weights-similar
  outcome: partially_reproduced
  notebook: 02_decoders.ipynb
  output: claim:fig3df-weights-similar
  measured:
  - 42019
  - 5172
  notes: At 0-97 ms before the choice (02), the mean |w| of unit-length weight vectors of the all-neuron decoder does
    not differ between types in any mouse across sessions (p = 0.75, 0.051, 0.32, 0.13). Per bin (03, the time-course
    decoders with C chosen at bin -1), inhibitory weights are larger in 12 of 25 bins of mouse 2 (smallest p 0.0041)
    and in 1 of 25 bins of mouse 4 (p = 0.012), and no bin differs in mice 1 and 3 (smallest p 0.10 and 0.14). So two
    mice differ in part of the trial, the criterion's partial band. With C chosen at every bin and 50 splits (04, mice
    1, 2 and 3), no bin differs in mice 1 and 3 (smallest p 0.171 and 0.0851) and inhibitory weights are larger in 3
    of 12 bins of mouse 2 (smallest p 0.0222), so the band is the same under that C rule; mouse 4 was not repeated.
    The pooled counts, 42019 excitatory and 5172 inhibitory neurons, equal the expected values.
  deviations:
  - The SVM regularisation is chosen from 10^-6 to 10^6 in steps of 1 in log10 where the code uses steps of 0.2, for
    runtime; on four sessions the accuracy differs by 0 to 0.44 points.
  - The per-bin weights come from the time-course decoders of 03, with C chosen at bin -1 and 25 splits (the paper chooses
    C at every bin, 50 splits), for runtime. Notebook 04 repeats them for mice 1, 2 and 3 with C chosen at every bin and
    50 splits, on the earliest bin and bins -3 to the last.
