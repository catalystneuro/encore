  assumed: true
- claim: fig7-noise-correlations-limit-decoding
  outcome: reproduced
  notebook: 02_decoders.ipynb
  output: claim:fig7-noise-correlations-limit-decoding
  notes: Pseudo populations raise the all-neuron accuracy in every mouse on correct trials, by a mean of +5.38,
    +5.77, +4.32 and +5.44 points. Reading (a), the one-sample test of the per-session changes, is significant in
    every mouse (p = 5.3e-10, 1.5e-13, 0.011, 5e-11). Reading (b), the unpaired test, fails in mouse 3 (p = 0.32,
    7 sessions). Reading (a) is adopted as an assumption. With all trials with a choice, the changes are +4.9 to
    +6.7 points (mouse 3 p = 0.08 by reading (a)).
  deviations:
  - The SVM regularisation is chosen from 10^-6 to 10^6 in steps of 1 in log10 where the code uses steps of 0.2,
    for runtime; on four sessions the accuracy differs by 0 to 0.67 points.
  - Only the largest ensemble, all neurons, is computed, as the criterion's change is taken there; the neuron ranking
    does not change it.
  - Pseudo populations are built by shuffling each neuron's trials within each choice on the whole trial set at
    every split, so training and test trials are both pseudo trials.
  - 'Assumption: the change is tested by the one-sample t-test of the per-session changes, reading (a); the unpaired
    test, reading (b), fails in mouse 3 (7 sessions).'
  assumed: true
