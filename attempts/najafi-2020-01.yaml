- claim: fig2bc-fraction-selective-similar
  outcome: not_reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:fig2bc-fraction-selective-similar
  measured:
  - 0.1288
  - 0.1719
  - 42.2
  - 6.8
  notes: The medians across mice of the fractions selective are E 0.1288 and I 0.1719, both within tolerance, and 42.2
    excitatory neurons per session is within tolerance; 6.8 inhibitory is above 6 +/- 0.6. The unpaired t-test across
    sessions finds a difference in mouse 4 (p = 0.01335), as the paper reports, but also in mouse 2 (p = 0.04023), where
    the criterion requires none; in both, inhibitory neurons are more often selective. Neither the reproduced band nor
    the partial band (t-tests only) holds. With the empirical-p variant only mouse 4 differs (p = 0.03105), but the medians
    (0.2120, 0.2528) are then outside tolerance. Over 10 further seeds of the 50 shuffles mouse 2 has p < 0.05 in 4 of
    10 (p 0.0178 to 0.0913, median 0.0517) and mouse 4 in all 10, with the medians within tolerance in every seed, so
    the criterion's band is reproduced in 6 seeds and not reproduced in 4. The outcome is that of the main draw, which
    lies on the not-reproduced side; it is not stable across seeds.
  deviations:
  - 127 of 135 sessions have at least 10 correct trials of each choice; 8 are left out.
  - The files name no lick side; choices are coded as the high-rate or low-rate side from trial_type and the outcome.
    Every measure used (AUC distance from 0.5, decoding accuracy, same or opposite preference) does not depend on which
    side is called left.
  - 16 Hz trials are rewarded on a random side (Methods) and all carry trial_type High-rate, so their choice side is
    unknown; they are left out of every analysis (138 trials with a response). The trial table has no column for helped
    trials or the first trials of a session, and trial_is_good is exactly a correct or incorrect response, so the code's
    other exclusions (setTrs2rmv.m) could not be applied.
- claim: fig2bd-selectivity-time-course
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:fig2bd-selectivity-time-course
  notes: In the example mouse (mouse 1, 41 sessions) the fraction selective and the magnitude rise from the earliest
    bin to the bin before the choice for both types. Their peaks fall at bin 2 for excitatory (0.182, 0.164) and bin
    1 for inhibitory (0.201, 0.172), 97 to 291 ms after the choice. Under reading (b), within 300 ms after the choice,
    the claim is reproduced; under reading (a), the first bin after the choice, it is not reproduced. The readings give
    different outcomes, so the claim is blocked. In mouse 2 inhibitory peaks fall at bin 3 (291 to 388 ms), in mouse
    4 three of four peaks fall at bin -1, and in mouse 3 inhibitory selectivity peaks at bin -9 or -10 (7 sessions).
    The question of the window is for the paper's authors (finding).
  deviations:
  - The peak is judged on bins present in at least half of a mouse's sessions (a standard choice).
- claim: fig2de-selectivity-magnitude-similar
  outcome: partially_reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:fig2de-selectivity-magnitude-similar
  notes: At 0-97 ms before the choice, mean selectivity does not differ between the types in mice 1, 2 and 3 (p = 0.144,
    0.071, 0.98) and differs in mouse 4 (I - E = +0.0186, p = 0.021). The criterion's partial band is one mouse. In the
    time course, 0, 5, 0 and 9 bins of mice 1 to 4 differ at p < 0.05.
- claim: figs3d-same-spiking-selectivity
  outcome: reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:figs3d-same-spiking-selectivity
  notes: Among neurons in the activity bin holding the most inhibitory neurons (median 265 E and 22 I per session) no
    mouse shows a difference in mean selectivity (p = 0.18, 0.75, 0.88, 0.55) or in the fraction selective (p = 0.13,
    0.45, 0.51, 0.20), so the mouse 4 difference of fig2de is gone. The median activity is zero for 99.45 to 100 percent
    of neurons, so this match keeps the bin at zero, and in mouse 2 the kept inhibitory neurons stay more active than
    the kept excitatory ones (I - E +0.0003, p = 0.016). Matched on mean activity instead (median 81 E and 8 I per session,
    I - E activity p = 0.19 to 0.78), no mouse differs either (selectivity p = 0.68, 0.98, 0.14, 0.66; fraction p = 0.32,
    0.62, 0.51, 0.84).
  deviations:
  - The 50 bins span the range of the medians of excitatory and inhibitory neurons of the session (Methods do not say
    over which neurons the range is taken; a standard choice).
