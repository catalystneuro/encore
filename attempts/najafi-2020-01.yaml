- claim: fig7-noise-correlations-limit-decoding
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: 02_decoders.ipynb
  output: claim:fig7-noise-correlations-limit-decoding
  notes: Pseudo populations raise the all-neuron accuracy in every mouse under both trial sets, on correct trials by
    +5.38, +5.45, +4.32 and +5.27 points and on all trials with a choice by +6.79, +5.21, +4.88 and +6.11. On correct
    trials with the one-sample test, reading (a), the change is significant in every mouse (p = 4e-10, 9.9e-12, 0.011,
    6.2e-10), so that reading gives reproduced. Each of the other three readings fails in mouse 3 (correct trials unpaired
    p = 0.32; all trials one-sample p = 0.08 and unpaired p = 0.25), so they give not reproduced. The readings differ,
