- claim: figs3e-correct-error-correlation
  outcome: not_reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:figs3e-correct-error-correlation
  notes: In 94 sessions with at least 10 error trials of each choice the mean correct-to-error AUC correlation is positive
