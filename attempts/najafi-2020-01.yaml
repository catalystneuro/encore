- claim: figs6de-incorrect-trials
  outcome: partially_reproduced
  notebook: 02_decoders.ipynb
  output: claim:figs6de-incorrect-trials
  notes: Decoders trained on correct trials predict the choice on incorrect trials above the shuffle in mice 1 and
    2 for all three populations (p below 3e-6). In mice 3 and 4 they do not (mouse 3 p 0.12 to 0.69; mouse 4 accuracy
    44 to 47 percent, below the shuffle). The reduction from correct to incorrect trials does not differ between
    inhibitory and excitatory decoders in any mouse (p 0.31 to 0.95). It is largest in mouse 4 for the all-neuron
    decoder (43.0 points, others 8.4 to 8.6). The variant with at least 10 incorrect trials of each choice gives
    the same pattern.
