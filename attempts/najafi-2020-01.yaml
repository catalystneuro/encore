  deviations:
  - Noise correlations use all trials with a choice; preference from the correct-trial AUC without 16 Hz trials
    (claims file).
  - The files name no lick side; choices are coded as the high-rate or low-rate side from trial_type and the outcome.
    Every measure used (AUC distance from 0.5, decoding accuracy, same or opposite preference) does not depend on
    which side is called left.
- claim: fig6bc-inhibitory-correlations-higher
  outcome: reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:fig6bc-inhibitory-correlations-higher
  measured:
  - 11867
  - 1583
  notes: II noise correlations exceed EE in every mouse for noise, spontaneous and activity-matched correlations
    on pooled neurons, reading (b), the code's (largest p 5.8e-10), with EI between them in every case. Across sessions,
    reading (a), II exceeds EE in every mouse for noise correlations, but not for spontaneous correlations in mouse
