findings:
- kind: metadata_error
  statement: 'The trial-segmented traces under processing/Ophys/dFoF_* are named and typed as Delta F/F (DfOverF), but
    their values are the normalised inferred spiking activity the paper analyses: sparse, 90 percent of values below
    1e-6, each neuron''s maximum 1.'
- kind: data_missing
  statement: No fluorescence trace (Delta F/F or CNMF denoised) is in the files, so the paper's analysis of raw calcium
    traces (Figure S5) cannot be repeated; the raw movies and the histology are not in the dandiset either.
- kind: metadata_error
  statement: The starting_time of every trial series carries an attribute named rate whose value, 0.0324, is the frame
    interval in seconds, not a rate; the imaging plane states 30 Hz.
- kind: data_missing
  statement: Trial times are relative to each trial's own start (start_time -0.48 to 0.21 s) and the files hold no session
    clock, so inter-trial intervals, which the paper's behavioural model uses, cannot be computed.
- kind: metadata_insufficient
  statement: The lick trace (firstSideTryAl_lick) is 0 or 1 per ms with no spout identity, and no field gives the side
    of the choice; the side must be inferred from trial_type and the response, and centre-spout licks cannot be separated.
- kind: metadata_insufficient
  statement: The NWB session_id is the timestamp of the CNMF run (for example 161227154657), not the recording; the recording
    date and file number are only in session_description and session_start_time.
- kind: other
  statement: trial_pulse_rate is an integer in some files and a non-integer rate (for example 5.335 Hz) in others, with
    no description of the difference.
- kind: metadata_insufficient
  statement: The ROI table columns fitness, roi2surr_sig and offsets_ch1_pix have empty descriptions, and roi2surr_sig
    and offsets_ch1_pix hold the minimum int64 as a fill value.
- kind: other
  statement: The dandiset metadata lists no species and only a behavioural measurement technique, and its related publication
    in the files is the bioRxiv preprint (10.1101/354340), not the Neuron paper.
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: is the peak of choice selectivity (Figure 2B, D) meant to lie in the
    first bin after the choice, or within the 300 ms of the confirmation lick? Here it falls 97 to 291 ms after the choice
    in the example mouse.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: are the noise-correlation comparisons of Figure 6C and S10 tested across
    days or on neurons pooled over days? The code tests pooled neurons; across days, spontaneous and matched-activity
    correlations do not differ in mouse 3, or in mice 1 and 3, at p < 0.05.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: is the change in accuracy of pseudo populations (Figure 7B) tested by
    a one-sample test of the per-session changes or by an unpaired test of pseudo against real accuracy? The second fails
    in mouse 3.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: do the learning decoders of Figure 8 use all trials balanced by choice
    or equal numbers of correct and incorrect trials within each choice? The comparison of cell types in late days of
    mouse 2 depends on it.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: are the early and late days of Figure 8, S12 and S13 every day below
    the 20th or above the 80th percentile of performance (the code''s perc_thb), or only the run of such days at the
    start and end of training? Here the second gives 0 or 1 day in most learning mice, so the learning outcomes rest
    on the first, as an assumption.'
- kind: metadata_insufficient
  statement: The trial table has no column for helped trials or for the first trials of a session, and trial_is_good
    is true exactly for a correct or incorrect response, so the paper's code's trial exclusions (setTrs2rmv.m) cannot
    be repeated.
- kind: metadata_insufficient
  statement: 16 Hz trials are rewarded on a random side, and their trial_type is always High-rate, so the side the mouse
    licked on these trials cannot be recovered from the files.
