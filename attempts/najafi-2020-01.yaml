- claim: fig6a-same-selectivity-correlations
  outcome: reproduced
  notebook: 01_single_neurons_correlations.ipynb
  output: claim:fig6a-same-selectivity-correlations
  notes: By the code's t-test on pooled neurons, noise correlations are higher between neurons of the same preference
    than of opposite preference for EI, EE and II pairs in every mouse (largest p 0.00017). Spontaneous correlations
    before the initiation tone show the same pattern in every mouse and pair type (largest p 0.012). Mouse 3 is
