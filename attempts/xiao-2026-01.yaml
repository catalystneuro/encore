- claim: si-unit-yield
  outcome: reproduced
  notebook: reproduce_xiao_2026.ipynb
  output: claim:si-unit-yield
  measured:
  - 1160
  - 36
  notes: The deposit holds all 1,358 sorted units from 36 mice. 1,188 are not low-firing (the same 170
    low-firing units as the deposit's low_firing column), and 1,160 of these have ISI false alarms at
    most 2%, within 114.1 of 1,141; all 36 mice keep at least one unit. With an SNR computed from the
    raw voltage (an approximation), SNR >= 5 leaves 1,034 units from 36 mice, also within tolerance (1,144
    at SNR >= 3, 1,108 at 4, 895 at 6), and 1,030 when the units flagged by the Methods' duplicate rule
    (9 pairs with r > 0.1 in 1-ms bins) are dropped too. The 18 units the BH-FDR reading calls responsive
    and the deposit does not have median SNR 4.22 (12 below 5) against 7.91 for the responsive units the
    deposit labels. By the same approximation 75 of the 768 deposit-labelled responsive units passing
    ISI and firing also have SNR below 5, so the low SNR of the 18 units is compatible with an SNR criterion
    in the deposit's labels but does not show one.
  deviations:
  - The SNR criterion (Methods, Isolation of Single Unit Activity) is not applied to the analysed population,
    as the SNR can be computed here only approximately (the processed files hold no waveforms, and the
    SNR below comes from short stretches of raw voltage under an assumed definition); units are the 1,160
    that pass the ISI criterion (at most 2% of intervals under 0.8 ms) and are not low-firing. An SNR
    computed from the raw voltage (peak-to-trough amplitude of the mean waveform on the peak channel over
    the SD of single spikes about it, over 16 chunks per session; an assumption, as the paper does not
    say how amplitude and noise are measured) is shown as a variant of the unit count only.
- claim: fig2-wall-responsive-counts
  outcome: reproduced
  notebook: reproduce_xiao_2026.ipynb
  output: claim:fig2-wall-responsive-counts
  measured:
  - 782
  - 541
  - 337
  - 96
  notes: 'Under the BH-FDR test (one-tailed signed-rank at each distance, BH-FDR over the nine distances
    of each direction, q < 0.05) 782 of 1,160 units are responsive, 541 activated, 337 suppressed and
    96 both, all within tolerance of 768, 532, 333 and 97. The classification reproduces the deposit''s
    own labels unit for unit except for 41 units that the deposit calls unresponsive (23 of them fail
    the ISI criterion) and 12 units in other off-diagonal cells of the crosstab (data check). The uncorrected
    variant gives 1,061, 751, 657 and 347, all outside tolerance. Answer to questions/001687.yaml: the
    claims file now makes the BH-FDR responsiveness test (q < 0.05 across the nine distances, from Fig2DEF_Pop_Heatmap_Hist_Pie.m)
    the main reading and the uncorrected test the variant; this changed the outcome from not reproduced,
    judged on the uncorrected test, to reproduced. Pass-set variants (after verification round 1): with
    the deposit''s one distance per 2-mm bin in the two 1-mm-step sessions (the distance nearest the bin
    centre, which reproduces the deposit''s stored curves exactly) the counts are 783, 544, 337 and 98;
    with the 20 and 50 post-gap trials of 20230711_sp_session_1 and 20230608_sp_session_1 dropped they
    are 781, 539, 337 and 95; all within tolerance.'
  deviations: &id001
  - The SNR criterion (Methods, Isolation of Single Unit Activity) is not applied to the analysed population,
    as the SNR can be computed here only approximately (the processed files hold no waveforms, and the
    SNR below comes from short stretches of raw voltage under an assumed definition); units are the 1,160
    that pass the ISI criterion (at most 2% of intervals under 0.8 ms) and are not low-firing. An SNR
    computed from the raw voltage (peak-to-trough amplitude of the mean waveform on the peak channel over
    the SD of single spikes about it, over 16 chunks per session; an assumption, as the paper does not
    say how amplitude and noise are measured) is shown as a variant of the unit count only.
  - Distance bins pool every pass inside each 2-mm bin (Methods, Wall Distance Tuning Curve Calculation,
    'uniformly binning distance measurements into nine 2-mm-wide bins'); in the two 1-mm-step sessions
    (20221212_sp_session_2, 20221213_sp_session_2) the deposit's tuning curves use one distance per bin.
  - Paired signed-rank tests truncate each distance bin to the smallest number of passes across bins,
    in time order, taken from the code, which truncates 20221213_sp_session_2 to 17 and 20230131_sp_session_2
    to 19 repetitions (Fig2DEF_Pop_Heatmap_Hist_Pie.m).
  - Signed-rank p-values follow MATLAB signrank (zeros dropped, exact for up to 15 non-zero differences,
    else the normal approximation with continuity correction), a standard choice matching the paper's
    software.
