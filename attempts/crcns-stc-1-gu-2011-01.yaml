- claim: fig4dh-training-no-sensitivity-change
  outcome: blocked
  blocked_by: data_missing
  notes: Depends on fig4dh-lateral-more-sensitive; no naive single units in the data set.
- claim: figs4-population-sensitivity-any-reference
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the naive and trained single-electrode database; only 129 trained units are in the
