- claim: methods-single-vs-multiple-electrodes
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: No pair carries an electrode label. Ten file_ids of monkey 17 end in "s", which the data
    descriptor does not explain; the paper's 67 single-electrode pairs cannot be identified. The 52
    pairs over 1 mm, needed for the reading over all 179 pairs, are not in the data set either.
- claim: fig2a-behavioral-learning
  outcome: blocked
  blocked_by: data_missing
  notes: The training histories are not in the data set. Experiment 2 holds one threshold per
    animal for two of the five trained monkeys (vestibular 1.2 and 3.1 degrees, both inside 0.9 to
    3.3), not the thresholds over sessions the criterion fits.
- claim: fig4-tuning-width-visual
  outcome: blocked
  blocked_by: data_missing
  notes: The single-electrode database of 992 and 556 neurons is not in the data set. Experiment 1
    holds the tuning curves of 129 units of two trained monkeys only, so naive and trained cannot be
    compared.
- claim: fig4-tuning-width-vestibular
  outcome: blocked
  blocked_by: data_missing
  notes: As fig4-tuning-width-visual.
- claim: fig4-amplitude-unchanged
  outcome: blocked
  blocked_by: data_missing
  notes: As fig4-tuning-width-visual.
- claim: fig4dh-lateral-more-sensitive
  outcome: blocked
  blocked_by: data_missing
  notes: The criterion's factorial ANOVA needs naive and trained neurons from the single-electrode
