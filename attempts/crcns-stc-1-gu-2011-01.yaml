- claim: figs6-task-independent
  outcome: blocked
  blocked_by: data_missing
  notes: Noise correlations during the discrimination task are not in the data set.
- claim: figs8ab-eye-movements
  outcome: blocked
  blocked_by: data_missing
  notes: Eye position records are not in the data set.
findings:
- kind: data_missing
  statement: The data set holds derived values only. For the paper's pairs there are no spike times
    or trial responses, no interneuronal distances, none of the 52 pairs over 1 mm, no
    discrimination-task correlations and no eye records; the single-electrode database of Figures
    4, S4 and 8A is represented only by 129 units of two trained monkeys, and the training histories
    of Figure 2A by one threshold for each of two monkeys. Eighteen of the 35 claims cannot be
    tested.
- kind: metadata_insufficient
  statement: No pair or monkey carries a naive or trained label, which every comparison in the
    paper needs. The groups can be recovered here only because the paper's per-animal pair counts
    are all distinct and match the counts per monkey in the file_ids.
- kind: metadata_insufficient
  statement: No pair carries an electrode or distance label, and ten file_ids of monkey 17 end in
    "s" without explanation, so the single-electrode and multi-electrode pairs cannot be told
    apart.
- kind: metadata_insufficient
  statement: The data descriptor does not say how heading_pref was computed, how cp is signed
    (relative to the unit's preferred direction or to a fixed choice), or the units of resp_global
    (demo.m labels them spikes/s).
- kind: metadata_error
  statement: The data descriptor lists monkeys 1, 2, 3, 5, 17, 18 and 19 for the 127 MSTd pairs; the
    file_ids name an eighth, monkey 24, with two pairs, the trained animal with two pairs of the
    paper's Figure S2B.
- kind: other
  statement: Recording m19c21r1 holds six pairs from four units, where the paper states a maximum of
    five pairs in an experiment (Experimental Procedures, Electrophysiological Recordings).
- kind: methods_unavailable
  statement: Question for the paper's authors. Is the pooled rnoise of Figure 2B and Figure 5 the
    correlation of z-scores pooled over both conditions (which the mean of the two per-condition
    values in the data set approximates, matching 0.023 and 0.116 to the third decimal), and do the
    stored per-condition values include the renormalization in blocks of 20 trials?
- kind: methods_unavailable
  statement: Question for the paper's authors. What tuning amplitude, baseline and counting window
    were used in the simulations of Figures 6 and 7, and was the trace term of equation 3 included?
    With amplitude 30 and baseline 10 spikes/s over 1 s and the trace term, the naive threshold is
    5.4 times the independent one at 2000 neurons, but the best trained improvement in Figure 7C is
    4.8%, not 8%; without the trace term it is 9.2 times and up to 11.8%.
- kind: methods_unavailable
  statement: Question for the paper's authors. How were the 95% intervals of the intercepts in
    Figure 5D computed? Separate per-group fits, the ANCOVA model with interaction and the
    common-slope model all give overlapping intervals on the 127 pairs of the data set.
- kind: methods_unavailable
  statement: Question for the paper's authors. For Figure 8A and 8B, how was each unit's preferred
    heading computed, which units entered the 311 values, and how was CP signed? On the 129 units of
    the data set neither the vector sum nor the spline peak gives fore-aft CPs smaller than lateral
    ones (p = 0.80 and 0.14).
verifications:
- date: '2026-11-06'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The first executed notebook with the conclusion cells and the summary removed, the
    helper module and the claims file, with the paper. The verifier checked the archive listing for the
    blocked claims and tested the helper functions on synthetic inputs (tls_plane, threshold,
    sigma_for_fwhm, preference_group, pref_spline_peak, pref_vector_sum, pooled_rnoise). Report in
    transcripts/crcns-stc-1/verifier-1-report.md.
  results:
  - claim: training-group-link
    agrees: true
    outcome: reproduced
    reason: In cell 13 the eight per-monkey counts match the Figure S2B counts one to one, giving 89
      trained and 38 naive pairs and 146 and 64 units; monkeys 2 and 5, the ones with behavioural
      thresholds, both fall in the trained group. The 89/38 split follows from matching by count, so
      only the neuron counts and the behaviour check are independent tests.
    response: No change.
  - claim: fig2b-trained-lower-noise-correlation
    agrees: true
    outcome: reproduced
    reason: Trained 0.0241 +- 0.0174, naive 0.1190 +- 0.0316, both within tolerance; Student p =
      0.0056 (paper 0.006), Welch p = 0.011. It checked on synthetic data that the pooled-z-score
      Pearson equals the mean of the per-condition values with equal trial numbers and no outliers;
      whether the stored values include outlier removal or renormalization cannot be told (problem
      5, not affecting a conclusion).
    response: No change; the assumption and its limits were already stated.
  - claim: figs2b-individual-animals
    agrees: true
    outcome: reproduced
    reason: The lowest naive animal mean (0.088) is above the highest mean among the trained animals
      shown (0.048), with counts 35/26/18/8 and 22/11/5. There are no time courses because the data
