- claim: overdispersion-passes
  outcome: not_reproduced
  notebook: reproduce_talbot_2018.ipynb
  output: claim:overdispersion-passes
  measured:
  - 3.69
  - 3.55
  - 12802
  - 18521
  notes: R2, consecutive 5 s intervals. 12,802 WT and 18,521 Fmr1-null passes, variance of z 3.69 and
    3.55 (expected 5.81 and 4.89). The F test finds WT larger (F = 1.04, one-sided p = 0.008) but Levene's
    test does not (p = 0.998). In R1 the Fmr1-null variance is the larger (3.83 against 3.53). With a
    1 s step, F one-sided p = 0.007 and Levene p = 0.61. With the count rule (exp at least the average
    rate x 5 s, 33% of intervals pass) R2 gives 5,442 and 8,250 passes, variances 5.28 and 4.66, both
    within tolerance, F = 1.13 (one-sided p < 0.0001) and Levene p = 0.0006, which meets the criterion
    (the WT pass count is outside 6,776 +/- 678); in R1 it gives Fmr1-null the larger variance (5.16
    against 5.00). The outcome stays on the claims file's literal rule; the rule is asked of a reader.
    Under the literal rule neither the refractory filter (variances 3.71 and 3.55, Levene p = 0.86) nor
    the code's 32 x 32 grid (3.73 and 3.73, F one-sided p = 0.49) changes the result. Under the count
    rule the filter leaves both variances within tolerance (Levene p = 0.0004); on the grid variances
    (5.34, 4.89) and pass counts (6,712, 9,607) are within tolerance, F one-sided p = 0.0001, but Levene
    p = 0.052.
  deviations:
  - The data set has no isolation measures (IsoIBG, IsoINN) or waveforms, so every sorted cluster other
    than cluster 0 is used in place of the paper's well-isolated cells, and cells are classified by rate
    and bursting without waveform width.
  - The spatial scale is assumed from the extent of the tracked positions and the enclosure sizes of the
    STAR Methods (large box 50 cm, arena 40 cm); the data set gives none.
  - The session that classifies a cell ('standard recordings') is open; R1 (each cell from its first stationary
    session) and R2 (each stationary session on its own) are both run, and a cluster name within a day's
    cut file is taken as one cell.
  - Levene's test is centred on the mean, as the original test is.
  - The pass rule is read literally, as the claims file does (exp, a count, at least the cell's average
    rate in AP/s); it passes a median 76% of a cell's 5 s intervals. The count expected at the average
    rate over 5 s is shown as a variant; which is meant is asked of a reader (questions/crcns-hc-16.yaml).
