    change class on it.
- claim: figs3-nonspatial-properties-similar
  outcome: partially_reproduced
  notebook: reproduce_talbot_2018.ipynb
  output: claim:figs3-nonspatial-properties-similar
  notes: Two-way genotype x class ANOVA on 381 classified clusters (R1). No genotype effect for burst
    probability (p = 0.13) or the interspike interval (mean p = 0.40, median p = 0.63), but one for the
    overall rate (F = 8.28, p = 0.0042, partial eta squared 0.022), from faster Fmr1-null interneurons
    (11.5 against 7.3 AP/s). In R2 (547 clusters) burst probability also differs (p = 0.029) and the rate
    (p = 0.0005). With the refractory filter the rate effect is not significant (R1 p = 0.070, R2 p =
    0.057), so that no measure differs in R1, but burst probability differs in R2 (p = 0.0037). Waveform
    width is not in the data set and is not tested.
  deviations:
  - The data set has no isolation measures (IsoIBG, IsoINN) or waveforms, so every sorted cluster other
    than cluster 0 is used in place of the paper's well-isolated cells, and cells are classified by rate
    and bursting without waveform width.
  - The session that classifies a cell ('standard recordings') is open; R1 (each cell from its first stationary
    session) and R2 (each stationary session on its own) are both run, and a cluster name within a day's
    cut file is taken as one cell.
  - Waveform width cannot be measured; the claim is judged on three of its four measures.
- claim: fig2-spatial-quality-similar
  outcome: not_reproduced
  notebook: reproduce_talbot_2018.ipynb
  output: claim:fig2-spatial-quality-similar
  notes: Large box, 213 classified clusters. Genotype effects for coherence (F = 9.01, p = 0.0030), active
    pixels (F = 18.7, p < 0.0001), information (F = 7.27, p = 0.0076) and the number of fields above the
    mean rate (p = 0.011), with interactions for coherence and active pixels (p = 0.0077, 0.0098), mostly
    from interneurons. In-field rate (p = 0.11, 0.42) and the count of fields above 20% of the peak (p
    = 0.48) show none. The class effect is significant for every measure (p <= 0.0004). The genotype
    effects on coherence, active pixels and information remain on the code's 32 x 32 grid (p = 0.0003,
    0.0016, 0.0073) and with the refractory filter (p = 0.0084, 0.0001, 0.013).
  deviations:
  - The data set has no isolation measures (IsoIBG, IsoINN) or waveforms, so every sorted cluster other
    than cluster 0 is used in place of the paper's well-isolated cells, and cells are classified by rate
    and bursting without waveform width.
  - The spatial scale is assumed from the extent of the tracked positions and the enclosure sizes of the
    STAR Methods (large box 50 cm, arena 40 cm); the data set gives none.
  - Only the large box is in the data set; the small-box and both-box readings cannot be run.
