- claim: unit-and-cell-counts
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_talbot_2018.ipynb
  output: claim:unit-and-cell-counts
  notes: The data set holds 8 WT mice (M1, M3, M11, M16, M28, M32, M35, M36) and 7 Fmr1-null mice (M9,
    M10, M18, M29, M33, M34, M37) of the paper's 12 (or 11) and 9, so it is a subset and its counts
    cannot test the paper's. The well-isolated cells cannot be selected either, as no isolation measure
    is given (metadata_insufficient). For the record, the cluster counts are within 10% of 499 and 616
    only when every session is counted on its own with cluster 0 included (490 WT, 557 Fmr1-null), which
    with 15 of 21 mice is a coincidence; counted once per cut file without cluster 0 they are 203 and
    294.
  deviations:
  - Clusters are counted from the file names; the paper's isolation criterion cannot be applied.
- claim: interneuron-proportion
  outcome: partially_reproduced
  notebook: reproduce_talbot_2018.ipynb
  output: claim:interneuron-proportion
  measured:
  - 33.5
  - 44.5
  notes: Interneurons (rate above 2 AP/s) are 68 of 203 WT clusters (33.5%) and 106 of 238 Fmr1-null clusters
    (44.5%) in R1, and 35.4% and 48.5% in R2; with the classified cells as denominator 38.6% to 41.4%
    and 51.7% to 55.7%. Every percentage is far outside 12.4 +/- 1.24 and 29.3 +/- 2.93. The direction
    holds under every reading and is significant in the main ones (R1 z = -2.36, p = 0.018; R2 z = -3.33,
    p = 0.0009); with the refractory filter (clusters with at most 0.5% of ISIs below 2 ms) p = 0.092
    in R1 and 0.023 in R2. The effect is present but the percentages are not the paper's, so partially
    reproduced. Only 70 of 774 clusters have more than 0.5% of ISIs below 2 ms and the filter changes
    the percentages by at most 4.9 points, so this filter does not remove the excess. It is a weak proxy
    for the isolation measures (interneuron rates are still 4.34 and 6.95 AP/s at the median in R1),
    so whether poorly isolated clusters explain the excess cannot be told from these data.
  deviations:
  - The data set has no isolation measures (IsoIBG, IsoINN) or waveforms, so every sorted cluster other
    than cluster 0 is used in place of the paper's well-isolated cells, and cells are classified by rate
    and bursting without waveform width.
  - The session that classifies a cell ('standard recordings') is open; R1 (each cell from its first stationary
    session) and R2 (each stationary session on its own) are both run, and a cluster name within a day's
    cut file is taken as one cell.
  - Rate alone and rate with bursting give the same interneurons, as the rate decides it.
  - A refractory filter (at most 0.5% of ISIs below 2 ms, a standard choice) is shown as a proxy for
    the isolation measures the data set lacks.
- claim: place-cell-proportion
