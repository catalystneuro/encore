outcomes:
- claim: fig1d-sessions-blocks
  outcome: reproduced
  notebook: reproduce_gillespie_2021.ipynb
  output: claim:fig1d-sessions-blocks
  measured:
  - 25
  - 32
  - 24
  - 33
  - 88
  - 85
  - 109
  - 167
  notes: >-
    Under both readings of which jaq sessions are excluded and both readings of the block's final trial,
    all eight counts are within 10%. Sessions 25, 32, 24 and 33 against 24, 32, 23 and 33. Blocks with
    a trial of task phase 4 or more are 88 (sessions 1 and 3 in order of recording left out) or 91 (day
    6 epochs 2 and 4 left out) for jaq against 89, 85 against 85 for roquefort, 109 against 105 for despereaux,
    and 167 or 166 (final-trial readings) against 166 for montague. Measured values are reading (a) with
    the old-goal-visit final trial. With no session excluded (a variant), jaq has 27 sessions, outside
    tolerance, and 96 blocks. The files hold one more run epoch for jaq and for despereaux than the paper
    counts; all run epochs are the goal_delay task, and none sets forage assist where the log header states
    it (111 of 116).
  deviations:
  - >-
    Trials are rebuilt from the StateScript logs in the files (port entries, the printed goal, reward
    and timeout lines), not from the paper's preprocessed trial structures; rewards match the DIO pump
    onsets in 115 of 116 epochs.
  - >-
    Which jaq sessions are the excluded sessions 1 and 3 is not marked in the files; two readings are
    run (in order of recording, day 6 epochs 2 and 5; or day 6 epochs 2 and 4, the only jaq session with
    fewer than eight arms visited). Both give the same outcome. A question was asked.
  - >-
    Which trial closes a block when the rat does not return to the old goal right after the switch is
    not given by the claims file; both readings are run and give the same outcome. A question was asked.
  - >-
    Session selection by decode quality (the code's gooddecode) cannot be applied without decoding; all
    run epochs are counted, less the two excluded for jaq.
- claim: fig1ef-reward-rate
  outcome: reproduced
  notebook: reproduce_gillespie_2021.ipynb
  output: claim:fig1ef-reward-rate
  notes: >-
    Under every session and final-trial reading, in all four subjects, the reward rate on the first trial
    after the goal change is 0.068 to 0.133 with its lower S.E.M. bound at or below 0.125 (0.041 to 0.106),
    it rises to 0.584 to 0.696 by trial 15 (bands not overlapping trial 1; Spearman rho 0.94 to 0.996,
    p < 2e-7), and after the first reward at the new goal every point of trials 1 to 15 has its band above
    0.125 (lowest lower bound 0.234, roquefort, under readings a and b). Blocks are 88, 85, 109 and 167
    under reading (a).
  deviations:
  - >-
    Trials are rebuilt from the StateScript logs, as for fig1d-sessions-blocks, with the same two session
    readings and two final-trial readings.
  - >-
    The criterion's "rises" is judged as trial 15 above trial 1 with non-overlapping S.E.M. bands and
    a positive Spearman correlation of rate with trial number; both are printed.
- claim: figs1c-swr-reward-consumption
  outcome: blocked
  blocked_by: too_large
  notes: >-
    The dandiset holds only the raw 30 kHz broadband of 128 channels, about 9.1 TB over 57 files stored
    one channel per chunk, and no spikes, LFP, ripple times, linearised position or decoder output. The
    notebook measures about 5 MB/s when streaming it (data check), at which one 90-minute run epoch takes
    over two hours and the whole dandiset hundreds of hours, far beyond the 30-minute limit, before any
    spike detection or decoding. The claim needs ripples detected on the raw broadband across the CA1
    cell-layer tetrodes. The electrode table also gives every channel's location as None, so the CA1 cell-layer
    tetrodes and the corpus callosum reference tetrode the Methods use cannot be identified.
