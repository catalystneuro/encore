findings:
- kind: data_missing
  statement: >-
    The dandiset holds the raw 30 kHz broadband, port events, position and task logs, but none of the
    derived data the paper's findings rest on: no spike times or waveform features, LFP, ripple or multiunit
    event times, linearised position or decoder output. 31 of the paper's 33 claims need ripples or clusterless
    decoding recomputed from about 9.1 TB of raw data, which cannot be streamed within the registry's
    limits.
- kind: metadata_insufficient
  statement: >-
    The electrode table gives the location of all 128 channels as None in every file, so the CA1 cell-layer
    tetrodes used for ripple detection and decoding, and the corpus callosum tetrode used as LFP reference,
    cannot be identified from the data.
- kind: selection_undocumented
  statement: >-
    The files do not mark which run sessions the paper analysed. They hold 27, 32, 24 and 33 run epochs
    for jaq, roquefort, despereaux and montague, where the paper used 26 (24 after excluding sessions
    1 and 3 of subject 1), 32, 23 and 33, and the excluded sessions are named only by number. Which
    jaq and despereaux epoch the paper did not count cannot be told: possible ones are jaq day 7 epoch 2
    (6 rewards in 74 valid trials, no outerreps printed) and the epochs shorter than the Methods' 45
    minutes (jaq day 6 epoch 4 and day 9 epoch 6, despereaux day 4 epoch 4). The paper's
    code repository (LorenFrankLab/Gillespie_Neuron_2021) holds a saved filter output with per-animal
    epoch lists that may identify them; it was not used here.
- kind: other
  statement: >-
    The draft version's files were rewritten in January 2022 (NWB 2.4.0). In the file compared (montague
    day 4) the DIO timestamps agree with the published version to within a microsecond, but the draft's
    position timestamps are shifted by about -1.59e9 s and no longer share the DIO clock; in the published
    version they do. The README of the paper's code links the draft.
- kind: metadata_error
  statement: >-
    Position is sampled at 32.9 to 33.0 Hz, where the Methods state 30 Hz, and 110 of 116 run epochs end
    with 1 to 4 NaN position timestamps; two epochs have non-increasing timestamps (up to 200).
- kind: other
  statement: >-
    In montague day 16 epoch 2 the StateScript log's clock steps by about 3.4 s twice against the DIO
    pump times early in the epoch, and in jaq day 6 epoch 4 the DIO holds one more reward pump (arm 8)
    226 s after the last logged reward, so that log appears to end before the epoch. Elsewhere the log
    and the DIO agree to a few milliseconds and on every reward.
- kind: metadata_insufficient
  statement: >-
    The task logs (StateScript, embedded as text in processing/associated_files) are the only record of
    the goal arm, trial structure and timeouts; there is no trials table. Five run epochs carry the log
    without the Python observer header that states the task parameters (rewards per goal, forage assist);
    for these, forage assist can be ruled out only from the log lines (no CURRENTGOAL line names more
    than one arm).
