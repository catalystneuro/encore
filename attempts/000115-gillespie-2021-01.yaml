      inputs. Report in transcripts/000115/verifier-1-report.md.
  results:
  - claim: fig1d-sessions-blocks
    agrees: true
    outcome: reproduced
    reason: >-
        Cell 15. Under reading (a), sessions are 25/32/24/33 against 24/32/23/33 and blocks are
        88/85/109/166 against 89/85/105/166, all within tolerance. Under reading (b), jaq has 25
        sessions and 91 blocks. All 26 candidates for the unidentifiable first excluded jaq session
        pass (jaq blocks 88-93, tolerance 80.1-97.9), so (a) and (b) agree. It also noted that the
        two blocks with 9 and 3 rewards were not investigated (problem 1), that forage assist was
        unknown for five logs without a header (problem 2), that day 6 epoch 4's seven arms came
        from a log that appears to stop early and were not confirmed from the DIO (problem 3), and
        that the extra jaq and despereaux sessions were not identified, so the full-task selection
        is assumed (problem 4); none affects the conclusion.
    response: >-
        No change of outcome. Added a per-session table (header, forage-assist lines, blocks,
        rewards per block, arms in the log and in the DIO). Both odd blocks follow a closing trial
        that was a rewarded visit to the new goal, which the closing-trial rule keeps in the old
        block, so the new block shows one reward fewer than the outerreps printed (10 and 4); the
        text that said only programmed values occur is corrected. No log, the five without a header
        included, names more than one arm in a CURRENTGOAL line, which is how forage assist shows in
        the log. The DIO confirms arm 6 was never entered in jaq day 6 epoch 4, also after the last
        logged trial. The extra epochs cannot be identified; possible ones are listed, and leaving
        out any one more jaq or despereaux epoch keeps all counts within tolerance (jaq 82 to 87,
        despereaux 100 to 108 blocks). The adjacency rule of label_task_phase (problem 5) is used by no
        test here; the helper's docstring now says so, and that arms 1 and 8 are not treated as
        neighbours because the claims file does not say which arms are.
  - claim: fig1ef-reward-rate
    agrees: true
    outcome: reproduced
    reason: >-
        Cell 17. The 1E trial-1 band reaches or lies below 0.125 in all subjects (lower bounds 0.041
        to 0.106). Trial 15 is far above trial 1 (Spearman rho >= 0.94, p <= 1.4e-7). The lowest 1F
        lower bound is 0.234 (roquefort), above 0.125. This holds under every reading and all 26 jaq
        candidates. Jaq (0.068) and roquefort (0.094) start below chance, not at it; the criterion's
        "or lies below" allows this. E_rises is the author's own way of reading "rises", stricter
        than the criterion (problem 6). It asked for the per-trial values of 1E and 1F.
    response: >-
        No change of outcome. Added the per-trial p, S.E.M. and n for trials 1 to 15 of both curves
        per subject, and the plain reading of "rises" (trial 15 above trial 1), which holds in every
        subject; the conclusion now says that jaq and roquefort start below chance and that E_rises
        is stricter than the criterion.
