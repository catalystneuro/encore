  measured:
  - 1.33
  - 11.87
  notes: Eq. (2) with the constants of Methods 2.3 gives an IMP reduction of 1.33% (reading a, 1 - f/1.5)
    or 1.20% (reading b, relative to f at 3e-7 S/m) for a 10-fold rise of membrane conductivity, outside
    2 +- 0.2%, and 11.87% (a) or 11.75% (b) for a 100-fold rise, inside 12 +- 1.2%. Both readings give
    the same result. The qualitative part of the statement holds, as a 1000-fold rise is needed to reduce
    IMP by more than half (57.4%). In a grid of radii 5 to 15 um and membrane thicknesses 3 to 7 nm (a
    variant, not the criterion), no combination puts both values within tolerance; R = 8 um with d = 3
    nm gives 2.19% and 18.3%. The computation uses no recordings.
  deviations:
  - None in method; Eq. (2) and its constants are those of Methods 2.3, and both readings of the criterion
    were run.
