inputs:
- what: Method parameters only, no data. The figure-eight segment bins of Figure 5e (stem 1-74, turn
    1 75-111, arm 112-185, turn 2 186-205 of 205 one-cm bins) and the list of mice left out of it
    (e15_13f1, e16_3m2) from ratemap_remap.m; the stem bins excluded from ratemap correlations
    (familiar 75-205, novel T-maze 51-164) and the 12 familiar-novel sessions from
    get_corrBeh_famnov.m. The code's result files (corrHome_v7.mat and others) were read to see what
    identifiers they hold; nothing from them is used in the notebook.
  source: https://github.com/rhuszar/optotagCA1_final at commit 51320d45c5ee41147048128df333f251379bf755
outcomes:
- claim: cohort-birthdates
  outcome: not_reproduced
  notebook: reproduce_huszar_2022.ipynb
  output: claim:cohort-birthdates
  measured:
  - 17
  - 13
  - 4
  notes: 17 mice, with E13.5 4, E14.5 3, E15.5 6 and E16.5 4, as the paper states. The subject sex
    fields give 13 males and 4 females against 12 and 5. Mouse e13_1f1 is stored as male while its
    id carries an f like the ids of the four mice stored as female; with the sex read from the ids
    the counts are 12 and 5. The outcome follows the criterion, which takes the field as stored; the
    likely cause is an error in that field (see findings).
- claim: sessions-durations
  outcome: partially_reproduced
  notebook: reproduce_huszar_2022.ipynb
  output: claim:sessions-durations
  measured:
  - 104
  - 319.6
  notes: 104 processed files, within 10% of the 96 sessions of Figure 1e and Figure 7f but not of
    the 92 of the Methods. Median duration 319.6 min (paper 309.1), range 113.7 to 494.2 min, all
    inside the widened range of 102.3 to 523.2 min; two files last exactly the paper's bounds (113.7
    and 475.6 min). Without e15_13f1 and e16_3m2 there are 96 sessions with per-birthdate counts equal
    to Figure 1e (30, 24, 24, 18), range 113.7 to 475.6 min and median 309.9 min. Two files of
    e13_1f1 (200305, 200307) hold one Awake interval for the whole session and no scored sleep, so
    the statement that each session includes sleep fails for them; that part makes the outcome
    partial.
  deviations:
  - Session duration is the end of the last sleep-state or ripple interval; in 57 files the last
    spike falls 1.2 to 5.2 s later.
  - The criterion named the sleep condition without saying which outcome its failure gives; with the
    count, median and range holding and the sleep condition failing in 2 of 104 files, the outcome is
    taken as partial.
  - The session count was judged under two readings (92 and 96), as the paper gives both.
- claim: spwr-duration
  outcome: reproduced
  notebook: reproduce_huszar_2022.ipynb
  output: claim:spwr-duration
  measured: 36.0
  notes: Median duration 36.0 ms over all 494,578 ripples pooled and 36.0 ms as the median of
    the 104 session medians (paper 36.4). All ripples last 20.0 to 199.2 ms, within the 20 to 200 ms
    limits. Per-mouse medians run from 29.6 to 40.0 ms.
  deviations:
  - Uses the ripples stored in the files; detection was not repeated.
- claim: unit-count
  outcome: not_reproduced
  notebook: reproduce_huszar_2022.ipynb
  output: claim:unit-count
  measured:
  - 8201
  - 0.878
  notes: 8,201 units in 65 of 104 files, below the tolerance of 8,524 to 10,418. Six mice (e13_1f1,
    e13_1m1, e14_1m1, e15_4m1, e15_4m2, e15_5m1; 39 files) have no units. Files with units hold 34 to
    376 (median 99). The 5 Hz rule classes 87.8% as putative pyramidal cells, against the paper's
    78.3%.
  deviations:
  - The pyramidal fraction uses a firing-rate rule, as the files hold no cell type.
- claim: maze-cohort
  outcome: reproduced
  notebook: reproduce_huszar_2022.ipynb
  output: claim:maze-cohort
  notes: 11 mice have figure-eight trials. Under reading (b), the maze mice without e15_13f1 and
    e16_3m2 are nine, at E13.5 2, E14.5 2, E15.5 2 and E16.5 3, and three mice (e13_26m1, e15_13f1,
    e16_3m2) have novel recordings, so e13_26m1 is in both cohorts. Reading (a), disjoint cohorts of
    12 mice, does not hold.
  deviations:
  - The paper calls the novel cohort separate; the reading that matches takes the overlap from the
    paper's code, recorded as an ambiguity.
- claim: maze-task
  outcome: not_reproduced
  notebook: reproduce_huszar_2022.ipynb
  output: claim:maze-task
  measured:
  - 204.1
  - 30.0
  notes: Median trial length 204.1 cm and tracking at 30.00 Hz in all 65 familiar recordings,
    both within tolerance. Only 38 of 65 sessions have at least ten trials on each visited arm (22 of
    65 by expected arm), and 6 sessions have fewer than 20 trials (fewest 12), so neither the full nor
    the partial condition holds. The requirement may have applied to training, not to every recorded
    session.
  deviations:
  - Two readings of "trials along each arm" (visited and expected) were used; neither holds.
- claim: novel-explorations
  outcome: partially_reproduced
  notebook: reproduce_huszar_2022.ipynb
  output: claim:novel-explorations
  measured: 9
  notes: Three mice with 9 novel explorations that have trials and position (3 T-maze runs of about
    164 cm, 3 linear-track runs of 110 cm and 3 of 100 cm), against 16. The novel-cohort sessions hold
    7 further epochs of 10 to 50 min without position that are not a session's last epoch; with them
    the count is 16, consistent with the paper but not shown. The kinds with position correspond to
    the paper's figure-eight and two linear tracks, so the explorations without position are likely
    the three open fields.
- claim: fig5e-pv-decorrelation
  outcome: partially_reproduced
  notebook: reproduce_huszar_2022.ipynb
  output: claim:fig5e-pv-decorrelation
  measured:
  - 0.937
  - 0.547
  - 0.492
  - 0.465
  notes: 57 sessions of nine mice (the paper's bin counts, 4,218 stem bins, imply the same 57), with
    28 to 242 putative pyramidal cells per session. Kruskal-Wallis H = 7632.7 (paper 7278.3), p = 0,
    stem highest. Stem 0.937 is within tolerance; turn 1 0.547, arm 0.492 and turn 2 0.465 are above
    the paper's 0.412, 0.372 and 0.394. The stem is the most correlated segment in every mouse. The
    medians depend strongly on the cell rule; at most 2 Hz gives 0.925, 0.387, 0.288, 0.306; at most
    10 Hz gives 0.966, 0.787, 0.771, 0.746; all units 0.988, 0.948, 0.94, 0.921; no speed threshold
    0.924, 0.589, 0.522, 0.492. 51 of 11,685 bins had no value.
  deviations:
  - Putative pyramidal cells by session mean rate (at most 5 Hz), not by waveform and
    autocorrelogram; the files hold no cell type or waveforms.
  - Speed from smoothed linearized position, not a Kalman filter.
- claim: fig6c-theta-rate-preserved
  outcome: reproduced
  notebook: reproduce_huszar_2022.ipynb
  output: claim:fig6c-theta-rate-preserved
  measured: 0.734
  notes: Spearman rho = 0.734 over 2,038 putative pyramidal cells with a familiar and a novel rate
    (paper 0.7378 over 2,544), p = 0; per mouse 0.723 to 0.755, per session 0.583 to 0.851. Variants
    with all units, a 10 Hz rule or a 1.5 cm/s running threshold give 0.763 to 0.808. 679 cells of the
    3 sessions without a novel maze have no novel rate.
  deviations:
  - The rate is the firing rate while running at 5 cm/s or faster inside maze trials, in place of
    the rate in LFP theta cycles; the LFP is in the raw files of 8 of the 9 novel sessions but was not
    used.
  - Novel mazes are only those with position; the open fields are not in the data.
  - Putative pyramidal cells by firing rate.
- claim: fig6c-novel-ratemap-corr-higher
  outcome: not_reproduced
  notebook: reproduce_huszar_2022.ipynb
  output: claim:fig6c-novel-ratemap-corr-higher
  measured:
  - -0.053
  - -0.0364
  notes: Median familiar -0.0530 over 327,656 pairs (within tolerance) and novel -0.0364 over 242,655
    pairs (outside 0.018 to 0.078); rank-sum p = 0.67. Within each of the 9 sessions with a novel
    maze the novel median is higher than the familiar one, so the direction holds session by session;
    with familiar pairs only from those sessions the pooled test gives p = 0.1. Variants with all
    units (p = 0.38) or a 10 Hz rule (p = 0.66) agree; including the stem gives p = 3.5e-50 with novel
    higher. Per maze kind, novel medians run from -0.0548 to 0.0073.
  deviations:
  - All pairs of putative pyramidal cells, where the paper's pairs each include a light-responsive
    neuron (not identifiable in the files).
  - Novel mazes are only the T-maze and linear tracks with position; the paper's novel pairs also
    come from open fields with two-dimensional maps.
- claim: fig6d-info-lower-novel
  outcome: partially_reproduced
  notebook: reproduce_huszar_2022.ipynb
  output: claim:fig6d-info-lower-novel
  measured:
  - 0.631
  - 0.27
  notes: Familiar median 0.631 bits/s over 2,709 cells and novel 0.270 over 2,028 cell-maze values,
    rank-sum p = 1.5e-59, so information is lower in novel mazes as stated, but both medians are below
    the tolerances (0.792 to 0.968 and 0.351 to 0.429). The code's unweighted measure gives 0.646 and
