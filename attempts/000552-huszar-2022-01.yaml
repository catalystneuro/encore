- claim: fig7fg-convergence-cofiring
  outcome: blocked
  blocked_by: methods_underspecified
  notes: Uses all pyramidal-interneuron pairs and needs no birthdate labels. The notebook applies the
    rate rule (units above 5 Hz as interneurons, 1,001 in all against the paper's 2,060) and the
    connection test of the Methods (0.8 ms CCG bins, hollowed-Gaussian baseline of 15 ms s.d., alpha
    0.001) to two sessions. In e15_13f1_220117, whose mouse is not among the 15 of Figure 7f, the test
    at fixed lags of 0.8 to 3.2 ms detects connections in 5,073 of 11,319 possible pairs (0.448,
    against 31,932 of 184,230 or 0.173 in the paper), and 96.7% of pyramidal pairs share a target
    (paper 65.27%). In e13_26m1_211019, inside the Figure 7f cohort, it detects 0.407, with 96.7% of
    pairs sharing a target. The Methods test the three bins around the CCG peak, where this test uses
    fixed lags; a peak-centred variant (peak sought at lags up to 4.0 ms, a range the Methods do not
    give, chosen after the fixed-lag results were seen) detects 0.405 and 0.394, with 95.7% and 93.4%
    of pairs sharing a target. With a connection rate this far from the paper's under both forms, the
    procedure differs from the paper's, whose connections come from the lab's CellExplorer mono_res
    files (not public; the paper's code reads them and does not compute them). The difference may lie
    in this implementation as well as in what the Methods leave unstated (lag range, hollow fraction,
    CCG window). Of the paper's 96 sessions (the files without e15_13f1 and e16_3m2), 39 have no units
    in the dandiset, and cofiring in theta cycles needs the LFP, which the processed files lack.
findings:
- kind: data_missing
  statement: No unit is labelled light-responsive (birthdated), and no optogenetic pulse times are
    stored in the processed or the raw files, so the paper's comparisons of same- and
    different-birthdate neurons and its birthdate profiles (22 of the 35 claims listed here) cannot
    be tested. The labels exist in the lab's CellExplorer files (optoTag, putativeCellType), which are
    not public at a pinned identifier.
- kind: metadata_insufficient
  statement: Units carry no putative cell type and no waveforms, though the paper classifies 7,411
    pyramidal cells and 2,060 interneurons.
- kind: data_missing
  statement: Six of the 17 mice (e13_1f1, e13_1m1, e14_1m1, e15_4m1, e15_4m2, e15_5m1; 39 files) have
    sleep states and ripples but no units and no position. The dandiset holds 8,201 units where the
    paper reports 9,471.
- kind: data_missing
  statement: Of the 16 novel environment explorations, only 9 have position and trials, and no open
    field has position. The novel-cohort sessions hold 7 further epochs of 10 to 50 min without
    position or video that may be the missing explorations.
- kind: metadata_error
  statement: The subject sex differs between files of the same mouse. e13_1f1 is Female in 3 files and
    Male in 2; e13_1m1 is Male in 9 and Female in 3. The value in most of each mouse's files gives the
    paper's 12 males and 5 females.
- kind: metadata_error
  statement: The trials column is_familiar_maze is True only for the first two trials of sessions with
    a single maze recording, where every trial is on the familiar maze (112 True, 1,182 False).
- kind: metadata_error
  statement: In several novel recordings (e13_26m1 211019, 211116, 211119; e15_13f1 220120; e16_3m2
    211213) x and y lie between 0 and 1 though stated in cm.
- kind: metadata_error
  statement: Twelve of the 13 raw files give a session start of 2011-08-18 for sessions recorded in
    2021 and 2022.
- kind: metadata_error
  statement: The processed file of e16_3m1_210201 holds a copy of the 1250 Hz LFP of the raw file,
    labelled with a rate of 30,000 Hz and a conversion factor of 3.05e-13 V.
- kind: identifier_missing
  statement: Units have no link to the electrodes table, and their group_id values ("Group3") do not
    match the electrode group names ("Group 3") in 64 of 65 files, so a unit's shank and position on
    the probe cannot be recovered.
- kind: metadata_insufficient
  statement: The embryonic day of electroporation, the variable the paper is about, is stored only as
    the prefix of each subject id (e13 for E13.5); the age is given as P3M/P6M for every mouse.
- kind: other
  statement: Two files of e13_1f1 (200305, 200307) hold a single Awake interval for the whole session,
    so sleep was not scored, though both hold ripples.
- kind: other
  statement: Only 38 of 65 familiar-maze sessions have ten or more trials on each visited arm, and 6
    have fewer than 20 trials, where the Methods require ten per arm in every session; 19 of 1,942
    trials have no start or stop time.
- kind: paper_inconsistency
  statement: The Methods give 92 sessions, while Figure 1e (30, 24, 24 and 18 sessions) and Figure 7f
    give 96. The dandiset's files of the 15 homecage mice are 96 sessions that match Figure 1e by
    birthdate and the Methods' duration bounds exactly (113.7 to 475.6 min).
- kind: paper_inconsistency
  statement: The paper calls the novel-environment cohort of three mice separate, but one of them
    (e13_26m1) is also among the nine figure-eight mice, in the dandiset and in the paper's code.
verifications:
- date: '2026-10-17'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The first executed notebook with the conclusion cells and the summary removed, the
    helper module and the claims file, with the paper's full text (the PMC author manuscript). The verifier
    tested helper functions on synthetic inputs and queried the archive's asset metadata for the blocked
    claims. Its report gave its own outcome for each claim; it agreed with the record on 34 of 35 outcomes,
    gave reproduced for cohort-birthdates, and for fig7fg-convergence-cofiring agreed on blocked but disputed
    the reason. Problems B6 (dependent bins and pairs treated as independent, as in the paper), B8 (skaggs_information
    weights by unsmoothed occupancy and divides by smoothed occupancy) and B9 (mean_rates divides by an
    end time 1 to 5 s short of the last spike in 57 files) it marked as not affecting a conclusion; they
    were left as they are, since the first follows the paper, the second follows the Methods' map definition
    with the occupancy probability of Skaggs et al., and the third changes rates by under 0.1%.
