findings:
- kind: format_error
  about: data
  severity: critical
  statement: RSEM.isoform.counts.matrix in squid.zip names 16 samples in its header (Ct_8.1_Gill-1 and
    15 optic lobe samples) but each row holds a transcript id and 15 values. Matched against the authors'
    rawMatrix in Squid.RData, value columns 2 to 15 are the first 14 optic lobe samples (Ct_8.1_OL-1 to
    Re_8.1_OL-2); value column 1 matches no workspace sample and is, by its header position, the gill sample.
    Re_8.1_OL-3 has no values. The authors' script (R_scritps.Rmd, line 57) reads the file with read.csv
    and row.names = 1, which takes the first header name for the id column, so every sample name shifts
    by one and value column 1 is labelled Ct_8.1_OL-1 (shown by emulating read.csv's naming). The expression
    filter then gives 67,088 transcripts on the 15 columns so named, or 66,006 on the 14 optic lobe columns,
    in place of the paper's 69,368, which the workspace's rawMatrix gives.
  notebook: reproduce_allen_2026.ipynb
  output: finding-count-matrix-columns
- kind: other
  about: data
  severity: critical
  statement: In the prey shrimp table of the R workspace (behavior_and_physiology_data$S3, the only copy
    of the Supplementary Figure 3 data), the column "pH 7.8 10-20 Min" is identical to "pH 8.1 10-20 Min"
    (8 values), so the CO2-exposed shrimp at 20 min are the control shrimp's values; the legend gives
    11 CO2 shrimp.
