    but less than the range of the four control samples (29.6); the attempt assumed the range.
- kind: paper_inconsistency
  statement: Supplementary Table 4 prints the logistic regression intercept as 22.364913 with z = -2.163;
    the coefficients and the counts of the paper give -22.64 (z = -2.16), so the printed sign is wrong.
- kind: code_mismatch
  statement: The deposited R_scritps.Rmd computes the Figure 4A PCA on all 15 samples (including Re_8.1)
    and keeps 12 (x[1:12,]), which gives PC1 29.0% and PC2 13.5%; the figure's 35% and 15% come from a
