  about: data
  severity: minor
  statement: Squid_Behavioral_assessment.csv holds 9 acute-OA squid, where the paper's ANOVAs (F(2,31))
    and the distance and velocity files have 8. Leaving out the ninth row (59.6% upper, 1.3% left, 6.7%
    front) gives the paper's sums of squares for all three zones; nothing in the files marks it as excluded.
    In the workspace's figure tables its value is the one acute-OA zone value with no distance beside it,
