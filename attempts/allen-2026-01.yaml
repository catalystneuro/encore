  output: finding-shrimp-duplicate-column
- kind: data_missing
  about: data
  severity: major
  statement: 'Squid_Prey_Capture.csv holds 11 chronic-OA squid (8 attacked), where the paper, its logistic
    regression and the workspace''s Figure 2G table (F2G, N = 22, 36.36% attacking) have 22. The 11 missing
    chronic-OA squid change the logistic regression of Figure 2G: on the file the pH effect is not significant
    under the paper''s coding.'
  notebook: reproduce_allen_2026.ipynb
  output: finding-prey-capture-chronic-missing
- kind: other
  about: data
  severity: major
  statement: In Carbonate_calibration.csv each row prints Eq. 1 with alphaCO2 0.0312, pKa1 6.10 and a
    factor 10^3, which evaluates to 10.0 times the PCO2 printed in the same row (for example 4.20/[(1+10.35)x0.0312]x10^3
    = 11,859 against 1186.2 uatm). Squid_Hemolymph.csv and the paper report the smaller values, and the
    deposited [HCO3-] follows Eq. 2 with them. Either the formula or the values are off by a factor of
    10, and alphaCO2 has no unit. The formula is the one consistent with the measured TCO2 and pH. The
    README gives alphaCO2 for 32 ppt and 25 C, where CO2 solubility is about 0.03 mmol l-1 per matm,
    and the printed PCO2 would need alphaCO2 near 0.31. If the printed values are the wrong ones, the
    deposited [HCO3-] is up to 1.08 mmol/l too high.
  notebook: reproduce_allen_2026.ipynb
  output: finding-pco2-factor-10
- kind: data_missing
  about: data
  severity: major
  statement: The paper's Data availability statement places the behavioural tracking data, ERG recordings
    and carbonate chemistry calculations in this deposit. The dataset holds only per-squid summaries of
    the tracking (distance, velocity, zone percentages), group means and SDs of the ERG response ratio
    per frequency (no traces, spectra or per-squid values), CFF per squid, and the hemolymph carbonate
    calculation; there are no 3-D tracks, depth, ERG recordings, seawater chemistry, body masses or mantle
    lengths. Four of the paper's findings cannot be tested and three others only on the deposited summaries.
  notebook: reproduce_allen_2026.ipynb
  output: finding-not-deposited
