- claim: fig3c-ratio-declines
  outcome: not_reproduced
  notebook: reproduce_allen_2026.ipynb
  output: claim:fig3c-ratio-declines
  notes: 'The dataset holds only group means per stimulus frequency. In no group is the mean ratio below
    its 20 Hz value at every frequency above 40 Hz: control 0.998 (45 Hz) and 0.990 (50 Hz) against 0.977
    at 20 Hz; acute-OA 0.998 (45 Hz) and 1.062 (57.5 Hz); chronic-OA 1.039 (47 Hz) against 0.996. The
    65 Hz value is the lowest in acute-OA (0.300) but more than 0.1 above the lowest in control (0.391
    against 0.284) and chronic-OA (0.361 against 0.252). The decline the statement describes is there
    above 50 Hz: mean ratio up to 50 Hz 1.00, 0.97 and 0.80, above 50 Hz 0.38, 0.53 and 0.43 (control,
    acute-OA, chronic-OA), apart from acute-OA at 57.5 Hz (1.062). The ratios up to 45 Hz in control
    and acute-OA are whole numbers of FFT bins of 1.953 Hz (4 kHz sampling, Methods; 2048 points, the
    bin width the values fit), and the two groups have the same mean there. Where an SD is given at these
    frequencies it is 0 (acute-OA at 10, 40 and 45 Hz, control at 45 Hz), so every squid behind that mean
    peaked in the same bin; elsewhere up to 40 Hz the SD is missing, and the file does not show whether
    such a mean rests on one squid or several. The 20 Hz reference (0.977) is below 1 by this rounding,
    and 45 Hz (0.998) fails on it alone. The criterion does not allow for this; a question has been filed
    for a reader (questions/allen-2026.yaml). The other failures are not rounding to the nearest bin,
    chronic-OA at 47 Hz being a peak at 25 bins, one above the bin nearest the stimulus, and acute-OA
    at 57.5 Hz not a whole number of bins. The file gives no n per mean, so the paper''s n = 8, 8 and
    9 cannot be checked.'
  deviations:
  - 'The criterion''s per-squid FFT analysis cannot be run: the ERG traces and spectra are not deposited.
    The deposited group means of the ratio are used.'
