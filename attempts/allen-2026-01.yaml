  output: claim:fig1d-blood-ph
  measured:
  - 7.092
  - 7.145
  - 7.175
  notes: Means 7.092, 7.145 and 7.175 (7, 6, 9 squid). Welch's ANOVA W = 6.347, df 2, 9.196, p = 0.0185;
    the paper prints W = 5.983 with the same df and p = 0.00965. Dunnett's T3 control against chronic-OA
    p = 0.017, control against acute-OA p = 0.46, acute-OA against chronic-OA p = 0.86 (paper 0.015, 0.391,
    0.754). The intervals here are wider than the paper's (control against chronic-OA -0.150 to -0.015
    against -0.129 to -0.036); the paper's intervals imply a critical value near 1.96, where the studentized
