- claim: fig3d-slow-oscillation-gamma-coupling
  outcome: partially_reproduced
  notebook: reproduce_senzai_2019.ipynb
  output: claim:fig3d-slow-oscillation-gamma-coupling
  measured:
  - 70.85
  - 0.00528
  - 0.00281
  assumed: true
  notes: 'With the 1-3 Hz phase of the layer 6 site in non-REM (reading a), the index averaged over the sites above the
    layer 4 site peaks at 70.9 ± 16.2 Hz over 18 mice (69 ± 12), within tolerance, and the deep sites (below c) couple
    to amplitudes above 100 Hz. The indices are larger than the paper''s: 0.0053 ± 0.0039 superficially (0.0027 ± 0.0005)
    and 0.0028 ± 0.0019 deep (0.0023 ± 0.0003). With the rule''s b (16 mice) the values are 70.6 Hz, 0.0051 and 0.0026;
    with the 0.5-3 Hz phase (reading b), 70.7 Hz, 0.0078 and 0.0048. The coupling pattern holds, the index values do
    not.'
  deviations:
  - Tort et al. (2008) modulation index with 18 phase bins; the phase band is band-passed (3rd-order Butterworth, zero
    phase) and its phase taken by the Hilbert transform; amplitudes are Morlet (w0 = 6) amplitudes at 24 log-spaced frequencies
    from 5 to 200 Hz on every other site; up to 600 s of the state per mouse; the index is averaged over the sites of
    each region before the peak is taken. The surrogate test of the STAR Methods is not run, as no criterion uses it.
  - 'The layer 6 phase site is 15 sites (300 um) below c, the MUA peak of mid layer 5, an assumption: landmark d cannot
    be placed by a rule the paper gives, and the coherence boundary that opens the sixth layer lies a median 12.5 sites
    below c (fig2b). In YMV09, where c is at site 56, the site is clipped to the deepest site (7 below c).'
  - 'Sites above landmark b are read as the sites above the layer 4 site of the ICs; the rule''s b is a variant. The
    layer 4 site is the peak loading site of the third of the six highest-variance gamma ICs ordered by depth, an assumption:
    landmark b cannot be placed by a rule the paper gives, and Figures S3B and S3D label the six LFP layers L2, L3, L4,
    L5a, L5b, L6, so the third is layer 4.'
  - YMV19 has no state table and is left out.
