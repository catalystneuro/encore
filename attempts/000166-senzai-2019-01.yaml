findings:
- kind: data_missing
  statement: The 520 nm flash times behind the visual evoked CSD (Figure 1E, 1F, S2D) are in 2 of the 13 stimulated mice,
    as the `Visual laser` tables of YMV05 and YMV08 (498 intervals of 0.4 s each). The other files hold no visual stimulus
    times.
- kind: metadata_error
  statement: The `Visual laser` tables ("Laser pulses for subject stimulation") of YMV05 and YMV08 also hold the optogenetic
    pulses of the `Laser diode` table (1,488 and 2,715 of their intervals start within 5 ms of a `Laser diode` pulse),
    and one YMV05 interval lasts 49.6 s.
- kind: metadata_error
  statement: The genotypes in the files are 11 PV-Cre::Ai32 and 3 VGAT-Cre::Ai32 mice; the paper's STAR Methods give
    5 PV-Cre::Ai32 and 9 VGAT-Cre::Ai32. The other genotypes (3 Ai35, 1 CaMKII-Cre::Ai35, 1 CaMKII-Cre::Ai32) agree.
- kind: metadata_insufficient
  statement: The electrode table gives no depth or position (x, y and z are NaN, location "unknown", impedance -1); only
    rel_y (-1 to -64) implies the site order. The data are consistent with the columns being in that depth order (for
    each file the best-correlated site in the 100-500 Hz LFP is an adjacent one for 50 to 63 of the 64 sites). The units
    carry no waveform, layer, depth, landmark or cluster label, so every laminar analysis of the paper must be rebuilt
    from the raw signal and LFP.
- kind: metadata_insufficient
  statement: 'The units'' `max_channel` holds the electrode table `id` (a hardware channel number; the ids are a permutation
    of 0 to 63) of the unit''s peak site: it equals the id of the column of the unit''s largest mean waveform for 1,157
    of 1,255 units (1,247 within one site), and the column index for 76. The column description ("Channel that observed
    the maximum waveform amplitude") does not say which numbering it uses.'
- kind: metadata_insufficient
  statement: The `cell_type` labels (Pyramidal Cell 836, Narrow Interneuron 277, Wide Interneuron 223, Unknown 15, down
    state 10) follow a scheme the paper does not describe; 198 "Wide Interneuron" units have a waveform E trough-to-peak
    latency. The 10 "down state" units are in 6 mice, where the paper reports 5 DOWN state-active neurons in 4 mice.
    The `synaptic_effect` labels (444 Excitatory, 145 Inhibitory) do not match the paper's 347 CCG-based E and 100 I
    cells, and their rule is not given.
- kind: other
  statement: YMV03 has no unit columns but quality (no cell_type, synaptic_effect, max_channel or firing_rate), and one
    of its units is "unsorted". YMV19 has no Sleep states table.
- kind: other
  statement: YMV07, a CaMKII-Cre::Ai35 mouse, has 41,022 laser pulses of 20 ms at one level, a protocol the paper does
    not describe.
- kind: methods_unavailable
  statement: Question for the paper's authors. How were the CSD landmarks a, b, d and e chosen on the DOWN-UP CSD map?
    The paper calls them "the most prominent" sinks and sources and marks them by hand in Figure 1D. A rule that takes
    the extreme CSD above and below the MUA peak places them inconsistently (adjacent distances ranging by 220 to 620
    um across mice), so normalized depth and every layer group of the paper cannot be rebuilt from the text.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which LFP site gives the phases of the spike-LFP coupling of Figure S7
    (the unit's own site, a fixed layer, or an IC)? With the unit's own site the unit's spike dominates the high frequencies;
    10 sites away 3-6 Hz is strongest but 0.5-3 Hz is second and 30-60 Hz fifth.
- kind: methods_unavailable
  statement: Question for the paper's authors. Were further selections applied in the monosynaptic detection (for example
    on pairs recorded on the same or neighbouring sites, on firing rates, or by refractory contamination)? The rule of
    the STAR Methods applied to these units finds 1,295 excitatory and 578 inhibitory connections and 673 and 187 CCG-based
    E and I cells, about twice the paper's 525, 323, 347 and 100, and the pair count of 102,332 matches no count of pairs
    of the 1,477 units.
- kind: methods_unavailable
  statement: 'Question for the paper''s authors. How were the eight unit clusters obtained: on the spike-IC coupling
    matrix or on its t-SNE embedding, with which features per unit (the full 6 IC x 20 scale profile or one value per
    IC), and over which range of cluster numbers was the silhouette compared? Under each of these readings the silhouette
    here favours 2 to 6 clusters, never 8, and the eight-cluster solutions do not separate depth as Figure 5C does.'
- kind: methods_unavailable
  statement: Question for the paper's authors. Which components count as volume conducted in the 0.34 ± 0.11 of gamma
    variance, and how were the six main ICs chosen among the ten? Here the ten PCs hold 0.99 of the band variance, the
    six of highest variance include a deep component that carries up to 0.71 of it, and the spread components carry 0.53.
