- claim: fig2c-six-gamma-ics
  outcome: partially_reproduced
  notebook: reproduce_senzai_2019.ipynb
  output: claim:fig2c-six-gamma-ics
  assumed: true
  notes: With the six highest-variance ICs (reading a), each mouse's loading correlates positively with the mean of the
    other mice for all six ICs (median Spearman rho 0.87, 0.84, 0.75, 0.58, 0.58, 0.94 from the surface), with signed-rank
    p below 0.001 for five (p 7.6e-6 to 0.00033) and p = 0.0019 for IC 4, so the criterion's p < 0.001 for each of the
    six fails for one. The pairwise reading gives p below 0.001 for five ICs and 0.02 for IC 4. With the six confined
    ICs (reading b), ICs 1-3 pass and ICs 4-6 do not (p 0.0056 to 0.016). The ICs lie in depth from a median 26 sites
    above c to 24 below it. In 17 of 18 mice one of the six peaks at or near the deepest site and carries 0.03 to 0.71
    of the band variance. 18 mice (YMV19 has no state table).
  deviations:
  - The gamma ICA (STAR Methods, Independent Component Analysis of LFPs) is fitted on up to 600 s of waking per mouse
    (the longest `Awake` epochs of at least 30 s), with scikit-learn's FastICA on the first ten PCs of the 30-100 Hz
    LFP in place of runica (EEGLAB infomax, not available in Python); the whole-session reading of fig2c is not run.
  - Depth is taken in sites relative to landmark c (the MUA power peak), in place of the paper's normalized depth, which
    warps depth between all five landmarks (STAR Methods, Depth normalization) and so needs a, b, d and e, which no rule
    given in the paper places (fig1g-landmark-distances-consistent). Aligning on c is an assumption.
  - Each mouse's loading is compared with the mean of the other mice (leave-one-out), over aligned sites held by at least
    5 other mice, and the p is a signed-rank test of the 18 correlations against zero; the claims file names the comparison
    but not the test of the correlations.
  - A loading is confined when fewer than half the sites exceed half its peak absolute value (a choice, stated; used
    for reading b).
  - YMV19 has no state table and is left out.
