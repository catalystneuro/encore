outcomes:
- claim: fig1f-sink-b-deeper
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_senzai_2019.ipynb
  notes: The light-evoked CSD needs the times of the 520 nm flashes in the 13 stimulated mice. The dataset holds
    them in 2 files only, the `Visual laser` tables of YMV05 and YMV08 (498 intervals of 0.4 s each, plus the optogenetic
    pulses). With 2 mice a signed-rank test cannot reach p < 0.05 (its smallest two-sided p is 0.5). The DOWN-UP
    half of the comparison is computed under fig1g-landmark-distances-consistent.
- claim: fig1f-other-landmarks-same-depth
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_senzai_2019.ipynb
  notes: Needs the light-evoked landmarks a', d' and e', which need the flash times of 13 mice; the dataset has
    them for 2 (see fig1f-sink-b-deeper). It also depends on fig1f-sink-b-deeper.
- claim: fig1g-landmark-distances-consistent
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_senzai_2019.ipynb
  notes: Every reading was run (CSD as the unsmoothed second difference of the claims file and, as a variant, over
    two sites; windows 0-100 and 0-50 ms; "varied" as the range and as the largest deviation from the mean). The
    MUA peak c is found in all 19 mice, but the rule of the claims file (most negative CSD for b above c and d below
    it, most positive for a above b and e below d) places all five landmarks in only 15 or 16 mice, and among those
    the ranges of the adjacent distances are 220 to 620 um (largest deviations 114 to 420 um), against less than
    110 um. In 7 mice landmark a falls one site above b, a single-site deviation of the unsmoothed CSD. The paper
    places the landmarks by eye ("the most prominent current source density (CSD) sinks and sources", Results, Anchoring
    Mesoscopic Patterns, paragraph 1; asterisks in Figure 1D), and neither it nor the claims file gives a rule that
    can be run; the rule here is not the paper's procedure, so the claim is blocked with every reading shown. The
    claim also depends on fig1f-sink-b-deeper, blocked as data_missing, but uses only its DOWN-UP landmarks, which
    the dataset can give. Question for the paper's authors (finding) is how the landmarks were chosen.
  deviations:
  - DOWN-UP transitions are the dataset's UP onsets that follow a DOWN interval, averaged over the 1000 s of each
    session holding the most of them (114 to 1,541 transitions), not over the whole session.
  - MUA power (landmark c) is computed from the two 30 s raw blocks used for the waveforms, not the whole session.
  - Site 0 is taken as the most superficial, as the files' rel_y runs from -1 to -64; the electrode table gives
    no depth.
