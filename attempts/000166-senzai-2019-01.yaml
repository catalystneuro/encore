- claim: fig4a-unit-counts
  outcome: reproduced
  notebook: reproduce_senzai_2019.ipynb
  output: claim:fig4a-unit-counts
  measured:
  - 1477
  - 246
  - 1016
  notes: 1,477 units in the files (1,476 of quality good; 1,472 ± 147). From the wide-band mean waveform, as the
    Results describe ("the unfiltered waveform was quantified by the trough-to-peak latency", Assignment of Neurons
    to Physiologically Defined Layers, paragraph 1), 246 narrow I cells (251 ± 25) and 1,016 wide E cells (1,075
    ± 108); 105 positive units, no fiber unit, and 110 units with fewer than 10 spikes in the 60 s used. With a
    300 Hz high-pass the counts are 320 and 941, both outside tolerance. At thresholds of 0.50 and 0.60 ms the I
    count is 215 and 323. Each mouse contributes 5 to 20 I cells.
  deviations:
  - The dataset holds no waveforms; mean waveforms are averaged from 60 s of raw signal per session (two 30 s blocks
    at 1000 and 3000 s, median 127 spikes per unit), where the paper used all spikes, and 110 units with fewer than
    10 spikes there are left unclassified.
  - The wide-band signal follows the Results' unfiltered waveform; the STAR Methods do not say whether the waveform
    is filtered, and the 300 Hz high-pass of Kilosort is shown as a variant, which does not match.
  - The fiber rule reads the STAR Methods' kurtosis of the second derivative of the normalized waveform, with units
    beyond the mean ± 5 SD of the negative units as fibers; none is.
- claim: fig4a-ccg-classification
  outcome: not_reproduced
  notebook: reproduce_senzai_2019.ipynb
  output: claim:fig4a-ccg-classification
  measured:
  - 673
  - 187
  - 74.9
  - 72.7
  notes: 673 CCG-based E cells and 187 I cells (347 ± 35 and 100 ± 10), 122 of them both; 74.9% of CCG-based E cells
    are waveform E cells and 72.7% of CCG-based I cells are waveform I cells (80.9% and 79.5% of those with a waveform
    class), against 97.4% and 98.0%. The hollowed predictor gives 682 and 188. The dataset's own synaptic_effect
    labels count 444 excitatory and 145 inhibitory units, also above the paper's counts, and agree with this detection
    for 349 and 116 of them.
  deviations:
  - The CCG half width is 50 ms and the Gaussian kernel is cut at 5 SD with reflected edges, standard choices that
    do not reach the tested bins.
  - The paper's code may apply selections that the STAR Methods do not state; none is applied here.
- claim: fig4de-optotagging
  outcome: not_reproduced
  notebook: reproduce_senzai_2019.ipynb
  output: claim:fig4de-optotagging
  measured:
  - 62
  - 48
  - 18
  - 14
  notes: In the 11 mice labelled PV-Cre::Ai32 in the files, 62 units are tagged with pulses pooled and 48 of them
    are waveform I cells (15 ± 1.5 and 14 ± 1.4); in the 3 VGAT-Cre::Ai32 mice, 18 and 14 (52 ± 5.2 and 40 ± 4).
    Each intensity separately gives 61 and 18. No unit is tagged in other genotypes or with onsets shifted by 0.5
    s. Pooled over both lines, 80 units are tagged and 62 (78%) are I cells, against the paper's 67 and 54 (81%).
    The genotype counts in the files (11 PV, 3 VGAT) differ from the paper's (5 and 9), so the mice cannot be split
    as the paper split them.
  deviations:
  - Pulses are the dataset's `Laser diode` intervals (10 ms; three amplitude levels of about 496 pulses, read as
    the three intensities); YMV08 and YMV14 have 992 pulses at some levels.
  - The mice are split by the genotype written in the files, which disagrees with the paper's counts.
