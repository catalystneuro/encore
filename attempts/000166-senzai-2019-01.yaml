  notes: 1,477 units in the files (1,476 of quality good; 1,472 ± 147). From the wide-band mean waveform, as the Results
    describe ("the unfiltered waveform was quantified by the trough-to-peak latency", Assignment of Neurons to Physiologically
    Defined Layers, paragraph 1), 246 narrow I cells (251 ± 25) and 1,016 wide E cells (1,075 ± 108); 105 positive units,
