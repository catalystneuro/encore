- claim: fig1g-landmark-distances-consistent
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_senzai_2019.ipynb
  notes: Every reading was run (CSD as the unsmoothed second difference of the claims file and, as a variant, over two
    sites; windows 0-100 and 0-50 ms; "varied" as the range and as the largest deviation from the mean). The data columns
    are in depth order (for each file, the best-correlated site in the 100-500 Hz LFP is an adjacent one for 50 to 63
    of the 64 sites, median 58). The MUA peak c is found in all 19 mice, but the rule (most negative CSD for b above
    c and d below it, most positive for a above b and e below d, each over the whole half of the probe) places all five
    landmarks in only 15 or 16 mice, and among those the ranges of the adjacent distances are 220 to 620 um (largest
    deviations 114 to 420 um), against less than 110 um. The CSD maps of all mice show that the rule picks probe-edge
    values in some mice (a or b within 3 sites of the top in YMV09 and YMV13, d or e within 3 sites of the bottom in
    YMV09) and places a one site above b in 7 mice. The paper places the landmarks by eye ("the most prominent current
    source density (CSD) sinks and sources", Results, Anchoring Mesoscopic Patterns, paragraph 1; asterisks in Figure
    1D), and neither it nor the claims file gives a rule that can be run, so the claim is blocked with every reading
    shown. The question for the paper's authors is in the findings. The other laminar claims are tested with depth relative
    to c, which needs no other landmark.
  deviations:
  - DOWN-UP transitions are the dataset's UP onsets that follow a DOWN interval, averaged over the 1000 s of each session
    holding the most of them (114 to 1,541 transitions), not over the whole session.
  - MUA power (landmark c) is computed from the two 30 s raw blocks used for the waveforms, not the whole session.
  - Site 0 is taken as the most superficial, as the files' rel_y runs from -1 to -64; the electrode table gives no depth.
  output: claim:fig1g-landmark-distances-consistent
- claim: fig2b-six-coherence-clusters
  outcome: reproduced
  notebook: reproduce_senzai_2019.ipynb
  output: claim:fig2b-six-coherence-clusters
  assumed: true
  notes: 'Under the readings the criterion lists with six clusters imposed (reading b) and each mouse''s boundaries compared
    with the across-mouse median, the claim holds: a six-cluster solution is found in all 18 mice (contiguous in depth
    in 14) and no boundary differs from the median (signed-rank p 0.74 to 1). The other readings fail: left free, the
    clustering converges to 8 to 20 clusters from 64 random labels (6 to 10 from 16), and against the matching IC boundaries
    three of five boundaries differ (p = 0.033, 0.013, 0.028; median differences 3.5 to 5.8 sites). The comparison with
    the across-mouse median can hardly fail by construction, so the outcome shows only that six clusters can be placed
    with boundaries spread around common depths (medians 21, 13.5 and 3 sites above c and 4.5 and 12.5 below it).'
  deviations:
  - Coherence is the magnitude-squared coherence in 1 s Hann segments, averaged over 30-100 Hz, on the waking blocks
    of the ICA (up to 600 s per mouse).
  - The energy-gap moves follow the STAR Methods (Gamma coherence and gradient descent clustering). The number of random
    initial clusters is not given; 64 (and 16, shown) are used for reading (a), and 6 (or 8 when no run of 20 ends with
    six) for reading (b); the lowest-energy run of 20 is kept.
  - Boundary k is the number of sites in clusters 1 to k minus 0.5, exact for contiguous clusters.
  - Depth is taken in sites relative to landmark c (the MUA power peak), in place of the paper's normalized depth, which
    warps depth between all five landmarks (STAR Methods, Depth normalization) and so needs a, b, d and e, which no rule
    given in the paper places (fig1g-landmark-distances-consistent). Aligning on c is an assumption.
  - YMV19 has no state table and is left out.
