findings:
- kind: data_missing
  statement: The 520 nm flash times behind the visual evoked CSD (Figure 1E, 1F, S2D) are in 2 of the 13 stimulated
    mice, as the `Visual laser` tables of YMV05 and YMV08 (498 intervals of 0.4 s each). The other files hold no
    visual stimulus times.
- kind: metadata_error
  statement: The `Visual laser` tables ("Laser pulses for subject stimulation") of YMV05 and YMV08 also hold the
    optogenetic pulses of the `Laser diode` table (1,488 and 2,715 of their intervals start within 5 ms of a `Laser
    diode` pulse), and one YMV05 interval lasts 49.6 s.
- kind: metadata_error
  statement: The genotypes in the files are 11 PV-Cre::Ai32 and 3 VGAT-Cre::Ai32 mice; the paper's STAR Methods
    give 5 PV-Cre::Ai32 and 9 VGAT-Cre::Ai32. The other genotypes (3 Ai35, 1 CaMKII-Cre::Ai35, 1 CaMKII-Cre::Ai32)
    agree.
- kind: metadata_insufficient
  statement: The electrode table gives no depth or position (x, y and z are NaN, location "unknown", impedance -1);
    only rel_y (-1 to -64) implies the site order. The units carry no waveform, layer, depth, landmark or cluster
    label, so every laminar analysis of the paper must be rebuilt from the raw signal and LFP.
- kind: metadata_insufficient
  statement: The units' `max_channel` equals the site of the largest mean waveform (in the column order of the raw
    data) for 76 of 1,367 units; what it indexes is not documented.
- kind: metadata_insufficient
  statement: The `cell_type` labels (Pyramidal Cell 836, Narrow Interneuron 277, Wide Interneuron 223, Unknown 15,
    down state 10) follow a scheme the paper does not describe; 198 "Wide Interneuron" units have a waveform E trough-to-peak
    latency. The 10 "down state" units are in 6 mice, where the paper reports 5 DOWN state-active neurons in 4 mice.
    The `synaptic_effect` labels (444 Excitatory, 145 Inhibitory) do not match the paper's 347 CCG-based E and 100
    I cells, and their rule is not given.
- kind: other
  statement: YMV03 has no unit columns but quality (no cell_type, synaptic_effect, max_channel or firing_rate),
    and one of its units is "unsorted". YMV19 has no Sleep states table.
- kind: other
  statement: YMV07, a CaMKII-Cre::Ai35 mouse, has 41,022 laser pulses of 20 ms at one level, a protocol the paper
    does not describe.
- kind: methods_unavailable
  statement: Question for the paper's authors. How were the CSD landmarks a, b, d and e chosen on the DOWN-UP CSD
    map? The paper calls them "the most prominent" sinks and sources and marks them by hand in Figure 1D. A rule
    that takes the extreme CSD above and below the MUA peak places them inconsistently (adjacent distances ranging
    by 220 to 620 um across mice), so normalized depth and every layer group of the paper cannot be rebuilt from
    the text.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which LFP site gives the phases of the spike-LFP coupling of Figure
    S7 (the unit's own site, a fixed layer, or an IC)? With the unit's own site the unit's spike dominates the high
    frequencies; 10 sites away 3-6 Hz is strongest but 0.5-3 Hz is second and 30-60 Hz fifth.
- kind: methods_unavailable
  statement: Question for the paper's authors. Were further selections applied in the monosynaptic detection (for
    example on pairs recorded on the same or neighbouring sites, on firing rates, or by refractory contamination)?
    The rule of the STAR Methods applied to these units finds 1,295 excitatory and 578 inhibitory connections and
    673 and 187 CCG-based E and I cells, about twice the paper's 525, 323, 347 and 100, and the pair count of 102,332
    matches no count of pairs of the 1,477 units.
