  outcome: reproduced
  notebook: reproduce_jeong_2022.ipynb
  output: claim:figs8d-consummatory-lick-uncorrelated
  notes: Per animal r from -0.20 to 0.15 (mean 0.010) over 281 to 686 rewards; t(7) = 0.23, p = 0.824 (paper t =
