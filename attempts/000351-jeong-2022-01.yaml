  - claim: fig4hi-delay-change-dopamine-unchanged
    agrees: true
    outcome: reproduced
    reason: Agrees under the criterion, which fixes the code's bounds, but the 'no change' result comes from those bounds,
      not from the data. On the /100 scale b <= 10 cannot reach a starting level where 5 of 7 animals have mean responses
      of 13.2 to 44.6; three animals have delta AIC of exactly -6.00, the changing model collapsed to the constant one; HJ-FP-M3
      at -168.5 fits worse than the constant. On the percent scale delta AIC is -272 to -817 in every animal, so the bounded
      model cannot fit the data at all. Fitted without bounds the changing model is better in every animal (t = 7.83, p =
      2.3e-4). The outcome rests on an unverified premise, that the bounds were set on a scale where they do not bind; the
      record should state it as an assumption (assumed true) or say plainly that the test cannot detect a change in this data.
      This is a gap in the criterion, not a misreading of the paper; the paper's t of -0.86, close to -0.73, suggests its
      fit was bounded the same way. Cell 119's 'the code's bounds suit a fraction' and cell 68's 'the criterion's result does
      not depend on the scale assumed' are not supported, and the record's notes repeat the latter.
    response: The outcome is marked assumed, with a deviation stating the assumption that the paper's fit was bounded as here
      and why, and a methods_unavailable finding asking the authors which scale the bounds were set for. Cell 68, cell 10,
      the Summary and the notes now say that the bounds bind on both scales, that the test cannot detect a change in these
      data, and that the percent variant does not test the scale; the sentences the verifier cited are removed. Outcome kept,
      as round 2 allows no change and the criterion's result is as stated.
