- claim: fig4hi-delay-change-behavior-changes
  outcome: reproduced
  notebook: reproduce_jeong_2022.ipynb
  output: claim:fig4hi-delay-change-behavior-changes
  notes: Lick timing abruptness 0.233 against dopamine 0.064, paired t = 15.34, p = 4.9e-6 (paper t = 22.92). Changing
    model better than constant for lick timing in all 7 animals, mean delta AIC 382.8, t = 7.49, p = 2.9e-4 with
    k = 4 (the paper's t), and t = 7.53 with k = 3. 12 to 77 trials per animal without licks in cue and trace are
    dropped, as the code does.
  deviations:
  - The changing model is fitted by bounded least squares (scipy) from 20 random start points with a fixed seed,
    keeping the best fit; Matlab's fit starts custom models at random points, so the code's fits are not repeated
    exactly.
  - dF/F is divided by 100 before the dopamine AUC, as the files store percent and the Methods define dF/F as the
    fraction (470 - fitted 405)/fitted 405 (Methods, Fiber photometry), on which scale the code's bounds are set.
