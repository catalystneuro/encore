findings:
- kind: metadata_error
  statement: Event times (acquisition/eventlog/eventtime) are stated in milliseconds but are in seconds. The random
    reward sessions have a mean inter-reward interval of about 12 in the files' units (Methods, 12 s), and the Fig
    S8L sessions named 6, 12 and 30 have means near 6, 12 and 30.
- kind: data_missing
  statement: Seven sessions inside the day ranges of the paper's analysis code are not in the dandiset (HJ-FP-M2
    Day23, M3 Day16 and Day31, M4 Day30 and Day38, F2 Day16, M6 Day49). M4 Day38 is a listed start day, the first
    background reward session of that animal. The paper's mean session counts for Experiments 2, 5 and 4 (13.3,
    8.1, 2.6) equal the counts that include these days, while the dandiset gives 12.7, 7.9 and 2.4.
- kind: metadata_error
  statement: In 65 of the 101 Experiment 7 files the raw photometry (acquisition/photometry) has about 12 million
    samples per stated second and its timestamps end at 0.43 to 4.18, while the sessions last 600 to 4100 s; the
    timestamps are in thousands of seconds (12 kHz detection).
- kind: metadata_error
  statement: Subject HJ-FP-datHT-stGtACR-M7, a DAT-Cre heterozygote by its name and in the paper's code, has genotype
    wt in its files.
- kind: metadata_insufficient
  statement: The experimental condition of each session (Experiments 2 to 5) is not stated; only the first session
    of a condition carries a suffix in its name (8s, 8s-bgd6s, extinction), and the files of datHT-M6 and datHT-M7
    do not name the task. The sessions used for each figure are given only in the analysis code's day lists and
    in a Google spreadsheet named in the description, which has no fixed version.
- kind: other
  statement: In 13 sessions dF/F does not cover the whole event log by more than 1 s; HJ-FP-WT-stGtACR-M2 Day6 has
    no dF/F for its first 1117 s, and M6 Day22 and M7 Day43 lose their last 175 to 187 s. In Experiments 1 to 6
    the first 20 or so dF/F timestamps of each session are NaN.
- kind: methods_unavailable
  statement: For the authors. Which window (and measure) of the z-scored lick bout onset response were the Fig S8E
    tests run on? Neither the Methods, the legend nor the code gives it. The non-consummatory response is significantly
    negative over 0 to 0.5 s (t = -2.56, close to the paper's -2.55) but not over 0 to 1 s or -0.5 to 1 s, and the
    consummatory t values are about twice the paper's.
