inputs:
- what: The day lists (startday, endday, learnedday) by which the paper's Matlab scripts select each animal's sessions,
    from analysis/fig4/cumsum_pavlovian.m, analysis/fig4/cumsum_bgdrw_vs_extinction.m, analysis/fig5/intermediate_rsp_trialless.m,
    analysis/figS10/omission.m, analysis/figS10/cue_acquisition.m and analysis/fig6/backpropagation_pavlovian.m;
    they name sessions by the Day number of the dandiset's file names. The measures of the scripts are ported, not
    run.
  source: https://github.com/namboodirilab/ANCCR at commit cff44144e60a4313a30ffbb4bb8a1f3dd398b525
outcomes:
- claim: session-day-link
  outcome: partially_reproduced
  notebook: reproduce_jeong_2022.ipynb
  output: claim:session-day-link
  notes: All 28 subjects of the code's lists are in the dandiset, matched with _ read as -. Of the 119 listed days
    (startday, endday, learnedday and the single days of omission.m), 117 are sessions with the condition the script
    names; HJ-FP-M4 Day38, the first background reward day in cumsum_pavlovian.m (condition 4) and cumsum_bgdrw_vs_extinction.m,
    is not in the dandiset. All 320 sessions inside the ranges have the condition (3 s or 9 s cue-reward delay,
    background rewards, no delivered reward, trial-less task). Counted literally, 320 of the 331 integer days in
    the ranges are sessions; the 7 missing days inside the Pavlovian ranges are M2 Day23, M3 Day16 and Day31, M4
    Day30 and Day38, F2 Day16 and M6 Day49. The subjects match and more than 90% of the listed days do, so the link
    holds in part. The dependent claims are tested on the sessions present; the missing sessions bear on fig4p-background-faster-decay
    (M4's first background session) and on the session counts. The spreadsheet named in the dandiset's description
    was not used, as it has no version to pin.
  deviations:
  - Day numbers are read from the file names as load_dandi_url does; the Matlab scripts read them from folder names
    of the authors' local copies, which the dandiset does not hold.
  - The criterion's every Day number from startday to endday is reported both for the listed days and literally
    for every integer day; the outcome uses the listed days, since integer days without a session can be days without
    training.
- claim: methods-session-counts
  outcome: reproduced
  notebook: reproduce_jeong_2022.ipynb
  output: claim:methods-session-counts
  measured:
  - 7.0
  - 12.71
  - 4.29
  - 7.86
  - 2.43
  - 5.43
  - 7.0
  notes: Counted from the dandiset, the means per animal are 7.0 random reward sessions (4 to 11, SD 2.14), 12.71
    of Experiment 2, 4.29 of Experiment 3, 7.86 of Experiment 5, 2.43 of Experiment 4, and 5.43 (WT) and 7.0 (DAT-Cre)
    sequential conditioning sessions, all within the stated SDs. The counts of integer days in the code's ranges
    are 13.29, 4.29, 8.14 and 2.57, which equal the paper's means for Experiments 2, 5 and 4, so the paper's counts
    include the 7 sessions the dandiset lacks. The DAT-Cre SD is 2.45 against the paper's 0.7, from datHT-M7's 12
    sessions.
  deviations:
  - Experiment 5 is counted as the sessions with background rewards in the event log, which equals the count in
    the range of cumsum_bgdrw_vs_extinction.m (7.86); condition 4 of cumsum_pavlovian.m gives 7.14, also within
    tolerance.
- claim: exp1-excluded-rewards
  outcome: reproduced
  notebook: reproduce_jeong_2022.ipynb
  output: claim:exp1-excluded-rewards
  measured:
  - 22.59
  - 5.66
  notes: Reading (a), mean over the 8 animals, 22.59% of rewards with IRI under 3 s and 5.66% without a lick before
    the next reward; reading (b), over 56 sessions, 22.59% and 5.68%. Both within tolerance under both readings.
