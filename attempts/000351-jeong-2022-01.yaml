- claim: figs8e-lick-bout-responses
  outcome: partially_reproduced
  notebook: reproduce_jeong_2022.ipynb
  output: claim:figs8e-lick-bout-responses
  notes: Under every reading the consummatory onset response is above 0 (mean z 1.76 to 3.07, t = 6.30 to 6.49,
    p <= 4.0e-4) and above the non-consummatory one (paired t = 7.17 to 8.58, p <= 1.8e-4). The non-consummatory
    response is negative on average under all readings but significant only under (c), 0 to 0.5 s (z = -0.35, t
    = -2.56, p = 0.0376, against the paper's t = -2.55, p = 0.0379); under (a) 0 to 1 s z = -0.15, t = -1.65, p
    = 0.14, and under (b) -0.5 to 1 s z = -0.02, p = 0.80. The criterion asks for all three tests under every reading,
    so the claim holds in part. The consummatory t values are about twice the paper's (3.03), so the paper's response
    measure differs from these readings.
  deviations:
  - The window of the tests is given by neither the Methods, the legend nor the code; the three readings of the
    criterion are run, and they give different outcomes for the non-consummatory test.
- claim: figs8g-baseline-unchanged
  outcome: reproduced
  notebook: reproduce_jeong_2022.ipynb
  output: claim:figs8g-baseline-unchanged
  notes: With peaks kept by the Methods' rule (more than 0.5 s from any lick and more than 2 s from any reward),
    mean r of peak size with session -0.034, t(7) = -0.13, p = 0.90; with the code's rule, mean r 0.018, t(7) =
    0.07, p = 0.95 (paper t = 0.11, p = 0.919). Per animal r from -0.98 to 0.97. Sessions keep a median of 194 peaks
    (5 to 516) under the Methods' rule.
  deviations:
  - Peaks are found with scipy.signal.find_peaks (distance 50 samples, height and prominence as the code), in place
