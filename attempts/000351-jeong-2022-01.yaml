- claim: fig6g-inhibition-magnitude
  outcome: reproduced
  notebook: reproduce_jeong_2022.ipynb
  output: claim:fig6g-inhibition-magnitude
  measured: -0.565
  notes: With the baseline before CS1, dopamine 1 to 1.5 s after CS2 over the reward response is lower in the 6
    DAT-Cre mice than in the 7 controls under every reading (t = -8.62, p = 3.2e-6 for (a) and (c); t = -6.86, p
    = 2.7e-5 for (b)), and the day 1 reward response over the random reward session's is lower (0.53 against 1.48,
