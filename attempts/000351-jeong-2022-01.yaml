    over every code-15 event (CS1 and CS2), (b) gives -0.632, t = -5.74, p = 1.3e-4, and the day 1 reward test with
    the 0.5 s window t = -3.99, p = 0.0021, both the paper's values. The excluded DAT-Cre mouse M8 has a negative
    day 1 reward response (-0.43), as Fig S12D says.
  deviations:
  - The claim's baseline is the 0.5 s before CS1; measure_inhibition_sequential.py takes it before every code-15
    event, CS1 and CS2 alike (reftimes). Both are shown; the code's reproduces the paper's t values exactly.
  - For the 1 s reward window the 0.5 s baseline AUC is doubled, so that the baseline covers a window of equal length
    (claims header); a choice made here, which reading (b) does not involve.
