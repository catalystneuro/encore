findings:
- kind: metadata_error
  statement: The aMUA rasters are sampled at 2034.5 Hz (12207.03 Hz divided by 6, the Fs field of
    every file), where the paper states 2 kHz; 6104 samples per trial make the stated 3 s only at the
    files' rate. The data description gives no rate.
- kind: data_missing
  statement: The data set holds only the aMUA rasters to the natural sounds. The tone-pip recordings
    and best frequencies behind Fig 1A and S5 Fig, and the raw voltage traces behind the thresholded
    MUA of S10 Fig, are not deposited, so those analyses cannot be repeated.
- kind: metadata_insufficient
  statement: The order of the 16 channels along the probe (which end is dorsal, low frequency) is not
    documented, so the channels cannot be assigned to frequencies, and the Param.RecordDate field
    holds values such as May2019 and May2019C2 without explanation.
- kind: metadata_error
  statement: P2_Site08 has 13 trials per sound, where the paper states one paradigm 2 site with 14
    trials and all others with 20. The other trial and site counts match the paper (paradigm 1 18 to
    39 trials, 13 sites, 4 and 9 per animal; paradigms 2 and 3 11 sites each, 3 and 8 per animal).
- kind: metadata_error
  statement: The data description says all sound files are double precision WAV; the 195 model
    sounds are 16 bit integer PCM and the paradigm sounds 32 bit float. The model sounds' SD is 0.0003
    to 0.0022 of full scale, where the description says they are normalised to 0.001.
- kind: other
  about: data
  statement: The whole data set is one 5.3 GB tar.gz file, which cannot be read at random; reading
    any neural file means decompressing the stream from the start (about 4 minutes for the whole
    file here). The white noise control of the model analyses is not included.
- kind: code_mismatch
  statement: The paper's model example code (ModelExample.m) builds the cochleogram with
    criticalbandwidth.m, b = 94 + 71 f^1.5 (f in kHz), where the Methods give b = 25 + 75(1 +
    1.4 f^2)^0.69, and it keeps the envelopes at 3675 Hz (oversampling factor 4) where the Methods
    say 1 kHz. The Methods are followed here.
- kind: methods_unavailable
  statement: For the authors. The neural classifier's Methods leave open how the 100 random time
    samples enter a decision (each sample a decision, or log-likelihoods summed over the 100 samples
    for one decision), how the number of PCs that "maximize the classifier performance" is chosen
    (on the validation data or within the model data), and on which data the mixing coefficient a
    is fitted. The per-sound result of S6 Fig holds only when each sample is a decision, and the
    median a of S9 Fig changes from 0.0 to 0.9 with these choices. Which rules were used?
- kind: methods_unavailable
  statement: For the authors. The CDI of Fig 6C matches the reported values only when the norms are
    not squared (speech 0.123 against 0.12), while the Methods' prose (variance normalised by power)
    reads as squared norms, which give values ten times smaller. The SI of Fig 7I under either
    squared reading gives higher values than reported (environmental 0.72 against 0.49). Which
    forms of the SI and CDI were used?
