- claim: fig1k-example-temporal-widths
  outcome: reproduced
  notebook: reproduce_sadeghi_2019_neural.ipynb
  output: claim:fig1k-example-temporal-widths
  measured: [2.8, 3.1, 4.4, 5.5, 7.1, 12.2, 5.6, 156.8, 7.6, 20.6, 60.9]
  notes: At P1_Site04, with the window of the paper's code (the first half of the raster, as
    NeuralExample.m computes Fig 1) and the channel-averaged stimulus-driven temporal correlation,
    all ten widths are within tolerance and crowd and water are narrower than fire at 50%. The
    snake's side peak is at 60.9 ms (channels 9 to 16), outside 50 +/- 5 ms, so 10 of 11 values
    match. Under the two windows the claims file names, the whole response and 1000 ms windows,
    6 to 8 of 11 values match (partially reproduced by the criterion); the bird's 10% width is
    then 138.8 or 50.2 ms. With the median over channels, 7 to 8 of 11 match under every window.
  deviations:
  - The window is taken from the paper's code, Code/Examples/NeuralExample.m, which computes Fig 1
    from the first half of each raster (T0 at its centre, Tw = NS - 2 MaxLag - 2 samples), as the
    claims file's opening comment allows; the claims file's two readings are shown as variants.
  - The aMUA is at the files' 2034.5 Hz, so the lag step is 0.49 ms where the paper's 2 kHz gives
    0.5 ms.
  - The channel order along the probe is not documented, so the high-frequency channels for the
    period are read as channels 9 to 16 and, as a variant, 1 to 8 (52 to 62 ms either way);
    reading (b), best frequency above 2 kHz, cannot be run without best frequencies.
