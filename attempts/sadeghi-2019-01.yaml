- claim: fig1k-example-temporal-widths
  outcome: reproduced
  assumed: true
  notebook: reproduce_sadeghi_2019_neural.ipynb
  output: claim:fig1k-example-temporal-widths
  measured: [2.8, 3.1, 4.4, 5.5, 7.1, 12.2, 5.6, 156.8, 7.6, 20.6, 60.9]
  notes: At P1_Site04, with the window of the paper's code (the first half of the raster, as
    NeuralExample.m computes Fig 1) and the channel-averaged stimulus-driven temporal correlation,
    all ten widths are within tolerance and crowd and water are narrower than fire at 50%. The
    snake's side peak is at 60.9 ms (channels 9 to 16), outside 50 +/- 5 ms, so 10 of 11 values
    match. Under the two windows the claims file names, the whole response and 1000 ms windows,
    6 to 8 of 11 values match (partially reproduced by the criterion); the bird's 10% width is
    then 138.8 or 50.2 ms. With the median over channels, 7 to 8 of 11 match under every window. The notebook now prints the lines of NeuralExample.m that set this window
    (73 to 75, NS2 = floor(NS/2), sA = 1:NS2; 80, RASNMod = RASNA; 86 and 87, T0 at the centre and
    TwMod = floor((NSMod - 2 MaxLag - 2)/Fsd 1000)).
  deviations:
  - The window is taken from the paper's code, Code/Examples/NeuralExample.m, which computes Fig 1
    from the first half of each raster (T0 at its centre, Tw = NS - 2 MaxLag - 2 samples), as the
    claims file's opening comment allows; the claims file's two readings are shown as variants.
  - The aMUA is at the files' 2034.5 Hz, so the lag step is 0.49 ms where the paper's 2 kHz gives
    0.5 ms.
  - The channel order along the probe is not documented, so the high-frequency channels for the
    period are read as channels 9 to 16 and, as a variant, 1 to 8 (52 to 62 ms either way);
    reading (b), best frequency above 2 kHz, cannot be run without best frequencies.
- claim: fig1-snr-noise-stronger
  outcome: partially_reproduced
  notebook: reproduce_sadeghi_2019_neural.ipynb
  output: claim:fig1-snr-noise-stronger
  measured: [-11.8, -8.1, -34.0, 1.0, -29.3, 7.7]
  notes: Reading (a)(c)(e), whole window, 65 site and sound values, spectral SNR mean -11.8 dB (SD
    8.0, range -34.0 to 1.0) and temporal mean -8.1 dB (SD 9.0, range -29.3 to 7.7); 97% and 88% of
    the values are below 0 dB. Both means are within tolerance under 15 of the 18 readings, but no
    reading puts more than two of the four range bounds within tolerance (per site averages,
    spectral -26.8 to -1.4 and temporal -26.6 to 1.2 dB in the whole window). At the example site
    alone the means are -4.3 and -1.9 dB.
  deviations:
  - The SNR formula is not in the text; the readings of the claims file (squared stimulus-driven
    over squared noise correlations, with and without the zero-lag diagonal, per site and sound or
    per site, all sites or the example) are all run, under three windows.
- claim: fig1-s5-model-predicts-neural
  outcome: blocked
  blocked_by: data_missing
  notes: The test needs each recording channel's best frequency, from the tone-pip frequency
    response areas (Fig 1A, S5 Fig legend). The data set holds only the aMUA rasters to the natural
    sounds; its file list (data.tar.gz members) and description have no tone-pip recordings or best
    frequencies, and the channel order along the probe is not documented, so the model channels
    cannot be matched to recording channels.
- claim: fig2-noise-restricted
  outcome: reproduced
  notebook: reproduce_sadeghi_2019_neural.ipynb
  output: claim:fig2-noise-restricted
  notes: Over the 13 paradigm 1 sites, with widths at 50% of the maximum (reading (a)), the noise
    correlations are narrower than the stimulus-driven ones for 5 of 5 sounds in both domains under
    every window (whole window, spectral 1.8 to 2.0 against 6.6 to 9.1 channels, temporal 1.2
    against 4.8 to 7.5 ms), and their SD across sounds is smaller in both domains (spectral 0.33
    against 0.68, temporal 3.63 against 48.67). Under reading (b), the mean beyond 2 channels or 10
    ms, noise is lower for 5 of 5 sounds spectrally but for 2 of 5 temporally, as the stimulus-driven
    temporal correlations of fire, water and snake fall below zero beyond 10 ms. The bird chorus
    keeps a stimulus-driven correlation of 0.22 at 50 ms (noise 0.05) and the snake a side peak at
    55 ms.
  deviations:
  - Each site's collapsed curves are normalised by their value at offset 0 or lag 0 before
    averaging (the claims file's open step).
- claim: fig3a-example-tonotopy-removal
  outcome: partially_reproduced
  notebook: reproduce_sadeghi_2019_neural.ipynb
  output: claim:fig3a-example-tonotopy-removal
  measured: [78.4, 45.1]
  notes: At P1_Site04, at 1 s, randomising the validation channel order lowers the temporal
    classifier by 20 to 40 points under every reading ((1a)(2a) 78.4 to 45.1%, (1a)(2b) 64.4 to
    31.3%, (1b)(2a) 80 to 60%, (1b)(2b) 70 to 30%). The value with tonotopy is within tolerance under
    two readings, the value without it under none. Chance is 20%.
  deviations:
  - The decision rule (reading 1) and the choice of PCs (reading 2) are not settled by the paper;
    all four combinations are run. Reading (4) concerns the spectrum classifier only.
- claim: fig3a-example-classifier-order
  outcome: partially_reproduced
  notebook: reproduce_sadeghi_2019_neural.ipynb
  output: claim:fig3a-example-classifier-order
  notes: The single-trial order spectro-temporal >= spectral >= temporal holds under 4 of 8 reading
    combinations (for example (1a)(2b), a on the model data, 86.4, 77.7 and 64.4%). The noiseless
    rule holds under none; the noiseless spectral classifier is 12 to 21 points above the
    single-trial one under the (1a) readings, but the noiseless temporal classifier is 13 to 30
    points below the single-trial one, not similar, and the noiseless spectro-temporal classifier
    is not always 5 points higher (60 to 100% depending on how a is chosen).
  deviations:
  - The noiseless classifier is run at the example site at 1 s only (500 ms shuffled model windows,
    1000 ms shuffled validation windows, 100 each), which is what the criterion compares.
- claim: fig3b-population-above-chance
  outcome: reproduced
  notebook: reproduce_sadeghi_2019_neural.ipynb
  output: claim:fig3b-population-above-chance
  notes: Under every reading, across the 13 sites, the four single-trial classifiers exceed 20% at 1
    s ((1a)(2a) spectro-temporal 77.8%, spectral 76.9%, temporal 68.7%, without tonotopy 43.1%;
    largest two-sided p 7.8e-07), each is higher at 1 s than at 62.5 ms, and removing tonotopy
    lowers the temporal classifier by 25.6 points (paired t = 7.87, p = 4.4e-06; 25.4 to 31.5 points
    under the other readings). The 4 sites of one animal and the 9 of the other show the same
