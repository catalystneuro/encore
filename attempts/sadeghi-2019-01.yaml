- claim: fig2-noise-restricted
  outcome: reproduced
  notebook: reproduce_sadeghi_2019_neural.ipynb
  output: claim:fig2-noise-restricted
  notes: Over the 13 paradigm 1 sites, with widths at 50% of the maximum (reading (a)), the noise
