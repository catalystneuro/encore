- claim: fig5-speech-water-widths
  outcome: reproduced
  notebook: reproduce_sadeghi_2019_model.ipynb
  output: claim:fig5-speech-water-widths
  measured: [64.5, 4.0]
  notes: With the time average of the short-term autocorrelations at tau_W = 566 ms (reading ii a)
    and the channel-averaged curve, Human_Speech Sound_1 has a 64.5 ms and Flowing_Water Sound_1 a
    4.0 ms half width (median over channels 70.0 and 4.1 ms). With the long-term correlation of the
    whole envelopes speech is 81.1 ms, outside the tolerance. The speech example's mean off-diagonal
    zero-lag correlation is 0.464 against 0.259 for water. Across the 15 speech sounds the widths
    are 57.3 to 86.3 ms, across water 3.5 to 7.3 ms.
  deviations:
  - Bandwidths follow the Methods' formula, 25 + 75(1 + 1.4 f^2)^0.69, where the paper's example
    code uses criticalbandwidth.m (94 + 71 f^1.5); envelopes are resampled to 1 kHz as the Methods
    say, where the example code keeps 3675 Hz.
  - The short-term correlation is sampled every tau_W / 4, a standard choice for a time average.
