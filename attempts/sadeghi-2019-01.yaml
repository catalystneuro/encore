- claim: figs6-per-sound-above-chance
  outcome: reproduced
  notebook: reproduce_sadeghi_2019_neural.ipynb
  output: claim:figs6-per-sound-above-chance
  notes: Under reading (1a) with PCs chosen on validation, all 18 non-snake-temporal conditions
    exceed 20% at p < 0.05 across the 13 sites and the two snake temporal conditions do not (16 of
    18 with the inner split). Under the (1b) readings, 16 to 18 of 18 exceed chance but a snake
    temporal condition does too, so the claim holds under the (1a) readings only. Under (1a)(2a) the snake temporal classifier without tonotopy is
    significantly below chance (12%, p = 0.012), where the paper gives p = 0.92; the criterion asks only
    that it is not above chance, so the outcome stands, and the notebook flags the difference.
  deviations:
  - The decision rule is not settled by the paper (reading 1); the outcome holds under (1a) and not
    under (1b), and the criterion takes any reading.
- claim: figs9-mixing-coefficient
  outcome: reproduced
  assumed: true
  notebook: reproduce_sadeghi_2019_neural.ipynb
  output: claim:figs9-mixing-coefficient
  measured: [0.7, 0.5]
  notes: One reading puts both medians within tolerance, (1b)(2a) with a chosen on the validation
    data, the 24 paradigm 1 and 2 sites pooled (median 0.70, quartiles 0.40 and 0.90) and paradigm 3
    with whole responses (median 0.50, 25th percentile 0.25). The result depends strongly on how a
    is chosen; with a fitted on the model data the paradigm 1 and 2 medians are 0.50 to 0.60, as
    reported, but the paradigm 3 medians are 0.80 to 0.90; with a fitted on the validation data and
    the (1a) readings the paradigm 3 medians are 0.00 to 0.40. No reading matches per paradigm. With paradigm 2 a taken from the whole-response classifier (reading 3b)
    two more combinations pass, (1a)(2a) with a on the validation data (pooled median 0.70, paradigm 2
    0.70, paradigm 3 0.40, which also meets the per-paradigm rule) and (1b)(2a) on the validation data
    (pooled 0.65, paradigm 3 0.50); the other 14 combinations with 3b do not. The passing medians sit at
    the edge of the tolerance and the per-site values spread from 0.0 to 1.0 (printed), so the outcome
    depends on how a is chosen.
  deviations:
  - The paper says only that a maximises the log-likelihood; a is chosen on the summed log-posterior
    of the true sound, on the model data or on the validation data, over a grid of 0 to 1 in steps
    of 0.1, and both are shown. Paradigm 2 uses its half split classifier (reading 3a).
