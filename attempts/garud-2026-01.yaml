outcomes:
- claim: floeder-subjects-sessions
  outcome: reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:floeder-subjects-sessions
  measured:
  - 18
  - 16
  - 24
  notes: 18 mice (9 JF-FP, 9 JF-dLight-ramp2) have photometry and event logs, with 16 to 24
    sessions each (16 to 24 also before two duplicate files are counted once), and every mouse has
    short-ITI and long-ITI sessions. Session medians of the inter-cue interval are 14.2 to 16.9 s
    (median 16.6) in the short class and 37.0 to 72.8 s (median 53.7) in the long class, so the
    short value fits the Methods' ~15 s and the long value the Results' ~55 s. The sessions are in
    blocks (8 long then 8 short; or 7 or 8 long, 8 short, 7 or 8 long), not alternating day by
    day as the statement says; the criterion does not test the order. The dandiset also holds 9
    JF-VR-FP mice with photometry only, which the criterion's count leaves out.
  deviations:
  - Two files that hold the same recording as another day's file (JF-dLight-ramp2-F2 Day4,
    JF-dLight-ramp2-F4 Day6) are counted once, at the first day.
- claim: fig4a-lick-short-above-long
  outcome: reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:fig4a-lick-short-above-long
  notes: Lick rate 5 to 8 s after cue onset, short 2.393 Hz against long 1.600 Hz per mouse,
    paired t(17) = 4.15, p = 0.00067, higher in 16 of 18 mice; the two readings of the per-mouse
    rate give the same values to three decimals (p 0.00067 and 0.00068). Lick onsets are event
    code 5, the only lick-onset code in the files.
- claim: fig4b-long-iti-dip-below-baseline
  outcome: partially_reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:fig4b-long-iti-dip-below-baseline
  notes: Long-ITI part holds under all eight readings (correction x ITI reference x observation
    rule) - the per-mouse late-ITI ΔF/F is below zero in 18 of 18 mice, mean -0.0036 to -0.0061,
    t(17) -11.6 to -13.7, one-tailed p 6.5e-11 to 8.2e-10, over 212 long-ITI sessions. The
    short-ITI part does not hold - the last kept bin before the next cue is below zero, mean
    -0.0067 (SEM 0.0011) under the trial reading and -0.0056 (SEM 0.0007) under the sample
    reading, above zero in 1 and 0 of 18 mice. On the criterion's baseline of ΔF/F zero the
    short-ITI reward response has resolved, and gone below zero, before the next trial.
  deviations:
  - The paper reports no test for this panel; the one-sample one-tailed t-test across mice is the
    criterion's, taken from the paper's test of the stationary dip.
  - The session's tonic value is the mean over trials of each trial's mean over its kept bins in
    the window, a standard choice the Methods do not state.
  - Photometry samples are placed on the event clock by a fit of TTL2 rising edges to cue times;
    the files state no link between the two clocks.
- claim: fig4d-dip-deepens-with-training
  outcome: partially_reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:fig4d-dip-deepens-with-training
  measured: -0.283
  notes: Over 16 readings (8 tonic readings x 2 session numberings) the fixed slope on session
    number is negative in 16, below p = 0.05 in 10 and below p = 0.001 in 1. Under the
    first-listed tonic and session readings (fit, reward, trials, all sessions) the slope is
    -8.3e-05 ΔF/F per session, p = 0.0043; Pearson r is -0.128 pooled (reading a, out of
    tolerance) and -0.283 after removing each mouse's mean (reading b, within tolerance), the
    value given as measured. The one reading with p below 0.001 (own, cue, samples, all sessions,
    p = 0.0006) has r -0.13 pooled and -0.35 within mice, both out of tolerance. Readings with
    the long-ITI session numbering, under the trial rule, give p 0.11 to 0.14. Per mouse, the OLS
    slope is negative in 14 of 18. The paper's r and p cannot both be matched under any reading.
  deviations:
  - The mixed model is fitted with statsmodels MixedLM (REML), random intercepts and slopes per
    mouse, in place of the Julia package the paper used.
- claim: fig4c-lick-rate-rises-with-training
  outcome: reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:fig4c-lick-rate-rises-with-training
  measured: 0.648
  notes: Long-ITI sessions (reading a), session number among all sessions - fixed slope 0.103 Hz
    per session, p = 1.2e-05, pooled r 0.648 and within-mouse r 0.646, both within tolerance;
    with the long-ITI numbering slope 0.153, p = 1.9e-05, r 0.646. Over all sessions (reading b)
    slope 0.086, p = 8.7e-05, r 0.536, out of tolerance. Per mouse the long-ITI slope is positive
    in 15 of 18.
- claim: krausz-included-observations
  outcome: reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:krausz-included-observations
  measured:
  - 264042
  - 10
  notes: Dropping rows at a port (port not -100), rows with no distance to the chosen port (the
    start hex of each trial), rows at distance 0 and rows without velocity keeps 264,042 rows over
    10 rats, the paper's count exactly. No row follows a reward within its trial, so "had already
    received reward" removes nothing.
  deviations:
  - The Methods do not name the columns; the mapping above is this attempt's, as the criterion
    asks.
- claim: fig2a-ramp-toward-goal
  outcome: reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:fig2a-ramp-toward-goal
  notes: Per rat r between distance to the chosen port and mean DA at each distance is negative
    in 9 of 10 rats (mean -0.68, one-sample t(9) = -7.25, p = 4.8e-05). Across-rat mean DA is 0.18
    at 1 hex and -0.13 at 20 hexes.
  deviations:
  - The criterion's "position-mean DA" is taken as the mean DA at each distance to the goal, the
    axis the paper plots; a hex position has many distances, as the goal changes by trial.
- claim: fig2b-ramp-scales-with-reward
  outcome: reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:fig2b-ramp-scales-with-reward
  notes: Reading (a), slope of DA on distance, high -0.0355 against low -0.0152 per hex, paired
    t(9) = -7.30, p = 4.6e-05; reading (b), mean DA, 0.120 against -0.002, t(9) = 7.75,
    p = 2.8e-05. Destination reward is the nominal reward of the port the trial ends at.
- claim: fig2c-ramp-similar-early-late
  outcome: reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:fig2c-ramp-similar-early-late
  notes: Slope of DA on distance, early -0.0253 and late -0.0277 per hex (change -0.0024), paired
    t(9) = 0.67, p = 0.52, so the test does not find a difference. The ramp is slightly steeper
    late, not reduced as the Figure 2C legend says.
  deviations:
  - With 5 to 12 sessions per rat, a quartile is round(n/4) sessions, at least one (1 to 3); the
    Methods say only "first quartile" and "last quartile".
- claim: fig2d-ramp-scales-with-velocity
  outcome: reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:fig2d-ramp-scales-with-velocity
  notes: At the 45 or 46 hex positions present in both velocity quartiles, mean DA is 0.162 on
