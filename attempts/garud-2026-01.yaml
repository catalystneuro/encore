  - 1201.0
  - 665.0
  notes: Reading (a), main effects over the 2 x 2 design - tonic term ΔBIC 1201.0 and Gaussian
    profile ΔBIC 665.0, both within tolerance (1040 to 1272 and 635 to 777). Reading (b) gives
