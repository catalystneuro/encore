- claim: fig2gh-stationary-dip
  outcome: reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:fig2gh-stationary-dip
  measured: -4.274
  assumed: true
  notes: Reading (b), all rows off the ports (approach rows and the start hex of each trial),
    stationary DA below zero in 9 of 10 rats, t(9) = -4.274, one-tailed p = 0.0010, the paper's
    values. Reading (a), approach rows only, t(9) = -2.81, p = 0.010, out of tolerance; with the
    rows at the ports added, t(9) = -1.46, p = 0.089. Moving against stationary, paired t(9) =
    3.13 (p = 0.012) under (a) and 3.55 (p = 0.0062) under (b). Open for the authors - which rows
    the legend's "non-approach" observations are; the table has three kinds outside the approach
    selection (start hex, at a port, missing velocity), and only the reading without the port
    rows gives the reported t.
  deviations:
  - Assumed that "approach and non-approach" observations are all rows off the ports. The Figure
    2G-H legend says both were used; the port rows are the rat at the port itself, before or after
    reward, which the Methods' selection also sets apart. All three row sets are shown.
- claim: fig3-recovered-value-increases
  outcome: partially_reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:fig3-recovered-value-increases
  measured: 7
  assumed: true
  notes: With no minimum number of observations per moving and stationary mean, the BIC-winning
    profile has A > 0 in 7 of 10 rats (the paper 8), and the recovered V is higher nearest the
    goal than farthest in 7 of 10. With at least 5 observations per mean, A > 0 in 6 of 10 (not
    reproduced under that reading). Open for the authors - the minimum count per position, how
    hex-position gradients are placed on the approach axis, and the forms of the four profiles.
  deviations:
  - The gradient is computed per hex position and distance to the goal, averaged per distance,
    and integrated toward the goal with scipy's RK45 (Dormand-Prince) on the linear interpolant,
    in place of Julia's Tsit5; both are explicit 5(4) Runge-Kutta solvers.
  - Profile forms as the criterion reads them (A exp(-λd) + c, A / (1 + kd) + c, A (d + 1)^(-k) +
    c, A exp(-d²/2σ²) + c); BIC = n ln(SSE/n) + k ln n. A and c are solved by least squares for
    each value of the shape parameter, which is searched on a grid and refined.
  - Assumed no minimum observation count, the literal reading of the Methods, which name none;
    the minimum of 5 is shown as the other reading.
- claim: fig3cd-gaussian-shape-wins
  outcome: partially_reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:fig3cd-gaussian-shape-wins
  measured:
  - 9
  - 1
  - 0
  notes: The Gaussian profile wins in 9 of 10 rats under both readings; the tenth is exponential
    with no minimum count and power-law with a minimum of 5 (the paper 8, 1, 1). Mean R² over rats
    is 0.54 to 0.73 for the four shapes with no minimum, and 0.77 to 0.82 with a minimum of 5,
    where three of four exceed 0.8. Measured values are from the no-minimum reading.
  deviations:
  - Fits and readings as in fig3-recovered-value-increases.
- claim: fig5bc-gaussian-ct-td-best
  outcome: reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:fig5bc-gaussian-ct-td-best
  measured: 8
  notes: Summed over rats, Gaussian CT TD has the lowest BIC; the others are higher by 473
    (CT TD exponential), 948 (dV/dt Gaussian), 1679 (Value), 1866 (dV/dt exponential) and 6627
    (Velocity). Gaussian CT TD wins in 8 of 10 rats, dV/dt Gaussian in 2. In 3 rats, 2 or 3 of the six fits had their
    best grid point at a bound of the spatial scale (λ near 0 or σ of 100 hexes, a profile nearly
    flat over the maze).
  deviations:
  - The Methods fit all parameters by multi-start Nelder-Mead (4 initial vectors and 10
    perturbations each). Here the linear parameters are solved by least squares for each value of
    the spatial scale, which is searched on a grid of 120 values and refined; this finds the same
    least-squares optimum without random starts.
- claim: fig5d-tonic-term-and-gaussian-contribute
  outcome: reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:fig5d-tonic-term-and-gaussian-contribute
  measured:
  - 1170.1
  - 695.6
  notes: Reading (a), main effects over the 2 x 2 design - tonic term ΔBIC 1170.1 and Gaussian
    profile ΔBIC 695.6, both within tolerance. Reading (b) gives 947.9 and 473.4, reading (c)
    1392.3 and 917.8, both out of tolerance.
  deviations:
  - Fits as in fig5bc-gaussian-ct-td-best.
- claim: figs2-no-velocity-coupling-without-goal
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The analysis is in Supplementary Figure S2, which was not available; the main text gives
    no selection, measure or test, and a claim of absence is judged on the paper's own test. The
    paper does not say where the Brown et al. (2026) data are held, and the code on OSF
    (osf.io/g3e2d) is not public (its API answered 401 on 2026-11-25).
findings:
- kind: metadata_error
  about: data
  severity: critical
  statement: Two recordings are deposited twice under different days. sub-JF-dLight-ramp2-F2 Day3
    and Day4 hold identical photometry (381,921 samples), cues and licks, as do
    sub-JF-dLight-ramp2-F4 Day5 and Day6 (330,189 samples). An analysis that counts sessions
    counts each of them twice, and one of each pair is filed under a day on which, as far as the
    files show, no other recording exists.
- kind: metadata_error
  about: data
  severity: critical
  statement: The photometry and the event log are on different clocks and the files do not say
    so. Every photometry series starts at time 0, while the event log has its own zero; aligned by
    the TTL2 channel, the photometry starts 3.6 to 251 s before the event log's zero. The only link is photometry_ttl2, described as "raw photometry channel ttl2", whose
    rising edges fall on the cue onsets (event code 15). A user who takes both time bases as given
    places dopamine seconds to minutes away from the cues and rewards.
- kind: metadata_error
  about: data
  severity: minor
  statement: 64 of the 144 JF-FP photometry series state a rate of 120481.9 Hz, or timestamps 8.3
    microseconds apart, for signals sampled at 120.3 to 120.5 Hz (fitted from TTL2 edges against cue
    times), a factor of about 1000. The other files state 130 Hz, which the TTL2 fit confirms.
- kind: metadata_insufficient
  about: data
  severity: major
  statement: The 144 files of the 9 JF-VR-FP mice hold only raw photometry (session description
    "photometry_only") with no event log, task parameters or behaviour, and nothing in the
    dandiset says which experiment they belong to or how to align them to a task. They cannot be
    analysed as deposited.
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: The TTL channels, the eventFlag series (described only as the third column of the
    event log) and the meaning of the lick code in use (code 5, "Lick3 onset") are not explained,
    and the stretches where the 470 signal is near zero (about 2950 samples, some 23 s, in
    JF-dLight-ramp2-M4 Day9 and JF-dLight-ramp2-M5 Day9) are not marked as dropouts.
- kind: other
  about: data
  severity: none
  statement: The sessions are in blocks of 8 long-ITI then 8 short-ITI sessions (JF-FP) or 7 or 8
    long, 8 short, 7 or 8 long (JF-dLight-ramp2), with median inter-cue intervals of about 53.7 and
    16.6 s, and rewards 9 s after each cue. Garud and Morris describe the sessions as alternating
    across days, with ITIs of ~8 and ~55 s (Results) or ~15 and ~45 s (Methods).
- kind: paper_inconsistency
  statement: The paper gives the Floeder ITIs as ~8 s and ~55 s in the Results and as ~15 s and
    ~45 s median in the Methods, and the Figure 2B reward split as > 80 and < 20 µL in the legend
    and ≥ 80 and ≤ 20 µL in the Methods.
- kind: methods_unavailable
  statement: Questions for the authors on Figure 4. How was the 405 nm signal regressed out and
    ΔF/F formed; is the ITI midpoint measured from reward or from the cue; is an "observation" in
    the 20-observation rule a trial or a sample; is session number counted over all sessions or
    long-ITI sessions only; and is the printed r a pooled Pearson r, a within-mouse r, or derived
    from the mixed model? Every combination was run; the slope is negative under all 16, but
    r = -0.29 with p < 0.001 is matched under none, and only the within-mouse r is near -0.29.
- kind: methods_unavailable
  statement: Questions for the authors on Figures 2G-H and 3. Which rows of hexLevelDf are the
    "non-approach" observations of Figure 2G-H (all rows off the ports reproduce t = -4.27 exactly;
    adding the rows at the ports does not)? For the value recovery, what minimum number of moving
    and stationary observations was required at a position, how were hex-position gradients
    ordered along the approach axis, and what are the four three-parameter profiles? With no
    minimum, 7 of 10 rats have A > 0 and the mean R² is below 0.8.
- kind: methods_unavailable
  statement: The supplement (cited for further detailed methods and for Supplementary Figure S2)
    was not available, and the code at osf.io/g3e2d is not public (the OSF API answers 401), so
    no method detail could be checked against the code.
