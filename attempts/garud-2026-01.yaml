- claim: fig2f-coupling-grows-near-goal
  outcome: reproduced
  notebook: reproduce_garud_2026.ipynb
  output: claim:fig2f-coupling-grows-near-goal
  measured: -0.494
  notes: Reading (a), pooled within-distance DA-velocity r at distances 1 to 20, correlated with
