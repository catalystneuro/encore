      (paper 12). The "partially reproduced" rule needs the dataset''s rats to be a subset of the
      paper''s with none extra. The evidence goes against that: every S1 recording here uses a
      64-channel A1x64-Edge probe, where the paper used two 32-channel Poly3 probes (cell 4). Two rats
      (BH648, BH658) sit in both groups, where the paper says "another group of rats". Only BH594,
      which has no POm recording, also appears in the paper''s named dandiset 000946. The criterion''s
      "none extra" condition is not checked (problem 3).'
    response: 'Outcome changed to not_reproduced, for the verifier''s reason. The subjects section now prints
      the evidence on "none extra" for each rat of the two groups (S1 probe, first and last file date,
      whether it is in 000946) and the probe of every S1 file (138 of 138 list an A1x64-Edge probe or
      H9). For the report''s problem 7, which the verifier said does not affect a conclusion, a
      session''s areas now come from units with more than 2,000 spikes, with every unit as a variant, and a variant leaves out the 2025 cohort (counts 2 and 0). The counts are 6 and 6 under
      every reading.'
  - claim: fig2-target-artifact
