  measured:
  - 6
  - 6
  notes: Simultaneous S1 and POm recordings in 6 rats (BH596, BH608, BH615, BH648, BH654, BH658),
    paper 16; simultaneous S1 and AC recordings in 6 rats (BH646, BH648, BH650, BH655, BH657,
    BH658), paper 12. Both readings of the targets (with and without the unexplained "S1-6"), and
    areas taken from units with more than 2,000 spikes or from every unit, give the same counts;
    with the 2025 cohort left out they are 2 and 0. Both counts are below the paper's, but the
    partial result also needs the rats to be a subset of the paper's, none extra, and the evidence
    goes against that. Every S1 file lists a 64-channel A1x64-Edge probe (or H9), where the paper
    recorded S1 with a 32-channel A1x32-Poly3. Two rats (BH648, BH658) are in both groups, where
    the paper's AC rats are another group. The ten rats of the two groups were recorded from August
    2024 to July 2025, after the paper's preprint (June 2024), and none is among the 20 rats of
    dandiset 000946, the repository the paper names, whose sessions run from August 2023 to April
    2024 (of the 13 rats here only BH594, which has no POm or AC recording, is there). With files
    of both areas in a rat, simultaneous or not, the counts are 10 and 7.
  deviations:
  - A session is a file in the 2024 cohort and a group of files sharing an identical trial table in
    the 2025 cohort, where each probe has its own file; the dandiset does not say this, the shared
    trial tables show it.
  - Units of BH590 and BH594 files are taken as S1, as their notes say recording at S1 and their
    celltype_label holds 0; BH596 and BH615 units are given the area their celltype_label holds.
- claim: fig2-target-artifact
  outcome: blocked
  blocked_by: data_missing
  notes: The claim needs the raw voltage of the target-determination trials (about 170 kPa) and
    spike waveforms; the files hold sorted spike times only, and no target-determination trials.
    Two BH615 sessions at 10 and 15 V show a burst of detected spikes confined to 0 to 75 ms after
    the trial start (population rate 2.9 to 7.2 times its mean), which looks like an ultrasound-locked
    artefact, but neither the voltage nor the waveform tail can be examined.
