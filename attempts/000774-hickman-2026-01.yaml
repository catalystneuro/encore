  deviations:
  - In the code's variant each unit is put in one group (V1, then HVA, then subcortical); the code
    lets superior colliculus units fall in both its HVA and subcortical groups.
- claim: fig6e-circuit-responders
  outcome: partially_reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig6e-circuit-responders
  measured:
  - 0.125
  - 0.209
  - 0.52
  - 0.785
  - 0.089
  - 0.36
  notes: With zetapy 2.7.2 getZeta (the function the code calls) the proportion of cortical circuit
    responders is 0.125, 0.209, 0.520 and 0.785 and of subcortical ones 0.089, 0.094, 0.164 and 0.360
    (7 recordings), above one half for cortex at 50 and 100 uA. The cathodal model gives amplitude F =
    89.48 (p = 6.84e-13), region F = 36.59 (p = 1.61e-07) and interaction F = 15.26 (p = 2.72e-04);
    the Results' cathodal values are F region 40.14 and interaction 15.61. Two values are just outside
    10% (cortical 0.125 against 0.14, subcortical 0.089 against 0.08 at 5 uA). The recomputed p-values
    agree with the paper's cached ones (Pearson r = 0.992, same decision for 0.970 of 7980 tests), and
    the cached ones give 0.14, 0.21, 0.52, 0.79 and 0.08, 0.09, 0.17, 0.35 on the dataset's units, the
    paper's values, and amplitude F = 172.99 and region F = 85.99 in the code's full model (paper
    175.18 and 81.50). The difference is the resampling of the ZETA test.
  deviations:
  - Only the cathodal conditions were tested with ZETA (7980 tests, 9 minutes); the code's full model
    over three polarities would take about 20 minutes more and is shown with the cached p-values.
  - zetapy 2.7.2 imports scipy.signal.gaussian, which current scipy keeps under scipy.signal.windows;
    the helper adds it before importing zetapy.
  - Trials are those of the condition's first run of single 100 us pulses (the code takes the first
    run of the amplitude and polarity, without a pulse-width filter).
- claim: fig6f-no-propagating-wave
  outcome: reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig6f-no-propagating-wave
  notes: Among 614 cortical circuit responders at 50 uA cathodal, time to peak excitation (median 205
    ms) and to peak inhibition (median 70 ms) do not correlate with signed distance (Pearson r =
    -0.001, p = 0.987; r = 0.047, p = 0.244). Using the cathodal contact for jlh32 too gives r = 0.004
    and 0.047 (p = 0.918 and 0.240). jlh39 and jlh49v1 hold no cathodal pulses, so the readings with
    and without them are the same.
