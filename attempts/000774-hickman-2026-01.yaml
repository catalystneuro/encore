- claim: fig4d-latency-trough
  outcome: reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig4d-latency-trough
  measured: 1.95
  notes: The trough of the first-spike latency histogram (0.1 ms bins, centre in 0.5 to 5 ms) lies
    at 1.95, 1.75, 1.95 and 1.95 ms for 5 to 100 uA cathodal pulses, median 1.95 ms, with a higher
    bin before and after it in all 12 conditions. Over all 12 polarity and amplitude conditions the
    median is 1.45 ms (anodal and bipolar troughs 1.05 to 1.45 ms); the criterion takes the four
    cathodal amplitudes, as the code does. The later cathodal peaks are at 3.75 to 11.85 ms. With the
    first 75 trials and stable units only, the cathodal median is 1.85 ms.
  deviations:
  - Latencies come from all trials of the condition's contact and all good units, as the code
    (figure4_figure5_figure6.ipynb cell 20), from the seven recordings that hold cathodal pulses.
- claim: figs3cd-gmm-window
  outcome: reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:figs3cd-gmm-window
  measured:
  - 0.683
  - 1.139
  - 1.221
  - 1.47
  notes: Four-component mixtures give windows of 0.683, 1.139, 1.221 and 1.470 ms, and BIC chooses
    four components at every amplitude, so readings (a) and (b) agree. Over the seven recordings
    with cathodal pulses the responder proportion with the GMM windows does not differ from the 2 ms
    window at any amplitude (Wilcoxon, FDR-adjusted p 1.0, 0.667, 0.25 and 0.25) under both
    baseline readings. Pooled over amplitudes, the GMM windows give fewer responders (Wilcoxon p =
    0.0022), a test the legend does not name.
  deviations:
  - Seven recordings, where the S3D legend implies nine; two recordings hold no cathodal pulses.
  - The crossover is taken as the first latency after the earliest component's mean where the
    second component's posterior reaches the first's; the Methods say only "crossover points where
    adjacent component responsibilities were equal" (STAR Methods, Gaussian mixture models).
- claim: fig4f-responders-within-ep
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the evoked-potential boundaries of fig2g-extent-increases, which need the raw AP
    band. The rest of the test (cathodal responders and their signed distances) runs on the dataset
    (see fig4h-distance-decreases).
- claim: fig4h-extent-constant
  outcome: reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig4h-extent-constant
  measured:
  - 1121
  - 825
  - 813
  - 452
  notes: The per-recording extent of cathodal responders does not change with amplitude (one-way
    ANOVA F = 1.250, p = 0.317, 6, 6, 6 and 7 recordings). The means are 1121, 825, 813 and 452 um;
    those at 50 and 100 uA are outside 10% of 965 and 522 um. With the code's coordinates the
    means are 1179, 884, 868 and 522 um and F = 1.265, p = 0.312, the paper's values (its code also
    prints 868 at 50 uA).
  deviations:
  - The signed distance needs CCF coordinates of every channel, which the dandiset does not give;
    they are fitted per probe by a straight line through the units' coordinates on their channel
    number. The distances use the dataset's stimulation contact coordinates, which differ from the
    code's for jlh31 and jlh32.
- claim: fig4h-distance-decreases
  outcome: partially_reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig4h-distance-decreases
  measured:
  - 414
  - 264
  - 129
  - 142
  notes: Mean signed distances of cathodal responders are 414, 264, 129 and 142 um (29, 34, 45 and
    45 responders). The tests hold (ANOVA F = 3.97, p = 0.0094; Tukey 5 against 50 uA p = 0.0134, 5
    against 100 uA p = 0.0199, other pairs above 0.42). The 25 uA mean is outside 10% of 300 um. With
    the code's coordinates the means are 426, 300, 137 and 146 um and F = 4.15, p = 0.0074, the
    paper's values; the difference is the dataset's contact coordinates for jlh31 and jlh32.
  deviations:
  - Signed distances as in fig4h-extent-constant (fitted channel coordinates, the dataset's contact
    coordinates).
- claim: fig4h-ks-distinct
  outcome: not_reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig4h-ks-distinct
  notes: With the dataset's coordinates, 5 against 100 uA has KS p = 0.0193 and Holm-Sidak adjusted
    p = 0.1105, so the two populations do not differ after correction; 5-25, 25-50, 25-100 and 50-100
    do not differ (adjusted p 0.5255, 0.8290, 0.7439, 0.8290), and 5-50 has adjusted p 0.1309 (not
    judged). With the code's coordinates the adjusted p are 0.5662, 0.0164, 0.5662, 0.3625 and 0.8245
    for 5-25, 5-100, 25-50, 25-100 and 50-100, which reproduce the claim (the paper prints 0.083 for
    50-100). The outcome turns on the stimulation contact coordinates of jlh31 and jlh32, which in the
    dataset differ from those the paper used.
  deviations:
  - Signed distances as in fig4h-extent-constant.
- claim: fig4i-proportion-within-ep
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the evoked-potential boundaries of fig2g-extent-increases, which need the raw AP band.
- claim: fig4j-drp-increases
  outcome: reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig4j-drp-increases
  measured:
  - 99
  - 0.116
  - 0.142
  - 0.194
  - 0.233
  notes: 103 units respond (nDRP > 0.15) at some cathodal amplitude and 99 have a value at all four
    (from 7 recordings, 2 to 28 each). Mean nDRP is 0.116, 0.142, 0.194 and 0.233. Reading (a), the
    code's regression on numeric amplitude, gives F = 12.779, p = 0.00039 (paper F = 12.78, p =
    0.0004); (b) a one-way ANOVA with amplitude categorical gives F = 4.44, p = 0.0044 and (c) a
    repeated-measures ANOVA F = 4.66, p = 0.0034. The number of good stable units per cathodal
    condition (2056, 2068, 2070, 2071) equals that of the code's intermediate table direct_df.csv.
  deviations:
  - The stability filter is recomputed from the Methods (the paper's flags are not in the dataset);
    the time origin of the fit and the set of units the quartiles are taken over are not stated and
    were chosen as the first spike of the recording and all units (a standard choice). The unit
    counts per condition match the code's.
- claim: figs3e-early-windows
  outcome: partially_reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:figs3e-early-windows
  measured:
  - 0.058
  - 0.106
  notes: Broader windows give more responders and a stronger amplitude dependence. Under reading (a)
    the mean proportions at 100 uA are 0.021 (2 ms), 0.058 (5 ms) and 0.106 (10 ms), and both broader
    windows exceed 2 ms (FDR p = 0.0208; 0.0417 under reading b); from 5 to 100 uA the proportion
    rises by 0.005, 0.041 and 0.073. The 100 uA proportions are below the paper's 0.092 and 0.175 under
    both readings (b gives 0.057 and 0.091). With seven recordings the smallest exact Wilcoxon p is
    0.0156.
  deviations:
  - Seven recordings in place of nine.
- claim: fig5bc-amplitude-clusters
  outcome: reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig5bc-amplitude-clusters
  measured:
  - 0.702
  - 0.352
  - 0.586
  - 0.192
  - 0.152
  - 0.071
  notes: Under reading (a), the code's unscaled nDRP, Ward clustering of the 99 responders gives CCC
    = 0.702, silhouette = 0.352 and clusters of 15, 19, 40, 13, 7 and 5 units. Labelling them 25 uA,
    5 uA, dose, dose, 100 uA and dose gives 15.2%, 19.2%, 58.6% and 7.1%, the paper's fractions, the
    assignment the criterion allows. By the claims file's half-peak rule the 7-unit cluster peaks at
    50 uA (mean nDRP 0.651 against 0.343 at 100 uA) and the 13-unit cluster is the one selective for
    100 uA, so no assignment that follows the clusters' peaks matches; the paper's "100 uA" cluster
    is better described as selective for 50 uA. Reading (b), vectors divided by their maximum, gives
    CCC 0.840, silhouette 0.501 and no matching assignment.
- claim: fig5ef-polarity-clusters
  outcome: partially_reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig5ef-polarity-clusters
  measured:
  - 0.773
  - 0.538
  - 0.623
  - 0.205
  - 0.232
  - 0.186
  notes: Under reading (a), the code's population of units responsive to any polarity (220 units, as
    the code), CCC = 0.773 and silhouette = 0.538 are within 10% and three clusters prefer one
    polarity; anodal (0.232) and cathodal (0.186) match, bipolar (0.205) is below 0.277, and the
    polarity-specific total is 0.623 against 0.691. With the bipolar pair whose cathodal contact lies
    nearest layer 5 units (Methods, "in or near Layer 5"; changes jlh34 only), 235 units give 0.260,
    0.213 and 0.196, cathodal just outside 0.177 +- 0.018. Among the 99 cathodal responders (reading
    b) no cluster prefers bipolar or anodal pulses. A polarity bias is present; the fractions do not
    all match under one reading.
  deviations:
  - The contact nearest layer 5 is judged from the region of the nearest unit, as the dataset gives
    no region for the contacts.
- claim: fig5-fsrs-proportion
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig5-fsrs-proportion
  measured:
  - 0.0196
  - 0.0227
  - 0.0111
  - 0.0221
  notes: Under the code's classes (616 FS and 1352 RS units), responders are sparse in both classes
    (FS 0.0196, 0.0097, 0.0162, 0.0227; RS 0.0111, 0.0200, 0.0251, 0.0221 at 5 to 100 uA). Amplitude
    has an effect when numeric (F = 4.33, p = 0.037) and not when categorical (F = 1.93, p = 0.123);
    class (p = 0.437) and interaction (p = 0.150) have none. Under the Methods' k-means (332 FS) the
    class effect is significant (F = 4.85, p = 0.028). The four proportions the criterion compares are
    outside 10% of 0.032, 0.040, 0.013 and 0.037. Reading (b), units within the evoked potential,
    which may be what the paper's values describe, needs the evoked-potential boundaries and was not
    run.
  deviations:
  - Assumed the FS and RS classes of the paper's code (dlab utils.classify_waveform_shape called with
    kmeans=0, a 0.4 ms duration threshold), where the Methods describe k-means on normalised duration,
    peak-to-trough ratio and repolarisation slope. The code is what the paper ran, its classes give
    the paper's statistics exactly in fig5j-fs-closer, and the Methods leave the k-means normalisation
    and initialisation open; the k-means reading (dlab's k-means branch) is shown. Asked of the
    authors (see findings).
  - Reading (b) of the criterion was not run (no evoked-potential boundaries).
- claim: fig5j-fs-closer
  outcome: reproduced
  assumed: true
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig5j-fs-closer
  measured:
