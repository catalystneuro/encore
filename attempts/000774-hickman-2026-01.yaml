- claim: fig5bc-amplitude-clusters
  outcome: reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig5bc-amplitude-clusters
  measured:
  - 0.702
  - 0.352
  - 0.586
  - 0.192
  - 0.152
  - 0.071
  notes: Under reading (a), the code's unscaled nDRP, Ward clustering of the 99 responders gives CCC =
    0.702, silhouette = 0.352 and clusters of 15, 19, 40, 13, 7 and 5 units. Labelling them 25 uA, 5 uA,
    dose, dose, 100 uA and dose gives 15.2%, 19.2%, 58.6% and 7.1%, the paper's fractions, the assignment
    the criterion allows. By the claims file's half-peak rule the 7-unit cluster peaks at 50 uA (mean
    nDRP 0.651 against 0.343 at 100 uA) and the 13-unit cluster is the one selective for 100 uA, so no
    assignment that follows the clusters' peaks matches; the paper's "100 uA" cluster is better described
    as selective for 50 uA. Reading (b), vectors divided by their maximum, gives CCC 0.840, silhouette
    0.501 and no matching assignment. Whether the criterion's "some assignment" clause is meant to pass
    clusters that do not respond almost only at one amplitude is asked of a reader.
- claim: fig5ef-polarity-clusters
  outcome: reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig5ef-polarity-clusters
  measured:
  - 0.773
  - 0.538
  - 0.705
  - 0.287
  - 0.232
  - 0.186
  notes: Under reading (a), the code's population of units responsive to any polarity (220 units), CCC
    = 0.773 and silhouette = 0.538 are within 10%. Five assignments of the six clusters to the three polarities
