- claim: fig6e-circuit-responders
  outcome: partially_reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig6e-circuit-responders
  measured:
  - 0.125
  - 0.209
  - 0.52
  - 0.785
  - 0.089
  - 0.36
  notes: With zetapy 2.7.2 getZeta (the function the code calls) the proportion of cortical circuit responders
    is 0.125, 0.209, 0.520 and 0.785 and of subcortical ones 0.089, 0.094, 0.164 and 0.360 (7 recordings),
    above one half for cortex at 50 and 100 uA. The cathodal model gives amplitude F = 89.48 (p = 6.84e-13),
    region F = 36.59 (p = 1.61e-07) and interaction F = 15.26 (p = 2.72e-04); the Results' cathodal values
    are F region 40.14 and interaction 15.61. Two values are just outside 10% (cortical 0.125 against
    0.14, subcortical 0.089 against 0.08 at 5 uA). The recomputed p-values agree with the paper's cached
    ones (Pearson r = 0.992, same decision for 0.970 of 7980 tests), and the cached ones give 0.14, 0.21,
    0.52, 0.79 and 0.08, 0.09, 0.17, 0.35 on the dataset's units, the paper's values, and amplitude F
    = 172.99 and region F = 85.99 in the code's full model (paper 175.18 and 81.50). The difference is
    the resampling of the ZETA test.
  deviations:
  - Only the cathodal conditions were tested with ZETA (7980 tests, 9 minutes); the code's full model
    over three polarities would take about 20 minutes more and is shown with the cached p-values.
