- claim: fig4j-drp-increases
  outcome: reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig4j-drp-increases
  measured:
  - 99
  - 0.116
  - 0.142
  - 0.194
  - 0.233
  notes: 103 units respond (nDRP > 0.15) at some cathodal amplitude and 99 have a value at all four (from
    7 recordings, 2 to 28 each). Mean nDRP is 0.116, 0.142, 0.194 and 0.233. Reading (a), the code's regression
    on numeric amplitude, gives F = 12.779, p = 0.00039 (paper F = 12.78, p = 0.0004); (b) a one-way ANOVA
    with amplitude categorical gives F = 4.44, p = 0.0044 and (c) a repeated-measures ANOVA F = 4.66,
    p = 0.0034. The number of good stable units per cathodal condition (2056, 2068, 2070, 2071) equals
    that of the code's intermediate table direct_df.csv. jlh31 and jlh34 ran most cathodal conditions
    twice at the one cathodal contact; the first run is used. With the second run, 91 units respond with
    values at all four amplitudes, mean nDRP 0.125, 0.092, 0.157 and 0.223, F = 12.41, p = 0.00048.
  deviations:
  - The stability filter is recomputed from the Methods (the paper's flags are not in the dataset); the
    time origin of the fit and the set of units the quartiles are taken over are not stated and were chosen
    as the first spike of the recording and all units (a standard choice). The unit counts per condition
    match the code's.
