- claim: fig6c-modulation-cortex
  outcome: partially_reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig6c-modulation-cortex
  measured:
  - 12.6
  - 20.21
  - 12.27
  - 13.48
  notes: Under reading (a), the code's (0 to 500 ms, 10 ms bins), the magnitudes are 12.60, 13.37,
    15.11, 20.21 (cortical, 1287 units) and 12.27, 12.60, 12.08, 13.48 (subcortical, 351 units), the
    paper's values, with region F = 106.27, amplitude F = 487.36 and interaction F = 90.88 (all p <
