- claim: fig4d-latency-trough
  outcome: reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig4d-latency-trough
  measured: 1.95
  notes: The trough of the first-spike latency histogram (0.1 ms bins, centre in 0.5 to 5 ms) lies at
    1.95, 1.75, 1.95 and 1.95 ms for 5 to 100 uA cathodal pulses, median 1.95 ms, with a higher bin before
    and after it in all 12 conditions. Over all 12 polarity and amplitude conditions the median is 1.45
    ms (anodal and bipolar troughs 1.05 to 1.45 ms); the criterion takes the four cathodal amplitudes,
    as the code does. The later cathodal peaks are at 3.75 to 11.85 ms. With the first 75 trials and stable
    units only, the cathodal median is 1.85 ms. The verifier reads the paper's "median across parameters"
    as all 12 conditions (1.45 ms, outside tolerance); this is asked of a reader (questions/000774.yaml).
  deviations:
  - Latencies come from all trials of the condition's contact and all good units, as the code (figure4_figure5_figure6.ipynb
    cell 20), from the seven recordings that hold cathodal pulses.
- claim: figs3cd-gmm-window
  outcome: reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:figs3cd-gmm-window
  measured:
  - 0.683
  - 1.139
  - 1.221
  - 1.47
  notes: Four-component mixtures give windows of 0.683, 1.139, 1.221 and 1.470 ms, and BIC chooses four
    components at every amplitude, so readings (a) and (b) agree. Over the seven recordings with cathodal
    pulses the responder proportion with the GMM windows does not differ from the 2 ms window at any amplitude
    (Wilcoxon, FDR-adjusted p 1.0, 0.667, 0.25 and 0.25) under both baseline readings. Pooled over amplitudes,
    the GMM windows give fewer responders (Wilcoxon p = 0.0022), a test the legend does not name.
  deviations:
  - Seven recordings, where the S3D legend implies nine; two recordings hold no cathodal pulses.
  - The crossover is taken as the first latency after the earliest component's mean where the second component's
    posterior reaches the first's; the Methods say only "crossover points where adjacent component responsibilities
    were equal" (STAR Methods, Gaussian mixture models).
- claim: fig4f-responders-within-ep
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig4f-responders-within-ep
  measured:
  - 0.4
  - 0.778
  - 0.882
  - 1.0
  notes: With the code's mean evoked-potential boundaries (outside input; -424 to 510, -725 to 605, -812
    to 747 and -750 to 888 um at 5 to 100 uA) and the dataset's coordinates, the fractions of RS responders
    within (reading b, the code's classes) are 0.400, 0.778, 0.882 and 1.000; three are within 10% and
    5 uA is the lowest, but 0.400 is outside 0.333 +- 0.033. Over all responders (reading a) they are
    0.552, 0.794, 0.889 and 1.000. With the code's coordinates reading (b) gives 0.333, 0.741, 0.882 and
    1.000 and reading (a) 0.483, 0.765, 0.889 and 1.000, the paper's and the code's values; the 5 uA difference
