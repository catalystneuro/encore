- claim: fig6d-hva-subcortical
  outcome: not_reproduced
  notebook: reproduce_hickman_2026.ipynb
  output: claim:fig6d-hva-subcortical
  measured:
  - 13.91
  - 13.48
  notes: With the legend's groups (LM, AM and PM, 120 units) HVA units have a magnitude of 13.91 at 100
    uA and subcortical units 13.48 (351 units), Tukey p = 0.902; the distances of HVA and subcortical
    units do not differ (Mann-Whitney p = 0.577), as in the paper. With the code's broader HVA group
    (any layered name outside V1, 349 units, of which 151 are superior colliculus or dentate gyrus
    units) the values are 15.82 and 13.68 and Tukey p = 0.0202, but the distances then differ (p =
