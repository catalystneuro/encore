findings:
- kind: data_missing
  statement: The raw AP band, LFP band and NI-DAQ files are not deposited (the paper says they are
    available on request), so the evoked-potential analyses of Figures 1 to 3, S1 and S2 cannot be
    repeated, nor the comparisons of units with the evoked-potential boundaries (Figures 4F, 4I and
    5I). 14 of the 42 claims are blocked for this reason.
- kind: data_missing
  statement: The behaviour of the four trained mice (Figure 7 and S10) is not deposited on DANDI or
    elsewhere that the paper names; the paper's code reads it from local CSV files. 10 claims are
    blocked for this reason.
- kind: code_mismatch
  statement: The stimulation contact coordinates of jlh31 and jlh32 in the trials table differ from
    those in the paper's code repository by 206 um (100, 150, -100) and 373 um (370, 0, -50); the other
    seven recordings agree exactly. With the code's coordinates the distance results of Figure 4H
    match the paper exactly; with the dataset's, the 5 against 100 uA KS test is no longer significant
    after correction.
- kind: metadata_error
  statement: The file of session jlh49v1, which the paper and its code treat as a separate recording
    and mouse, is filed under subject jlh48. Its subject age (P381D) is one day more than that of the
    jlh48 file, which was recorded four months later.
- kind: metadata_insufficient
  statement: The electrodes table holds placeholders (location "none" for all 1152 channels, x 5 to
    53, y 0, z 3820, impedance 0), so channel CCF coordinates and regions are not given; the paper's
    signed distances need them and here they are fitted from the units' coordinates. The stimulation
    contacts have coordinates but no region.
- kind: metadata_insufficient
  statement: The units table holds neither the waveform classes (FS, RS, up, axon) nor the stability
    flags the paper uses to select units; both are recomputed here (the stability filter gives the
    same number of units per condition as the code's intermediate table).
- kind: selection_undocumented
  statement: The dandiset holds ten recordings; the paper analyses nine. The tenth, jlh41 ("lots of
    noise issues ... not much analyzed yet here"), has no CCF coordinates or regions, and the dandiset
    does not say it was left out.
- kind: other
  statement: Cathodal single pulses are in seven of the nine recordings (jlh39 and jlh49v1 hold only
    bipolar pulses, jlh40 no bipolar), while the legends of the cathodal analyses give n = 9
    recordings. jlh33 has 60 trials per condition, where the Methods state 75, and no anodal 50 uA
    single pulse. Trial and spike times of jlh40 and jlh53concat are negative in part.
- kind: code_mismatch
  statement: The FS and RS classes of the paper's code are a 0.4 ms threshold on waveform duration
    (dlab classify_waveform_shape called with kmeans=0), where the Methods describe k-means on three
    normalised features. The two give 616 and 332 FS units and different outcomes for fig5j-fs-closer
    and figs6b-fsrs-early-firing.
- kind: methods_unavailable
  statement: Question for the authors. Were the FS and RS classes of Figures 5G to 5J and S6 assigned
    by k-means (Methods) or by the 0.4 ms duration threshold the code runs? This attempt assumed the
    threshold, whose classes give the paper's statistics exactly; under k-means FS responders are not
    significantly closer than RS responders (p = 0.087).
- kind: code_mismatch
  statement: For Figure 6D the code's HVA group takes any CCF name with "layer" outside V1, which adds
    151 superior colliculus and dentate gyrus units to LM, AM, PM and other areas; the legend names
    LM, AM and PM. The paper's 15.82 comes from the code's group; with the legend's group HVA and
    subcortical modulation do not differ (13.91 against 13.48, Tukey p = 0.902).
- kind: code_mismatch
  statement: The code's map_region_to_group looks for "posteromedial area", which matches no CCF name
    in the files ("posteromedial visual area"), so 16 PM units are left out of the cortical circuit
    responders of Figure 6E.
- kind: methods_unavailable
  statement: Question for the authors. The Methods compute the modulation index over 500 to 1000 ms
    with 5 ms bins, the Figure 6C legend over a 500 ms window from onset with 5 ms bins, and the code
    over 0 to 500 ms with 10 ms bins; the printed magnitudes are the code's. Which is meant? Over 500
    to 1000 ms there is no cortical against subcortical difference (p = 0.457).
