- claim: fig3d-real-and-synthetic-alike
  outcome: reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:fig3d-real-and-synthetic-alike
  notes: Live flower against the floral odor -0.027 (p = 0.94) and live floral scent 0.067 (p =
    0.86) under reading (a); 0.93 and 0.86 under reading (b). Table S11 gives -0.027 and 0.069.
- claim: fig3d-visits-per-night
  outcome: reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:fig3d-visits-per-night
  measured:
  - 1.928
  - 0.566
  - 70.7
  notes: Visits per hour times 7 give 1.928 for the live flower and 0.566 for the NO3-oxidized
    odor, a drop of 70.7%; with the synthetic floral odor as the untreated flower, 1.980 and a drop
    of 71.4%. Both readings are within tolerance.
- claim: fig4ab-no3-shortens-recognition
  outcome: blocked
  blocked_by: data_missing
  notes: The recognition distance is the degradation time times the bottom-level wind speed, and
    the GEOS-Chem file in the Zenodo release holds NO3, O3, pressure, temperature and grid volume
    but no wind; the Dryad deposit holds no model output. The "many populated areas below 400 m"
    part needs absolute distances. What does not need the wind is shown, deciding nothing; the
    NO3 time is shorter than the O3 time in 37% (reading i, either threshold) to 100% (reading
    ii) of land cells.
- claim: table-s13-recognition-distances
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the bottom-level wind speed, which is not deposited (see fig4ab), and the city
    coordinates of ref. 79. Five of the eight expected values are distances; at most three
    (the percentages) could be computed without the wind, fewer than the six the criterion asks
    for partial reproduction.
- claim: fig4c-preindustrial-change
  outcome: blocked
  blocked_by: data_missing
  notes: Depends on fig4ab-no3-shortens-recognition, which is blocked, and its readings need the
    Table S13 cities. The ratio of present to preindustrial distance does not need the wind, and is
    shown, deciding nothing; over land its median is 14% to 16% with NO3 alone and 42% to 48% with
    NO3 and O3, and in a box around Greenland the median is 34% to 66%, with no reading putting
    most Greenland cells above 75%.
- claim: interannual-similar
  outcome: blocked
  blocked_by: data_missing
  notes: The 13.2.1 runs for 2013, 2019 and 2021 are not deposited; the Zenodo release holds only
    the preindustrial over 2013 factor maps, and the Dryad deposit no model output.
- claim: figs8-no3-faster-than-o3
  outcome: not_reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:figs8-no3-faster-than-o3
  measured:
  - 3.48
  - 42.98
  notes: The July 2013 bottom-level means over land cells between 10 and 50 N are 3.48 ppt NO3 and
    43.0 ppb O3, outside 2.6 +- 0.26 and 37 +- 3.7. No variant over the northern band (June,
    August, mostly-land cells, all cells) gives both; June over land in both hemispheres (10 to 50
    N and S) gives 2.69 ppt and 39.1 ppb, both within tolerance, but the criterion names the
    northern band only. The rest of the criterion holds at the recomputed and at the paper's
    concentrations; NO3 is faster for 17 of 23 compounds, a-humulene and b-caryophyllene are
    faster with O3 (as are a-terpinene and the three green leaf volatiles), and a-terpinene, a
