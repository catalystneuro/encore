inputs:
- what: The paper's code release (its ref. 41), which holds data the Dryad deposit lacks, read for
    the claims marked data elsewhere. Used were the fruit-set counts in the pairwise.prop.test call
    of "Figure 1/Fig 1D R script for analyzing Opall fruit set clean.R", the raw Vocus traces of the
    five compounds in "Figure 2/", the wind tunnel counts in "Figure 3/Fig 3B Hyles and Manduca wind
    tunnel behavior data.xlsx", and the GEOS-Chem 12.1.0 bottom-level fields and 13.2.1 factor maps
    in "Figure 4/". Zenodo record 8411927, the only version, file Chan-et-al-v1.zip (md5 b28d968507206b9adafac0a428a6556d),
    a release of riffelllab/Chan-et-al at commit ffc1559.
  source: doi:10.5281/zenodo.8411927
- what: Land mask for the GEOS-Chem grid, the package the Supplementary Methods name (Global models,
    "a modified version of the global-land-mask 1.0.0 package"), used unmodified; a cell is land when
    any 0.1 degree point in it is land. Wheel sha256 07751fbb4e3834ee508a84ea64d9bd5340fbd0a8c951e24b43c323fcc670bb62,
    locked in the entry.
  source: https://pypi.org/project/global-land-mask/1.0.0/ (https://github.com/toddkarin/global-land-mask)
- what: Bottom-level (level 1) U and V of GEOS-Chem's processed MERRA-2 meteorology (A3dyn, 3-hourly
    means, 0.5 x 0.625 degrees) for every day of July and January 2013, read by ranges from the public
    GEOS-Chem data bucket (https://gcgrid.s3.amazonaws.com/GEOS_0.5x0.625/MERRA2/2013/), and averaged
    to the 2 x 2.5 degree grid. The paper's distances use the bottom-level wind of its 12.1.0 run,
    driven by MERRA-2 2013 (Supplementary Methods, Global models); that wind is not deposited and
    the 2 x 2.5 degree 2013 files are not on the bucket.
  source: doi:10.5067/SUOQESM06LPK (MERRA-2 tavg3_3d_asm_Nv), as processed for GEOS-Chem at https://gcgrid.s3.amazonaws.com/GEOS_0.5x0.625/MERRA2/2013/
- what: City coordinates and 2018 populations of the 97 Table S13 cities, from UN World Urbanization
    Prospects 2018, file WUP2018-F22-Cities_Over_300K_Annual.xls (sha256 4366cc15ecdda4d9ab420adfe730da6a7e35a8334615f50172a08d60b121c11c),
