findings:
- kind: data_missing
  severity: major
  notebook: reproduce_chan_2024.ipynb
  output: finding-missing-data
  statement: The Dryad deposit's description is the GEOS-Chem modelling, but it holds no model output.
    It also holds no pollinator visit log (Table S2), no fruit-set data (Table S3), no Fig. 3B wind
    tunnel counts, no raw Vocus traces, no GC-MS samples or calibration standards (Tables S5 and S6),
    and one GC-EAD trace per species where the paper used 8 and 13 antennae. The paper's Zenodo code
    release (doi:10.5281/zenodo.8411927) holds the fruit-set counts (in an R script), the Fig. 3B
    counts, the Vocus traces, one field GC-MS run and the 2013 GEOS-Chem fields, without wind and
    without the 2019 and 2021 runs; the visit log, the other GC-EAD antennae, the GC-MS samples and
    standards, and the model winds are in neither.
- kind: other
  about: data
  severity: critical
  notebook: reproduce_chan_2024.ipynb
  output: finding-eag-duplicated-series
  statement: In Fig_S5_Manduca_Hyles_EAG_dose_response_mean_of_largest.csv the Hyles column repeats
    eight consecutive values of one dose series (1e-5 to 3 floral equivalents, file rows 12 to 19)
    as the next series (rows 21 to 28); only the 1e-6 value differs. No other run of eight identical
    values occurs in either column. One antenna's dose response appears to be deposited twice, as
    two antennae.
- kind: metadata_error
  severity: major
  notebook: reproduce_chan_2024.ipynb
  output: finding-eag-counts
  statement: The EAG file holds 159 values per species, 16 to 18 at each of 9 concentrations (1e-6
    to 3 floral equivalents), so about 18 antennae per species. The Methods state 159 moths per species
    (318 in all) and 8 concentrations from 1:100,000,000 to 1:33. The file and README also call this
    Fig. S5, which is Fig. S7 in the paper.
- kind: other
  about: paper
  notebook: reproduce_chan_2024.ipynb
  output: finding-fig3b-control-is-1x
  statement: In the Fig. 3B sheet of the Zenodo release, the Manduca floral-odor group is 11 of 12
    moths, the same counts as the 1x row of the Dryad dose-response file (Fig. S7C), while the 0.01x
    row is 10 of 14. The Methods say Manduca were tested at 1/100 floral equivalent in all Fig. 3B
    treatments, so the reference group of the 50% decrease appears to be the 1x data. The sheet holds
    113 Manduca, where the Methods give 138, and the floral-odor group of 12 is below the Methods'
    15 to 42 moths per stimulus.
- kind: metadata_error
  severity: major
  notebook: reproduce_chan_2024.ipynb
  output: finding-fig2d-file
