  - Measured gives the nightly-mean reading for O3, NO2 and RH, and the 0 to 6 am rows for the wind.
findings:
- kind: data_missing
  severity: major
  notebook: reproduce_chan_2024.ipynb
  output: finding-missing-data
  statement: The Dryad deposit's description is the GEOS-Chem modelling, but it holds no model
    output. It also holds no pollinator visit log (Table S2), no fruit-set data (Table S3), no
    Fig. 3B wind tunnel counts, no raw Vocus traces, no GC-MS samples or calibration standards
    (Tables S5 and S6), and one GC-EAD trace per species where the paper used 8 and 13 antennae.
    The paper's Zenodo code release (doi:10.5281/zenodo.8411927) holds the fruit-set counts (in an
    R script), the Fig. 3B counts, the Vocus traces, one field GC-MS run and the 2013 GEOS-Chem
    fields, without wind and without the 2019 and 2021 runs; the visit log, the other GC-EAD
    antennae, the GC-MS samples and standards, and the model winds are in neither.
- kind: other
  about: data
  severity: critical
  notebook: reproduce_chan_2024.ipynb
  output: finding-eag-duplicated-series
  statement: In Fig_S5_Manduca_Hyles_EAG_dose_response_mean_of_largest.csv the Hyles column repeats
    eight consecutive values of one dose series (1e-5 to 3 floral equivalents, file rows 12 to 19)
    as the next series (rows 21 to 28); only the 1e-6 value differs. No other run of eight
    identical values occurs in either column. One antenna's dose response appears to be deposited
    twice, as two antennae.
- kind: metadata_error
  severity: major
  notebook: reproduce_chan_2024.ipynb
  output: finding-eag-counts
  statement: The EAG file holds 159 values per species, 16 to 18 at each of 9 concentrations (1e-6
    to 3 floral equivalents), so about 18 antennae per species. The Methods state 159 moths per
    species (318 in all) and 8 concentrations from 1:100,000,000 to 1:33. The file and README also
    call this Fig. S5, which is Fig. S7 in the paper.
- kind: other
  about: paper
  notebook: reproduce_chan_2024.ipynb
  output: finding-fig3b-control-is-1x
  statement: In the Fig. 3B sheet of the Zenodo release, the Manduca floral-odor group is 11 of 12
    moths, the same counts as the 1x row of the Dryad dose-response file (Fig. S7C), while the
    0.01x row is 10 of 14. The Methods say Manduca were tested at 1/100 floral equivalent in all
    Fig. 3B treatments, so the reference group of the 50% decrease appears to be the 1x data.
- kind: metadata_error
  severity: major
  notebook: reproduce_chan_2024.ipynb
  output: finding-fig2d-file
  statement: Fig2D_ToFdata.txt does not hold the traces Table S9 is computed from. Under the paper's
    windows its b-pinene trace gives -28.9% with O3 and -74.4% with NO3, while the raw trace in the
    Zenodo release, processed by the paper's Dryad notebook, gives Table S9's -32.5% and -83.9%
    (its ocimene trace agrees, -29.8% and -66.8%). Its time column steps by 1.0035, seconds as in
    the raw files, where the README says minutes.
- kind: metadata_insufficient
  severity: minor
  notebook: reproduce_chan_2024.ipynb
  output: finding-caps-clock
  statement: In the CAPS NO2 files the IgorTime column, which the README lists first, differs from
    the Timestamp column by 147 to 164 days in 15 of 17 files and agrees in two, so it is not the
    clock. The status codes (10004, 11004, 12004, 4) are not described; rows with 11004 and 12004
    have no NO2, and status-4 rows include NO2 of -437 ppb.
- kind: metadata_insufficient
  severity: major
  notebook: reproduce_chan_2024.ipynb
  output: finding-anemometer-time
  statement: Table_S1_anemometer_data.txt has no timestamps and one log header (2018-08-01
    22:15:22), while the README says it concatenates the sampling times; its 1,387,308 rows are 12.0
    h at 32 Hz. The midnight to 6 am rows of Table S1 cannot be located. Its mean horizontal speed
    is 2.11 m/s over all rows and 1.70 m/s over the rows that would fall between midnight and 6 am
    if continuous, against 1.14 m/s in Table S1.
- kind: metadata_insufficient
  severity: minor
  notebook: reproduce_chan_2024.ipynb
