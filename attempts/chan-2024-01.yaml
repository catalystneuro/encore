    the 0.01x row the Methods imply (finding).
  deviations:
  - Counts from the Fig. 3B sheet in the Zenodo release.
- claim: fig3b-o3-no2-no-effect
  outcome: reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:fig3b-o3-no2-no-effect
  notes: By the plain z-test the floral odor (0.917) against O3 (15 of 24, 0.625) gives p = 0.066
    and against NO2 (17 of 24, 0.708) p = 0.16; differences 29 and 21 percentage points. With
    Holm adjustment over the 15 Manduca pairs, p = 0.59 and 0.94. With 12 moths at the floral odor
    the test has little power; the O3 difference is near the threshold.
  deviations:
  - Counts from the Fig. 3B sheet in the Zenodo release.
- claim: fig3b-proxy-mixture
  outcome: reproduced
  assumed: true
  notebook: reproduce_chan_2024.ipynb
  output: claim:fig3b-proxy-mixture
  notes: The proxy mixture (7 of 19, 0.368) is lower than the floral odor (p = 0.0026 by the z-test,
    0.036 after Holm over the 15 pairs) and does not differ from clean air (p = 0.83) or the
    NO3-oxidized odor (p = 0.74). Under prop.test with Yates' correction the comparison with the
    floral odor gives p = 0.0083 unadjusted and 0.12 after Holm.
  deviations:
  - The sheet labels the proxy mixture "blend of oxidized scent"; it is taken to be the NO3-proxy
    mixture, the only Manduca treatment of the Methods left once the others are matched by name.
  - Counts from the Fig. 3B sheet in the Zenodo release.
- claim: figs7-manduca-sensitivity
  outcome: reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:figs7-manduca-sensitivity
  notes: Mean Manduca EAG exceeds mean Hyles EAG at all nine concentrations of the file (1e-6 13.1
    against 10.0 mV, 1e-4 22.8 against 17.6, 1e-2 42.8 against 22.7), with or without the
    duplicated Hyles series. In the wind tunnel 0.01x against 1x (10 of 14, 11 of 12) gives p =
    0.19 by the z-test (0.42 by prop.test; the paper 0.09), and 0.001x against 1x (13 of 22) gives
    p = 0.046 by the z-test, so 0.01x is the lowest dose not different from 1x under reading (i);
    prop.test (p = 0.11) does not separate 0.001x.
  deviations:
  - The EAG file holds 9 concentrations (1e-6 to 3 floral equivalents) and about 18 values per
    concentration, not the Methods' 8 concentrations and 159 moths; the comparison uses the
    file's concentrations.
- claim: fig3d-field-no3-fewer-visits
  outcome: reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:fig3d-field-no3-fewer-visits
  measured:
  - -1.253
  - 0.283
  - 0.081
  notes: The Poisson GLM on the Table S10 counts gives an NO3 coefficient of -1.253 (SE 0.567, z =
    -2.21, p = 0.027) under both readings, as Table S11, and NO3 against the no-odor control gives
