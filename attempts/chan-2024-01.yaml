- claim: figs6-oxidation-products
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_chan_2024.ipynb
  output: claim:figs6-oxidation-products
  notes: In the later segment of the workbook (taken as NO3) the three nitrates rise 17 to 23 times
    their clean-air level and C10H16O4 and C10H18O4 6.0 and 7.6 times. In the earlier segment (taken
    as O3) C10H16O4 and C10H18O4 rise 6.8 and 9.3 times and the nitrates also rise, 1.18, 1.46 and
    1.39 times, with one-sided Welch p of 0.0002 to 0.001 on 5 against 9 points. The criterion is
    met only under the doubling reading (r3), a threshold this attempt chose and the deciding assumption;
    under the test (r1) and 3 SD (r2) readings the nitrates also rise with O3. The NO3 part holds
    under every reading and the O3 part under r3 only, so the claim holds in part. The README does
    not name the segments. Question for the paper's authors (finding) on which segment is which oxidant
    and what counts as a product forming.
  deviations:
  - The workbook does not say which segment is which oxidant; the earlier one is taken as the O3 stage
    and the later as the NO3 stage, as the Supplementary Methods (Characterization of free-radical
    oxidation) run each flowtube experiment as clean air, then O3 (stage II), then NO3 (stage III).
  - The paper does not define a rise above the clean-air level; three readings were run (a one-sided
    Welch test on 5 against 9 and 4 against 7 points, every point above the clean mean plus 3 SD,
    a mean of at least twice the clean mean). All three are this attempt's choices. Only the doubling
    reading meets the criterion, and the others do not, hence partially reproduced.
  - The oxidant onset in each segment is the first row where C10H16O4 exceeds twice the median of
    the segment's first five rows (a standard choice).
