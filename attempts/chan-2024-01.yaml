- claim: fig2d-no3-degrades-monoterpenes
  outcome: reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:fig2d-no3-degrades-monoterpenes
  measured:
  - -32.54
  - -83.9
  - -29.78
  - -66.81
  notes: On the raw Vocus traces (Zenodo) processed as the paper's notebook does, the windows of the
    paper's Table S9 notebook, NO3 against clean air, give b-pinene -32.5% with O3 (Welch t, p = 2.2e-120)
    and -83.9% with NO3 (Mann-Whitney U, p = 4.8e-67), ocimene -29.8% (Mann-Whitney U, p = 5.0e-54)
    and -66.8% (Welch t, p = 2.2e-171), the tests and p values of Table S9. In the notebook's own
    form, the difference of normalized means, ocimene gives -29.9% and -67.0%. As variants, reading
    (a) (last half of each stage) gives -33.7%, -85.0%, -30.7% and -66.4%, and reading (b) (whole
    stages) -33.1%, -82.4%, -29.2% and -64.6%, all within tolerance with every p below 1e-52. Reading
    (ii), NO3 against the O3 stage, gives -76.1% and -52.7% under the notebook's windows, and ocimene
    is then outside tolerance. The deposited Fig. 2D file gives -28.9% and -74.4% for b-pinene under
    the paper's windows (finding). What the reader's answer changed (questions/chan-2024.yaml) - the
    criterion now takes the notebook's windows as the paper's method and keeps readings (a) and (b)
    as variants, so the measured values are now those of the notebook's windows in place of reading
    (a); the outcome, reproduced before under every reading, is unchanged.
  deviations:
  - Tested on the raw traces in the Zenodo release; the Dryad deposit holds only the normalized Fig.
    2D traces, shown in finding-fig2d-file.
  - Stage onsets for readings (a) and (b) are placed where the trace, smoothed by a 15-point running
    mean, crosses half-way between the stage levels (a standard choice); the levels are the means
    of the paper's notebook windows.
  - Trace processing (section, detrend, baseline window) and the clean, O3 and NO3 windows are those
    of the Dryad notebook Fig_S4_Table_S9_VOCUS_analysis_and_plotting.ipynb, cells 29 to 33, which
    the criterion names as the paper's method.
  - Changes are given as the ratio of stage means to the clean-air mean; the notebook prints the difference
    of normalized means, which is the same for b-pinene (its clean window is its baseline window)
    and differs by up to 0.23 points for ocimene; both are printed.
- claim: fig2d-other-compounds-unchanged
  outcome: reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:fig2d-other-compounds-unchanged
  notes: With the windows of the paper's Table S9 notebook (Dryad), NO3 against clean air, no p for
    the three compounds is below 0.05 (smallest 0.065, aldoxime with O3), and the changes are those
    of Table S9 (aldoxime -0.1% and -0.6%, benzaldehyde +0.4% and +2.1%, nonanal -0.4% and -0.9%).
    As variants, which do not decide the outcome, reading (a) gives the aldoxime -0.56% with O3 (p
    = 0.00093) and -0.70% with NO3 (p = 0.00017), and nonanal +4.0% with NO3 (p = 0.025); reading
    (b) gives the aldoxime -0.57% with NO3 (p = 5.2e-05). These aldoxime effects are below 1% and
    reach significance because each window holds hundreds of time points. NO3 against the O3 stage,
    which the criterion does not use, gives the aldoxime -0.47% (p = 2.7e-05) under the notebook's
    windows. Benzaldehyde has no p below 0.05 under any reading (changes -2.3% to +2.1%), and its
    data agree with Table S9 (0% and +2%), not the Fig. 2D inset (-9% and -12%). What the reader's
    answer changed (questions/chan-2024.yaml) - the criterion now judges this absence claim on the
    notebook's windows alone, with readings (a) and (b) as variants; under (a) and (b) the claim was
    not reproduced, and under the notebook's windows it is, so the outcome changes from not_reproduced
    to reproduced.
  deviations:
  - Tested on the raw traces in the Zenodo release; benzaldehyde and nonanal are not in the Dryad
    deposit.
  - The clean, O3 and NO3 windows are those of the Dryad notebook Fig_S4_Table_S9_VOCUS_analysis_and_plotting.ipynb,
    cells 31 to 33, including its test of the aldoxime's clean air on rows 100 to 200 of its 0 to
    300 window, as the criterion says.
  - The compounds show no step at the oxidant onsets, so for the variants their stage extents are
    the windows of the paper's notebook; readings (a) and (b) are the last half and the whole of these.
- claim: figs5-blend-oxidation
  outcome: partially_reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:figs5-blend-oxidation
  notes: 'After the NO3 onset (763 s) the monoterpene ion falls by 34.1% (reading a) or 32.9% (reading
    b), p below 1e-63, so the drop holds. The no-change half fails under the criterion''s test on
    the raw traces: the eucalyptol ion rises by 9.2% and 7.2% (p below 1e-74) and the aldoxime ion
    falls by 22.2% and 23.9% (p below 1e-52). On 30 s block means, which allow for the autocorrelation
    of the 1 s points, the raw eucalyptol rise keeps p of 8.6e-06 and 9.3e-06. These changes may be
    drift. With the linear detrend over the first 700 s that the paper''s notebook applies to the
    aldoxime of this run, the aldoxime change is +2.4% (p = 0.027, reading a) and -1.2% (p = 0.14,
    reading b) and the eucalyptol change +3.5% and +1.9% (p of 5.3e-17 and 6.2e-08; 0.012 and 0.22
    on block means), but the same detrend takes the monoterpene drop to -3.7% and -4.3%, as its fit
    window runs into the NO3 stage, so it cannot separate drift from chemistry. The paper''s notebook
    divides each ion of this run by the reagent ion (C6D6), whose trace is not deposited; the outcome
    may reflect that missing trace. Partially reproduced as the verifier gave it: the monoterpene
    drop holds and the absence part does not. What the reader''s answer changed (questions/chan-2024.yaml)
    - the criterion now says the Table S9 notebook''s index windows do not transfer to this run and
    keeps readings (a) and (b); the test is the same as before.'
  deviations:
  - The signals are not divided by the reagent ion (C6D6), as the paper's notebook does, because that
    trace is not deposited.
  - The clean-air stage is taken to start at 420 s, where the paper's notebook starts its plot and
    baseline; the NO3 onset is placed where the smoothed monoterpene trace crosses half-way between
    its clean-air level and its last 100 s (a standard choice).
  - As a limitation, the eucalyptol and aldoxime changes may be instrument drift that the missing
    reagent-ion trace would correct; detrended and block-mean variants are shown and decide nothing.
