- claim: figs9-urban-regressions
  outcome: blocked
  blocked_by: data_missing
  notes: Depends on table-s13-recognition-distances, which is blocked (no wind field, no city
    coordinates).
- claim: table-s1-field-conditions
  outcome: not_reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:table-s1-field-conditions
  measured:
  - 34.24
  - 0.994
  - 1.698
  - 47.51
  notes: From midnight to 6 am, over nightly means, O3 is 34.2 ppb (3 nights), NO2 0.994 ppb (6
    nights) and RH 47.5% (14 nights), all within tolerance (over samples 34.5, 0.995 and 47.7, RH
    then just outside). The horizontal wind speed is 1.70 m/s over the rows that would fall between
    midnight and 6 am if the anemometer log ran without a break from its header time, and 2.11 m/s
    over all rows, outside 1.14 +- 0.48; the speed of the mean wind vector is 1.83 m/s. The
    anemometer rows cannot be placed in time (finding) and the paper's "stable conditions" are not
    defined, so the wind comparison may rest on rows the paper did not use. All field files are
    from 2018, where Table S1 averages 2018 and 2019.
  deviations:
  - NO2 rows with a finite value were used; status 10004 only is shown as a variant (0.992 ppb).
  - The wind is computed from u and v of every row selected; no stability selection is applied,
