  deviations:
  - Counts from the Fig. 3B sheet in the Zenodo release; the Dryad deposit has no Fig. 3B data.
- claim: fig3b-manduca-no3-halves
  outcome: reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:fig3b-manduca-no3-halves
  measured: 54.1
  notes: Feeding falls from 11 of 12 (0.917) to 8 of 19 (0.421), a relative decrease of 54.1% (49.6
    percentage points under the second reading), with p = 0.0058 by the z-test and 0.017 by
    prop.test; the paper gives 0.047. NO3-oxidized odor against clean air (5 of 15) gives p = 0.60
