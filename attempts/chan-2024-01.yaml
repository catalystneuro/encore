inputs:
- what: The paper's code release (its ref. 41), which holds data the Dryad deposit lacks, read for
    the claims marked data elsewhere. Used were the fruit-set counts in the pairwise.prop.test call
    of "Figure 1/Fig 1D R script for analyzing Opall fruit set clean.R", the raw Vocus traces of
    the five compounds in "Figure 2/", the wind tunnel counts in "Figure 3/Fig 3B Hyles and Manduca
    wind tunnel behavior data.xlsx", and the GEOS-Chem 12.1.0 bottom-level fields and 13.2.1 factor
    maps in "Figure 4/". Zenodo record 8411927, the only version, file Chan-et-al-v1.zip (md5
    b28d968507206b9adafac0a428a6556d), a release of riffelllab/Chan-et-al at commit ffc1559.
  source: doi:10.5281/zenodo.8411927
- what: Land mask for the GEOS-Chem grid, the package the Supplementary Methods name (Global models,
    "a modified version of the global-land-mask 1.0.0 package"), used unmodified; a cell is land
    when any 0.1 degree point in it is land. Wheel sha256
    07751fbb4e3834ee508a84ea64d9bd5340fbd0a8c951e24b43c323fcc670bb62, locked in the entry.
  source: https://pypi.org/project/global-land-mask/1.0.0/ (https://github.com/toddkarin/global-land-mask)
outcomes:
- claim: fig1d-assemblage-day-night
  outcome: blocked
  blocked_by: data_missing
  notes: The video log of pollinator visits behind Table S2 is in neither the Dryad deposit nor the
    paper's Zenodo release (finding-missing-data lists both). Only the paper's table of counts
    exists, so neither the counts nor the test behind Z = 17.67 can be computed from data.
- claim: fig1e-bagged-fewer-fruit
  outcome: reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:fig1e-bagged-fewer-fruit
  measured:
  - 0.794
  - 0.114
  notes: From the counts in the paper's R script (Zenodo), unbagged 50 of 63 (0.794) and total
    exclusion 5 of 44 (0.114); R's pairwise.prop.test (Yates, Holm) gives adjusted p 1.71e-10 for
    the pair, as Table S4. The Dryad deposit holds no fruit-set data, and the flower-level records
    are not deposited anywhere, so this repeats the paper's test on its published counts.
  deviations:
  - The counts come from the paper's R script in the Zenodo release, not from the Dryad dataset.
- claim: fig1e-nocturnal-exclusion
  outcome: reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:fig1e-nocturnal-exclusion
  measured:
  - 0.477
  - 0.0082
  notes: Nocturnal exclusion 21 of 44 (0.477); Holm-adjusted p against unbagged 0.00824 (Table S4
    0.0082). Without Yates' correction the adjusted p is smaller (shown as a variant).
  deviations:
  - The counts come from the paper's R script in the Zenodo release, not from the Dryad dataset.
- claim: fig1e-groups
  outcome: reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:fig1e-groups
  notes: All ten Holm-adjusted p equal Table S4 at its printed precision (for example 0.5269 crossed
    against unbagged, 0.4645 for diurnal exclusion against unbagged, nocturnal exclusion against
    crossed and against diurnal exclusion, 1 for crossed against diurnal exclusion). Every pair
    that shares a letter has p of 0.4645 or more and every other pair p of 0.0082 or less, so all
    ten agree with the letters a, a,b, c, b, a,b.
  deviations:
  - The counts come from the paper's R script in the Zenodo release, not from the Dryad dataset.
- claim: nocturnal-share-of-fruit
  outcome: reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:nocturnal-share-of-fruit
  measured:
  - 39.86
  - 28.12
  notes: Under the criterion's first reading the share is (0.794 - 0.477) / 0.794 = 39.9%, and with
    the 70.6% drop in visitation of fig3d-visits-per-night (live flower) the reduction is 28.1%
    (28.5% with the floral odor as the untreated flower). The second reading, diurnal exclusion
    over unbagged, gives 82.8% and 58.4%, outside both tolerances.
  deviations:
  - Fruit-set counts from the paper's R script (Zenodo); visitation from the Dryad Table S10.
- claim: fig2a-gcead-monoterpenes
  outcome: blocked
  blocked_by: data_missing
  notes: The criterion counts antennae on which a peak is active (more than half of the 8 Manduca
    and 13 Hyles preparations). The Dryad deposit holds one GC-EAD trace per moth species and one
    for Megachile (finding-missing-data), and the GC trace carries no peak identities or retention
    times to place b-pinene and cis-b-ocimene; the other antennae are not deposited anywhere.
- claim: table-s6-emission-rates
  outcome: blocked
  blocked_by: data_missing
  notes: Emission rates need the headspace samples and the synthetic standards that convert peak
    areas to ng/h; neither is deposited. The Dryad deposit holds the TIC of the synthetic blend
    (TableS8_MSdata_tic_front.csv) and the Zenodo release the raw GC-MS run of one field sample,
    the alkane standard and the blend, with no calibration runs.
- claim: fig2d-no3-degrades-monoterpenes
  outcome: reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:fig2d-no3-degrades-monoterpenes
  measured:
  - -33.67
  - -85.0
  - -30.73
  - -66.41
  notes: On the raw Vocus traces (Zenodo) processed as the paper's notebook does, reading (a) (last
    half of each stage, NO3 against clean air) gives b-pinene -33.7% with O3 and -85.0% with NO3,
    ocimene -30.7% and -66.4%; reading (b) (whole stages) gives -33.1%, -82.4%, -29.2% and -64.6%.
    All are within tolerance and every p is below 1e-52, with the tests Table S9 names. The
    windows of the paper's notebook give -32.5%, -83.9%, -29.8% and -66.8% with Table S9's tests
    and p values. Reading (ii), NO3 against the O3 stage, gives -77.4% and -51.5%, and ocimene is
    then outside tolerance. The question of which windows the criterion should use is asked of a
    reader (questions/chan-2024.yaml); the outcome does not depend on it. The deposited Fig. 2D
    file gives -28.9% and -74.4% for b-pinene under the paper's windows (finding).
  deviations:
  - Tested on the raw traces in the Zenodo release; the Dryad deposit holds only the normalized
    Fig. 2D traces, shown in finding-fig2d-file.
  - Stage onsets for readings (a) and (b) are placed where the trace, smoothed by a 15-point
    running mean, crosses half-way between the stage levels (a standard choice); the levels are
    the means of the paper's notebook windows.
  - Trace processing (section, detrend, baseline window) is that of the Dryad notebook
    Fig_S4_Table_S9_VOCUS_analysis_and_plotting.ipynb, cells 29 to 33, which the criterion cites
    through the Fig. 2D notebook's baseline windows.
- claim: fig2d-other-compounds-unchanged
  outcome: not_reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:fig2d-other-compounds-unchanged
  notes: Under reading (a) the aldoxime changes by -0.56% with O3 (p = 0.00093) and -0.70% with NO3
    (p = 0.00017), and nonanal by +4.0% with NO3 (p = 0.025); under reading (b) the aldoxime
    changes by -0.57% with NO3 (p = 5.2e-05). Benzaldehyde has no p below 0.05 (changes -2.3% to
    +2.1%). The aldoxime effects are below 1% and reach significance because each window holds
    hundreds of time points. With the paper's notebook windows (Dryad), NO3 against clean air, the
    smallest p is 0.065 and the changes are those of Table S9 (aldoxime -0.1% and -0.6%,
    benzaldehyde +0.4% and +2.1%, nonanal -0.4% and -0.9%), so the paper's own test on these
    windows does not find the effect. The benzaldehyde data agree with Table S9 (0% and +2%), not
    the Fig. 2D inset (-9% and -12%). The outcome follows the criterion's readings; whether it
    should take the notebook's windows is asked of a reader (questions/chan-2024.yaml).
  deviations:
  - Tested on the raw traces in the Zenodo release; benzaldehyde and nonanal are not in the Dryad
    deposit.
  - The compounds show no step at the oxidant onsets, so their stage extents are the windows of
    the paper's notebook; readings (a) and (b) are the last half and the whole of these.
- claim: figs5-blend-oxidation
  outcome: not_reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:figs5-blend-oxidation
  notes: After the NO3 onset (763 s) the monoterpene ion falls by 34.1% (reading a) or 32.9%
    (reading b), but the aldoxime ion falls by 22.2% and 23.9% and the eucalyptol ion rises by
    9.2% and 7.2%, all with p below 1e-52 by Table S9's procedure. With the linear detrend the
    paper's notebook applies to the aldoxime, its change is +2.4% (p = 0.027, reading a) and -1.2%
    (p = 0.14, reading b); eucalyptol still changes under both readings.
  deviations:
  - The signals are not divided by the reagent ion (C6D6), as the paper's notebook does, because
    that trace is not deposited.
  - The clean-air stage is taken to start at 420 s, where the paper's notebook starts its plot and
    baseline; the NO3 onset is placed where the smoothed monoterpene trace crosses half-way
    between its clean-air level and its last 100 s (a standard choice).
- claim: fig2-dose-dependent
  outcome: blocked
  blocked_by: data_missing
  notes: No flowtube run at another NO3 dose or exposure time is in the Dryad deposit or the Zenodo
    release; the paper shows none either.
- claim: figs6-oxidation-products
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_chan_2024.ipynb
  output: claim:figs6-oxidation-products
  notes: In the second segment of the workbook (taken as NO3) the three nitrates rise 17 to 23 times
    their clean-air level and C10H16O4 and C10H18O4 6.0 and 7.6 times. In the first segment (taken
    as O3) C10H16O4 and C10H18O4 rise 6.8 and 9.3 times and the nitrates also rise, 1.18, 1.46 and
    1.39 times, with one-sided Welch p of 0.0002 to 0.001. The criterion is met under the doubling
    reading (r3) and not under the test (r1) or 3 SD (r2) readings, as the nitrates rise a little
    with O3. Question for the paper's authors (finding) on which segment is which oxidant and what
    counts as a product forming.
  deviations:
  - The workbook does not say which segment is which oxidant; the first is assumed to be the O3
    stage and the second the NO3 stage, because only in the second do the nitrates rise many-fold,
    as Fig. S6B shows.
  - The paper does not define a rise above the clean-air level; three readings were run (one-sided
    Welch test, every point above the clean mean plus 3 SD, at least a doubling). Adopted as the
    best-supported reading of "rise" is the test (r1), under which the O3 part does not hold;
    hence partially reproduced.
  - The oxidant onset in each segment is the first row where C10H16O4 exceeds twice the median of
    the segment's first five rows (a standard choice).
- claim: fig3b-hyles-no3-eliminates
  outcome: not_reproduced
  notebook: reproduce_chan_2024.ipynb
  output: claim:fig3b-hyles-no3-eliminates
  measured:
  - 0
  - 0
  notes: No Hyles fed at the NO3-oxidized odor (0 of 19) or at clean air (0 of 42), as the claim
    says, but only 5 of 35 fed at the floral odor, and the floral odor against the NO3-oxidized
    odor gives p = 0.084 by the z-test and 0.22 by prop.test with Yates' correction. The
