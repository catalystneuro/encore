- claim: fig3b-decode-rr-position
  outcome: blocked
  blocked_by: too_large
  notebook: reproduce_sosa_2025.ipynb
  notes: 'The decoder runs on each session''s activity time series, which this entry reduces to binned
    maps as it loads; it would need its own pass over the files (about 30 minutes). The paper''s procedure
    is 77 sessions x 3 populations x (1 + 100 shuffles) x 10 folds, about 233,000 fits of the circular
