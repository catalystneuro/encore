outcomes:
- claim: fig1h-lick-ratio-improves
  outcome: reproduced
  notebook: reproduce_sosa_2025.ipynb
  output: claim:fig1h-lick-ratio-improves
  notes: 'Reading (b), the mean over switch days of the last minus the first post-switch block, is positive
    in 11 of 11 mice. Retention holds: the mean ratio over the first block of the following day is above
    0 in 11 of 11 mice. Reading (a), improvement on every switch day, holds in 8 of 11 mice (74 of 77
    mouse-days). The mean ratio rises from 0.093 in the first post-switch block to 0.650 in the last.
    The criterion is met under reading (b).'
  deviations:
  - Dataset version 0.251124.0550, not the cited 0.250406.0045. In the cited version every file of a mouse
    carries the behaviour of one session (11 distinct behaviour series in 152 files), so imaging and behaviour
    cannot be aligned; the first data-check cell shows this from the files.
  - Trials with lick-sensor errors were removed (81 trials, the paper's count). Days without a next day
    (day 14) have no retention value.
- claim: place-cell-fraction
  outcome: partially_reproduced
  notebook: reproduce_sosa_2025.ipynb
  output: claim:place-cell-fraction
  measured:
  - 577.1
  - 969.5
  - 60.0
  notes: Over the 77 switch sessions there are 577.1 +/- 331.0 place cells of 969.5 +/- 482.1 cells imaged,
    60.0 +/- 16.1%. The cell count is within tolerance; the place-cell count (459 +/- 45.9) and the fraction
    (48.5 +/- 4.85) are not. The variant over per-mouse means gives the same values, because all mice
    have seven switch days. On the files' own deconvolved series the fraction is 66.8 +/- 25.0%. On average
    41.3% of cells are significant before the switch and 46.7% after.
  deviations:
  - Dataset version 0.251124.0550, not the cited 0.250406.0045. In the cited version every file of a mouse
    carries the behaviour of one session (11 distinct behaviour series in 152 files), so imaging and behaviour
    cannot be aligned; the first data-check cell shows this from the files.
  - dF/F and the deconvolved activity are recomputed from the files' F and neuropil, as the Methods give
    them (Calcium data processing, maximin baseline over 20 s within each trial, 2-sample smoothing, OASIS
    on dF/F), with the code's values for what the Methods leave out (preprocessing.dff and utilities.default_dff_method,
    neuropil coefficient 0.7 with the trial's neuropil mean added back, a 15-sample Gaussian before a
    300-sample maximin, OASIS tau 0.7 s at 15.5 Hz). The paper's own run took tau from its Suite2p settings,
    which are not public.
  - Spatial information shuffle (Methods, Place cell identification) implemented here, since TwoPUtils
    is not public. Activity is rolled within each trial (start to teleport) by 15 samples to the trial
    length, 100 times, frames below 2 cm/s excluded as in the real maps, threshold the 95th percentile
    of all shuffles of the session and trial set pooled.
