findings:
- kind: data_missing
  statement: The BOLD time courses of the clinical fMRI, on which six of the paper's claims rest, are
    not public. The dandiset holds none, the OpenNeuro version (ds003374, 1.1.1) holds only iEEG, and
    the paper names no deposit.
- kind: data_missing
  statement: The continuous microwire signals behind the microwire high gamma power (muHGP) are not in
    the dandiset, which holds only spike times and mean waveforms of the microwire data.
- kind: other
  statement: Each session is deposited twice, as `_ecephys.nwb` and `_ecephys+image.nwb`; the second
    adds a link to the video and holds identical iEEG, spikes and trials. The 18 NWB files hold 9
    recordings.
- kind: metadata_error
  statement: The iEEG is stated in volts, but its values (standard deviation 15 to 101, up to 1546) are
    microvolts.
- kind: metadata_error
  statement: The trial table gives trial 1 as 0 to 26 s, including its 2 s baseline clip, and trials 2
    to 17 as their 24 s blocks only (starting 2 s into each 26 s epoch). The iEEG timestamps run
    without a gap from 0 to 442 s, but the 17 epochs are not contiguous; the signal jumps at each
    boundary (median step 12 to 36 against 1.4 to 1.9 within epochs).
- kind: metadata_error
  statement: Every unit's obs_intervals cover all 17 epochs, but the 16 units of subject 7 have no spike
    after 286 s (epochs 12 to 17) and four units of subject 2 none in epoch 1, at rates of 1 to 16 Hz
    elsewhere.
- kind: metadata_error
  statement: The ages of subjects 2 and 8 (39 and 24) differ from those in the paper and the data
    descriptor (48 and 27).
- kind: metadata_error
  statement: The electrode location of the right channel of subjects 1, 5 and 9 is "Right Hippocampus,
    rostral hippocampus", and both channels of subject 6 are "unknown", while their labels (AR, AL),
    the paper and the data descriptor place them in the amygdala.
- kind: metadata_insufficient
  statement: Units are assigned only to the bipolar macro channel of their amygdala; the microwire each
    was recorded on is not given, so the paper's spatial synchronisation index (neurons on different
    microwires) cannot be computed as defined.
- kind: other
  statement: The units are in 8 amygdalae of 5 patients (1 L and R, 2 L and R, 3 L, 4 L, 7 L and R). The
    paper's Results give 9 amygdalae, and its Table 1 lists multi-unit activity for patients 5 and 8
    and none for 7. Three of the 8 (1 R, 2 R, 7 R, with 17 units) are SOZ amygdalae, while the paper's
    Discussion 3.4 says there were no microwire recordings from SOZ amygdalae. Their mean rate is 4.65 +- 3.91 Hz against the data descriptor's 1.66 +- 2.65 Hz,
    and two units of subject 7 are below 1 Hz over the whole session.
- kind: methods_unavailable
  statement: Question for the authors. How were the power envelopes "z-scored within each trial"
    (Methods 4.8), over the whole 26 s trial, against the baseline clip, or otherwise? A z-score over
    the whole trial makes the baseline correction void and removes the sustained delta decrease, and
    with it every delta effect here; a z-score against the baseline keeps it. The outcome of
    fig1b-delta-decrease is blocked on this, and other outcomes rest on the baseline reading.
- kind: methods_unavailable
  statement: Question for the authors. Over which window was the modulation index of each amygdala
    computed? With these data the group test finds no HGP cluster, and per-amygdala tests find
    clusters in 1 to 3 of 14 amygdalae; the outcomes on the MI values rest on fixed windows (0 to 2 s
    for HGP, the whole block for delta) taken from the Results' text.
- kind: methods_unavailable
  statement: Question for the authors. On what time base, and over which span (the condition's blocks
    laid end to end, or per block), were the per-neuron correlations of firing with HGP in Fig. 3B
    computed? The test finds no condition difference per block or on the 1 s time base, and finds
    NEUTRAL higher on the 1.5 s and 15 s time bases over blocks laid end to end.
- kind: paper_inconsistency
  statement: Run on the paper's printed Table 2 values, the tests of Fig. 1E find the DELTA MI also
    different between nSOZ and SOZ amygdalae (rank-sum p = 0.035, t-test p = 0.013), against "HGP but
    not DELTA distinguishes"; the chi-square test of the printed counts 5/5 and 1/5 of Fig. 1F gives
    p = 0.0098 (0.053 with Yates' correction), not about 0.2; and the exact binomial interval for 7/7
    is 59-100%, not the printed 66-100%.
