outcomes:
- claim: fig1b-delta-decrease
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_fedele_2020.ipynb
  output: claim:fig1b-delta-decrease
  notes: The criterion blocks the claim when the readings disagree, and they do; it holds in 10 of 16
    mixed-model readings. With the z-score over the whole 26 s trial no reading finds a delta cluster
    (smallest cluster p 0.88 in all 14 amygdalae, 1.0 in the 7 nSOZ). With z-scoring against the 2 s
    baseline, AVERSIVE is below NEUTRAL with significant clusters covering 14.3 s of the 24 s block in
    the nSOZ amygdalae and 15.6 s in all 14. With z-scoring over all trials of the amygdala, 17.1 s in
    all 14 and none in the nSOZ amygdalae (smallest p 0.072); with the baseline-corrected envelope
    divided by its SD in the trial, 16.1 s and 7.0 s. The block mean of AVERSIVE minus NEUTRAL is
    negative under every reading (-0.03 to -1.39). The unpaired t-test variant gives the same pattern.
    The question for the authors is in the findings (methods_unavailable, z-scoring).
  deviations:
  - The paper's mixed model Power ~ condition + (1|Patients) is computed in its within-patient form
    (patient fixed effects), which gives the same condition estimate for this balanced design (8
    AVERSIVE and 9 NEUTRAL trials per amygdala); the notebook compares it with statsmodels' MixedLM at
    four time points (t -2.125 against -2.123 and so on).
  - Labels are permuted within each patient, the same permutation for both amygdalae of a patient
    (Methods 4.11, "permuted the labels of neutral and aversive trials across all participants",
    500 permutations); the unpaired t-test variant permutes over all trials.
  - The test is run over the 24 s block (0 to 24 s from onset, Fig. 1 "locked to stimulus onset"); the
    baseline clip is left out. A choice, stated in the notebook.
  - A fourth z-scoring reading was added to the three of the claims file, the baseline-corrected
    envelope divided by its SD within the trial, because under a z-score over the whole trial the
    baseline correction of Methods 4.8 has no effect.
  - Envelopes are filtered per 26 s epoch with 2 s mirror padding, as the epochs are not contiguous in
    the files, and kept at 10 Hz after the 1 s smoothing (standard choices).
- claim: fig1c-hgp-increase-first-2s
  outcome: not_reproduced
  notebook: reproduce_fedele_2020.ipynb
  output: claim:fig1c-hgp-increase-first-2s
  notes: None of the 16 mixed-model readings and none of the 16 unpaired t-test readings finds a
    significant HGP cluster. The largest mixed-model t in the first 2 s is 3.01 at 0.95 s after onset
    (baseline z-scoring, nSOZ amygdalae), above the threshold at 13 time points, and its cluster has
    permutation p 0.062; the smallest cluster p of all mixed-model readings is 0.056. With the HGP band
    limited to 60-150 or 60-250 Hz (variants of the open upper edge) the only significant HGP clusters
    are AVERSIVE above NEUTRAL from about 6 to 8 s (p 0.020 and 0.042), not in the first 2 s.
  deviations:
  - As fig1b-delta-decrease. HGP is a 60 Hz high-pass (the claims file's reading); two band-pass
    variants are shown and do not decide the outcome.
- claim: other-bands-no-effect
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_fedele_2020.ipynb
  output: claim:other-bands-no-effect
  notes: Under the adopted baseline z-scoring the mixed model finds significant clusters with AVERSIVE
    below NEUTRAL in alpha in the 7 nSOZ amygdalae (13.3 to 15.9 s, p 0.016) and in theta and alpha in
    all 14 (p 0.002 to 0.028); beta and gamma have none. Under the z-score over the whole trial no band
    has a cluster (nor has delta). Under the other two readings all four bands have clusters in all 14
    amygdalae and none in the nSOZ amygdalae.
  deviations:
  - Assumed z-scoring against the 2 s baseline clip of each trial (mean and SD of the baseline). The
    paper says only "z-scored all data within each trial" after baseline correction with the 1 s
    before the sequence (Methods 4.8). This reading is FieldTrip's baseline z-score (the paper
    prepared the iEEG in FieldTrip, Methods 4.7), keeps the baseline correction meaningful, and can
    show the sustained delta decrease the Results report; a z-score over the whole trial cannot. All
    readings are shown.
  - As fig1b-delta-decrease for the test.
