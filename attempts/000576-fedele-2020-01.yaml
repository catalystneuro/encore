- claim: fig1b-delta-decrease
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_fedele_2020.ipynb
  output: claim:fig1b-delta-decrease
  notes: The criterion blocks the claim when the readings disagree, and they do; it holds in 6 of the 12 mixed-model
    readings of the claims file. With the z-score over the whole 26 s trial no reading finds a delta cluster
    (smallest cluster p 0.88 in all 14 amygdalae, 1.0 in the 7 nSOZ). With z-scoring against the 2 s baseline,
    AVERSIVE is below NEUTRAL with significant clusters covering 14.3 s of the 24 s block in the nSOZ amygdalae
    and 15.6 s in all 14. With z-scoring over all trials of the amygdala, 17.1 s in all 14 and none in the
    nSOZ amygdalae (smallest p 0.072). The block mean of AVERSIVE minus NEUTRAL is negative under every reading
    (-0.03 to -1.39). The variants agree with the baseline reading (baselinepool 13.3 and 16.8 s, trialsd 7.0
    and 16.1 s). The unpaired t-test variant gives the same pattern. The question for the authors is in the
    findings (methods_unavailable, z-scoring).
  deviations:
  - The paper's mixed model Power ~ condition + (1|Patients) is computed in its within-patient form (patient
    fixed effects), which gives the same condition estimate for this balanced design (8 AVERSIVE and 9 NEUTRAL
    trials per amygdala); the notebook compares it with statsmodels' MixedLM at four time points (t -2.125
    against -2.123 and so on).
  - Labels are permuted within each patient, the same permutation for both amygdalae of a patient (Methods
    4.11, "permuted the labels of neutral and aversive trials across all participants", 500 permutations);
    the unpaired t-test variant permutes over all trials.
  - The test is run over the 24 s block (0 to 24 s from onset, Fig. 1 "locked to stimulus onset"); the baseline
    clip is left out. A choice, stated in the notebook.
  - Outcomes are judged on the three z-scorings of the claims file (trial, baseline, amygdala). Two variants
    are shown and enter no count of readings, trialsd (the baseline-corrected envelope divided by its SD in
    the trial) and baselinepool (the epoch's baseline mean and the SD of the baseline clips pooled over the
    amygdala's epochs, a stable form of baseline z-scoring). The two other baselines of Methods 4.8 (mean of
    all epochs, previous epoch) are also run as variants.
  - Envelopes are filtered per 26 s epoch with 2 s mirror padding, as the epochs are not contiguous in the
    files, and kept at 10 Hz after the 1 s smoothing (standard choices).
- claim: fig1c-hgp-increase-first-2s
  outcome: not_reproduced
  notebook: reproduce_fedele_2020.ipynb
  output: claim:fig1c-hgp-increase-first-2s
  notes: None of the 12 mixed-model readings and none of the 12 unpaired t-test readings of the claims file
    finds a significant HGP cluster, nor do the two z-scoring variants. The largest mixed-model t in the first
    2 s is 3.01 at 0.95 s after onset (baseline z-scoring, nSOZ amygdalae), above the threshold at 13 time
    points, and its cluster has permutation p 0.062; the smallest cluster p of all mixed-model readings is
    0.056. With the HGP band limited to 60-150 or 60-250 Hz (variants of the open upper edge) the only significant
    HGP clusters are AVERSIVE above NEUTRAL from about 6 to 8 s (p 0.020 and 0.042) and, with baselinepool,
    3.1 to 4.7 s, not in the first 2 s. Among the baselines of Methods 4.8 (variants), the previous epoch as
    baseline with z-scoring over the amygdala gives an HGP cluster from 0.6 to 5.5 s in the nSOZ amygdalae
    (p 0.002); as blocks alternate, that baseline is always a block of the other condition. Per-amygdala time
    courses are in the notebook.
  deviations:
  - As fig1b-delta-decrease. HGP is a 60 Hz high-pass (the claims file's reading); two band-pass variants are
    shown and do not decide the outcome.
- claim: other-bands-no-effect
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_fedele_2020.ipynb
  output: claim:other-bands-no-effect
  notes: The readings of the claims file disagree. Under the z-score over the whole trial no band has a cluster,
    nor has delta. Under baseline z-scoring the mixed model finds clusters with AVERSIVE below NEUTRAL in alpha
    in the 7 nSOZ amygdalae (13.3 to 15.9 s, p 0.016) and in theta and alpha in all 14 (p 0.002 to 0.028);
    under z-scoring over the amygdala all four bands have clusters in all 14 and none in the nSOZ amygdalae.
    Every reading that shows the delta effect of Fig. 1B (6 of 12) shows a cluster in another band. Of the
    variants, baselinepool in the nSOZ amygdalae shows the delta effect and no other-band cluster; in all 14
    it has theta and alpha clusters.
  deviations:
  - Assumed that the paper's pipeline is one under which its own delta result (Fig. 1B) appears, as the paper
    reports the delta effect and the absence in other bands from the same analysis (Results 2.1, paragraph
    1). The outcome is judged on the readings of the claims file that show the delta effect; the trial reading
    shows no cluster in any band, delta included. The first revision adopted baseline z-scoring alone; the
    verifier found that the author's own choice, and it is no longer used.
  - Outcomes are judged on the three z-scorings of the claims file (trial, baseline, amygdala). Two variants
    are shown and enter no count of readings, trialsd (the baseline-corrected envelope divided by its SD in
    the trial) and baselinepool (the epoch's baseline mean and the SD of the baseline clips pooled over the
    amygdala's epochs, a stable form of baseline z-scoring). The two other baselines of Methods 4.8 (mean of
    all epochs, previous epoch) are also run as variants.
  - As fig1b-delta-decrease for the test.
