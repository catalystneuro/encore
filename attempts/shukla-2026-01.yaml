findings:
- kind: data_missing
  statement: The dandiset holds only the cooperative sessions of the 5 WT and 5 Fmr1 pairs. The mixed WT-Fmr1 pairs,
    the visual-cue association task and the virtual-agent task are not in it, though the paper says all data underlying
    its results will be uploaded to this dandiset. Six of the paper's findings cannot be tested for this reason.
- kind: metadata_insufficient
  statement: No session is labelled sensory deprived (opaque barrier and white noise). The paper interspersed such
    sessions among the 50% sessions; the 646 files after the analysed sessions carry the same descriptions and fields
    as the others, and some have much lower performance (as low as 0.0), so the sessions may be in the dandiset
    without a label. Two findings (Figure 2B, the sensory-deprived part of Figure S2) cannot be tested.
- kind: other
  statement: About 4.8% of pokes (82,245 of 1,716,630 in the analysed sessions) fall within 0.5 s of a poke by the
    same rat at another well, physically impossible for wells 47 cm apart, and they come in bursts (up to 128,979
    pokes and 2,447 transitions in one rat session; 140 of 1,120 rat sessions affected, most in pairs FXM102-FXM103,
    FXM105-FXM107 and FXM108-FXM109). Used as recorded they inflate transition counts and change the performance
    of Eq. 1.
- kind: metadata_insufficient
  statement: The matched_poke events follow a rule the files do not describe. No match is at the well of the previous
    match (0 of 19,602 consecutive pairs), at 100% as at 50%, and matches cannot be recomputed from the poke events
    because only poke onsets are stored, not how long the nose is held.
- kind: selection_undocumented
  statement: Session numbers have gaps (FXM102 and FXM103 lack 100% session 18 and 50% session 61, FXM105 and FXM107
    lack 100% sessions 9 and 15 and 50% session 10, XFN2 and XFN4 lack 50% session 81), and the files hold up to
    56 sessions at 100% and 88 at 50% where the paper analyses the first 21 and 35. Which sessions the paper used,
    and why some are missing, is not stated.
- kind: other
  statement: Session epochs last 10.7 to 57.2 min (median 21.7) against the paper's 20 to 30 min, and in 6.6% of
    rat sessions some pokes fall outside the session epoch.
- kind: other
  statement: The paper's code repository (JadhavLab/Social_CoOp_Behavior) holds only a README naming version 0.260519.1308,
    an early partial upload with 1,007 of the 2,649 assets of the latest published version; no analysis code is
    published.
- kind: methods_unavailable
  statement: Questions for the authors. Was the two-way RM ANOVA fitted with sessions as replicates (the printed
    df, F(1,168) for 10 pairs over 21 sessions) or with pairs or rats as subjects? Under the latter most genotype
    effects in Figures 1, 3 and 4 are not significant here. What are the units of match and transition rates (Figure
    1E to 1G)?
- kind: methods_unavailable
  statement: Questions for the authors on event definitions the Methods leave open. How were matches recomputed
    for the circular-shift test of Figure 1H, which sessions are early and late there, and how were the arrival
    and departure times of Figure 4B and 4C, the downsampling and arrival rule of Figure 4E to 4I, the sample entropy
    parameters, the sets compared in the Jaccard analysis, and the moment the partner's location is read in Figure
    1J defined? Were sessions with very long arrival lags excluded, and is dwell time measured from pokes or from
    head position?
- kind: methods_unavailable
  statement: 'Questions for the authors on trial definitions. How were synchronous and asynchronous matches (Figure
    7B), asynchronous gaze trials (Figure 7D to 7H) and follower trials (Figure 8) built from the events? Follower
    trials built from the sequence of arrivals give a partner-history effect on sessions in which one rat is shifted
    in time: positive with the rule the Methods describe (the first rat to arrive leads, the other''s next arrival
    is its choice), negative when every arrival after the partner''s is a follower trial. How did the paper''s analysis
    separate the partner''s influence from this dependence?'
- kind: methods_unavailable
  statement: Questions for the authors on the reinforcement learning model (Figure 6). What were the learning rate,
    discount factor, timesteps per episode, number of runs, state encoding and the definition of coordination efficiency?
    Without them the simulation cannot be repeated.
- kind: methods_unavailable
  statement: Question for the authors on session numbering. Were the sensory-deprived sessions given session numbers
    of the 50% contingency? Low-performance sessions sit between normal ones in the same pairs, also inside the
    first 35 50% sessions this attempt analyses (one at 10.0% among the last 9 analysed 50% sessions of FXM105-FXM107,
    whose median is 39.4%). If such sessions are among the first 35, they enter every 50% result for those pairs.
- kind: metadata_error
  statement: The camera device gives 0.0016 m per pixel in every file, but the processed positions of rats FXM105,
    FXM107, FXM108 and FXM109 were converted at 0.0025 m per pixel (regression of the processed head position on
    the raw DeepLabCut head position). Files of FXM102 and FXM103, and some files of other rats, hold no raw pose
    estimation.
- kind: other
  statement: 'In 6 of 10 pairs (ER1-ER2, FXM102-FXM103, FXM105-FXM107, FXM108-FXM109, XFN1-XFN3, XFN2-XFN4) the
    processed head position agrees poorly with the poke events: at the poke times only 39 to 62% of head positions
    (subject means) are within 20 cm of the median position at pokes on the poked well, against 99.9% or more in
    the other four pairs, and no shift of the poke times up to 30 s improves it. Measures built on positions (well
    occupancy, arrivals, gaze) are uncertain for these pairs.'
