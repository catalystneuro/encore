findings:
- kind: data_missing
  statement: The data set holds 3 recording sessions (about 3.5 h, 5 thalamic units) of the paper's 32
    sessions with thalamic units (63 thalamic units). It holds no maze epoch, no sleep before the maze,
    none of the four long control sessions and no position (LED) data, so the paper's comparisons of sleep
    before and after the maze (six claims) and the waking definition by velocity cannot be tested, and
    most unit-level claims rest on 2 to 13 units.
- kind: metadata_insufficient
  statement: The thalamic nucleus of each unit is not given; only the Session 1 unit is named (MD), in
    the title of a deposited script. Session 2's two units sit in a folder with no region in its name
    and are thalamic only by the deposited script's title. The LFP files state no unit, and the descriptor
    does not say which tetrode and wire each LFP comes from.
- kind: methods_unavailable
  statement: 'The deposited spindle troughs do not follow the detection rule of the Methods (local minima
    three sd below the mean of the spindle-filtered LFP): they are 3.7 to 6.2 times as many as that rule
    gives (3817 against 1019 in Session 1) and their filtered values reach -0.7 to -1.1 sd. The deposited
    Session 1 SWRs (1263) are also more than the Methods'' k = 3 rule gives (840). Question for the authors:
    what threshold and reference period produced the deposited troughs and SWRs, and were these the events
    behind the paper''s figures?'
- kind: methods_unavailable
  statement: 'Question for the authors: how was the spindle-trough-triggered scalogram of Figure 1, figure
    supplement 3 scaled (raw wavelet power, or power relative to a baseline)? This attempt assumed power
    relative to the mean power of the same state; in raw power the Session 3 mPFC peak falls at 4 to 8
    Hz, not 10 to 15 Hz.'
- kind: format_error
  statement: Spike times are stored at single precision. In Session 3 every spike time equals its float32
    rounding, a resolution of 2^-10 s (0.98 ms) at these values, which produces repeated timestamps (6230
    in the thalamic MUA, 657 in the mPFC MUA, 17 and 8 in two thalamic units); in Sessions 1 and 2, 73
    to 87 % of times do. LFP and event times are in double precision.
- kind: metadata_insufficient
  statement: In Session 3 the mPFC unit and MUA start at 11750 s, 24 min before the LFP, the sleep periods
    and every other stream (13200 s); the descriptor does not say what this epoch is. The CA1 files labelled
    "InRun" hold only spikes of the sleep after the maze; the maze spikes behind the label are not included.
- kind: paper_inconsistency
  statement: The paper's Data availability statement names the CRCNS data set "HC-24" (doi:10.6080/K0K35RVG)
    and then says that the data set and the documentation that describes it are available as "HC-19" (crcns.org/data-sets/hc/hc-19).
    The hc-24 data descriptor (version 0.6) cites the 2019 bioRxiv preprint (doi:10.1101/653436), not
    the eLife paper.
