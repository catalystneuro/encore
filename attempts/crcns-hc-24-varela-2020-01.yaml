- claim: fig1s3-spindles-not-theta
  outcome: partially_reproduced
  notebook: reproduce_varela_2020.ipynb
  output: claim:fig1s3-spindles-not-theta
  notes: 'Relative to the state''s mean power, the trough-triggered mPFC scalogram in sleep peaks at 11
    Hz (S1) and 10 Hz (S3) under every trough reading, within 10 to 15 Hz. In raw power the 4 to 30 Hz
    peak is 11 Hz in S1 and 4 to 8 Hz in S3. CA1 troughs detected outside sleep peak at 13 Hz in S1 (sleep
    11 to 12 Hz) and 9 to 10 Hz in S3 (sleep 9 Hz), so the waking CA1 peak is not lower. Outside sleep
    is quiet waking in the box (97 to 488 troughs); no active waking on the maze is in the data set. Up
    to 800 troughs per condition (seeded subset). Question for the authors, recorded as a finding: how
    the scalogram of Figure 1, figure supplement 3 was normalised.'
  deviations:
  - 'Assumed: wavelet power is shown relative to the mean power of the same LFP in the same state at each
    frequency; the paper does not say how the scalogram is scaled, and raw LFP power falls with frequency
    so its peak would sit at the lowest frequency. The raw-power peak in 4 to 30 Hz is shown too and gives
    4 to 8 Hz for S3 mPFC.'
  - Morlet wavelet of 7 cycles (the claims files standard choice); 2 to 30 Hz in 1 Hz steps.
  - Waking is time outside the deposited sleep periods in the box only; the paper also used the maze.
  - Sleep is the deposited sleep periods (M-sleep reading a); readings (b) and (c), from the moving average
    of LFP power, were not run.
  assumed: true
