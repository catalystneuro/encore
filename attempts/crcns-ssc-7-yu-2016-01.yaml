outcomes:
- claim: behavior-performance
  outcome: partially_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:behavior-performance
  assumed: true
  measured:
  - 0.706
  - 0.630
  - 7.56
  - 1.06
  - 328
  notes: Under every combination of readings only cortical performance is within tolerance (0.706
    over all good trials, 0.721 over control trials, n = 111 cells). VPM performance is 0.630 (n =
    29). Touches per trial are 7.56 (Go, 7,097 trials) and 1.06 (Nogo, 6,872 trials) over the whole
    trial, 2.74 and 0.36 before the first lick. The reaction time is 328 to 340 ms. Proximal touches
    outnumber distal ones under every reading. With the principal whisker taken from the whisker
    configuration (variant), Go 5.93 and Nogo 0.63.
  deviations:
  - Touches are counted on the first tracked whisker series, taken as the principal whisker (an
    assumption; the files do not say which series is the principal whisker, see findings). The
    configuration-order reading is shown as a variant.
  - Proximal and distal trials are read as Go and Nogo trials (Online Methods, Behavior, "licked ...
    if the pole was in one of the posterior locations"). Trial counts pool the cortical recordings
    and each VPM session once; the paper's 4,147 and 4,173 trials cannot be matched to a set.
  - The data set's good-trial masks are applied.
- claim: vpm-baseline-rate
  outcome: partially_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:vpm-baseline-rate
