- claim: power-low-frequencies
  outcome: reproduced
  assumed: true
  notebook: reproduce_johnson_2019.ipynb
  output: claim:power-low-frequencies
  notes: With neighbours by distance and the density over all points (reading (b)), each effect is
    larger over 2 to 24 Hz than over 25 to 40 Hz (0.127 against 0.032, 0.115 against 0.037, 0.045
