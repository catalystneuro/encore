- claim: fig1b-accuracy
  outcome: reproduced
  notebook: reproduce_johnson_2019.ipynb
  output: claim:fig1b-accuracy
  measured:
  - 0.625
  - 0.975
  notes: Under reading (b), per subject and condition, accuracy runs from 0.625 to 0.975; under
    reading (a), per subject over conditions, from 0.758 to 0.950, whose lowest value is outside 0.63
    +- 0.063. All values lie inside the widened range under both readings. The logit mixed model on
    all 120 trials finds no effect of condition (likelihood ratio p = 0.283 with condition as one
    term, p = 0.160 as two terms; kept trials p = 0.276). The paper reports p > 0.50; the p here is
    lower but above 0.05.
  deviations:
