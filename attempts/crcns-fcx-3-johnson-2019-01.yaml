- claim: fig1b-accuracy
  outcome: reproduced
  notebook: reproduce_johnson_2019.ipynb
  output: claim:fig1b-accuracy
  measured:
  - 0.625
  - 0.975
  notes: Under reading (b), per subject and condition, accuracy runs from 0.625 to 0.975; under
    reading (a), per subject over conditions, from 0.758 to 0.950, whose lowest value is outside 0.63
    +- 0.063. All values lie inside the widened range under both readings. The logit mixed model on
    all 120 trials finds no effect of condition (likelihood ratio p = 0.283 with condition as one
    term, p = 0.160 as two terms; kept trials p = 0.276). The paper reports p > 0.50; the p here is
    lower but above 0.05.
  deviations:
  - Accuracy over all 120 trials comes from docs/summary_file.csv (per subject and condition, over all
    trials by the data description), rebuilt as counts out of 40 per condition (Methods, "120 trials
    divided evenly"); the trial tables of S6 and S7 list only the kept trials.
  - The logit mixed model is fitted by maximum likelihood with Gauss-Hermite quadrature in Python;
    the paper names the model, not the software. Condition enters as one numeric term (the single
    degree of freedom of the paper's F(1,19)), with two dummy terms as a variant.
- claim: fig1b-rt-identity-slower
  outcome: reproduced
  notebook: reproduce_johnson_2019.ipynb
  output: claim:fig1b-rt-identity-slower
  notes: On subject-condition mean RTs (reading (a)), condition affects RT (F(1,19) = 6.04, p =
    0.024); identity RT is longer than spatial (by 513 ms, F(1,12) = 11.81, p = 0.005) and temporal
    (by 392 ms, F(1,12) = 9.39, p = 0.010); spatial and temporal do not differ (p = 0.254). Identity
    RT is the longest in all 7 subjects. The F values are below the paper's bounds (F > 6.50, >
    13.78, > 10.95) and the d values (1.30 and 1.16, mean paired difference over its SD) below its
    2.14 and 1.91. Single kept correct trials (reading (b)) give p = 0.018, 0.037, 0.004 and 0.844.
  deviations:
  - Mean correct RT per subject and condition from docs/summary_file.csv (all correct trials, by the
    data description). Reading (b) uses the kept trials only, as the trial tables of S6 and S7 hold
    no others.
  - The paper does not say how Cohen's d was computed; d is reported, not judged.
- claim: erp-no-condition-difference
  outcome: reproduced
  assumed: true
  notebook: reproduce_johnson_2019.ipynb
  output: claim:erp-no-condition-difference
  notes: With neighbours adjacent by contact number and clusters judged at 0.05 per tail, no subject
    has a significant cluster in either contrast (smallest p 0.053, S2 identity against temporal).
    Under the distance reading of neighbours S5 has a cluster at p = 0.028 (identity against
    spatial); with no spatial clustering S2 has one at p = 0.033; at 0.025 per tail no reading has a
    significant cluster. The paper reports all p > 0.10; 2 of the 14 subject-contrasts have p <= 0.10
    under the adopted reading. The question of the neighbour rule is put to the paper's authors (see
    findings).
  deviations:
  - Assumption. The paper says only that clusters were formed over "neighboring electrodes". The
    readings give different outcomes, so neighbours adjacent by contact number on the same lead or
    strip are adopted. This uses only the channel labels and follows the bipolar montage, which
    re-references each electrode "to the next adjacent electrode" (Methods, Data Acquisition and
    Preprocessing); the distance reading rests on placing numbered contacts on the grids of the
    MNI files, whose numbering the files do not document.
  - Clusters are judged at 0.05 per tail (the Methods' "fewer than 5% of randomizations yielded a
    larger effect", and FieldTrip's default); 0.025 is shown as a variant.
  - Filter, padding and baseline follow erp_compute.m (30-Hz FIR, 7.5-s padding, pretrial
    [0.65, 0.85] s mean); the FIR order 3*fix(fs/30), forwards and backwards, is FieldTrip's default
    for the script's settings, implemented in scipy (a standard choice). FieldTrip itself was not run.
- claim: fig2-spatial-power
  outcome: partially_reproduced
  notebook: reproduce_johnson_2019.ipynb
  output: claim:fig2-spatial-power
  measured:
  - 5
  - 2
  - 39.7
  - 22.5
  notes: With adjacent neighbours, 0.05 per tail and reading (a) of the assignment, 5 subjects show
    spatial > identity effects (S2, S3, S4, S5, S6) and 2 identity > spatial (S4, S7), the paper's
    counts; the percentages of electrodes are 39.7 +- 15.0% and 22.5 +- 15.3% (paper 54 +- 22% and 36
    +- 12%). No reading matches both percentages; the distance reading gives 49.7% (within tolerance)
    and 28.4%. The significant clusters have p <= 0.024.
  deviations:
  - Power follows power_compute.m (3-cycle Hanning windows, 2 to 40 Hz, 10-ms steps, processing
    [0.3, 1.2] s of the derived epoch), computed in numpy; the derived epochs extend 1.5 s beyond the
    windows, so no window holds padding and the S1 padding readings do not arise.
  - The baseline z-score of zbaseline.m (r = all correct trials) is computed in closed form, the limit
    of its 1000 draws; it is the same affine map for every trial at a channel and frequency, so it
    cannot change the condition t-tests.
  - Neighbour rule and threshold as in erp-no-condition-difference; every reading is shown.
