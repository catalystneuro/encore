- claim: fig4-maintenance-parietal-led
  outcome: not_reproduced
  notebook: reproduce_johnson_2019.ipynb
  output: claim:fig4-maintenance-parietal-led
  measured:
  - 0.03
  - -0.12
  notes: Under reading (a) of P1 (trial-averaged coherency) subject means are -0.52 to 0.56
    (delta-theta) and -0.45 to 0.21 (alpha-beta), none below -1.96 (group 0.03 +- 0.36 and -0.12 +-
    0.23, recorded as measured). Under reading (b) (per-trial PSI averaged over trials) 4 of 7
    subjects are below -1.96 in delta-theta (mean -0.31 +- 10.67) and none in alpha-beta (2.12 +-
    2.07). The paper reports -40.03 +- 8.73 and -30.37 +- 2.60. The deposited psianalysis.m, run as
    written (no conjugate) with the parietal channel first and the sign reversed, gives every subject
    below -1.96 (means -55.56 and -69.73), which would meet the criterion; with the PFC channel first
    the same code gives +58.54 and +69.33, so its sign follows the channel order and it does not
    measure direction.
  deviations:
  - P1 details taken from psi_compute.m and subtracterp.m, ERP removed as the mean over all correct
    trials ("raw trial-wise mean", reading (a)); one Hanning-tapered FFT of each 900-ms segment
    padded to 7.5 s, read at the nearest bins to the integer frequencies ('mtmfft', spectra reading
    (a)); one PSI per band over all its bins; one shuffle for all pairs; the null shuffles the bins
    of the trial-mean normalised spectrum (psianalysis.m).
  - P1's last reading (PSI from trial-averaged cross-spectra or per trial) is not settled by
    psianalysis.m, which computes per-trial PSI but omits the conjugate of the cross-spectrum; both
    readings are run with the conjugate, and the deposited code as a variant.
  - The time-resolved null uses one set of 1000 shuffles per time point, the task-induced one a set
    per frequency bin averaged as psianalysis.m does (a standard choice; it changes only Monte Carlo
    noise).
