findings:
- kind: data_missing
  statement: Each file holds only the imaged trials of its session, and sessions without imaging (2,
    4 and 6) are absent. The paper's priors and its training statistics use every trial a mouse ran
    before session 8, so these cannot be rebuilt from the dandiset; the authors later deposited the
    full VR behaviour on figshare (doi:10.6084/m9.figshare.31974756.v1), which the dandiset does not
    reference.
- kind: data_missing
  statement: Mouse R6 has no session before 8 in the dandiset, R4 and R5 lack session 1, and FD3 has
    no session after 7, so the decision-mouse trial counts cannot match the paper's.
- kind: other
  statement: The dandiset holds imaging sessions 5 and 7 for most mice (and session 6 for R4), which
    the paper does not list among its imaging sessions (1, 3 and 8 to N), and 26 rare morph sessions
    8 to N where the paper counts 24. F6 session 5 has 4,103 cells, above the paper's stated range.
- kind: metadata_error
  statement: The session_start_time of every file is the date of conversion in April 2026, not the
    date of the recording, so the calendar days between sessions cannot be read from the files.
- kind: metadata_insufficient
  statement: The decision mouse FD1's sessions 1 and 3 hold continuous morph values in place of the
    five S-tilde values, and nothing in the files or the dandiset says so.
- kind: other
  statement: The JSON annotation of each file stores place cells from the authors' 2026 code. They
    agree with this attempt's no-speed-exclusion reading for about 96% of cell and S-tilde pairs and
    give 61.5% (rare) and 48.6% (frequent) of cells as place cells, against the paper's 43% and 30%.
- kind: other
  statement: The published versions of 2021 hold 85 files for 10 of the 16 mice (F4, F6 and the
    decision mice are missing); the versions of April 2026 hold all 16. Version 0.260415.1712
    replaced R5's files and removed its sessions 1, 5 and 7 relative to 0.260409.0433, without
    release notes.
- kind: paper_inconsistency
  statement: With the parameters the Methods give for the Hebbian model (in f_h units), the Hebbian
    increment is smaller than the weight decay and the weights fall to zero during training; the
    paper's code uses the rescaled unit, in which the same numbers are 0.15 and 0.1.
