outcomes:
- claim: link-zenodo-traces
  outcome: partially_reproduced
  notebook: reproduce_yemini_2021.ipynb
  output: claim:link-zenodo-traces
  measured: 0.817
  notes: All 21 files match a deposit file by identifier, in the same order, and the stimulus order agrees in all 21. Of 3,663
    named dandiset traces, 3,550 have a counterpart in the deposit. The dF/F0 computed from the dandiset correlates with the
    deposit's trace at a median r of 0.972 (5th percentile 0.758), median slope 0.985; 81.7% of traces reach r of 0.9, below
    the criterion's 90%. The deposit is one frame (0.25 s) later than the dandiset in all 21 files; with that offset the median
    r is 0.980 and 85.8% reach 0.9, still below 90%. 101 dandiset traces have an empty slot in the deposit (AVL in 11 heads,
    I5 in 8), and 4 names (AMSOL, AMSOR, HMC, DD6) are not in the deposit. The deposit's traces have the first 1 s empty,
    as the STAR Methods say. The measured value is the fraction of traces at r of 0.9 or more, frames aligned by index.
  deviations:
  - The criterion was written by the author of the attempt, as link claims are, after the deposit's layout had been read and
    with the dandiset loaded; the 0.9 and 90% thresholds are the author's.
- claim: link-connectome-names
  outcome: reproduced
  notebook: reproduce_yemini_2021.ipynb
  output: claim:link-connectome-names
  notes: 190 of 193 dandiset names match cells of both Cook et al. matrices after removing the zero padding of motor neuron
    numbers. AMSOL, AMSOR (amphid sheath glia) and HMC (head mesodermal cell) do not match; they are not neurons.
