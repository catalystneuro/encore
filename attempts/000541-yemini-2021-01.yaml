findings:
- kind: data_missing
  statement: The dandiset holds the 21 OH16230 head recordings of Figure 6 only. The 21 OH16230 tail
    recordings, the 7 OH15500 heads (Table S6), and the imaging behind Figures 1 to 5 and 7 are not
    in it. The tails, the OH15500 heads and 10 atlas worms are in the paper's Zenodo deposit
    (doi:10.5281/zenodo.3906530).
- kind: metadata_insufficient
  statement: The files do not say which AWC neuron is ON and which is OFF in each head, which the
    paper's AWC asymmetry result needs. The paper's Zenodo deposit gives it (is_AWCL_OFF).
- kind: metadata_error
  statement: The two trace series in each file, SignalRawFluor ("Raw fluorescence activity") and
    SignalRawFluordNMF ("Raw fluorescence activity data computed using dNMF"), hold the same
    numbers in all 21 files.
- kind: metadata_error
  statement: NeuronIDs, described as neuron labels, include three cells that are not neurons (AMSOL,
    AMSOR, amphid sheath glia; HMC, the head mesodermal cell) and, in head 20190929_06, DD6, a motor
    neuron of the posterior ventral cord that cannot be in a head volume. None of these four names
    is in the paper's deposit.
- kind: selection_undocumented
  statement: 101 named traces in the dandiset have no trace in the paper's deposit (AVL in 11 heads,
    I5 in 8, and others), and the dandiset does not mark which traces the paper excluded (near
    duplicates, empty traces). 13 named traces are all NaN.
- kind: metadata_error
  statement: The stimulus table's description gives 2-butanone as "10^-4mM" (2,3-pentanedione as
    "10^-4") and the order as random; the paper gives both odors as 10^-4 dilutions and the order as
    rotated, and the files show three orders, seven heads each.
- kind: methods_unavailable
  statement: Question for the paper's authors. Of two neurons within 5 um whose traces correlate at
    0.95 or more, were both removed, or one (and which)? The STAR Methods say they "were deemed too
    similar and removed". With both removed, 669 of 3,663 named traces go and the median is 17
    animals per neuron; with one, 347 and 18. Two outcomes here depend on it (fig6-asj-ric,
    fig6gi-stimulus-specific-correlations); both are removed in this attempt, as an assumption.
- kind: methods_unavailable
  statement: Question for the paper's authors. Were the response t-tests run on the dF/F0 traces or
    on the dNMF histogram-normalised traces ("When comparing neuronal activity across animals, we
    used dNMF to normalize activity traces per neuron class"), and how was a head judged to show
    the published ASE and AWC responses? Under the claims file's rules, 19 of the 21 deposited heads
    pass, not 21.
