  - 19
  notes: The head values match and the tail values are missing. 21 heads; 193 names identified in at least one head (190 neurons;
    184 after the removals), within 170.1 to 207.9; median animals per name 19 under the main reading (one member of a near-duplicate
    pair removed), 17 with both removed, 21 with none removed or under the deposit's selection; per class 20, 19.5 and 21.
    The paper's deposit has 189 names, the paper's number, with a median of 21 animals per name and per class. The dandiset
    holds no tails, so 21 tails and 42 tail neurons are measured as 0. The measured values are, in order, heads, names in
    any head (reading a), tails, tail neurons, and the median per name under the main reading. Whether the paper's median
