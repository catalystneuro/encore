findings:
- kind: data_missing
  statement: The dandiset holds the 21 OH16230 head recordings of Figure 6 only. The 21 OH16230 tail recordings, the 7 OH15500
    heads (Table S6), and the imaging behind Figures 1 to 5 and 7 are not in it. The tails, the OH15500 heads and 10 atlas
    worms are in the paper's Zenodo deposit (doi:10.5281/zenodo.3906530).
- kind: metadata_insufficient
  statement: 'The files do not say which AWC neuron is ON and which is OFF in each head, which the paper''s AWC asymmetry
    result needs. The NeuroPAL image holds it: CyOFP1, the srsx-3 fluorophore (Table S1), is brighter relative to TagRFP-T
    in the AWC that the paper''s Zenodo deposit marks as OFF (is_AWCL_OFF) in 19 of 21 heads.'
- kind: metadata_error
  statement: The calcium imaging volume (CalciumImVol) states a grid spacing of 0.267, 0.267 and 1.5 um, the same as the NeuroPAL
    volume, but in all 21 files the calcium segmentation's x and y coordinates are half those of the same neurons in the NeuroPAL
    segmentation (fitted ratio 1.94 to 2.09; z 0.97 to 1.07), and the movie is 256 x 128 pixels against 512 x 256. The movie
    is binned 2 x 2, and its x and y spacing is 0.533 um.
- kind: metadata_error
  statement: The two trace series in each file, SignalRawFluor ("Raw fluorescence activity") and SignalRawFluordNMF ("Raw
    fluorescence activity data computed using dNMF"), hold the same numbers in all 21 files.
- kind: metadata_error
  statement: NeuronIDs, described as neuron labels, include three cells that are not neurons (AMSOL, AMSOR, amphid sheath
    glia; HMC, the head mesodermal cell) and, in head 20190929_06, DD6, a motor neuron of the posterior ventral cord that
    cannot be in a head volume. None of these four names is in the paper's deposit.
- kind: selection_undocumented
  statement: 101 named traces in the dandiset have no trace in the paper's deposit (AVL in 11 heads, I5 in 8, and others),
    and the dandiset does not mark which traces the paper excluded (near duplicates, empty traces). 13 named traces are all
    NaN.
- kind: metadata_error
  statement: The stimulus table's description gives 2-butanone as "10^-4mM" (2,3-pentanedione as "10^-4") and the order as
    random; the paper gives both odors as 10^-4 dilutions and the order as rotated, and the files show three orders, seven
    heads each.
- kind: other
