  - Which member of a near-duplicate pair the paper removed is not stated; all four readings are shown, and the head values
    are within tolerance under one and both removed, not under none or the deposit's selection (median 21).
- claim: fig6-all-heads-responsive
  outcome: not_reproduced
  notebook: reproduce_yemini_2021.ipynb
  output: claim:fig6-all-heads-responsive
  measured: 19
  notes: Under reading (a), 19 of 21 heads pass all three checks with no neuron removed (ASE to NaCl 21, AWC to 2-butanone
    20, AWC to 2,3-pentanedione 19); under reading (b) 16. The main and deposit readings give the same; with both members
    of near-duplicate pairs removed, 18 and 15. Head 20191030_07 fails on 2,3-pentanedione and 20191104_10 on both odors.
    The dandiset holds exactly the 21 heads the paper kept, so the paper's review, which it does not describe ("we reviewed
    ASE responses to salt and AWC responses to the odors"), passed two heads that the claims file's rules do not. AWC falls
    about as much in the other stimulus windows as at the odor times (see the clock check), so the sign test is not specific
    to odors.
- claim: fig6d-ase-nacl
  outcome: reproduced
  notebook: reproduce_yemini_2021.ipynb
  output: claim:fig6d-ase-nacl
  notes: Under the main reading (one removed, z-scored traces) ASER rises during NaCl in 14 of 21 heads (+1.34, p = 0.0028),
    q = 0.0036 over all tests (reading a) and 0.0031 over the NaCl tests (reading b). Every selection reading gives p of 0.016
    or less and q of 0.028 or less; dF/F0 gives p = 0.0055 and q(a) = 0.018. ASEL against ASER, unpaired t-test, p = 4.8e-05
    on the responses and 1.5e-05 on the means during the pulse, 3.1e-04 or less under every reading. ASEL responds more strongly
    (+3.45, 19 of 19 heads), which the paper's "However, ASER exhibited an increase" does not contradict.
  deviations:
  - The ASER test is a single-side test; its p is added to the family of class tests for the q value, a choice made here,
    as the paper's family pools left and right.
  - Each trace is z-scored before the response tests, an assumption. The STAR Methods say "When comparing neuronal activity
    across animals, we used dNMF to normalize activity traces per neuron class" (Brainwide imaging of neuronal activity traces)
    and do not say how. Tests on traces scaled one by one match the p values of the paper's Table S6 far better than tests
    on dF/F0 (rank correlation of log p 0.90 to 0.96 against 0.62 to 0.73; p of 0.05 agrees in 84 to 89 of 94 classes against
    74 to 80); min-max scaling is close behind and matches the scale of the paper's confidence intervals. dF/F0 and min-max
    scaling are shown as variants.
- claim: fig6-nacl-unknown-interneurons
  outcome: reproduced
  notebook: reproduce_yemini_2021.ipynb
  output: claim:fig6-nacl-unknown-interneurons
  notes: 'Under the main reading all six classes respond significantly to NaCl under every FDR reading, with positive means:
    AVH (q over all tests 4e-05), AIN (0.0034), I2 (0.0007), MI (0.0019), AVJ (0.016) and AVF (0.021). The deposit and both
    readings give six of six; none removed gives five under reading (a) and six under (b) and (c). On dF/F0 four of six (AIN,
    AVH, I2, MI) under every reading, AVJ (p = 0.094 in the first round) and AVF not, the outcome of the first round. Benjamini-Hochberg
    over all tests gives four of six. The outcome rests on the per-trace normalisation.'
  deviations:
  - Each trace is z-scored before the response tests, an assumption. The STAR Methods say "When comparing neuronal activity
    across animals, we used dNMF to normalize activity traces per neuron class" (Brainwide imaging of neuronal activity traces)
    and do not say how. Tests on traces scaled one by one match the p values of the paper's Table S6 far better than tests
    on dF/F0 (rank correlation of log p 0.90 to 0.96 against 0.62 to 0.73; p of 0.05 agrees in 84 to 89 of 94 classes against
    74 to 80); min-max scaling is close behind and matches the scale of the paper's confidence intervals. dF/F0 and min-max
    scaling are shown as variants.
  - One member of each near-duplicate pair is removed (the later in the file), an assumption. The STAR Methods say "Neurons
    within 5 um distance of each other, whose traces showed at least 95% correlation, were deemed too similar and removed"
    without saying which; of the four readings run (one, both, none, the traces in the paper's deposit), "one" comes closest
    to the per-class sample counts of Table S6 (median difference 0, mean +0.6 traces per class; deposit +2.9, none +3.8,
    both -2.3). Distances use 0.533 um in x and y, the spacing the coordinates show (see findings).
  - Table S6's legend says "FDR was used to correct the p-values of all NaCl, 2-butanone, and 2,3-pentanedione stimulus responses
    together", which is reading (a) of the claims file; all readings are still shown.
  assumed: true
