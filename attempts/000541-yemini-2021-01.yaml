  notes: Needs the metabotropic receptor reporter expression maps; not in the dandiset.
- claim: fig4bd-gaba-network
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the receptor expression maps, which are not in the dandiset, with the connectome.
- claim: fig4e-extrasynaptic
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the receptor expression maps, which are not in the dandiset, with the connectome.
- claim: fig5ab-pag3-fate
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the pag-3 mutant scoring (Table S5); not in the dandiset.
