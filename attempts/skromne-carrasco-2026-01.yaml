- claim: edf2-no-registration-confound
  outcome: reproduced
  notebook: reproduce_skromne_carrasco_2026.ipynb
  output: claim:edf2-no-registration-confound
  assumed: true
  notes: Over all cells, with every valid CellReg score (the paper's "all cells"), 49 HD cells are
    valid in the first and last session under the main reading and 106 with raw HDI (paper 72); two
    raw-HDI cells with a CellReg score below 0 (-0.096, -0.01) are dropped. Pooled over
    mice, shift against displacement has p 0.074 (signed) and 0.62 (absolute), shift against score p
    0.98 and 0.38, both not significant, and displacement against score p 0.0003 (slope -34.4 um per
    unit score), 0.0011 after Bonferroni over the figure's 4 tests. With raw HDI the absence tests
    give p 0.084 to 0.24 and displacement against score p below 0.0001. For mouse 4 alone (10 or 19
    cells) displacement against score is not significant (p 0.96 and 0.94), so reading (b) fails.
    Restricted to cells with score above 0.8 (28 or 56 cells, the analysis before verification),
    displacement against score is 0.67 and 0.055 after Bonferroni over 4, so under that reading of
    "all cells" the claim would not reproduce; the outcome rests on the all-scores reading. Changed
    from not reproduced after verification.
  deviations:
  - Main HD reading as for fig1f-example-stable; raw HDI gives the same outcome.
  - All cells are taken as HD cells with any valid CellReg score (0 or above; scores below 0 are not
    CellReg confidence scores and are dropped), since the paper tests "all cells" and,
    separately, "cells with CellReg score over 0.8" (Extended Data Fig. 2 legend, as the claims file
    lists the statistics). Bonferroni over the four tests of the claims file.
  - Centroids are mask-weighted centres of the image masks, at 3.3 um per pixel (grid_spacing); the
    paper does not say how displacement was measured.
