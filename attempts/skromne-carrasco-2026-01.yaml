findings:
- kind: format_error
  statement: The tuning_curves table (processing/ophys/tuning_curves) of every imaging file holds one
    curve repeated for every ROI. In 401 of 402 sessions it is the curve of ROI 0, smoothed with a
    kernel of about 4 bins (median correlation 0.995). The table's description says it holds the
    tuning curve of each ROI.
- kind: identifier_missing
  statement: Each protocol's files carry a CellReg table for that protocol only, and nothing links
    ROIs across protocols. The probe trials of Fig. 3 (the first week of the protocol "4 environments
    are visited weekly in a random order, for 4 weeks") cannot be matched to the last visits of the
    two-week protocol, so Fig. 3 cannot be tested. A cross-protocol registration table would fix
    this.
- kind: data_missing
  statement: The electrophysiology files hold spike times and electrode groups only, with no
    waveforms; the waveform features of Extended Data Fig. 7f-h cannot be computed.
- kind: metadata_insufficient
  statement: The probe week of Fig. 3 is not labelled as such. It is the first week of the random-order
    protocol, whose description (four weeks of random visits) also covers the three weeks of
    Extended Data Fig. 9, where the paper describes a week of probe trials followed by four
    further weeks.
- kind: other
  statement: The dandiset holds 402 imaging sessions (367 for mice 1 to 5) where the paper reports 388,
    and random-order sessions of mouse 5, whose field of view the paper says was lost before the
    probe trials. Sessions last 902 to 1799 s where the Methods state 20 min. The circular protocol
    has 19, 20, 19, 19 and 20 sessions, as Extended Data Fig. 1e states.
- kind: other
  statement: Each electrophysiology file holds two explorations of each of the three environments,
    separated by sleep, where the paper describes one. The files hold 347 units, 254 of them on
    PoSub shanks (the paper's n of 254 cells) and the rest in cortex or CA1.
- kind: other
  statement: The CellReg scores (scratch/Cell registration scores) include values below 0, 102 of
    5,190 rows over all protocols and mice, down to -1.24, which a CellReg confidence score (0 to 1)
    cannot take. The files do not describe the score.
- kind: metadata_error
  statement: The dandiset's related publication and each file's related_publications point to the
    bioRxiv preprint (10.1101/2024.06.13.598909), not the Nature article.
- kind: methods_unavailable
  statement: Questions for the authors on the HD cell rule. Is the HDI computed on the raw or the
    smoothed tuning curve, and is the kernel 12 degrees or 12 bins? Smoothed HDI with a 12 degree
    kernel reproduces the paper's session and pair counts here, but raw HDI gives about twice as
    many HD cells, the outcomes of edf2ab-jaccard, fig2h-coherent-remapping and
    edf4c-previous-session change with it, and part of fig1f-example-stable (no mouse with 18
    sessions matches) and of edf4ij-pv-decay (mouse 5's mean at the longest interval is 0 or below)
    fails with it. Is "detected in at least six sessions" registered by
    CellReg or HD in those sessions, and which sessions enter the average HDI? With either HDI the
    proportions of Extended Data Fig. 1e are not reproduced (main reading 0.12, 0.40, 0.04, 0.29,
    0.07).
- kind: methods_unavailable
  statement: Questions for the authors on pairwise offsets and drift rates. Are angular offsets
    unsigned (0 to 180 degrees)? The paper's shuffle medians (51 to 57) match unsigned offsets
    (expected 52.7), while signed offsets give 90; unsigned was assumed. How is the drift rate per
    week computed? A least-squares slope against day difference was assumed; a line through the
    origin gives two to three times larger rates. What is the sign of a change in preferred direction?
    Taken as the earlier session minus the later one, the paper's signs of Fig. 1g and of Extended
    Data Fig. 10b are both matched (5 of 5 each), and Extended Data Fig. 10b,c are reproduced; with
    the opposite sign they are not.
- kind: methods_unavailable
  statement: Questions for the authors on the decoders. What are the XGBoost hyperparameters, how is
    dF/F normalized, how is population activity summed for the top 50% bins, do cells have to be HD
    cells in the test session, and is the error variance of Extended Data Fig. 8c circular or linear?
    Library defaults, division by the maximum, the sum, HD in both sessions and both variances were
    used; the circular variance matches the paper's values and the linear one does not. Requiring
    test cells only to be registered in the test session gives the same outcomes.
