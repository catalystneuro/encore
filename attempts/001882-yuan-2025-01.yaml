- claim: variant-domains
  outcome: partially_reproduced
  notebook: reproduce_yuan_2025.ipynb
  output: claim:variant-domains
  notes: 6 of 7 placements hold under each reading, and no reading places all 7. UniProt (Q17R60 v129,
    Q9BZV3 v146); IMPG1 has only SEA 1 (232-354) and SEA 2 (571-684), no EGF-like domain, so p.Leu740Phe
    cannot be near one; the other 6 hold. InterPro 110.0; IMPG1 has an EGF-like domain at 684-722, 18
    residues before Leu740 (near, the closest domain, not in it), but IMPG2 has a single EGF-like domain
    (1010-1051), so p.Arg1088* lies in no EGF-like 2 domain; the other 6 hold. p.Arg131Cys is 108 residues
    from SEA1 and 109 from the end of the signal peptide (1-22), so 'near SEA-1' rests on one residue
    if the signal peptide counts as a domain. The paper's own 'in' for p.Leu740Phe holds under neither
    reading. The spreadsheet's 'Location of Variant' column places p.Leu740Phe 'Post EGF-like 1', after
    the domain.
  deviations:
  - UniProt entries are pinned through UniSave at the versions current in November 2024; InterPro is read
    from its current release (110.0), which cannot be pinned through its API.
- claim: table2-pathogenicity
  outcome: not_reproduced
  notebook: reproduce_yuan_2025.ipynb
  output: claim:table2-pathogenicity
  notes: SIFT and PolyPhen-2 HumVar (Ensembl VEP release 116, MANE Select transcripts) match Table 2 exactly
    for the three IMPG2 missense variants (SIFT 0, 0, 0; PolyPhen 0.996, 0.645, 0.998) but not for IMPG1;
    VEP gives SIFT 0.02 for p.Leu740Phe and 0.09 for p.Asp423Glu, the paper's two values exchanged, and
    PolyPhen 0.106 and 0.043 (paper 0.575 and 0.98). PolyPhen-2 HumDiv (dbNSFP 4.8a) gives 0.575 for p.Leu740Phe
    as the paper does, 3 of 5 values within tolerance, but 0.31 for p.Asp423Glu. VEP calls p.Asp423Glu
    tolerated (SIFT) and benign (PolyPhen), against the paper's Pathogenic, so the Prediction column is
    not matched. CADD PHRED matches at most 2 of 7 values under any of GRCh37 or GRCh38 and v1.6 or v1.7;
    the nonsense variants score 36 to 45 against 11.2 and 13.4. No FATHMM, FATHMM-MKL or FATHMM-XF coding
    score and no MutationTaster score in dbNSFP matches the paper's columns (0 of 5 and 0 of 7). The paper's
    ids for p.Leu740Phe and p.Arg964* (rs15048636, rs267606975) differ from the variants' ids (rs150486366,
    rs267606875); the dandiset's Word document gives rs267606875.
  deviations:
  - The web tools of November 2024 cannot be called in a pinned version. SIFT and PolyPhen-2 HumVar come
    from Ensembl VEP (release 116); PolyPhen-2 HumDiv, FATHMM and MutationTaster from dbNSFP 4.8a (MyVariant.info
    build 20250624), whose MutationTaster score is a probability, not the paper's 0 to 100 score, and
    CADD from its versioned API.
  - SIFT and PolyPhen-2 were not run on GRCh37 in the notebook; VEP's GRCh37 service took 12 minutes while
    preparing (not run here).
- claim: asp423glu-novel
  outcome: not_reproduced
  notebook: reproduce_yuan_2025.ipynb
  output: claim:asp423glu-novel
  notes: IMPG1 c.1269C>A on NM_001563.4 is GRCh38 6:76002940 G>T (rs758038128). It is ClinVar variation
    1000102, a missense variant of uncertain significance in IMPG1, in all 4 ClinVar VCF releases of November
    2024 (3, 11, 20 and 26 November). The same position also carries a synonymous G>A record (1156378).
