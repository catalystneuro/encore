- kind: other
  statement: The first column of the spreadsheet 'derivatives/small table for 7 patients 20241127.xlsx'
    holds what look like hospital record numbers of the seven patients, in a public CC0 dataset. The attempt
    did not print or use them.
- kind: metadata_error
  statement: The metadata give 1 subject, 4 samples and no species, approach or measurement technique,
    while the files describe seven human patients. The figure files are named as BIDS microscopy samples
    (sub-01/micr/sub-01_sample-0N_microscopy.ome.tif.tif, one .ome.tif.jpg) but are RGB figure exports
    from Adobe Illustrator, not OME-TIFF and not microscopy; one is named 'Fig 3. VMD 20241122.1-01.tif'.
- kind: metadata_insufficient
  statement: The paper is named only in the description, not in relatedResource. No file describes the
    spreadsheet's columns (the 'Location of Variant' column is not in the paper; Refraction, clinVar and
    Pathogenicity are empty) or says which figure each image file is.
- kind: other
  statement: Six Google Drive desktop.ini files and the script setup_bids.py, which only makes the folder
    layout and a dataset_description.json that is not deposited, are among the 13 assets.
- kind: other
  statement: The Word document 'sourcedata/protein structure and stabilityIMPG2 TABLE original.docx' differs
    from the paper's Table 3; SDM gives p.Asp423Glu +0.58 (Stabilizing) where Table 3 prints -0.52, MuPRO
    gives p.Leu249Phe -1.2666, the same number as p.Cys1019Tyr, where Table 3 prints -1.525, mCSM gives
    p.Asp423Glu -0.58 against -0.653, SDM p.Cys1019Tyr -0.85 against -0.78 and iMutant p.Arg131Cys -1.22
    against -1.13, and it has no iMutant value for IMPG1. Its Table A names p.Leu249Phe 'p.Leu 249Tyr'.
- kind: paper_inconsistency
  statement: Table 4's p.Asp423Glu column (89,419 Da, pI 4.81, 12,457 atoms, GRAVY -0.474) is what ProtParam's
    definitions give for Asp423Phe on UniProt Q17R60, not for Asp423Glu (89,401.4 Da, 4.796, 12,453, -0.482);
    a single Asp to Glu change adds one CH2.
- kind: paper_inconsistency
  statement: In Table 2 the IMPG1 SIFT scores match VEP's values for the two variants exchanged (p.Leu740Phe
    0.02, p.Asp423Glu 0.09), and two variant ids are mistyped (rs15048636 for rs150486366, rs267606975
    for rs267606875, which the dandiset's Word document gives).
- kind: other
  statement: IMPG1 p.Asp423Glu (c.1269C>A, GRCh38 6:76002940 G>T, rs758038128), which the paper calls
    novel, was ClinVar variation 1000102 (missense, uncertain significance) in every ClinVar release of
    November 2024.
- kind: other
  statement: In the Figure 4 file of IMPG2 (sub-01_sample-04b) the variant labels are one row out of step
    with the images; the top row shows Arg131 and Cys131 and is labelled p.Cys1019Tyr, the middle row
    shows Cys1019 and Tyr1019 and is labelled p.Leu249Phe (read by eye).
- kind: methods_unavailable
  statement: Question for the paper's authors. Which PolyPhen-2 model (HumDiv or HumVar), which FATHMM
    model (the 'FATHMM coding' column) and which MutationTaster output (the 0 to 100 'score') give Table
    2, on which transcript and genome build, and which CADD version; which gnomAD version and which reading
    of '1 in N' (the values match v4.1 joint counts as 1/(2 x allele frequency)); and which source gives
    the domain boundaries of Figure 1, whose IMPG1 EGF-like domain is not in UniProt and whose IMPG2 EGF-like
    2 domain is not in InterPro.
