- claim: fig1i-hmmglm-decodes-behaviour
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The labels and raw recordings are there. The 34 labelled files hold 965 trials of 280 bins at
    20 Hz from 14 mice, against the expected 965 trials, 32 sessions and 13 mice (all within tolerance
    if a session is a file). The model needs the multi-unit rates of the recording on the clock of the
    labels, and that offset is in no file (the video_gap the description names). Estimated from the units'
    responses to port entries, it is clear for 23 of the 34 labelled files; the raw recording itself is
    offset from the sorted spikes by 5 to 28 s in most mPFC-LH files, and matches them at no offset in
    3. The paper's HMM-GLM is MATLAB code (Tyelab/HMMGLM), which cannot be installed in the entry's locked
    environment, and it was not ported in this run. Not run.
- claim: ed5j-six-states
  outcome: blocked
