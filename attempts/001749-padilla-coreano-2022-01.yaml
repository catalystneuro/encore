- claim: fig1i-hmmglm-decodes-behaviour
  outcome: reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:fig1i-hmmglm-decodes-behaviour
  measured:
  - 965
  - 34
  - 14
  notes: On the 512 trials of the 17 files used, the 6-state HMM-GLM AUCs with the one-bin shift are 0.60
    to 0.83 (median 0.774), all 9 above 0.5 (sign test p = 0.0039), above the GLM (median 0.541, rank-sum
    p = 0.0003) and the 9 GLMs (median 0.539, p = 0.0003); GLM against 9 GLMs p = 0.627. Without the shift
    the HMM-GLM median is 0.713 and p = 0.0009 against each. Crossings in either direction give the same
    outcome (median 0.910). Random folds pass with the shift (p = 0.047) and fail without it (p = 0.233).
    Rates z-scored per channel put the HMM-GLM below chance (median 0.475), as the code's learning rate
    (1e-6) is set for counts. Leave-one-mouse-out (10 mice) gives 9 of 9 above 0.5 (p = 0.0039). On the
    paper's own processed input the ported code gives HMM-GLM AUCs 0.79 to 0.98 against static medians
    near 0.59 and meets every test. The labelled files hold 965 trials, 34 files and 14 mice (expected
    965, 32 and 13, within tolerance if a session is a file); the paper's input holds 14 animals too.
    The SVM is not run and the Kruskal-Wallis across five models is not judged.
  deviations:
  - 17 of the 34 labelled files (512 of 965 trials, 10 of 14 mice), those whose recording can be placed
    on the behaviour clock (clear port-entry offset, within 10 s of the other clear files of that day
    and cage, scaled spikes matching the recording, labels matching the port entries at r >= 0.3); the
    offset is in no file. One of the 17 (20191029-chrimson2-2-2v3, 30 trials) peaks 8 s away from its
    port-entry offset against the paper's processed input.
  - Input computed from the raw ElectricalSeries as Methods 17 describe it ("applying a common reference
    average and determining spikes using 4 standard deviations from the mean"; 70 time stamps of 200 ms),
    with the 600 to 6,000 Hz band of Methods 11; mean and SD per channel over each 14 s trial window (the
    span is not given; a standard choice).
  - HMM-GLM as fixed by run_model.m and model_HMMGLM.m (github.com/Tyelab/HMMGLM at 3fc3567), ported line
    by line to Python (hmmglm.py); its numerical guards are kept, and NaN scores are ignored in the AUC
    as perfcurve does by default.
  - Readings of the criterion run one at a time against the main one (negative crossings, counts, AUC
    with the shift, contiguous folds in session order). They differ in outcome (z-scored rates fail; random
    folds fail without the shift), so the outcome rests on counts and contiguous folds, which the paper's
    processed input (uint16 counts per bin) and run_model.m (contiguous blocks) support. An assumption.
  - Static decoders fitted by maximum likelihood (L-BFGS) with a ridge of 1e-4 on inputs scaled by the
    training SD; the paper names no solver or regularisation.
  - Folds in which a label is absent give no AUC for it and are left out of its mean over folds (2 folds
    for resist).
  assumed: true
- claim: ed5j-six-states
  outcome: not_reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:ed5j-six-states
  notes: Held-out log-likelihood per trial (mean over 10 folds, SEM) on the input of fig1i-hmmglm-decodes-behaviour
    is -154.8 for 1 state, -124.5 (4.4) for 2, then falls slowly to -126.1 (4.3) at 6 and -126.9 (4.2)
    at 10. Reading (a) selects 2 and reading (b) selects 2. On the paper's input, run for 1, 6 and 10
    states only, the values are -529.6, -126.5 and -127.6.
  deviations:
  - Input, files and code as in fig1i-hmmglm-decodes-behaviour (17 of 34 labelled files, 512 trials).
  - States 1 to 10, as the criterion reads them; each with its own seed.
- claim: ed5k-hmmglm-generalizes-across-rank
  outcome: not_reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:ed5k-hmmglm-generalizes-across-rank
  notes: Trials of files of relative dominants (299, 7 mice) and subordinates (213, 4 mice). With the
    shift, dom to sub gives 8 of 9 AUCs above 0.5 (sign test p = 0.039), sub to dom 7 of 9 (p = 0.18;
    AUCs 0.48 to 0.91), dom 10-fold and sub 10-fold 9 of 9 (p = 0.0039); without the shift sub to dom
    is again 7 of 9 (p = 0.18). Not every combination passes. On the paper's input (its own rank per trial,
    487 dom and 478 sub trials, the counts of the 34 labelled files here) both directions give 9 of 9
    (p = 0.0039), so the difference comes from the input (fewer files and mice, and multi-unit counts
    that differ from the paper's), not from the code.
  deviations:
  - Input, files and code as in fig1i-hmmglm-decodes-behaviour; 512 of the 965 trials (legend 482 dom
    and 478 sub).
  - The sub group holds 4 mice, so training on it rests on few animals.
- claim: ed5b-rank1-wins-most
  outcome: reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:ed5b-rank1-wins-most
  measured:
  - 12
  - 11
  - 15
  - 15
  notes: Competitions per own rank over the 53 files are 12, 11, 15 and 15, all within tolerance of 12,
    12, 15 and 14. Of the 36 competitions whose outcome the labels give (34 from the file's own labels,
    2 from the competitor's), rank 1 won 10 of 11 (90.9%), rank 2 1 of 8 (12.5%), rank 3 4 of 9 (44.4%)
    and rank 4 5 of 8 (62.5%). There are no ties, so both readings agree, and the variants of the trial
    rule (delivery at 0.49 s, switch as both mice in the window) give the same table; the switch variant
    cannot differ, as labels change only on whole seconds. 17 competitions have no labels.
  deviations:
  - 36 of the 53 competitions could be decided; the 10 ephys files and 7 mPFC-LH files have no labels,
    of their own or of their competitor.
  - Trial winners come from the hand-scored labels with the rule of the Methods (Reward competition behavioral
    analysis); the occupant over 1.5 to 3 s is the mouse with more in-port bins, and a switch is a window
    whose first and last occupied bins belong to different mice. The other switch reading gives the same
    outcomes.
  - Reward delivery is taken at 2 s after tone onset from Methods 5 ("A 10uL reward of vanilla Ensure
    was delivered 2 seconds after tone onset"); the files give 0.49 s, run as a variant with the same
    result.
- claim: ed5c-rewards-not-different
  outcome: partially_reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:ed5c-rewards-not-different
  notes: Rewards (trials won) did not differ by the paired t-test. Over 20 sessions (main) dominants won
    14.35 and subordinates 12.15 (mean difference 2.20, 95% CI -4.04 to 8.44, p = 0.498); over the 34
    labelled files 14.12 and 12.38 (p = 0.505); with delivery at 0.49 s, p = 0.543. The second part of
    the claim, the correlation of body weight difference with rewards won, could not be tested; no file
    holds a body weight (the subject record has age, genotype, sex, species, strain, subject id and description,
    and no description gives a weight). The rewards part holds and the other is untested.
  deviations:
  - The body weight correlation is not tested (data missing).
  - Pairs are 20 sessions (main) or 34 files, against the paper's 22 pairs; the files count the two files
    of 14 sessions as separate pairs, though they are two views of one session.
  - Trial winners as in ed5b-rank1-wins-most, from the Methods passage cited there.
- claim: ed5d-subordinates-slower-latency
  outcome: not_reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:ed5d-subordinates-slower-latency
  notes: With each label trial set against the tone of the same index, subordinates enter the port later
    in their win trials (median 1.47 against 1.01 s, 189 and 211 trials, rank-sum p = 0.0196, KS p = 0.0036;
    next entry for a mouse already in the port, p = 0.0204). Leaving out the 12 files whose labels and
    port entries agree at r below 0.3 or not at all gives p = 0.158 (1.40 against 1.28 s, 158 and 171
    trials). With each file's best tone shift p = 0.0458, and with that shift and without the files below
    r = 0.3 at it p = 0.375 (1.48 against 1.38 s, 166 and 185 trials; KS p = 0.067). From the hand-scored
    labels, which need no alignment, p = 0.206 over all win trials and 0.16 over the trials of the main
    test; over mouse means p = 0.055 (entries) and 0.059 (labels). Subordinates are slower in every reading,
    but the rank-sum is below 0.05 only in the readings that keep the files whose labels and entries disagree.
  deviations:
  - Win trials and their port entries are aligned through the labels; in 18 labelled files the labels
    hold fewer trials than tones and in several the label trials start at a later tone, which no file
    records. The outcome takes the reading that sets aside trials whose labels cannot be placed on the
    port entries (best tone shift, files at r >= 0.3); an assumption, since the paper does not say how
    its latencies were matched to trials.
  - 400 win trials with port entries in the main reading (351 in the outcome's reading), against the paper's
    326 dom and 358 sub trials.
  - How a mouse already at the port at onset is counted is not given; both readings (0, or its next entry)
    are shown and agree.
  - The legend's one-way RM-ANOVA is not judged, as the criterion says.
  assumed: true
- claim: ed5e-port-occupancy-not-different
  outcome: reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:ed5e-port-occupancy-not-different
  notes: Percent of the 10 s tone labelled in the port did not differ by relative rank; dominants 26.37%
    and subordinates 20.23% over 20 sessions (main; mean difference 6.14, 95% CI -4.79 to 17.08, paired
    t-test p = 0.284), 25.19% and 20.72% over 34 files (p = 0.327).
  deviations:
  - Occupancy is from the hand-scored position labels (self in port, other in port), not from AlphaTracker
    distance.
  - 20 sessions (main) or 34 files, against the paper's 31 sessions; the files count the two views of
    14 sessions as separate pairs.
- claim: ed5f-dominants-displace-more
  outcome: reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:ed5f-dominants-displace-more
  notes: Over the 13 sessions where both mice's files are labelled and both pushed, dominants displaced
    the competitor in 91.7% of their pushes and subordinates in 60.2% over the labelled bins (mean difference
    31.5 points, 95% CI 13.5 to 49.6, paired t-test p = 0.0051), and 93.4% against 56.5% during the tone
    (p = 0.0013).
  deviations:
  - '"Whole competition" is the labelled bins (-2 to +12 s of each trial); the labels do not cover the
    intertrial intervals.'
  - A push's outcome is in the competitor's file only, so the test uses 13 sessions with both files, against
    the paper's 32 and 31.
  - Pushing success as the Methods define it ("percent of pushing that resulted in displacing competitor");
    a push is a run of push bins, successful when the competitor's file labels any of its bins displaced.
- claim: ed5g-time-displaced-not-different
  outcome: reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:ed5g-time-displaced-not-different
  notes: Time labelled displaced did not differ by relative rank over the 14 sessions with both files;
    dominants 3.21 s and subordinates 3.93 s (mean difference -0.71 s, 95% CI -2.19 to 0.76, paired t-test
    p = 0.359); during the tone 2.71 against 3.14 s (p = 0.512); unpaired over all 34 files 3.47 against
    4.41 s (Welch p = 0.43).
  deviations:
  - 14 sessions, against the paper's 31; time is over the labelled bins only.
- claim: fig2a-win-lose-segregated-before-cue
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: 'The units tables hold 5,879 Klusta clusters, every one labelled unsorted, where the paper analyses
    998 manually curated cells (913 kept for clustering); no curation label is filled in, and no rule
    on firing rate comes near 998 (5,232 clusters at or above 0.05 Hz, 2,075 above 1 Hz). The paper''s
    cells cannot be selected. The clocks add to this: the stored spike times are two thirds of their time
    in the recording, and the offset between the spikes and the tone and port-entry times (the video_gap
    the description names) is in no file; the data put it at 4 to 45 s in 25 of the 26 files where it
    can be estimated, and it cannot be estimated for the 10 ephys files or 12 of the 38 files with port
    entries.'
