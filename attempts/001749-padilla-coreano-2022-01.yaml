findings:
- kind: format_error
  statement: The spike_times of every units table are two thirds of the time of the same spikes in the
    ElectricalSeries. Multiplied by 1.5 they line up with threshold crossings of the recording (cross-correlation
    peaks of 14 to 95 SD in 50 of 53 files, none above 7 SD unscaled), and the last spike of every file
    falls at 0.63 to 0.68 of the recording length. The times look divided by 30 kHz where the logger samples
    at 20 kHz.
- kind: other
  statement: In 18 of the 21 mPFC-LH files and one ephys file the rescaled spike times match the ElectricalSeries
    only after an offset of 5 to 28 s, and in 3 mPFC-LH files (20191025-chrimson2-3-1v3, 20191029-chrimson1-1-1v2,
    20191029-chrimson1-2-1v2) at no offset within 60 s, so in those files the sorted spikes and the raw
    recording do not share a start.
- kind: metadata_insufficient
  statement: The offset between the neural recording and the behaviour clock of the tone times, port entries
    and labels is in no file, though the dandiset description says a video_gap variable holds it. Estimated
    from the units' responses to port entries it is 4 to 45 s, differing by session (294 s in one file),
    and it cannot be estimated for the 10 ephys files, which have no port entries, or for 12 of the 38
    files with them. No analysis aligning spikes to the task can rely on the files alone.
- kind: metadata_insufficient
  statement: Every one of the 5,879 Klusta clusters is labelled unsorted, where the paper analyses 998
    manually curated cells. The quality column exists but no cluster carries a curation label, so the
    paper's cells cannot be told from multi-unit and noise clusters, and none of the single-unit findings
    can be tested.
- kind: data_missing
  statement: The dandiset holds no alone sessions, no phototagging light pulses, no optogenetic experiments,
    no unimplanted cohort, no ex vivo recordings, no AlphaTracker evaluation frames, no body weights and
    no port location.
- kind: data_missing
  statement: The 10 ephys files hold no port entries, labels or poses, and in all 22 mPFC-BLA files every
    pose value is missing; 17 of the 53 competitions have no labels of either mouse.
- kind: metadata_insufficient
  statement: Poses are given for Mouse1 and Mouse2 with nothing saying which is the file's subject, and
    without the nose that the Methods say was tracked (ears, tail base and logger only).
- kind: metadata_error
  statement: Reward deliveries are 0.49 s after tone onset in every file, where the Methods give 2 s.
    The tone times are the program's schedule, the same in all files of a cohort (all 53 share the first
    17 onsets), not times recorded per session; in 7 of the 10 ephys files the last tones fall after the
    end of the neural recording.
- kind: metadata_error
  statement: pair_in_dataset is 'not included' in all 53 files, but for 20 sessions the competitor's file
    is in the dandiset.
- kind: metadata_error
  statement: sub-20200121-BLA2-1-1v2 has a session start of 2020-01-22 13:30, while its labels mirror
    those of its competitor's file in the 2020-01-21 13:15 session; the subject description of sub-20200123-BLA1-3-2v3
    names mouse 2 against mouse 3, where the file name says mouse 3 against mouse 2 (its ranks are those
    of the file name's mice).
- kind: other
  statement: The ElectricalSeries of sub-20191025-chrimson2-3-1v3 is the same signal as that of sub-20191029-chrimson2-3-1v3
    (identical samples at three points, same length), while their units differ and the 20191025 file's
    units match its recording at no offset; the 20191025 file most likely carries the 20191029 recording
    in place of its own.
- kind: other
  statement: Where both mice of a session are labelled, one file's labels are the other's seen from the
    competitor (self and other in port swapped, a push opposite displaced or resist), in every bin for
    most sessions; in 20200121-BLA2-3v4 and 20200122-BLA1-3v4 only 76% and 68% of position bins agree.
- kind: other
  statement: The 34 labelled files hold 965 trials from 14 mice, the size of the paper's HMM-GLM dataset
    (965 trials, 32 sessions, 13 mice), and the 53 files hold the 53 competitions of ED Fig. 5b (12, 11,
    15 and 15 per rank against 12, 12, 15 and 14).
