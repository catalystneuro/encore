  notes: 'The units tables hold 5,879 Klusta clusters, every one labelled unsorted, where the paper analyses
    998 manually curated cells (913 kept for clustering); no curation label is filled in, and no rule
    on firing rate comes near 998 (5,232 clusters at or above 0.05 Hz, 2,075 above 1 Hz). The paper''s
    cells cannot be selected. The clocks add to this: the stored spike times are two thirds of their time
    in the recording, and the offset between the spikes and the tone and port-entry times (the video_gap
    the description names) is in no file; the data put it at 4 to 45 s in 25 of the 26 files where it
    can be estimated, and it cannot be estimated for the 10 ephys files or 12 of the 38 files with port
    entries.'
