- claim: ed5b-rank1-wins-most
  outcome: reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:ed5b-rank1-wins-most
  measured:
  - 12
  - 11
  - 15
  - 15
  notes: Competitions per own rank over the 53 files are 12, 11, 15 and 15, all within tolerance of 12,
    12, 15 and 14. Of the 36 competitions whose outcome the labels give (34 from the file's own labels,
    2 from the competitor's), rank 1 won 10 of 11 (90.9%), rank 2 1 of 8 (12.5%), rank 3 4 of 9 (44.4%)
    and rank 4 5 of 8 (62.5%). There are no ties, so both readings agree, and the variants of the trial
    rule (delivery at 0.49 s, switch as both mice in the window) give the same table. 17 competitions
    have no labels.
  deviations:
  - 36 of the 53 competitions could be decided; the 10 ephys files and 7 mPFC-LH files have no labels,
    of their own or of their competitor.
  - Trial winners come from the hand-scored labels with the rule of the Methods (Reward competition behavioral
    analysis); the occupant over 1.5 to 3 s is the mouse with more in-port bins, and a switch is a window
    whose first and last occupied bins belong to different mice. The other switch reading gives the same
    outcomes.
  - Reward delivery is taken at 2 s after tone onset from Methods 5 ("A 10uL reward of vanilla Ensure
    was delivered 2 seconds after tone onset"); the files give 0.49 s, run as a variant with the same
    result.
- claim: ed5c-rewards-not-different
  outcome: reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:ed5c-rewards-not-different
  notes: Rewards (trials won) did not differ by the paired t-test. Over the 34 labelled files dominants
    won 14.12 and subordinates 12.38 (mean difference 1.74, 95% CI -3.31 to 6.78, p = 0.505); over 20
    sessions 14.35 and 12.15 (p = 0.498); with delivery at 0.49 s, p = 0.552. The second part of the claim,
    the correlation of body weight difference with rewards won, could not be tested; the dandiset holds
    no body weights. The outcome is that of the rewards part.
  deviations:
  - The body weight correlation is not tested (data missing).
  - Pairs are 34 files or 20 sessions, against the paper's 22 pairs; the paper's other counts (31 and
    32 sessions, 965 trials in 32 sessions) are closer to files.
  - Trial winners as in ed5b-rank1-wins-most, from the Methods passage cited there.
- claim: ed5d-subordinates-slower-latency
  outcome: reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:ed5d-subordinates-slower-latency
  notes: In each file's own win trials, the latency from tone onset to the subject's port entry (0 when
    in the port at onset) is longer for subordinates, median 1.47 against 1.01 s over 189 and 211 trials
    (rank-sum p = 0.0196, KS p = 0.0036). Taking the first entry after onset for a mouse already in the
    port gives 2.12 against 1.68 s (p = 0.0204). Readings from tone onset and from delivery differ by
    a constant and give the same tests. From the hand-scored labels the direction is the same but the
    rank-sum is not significant (1.55 against 1.17 s, p = 0.206; KS p = 0.027). Over mouse means the rank-sum
    gives p = 0.055. 87 of 487 win trials have no port entry within 12 s or come from a file without port
    entries.
  deviations:
  - 400 win trials with port entries, against the paper's 326 dom and 358 sub trials.
  - How a mouse already at the port at onset is counted is not given; both readings (0, or its next entry)
    are shown and agree.
  - The legend's one-way RM-ANOVA is not judged, as the criterion says.
- claim: ed5e-port-occupancy-not-different
  outcome: reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:ed5e-port-occupancy-not-different
  notes: Percent of the 10 s tone labelled in the port did not differ by relative rank; dominants 25.19%
    and subordinates 20.72% over 34 files (mean difference 4.47, 95% CI -4.34 to 13.28, paired t-test
    p = 0.327), 26.37% and 20.23% over 20 sessions (p = 0.284).
  deviations:
  - Occupancy is from the hand-scored position labels (self in port, other in port), not from AlphaTracker
    distance.
  - 34 files or 20 sessions, against the paper's 31 sessions.
- claim: ed5f-dominants-displace-more
  outcome: reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:ed5f-dominants-displace-more
  notes: Over the 13 sessions where both mice's files are labelled and both pushed, dominants displaced
    the competitor in 91.7% of their pushes and subordinates in 60.2% over the labelled bins (mean difference
    31.5 points, 95% CI 13.5 to 49.6, paired t-test p = 0.0051), and 93.4% against 56.5% during the tone
    (p = 0.0013). Reading each mouse's pushes from its own file or from its competitor's gives the same
    numbers.
  deviations:
  - '"Whole competition" is the labelled bins (-2 to +12 s of each trial); the labels do not cover the
    intertrial intervals.'
  - A push's outcome is in the competitor's file only, so the test uses 13 sessions with both files, against
    the paper's 32 and 31.
  - Pushing success as the Methods define it ("percent of pushing that resulted in displacing competitor");
    a push is a run of push bins, successful when the competitor's file labels any of its bins displaced.
- claim: ed5g-time-displaced-not-different
  outcome: reproduced
  notebook: reproduce_padilla_coreano_2022.ipynb
  output: claim:ed5g-time-displaced-not-different
  notes: Time labelled displaced did not differ by relative rank over the 14 sessions with both files;
    dominants 3.21 s and subordinates 3.93 s (mean difference -0.71 s, 95% CI -2.19 to 0.76, paired t-test
    p = 0.359); during the tone 2.71 against 3.14 s (p = 0.512); unpaired over all 34 files 3.47 against
    4.41 s (Welch p = 0.43).
  deviations:
  - 14 sessions, against the paper's 31; time is over the labelled bins only.
- claim: fig2a-win-lose-segregated-before-cue
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: 'The units tables hold 5,879 Klusta clusters, every one labelled unsorted, where the paper analyses
