inputs:
- what: The paper's lists of successful large and small reward trials (files "09272024_nlx_c8c_value object
    start_big rew and success_tr1-1411.mat" and the small reward one), used only to check the trial
    selection built from the dandiset's events.
  source: https://doi.org/10.5281/zenodo.14825992
outcomes:
- claim: fig8a-single-trial-dopamine
  outcome: reproduced
  notebook: reproduce_choi_2025.ipynb
  output: claim:fig8a-single-trial-dopamine
  notes: In trial 133 (1-based, a successful large reward trial) the SD of dopamine referenced at V over the 5 s
    after V is 2.02 times that over the 5 s before. Under the other reading (index 133, trial 134) the ratio
    is 2.04, with 36% and 46% of samples NaN. The test is weak, as the median ratio over all 951 successful
    trials is 1.27 and 60% exceed 1.
  deviations:
  - The paper shows the trial as a figure with no measure; the SD ratio and its windows were chosen here.
  - The paper's trial numbering is not stated; both 1-based and 0-based readings are shown, and both match.
- claim: fig8b-dopamine-large-vs-small
  outcome: reproduced
  notebook: reproduce_choi_2025.ipynb
  output: claim:fig8b-dopamine-large-vs-small
  notes: From V to reward, dopamine referenced at V averages 1.87 in large and 1.11 in small reward trials
    (difference 0.76 in the file's unstated unit, Cohen's d 0.18, Mann-Whitney p = 0.0037, 434 and 466 trials,
    18 and 33 dropped for lack of samples). The difference is small in the first 2 s after V (p = 0.49) and
    largest from reward to 3 s after (difference 1.54, p = 0.0002); before V there is none (p = 0.52). It holds
    in the second half of the session (p = 0.0098) and not significantly in the first (p = 0.089).
  deviations:
  - The PCA dopamine estimate at V is subtracted, in place of subtracting the background voltammogram at V
    before the PCA; the two agree if the PCA model is linear, which the dandiset does not let us check.
  - The window (V to each trial's reward) and the test were chosen here; the paper states none.
  - Trial 1411, which the paper's large reward list leaves out, is included (one trial of 452).
- claim: fig9a-spikes-task-aligned
  outcome: reproduced
  notebook: reproduce_choi_2025.ipynb
  output: claim:fig9a-spikes-task-aligned
  notes: With the spike times moved to the trial clock by the offset measured in the data check (11812.11 s),
    all successful trials have a spike within V - 1 s to V + 3 s, and the variance across 100 ms bins of the
    PSTH is 0.49 against a 95th percentile of 0.06 over random alignments (p = 0.005 with 200). The rate falls
    from 5.63 spikes/s before V to 4.58 in the first 0.2 s and rises to 7.70 at 0.3 to 0.5 s. Large and small
    trials do not differ over 0 to 1 s (5.69 against 5.66 spikes/s, p = 0.90); the paper states no difference.
    The Plexon unit gives 0.17 against 0.06. With the spike times as stored, 42% of trials have a spike in the
    window and the variance is 0.01 against 0.03, so the claim fails on the file as published.
  deviations:
  - The spike times are moved by an offset measured from the data (the raw ephys located in the stored LFP);
    the file places them 11812.11 s early.
  - The spikes are those of the thresholded table (the paper's Zenodo file); the Plexon unit is a variant.
  - The paper states no effect for this panel; the criterion (spikes in most trials, and a rate locked to V
    beyond chance) was chosen here.
- claim: fig9bc-unit-waveform-isi
  outcome: reproduced
  notebook: reproduce_choi_2025.ipynb
  output: claim:fig9bc-unit-waveform-isi
  notes: No ISI is under 1 ms (9 of 101732 under 2 ms), and the mean waveform's trough of -56.4 µV is 4.79 times
    the SD across spikes at that sample. The shortest ISI is 1.56 ms, about the 48-sample waveform length, so the
    detection excludes shorter intervals and the ISI part of the criterion says little. The Plexon unit has 1 ISI
    under 1 ms and 39 (0.04%) under 2 ms.
  deviations:
  - The paper states no measure for these panels; the 1% ISI rule and the trough-to-SD ratio are common choices
    made here.
  - The waveforms are read as microvolts, although the file states volts.
- claim: fig9d-beta-suppression-large
  outcome: partially_reproduced
  notebook: reproduce_choi_2025.ipynb
  output: claim:fig9d-beta-suppression-large
  notes: Beta power (13 to 30 Hz) falls after V in both conditions (median log10 ratio of 0 to 0.5 s after V to
    0.5 s before, -0.158 for large and -0.125 for small, each p < 0.001 against 0). The fall is larger for large
    cues, but not significantly (difference of medians -0.033, Mann-Whitney p = 0.108; 452 and 499 trials, none
    dropped). No variant reaches p < 0.05 (15 to 30 Hz, p = 0.063; 1 s baseline, p = 0.108; 12 to 25 Hz,
    p = 0.19; windows of 0 to 0.3 s and 0 to 1 s, p = 0.59 and 0.84; without baseline, p = 0.17). The paper
    states no test for this panel.
  deviations:
  - The band, the filter, the power measure, the baseline, the window and the test were chosen here; the paper
    gives none.
  - The stored series, described as beta-band LFP, is broadband and was band-passed here.
- claim: recordings-two-monkeys
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds one session of monkey T only (one NWB file). No recording of monkey J is in it or in
    the paper's Zenodo record, which also holds monkey T only. The monkey T part is tested by the Figure 8 and 9
    claims.
- claim: scfe-functional-yield
  outcome: blocked
  blocked_by: data_missing
  notes: The per-electrode background current and noise measured at implantation and during recovery, for 40
    and 51 sCFEs, are not in the dandiset, which holds one FSCV electrode (c8ds) on one day. Not found in the
    Zenodo record either.
- claim: scfe-background-yield
  outcome: blocked
  blocked_by: data_missing
  notes: As for scfe-functional-yield; the electrode-level background and noise measurements are not deposited.
- claim: mcfe-functional-yield
  outcome: blocked
  blocked_by: data_missing
  notes: No mCFE measurements are in the dandiset or the Zenodo record.
- claim: dopamine-signal-yield
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds the FSCV of one electrode; the 24 and 15 functional CFEs and which of them showed
    dopamine signals are not deposited.
- claim: asepsis-cultures
  outcome: blocked
  blocked_by: data_missing
  notes: The culture results (IDEXX BioAnalytics) are not in the dandiset, the Zenodo record or the
    protocols.io protocols the paper cites.
- claim: fig6-drainage-volume
  outcome: blocked
  blocked_by: data_missing
  notes: The aspirated volumes per session are not in the dandiset or the Zenodo record.
- claim: fig7-bone-growth-margins
  outcome: blocked
  blocked_by: data_missing
  notes: The observations are photographs and surgical notes, which are not deposited.
findings:
- kind: format_error
  statement: The raw ephys and the spike times are not on the clock of the trials, events, LFP and FSCV
    table. The raw ephys is stored with a starting time of 0 s and a rate, and the spike times count from its
    first sample. Locating the raw c7b minus c5c signal in the stored LFP puts raw time 0 at 11812.11 s on the
    trial clock (correlation 0.98 to 1.00 at eight points, drift about 4 ms per hour). Without this correction
    spikes cannot be aligned to the task.
- kind: metadata_error
  statement: The absolute times disagree. On the trial clock the raw samples run from 12:06:44 to 17:12:20,
    while the Neuralynx header gives the recording as opened at 08:49:52 (the session start) and closed at
    15:12:24, two hours before the raw samples end. The header span (22952 s) is also longer than the raw
    samples (18336 s).
- kind: other
  statement: The stored spike times of the thresholded units are about 7.1 ms after the spike troughs in raw
    c5d (per-spike trough lags of -7.4 to -6.9 ms).
- kind: metadata_error
  statement: The series "bipolar_lfp_series" is described as beta-band LFP but is broadband with line noise
    removed. Its values are already in volts, while it carries the raw int16 conversion factor (3.05e-8), which
    would scale them about 3e7 times too small.
- kind: metadata_error
  statement: The thresholded spike waveforms are stated in volts but hold microvolts (mean trough about -56),
    and the raw FSCV current is stated in amperes but holds nanoamperes (values around 1000).
- kind: metadata_insufficient
  statement: The columns of the trial-aligned FSCV table (da, ph, m, iox) state no units, and the `good` column
    is true for every trial.
- kind: metadata_error
  statement: The subject description ("Two adult female rhesus monkeys were used for in vivo validation of the
    s-µIP device"), the session and experiment descriptions and the keyword "micro-invasive neural implant"
    describe the lab's micro-invasive probe study, not this paper's chamber.
- kind: format_error
  statement: The event table stores each event once per overlapping 60 s trial window, about five copies of
    each (7221 stored trial-start events for 1412 distinct ones), and its event times are not sorted. The
    Plexon units table's spike times are not sorted either.
- kind: metadata_insufficient
  statement: The trial tags are all "initial cue display" and carry no trial type. Reward size and outcome can
    be rebuilt from the events, and they then match the paper's Zenodo trial lists except trial 1411, which
    the events mark as a successful large reward trial and the list leaves out.
- kind: metadata_insufficient
  statement: The paper says the reward size depends on whether the target is at the top or bottom of the
    screen. The events code left and right conditions, and both reward sizes occur on both sides, so the
    target position that sets the reward is not in the dandiset.
- kind: other
  statement: The raw FSCV minute files are joined without their gaps (328 min of scans against 302 min of
    trials, placed from a single starting time), and the trial-aligned oxidation current cannot be located in
    them, so the raw FSCV's clock could not be established.
- kind: data_missing
  statement: Only one session of monkey T is deposited. The data behind the electrode yields, cultures,
    drainage volumes and bone growth, and all of monkey J, are not, so eight of the thirteen claims cannot be
    tested.
