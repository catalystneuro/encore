    the imaged planes (GCaMP and CTB-647 channels), not the retrograde double-labelling of Extended Data
    Fig. 3d.
findings:
- kind: data_missing
  statement: The dandiset holds none of the photoinhibition (Figure 1) or photoactivation (Figure 5, Extended
    Data Figures 3, 6 and 7) data, and no histology. Nine of the paper's findings cannot be tested for
    this reason. The Ai32 mice that are in it have no record of light.
- kind: other
  statement: Every unit labelled PT (45) or IT (27) is a second copy of a unit labelled Pyr in the same
    file, with an identical spike train, so the 1,441 units are 1,369 distinct units. Counting units by
    label double-counts the tagged neurons.
- kind: selection_undocumented
  statement: The 39 units of intermediate spike width (0.35 to 0.45 ms) that the paper recorded and excluded
    are not in the dandiset, which does not say so; no deposited unit has an intermediate width.
- kind: data_missing
  statement: The activated neurons that failed the collision test (22 from the pons, 106 from ALM) and
    the 7 that could not be tested carry no label, so the tagging outcome can be read only for the 72
    neurons that passed.
- kind: metadata_insufficient
  statement: In 75 sessions the antidromic tagging light was delivered during behavioural trials (4,332
    of 18,385 correct trials). The trial tables do not flag these trials; they can be found only from
    the laser traces under stimulus/presentation, whose series have the description 'no description'.
- kind: metadata_error
  statement: The laser power series are labelled 'watts' but hold values of 47.1 and 82 at the pulses,
    the milliwatts of the Methods (47 to 82 mW); the AOM input traces, also labelled 'watts', run from
    0 to 4.
- kind: other
  statement: The extracellular trial tables hold 1,540 trials with a lick instruction that have no behavioural
    events; 1,447 of them are marked 'right', 'hit' and 'no early', last exactly 5.5 s, and 1,345 hold
    no spike from any unit. They look like placeholders for removed trials filled with default values.
    Taken as given they raise performance and bias trial counts towards lick right.
- kind: metadata_insufficient
  statement: The imaging files flag no trial as an early lick (all False, stored as booleans, where the
    extracellular files use 'early'/'no early'), so early-lick trials cannot be excluded from the imaging
    analyses.
- kind: metadata_insufficient
  statement: No imaging plane gives its depth, so the layer 5 PT and IT populations of Figure 4g, h cannot
    be selected; the files label 843 included cells IT against the paper's 542 in layer 5.
- kind: metadata_error
  statement: The imaging mice are given the genotype 'Rosa-lsl-tdtomato' (one) or none (three); the Methods
    use C57Bl/6Crl mice. The ROI labels include 'Pyr' (23) and 'interneuron' (9), which the paper does
    not describe, and the `included` flag is not described; 424 included ROIs are not 5% brighter than
    their neuropil by the median ratio.
- kind: metadata_insufficient
  statement: The `lick_trace` series (10 kHz) is described only as the tongue movement when licking; nothing
    says it is the photodiode signal used for reaction times or how a reaction time is read from it. Its
    level and direction differ between sessions (median baselines 0.069 to 4.83 a.u.; it falls after
    the go cue in 15 of 99 sessions), and nothing describes the gain or polarity.
- kind: other
  statement: 66 extracellular trials without an early lick have a go cue less than 2.6 s after the sample
    event, against 2.6 s in all others; they are dropped here.
- kind: other
  statement: Spikes are stored only within 5.5 s trial windows (from 0.57 s before the sample event),
    so baselines before the trial and inter-trial activity cannot be measured, and in early-lick trials,
    where the go cue comes later, part of the response epoch is not stored.
