- claim: behaviour-performance
  outcome: reproduced
  notebook: reproduce_li_2015.ipynb
  output: claim:behaviour-performance
  measured: 76.5
  notes: Without the trials with tagging light, in the 99 extracellular sessions, per cent correct is
    77.2% pooled, 76.5% over sessions and 75.9% over mice with no-response trials left out (76.5%, 75.8%
    and 75.2% counted as errors), all within 78.4 +/- 7.84%. Early licks are 11.6% of trials over sessions,
    below 14.3%, but 14.5% pooled and 14.7% over mice, so the claim holds under reading (b) only. Keeping
    the light trials gives 76.6%, 76.3% and 75.7% correct and 13.0%, 11.7% and 14.7% early licks. The
    imaging sessions, which flag no early licks, give 83.5% correct pooled.
  deviations:
  - The dandiset holds 23 of the paper's 42 task mice (the recording and imaging mice).
  - Trials with tagging light are found from the laser traces, as the trial tables do not flag them.
  - 1,540 extracellular trials with a lick instruction but no events (1,447 of them marked right, hit,
    no early) are left out; counted as given they would raise performance.
  - Only the extracellular sessions are used, as the imaging files flag no early licks.
  - Whether no-response trials count as errors is not stated (question asked); both are shown and give
    the same outcome.
