- claim: fig6no-cea-clusters
  outcome: partially_reproduced
  notebook: reproduce_lee_2025.ipynb
  output: claim:fig6no-cea-clusters
  measured: 27
  notes: All 16 readings (ramp ratio absolute or from deflections, sag steady state 100 or 200 ms, detection 2 or
    3 SD, IEI reading a or b) give two clusters of 27 ChR2 CeA cells (the paper has 26), a late-firing cluster (mean
    firing delay 415 ms, maximum frequency 32 Hz, sag 1.7 mV) and a regular-firing one (168 ms, 79 Hz, 5.7 mV).
    The late cluster is mostly excited (11 to 13 of 17 or 18 cells) but has 2 or 3 inhibited cells and 3 without
    a label, so not every cell is excited as the criterion requires; 5 of 9 or 10 regular-firing cells are inhibited,
    more than half. The readings agree. The cells come from 14 subjects.
  deviations:
  - The files do not record the light; the first pulse is taken 5.468 s into each 30 s light sweep, where the average
    responses start, with later maxima of the grand average about 33 ms apart (data check). Cells recorded only
    with other light protocols (20 s or 60 s sweeps, light at other times) are left out.
  - The paper gives no threshold for an EPSP or IPSP (measured by hand in Clampfit); the criterion's readings, 2
    and 3 SD of the 5 s baseline of the average trace, are run, with 5 SD as a variant.
  - Response labels follow the Methods (Ex vivo electrophysiology, last paragraph), the IEI when the cell has firing
    sweeps, else the EPSP/IPSP class with a mix labelled by the sign of the 0-5.5 s voltage area.
  - Features computed here from the raw sweeps; the paper's values (Source data 13) are not in paper/.
