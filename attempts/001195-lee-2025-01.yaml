- claim: fig7-s1ef-red-vs-blue
  outcome: reproduced
  notebook: reproduce_lee_2025.ipynb
  output: claim:fig7-s1ef-red-vs-blue
  notes: 9 ChrimsonR CeA cells have all three lights, as in the paper. Amplitude F(2,16) = 25.6, p below 0.0001
    under both readings (mean 9.9 mV red against 1.8 and 0.9 mV blue), red larger in 8 of 9 cells against each blue;
    area F(2,16) = 11.0 (signed, p = 0.001) or 7.0 (absolute, p = 0.0067), red larger in 9 of 9. Paired t-tests
    of red against each blue give p from 0.0006 to 0.045. The paper's F values (200.1, 404.2) are much larger; one
    cell (C1, 0.68 mV to red) barely responds.
  deviations:
  - The ChrimsonR sweeps are matched to the light conditions by their descriptions; '+0.3mW blue light' and '+0.2mW
    blue light' are read as the blue light conditions of Figure 7 supplement 1E-F and '+0.3mW cont blue light' as
    red during constant blue (panels G-I). The blue-light responses (0.4 to 3.6 mV) are far below the red ones,
    consistent with this reading.
  - The files do not record the light; the first pulse is taken 5.468 s into each 30 s light sweep, where the average
    responses start, with later maxima of the grand average about 33 ms apart (data check). Cells recorded only
    with other light protocols (20 s or 60 s sweeps, light at other times) are left out. The ChrimsonR sweeps show
    the same onset.
  - The paper does not say how a PSP with both an EPSP and an IPSP gives one amplitude or area; the criterion's
    two amplitude readings, and signed and absolute area, are run and agree.
