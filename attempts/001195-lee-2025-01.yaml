    with a 5 mV square command, is stored as an IZeroClampSeries with units volts.
- kind: other
  statement: Two cells named with the BLP letter (P4x and P42 of subject C141) are labelled BNST in inferred_layer
    and targeted_layer; the 19 B-named files match the paper's 19 BNST cells. One cell (P10 of subject in_vivo_9)
    has a resting potential of -18 mV and a ch-1 far outside any plausible current in its rest sweeps. Subject ids
    are inconsistent ('4484' and '4484?', '235' and '235 cage', 'in_vivo_5' and 'in_vivo_5_2'), so whether these
    are the same animals is not stated.
- kind: other
  statement: The dataset holds 15, 40 and 56 ChR2 cells with 30 s rest sweeps in the BNST, CeA and BLP, against
