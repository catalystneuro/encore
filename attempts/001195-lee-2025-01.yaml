- claim: fig6j-epsp-amplitude-region
  outcome: reproduced
  assumed: true
  notebook: reproduce_lee_2025.ipynb
  output: claim:fig6j-epsp-amplitude-region
  notes: With all cells with an EPSP (reading a), Kruskal-Wallis gives H = 6.92, p = 0.031 at 2 SD (14, 39 and 54
    cells) and H = 10.04, p = 0.0066 at 3 SD; Dunn's test CeA against BLP p = 0.042 and 0.015; CeA median 2.6 and
    2.8 mV against BLP 1.4 mV. With excitation-only cells (reading b) no test is significant (p = 0.76 and 0.55;
    25 and 56 cells). The readings disagree, and reading (a) is adopted (see deviations). The question is for the
    paper's authors (findings).
  deviations:
  - The files do not record the light; the first pulse is taken 5.468 s into each 30 s light sweep, where the average
    responses start, with later maxima of the grand average about 33 ms apart (data check). Cells recorded only
    with other light protocols (20 s or 60 s sweeps, light at other times) are left out.
  - The paper gives no threshold for an EPSP or IPSP (measured by hand in Clampfit); the criterion's readings, 2
    and 3 SD of the 5 s baseline of the average trace, are run, with 5 SD as a variant.
  - Assumed that Figure 6J includes every cell with an EPSP, mix cells included. The legend calls it the 'optically-evoked
    excitatory post-synaptic potential' at rest, which a mix cell also has, and the claims file notes a BNST point
    in Figure 6K that only a mix cell can give. Reading (b) is shown and does not reproduce.
