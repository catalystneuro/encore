- claim: fig6df-epsp-ipsp-at-rest
  outcome: reproduced
  notebook: reproduce_lee_2025.ipynb
  output: claim:fig6df-epsp-ipsp-at-rest
  measured:
  - 15
  - 40
  - 56
  notes: Under both readings every region has cells with an EPSP and cells with an IPSP. At 2 SD the BNST, CeA and
    BLP have 14, 39 and 54 cells with an EPSP and 10, 27 and 48 with an IPSP; at 3 SD 12, 37 and 54, and 6, 11 and
    34. The classes at 2 SD are mostly mix (67, 65 and 82%); at 3 SD excitation 47, 73 and 36%, mix 33, 20 and 61%;
    at 5 SD mostly excitation. The dataset holds 15, 40 and 56 ChR2 cells with 30 s rest sweeps where the paper
    reports 19, 36 and 48, so the counts do not match and the claim is judged on the cells present, as the criterion
    says. 19 ChR2 cells (12 CeA, 6 BNST, 1 BLP) have no such sweeps.
  deviations:
  - The files do not record the light; the first pulse is taken 5.468 s into each 30 s light sweep, where the average
    responses start, with later maxima of the grand average about 33 ms apart (data check). Cells recorded only
    with other light protocols (20 s or 60 s sweeps, light at other times) are left out.
  - The paper gives no threshold for an EPSP or IPSP (measured by hand in Clampfit); the criterion's readings, 2
    and 3 SD of the 5 s baseline of the average trace, are run, with 5 SD as a variant.
  - Rest sweeps include those with a negative holding current (Methods, cells held subthreshold with negative current).
