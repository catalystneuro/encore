- claim: fig7e-no-behavioural-change
  outcome: blocked
  blocked_by: data_missing
  notes: The imaging files hold CNMF-E traces and footprints, the raw one-photon movie and a link to the behaviour video.
    They hold no pose estimates, cup interaction or position series, no epochs for the habituation and test periods and
    no record of which cup held the juvenile; the SLEAP model is not published. The social-object ratio needs the mouse's
    side and which side held the juvenile. The dataset holds 12 ChrimsonR mice, as Figure 7E says, and C370 has no GH on
    session. One frame of each behaviour video (notebook, data check) shows the arena from above with the mouse and both
    cups; the cups are covered, so which held the juvenile cannot be seen, and nothing in the files records it. Side times
    could in principle be tracked from the videos; that was not attempted.
