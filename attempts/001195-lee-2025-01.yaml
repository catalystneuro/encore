- claim: fig6df-epsp-ipsp-at-rest
  outcome: reproduced
  notebook: reproduce_lee_2025.ipynb
  output: claim:fig6df-epsp-ipsp-at-rest
  measured:
  - 15
  - 38
  - 56
  notes: Under both readings every region has cells with an EPSP and cells with an IPSP. At 2 SD the BNST, CeA and BLP have
    15, 37 and 54 cells with an EPSP and 11, 30 and 49 with an IPSP; at 3 SD 13, 35 and 53, and 6, 14 and 38. The same test
    also passes in a light-free window of the same traces, so it does not by itself show evoked responses; the contrast
    does. At 3 SD 92.7% of cells have an EPSP and 53.2% an IPSP after the light against 79.8% and 30.3% without light; at
    5 SD 84.4% and 19.3% against 40.4% and 4.6%; 55 rest averages exceed 10 SD in the 200 ms after the light and 2 six seconds
    later. At 2 SD most cells are mix (73 to 84%), at 5 SD most are excitation only (62 to 74%). The dataset holds 15, 38
    and 56 ChR2 cells with usable 30 s rest sweeps where the paper reports 19, 36 and 48 (14, 35 and 48 from the mice labelled
    male), so the counts do not match and the claim is judged on the cells present, as the criterion says. 19 ChR2 cells
    have no such sweeps, and 2 (C51, C52) fire before the light in all of theirs.
  deviations:
  - The files do not record the light; the first pulse is taken 5.468 s into each 30 s light sweep, where the average responses
    start, with later maxima of the grand average about 33 ms apart (data check). Cells recorded only with other light protocols
    (20 s or 60 s sweeps, light at other times) are left out.
  - The paper gives no threshold for an EPSP or IPSP (measured by hand in Clampfit); the criterion's readings, 2 and 3 SD
    of the 5 s baseline of the average trace, are run, with 5 SD as a variant. Run in a light-free window of the same averages,
    12 s after the light, the rule finds an EPSP in 94, 80 and 40% of cells and an IPSP in 67, 30 and 5% at 2, 3 and 5 SD.
  - Rest sweeps with an action potential in the 5 s before the light are left out of the rest averages (148 of 2437 ChR2
    rest sweeps, in 28 cells), as the Methods hold cells at rest below threshold ('negative current was injected to hold
    the cell at a subthreshold potential', Ex vivo electrophysiology). 51 sweeps of P10 whose ch-1 is beyond +-10 nA and
    whose Vm is 0 mV are left out as failed; its other sweeps are kept.
  - 'The 17 ChR2 cells of subjects 23, C137 and C150, labelled female in the files, are kept although the Methods use male
    mice only: without them the dataset has 25 BLP cells with current steps, fewer than the 27 the paper clusters. Male
    mice only is run as a variant (notebook, last section).'
  - Rest sweeps include those with a negative holding current (Methods, cells held subthreshold with negative current).
