findings:
- kind: data_missing
  statement: The dandiset holds the ex vivo patch-clamp recordings (Figure 6, Figure 7 supplement 1) and the in vivo CeA
    imaging of Figure 7. The tracing (Figure 1), behavioural optogenetics (Figures 2 to 4 and 8) and RNAscope (Figure 5)
    data, 17 of the paper's 38 findings in the claims file, are not in it.
- kind: data_missing
  statement: The imaging files hold traces, footprints, the raw movie and a link to the behaviour video, but no pose estimates,
    cup interactions, position, habituation and test epochs, or record of which cup held the juvenile, which every in vivo
    finding needs. The SLEAP model is not published. None of the 8 in vivo findings can be tested.
- kind: selection_undocumented
  statement: The imaging files hold 869, 913 and 854 ROIs for the ChrimsonR mice in GH off, GH on and SI off, about twice
    the paper's 429, 441 and 484 cells, and 35, 138 and 89 for the TdTomato mice against 39, 61 and 76. Nothing marks which
    ROIs the paper kept (the Methods say non-neuronal objects were excluded by hand).
- kind: metadata_error
  statement: The imaging traces and movie are stated at 25 Hz. Their 19,211 frames last 768 s at 25 Hz, but the behaviour
    videos last 961 s (median); at the Methods' 20 frames/s the imaging lasts 961 s, within 4 s of the video in 40 of 41
    sessions (the video of C386, SI off, lasts 800 s). The data support 20 Hz.
- kind: metadata_error
  statement: Every imaging file describes another experiment. The virus field names a GRIN lens in the mPFC and Chrimson
    in the BLA, the stimulus field 589 nm light at 20 Hz for 5 min, and the experiment description 5 min habituation, 5
    min stimulation and 5 min without, where the Methods give a GRIN lens over the CeA, Chrimson in the DRN, 620 nm pulses
    (8 at 30 Hz every 1 s) and 5 min habituation then a 10 min test.
- kind: metadata_insufficient
  statement: The patch-clamp files do not record when the light was on; the stimulus series of the light sweeps are zeros,
    and the protocol is named only in free-text series descriptions (103 distinct ones). The light time had to be read from
    the responses, and protocols with other sweep lengths put the light at other times.
- kind: metadata_insufficient
  statement: No sweep or session is marked as recorded in TTX/4AP, so the recordings of Figure 6 supplement 1D-E cannot
    be identified.
- kind: metadata_error
  statement: In current clamp the injected current (ch-1) is stored with unit volts; its values (pA, following the holding
    current and the current steps) show it is current. The seal test, a voltage-clamp recording of current with a 5 mV square
    command, is stored as an IZeroClampSeries with units volts.
- kind: other
  statement: Two cells named with the BLP letter (P4x and P42 of subject C141) are labelled BNST in inferred_layer and targeted_layer;
    the 19 B-named files match the paper's 19 BNST cells. 51 light sweeps of one cell (P10 of subject in_vivo_9) hold a
    membrane potential of 0 mV and a ch-1 beyond +-10 nA, failed sweeps that are not marked. Subject ids are inconsistent
    ('4484' and '4484?', '235' and '235 cage', 'in_vivo_5' and 'in_vivo_5_2'), so whether these are the same animals is
    not stated; if they are, there are 17 subjects, not 20.
- kind: other
  statement: The dataset holds 15, 38 and 56 ChR2 cells with usable 30 s rest sweeps in the BNST, CeA and BLP, against the
    paper's 19, 36 and 48, and 3, 13 and 13 with firing sweeps, against 5, 20 and 17; 19 ChR2 cells were recorded only with
    other light protocols. 27 CeA and 28 BLP cells have all clustering features, against the paper's 26 and 27.
- kind: other
  statement: The files label three subjects female (23, C137 and C150; 17 ChR2 cells), where the paper says all experiments
    were in male mice. Without these cells the dataset has 25 BLP cells with current steps, fewer than the 27 the paper
    clusters, so either the sex in the files or the paper's statement is wrong for them.
- kind: metadata_error
  statement: 'The holding current named in the sweep descriptions disagrees with the measured ch-1 current in 88 ChR2 light
    sweeps: 77 rest sweeps in 13 cells carry more than +20 pA (B16, described as -100 pA, carries +106 pA) and 11 firing
    sweeps in 6 cells less than +5 pA (C29, described as +35 pA, carries -57 pA). 148 of 2437 rest sweeps, in 28 cells,
    fire before the light.'
- kind: methods_unavailable
  statement: For the paper's authors (fig6df, fig6j, fig6k). What decided that a cell had an EPSP or an IPSP at rest, and
    does Figure 6J include mix cells? A rule of 2 or 3 SD of the baseline of the average trace finds an IPSP in 67% or 30%
    of light-free windows, gives 90 or 58 cells for the IPSP test against the paper's 34, and makes the EPSP region effect
    depend on the reading.
- kind: methods_unavailable
  statement: The capacitance of the BLP clustering came from custom MATLAB Q-method code on a 5 mV, 250 ms step, which is
    not published and whose step is not in the files; it was estimated here from the seal-test pulses.
- kind: metadata_insufficient
  statement: The ChrimsonR sweeps described '+0.3mW blue light' and '+0.2mW blue light' begin with the description of the
    635 nm red protocol, and nothing says whether they carried red pulses as well as blue light. This attempt reads them
    as blue light alone (Figure 7 supplement 1E-F), from their small responses.
verifications:
- date: '2026-11-01'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The executed notebook of commit df588b35 (author-answers) with the conclusion cells and the summary
    removed, the helper module and the claims file, with the paper. The verifier also queried the archive's asset list and
    metadata and tested the helper functions on synthetic input. agrees compares its outcome with the outcome of the record
    it reviewed.
  results:
  - claim: fig6df-epsp-ipsp-at-rest
    agrees: true
    outcome: reproduced
    reason: 'At 2 and 3 SD, every region has a cell with an EPSP and some cells have an IPSP (cell 13). Cell counts are
      15/40/56 against the paper''s 19/36/48; the criterion says to judge on the cells present. The 2 and 3 SD tests also
      pass on pure noise (problem 1), so the support comes from the 5 SD variant and the clock check: 55 cells above 10
      SD at light onset, 2 at the shifted time. At 5 SD there are EPSPs in all regions, plus inhibition-only and mix cells.'
    response: 'Kept. The detection is now also run in a light-free window of the same traces, 12 s after the light: at 2,
      3 and 5 SD it finds an EPSP in 94, 80 and 40% of cells and an IPSP in 67, 30 and 5%, against 97, 93 and 84% and 83,
      53 and 19% after the light. The notes say the test passes in the light-free window too and that the support is this
      contrast. Rest sweeps that fire before the light and 51 failed sweeps of P10 are left out; the counts are now 15,
      38 and 56.'
  - claim: fig6gi-firing-responses
    agrees: true
    outcome: partially_reproduced
    reason: Under all four readings, CeA and BLP have both excited and inhibited cells, and every BNST cell with intervals
      is excited (cell 15). But that is only 2 BNST cells (B7 has no spikes), and the counts are 3/13/13 against 5/20/17
      at tolerance 0.
    response: No change of outcome. The notebook now prints both 'every BNST cell excited' and 'every BNST cell with an
      IEI excited', lists the cells without an IEI with their spike count and highest Vm (B7 -29 mV, C29 -59 mV, C47 -49
      mV, so a lower threshold would not give them spikes), and shows a variant set that adds the firing rest sweeps with
      a measured current above +10 pA (5, 17 and 17 cells).
  - claim: fig6j-epsp-amplitude-region
    agrees: false
    outcome: partially_reproduced
    reason: 'Reading (a) passes at 2 and 3 SD: at 2 SD H = 6.92, p = 0.031, Dunn CeA vs BLP p = 0.042, close to the paper''s
      6.790 / 0.0335 / 0.0378. Reading (b) fails at both (p = 0.76 and 0.55, cell 17). The criterion asks for "under the
      readings" and does not say what to do when they disagree.'
    response: Changed to partially reproduced, as the verifier gives, and the assumption of reading (a) dropped. With the
      rest averages now made of subthreshold sweeps only (problem 3) and P10's failed sweeps left out (problem 4), reading
      (a) is significant only at 3 SD and narrowly (p = 0.049; 2 SD p = 0.088), and reading (b) is not (p = 0.86 and 0.27).
      Both readings are significant at 5 SD (p = 0.016 and 0.037), and reading (a) at 2 and 3 SD with the mice labelled
      male only.
  - claim: fig6k-ipsp-amplitude-region
    agrees: true
    outcome: not_reproduced
    reason: The ANOVA fails at 2 SD (p = 0.69). At 3 SD it gives p = 0.026, but CeA vs BLP is not significant (Tukey p =
      0.16, Holm-Sidak p = 0.13). The IPSP counts are 85 and 51 against 34 +- 3.4. Reading (b) leaves 3-4 cells and cannot
      be tested (cell 19).
    response: Changed to partially reproduced, on an assumption. With subthreshold rest sweeps only and P10's failed sweeps
      left out, the 3 SD reading gives F(2,55) = 6.88, p = 0.0021, CeA against BLP Tukey p = 0.0031 and Holm-Sidak p = 0.0033,
      CeA deeper; 2 SD still fails (p = 0.76). The 3 SD reading is adopted because 2 SD finds an IPSP in 67% of light-free
      windows (30% at 3 SD). The cell count, 58 against 34 +- 3.4, does not match, so the claim holds only in part. 5 SD
      (21 cells) also gives a deeper CeA trough.
  - claim: fig6-s1de-monosynaptic
    agrees: true
    outcome: blocked
    reason: I agree. No sweep description names TTX or 4-AP (cell 6), and no asset's DANDI metadata mentions TTX, 4AP or
      tetrodotoxin (my API query). No part can be tested.
    response: No change of outcome. The data check now also searches the session descriptions, the stimulus types of the
      sequential recordings table and the electrode descriptions, and none names TTX, 4-AP or tetrodotoxin; general/ has
      no notes, protocol, slices or pharmacology field. The markdown that claimed more fields were searched is corrected
      (problem 8).
  - claim: fig6no-cea-clusters
    agrees: false
    outcome: not_reproduced
    reason: Under all 16 readings, the late-firing cluster (17-18 cells) has 2-3 inhibited cells and 3 with no response
      data. "Every late-firing cell excited" therefore fails. 5 of 9 regular-firing cells are inhibited. 27 cells against
      26 (cell 25).
    response: 'Kept as partially reproduced and the disagreement recorded. The criterion has two parts and no partial clause;
      the second holds (6 of 9 or 10 regular-firing cells inhibited) and the first mostly holds (11 to 13 of 17 or 18 late-firing
      cells excited, 2 or 3 inhibited), which the protocol''s definition (holds only in part) calls partially reproduced.
      A per-cell table of the late cluster now gives each label at 2, 3 and 5 SD, its source, area and peak: the inhibited
      cells are C20 (a mix with a negative area), C53 (from its IEI) and C41 at 2 SD. With 5 SD labels the late cluster
      has one inhibited cell but only 3 regular-firing cells are inhibited.'
  - claim: fig6-s1h-cea-cluster-properties
