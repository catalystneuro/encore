findings:
- kind: data_missing
  statement: The dandiset holds the ex vivo patch-clamp recordings (Figure 6, Figure 7 supplement 1) and the in
    vivo CeA imaging of Figure 7. The tracing (Figure 1), behavioural optogenetics (Figures 2 to 4 and 8) and RNAscope
    (Figure 5) data, 17 of the paper's 38 findings in the claims file, are not in it.
- kind: data_missing
  statement: The imaging files hold traces, footprints, the raw movie and a link to the behaviour video, but no
    pose estimates, cup interactions, position, habituation and test epochs, or record of which cup held the juvenile,
    which every in vivo finding needs. The SLEAP model is not published. None of the 8 in vivo findings can be tested.
- kind: selection_undocumented
  statement: The imaging files hold 869, 913 and 854 ROIs for the ChrimsonR mice in GH off, GH on and SI off, about
    twice the paper's 429, 441 and 484 cells, and 35, 138 and 89 for the TdTomato mice against 39, 61 and 76. Nothing
    marks which ROIs the paper kept (the Methods say non-neuronal objects were excluded by hand).
- kind: metadata_error
  statement: The imaging traces and movie are stated at 25 Hz. Their 19,211 frames last 768 s at 25 Hz, but the
    behaviour videos last 961 s (median); at the Methods' 20 frames/s the imaging lasts 961 s, within 4 s of the
    video in 40 of 41 sessions (the video of C386, SI off, lasts 800 s). The data support 20 Hz.
- kind: metadata_error
  statement: Every imaging file describes another experiment. The virus field names a GRIN lens in the mPFC and
    Chrimson in the BLA, the stimulus field 589 nm light at 20 Hz for 5 min, and the experiment description 5 min
    habituation, 5 min stimulation and 5 min without, where the Methods give a GRIN lens over the CeA, Chrimson
    in the DRN, 620 nm pulses (8 at 30 Hz every 1 s) and 5 min habituation then a 10 min test.
- kind: metadata_insufficient
  statement: The patch-clamp files do not record when the light was on; the stimulus series of the light sweeps
