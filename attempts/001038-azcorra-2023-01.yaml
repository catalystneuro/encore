findings:
- kind: metadata_error
  statement: The `coordinates` column of the fiber table is described as (AP, ML, DV) but holds
    (ML, AP, DV); the second value takes only the reference-slice AP positions and is negative in
    the tail of the striatum, and the paper's code builds the vector as [ML, AP, DV].
- kind: metadata_error
  statement: The column `cross_correlation_with_acceleration` is described as the cross-correlation
    between dF/F and acceleration but holds the peak cross-correlation of the 405 nm control with
    acceleration (the code's Acc405, used for exclusion), and is missing where running was under
    100 s.
- kind: metadata_insufficient
  statement: The dF/F series are normalized so that the largest transient is 1, which the files do
    not state (unit n.a., described as DF/F); the normalization factor is in the column
    `normalized_fluorescence`, which in 123 files holds two values per row.
- kind: selection_undocumented
  statement: The files carry the signal-to-noise ratio and 405 nm cross-correlation but not the
    other exclusion flags (running time, 405 nm artifacts) or which recordings each figure uses.
    Recomputed with the paper's code, the stimulus analyses give the paper's counts exactly, but
    the locomotion criteria select more striatal recordings than Figure 2 reports (Anxa1 82
    against 47, Vglut2 50 against 42).
- kind: data_missing
  statement: The Events table lists consumed rewards only; rewards the mouse did not lick for are
    only in the raw 4 kHz Reward trace. The code excludes 5 s after every reward, so 911
    acceleration and 767 deceleration onsets recomputed from the processed data are not in the
    stored WheelEvents.
- kind: metadata_error
  statement: Three subject ids (Anxa-I765L, Anxa-I767L, Calb-2246L) are recordings from the left
    hemisphere of mice that also have ids without the L, so the archive's 105 subjects are 102
    mice. The age is a range (P8W/P16W) in every file.
- kind: metadata_error
  statement: In the published version the related resource link to the paper is malformed
    (https://doi.org/https://doi.org/...), fixed in the draft; the asset summary lists
    measurementTechnique "analytical technique" and variableMeasured "ProcessingModule" only.
- kind: metadata_insufficient
  statement: 785 of 790 SNc fibers and 1281 of 2137 fibers overall have no coordinates.
- kind: code_mismatch
  statement: The Methods integrate responses from +0.05 to +0.55 s minus -0.5 to 0 s; the code
    integrates 0 to +0.5 s minus -0.55 to -0.05 s. The paper's reward means equal those of
    the code's windows to the decimal (Vglut2 7.90, Calb1 12.40, DAT 5.88), as do its Vglut2, Calb1
    and Anxa1 air puff means within tolerance; its DAT air puff mean (5.3) does not (2.46). The
    Methods' windows give about 10% more.
- kind: code_mismatch
  statement: The code reports the trough of the cross-correlation 0.02 s, and the peak of triggered
    averages 0.01 s, later than the times the Methods define, and prints uncorrected p-values for
    Figures 2i and 7f, whose legends state Bonferroni correction.
- kind: code_mismatch
  statement: The 405 nm artifact detection marks everything from the last noisy section to the end
    of a recording and from the start to the first, which the Methods do not describe.
- kind: paper_inconsistency
  statement: The Results give reward P = 2e-5 for Calb1 and 0.001 for Vglut2; the Figure 4g legend
    gives them the other way round. The Figure 2f legend gives 10 Anxa1 mice, the Methods 9.
    Extended Data Figure 9k gives striatal PCs explaining 52.4% and 25.2% of SNc variance, the
    Methods 53.2% and 24.3%.
