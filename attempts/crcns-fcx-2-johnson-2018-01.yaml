- claim: crossspectral-equal-strength
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_johnson_2018.ipynb
  output: claim:crossspectral-equal-strength
  notes: >-
    The claim is about the phase-directing pairs, and none can be selected with a defensible basis.
    The Methods' PSI, the claim's own selection rule, selects 0 MTL to PFC and 1 PFC to MTL pair
    (sliding windows) or none (single window), too few for the model, and 0% to 1% of units per
    system against the paper's 31% to 49%, so the paper's selection was not made by the procedure
    the Methods state as run here. The code's form selects 57% of pairs with trials shuffled,
    against the 2.5% its z > 1.96 threshold implies, so by the protocol's rule on chance levels its
    procedure is not the paper's stated one either. The label methods_underspecified is kept for
    this reason: which procedure selected the paper's units is not fixed by the paper or its code.
    On the 5 MTL-OFC pairs the Methods' PSI selects with sliding windows (3 MTL to OFC, 2 OFC to
    MTL, in s9 and s10; not judged) there is no frequency (p = 0.36), frequency x direction (p =
    0.44) or direction effect (Welch t test on pair means, p = 0.995); MTL-PFC has 1 pair and no
    model. On the
    code's selection (not judged; 105 MTL to PFC and 76 PFC to MTL, 189 MTL to OFC and 170 OFC to
    MTL pairs) frequency x direction is significant in both networks (p = 2e-05 and 0.00019),
    frequency in MTL-OFC (p = 2e-09) and direction in both (p = 0.020 and 0.0057). Which form of PSI
    selected the paper's pairs is asked of the authors under findings.
  deviations:
  - *timeaxis
