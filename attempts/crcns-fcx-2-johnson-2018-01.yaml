- claim: psi-theta-shift
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_johnson_2018.ipynb
  output: claim:psi-theta-shift
  measured:
  - 172
  - 302
  notes: >-
    With the PSI of the Methods (Nolte, trial-averaged cross-spectrum, frequencies of one signal
    shuffled for the null) and the code's single Hanning window, precue mean z is -0.14 (MTL-PFC)
    and -0.13 (MTL-OFC), with 6 against 3 frontal and MTL leads in MTL-PFC but 7 against 14 in
    MTL-OFC, and postcue does not exceed precue (p = 0.27 and 0.56 on z; 0.98 and 0.61 on raw PSI).
    With sliding 3-cycle windows part (1) holds in both networks and part (2) only for MTL-OFC on raw
    PSI (p = 0.027; MTL-PFC p = 0.079), which the criterion calls partial. With the code's own form
    of PSI (psianalysis.m, conjugate added) both parts hold in both networks (precue mean z -3.9 and
    -10.7, 98 against 53 and 196 against 76 leads; postcue minus precue p = 0.0003 and < 0.0001). The
    pair counts are 172 and 302 (expected 172 and 303). A question for the authors is recorded under
    findings.
  deviations:
  - >-
    Assumed, the single Hanning window over the 900 ms segment of psi_compute.m (FieldTrip mtmfft),
    with the Methods' PSI. The Methods' sliding 3-cycle windows cannot be placed inside a 900 ms
    segment at 3 Hz (a 1 s window); the sliding reading run here lets windows run into the zero
    padding. The code's own PSI is shown as a variant; it averages per-trial PSI and z-scores it
    against a null built from trial-averaged coherency, which is not the Methods' procedure.
  - >-
    The mixed model with random intercepts for subject and pair is computed as the within-pair F
    test of interval (equal for two intervals per pair), with all pairs after the 12 exclusions.
