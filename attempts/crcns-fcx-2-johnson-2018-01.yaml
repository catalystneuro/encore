- claim: erp-no-condition-difference
  outcome: not_reproduced
  notebook: reproduce_johnson_2018.ipynb
  output: claim:erp-no-condition-difference
  notes: >-
    With the code's subject-wide cluster null (all of a subject's electrodes in one test, as
    erp_compute.m runs it), 1 of 254 electrodes has a significant cluster (s5, postcue F test, p =
    0.034), and the criterion allows none. With a per-electrode null 13 electrodes do, fewer than the
    25.4 expected by chance over two tests. The effect is small and isolated, but the criterion is
    no electrode.
  deviations:
  - &timeaxis >-
    Windows follow the time axes of the derived data as the deposited code does (encoding [0, 1.5] s
    of encmain, postcue [0.3, 1.2] s of proc, baseline [0.65, 0.85] s of pre). The trial table and
