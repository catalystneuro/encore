- claim: behavior-no-difficulty-difference
  outcome: not_reproduced
  notebook: reproduce_johnson_2018.ipynb
  output: claim:behavior-no-difficulty-difference
  measured:
  - 0.900
  - 0.920
  - 0.890
  - 1744
  - 1237
  - 1292
  notes: >-
    The condition means are within the paper's SDs (accuracy over all trials 0.900, 0.920, 0.890;
    correct-trial response time from the trial tables 1744, 1237, 1292 ms; from summary_file.csv
    1659, 1335, 1475 ms, the paper's values). Accuracy (empirical logit, subject random intercept)
    shows no 3-level effect (p = 0.054 all trials, 0.37 kept trials), but spatial differs from
    identity over all trials (p = 0.023). Response time differs by condition under both readings of
    the criterion, with the trial tables (p < 0.001) and with summary_file.csv (spatial against
    identity p = 0.0018, 3-level p = 0.0076). Only with condition as one numeric term, which has the
    paper's single numerator degree of freedom, is the effect absent (summary_file.csv response time
    p = 0.12, z squared 2.41; accuracy p = 0.69), matching the paper's F(1,28) < 2.55, p > 0.12. That
    reading is not in the criterion, and a reader is asked about it (questions/crcns-fcx-2.yaml).
  deviations:
  - >-
    Accuracy enters the logit model as the empirical logit of each subject and condition, log((k +
    0.5) / (n - k + 0.5)), in a linear mixed model on 30 rows, as some subjects are at 100% in a
