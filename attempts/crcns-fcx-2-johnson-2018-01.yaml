  - 0.967
  notes: >-
    Over all 120 trials (reading a) accuracy runs from 0.792 (s5) to 0.967 (s2), every subject in
    0.711 to 1.0. Over the trials kept in the derived data (reading b) it runs from 0.792 to 1.000,
