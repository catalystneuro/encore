- claim: svc-hebbian-correlation
  outcome: reproduced
  notebook: reproduce_wakhloo_2026.ipynb
  output: claim:svc-hebbian-correlation
  notes: >-
    Only the PFC and CA1 part is tested. Over the 64 rat and session values the squared Pearson
    correlation between the theoretical Hebbian error and the linear SVC error is 0.926 in PFC and
    0.832 in CA1 (P below 1e-24), so readings (a) and (b) both hold in both areas. With the
    empirical Hebbian error (variant) it is 0.943 and 0.946. SVC errors run from 0.197 to 0.362
    (PFC) and 0.200 to 0.360 (CA1). The rest of the statement (MLPs, macaque, pose network) is not
    tested.
  deviations:
  - >-
    The SVC is fitted on 4 of the 500 subsets per session (every 125th), as one per task on all
    500 would take about 25 hours on one core; the theoretical error is the mean over all 500. On
    the same 4 subsets the theoretical error gives r2 = 0.931 (PFC) and 0.829 (CA1).
  - CA1 uses 24 units per subset (Methods); the paper's SVC figure used 19.
- claim: fig7d-behavioral-error-learning
  outcome: reproduced
  notebook: reproduce_wakhloo_2026.ipynb
  output: claim:fig7d-behavioral-error-learning
  notes: >-
