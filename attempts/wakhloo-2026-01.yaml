- claim: svc-hebbian-correlation
  outcome: reproduced
  notebook: reproduce_wakhloo_2026.ipynb
  output: claim:svc-hebbian-correlation
  notes: >-
    Only the PFC and CA1 part is tested. Over the 64 rat and session values the squared Pearson
    correlation between the theoretical Hebbian error and the linear SVC error is 0.926 in PFC and
    0.832 in CA1 (P below 1e-24), so readings (a) and (b) both hold in both areas. With the
    empirical Hebbian error (variant) it is 0.943 and 0.946. SVC errors run from 0.197 to 0.362
    (PFC) and 0.200 to 0.360 (CA1). The rest of the statement (MLPs, macaque, pose network) is not
    tested. The SVC is trained and tested on bins drawn at random from 500 ms bins that are
    correlated in time, as in the paper's code, so its errors are likely optimistic in absolute
    value; the criterion is a correlation over sessions.
  deviations:
  - >-
    The SVC is fitted on 4 of the 500 subsets per session (every 125th), as one per task on all
    500 would take about 25 hours on one core; the theoretical error is the mean over all 500. On
    the same 4 subsets the theoretical error gives r2 = 0.931 (PFC) and 0.829 (CA1).
  - CA1 uses 24 units per subset (Methods); the paper's SVC figure used 19.
- claim: fig7d-behavioral-error-learning
  outcome: reproduced
  notebook: reproduce_wakhloo_2026.ipynb
  output: claim:fig7d-behavioral-error-learning
  notes: >-
    Mean behavioural error over the 8 rats is 0.668 at session 1, 0.157 at session 4 and 0.180 at
    session 8; the drop from 1 to 4 (0.511) is larger than the change from 4 to 8 (0.023), and
    session 4 is lower than session 1 in 8 of 8 rats. The linear mixed model over sessions 1 to 4
    has a slope of -0.166 per session (P = 5.8e-18). The per-rat values equal those of the
    paper's results file (largest difference 1e-14).
- claim: fig7e-readout-error-learning
  outcome: reproduced
  notebook: reproduce_wakhloo_2026.ipynb
  output: claim:fig7e-readout-error-learning
  notes: >-
    Theoretical error (main reading), mean over rats, PFC 0.3626, 0.3167 and 0.3320 at sessions 1,
    4 and 8 (drop 0.0459, change after session 4 0.0153); CA1 0.3523, 0.3121 and 0.3241 (0.0401,
    0.0119). The criterion holds in both areas under both readings (empirical Hebbian error, PFC
    drop 0.0733 and change 0.0313) and with 19 CA1 units. Both areas rise again at session 8. The empirical Hebbian error is trained
    and tested on bins drawn at random from 500 ms bins that are correlated in time, as in the
    paper's code (utils.emp_error), so it is likely optimistic in absolute value; the criterion
    compares sessions, not absolute values.
  deviations:
  - The random subsets use this attempt's seeds; the per-session means agree with the paper's file
