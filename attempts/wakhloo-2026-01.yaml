- claim: glm-cross-validated-d2
  outcome: partially_reproduced
  notebook: reproduce_wakhloo_2026.ipynb
  output: claim:glm-cross-validated-d2
  measured:
  - 0.279
  - 0.245
  - 0.060
  - 0.1005
  notes: >-
    Under the first reading (each unit's own best score, ddof 0) the mean population D2 is 0.279 in
    PFC and 0.245 in CA1, both within tolerance, and the standard deviation over rats of the
    session-averaged D2 is 0.1005 in CA1 (ddof 1 0.1075), within tolerance. In PFC it is 0.0599
    (ddof 0) or 0.0640 (ddof 1) against 0.022 +- 0.0022, and no reading brings it within tolerance
    (0.057 to 0.066); the per-rat PFC means run from 0.161 (KL8) to 0.336 (ZT2). Counting units
    replaced by the null model as 0 gives PFC 0.301 and CA1 0.277 (outside). One PFC unit (JS21,
    one session) has no valid score, so that session's mean is nan as in the code and the mean
    over sessions skips it; the nan-mean over units gives 0.281. The chosen penalty is at an end of
    the grid for 1202 of 2327 PFC and 1750 of 3357 CA1 units. Three of the four values match, so
    the claim holds in part. The paper's own GLM fits (results/glm_results), matched to this
    attempt's rats by their unit counts, which agree in all 64 sessions of both areas, give the
    same session D2 (largest difference 2.7e-10 in PFC and 1.8e-09 in CA1 in the final run, 9.3e-11
    and 2.3e-09 in the run the verifier read) and the same spread over rats, 0.0599 and 0.0640
    in PFC and 0.1005 and 0.1075 in CA1, so the PFC gap to 0.022 is not a difference of fitting.
    The s.e.m. over rats, not a reading of the criterion, is 0.0226 in PFC (near 0.022) and 0.0380
    in CA1 (against 0.1), so no single reading gives all four reported values. The task-relevant
    dimension from the paper's predictions agrees with this attempt's (r = 0.9996 PFC, 0.9997
    CA1). How the paper computed the spread of 0.022 is a question for its authors (findings).
  deviations:
  - The GLM basis is the code's chosen one; its grid search was not repeated (see
    fig7h-task-dimension-increases). The cross-validation folds are scikit-learn's unshuffled
    KFold, as GridSearchCV uses for a regressor, so they are fixed, not random as the criterion
    supposes.
findings:
- kind: metadata_insufficient
  statement: >-
    Rat ZT2 is split over two files that both carry session_id "01" and the same subject, with
    different units (233 and 240). Nothing in the files or the dandiset says that they are two
    parts of one day, or their order; the paper's code supplies it. Their time ranges (206 to 14664
    s and 14760 to 30586 s) are consistent with that order, and no spike train or position trace
    is repeated between them or across any files.
- kind: other
  about: data
  statement: >-
    Position is sampled at 27.0 frames per second (ER1) and 32.3 to 33.1 in the other files, where
    the paper states 30 fps; sessions last 13.0 to 20.0 minutes (median 15.85; 36 of the 64 between 15.0 and 16.0), where the paper
    states about 20. JS15's timestamps run from 3605 to 90718 s, about 24 hours, in a dataset
    described as one day.
- kind: code_mismatch
  statement: >-
    The Methods give a standard deviation across rats of the session-averaged population D2 of
    0.022 in PFC, and the paper's code does not compute it. The paper's own GLM fits
    (results/glm_results at commit 9674a6c) give 0.0599 (ddof 0) or 0.0640 (ddof 1), with per-rat
    PFC means from 0.161 to 0.336, and this attempt's fits give the same; the CA1 value (0.1) is
    matched by both. The s.e.m. over rats is 0.0226 in PFC but 0.0380 in CA1. Question for the
    authors - how was the 0.022 computed, and over which units and sessions?
- kind: code_mismatch
  statement: >-
    The Methods use 19 PFC and 24 CA1 units per subset; the paper's code
    (run-pfc-hp-analysis-rats.py) and its results files use 19 in both areas, with the 24 commented
    out. The fewest units kept in a session are 19 (PFC) and 24 (CA1), so either is possible. The
    choice moves the CA1 SSF slope across the 1e-3 bound (P = 0.00106 with 24, 0.00065 with 19).
- kind: paper_inconsistency
  statement: >-
    The Results give R2 = 0.48 for CA1 behaviour against readout error and the Fig. 7 legend 0.49;
    the code prints 0.477.
- kind: code_mismatch
  statement: >-
    The SVC comparison notebook (figures/SM-svm-comparison-fig.ipynb) loads an older results file
    (abstraction/results/<area>_results_nu_dt_0.5.npy) that is not in the repository, so the
    Supplementary Fig. 3 rat panels cannot be traced to the published results files.
