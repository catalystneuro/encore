findings:
- kind: data_missing
  statement: The experiment 3 files hold no lick times, trial boundaries or Go and No-go labels, so the
    behavior of Figure 8b cannot be tested and epochs within 200 ms of a lick, which the Methods exclude,
    cannot be identified. They also hold no deflection times and no per-unit recording depth (only the
    electrode tip depth).
- kind: metadata_insufficient
  statement: The experiment 3 epochs have no deflection times, and the data descriptor does not say how
    DeltaT is signed or where epoch time 0 lies. The CW response latencies show that DeltaT is the time
    of the second listed whisker minus that of the first and that time 0 is the earlier deflection (the
    CW-driven peak is at 30 ms when the CW leads and at 70 ms when the SW leads by 40 ms).
- kind: other
  about: data
  statement: About a third of the experiment 3 spike times (26 to 35% per file) lie after the roughly
    300 ms stimulus epoch, up to 425 s after its start, in 5.6% of unit-epochs; the data descriptor does
    not mention them. The response window (0 to 125 ms) is unaffected.
- kind: metadata_insufficient
  statement: The experiment 1 files hold each single whisker deflected in both directions (18 single-whisker
    stimuli), where the paper describes 9 single-whisker deflections; which direction the paper used is
    not stated. The caudal deflections reproduce the paper's unit counts. In both 20170510 recordings
    about half the trials of each pair that involves whisker 3 or 8 have that whisker deflected rostrally
    and the other caudally (about 5,300 trials per recording), and the pair 3-8 has only such trials;
    neither the paper, whose 261 stimuli hold no opposite-direction pairs, nor the descriptor mentions
    them.
- kind: other
  about: data
  statement: Nine of the 16 experiment 2 recordings hold 16,000 to 24,000 three-whisker trials (whiskers
    2, 5 and 8, or 4, 5 and 6), which neither the paper nor the data descriptor mentions.
- kind: metadata_error
  statement: Two experiment 2 units in 20160909 (recNames chn3 and chn4, depths 250 and 150 um) have identical
    spike trains, a duplicated unit. In 20160803 and 20160909 some units carry the recName of another
    recording than the one whose trial sequence they hold.
- kind: other
  about: data
  statement: Two experiment 2 recordings (20160225 and 20160316, 10 units) have no sham trials, which
    the Methods use for responsiveness and spontaneous rates. CW-SW dt takes 101 values, -50 to +50 ms,
    where the paper gives 100.
- kind: methods_unavailable
  statement: Question for the authors. The dt smoothing classifies 23% of curves as best fit unsmoothed;
    here the unsmoothed 1 ms curve never beats a smoothed one in held-out Poisson likelihood, and the
    share of curves whose likelihood rises to the largest kernel (57%) depends on how the kernel meets
    the +-50 ms edges (1% with zero padding). How were held-out dt values without training trials, zero
    rates and the edges handled?
- kind: methods_unavailable
  statement: Question for the authors. A unit whose best-combination dt curve is set constant across dt
    has no best dt, yet Figures 7a, 7b and 7f align or split units by it. Were such units left out (121
    + 56 = 177 of 187 suggests so), or how was their best dt chosen? This attempt leaves them out of the
    alignment of Figure 7a.
- kind: methods_unavailable
  statement: Question for the authors. Which deflection direction were the nine single-whisker stimuli
    of experiment 1, and how were the rostral deflections in the files used? This attempt takes the caudal
    ones.
- kind: methods_unavailable
  statement: The shuffle test of combination selectivity finds 69% of response sets selective here against
    the paper's 41%. On a real-data null with no combination tuning the test as described gives p < 0.05
    for 25% of sets, as the kernels that smooth the shuffles are chosen on the measured data. The Methods
    do not say how a curve set constant across dt is treated in the shuffles or how the Mahalanobis covariance
    of nearly collinear smoothed traces is inverted, and the analysis code is available only on request.
