  - Assumption. The experiment 1 files hold each single whisker deflected in both directions (18 single-whisker
    stimuli), where the paper describes 9 single-whisker deflections. The caudal deflections are taken
    as the paper's nine, as experiment 3, whose stimuli the Methods call identical to experiment 1 apart
    from amplitude and dt (Methods, Recordings in awake behaving mice), used caudal deflections only,
