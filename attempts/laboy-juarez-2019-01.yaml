  - 0.601
  notes: Spontaneous rates match (1.33 +- 0.14 Hz CW-tuned, 2.05 +- 0.43 Hz SW-tuned under sham reading
    a; 1.27 and 2.01 under b). Maximal evoked firing in spikes per stimulus, the claims file's unit, does
    not; the best single-whisker response is 0.58 and 0.60 and the best response over all 261 stimuli
    0.86 and 0.91, against 4.8 and 4.56. The groups do not differ in maximal firing (t-test p = 0.84 and
    0.65); spontaneous p = 0.067 (a) and 0.042 (b). Read as a rate in Hz over the 125 ms window, the best
    single-whisker response is 4.64 +- 0.42 and 4.80 +- 0.72 Hz, within both tolerances; whether the expected
    values are in Hz is asked in questions/laboy-juarez-2019.yaml, and the outcome is decided on the claims
    file's unit.
