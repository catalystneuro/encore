    variant.
  - Sequence responses use same-direction trials (all caudal-caudal here), as the Methods list experiment
    1's stimuli as 9 single-whisker deflections and 252 two-whisker sequences (Methods, Whisker stimulation)
    and call the experiment 3 stimuli identical to experiment 1 with "Only same-direction (correlated)
    stimuli" (Methods, Recordings in awake behaving mice). In the two 20170510 recordings about half the
    trials of each pair involving whisker 3 or 8 have opposite directions, and the pair 3-8 has only opposite-direction
    trials, so their 38 units have 35 combinations; pooling the opposite-direction trials in is shown
