- claim: methods-dt-modulation
  outcome: not_reproduced
  notebook: reproduce_laboy_juarez_2019.ipynb
  output: claim:methods-dt-modulation
  measured:
  - 0.574
  - 0.0
  - 2127
  notes: Of 3,704 CW-SW curves of the responsive sets, under reading (a) 0.574 have a likelihood largest
    at the largest kernel, none is best unsmoothed, and 2,127 (0.574) are set constant; the total is within
    tolerance of 2,004 but the fractions are far from 0.33 and 0.23. The unsmoothed likelihood is below
    the best smoothed one for every curve (by 102 at the least, median 10,667), the likelihood never peaks
    at the smallest SD, and 0.471 of curves rise at every SD step. Two other ways of scoring held-out
    trials at a dt without training trials, left out of every likelihood (c) or of the unsmoothed one
    only (d), give 0.574 and no unsmoothed curve. Under reading (b), zero padding, 39 curves (0.011) are
    set constant. All 3,936 curves give 0.583 under reading (a).
  deviations:
  - Zero rates in the held-out likelihood are floored at 1e-3 spikes (a standard choice; the paper does
    not say).
  - The 3,704 curves are those of this attempt's 463 responsive sets, against the paper's 3,608.
  - 'Two other ways of scoring held-out trials at a dt without training trials, which the Methods do not
    settle, are run on the same folds as variants: left out of every likelihood, and left out of the unsmoothed
    likelihood only.'
- claim: exp2-combination-selective-prevalence
  outcome: not_reproduced
  notebook: reproduce_laboy_juarez_2019.ipynb
  output: claim:exp2-combination-selective-prevalence
  measured:
  - 189
  - 0.768
  - 0.641
  - 0.733
  - 318
  - 145
  notes: 318 of 463 responsive sets are selective with FDR over all sets (312 with the two sets apart),
    in 189 of 246 cells (0.768), against 187 sets and 129 cells (0.52). Fractions are 0.641 and 0.733
    of responsive correlated and anti-correlated sets, or 0.602 and 0.691 of all cells, against 0.35 and
    0.46. 340 sets have uncorrected p < 0.05. The paper states no false-positive rate for the test. On
    a real-data null (counts permuted across combinations within each dt, kernels chosen again, 1000 shuffles)
    the test gives p < 0.05 for 0.246 of sets and p < 0.01 for 0.076, so it is anti-conservative here,
    though FDR control selects none of the null sets; measured p below 0.001 for 147 sets against 6 in
    the null. Calibrated on the null, the measured p-values give 162 selective sets after FDR. The 187
    sets with the smallest p lie in 130 cells (74 correlated, 113 anti-correlated); their count is fixed
    at the paper's.
  deviations:
  - A shuffled curve of a combination whose measured curve was set constant across dt is set to its own
    mean over dt (the Methods say each shuffled curve is smoothed with its measured kernel; a constant
    curve has none).
  - The Mahalanobis distance uses the pseudo-inverse of the shuffle covariance (smoothed CSI traces are
    nearly collinear across dt).
  - One of two experiment 2 units with identical spike trains (20160909) is dropped, so experiment 2 has
    246 cells and 463 responsive sets under the main readings (O2 a, sham a).
  - The calibration on a real-data null uses 1000 shuffles per set, against 5000 for the measured test,
    to keep the run short; it is a check, not part of the paper's method.
- claim: fig2f-shuffle-abolishes-tuning
  outcome: reproduced
  notebook: reproduce_laboy_juarez_2019.ipynb
  output: claim:fig2f-shuffle-abolishes-tuning
  notes: Mean peak-aligned tuning of the 318 selective sets has a CSI of 0.033; one shuffle per set gives
    CSI 0.000 aligned to the measured best and 0.003 aligned to its own peak; the shuffled first point
    exceeds the other seven by 0.011, within its s.e.m. (0.027). On the 187 sets with the smallest p the
    same holds (CSI 0.039 against 0.000; 0.020 within 0.037).
  deviations:
  - The selective sets are those this attempt's shuffle test finds (318 of 463 responsive sets, against
    the paper's 187 of 451); see exp2-combination-selective-prevalence. The claim is also run on the 187
    sets with the smallest shuffle p (notebook, variant section).
  - Main readings O2 (a) and O3 (a); the other combinations are shown in the notebook.
  - Assumption. A set whose best-combination curve is set constant across dt (90 of 463 responsive sets,
    70 of the 318 selective) has no best dt, the maximum of the cwSTRF falling on the first tied dt (-50
    ms). Its eight responses are taken over all dt (O3 a, the mean of each smoothed curve over dt; O3
    b, the mean count over each combination's trials) and its decoders use all its trials, as a flat best
    curve makes every dt equally the best.
