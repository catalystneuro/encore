  notes: 160 units in 8 recordings from 5 mice; 144 responsive under sham reading (a), 36 in L2/3, 48
    in L4, 46 in L5 and 14 in L6, all within tolerance. Sham reading (b) gives 147 (36, 50, 47, 14). With
