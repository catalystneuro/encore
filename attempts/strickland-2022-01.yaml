outcomes:
- claim: source-data-cluster-link
  outcome: reproduced
  notebook: reproduce_strickland_2022.ipynb
  output: claim:source-data-cluster-link
  measured:
  - 1812
  - 1812
  notes: Under the normalization of the paper's cubeScript.m (the data set's cube), every one of the
    1812 cue rows and 1812 outcome rows of the Source Data cluster sheets equals exactly one unit's
    row (largest difference 5e-15), so 100% match and every unit gets one cue and one outcome
    cluster, with the sizes the claims file lists. Under the claims file's four readings (n-a, n-b,
    w-a, w-b, computed from the spike times in 250-ms bins) at most 2 rows match within 0.01, though
    1664 cue rows and 650 to 1728 outcome rows correlate above 0.99 with a unit.
  deviations:
  - The rows that match are normalized as cubeScript.m does (firing in 1-s and 500-ms bins over the
    40 s from 10 s before cue onset, minus the trial's 2-s pre-cue rate rounded down, z-scored over
    all trials and bins at each bin size), a detail the Supplementary Methods describe differently
    (250-ms bins averaged, other windows) and the paper's code settles. The claims file's four
    readings are shown and none matches.
- claim: fig1c-suppression-order
  outcome: reproduced
  notebook: reproduce_strickland_2022.ipynb
  output: claim:fig1c-suppression-order
  measured:
  - 147.92
  - 0.914
