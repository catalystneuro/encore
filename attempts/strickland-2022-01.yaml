findings:
- kind: format_error
  statement: 204 of the 1812 unit files hold repeated spike times (9289 repeats in all). The paper's
    cubeScript.m counts spikes with intersect(), which keeps each time once, so the cube's counts
    leave the repeats out.
- kind: metadata_insufficient
  statement: The data set holds no cluster membership. The paper's k-means clusters come from
    MATLAB's kmeans after rng(1), relabelled by hand-written maps in cueAnalysis.m and
    outcomeAnalysis.m, so they cannot be regenerated outside MATLAB; they can be recovered only
    from the paper's Source Data workbook, whose cluster sheets every unit matches exactly.
- kind: metadata_insufficient
  statement: The cube's anatomy.region holds region names as MATLAB string objects, which cannot be
    read outside MATLAB. The region numbers need the list in cubeScript.m, and the analysis scripts
    renumber 35 units from region 21 (CIC) to DpWh, saying the cube assigned them in error, and merge
    regions 11 and 24 into x/scp. The units of anatomy.x, y and z are not stated.
- kind: other
  about: data
  statement: In session js10030220, 19 unit files share one set of event times, while 2 others
    (spk0009, spk0044) and 1 more (spk0049) carry cue and poke times that differ from them by an
    amount growing over the session to about 0.28 and 0.30 s. The cube uses each file's own times.
- kind: other
  about: data
  statement: Session js27101920 has 5 shock times; no shock is recorded on its first danger trial
    (row 1). All other 72 sessions have 6 shocks, 12.0 s after cue onset on rows 1 to 6.
- kind: paper_inconsistency
  statement: Supplementary Table 1 lists 75 recording sessions (8 for subject 5 and 10 for subject
    10); the Results and the data set have 73 (7 and 9).
- kind: methods_unavailable
  statement: The Source Data danger latencies (Fig. 2d) do not follow the Supplementary Methods'
    search within the 10-s cue; many equal change points found from 2 s before cue onset, and 1498 of
    1812 units have one, by a rule not stated. Which window was searched, how the 1-ms firing was
    built, and which units were left out? With the stated method the latency does not correlate with
    PC1 contribution (R2 = 0.067).
- kind: paper_inconsistency
  statement: For the cue hubs (Fig. 2f) the Supplementary Methods correlate danger firing over 14
    intervals, but the Source Data per-unit values are squared correlations of the full 42-value cue
    rows (all three cues). Was r or r squared averaged, and over which cues? With danger firing the
    k1 hub does not exceed k3 or k4.
- kind: methods_unavailable
  statement: The Methods call the cluster correlations "Pearson's correlation coefficient (R2)" and
    the scripts plot r squared. Is the network separation of Fig. 2e and 4d judged on r squared?
    With r, k3 and k6 are anticorrelated with their fellow clusters and the outcome networks do not
    separate.
- kind: paper_inconsistency
  statement: The Supplementary Methods lay out the outcome beta matrix with shock in intervals 1 to 20
    and prediction error in 21 to 40, as a 21-cluster matrix; outcomeRegression.m and Source Data
    Fig. 5b to 5d hold prediction error first, for 11 clusters.
- kind: code_mismatch
  statement: Source Data Fig. 4f right labels 171 units as k7 and 111 as k8, as outcomeAnalysis.m
    hard-codes them, where the Figure 4b sheets and the clustering have 111 units in k7 and 171 in k8.
- kind: code_mismatch
  statement: The normalization in cubeScript.m (1-s, 500-ms and 250-ms bins z-scored separately over
    the 40 s from 10 s before cue onset, baseline rounded down) differs from the Supplementary Methods
    (250-ms bins from 20 s before to 20 s after the cue, averaged into larger intervals); only the
    script's normalization reproduces the paper's values. The lesion scripts shuffle firing of k1 to
    k9, k1 to k3 and k6 to k9 before regression, where the Methods shuffle the betas of clusters 1 to
    8.
- kind: other
  about: paper
  statement: Source Data Fig. 2c inset and Fig. 4c hold the units' rows with a pre-cue baseline
    subtracted (the heat-plot data), not the matrices whose PCA gives the reported 29.7% and 17.7%;
    PCA of those sheets gives 47.1% and 24.2%.
