- claim: fig2d-danger-latency
  outcome: not_reproduced
  notebook: reproduce_strickland_2022.ipynb
  output: claim:fig2d-danger-latency
  measured: 0.067
  notes: With the latency found within the 10-s cue as the Supplementary Methods say, the correlation
    across clusters is negative but weak and not significant (l-a r = -0.260, R2 = 0.067, p = 0.26;
    l-b R2 = 0.065, p = 0.26; with cluster totals, c-b, R2 = 0.122 and 0.104). Units of k1 to k9 do
    have shorter latencies than k10 to k21 (3571 against 4590 ms, l-a). 1778 units have a latency;
    Source Data lists 1498. The latencies differ from the paper's (k1 mean 4046 ms here, 182 ms in
    Source Data). A search from 2 s before onset keeping latencies after onset (a variant outside the
    criterion) gives 1458 units, k1 327 ms, and R2 = 0.640 (c-a, p = 1.4e-05), but it does not
    reproduce the Source Data latencies either; 413 of its values equal a Source Data value of the
    same cluster, against 513 for l-a. None of the paper's scripts computes the latency
    (findchangepts appears in none of them). On the Source Data latencies R2 is 0.508 (c-a) and
    0.394 (c-b). The question of the window and of which units have no latency is for the paper's
    authors (findings).
  deviations:
  - Baseline subtraction and z-scoring are affine maps of the summed 1-ms spike counts, which leave a
    change point in mean unchanged, so l-a is computed on the summed spike counts of the four danger
    trials. findchangepts is implemented as one change in mean minimizing the residual sum of squares.
