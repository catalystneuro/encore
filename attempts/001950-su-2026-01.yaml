  outcome: reproduced
  notebook: reproduce_su_2026.ipynb
  output: claim:fig5a-engagement-reward-history
  notes: Lag-1 reward coefficient across 40 mice 1.633, 95% CI 1.427 to 1.838 (5 lags), positive in 40
    of 40; with 1 lag 2.384 (2.100 to 2.669), with 10 lags 1.595 (1.385 to 1.805). One mouse (758018)
