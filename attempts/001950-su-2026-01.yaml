- claim: fig4c-choice-history
  outcome: reproduced
  notebook: reproduce_su_2026.ipynb
  output: claim:fig4c-choice-history
  measured:
  - 0.601
  - 0.895
  - 4.327
  notes: Pooled over 39 to 41 mice and 149,081 to 152,905 choices, McFadden R2 = 0.600 to 0.601 and 0.895
    of choices predicted under 5, 10 and 15 lags and both models (squared correlation 0.68). Rewarded
    coefficients decay over lags; all are positive in the R + N model, and in the code's R + C model lags
    1 to 4 are positive and lag 5 is -0.025. The exponential fit's amplitude is 4.33 and 4.28 for R +
    N pooled over 10 and 15 lags (within 3.95 +- 0.395), 4.55 with 5 lags, 2.7 to 2.9 for R + C; its decay
    constant is 1.2 to 2.3 lags in every fit, so the paper's coefficient matches the amplitude. Per-mouse
    fits give R2 0.66 to 0.67 and 0.92 predicted.
  deviations:
  - The rewarded, unrewarded and choice histories the criterion lists are collinear (R + N = C); the code's
    Figure 4c model (R + C, choice_reward_choice in F_behavior_w_FP.ipynb) and the Methods' R + N are
    fitted. The measured values are from R + N pooled over 10 lags, the reading that matches all three
    numbers.
  - The exponential fit follows _fit_exp_offset of F_behavior_w_FP.ipynb (A exp(-lag/tau) + C, weighted
    by the SEs).
