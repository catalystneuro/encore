- claim: fig6c-choice-change-rpe
  outcome: reproduced
  notebook: reproduce_su_2026.ipynb
  output: claim:fig6c-choice-change-rpe
  measured: 0.833
  assumed: true
  notes: Reading (a), 8 equal-width RPE bins per session averaged over sessions, rho = 0.833 over all 382
    sessions and over the 136 photometry sessions (within 0.84 +- 0.084); 9 bins give 0.917 and 0.867. Reading
    (b), pooled trials, rho = 0.552 and 0.581. The match is under reading (a) only and rests on the binning,
    as the criterion anticipated, and on the refitted model. Reading (a) gives the same rho (0.833 with 8
    bins, 0.867 or 0.917 with 9) on the 261 sessions passing the refitted aN and bias criteria, with the partially
    pooled Q variables over all sessions, and on the 293 sessions passing its criteria.
  deviations:
  - The Q-learning variables come from a per-session maximum-likelihood fit of stan_qLearning_5params (aind_stan_fit_sim
    at 89371ee), the paper's model with the same update and choice rule; the paper fits it hierarchically
    in Stan and averages the variables over posterior draws (Methods, Behavioral model fitting; Extracting
    model parameters and variables). Assumed as the standard non-hierarchical estimate of the same model;
    the hierarchical fit was not run. Simulated with 40 sessions' fitted parameters, the refit recovers the
    per-trial RPE and chosen value at a median r of 0.995 and 0.991; a partially pooled refit within each
    mouse (lcne.fit_q_mouse), an empirical-Bayes approximation of the hierarchical model, is shown as a variant.
  - L(c(t+1) = c(t)) is taken from the pooled R + C choice regression with 5 lags (the code's Figure 4c model)
    and L(c(t)) from the Q-learning model (Methods, Analyses and models of behavior), centred per session.
