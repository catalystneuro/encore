- claim: figs12-trials-per-session
  outcome: reproduced
  notebook: reproduce_su_2026.ipynb
  output: claim:figs12-trials-per-session
  measured:
  - 334.3
  - 94
  - 558
  notes: Re-run after a reader's answer (questions/001950.yaml), which amended the criterion. A trial is now
    a go cue with a choice, counted as the code counts session_len for Figure S12a (makeSessionDF with cut_interruptions=True,
    the longest stretch of choice trials without manual or extra water), and the session sets are (a) the
    sessions passing beh_only.json, (b) the sessions of the recorded neurons and (c) all sessions. Under reading
    (b) the 112 sessions of the selected units average 334.3 trials with a range of 94 to 558, the paper's
    range exactly and the mean within 342 +- 34.2. Reading (a), with the three computable criteria, gives
    372 sessions averaging 393.0 (52 to 851), and reading (c) 383 sessions averaging 389.8 (4 to 851), both
    outside; so do the variants of (a) with the refitted model's aN and bias criteria (261 sessions, 39 mice,
    387.1, 74 to 804; the code has 259 sessions and 32 mice) and with the 90-trial bound on the cut count
    (368 sessions, 396.4, 94 to 851). For reading (b) the count without the cut gives 360.6 (128 to 558) and
    all go cues 380.3 (176 to 586). Before the answer the claim was not reproduced, with a trial counted as
    a go cue, and under that count no reading had its mean within tolerance (reading (b), then called (a),
    380.3). The table's auto_manual_trial and extra_reward columns agree in every row with their recomputation
    from the reward deliveries, as get_session_tbl derives them. The version of record gives the range as
    94 to 800 (Extended Data Fig. 9); the claims file follows the preprint's 94 to 558, which reading (b)
    matches.
  deviations:
  - The session set of reading (b) is this attempt's 112 sessions, not the code's 106 (see the unit selection);
    reading (a) applies the three computable criteria of beh_only.json (session_len, p_sw_L, diff_1), with
    the model-based aN and bias shown as a variant from the per-session refit.
  - With a model name, makeSessionDF first trims each session to the model's session_cut from the code's session
    curation table, which is not in the dandiset; no such trim is applied here.
  - The code keeps rows with animal_response != 2 over the whole trial table; no-go cues are left out here
    as the criterion says. No no-go cue in the dandiset has a response, so the counts are the same.
- claim: iti-mean
  outcome: partially_reproduced
  notebook: reproduce_su_2026.ipynb
  output: claim:iti-mean
  measured: 4.427
  notes: Under the four readings (trial end fixed at 3.0 s for photometry and 3.1 s otherwise, or the table's
    stop_time; no-go cues ending an interval or not) the mean is 4.43 to 4.96 s, within 4.83 +- 0.483. The
    range is not within 0.99 to 22 s under any reading; the maximum is 292 s (pauses in a session), 0.72%
    of intervals exceed 20 s, the shortest is 0.22 s (behavior-only sessions), and the 1st to 99th percentiles
    are 1.10 to 16.1 s. The trial table's ITI_duration column is not the paper's interval (0.5 s in every
    photometry trial, mean 1.37 s, 0.5 to 15 s). Measured between consecutive cue onsets, as the Methods define
    the interval, the mean is 7.48 s (3.32 to 295 s), outside the tolerance; whether the criterion should
    use that definition is asked of a reader (questions/001950.yaml).
  deviations:
  - Which trial end applies to the Neuropixels and behavior-only sessions is not stated; 3.1 s (the electrophysiology
    value) was used for them and the table's stop_time is shown as the other reading.
- claim: fig4c-choice-history
  outcome: reproduced
  notebook: reproduce_su_2026.ipynb
  output: claim:fig4c-choice-history
  measured:
  - 0.601
  - 0.895
  - 1.391
  notes: 'Pooled over 39 to 41 mice and 149,081 to 152,905 choices, McFadden R2 = 0.600 to 0.601 and 0.895
    of choices predicted under 5, 10 and 15 lags and both models (squared correlation 0.68). Rewarded coefficients
    decay over lags; all are positive in the R + N model, and in the code''s R + C model lags 1 to 4 are positive
    and lag 5 is -0.025. Per-mouse fits give R2 0.66 to 0.67 and 0.92 predicted. The criterion does not test
    the exponential fit coefficient, so it does not decide the outcome. Read as the claims file reads it,
    the decay constant in trials, it does not hold: tau = 1.391 for R + N pooled over 10 lags (the measured
    value) and 1.23 to 2.28 in every fit, against 3.95 +- 0.395. The amplitude of the same fit is 4.33 (4.28
    over 15 lags, 4.55 over 5), within tolerance; R + C gives 2.7 to 2.9. Whether the legend''s coefficient
    is the amplitude is asked of a reader (questions/001950.yaml).'
  deviations:
  - The rewarded, unrewarded and choice histories the criterion lists are collinear (R + N = C); the code's
    Figure 4c model (R + C, choice_reward_choice in F_behavior_w_FP.ipynb) and the Methods' R + N are fitted.
    The measured values are from R + N pooled over 10 lags, the reading that matches all three numbers.
  - The exponential fit follows _fit_exp_offset of F_behavior_w_FP.ipynb (A exp(-lag/tau) + C, weighted by
    the SEs).
