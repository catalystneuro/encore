findings:
- kind: data_missing
  statement: The published version 0.260928.2230 does not mark which units are the paper's LC-NE neurons or
    which are cortex-projecting, and holds no per-unit stable recording windows; the Neuropixels files hold
    all 14,126 sorted units. The draft (modified 2026-10-06) adds opto_NE_paper, antidromic_tier_1, antidromic_tier_2,
    antidromic_jitter, antidromic_latency, p_antidromic, p_collision, ephys_cut_start, ephys_cut_end and firing_rate_stability
    to the units tables; publishing it would make the selection and the cortex-projecting claims testable.
- kind: selection_undocumented
  statement: Reconstructing the selection from the code's criteria files gives 252 units from 21 mice and
    112 sessions, against 241 units and 19 mice; the code's model-based session criteria (aN, bias), its drift
    cuts and its 0.2 ISI bound for cortex-projecting units need data the published version lacks. The draft's
    opto_NE_paper marks 267 units and agrees with this selection under the same criteria on 223.
- kind: data_missing
  statement: The per-trial spike amplitudes used as a drift regressor in every spike-rate regression, and
    the Q-learning model's per-trial variables (chosen value, RPE) and parameters, are not in the dandiset.
- kind: data_missing
  statement: The anatomy, transcriptomics, MERFISH, retrograde tracing and patch-seq data of Figures 1 to
    3 and S1 to S11 are not in the dandiset, which its title and description match; the paper points to a
    Code Ocean collection without a DOI or other pinned identifier.
- kind: format_error
  statement: Numeric unit columns are stored as strings in some files, isi_violations_ratio in 4 files and
    peak_to_valley in 54 (for example sub-751004 session 2024-12-23).
- kind: metadata_insufficient
  statement: Tetrode units lack the quality columns of the Neuropixels files (isi_violations_ratio among them,
    which the selection needs; it is recomputed here from the spike times, matching the Neuropixels column
    at r = 0.9993), and have no CCF coordinates. The pupil_diameter series states no unit.
- kind: metadata_error
  statement: The description of acquisition/right_lick_time reads "The time of left licks".
- kind: other
  statement: Two files of subject 763360 (kind ecephys) have no trial table, so they cannot be used in task
    analyses; the archive counts 42 subjects of which 41 have task data.
- kind: methods_unavailable
  statement: 'Questions for the paper''s authors. (1) Is the exponential fit coefficient of 3.95 (Figure 4c
    legend) the amplitude or the decay constant, and which choice model and number of lags does it come from?
    Here the amplitude of the R + N model over 10 or 15 lags matches and no decay constant does. (2) How is
    the axonal quality threshold of 0.5 z applied (which window, mean or peak)? (3) Figure S15q: is the lick
    train gap 0.5 s (Methods) or 0.8 s (the load_licks default), and are video or sensor licks used? (4) In
    Figure S15f, what sign convention do the respond-versus-ignore t-statistics have? Here the correlation
    with tonic modulation is +0.26, the paper''s -0.59. (5) How are the bootstrapped p-values of Figure S15t
    computed, and how is a pair of neurons placed on a spatial axis? The absences hold here only with a within-session
    null.'
- kind: code_mismatch
  statement: The Methods give a 0.5 s inter-lick interval for lick bouts (Lick bout detection), while load_licks
    in utils/lick_utils.py (971c1ca), which F_spont_choice_lick_neuron.ipynb calls without arguments, splits
    trains at 0.8 s. The pupil time constant "mean of 3.37 and SD of 1.03" is computed in F_pupil_beh_ephys.ipynb
    over unit rows, each session's value repeated for each of its units, not over sessions.
- kind: data_missing
  statement: The antidromic stimulation tables the code reads to identify cortex-projecting neurons ({session}_opto_session.csv)
    and the pupil edge confidence are not in the dandiset, and the trial table's ITI_duration column does
    not hold the generated inter-trial intervals the Methods describe (it is 0.5 s in every photometry trial).
