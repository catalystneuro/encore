    1500 s segments the NEUTRAL median is 0.0303. With the null model's contamination over 0 to 200 the
    medians are 0.0519, 0.0533 and 0.0249, p unchanged. With the Methods' 200 inducing points and p_noise
    0.001 (2500 iterations, gp_methods.ipynb) they are 0.0556, 0.0566 and 0.0219, p 0.0170, 0.0040 and
