- claim: figs3-neutral-unmodulated
  outcome: reproduced
  notebook: evoked.ipynb
  output: claim:figs3-neutral-unmodulated
  measured:
  - 32
  - 67
  - 68
  notes: >-
    Re-run after a reader's answer (questions/001708.yaml) amended the criterion. It first took all NEUTRAL
    units of all files; it now takes the NEUTRAL units of the 'evoked/ongoing' and 'ongoing' files, which
    Table S11 shows to be the paper's n = 32 (20 + 12). The outcome before the answer was partially_reproduced,
    with measured 36, 76 and 77. Under the amended criterion there are 32 cells, with 67 withdrawal-aligned
    and 68 heat-aligned trials (window from -30 s or -10 s, with pinches), within tolerance of 32, 69
    and 70. Without pinches, as the code runs, the counts are exactly 69 and 70. These 32 are the same
    units as those named "Neutral", the code's selection. NEUTRAL activity shows no change at either event
    under any reading. The test is spikes in the 2 s after the event against the 2 s before, Wilcoxon
    over trials. The median change is 0 Hz and p is 0.24 to 0.31 at withdrawal and 0.52 to 0.70 at heat
    onset. As a positive control, ON and OFF trials at withdrawal give p = 5e-15 and 2e-16. With all 36
    NEUTRAL units, still reported, the counts are 36 cells and 76 to 79 withdrawal-aligned trials, outside
    tolerance, and 77 to 80 heat-aligned trials, and p is 0.14 to 0.23 at withdrawal and 0.49 to 0.65
    at heat onset. The heat-aligned contrast has little power: it does not detect the ON and OFF modulation
    either (p 0.97 and 0.26 at heat onset), so the heat-aligned half of the test is weak.
  deviations:
  - >-
    Trials follow the criterion's rule with pinches truncating windows (as in fig1c-psth-counts). The
    code's rule never sees a pinch and gives the paper's 69 and 70 exactly; both are shown.
- claim: figs8-null-model-worse
  outcome: reproduced
  notebook: evoked.ipynb
  output: claim:figs8-null-model-worse
  notes: >-
    With pinches (main), the constant-mean model's ELPD-LOO is -11704.9 for ON cells, against -7192.7
    (double exponential) and -7438.9 (single). The differences are 4512 (dse 204) and 4266 (dse 193),
    z = 22. For OFF cells the null is -9241.4, and every piecewise model is above it by 2983 to 2988 (dse
    122 to 123), z = 24. Without pinches the ON null is -11683.1 and the OFF null -9237.3, below every
    model by 4229 to 4468 and 2970 to 2973 (z = 22 and 24). Both readings of "significantly" hold under
    LOO and WAIC on both trial sets. The paper's notebooks print -11683 and -9237. Chains start at the
    highest of nine local maxima of the posterior (multi-start MAP, rvm.map_start), a sampler setting
    the paper does not give. Of the withdrawal-aligned fits, all but one converge (r_hat at most 1.007,
    bulk ESS at least 716, the four chains' mean log posteriors within 0.4 of each other); the erf model
    with linear recovery on the main trial set does not (r_hat 1.148, ESS 19) and converges at target_accept
    0.95 (r_hat 1.004). In this execution the same model without pinches converges (r_hat 1.006), and
    so does its refit at target_accept 0.95 (1.003); in the verifier's round-2 execution it did not
    (r_hat 1.393, ESS 9). The heat-aligned fits converge with r_hat at most 1.008. The unconverged fit
    is also far above the null, so the outcome does not rest on it.
- claim: fig2g-switch-times
  outcome: reproduced
  notebook: evoked.ipynb
  output: claim:fig2g-switch-times
  measured:
  - -0.191
  - 1.331
  notes: >-
    With the Methods' priors (k, k2 half-normal, the criterion's main reading) and pinches, the ON switch
    time is -0.191 s (97% HDI -0.275 to -0.105) and the OFF one 1.331 s (0.844 to 1.894), both inside
    the paper's HDIs, ON below 0 and OFF above. Without pinches they are -0.184 s and 1.312 s. With the
    code's priors on log k and log k2 the OFF times are 1.369 and 1.336 s. Every fit converges (r_hat
    at most 1.006, no divergence in the OFF fits, chains' mean log posteriors within 0.4). From the default
    start the Methods-prior OFF fit gives -0.636 s and does not converge (r_hat 1.69, three chains in
    the lower mode, 1121 divergences); in the verifier's round-2 execution the same fit gave 0.198 s (r_hat
    1.75, two chains in the lower mode, 78 divergences), since the draws differ between machines.
  deviations:
  - >-
    Chains start at the highest of nine local maxima of the posterior found by pymc.find_MAP from switch
    times spread over the prior (rvm.map_start). The paper does not say how its chains were started. Started
    at the model's default point, as the code starts them, the OFF fit with the Methods' priors has three
    chains in a mode whose mean log posterior is about 240 lower (-6558 against -6320; 1121 divergences,
    r_hat 1.69) and does not converge in the
    execution recorded here. Draws differ between machines at the same seeds: in the verifier's round-2
    execution two chains stayed there (r_hat 1.75, 78 divergences, t_switch 0.198 s). The start changes no method of the
    paper: it only keeps chains out of a mode whose posterior mass is negligible.
