    The model is written in plain torch, as a batch of independent GPs, for speed. On 100 iterations it
    gave the same class medians as the gpytorch classes ported from the code (checked while preparing,
    not run here). Expected log likelihoods use draws from each bin's marginal, where gpytorch draws jointly.
