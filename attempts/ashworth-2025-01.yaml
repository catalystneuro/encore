  deviations:
  - >-
    Assumed for every Gaussian-process claim: the code's settings were run, with 100 inducing points and
    p_noise 0.01, for 5000 iterations. Every loss history the code saved has 5000 steps, and the stored
    fits (combined_data.csv) have noise_prob 0.01. Matched cell by cell to the stored fits (by the null
    model's log likelihood, which agrees to a median relative difference of 0.0002 or less), the fits
    here agree with them (Spearman r 0.95 to 1.00 for period, outputscale, alpha and both pseudo-R2; median
