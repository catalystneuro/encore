- claim: figs1-near-threshold-delayed-aps
  outcome: partially_reproduced
  assumed: true
  notebook: di8_controls.ipynb
  output: claim:figs1-near-threshold-delayed-aps
  notes: Answer to questions/001272.yaml on the O3 width. The claims file now takes an AP's width at half
    height between 1 and 20 ms, where it had 2 to 20 ms; re-run with 1 ms, the outcome is unchanged, and
    the criterion is now met under the adopted O5 (a) in some readings. It is met in 19 of 48 reading
    combinations (12 with the 2-ms bound), 6 of 24 under O5 (a) (0 before) and 13 of 24 under O5 (b).
    Under whole/a/b, subject 2 fires a median of 2 APs at its threshold field, the first at a median 108
    ms, subject 4 a single AP at 201 ms, and subject 3 single APs at a median 63 ms, against 3.5 to 22
    ms at their higher fields; this meets the criterion in 2 of 3 neurons. Under whole/b/b only subject
    4 meets it, as subject 2's median threshold session has no AP. One or a few APs delayed by 100 ms or
    more near threshold hold in two of the three neurons under some readings and in one under others.
    The question on "delayed" is for the paper's authors (findings).
  deviations:
  - Assumed O5 (a), a first AP at least 100 ms after onset, as the paper's sense of "delayed". The paper
    quantifies the near-threshold delay only for FluoVolt (100 to 200 ms, Results, Stimulation by 2- and
    20-kHz unmodulated sine waves, paragraph 1) and says the Di-8-ANEPPS effects did not differ (Results,
