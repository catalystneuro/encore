outcomes:
- claim: figs1-eight-neurons
  outcome: not_reproduced
  notebook: di8_controls.ipynb
  output: claim:figs1-eight-neurons
  measured: 3
  notes: The dataset holds 3 neurons (subjects 2_20240806, 3_20240806 and 4_20240806, with 20, 29 and 16
    sessions), against 8 in the paper, and no frame stack is deposited twice. The fields were tested in
    mixed order in all three (rises and falls in each); subjects 2 and 4 mostly escalate.
- claim: figs1-aps-as-emission-decrease
  outcome: reproduced
  notebook: di8_controls.ipynb
  output: claim:figs1-aps-as-emission-decrease
  notes: Under all 12 readings (O1 ROI a, b and the whole frame, O2 F0 a and b, O3 height a and b),
    every neuron with APs had more APs on the inverted trace than on the trace as recorded in all of its
    sessions with APs above threshold, and no AP was detected on the trace as recorded. The largest brief
    deflection during the stimulus, as recorded, is negative in 57 of 65 sessions.
  deviations:
  - The soma outline is not deposited. The claims file's Otsu ROI (O1 a) keeps one bright membrane edge
    of the soma (26 to 48 of 256 pixels), and eroding it by 2 pixels (O1 b) leaves nothing in all 65
    files, so reading (b) equals (a). The whole deposited 16 x 16 frame, a crop around the soma, is run
    as a third ROI reading.
  - Frame 0 (1.7 to 15.7 times the median brightness) and the last frame are left out of every trace,
    a standard choice.
- claim: figs1-near-threshold-delayed-aps
  outcome: partially_reproduced
  assumed: true
  notebook: di8_controls.ipynb
  output: claim:figs1-near-threshold-delayed-aps
  notes: The criterion is met in 12 of 48 reading combinations, all under O5 (b) and none under O5 (a).
    Near threshold, subject 3 fires single APs whose median latency is 63 ms after onset, against 5 to 8
    ms at its higher fields; subject 4 fires 1 or 2 APs at a median 167 to 212 ms; subject 2's median
    threshold session has no AP under most readings. One or a few near-threshold APs hold in two of the
    three neurons, and a delay of at least 100 ms in one. The question on "delayed" is for the paper's
    authors (findings).
  deviations:
  - Assumed O5 (a), a first AP at least 100 ms after onset, as the paper's sense of "delayed". The paper
    quantifies the near-threshold delay only for FluoVolt (100 to 200 ms, Results, Stimulation by 2- and
    20-kHz unmodulated sine waves, paragraph 1) and says the Di-8-ANEPPS effects did not differ (Results,
    Sensitivity to unmodulated sine waves was not caused by FluoVolt dye). Under O5 (b), relative to the
    neuron's own higher fields, the outcome depends on the ROI and height readings (12 of 24).
- claim: figs1-stronger-field-shorter-delay-sustained-firing
  outcome: reproduced
  assumed: true
  notebook: di8_controls.ipynb
  output: claim:figs1-stronger-field-shorter-delay-sustained-firing
  notes: The criterion is met under 10 of 12 readings and all 6 with height reading (b). The first-AP
    latency correlates negatively with field in 2 of 2, 3 of 3 or 2 of 3 neurons with APs at 3 or more
    fields (Spearman rho from -0.76 to 0.07, positive in one neuron under one reading; most single correlations not significant, p 0.004 to 0.91), and
    2 or 3 of the 3 neurons show sustained firing. It fails under the 5% height with the whole-frame ROI,
    where few Di-8-ANEPPS APs reach 5% (8 to 15 sessions with APs, against 50 or 52 under height (b)).
    The F5 maximum rate stays at 5.9 to 52 Hz.
  deviations:
  - Assumed O3 height reading (b), 5 SD of the trace before onset, for Di-8-ANEPPS. The 5% level is the
    Methods' selection level for FluoVolt APs, and the paper says Di-8-ANEPPS has a lower voltage
    sensitivity (Results, Sensitivity to unmodulated sine waves was not caused by FluoVolt dye); the
    Di-8-ANEPPS APs measured here have a median height of 4.1 to 6.6%.
- claim: figs1-culminates-in-sustained-depolarization
  outcome: not_reproduced
  notebook: di8_controls.ipynb
  output: claim:figs1-culminates-in-sustained-depolarization
  notes: At most 1 of the 3 neurons meets the criterion under any of the 24 reading and level
    combinations (more than half needed), and also with the AP height taken as prominence. Subjects 2
    and 4 were stimulated up to 234 V/cm only, close to their thresholds (126 to 180 and 205 V/cm), and
    never reach sustained depolarization. Subject 3, stimulated up to 504 V/cm, meets it only with the
    Otsu ROI and level (b) or the 5% height; with the whole frame and height (b) it still fires 3 APs in
    the last 100 ms at 504 V/cm, with a late inverted dF of 2.9 to 3.3% at 396 to 504 V/cm against 1.4 to
    2.4% at most lower fields. Bleaching raises the inverted trace by 1.4 to 1.7% late in sessions with no
    response, which the O6 levels do not remove.
  deviations:
  - A neuron counts when most of its highest-field sessions show sustained depolarization, a standard
    choice; every highest field here has one session except subject 2 (2) and subject 4 (6).
