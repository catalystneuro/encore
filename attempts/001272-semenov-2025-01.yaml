- claim: figs1-effects-same-as-fluovolt
  outcome: partially_reproduced
  assumed: true
  notebook: di8_controls.ipynb
  output: claim:figs1-effects-same-as-fluovolt
  notes: Under unit reading (i) the t test finds no difference between the Di-8-ANEPPS (n = 2 or 3, mean
    108 to 152 V/cm) and FluoVolt (n = 20 to 27, mean 140 to 178 V/cm) 1-AP thresholds under all 12
    readings (p 0.27 to 0.98; difference -43 to 1 V/cm, 95% intervals as wide as -156 to 124 V/cm), nor
    with the height as prominence (p 0.15 to 0.64). Under reading (ii) the Di-8-ANEPPS thresholds are
    higher under 9 of 12 readings (p 0.002 to 0.017; 8 of 12 as prominence, 12 of 12 with the earlier
    2-ms width bound). The response pattern holds only in part (figs1-near-threshold-delayed-aps
    not reproduced, figs1-stronger-field-shorter-delay-sustained-firing reproduced,
    figs1-culminates-in-sustained-depolarization not reproduced), so the criterion's condition for
    reproduced is not met; its condition for not reproduced, a threshold difference, is not met under the
    adopted unit reading either. The FluoVolt mean, about 150 V/cm, is far above the paper's 57.7 V/cm
    (reported, not judged); the one-sample tests of the Di-8-ANEPPS thresholds against 57.7 V/cm give p
    0.14 to 0.36 with n = 2 or 3. With n = 2 or 3 and intervals this wide, the absence of a difference
    carries little information. The criterion gives no outcome for a pattern that fails with no
    threshold difference; this is asked of a reader in questions/001272.yaml. The change of
    figs1-near-threshold-delayed-aps to not reproduced in verification round 3 leaves this outcome as it
    is, as the pattern fails either way.
  deviations:
  - Assumed unit reading (i), the volts as the files state them times the files' 36 V/cm per volt in
    both groups. The 001032 to 001035 files call their volts peak-to-peak, and the 001272 files say only
    amplitude. In DANDI 001271, FluoVolt recorded in 2024 with the same wording as 001272, the 2-kHz
    thresholds (mean 3.70 V, n = 20) and those of 001032 to 001035 (4.20 V, n = 27) do not differ
    (p = 0.29). This gives no evidence against one scale but does not show the scales are equal, and the
    files say the delivered amplitude is smaller by a calibration that is not deposited. Reading (ii),
    FluoVolt volts halved, is shown.
