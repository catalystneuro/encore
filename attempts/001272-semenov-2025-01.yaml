- claim: figs2-ttx-blocks-depolarization
  outcome: reproduced
  assumed: true
  notebook: fluovolt_elsewhere.ipynb
  output: claim:figs2-ttx-blocks-depolarization
  notes: Under the 4 whole-frame readings and the Otsu-ROI readings with height (b), with either width
    bound, APs present before TTX are absent after in all 6 TTX neurons of DANDI 001271 (20 to 89 APs
    before, 0 after, at 4 to 6 matched fields), and every vehicle neuron with matched fields keeps firing
