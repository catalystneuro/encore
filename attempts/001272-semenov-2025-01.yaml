  - The criterion does not say whether the pattern is judged per neuron or in the representative neuron
    of Figure 3C. It is judged per neuron here, and the outcome is partial as it holds in 1 or 2 of 4.
  - AP height as prominence is a variant added here, as a depolarized baseline makes noise peaks pass
