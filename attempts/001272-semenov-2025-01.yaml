- claim: fig2-modulated-locks-to-beats
  outcome: partially_reproduced
  assumed: true
  notebook: fluovolt_elsewhere.ipynb
  output: claim:fig2-modulated-locks-to-beats
  notes: Locking holds under every reading. No modulated session has more than 10 APs (84 sessions, at
    most 5 to 10), every session with 5 or more APs has most of them 12.5 to 37.5 ms into the 50-ms beat
    (88 to 100% of all APs there), and the whole-frame phase histogram peaks 20 to 35 ms into the beat
    while that of unmodulated sessions is flat. The criterion is met under the 8 Otsu-ROI readings; under
    the 4 whole-frame readings one modulated session (001032 neuron 2_1, 11 V, 2 kHz) shows sustained
    depolarization by O6 level (a) (late dF 5.9% against a level of 4.7%, no late AP), though not by level
