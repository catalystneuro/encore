  notebook: di8_controls.ipynb
  output: claim:figs1-effects-same-as-fluovolt
  notes: Under unit reading (i) the t test finds no difference between the Di-8-ANEPPS (n = 3, mean 134
    to 152 V/cm) and FluoVolt (n = 18 to 27, mean 145 to 162 V/cm) 1-AP thresholds under all 12 readings
