- claim: figs1-noisier-than-fluovolt
  outcome: not_reproduced
  notebook: di8_controls.ipynb
  output: claim:figs1-noisier-than-fluovolt
  notes: Changed from partially reproduced after verification round 1, since the criterion requires both
    measures and is met under none of the 12 readings, with either width bound and with the height as
    the dF value or as prominence. By the SD before the onset (reading b), the direct measure of noise,
    which does not depend on AP detection, the Di-8-ANEPPS traces are less noisy (whole frame 0.55
