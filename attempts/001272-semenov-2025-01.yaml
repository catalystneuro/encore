- claim: figs1-aps-as-emission-decrease
  outcome: reproduced
  notebook: di8_controls.ipynb
  output: claim:figs1-aps-as-emission-decrease
  notes: Answer to questions/001272.yaml on the O3 width. The claims file now takes an AP's width at half
    height between 1 and 20 ms, where it had 2 to 20 ms; re-run with 1 ms, the outcome is unchanged.
    Under all 12 readings (O1 ROI a, b and the whole frame, O2 F0 a and b, O3 height a and b), every
    neuron with APs had more APs on the inverted trace than on the trace as recorded in all of its
    sessions with APs. The trace as recorded yields 2 APs, in subject 2 under the four Otsu-ROI readings
    with the 5% height (none with the 2-ms bound). The largest brief deflection during the stimulus, as
    recorded, is negative in 57 of 65 sessions.
  deviations:
  - The soma outline is not deposited. The claims file's Otsu ROI (O1 a) keeps one bright membrane edge
    of the soma (26 to 48 of 256 pixels), and eroding it by 2 pixels (O1 b) leaves nothing in all 65
    files, so reading (b) equals (a). The whole deposited 16 x 16 frame, a crop around the soma, is run
    as a third ROI reading.
  - Frame 0 (1.7 to 15.7 times the median brightness) and the last frame are left out of every trace,
    a standard choice.
- claim: figs1-near-threshold-delayed-aps
  outcome: not_reproduced
  assumed: true
  notebook: di8_controls.ipynb
  output: claim:figs1-near-threshold-delayed-aps
  notes: Under the adopted readings (whole frame, F0 (a), height (b) read as prominence, O5 (a)) every
    neuron fires a median of 1 AP at its threshold field, but only subject 4 has its first AP 100 ms or
    more after onset (137 ms); subjects 3 and 2 fire at 63 and 6 ms. So 1 of 3 neurons meets the
    criterion, where more than half are needed. Each neuron's near-threshold AP is later than its APs at
    higher fields (2.7, 8.3 and 21.8 ms). With the height as prominence the criterion is met in 20 of 48
    reading combinations, 0 of 24 under O5 (a) and 20 of 24 under O5 (b). With the height as the dF value
    it is met in 19 of 48 (6 of 24 under O5 (a), 13 of 24 under O5 (b); 12 of 48 with the earlier 2-ms
    width bound); under whole/a/b subject 2 then fires 2 APs at threshold, the first at 108 ms, and
    subject 4 one at 201 ms, so 2 of 3 neurons meet it. One or a few APs near threshold hold in all three
    neurons, later than at higher fields, and a delay of 100 ms or more in one or two of the three,
    depending on the height reading. The questions on "delayed" and on the AP height are for the paper's
    authors (findings). Changed from partially reproduced after verification round 3. The criterion is
    one test per neuron, which needs the median near-threshold session to have 1 to 3 APs and its first
    AP delayed, and it is met when more than half of the neurons pass it; 1 of 3 passes under the
    adopted readings, under O4 (a) and (b) alike. Partially reproduced described the two halves of that
    test, which the criterion does not judge apart. Under O5 (b), "delayed" relative to the neuron's own
    higher fields, every neuron's near-threshold AP is later, so the outcome rests on the reading of
    "delayed" (assumed true).
  deviations:
  - Assumed the AP height read as prominence for Di-8-ANEPPS, after verification round 1. With the
    height as the dF value, the whole frame and height (b), the detector finds 46 peaks after the
    stimulus in 23 of 65 sessions (0.91 per 100 ms, against 2.09 during it), as bleaching raises the
    inverted trace; with prominence it finds 1 (0.02 against 1.43). The value reading is shown beside it.
  - Assumed O5 (a), a first AP at least 100 ms after onset, as the paper's sense of "delayed". The paper
    quantifies the near-threshold delay only for FluoVolt (100 to 200 ms, Results, Stimulation by 2- and
    20-kHz unmodulated sine waves, paragraph 1) and says the Di-8-ANEPPS effects did not differ (Results,
    Sensitivity to unmodulated sine waves was not caused by FluoVolt dye). Under O5 (b), relative to the
    neuron's own higher fields, the outcome depends on the ROI and height readings (met in 13 of 24
    combinations with the height as the dF value, 20 of 24 as prominence).
- claim: figs1-stronger-field-shorter-delay-sustained-firing
  outcome: reproduced
  assumed: true
  notebook: di8_controls.ipynb
  output: claim:figs1-stronger-field-shorter-delay-sustained-firing
  notes: Under the adopted readings (whole frame, height (b) read as prominence) the first-AP latency
    correlates negatively with field in all 3 neurons (Spearman rho -0.63, -0.03 and -0.50, p 0.007,
    0.88 and 0.058) and all 3 show sustained firing (in 5, 11 and 10 sessions). The criterion is met
    under 10 of 12 readings and all 6 with height (b), with the height as prominence and as the dF value
    alike, and with the earlier 2-ms width bound. With the height as the dF value more sessions show
    sustained firing (8, 22 and 11 under whole/a/b), part of it noise on a raised baseline (null test).
    Most single correlations are not significant (rho from -0.94 to 0.50 over readings). It fails under
    the 5% height with the whole-frame ROI, where few Di-8-ANEPPS APs reach 5%.
  deviations:
  - Assumed the AP height read as prominence, as for figs1-near-threshold-delayed-aps; the outcome is the
    same with the height as the dF value.
  - Assumed O3 height reading (b), 5 SD of the trace before onset, for Di-8-ANEPPS. The 5% level is the
    Methods' selection level for FluoVolt APs, and the paper says Di-8-ANEPPS has a lower voltage
    sensitivity (Results, Sensitivity to unmodulated sine waves was not caused by FluoVolt dye); the
    Di-8-ANEPPS APs measured here have a median height of 3.7 to 6.7% over the readings.
