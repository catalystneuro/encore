  deviations:
  - Assumed the whole deposited frame as the soma ROI where the ROI readings disagree (here and in
    fig3c-sustained-firing-2s and figs2-ttx-blocks-depolarization). The Methods measure "the emission
    over the entire cell soma"; the deposited 16 x 16 frames are a crop around the soma, the claims
