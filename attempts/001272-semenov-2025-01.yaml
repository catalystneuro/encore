findings:
- kind: data_missing
  statement: The dataset holds 3 neurons recorded with Di-8-ANEPPS (subjects 2, 3 and 4 of 2024-08-06),
    where the paper reports 8 for this experiment (Figure S1).
- kind: data_missing
  statement: None of the paper's ten deposits holds the 250-ms sine wave sessions in sodium gluconate
    solution behind Figure 3B; 001030 holds only 2-s ramped waves in that solution.
- kind: other
  statement: DANDI 001034 appears to duplicate DANDI 001032. All 80 of its 2-kHz unmodulated files have
    frame stacks identical to those of 001032, under subject names ending in _3 in place of _1; its
    other files were not compared.
- kind: metadata_error
  statement: Every file of DANDI 001272 (65 of 65) describes the session as performed "without tetrodotoxin
    (vehicle control)", wording taken from the tetrodotoxin experiment (001271); the Di-8-ANEPPS
    experiment had no tetrodotoxin arm.
- kind: metadata_error
  statement: The tetrodotoxin sessions of DANDI 001271 (71 of 71) describe tetrodotoxin as one "which
    abolished the action potentials and caused sustained depolarization during application of
    stimulating waves". The paper says it blocked the sustained
    depolarization, and in the data the late dF after tetrodotoxin is -0.38 to -0.70% in all 6 neurons.
- kind: metadata_insufficient
  statement: The stimulus onset is not stored in DANDI 001272 or 001271 (the Methods put it at 50 ms; the
    responses are consistent with that, peaking in an onset contrast at 50 ms), and no file stores the
    stimulus waveform or the field in V/cm other than as text in the session description.
- kind: metadata_insufficient
  statement: Amplitudes are given in volts with inconsistent meaning. DANDI 001032 to 001035 call them
    peak-to-peak, 001030 and 001031 one polarity ("peak-to-peak would be two-fold larger"), and 001272 and
    001271 say neither, yet all apply the same 36 V/cm per volt. The files also say the delivered
    amplitude is smaller by a frequency-dependent calibration "to be reported separately", which is not
    deposited. With the stated conversion the mean 2-kHz FluoVolt threshold is about 150 V/cm, against
    the paper's 57.7 V/cm.
- kind: metadata_insufficient
  statement: The frames are 16 x 16 pixels where the Methods give 64 x 64 after binning, and nothing says
    which part of the sensor they are or how the soma region was drawn, so the paper's soma ROI cannot be
    reproduced.
- kind: other
  statement: Frame 0 of every DANDI 001272 file is 1.7 to 15.7 times brighter than the median frame, a
    camera artefact that must be dropped before computing F0. 33 of 62 intervals between consecutive
    sessions are under the 20 s the Methods give (range 4 to 168 s).
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) Was the soma emission F taken over the whole
    deposited 16 x 16 frame, and if not, over what region? (2) For Di-8-ANEPPS, what AP height, measured from what
    baseline, and what delay after onset count as an AP and as "delayed"? (3) Are the 001272 amplitudes peak-to-peak like
    those of 001032 to 001035, and what were the delivered amplitudes? (4) Which trace without APs was
    subtracted from the 2-s recordings of Figure 3C? (5) When was the vehicle added in the vehicle
    neurons of 001271? This attempt assumed the whole frame, a height of 5 SD of the pre-stimulus trace
    measured as the peak's prominence for Di-8-ANEPPS, a delay of at least 100 ms, the stated volts on one scale, and the largest gap between sessions.
- kind: metadata_insufficient
  statement: DANDI 001273 does not hold the debris ROI the paper scales its strobe images to, nor the
    ROIs over the cell poles, nor the cell-shape groups of Figure 4. Without the scaling, laser-flash
    fluctuation of the order of the signal dominates the replicate-mean traces. The files form 22
    experiments of 7 or 8 replicates, one pair and 4 single files, where the paper reports 19, with no
    mapping.
- kind: other
  statement: In DANDI 001273, 164 of the 175 replicates fitted have at least one dark frame (257 in all,
    0.34 to 0.80 of the median frame mean), in 95 of them only the first acquired frame. They are left
    out of the fits.
- kind: other
  statement: The paper lists ten dandisets for its raw images without saying which figure each holds; the
    claims file and this attempt assign them from their titles.
