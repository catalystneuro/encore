  deviations:
  - The FluoVolt group is the 2-kHz unmodulated 250-ms sessions of DANDI 001032, 001033 and 001035 (209
    sessions, 28 neurons). DANDI 001034 is a byte-identical copy of 001032 (80 of 80 such sessions) and
    is counted once. DANDI 001030 holds only 2-s ramped waves in sodium gluconate and has no session the
