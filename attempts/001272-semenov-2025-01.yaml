- claim: fig3c-sustained-firing-2s
  outcome: partially_reproduced
  assumed: true
  notebook: fluovolt_elsewhere.ipynb
  output: claim:fig3c-sustained-firing-2s
  notes: The pattern is present in neuron c7 of DANDI 001030. It fires through the 2-s wave at 1.45 to
    2.0 V (71 to 92 APs, 8 to 10 in the last 250 ms), and at 2.3 V a burst is followed by depolarization
    without APs (late dF 6.0% against 0.0 to 5.4% at lower fields). Under the whole-frame ROI c7 meets all
    three parts when the AP height is taken as prominence, under either bleaching correction, and c8 meets
    them under the shared correction in some readings; with the height as the dF value, one detection in
    the last 250 ms at 2.3 V counts as firing and c7 fails. No reading has more than 2 of the 4 neurons
