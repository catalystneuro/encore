    maps, and 4 of 16 without gap filling at 8 and at 2 cm; in this run no width gives all 16. In the verifier's
    round-2 copy, embedded on another machine before numba's CPU target was fixed, all 16 were above every one of
    200 shuffles at 2 cm, so at the narrow widths the result sits at the edge of the criterion. The single-trial
    maps' smoothing is not in the Methods and the session width is garbled; at 8 cm the claim fails clearly and at 2
    cm it can pass, and the claims file's rule for the width (fig2d-pv-similarity) makes the claim
    methods_underspecified.
