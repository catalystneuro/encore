- claim: figs3d-pfc-similarity-over-trials
  outcome: partially_reproduced
  notebook: reproduce_tang_2023.ipynb
  output: claim:figs3d-pfc-similarity-over-trials
  notes: The criterion asks for each reading of the novel trials. PFC last trial above the first under every reading
