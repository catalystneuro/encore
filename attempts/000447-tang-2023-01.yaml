- claim: figs3a-ca1-global-remapping
  outcome: reproduced
  notebook: reproduce_tang_2023.ipynb
  output: claim:figs3a-ca1-global-remapping
  notes: CA1 spatial correlation, F-N' against the cell-ID shuffle, Tukey p = 0.075 (F-N' higher by 0.074; medians
    -0.059 and -0.064). The margin is thin; over 100 draws of the shuffle p is below 0.05 in 13, and F-N' is always
    higher (by 0.014 to 0.105). The 4-cm and 2-cm widths give p = 0.21 and 0.40. Rate overlap does not differ either
    (p = 0.55 and 0.30). JS17 keeps some CA1 spatial correlation across rooms (median r 0.31; the other rats -0.11
    to -0.05).
  deviations:
  - The 1D smoothing width of the linearized maps is garbled in the paper's text (Methods, Spatial fields and linearization,
    "s = σ cm"). 8, 4 and 2 cm are run; 8 cm is reading (a) of the claims file (fig2d-pv-similarity), the σ given
    for the 2D maps in the sentence before. As the claims file's rule for fig2d-pv-similarity has it, the outcome
    is that of 8 cm when the widths agree, and methods underspecified when they do not.
  - Linear positions are projections onto W-shaped paths built from the well positions and the run positions (nfn.build_skeleton),
    as the Methods' "pre-defined idealized paths along the track" are not in the dandiset (an assumption; paths
    are 180 to 220 cm, median 5 cm from the run positions).
  - Rate maps use run periods above 5 cm/s with occupancy above 20 ms (Methods, Spatial fields and linearization),
    but SWR times are not excluded, as the dandiset holds no ripple times.
  - The shuffle pairs each cell's F map with another cell's N' map of the same animal (a random derangement within
    the animal); the Methods say "a different cell" without saying whether across animals. One draw decides the
    outcome; 100 draws are shown.
