- claim: fig2e-ca1-error-familiar
  outcome: partially_reproduced
  notebook: reproduce_tang_2023.ipynb
  output: claim:fig2e-ca1-error-familiar
  notes: CA1 error is higher in F than in N (median 230 against 172 cm; Dunn p = 1.8e-140 over the four groups,
    p = 1.0e-139 for N and F alone), in every variant. In F the error is not below the shuffle but above it (median
    230 against 226 cm, mean paired difference 8.8 cm); the Wilcoxon test finds the difference under shuffle reading
    (a), p = 2.4e-08, and (b), p = 0.042, so the claim of no difference fails by the paper's test, though the statement's
    "no better than chance" holds in direction. The widths agree on the outcome, 4 cm (a) p = 3.4e-10 ((b) p = 0.79),
    2 cm (a) p = 1.8e-08 and (b) p = 0.0067 with F 3.5 cm below the shuffle. The decoder works, decoding N' with
    templates from the other half of its passes gives a median error of 12 cm with 64% of bins on the current trajectory
    (chance 25%). In N 43% of CA1 bins are decoded onto the current trajectory and 65% onto the current arm; errors
    are large because a decode onto the other trajectory of the same arm counts as far, as the criterion asks. Restricted
    to the current trajectory, CA1 errors are 15 cm (N) and 57 cm (F).
  deviations:
  - The 1D smoothing width of the linearized maps is garbled in the paper's text (Methods, Spatial fields and linearization,
    "s = σ cm"). 8, 4 and 2 cm are run; 8 cm is reading (a) of the claims file (fig2d-pv-similarity), the σ given
    for the 2D maps in the sentence before. As the claims file's rule for fig2d-pv-similarity has it, the outcome
    is that of 8 cm when the widths agree, and methods underspecified when they do not.
  - Linear positions are projections onto W-shaped paths built from the well positions and the run positions (nfn.build_skeleton),
    as the Methods' "pre-defined idealized paths along the track" are not in the dandiset (an assumption; paths
    are 180 to 220 cm, median 5 cm from the run positions).
  - Rate maps use run periods above 5 cm/s with occupancy above 20 ms (Methods, Spatial fields and linearization),
    but SWR times are not excluded, as the dandiset holds no ripple times.
  - Decoding windows of 200 ms every 150 ms (Methods, "moving window with 50 ms overlap"); the code's 50-ms step
    is a variant. The code's theta restriction cannot be applied (no theta times in the dandiset).
  - Positions of N and F are put into N' coordinates by the ratio of trajectory lengths, as each epoch has its own
    linearization (an assumption).
  - Dunn's test is Bonferroni-adjusted over all pairs, as GraphPad Prism (the paper's software) does; a rate floor
    of 1e-4 Hz keeps log rates finite (a standard choice).
