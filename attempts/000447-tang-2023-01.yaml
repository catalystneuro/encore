- claim: fig1c-familiar-above-novel
  outcome: not_reproduced
  notebook: reproduce_tang_2023.ipynb
  output: claim:fig1c-familiar-above-novel
  notes: On N, F and N' of the five rats the repeated-measures ANOVA gives F(2,8) = 1.08, p = 0.383, and Tukey's
    test does not put F above N (difference of the means 0.060, p = 0.70). F is above N in four rats (by 0.078 to
    0.222) and below it in ZT2 (by 0.282), whose F session has 24 trials at 0.50 correct. ZT2's trials table is
    complete, 22 well-to-well transits counted from position against 24 rows, with the trials tiling the 1554-s
    epoch; ZT2 spent 0.33 of that session above 5 cm/s, the smallest fraction of any session. Each session estimated
    alone gives p = 0.46. The F-N-F'-N' rats of Figure S1C, which the criterion tests only if their behaviour is
    in the dataset, are not.
  deviations:
  - The ANOVA is over N, F and N' only; the de novo sessions of the paper's five-group ANOVA of Figure 1C are not
    in the dandiset, so Tukey's test uses the error term of a three-group ANOVA.
  - The novel curve is estimated on N and N' together, as cal_behavperform.m runs the novel sessions together; the
    familiar curve on F alone, as the de novo days the code would include are missing. Background probability 1/3
    (cal_behavperform.m).
