findings:
- kind: format_error
  statement: The units table's `electrodes` column holds tetrode numbers, not row indices of the electrodes
    table as the NWB format requires, its values run up to 64 in ZT2, whose table has 128 rows (two per
    tetrode), and up to 30 to 32 in the others. Read as row indices, up to 32 units per animal are put
    in the wrong region; read as tetrode numbers, the counts match the paper's (98 CA1 and 171 PFC cells
    against 99 and 171 here).
- kind: metadata_insufficient
  statement: Units carry no cell number within a tetrode, no waveform and no putative-interneuron label,
    so the paper's interneuron exclusion (spike width and rate in the Methods, per-animal (tetrode, cell)
    lists in its code) cannot be applied. Units clustered only in later epochs are appended to the table
    with no spike in N (1 to 19 per animal), without a note.
- kind: other
  statement: In every file `acquisition/ElectricalSeries` is a byte-identical second copy of the 1.5 kHz
    LFP in `processing/ecephys/LFP`, stored at a different offset; there is no 30 kHz spike-band recording,
    and the copy roughly doubles the file sizes.
- kind: metadata_error
  statement: The position's reference frame is given as "center well", but positions are camera coordinates
    in which the center well lies at different places in each epoch (for example AM2 (32, 52) cm in N
    and (73, 86) cm in F). The five files' session start times fall within 16 minutes on 2023-03-14, two
    days before the first published version, which is the time of conversion, not of recording.
- kind: metadata_insufficient
  statement: The files hold no linearized positions, idealized track paths or trajectory labels per position
    sample, no sharp-wave ripple or theta times, and the epochs carry no names (N, F and N' are known
    only from the dandiset description's order). The paper's rate maps, decoding and manifolds use all
    of these; here linear positions had to be rebuilt from the 2D positions and ripple times could not
    be excluded.
- kind: metadata_error
  statement: In AM2 the electrode groups Tetrode26 to Tetrode31 carry the labels tetrode27 to tetrode32,
    so group names and labels disagree; electrode descriptions are placeholders ("my description", "no
    description").
- kind: data_missing
  statement: The de novo learning sessions of the five rats and the behaviour of the three F-N-F'-N' rats
    (Figures 1B, 1C, S1B, S1C) are not in the dandiset; four claims are blocked and one is tested on the
    N-F-N' day only.
- kind: code_mismatch
  statement: decoding_position_novelfamiliar_trial_batch.m (Figure 2F) takes the last ten trials of the
    pre-switch epoch only `if ep == 1`, but runs on epochs 2 and 4, so it always takes the first ten N
    trials, against its own comment ("last 10 trials") and the legend's switch from N to F. With the last
    N trials CA1 error rises at the switch (Dunn p = 0.0021); with the first ten it does not (p = 0.11).
- kind: methods_unavailable
  statement: Question for the authors. What is the width of the 1D Gaussian that smooths the linearized
    rate maps? The text reads "s = σ cm". 8 cm (the 2D width) was assumed; figs5e, fig3d and fig3e change
    outcome between 8, 4 and 2 cm.
- kind: methods_unavailable
  statement: Question for the authors. How were the idealized paths for linearization defined, and are
    the linearized positions available? They are not in the dandiset; here W-shaped paths were built from
    the well and run positions.
- kind: methods_unavailable
  statement: Question for the authors. In Figure 2F, are trials -10 to -1 the last ten N trials (as the
    legend and the code's comment suggest) or the first ten (as the code runs)? The CA1 result depends
    on it.
- kind: methods_unavailable
  statement: Question for the authors. In Figure S3D, which novel trials are shown (N, N' or both), how
    are trials numbered across animals with different numbers of passes, and which is the last trial?
    CA1 similarity falls over trials of N or of N' alone but not over N then N'.
- kind: methods_unavailable
  statement: Question for the authors. Does Figure S5F use the signed or the absolute selectivity index?
    Path equivalence is uncorrelated with the signed SI but negatively correlated with its absolute value
    in PFC (p < 0.0001).
- kind: methods_unavailable
  statement: Question for the authors. For the ramping cells of Figure S4, which positions enter the regression
    and which cell samples form the denominator (495 and 636)? The rule as written gives 3 to 8% of cell
    samples here, against 16.4 and 18.1%.
- kind: methods_unavailable
  statement: Question for the authors. For the geometric random model of Figure S7, in which space are
    the axes permuted (the 3 UMAP coordinates or the neurons), and what happens to the cluster centres
    (the legend says rotation-translation)? Its code is not in the repository.
