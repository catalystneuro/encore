- claim: fig2f-switch-dynamics
  outcome: partially_reproduced
  notebook: reproduce_tang_2023.ipynb
  output: claim:fig2f-switch-dynamics
  notes: Reading (a), trial -1 the last N trial, Methods decoder at 8 cm, CA1 error rises from 182 to 223 cm between
    trial -1 and trial 1 (Dunn p = 0.0021), PFC does not differ (149 and 200 cm, p = 0.12). Reading (b), the code's
    first ten N trials labelled -10 to -1 and later N trials dropped, CA1 trial 1 is not above trial -1 (223 against
    259 cm, p = 1), PFC p = 1. The criterion asks for both readings; the PFC part holds under both and the CA1 part
    under (a) only. The other widths give no more, 4 cm CA1 rises under (a) (p = 0.0079) but PFC rises too (p =
    0.0004), 2 cm CA1 does not rise under either reading (p = 0.30 and 1) and PFC is stable (p = 0.076 and 1). The
    code's decoder (variant) finds no CA1 rise under (a) (p = 1), and under (b) both regions rise (p = 0.00027 and
    0.0013). Calling the outcome partial at every width is a judgement. At 2 cm only the PFC claim of absence holds
    and CA1 rises under neither reading, which alone would be closer to not reproduced; the outcome is partial or
    worse at every width and reproduced at none, so the width rule does not block it.
  deviations:
  - Both readings of trial -1 in the criterion are run. Reading (a) is the last N trial; the legend's "Trial-by-trial
    decoding error during environment switch (N to F)" and the Results' "the first trial after environment switching"
    read so, and decoding_position_novelfamiliar_trial_batch.m means it (its comment says "last 10 trials") but
    its condition `ep == 1` never holds for epochs 2 and 4, so as written it takes the first ten, reading (b).
  - The 1D smoothing width of the linearized maps is garbled in the paper's text (Methods, Spatial fields and linearization,
    "s = σ cm"). 8, 4 and 2 cm are run; 8 cm is reading (a) of the claims file (fig2d-pv-similarity), the σ given
    for the 2D maps in the sentence before. As the claims file's rule for fig2d-pv-similarity has it, the outcome
    is that of 8 cm when the widths agree, and methods underspecified when they do not.
  - Linear positions are projections onto W-shaped paths built from the well positions and the run positions (nfn.build_skeleton),
    as the Methods' "pre-defined idealized paths along the track" are not in the dandiset (an assumption; paths
    are 180 to 220 cm, median 5 cm from the run positions).
  - Rate maps use run periods above 5 cm/s with occupancy above 20 ms (Methods, Spatial fields and linearization),
    but SWR times are not excluded, as the dandiset holds no ripple times.
  - Trials are rows of the dandiset's trials table; Kruskal-Wallis over trials -10 to 10 with Dunn's test Bonferroni-adjusted
    over all 190 pairs (GraphPad's default for all pairs).
