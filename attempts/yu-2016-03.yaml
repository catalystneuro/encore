findings:
- kind: format_error
  statement: In the cortical files the whisker timestamps (processing/whisker/BehavioralTimeSeries/*/timestamps,
    labelled Seconds) are the trial start in milliseconds plus the time within the trial in seconds, so
    trial starts are 1,000 times those of the ephys timestamps. Read as milliseconds, each ephys trial
    starts 10 ms before the first whisker frame (10 kHz files) or with it (20 kHz files).
- kind: metadata_insufficient
  statement: Seventy cortical files hold two tracked whisker series (whisker_angle_1, whisker_angle_2,
    with their touch annotations), and nothing says which whisker each is. Mapping them in the order of
    general/whisker_configuration to analysis/principal_whisker gives FS neurons almost no touch response
    (0.45 against 1.78 spikes per touch with series 1), while for several L4 E neurons it picks the series
    with the larger touch response (JY1345 0.857 against 0.235). The example code takes the first whisker as the
    main one.
- kind: data_missing
  statement: Not in the data set, though the paper reports them. The 17 thalamic multiunit recordings
    during TRN-axon photostimulation (Fig. 6b,c), the rabies tracing (Supplementary Fig. 10), the L5 FS
    neurons after ION cut, and the whole-cell recordings with depolarizing current injection (Fig. 3,
    n = 6). No whole-cell L4 E trial has a median Vm above -42.8 mV.
- kind: metadata_error
  statement: The neuron JY1139 in the L4FS_whole_cell folder has the unit description "Excitatory", while
    the folder and the cell list's FS sheet give it as an FS neuron. Its first 18 trials have median Vm
    between -2.3 and -26.8 mV while it fires 8 to 85 spikes per trial with no injected current above 0.1
    nA; from trial 20 it sits near -41 mV. Nothing in the file marks these trials.
- kind: metadata_insufficient
  statement: Eight whole-cell L4 E files (JY0865, JY0861, JY1002, JY0989, JY0913, JY1009, JY0781, JY0986)
    flag 132 stimulus trials in analysis/trial_type_mat but hold no photostimulus series, and Exp_2015-09-24_004
    and JY1633 have 23 flagged trials without light in their series. What stimulus these trials had cannot
    be read.
- kind: paper_inconsistency
  statement: The eNpHR experiments hold 43 L4 E neurons with 594 nm light trials (39 cell-attached and
    4 whole-cell), where the paper gives 40. Thalamic photoinhibition has 13 whole-cell L4 E neurons against
    12, direct cortical activation 8 against 7, and the mice with eNpHR light number 9, where Supplementary
    Fig. 14 has 8.
- kind: methods_unavailable
  statement: For the authors. The onset latency of Vm after light onset (Supplementary Fig. 9c,f; 4.2
    and 2.8 ms) is not defined in the paper. The touch rule (dVm/dt crossing 3 s.d. of its baseline) crosses
    at the onset sample, where the light makes a step in the average Vm. How was the light artifact handled,
    and was dVm/dt smoothed?
- kind: methods_unavailable
  statement: For the authors. Which tracked whisker series is the principal whisker in the files with
    two series, and was the touch-speed cutoff of compute_touchNWB.m (prct_speed 2.5) applied in the paper's
    analyses? Was the first touch of a trial tagged passive used as the trial's first touch in the ROC
    analysis of Fig. 8f,g? The correlation of enphr-auc is significant with it (p = 0.038) and not without
    it (p = 0.09).
- kind: metadata_error
  statement: The cell list (docs/yu_gutnisky_CellList.xlsx, sheet AllCellsReported) does not name JY1268,
    which the cell-attached L4 E folder holds with eNpHR light trials; its "Extracellular units" section
    has 47 rows against 48 files. It lists JY0781 among the PV-IRES-Cre L4 E neurons, though that file
    holds no photostimulus series.
