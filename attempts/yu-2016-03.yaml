- claim: thalamus-inhibition-l4e-vm
  outcome: partially_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:thalamus-inhibition-l4e-vm
  assumed: true
  measured:
  - 4.8
  - 2.6
  notes: In the light period, Vm outside touch is lower in all 13 neurons (median -2.99 mV, p = 0.00024),
    and the 10 Hz high-passed variance falls to 0.59 of control (p = 0.00024). The rule as written crosses
    at the onset sample (0.0 ms), where dVm/dt is -295 and -392 mV/s. With 1 ms smoothing and a 1 ms hold,
    the thalamic latency is 4.8 ms (13 neurons) and the cortical one 2.6 ms (8 neurons). The thalamic
    latency is longer, and the cortical one is within tolerance. Over smoothing windows of 0.5 to 2 ms
    and holds of 0.5 to 2 ms, the thalamic latency is 4.5 to 5.0 ms and the cortical 2.0 to 2.7 ms; the
    thalamic one is always longer and no window puts both within tolerance.
  deviations:
  - The latency rule is read with 1 ms smoothing and a 1 ms hold, so that the step the light makes at
    the onset sample is not taken as the response. This is an assumption; the rule as written gives 0
    ms for both.
  - Direct cortical activation trials are those with only the vS1 473 nm series on, in VGAT-ChR2 mice
    (8 neurons with an average; the paper has 7).
  - 13 neurons, where the paper has 12.
