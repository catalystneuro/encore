outcomes:
- claim: table2-trial-counts
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_rouse_2015.ipynb
  output: claim:table2-trial-counts
  notes: The file of session L20120928 (held-in-calib) holds 412 trials, all rewarded, numbered 201 to
    673 (one stored as 127) and spanning 53.3 of the session's 86.2 minutes; the paper gives 768 trials,
    717 successful and 685 analyzed. The file holds no failed trials, so neither the total nor the analyzed
    count can be formed, and it holds a part of the successful ones, the part released as the FALCON calibration
    split. If every number absent inside 201 to 673 were an error trial, the span would hold 473 trials,
    412 successful and 387 with the preceding number present; this is not a count of the session. Monkeys
    X and Y are not in the dandiset.
  deviations:
  - Only the held-in-calib file of the session is counted; the minival file repeats its first two trials.
- claim: table2-movement-time
  outcome: not_reproduced
  notebook: reproduce_rouse_2015.ipynb
  output: claim:table2-movement-time
  measured:
  - 200.0
  notes: Monkey L only. Median contact_time minus move_onset_time over the 412 successful trials of session
    L20120928 in the file is 200 ms (quartiles 160 and 240 ms), against 255 ms (225, 295) with tolerance
    229.5 to 280.5 ms; 41 samples from M to C against 52. The approximation of the analyzed trials (preceding
    trial number present, 387 trials) gives the same 200 ms. Event times lie on a 20 ms grid. Medians
    by object run from 160 ms (perpendicular cylinder) to 280 ms (button), and by location from 160 ms
    (157.5 degrees) to 300 ms (0 degrees); the other three monkey L sessions of the dandiset give 180
    to 200 ms. Monkeys X and Y are not in the dandiset, so their medians, the difference among monkeys
    and the Kruskal-Wallis test cannot be tested, and the claim is judged on the one median that can.
    The dandiset does not say how move_onset_time was found; an onset defined differently from the paper's
    marker-speed threshold would explain the difference, and the data cannot show which, as they hold
    no kinematics.
  deviations:
  - The dataset's move_onset_time and contact_time are used, as the claims file directs when the dataset
    gives onset times; the paper's onset (average speed of 36 markers above 5 SD of a baseline, Methods,
    Temporal Normalization) cannot be recomputed without markers.
  - Event times are at 20 ms resolution, where the paper's onset is at 5 ms and contact at 1 ms.
  - Only 412 of the session's 717 successful trials are in the dandiset; reading (a), the analyzed trials,
    is approximated by the trials whose preceding trial number is present, as the error trials are absent.
  - Monkey L only; X and Y are not in the dandiset.
- claim: fig2-trial-count-coax-45
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_rouse_2015.ipynb
  output: claim:fig2-trial-count-coax-45
  notes: The file holds 19 successful trials of the coaxial cylinder (obj_id 1) at 45 degrees, 16 with
    the preceding trial number present, against 28 in the paper. It holds 412 of the session's 717 successful
    trials (57%), and 57% of 28 is 16, so the count of the whole session cannot be taken from it. The
    object is named from obj_id by the apparatus order of the Fig. 1 legend; tgt_obj does not name the
    grasped object (notebook, data check).
  deviations:
  - The name of obj_id 1 (coaxial cylinder) is inferred from the order of the objects in the paper's Fig.
    1 legend and the locations at which each code occurs; the files do not name the codes.
