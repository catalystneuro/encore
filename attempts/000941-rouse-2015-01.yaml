findings:
- kind: data_missing
  statement: The dandiset holds no kinematic data. The paper's findings are about 22 joint angles computed
    from 36 markers tracked at 200 frames/s, and no file holds a marker position, a joint angle or any
    other kinematic series; the files hold trial tables, 16 channels of EMG at 50 Hz, an evaluation mask
    and multiunit spike times. 23 of the 26 claims are blocked for this reason.
- kind: data_missing
  statement: Only monkey L is in the dandiset. The paper's monkeys X (session X20121219) and Y (Y20130516)
    are not; the description points to dandiset 001209 for another monkey, which holds monkey X (with
    session 20121219 in its held-out-calib split) and had no published version when read.
- kind: selection_undocumented
  statement: The paper's session L20120928 is in the dandiset only in part. Its held-in-calib file holds
    412 trials, all rewarded, numbered 201 to 673 and spanning 53 of the session's 86 minutes, where the
    paper reports 768 trials and 717 successes. Within 201 to 673, 61 numbers are absent in gaps of 1
    to 15; the files do not say which trials were left out, or why (errors, or trials held back for the
    benchmark's evaluation). The result column, described as success, failure or abort, holds R in every
    trial of every file.
- kind: metadata_error
  statement: tgt_obj, described as the object to grasp at the target, does not name the grasped object.
    In session 20120928 it takes three values (Sphere, Button, Coaxial) in three runs of 118, 159 and
    135 consecutive trials, each value occurring with all four obj_id codes and every location. obj_id
    has four codes whose locations within each block are offset by multiples of 45 degrees, as the paper's
    apparatus has them, and the grasped object is decoded from EMG around contact at 0.99 with obj_id
    against 0.42 with tgt_obj (largest class 0.39).
- kind: metadata_insufficient
  statement: obj_id, the actual object code, has no names. From the paper's Fig. 1 legend (clockwise order
    perpendicular cylinder, coaxial cylinder, button, sphere, with 157.5 degrees leftmost) and the locations
    at which each code occurs, codes 2, 1, 4 and 3 are the perpendicular cylinder, coaxial cylinder, button
    and sphere; the names fit every constraint the legend states, but the files do not confirm them.
- kind: metadata_error
  statement: In each of the four held-in-calib files one trial carries the number 127 between trials 254
    and 256 or 257, in time order, where 255 (or 256) is expected; 127 is the largest signed 8-bit integer.
    In session 20120927 a second trial, the first of the file, is also numbered 127, so the number does
    not identify a trial there.
- kind: metadata_insufficient
  statement: The event times move_onset_time, contact_time and reward_time are not defined, and all event
    times lie on a 20 ms grid. The median time from move_onset_time to contact_time in session 20120928
    is 200 ms, where the paper reports 255 ms for the same session, so the onset is likely defined differently
    from the paper's marker-speed threshold. reward_time follows contact by a median of 0.10 s (0 to 0.92
    s), where the paper's task requires a 1,000 ms hold before the reward. start_time and stop_time are
    exactly 1 s before the cue and 1 s after reward_time in every trial, a window, not the trial's start
    and stop.
- kind: other
  statement: Each held-in-minival file repeats the first two trials of the held-in-calib file of the same
    session (same trial numbers, event times, EMG timestamps and spike times on all 64 channels), as the
    description says. The EMG values of the two copies differ by a near-constant factor per file (0.955
    to 1.016), so each file's EMG was scaled on its own, and the same recording has two different EMG
    amplitudes in the dandiset.
