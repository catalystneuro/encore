- claim: fig2a-16way-decoding
  outcome: partially_reproduced
  notebook: reproduce_schuck_2016.ipynb
  output: claim:fig2a-16way-decoding
  measured: 8.93
  notes: 16-way accuracy 8.93% with maps z-scored by voxel (t23 = 3.18, one-sided p = 0.0021,
    two-sided p = 0.0041) and 8.92% by map (one-sided p = 0.00037), above chance but outside the
    10.98 to 13.42% of the tolerance. With state regressors rebuilt from the event files, 9.57% and
    9.19%. Above chance in 15 and 16 of 24 participants. Under the two readings of O3, rebuilt from the
    error blocks, 8.97% and 9.38% (voxel) and 8.37% and 8.10% (map), all above chance (one-sided p <=
    0.0045) and below tolerance.
  deviations:
  - No spatial smoothing of the beta maps (O1); the files hold no voxel coordinates.
  - The data set's GLM nuisance set (four drift terms, six motion parameters) without the paper's 26
    cardiac regressors (O5), and the data set's AFNI design matrices in place of SPM8's.
  - The data set's 'err' column follows a short event at each block onset, so with its columns the
    trials inside a block after the error trial are in no regressor, neither reading of O3. Both
    readings are rebuilt from the error blocks, (a) the 'err' column with a separate boxcar from onset
    + 4.5 s (the mean trial duration, Methods, Task) to the end of the block, (b) one 'err' boxcar over
    the block, and give the same outcome.
  - 24 of the 27 participants.
- claim: fig2-two-back-state-space
  outcome: partially_reproduced
  notebook: reproduce_schuck_2016.ipynb
  output: claim:fig2-two-back-state-space
  measured: 5.96
  notes: The two-back space decodes worse than the hypothesized one, but no reading meets both parts
    of the criterion. With maps z-scored by voxel, it is lower (5.96% against 8.93%, t23 = -3.75, p =
    0.001; reading b 6.17%, p = 0.003; against the hypothesized space rebuilt from the events, 9.57%,
    p = 6e-5 and 0.0003), but at chance, below the 7.29 to 8.91% of the tolerance. With maps z-scored
    by map, 7.88% in both readings, within tolerance, but not significantly lower (p = 0.13 and 0.14;
    0.070 and 0.073 against the rebuilt space). 334 (a) and 295 (b) of 11071 labelled trials were left
    out as nuisance. Changed from not_reproduced after verification round 1.
  deviations:
  - Two-back regressors are rebuilt from the RT event files with SPM's canonical HRF, shifted by -0.6
    s, at which rebuilt state columns match the data set's (r 0.983 to 1.0).
  - Same unsmoothed maps and nuisance set as fig2a-16way-decoding.
