- claim: behavior-error-rate
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_schuck_2016.ipynb
  output: claim:behavior-error-rate
  notes: The event files do not record the number of errors. Each 'err' event is a block that starts
    at an error trial and runs over its repetitions and often the trials after it (spans 6.8 to 41 s).
    Counting one error per block gives a mean of 1.92% (all trials with one repetition per error) or
    1.98% (96 trials per run), outside the 2.07 to 2.53% of the tolerance; counting every designed
    trial inside a block as an error gives 3.10%. The paper's 2.3% lies between these bounds, so the
    value cannot be decided. Time-outs cannot be told from errors, so the criterion's two readings
    on time-outs give the same count. The data set holds 24 of the 27 participants. Measured in trial
    slots, 82 of the 172 blocks after an Exit trial span about two (an error and its repetition) and
    most others three to five; a least-squares fit over runs gives 1.52 designed trials per block after
    an Exit trial and 1.87 per other block, so a block after an Exit trial holds on average about half
    a designed trial besides the error trial (0.52) and another block close to one (0.87); that trial
    may be a second error or a correct trial after the error. The 'err' RT-file
    duration runs to the last response of the block.
- claim: supp-errors-by-trial-class
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_schuck_2016.ipynb
  output: claim:supp-errors-by-trial-class
  measured:
  - 4.79
  - 0.0
  - 1.2
  notes: The class effect is present and the rates do not match. Error rates differ by class (linear
    mixed model chi2(2) = 63.8, p = 1.4e-14; logistic variant chi2(2) = 73.0) and the Enter rate is
    higher than the other two classes together in all 24 participants, but the Enter rate is 4.79%
    against 3.4 +/- 0.34. Errors after an Exit trial (Enter errors) are 181 of 225 error blocks
    after a run's first trial; the 44 others are Internal or Exit errors whose class the files do not
    give, so Exit and Internal together are 0.60%, and given all 44 errors one class reaches at most
    1.18% (Exit) or 1.20% (Internal) (measured gives them all to Internal, the first assignment shown). Neither Exit (2.3%) nor Internal (1.4%)
    can reach its expected value, and their order cannot be told. One error is counted per block, a
    lower bound, so the Enter rate can only be higher. Blocks after an Exit trial are 79% of blocks,
    where the paper's class rates imply that Enter errors are 48% of errors, so Internal and Exit errors
    may be undercounted or merged into blocks. Changed from not_reproduced after verification round 1.
  deviations:
  - Assumed that each block holds one error and that its class follows from the trial before the block
    (Enter after an Exit trial, Methods, Task); the files do not record either or, where every block of a run holds one designed trial, from the reconstructed
    state; the paper had the trial's own label.
  - The logistic reading (b) uses participant fixed effects, as statsmodels has no frequentist
    logistic mixed model; reading (a) uses statsmodels' MixedLM in place of lmer.
- claim: supp-errors-stable-over-blocks
  outcome: reproduced
  assumed: true
  notebook: reproduce_schuck_2016.ipynb
  output: claim:supp-errors-stable-over-blocks
  notes: Run effect on per-run error rates, random intercept and slope by participant, slope -0.11
    percentage points per run, chi2(1) = 1.44, p = 0.23 (paper chi2(1) = 0.08, p = .77); logistic
    variant p = 0.22. Mean rates per run 1.94, 2.35, 2.27, 2.01, 1.51%.
  deviations:
  - Assumed, as for supp-errors-by-trial-class and fig4a-decoding-error-correlation, that each error
    block holds one error, a lower bound (see behavior-error-rate); the files do not record the number.
  - statsmodels' MixedLM in place of lmer; the logistic variant uses participant fixed effects.
- claim: supp-errors-not-by-age-category
  outcome: reproduced
  assumed: true
  notebook: reproduce_schuck_2016.ipynb
  output: claim:supp-errors-not-by-age-category
  notes: On Enter trials whose current age is known (labelled Enter trials and 98 reconstructed Enter
    errors), category p = 0.41, age p = 0.63, interaction p = 0.95 (logistic variant p = 0.44, 0.61,
    0.88). The category alone, over all trials and the 224 errors whose category is known, p = 0.23
    (faces 1.82%, houses 2.22%).
  deviations:
  - The current age of an error trial is known only for Enter errors whose block spans two trials
    (error and repetition), under the span reading of `ofc4.error_trials`; the test of age and the
    interaction is therefore made on Enter trials only. This reading is an assumption about the
    content of the error blocks, which the files do not describe.
