- claim: fig4b-error-trial-drop
  outcome: not_reproduced
  notebook: reproduce_schuck_2016.ipynb
  output: claim:fig4b-error-trial-drop
  measured:
  - 8.02
  - 1.59
  notes: With maps z-scored by voxel, the first volume at or after onset + 4.8 s, and the span reading
    of error states (81 errors, 21 participants), five preceding trials 8.02% against error trials
    1.59%, t20 = 1.99, p = 0.061; with the strict reading (37 errors, 16 participants) p = 0.18. Both
    values are outside tolerance. With maps z-scored by map, error trials decode better than the
    trials before them (7.70% against 5.67%). No reading gives p < 0.05. Every error trial with a state
    is an Enter trial, and correct Enter trials decode at 0.90% by voxel (Exit 11.79%, Internal 14.30%),
    as that classifier names an Enter state on 5.60% of labelled volumes where 50% would be unbiased,
    so the comparison with the mixed-class trials before an error is confounded by class.
  deviations:
  - Volumes unsmoothed (no coordinates), where the Methods smooth them at 3 mm.
  - Only Enter errors can be given a state, from the neighbouring trials; the paper had every error
    trial's state.
- claim: fig4b-decline-before-errors
  outcome: not_reproduced
  notebook: reproduce_schuck_2016.ipynb
  output: claim:fig4b-decline-before-errors
  notes: With maps z-scored by voxel, the error slope over trials -5 to 0 is negative but not
    significant in any reading (smallest p = 0.32), nor is the interaction. With maps z-scored by map
    and the nearest volume, slope and interaction are significant but positive (span reading, matched
    courses a, 1.47 percentage points per trial, p = 0.039, interaction p = 0.030), the opposite of the
    claim. Position 0 is always an Enter trial and position -1 an Exit trial, so the course also
    reflects how each class decodes.
  deviations:
  - Most random-slope fits did not converge in statsmodels; the random-intercept model is reported in
    their place, as the notebook marks; one singular random-intercept fit is left out.
  - As fig4b-error-trial-drop for smoothing and error states.
- claim: fig4b-error-vs-matched
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_schuck_2016.ipynb
  output: claim:fig4b-error-vs-matched
  notes: Matched to their class, error trials do not decode worse. Every error trial with a state is
    an Enter trial, and correct Enter trials decode at 0.90% with maps z-scored by voxel, against 11.79%
    for Exit and 14.30% for Internal trials. Error trials 1.59% against 1.42% at position 0 of matched
    courses (a) with an Enter trial there (t20 = 0.18, one-sided p = 0.57), and against 0.88% on all
    correct Enter trials (p = 0.68); p >= 0.45 in every reading. The criterion's readings, which do not
    match class, differ. With maps z-scored by voxel and matched courses (a), error trials are lower
    (1.59% against 9.21%, t20 = -4.07, one-sided p = 0.0003; strict reading 2.08% against 8.93%, p =
    0.005); with one matched course per error (b) p = 0.044 to 0.14; with maps z-scored by map the
    error trial is not lower (p >= 0.69). Trial -1 is not lower by voxel (11.59% against 8.81%,
    one-sided p = 0.70; paper p = 0.07). 21 participants, so t20 where the paper gives t24. With maps
    z-scored by voxel, reading (c) is at floor (1.59% against 1.42% and 0.88%, below the 6.25% chance
    level), because that classifier names an Enter state on 5.60% of labelled volumes, and could not
    show a drop. The reading that could is the map z-scoring, where labelled Enter trials decode at
    8.02%, and there the error trial is not lower under the criterion's readings (p >= 0.69) or under (c)
    (p >= 0.45). Changed from reproduced after verification round 1.
  deviations:
  - Assumed a class-matched comparison, reading (c), position 0 against matched courses whose position
    0 is an Enter trial. The criterion's matched courses (a) and (b) do not match class; the paper's
    error trials were of all three classes and its matched courses of the same mix, while here only
    Enter errors can be given a state, so only a class-matched comparison compares like with like.
    That the paper's matched courses had the class mix of its error trials is an inference; the Figure
    4B legend says only "seven consecutive trials with no behavioral error".
  - As fig4b-error-trial-drop for smoothing and error states.
- claim: fig5-similarity-predicts-errors
  outcome: not_reproduced
  notebook: reproduce_schuck_2016.ipynb
  output: claim:fig5-similarity-predicts-errors
  notes: No reading gives a negative regression of error rate on pattern correlation at p < 0.05. Over
    the eight transition types the slope is negative but not significant (p = 0.08 to 0.37); over
    ordinal positions it is positive where significant (strict errors, p = 0.049 raw and 0.039 voxel
