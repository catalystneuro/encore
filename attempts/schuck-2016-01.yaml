findings:
- kind: metadata_insufficient
  statement: The 'err' events are blocks that start at an error trial and run over its repetitions
    and often the trials after it (spans 6.8 to 41 s), and the data descriptor does not say so. The
    number of errors, time-outs, error reaction times and the state of most error trials cannot be
    read from the files; the class is known for 181 of 228 blocks and the full state for 39 to 98.
- kind: metadata_error
  statement: The 'err' column of the design matrices does not follow the error blocks' RT or stimulus
    durations (r 0.30 to 0.76) but a short event at each block onset (r 0.83 to 0.98); the descriptor
    says the design matrices are boxcars from stimulus onset to button press.
- kind: metadata_insufficient
  statement: The OFC time series carry no voxel coordinates or mask (each run file holds only
    OFC_timecourse, TR, condition_label, design_matrix_task, n_TR, n_voxel and nuisance_timecourse), so spatial smoothing, searchlights
    and any spatial analysis cannot be done, and voxels can be taken to be the same across runs only
    from their equal counts.
- kind: data_missing
  statement: The data set holds 24 of the paper's 27 participants and the OFC only. The training
    session, whole-brain data, the hippocampus, DLPFC and PPA/FFA regions, the cardiac regressors and
    each trial's response mapping and response side are not in it; five of the paper's claims are
    blocked for missing data.
- kind: other
  statement: Enter errors (after an Exit trial) are 181 of 225 error blocks after a run's first trial
    (79% of all blocks, where the paper's class rates imply 48%), an Enter error rate of 4.79% against
    at most 1.2% for the other two classes together, where the paper reports 3.4%, 2.3% and 1.4%.
- kind: format_error
  statement: In Subj-01 run 4 a 'HoHy' trial follows a 'HoHy' trial, which the task rules do not
    allow; every other pair of adjacent labelled trials chains.
- kind: metadata_insufficient
  statement: Three runs (Subj-11 run 3, Subj-18 runs 4 and 5) have no 'first' event or column, as their
    first trial was an error; the descriptor mentions only runs without an 'err' column.
- kind: paper_inconsistency
  statement: The Figure 1B legend says errors on Internal and Exit trials led to a repetition of the
    preceding trial, while the Methods (Task) say Internal and Enter trials were repeated and only
    Exit errors led to the preceding trial. The data show long blocks after Internal and Exit errors,
    consistent with the legend, but cannot settle it.
- kind: methods_unavailable
  statement: Question for the authors. How were the beta maps z-scored within each run (each voxel
    across the state maps, or each map across voxels) and with what kernel were they smoothed? The
