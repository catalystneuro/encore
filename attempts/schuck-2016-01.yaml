    mixed model gives p >= 0.24 (paper 0.08).
  deviations:
  - Transition error rates use only the Enter errors whose state is reconstructed (98 span, 39
    strict); 83 Enter errors whose current age is unknown are left out.
  - NaN correlations (negative ones) rank lowest in the ordinal reading, a choice the paper does not
