- claim: fig4a-decoding-error-correlation
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_schuck_2016.ipynb
  output: claim:fig4a-decoding-error-correlation
  measured: -0.268
  notes: With maps z-scored by voxel, r = -0.268 (t22 = -1.30, p = 0.21; bootstrap 95% CI -0.717 to
    0.338 with 10000 resamples, -0.700 to 0.327 with 1000), inside the paper's CI but outside the
