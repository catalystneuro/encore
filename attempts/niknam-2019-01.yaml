    platform: GitHub Actions
    url: https://github.com/catalystneuro/encore/actions/runs/42964393998
inputs:
- what: RF, FF and ST probe of each neuron (probe_list of assets/data/main_lists.mat); the file's other, undocumented
    tables (nuron_list, nsglm_list, twobm_list, gauss_list, aggat_list) are shown for reference and decide no outcome.
    The repository's copies of the neuron files are compared with the CRCNS files.
  source: https://github.com/nnategh/SFA-Models at commit 1438dde9dd3207348ec0df1e5c4dd2a7b014e68e
outcomes:
- claim: probe-locations-link
  outcome: reproduced
  notebook: reproduce_niknam_2019.ipynb
  output: claim:probe-locations-link
  notes: All 41 files match a probe_list row by session and channel, and all 41 rows have a file. The RF recomputed
    by D1 with onsets is the listed RF for 38 neurons and a neighbour for the other 3 (41 of 41; also 41 with every-ms
    presentations). FF minus RF offsets are (-3, 0) for 26 neurons, (-2, 0) for 1 and (2, 0) for 14, giving 27 leftward
    and 14 rightward neurons. The neuron files in the code repository are identical to the CRCNS files in all four
    variables.
- claim: methods-neuron-counts
  outcome: reproduced
  notebook: reproduce_niknam_2019.ipynb
  output: claim:methods-neuron-counts
  measured:
  - 41
  - 11
  - 27
  - 14
  notes: 41 neurons in 11 sessions (first 8 digits of the file name); by the sign of the listed FF minus RF offset,
    27 neurons from 9 sessions are leftward and 14 from 2 sessions (20151214, 20151215) rightward, and each session
    has one direction. Per-session counts match the data descriptor. The 49 isolated units cannot be checked; the
    8 discarded are not in the data set, as the descriptor says.
  deviations:
  - Saccade direction is not in the data set; it is read from the code's probe_list, as the criterion says.
- claim: fig1b-saccadic-suppression
  outcome: reproduced
  notebook: reproduce_niknam_2019.ipynb
  output: claim:fig1b-saccadic-suppression
  measured:
  - 8
  - 2.235
  - 1.239
  notes: 'Under O1 b with onsets, 8 neurons are significant, and their normalized RF response over 50-75 ms falls
    from 2.235 +- 0.291 to 1.239 +- 0.183 (O4 a), both within tolerance near its lower edge; the O4 b peaks are
    2.541 and 1.530. Reading O1 a cannot be tested. The 8 neurons come from 5 sessions, with p 0.0002 to 0.043.
    They are only partly the paper''s: the code''s undocumented nuron_list also marks 8 suppressed neurons, and
    5 of them are among these 8 (35 of 41 neurons agree). Variants: unpaired with onsets 9 neurons (2.291 to 1.297);
    signed-rank over time bins of mean counts 13 and of smoothed curves 15; with every-ms presentations 4 to 16
    neurons.'
  deviations:
  - 'Pairing by trial (O1 a) cannot be tested: no trial in any session shows the same probe in both the fixation
    and the perisaccadic window, as a probe returns only after a pass through the whole order (median 562 to 604
    ms between repeats per session). The outcome rests on pairing by condition (O1 b), the other reading the criterion
    lets decide.'
  - Presentations are the first ms of each run of a probe code (O2 i); runs of 14 or 21 ms count once, as such a
    run takes one place in the probe order (session 20150717, data check). Windows are taken inclusive at 1 ms,
    as get_mean_resp.m indexes t:t+window, a standard choice. Saccade onset is sample tsaccade in MATLAB's 1-based
    indexing, as select_bases.m reads it (tsaccade(i) + times).
- claim: fig1c-ff-remapping
  outcome: not_reproduced
  notebook: reproduce_niknam_2019.ipynb
  output: claim:fig1c-ff-remapping
  measured:
  - 8
  - 0.792
  - 1.609
  notes: Under O1 b with onsets 8 neurons show FF-remapping (paper 23), with the normalized late FF response rising
    from 0.792 +- 0.037 to 1.609 +- 0.111 (paper 0.90 to 1.30); the rise is there but none of the three numbers
    is within tolerance, so the partial rule (direction and one number) is not met. Reading O1 a cannot be tested.
    No variant reaches the count (9 to 19 neurons). The closest, the signed-rank test over time bins of the smoothed
    curves with onsets (19 neurons, 0.885 to 1.411) and the unpaired and time-bin tests with every-ms presentations
    (17 neurons, 0.888 or 0.889 to 1.427 or 1.430), have only the fixation value within tolerance; they are outside
    O1 or O2 i and do not decide. The code's nuron_list marks 23 FF neurons; 26 of 41 neurons agree with it under
    O1 b. Whether O1 should hold a pairing over time bins is asked of a reader (questions/niknam-2019.yaml).
  deviations:
