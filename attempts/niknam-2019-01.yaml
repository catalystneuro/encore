- claim: fig1-remapping-longer-latency
  outcome: reproduced
  notebook: reproduce_niknam_2019.ipynb
  output: claim:fig1-remapping-longer-latency
  notes: 'The smoothed (FWHM 13 ms) neuron-averaged fixation RF response of all 41 neurons peaks at 62 ms; the perisaccadic
    FF response of the FF-remapping neurons peaks at 108 ms and the ST response of the ST-remapping neurons at 99
    ms under O1 b with onsets. Every testable reading gives RF 59-62 ms, FF 103-108 ms and ST 96-128 ms. The remapped
    peaks are not an independent test: the neurons are selected for an increase 80-150 ms after onset, which pulls
    the averaged peak into that window, and single-neuron peaks are spread (FF 12 to 150 ms, ST 0 to 150 ms). The
    RF peak, over all 41 neurons with no selection, is the part that does not depend on the selection. The selected
    populations are smaller than the paper''s (8 and 11 neurons).'
  deviations:
  - 'Pairing by trial (O1 a) cannot be tested: no trial in any session shows the same probe in both the fixation
    and the perisaccadic window, as a probe returns only after a pass through the whole order (median 562 to 604
    ms between repeats per session). The outcome rests on pairing by condition (O1 b), the other reading the criterion
    lets decide.'
  - Presentations are the first ms of each run of a probe code (O2 i); runs of 14 or 21 ms count once, as such a
    run takes one place in the probe order (session 20150717, data check). Windows are taken inclusive at 1 ms,
    as get_mean_resp.m indexes t:t+window, a standard choice. Saccade onset is sample tsaccade in MATLAB's 1-based
    indexing, as select_bases.m reads it (tsaccade(i) + times).
  - The measure (peak latency of the smoothed population response) is the criterion's; the paper states the latencies
    from its figure.
- claim: fig1-example-neurons
  outcome: partially_reproduced
  notebook: reproduce_niknam_2019.ipynb
  output: claim:fig1-example-neurons
  notes: 'With onsets, three of four examples are matched on both values and a significant D2 test under O1 b: FF
    example 2015071702 (7.83 to 18.96 spk/s, p 0.017), ST example 2015092707 (23.61 to 64.64, p 0.0059), example
    with both 2015051115 (FF 15.76 to 39.10, p 0.00063; ST 16.05 to 36.17, p 0.00037). Perisaccadic means equal
    the paper''s to the second decimal for 64.64, 39.10 and 36.17, so these are likely the paper''s neurons. No
    neuron matches the RF example; 2015092709 has the paper''s perisaccadic 40.49 +- 12.64 but a fixation rate of
    56.94 +- 2.71 against 60.89 +- 2.82, and p 0.49 under O1 b (0.02 unpaired); fixation windows starting -560 to
    -440 ms and ending -160 to -40 ms give it 53.87 to 59.68, never 60.89. With every-ms presentations (variant)
    2015083106 matches the RF example. The paper''s p < 0.001 holds under O1 b only for the example with both effects;
    the unpaired test gives p 0.00011 or less for all three matched examples. Their fixation rates differ from the
    paper''s by 0.07 to 0.19 spk/s with SEs equal within 0.01, and no single fixation window in the scan matches
    all three (closest -495 to -100 ms, within 0.054 spk/s); the paper''s fixation set is not identified.'
  deviations:
  - 'Pairing by trial (O1 a) cannot be tested: no trial in any session shows the same probe in both the fixation
    and the perisaccadic window, as a probe returns only after a pass through the whole order (median 562 to 604
    ms between repeats per session). The outcome rests on pairing by condition (O1 b), the other reading the criterion
    lets decide.'
  - Presentations are the first ms of each run of a probe code (O2 i); runs of 14 or 21 ms count once, as such a
    run takes one place in the probe order (session 20150717, data check). Windows are taken inclusive at 1 ms,
    as get_mean_resp.m indexes t:t+window, a standard choice. Saccade onset is sample tsaccade in MATLAB's 1-based
    indexing, as select_bases.m reads it (tsaccade(i) + times).
  - Rates are mean spike counts per ms over the window times 1000, SE across presentations (the criterion's measure).
- claim: fig3-example-trial-predictions
  outcome: blocked
  blocked_by: too_large
  notebook: reproduce_niknam_2019.ipynb
  output: claim:fig5a-s-model-perisaccadic-better
  notes: 'Needs the S-model fitted per neuron (D4) and the F-model. The notebook ports the parameter selection of
    select_bases.m and times it on one neuron and probe: 290,628 stimulus-basis parameters and 58,125,600 single-parameter
    fits per neuron. The port took 2.2 to 6.7 ms per fit in the runs of this attempt, 345 to 1,040 hours on 4 CPUs
    for the selection step of the 41 neurons, far over the 60 minute notebook limit and the five hours of an author
    run. A fully batched port, not written here, would need at least 11.5 to 27.5 CPU hours (2.9 to 6.9 hours on
    4 CPUs) for one selection per neuron, before the full S-model fit and the other models the claim needs. Not
    run beyond that benchmark; no model was fitted.'
- claim: fig5a-n-model-no-perisaccadic-gain
  outcome: blocked
  blocked_by: methods_underspecified
  notes: Needs the N-model, which the paper describes only as the model of ref [48] (Methods, Model evaluation,
    "as detailed in [48]") and the Results paragraph on Fig 4. The reference list is not in the text read, the code
    repository holds no N-model, and main_lists.mat has only its per-neuron classification (nsglm_list). The claims
    file (O8) blocks the claim when ref [48] cannot be identified. Fitting any such model for 41 neurons would also
    meet the cost of the S-model claims. After the round-2 verification, ref [48] was identified from the version
    of record's reference list as Akbarian et al. (2018), IEEE Trans Biomed Eng 65(2):241-253, doi:10.1109/TBME.2017.2762687
    (open as PMC5796416). That paper describes the N-model (stimulus, gain, offset and post-spike kernels on raised-cosine
    bases, fitted by coordinate descent with cross-validated ridge and L1 penalties) but gives no code. This attempt
    did not implement it, so the claim stays blocked as verified; a later attempt can test it with the N-model taken
    from that paper, as O8 says.
