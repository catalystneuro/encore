- claim: figs1-rf-centres
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Converting grid positions to dva needs each session's grid position and probe spacing. The files hold only
    probe codes on the 9 x 9 grid, the data descriptor gives no geometry, the code repository has none (get_info.m
    gives only the 9 x 9 size), and the paper gives only the ranges of grid extent and spacing (Methods, paragraph
    1).
findings:
- kind: metadata_insufficient
  statement: The data set does not give the saccade direction of each session, each neuron's RF, FF and ST probe,
    the position and spacing of the probe grid in each session, or which of the two monkeys each session comes from.
    The probes are only in main_lists.mat of the paper's code repository, and the grid geometry is nowhere, so the
    RF centres of S1 Fig cannot be computed.
- kind: metadata_error
  statement: The paper and the descriptor say each probe lasted 7 ms with exactly one probe on screen at each time,
    and that "In each condition, a complete sequence of 81 probe stimuli was presented throughout the length of
    a trial." In the files 91.5% of probe runs last 7 ms, 5.6% last 6 ms, most others 14 or 21 ms and a few 8 to
    28 ms, and the sequences contain gaps of 7 to 28 ms with no probe (code 0), nearly all of 10, 11, 20 or 21 ms.
    The probe order holds 75 codes in session 20150511 and 80 in 20150927 and 20150929. In every session but 20150717
    the order restarts from its first probe 35 to 296 ms after saccade onset in most trials, so each probe is shown
    2 to 4 times per trial. The arrays are 3000 ms long with probes until 1468 to 2371 ms, while the paper gives
    trials of 2100 to 2300 ms.
- kind: methods_unavailable
  statement: 'The Methods test each effect with a one-sided Wilcoxon signed-rank test but do not say what is paired.
    Pairing by trial is impossible in these data, as no trial shows the same probe in both windows; pairing by condition
    gives 8 suppressed, 8 FF-remapping and 11 ST-remapping neurons against the paper''s 8, 23 and 37. An unpaired
    test on every millisecond a probe is on gives 12, 17 and 31, and a signed-rank test over the 1 ms bins of the
    smoothed response curves gives 15, 19 and 34. Question for the authors: which presentations, pairs and test
    produced the classification of Figure 1 (and the nuron_list of main_lists.mat)? The example neurons'' fixation
    rates also differ slightly from the paper''s while their perisaccadic rates match (RF example 56.94 against
    60.89 spk/s; FF, ST and both-effects examples 0.07 to 0.19 spk/s lower), and no single fixation window between
    -560 to -440 ms and -160 to -40 ms matches them all, so the fixation set used for Figure 1 is not the -500 to
    -100 ms the Methods give, or not only that.'
- kind: metadata_insufficient
  statement: main_lists.mat in the code repository holds five 41 x 6 tables besides probe_list (nuron_list, nsglm_list,
    twobm_list, gauss_list, aggat_list) that no code reads and nothing documents. Their column sums match the paper's
    counts (nuron_list 8, 23, 23 and 37; aggat_list and nuron_list together 7, 18, 20 and 24, against the paper's
    7, 20 and 24 for the A-model), so they appear to be the per-neuron classifications of Figures 1, 5 and 6.
- kind: methods_unavailable
  statement: 'The N-model of Figure 5 is described only by reference [48], Akbarian et al. (2018), IEEE Trans Biomed
    Eng 65(2):241-253, doi:10.1109/TBME.2017.2762687 (open as PMC5796416), and the code repository holds no code
    for it, nor for the Wilcoxon and McNemar tests, the partial F-models, the prevalence maps or the detectability
    analysis. Question for the authors: is there code for the N-model as fitted here?'
