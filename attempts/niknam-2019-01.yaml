    lets decide.'
  - Presentations are the first ms of each run of a probe code (O2 i); runs of 14 or 21 ms count once, as such a
    run takes one place in the probe order (session 20150717, data check). Windows are taken inclusive at 1 ms,
    as get_mean_resp.m indexes t:t+window, a standard choice. Saccade onset is sample tsaccade in MATLAB's 1-based
    indexing, as select_bases.m reads it (tsaccade(i) + times).
- claim: fig1d-st-remapping
  outcome: not_reproduced
  notebook: reproduce_niknam_2019.ipynb
  output: claim:fig1d-st-remapping
  measured:
  - 11
  - 0.749
  - 1.629
  notes: 'Under O1 b with onsets 11 neurons show ST-remapping (paper 37), rising from 0.749 +- 0.046 to 1.629 +-
    0.112 (paper 0.83 to 1.35); no number within tolerance. Reading O1 a cannot be tested. The outcome depends on
    the pairing: a signed-rank test over the 1 ms bins of the smoothed response curves gives 34 neurons, 0.815 to
    1.365, all three numbers within tolerance, and agrees with the code''s nuron_list on ST for 36 of 41 neurons
    (15 under O1 b). The Methods exclude that test (statistics on spike counts, "not estimates of firing rate")
    and the claims file does not list it, so it does not decide; whether O1 should hold a pairing over time bins
    is asked of a reader (questions/niknam-2019.yaml). On mean counts per bin the time-bin test gives 16 neurons
    with onsets and 29 with every-ms presentations (0.819 to 1.383); the unpaired test with every-ms presentations
    gives 31 (0.823 to 1.369). The ST probe is taken from probe_list, whose selection used the same perisaccadic
    increase.'
  deviations:
