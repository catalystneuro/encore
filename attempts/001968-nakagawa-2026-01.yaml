- kind: data_missing
  statement: The unit files hold spike times only. No odor onset, trial type, lick or trial table is in any
    file, so no unit can be aligned to the task, and the 13 claims on cue responses, population trajectories,
    similarity and decoding cannot be tested.
- kind: data_missing
  statement: No waveforms or spike widths are in the unit files, only an RS or FS label in each source file
    name, so the paper's narrow, regular and wide spiking classes cannot be formed.
- kind: data_missing
  statement: The histology, the optogenetic and L-DOPA behaviour, the behaviour-only mice, the prelearning
    sessions and the behaviour of the tetrode mice are not in the dandiset. Photometry mouse 00163 of Supplementary
    Table 2 is missing.
- kind: metadata_insufficient
  statement: No file states genotype, age group or treatment. Strain appears only in the unit source file names
    (WT, AD, NLGF), the photometry files carry none, and the L-DOPA and saline mice are both labelled NLGF.
    The groups can be formed only from Supplementary Table 2 and Supplementary Fig. 2a.
- kind: metadata_error
  statement: The unit source file names label mice 01398 and 01431 as AD; the paper lists both as young WT
    (Supplementary Table 2, Supplementary Fig. 2a).
- kind: metadata_error
  statement: 'Mouse 00375''s units are deposited twice: 100 files named LEC_Sim1_..._Sum.mat, with genotype
    ''Sim1'' and age P205D, repeat the spike trains of its 99 regular files, one of them twice. The earlier
    published version 0.260913.1518 holds one of these copies only.'
- kind: format_error
  statement: sub-mouse02491/sub-mouse02491_ses-mouse02491-20250408_obj-8lnxe6.nwb holds no units table; its
    notes name the source file LEC_NLGF_mouse02491_250408_ABEF_RS_TT12_01.mat.
- kind: metadata_insufficient
  statement: The photometry files state no sampling rate, cue time, brain region, hemisphere or odor and action
    names, and call the trial columns dF/F with an unknown scale, while the columns are z-scored to their first
    1000 samples. The timing (1 kHz, cue at sample 1000) and the codes had to be inferred from the data and
    the source's own tables.
- kind: metadata_insufficient
  statement: Each photometry file holds one trace per session, while Supplementary Table 2 lists bilateral
    recordings in 7 of the 11 mice and the paper's units are hemispheres; the files do not say which hemisphere,
    or whether both were averaged.
- kind: metadata_error
  statement: Sex in the files differs from Supplementary Table 2 for 00265 (F against M), 00703 (F against
    M) and 00789 (M against F). The date of birth of 00789 makes it 1.3 to 1.6 months old at recording, below
    the paper's young range of 3 to 6 months.
- kind: paper_inconsistency
  statement: Supplementary Table 2 lists mice 247, 690, 703, 925 and 941 as young APP-KI and 789, 1199, 1253,
    1254 and 1517 as old APP-KI, while Supplementary Fig. 2a lists the second five as the young APP-KI mice.
    The files' birth dates agree with Supplementary Fig. 2a.
- kind: selection_undocumented
  statement: 'The dandiset holds more units than the paper reports: 635 against 479 for young WT, 860 and 778
    against 671 and 618 for old mice, 263 and 286 against 144 and 132 for the L-DOPA cohorts. Nothing marks
    which units the paper analysed (for example the double-counted cells it removed). An odor-set field that
    doubles the novel letters (ABCCDD against ABCD) is not explained. No rule over sessions or odor sets gives
    the per mouse cell counts of Supplementary Fig. 2a (for 01398 its first four sessions give exactly the
    paper''s 112, of 203). No rule over sessions or odor sets gives the per mouse cell counts of Supplementary
    Fig. 2a (for 01398 its first four sessions give exactly the paper''s 112, of 203).'
- kind: other
  statement: Photometry sessions hold 99 to 269 trials with novel odors from the first trials, where the paper
    describes about 20 A/B-only trials followed by 160 AB12 trials.
- kind: methods_unavailable
  statement: Question for the authors (Supplementary Fig. 6d). Is the 3 SD threshold for the emergence of Odor-1
    dopamine signals the SD of the precue baseline or of the session's signal? Is it over the 1 to 4 s or 2
    to 4 s window, and must the window mean or any sample exceed it? With the precue SD, r ranges from 0.30
    to 0.73 across these choices; with the session's SD almost no session reaches the threshold.
