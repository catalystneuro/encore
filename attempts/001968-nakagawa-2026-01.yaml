- claim: link-unit-mice
  outcome: partially_reproduced
  notebook: reproduce_nakagawa_2026.ipynb
  output: claim:link-unit-mice
  notes: All 27 tetrode mice of Supplementary Table 2 are in the dandiset, and it holds no other tetrode mouse.
    The strain label of the source file names agrees with the paper for 25 of 27; 01398 and 01431, young WT in Supplementary
    Table 2 and Supplementary Fig. 2a, are labelled AD. Sex agrees for 25 of 27 (00703 is F in the files and M in
    the table, 00789 M against F). Principal cell counts are within 10% of Supplementary Fig. 2a for 7 of 10 young
    mice. 00375 holds 72 against 48, 00390 151 against 130 and 01398 203 against 112. Supplementary Table 2 lists
    247, 690, 703, 925 and 941 as young APP-KI and 789, 1199, 1253, 1254 and 1517 as old. Supplementary Fig. 2a
    lists the second five as young, and the files' birth dates make the first five 7.3 to 11.8 months old at recording
    and the second 1.3 to 5.8 months.
  deviations:
  - The criterion was written by the author after the survey of the files' metadata and before any analysis of the
    measures.
  - The young groups follow Supplementary Fig. 2a where it and Supplementary Table 2 disagree.
