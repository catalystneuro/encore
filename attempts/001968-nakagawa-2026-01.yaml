- claim: units-recorded
  outcome: partially_reproduced
  notebook: reproduce_nakagawa_2026.ipynb
  output: claim:units-recorded
  measured:
  - 635
  - 891
  notes: 'Groups of Supplementary Fig. 2a (reading P). Young APP-KI 891 units (846 +- 85, within), young WT 635
    (479 +- 48, outside). Principal cells (RS label, more than 100 spikes) 677 and 564 against 636 and 423; FS 212
    and 71 against 210 and 56 interneurons. With 01398 and 01431 counted as APP-KI, as the files label them (reading
    F), 1164 and 362, both outside. The WT surplus is in 00375, 00390 and 01398 (link-unit-mice). Old WT 860 and
    old APP-KI 778 units (paper 671 and 618), L-DOPA 263 and saline 286 (paper 144 and 132). The 100 duplicate ''_Sum''
    files of 00375 are not counted. No rule over sessions gives the per mouse counts of Supplementary Fig. 2a: all
    sessions put 7 of 10 young mice within 10%, four-letter odor sets only 6 of 10. The first four sessions of 01398,
    its four-letter ones, hold exactly its 112 cells (91 more in its doubled-letter sessions), and the first five
    of 00375 hold 49 against 48, while 00789''s sessions all have doubled-letter odor sets and its 136 cells are
    near the paper''s 125. The criterion says only when the claim is reproduced (both totals within tolerance).
    The outcome is partial because the claim holds in part, one of its two totals (young APP-KI) being within tolerance
    and the other not.'
  deviations:
  - Principal cells are the RS-labelled cells with more than 100 spikes, since the files hold no waveforms to measure
    the peak-trough width.
  - Group membership comes from Supplementary Fig. 2a, since the files state no genotype and label two of its WT
    mice AD.
- claim: ed4a-spike-type-distribution
  outcome: blocked
  blocked_by: data_missing
  notes: The files hold no waveforms or spike widths, only an RS or FS label in each source file name, and no WS
