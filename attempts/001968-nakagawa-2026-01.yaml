- claim: fig4b-wt-dopamine-t1
  outcome: partially_reproduced
  notebook: reproduce_nakagawa_2026.ipynb
  output: claim:fig4b-wt-dopamine-t1
  measured:
  - 1.17
  - 1.66
  - 0.55
  notes: 'Mice as units (adopted, 5 WT mice), B1, 1 to 4 s window: T1 means Odor-A 1.17, Odor-1 1.66, Odor-2 0.55,
    all within tolerance (B2 1.11, 1.63, 0.55; 2 to 4 s also within). With 5 mice the smallest possible two-sided
    signed-rank p is 0.0625, so the significance part is settled by the choice of unit, not by the data, and is
    not tested on this unit (by rank sum Odor-2 at T1 has p = 0.117). The outcome stands because the sessions variant,
    where the test can be run, gives the same outcome. Sessions as units (variant), B2, 10 correct sessions, 2 to
    4 s: means 1.29, 1.67, 0.55, within tolerance; at T1 all three above precue by signed-rank (p = 0.0020, 0.0039,
    0.049); at T5 Odor-A significant (p = 0.0020), Odor-2 not (p = 0.13), and Odor-1 not (p = 0.084), so that part
    fails. By rank sum, which is not paired and compares with precue values near 0 by construction, every condition
    holds with sessions (Odor-1 at T5 p = 0.0025). The signed-rank test (Supplementary Table 1) is adopted as the
    paper''s test. Under B1 with sessions the Odor-2 T1 mean is below tolerance (0.48). The means hold under both
    units; the tests hold in part with sessions, and with mice they are ruled out by the design.'
  deviations:
  - The photometry traces are read as sampled at 1 kHz with the cue at sample 1000, so that a trial spans -1 to
    5 s. The files give neither rate nor cue time. Every trial column has mean 0 and SD 1 over samples 0 to 999
    and over no other span tested, as a trace z-scored to the 1 s before cue would (claims file, Shared method,
    Photometry, from ref. 16), and the noise peaks at 120 Hz and its harmonics under this rate. This is an assumption.
  - Odor codes 1 to 4 are read as Odor-A, Odor-B, Odor-1 and Odor-2, and action codes 1 to 4 as hit, miss, false
    alarm and correct rejection. The files give no names. The tables zscore_A to zscore_D of each file are block
    means of the trials of codes 1 to 4, and actions 1 and 2 occur only with codes 1 and 3.
  - Timepoints T1 to T5 are blocks of 10 trials of each odor starting at round(k (n - 10) / 4), the blocks the dataset's
    own tables hold (notebook, data check). This fits the claims file's T1, T3 and T5 and its reading T-a for T2
    and T4.
  - The paper's units are hemispheres (10 WT, 8 APP-KI), which the files do not identify. The Fig. 4d legend's F(4,80)
    for 18 hemispheres and five timepoints leaves one value per hemisphere and timepoint, so a hemisphere's sessions
    are pooled. The mean over a mouse's sessions (5 WT and 5 APP-KI mice), the nearest pooled unit the files allow,
    is adopted as an assumption. Sessions as units (11 and 30), which count repeated recordings of a hemisphere
    as independent, are a variant. With 5 mice a two-sided signed-rank test cannot reach p < 0.05.
  - The trial columns are already z-scored to the precue second, so dF/F was not recomputed. They are smoothed with
    a Gaussian of sigma 200 ms (claims file, Shared method, Photometry).
  - Genotype comes from Supplementary Table 2 (link-photometry-mice); no file states it.
  - Session 00266_20190405 has no Odor-1/2 trial among trials 121 to 160, so under B1 it is neither a correct nor
    an error session.
  - The text names the test against the precue rank sum and Supplementary Table 1 Wilcoxon signed-rank; both were
    run. The signed-rank test is adopted, as the comparison is paired; the rank sum is a variant.
  assumed: true
