- claim: ed4c-higher-firing-rates
  outcome: reproduced
  notebook: reproduce_nakagawa_2026.ipynb
  output: claim:ed4c-higher-firing-rates
  notes: Rate over the recorded span (reading a). Principal cells median 1.22 Hz in APP-KI against 0.82 in
    WT (677 and 564 cells), Z = -7.18, p = 6.8e-13. Interneurons 1.13 against 0.89 Hz (212 and 71), Z = -2.21,
    p = 0.027. The source meanFR gives p = 1.1e-12 and 0.031, and reading F of the groups p = 6.8e-16 and 0.0073.
    Per mouse, the principal rate is higher in APP-KI (t(8) = -4.84, p = 0.0013). The interneuron rate is higher
    but not significantly (t(8) = -1.60, p = 0.149), and one APP-KI mouse (00789) has a mean of 10.3 Hz. The
    principal peak rate is higher in APP-KI (28.7 against 27.1 Hz, p = 0.0066). The interneuron peak rate is
    lower in APP-KI (29.0 against 33.6 Hz, p = 0.040). Reading (b), the AB12 trial periods only, cannot be
    computed, as the files hold no trial times.
  deviations:
  - Principal cells and interneurons are the RS and FS labels of the source file names, not peak-trough widths,
    which the files do not hold.
  - The rate is the spike count over the first to last spike, as the files give no recording start or end;
    the source meanFR agrees with it (median ratio 0.9994).
  - The peak rate is the maximum of the 50 ms, sigma 100 ms smoothed rate over the whole recording (the claims
    file's reading).
