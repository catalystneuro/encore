- claim: unit-counts
  outcome: partially_reproduced
  notebook: reproduce_symanski_2022.ipynb
  output: claim:unit-counts
  measured:
  - 915
  - 508
  - 876
  - 494
  - 755
  - 430
  - 121
  - 64
  - 146
  - 194
  - 122
  - 156
  assumed: true
  notes: The dandiset holds 915 CA1 and 508 PFC units, close to the paper's active units (934 and 508),
    not its 1,309 and 717; not every deposited unit is active (53 have fewer than 100 spikes in the task
    epochs). The criterion's note that the totals compare what was deposited is read as comparing
    these with the active counts. Active by the two readings CA1 871 and 876, PFC 493 and 494 (within
    tolerance). By the main rate-only rule (9.5 Hz) pyramidal cells CA1 750 and 755, PFC 429 and 430 (within),
    interneurons CA1 121 (expected 121) and PFC 64 (expected 44 +/- 4); by the 7 Hz rule interneurons
    134 and 97. Under every reading odor-period active pyramidal cells CA1 138 to 146, PFC 166 to 194
    (expected 170, 234) and task responsive CA1 111 to 122, PFC 124 to 156 (expected 138, 185) are outside
    tolerance. The Methods' cell-type rule needs spike widths, which are missing data. Measured values
    are for active reading B, 9.5 Hz, task responsiveness reading a.
  deviations:
  - Assumption. The files hold no waveforms or spike widths, so the Methods' rule (rate over 7 Hz and
    width under 0.3 ms) cannot be applied and its width part is missing data. Interneurons are defined
    by the paper code's rate-only rule, rate over the task epochs above 9.5 Hz (F7/ParsePyrIN.m, named
    in the claims file's opening comment), the rule the code applies without widths; the Methods' 7 Hz
    threshold alone is shown beside it.
  - The units' regions are read from the tetrode label number in the units table's electrodes column (findings);
    the electrode-group and row readings are ruled out in the data check.
