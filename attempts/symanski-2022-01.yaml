- claim: fig2d-beta-power-increase
  outcome: reproduced
  notebook: reproduce_symanski_2022.ipynb
  output: claim:fig2d-beta-power-increase
  assumed: true
  notes: Reading A p = 9.0e-7 (CA1), 1.3e-8 (PFC), 7.3e-12 (OB); reading B p = 1.2e-4, 3.3e-9, 3.6e-11;
    31 to 38 of 38 sessions positive. Correct trials only give the same.
  deviations:
  - Assumption. The epoch mean and s.d. used to z-score power and coherence (reading A) and to scale the
    LFP (reading B) are estimated from 60 windows of 2 s at random times in each day's task epochs, not
    from the whole epoch, to keep the run within its time limit (Methods, Local field potential, 'z-scored
    to the epoch mean'). A within-session difference keeps its sign under this scaling; only the size
    changes.
  - All trials are used for the pre-odor comparison (neither the Methods nor the criterion restricts it);
    correct trials only are shown as a variant.
