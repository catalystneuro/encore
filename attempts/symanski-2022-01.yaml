- claim: fig1b-performance
  outcome: reproduced
  notebook: reproduce_symanski_2022.ipynb
  output: claim:fig1b-performance
  measured:
  - 75.74
  notes: Reading (a), the mean over the 8 rats of each rat's mean session performance, is 75.74% (s.e.m.
    1.03), inside 77.0 +/- 1.3 by 0.04 points; reading (b), the mean over the 38 sessions, is 76.11% (s.e.m.
    1.06). The files hold no trial with sampling under 0.5 s, so they already exclude such trials and
    the reading that keeps them (the code's) cannot be run. Per-epoch performance over 55 epochs has a
    minimum of 57.9% (the one epoch under 60%, 19 trials), 5th percentile 64.0% and median 76.0%, so no
    epoch performs near the chance level expected of air-cued trials.
  deviations:
  - The files hold no trial with sampling under 0.5 s; the criterion's reading that keeps such trials
    cannot be run, and with a margin of 0.04 points they could move reading (a).
- claim: fig1c-sampling-duration
  outcome: reproduced
  notebook: reproduce_symanski_2022.ipynb
  output: claim:fig1c-sampling-duration
  measured:
  - 0.819
  - 0.245
  notes: Mean sampling duration over sessions 0.819 s (s.e.m. 0.017, 38 sessions); s.d. across 4,182 trials
    0.245 s. Correct 0.815 against incorrect 0.828 s, median paired difference 0.016 s, signed-rank p
    = 0.72 (paper 0.71); the code's rank-sum variant p = 0.55.
- claim: fig1d-turn-direction
  outcome: not_reproduced
  notebook: reproduce_symanski_2022.ipynb
  output: claim:fig1d-turn-direction
  measured:
  - 95.9
  - 1615
  - 47
  - 490
  - 30
  notes: Both binomial tests are significant with more same than opposite turns. On the full-maze rats
    and CS39 (6 rats; 2,182 trials against the paper's 2,176) correct trials give 1,615 same and 47 opposite
    and incorrect trials 490 and 30; the same counts are within tolerance, the opposite counts are not
    (32 +/- 3 and 21 +/- 2). The criterion requires the counts within tolerance and names no partial band,
    so the claim is not reproduced although the turn matches the chosen arm on most trials. The fraction
    same is 95.9% over sessions (reading a) and 96.5% pooled (b), against 95.4 +/- 0.12. On the five full-maze
    rats alone 1,390 and 30, 430 and 24, 97.1%. Measured values are for the 6-rat set, whose trial counts
    match the paper's.
  deviations:
  - The chosen arm is read from the position (the files hold no chosen well). The odor of a trial is read
    from the data, as the files do not hold it; the chosen side on rewarded trials and the other side
    on unrewarded ones, the side read from the position after exit (it agrees with the rewarded well on
    99.85% of rewarded trials).
  - Which sessions count as truncated is not stated; CS39 (40 cm stem, wells at the ends of the T arms)
    is shown both included and excluded.
  - The odor port position is the median position at odor port entry in each epoch; the code's reference
    position is not known.
