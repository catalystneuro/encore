findings:
- kind: metadata_error
  statement: 'The trial table describes `state` as 1 = Tone A (left), 2 = Tone B (right), 3 = Tone C (choice).
    The data show 2 = left tone, 3 = right tone and 1 = choice tone: state 2 is the only state in single
    fixed-choice blocks with rule (50, 0), its right choices are never rewarded (2669 trials), state 3
    left choices are never rewarded (2026), and state 1 is the only state in free-choice blocks.'
- kind: selection_undocumented
  statement: The dandiset holds 859 units (297 DLS, 255 DMS, 215 VS, 92 CS), more than the paper's 617
    stable neurons, without a column saying which passed the paper's stability, amplitude, histology and
    duplicate exclusions. Its `PANs` flag (204, 112, 138 in DLS, DMS, VS) is described as Prop(ISI > 1
    s) > 0.4, but 174 units that pass that rule are not flagged, so the flag rests on a further criterion
    that is not described. 15 CS units are flagged, though the paper analyses only DLS, DMS and VS.
- kind: metadata_insufficient
  statement: No waveforms, amplitudes or recording depths are deposited, so the paper's exclusion conditions
    1, 2 and 5 and its waveform basis for the PAN class cannot be applied.
- kind: other
  statement: The dandiset has 87 files for the paper's 86 recording sessions; LE115_14 holds behaviour
    (802 trials) and no units.
- kind: data_missing
  statement: The paper's model comparison used 202 behavioural sessions (101 training, 101 test); the
    dandiset holds 86 sessions with free-choice trials, so the comparison of Fig. 2G can be run only on
    these.
- kind: other
  statement: 'Some event times fall outside the task''s stated ranges: cue durations (E2 to E3) from 0.009
    s where the paper gives 1 to 2 s (1st percentile 1.04 s), centre-poke durations before the cue (E1
    to E2) from 0.026 s where the paper gives 500 to 1000 ms (1st percentile 0.51 s), and 942 choice trials
    lack one of the six events or have them out of order.'
- kind: methods_unavailable
  statement: 'Mutual information (Figs. 5, 9, 10): was the plug-in estimate corrected for bias, and if
    so by the Panzeri and Treves (1996) estimate the Results cite, or by shuffling? How were the four
    firing levels defined (quartiles of the trial counts?), and were the random events of the threshold
    drawn with the real proportions? The cue-offset, state, dms-never-above-dls and stay-switch results
    depend on it.'
- kind: methods_unavailable
  statement: 'Fig. 4: which smoothing was applied to the EASHs before normalizing, were extinction trials
    among the ''whole trials'', and does ''reached 0.5 during each trial phase'' mean any bin at or above
    0.5 in the phase? The DMS against VS test of Phase 5 depends on these.'
- kind: methods_unavailable
  statement: 'Fig. 5G: over which bins were the regions'' reward information compared (Phase 6, Phases
    6 and 7, or the peak)?'
- kind: methods_unavailable
  statement: 'Figs. 9 and 10: was action information computed on the last 20 trials of all blocks of a
    type pooled, or per block and averaged, and is the ''paired-Mann-Whitney U test'' the Wilcoxon signed-rank
    test over neurons? The VS absence of Fig. 10C and the DLS and DMS differences depend on it.'
- kind: methods_unavailable
  statement: 'Fig. 8: were the regression windows on the EASH axis or in real time, which seven events
    were used (E1 to E7 or E0 to E6), were the trials free-choice trials only, and which subsets of regressors
    were searched (the text gives six variables and 2^6 models for the eight terms listed)? The QR and
    action-value results of DMS depend on the window axis.'
- kind: methods_unavailable
  statement: 'Fig. 6: which window defines state coding (all of Phase 3, or a 500 ms window), and were
    the windows on the EASH axis or in real time?'
- kind: methods_unavailable
  statement: 'Fig. 2G: the update and choice equations, the initial values, and the priors and parameter
    ranges of the particle filter are images missing from the text or referred to Ito and Doya (2009);
    how were the 202 sessions split into training and test halves?'
