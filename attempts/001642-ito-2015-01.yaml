- claim: fig2g-fq-variable-best
  outcome: not_reproduced
  notebook: reproduce_ito_2015.ipynb
  output: claim:fig2g-fq-variable-best
  notes: 'Normalized likelihood of test data, alternate and random split: FQ variable 0.5758 and 0.5762,
    DFQ variable 0.5770 and 0.5775, Markov 3 0.5770 and 0.5782, Markov 4 0.5785 and 0.5797, FQ const 0.5744
    and 0.5750. FQ variable is not the best model and is below Markov 3 and 4 under both splits; per session,
    Markov 4 is above it with Wilcoxon p = 0.026 and 0.0044. The paper''s statement that FQ variable predicts
    best is not seen with these model forms; the differences between models are within 0.016.'
  deviations:
  - The model equations are missing from the paper's text; the update, choice rule, initial values (0),
    bounds and the particle-filter priors (alpha uniform on 0 to 1, kappa uniform on 0 to 5, clipped random
    walks) are assumed as models.py states, and the drift SDs are chosen on a 3 x 3 grid by the training
    likelihood.
  - 86 sessions with free-choice trials, split 43 and 43, where the paper used 101 training and 101 test
    sessions.
  - Markov models use one pseudo-count per action, so unseen sequences give 0.5, and the available shorter
    history at the start of a session (standard choices).
  assumed: true
