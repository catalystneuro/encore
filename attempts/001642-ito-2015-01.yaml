- claim: fig2c-extinction-differs
  outcome: reproduced
  notebook: reproduce_ito_2015.ipynb
  output: claim:fig2c-extinction-differs
  notes: Over five extinction trials P(left) is 0.822 for the left tone and 0.108 for the right tone,
