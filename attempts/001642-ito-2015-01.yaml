- claim: fig2g-fq-variable-best
  outcome: not_reproduced
  notebook: reproduce_ito_2015.ipynb
  output: claim:fig2g-fq-variable-best
  notes: 'Normalized likelihood of test data, alternate and random split: FQ variable 0.5758 and 0.5762,
    DFQ variable 0.5770 and 0.5775, Markov 3 0.5770 and 0.5782, Markov 4 0.5785 and 0.5797. FQ variable
    is not the best model and is below Markov 3 and 4 under both splits; per session Markov 4 is above
    it with Wilcoxon p = 0.026 and 0.0044. Three further particle-filter seeds give FQ variable 0.5757
    to 0.5764 and DFQ variable 0.5768 to 0.5775, and a 5 x 5 grid of drift SDs gives FQ variable 0.5760
    on the alternate split, all below Markov 4.'
  deviations:
  - The model equations are missing from the paper's text; the update, choice rule, initial values (0),
    bounds and the particle-filter priors (alpha uniform on 0 to 1, kappa uniform on 0 to 5, clipped random
    walks) are assumed as models.py states, and the drift SDs are chosen on a 3 x 3 grid by the training
    likelihood.
  - 86 sessions with free-choice trials, split 43 and 43, where the paper used 101 training and 101 test
    sessions.
  - Markov models use one pseudo-count per action, so unseen sequences give 0.5, and the available shorter
    history at the start of a session (standard choices).
  assumed: true
- claim: actor-critic-near-chance
  outcome: reproduced
  notebook: reproduce_ito_2015.ipynb
  output: claim:actor-critic-near-chance
  measured: 0.5
  notes: Normalized likelihood of test data 0.5000 (shared rate) and 0.5013 (separate rates) on the alternate
    split, 0.5026 and 0.5000 on the random split, all within 0.0508 of 0.5080. The fits put the rates
    or the inverse temperature at or near a bound ([0, 0] and [1, 0, 0] give exactly 0.5), and the tolerance
    band contains 0.5, so the test cannot tell the model from one that does not learn.
  deviations:
  - Constant parameters fitted by maximum likelihood on the training sessions, as in fig2g-fq-variable-best;
    rates in 0 to 1, inverse temperature in 0 to 50 (standard bounds).
- claim: neuron-counts
  outcome: not_reproduced
  notebook: reproduce_ito_2015.ipynb
  output: claim:neuron-counts
  measured:
  - 233
  - 204
  - 142
  - 183
  - 147
  - 119
  notes: The files hold no waveforms, amplitudes or depths (units columns Area, Electrode_ID, Neuron_ID,
    PANs, Unit_Name, the electrode references and the spike times), so exclusion conditions 1, 2 and 5
    cannot be applied. Every count that can be computed misses the paper in at least one region. All units
    297, 255, 215 against 260, 178, 179. After condition 3, condition 4 read as all bins below 1 Hz and
    the duplicate check (90 removed), 233, 204, 142; the PAN rule then gives 183, 147, 119 (DMS outside
    10%). Condition 4 read as any bin below 1 Hz leaves 47, 57, 21. The deposited PANs flag gives 204,
    112, 138 (VS outside 10%), and the flagged units that pass the computable exclusions 160, 97, 99 (DLS
    and VS outside). The verifier would block the claim as data_missing; the disagreement is recorded
    under verifications. Asked in round 2, the counts without the duplicate check, which are upper limits
    of the paper's counts under each reading of condition 4 since the missing conditions can only remove
    units, are under (4i) 265, 224, 169 units and 213, 163, 143 rule PANs, none below the lower end of
    its tolerance (234, 160.2, 161.1; 171, 94.5, 107.1), and under (4ii) 49, 62, 22 units and 2, 7, 4
    PANs, all far below. So no count is shown to miss under reading (4i), and the change to blocked is
    proposed.
  deviations:
  - Exclusion conditions 1, 2 and 5 need waveforms or histology and are not applied; the PETH-similarity
    part of the duplicate rule is not defined and is not applied.
  proposed:
    outcome: blocked
    blocked_by: data_missing
    reason: 'Found in reply to round 2, with the output the verifier asked for (the upper limits
      printed under claim:neuron-counts). Without the duplicate check, conditions (3) and (4i) leave
      265, 224 and 169 units and 213, 163 and 143 rule PANs, none below the lower end of its
      tolerance (234, 160.2, 161.1; 171, 94.5, 107.1). Conditions (1), (2) and (5) and the PETH-similarity
      part of the duplicate rule can only remove units, and they need waveforms or
      histology that the dandiset does not hold, so under reading (4i) they could bring every count
      into tolerance and the claim cannot be decided from the dandiset. Under reading (4ii) every
      count misses (49, 62, 22 units), but that reading leaves far fewer units than the paper''s
      stable counts, so it is unlikely to be the paper''s. This is the verifier''s outcome. By
      Author step 1.5 the claims that depend on it, directly or through other claims, are blocked
      for the same reason; the change is proposed on each of them that is not already blocked, and
      those already blocked (methods_underspecified) stay blocked.'
