- claim: methods-spherical-asymmetry
  outcome: blocked
  blocked_by: other
  notes: Not run within the author's five-hour limit. The simulation needs no data beyond the stimulus
    frames, which are in the dataset; it was left for lack of time after the main analyses.
findings:
- kind: other
  about: data
  statement: 'The Expt2 repeats that the paper uses for cross-validation (24 repetitions of 90 s) show
    frames 0-5400 of the movie template, which are also the first 90 s of the 15 min movie the RFs are
    fitted from. The paper calls them a different 90 s movie segment. The responses confirm the files:
    the repeat PSTH correlates with the response to the first 5400 movie frames at zero shift (median
    r = 0.405 over 78 units, best shift 0 for 66).'
- kind: other
  about: data
  statement: The long white-noise recordings of Expt1 last 600 s at high contrast and 900 s at low contrast;
    the paper states a 6 min segment. Which part the paper used is not recorded.
- kind: metadata_insufficient
  statement: The units tables carry no ON/OFF classification, which the paper reports for every cell;
    it can only be inferred from the sign of the estimated RF.
- kind: selection_undocumented
  about: data
  statement: Nothing marks which units or penetrations make up the paper's samples (68 cells for the movie,
    26 with the 90 s repeats, 31 with noise and 12 s repeats). Applying the paper's inclusion rule here
    passes 111 units, 58 of them with the 90 s repeats; the 31 with the noise match the paper's count.
- kind: paper_inconsistency
  about: paper
  statement: The paper says the monitor ran at 120 Hz with pixel intensities updated every other refresh,
    which is 60 Hz, and that this approximated the movies' 50 Hz; the files show frames at 59.96 Hz, and
    the frame rate used for analysis is not stated.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. On what scale was the stimulus (and the response) when D = 0.001
    was applied in the RLS, and was the same D used for every contrast? With a penalty that is negligible
    in gray levels the per-segment estimate is not determined; with a fixed penalty the low-contrast RFs
    are regularized more. This attempt chose the penalty by held-out prediction, relative to the stimulus
    variance.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. How were the percent changes formed (change of the means, or the
    mean of per-cell changes), how was the surround's peak read (largest absolute value or opposite-sign
    extreme), and how was q adjusted per animal? The readings give different values for several claims
    (for example the movie gain increase is 125% or 144%, and the surround decrease with correlations
    38.7% or 37.2%).
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. Were the mean firing rates compared between low-contrast movie
    and noise those of the long segments or of the 12 s repeats? Here the difference is not significant
    over the long segments (p = 0.063) and significant over the repeats (p = 0.0013).
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. Which cells and which positions in the frame were used to build
    and apply the generic RFs of Figures 7 and 8, and which stimulus segments (long or repeated) were
    filtered? Kurtosis and the model's sparseness differ between the long segments and the 12 s clips
    (HC NS kurtosis 4.01 against 3.55).
