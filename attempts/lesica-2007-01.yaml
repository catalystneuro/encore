- claim: sample-composition
  outcome: not_reproduced
  notebook: reproduce_lesica_2007.ipynb
  output: claim:sample-composition
  measured:
  - 111
  - 31
  - 58
  notes: Under reading (a), a cell passing at both contrasts, 111 of the 143 units with the 15 min movie at both
    contrasts pass (133 under reading b), against 68 (tolerance 6.8). The count is 111 under all five seeds of the
    shuffles (either-contrast count 132 to 134). The subset with the long noise and the 12 s repeats (Expt1 a11,
    a13, a14) is 31 cells, as in the paper; the subset with the 90 s repeats (Expt2) is 58 against 26. By ON/OFF
    (sign of the HC movie RF) 55 ON and 56 OFF (paper 44 and 24); X 60, Y 43, unclassified 8 (paper 30, 27, 11).
    The count depends on the noise estimate and on the regularization; at a threshold of 15 it is 61. No pair of
    units on the same electrode in different penetrations has RFs correlated above 0.8, so no cell seems counted
    twice. 13 of the 111 have HC and LC movie RFs of opposite sign at their maximal point, and 94 keep their sign
    in every condition; they are kept, as the paper's rule does not exclude them, and left out in variants where
    ON/OFF matters. Under the variant penalties the count is 29 (1000 x variance) and 0 (the paper's literal penalty).
  deviations:
  - Spatial width, surround/center ratio and the NLs come from RFs with 12 lags of one stimulus frame (16.7 ms).
    Temporal width, latency and biphasic ratio come from RFs at the paper's resolution, 128 Hz bins and 24 lags
    of 8 ms (Estimation of Receptive Fields, par. 4), but estimated in a 15 x 15 window centred on the maximal point
    of the HC movie RF in place of 21 x 21, to fit the time limit (an assumption); the frame-rate values are shown
    as a variant.
  - The ridge penalty is 10000 x the stimulus variance, chosen by the rule the paper gives for D, the most accurate
    held-out prediction of the movie responses (Estimation of Receptive Fields, par. 3), over a grid that now includes
    the paper's literal penalty, 1000 in gray levels (D = 0.001 on a stimulus with values between -106 and 106,
    Natural Scene Movie and White Noise Stimuli, par. 1). The literal penalty predicts worst (mean r 0.170 against
    0.437) and gives RFs at the noise level, so that no cell passes the inclusion rule; it is run as a variant with
    1000 x variance. Making the penalty relative to the variance is an assumption. The 128 Hz RFs use the same penalty
    per second of data.
  - Cells are the 111 that pass the paper's inclusion rule at both contrasts here, where the paper has 68; the paper's
    cells cannot be identified.
  - RFs are estimated in a 21 x 21 window centred on the peak of the HC movie spike-triggered average (a standard
    choice), the same window for all four stimuli.
  - ON or OFF is the sign of the maximal point of the HC movie RF; the files carry no ON/OFF label.
  - The noise of the inclusion rule is the SD of the mean of the nine segment RFs estimated from responses shuffled
    within each segment.
  - 'Variant penalties, computed in the same pass: 1000 x variance passes 29 cells at both contrasts (69 at either),
    and the paper''s literal penalty of 1000 in gray levels passes none (4 at either), with median peak/noise 4.1
    (HC) and 3.9 (LC), a median centre of 1 pixel and a median HC latency of 158 ms, that is RFs at the noise level.'
