- claim: sample-composition
  outcome: not_reproduced
  notebook: reproduce_lesica_2007.ipynb
  output: claim:sample-composition
  measured:
  - 111
  - 31
  - 58
  notes: Under reading (a), a cell passing at both contrasts, 111 of the 143 units with the 15 min movie
    at both contrasts pass (133 under reading b), against 68 (tolerance 6.8). The count is 111 under all
    five seeds of the shuffles (either-contrast count 132 to 134). The subset with the long noise and
    the 12 s repeats (Expt1 a11, a13, a14) is 31 cells, as in the paper; the subset with the 90 s repeats
    (Expt2) is 58 against 26. By ON/OFF (sign of the HC movie RF) 55 ON and 56 OFF (paper 44 and 24);
    X 60, Y 43, unclassified 8 (paper 30, 27, 11). The count depends on the noise estimate and on the
    regularization; at a threshold of 15 it is 61. No pair of units on the same electrode in different
    penetrations has RFs correlated above 0.8, so no cell seems counted twice.
  deviations:
  - RFs use 12 lags of one stimulus frame (16.7 ms, 200 ms in all) in place of the paper's 24 lags of
    8 ms; the stimulus changes once per frame, but widths and latencies are read on the coarser grid.
  - The ridge penalty is RIDGE_REL times the stimulus variance, RIDGE_REL chosen by held-out prediction
    of the 15 min movie (Estimation of Receptive Fields, par. 3, chose D the same way); an assumption,
    see deviations of sample-composition.
  - Cells are the 111 that pass the paper's inclusion rule at both contrasts here, where the paper has
    68; the paper's cells cannot be identified.
  - The paper's D = 0.001 cannot be used as such; its stimulus scale and the noise term of its gain equation
    are not fully given, and with a penalty of 1000 in gray levels the 5292-parameter estimate from one
    ninth of the data is not determined. The penalty was chosen by held-out prediction, as the paper chose
    D (10000 x stimulus variance, of 1000, 3000, 10000 and 30000). Making it relative to the stimulus
    variance is an assumption; a fixed penalty in gray levels regularizes LC RFs about seven times more
    than HC ones. A fixed penalty of 1e7 was tried while preparing (not run in the notebook) and gave
    widths that grew at low contrast.
  - RFs are estimated in a 21 x 21 window centred on the peak of the HC movie spike-triggered average
    (a standard choice), the same window for all four stimuli.
  - ON or OFF is the sign of the maximal point of the HC movie RF; the files carry no ON/OFF label.
  - The noise of the inclusion rule is the SD of the mean of the nine segment RFs estimated from responses
    shuffled within each segment.
