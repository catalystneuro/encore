- kind: selection_undocumented
  about: data
  statement: Nothing marks which units or penetrations make up the paper's samples (68 cells for the movie, 26 with
    the 90 s repeats, 31 with noise and 12 s repeats). Applying the paper's inclusion rule here passes 111 units,
    58 of them with the 90 s repeats; the 31 with the noise match the paper's count.
- kind: paper_inconsistency
  about: paper
  statement: The paper says the monitor ran at 120 Hz with pixel intensities updated every other refresh, which
    is 60 Hz, and that this approximated the movies' 50 Hz; the files show frames at 59.96 Hz, and the frame rate
    used for analysis is not stated.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. On what scale was the stimulus when D = 0.001 was applied in the RLS, and
    was the same D used for every contrast? Taken literally (a penalty of 1000 on a stimulus between -106 and 106,
    the gray levels about the mean), the estimates here are at the noise level and no cell passes the inclusion
    rule; the paper's own rule for D, held-out prediction of the movie, picks 10000 x the stimulus variance, and
    several RF comparisons (the NS against WN differences in width and surround, the LC NS against LC WN gain and
    offset) change under 1000 x variance.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. How were the percent changes formed (change of the means, or the mean of
    per-cell changes), how was the surround's peak read (largest absolute value or opposite-sign extreme), and how
    was q adjusted per animal? The readings give different values for several claims (for example the movie gain
    increase is 125% or 144%, and the surround decrease with correlations 38.7% or 37.2%).
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. Were the mean firing rates compared between low-contrast movie and noise
    those of the long segments or of the 12 s repeats? Here the difference is not significant over the long segments
    (p = 0.063) and significant over the repeats (p = 0.0013).
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. Which cells and which positions in the frame were used to build and apply
    the generic RFs of Figures 7 and 8, and which stimulus segments (long or repeated) were filtered? Kurtosis and
    the model's sparseness differ between the long segments and the 12 s clips (HC NS kurtosis 4.01 against 3.55).
