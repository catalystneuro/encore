findings:
- kind: data_missing
  statement: The data set holds part of the paper's data. It has 8 of 12 WT and 7 of 9 Fmr1-null mice,
    the large box and the stationary and rotating arena, but no small box or ring sessions, no sleep or
    quiet-wakefulness recordings, no LFP, no slice recordings and no avoidance sessions. Thirteen of the
    32 claims cannot be tested.
- kind: metadata_insufficient
  statement: No isolation measures (IsoIBG, IsoINN), waveforms or cell classes are given, and the files
    hold every sorted cluster, including cluster 0 (the unsorted spikes of each tetrode). The paper's
    226 WT and 334 Fmr1-null well-isolated cells cannot be selected; Table S2 lists fewer cells per session
    than the files hold clusters (15 against 50 for M16 in stationary arena 1).
- kind: metadata_insufficient
  statement: Positions are in tracker pixels (0 to 255) with no spatial scale in the data descriptor or
    the files. The tracked extent of the large box is about 186 pixels in most sessions and about 218
    in four (M1, M9, M10, M11), so the scale also differs between sessions.
- kind: metadata_error
  statement: The header's SAMPLING_INTERVAL and FIRST_TIMESTAMP do not give the times of the position
    samples. Spikes lie up to 118 samples (about 4 s) after the nominal time of the sample they are filed
    under, as the stated rate drifts against the spike clock and frames are dropped. The data descriptor's
    example header gives 58.3 samples/s, where every file has 30.0.
- kind: format_error
  statement: Six spike trains have one backward step in their spike times, of 0.2 to 1.4 s (M34 041015
    blackbox P0C2 and P2C2, M37 051115 stationary1 P2C2 and P8C2, M16 090414 rotating P1C1, M35 040215
    stationary2 P0C2).
- kind: identifier_missing
  statement: Nothing identifies a cell across sessions. Sessions of a day mostly share a cut file and
    cluster names, which the attempt takes to be the same cells, but M29 stationary arena 1 and M34 stationary
    arena 2 have their own cut files, and box and arena sessions are on different days with different
    cut files.
- kind: other
  statement: The _0-15min and _15-30min files repeat the full-session files; for one of five spike trains
    checked, the two parts together hold one spike fewer than the full file. The .times files repeat the
    TS spike times (107 of 107 checked).
- kind: methods_unavailable
  statement: Question for the paper's authors. Which recording classifies a cell as a place cell, interneuron
    or non-spatial cell ('standard recordings')? For the rotating-arena cells of Figures 5 and S6, are
    place cells those classified in the stationary session of the same day or in the rotating session's
    room frame? With same-day stationary classification room-frame Ipos is greater in Fmr1-null (p = 0.012);
    with rotating-session classification it is not (p = 0.21). The attempt assumed the stationary session.
