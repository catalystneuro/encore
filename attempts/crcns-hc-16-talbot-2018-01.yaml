  notes: The data set holds 8 WT mice (M1, M3, M11, M16, M28, M32, M35, M36) and 7 Fmr1-null mice (M9,
    M10, M18, M29, M33, M34, M37), where the criterion needs exactly 12 (or 11) and 9. The well-isolated
