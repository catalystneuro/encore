- claim: interneuron-proportion
  outcome: not_reproduced
  notebook: reproduce_talbot_2018.ipynb
  output: claim:interneuron-proportion
  measured:
  - 33.5
  - 44.5
  notes: Interneurons (rate above 2 AP/s) are 68 of 203 WT clusters (33.5%) and 106 of 238 Fmr1-null clusters
    (44.5%) in R1, and 35.4% and 48.5% in R2; with the classified cells as denominator 38.6% to 41.4%
    and 51.7% to 55.7%. Every percentage is far outside 12.4 +/- 1.24 and 29.3 +/- 2.93. The direction
    holds (R1 z = -2.36, p = 0.018; R2 z = -3.33, p = 0.0009).
  deviations:
  - The data set has no isolation measures (IsoIBG, IsoINN) or waveforms, so every sorted cluster other
    than cluster 0 is used in place of the paper's well-isolated cells, and cells are classified by rate
    and bursting without waveform width.
  - The session that classifies a cell ('standard recordings') is open; R1 (each cell from its first stationary
    session) and R2 (each stationary session on its own) are both run, and a cluster name within a day's
    cut file is taken as one cell.
  - Rate alone and rate with bursting give the same interneurons, as the rate decides it.
