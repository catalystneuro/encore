- claim: data-s2-glomerulus-link
  outcome: partially_reproduced
  notebook: reproduce_hart_2024.ipynb
  output: claim:data-s2-glomerulus-link
  notes: All 14 Data S2 ants at 48% are dandiset ants at 48%, and Data S2's age labels agree with
    the dandiset's ages (P16 to P20 and P60 to P61). At the place found for each glomerulus, 71 of
    108 ant, glomerulus and set triples (66%) have per-trial AUCs that correlate with Data S2's at
    r >= 0.7, short of the 80% for the link to hold. Young ants agree in 46 of 56, old ants in 25
    of 52; the main set in 57 of 81 and the Figure 3C and 3D set of PGb and PGa alarm traces in 14
    of 27. Over all 1672 trials r = 0.793. In the Figure 3C and 3D set, old ants' PGb traces often
    have Data S2's shape (median trace r up to 0.95) but a smaller AUC (median absolute difference
    8.8 to 42.4). The dependent claims are tested; their old-ant values, PGb with the alarm
    pheromones most of all, are where the link is weakest.
  deviations:
  - The positions are chosen by correlation with Data S2's per-trial peak responses, so the
    dandiset's values are not independent of Data S2's pattern across trials; amplitudes are not
    matched.
- claim: figs2a-mean-six-glomeruli-no-age-effect
  outcome: reproduced
  assumed: true
  notebook: reproduce_hart_2024.ipynb
  output: claim:figs2a-mean-six-glomeruli-no-age-effect
  notes: The mean AUC over the glomeruli identified in each ant does not differ with age. Under
    reading (a), radius 8, p = 0.81 (4-methyl-3-heptanone) and 0.25 (4-methyl-3-heptanol); under
    reading (b) 0.22 and 0.14; over the other variants p 0.090 to 0.96. Data S2's own values give
    p = 0.14 and 0.053. The partial link (data-s2-glomerulus-link) bears on the old-ant values.
  deviations:
  - Glomerulus positions are not in the dandiset; each is placed where the dandiset's per-trial
    responses best correlate with Data S2's (data-s2-glomerulus-link), so the test uses Data S2
    (data with_inputs).
  - Assumed a disk ROI of 8 pixels radius (2.3 um) on the three-plane projection; the paper gives no
    ROI size. Radii 5 and 12 are shown.
  - Assumed fold-change reading (a), the ROI mean of the projected signal turned into fold change,
    the usual ImageJ order for "a max Z-projection was generated ... and the fluorescence fold
    change was calculated" (STAR Methods, Image processing); reading (b) is shown.
  - Per ant, the mean over the trials Data S2 holds for that glomerulus (the paper's own trial
    selection); all trials are shown as a variant.
  - The 40-frame traces are aligned with one set of shifts per trial, measured on the middle plane,
    not per plane.
