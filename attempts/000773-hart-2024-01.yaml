- claim: fig3d-pg-60-vs-90-days-same
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The readings give different outcomes and neither is a fair test here. Reading (a), both cohorts
    measured here at the placement from all trials (60-day ants of this dandiset, 90-day ants of DANDI
    000467), finds no difference (PGb with 4-methyl-3-heptanone 5.15 against 11.59, p = 0.15; PGb with
    4-methyl-3-heptanol p = 0.94; PGa p = 0.41; every variant p >= 0.059). Added after the round 2 verifier,
    the 60-day values at the held-out placement of the main measure against the same 90-day values also
    show no difference (8.46 against 11.59, p = 0.60; p = 0.53; PGa 0.08 against 6.53, p = 0.18; reading
    b p = 0.33 to 0.74); at the placement from the general odorants alone only reading (b) of PGb with
    4-methyl-3-heptanone differs (1.74 against 14.14, p = 0.041; reading a p = 0.063). But the 90-day PGa positions
    are placed from six trials and only 1 of 8 is above chance (r 0.996 to 0.9997, 95th percentiles of
    the shuffled maxima about 0.999); the PGb positions (12 trials) are above chance in 7 of 8. No held-out
    placement can be made for the 90-day PGa, whose Data S2 trials are only the six alarm trials. Reading
    (b), the 60-day AUCs measured here against Data S2's 90-day values, finds differences (held-out placement
    p = 0.014, 0.022 and 0.016; placement from all trials p = 0.0002, 0.053 and 0.41), but the AUCs measured
    here are several times smaller than Data S2's for the same ants (60-day PGb with 4-methyl-3-heptanone
    5.15 against 20.66; 90-day 11.59 in 000467 against 24.99), so it compares two pipelines, not two ages.
    With Data S2's values for both ages none differs (p = 0.44, 0.80 and 0.78), but that uses no dandiset
    data. In 000467 the 8 Data S2 ants at 48% are all present, 12 of 16 ant and glomerulus pairs agree
    with Data S2 at r >= 0.7, and 95 of 96 trial numbers named in Data S2 match the dandiset's trial of
    that odor and repeat. Changed from reproduced (assumed reading a) after the round 1 verifier (problems
    3 and 4); whether reading (b) should take both ages from Data S2 is asked of a reader.
  deviations:
  - The 90-day ants are located in DANDI 000467 as the 60-day ants are in this dandiset (PGb from 12 Data
    S2 trials with four odors, PGa from 6 alarm trials), radius 8; the 15 120-frame trials of 000467 (6-methyl-5-hepten-2-one)
    are left out.
  - Both readings of the claims file were run; the claim is blocked because they disagree and each has
    a flaw that no choice in the paper settles.
