- claim: fig2d-whole-al-alarm-no-age-effect
  outcome: reproduced
  notebook: reproduce_hart_2024.ipynb
  output: claim:fig2d-whole-al-alarm-no-age-effect
  notes: None of the four Welch tests finds an age difference in the whole-AL mean peak fold
    change. At 3%, p = 0.78 (4-methyl-3-heptanone) and 0.065 (4-methyl-3-heptanol), 3 young and 4
    old ants; at 48%, p = 0.39 and 0.14, 7 and 7 ants. The outline shrunk or grown by 5 pixels and
    the 32-plane projection give the same (smallest p 0.061). Cohort means are -0.15 to -0.26; the
    minimum filter makes a non-responding AL negative (paraffin oil median -0.23).
  deviations:
  - The AL outline is found by Otsu's threshold on the mean raw maximum projection, as the
    criterion allows; the paper drew it by hand.
  - Frames are aligned by whole-pixel phase correlation to the mean of frames 1-5, a stand-in for
    the ImageJ Image Stabilizer. The median shift is 1 pixel; 2742 of 167,706 frame estimates above
    20 pixels were taken as failures and not applied.
- claim: figs3b-whole-al-general-decline
  outcome: partially_reproduced
  notebook: reproduce_hart_2024.ipynb
  output: claim:figs3b-whole-al-general-decline
  measured:
  - 40.99
  - -5.68
  notes: At 48% the whole-AL response falls with age for 3-hexanone (young 1.613, old 0.039,
    t = 7.39, p = 2.0e-05) and isopropanol (young 0.860, old -0.151, p = 0.0085). The 3-hexanone
