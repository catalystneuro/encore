- claim: fig2e-heptanone-breadth-falls
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The paper drew glomerulus-sized ROIs by hand and does not give their size, positions or the
    per-ant counts; Data S2 holds traces of the six focal glomeruli only, no counts, so the
    criterion's comparison with "the paper's counts in Data S2" cannot be made. The claims file's
    automated ROIs were run at three glomerulus diameters, and the outcome depends on the size. For
    4-methyl-3-heptanone the medians are 4 (young) and 2 (old) at 25 pixels (p = 0.22), 1 and 0 at
    35 pixels (p = 0.35), 0 and 0 at 50 pixels (p = 0.71), so partially reproduced at the first two
    and not reproduced at the third; none finds the significant difference the paper reports. For
    4-methyl-3-heptanol no size finds a difference (p 0.23 to 0.95). Data S2 holds all 21 trials of
    every 48% ant, so the motion-excluded trials cannot be identified and reading (b) equals
    reading (a). The question is for the paper's authors (see findings).
  deviations:
  - ROIs by the claims file's automated rule (local maxima at >= 0.2 recurring in two or more
    trials, disks of one glomerulus diameter), at diameters of 25, 35 and 50 pixels; the paper drew
    them by hand.
- claim: fig2-alarm-sparse
  outcome: blocked
  blocked_by: methods_underspecified
  notes: Depends on fig2e-heptanone-breadth-falls, which is blocked. The counts are small at every
    size; the largest count of any ant is 32, 17 and 7 ROIs for 4-methyl-3-heptanone and 11, 4 and
    2 for 4-methyl-3-heptanol (25, 35 and 50 pixels). The 10% reading (50 ROIs) holds at every size;
    the 5% reading (25 ROIs) fails only at 25 pixels, for one old ant (32 ROIs).
