- claim: figs3c-general-breadth-no-age-effect
  outcome: blocked
  blocked_by: methods_underspecified
  notes: Blocked for the reason fig2e-heptanone-breadth-falls is. By the letter of the criterion no odorant
    shows an age difference in the count of responding ROIs (smallest p 0.075, ethanol at 35 pixels; ethylpyrazine
    0.083 to 0.32, propionic acid 0.36 to 0.94), but the counts come from the claims file's automated
    ROIs, which do not find the age effect the paper reports for 4-methyl-3-heptanone and whose counts
    are implausible as glomerulus counts (17 to 173 ROIs per ant at 25 pixels; up to 128 ROIs responding
    to ethanol at 25 pixels and 72 in one young ant at 35 pixels). A null result from a procedure that
    misses the paper's effect is not a test. Changed from reproduced (assumed) after the round 1 verifier
    (problem 7).
  deviations:
  - ROIs as in fig2e-heptanone-breadth-falls, at three diameters; the paper drew them by hand and gives
    no positions or counts.
- claim: data-s2-glomerulus-link
  outcome: partially_reproduced
  notebook: reproduce_hart_2024.ipynb
  output: claim:data-s2-glomerulus-link
  notes: All 14 Data S2 ants at 48% are dandiset ants at 48%, and Data S2's age labels agree with the
    dandiset's ages (P16 to P20 and P60 to P61). At the place found for each glomerulus from all its Data
    S2 trials (the criterion), 71 of 108 ant, glomerulus and set triples (66%) have per-trial AUCs that
    correlate with Data S2's at r >= 0.7, short of the 80% for the link to hold. Young ants agree in 46
    of 56, old ants in 25 of 52; the main set in 57 of 81 and the Figure 3C and 3D set in 14 of 27. Over
    all 1672 trials r = 0.793. Two checks added in revision show this is optimistic. Against the best
    r reached with Data S2's values shuffled (200 shuffles per placement), all 42 young placements are
    above chance (p < 0.05) but only 24 of 39 old ones (18 of 39 with the odors shuffled as blocks); triples
    agree at 66 of 90 placements above chance and 5 of 18 below. Read where the glomerulus was placed
    without that odor's trials, 44 of 108 triples agree (41%; young 35 of 56, old 9 of 52; Figure 3C and
    3D set 4 of 27), r = 0.731 over all trials; alarm trials read where the glomerulus was placed from
    the general odorants alone agree in 19 of 79 (old 4 of 37). Held out, the link would fail; in old
    ants it fails either way. The dependent claims are tested; their old-ant values, PGb with the alarm
    pheromones most of all, are where the link is weakest.
  deviations:
  - The positions are chosen by correlation with Data S2's per-trial peak responses, so under the criterion
    the dandiset's values are not independent of Data S2's pattern across trials; amplitudes are not matched.
    A held-out placement and a permutation chance level are shown.
- claim: figs2a-mean-six-glomeruli-no-age-effect
  outcome: reproduced
  assumed: true
  notebook: reproduce_hart_2024.ipynb
  output: claim:figs2a-mean-six-glomeruli-no-age-effect
  notes: The mean AUC over the glomeruli identified in each ant does not differ with age. At the held-out
    placement (reading a, radius 8) p = 0.58 (4-methyl-3-heptanone) and 0.23 (4-methyl-3-heptanol); over
    every variant, including the placement from all trials (p = 0.81 and 0.25) and placements above chance
    only, p >= 0.0799 (general odorants only, reading b, 4-methyl-3-heptanone). Data S2's own values give
    p = 0.14 and 0.053. The partial link (data-s2-glomerulus-link) bears on the old-ant values. This null
    result is weak evidence, since it comes from the same located ROIs that miss the paper's positive
    old-ant effects (fig3b, fig3d), and a null from a procedure that misses the paper's effects is a weak
    test, the reason figs3c-general-breadth-no-age-effect is blocked. It is kept as reproduced because
    the glomeruli are placed from Data S2 per ant (above chance in every young ant), not by the automated
    rule of figs3c, and no variant reaches p < 0.05.
  deviations:
  - Glomerulus positions are not in the dandiset; each is placed where the dandiset's per-trial responses
    best correlate with Data S2's (data-s2-glomerulus-link), so the test uses Data S2 (data with_inputs).
  - 'Assumed the held-out placement as the main measure: each odor''s AUCs are read where the glomerulus
    was placed from Data S2''s trials of the other odors (leave one odor out), so that the tested values
    did not choose the place (verifier, round 1, problem 2). The placement from all trials (round 1''s
    main measure), placements above chance only, and for the alarm pheromones the placement from the general
    odorants alone are shown as variants.'
  - Assumed a disk ROI of 8 pixels radius (2.3 um) on the three-plane projection; the paper gives no ROI
    size. Radii 5 and 12 are shown.
  - Assumed fold-change reading (a), the ROI mean of the projected signal turned into fold change, the
    usual ImageJ order for "a max Z-projection was generated ... and the fluorescence fold change was
    calculated" (STAR Methods, Image processing); reading (b) is shown, leaving out pixels whose baseline
    F0 is at or below the ant's background level (the median of the raw maximum projection outside the
    AL), an assumption, since a pixel at background level divides by noise.
  - Per ant, the mean over the trials Data S2 holds for that glomerulus (the paper's own trial selection);
    all trials are shown as a variant.
  - The 40-frame traces are aligned with one set of shifts per trial, measured on the middle plane, not
    per plane.
