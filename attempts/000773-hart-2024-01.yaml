- claim: pg-opposite-modulation
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_hart_2024.ipynb
  output: claim:pg-opposite-modulation
  notes: No general odorant response rises with age in any focal glomerulus (0 of 30 Welch tests
    under every variant), and PGb's responses to 3-hexanone and isopropanol fall with age (p = 0.010
    and 0.026), so the general odorant half holds. The alarm half rests on fig3d-pg-stronger-old,
    which is not reproduced (only PGa with 4-methyl-3-heptanol rises significantly). The criterion
    states only when the claim is reproduced; partially reproduced is given as the claim holds in
    part.
  deviations:
  - Glomerulus positions are not in the dandiset; each is placed where the dandiset's per-trial
    responses best correlate with Data S2's (data-s2-glomerulus-link), so the test uses Data S2
    (data with_inputs).
  - Assumed a disk ROI of 8 pixels radius (2.3 um) on the three-plane projection; the paper gives no
    ROI size. Radii 5 and 12 are shown.
  - Assumed fold-change reading (a), the ROI mean of the projected signal turned into fold change,
    the usual ImageJ order for "a max Z-projection was generated ... and the fluorescence fold
    change was calculated" (STAR Methods, Image processing); reading (b) is shown.
  - Per ant, the mean over the trials Data S2 holds for that glomerulus (the paper's own trial
    selection); all trials are shown as a variant.
  - The 40-frame traces are aligned with one set of shifts per trial, measured on the middle plane,
    not per plane.
findings:
- kind: metadata_insufficient
  statement: The dandiset holds no ROI positions, glomerulus identities or responding-ROI counts. The
    six focal glomeruli (PGb, PGa, G1 to G4) and the responding ROIs of Figures 2E and S3C were
    drawn by hand and cannot be located from the dandiset alone; ten claims depend on them. Data S2
    of the paper holds the traces of the focal glomeruli but not their positions.
- kind: metadata_insufficient
  statement: Stimulus timing is not stored as times or intervals, only in the series description
    ("odor stimulus triggered at 3s with duration 5s"). The traces are consistent with it; the
    response first exceeds baseline at frame 6 and peaks at frame 12, and paraffin oil trials show
    no response.
- kind: metadata_error
  statement: The timing metadata disagree. The series description gives 40 cycles in 48.0 s (1.2 s
    per volume, as 33 planes at 27.5 frames per second take), the series rate is 1.2097 Hz (0.83 s
    per volume, the Methods' value), and the imaging plane's imaging_rate is 0.83, a period stored
    as a rate.
- kind: metadata_error
  statement: One trial (ant1-m2-d24-y2023, trial 135) spells ethylpyrazine "ethylyprazine" in its 33
    file names; its place in the odor sequence shows it is ethylpyrazine.
- kind: selection_undocumented
  statement: The Methods say a small number of trials were excluded from the responding-ROI counts
    for motion artifacts, but neither the dandiset nor Data S2 says which; Data S2 holds all 21
    odor trials of every 48% ant.
- kind: methods_unavailable
  statement: Question for the paper's authors. How were the responding ROIs of Figure 2E and S3C
    drawn (their size, and their positions per ant), and what are the per-ant counts? With the
    claims file's automated ROIs the medians for 4-methyl-3-heptanone are 4 and 2 (the paper's
    values) at 7 um glomeruli, 1 and 0 at 10 um and 0 and 0 at 14 um, and no size gives a
    significant age difference (p 0.22 to 0.71).
- kind: methods_unavailable
  statement: Question for the paper's authors. Where are the six focal glomeruli in each ant (plane
    and position), what size were their ROIs, and was the fold change computed on the ROI mean or
    per pixel? Were the PGb and PGa alarm traces of Figure 3C and 3D (Data S2 names with a two-digit
    year) quantified on the same ROIs and planes, and with the same processing, as the general
    odorant traces of Figure 4? At positions matched to Data S2, PGb alarm AUCs measured from the
    imaging are well below Data S2's in the 60-day ants of this dandiset (5.15 against 20.66 for
    4-methyl-3-heptanone) and in the 90-day ants of DANDI 000467 (11.59 against 24.99), although
    the trace shapes often match.
- kind: other
  statement: The whole-AL mean of the peak fold change map is negative for a non-responding AL (the
    paraffin oil trials have a median of -0.23), because the minimum filter is applied before the
    maximum projection. The fold declines of Figure S3B (more than 9-fold and 57-fold) are
    therefore sensitive to the baseline; here the old cohort's isopropanol mean is negative.
- kind: other
  statement: The behaviour data of Figure 1 and S1 are only in the paper's supplement (Data S1), the
    confocal stacks of Figure 2A and 2B only in the Brain Image Library (doi:10.35077/g.1153), and
    the 90-day ants of Figure 3C and 3D in DANDI 000467. The Brain Image Library download server
    could not be reached during this attempt. In Data S2 the trailing number of a trial name is the
    repeat for most ants but the recording's trial number for the 90-day PGb traces; one of those
    96 numbers does not match the 000467 trial of that odor and repeat.
- kind: other
  statement: Raw fluorescence is stored as uncompressed float64 (8 bytes per value), 1.28 TB for 21
    ants; each file is one plane of one trial (15,246 files). Reading needs only range requests,
    but the dataset is large for what it holds.
