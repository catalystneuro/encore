- claim: fig2b-gcamp-baseline-unchanged
  outcome: blocked
  blocked_by: data_unreadable
  notes: The confocal stacks are not in the dandiset; they are in the Brain Image Library
    (doi:10.35077/g.1153), whose landing page lists 15 brains (7 young, 8 old) under
