- claim: fig2b-gcamp-baseline-unchanged
  outcome: blocked
  blocked_by: other
  notes: The confocal stacks are not in the dandiset; they are in the Brain Image Library (doi:10.35077/g.1153).
    The notebook reads the landing page, which lists 15 brains (7 young, 8 old) under download.brainimagelibrary.org
    and carries two notices, printed (the repository "is under review for potential modification in compliance
    with Administration directives", and "BIL data will be unavailable between October 5 and October 16").
    The notebook then tries the download server three times, 30 s apart with a 60 s timeout each, and
    every try timed out (ReadTimeout, ReadTimeout, ConnectTimeout in the final run's output; three
    ReadTimeouts in the round 2 run). Requests made from the shell during the attempt also timed out but are in no
    output. The data were never read, so the block is other (the server was not reached), not data_unreadable.
    The number of brains could not be compared with Figure 2B.
- claim: fig2d-whole-al-alarm-no-age-effect
  outcome: reproduced
  notebook: reproduce_hart_2024.ipynb
  output: claim:fig2d-whole-al-alarm-no-age-effect
  notes: None of the four Welch tests finds an age difference in the whole-AL mean peak fold change. At
    3%, p = 0.78 (4-methyl-3-heptanone) and 0.065 (4-methyl-3-heptanol), 3 young and 4 old ants; at 48%,
    p = 0.39 and 0.14, 7 and 7 ants. The outline shrunk or grown by 5 pixels and the 32-plane projection
    give the same (smallest p 0.061). Cohort means are -0.15 to -0.26; the minimum filter makes a non-responding
    AL negative (paraffin oil median -0.23).
  deviations:
  - The AL outline is found by Otsu's threshold on the mean raw maximum projection, as the criterion allows;
    the paper drew it by hand.
  - Frames are aligned by whole-pixel phase correlation to the mean of frames 1-5, a stand-in for the
    ImageJ Image Stabilizer. The median shift is 1 pixel; 2742 of 167,706 frame estimates above 20 pixels
    were taken as failures and not applied.
- claim: figs3b-whole-al-general-decline
  outcome: partially_reproduced
  notebook: reproduce_hart_2024.ipynb
  output: claim:figs3b-whole-al-general-decline
  measured:
  - 40.99
  - -5.68
  notes: 'At 48% the whole-AL response falls with age for 3-hexanone (young 1.613, old 0.039, t = 7.39,
    p = 2.0e-05) and isopropanol (young 0.860, old -0.151, p = 0.0085). The 3-hexanone ratio of cohort
    means, 41.0, exceeds the 8.1 needed (24.0 and 300 with the outline shrunk or grown). The isopropanol
    old mean is negative, so its ratio (-5.68) cannot express a fold decline and does not reach 51.3.
    The measure has a negative offset, from the minimum filter on noisy per-pixel fold change: paraffin
    oil trials give a median of -0.23 (per ant -0.45 to 0.075). With each ant''s paraffin oil value subtracted,
    both declines hold (p = 5.3e-05 and 0.012) and both old means are positive, but the ratios are 6.0
    and 9.5, below 8.1 and 51.3; so the ratios are not reached either way, and the outcome does not rest
    on the offset. Without the minimum filter the map saturates near the clip value of 4 even for paraffin
    oil (median 3.80), so that variant measures no response. The paper''s Figure S3B values are not in
    the text, so the offset could not be compared with its scale.'
  deviations:
  - As fig2d-whole-al-alarm-no-age-effect (outline by threshold, stabilisation by phase correlation).
  - 'Variants added in revision, to show the offset: each ant''s paraffin oil value subtracted, and the
    map without the minimum filter.'
