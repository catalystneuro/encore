inputs:
- what: The paper's per-cell and per-animal tables ("Zhai et al. 2025 Datasets", eleven workbooks),
    used as reference values for the link claims, for the genotype labels of the AIM mice, and as the
    data of the claims marked elsewhere (control and 6-OHDA groups, oxo-M, rotations, open field).
  source: Zenodo doi:10.5281/zenodo.17307059 (record 17307059, the version the paper's key resources
    table resolves to)
- what: The paper's analysis scripts, read for the spike count and rheobase rule, the dendritic
    excitability index (backgrounds 55 and 161, 6-sample running mean, windows 0.5 to 0.95 s and 0.95
    to 1.5 s) and the GRAB-ACh area (background 162, F0 over 1 s, area over 2 s, calibration windows
    2 to 4 s). No code from them is run.
  source: Zenodo doi:10.5281/zenodo.14145776, doi:10.5281/zenodo.14163502 and doi:10.5281/zenodo.14163731
outcomes:
- claim: link-somatic-cells
  outcome: partially_reproduced
  notebook: reproduce_zhai_2025.ipynb
  output: claim:link-somatic-cells
  notes: Groups are matched by name and every group the dandiset holds has the paper's n (12 of 12
    groups, 123 cells). 90 of 123 cells (73.2%) match a row of the paper's table exactly over 20 to
    300 pA and 105 (85.4%) within 3 spikes, below the 80% and 95% of the criterion; 108 have the same
    rheobase as their best match. dSPN on has the fewest exact matches (6 of 15). Where cells match,
    the paper's rows follow the dandiset's order by date and cell number.
  deviations:
  - The paper's spike counts come from its script run on Prairie View exports; the differences of
    1 to 24 spikes may come from the export or from cells whose steps are missing or repeated in the
    files (18 cells miss a step, 14 repeat one).
- claim: link-dendritic-cells
  outcome: reproduced
  notebook: reproduce_zhai_2025.ipynb
  output: claim:link-dendritic-cells
  notes: 89 of 92 cells have an index; three have no proximal and distal site of the same number.
    Counts equal the paper's n in 7 of 10 groups (iSPN on 9 against 10, iSPN on+sul 7 against 8, KO
    off 10 against 11). Over 63 matched cells the index differs from the paper's by a median of 4.0%
    (50 within 10%, Spearman 0.911). The Figure 6D cells, matched by date and letter, differ by
    medians of 3.5% and 6.4%. Matching by order was possible in 7 groups whose counts equal the
    paper's.
  deviations:
  - Outside Figure 6D the paper's table has no cell identifiers, so cells are matched by order, an
    assumption supported by the somatic link.
  - The background constants of the paper's script (55 red, 161 green) are used for every session,
    as the files carry no per-session background.
- claim: link-sr-cells
  outcome: partially_reproduced
  notebook: reproduce_zhai_2025.ipynb
  output: claim:link-sr-cells
  notes: All 14 dandiset cells match a paper identifier (date and session letter); the paper has 33
    cells (17 off, 16 on), so the dandiset holds one cell per mouse. In every cell the detector here
    finds fewer events (2 to 85, against 29 to 127 in the paper's tables) and a higher mean amplitude
    than the paper's events; 2 of 14 cells are within 25% on both. The paper's frequency equals its
    event count over 3.6 s. With the paper's per-cell amplitudes, on-state dSPNs are all above
    off-state ones and on-state iSPNs all below (Mann-Whitney P = 0.057 each).
  deviations:
  - Events are found with a threshold detector written here (low-pass 1 kHz, five robust SD, local
    baseline); the paper used TaroTools with visual verification, which cannot be repeated.
- claim: link-grab-rois
  outcome: not_reproduced
  notebook: reproduce_zhai_2025.ipynb
  output: claim:link-grab-rois
  notes: The dandiset holds one region per mouse, 11 of the paper's 34 (3 of 13 unlesioned, 3 of 10
    6-OHDA, 5 of 11 off-state). The paper's regions have no identifier linking them to mice; by the
    nearest vector of single-pulse areas only 5 of 11 mice have a paper region within 0.05 on every
    treatment (the 20240402 mouse within 0.007), so the regions cannot be identified.
  deviations:
  - The stimulus time is taken from the trial table (3 s after the trial start in six files), where
    the paper's script fixes 10 s.
- claim: link-aim-mice
  outcome: not_reproduced
  notebook: reproduce_zhai_2025.ipynb
  output: claim:link-aim-mice
  notes: 7 of 9 dandiset mice are in the paper's tables (4124 and 5871 are not). The two Figure 10
    mice (5844 control, 5846 M1R deletion) have totals equal to the paper's in all 10 sessions; the
    five Figure 8 mice (1945, 2519, 2828 and 6572 KO, 2587 wild type) agree in 5 of 25 sessions (for
    1945, session 1, 33.5 against 27.0). The dandiset's own genotype labels for the CDGI mice
    contradict each other, so the paper's labels were used.
  deviations:
  - The paper's session total is taken to be the sum over the session's time points; the Figure 8
    mice have 4 time points in some dandiset sessions and 6 in others, which may explain part of the
    difference.
