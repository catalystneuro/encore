- claim: fig3f-ispn-dendritic-on-lower
  outcome: reproduced
  notebook: reproduce_zhai_2025.ipynb
  output: claim:fig3f-ispn-dendritic-on-lower
  notes: Index on-state 0.339 (10) against off-state 0.524 (10), P = 0.0073 (exact 0.0052), effect
