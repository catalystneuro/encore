findings:
- kind: data_missing
  statement: The dandiset holds no patch-clamp recordings from unlesioned control or 6-OHDA-lesioned
    mice, which make up the control and 6-OHDA groups of Figures 1E, 1F, 1I, 3C, 3D and 3F (10, 12,
    11 and 9 dSPNs; 21, 11, 14 and 9 iSPNs), nor the oxo-M line scans of Figure 7E or the open-field
    data of Figure 10. The paper's raw data on Zenodo (doi:10.5281/zenodo.17260198) list folders for
    all of these.
- kind: selection_undocumented
  statement: The Sr2+-oEPSC files hold one cell per mouse (14 of the paper's 33 cells), the GRAB-ACh
    files one region per mouse (11 of 34 regions) and the AIM tables 7 of the paper's 44 mice plus
    two mice (4124, 5871) not in the paper. The dandiset does not say that it holds a subset or how
    the cells, regions and mice were chosen, and with these numbers the paper's tests cannot reach
    P < 0.05 for most comparisons.
- kind: metadata_error
  statement: Session names state a drug (D1RaSch, D2RaSul) for files that also hold baseline on-state
    sweeps, and 11 cells in such files are baseline only. The condition of each sweep is only in the
    RecordingsIndexTable column condition_subfolder; grouping by session name puts baseline cells in
    the drug groups.
- kind: metadata_error
  statement: The genotypes of the CDGI behaviour mice contradict each other. Subject genotype is
    Wild-type CDGI and every session name says WT for all of them; the AIM table's genotype column
    says CDGI Knockout, Wild Type or unknown, changing between sessions of one animal; the video
    files of mice 1945, 2519, 2587, 2828 and 6572 say CDGI KO. The paper lists 2587 as wild type and
    the others as KO.
- kind: other
  statement: The AIM session totals of the five Figure 8 mice in the dandiset differ from the paper's
    table in 20 of 25 sessions (mouse 1945 session 1, 33.5 against 27.0), while the two Figure 10
    mice agree in all sessions. Some dandiset sessions have 4 time points and others 6.
- kind: metadata_insufficient
  statement: The dandiset holds the raw spine image stacks and the rotation videos but no spine
    counts or rotation counts, the measurements behind Figures 2B, 2C, 4B, 4C, 4K, 6F, 7H, 8A, 9F and
    10A. They are only in the paper's Zenodo tables.
- kind: metadata_error
  statement: The stimulus series of every dendritic sweep (CurrentClampSeries_CellN_Dendritic_Stimulus)
    is all zero, though the three spikes per sweep show the 2 nA injections were delivered; and the
    index table gives no kymograph slice for 53 of 997 dendritic sweeps.
- kind: metadata_error
  statement: In the Sr2+-oEPSC files the light-pulse OptogeneticSeries is all zero in 69 of 140 sweeps,
    and the intracellular recordings table references no stimulus (its stimulus rows are empty). The
    pulse time (0.02 s) is only in the optogenetic epochs table.
- kind: metadata_error
  statement: The GRAB-ACh background reference images are described as taken at zero laser power,
    but their mean (381 to 525) is above the signal (F0 179 to 355), so they cannot be the PMT
    background the Methods subtract.
- kind: metadata_error
  statement: The files cite the bioRxiv preprint (related_publications) and describe the behaviour
    data with the preprint's figure numbers ("Figure 7J" for the CDGI AIM scores, "Figure 8" for the
    M1R study), which are Figures 8 and 10 in the published paper the dandiset names.
- kind: identifier_missing
  statement: Patch-clamp subjects are named by recording date (for example Subject20160523LIDOFFeGFP
    and SubjectRecordedAt20160523000000 for the same day), with no animal identifier, so recordings
    and spine stacks of one mouse cannot be linked, and the archive counts 185 subjects.
- kind: paper_inconsistency
  statement: Recomputed on the paper's own per-cell tables, some reported P values differ; the
    oxo-M test in CDGI KO gives P = 0.47 where the paper reports 0.910, and the rotation test of
    Figure 8A gives 0.012 where the text reports 0.0092. Others agree closely (0.009766 against 0.0098
    for oxo-M in wild type).
- kind: other
  statement: 18 somatic cells miss one or more current steps between 20 and 300 pA and 14 repeat a
    step; spike counts for these cells cannot be complete.
