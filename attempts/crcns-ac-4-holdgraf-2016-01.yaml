    BEFORE cluster reaches P < 0.05 in either region. In 19 frontal/premotor Speech-R electrodes MIDDLE
    exceeds BEFORE from 6.7 to 8.3 Hz (P = 0.0012), where the paper reports no effect. The paper has 72
