- claim: fig4a-coherence-after-higher
  outcome: reproduced
  assumed: true
  notebook: reproduce_holdgraf_2016.ipynb
  output: claim:fig4a-coherence-after-higher
  notes: On the 84 Speech-R electrodes on temporal or perisylvian cortex (set a), AFTER/MIDDLE minus BEFORE/MIDDLE
    coherence is +0.40 bits/s over 0 to 1 s (P = 0.0023) and +0.29 over 1 to 2.5 s (P = 0.0053); before
    the sound +0.27 (P = 0.137). All seven subjects are positive. On all 251 temporal or perisylvian electrodes
    (set b) only 1 to 2.5 s differs (P = 0.032; 0 to 1 s P = 0.65). Set (a) is adopted, as the Results
    compute it on speech-responsive electrodes and its 84 is close to the paper's 78. The integrated coherence
    is about 14 bits/s in both conditions, mostly the bias of single-trial coherence from three tapers,
    which is the same for both conditions.
  deviations:
  - Speech-R carried into this claim is the reading z-score by non-event times, 0 to 2.5 s, MIDDLE trials
    (101 electrodes), the first reading within the paper's count in the claims file's order (see speech-r-count).
  - Assumed. The multitaper bandwidth is not given; a 400 ms window at 50 Hz has 20 samples and MNE's
    default bandwidth gives one taper, for which single-trial coherence is 1. NW = 2 (three tapers) with
    a jackknife over tapers, integrated from 2.5 to 25 Hz.
  - Windows are assigned to the -1 to 0, 0 to 1 and 1 to 2.5 s ranges by their centre; the -1 to 0 s range
    holds two windows.
- claim: fig4b-coherence-sentence-specific
  outcome: reproduced
  assumed: true
  notebook: reproduce_holdgraf_2016.ipynb
  output: claim:fig4b-coherence-sentence-specific
  notes: On set (a), 1 to 2.5 s gives AFTER/MIDDLE higher with the mean over all trials subtracted (+0.20
    bits/s, P = 0.038) and with the mean per condition (+0.29, P = 0.0025). Unlike the paper (P = 0.241),
    0 to 1 s is also significant (P = 0.0057 and 0.0056). On set (b) the late window gives P = 0.106 and
    0.016.
  deviations:
  - The multitaper choice of fig4a-coherence-after-higher (assumed).
- claim: strf-r-count
  outcome: not_reproduced
  notebook: reproduce_holdgraf_2016.ipynb
  output: claim:strf-r-count
  measured: 9
  notes: With leave-one-trial-out ridge on the MIDDLE trials, 9 electrodes are STRF-R under the bootstrap
    bound (a), 0 under the per-split percentiles (b, c); with samples to 400 ms after offset, 13, 1 and
    1. The paper reports 53. Only about 19 electrodes have a mean held-out R2 above 0 at any ridge value;
    the STRF-R electrodes have mean R2 0.044 to 0.226. They come from S01 (4), S02 (1) and S04 (4); none
    from S03, S07, S08 or S13.
  deviations:
  - The ridge parameter is the mode of the per-split best values over Speech-R electrodes and the three
    conditions, leaving out values at the top of the grid (1e8). Assumed. The Methods take the mode of
    the selected values, but 2751 of 11860 values sit at the top of any grid, where no alpha predicts
    the held-out trial better than the null model, so the plain mode is the grid edge; the claims file
    asks for a grid whose mode is not at an edge. Both this mode and the mode of each electrode's best
    alpha give 1e5.
  - Auditory spectrogram compression (cube root) and spectral sharpening (rectified difference with the
    next lower band, as in the NSL model of the Methods' ref. 3) are standard choices; the gammatone filters
    are applied in the frequency domain.
  - HFB band edges and filter orders are not given (claims, open detail 4); 21 log-spaced centres 70 to
    140 Hz, each band 10% of its centre wide, 2nd-order Butterworth applied forwards and backwards, as
    a standard choice.
  - Inputs and outputs are z-scored with each fold's training statistics; R2 is the coefficient of determination
    on the held-out trial, as the criterion says.
