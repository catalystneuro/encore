- claim: speech-r-count
  outcome: reproduced
  notebook: reproduce_holdgraf_2016.ipynb
  output: claim:speech-r-count
  measured:
  - 101
  - 377
  notes: Three of twelve readings (open details 1, 2 and 3) give a count within 92 +/- 9.2, all with the
    z-score by non-event times (the code's zscore_by_non_events). Onset to sound end with all speech trials
    gives 96, 0 to 2.5 s with MIDDLE trials 101 (recorded as measured, the first matching reading in the
    criterion's order), 0 to 2.5 s with all trials 99. The per-trial baseline z-score gives 141 to 185
    and the pooled baseline 131 to 150. The data set holds 377 good electrodes of 416, against the paper's
    468, so 101 is 26.8% of electrodes against 19.6%; the criterion reports the total and does not judge
    it. Speech-R electrodes are mostly temporal (66) and perisylvian (18), as the statement says.
  deviations:
  - HFB band edges and filter orders are not given (claims, open detail 4); 21 log-spaced centres 70 to
    140 Hz, each band 10% of its centre wide, 2nd-order Butterworth applied forwards and backwards, as
    a standard choice.
  - The z-score, window and trials are open details the claims file lists; the result matches under 3
    of 12 combinations, all with the non-event z-score.
  - Electrodes are those marked good in channels.tsv (377); the paper's 468 come from channels the data
    set does not hold.
  - Pink noise triplets and the six unfiltered sentences outside any triplet in S01 to S04 are left out.
- claim: fig3b-hfb-increase-after
  outcome: reproduced
  notebook: reproduce_holdgraf_2016.ipynb
  output: claim:fig3b-hfb-increase-after
  notes: Over 101 Speech-R electrodes, AFTER exceeds BEFORE in a cluster from 0.36 to 1.28 s (P = 0.0001)
    and from 1.72 to 2.02 s (P = 0.0072). The 84 Speech-R electrodes on temporal or perisylvian cortex
    give 0.40 to 1.42 s (P = 0.0001); the per-trial baseline z-score gives P = 0.0002 for both sets. Mean
    difference 0.084 z over 0 to 1 s. S02 and S13 have a slightly negative mean difference over 0 to 3
    s.
  deviations:
  - Speech-R carried into this claim is the reading z-score by non-event times, 0 to 2.5 s, MIDDLE trials
    (101 electrodes), the first reading within the paper's count in the claims file's order (see speech-r-count).
  - HFB band edges and filter orders are not given (claims, open detail 4); 21 log-spaced centres 70 to
    140 Hz, each band 10% of its centre wide, 2nd-order Butterworth applied forwards and backwards, as
    a standard choice.
  - Cluster test with MNE defaults (two-tailed t threshold for p = 0.05) and 10,000 permutations, -0.5
    to 3 s (claims, open detail 11).
- claim: supp3a-pink-noise-no-hfb-change
  outcome: reproduced
  notebook: reproduce_holdgraf_2016.ipynb
  output: claim:supp3a-pink-noise-no-hfb-change
  notes: On the pink noise triplets of S07, S08 and S13, no AFTER minus BEFORE cluster reaches P < 0.05
    over their 36 Speech-R electrodes (smallest P = 0.0895). Set (a), the included electrodes of these
    subjects, is empty here. The mean AFTER minus BEFORE over 0 to 3 s is 0.041 z in both the pink noise
    and the speech triplets of these electrodes, and the speech triplets do give significant clusters
    (P = 0.0013), so the absence comes with an effect of the same size and less data.
  deviations:
  - Speech-R carried into this claim is the reading z-score by non-event times, 0 to 2.5 s, MIDDLE trials
    (101 electrodes), the first reading within the paper's count in the claims file's order (see speech-r-count).
  - Judged on electrode set (b) alone, as set (a) is empty.
