findings:
- kind: data_missing
  statement: The behavioural control data (three groups of 5, 9 and 15 listeners) behind Figure 2b and
    Supplementary Figures 1 and 5A are not in the data set, and the paper names no other place for them.
    Six of the paper's claims cannot be tested.
- kind: selection_undocumented
  statement: The data set holds 416 channels (377 marked good) for its 7 subjects, at most 64 per subject,
    while the paper reports grids of 48, 64, 68, 68, 62, 110 and 104 channels and 468 electrodes kept.
    The data set does not say which channels were left out or why.
- kind: identifier_missing
  statement: The subjects are named S01, S02, S03, S04, S07, S08 and S13, the paper's S1 to S7, with no
    mapping between them, so per-subject results cannot be compared with the paper's figures.
- kind: metadata_error
  statement: channels.tsv gives the unit as milliV and the header a resolution of 0.1, but the stored
    float32 values have a median absolute value of about 315 in S01 and 1.7e8 to 6.2e8 in the other six
    subjects, so the scale is neither millivolts nor the same across subjects.
- kind: metadata_error
  statement: The data set's explore_data notebook and its per-subject copies say the audio files are not
    available for privacy reasons, and the README says subject folders are named like ir-07; the zip holds
    a stimulus track per subject (stimuli/<subject>_audio.wav) and folders named sub-S01. The audio tracks
    are on the recording's clock (the mean audio amplitude rises 2.7 to 211 times at the event onsets
    in every subject), but S07's track is 1015 s for a 989 s recording, and S13's is at 20 kHz against
    16 kHz in the others; neither is documented.
- kind: metadata_insufficient
  statement: The events tables of S01, S03, S04 and S07 hold spans with trial_type 'bad' (1 to 12 per
    subject) that events.json does not describe, and 22 sounds overlap them; the paper does not mention
    them. They were kept here.
- kind: other
  statement: One triplet in S02 and one in S03 lack a sound (46 of 47 and 38 of 39 complete), and S01
    to S04 each have six unfiltered sentences outside any triplet (trial_num -1), which the data set does
    not explain.
- kind: methods_unavailable
  statement: Question for the paper's authors. How was HFB z-scored to select Speech-R electrodes? With
    each trial's own -800 to -100 ms baseline or a pooled baseline, 131 to 185 electrodes pass here; with
    the whole series z-scored by its non-event times (ecogtools zscore_by_non_events) 96 to 104, near
    the paper's 92. This attempt assumed the latter.
- kind: methods_unavailable
  statement: Question for the paper's authors. How were the ridge parameter's mode and the STRF-R bound
    computed? Over Speech-R electrodes, a quarter of the per-split best values sit at the top of any grid,
    so the mode of all values is the grid edge; this attempt took the mode below the edge (1e5). With
    the held-out trial's coefficient of determination, only 9 electrodes pass the bound (the paper has
    53). Was R2 computed per held-out trial, over a block of trials, or as a squared correlation?
- kind: methods_unavailable
  statement: Question for the paper's authors. What multitaper bandwidth was used for the 400 ms coherence
    windows of Figure 4 and Supplementary Figure 6A, and over which frequencies was the coherence integrated?
    With 20 samples per window, MNE's default bandwidth gives one taper; this attempt used three (NW =
    2), 2.5 to 25 Hz.
- kind: methods_unavailable
  statement: Question for the paper's authors. On what scale is the RMS of Figure 9c (axis about 3.6 to
    5.0) and the mean increase of 0.12? With standardized eSTRFs applied to z-scored spectrograms the
    RMS is about 105 here; the relative increase is 0.12 to 0.13.
