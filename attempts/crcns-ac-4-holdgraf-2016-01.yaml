- claim: fig8-mtf-matches-filter
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_holdgraf_2016.ipynb
  output: claim:fig8-mtf-matches-filter
  notes: On 9 electrodes, temporal minus spectral MTF has a positive cluster in the region the temporal
    filter keeps in BEFORE (centre 2.1 Hz and 0.30 cycles per band, P = 0.0078) and in AFTER (2.0 Hz,
    0.40, P = 0.043). The larger positive clusters lie at 16 to 19 Hz (P = 0.0039 to 0.031), outside both
    regions. For the shift, the MTF of the difference has one significant cluster, at 15.3 Hz (P = 0.0039),
    outside the regions, and the difference of MTFs none. With 9 electrodes the smallest possible P is
    0.0039.
  deviations:
  - Every eSTRF claim rests on the 9 included electrodes found here (S01 4, S02 1, S04 4), against the
    paper's 41 (see strf-r-count and included-electrode-count).
  - The ridge parameter is the mode of the per-split best values over Speech-R electrodes and the three
    conditions, leaving out values at the top of the grid (1e8). Assumed. The Methods take the mode of
    the selected values, but 2751 of 11860 values sit at the top of any grid, where no alpha predicts
    the held-out trial better than the null model, so the plain mode is the grid edge; the claims file
    asks for a grid whose mode is not at an edge. Both this mode and the mode of each electrode's best
    alpha give 1e5.
  - Auditory spectrogram compression (cube root) and spectral sharpening (rectified difference with the
    next lower band, as in the NSL model of the Methods' ref. 3) are standard choices; the gammatone filters
    are applied in the frequency domain.
  - Assumed (from the criterion, and made concrete here). Low and high modulation are below and above
    the median of the plane's absolute temporal (11.9 Hz) and spectral (0.234 cycles per band) modulations,
    measured at the cluster's mean position.
  - The cluster test runs on the half plane of non-negative spectral modulation, as the amplitude spectrum
    of a real eSTRF is symmetric.
