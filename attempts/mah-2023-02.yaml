- claim: fig2k-initiation-sensitive-to-previous-offer
  outcome: partially_reproduced
  notebook: reproduce_mah_2023.ipynb
  output: claim:fig2k-initiation-sensitive-to-previous-offer
  measured:
  - 256
  notes: 'Code reading (all mixed block trials) 256 rats with p < 0.05, 255 slower after small offers;
    population +0.091 against -0.148 z, rank-sum p = 9.9e-97, signed-rank p = 1.9e-49. Methods reading
    (20 uL trials) 276 rats with p < 0.05 but only 17 slower after small offers, and the population is
    faster after small offers (-0.161 against -0.094 z, rank-sum p = 6.6e-30). The offer repeats after
    every violation (100% of 4,260,728 post-violation trials, against 26% after other trials), and the
    code''s result comes from those trials: post-violation trials alone give 291 rats slower after small
    offers (+0.370 against -0.249 z), while the code''s trials without them give 287 significant rats,
    20 slower after small offers, and a population faster after small offers (-0.164 against -0.096 z,
    p = 2.4e-32), as the Methods reading. The 20 uL reading holds no post-violation trials, since a repeated
    offer has a previous offer of 20 uL. The count and direction hold only with the post-violation trials.
    Why is not tested: on those trials the previous offer is also the coming offer, so a rat that uses
    the repeat and a rat whose initiation after a violation depends on the violated trial''s offer give
    the same result.'
  deviations:
  - 'The Methods (20 uL trials) and latency_post20ul_by_previous_vol.m (all mixed block trials) differ;
    both were run, as the criterion asks. They give opposite directions, so the outcome is partial: the
    code''s count and direction reproduce, the Methods'' direction does not. Recorded as a code_mismatch
    finding.'
  - Previous trials and lags are taken within the session; the paper's code concatenates sessions, which
    differs only at session starts.
