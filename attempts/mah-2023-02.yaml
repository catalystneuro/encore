  outcome: partially_reproduced
  notebook: models_mah_2023.ipynb
  output: claim:fig3i-retrospective-model-captures-initiation
  notes: Equation 10 model at alpha0 0.1042, overshoot 0.200 z and gap after high minus after low +1.398
    z over trials 10-20. Static and |delta| models at alpha0 0.05 lack both (overshoot 0, gap -0.456 and
