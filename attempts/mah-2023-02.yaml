findings:
- kind: selection_undocumented
  about: data
  severity: major
  statement: The dandiset holds only the sessions that pass the paper's inclusion criterion (the data
    of Figures 1 to 3), and nothing in it says so. The rig's trial counter (trials_in_stage) jumps between
    consecutive deposited sessions in 2,586 of 22,742 pairs (284 rats), and the first deposited session
    of a rat starts at a median of 1,543 final-stage trials. The paper's Zenodo deposit holds a median
    of 95 final-stage sessions per rat against 71 here (its file of all sessions ends earlier than the
    dandiset for 49 rats, see the last finding). Figure 4 and the pre-cue analyses, which use all sessions,
    cannot be run on the dandiset alone.
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: The task argument center_port_cue has no description. It marks the pre-initiation cue sessions
    of Figure 5 (True in 762 sessions, all of the 16 rats Figure5.m names), which the session description
    and dandiset metadata do not mention. On flagged sessions all 16 rats have initiation times that fall
    with the offer (slopes -0.008 to -0.069 per log2 offer), against -0.008 to +0.004 on other sessions;
    for S050 the slopes on flagged and other sessions are close (-0.0084 and -0.0076).
- kind: other
  about: data
  severity: minor
  statement: wait_time_threshold equals the mean + 1 SD of all catch trials with a wait time, including
    16,086 timed-out catch trials at 100 s; over opt-out catch trials alone it would be lower in all
    291 rats, by a median of 5.19 s. The description says 'wait-times of the subject on catch trials' without saying that timeouts
    are included.
- kind: other
  about: data
  severity: minor
  statement: Catch probability 0.3 occurs in 180,591 trials of 8 rats, a cohort the paper does not list,
    and two block transitions go directly between high and low blocks.
- kind: other
  about: data
  severity: none
  statement: 'The counts match the paper exactly: 291 rats (184 male, 107 female), a median of 33,493
    trials and 71 sessions per rat, all in the final training stage (code stage 9); the same 291 rats
    are in the Zenodo deposit''s ratList. No session is deposited twice, and hit trial wait times equal
    the reward delays.'
- kind: code_mismatch
  about: paper
  statement: For the previous-offer sensitivity of initiation times (Fig. 2k, 2l, 5c) the Methods use
    20 uL trials in mixed blocks, while latency_post20ul_by_previous_vol.m uses all mixed block trials.
    Only the code's version reproduces the result, and only through the trials after violations, on which
    the task repeats the offer (100% of them), so that their previous offer is also their coming offer.
    Without those trials, and with the Methods' trials, the population initiates faster after small offers
    (-0.164 against -0.096 z and -0.161 against -0.094 z).
- kind: paper_inconsistency
  about: paper
  statement: Fig. 2f is reported as r = 0.08, p = 0.18 in the Results and r = -0.03, p = 0.53 in the legend;
    the Methods' tau procedure on the dandiset gives r = -0.037, p = 0.535, close to the legend.
- kind: methods_unavailable
  about: paper
  statement: The model fitting code is not public. Questions for the authors - which parameters were free
    and with what bounds and starts, whether the 5 folds split sessions or trials, and whether the reported
    cross-validated nLL is the summed test nLL or the best fold's. This attempt's choices are stated in
    the deviations of fig3j, suppfig8, fig3f, fig3i and fig3l; fig3f fails with them and suppfig8 depends
    on the seed.
- kind: methods_unavailable
  about: paper
  statement: Fig. 3c cohort sizes (3, 183, 61, 151, 39) sum to 437 for 291 rats. Question for the authors
    - is each rat counted at every catch probability it ran? Counting so gives 3, 188, 61, 151 and 40
    rats here; assigning each rat to one probability does not.
- kind: other
  about: paper
  statement: The paper's Zenodo deposit (doi:10.5281/zenodo.10031483, A_Structs_all), which its README
    describes as all sessions that ended on the final training stage, stops earlier than the dandiset
    for 49 rats. 1,718 dandiset sessions of these rats are dated after the rat's last session found in
    the deposit; that last session is on 21 to 23 November 2022 for 42 of them, and the later sessions
    run to 2023-06-29. 22 of the rats have fewer final-stage sessions in the deposit than in the dandiset.
    Figure 4 uses each rat's first 50 final-stage sessions, so only the 10 of these rats with fewer than
    50 deposit sessions can be affected, and fig4a gives the same result without the 49 rats.
- kind: metadata_insufficient
  about: data
  severity: minor
  found: on_prompt
  statement: No file gives a subject age. The 21,852 files of 275 rats give a date of birth, and the 1,181
    files of the other 16 rats give only the range P6M/P24M as the age, so the age of these 16 rats is
    not known.
- kind: code_mismatch
  about: paper
  found: on_prompt
  statement: Equation 6 lets a mixed block become a low (or high) block with probability H0, while the wait
    time model script uses H0/2 for each (p_b in GenerateSynthData_Bayes.m at b7b68ca8c107). Question for
    the authors - which was used for the fits?
- kind: code_mismatch
  about: paper
  found: on_prompt
  statement: Figure5.m lists 16 rats but 20 start dates and pairs startDates(rr) with rat rr, so the first
    16 dates are used, and the Methods' offset of 30 pre-cue sessions for switched rats is not in it. With
    that pairing, the first session with center_port_cue true is on the rat's date or the day after for
    9 of the 12 rats with earlier sessions, and 14, 34 and 41 days later for E005, S042 and S050. Question
    for the authors - are the dates paired with the rats in order, and were sessions before the 30th pre-cue
    session left out?
- kind: code_mismatch
  about: paper
  found: on_prompt
  statement: myTauShuffleTest.m fits the shuffled groups' mean coefficients times 10 with the amplitude bounded
    at 1, and the observed groups' coefficients unscaled within other bounds. For wait times the coefficients
    start at the current offer (regress_wt_vs_rew.m), whose mean coefficient over the 291 rats is 0.211
    here, 2.108 after scaling, above the bound, so the null is not on the observed scale. The Methods describe
    the fits on previous trial coefficients only. Question for the authors - was the wait time test meant
    to include the current offer?
