    depth and amplitude without lateral position (top 25% under both registrations, and top 10% with min_cluster_size
    25 under nonrigid registration), with changes down to -0.0124. With lateral position, depth and amplitude
    it is higher in all 16, by 0.0364 to 0.0890. By amplitude cut it is higher in 14 of 16 with the top 10%
    and 8 of 16 with the top 25%. On the smoothed raster it is higher in 24 of 32, and on the raster of only
    the spikes below the amplitude cut, which the spline was not fit to, in 22 of 32 (all 16 with lateral position,
