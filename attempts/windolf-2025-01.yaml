- claim: edf3c-spline-subsecond
  outcome: reproduced
  assumed: true
  notebook: reproduce_windolf_2025.ipynb
  output: claim:edf3c-spline-subsecond
  notes: In all 32 combinations (the 16 above, each with a least-squares and a penalized cubic spline, knots
    every 0.4 s) the pooled within-cluster s.d. after spline correction is below the 5th percentile of 100
    scrambled controls (for example 44.08 against 65.58 um, with nonrigid registration, top 10%, three features,
    min_cluster_size 100, penalized), so the criterion is met. The control cannot fail. On a surrogate with
    the spike times shuffled (no motion) it also passes in 32 of 32. Held out of the fit, the penalized spline
    still captures motion. Fit on half of each cluster's spikes, it lowers the s.d. of the other half in 32
    of 32 cases (16 combinations, both ways), by 0.6% to 53.4% (median 5.3%), and in 0 of 32 on the surrogate.
    GCV picks a penalty of 0.01 to 1 (1,017 to 1,419 effective degrees of freedom) on the data and the largest
    tried, 1e5 (65 to 82), on the surrogate. Fit on half of the clusters, it lowers the s.d. of the other clusters
    in 22 of 32 cases, so not every cluster shares the fast motion. The least-squares spline overfits. Held
    out, it lowers the s.d. in 27 of 32 spike halves and raises it by up to 1,629% in others, as its trace
    reaches thousands of um (down to -14516.9) between clustered spikes; at the spikes it is fit to it stays
    within -238.9 to 549.4 um. The penalized trace has an s.d. of 31.0 to 45.3 um, 29.1% to 50.4% of its power
    above 0.5 Hz, and a spectral peak at 0.26 to 0.27 Hz in every combination. The centred spikes have spectral
    peaks at 0.25, 0.53 and 0.78 Hz, consistent with the ventilation of a paralyzed animal, and at 1.99 or
    2.27 Hz, in the range of a heart rate; the spline cannot follow motion above 1.25 Hz (at most 0.35% of
    its power lies above 2 Hz), so a heartbeat is not in it. With the IBL preprocessing before the same detection
    the control passes in 32 of 32 and the penalized spline lowers the held-out s.d. in 32 of 32 cases (by
    0.6% to 27.3%). The control's weakness is asked of a reader (questions/001290.yaml).
  deviations:
  - Spikes were detected and localized under reading (ii) of pipeline step 1 (SpikeInterface bandpass 300 to
    6,000 Hz, global median reference, locally exclusive detection at 6 times the noise, monopolar triangulation
    within 75 um, as in notebook/ap_registration.ipynb of github.com/evarol/dredge at commit ed236113). The
    criterion asks for readings (i) and (ii). Reading (i), IBL preprocessing then DARTsort, was tried outside
    the notebook while preparing it (DARTsort at commit 459cf656 on 4 CPU cores, no GPU) and was far too slow
    to fit the notebook's 60 minute limit; that trial is not in the notebook and decides nothing here, so reading
    (i) is not_runnable in this attempt. The IBL preprocessing of reading (i) (bandpass, phase shift, interpolation
    of dead and noisy channels, removal of channels outside the brain and spatial high-pass filtering in SpikeInterface,
    as the Methods describe it for the IBL data, Preprocessing of AP band data, paragraph 1) was run before
    the detection and localization of reading (ii) in the second notebook, ibl_preprocessing_variant.ipynb,
    as a partial check; it gives the same outcome for this claim. The outcome assumes that reading (ii) stands
    for step 1. It is the detection of the code the paper links for DREDge, and the Methods say detection and
    localization were chosen to suit each data source without naming the choice for this recording.
  - Outliers (more than 5 s.d. from the cluster mean) were removed on depth, the coordinate the spline models;
    the Methods do not say on which coordinates.
  - The least-squares spline is solved as a minimum-norm least-squares problem (rcond 1e-8), a numerical choice.
    Knot intervals with no clustered spikes are not fixed by the data, and the trace reaches thousands of um
    there; it is evaluated only at spike times.
  - The penalized spline is a P-spline (cubic B-splines on the same knots, second-difference penalty) with
    the penalty chosen by generalized cross-validation over 17 values from 1e-3 to 1e5, the claims file's reading
    made concrete.
  - The held-out checks (the spline fit on half of each cluster's spikes, or on half of the clusters, and evaluated
    on the other half) and the no-motion surrogate (spike times shuffled among the clustered spikes) are not
    in the claims file or the paper. The verifier asked for them; they are reported beside the outcome and
    do not decide it.
