findings:
- kind: methods_unavailable
  statement: For the macaque recording of Extended Data Fig. 3 the paper does not say how spikes were detected
    and localized (the Methods say these steps were chosen to suit each data source), what amplitude cut defines
    high-amplitude spikes, which coordinates and what min_cluster_size entered HDBSCAN, how features were scaled,
    whether the spline was penalized, or whether the template correlation's raster keeps the Gaussian smoothing,
    and no code for the spline method is linked. Questions for the authors. Which detection and localization
    were used for this recording, which amplitude cut, and do the "registered positions" given to HDBSCAN include
    the lateral coordinate? With the detection of the DREDge demo notebook, the spline improves the template
    correlation in all 16 combinations with lateral position, depth and amplitude and in 6 of 16 with depth
    and amplitude only; with the IBL preprocessing before the same detection, in all 16 with the top 10% amplitude
    cut and in 6 of 16 with the top 25% cut.
- kind: paper_inconsistency
  statement: The Results and the Fig. 2b legend place the spline-based fast-motion method in a human recording,
    while the Methods (Tracking fast motion from spikes) and the Data availability place Extended Data Fig.
    3 in the macaque recording of this dandiset.
- kind: metadata_error
  statement: The dandiset description says the recording is studied in "Supp. Fig. 3" of the paper; the published
    paper shows it in Extended Data Fig. 3 (the description uses the preprint's numbering).
- kind: metadata_insufficient
  statement: The probe is described as "A Neuropixel probe of unknown subtype" and every electrode's location
    is "unknown", while the session description says primary visual cortex. The channel layout (4 columns at
    x 0, 16, 32 and 48 um, 20 um rows) and the gain (2.34375 uV per bit) are those of Neuropixels 1.0.
- kind: metadata_insufficient
  statement: The file has no stimulus, trial or unit tables. The session description names static gratings
    at 8 orientations, where the paper's Methods say most stimuli in these experiments were binary or ternary
    noise at 40 Hz; nothing in the file says which was shown or when.
- kind: identifier_missing
  statement: The asset is named sub-L11104_ses-None_ecephys.nwb; the session has no identifier.
- kind: metadata_insufficient
  statement: The electrode table marks no bad channels (its columns are location, group, group_name, channel_name,
    inter_sample_shift, contact_ids, contact_shapes, rel_y and rel_x). Channel 86, at 860 um, has a noise level
    of 322.9 uV, about 40 times the median of 8.31 uV, and the IBL bad channel detection labels it noisy in
    all 12 blocks tested; it labels 10 channels dead in all 12 blocks, at intervals of 37 to 39 channels (36,
    66, 75, 112, 151, 188, 227, 264, 303 and 340).
- kind: other
  statement: Only raw AP and LF voltages are deposited. No spike times, localizations or motion estimates behind
    Extended Data Fig. 3 are included, so checking the figure means re-running detection on the 7.4 GB file
    (8.3 minutes for the detection of reading (ii) and 19.0 minutes with the IBL preprocessing, on 4 CPU cores
    here).
verifications:
- date: '2026-11-02'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The handover of the first run (the executed notebook reproduce_windolf_2025.ipynb with
    the conclusions and summary removed), the helper module pulsation.py and the claims file; the verifier
    also read the paper under paper/ and the archive's asset list. Report in transcripts/001290/verifier-1-report.md.
  results:
  - claim: edf3a-ap-dredge-slow-trend
    agrees: true
    outcome: reproduced
    reason: 'Reproduced, but only under step 1 reading (ii). Cell 11: mean template correlation goes from 0.3023
      unregistered to 0.3319 nonrigid (a) and 0.3338 rigid (b), with 70.8% and 67.5% of time bins improved.
      The displacement range and s.d. are reported and the trace is plotted. The criterion also requires reading
      (i), which was not run, so this is reproduced only under the readings that were run. Reading (i) rests
      on a runtime trial done outside the notebook, which cannot be verified, and a cheaper partial check (IBL-style
      SpikeInterface preprocessing followed by the reading (ii) detector) was not attempted (problem 2). The
      template correlation helper does not smooth, though the Methods build the metric on the smoothed raster
      (problem 6). The AP estimate is jumpy, its within-60-s s.d. comparable to the slow trend, but the criterion
      uses only the template correlation (problem 10). The claims file misreads the code''s smoothing default
      (problem 7).'
    response: Outcome kept, still marked assumed. Added the partial check the verifier proposed as a second
      notebook, ibl_preprocessing_variant.ipynb (IBL bad channel detection, phase shift, interpolation, spatial
      high-pass, then the reading (ii) detector, on the whole recording); the correlation still rises under
      both registrations (0.2897 to 0.3300 and 0.3360). The DARTsort trial is no longer given any number in
      the record and is said to decide nothing; a run of reading (i) on a segment was not added because DARTsort
      is not in the locked environment and was far too slow on this CPU. Added the smoothed raster as a second
      reading of the metric (0.6454 to 0.7034 and 0.7107) and a deviation citing the passage. Problem 7 is
      asked of a reader in questions/001290.yaml. The jumpiness stays in the notes. The re-run gives slightly
      different registration numbers from round 1 (bins improved 70.7% and 66.7%, rigid range -84.2 to 131.4
      um); the mean correlations are the same to four decimals.
  - claim: edf3b-hdbscan-clusters
    agrees: true
    outcome: reproduced
    reason: 'Reproduced (reading (ii) only). Cell 16: at least two clusters in 16 of 16 combinations (6 to
      41 clusters). The cluster count and sizes are reported for each. Within-cluster depth s.d. is 22 to 135
      um, and one cluster of about 16,000 spikes appears in every combination. These are not unit-like clusters;
      the at least two clusters threshold set by the claims file passes trivially (problem 9).'
    response: Outcome kept. Added, for one combination, each cluster's depth, lateral position, amplitude,
      spread, number of peak channels and spikes per 100 s, as asked; the 16,000-spike cluster lies at 2,322
      um on 11 channels at 204 uV and fires through the recording, so it reads as a group of neighbouring units.
      The notes say so. The IBL preprocessing variant gives 9 to 35 clusters in all 16 combinations.
  - claim: edf3c-spline-subsecond
    agrees: true
    outcome: reproduced
    reason: 'Reproduced (reading (ii) only), but the test is uninformative. In 32 of 32 combinations the spline-corrected
      s.d. is below the 5th percentile of the scrambled s.d. A synthetic test shows this control also passes
      on pure noise (problem 1): a spline fitted in-sample always beats a permutation of itself, so the pass
      carries almost no evidence. The GCV penalties (0.01 to 1 on the real data, 1e5 on noise) point to real
      sub-second structure, but that is not a held-out test. The criterion asks for the spline trace''s power
      spectrum, and only the fraction of power above 0.5 Hz is given (problem 8). The least-squares trace reaches
      -14,518 to 4,367 um and the docstring''s claim that coefficients without data stay near zero does not
      hold (problem 5).'
    response: 'Outcome kept, as the criterion decides it, with the weakness stated in the conclusion and notes.
      Added the outputs asked for: held-out versions with half of each cluster''s spikes and with half of the
      clusters, and the control on a surrogate with shuffled spike times. The control passes on the surrogate
      in 32 of 32, confirming the verifier''s point; held out, the penalized spline lowers the s.d. in 32 of
      32 spike halves and 0 of 32 on the surrogate, and in 22 of 32 cluster halves. Added the power spectra
      of the spline traces and of the centred spikes, with peak frequencies (0.26 to 0.27 Hz for the spline;
      0.25, 0.53, 0.78 and 1.99 or 2.27 Hz for the spikes). Corrected the fit_spline comment and the deviation
      on the least-squares spline, and reported its range at spike times. The criterion''s control is asked
      of a reader in questions/001290.yaml. The IBL preprocessing variant gives the same results.'
  - claim: edf3de-spline-improves-registration
    agrees: true
    outcome: partially_reproduced
    reason: 'Partially reproduced (reading (ii) only). Panel e s.d. is lower in 32 of 32, but that measure
      cannot fail (problem 3; in a noise-only simulation it also dropped). Panel d template correlation is
      higher in 22 of 32: all 16 combinations using x, y, amplitude features improve; 6 of 16 using y, amplitude
      do (changes -0.012 to +0.119). The criterion''s partially reproduced clause fits; methods_underspecified
      (readings disagree) could also be argued, because panel d depends on the feature reading. The panel d
      raster is dominated by the top-amplitude spikes the spline was fitted to, and no template correlation
      on spikes left out of the fit is reported (problem 4). The smoothed raster reading was not run, and the
      smallest panel d failure is -0.0014, so a few results could flip (problem 6).'
    response: Outcome kept. Added panel d on the raster of only the spikes below the amplitude cut, which the
      spline was not fit to (higher in 22 of 32, all 16 with lateral position), and on the smoothed raster
      (24 of 32); panel e on the no-motion surrogate (lower in 32 of 32), so the conclusion now says panel
      e cannot fail. The IBL preprocessing variant also gives 22 of 32 for panel d, but the failing combinations
      move from those without lateral position to those with the top 25% cut, so the finding asked of the paper's
      authors now names the amplitude cut too. Partially reproduced is kept over methods_underspecified because
      one measure improves under every combination, the criterion's wording for partially reproduced, under
      every reading run.
