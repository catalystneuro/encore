- claim: edf3a-ap-dredge-slow-trend
  outcome: reproduced
  assumed: true
  notebook: reproduce_windolf_2025.ipynb
  output: claim:edf3a-ap-dredge-slow-trend
  measured:
  - 0.3023
  - 0.3319
  - 0.3338
  notes: 363,735 spikes were detected over 599.5 s (606.7 per s). The mean template correlation is 0.3023 unregistered,
    0.3319 after nonrigid registration (reading a) and 0.3338 after rigid registration (reading b), higher
    in 70.7% and 66.7% of the 1 s bins. The measured values are given in that order. On the smoothed raster,
    the other reading of the metric, it rises from 0.6454 to 0.7034 and 0.7107. The rigid estimate ranges from
    -84.2 to 131.4 um (s.d. 40.8), the nonrigid from -104.3 to 122.9 um (s.d. 33.7). Between 1 s bins it changes
    by a median 7.5 um (rigid) and 3.3 um (nonrigid), 99th percentiles 51.0 and 41.0 um. Its 60 s means run
    from -33.7 to 38.2 um while its s.d. within each 60 s is 21.1 to 45.4 um, so most of what it follows is
    motion on the scale of seconds, over a slow trend of about 70 um. Whether the fast part is tissue motion
    or partly noise in the estimate cannot be told from these outputs. With the IBL preprocessing before the
    same detection (second notebook, 359,760 spikes) the correlation rises from 0.2897 to 0.3300 (nonrigid)
    and 0.3360 (rigid), and on the smoothed raster from 0.6295 to 0.7108 and 0.7209. The criterion's measure
    holds under both registration readings, both raster readings and both preprocessings run; reading (i) itself
    was not run.
  deviations:
  - Spikes were detected and localized under reading (ii) of pipeline step 1 (SpikeInterface bandpass 300 to
    6,000 Hz, global median reference, locally exclusive detection at 6 times the noise, monopolar triangulation
    within 75 um, as in notebook/ap_registration.ipynb of github.com/evarol/dredge at commit ed236113). The
    criterion asks for readings (i) and (ii). Reading (i), IBL preprocessing then DARTsort, was tried outside
    the notebook while preparing it (DARTsort at commit 459cf656 on 4 CPU cores, no GPU) and was far too slow
    to fit the notebook's 60 minute limit; that trial is not in the notebook and decides nothing here, so reading
    (i) is not_runnable in this attempt. The IBL preprocessing of reading (i) (bandpass, phase shift, interpolation
    of dead and noisy channels, removal of channels outside the brain and spatial high-pass filtering in SpikeInterface,
    as the Methods describe it for the IBL data, Preprocessing of AP band data, paragraph 1) was run before
    the detection and localization of reading (ii) in the second notebook, ibl_preprocessing_variant.ipynb,
    as a partial check; it gives the same outcome for this claim. The outcome assumes that reading (ii) stands
    for step 1. It is the detection of the code the paper links for DREDge, and the Methods say detection and
    localization were chosen to suit each data source without naming the choice for this recording.
  - The claims file reads dredge_ap.register's smoothing default (None) as no smoothing and names it a variant.
    In motion_util.spike_raster at commit ed236113 None is replaced by the bin size, 1 um and 1 s, so the default
    equals the Methods' smoothing; the notebook shows the displacement is identical (largest difference 0.0
    um).
  - The Methods compute the template correlation on "the two-dimensional spike raster described above", with
    the mean amplitude in each 1 um, 1 s bin in place of the log transforms (Spike registration quality metrics), and the raster described above is smoothed with a Gaussian at 1 um and 1 s (Preprocessing
    of AP band data). Whether the smoothing is kept is not said. The claims file's unsmoothed raster decides
    the outcome and the smoothed raster is run as a second reading; both give the same outcome.
- claim: edf3b-hdbscan-clusters
  outcome: reproduced
  assumed: true
  notebook: reproduce_windolf_2025.ipynb
  output: claim:edf3b-hdbscan-clusters
  notes: All 16 combinations (registration a or b, top 10% or 25% amplitudes, features x, y and amplitude or
    y and amplitude, min_cluster_size 25 or 100) return 6 to 41 clusters other than noise; 2.4% to 25.0% of
    the selected spikes are labelled noise. The clusters are broad. With the top 10% cut and min_cluster_size
    100 the within-cluster s.d. of registered depth is 21.6 to 134.8 um. The largest cluster, about 16,000
    spikes in every combination, lies at a registered depth of 2,322 um, peaks on 11 channels with a median
    amplitude of 204 uV, s.d. 38 um in depth and 5 um laterally, and fires through the whole recording at about
    half the rate in the last 200 s; the other clusters peak on 6 to 46 channels. They look like groups of
    neighbouring units more than single units, where the legend's colored clusters look like single units;
    the criterion asks only for two or more clusters, which holds. With the IBL preprocessing before the same
    detection, all 16 combinations return 9 to 35 clusters.
