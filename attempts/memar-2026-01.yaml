findings:
- kind: metadata_error
  about: data
  severity: critical
  statement: In three files (sub-01 ses-7, sub-04 ses-3, sub-06 ses-3) every start time of the reaches table is
    later than the matching ReachEvents timestamp by 30682.4, 30048.3 and 29240.6 s, which is the time from 19:00
    of the previous day to the session start (03:07 to 03:31; the other files start at 19:00). The reaches table
    therefore puts 132, 22 and 83 events after the end of the recording, and its remaining times are 8.1 to 8.5
    h from the movements. At the ReachEvents times sub-06 ses-3 shows an event-locked high-gamma change (|t| 9.28
    against a null 95th percentile of 3.42) and sub-01 ses-7 a weaker one (3.83 against 3.39); at the reaches times
    neither does (2.90 and 2.74); sub-04 ses-3 (35 events) shows neither. ReachEvents is on the recording's clock
    and the reaches table is not, and nothing in the table says so. In sub-08 ses-4 one event of the reaches table
    is 24 h later than its ReachEvents time. Elsewhere the two agree within 1 ms. This attempt's first run used
    the reaches table; the trials now come from ReachEvents.
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: The location column of every electrode table holds "unknown"; the dataset has no anatomical (AAL) labels,
    which the paper's Figure 6 shows and its code's default atlas neighbourhood needs.
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: Sixteen electrodes of sub-03 and eight of sub-12 have no MNI coordinates (NaN x, y and z) in every
    session; they cannot be placed in a coordinate neighbourhood.
- kind: other
  about: data
  severity: minor
  statement: The paper says each subject's electrodes are in one hemisphere; in the electrode tables sub-09 has
    16 of 126 electrodes at x > 0 with the rest at x < 0, and sub-06 and sub-12 have 1 and 4 at x > 0. They may
    be midline or contralateral contacts; the files do not say.
- kind: other
  about: data
  severity: minor
  statement: High-gamma power after the movement events against before them shows an event-locked change in 10 of
    12 subjects (largest |t| 5.2 to 30.3 against a null 95th percentile near 3.4), but not in sub-02 (2.66 against
    3.30) and sub-09 (3.08 against 3.41), so the alignment of events and signal is not established for those two;
    their event tables agree and lie within the recordings. 131 events have NaN samples within 5 s of the 2 s window,
    76 of them inside it. Every ElectricalSeries starting_time is 0. No session is deposited twice (no two sessions
    share event times or a channel correlation matrix), and no two trial windows overlap.
- kind: methods_unavailable
  about: paper
  statement: Questions for the paper's authors. (1) Which movement events and recording days form the iEEG trials,
    whether rest trials were included, and how rest trials were chosen (the dataset labels only coarse behaviour).
    (2) Whether the preprocessing was applied to the continuous recordings or to each 2 s epoch; the per-subject
    values in Table II match better under per-epoch preprocessing (8 of 12) than under continuous (4 of 12), while
    the cross-subject average is met only under continuous preprocessing. (3) How Table II's rows map to AJILE12
    participants. (4) Which mask intensity the Intra-Subject, Lagged and surrogate columns use (m = 1.0 is assumed
    here, as the code's notebook says).
