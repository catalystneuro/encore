findings:
- kind: metadata_error
  about: data
  severity: major
  statement: In four files the reaches table and the ReachEvents timestamps disagree, by 30682 s
    (sub-01 ses-7), 30048 s (sub-04 ses-3), 29240 s (sub-06 ses-3) and 86400 s (sub-08 ses-4);
    elsewhere they agree within 1 ms. In the first three, the files whose recordings are shorter
    than 24 h, the reaches table puts 132, 22 and 83 events after the end of the recording, and
    sub-08 ses-4 has 1. One of the two tables is not on the recording's clock in these files; this
    attempt did not establish which. It used the reaches table and dropped the events past the end,
    so the remaining trials of those sessions may not be centred on movements.
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: The location column of every electrode table holds "unknown"; the dataset has no
    anatomical (AAL) labels, which the paper's Figure 6 shows and its code's default atlas
    neighbourhood needs.
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: Eight electrodes of sub-12 have no MNI coordinates (NaN x, y and z) in every session;
    they cannot be placed in a coordinate neighbourhood.
- kind: other
  about: data
  severity: minor
  statement: The paper says each subject's electrodes are in one hemisphere; in the electrode
    tables sub-09 has 16 of 126 electrodes at x > 0 with the rest at x < 0, and sub-06 and sub-12
    have 1 and 4 at x > 0. They may be midline or contralateral contacts; the files do not say.
- kind: other
  about: data
  severity: minor
  statement: High-gamma power after the movement events against before them shows an event-locked
    change in 10 of 12 subjects (largest |t| 5.2 to 30.2 against a null 95th percentile near 3.4),
    but not in sub-02 (2.65) and sub-09 (3.09), so the alignment of events and signal is not
    established for those two. 132 events have NaN samples within 5 s of the 2 s window, 75 of them inside it. No session is
    deposited twice (no two sessions share event times or a channel correlation matrix).
- kind: methods_unavailable
  about: paper
  statement: Questions for the paper's authors. (1) Which movement events and recording days form
    the iEEG trials, whether rest trials were included, and how rest trials were chosen. (2)
    Whether the preprocessing was applied to the continuous recordings or to each 2 s epoch; the
    per-subject values in Table II match better under per-epoch preprocessing (8 of 12) than under
    continuous (4 of 12). (3) How Table II's rows map to AJILE12 participants. (4) Which mask
    intensity the Intra-Subject, Lagged and surrogate columns use (m = 1.0 is assumed here, as the
    code's notebook says).
