outcomes:
- claim: intra-ieeg-mean
  outcome: reproduced
  assumed: true
  notebook: reproduce_memar_2026.ipynb
  output: claim:intra-ieeg-mean
  measured:
  - 0.602
  notes: 'Mean over the 12 subjects of the per-electrode mean of per-trial test DistCorr at m = 1.0, 0.602 ± 0.057
    under preprocessing reading (a) (before segmentation, approximated with padded windows) and 0.571 ± 0.065 under
    reading (b) (per epoch); both are within 0.553 ± 0.068. Under the claim''s seed plus 0, 1000, 2000, 3000 and
    4000 (each also setting the split) the reading (a) mean ranges from 0.598 to 0.602, and per subject by at most
    0.033. 7957 trials over 55 sessions. Variants: the atlas neighbourhood could not be run, as no electrode has
    an anatomical label; m = 0 gives 0.714 (a) and 0.659 (b), outside the tolerance (masking_coverage.ipynb); the
    round rule masks the same 9 neighbours at m = 1.0. The SD across electrodes (0.108 and 0.111 on average) is
    about three times Table II''s (0.034), a sign that the pipelines differ.'
  deviations:
  - 'The trials are 2 s windows centred on each wrist movement event of ReachEvents, every session of a subject
    pooled (claims file, readings (a) for the events and the days). The first run used the reaches table, which
    in three files is not on the recording''s clock (findings); 7957 trials are kept. Movement-event reading (b),
    movement and rest trials, was not run: the paper and its code do not define rest trials, and the dataset''s
    epochs table labels only coarse behaviour (Sleep/rest, Inactive, TV and so on) over intervals of seconds to
    hours, so any rule for drawing rest trials from it would be this attempt''s invention.'
  - Preprocessing the whole recording (reading a) would mean reading 845 GB; each event is read with 5 s of padding
    on each side and filtered, and the statistics of the |z| > 5 step and the z-scoring are taken over the session's
    event windows. An approximation of reading (a).
  - Filter orders (4th-order Butterworth, filtfilt, notch Q 30) from the code (utils.preprocess_iEEG), which the
    Methods do not give.
  - For time, the gradient steps and the validation loss use every 10th sample of each trial, and training stops
    at 200 epochs (the code allows 10000 with a patience of 200). On sub-07 the mean score changes by at most 0.0002
    for the instantaneous model (up to 3000 epochs, or every sample for 100 epochs) and for the lagged, Local and
    phase-surrogate fits (up to 1000 epochs) (surrogates_lagged.ipynb). The median epoch of the best validation
    loss is 80 to 117 per subject.
  - All electrodes are trained at once as independent rows of one matrix, so the batch order is shared across electrodes;
    each row has its own loss, Adam state and early-stopping checkpoint. Subjects are fitted in parallel processes,
    each with a generator seeded from the claim's.
  - Electrodes without MNI coordinates (16 in sub-03, 8 in sub-12) are left out, as they have no (x, z) neighbourhood;
    events whose padded window holds NaN samples (131) are left out. The paper names no exclusion. The reading (b)
    trials are held as float16 between loading and fitting.
