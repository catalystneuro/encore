- claim: pt-variance-explained
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-variance-explained
  notes: With the code's selection the median ratio of PT to unidentified variance explained is at most 1.3 for 1
