inputs:
- what: The paper's MATLAB analysis code (defineDataset.m, loadAndProcessData.m, MySmooth.m, Projections.m,
    CDCorrelation.m, decodingAccuracy.m, doROC.m, simplePlots.m, VarianceExplained.m), read for the methods
    the claims file cites; and all 14 processed data files (Code/ProcessedData/*_psth.mat), read in the data
    check (how the files' spike times were built, which of the paper's units the dandiset holds, the per-trial
    licks against the licks rebuilt from the files, the unidentified units) and in variants that rerun the
    tests on the paper's 61 PTupper and 69 PTlower units. No outcome rests on them.
  source: Figshare doi:10.25378/janelia.7007846, version 1, Ephys.zip (file 13292708)
- what: The single-cell annotation (SingleCellAnnotation.txt), the single-cell expression of the 368 PT cells
    (SingleCellExpression.txt), the bulk RNA-seq counts (bulk_data.txt), the sample key and the cluster table,
    used to test pt-types-transcriptomic, pt-projection-cluster-mapping and pt-bulk-sc-fold-change-correlation;
    and the code bulkVsSC.m, followed for the last.
  source: Figshare doi:10.25378/janelia.7007846, version 1, Seq.zip (file 13308305)
- what: The MouseLight reconstructions (PTcells-MDhighlighted.mat, 22 neurons with the Allen structure of
    every node) and the code AxonReconstructions.m (the 12 fully reconstructed neurons and their groups),
    used to test pt-upper-thalamus-projection, pt-lower-medulla-projection, pt-types-shared-targets and
    pt-types-account-for-all-pt.
  source: Figshare doi:10.25378/janelia.7007846, version 1, Axons.zip (file 13308434)
- what: The list of files in Anatomy.zip, read to see whether cell counts or smFISH data are deposited
    (only image stacks are). No image was read.
  source: Figshare doi:10.25378/janelia.7007846, version 1, Anatomy.zip (file 13314290)
outcomes:
- claim: pt-types-transcriptomic
  outcome: reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-types-transcriptomic
  measured: 27
  notes: Tested on the Seq.zip annotation of the Tasic et al. taxonomy. The ALM glutamatergic cells fall in 27
    clusters not named for VISp (the Cajal-Retzius cluster included), the paper's number; 26 without that
    cluster, 25 counting clusters with most of their cells in ALM, 45 counting every glutamatergic cluster with
    an ALM cell. The 368 ALM cells of the L5 PT subclass map to three clusters, Slco2a1 203, Hpgd 122 and Npsr1
    43. The suggestion of two types is an interpretation and is not tested. The earlier attempt blocked this
    claim as data missing, as its criterion rested on the dandiset; the claim is now marked data elsewhere and
    is tested on the Figshare record.
  deviations:
  - The claims file gives no rule for counting the clusters. The four readings are this attempt's; the count is
    taken as a reading of a reported number (which clusters are meant), so it holds under the reading that
    matches. A question asks a reader to fix the rule.
  - The cluster table in Seq.zip (cluster_metadata.csv) is from an earlier version of the taxonomy, with other
    cluster names; the annotation file, which carries the paper's names, is used.
- claim: pt-upper-thalamus-projection
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-upper-thalamus-projection
  notes: Of the 12 neurons the code names, 11 have axon termini in the thalamus and 11 have thalamic axon,
    against the paper's 8; 8 have more termini in the thalamus than in the medulla, exactly the code's thalamus
    group. Three of the four medulla-group neurons have thalamic termini (1, 7 and 1). The paper and its code do
    not say how innervation was judged (the code groups the neurons by hand), and the readings give different
    counts. The earlier attempt blocked it as data missing; the reconstructions are on the Figshare record.
  deviations:
  - The claims file gives no criterion; the readings of innervation (any terminus, axon length, more termini
    than in the medulla) are this attempt's.
- claim: pt-lower-medulla-projection
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-lower-medulla-projection
  notes: All 4 medulla-group neurons have termini in the medulla and in the intermediate reticular nucleus under
    every reading, so the branching part holds. Bypassing the thalamus holds only when judged by which target
    has more termini; 3 of the 4 have thalamic termini (1, 7 and 1) and thalamic axon. Six of the eight
    thalamus-group neurons have medullary termini (1 to 10). The readings give different outcomes. The earlier
    attempt blocked it as data missing.
  deviations:
  - The claims file gives no criterion; the readings are this attempt's.
- claim: pt-types-shared-targets
  outcome: reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-types-shared-targets
  notes: All 12 of the code's neurons have axon and termini in the superior colliculus (its motor-related
    part). Neurons of both groups reach the subthalamic nucleus (6 thalamus-group and 3 medulla-group neurons
    by termini, 6 and 4 by axon length), the zona incerta (5 and 3, 7 and 3) and the midbrain reticular
    nucleus (8 and 4 under both). The earlier attempt blocked it as data missing.
  deviations:
  - The second part of the statement is from the bulk labelling of Extended Data Fig. 2e; its images were not
    analysed, and the part was tested on the reconstructions. The readings (termini, axon length) are this
    attempt's, as the claims file gives no criterion; they agree.
- claim: pt-retrograde-sublaminae
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-retrograde-sublaminae
  notes: Anatomy.zip holds only image stacks of six brains (657 jpg files; thalamus and medulla H2B labelling,
    anterograde labelling, ChR2 expression), without cell counts or co-labelling annotations. The paper gives no
    method for counting labelled and co-labelled cells, so counting them would be a method of this attempt's
    own.
- claim: pt-projection-cluster-mapping
  outcome: reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-projection-cluster-mapping
  measured: [62, 91]
  notes: With the primary injection site, all 62 medulla-labelled ALM PT neurons are in Slco2a1 and 91 of 94
    thalamus-labelled ones in Npsr1 (19) or Hpgd (72), the paper's numbers; the pons count and split match
    too (100, of them 86, 5 and 9). With the ROI field, 58 of 58 medulla-labelled cells are in Slco2a1, 91 of 94
    thalamus-labelled ones are in Npsr1 or Hpgd, and the superior colliculus count and split match (97, of them
    43, 15 and 39).
  deviations:
  - The claims file gives no criterion. The injection field and the grouping of injection sites by the Allen
    ontology (medulla IRN, GRN, PARN; thalamus VAL, PF, MD; superior colliculus SC, SCm; pons PG, PRNc) are
    this attempt's readings; the medulla count of 62 holds under the primary-site field. A question is asked.
- claim: pt-types-account-for-all-pt
  outcome: partially_reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-types-account-for-all-pt
  notes: Read as the 18 neurons with somata in motor cortex (of 22 in the file), none lacks both thalamus and
    medulla, but 17 of 18 reach the superior colliculus; AA0134 has neither termini nor axon there. Over all 22,
    19 reach it and none lacks both. The readings of projecting (termini, axon) agree.
  deviations:
  - Which 18 neurons the paper meant (Supplementary Table 1, not in the text read) is this attempt's reading;
    the motor cortex reading gives the count of 18. The claims file gives no criterion.
- claim: pt-marker-genes
  outcome: blocked
  blocked_by: other
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-marker-genes
  notes: The smFISH images and puncta counts are not public. No file of the Figshare record holds them
    (Anatomy.zip holds image stacks of retrograde and anterograde labelling only, and nothing is named for
    smFISH, RNAscope, Npnt or Slco2a1), and the paper names no other archive. The claim is marked data
    elsewhere, for which the checker does not allow data missing; a question asks whether it should be data
    dataset, blocked as data missing.
- claim: pt-bulk-sc-fold-change-correlation
  outcome: reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-bulk-sc-fold-change-correlation
  measured: 0.867
  notes: Over the 200 genes ranked as bulkVsSC.m ranks them, r = 0.867 with the bulk values as stored (the code)
    and 0.874 with counts per million (the legend), both within 0.87 +/- 0.087; over all 31,002 genes in both
    data sets r is 0.458 and 0.516. Single cells are 165 Npsr1 or Hpgd and 203 Slco2a1 cells; bulk samples are
    the six thalamus and six medulla samples the code uses.
  deviations:
  - The claims file gives no method; the code's is followed, with the legend's CPM scale as a second reading.
    Gene names that repeat in the tables keep their first row, as MATLAB's ismember does.
- claim: pt-tagged-units
  outcome: not_reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-tagged-units
  measured: [44, 56, 8, 4]
  notes: The dandiset holds 117 tagged units (the paper sorted 143). The code's rule keeps 44 PTupper and 56
    PTlower units and the session rule 42 and 63, from 8 and 4 mice under both; only the session rule's 63 is
    within tolerance, and no reading gives both counts. The code's rule gives 61 and 69 from 8 and 4 mice on
    the processed data; the dandiset lacks 11 of the paper's sessions, which hold 17 included PTupper and 13
    included PTlower units.
- claim: pt-depth
  outcome: reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-depth
  notes: Mean depth of included units, PTupper 636 +/- 132 um against PTlower 1004 +/- 217 um with the code's
    selection (892 um without the right-hemisphere recordings), and 627 against 994 (901) um with the session
    rule. The second reading, the session manipulator depth, is not in the files; on the processed data it
    agrees (1117 against 1374 um, 1189 um without the right hemisphere).
  deviations:
  - The manipulator depth reading could not be run on the dandiset; it is shown on the processed data as a
    variant, and the outcome is judged on the unit depth (question asked).
- claim: pt-spike-rates-similar
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-spike-rates-similar
  notes: With the code's selection, peak rates differ between the types (Student's t-test p = 0.030 and 0.028
    for the two trial ranges), so the claim of absence is not reproduced; baseline rates do not (p = 0.074 and
    0.069); medians 4.9 and 18.4 Hz (PTupper) and 6.7 and 21.0 Hz (PTlower) with the unit's range. With the
    session rule neither differs (p = 0.34 to 0.44), but the PTlower peak median (15.2 and 14.4 Hz) and, with
    the unit's range, the PTupper baseline median (4.86 Hz) are out of tolerance, so it is partially
    reproduced. The selection decides the outcome, and the claims file does not say which to use when neither
    reproduces the unit counts. On the paper's units all four medians are within tolerance (4.27, 17.65, 5.18,
    17.17 Hz) and neither test differs (p = 0.18 and 0.14).
- claim: pt-lower-heterogeneous-rates
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-lower-heterogeneous-rates
  notes: Blocked because it depends on pt-spike-rates-similar, which is blocked. Its own test gives one result
    under every reading. PTlower rates are more variable, for baseline (variance 33.1 to 35.7 against 12.7 to
    14.1 Hz^2, Bartlett p 0.0014 to 0.0019, F test p 0.0014 to 0.0021) and for peak (464 to 525 against 107 to
    125 Hz^2, both p below 0.0001). The processed data give p = 0.014 and 0.0003. A question asks whether the
    dependency is meant.
- claim: pt-lower-bursting
  outcome: partially_reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-lower-bursting
  measured: [19.6, 4.5]
  notes: With the code's selection 11 of 56 PTlower (19.6%) and 2 of 44 PTupper units (4.5%) burst (two-sided
    Fisher p = 0.035); with the session rule 12 of 63 (19.0%) and 2 of 42 (4.8%), p = 0.042. The PTlower share
