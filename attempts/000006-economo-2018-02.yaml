- claim: pt-cd-stability
  outcome: reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-cd-stability
  notes: (a) Pearson's r between CDearly and CDlate weights is 0.49 to 0.51 for PTupper (p below 0.001) and 0.17
