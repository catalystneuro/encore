- claim: pt-selective-any-epoch
  outcome: not_reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-selective-any-epoch
  measured: 99
  notes: 99 of 100 units are selective in at least one epoch (code's selection, unit's range, first 400 ms of the
    sample epoch), 95 to 100 under the other readings; the dandiset holds 100 or 105 included units, so the
    count cannot reach 122 +/- 12.2. The fraction is 0.90 to 0.99 (the paper 94%). Of the paper's 130 units from
