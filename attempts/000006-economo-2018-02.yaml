- claim: pt-preparatory-activity
  outcome: partially_reproduced
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-preparatory-activity
  measured: [29, 38]
  notes: (a) 27 to 29 PTupper and 37 to 41 PTlower units are selective in the late delay under the four
    readings; the PTupper counts are below 40 +/- 4 and no reading gives both counts. (b) CDlate selectivity is
    significant at every late delay bin and for the window mean (no iteration at or below zero) in both
