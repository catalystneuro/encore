findings:
- kind: data_missing
  statement: Still present (finding of 000006-economo-2018-01). 11 sessions of the paper's processed data
    (Figshare doi:10.25378/janelia.7007846) that hold tagged units are not in the dandiset. They hold 17 of the 61
    PTupper and 13 of the 69 PTlower units the paper analysed, so the dandiset holds 44 and 56 under the code's
    rule. Every tagged unit the dandiset holds is in the processed data with the same label, inclusion decision
    and depth. The dandiset's description says some files were found to be broken and were left out, without
    naming them.
- kind: data_missing
  statement: New. The missing sessions also hold unidentified units. The processed data have 517 good-quality
    unidentified units in the PTupper cohort and 547 in the PTlower cohort; the dandiset holds 232 (in 6
    sessions) and 430 (in 12), against the 495 and 511 the paper analysed.
- kind: data_missing
  statement: Still present (finding of 000006-economo-2018-01). The dandiset holds the electrophysiology only; the
    single-cell and bulk sequencing, the axon reconstructions and the anatomy are on the Figshare record and at
    GEO (GSE119182). The smFISH data behind Fig. 3c are not in any public file.
- kind: data_missing
  statement: New. No file holds video, so the reaction time the paper measured from 400 Hz videography cannot be
    tested, and the files hold no session manipulator depth, which the paper's Fig. 4e and code use.
- kind: format_error
  statement: Still present (finding of 000006-economo-2018-01). Spike times are not sorted in 1120 of 1149 units.
    They were written trial by trial as trial start + go cue time + the spike time from the go cue, and
    consecutive trials overlap on the file's clock, so some spikes of one trial lie in the next trial's early
    epochs (11.7% of the spikes counted in the baseline epoch, under 2% in later epochs, are detectably out of
    order). Trial membership of a spike cannot be recovered in full from the files.
- kind: format_error
  statement: New. The lick times are stored the same way, trial by trial, and are out of order in 105 of 106 lick
    series (14,360 backward steps in 180,679 licks). The files do not assign licks to trials; rebuilt from the
    stored order, each trial's last lick matches the processed data's in 98.1% of correct trials.
- kind: format_error
  statement: Still present (finding of 000006-economo-2018-01). The trial table's stop_time is NaN in every file,
    and pole_in_time, pole_out_time and cue_start_time are relative to the trial start without saying so. On the
    file's clock the go cue of a trial falls after the next trial's start_time in 13,306 of 15,096 trials.
- kind: metadata_insufficient
  statement: Still present (finding of 000006-economo-2018-01). The tagged unit labels PTupper and PTlower are not
    described (the cell_type column's description is the generic "cell type (e.g. wide width, narrow width
    spiking)"), and the projection targets (thalamus and medulla) that the paper uses to name the types are
    stated only in the paper's code.
- kind: metadata_insufficient
  statement: Still present (finding of 000006-economo-2018-01). Unit quality mixes two vocabularies (single, and
    Excellent, Good, Fair, Poor) and has undescribed empty values ([], 0, blank). Sex is U and genotype empty for
    every mouse, the electrode positions are all zero, and every electrode group gives layer 5 whatever the
    depth.
- kind: other
  statement: Still present (finding of 000006-economo-2018-01). In the paper's processed data, in every one of the
    53 sessions the dandiset holds, the spike windows of the first ten trials start later relative to the pole
    than those of the other trials (session medians 1.73 to 5.84 s after the pole comes in, against -0.97 to
    -0.16 s); the paper's code leaves out the first ten trials of each unit, which hides this. The files carry
    the same shift, as their spike times equal the processed ones in every unit.
