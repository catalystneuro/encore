- claim: pt-cd-change-at-go-cue
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-cd-change-at-go-cue
  notes: The correlation with CDlate falls sooner in PTlower under both levels and all readings. At level 0.5
    PTlower falls below it at 0.22 to 0.37 s and PTupper at 0.37 to 0.40 s (reproduced); at level 0.75 at 0.06 s
    against 0.17 to 0.19 s, under the 0.2 s bound (partially reproduced). The two levels give different
    outcomes. The code's variant and the paper's units give the same order.
- claim: pt-lower-movement-termination
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-lower-movement-termination
  notes: PTlower CDlate selectivity stays significant after the last lick (5 to 9 bins from 0.2 to 0.4 s, 8 to
    29 from 0.1 to 0.5 s), so it does not cease under either window. Along CDgo it ceases under window (a) only
    with the code's selection and the 4 and 8 mice; otherwise 1 to 16 bins stay significant, and 13 to 37 under
    window (b). The readings give partially reproduced and not reproduced. PTupper CDlate selectivity is not
    significant before the last lick. The PTlower coding direction changes more after the last lick (inner
    product with the direction before it 0.52 at +0.3 s, against 0.79 for PTupper). The paper's units, with
    their own licks, give the same pattern.
  deviations:
  - The files do not assign licks to trials. Each trial's last lick is rebuilt from the stored order of the lick
    times (first lick within 2 s of the go cue, bout gaps under 1 s; standard choices), which matches the
    processed data's in 11,955 of 12,190 correct trials. A trial's spikes for the lick-aligned rates are those
    within 3.4 s before and 3.0 s after its go cue.
- claim: pt-cohort-control
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-cohort-control
  notes: Blocked because it depends on pt-upper-early-preparatory; its own test also gives different outcomes
    across readings. The dandiset holds 232, 430 and 226 unidentified units (212 to 226 included in the last)
    against the paper's 495, 511 and 276, out of tolerance. The CDgo onsets of the depth-matched unidentified
    populations (42.5 and 37.5 ms) differ by less than those of the PT types (35 to 45 ms) under every reading.
    The PTlower cohort's left ALM population has larger CDearly selectivity (median 8.4 to 10.1) than the
    PTupper cohort, outside its 5-95% interval in 7 of 8 readings and inside in one. The z-scored PT populations
    keep the PT difference.
  deviations:
  - The z-scored variant divides each unit's rates by the s.d. over trials of its baseline epoch rate, a
    standard choice, as the legend does not say which s.d.
- claim: pt-types-differ-in-timing
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-types-differ-in-timing
  notes: Three of the six claims it summarises are blocked (pt-upper-early-preparatory,
    pt-single-neuron-early-selectivity, and pt-upper-persistent through its dependency), so it is blocked for
    the same reason. Of the others pt-lower-cdearly-decay and pt-lower-late-and-motor are reproduced and
