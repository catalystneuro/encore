    earlier attempt had it reproduced, with a criterion written from the abstract (72 of 100 units selective in
    the delay epoch against a shuffle null); the new criterion counts late delay units against the paper's 40
    and 44, which the dandiset's 44 PTupper units do not reach.
- claim: pt-upper-early-preparatory
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_economo_2018.ipynb
  output: claim:pt-upper-early-preparatory
  notes: PTupper CDearly selectivity is larger by reading (i) in all 32 combinations of readings (bootstrap
    medians 3.48 to 4.12 against 1.67 to 2.46) but by reading (ii) in only 5 (PTupper 5th percentile 1.66 to
