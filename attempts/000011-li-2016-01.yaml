- claim: unit-classification
  outcome: partially_reproduced
  notebook: reproduce_li_2016.ipynb
  output: claim:unit-classification
  measured:
  - 979
  - 58
  - 74
  - 890
  - 15
  notes: The 12 control mice hold 979 units in 58 sessions (20 unilateral, 38 bilateral); by the
    Methods' width thresholds 74 are fast-spiking, 890 putative pyramidal (the paper's number
    exactly) and 15 intermediate. Four of five values are within tolerance; the intermediate count
    is 15 against 50. The dandiset holds 33 units fewer than the paper's 1012, about the 35
    intermediate units missing, so these were probably not deposited. With widths from waveforms
    interpolated to ten times the stored rate (a variant) 11 units are intermediate, so the 19.5 kHz
    sampling does not explain the shortfall. The criterion defines no partial outcome; four of five
    values hold, so the outcome is partial by the rule stated in the notebook's summary (at least
    half of the parts hold under every reading that must agree).
  deviations:
  - The 33 sessions of the 7 mice without a photostimulus record (564 units) are counted apart, as
    the criterion asks.
