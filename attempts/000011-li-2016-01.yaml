  deviations:
  - The noise scaling is not given (question 10); both readings are run.
  - The trained modular FORCE network is not specified enough to rebuild and was not built.
findings:
- kind: data_missing
  statement: The dandiset holds only the recording sessions. The behavioural photoinhibition sessions
    (Figs 1d, 2b, 5b and Extended Data Fig. 3), the photoactivation mice (Extended Data Fig. 5), the
    untrained mice used to map photoinhibition (Extended Data Fig. 2d) and any session before
    callosotomy are not in it. Nine of the paper's findings cannot be tested for this reason.
- kind: data_missing
  statement: 33 sessions of 7 mice (the callosotomy group by genotype and delay) and 3 experiment-1
    sessions of mouse 255200 have no photostimulus record (no laser traces, no photostimulus events,
    no trial column), though most of them contain trials whose activity is silenced in the light
    window of the other sessions. Their photoinhibition trials cannot be identified.
- kind: metadata_insufficient
  statement: No file says which mice were callosotomised, on which side, or when; the subject
    description holds only the JAX strain numbers.
- kind: metadata_insufficient
  statement: The trial table has no photostimulus column. The condition of a trial (site, number of
    laser spots, timing) can be recovered only from the per-site laser power traces (one 5 s chunk per
    photostimulus trial, matched to trials by time) and the photostim_start_time events, whose value
    is the peak power. The number of spots is not stated anywhere and is inferred from the waveform
    and power.
- kind: metadata_error
  statement: In lick-early trials the photostim_start_time and photostim_stop_time events are logged
    at the restarted delay, up to 1.6 s after the light seen in the laser trace (20 of 41 lick-early
    photostimulus trials in two sessions read in full); in other trials they agree within 5 ms.
- kind: format_error
  statement: Session 258250_20141202 holds two interleaved sequences of trial ids (1 to 24 and 105 to
    160) whose times overlap (98 overlapping pairs), so its events cannot be assigned to trials. In 28
    units of 3 sessions the spike times are not in time order, and two sessions have trials out of
    time order.
- kind: data_missing
  statement: The control mice hold 979 units against the paper's 1012; 15 have intermediate spike
    widths against 50, so about 33 intermediate units were not deposited.
- kind: metadata_error
  statement: The units' cell_type labels intermediate-width units (0.35 to 0.45 ms trough to peak) as
    FS, where the Methods exclude them (45 units in all).
- kind: other
  statement: The asset sub-255200_ses-20140910_behavior.nwb holds only metadata (no trials, events or
    time series).
- kind: selection_undocumented
  statement: The paper's neuron and session counts for its selectivity and population analyses (55,
    143 and 40 selective neurons; 16 sessions with 6 to 20 neurons) cannot be reached with the
    criteria the paper states; the dataset gives 138 to 173, 221 to 293, 58 to 62 and 24 sessions with
    6 to 37 neurons. Experiment 1 holds 4 mice where the paper reports 6.
- kind: metadata_insufficient
  statement: No lick times are stored; licks exist only as the analogue lick_trace, without a stated
    rule to detect a lick, so reaction times cannot be computed as the paper did.
