inputs:
- what: Names of the body-camera keypoints (rightbartip is "The tip of the lever", leftbartip "The tip
    of the pawrest") and the unit of the lever channel (mm), from bdbc_nwb_explorer/data/body_video.csv
    and data/daq.csv. Used only to name a keypoint and a unit the dataset already holds; no
    measurement comes from it.
  source: https://github.com/BraiDyn-BC/bdbc-nwb-explorer at commit 309c5fbdbc065cffdaf46e9160383545e5c8104f
outcomes:
- claim: cohort-sex-age
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:cohort-sex-age
  measured: [25, 11, 14]
  notes: 25 subjects, 11 male and 14 female. Age at each subject's last session (a sensory-mapping
    session) is 16.3 to 31.6 weeks from the date of birth and from the age field alike, inside the
    widened range of 15.3 to 34.1 weeks. One mouse (VG1-GC#87) is 16.3 weeks, below the paper's 17.
- claim: task-sessions-collected
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:task-sessions-collected
  measured: [364, 16]
  notes: 364 distinct task sessions (file name and session description agree), 16 mice with all 15. The
    11 missing sessions are listed per mouse. No recording was found deposited twice. The dataset also
    holds 98 resting-state sessions (VG1-GC#119 and VG1-GC#122 lack day 15) and 33 sensory-mapping
    sessions, 8 mice having two.
- claim: imaging-frame-counts
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:imaging-frame-counts
  measured: [54000, 18000, 27000]
  notes: 363 of 364 task sessions have 54000 frames per channel, all 98 resting-state sessions 18000,
    and 29 of 33 sensory-mapping sessions 27000, for the dF/F and both raw stacks. The exceptions are
    one task session of 45413 frames (VG1-GC#124 day 5, noted in the file as recorded for 25.2 min) and
    four sensory-mapping sessions of 36000 frames (VG1-GC#48, VG1-GC#63, VG1-GC#66, VG1-GC#73, day 16).
- claim: training-breaks
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:training-breaks
  measured: [3.28, 2.30, 25.21]
  notes: Under every reading the means are within the paper's s.d. Breaks per mouse are 3.28 (breaks of
    one or more days) or 2.84 (two or more days), 2.80 to 3.28 across readings; days per break 2.30 to
    2.51 pooled and 2.30 to 2.47 per mouse. The span from the day-1 task session to the
    sensory-mapping session is 24.21 to 25.71 days across readings (24 mice; VG1-GC#125 has no day-1
    session). Measured values are reading (1a), pooled, first sensory session, inclusive. Seven gaps
    enclose a missing task session; leaving them out changes no match. One break lasts 16 days, so the
    s.d. of break lengths (1.7) exceeds the paper's 0.7.
- claim: fig3c-response-rate-increase
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:fig3c-response-rate-increase
  measured: [0.556, 0.856]
  notes: Median response rate over mice is 0.556 in session 1 and 0.856 in session 15 from the outcome
    labels (reading a), 0.559 and 0.859 from the 5 kHz lever (reading b), both within tolerance; the 15
    medians rise with session (Spearman rho 0.757, p 0.0011).
- claim: fig3c-success-rate-constant
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_kondo_2025.ipynb
  output: claim:fig3c-success-rate-constant
  notes: The criterion's two readings of "constant" disagree. The session-15 median success rate is 27%
    (labels, 0.485 to 0.616) or 31% (reward TTLs, 0.492 to 0.645) above the session-1 median, so
    reading (a), within 10%, fails; the 15 medians show no monotonic trend (Spearman rho 0.257, p 0.355
    with labels; 0.232, p 0.405 with rewards), so reading (b) holds. The criterion blocks the claim when
    the readings differ. For contrast the response rate rose 54% over the same sessions. The paper gives
    no test or bound for "constant"; the question is recorded under findings.
- claim: fig3d-tpull-clusters
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:fig3d-tpull-clusters
  measured: [7, 18]
  notes: Ward clustering of the 15 T_pull_final values per mouse gives clusters of 7 and 18 under all
    three ways of filling the 11 missing sessions, with the same 7 mice in cluster A (VG1-GC#105, VG1-GC#48,
    VG1-GC#51, VG1-GC#53, VG1-GC#61, VG1-GC#63, VG1-GC#66). Clustering the 14 session-to-session differences gives 3 or 4 against 21
    or 22, so only the reading with the values themselves matches.
  deviations:
  - The criterion lists two readings of the feature; the claim holds under the first (the values) and
    not the second (the differences).
- claim: fig3e-cluster-a-high-tpull
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:fig3e-cluster-a-high-tpull
  notes: Cluster A's median success rate exceeds cluster B's in sessions 1 to 5 (0.649 against 0.539
    with labels, Mann-Whitney p 0.244) and in session 5 (0.749 against 0.558, p 0.064), and with reward
    TTLs likewise. Its median T_pull_final exceeds B's in sessions 11 to 15 (0.28 against 0.08 s) and in
    session 15 (0.30 against 0.075 s). Part (2) follows largely from naming A as the cluster with the
    higher mean T_pull_final. The claim lists fig3c-success-rate-constant under depends_on for the
    definition of the success rate; that claim is blocked for its judgement of "constant", not for the
    measure, so this claim is tested.
- claim: fig3e-cluster-b-similar-rates
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:fig3e-cluster-b-similar-rates
  notes: Cluster B never reached 400 ms (A in 23.8% of its mouse-sessions) and was above the overall
    median of 0.10 s in 20.5% of its mouse-sessions (A 82.2%), so the T_pull_final part holds. Late
    response rates are similar under both readings of "similar" (sessions 11 to 15, A 0.802 and B 0.732,
    p 0.423, 8.7% apart; session 15, 1.4% apart). Late success rates pass the Mann-Whitney reading in
    every case (p 0.58 to 0.82) and the 10% reading only with reward TTLs over sessions 11 to 15 (9.2%);
    with the outcome labels (12.8% and 16.1%) and for session 15 with rewards (17.1%) they differ by
    more than 10%, cluster B being the higher. So every part holds under one set of the criterion's
    readings (successes from reward TTLs, sessions 11 to 15); under the others the two readings of
    "similar" differ for the success rate, which the criterion would block. The depends_on entry for
    fig3c-success-rate-constant is treated as for fig3e-cluster-a-high-tpull.
  deviations:
  - The outcome rests on one combination of the criterion's readings (rewards counted from the reward
    TTLs, late sessions 11 to 15); reward TTLs exceed the success labels in 205 of 364 sessions.
- claim: methods-no-signal-degradation
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:methods-no-signal-degradation
  notes: Neither reading finds a significant decline. Raw blue F_B0, median per-mouse Spearman rho
    -0.207 (negative in 16 of 25), Wilcoxon p 0.178; session 15 over session 1 median ratio 1.057 (22
    mice). S.d. of corrected dF/F, median rho 0.022, p 0.840; ratio 0.903. Per ROI without correction for
    44 tests, 4 ROIs show a nominal F_B0 decline and none an increase; for the s.d., 5 decline and 9
    increase.
  deviations:
  - F_B0 is the median over 8 evenly spaced blue frames of each ROI's mean intensity, not over all 54000
    frames; reading every frame (about 0.6 s per frame over the network) does not fit the time limit.
- claim: fig4ab-landmark-validation
  outcome: blocked
  blocked_by: data_missing
  notes: The manual skull-landmark annotations are not in the dataset. The NWB files' analysis group
    holds only atlas_to_data_transform (all 495 files), the dandiset holds only NWB files and videos,
    and the repositories BraiDyn-BC/bdbc-data-pipeline, bdbc-nwb-packager, bdbc-nwb-explorer and
    bdbc-session-explorer hold no annotation files. The Matsuzaki lab data platform the dandiset names
    as a variant form of the dataset was not searched.
- claim: fig4d-visual-map
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:fig4d-visual-map
  notes: Over the first sensory-mapping session of each of 25 mice, the 10 Hz flash train (trial code 1)
    evokes its largest normalized mean response in right VISp (0.95, right VISpm 0.93; 0.94 and 0.92
    with the pre-stimulus baseline subtracted). With the stim_visual TTL, present in 19 sessions, right
    VISp is also largest (0.96). Per mouse right VISp is the top ROI in 8 to 11 mice and right VISpm
    about as often.
  deviations:
  - Only the ROI reading was run. The pixel-map reading needs 60 to 120 frames around each of about 30
    stimuli per modality, about an hour per session at 0.6 s per frame.
  - In 6 of 25 first sessions there is no stim_visual channel; there the visual train is on the
    stim_whisker channel and coded 1, so the code-1 reading uses all 25 mice and the channel reading 19.
- claim: fig4d-tactile-map
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:fig4d-tactile-map
  notes: The stim_whisker channel (25 mice) and trial code 3 (25 mice) both evoke their largest mean
    response in left SSp-bfd (0.83 and 0.87; 0.79 and 0.83 with baseline), above right SSp-bfd (0.61 and
    0.55). With code 3, left exceeds right SSp-bfd in all 25 mice; with the channel, in 19 of 25, as the
    channel carries the visual train in six sessions. Left SSp-bfd is the top ROI in 15 or 16 mice.
  deviations:
  - The files do not name the trial codes. Code 3 is on the stim_whisker channel in the 19 sessions with
    three channels and on the stim_auditory channel in the other six; both readings are shown and
    agree.
- claim: fig4d-auditory-map
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:fig4d-auditory-map
  notes: With the stim_auditory channel (25 mice) and with trial code 2 (19 mice), under both baselines,
    the 80th-percentile region of the mean map spans 9 ROIs and includes VISa, a posterior parietal ROI
    (no PTLp ROI exists). The mean map is flat (0.17 to 0.83 at most), with trunk, limb and
    retrosplenial ROIs on top, so the response spreads but no auditory area stands out. In the six
    sessions without stim_visual, the stim_auditory channel carries code 3, whose map peaks in left
    SSp-bfd. The clock check for code 2 is weak (the left AUDs response peaks at the true onsets in 15 of
    27 sessions).
  deviations:
  - Only the ROI reading was run (see fig4d-visual-map). Code 2 exists only in 19 first sessions; the six
    sessions of the earliest cohort have two stimulus types.
- claim: figs2b-no-aberrant-transients
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:figs2b-no-aberrant-transients
  notes: In 1200 runs (25 mice, 6 ROIs covering the readings of frontal and retrosplenial, 2 signals, 2
    detection thresholds, raw or z-scored features) no K-means centre has prominence above 0.1 with
    width below 0.5 s. The highest centre prominence is 0.436 and the narrowest width of a centre with
    the higher prominence is 0.34 s, in different centres. Median 727 to 1844 transients per ROI
    depending on the threshold.
  deviations:
  - The peak detection and the K-means settings (scipy.signal.find_peaks; scikit-learn KMeans with 10
    initialisations, random_state 0) are not given in the paper; the claims file names find_peaks.
- claim: fig5abc-dlc-error
  outcome: blocked
  blocked_by: data_missing
  notes: The manual annotations of the validation frames are not in the dataset, which holds only the
    DeepLabCut estimates and likelihoods, nor in the four BraiDyn-BC repositories named above.
- claim: fig5f-lever-tip-correlation
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:fig5f-lever-tip-correlation
  measured: 0.981
  notes: Over 356 task sessions with body keypoints and at least one successful trial, the mean Pearson
    R of the lever-tip keypoint y position with the encoder lever is 0.978 to 0.985 across all readings,
    over sessions and over per-mouse means (main reading 0.981 +/- 0.021). 4 sessions are below 0.9 (min
    0.748). Per-mouse means are printed.
  deviations:
  - The lever-tip keypoint is rightbartip, which the paper's linked code describes as the tip of the
    lever (bdbc-nwb-explorer data/body_video.csv); the NWB files give no description.
- claim: fig5f-forepaw-correlation
  outcome: partially_reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:fig5f-forepaw-correlation
  measured: [0.482, 0.053, 356]
  notes: The right forepaw's mean R is 0.472 to 0.498 and the left forepaw's 0.052 to 0.066 with R as
    computed (0.147 to 0.161 as absolute values), within 0.49 +/- 0.23 and 0.05 +/- 0.19 under every
    reading; right exceeds left in all 25 mice. The session count, an exact expected value, is 356
    against 354; the dataset has 357 task sessions with body keypoints (the paper says 355), one without
    a successful trial. The pawrest keypoint (leftbartip) correlates with the lever at R 0.40 to 0.45,
    though the Methods describe the pawrest as immobile.
- claim: fig6b-movement-order
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_kondo_2025.ipynb
  output: claim:fig6b-movement-order
  notes: No reading holds. In the mean over 352 or 353 sessions, with either form of the displacement
    trace and either s.d. rule, every keypoint, the jaw included, leaves its baseline band at -0.5 s, the
    first sample after the baseline window; the full order holds in no session, and the jaw moves before
    onset in 99% or more of them. The grand jaw displacement is 6.4 pixels at -0.2 s and 19.1 at 0 s, so
    the jaw moves before the pull in these data under any onset rule; the pupil starts to dilate near 0
    (grand onset -0.20 to -0.07 s; diameter 56.5 pixels at -0.5 s, 60.6 at 0.5 s). The paper states the
    order for one session it does not identify, so the claims file blocks the claim when no reading
    holds. The onset rule of the criterion is a standard choice that is not in the paper; with a
    baseline window ending at -0.5 s it fires almost at once. The question is recorded under findings.
  deviations:
  - The criterion's "displacement ... trial average" was run both as the trial average of each trial's
    displacement and as the displacement of the trial-averaged position; they agree.
  - Pupil diameters that are not finite, not positive or above 300 pixels are set missing.
- claim: fig6b-motor-somatosensory-after-reward
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:fig6b-motor-somatosensory-after-reward
  notes: In the mean over 356 or 357 sessions, MOs's post-reward value minus baseline (0.0010 to 0.0140)
    is below those of MOp (0.016 to 0.035), SSp-ul (0.022 to 0.045) and SSp-n (0.008 to 0.027), all above
    0, under every window, pull set and hemisphere (reading a). Session by session the full pattern
    holds in 38% to 60% of sessions, so reading (b), more than half, holds only for the reward-aligned
    window. The paper states it for one example session.
- claim: fig6b-sensory-areas-track-pupil
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_kondo_2025.ipynb
  output: claim:fig6b-sensory-areas-track-pupil
  notes: No reading holds. In the mean over 355 or 356 sessions OB follows the pupil (r 0.95 to 0.96
    with pupil against 0.62 to 0.64 with lever), but RSPagl (0.32 to 0.43 against 0.95 to 0.96), AUDs
    and VISp follow the lever more closely than the pupil, in each hemisphere and pull set, and the full
    pattern holds in at most 1.4% of sessions. As the paper states it for an unidentified example
    session, the claims file blocks the claim.
- claim: fig6b-variability-decrease
  outcome: reproduced
  notebook: reproduce_kondo_2025.ipynb
  output: claim:fig6b-variability-decrease
  notes: In the mean over sessions the across-trial s.d. of dF/F is lower after lever-pull onset than in
    the second before it in 44 of 44 ROIs (43 for valid pulls over 0 to 3 s), Wilcoxon p below 1e-11,
    median ratio 0.71 to 0.79; most ROIs are lower in 82% to 96% of sessions.
findings:
- kind: metadata_error
  statement: In all 495 NWB files ImagingPlane_blue states an excitation_lambda of 405 nm and
    ImagingPlane_UV 470 nm, while their descriptions, the series descriptions and the Methods give the
    reverse (blue 470 or 473 nm, violet 405 nm).
- kind: metadata_insufficient
  statement: The lever and the other sensor channels are stored with unit "a.u." and description "no
    description"; the paper's code gives the lever in mm, the environmental sensors in hPa, ppm, % and
    degrees C, and the meaning of state_task codes (bdbc-nwb-explorer data/daq.csv). The values fit mm
    (lever range about -0.4 to 4.3).
- kind: metadata_insufficient
  statement: The sensory-mapping trial tables code each stimulus as stim_modality 1, 2 or 3 with no
    description of the codes. In the six sessions of mice VG1-GC#51, VG1-GC#52, VG1-GC#53, VG1-GC#54, VG1-GC#60 and VG1-GC#61 there is
    no stim_visual channel; the stim_whisker channel carries a 10 Hz train coded 1 whose map peaks in
    right VISp, the stim_auditory channel carries code 3 whose map peaks in left SSp-bfd, and there is no
    third stimulus, although the session description names three. In the other 27 sessions code 1 is on
    stim_visual, 2 on stim_auditory and 3 on stim_whisker.
- kind: other
  statement: In the 27 sensory-mapping sessions with three stimuli the trials run in the order code 1,
    2, 3, which by the channel names is visual, auditory, tactile; the Methods give the fixed order
    visual, tactile, auditory.
- kind: other
  statement: Reward TTL onsets outnumber the trials labelled success in 205 of 364 task sessions (by 1 to
    60, median 1) and are fewer in one; the down-sampled reward series differs from the labels in some
    sessions too (by -35 to 12). The success rate depends on which is counted.
- kind: format_error
  statement: The down-sampled keypoint series (processing/downsampled/*_video_keypoints) keep a
    confidence array of the 100 Hz video length next to 30 Hz data, so the two cannot be paired.
- kind: other
  statement: The pupil diameter series contain values that are infinite or far wider than the 300-pixel
    eye video (1e5 pixels and more), in a median 0.14% of the 30 Hz frames per session and above 5% in 10
    of 356 sessions (up to 63%).
- kind: other
  statement: 357 task sessions have body-camera keypoints, against 355 in the paper, and 356 of them have
    a successful trial, against the paper's 354 analysed sessions.
- kind: other
  statement: The session-initial T_pull equals the previous session's T_pull_final minus 100 ms (floored
    at 0) in 219 of 332 pairs of consecutive sessions; in the others it is often 0 or 50 ms after a final
    of 50 to 150 ms. The Methods state the minus-100-ms rule.
- kind: other
  statement: Four sensory-mapping sessions (VG1-GC#48, VG1-GC#63, VG1-GC#66 and VG1-GC#73) hold 36000 frames (20 min)
    where the Methods give 15 min (27000 frames); one task session holds 45413 frames, noted in the file.
- kind: other
  statement: The paper's Data Records describe two TIFF stacks per session; the dandiset holds the
    motion-corrected stacks inside the NWB files (widefield_blue and widefield_UV) and no TIFF files.
- kind: data_missing
  statement: The manual skull-landmark annotations (75 sessions) and the manual keypoint annotations of
    the DeepLabCut validation frames behind Figures 4a,b and 5a-c are not in the dataset or the linked
    repositories, so those validations cannot be repeated.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which task session is the example of Figure 6, and how
    were the movement onsets, the match of area traces with the pupil, and the drop in variability
    judged? Over all sessions the jaw moves before lever-pull onset and RSPagl, AUDs and VISp follow the
    lever more than the pupil, so the Figure 6b statements cannot be checked without the session.
- kind: methods_unavailable
  statement: Question for the paper's authors. What test or bound supports "the success rate seemed to
    be constant" (Figure 3c)? The medians show no monotonic trend (Spearman p 0.36), but the session-15
    median is 27% above session 1's.
