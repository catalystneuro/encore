- claim: touch-ablation-size
  outcome: partially_reproduced
  notebook: reproduce_peron_2020.ipynb
  output: claim:touch-ablation-size
  measured:
  - 16.78
  - 12.77
  - 5.85
  - 79.3
  - 27.1
  notes: 'The curation files give 50, 9, 15, 15, 11, 17, 14, 11 and 9 ablated neurons in the nine touch
    ablations (mean 16.78, s.d. 12.77, 5.85% of 287), all equal to Extended Data Table 1, within tolerance.
    Under the criterion''s rule, the rank of each ablated neuron''s pre-ablation Rtouch among the included
    touch neurons, the 145 ablated neurons with a score sit at the 79.3 ± 27.1 percentile, outside 70
    ± 7 and 35 ± 3.5. The code''s rule (ablation_summ_stats.m) gives 70.3 ± 35.0 over the 151, the paper''s
    values: it gives 1/N to the 9 ablated neurons that score above every included neuron and to the 6
    with no score, as a synthetic check shows (0.01 for a score above all of 100). The criterion''s description
    of the code''s rule as a rank is asked of a reader (questions/peron-2020.yaml).'
  deviations:
  - The criterion's rank rule is the main reading (fraction of included neurons at or below the ablated
    neuron's score; ablated neurons with no score left out); the code's rule is shown as a variant.
- claim: touch-ablation-reduces-touch
  outcome: reproduced
  notebook: reproduce_peron_2020.ipynb
  output: claim:touch-ablation-reduces-touch
  measured:
  - 0.123
  - 0.1
  - 7121
  notes: Grand median Rtouch 0.123 before and 0.100 after touch ablation, all 9 mice declining, signed-rank
    p = 0.004, the same with the code's cylinder. The members entering the medians number 7,121 (7,089
    with the code's cylinder), outside the tolerance of 8,392; the paper's 8,392 equals the sum over the
    9 mice of the pre-ablation count of neurons with score above 0.1, so the reported neuron count is
    that sum. The criterion only asks for the count to be reported. The adjusted MADs here (0.011 and
    0.016, 1.4826 times the median absolute deviation) are about half the paper's 0.021 and 0.037; 1.4826
    times the mean absolute deviation, MATLAB's default mad, gives 0.021 and 0.038.
  deviations:
  - The code's proximity rule (signed depth difference below 30 um) is shown as a variant, as the claims
    file asks; it changes no outcome.
