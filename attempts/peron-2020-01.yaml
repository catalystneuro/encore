inputs:
- what: Mouse lists per ablation type, the pre-ablation and post-ablation directory and curation files
    of each ablation, the feature names, the shuffle rule, the proximity rule and the code's versions
    of each analysis, used where the claims file cites them or leaves a detail to the code. From the paper's
    analysis code.
  source: https://github.com/peronlab/ablation at commit 74b732149ea5813c2394207f94a6a9e7f84d9bed
- what: Extended Data Table 1 of the paper (cell counts, ablated counts, touch and whisking counts, changes
    in median scores per ablation), transcribed from the PDF as reference values for per-mouse-table and
    neurons-per-mouse.
  source: doi:10.1038/s41586-020-2062-x
- what: 'Structure of the network model where the Methods leave it to the code: the 300 ms stimulus interval
    and the Gaussian kernel cut at 3.5 s.d. in the encoding score (simulate.py, utils.py). The model''s
    parameters follow the Methods, not this repository''s parameter files.'
  source: https://github.com/jwittenbach/ablation-sim at commit a8b5583ef8ac9b8ad1cfef883186e67763c925ef
outcomes:
- claim: model-amplification-increases
  outcome: reproduced
  assumed: true
  notebook: reproduce_peron_2020.ipynb
  output: claim:model-amplification-increases
  measured: 7.74
  notes: Under calibration reading (a) the matched input strength is 218.0 at Pconn 0.2 and 28.2 at Pconn
    0.4, so normalized amplification at 0.4 is 7.74; under reading (b) 150.0 and 15.0, amplification 10.00.
    Reading (c), a fraction of 0.17 excitatory neurons above 0.1, cannot be met in this network (largest
    fraction over all sweeps 0.119), so it sets no strength. The criterion's condition, a lower strength
    at 0.4 than at 0.2, holds under both readings that can be set. Amplification is far larger than in
    the paper's Fig. 1c. The outcome rests on the assumptions of the model (deviations).
  deviations:
  - The network is rebuilt from the Methods (Network model) in numpy, with the step loop compiled by numba
    (helper peron2020_model.py); the paper used Brian2. The parameters are those of the Methods and the
    claims file; github.com/jwittenbach/ablation-sim at a8b5583 gives only the 300 ms stimulus interval
    and the Gaussian kernel cut at 3.5 s.d.
  - Assumption. The background PSP is not given; one PSP per target population is set (0.39 mV to excitatory,
    1.4 mV to inhibitory neurons) so that the tonic rates at Pconn 0.2 without stimulus are 0.51 and 10.35
    Hz, the 0.5 and 10 Hz the Methods say the background frequencies were selected for (notebook, first
    model cell, with a 3 by 3 grid around the values).
  - Assumption. Inhibitory PSPs are -1 mV, from "All connections had the same strength, which was chosen
    so that the resulting post-synaptic potential (PSP) is 1 mV" (Methods).
  - Assumption. The input strength is the peak current of the beta(3,5) waveform. It is set by the claims
    file's readings from sweeps of two networks per strength; reading (a) is adopted where the readings
    differ, as reading (b)'s KS minimum lies at the weakest strength of both touch-input sweeps (the distance
    grows with strength) and reading (c), 17%, cannot be reached (largest fraction 0.119, as almost only
    the 200 input-recipient neurons pass 0.1).
  - Assumption. "All neurons that met the 0.1 encoding score criteria" (Methods) is taken as all neurons
    of the network, inhibitory ones included; excitatory neurons alone are shown as a variant.
  - The run after ablation repeats the run before with the same background and initial state (as Brian2's
    store and restore), a standard choice; the first stimulus starts 300 ms into the run, giving the 66
    presentations of the Methods.
