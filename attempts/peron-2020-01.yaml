outcomes:
- claim: model-amplification-increases
  outcome: blocked
  blocked_by: other
  notes: Not tested in this attempt. The claim needs the network model of the Methods to be
    built and run (2,000 leaky integrate-and-fire neurons, 20 s of model time at 0.1 ms steps,
    input strengths calibrated against in vivo score distributions under three readings). A
    timing prototype of the network in numpy ran 1 s of model time in 0.9 s without spiking, so
    a run of 20 s takes about 20 s; with calibration sweeps and 30 networks per condition the
    model claims need about 400 runs (about 2.2 hours on one core). The Methods also leave the
    weight of the background Poisson input unstated. Building, calibrating and checking the
    model did not fit the five-hour run alongside the data claims, which came first. The model
    outputs were not deposited.
