findings:
- kind: metadata_insufficient
  about: data
  statement: The data descriptor names only the session structs and the ablation logs. The files
    that say which neurons were ablated (manualCurationData.mat in the NYU mice, with per-attempt
    targets and success flags; an<id>_<date>.mat and ablation_ids_manually_curated.mat in the
    JRC mice, with attempted_ids and ablated_ids), and which directory is the pre-ablation and
    post-ablation data of each of the 24 ablations, can be found only by reading the paper's
    analysis code (get_data_path.m).
- kind: other
  about: data
  statement: The session structs come in two MATLAB formats, 94 in version 5 and 107 in version
    7.3 (HDF5), even within one mouse's directories, with no note of it; a reader needs both
    scipy.io and h5py. The archives are tar.gz files of 2.7 to 11.9 GB that cannot be read at an
    offset, so any use of one file means streaming the whole archive; 77 GB of the 128 GB are
    ablation logs.
- kind: data_missing
  about: data
  statement: The six session files of an278939's session_neuropilone_postablate_silent_merged
    directory, the pre-ablation data of its whisking ablation, hold no trial-averaged dF/F
    (dffBased_HitLTrialAvg, dffBased_HitRTrialAvg), unlike the other 195 files, so the
    response-similarity analysis of Fig. 3g cannot include that ablation.
- kind: other
  about: data
  statement: an278937's pre-ablation directory holds six subvolumes (5,225 neurons) and its
    post-ablation directories five (4,230); the 995 neurons of the sixth subvolume have no
    post-ablation data, with no note of it.
- kind: metadata_insufficient
  about: data
  statement: an250220's curation file (an250220_all.mat) lists only the ablated ids, not the
    attempted ones, and the code looks for its logs under a folder that does not exist; the
    ablation logs of an257218 carry no target id (la.ablatedId). The success rate of these
    ablations cannot be computed from the logs.
- kind: data_missing
  about: data
  statement: The histology behind Extended Data Fig. 3b-d (IBA1 and GFAP sections) is not in the
    data set.
- kind: code_mismatch
  statement: The grand medians the paper gives for whisking ablations (Rtouch 0.112 to 0.095,
    Rwhisking 0.108 to 0.107) and silent ablations (Rtouch 0.115 to 0.107, Rwhisking 0.115 to
    0.114) are not medians over those mice. ablation_summ_stats.m stores mouse medians in one
    matrix indexed by position among all 24 ablations and takes the median over the whole
    matrix, which for the whisking block includes 9 touch rows and 8 zero rows, and for the silent
    block all 24 ablations. Over the mice of each type the medians are 0.113 to 0.106 and 0.114 to
    0.110 (whisking), 0.111 to 0.113 and 0.114 to 0.115 (silent). The P values, computed per
    type, are unaffected.
- kind: code_mismatch
  statement: The behaviour P values of Extended Data Fig. 6, described as Wilcoxon signed-rank
    tests paired by mouse, are rank-sum tests (ablation_figure_beh.m), and its KS tests compare
    normalized histograms, not samples. With the paired test, fraction correct rises after silent
    ablations (p = 0.008) and touches per trial after whisking ablations (p = 0.047).
- kind: code_mismatch
  statement: In the response-similarity analysis (Fig. 3) the code writes the correct-left and
    correct-right trial averages into the same 70 rows, so the similarity uses the right-trial
    average alone, not the concatenation the Methods describe; and it fits the per-mouse lines to
    bin means, not to the neurons' points as the Methods say. The paper's sign-test P values
    (0.039, 0.508) and neuron counts (2,768, 1,085) equal the code's version exactly; with the
    Methods' trial average and fit, the touch slopes are not significant (p = 0.180) and the
    whisking slopes are (p = 0.039).
- kind: code_mismatch
  statement: The Methods exclude neurons within a cylinder of 60 um height centred on each ablated
    neuron, but the code excludes every neuron less than 30 um below it, and all neurons above it,
    within 10 um laterally (signed depth difference). The paper's counts (1,028 adjacent
    neurons, Extended Data Table 1's touch and whisking counts) and several values follow the
    code's rule.
- kind: paper_inconsistency
  statement: The neuron counts given with the grand medians (8,392, 6,975, 5,866, 6,161, 7,110 and
    7,684 neurons) are the sums over mice of the number of neurons with score above 0.1 before
    ablation, not the number of neurons that enter the medians (7,121, 5,389, 4,605, 4,960, 6,339
    and 5,436 under the Methods rule), which leave out neurons failing the shuffle test or
    belonging to both representations.
- kind: methods_unavailable
  statement: Question for the authors. Which proximity rule is meant, the Methods cylinder
    (|depth difference| < 30 um) or the code's signed rule? Extended Data Table 1 matches the
    code's rule in all 24 rows and the Methods cylinder in 23 (an275801's touch ablation gives
    -0.071 against -0.065); this attempt adopted the code's rule for the table.
- kind: methods_unavailable
  statement: Question for the authors. How are touches merged into bursts at the 50 ms interval
    (the toolbox method getBurstTimes is not in the repository)? This attempt joined a touch to
    the previous one when it started less than 50 ms after that touch ended; touches per trial
    then give rank-sum p = 0.796 and 0.645 for touch and silent ablations, against the figure's
    0.666 and 0.721.
