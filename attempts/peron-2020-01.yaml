- claim: behaviour-unchanged
  outcome: not_reproduced
  notebook: reproduce_peron_2020.ipynb
  output: claim:behaviour-unchanged
  notes: With the paired signed-rank test the legend names, fraction correct rises after the 8
    silent ablations (mean 0.697 to 0.786, p = 0.008) and touches per trial rise after the 7
    whisking ablations (1.654 to 2.031, p = 0.047); after touch ablations neither changes (p =
    0.910 and 0.570). Per-mouse KS tests on the samples give p < 0.05 in all 24 ablations for
    whisker angle and in 23 of 24 for angle at touch and curvature change at touch, with small
    effects (median D 0.085, 0.128, 0.105) and samples of 10^3 to 10^6. The code's tests find no
    change (rank-sum p = 0.863, 0.065 and 0.710 for fraction correct and 0.620 for whisking
    touches, equal to the figure; 0.796 and 0.645 for touches after touch and silent ablations
    against 0.666 and 0.721; KS on normalized histograms never below 0.05). So the paper's P
    values come from unpaired tests, not the paired test its legend names. The part of the
    statement about touch ablations, that behaviour does not explain the decline of the touch
    representation, holds under every test run.
  deviations:
  - Touches are merged into bursts when a touch starts less than 50 ms after the previous touch
    of the trial ended; the code calls a toolbox method (getBurstTimes) that is not in its
    repository. This bears only on touches per trial; the outcome rests also on the fraction
    correct after silent ablations, which does not use it.
  - Fraction correct is hits over hits and errors, the first four trial types the code sums
    (ablation_figure_beh.m); trials without a lick are not scored.
