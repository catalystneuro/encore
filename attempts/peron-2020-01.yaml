- claim: neurons-per-mouse
  outcome: reproduced
  notebook: reproduce_peron_2020.ipynb
  output: claim:neurons-per-mouse
  measured:
  - 8126.3
  - 2435.6
  notes: Over the first ablation of each of the 16 mice, the per-neuron tables hold 8,126.3 ± 2,435.6
    neurons, and all 16 per-mouse counts equal the Cell count column of Extended Data Table 1. Counting
    the raw pre-ablation files instead gives 8,188.5 ± 2,340.3, because an278937's pre-ablation directory
