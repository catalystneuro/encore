- claim: fig8c-relative-delay-flat
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_hernandez_perez_2020.ipynb
  output: claim:fig8c-relative-delay-flat
  notes: >-
    With the period from the reference peak to the next peak (the criterion's reading) the relative
    delay rises with frequency in all six rats, median slope 2.16 %/Hz (95% CI 1.61 to 2.52), T+ =
    21, p = 0.031; with the period from the previous peak it falls in all six (median -1.28 %/Hz,
    p = 0.031). The test finds a relation under both, and under both unit readings. A centred
    period (half the interval from the previous to the next peak, this attempt's variant, which does
    not use the reference peak's time) gives no relation under the `counts` readings (p = 0.44 to
    0.69): the relation the criterion's readings find comes largely from timing noise shared by the
    per-cycle delay and the period. A second variant, the frequency from the dorsal-most channel's
    Hilbert phase over a fixed 250 ms window centred on the reference peak, also finds no relation
    under three of the four `counts` combinations (main median -0.43 %/Hz, p = 0.156). The outcome
    says that the paper's result is not found with the claims file's period; it is not evidence
    against the paper's mechanism. Reference cycles per rat 664, 3463, 945, 657, 2528 and 1082.
  deviations:
  - >-
    The per-cycle absolute delay is the robust slope of (peak offset minus Delay_Asym) on position,
    the corrected delay of fig7-residual-delay reading a (Methods, Comparison to coupled-oscillators
    and fixed-delay models).
  - >-
    Assumed, the claims file's period (reference peak to next peak, previous peak shown), which the
    paper does not define. The per-cycle delay and this period share the reference peak's time, and
    the relation changes sign between the next-peak and previous-peak periods, so the outcome rests
    on the definition (question for the authors under findings).
- claim: fig8d-absolute-delay-slope
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_hernandez_perez_2020.ipynb
  output: claim:fig8d-absolute-delay-slope
  measured: 2.06
  notes: >-
    With the period to the next peak the absolute delay rises with frequency in all six rats, median
    slope +2.06 ms/mm per Hz (95% CI 1.28 to 2.76), p = 0.031; times the span of the array +5.16 ms
    per Hz. The sign is opposite to the paper's -3.12. With the period from the previous peak, shown
    as the criterion of fig8c-relative-delay-flat asks, the slope is negative in all rats, and with
    no amplitude restriction it is -3.13 and -3.12 ms/mm per Hz under two combinations, within
    tolerance; with the centred variant it is -0.84 (p = 0.0625) under the main reading. Per rat
    under the main reading, the uncorrected peak delay falls with frequency under the next-peak
    period (median -2.07, all six rats) and the trough delay, whose time is not the reference
    peak's, falls under the next-peak, centred and Hilbert frequencies (-0.74, -1.15, -1.85): the
