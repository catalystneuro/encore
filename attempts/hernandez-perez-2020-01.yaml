- claim: fig2a-all-rats
  outcome: reproduced
  notebook: reproduce_hernandez_perez_2020.ipynb
  output: claim:fig2a-all-rats
  notes: >-
    All six per-rat Hilbert slopes are positive (17.1 to 38.0 deg/mm). In the cycle-triggered
    average of the raw LFP, triggered on the dorsal-most channel's waveform peaks in its theta epochs,
    the ventral-most channel's peak lags the dorsal-most's by 18, 18, 18, 40, 38 and 38 ms.
  deviations:
