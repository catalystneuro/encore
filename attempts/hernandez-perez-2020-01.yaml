findings:
- kind: metadata_insufficient
  statement: >-
    The files state no unit for the LFP. Rats 1, 4, 5 and 6 hold integers (step 1, rat 5 reaching
    32767, the int16 limit), consistent with ADC counts; rats 2 and 3 hold non-integers whose spread
    is about five times smaller, consistent with µV at the Intan step of 0.195 µV. The paper's 400 µV
    theta threshold, applied to the values as stored, selects no theta epoch in rats 2 and 3, and
    with every file read as µV it would select almost none in any rat, so the paper's epoch
    selection cannot be repeated without knowing the scale of each file.
- kind: data_missing
  statement: >-
    The data set holds only the 500 Hz LFP of one recording per rat. The 30 kHz broadband, the layer
    II multi-unit recordings of Figure 4 and the laminar array's sites of Figure 3 are not in it, so
    three of the paper's findings cannot be tested.
- kind: metadata_insufficient
  statement: >-
    No electrode positions or spacings are given per rat, nor which channels were inside the MEC at
    the key recording; the descriptor refers to the paper's micrographs and its PDF. The paper says
    one array had merged shanks with a measured spacing not reported. Distances here are the nominal
    0.566 mm per channel.
- kind: other
  statement: >-
    The recordings last 20.1 to 33.5 min (rat 5 33.5 min), where the paper describes 25-min trials.
- kind: methods_unavailable
  statement: >-
    Question for the authors. In what unit is each file of hc-27, and was the 400 µV theta-amplitude
    threshold applied on the same scale in all six rats? Applying it to the values as stored leaves
    rats 2 and 3 without theta epochs; this attempt divided their values by 0.195 µV per bit
    (assumed). Several outcomes (phase locking, the phase-specific delays and the asymmetry-related
    delay) change with this choice.
- kind: methods_unavailable
  statement: >-
    Question for the authors. Were the phase locking and its slope (Figure 2E) computed on each
    channel's own high-theta epochs, on the dorsal-most channel's, or on times all channels share?
    The median phase locking is 0.946 with the dorsal-most channel's epochs and 0.96 to 0.97 with the
    others, and the slope -0.068 against -0.03 to -0.04 per mm.
- kind: methods_unavailable
  statement: >-
    Question for the authors. For Figure 8, how was a cycle's period defined (from the reference peak
    to the next, from the previous, or otherwise), and was the absolute delay the per-cycle robust
    slope? Here the relation of per-cycle delay to frequency changes sign between the next-peak and
    previous-peak periods and largely disappears with a period that does not use the reference
    peak's time, which suggests the relation is dominated by timing noise shared by the two
    measures.
- kind: methods_unavailable
  statement: >-
    Question for the authors. How were cycles matched across channels for the asymmetry-related delay
    (Methods, Asymmetry-corrected data), and how were the waveform extrema chosen when local maxima
    and minima did not alternate? This attempt matched the cycle with the nearest peak and kept the
    more extreme of two extrema of a kind in a row.
- kind: paper_inconsistency
  statement: >-
    Several tests are printed as "rank sum [max]" with values (a maximum of 21 for n = 6, p = 0.03 at
    0 or 21) that are those of a signed-rank test, and the multi-unit test is printed as "rank sum
    [max]=21 [21], p = 0.03, n=3", which no rank test of three values can give (maximum 6, smallest
    p 0.25). The coherence slope is printed as positive (0.067/mm) with a statistic of 21 of 21 while
    the text says coherence decreased.
