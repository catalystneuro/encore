- claim: fig2g-power-no-change
  outcome: reproduced
  notebook: reproduce_hernandez_perez_2020.ipynb
  output: claim:fig2g-power-no-change
  notes: >-
    The signed-rank test of the six per-rat slopes of relative theta power on distance does not find
    a change under any of the 12 unit, epoch and power-measure readings (p = 0.094 to 0.219); raw
    power gives p = 0.156 to 0.313. Under the main reading the median slope of relative power is
    -0.098 per mm (Welch; 95% CI -0.221 to 0.037) and -0.107 (Hilbert); the paper's median is +0.73
    AU/mm [-0.08 to 0.93]. The test does not find the effect, so the claim of absence holds; the
    median slope here has the other sign from the paper's.
