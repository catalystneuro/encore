- claim: fig2d-phase-shift-rate
  outcome: reproduced
  notebook: reproduce_hernandez_perez_2020.ipynb
  output: claim:fig2d-phase-shift-rate
  measured: 27.32
  notes: >-
    Under the main reading (units `counts`, each channel's own theta epochs, least-squares slope
    with intercept, mean over rats) the per-rat slopes are 17.1, 22.6, 21.7, 38.0, 31.5 and 33.0
    deg/mm, mean 27.32 (SEM 3.27), median 27.04, all positive (ventral sites lag), signed-rank T+ =
    21 of 21, p = 0.031. All 12 combinations of the unit (`counts`, `none`), O3 and O6 readings that
    can be run meet the criterion (means 25.6 to 27.7), so the outcome does not rest on the unit
    reading. Under `file` rats 2 and 3 have no theta epoch, and no test over six rats can be made.
  deviations:
  - >-
    Positions are 0.566 mm times the channel index (O1 a), the nominal spacing of Methods, Electrode
    array construction; the data set gives no positions, so the measured spacing of the one array
    with merged shanks (O1 b) cannot be used.
  - >-
    Every channel in each file is used (O2 a). The data set's author proof (docs/MEC-TW_authorProof.pdf,
    Figure 1, figure supplement 1) marks 6, 5, 6, 5, 6 and 5 electrode tips at the key recording for
    rats 1 to 6 (read by eye), the channel counts of the files, and labels the electrodes outside
    the MEC "unused", so reading O2 b selects the same channels.
  - >-
    The files state no unit. The 400 µV threshold of Methods, Data inclusion criteria, is applied on
    the scale of the integer files, with the non-integer files (rats 2 and 3) divided by 0.195 µV
    per bit (`counts`); this is 400 µV if the integer files are in µV and about 78 µV if they are
    Intan counts. `none` (no amplitude restriction) is shown and gives the same outcome.
