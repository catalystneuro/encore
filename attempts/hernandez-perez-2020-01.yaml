- claim: fig2c-coherence
  outcome: reproduced
  notebook: reproduce_hernandez_perez_2020.ipynb
  output: claim:fig2c-coherence
  measured: 0.677
  notes: >-
    Over all pairs the median over rats of the per-rat median coherence is 0.677 with 1 s windows
    (window a) and 0.690 with cohere's default (b), inside 0.66 to 0.81. Against the dorsal-most
    electrode only it is 0.605 to 0.621, below the range (bootstrap CI 0.50 to 0.75). Coherence uses
