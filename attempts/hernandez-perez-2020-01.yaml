- claim: fig8c-relative-delay-flat
  outcome: not_reproduced
  notebook: reproduce_hernandez_perez_2020.ipynb
  output: claim:fig8c-relative-delay-flat
  notes: >-
    With the period from the reference peak to the next peak (the criterion's reading) the relative
    delay rises with frequency in all six rats, median slope 2.16 %/Hz (95% CI 1.61 to 2.52), T+ =
    21, p = 0.031; with the period from the previous peak it falls in all six (median -1.28 %/Hz,
    p = 0.031). The test finds a relation under both, and under both unit readings. A centred
    period (half the interval from the previous to the next peak, this attempt's variant, which does
    not use the reference peak's time) gives no relation under the `counts` readings (p = 0.44 to
    0.69): the relation the criterion's readings find comes largely from timing noise shared by the
    per-cycle delay and the period. Reference cycles per rat 664, 3463, 945, 657, 2528 and 1082.
  deviations:
  - >-
    The per-cycle absolute delay is the robust slope of (peak offset minus Delay_Asym) on position,
    the corrected delay of fig7-residual-delay reading a (Methods, Comparison to coupled-oscillators
    and fixed-delay models).
