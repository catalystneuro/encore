  deviations:
  - >-
    Reference cycles are the dorsal-most channel's valid cycles inside the theta epochs of all
    channels (O3 b; reading a coincides with b at the event times) or of the dorsal-most (c). The
    robust regression is MATLAB robustfit's bisquare with its default tuning, written out in the
