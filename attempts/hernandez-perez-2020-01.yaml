findings:
- kind: metadata_insufficient
  statement: >-
    The files state no unit for the LFP. Rats 1, 4, 5 and 6 hold integers (step 1, rat 5 reaching
    32767, the int16 limit), consistent with ADC counts; rats 2 and 3 hold non-integers whose spread
    is about five times smaller, consistent with µV at the Intan step of 0.195 µV. The paper's 400 µV
    theta threshold, applied to the values as stored, selects no theta epoch in rats 2 and 3, and
    with the integer files converted from Intan counts to µV it selects none in any rat (median
    theta amplitudes 52 to 201 µV), so the paper's epoch selection cannot be repeated without
    knowing the scale of each file.
- kind: data_missing
  statement: >-
    The data set holds only the 500 Hz LFP of one recording per rat. The 30 kHz broadband, the layer
    II multi-unit recordings of Figure 4 and the laminar array's sites of Figure 3 are not in it, so
    three of the paper's findings cannot be tested.
- kind: metadata_insufficient
  statement: >-
    No electrode positions or spacings are given per rat. Which electrodes were used is shown only in
    a figure of the data set's author proof (Figure 1, figure supplement 1), whose tip markers match
    the files' channel counts but are not labelled by channel. The paper says one array had merged
