  measured:
  - 5.86
  - 11.82
  notes: >-
    Under the main reading the falling-phase delay is 5.86 ms/mm (within 5.47 +/- 3.23) and the peak
    delay 11.82 ms/mm (within 12.00 +/- 5.48); the falling phase is the shortest of the four; the
    peak is longer than the falling phase in all six rats (T+ = 21, p = 0.031). The rising phase,
    12.53 ms/mm, not the peak, is the longest, under all eight readings (with no amplitude
    restriction 10.43 against 9.36). Every part holds except "longest for the peak". The criterion
    defines reproduced (all parts) and partially reproduced (values and order hold, test fails);
    this case, where one part of the order fails, is recorded as partially reproduced because the
    claim holds in part. Reference cycles per rat 678, 3467, 964, 659, 2601 and 1082 (all
    channels' epochs; 815 to 6286 with the dorsal-most's), against the paper's 3500 to 5000;
