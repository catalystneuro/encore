findings:
- kind: format_error
  statement: dataset_description.json is not valid JSON, so BIDS tools cannot read it; the second
    author name is in typographic quotes and a comma is missing after the Description value.
- kind: metadata_insufficient
  statement: Nothing in the dandiset says what the MRI files hold. The files in MRI/FC are single
    volumes, the paper's normalized seed maps (Fisher z with the seed in area 25 of the stimulated or
    implanted hemisphere, divided by a session maximum), on a 1.5 mm grid in NMT space; the files in
    MRI/FA are FA maps, each in its own session's space. This was found only by matching the values
    to the paper's source data in DANDI:001773. The normalizing maximum is not in the deposited maps
    (their maxima are 0.55 to 1.38), and the seed of the control animals is not stated in the files.
- kind: data_missing
  statement: No tract masks, CB subregion masks or target ROI masks are deposited. Which voxels the
    paper analysed can be recovered only from the source data of DANDI:001773, by position for the
    seed maps and by matching FA values for the FA maps.
- kind: data_missing
  statement: No EPI data are deposited, only one seed map per animal and session, although the
    archive's description lists "Functional MRI (EPI; FC) data". The whole-brain connectivity
    findings (Fig. 4, Extended Data Fig. 10c) and the voxel-wise test of the control group cannot be
    tested.
- kind: data_missing
  statement: The cell counts behind the immunofluorescence results and the per-axon measurements
    behind the g-ratio are not in the dandiset, which holds the images only. Counts made here
    automatically agree with the paper's in level for the MCC-CB of N and T and the dACC-CB, less
    well in the UF-FM overlap and for monkey D, and give a significant dACC-CB side difference the
    paper's counts do not.
- kind: methods_unavailable
  statement: For the paper's authors, how were cells counted in FIJI? The Methods give
    "section-specific intensity thresholds for each channel" but not the threshold method, any
    background subtraction, size filter or watershed split. Here an automatic threshold per section
    and channel was used with objects of at least 10 or 50 pixels; no single reading matches the
    paper's counts in all four regions (10 pixels in the MCC-CB and dACC-CB of N and T, 50 pixels in
    the MCC-CB of D, neither in the UF-FM overlap). fig6c-sham-cc1-no-change depends on the size (p =
    0.31 at 10 pixels, 0.044 at 50) and is blocked; ed6a-dacc-cb-no-change is not reproduced under
    every reading, though the paper's counts give p = 0.09.
- kind: other
  statement: EM/TR-1-8r.tif is a byte-identical copy of EM/TR-1-8.tif (same blob); the paper's
    per-axon sheet names only TR-1-8.
- kind: other
  statement: IF/IF_CC1_UF_FM_overlap_mkNT holds six fields for section N122, right hemisphere, where
    the design has five per section; the paper's sheet has no row for N122 RW6. Two other file names
    carry a suffix (N112 LW1B, N453-RW-6r) that the paper's sheets do not explain.
- kind: metadata_insufficient
  statement: The immunofluorescence TIFFs carry no pixel size (the resolution tag is the default 72
    per inch) and no channel names; red holding CC1 and blue holding DAPI is inferred from the
    paper's labels. The sections differ in bit depth (8-bit for N603, N613, N623; 16-bit elsewhere).
- kind: other
  statement: The paper's per-voxel FA lists repeat voxels. Within one tract, side and session the same
    value is listed twice (99 times in the whole-tract list of N and T, 44 in its subregion list, 40
    and 18 in the lists of D), so the voxel n of the FA tests counts some voxels twice. Other voxels
    are listed, with the same value, in two or more tracts of one session (233 in the whole-tract
    list of N and T, mostly UF with FM or CB with UF on one side; 71, 1 and 18 in the other lists).
    The paper does not explain either kind of repeat.
- kind: paper_inconsistency
  statement: Extended Data Fig. 6b legend gives the UF-FM DAPI side effect as F 1,76 = 0, P = 0.9611,
    partial eta squared 4.97e-05. The paper's own per-field counts (CC1_UF-FMoverlap_data_a.xlsx,
    DANDI:001773) give F(1,76) = 0.0038, p = 0.9511, and the stated partial eta squared fits F =
    0.0038, so 0.9611 is a misprint for 0.9511.
- kind: other
  statement: All six FA maps reach 1.21 to 1.22, above the bound of 1 that FA has by definition; these
    voxels lie outside the paper's tract lists.
