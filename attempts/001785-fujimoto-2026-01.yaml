inputs:
- what: The paper's source-data spreadsheets, used for labels the dandiset lacks. The per-voxel
    target ROI lists with AFNI coordinates (dbs_FC25norm_mkNT_concatenated_all_data_a.xlsx,
    dbs_FC25norm_mkD_concatenated_all_data_a.xlsx) give the ROI of each seed-map voxel; the per-voxel
    FA lists (dbs_FA_wholetract_data_a.xlsx, dbs_FA_CB_subpart_data_a.xlsx and the two mkD sheets) give
    the tract or CB subregion of each FA voxel, located by value; the per-field CC1 and DAPI counts
    (four CC1_*.xlsx sheets) are reference values for the link claim link-if-counts and are shown
    beside the counts made here; the per-axon g-ratio sheet is read only for the names of the images
    it measured. The behaviour bins (dbs_behavior_data_a.xlsx) are the data of the two claims marked
    data elsewhere. The MATLAB scripts under code/ were read for the models and post hoc tests.
  source: DANDI:001773 version 0.260416.1939, doi:10.48324/dandi.001773/0.260416.1939
outcomes:
- claim: link-fc-voxels
  outcome: reproduced
  notebook: reproduce_fujimoto_2026.ipynb
  output: claim:link-fc-voxels
  notes: All 5087 listed voxels of each of the six maps (N, T and D, pre and post) fall on grid centres
    of the dandiset's maps once the AFNI coordinates are read as RAI (x and y sign-flipped), and the
    dandiset's value equals the source data's normalized z within 5e-7 at every one. The dandiset's FC
    files are therefore the paper's normalized seed maps. The voxel counts per ROI and side that
    follow from the lists equal Supplementary Table 8 (PCC 249, vmFC 109, STG 499, DLPFC 766 per side).
- claim: link-fa-voxels
  outcome: reproduced
  notebook: reproduce_fujimoto_2026.ipynb
  output: claim:link-fa-voxels
  notes: 6332 of 6332 FA values of the four sheets are found in the map of their monkey and session,
    within 5e-7. 17 values occur in more than one voxel of their map; the value is the same whichever
    is taken. The lists repeat voxels within one monkey, session, side and tract (99 repeats in the
    whole-tract list of N and T, 44 in the subregion list, 40 and 18 in the lists of D), so the
    paper's voxel n counts some voxels more than once. Pre and post values are both found in the
    deposited maps, although these lie each in their own space.
- claim: link-if-counts
  outcome: partially_reproduced
  notebook: reproduce_fujimoto_2026.ipynb
  output: claim:link-if-counts
  notes: All 360 rows of the four sheets have their image, matched by section, hemisphere and field
    in the file name; the image N122 RW6 (UF-FM overlap) has no row. With the smallest object 10
    pixels (IsoData; Otsu is the same to two digits) the per-field counts correlate with the paper's
    at r = 0.93 (CC1) and 0.79 (DAPI) in the MCC-CB of N and T, median ratios 1.01 and 0.84; 0.98 and
    0.98, ratios 1.14 and 1.08, in the dACC-CB; 0.69 and 0.80, ratios 1.06 and 0.95, in the UF-FM
    overlap; 0.66 and 0.80, ratios 1.30 and 1.02, in the MCC-CB of D. With 50 pixels r is similar
    (0.71 to 0.98) and the counts 9 to 35% lower than the paper's. The link holds in two of the four
    regions (MCC-CB of N and T, dACC-CB). The criterion of this link claim was written after the
    counts were first computed.
  deviations:
  - The paper's thresholds were set by hand per section in FIJI and are not reported; here a threshold
    is computed per section and channel over all fields of the section (Methods, Immunofluorescence
    of myelinating oligodendrocytes, "section-specific intensity thresholds for each channel").
- claim: ed1-behavior-increase
  outcome: reproduced
  notebook: reproduce_fujimoto_2026.ipynb
  output: claim:ed1-behavior-increase
  notes: On the 240 bins of N and T, anovan with monkey x stim gives movement F(1,236) = 34.61, p =
    1.4e-08, and foraging F(1,236) = 17.35, p = 4.4e-05, as reported. Post proportions exceed pre in
    N (movement 0.08 to 0.55, foraging 0.03 to 0.05) and T (0.20 to 0.38, 0.02 to 0.30). The data are
    the paper's binarized bins in DANDI:001773; the videos are not public.
- claim: ed1-sham-no-behavior-change
  outcome: not_reproduced
  notebook: reproduce_fujimoto_2026.ipynb
  output: claim:ed1-sham-no-behavior-change
  notes: In monkey D movement does not change (0.38 to 0.27 of bins, F(1,118) = 1.86, p = 0.18), but
    foraging falls (0.18 to 0.05, F(1,118) = 5.32, p = 0.023). The paper reports no test for D; by
    the test the claims file applies, one of the two behaviours changes, as a decrease.
- claim: fig2a-cb-fa-increase
  outcome: reproduced
  notebook: reproduce_fujimoto_2026.ipynb
  output: claim:fig2a-cb-fa-increase
  measured:
  - 380
  - 363
  - 252
  - 367
  - 105
  - 133
  notes: PrePost x side F(1,3187) = 4.64, p = 0.031, partial eta squared 0.0015; the stimulated CB
    rises from 0.324 to 0.369 (Tukey-Kramer p = 0.022), as reported. The FA values are the dandiset's,
    at the voxels of the paper's lists (link-fa-voxels), so the voxel counts are the paper's and the
    statistics repeat the paper's.
  deviations:
  - Tract membership of voxels is taken from the paper's source data, located in the dandiset's FA
    maps by value; the dandiset holds no tract masks, and the tracking, the registration and the
    lead-track exclusion were not redone. Both readings of the lead-track exclusion in the claims
