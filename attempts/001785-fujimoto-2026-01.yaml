  - Cells counted here, as for fig3c-cc1-dapi-ratio-mcc; all four readings give the same outcome.
- claim: fig3f-gratio-decrease
  outcome: blocked
  blocked_by: other
  notes: The g-ratio rests on four hand measurements per axon of axons the raters chose in each image
    (Methods, Electron microscopy analysis of myelin thickness), verified by a second rater. The
    dandiset holds the 181 micrographs (all 180 images the paper's per-axon sheet names are among
    them; TR-1-8r is a copy of TR-1-8), but not the measurements or which axons were measured. The
    measurements are in DANDI:001773, which the claims file allows only for a link, not as the data
    of the test. Repeating them needs a rater; a quick automatic segmentation, tried outside the
    notebook, found few of the paper's axons in two test images and was not pursued. The per-axon sheet
    gives the image name and the four measurements per axon, and no position, so the measured axons
    cannot be found in the images. The reason is other, a repeat needs a rater's choices of axons.
