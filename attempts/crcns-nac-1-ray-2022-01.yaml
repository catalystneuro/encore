- claim: fig2-five-clusters
  outcome: partially_reproduced
  notebook: reproduce_ray_2022.ipynb
  output: claim:fig2-five-clusters
  measured:
  - 6
  - 28
  - 45
  - 89
  - 25
  notes: No reading gives the five counts within tolerance. With N4 and the most frequent of 100 starts
    the centroids show the five patterns (smallest cosine to the templates 0.79) with 6, 28, 45, 89 and
    25 units (Threat Excited, Threat Inhibited, Danger Excited, Bidirectional Valence, Non-Selective);
    N2 gives 7, 27, 44, 91 and 24, and the script normalization 9, 25, 34, 89 and 36. Other normalized
    readings give partitions whose centroids do not show the patterns, and firing in Hz groups units by
    rate. The partitions are unstable (each found in 1 to 3 of 100 starts), and the mean distance falls
    steadily from k = 1 to 7. On the 219 units of screen reading (a) the counts are 47, 36, 80, 45 and
    11.
  deviations:
  - The 193 cue-responsive units are those of the authors' screen in mainAnalysis.m on the floored rates
    of cubeScriptPR25.m (paired ttest, uncertainty rows 5 to 12), the only procedure that gives the paper's
    193 units and 82 sessions; the Methods do not mention flooring.
  - Clusters are named by a one-to-one match of centroids to pattern templates coding the Results' descriptions
    (largest summed cosine); the claims file names the patterns, not a rule.
  - Starts are scikit-learn k-means++ starts with fixed seeds; the script's single MATLAB start after
    rng(1) cannot be repeated.
  assumed: true
