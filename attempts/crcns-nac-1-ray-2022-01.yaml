findings:
- kind: metadata_error
  statement: The data set holds 368 units from 90 sessions (rat and date, one behavior program each),
    where the paper and the data description say 95 sessions.
- kind: data_missing
  statement: The eight pre-surgery fear discrimination sessions of Figure 1C are not deposited; the authors'
    preRecordingBehavior.m reads them from a folder that is not in the data set.
- kind: data_missing
  statement: The paper's population (k-means cluster) labels are not deposited. The authors' mainAnalysis.m
    computes them with one MATLAB k-means start after rng(1), which cannot be repeated outside MATLAB,
    and the reproduced clustering is unstable and does not give the paper's counts, so every population
    finding rests on a reproduced partition.
- kind: metadata_insufficient
  statement: The data description does not say which EVT channel holds which event, nor that the cue channels
    change with the behavior program; only cubeScriptPR25.m gives the map (EVT01 shock, EVT02 pellet,
    EVT13 poke, cue channels per program a to f).
- kind: metadata_insufficient
  statement: The recording is paused between trials, so the files hold spikes, pokes and pellets only
    from 20 s before each cue onset to about 33.5 s after it (inter-spike gaps of about 200 s). The data
    description does not say so, and the paper's inter-trial interval analyses can use only these windows.
- kind: metadata_error
  statement: The data description says NAcccube.poke.base is the nose poke rate 2 s before the cue; in
    cube.mat it is the rate over the 20 s before the cue (pokes per min), in all 368 units.
- kind: code_mismatch
  statement: The authors' scripts differ from the Methods in ways that change results. Firing is normalized
    per trial against a floored 2-s pre-cue rate and z-scored over all trials and bins (the Methods average
    each trial type and subtract its 10-s baseline), the screen and the normalization use rates floored
    to whole Hz, 0/0 suppression ratios are set to 1, the reward and cessation baseline is the 2 to 1
    s before the event (the Methods say the 1 s before), and the waveform measure ('HD') is half the scale
    of Figure 3C.
- kind: paper_inconsistency
  statement: The 95% bootstrap CIs printed for Figure 1G are not studentized intervals of the per-rat
    data (whose means and ANOVA match the paper exactly). They match the bootstrap-t quantiles added to
    the mean without reflection (for uncertainty minus safety [0.36, 1.03] against the paper's [0.35,
    1.03]; the studentized interval is [-0.09, 0.59]). The CIs elsewhere may be formed the same way.
- kind: methods_unavailable
  statement: Question for the authors. Which normalization and which k-means run (starts, replicates,
    seed) produced the published populations, and can the population labels of the 193 units be deposited?
    The Methods' normalization does not give the paper's counts under any of the readings tried, and the
    attempt assumed the partition that best shows the five described patterns.
- kind: methods_unavailable
  statement: Question for the authors. How were the inter-trial interval events for reward and nose poke
    cessation chosen, given that the recording covers only 20 s before to about 33 s after each onset?
    The script's windows (pellets 18 to 2 s before or 14 to 28 s after onset; cessations 18 to 2 s before
    onset) and its baseline (2 to 1 s before the event) differ from the Methods' 1 s before; the attempt
    used events whose windows lie inside the recorded segments, with the Methods' baseline.
- kind: methods_unavailable
  statement: Question for the authors. How are 0/0 suppression ratios handled? The scripts set them to
    1, which reproduces the paper's ANOVA; leaving them out or reading them as 0 changes the Figure 1G
    CIs and the Figure 1H danger correlation.
