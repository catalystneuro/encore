- claim: units-recorded
  outcome: partially_reproduced
  notebook: reproduce_ray_2022.ipynb
  output: claim:units-recorded
  measured:
  - 368
  - 90
  - 7
  notes: The data set holds 368 unit files from 7 rats (ac01, ac03 to ac08), as the paper says, but from
    90 distinct sessions (rat and date; one behavior program per rat and date), not 95. Counting distinct
    rows of 16 suppression ratios, as mainAnalysis.m does, gives 84. No unit is deposited twice (no identical
    spike trains, no session and unit name used twice) and no two sessions share event times.
- claim: cue-responsive-193
  outcome: reproduced
  notebook: reproduce_ray_2022.ipynb
  output: claim:cue-responsive-193
  measured:
  - 211
  - 81
  notes: Reading (b) (shock and omission trials as two cues) finds 211 units from 81 sessions, at least
    7 per rat, all within tolerance. Reading (a) finds 219 units (above 193 +- 19.3) from 82 sessions,
    with 6 in rat ac07. The authors' own procedure (rates floored to integers, as cubeScriptPR25.m stores
    them, pooled uncertainty) finds exactly 193 units from 82 sessions, at least 7 per rat. With onsets
    shifted 60 s into the ITI, none of 92 units passes reading (a).
  deviations:
  - A test whose differences have no variance gives no p-value and does not count, as MATLAB ttest returns
    NaN and mainAnalysis.m sets it to 0.
- claim: fig1c-acquisition
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_ray_2022.ipynb
  output: claim:fig1c-acquisition
  notes: The data set holds one file per recorded unit, from the 18 recording dates only, a precomputed
    cube built from them and the authors' scripts. The authors' preRecordingBehavior.m reads the pre-surgery
    sessions from a folder (AC Group Data) that is not deposited.
- claim: fig1g-discrimination
  outcome: reproduced
  notebook: reproduce_ray_2022.ipynb
  output: claim:fig1g-discrimination
  measured:
  - 0.206
  - 0.466
  - 0.672
  notes: Under every reading the cue effect holds (F(2,12) 52.6 to 57.4, p < 1e-5), the three means are
    within tolerance (danger minus uncertainty 0.20 to 0.22, uncertainty minus safety 0.47 to 0.48, danger
    minus safety 0.67 to 0.70) and the danger minus uncertainty and danger minus safety CIs exclude zero.
    The uncertainty minus safety CI excludes zero only with all 90 sessions and 0/0 ratios read as 0 (median
    bounds over 50 seeds [0.012, 0.599], excluding zero in 68% of seeds); under the other readings its
    lower bound is -0.05 to -0.17, as rat ac01 has a difference of 0.15. With 0/0 set to 1 (the scripts'
    handling) and the 82 sessions, F(2,12) = 57.41 and the means 0.21, 0.47 and 0.69 equal the paper's
    exactly. The paper's printed CIs match the bootstrap-t quantiles added to the mean without reflection
    ([0.36, 1.03] against [0.35, 1.03]).
  deviations:
  - Each rat's value is the mean over its sessions, as mainAnalysis.m averages the session rows of each
    rat (cueR.cerInd).
  - With seven rats the bound near zero moves with the bootstrap seed; the CI is judged on the median
    bounds over 50 seeds, a tie-break the criterion does not give.
  - Bootstrap CIs are studentized with the analytic standard error in each of 1000 resamples; MATLAB bootci
    estimates it by an inner bootstrap. A standard choice.
- claim: fig1h-poke-rate-unrelated
  outcome: reproduced
  notebook: reproduce_ray_2022.ipynb
  output: claim:fig1h-poke-rate-unrelated
  notes: With 0/0 suppression ratios set to 1 (the scripts' handling, which gives the paper's F(2,12)
    = 57.41 exactly) or left out, no correlation of baseline poke rate with danger, uncertainty or safety
    suppression or with danger minus safety has p < 0.05, in the 82 or the 90 sessions (largest |R| 0.49,
    smallest p 0.26). With 0/0 read as 0, baseline poke rate correlates with danger suppression in the
    82 sessions (R = 0.76, p = 0.048) and not in the 90 (R = 0.73, p = 0.063).
  deviations:
  - A 0/0 suppression ratio (no pokes in baseline or cue) is set to 1, as cubeScriptPR25.m and mainAnalysis.m
    do (cer.cue(isnan(cer.cue)) = 1); the claims file names leaving it out or 0, and the Methods are silent.
    Assumed because the scripts' handling reproduces the paper's ANOVA exactly; the outcome is the same
    when 0/0 trials are left out, and differs when they are read as 0.
  assumed: true
