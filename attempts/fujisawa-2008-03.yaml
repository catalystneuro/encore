inputs:
- what: The channel map of the recordings (channels 1 to 64 prefrontal, 65 to 96 CA1, 97 right and 98 left nose-poke
    sensors), from the CRCNS pfc-2 data description, version 0.7 (docs/crcns_pfc-2_data_description.pdf), used by the
    link claim to check the channel labels of DANDI:000067.
  source: doi:10.6080/K01V5BWK, file pfc-2/live/docs/crcns_pfc-2_data_description.pdf
outcomes:
- claim: channel-region-link
  outcome: not_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:channel-region-link
  notes: Check (i) holds in all 12 sessions with a wideband signal in DANDI:000067 (median theta ratio of channels 65 to
    96 between 0.41 and 0.67, of channels 1 to 64 between 0.13 and 0.34). Check (ii) holds in the six EE and three FF
    sessions with a signal (the trial's side sensor is the more active in every trial) and fails in GG.069, GG.097 and
    GG.149 (0.30, 0.42 and 0.42), where channels 97 and 98 are equally active on left and right trials. A search over
    every channel from 97 on finds no sensor in GG (best agreement 0.68 to 0.78), so no per-rat correction exists; the NWB
    files of GG label channels 97 to 101 as neural. EE.088 has no wideband signal in DANDI:000067 and was not checked.
  deviations:
  - Check (i) uses one 52 s chunk of the signal per session (the one holding the most trial time) and trial segments of at
    least 2 s within it; check (ii) uses the mean absolute deviation of the sensor channels from their median, in 1 ms
    blocks, from the first poke start to the last poke end.
- claim: rats-and-units
  outcome: partially_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:rats-and-units
  measured:
  - 146
  - 627
  notes: The lab's cell lists hold 627 units in three rats, EE 446, FF 146 and GG 35, within 633 +/- 63.3. No rat holds
    222 +/- 22.2 under R-a (FF 146) or R-b (EE 446, GG 35). With the EE.188 behavior file's 105 cells in place of the
    example file's 117 the total is 615. The measured layer 5 value is FF under R-a.
  deviations:
  - Units are the lab's per-session cell lists (CellsInfo of the CRCNS behavior files; for EE.188 the 117 cells of
    EE188_example.mat, the paper's Figure 2a session), each session counted apart; the datasets give no rat's layer.
- claim: task-performance
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:task-performance
  notes: SessionNP, the trial numbers of the whl file and the NWB trials tables list the same trials in every session,
    and the CRCNS description says only correct trials are listed. Error trials are in neither dataset, so the criterion
    blocks the claim.
- claim: fig2-population-uniform
  outcome: not_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:fig2-population-uniform
  notes: In EE.188 the peak positions per tenth are 24, 0, 1, 2, 14, 5, 3, 8, 1 and 59 of 117 (11.7 expected; chi-square
    p < 0.001), so the peak criterion fails; it fails in every session, the peaks gathering at the start and the end of
    the maze. The population rate per tenth stays within 50% of its mean in EE.188 (1.84 to 2.85 Hz, mean 2.30) and in
    11 of 13 sessions. The layer 5 session of Figure 2a is not in the datasets; FF.130 is shown as a stand-in and fails
    the peak criterion too.
  deviations:
  - The thresholds (twice or half the share; 50% of the mean) are the claims file's standard choices.
  - The layer 5 Figure 2a session (142 cells) is not in the datasets.
- claim: fig2c-active-fraction
  outcome: partially_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:fig2c-active-fraction
  measured:
  - 12.6
  - 20.3
  notes: Under R-a, reading (b), layer 2/3 sessions have 12.6% of neurons active per 100 ms window (outside 10 +/- 1) and
    layer 5 sessions 20.3% (within 20 +/- 2); both are constant within 50% over the tenths of the maze. Under reading (a)
    EE.188 has 11.8% and the FF.130 stand-in 21.9%. Under R-b neither layer matches (14.9% and 14.0%; 15.9% and 9.3%).
    The criterion defines only the reproduced outcome; one of its two values and the constancy hold, so the outcome is
    partial.
  deviations:
  - The layer 5 Figure 2a session is not in the datasets; FF.130 stands in for reading (a).
- claim: fig2-field-size
  outcome: reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:fig2-field-size
  measured:
  - 0.240
  - 0.177
  notes: Five of 24 combinations put both values within tolerance, P-a (b)(i)(x) 0.241 +/- 0.169, P-a (c)(i)(x) 0.240 +/-
    0.177, P-b (a)(ii)(x) 0.234 +/- 0.154, P-b (a)(ii)(y) 0.286 +/- 0.185 and P-b (b)(ii)(y) 0.267 +/- 0.169. Other
    combinations give means from 0.161 to 0.416. The measured values are P-a (c)(i)(x), the first listed reading
    (occupancy normalised rate, side of higher peak, contiguous run, the Figure 2a session) that matches.
- claim: population-vector-width
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:population-vector-width
  measured:
  - 0.282
  - 0.358
  notes: With raw rates the correlation between positions stays above half its diagonal value over the whole maze
    (width about 1.0 in every reading), as rate differences between neurons dominate it. With each neuron's rate
    normalised to its peak (the assumption, as Figure 2a displays the rates), EE.188 gives 0.268 to 0.314 (outside 0.18
    +/- 0.087) and the FF.130 stand-in 0.358 to 0.398, all FF sessions 0.324 to 0.359 (within 0.27 +/- 0.13). With rates
    z-scored per neuron both layers are within tolerance (EE.188 0.185 to 0.219, all FF 0.208 to 0.238), with s.d.
    0.022 to 0.052, below the paper's 0.087 and 0.13. The measured values are P-b, reading (a), peak normalised, EE.188
    and FF.130. The question is for the paper's authors (findings).
  deviations:
  - The paper does not say how the rates enter the population vectors; with raw rates the measure is degenerate. Each
    neuron's rate is normalised to its peak, the normalisation Figure 2a states; the z-scored reading, which reproduces,
    is shown.
  - The layer 5 session is not identified; FF.130 and all FF sessions stand in.
- claim: fig2d-layer-rates
  outcome: partially_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:fig2d-layer-rates
  notes: Under R-a, rates over trials, layer 5 pyramidal cells fire at 3.02 +/- 3.12 Hz against 1.74 +/- 2.67 Hz (54
    against 211 cells; Student p = 0.0028, Welch p = 0.0077), but all neurons differ at p = 0.045 (Student) and 0.026
    (Welch), not below 0.01 (3.05 against 2.28 Hz). Over the whole session neither reaches 0.01. Interneurons 5.29 against
    5.30 Hz (p = 1.0). Under R-b, EE as layer 5 gives layer 5 lower, GG as layer 5 gives 4 pyramidal cells. Bars read
    from Figure 2d were near 3.6 and 2.0 Hz (all) and 2.9 and 1.6 Hz (pyramidal).
  deviations:
  - Cell types from the jitter test of this attempt (B-a, W-a, C-a), which finds far fewer interneurons than the paper
    (23 against 84).
- claim: fig2e-layer-discrimination
  outcome: not_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:fig2e-layer-discrimination
  notes: Under R-a, reading (a), all neurons 0.263 against 0.222 (Student p = 0.077), pyramidal cells 0.331 against 0.244
    (p = 0.023), interneurons 0.123 against 0.235 (4 against 19 cells, layer 5 lower); reading (b) gives the same pattern
    (pyramidal p = 0.015). Only one group is higher at p < 0.05, and none at the paper's levels. Under R-b no group is
    higher at p < 0.05.
  deviations:
  - Cell types from the jitter test of this attempt (B-a, W-a, C-a).
- claim: traj-diverge
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:traj-diverge
  measured:
  - 0.30
  - 0.02
  notes: In EE.188 the lateral head position first differs globally at 0.30, within 0.30 +/- 0.03; head direction differs
    from 0.02, outside 0.24 +/- 0.024. Over sessions the path's first significant position ranges from 0.02 to 0.43 (0.27
    to 0.30 in six of 13). Head direction exists only in the three sessions with two tracked LEDs (EE.152 0.04, EE.165
    0.26, EE.188 0.02). With 1,000 permutations the global band at level 0.01 cannot be broken in EE.188 (band index 0),
    so 10,000 are used.
  deviations:
  - The lateral axis is the perpendicular to the session's mean central-arm direction (position 0 to 0.3), in camera
    pixels (the image scale is not documented, which does not move where a difference begins).
  - M = 10,000 permutations, a choice; the paper gives no M, and with 1,000 the stepping procedure at level 0.01 settles
    on the outermost band.
- claim: side-arm-selectivity-by-layer
  outcome: partially_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:side-arm-selectivity-by-layer
  measured:
  - 61.0
  - 52.6
  notes: Under R-a, reading (a), layer 5 61.0% (89/146) and layer 2/3 52.6% (253/481), one-sided Fisher p = 0.046;
    reading (b) 60.3% and 49.9%, p = 0.017. Neither value is within tolerance (40 +/- 4, 22 +/- 2.2). Under R-b, EE as layer
    5 gives 53.6% against 56.9% and GG as layer 5 gives 40.0% against 55.4%, with layer 5 not above layer 2/3. One random
    relabelling of each neuron's trials gives 3.3%, so the test holds its level; per session the fraction ranges from 31%
    to 73%.
  deviations:
  - The datasets give the lab's positions (0 at the end of the last poke, 1 at the start of reward consumption) and
    correct trials only, so of readings N, E and T only N-a, E-b and T-a can be run.
