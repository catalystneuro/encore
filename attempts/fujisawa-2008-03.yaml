- claim: speed-not-correlated
  outcome: reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:speed-not-correlated
  notes: Over 627 neurons the median rate-speed correlation is -0.022 (mean -0.029, 44% positive, range -0.51 to 0.64);
    the two-sided Wilcoxon test finds it below 0 (p = 7.5e-05), not above. Pyramidal cells median -0.022 (p = 0.016),
    interneurons -0.046 (p = 0.25). The statement's symmetry around zero holds approximately, with a small negative shift.
  deviations:
  - Speed from the LED midpoint where two LEDs are tracked, from LED 1 elsewhere (ten sessions have one), in pixels per
    second.
