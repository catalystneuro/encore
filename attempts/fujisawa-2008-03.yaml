      outcome when the layer 5 value is above the layer 2/3 value, which holds in fujisawa-2008-03 (0.355% against 0.261%,
      B-a W-a). The connections also come from different global bands, the stepping procedure (G-b) there and 1% on each side
      here.
  - claim: fig4-pair-156-136
    earlier: partially_reproduced
    note: A difference in how nearly the same result was graded, not in the data or the test. Both find a single left-trial
      region (0.325 to 0.645 there, 0.34 to 0.64 here) whose end is within tolerance and start is not, with cell 136 not steady
      (59% and 61% of its maximum); fujisawa-2008-02 counted this as holding in part and fujisawa-2008-03 as not reproduced.
  - claim: thinning-preserves-dependence
    earlier: not_reproduced
    note: Difference in method. fujisawa-2008-02 counted a repetition only when both cells' thinned PSTHs reached the Methods'
      flatness target, which most thinnings did not, and found 0 of 16 pairs under reading a (2 without that condition); fujisawa-2008-03
      does not make that condition and finds 7 of 34 position-dependent connections under reading a.
  - claim: population-vector-width
    earlier: reproduced
    note: Difference in method. Both assume peak-normalised rates and find layer 5 within tolerance; for EE188 fujisawa-2008-02
      gets 0.239 (reading a), within 0.18 +/- 0.087, and fujisawa-2008-03 0.268 to 0.314, just above the limit, from PSTHs
      built differently (200 binned positions there, the Methods' PSTH on 101 grid points here). With z-scored rates both
      attempts find both layers within tolerance.
  protocol: Two versions came between. Under pilot-14 records are filed by paper, with one claims file per paper and one attempt
    on as many of its datasets as load, so fujisawa-2008-03 used DANDI:000067 with CRCNS pfc-2 against the merged claims file
    (33 claims, several renamed or split, some criteria given a partial outcome), where fujisawa-2008-02 used CRCNS pfc-2
    alone with the per-dataset claims file of 30 claims; that is why only 19 claim ids are shared and why three of the seven
    changed outcomes follow from new partial outcomes. docs/pilot-notes.md has no section for pilot-15; tools/entry.py names
    one rule as pilot-15's, that a finding of kind other or selection_undocumented says whether it is about the data or the
    paper and that in an attempt on several datasets a finding about the data names its datasets. fujisawa-2008-03 follows
    it; it changes where findings are shown and no outcome.
