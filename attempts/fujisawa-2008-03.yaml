- claim: traj-diverge
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:traj-diverge
  measured:
  - 0.3
  - 0.02
  notes: 'In EE.188 the lateral head position first differs globally at 0.30, within 0.30 +/- 0.03; head direction differs
    from 0.02, outside 0.24 +/- 0.024. Over sessions the path''s first significant position ranges from 0.02 to 0.43 (0.27
    to 0.30 in six of 13). Head direction exists only in the three sessions with two tracked LEDs (EE.152 0.04, EE.165 0.26,
    EE.188 0.02). With 1,000 permutations the global band at level 0.01 cannot be broken in EE.188 (band index 0), so 10,000
    are used. Checks of the head direction: the LED 1 to LED 2 axis points along the direction of movement in the central
    arm (circular mean -5, -8 and -5 deg, resultant length 0.99, 0.94 and 0.98 in EE.152, EE.165 and EE.188). In EE.188
    the mean head angle relative to the central arm is -95 and -82 deg on left trials and -121 and -121 deg on right trials
    at positions 0 and 0.02 (the turn out of the start box), meets near 0.1 (-10 and -11 deg) and separates again (-3 and
    5 deg at 0.3). Angles taken relative to the circular mean of all trials at each position, which cannot wrap, give the
    first significant position 0.03; under both angle readings a second significant run starts at 0.23, within 0.24 +/-
    0.024, but the criterion takes the first. The early difference is therefore real and not an artefact of wrapping.'
  deviations:
  - The lateral axis is the perpendicular to the session's mean central-arm direction (position 0 to 0.3), in camera pixels
    (the image scale is not documented, which does not move where a difference begins).
  - M = 10,000 permutations, a choice; the paper gives no M, and with 1,000 the stepping procedure at level 0.01 settles
    on the outermost band.
- claim: side-arm-selectivity-by-layer
