inputs:
- what: The channel map of the recordings (channels 1 to 64 prefrontal, 65 to 96 CA1, 97 right and 98 left nose-poke sensors),
    from the CRCNS pfc-2 data description, version 0.7 (docs/crcns_pfc-2_data_description.pdf), used by the link claim to
    check the channel labels of DANDI:000067.
  source: doi:10.6080/K01V5BWK, file pfc-2/live/docs/crcns_pfc-2_data_description.pdf
outcomes:
- claim: channel-region-link
  outcome: not_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:channel-region-link
  notes: Check (i) holds in all 12 sessions with a wideband signal in DANDI:000067 (median theta ratio of channels 65 to
    96 between 0.41 and 0.67, of channels 1 to 64 between 0.13 and 0.34). Check (ii) holds in the six EE and three FF sessions
    with a signal (the trial's side sensor is the more active in every trial) and fails in GG.069, GG.097 and GG.149 (0.30,
    0.42 and 0.42), where channels 97 and 98 are equally active on left and right trials. A search over every channel from
    97 on finds no sensor in GG (best agreement 0.68 to 0.78), so no per-rat correction exists; the NWB files of GG label
    channels 97 to 101 as neural. EE.088 has no wideband signal in DANDI:000067 and was not checked.
  deviations:
  - Check (i) uses one 52 s chunk of the signal per session (the one holding the most trial time) and trial segments of
    at least 2 s within it; check (ii) uses the mean absolute deviation of the sensor channels from their median, in 1 ms
    blocks, from the first poke start to the last poke end.
- claim: rats-and-units
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:rats-and-units
  measured:
  - 146
  - 627
  notes: The lab's cell lists hold 627 units in three rats, EE 446, FF 146 and GG 35, within 633 +/- 63.3. No rat holds
    222 +/- 22.2 under R-a (FF 146) or R-b (EE 446, GG 35). With the EE.188 behavior file's 105 cells in place of the example
    file's 117 the total is 615. The measured layer 5 value is FF under R-a. With every mPFC unit of the NWB files (all
    sorted clusters) the total is 1,373 (EE 1,155, FF 162, GG 56), outside 633 +/- 63.3, and no rat holds 222 +/- 22.2,
    so under that list the outcome would be not reproduced. The partial outcome rests on taking the lab's lists as the paper's
    units, and that check is partly circular, as the lists were adopted in part because their total is near 633. No session
    has 142 units in either list (largest 117 in the lab's lists, 231 among the NWB mPFC units).
  deviations:
  - 'Units are the lab''s per-session lists (CellsInfo; for EE.188 the example file''s 117 cells), an assumption: the CRCNS
    description documents a 1 Hz ''Cells'' list but not CellsInfo, and the lists are consistent with that rule (98.9% of
    listed units reach 1 Hz in the trials, 28.7% of the 746 NWB mPFC units left out); they are used because their total,
    627, is within 1% of the paper''s 633, while every sorted cluster of the NWB files gives 1,373. Every NWB mPFC unit
    is shown as a variant.'
- claim: task-performance
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:task-performance
  notes: SessionNP, the trial numbers of the whl file and the NWB trials tables list the same trials in every session, and
    the CRCNS description says only correct trials are listed. Error trials are in neither dataset, so the criterion blocks
    the claim.
- claim: fig2-population-uniform
  outcome: not_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:fig2-population-uniform
  notes: The peak positions are taken from both rate readings of the claims file (P-a occupancy normalised, P-b the Methods'
    PSTH). In EE.188 the peaks per tenth are 24, 0, 1, 2, 14, 5, 3, 8, 1 and 59 of 117 under P-b and 46, 1, 5, 8, 13, 2,
    9, 18, 12 and 3 under P-a (11.7 expected; chi-square p < 0.001 under both), so the peak criterion fails under both;
    every session fails it under both. The population rate per tenth stays within 50% of its mean in EE.188 (1.84 to 2.85
    Hz, mean 2.30) and in 11 of 13 sessions. The layer 5 session of Figure 2a is not in the datasets; FF.130 is shown as
    a stand-in and fails the peak criterion too.
  deviations:
  - The thresholds (twice or half the share; 50% of the mean) are the claims file's standard choices.
  - The layer 5 Figure 2a session (142 cells) is not in the datasets.
