- claim: odor-unrelated-to-stem
  outcome: not_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:odor-unrelated-to-stem
  notes: In EE.188 with odor selectivity from reading (q), Student, the Fisher tests find no association with stem
    selectivity (odds ratio 1.17, p = 0.705) or side-arm selectivity (1.32, p = 0.576), but the correlation reading finds
    one, between the nose-poke rate difference and the mean left-right difference in the stem (r = -0.38, p = 2.1e-05) and
    in the side arms (r = -0.20, p = 0.032). Welch and reading (p) give the same pattern (stem r = -0.38 and -0.36). Over
    all sessions the Fisher test of the stem is also significant (odds ratio 1.76, p = 0.002).
- claim: retrospective-coding-rare
