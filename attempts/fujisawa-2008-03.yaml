  measured:
  - 30.4
  - 29.5
  notes: Pooled 30.1% (189/627) of neurons have a significant segment in 0 to 0.3, against 1.4% (9/627) after one random
    relabelling (one-sided Fisher p = 6e-52). By layer under R-a 30.4% (layer 2/3) and 29.5% (layer 5), and under all
