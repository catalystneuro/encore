- claim: odor-nosepoke
  outcome: not_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:odor-nosepoke
  measured: 45.3
  notes: Reading (q), EE.188, Student 45.3% (53/117), Welch 42.7%; all neurons 32.4% and 32.9%. Reading (p), the sensor-timed
    pokes (EE and FF sessions), EE.188 about 44% and 40%, all neurons about 32% and 31% (exact values in the output). None
