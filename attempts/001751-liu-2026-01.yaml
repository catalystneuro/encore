- claim: fig4j-eepsp-amplitude
  outcome: reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig4j-eepsp-amplitude
  assumed: true
  notes: From sumData_StimWM.xlsx (block copied data), 23 VEN-PC pairs at three stimulation levels (0.5,
    1 and 2, stated mA). Median VEN amplitude exceeds PC at every level (0.0028 against 0.0010, 0.0086
    against 0.0054, 0.0174 against 0.0068, unit not stated); VEN above PC in 54 of 69 pair-levels and
    20 of 23 pairs. Cell type effect p = 0.0056 in the ordinary two-way ANOVA (F = 7.93) and p = 0.0065
    in the repeated-measures ANOVA with the pair as subject (F = 9.04, df 1 and 22); paper P = 0.0034.
    Stimulation level p = 0.00018 and p < 0.00001.
  deviations:
  - The table holds 23 pairs, the paper states 26.
  - Pairs are read as the blocks of three rows separated by blank rows; the table does not name them.
  - The Methods' selection of monosynaptic eEPSPs cannot be applied to amplitudes alone; the table's values
    are assumed to be the selected ones, as the paper's code tables them for Fig. 4j.
