findings:
- kind: metadata_insufficient
  statement: The files carry no cell type, no connection label and no soma position for any cell, and
    the stimulated cell of a file is not named correctly (below), so none of the Fig. 5 counts can be
    made from the dandiset alone. Types and connections exist only in the paper's code table metadata_multiPatch.xlsx,
    which links to the files by name.
- kind: metadata_error
  statement: Every response series states a rate of 1 Hz; the data are sampled at 25 kHz (the stimulus
    series' rate, the code's 25 kHz, and the 50-sample pulse that is the Methods' 2 ms pulse). The stimulus
    series gives its rate of 25,000 with the unit millisecond.
- kind: metadata_error
  statement: The stimulus amplitude is stored as 2 (2.5 or 3 in 14 files) with the unit amperes; the Methods
    inject 2 nA.
- kind: metadata_error
  statement: The stimulus series of every file names electrode Elec_8 as the stimulated one, while the
    cell that fires on the pulse is on channel 8 in only 35 of 301 files; in 281 of 288 files the firing
    channel is the presynaptic channel of the code's table.
- kind: metadata_error
  statement: All 301 files have the session start time 2018-01-01T01:00+08:00, while the slices are named
    for dates in 2019 and 2024, and every subject has the same age, P4Y/P6Y, and sex M.
- kind: code_mismatch
  statement: The code's table metadata_multiPatch.xlsx disagrees with the paper's counts. It lists 295
    cells, 1,416 ordered pairs (1,410 unique) and 26 connections, where the paper reports 377 neurons,
    1,292 pairs and 31 connections; PC-to-PC 18 of 743 against 24 of 503, one VEN-to-PC connection (190315s2,
    channel 4 to 6, Excellent, with a 1 mV response in the data) where the paper reports none, and pair
    counts per class that differ from the paper's by more than 10% in 6 of 8 classes (all but VEN-to-IN
    and IN-to-VEN).
- kind: code_mismatch
  statement: The code's table is inconsistent with itself and with the files. It lists 6 ordered pairs
    twice (slice 20240911HS4), gives 7 cells two types, labels 2 connections with a projection that disagrees
    with their channels (20240912HS5 4 to 1 labelled 4 to 3, 20241105HS16 6 to 3 labelled 8 to 5), and
    its Nr_Conn disagrees with its annotations in 4 of 52 slices. Six of its pairs name channels that
    read 0 mV in their file (slice 190314s1, channels 6 and 7).
- kind: other
  statement: 13 files of the dandiset are not in the code's table (slices 20240912HS1 and 20240912HS2,
    nine files, and four files of 190315s6 and 190315s7 with 2 to 8 sweeps), so it is not known whether
    the paper counted them.
- kind: other
  statement: The Methods average responses over more than 20 sweeps; 119 of 301 files hold more than 20
    sweeps (median 20, range 1 to 30).
- kind: methods_unavailable
  statement: Question for the paper's authors. The paper and its code give no rule for calling a connection
    (amplitude, latency, noise or test), so the counts rest on the annotations of metadata_multiPatch.xlsx.
    Was the connection call made by eye on averaged traces, and with which criteria for Excellent, Good
    and OK quality? Do the 31 connections of the paper include the table's OK connections, and which of
    the table's pairs and cells make up the 1,292 pairs and 377 neurons?
- kind: code_mismatch
  statement: sumData_StimWM.xlsx holds 23 VEN-PC pairs for Fig. 4j where the paper states 26, and AIScmp_PCvsVEN_Fig5c.xlsx
    holds 120 VENs and 500 PCs for Fig. 3c where the paper states 108 and 430; the AIS table has no slice
    or animal per cell, needed for the two-way ANOVA of the legend.
- kind: methods_unavailable
  statement: Question for the paper's authors. For the somatic Na+ currents of Fig. 4d, in which window
    after the step was the peak taken, and over which steps? Peaks taken up to 3 ms after the step separate
    VENs from PCs (p = 0.0091), peaks up to 5 or 10 ms do not (p = 0.0956), and the code's max_Na_current
    values (p = 0.0010) are smaller in magnitude than the peaks measured here (VEN medians -14.9 and -23.7
    pA). The attempt adopted 0.2 to 3 ms.
- kind: code_mismatch
  statement: The code's processed tables for claims on other data differ in size from the paper. Metabolic_data.xlsx
    holds 558 identified metabolites where the paper quantifies 581, and its AIC-V1 differential count
    (175 to 195 under four readings) is below the paper's 228. The Patch-seq mapping results hold 14 VEN-L
    and 15 VEN-S where the paper reports 10 and 11 mapped to L5 ET and L5/6 CT, and map the 273 excitatory
    neurons to 17 clusters where the paper states 18. The inhibitory Patch-seq mapping is not saved.
