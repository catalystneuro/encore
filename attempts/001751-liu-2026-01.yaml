    IT 0.218 n = 33, IT RORB 0.271 n = 24, L5 IT 0.247 n = 124, L5 ET 0.264 n = 20, L6 PC 0.286 n = 16).
    Kruskal-Wallis H = 41.80, p = 6.5e-08. Dunn's test with Bonferroni over 15 pairs, VEN against each
    PC type, p from 3.2e-08 to 0.001.
  deviations:
  - Tested on the per-cell peak indices the paper's code tabulated, not computed again from the DANDI:001746
    recordings.
  - Bonferroni correction for Dunn's test, from the statistics sheet of the same table (the legend names
    Dunn's test without a correction).
