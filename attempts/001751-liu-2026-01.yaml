- claim: fig4d-sodium-current
  outcome: reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig4d-sodium-current
  assumed: true
  notes: 35 files of DANDI:001750 (0.260825.0222), types from the code's metadata_outSideOutSodiumCurrentRec.csv
    matched by file name (14 VEN, 21 PC). Peak inward current of the step-averaged traces, steps up to
    0 mV, 0.2 to 3 ms after the step, VEN median -23.7 against PC -36.8 pA, rank-sum p = 0.0091. Other
    readings, 0.5 to 3 ms p = 0.0091; 0.3 to 5 ms and 0.3 to 10 ms p = 0.0956; with steps up to +85 mV
    p = 0.0384, 0.0082, 0.0529 and 0.0571. VENs are lower under every reading. The code's max_Na_current
    values give -14.9 against -29.3 pA, p = 0.0010, and correlate with the measured peaks with r = 0.90
    for the adopted reading. Question for the paper's authors in findings.
  deviations:
  - Assumed. The Methods give the steps (-80 to 0 mV, 25 ms, leak subtracted online) but not the window
    in which the peak is taken; the outcome changes between windows ending at 3 ms and at 5 or 10 ms.
    The 0.2 to 3 ms window is adopted because a somatic Na+ current peaks within the first milliseconds
    and because the peaks measured in it agree best with the code's own per-patch values (r = 0.90).
  - Reading (b), current per patch area from capacitance, cannot run; the files hold no capacitance, and
    the Methods take every patch to be about 5 um2.
  - Sweeps with the same step are averaged; baseline 5 to 0.1 ms before the step (a standard choice).
- claim: fig3e-phase-peak-index
  outcome: reproduced
  notebook: reproduce_liu_2026.ipynb
