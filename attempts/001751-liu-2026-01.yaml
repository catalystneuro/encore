outcomes:
- claim: code-table-link
  outcome: reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:code-table-link
  notes: All 288 files the table lists are in the dandiset. The table's presynaptic channel is the channel
    that fires on the first pulse in 281 of 288 files (97.6%); in 2 others it does not overshoot 0 mV
    (median peaks -21.5 and -8.0 mV) and in 5 it fires from a pre-pulse mean of -2.4 to -20.7 mV, above
    the -30 mV rule for a cell. The postsynaptic channel holds a cell in 1,385 of 1,416 pairs (97.8%;
    1,404 at -20 mV, 1,317 at -50 mV); 6 pairs of slice 190314s1 name channels 6 and 7, which read 0 mV.
    The dandiset holds 13 files the table does not list (slices 20240912HS1 and HS2, four files of 190315s6
    and s7). The table lists 6 ordered pairs twice (slice 20240911HS4), gives 7 cells two types, labels
    2 connections with a projection that disagrees with their channels, and its Nr_Conn disagrees with
    its annotations in 4 of 52 slices. Annotated connections have a median peak to baseline s.d. ratio
    of 8.7 in the averaged trace against 2.8 for other pairs, and 11.92 at the pulse against 3.52 in a
    window 35 ms earlier; 331 of 1,390 pairs not annotated exceed a ratio of 5.
  deviations:
  - The criterion was written by the author after the file survey and before any claim's analysis; the
    presynaptic rule (0 mV within 8 ms in half the sweeps) and the -30 mV cell rule are the author's standard
    choices, and the table's channel numbers are taken as the files' channel numbers.
- claim: fig5d-connectivity-totals
  outcome: not_reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig5d-connectivity-totals
  measured:
  - 1416
  - 295
  - 26
  notes: Pairs tested 1,416 table rows (1,410 unique ordered pairs), within 1,292 +/- 129. Neurons 295
    in the table (201 PC, 55 VEN, 39 GABA), outside 377 +/- 38; channels holding a cell in the files are
    410 at -30 mV (411 at -20, 397 at -50), inside. Connections 26 annotated (23 without OK quality),
    outside 31 +/- 3.1. Only reading (b) of the criterion could run, and its connection count is outside
    tolerance with and without OK quality. The table covers 54 slices of 6 subjects.
  deviations:
  - Cell types and connections are the annotations of the paper's code table metadata_multiPatch.xlsx
    (AIC_proj at commit 44cd8a6), as the criterion's reading (b); the dataset carries no labels, so reading
    (a) could not run.
  - Neurons are counted two ways, the table's cells and the channels of the files whose pre-pulse mean
    is below -30 mV (each slice and channel once); the second uses a threshold chosen here and the outcome
    does not depend on it, as the connection count fails under every reading.
  - All sweeps of a file are averaged; the paper averages more than 20 sweeps (Fig. 5f legend), and 119
    of 301 files hold more than 20 (median 20, range 1 to 30).
