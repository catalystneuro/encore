    (the paper''s error grid of the Fig. 4 fit, MD5 a48c2eb26c3a6a095d901938dc63efc1) in fig4-generative-fit,
    and pc_convergence_grid.npz (its err_grid, the flow error by lambda, MD5 60476aacc7f2eb2000a7c718846f46fc)
    in figs8-s9-lambda-and-c.'
  source: doi:10.5281/zenodo.21827768
- what: The paper's code (package ring and its notebooks), read for every method detail and repeated in
    numpy in hdring.py; ring/dmft.py is copied as ring_dmft.py without its torch imports (MIT licence).
    The simulation-only claims (data elsewhere) run this code, in theory.ipynb and model_sims.ipynb.
  source: https://github.com/davidclark1/symmetries-continuous-attractors at commit 245726fa78457e10cdcf17e6be36fba1dec98061
