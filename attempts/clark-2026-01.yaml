    rates partial.'
  deviations:
  - The criterion does not say how positions within 31 neurons are merged; single linkage, greedy and
    bins were all run and give the same outcome.
  - The residual shuffle and initial noise come from the claim's seed (numpy seed 42 in the paper). The
