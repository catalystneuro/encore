- claim: fig4-generative-fit
  outcome: partially_reproduced
  notebook: tuning_curves.ipynb
  output: claim:fig4-generative-fit
  measured:
  - 1.4737
  - 3.1103
  - 1.2145
  notes: The final pass (500,000 samples) puts the minimum at sigma 1.4737, beta 3.1103, b 1.2145 under
    all five seeds (errors 0.0085 to 0.0089). Sigma and beta are within tolerance (beta by 0.34 of 0.345);
    b is 0.52 from 1.73, outside 0.173. The paper's grid point (sigma 1.4211, b 1.7307, beta 2.7659) is
    the minimum of the 25,000-sample shortlist pass (error 0.0061) and second in the final pass under
    every seed (0.00907 to 0.01006). Taking the 90 best shortlist points to 500,000 samples under the
    claim's seed gives the same minimum (the best of points 31 to 90 has error 0.0180). A float32 final
    pass over the 30 points (draws and transform in float32, as the paper's torch run) also ranks the
    chosen point first (0.00889 against 0.00916); evaluated at the two points alone, float32 favours the
    paper's point under the claim's seed (0.00902 against 0.00920) and the chosen one under the other
    four. In the paper's own cached error grid (grid_search_results.npz, same grid) the paper's point
    is the minimum (0.00890) and the chosen point second (0.00900), 1.1% apart. The error surface has
    two near-equal minima along a ridge in b and beta, and which wins depends on the draws and the arithmetic;
    the claims file's tolerance does not cover the second one. The fig5 claims are tested at both parameter
    sets and give the same outcomes.
  deviations:
  - The criterion asks for 500,000 samples at each of the 18,000 grid points, about 3 hours on this runner.
    The whole grid was evaluated with 25,000 samples (the same draws at every point, float32), and the
    30 best points again with 500,000 fresh samples each (float64), which decide the minimum.
  - Draws from the claim's seed, not seed 42 on a CUDA device.
