  measured:
  - 31
  - 2691
  - 1533
  - 315
  - 117
  notes: 31 files, one per subject, 2,691 units, 1,533 with is_head_direction. All 1,533 are also is_excitatory,
    so readings (a) and (b) give the same count; the code's drop of all-zero curves removes none. The
    nine sessions with a wake_opto epoch (A1808, A1813, A1815, A1821, A1824, A6211, A6215, A6216, A9701)
    are the nine +ogen.nwb files and hold 315 head-direction cells. The four largest sessions are A3707
    117, A3716 93, A3711 90 and A3706 86. Every file holds the wake_square epoch, including the +ogen.nwb
    files, which settles the claims file's open question.
- claim: tuning-curves-match-cache
  outcome: reproduced
  notebook: tuning_curves.ipynb
  output: claim:tuning-curves-match-cache
  notes: The cache's session order, unit counts and three label columns equal the files'. All 1,533 recomputed
    partition-averaged curves correlate with the cached ones at r = 1.000000 (largest absolute difference
    1.4e-14 Hz; plain curves identical). The chosen smoothing widths are equal to rounding (np.isclose,
    rtol 1e-9) for both partitions in every unit; an exact comparison (==) gives 78.4% of units only because
    the cache stores values such as 0.09999999999999999 where the grid here has 0.1. The labels in the
    files match the paper's per-unit table, and the dataset's measures match the cached values unit by
    unit.
  deviations:
  - The held-out Poisson log-likelihood is computed from per-angle sums of counts and occupancy, which
    leaves out the sum of log k!, a term that does not depend on the curve (hdring.py, tuning_curves_session);
    the chosen curve is the same.
