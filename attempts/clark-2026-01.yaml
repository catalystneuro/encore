- claim: figs14-data-spectrum-doublets
  outcome: reproduced
  notebook: network.ipynb
  output: claim:figs14-data-spectrum-doublets
  notes: 'The leading 10 eigenvalues have |Im| at most 6.8% of Re. Setting aside the fifth (1.0894, the
    eigenvector closest to uniform), the gaps within the first four pairs (0.027, 0.000, 0.0002, 0.000)
    are each below the gap to the next pair (0.139, 0.183, 0.036, 0.0002); the first pair (1.4384, 1.4113)
    is not exact. The evidence is weaker than the count: pairs 2 and 4 are complex conjugates, equal in
    real part by construction, so only pairs 1 and 3 are doublets of distinct real eigenvalues; eigenvectors
    5 to 7 tie in their overlap with the uniform vector (0.041 each), and setting aside the sixth or the
    seventh also passes 4 of 4 pairs (2 and 1 of them not conjugates). Without setting one aside, two
    of the four pairs pass. The criterion as written is met.'
  deviations:
  - The unpaired eigenvalue is identified as the one whose eigenvector overlaps most with the uniform
    vector (the constant mode, as the criterion says), a standard choice; eigenvectors 5 to 7 tie, and
    each is set aside in turn as a variant, with the same outcome.
- claim: figs11b-data-network-global-stability
  outcome: reproduced
  notebook: network.ipynb
  output: claim:figs11b-data-network-global-stability
  notes: From every initial spread (standard deviation 1 to 1,000, median starting distance 1.6 to 700)
    all 34 final states lie within 0.0016 of the manifold, with none elsewhere, and at standard deviation
    1 all 34 end in one state (1.69 to 1.70 rad), under all five seeds. The threshold the criterion names,
    the distance reached at 20 s in fig2ef, is taken from the fig2ef protocol (its seed and its 100 noisy
    starts) run with the 5-ms step of these runs (largest distance at 20 s 0.00141); against it 97% to
    100% of final states are within at every standard deviation under all five seeds. Against the 1-ms
    fig2ef run (largest 0.00132), the reading of round 1, 91% to 100% are within, below 95% at standard
    deviations 10, 50 and 1,000 under the claim's seed (0.94, 0.91, 0.94); against its median (0.00068)
    29% to 65%. The final distances sit at the network's resolution, about 1e-3, where the step of the
    reference decides the test.
  assumed: true
  deviations:
  - The threshold is the largest distance at 20 s of the fig2ef protocol run with the 5-ms step of spurious_fixed_points.ipynb,
