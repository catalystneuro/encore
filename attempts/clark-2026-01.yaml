- claim: fig2gi-circulant-noise-collapses
  outcome: partially_reproduced
  notebook: network.ipynb
  output: claim:fig2gi-circulant-noise-collapses
  notes: 'The circulant plus scrambled residuals ends in 4 states under all three merging readings (2
    to 7 over five seeds; the symmetric version 2), and the circulant''s 100 final states are exact shifts
    (correlation 1.0000 with the best shift of the first). The sorted optimal matrix keeps 24 (single
