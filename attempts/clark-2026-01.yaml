    threshold open; a reference on the same integrator as the runs it judges is assumed, since the 1-ms
    run sits slightly closer to the targets and the final distances are at the network's resolution. The
    1-ms thresholds (largest and median) are shown as variants and fail the 95% at three standard deviations.
- claim: figs8-s9-lambda-and-c
  outcome: partially_reproduced
  notebook: network_grid.ipynb
  output: claim:figs8-s9-lambda-and-c
  notes: At c 0 some runs diverge at every lambda up to 1e-4 (1 to 4 of 100) and, reading collapse in
    the plane of the top two principal components (ii), 96 to 100 of 100 fall to the homogeneous state
    (radius 0.65 to 0.80 against the manifold's 39.0) at every lambda; read as the firing-rate norm (i)
    none collapses, as the homogeneous state keeps a norm of 17.3 to 17.7 against 72.5. No c above 0 diverges
    up to lambda 1e-4, and c 0.25 leaves the collapse (8 to 20 of 20 across lambda under ii, 12 at 1e-8).
    At lambda 1e-2 all runs with c up to 0.75 collapse (ii), but at c 1 the states keep a radius of 4.6,
    just above the threshold of 3.9, so the criterion's test at c 1 fails under both readings. The flow
    error is 3.6e-9, 1.3e-10, 1.7e-8, 4.6e-6, 4.9e-4 and 2.1e-2 from lambda 1e-12 to 1e-2; it rises at
    both ends with its minimum at 1e-10, just below 1e-8 as the supplement says, but 1e-8 is not below
    1e-12, so that part of the criterion fails. Two of the criterion's four parts hold. Under four more
    seeds (20 initial conditions) the points the criterion reads give the same pattern (lambda 1e-8 and
    c 0, 0 to 3 diverge and 17 to 20 collapse under ii; lambda 1e-2 and c 1, none collapses). The paper's
    cached flow errors (err_grid of pc_convergence_grid.npz) agree to three digits from 1e-10 to 1e-2
    and give 3.8e-9 at 1e-12, so the same part fails on the paper's numbers; the supplement says only
    that 1e-8 sits just above the minimum, which holds, and whether the criterion misreads it is asked
    of a reader (questions/clark-2026.yaml).
  deviations:
  - 20 initial conditions at most grid points (every 500th target angle) and 100 at lambda 1e-12, 1e-8,
    1e-4 and 1e-2 with c 0 and 1; the paper runs 100 everywhere.
  - Divergence is a non-finite state or a firing-rate norm above 10 times the manifold's and still growing
    over the last 5 s, a standard reading of the criterion's "growing states".
  - Collapse was read two ways, the firing-rate norm and the radius in the principal-component plane,
    as the criterion places the test in that plane; the outcome is the same.
