findings:
- kind: other
  about: data
  severity: none
  statement: At version 0.240528.1542, the version the paper cites, the 31 files hold what the paper
    describes, one session per subject, 2,691 units of which 1,533 are labelled head-direction
    (all also labelled excitatory), a wake_square epoch in every file, head direction in radians
    sampled every 10 ms, and nine files with a wake_opto epoch holding 315 head-direction cells.
    Tuning curves rebuilt from them match the paper's cached curves to 1e-14 Hz. Spikes and head
    direction share a clock (in every session the head-direction information peaks within 0.05 s
    of lag 0 and falls 4.5 times by 2 s), no recording appears twice, and no spike train is
    unsorted.
- kind: other
  about: data
  severity: none
  statement: Every file was replaced after the cited version. In the latest published version,
    0.261016.2310, the 31 assets have new names with session ids and sizes of 12.7 to 30.2 GB,
    and none shares a blob with 0.240528.1542. The paper's code reads the cited version's file
    names (sub-<id>_behavior+ecephys[+ogen].nwb); a user of a later version has to map the files.
- kind: other
  about: paper
  statement: The generative fit of Fig. 4 has two near-equal minima on the paper's grid, (sigma, b,
    beta) = (1.4211, 1.7307, 2.7659) and (1.4737, 1.2145, 3.1103), whose errors differ by less than
    the sampling noise of 500,000 samples (0.0089 to 0.0095 depending on the draws and on float32
    or float64 arithmetic). The reported b of 1.73 is one of two choices the fitting procedure
    can return.
- kind: other
  about: paper
  statement: In the mean-field stability grid of Fig. 7d,e (dmft.ipynb, run_analysis), at 293 of
    the 800 grid points, mostly beta below 0.1 or sigma near 100, the bump Jacobian has no zero
    eigenvalue (its leading eigenvalue is below -1e-6), so at those points the analytic bump
    the code linearizes about does not show the symmetry-induced zero mode the Results describe.
