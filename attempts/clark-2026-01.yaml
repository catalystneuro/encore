- claim: tuning-curves-match-cache
  outcome: reproduced
  notebook: tuning_curves.ipynb
  output: claim:tuning-curves-match-cache
  notes: The cache's session order, unit counts and three label columns equal the files'. All
    1,533 recomputed partition-averaged curves correlate with the cached ones at r = 1.000000
    (largest absolute difference 1.4e-14 Hz; plain curves identical). The chosen smoothing widths
    are equal for both partitions in 78.4% of units (88.6% of partition curves); where they differ
    the smoothed curves still agree to 2e-14 Hz, so the widths are ties (scipy's kernel is the
    identity for the smallest widths, and the largest flatten the curve). The labels in the files
    match the paper's per-unit table, and the dataset's measures match the cached values unit by
    unit.
  deviations:
  - The held-out Poisson log-likelihood is computed from per-angle sums of counts and occupancy,
    which leaves out the sum of log k!, a term that does not depend on the curve (hdring.py,
    tuning_curves_session); the chosen curve is the same.
