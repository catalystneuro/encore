- claim: fig2cd-selectivity-emerges-gradually
  outcome: blocked
  blocked_by: methods_underspecified
  notes: On ALM (800 selective neurons, 778 or 798 with enough trials), every reading has the population
    selectivity's interval above zero in 16 to 22 sample-epoch windows and a delay mean above the sample
    mean (0.66 to 1.76 against 0.22 to 0.60 spikes/s). Where the maximum falls depends on the epoch that
    fixes the preferred trial type, which E3 and the paper leave open (Methods, "Selecting preferred trial
    type using either sample, delay, or response epoch data yielded qualitatively similar preparatory
    activity"). With the response epoch the maximum is in the response epoch (0.50 s and 0.25 s after
    the go cue, 2.22 and 2.26 spikes/s); with the sample or delay epoch it is before the go cue (-0.60
    to -0.05 s). Nothing in the paper, its cited method (Li et al. 2016) or the field's practice makes
    one epoch the defensible choice, so the claim is blocked; the question is a methods_unavailable finding.
    The CN half is also not in the dataset (data_missing).
