- claim: fig3d-alm-altered-by-cn-inhibition
  outcome: partially_reproduced
  notebook: reproduce_gao_2018.ipynb
  output: claim:fig3d-alm-altered-by-cn-inhibition
  measured:
  - 676
  - 267
  - 14.66
  notes: 4 L7-cre x Ai32 mice, 20 sessions, 676 putative pyramidal neurons (paper 454 in 19 sessions).
    Modulated in the delay epoch (all trials) 267 (0.395), inside 0.39 to 0.48 (10% of 197/454); correct
    trials 220 (0.325). Per mouse 0.185 to 0.513. Latency (E5), bootstrap mean 14.66, 17.84 and 22.14
    ms by bin start, centre and end (all trials; correct trials 14.68 to 23.00), against 7.1 +/- 3.8 ms;
    observed onsets 24 to 37 ms; 18.12 to 32.91 ms with the pre-onset change subtracted. The population
    change starts 25 to 30 ms after onset. The effect on many neurons is reproduced and its speed is not.
  deviations:
  - The photostimulation codes are not described in the files; codes 1 and 3 are read as early sample
    and 2 and 4 as early delay photo-activation, 5 and 6 as delay photo-inhibition, from the onset of
    the ALM response and the sessions' ogen sites (data check).
  - Putative pyramidal neurons by the width of the files' mean waveforms (E1), which gives more neurons
    than the paper reports, so the fraction is judged where the claim gives a count.
  - Lick early trials are left out of the neural analyses (the Methods say so for performance only); a
    standard choice.
  - The count cannot be matched as the dataset holds more neurons than the paper (676 against 454); the
    criterion's fraction, given for fewer neurons, is judged.
  - The latency's 10 ms bins are labelled by start, centre and end, as the paper does not say which; the
    onset search starts at photostimulus onset. Subtracting the pre-onset change is a variant not in the
    paper.
