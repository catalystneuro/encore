  notes: 4 L7-cre x Ai32 mice, 20 sessions, 676 putative pyramidal neurons (paper 454 in 19 sessions),
    outside 454 +/- 45.4. Modulated in the delay epoch 270 with all trials and 223 with correct trials,
    outside 197 +/- 19.7. The dataset holds more neurons than the paper, so the criterion's fraction,
    given for fewer neurons, does not apply; the fraction, 0.399, is inside 0.39 to 0.48. Per mouse 0.185
    to 0.525. Latency (E5), bootstrap mean 14.37, 17.09 and 21.29 ms by bin start, centre and end (all
    trials; correct trials 14.05 to 22.33), against 7.1 +/- 3.8 ms, with bootstrap s.d. 11.5 to 14.7 ms;
    observed onsets 24 to 37 ms; 14.55 to 32.52 ms with the pre-onset change subtracted. By code, the population
    change is significant from the bins starting 30 ms (code 5) and 32 ms (code 6) after delay onset,
    against 4 ms for fastigial photo-activation. Code 6 also has a small significant change in the bins
    starting -2 to 2 ms, gone by 4 ms. The files hold no laser trace, so a photostimulus that starts after
    pole_out_time cannot be ruled out. Without the five sessions of the clock check, 260 of 579 (0.449)
    are modulated and the bin-start bootstrap mean is 9.89 ms (s.d. 11.4), inside tolerance, while the
    observed onset stays at 25 ms; the bootstrap mean then mixes resamples that find the early bump with
    ones that find the change near 25 ms. Many neurons are altered; neither the count nor the latency
    matches. The latency fails only with those five sessions included, and the count depends on the unit
    selection the files do not explain (selection_undocumented finding).
  deviations:
  - The photostimulation codes are not described in the files; codes 1 and 3 are read as early sample
    and 2 and 4 as early delay photo-activation, 5 and 6 as delay photo-inhibition, from the onset of
    the ALM response and the sessions' ogen sites (data check).
  - Putative pyramidal neurons by the width of the files' mean waveforms (E1), which gives more neurons
