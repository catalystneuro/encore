- claim: fig2-alm-selective-fraction
  outcome: reproduced
  notebook: reproduce_gao_2018.ipynb
  output: claim:fig2-alm-selective-fraction
  measured:
  - 1082
  - 800
  - 0.739
  notes: 34 sessions of the 9 photo-activation mice, 1082 putative pyramidal neurons. Selective (E2, control
    trials) 800 (0.739) with correct trials and a 1.3 s response window, 815 (0.753) with 1.5 s; with
    all trials 794 (0.734) under both windows, just outside 0.738 to 0.902. Counts reported, not judged,
    as the dataset holds 9 of 10 mice. Per mouse 0.286 to 0.838; fastigial sessions 0.659, dentate 0.825.
    With the files' cell_type 0.737 (820 of 1112); with photostimulation trials included 0.766.
  deviations:
  - Putative pyramidal neurons by the width of the files' mean waveforms (E1), which gives more neurons
    than the paper reports, so the fraction is judged where the claim gives a count.
  - Lick early trials are left out of the neural analyses (the Methods say so for performance only); a
    standard choice.
  - The selectivity test uses control trials only; the paper does not say whether photostimulation trials
    enter (a variant with them gives 0.766).
  - '9 of the paper''s 10 mice: the dataset does not hold the mouse whose CN injection missed.'
