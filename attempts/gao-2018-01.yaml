- claim: fig2cd-selectivity-emerges-gradually
  outcome: partially_reproduced
  notebook: reproduce_gao_2018.ipynb
  output: claim:fig2cd-selectivity-emerges-gradually
  notes: On ALM (800 selective neurons, 778 or 798 with enough trials), every reading has the population
    selectivity's interval above zero in 16 to 22 sample-epoch windows and a delay mean above the sample
    mean (0.66 to 1.76 against 0.22 to 0.60 spikes/s). The maximum lies in the response epoch only when
    the response epoch fixes the preferred trial type (0.50 s and 0.25 s after the go cue, 2.22 and 2.26
    spikes/s); with the sample or delay epoch it is before the go cue (-0.60 to -0.05 s). The paper says
    the epoch gave similar preparatory activity (Methods, "Selecting preferred trial type using either
    sample, delay, or response epoch data yielded qualitatively similar preparatory activity"), which
    holds here, as the sample and delay parts are similar under every epoch; that sentence does not cover
    the peak's place, which holds under one of the three epochs only. With the neurons selected on one half of the
    correct control trials and the selectivity measured on the other half (678 selective, 662 with enough
    trials), the pattern is the same (13 to 22 sample windows above zero; maximum in the response epoch
    only with the response epoch). The CN half is not in the dataset.
  deviations:
  - Putative pyramidal neurons by the width of the files' mean waveforms (E1), which gives more neurons
    than the paper reports.
  - Correct control trials (Fig. 2a shows correct trials; Fig. 2c is not a photostimulation analysis);
    selective neurons by E2 with correct trials and a 1.3 s response window. The maximum is searched to
    1.3 s after the go cue.
  - E3 leaves open whether the 10 preference trials are 10 of each type or 10 in all, and which epoch
    fixes the preference; all six combinations are run.
  - Only the ALM half; the CN recordings are not in the dataset.
