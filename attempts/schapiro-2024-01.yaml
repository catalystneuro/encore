- claim: fig1-cs-lower-frequency-11c
  outcome: reproduced
  notebook: reproduce_schapiro_2024.ipynb
  output: claim:fig1-cs-lower-frequency-11c
  measured:
  - 1.17
  - 0.86
  notes: Mean frequency in the first 11 C hold is 1.17 +- 0.15 Hz in saline and 0.86 +- 0.22 Hz in Cs+ over the 20 experiments
    with both values, lower in Cs+ in all 20, paired t = 7.18, p = 8e-07. 969_070 has no Cs+ cycle within 0.3 C of 11 C. The
    deposited code's strict bound for Cs+ (< 0.3 C) and the <= bound give the same values, as do the gap cycles kept.
  deviations:
  - Per-cycle measures are computed with a Python port of the deposited MATLAB code (extractBurstFrequency_Final.m, Phase_Calc.m
    with 0.11 s, CalculateFrequencyPhaseEtc.m), which also fixes details the paper leaves open (the outlier-cycle removal,
    the 1/8 Hz cycle filter, the condition windows from the Timings table and fileTimes). The cycles that the deposited outlier
    removal leaves spanning two or more bursts while keeping their own period (1.6% of cycles) are left out of the hold means
    and phases. This is an assumption, since the deposited code keeps them; without them the phases agree with the deposited
    SummaryStatistics.mat to a median of 0.0004 to 0.0009 (0.0035 to 0.0048 with them, and up to 0.85 in single values) and
    the frequencies to 0.003 to 0.006 either way. Keeping them is shown as a variant.
  - The 11 C value is from the first 11 C hold of each condition (O2). The return to 11 C, the O2 variant, lies outside every
    deposited condition window, during the solution change, and is not used; the deposited code's reading (every 11 C cycle
    of the window) selects the same cycles.
  - 20 of the 21 experiments enter; 969_070 has no 11 C Cs+ value.
  - The Cs+ frequency is the mean over cycles with |T - target| < 0.3 C and the saline frequency over <= 0.3 C, as in the
    deposited CalculateFrequencyPhaseEtc.m; the <= bound for both is shown as a variant.
