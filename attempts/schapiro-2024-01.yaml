  severity: minor
  about: data
  statement: 'Three of the seven raw recordings (Raw_Expt_969_137.mat, Raw_Expt_981_007.mat, Raw_Expt_981_037.mat) have no
    spike file and no Timings table, and the README does not say which condition or protocol each holds. Raw_Expt_981_037.mat
