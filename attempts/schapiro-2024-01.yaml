- claim: fig4c-ptx-restores-frequency-change
  outcome: reproduced
  notebook: reproduce_schapiro_2024.ipynb
  output: claim:fig4c-ptx-restores-frequency-change
  assumed: true
  notes: With the paper's 0.3 C rule 981_035 (both its PD trains) has no 21 C value, its top hold being at 20.7
    C, so only 4 experiments are complete and the condition effect is not significant, F(2,6) = 4.20, p = 0.072.
    Taking its top hold with a 0.5 C margin (assumed, below), the paper's six give F(2,10) = 10.38, p = 0.0036;
    saline 0.92, Cs+ 0.38, Cs+ + PTX 0.73 Hz. Cs+ is below saline under both Tukey readings (multcompare p = 0.026,
    classic p = 0.003); Cs+ below Cs+ + PTX under the classic reading (p = 0.037) but not the multcompare reading
    (p = 0.106), the one the deposited code uses; saline against Cs+ + PTX is not significant (0.115, 0.308). So
    the criterion holds under reading (b) of O5 only. With the five preparations (981_035 once), F(2,8) = 6.80,
    p = 0.019, but Cs+ against Cs+ + PTX is not significant (0.24, 0.15). The deposited SummaryStatisticsPTX values
    give the paper's F(2,10) = 12.27, p = 0.002, and all three criterion pairs as stated under both readings.
  deviations:
  - Per-cycle measures are computed with a Python port of the deposited MATLAB code (extractBurstFrequency_Final.m,
    Phase_Calc.m with 0.11 s, CalculateFrequencyPhaseEtc.m), which also fixes details the paper leaves open (the
    outlier-cycle removal, the 1/8 Hz cycle filter, the condition windows from the Timings table and fileTimes);
    the per-experiment values agree with the deposited SummaryStatistics.mat to a median of 0.003 to 0.006 but not
    exactly.
  - 'The six experiments are the paper''s: 969_147, 969_150, 969_152, 969_154, 981_035 and 981_035 again with its
    PD2 spike train (SummaryStatisticsPTX.mat, BurstAvgs_981_035_2); the five preparations are shown as a variant.'
  - For 969_147 the Cs+ protocol is Cs_1 (it matches the deposited summary); Cs_2 is a second, shorter Cs+ window.
  - Assumption. The 21 C value of an experiment whose top hold did not reach 21 +- 0.3 C (981_035, 20.7 C) is the
    mean over cycles within 0.5 C of 21 C. The paper gives 0.3 C for the holding temperatures (Results, The steady-state
    frequency increase, paragraph 3) and reports N=6 with F(2,10), so it entered 981_035 with some 21 C value; the
    deposited summary has one (measured mean 20.70 C). The paper does not say how; this is a question for the authors.
