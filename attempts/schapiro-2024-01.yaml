findings:
- kind: data_missing
  severity: major
  about: data
  statement: VoltageClampData.mat holds one trial per experiment, the first (saline or TTX+PTX), while its ConditionsKey lists
    3 to 22 trials per experiment, the Cs+ trials among them, and the README describes the array as trials x steps x time.
    No Cs+ voltage-clamp trial is deposited except the four example cells of VoltageClampTraceData.mat, so the Ih values of
    Figure 1-figure supplement 1 (7 cells at 11 C, 8 at 21 C) cannot be measured. The paper's Ih numbers come from per-cell
    values typed into MakePaperFigures_Clean.m from readings the script says were judged by eye. The file was 814 MB in version
    290160 against 98 MB in 310115, so the earlier version may hold every trial; it was not read.
  notebook: reproduce_schapiro_2024.ipynb
  output: finding-voltage-clamp-one-trial
