- claim: figs1-ih-reduced-11c
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_schapiro_2024.ipynb
  output: claim:figs1-ih-reduced-11c
  notes: VoltageClampData.mat holds one trial per experiment (the first, saline or TTX+PTX), so no Cs+ voltage-clamp trial
    of the 7 cells clamped at 11 C is in the dataset. VoltageClampTraceData.mat holds saline and Cs+ traces of the four example
    cells of Figure 1-figure supplement 1, two at 11 C (981_065 PD, 981_064 LP). Their steps last 12.000 s at -110 mV. Readings
    (a) and (b) give negative Ih in Cs+ and in the saline LP cell, because a faster inward current relaxes in the first few
    hundred ms of the step; reading (c), the least inward current in the first second minus the steady state, gives 1.70 and
    0.98 nA in saline and -0.07 and -0.07 nA in Cs+, close to the script's by-eye values for these cells (1.88 and 0.50, -0.17
    and -0.30). Two cells cannot test the claim. The deposited script's per-cell values, typed into MakePaperFigures_Clean.m
    from readings judged by eye (its comment), give 1.55 +- 0.83 nA in saline, 0.25 +- 0.49 nA in Cs+, a 94 +- 32% reduction
    and paired t p = 0.0005, the paper's numbers; they are shown, not tested, since the traces they were read from are not
    deposited.
