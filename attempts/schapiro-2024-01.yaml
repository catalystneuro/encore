  statement: Tempsub holds thermocouple dropouts far outside the protocol's 10 to 26 C, down to -46.7 C, in three files (969_070,
    969_087, 969_089). All fall outside the condition windows, so the analyses here are unaffected; a user taking the whole
    trace would need to remove them.
  notebook: reproduce_schapiro_2024.ipynb
  output: finding-temperature-dropouts
- kind: other
  severity: none
  about: data
  statement: Checks that passed. The 21 saline and Cs+ experiments and the picrotoxin experiments are all deposited as spike
    files, with PD and LP in each and PY in 13; no PD spike train is deposited twice; spike times are in seconds, x_sub in
    minutes and the Timings windows hold the step protocols as the README says. In 969_113 the raw intracellular PD trace
