- claim: fig2c-decrease-by-depolarizing-phase
  outcome: reproduced
  notebook: reproduce_schapiro_2024.ipynb
  output: claim:fig2c-decrease-by-depolarizing-phase
  notes: Under reading (a), on the two Cs+ experiments with an intracellular PD trace and spike times (969_113, the paper's
    Figure 2 example, step onset at 67.9 min as in the deposited plotting call, and 969_115), the depolarizing phase carries
    1.29 and 1.63 of the period increase in the first 30 s of warming from 13 C, the burst 0.05 and 0.02, and the repolarization
    shrinks (-0.34 and -0.66 of it); the period rose by 78 and 26 ms. Under reading (b), from spikes, the depolarizing phase
    carries more than half in 4 of the 5 experiments marked intracellular (0.35 in 969_115, where the repolarization to the
    first LP spike carries 0.76), and in 17 of the 20 Cs+ experiments with a period increase (median 0.87). The statement's
    Cs+ + PTX example, outside the criterion, also holds. It is Raw_Expt_981_037.mat, the trace the deposited script plots
    as the example of jag in PTX (its Figure 5F,G, the paper's Figure 4F,G), with no spike file. On PD spikes detected on
    the trace, in the first 30 s of the warming at 16.10 min (from 11.3 C, not 13 C) the period rises from 1628 to 2146 ms
    and the depolarizing phase carries 0.96 of the increase, the burst -0.01 and the repolarization 0.06. The other raw files
    hold no further Cs+ intracellular PD trace with spike times (969_087 and 969_147 are extracellular only, 969_137 holds
    PY, 981_007 has no spike file).
  deviations:
  - Step onset is the first cycle of the warming from 13 C (traced back from the first cycle above 13.3 C while the smoothed
    temperature rose by more than 0.01 C per cycle), a standard choice built on the paper's increasing-temperature rule; the
    paper marks the onset by eye (Figure 2, maroon line).
  - The voltage minimum is taken on a 5 ms moving average of the PD trace, a standard choice.
  - Reading (a) is run on 2 experiments, the only Cs+ ones with a deposited intracellular PD trace and spike times.
  - The Cs+ + PTX example (981_037) is analysed outside the criterion, on PD spikes detected on its intracellular trace (peaks
    above -40 mV standing 10 mV above their surroundings, a standard choice; spikes peak near -29 mV from a trough near -70
    mV), on its warming from 11 C, the step the deposited script plots; its condition is known only from the script's comment.
- claim: fig3d-freq-decrease-while-warming
  outcome: reproduced
  notebook: reproduce_schapiro_2024.ipynb
  output: claim:fig3d-freq-decrease-while-warming
  measured:
  - 31.0
  - 6.3
  - 20
  notes: Centred smoothing over the Timings window (the deposited ProbabilityUpDown.m), percent of warming cycles with a frequency
    decrease, 31.0 +- 15.7 in Cs+ and 6.3 +- 4.8 in saline, higher in Cs+ in 20 of 21, paired t p = 4e-07. The other six readings
    (centred or trailing; the step protocol, O3 a; the window extended over the cooling to 11 C, O3 b; smoothing within the
    window) give 28.0 to 31.6 against 5.1 to 7.2, 20 of 21 and p < 2e-05 each. Per experiment the values are close to the
    deposited Sawtooth.mat (31.4 and 7.5 on average).
  deviations:
  - Per-cycle measures are computed with a Python port of the deposited MATLAB code (extractBurstFrequency_Final.m, Phase_Calc.m
    with 0.11 s, CalculateFrequencyPhaseEtc.m), which also fixes details the paper leaves open (the outlier-cycle removal,
    the 1/8 Hz cycle filter, the condition windows from the Timings table and fileTimes). The cycles that the deposited outlier
    removal leaves spanning two or more bursts while keeping their own period (1.6% of cycles) are left out of the hold means
    and phases. This is an assumption, since the deposited code keeps them; without them the phases agree with the deposited
    SummaryStatistics.mat to a median of 0.0004 to 0.0009 (0.0035 to 0.0048 with them, and up to 0.85 in single values) and
    the frequencies to 0.003 to 0.006 either way. Keeping them is shown as a variant.
  - Stable cycles are those with a smoothed temperature change within +-0.01 C per cycle in the window reading, as the deposited
    code and the Figure 3A legend ('change less than 0.01 C/pyloric cycle') have it; the step and cooling readings count every
    cycle with a change <= 0.01 C as stable, as the Methods and the claims file header say.
  - The Timings windows end at the 21 C hold, so O3 (b) extends each window to the first cycle back within 0.3 C of 11 C,
    the cooling that precedes the solution change (Methods, Temperature protocol).
  - Smoothing runs over the whole recording, across condition boundaries, as the deposited code does; smoothing within the
    window is shown as a variant.
