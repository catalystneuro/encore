- claim: fig2c-decrease-by-depolarizing-phase
  outcome: reproduced
  notebook: reproduce_schapiro_2024.ipynb
  output: claim:fig2c-decrease-by-depolarizing-phase
  notes: Under reading (a), on the two Cs+ experiments with an intracellular PD trace and spike times (969_113,
    the paper's Figure 2 example, step onset at 67.9 min as in the deposited plotting call, and 969_115), the depolarizing
    phase carries 1.30 and 1.63 of the period increase in the first 30 s of warming from 13 C, the burst 0.05 and
    0.02, and the repolarization shrinks (-0.36 and -0.66 of it); the period rose by 80 and 26 ms. Under reading
    (b), from spikes, the depolarizing phase carries more than half in 4 of the 5 experiments marked intracellular
    (0.35 in 969_115, where the repolarization to the first LP spike carries 0.76), and in 17 of the 20 Cs+ experiments
    with a period increase (median 0.89). The statement's Cs+ + PTX example is not tested, as no Cs+ + PTX intracellular
    trace is deposited and the Cs+ + PTX cycles of 969_152 hold no LP spikes for reading (b).
  deviations:
  - Step onset is the first cycle of the warming from 13 C (traced back from the first cycle above 13.3 C while
    the smoothed temperature rose by more than 0.01 C per cycle), a standard choice built on the paper's increasing-temperature
    rule; the paper marks the onset by eye (Figure 2, maroon line).
  - The voltage minimum is taken on a 5 ms moving average of the PD trace, a standard choice.
  - Reading (a) is run on 2 experiments, the only ones with a deposited intracellular PD trace and spike times;
    the Cs+ + PTX part of the statement is untested.
