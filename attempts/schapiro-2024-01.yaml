- kind: methods_unavailable
  about: paper
  statement: Question for the authors. The deposited extractBurstFrequency_Final.m removes outlier cycles by deleting a burst's
    start with its frequency, which leaves the previous cycle spanning two or more bursts with its own period. Were those
    cycles left out of the phase means of SummaryStatistics.mat, or were the phases computed otherwise? This attempt leaves
