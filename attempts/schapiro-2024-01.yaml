  severity: minor
  about: data
  statement: 981_035_SpikeAndTemp.mat holds two PD spike trains, PD and PD2, which the README does not describe. They do not
    burst together (PD2 burst starts fall within 50 ms of a PD burst start in 14% of cycles, against 13% with PD2 shifted
    by half a period) and run at different frequencies in every condition (saline 1.79 and 1.58 Hz, Cs+ 1.17 and 0.64 Hz),
    so they are two preparations recorded with one thermocouple, not two PD neurons of one preparation. SummaryStatisticsPTX.mat
    and SawtoothPTX.mat enter them as two experiments (BurstAvgs_981_035 and BurstAvgs_981_035_2); nothing in the files says
    that the second train is a second preparation.
  notebook: reproduce_schapiro_2024.ipynb
  output: finding-981-035-two-preparations
- kind: selection_undocumented
  about: paper
  statement: The picrotoxin results of Figure 4C to 4E (N=6 experiments, F(2,10)) include two preparations recorded at the
    same time with one thermocouple (981_035, spike trains PD and PD2). The paper does not say that preparations were recorded
    in pairs, so a reader cannot tell that two of the six share one temperature record.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. The two preparations of 981_035 never came within 0.3 C of 21 C (their top hold is
    at 20.7 C), yet they enter the 11 to 21 C frequency change of Figure 4C. Which cycles formed their 21 C value? This attempt
    used cycles within 0.5 C of 21 C; with the 0.3 C rule of the Results only four experiments are complete and the effect
    is not significant (p = 0.072). Which post hoc test was used, MATLAB multcompare on the fitrm model (as the deposited
    script) or a classic Tukey HSD on the ANOVA error term? Here Cs+ against Cs+ + PTX is significant under the second (p
    = 0.036) and not under the first (p = 0.106).
- kind: code_mismatch
  about: paper
  statement: The deposited code, run on the deposited spike files, gives per-experiment values close to the deposited summary
    files but not equal to them. Its outlier removal (extractBurstFrequency_Final.m) deletes a cycle's start with its frequency,
    so the cycle before keeps its own period while its phases run to a start two or more bursts later (1.6% of cycles; an
    LP ON phase of 32 in 969_128). With those cycles left out, the phases agree with SummaryStatistics.mat to a median of
    0.0004 to 0.0009 (0.0035 to 0.0048 with them, up to 0.85 in single values), so the summaries were most likely made by
    a version of the code that is not deposited; the frequencies differ by a median of 0.003 to 0.006 Hz either way, up to
    0.21 Hz at irregular 21 C holds. 969_068 has an 11 C Cs+ frequency that the summary lacks, and 981_035 none at 21 C where
    the summary has one. LPAdvanceSamePeriod.mat, behind the matched-period numbers, has no code at all and covers a different
    set of 21 experiments, including 969_120, which has no spike file.
- kind: other
  severity: minor
