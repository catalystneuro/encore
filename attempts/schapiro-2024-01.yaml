- claim: fig4c-ptx-restores-frequency-change
  outcome: partially_reproduced
  notebook: reproduce_schapiro_2024.ipynb
  output: claim:fig4c-ptx-restores-frequency-change
  assumed: true
  notes: With the criterion's 0.3 C rule the two preparations of 981_035 (its PD and PD2 trains) have no 21 C value, their
    top hold being at 20.7 C, so only 4 experiments are complete and the condition effect is not significant, F(2,6) = 4.21,
    p = 0.072, with no pair significant (p >= 0.06). Taking their top hold with a 0.5 C margin (assumed, below), the paper's
    six give F(2,10) = 10.43, p = 0.0036; saline 0.92, Cs+ 0.38, Cs+ + PTX 0.73 Hz. Cs+ is below saline under both Tukey readings
    (multcompare p = 0.025, classic p = 0.003) and saline against Cs+ + PTX is not significant (0.114, 0.307), but Cs+ is
    below Cs+ + PTX only under the classic reading (p = 0.036), not under the multcompare reading the deposited code uses
    (p = 0.106). The full pattern thus holds only with a margin wider than the criterion's and under one of the two post hoc
    readings, so the outcome is partial. Keeping the gap cycles gives F(2,10) = 10.38 and the same pattern. The deposited
    SummaryStatisticsPTX values give the paper's F(2,10) = 12.27, p = 0.002, and all three criterion pairs as stated under
    both readings.
  deviations:
  - Per-cycle measures are computed with a Python port of the deposited MATLAB code (extractBurstFrequency_Final.m, Phase_Calc.m
    with 0.11 s, CalculateFrequencyPhaseEtc.m), which also fixes details the paper leaves open (the outlier-cycle removal,
    the 1/8 Hz cycle filter, the condition windows from the Timings table and fileTimes). The cycles that the deposited outlier
    removal leaves spanning two or more bursts while keeping their own period (1.6% of cycles) are left out of the hold means
    and phases. This is an assumption, since the deposited code keeps them; without them the phases agree with the deposited
    SummaryStatistics.mat to a median of 0.0004 to 0.0009 (0.0035 to 0.0048 with them, and up to 0.85 in single values) and
    the frequencies to 0.003 to 0.006 either way. Keeping them is shown as a variant.
  - The six experiments are the paper's, 969_147, 969_150, 969_152, 969_154 and the two preparations of 981_035 (its PD and
    PD2 trains, SummaryStatisticsPTX.mat BurstAvgs_981_035 and BurstAvgs_981_035_2), which do not burst together.
  - For 969_147 the Cs+ protocol is Cs_1 (it matches the deposited summary); Cs_2 is a second, shorter Cs+ window.
  - Assumption. The 21 C value of an experiment whose top hold did not reach 21 +- 0.3 C (981_035, 20.7 C) is the mean over
    cycles within 0.5 C of 21 C. The paper gives 0.3 C for the holding temperatures (Results, The steady-state frequency increase,
    paragraph 3) and reports N=6 with F(2,10), so it entered 981_035 with some 21 C value; the deposited summary has one (measured
    mean 20.70 C). The paper does not say how; this is a question for the authors.
