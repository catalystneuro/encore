outcomes:
- claim: fig1bc-adversity-slows-weight-gain
  outcome: blocked
  blocked_by: data_missing
  notes: The data set holds no body weights. Its data.zip contains the 354 unit files of the
    recording sessions, the authors' cube built from them, the script vlpagAnalysis.m and three cue
    sounds, and the data description lists nothing else. The paper names no other deposit.
- claim: fig1ef-acquisition-equivalent-final
  outcome: blocked
  blocked_by: data_missing
  notes: The eight pre-surgery discrimination sessions are not in the data set, which holds only
    the recording sessions (each unit file is one recording session with spikes), and are not
    deposited elsewhere as far as the paper and the data description say.
- claim: fig2b-baseline-poke-equivalent
  outcome: reproduced
  notebook: reproduce_moaddab_2020.ipynb
  output: claim:fig2b-baseline-poke-equivalent
  notes: Baseline poke rate in the 20 s before cue onset, one value per rat over its recording
    sessions (each session counted once). Control 23.08 and EAA 19.22 pokes per minute, t(18) =
    1.19, p = 0.25 (the paper t = 1.24, p = 0.23). Both readings (mean of session means, trials
    pooled) give the same values, as every session has 32 trials.
- claim: fig2c-recording-discrimination
  outcome: reproduced
  notebook: reproduce_moaddab_2020.ipynb
  output: claim:fig2c-recording-discrimination
  notes: Under all six readings (session means or trials pooled; 0/0 trials set to 0, dropped or
    set to 1) the cue effect is F(2,36) = 179.5 to 194.5, p <= 1.9e-19, the group by cue
    interaction p = 0.84 to 0.90, and all four paired tests have p <= 0.0091 with danger >
    uncertainty > safety. Mean ratios (0/0 as 0, session means) Control 0.919, 0.715, 0.117 and EAA
    0.900, 0.690, 0.049.
  deviations:
  - Sessions are counted once per rat, although several units share each session.
  - A third treatment of trials without pokes (ratio set to 1) is added to the claims file's two,
    because the authors' cube stores 1 for them (cer.cue).
- claim: fig2d-cue-responsive-counts
  outcome: reproduced
  notebook: reproduce_moaddab_2020.ipynb
  output: claim:fig2d-cue-responsive-counts
  measured:
  - 32
  - 49
  - 48
  - 84
  - 151
  - 203
  notes: With the raw rates stored in the authors' cube and reading (b) (excitation over first 1 s
    and last 5 s, inhibition over first 5 s and last 5 s), the counts are the paper's exactly. With
    exact rates from the spike times, reading (c) is within tolerance (30, 48, 51, 89) and reading
