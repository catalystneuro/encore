- claim: fig5abc-excited-reduced-threat-probability
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_moaddab_2020.ipynb
  output: claim:fig5abc-excited-reduced-threat-probability
  notes: Under the adopted reading (the cube's trial-wise Z score, 0/0 trials set to 1, as the
    authors' script regresses them) the whole-cue threat probability beta is higher in Control
    (0.953 against 0.558, t(79) = 2.12, p = 0.037), the fear output betas do not differ (p = 0.87),
    but the group by regressor interaction is F(1,79) = 3.79, p = 0.055. Of the claims file's six
    readings none meets all three parts; (b) with 0/0 trials dropped gives the same partial
    pattern (interaction p = 0.055, threat p = 0.047). The cube's Z score with 0/0 trials set to 0
    meets all three (interaction p = 0.031, threat p = 0.044). Control threat betas are positive
    from the first interval and rise (0.72 to 1.22). With the exact-rate selection no reading
    meets the threat probability part (smallest p = 0.060). The paper's F(1,65) and t(66) imply
    about 67 of the 81 neurons. The question of which trial-wise firing and which 0/0 treatment the
    paper used is for its authors (see findings).
  deviations:
  - Assumption. The trial-wise normalized firing and the treatment of trials without pokes are
    open in the paper (Results, Diminished threat probability signaling, paragraph 1, says only
    "normalized firing rate for each trial ... in 1 s bins"). The authors' script in the data set
    regresses vlPAGcube.fire.z.s1.interval (each trial's own 2 s baseline subtracted, Z scored over
    all trials and bins) on vlPAGcube.cer.cue (which stores 1 for 0/0 trials) (vlpagAnalysis.m,
    lines 2161 to 2170). That combination is adopted; the twelve combinations of the claims file's
    readings and the script's are all shown.
  - The tests use all 81 cue-excited neurons (df 79); the paper's df implies about 67.
