- claim: fig3a-quinpirole-increases-rate
  outcome: not_reproduced
  notebook: reproduce_simmons_2026.ipynb
  output: claim:fig3a-quinpirole-increases-rate
  measured: -18.2
  notes: 'Two sets of cells fit the paper''s description and both were run. (i) 7 cells without an opsin
    recorded with the same protocol: 24.8 to 21.0 Hz, paired t test P = 0.30 (reading b 20.2 Hz, P = 0.20),
    a decrease. (ii) The 8 Chronos cells of Fig. 2, rate over 0 to 2 s before the train: 20.2 to 24.9
    Hz, +31.8% (mean of cells), P = 0.24; reading b +43.2%, P = 0.20. No paired t test gives P < 0.05
    under any reading or threshold; the paper reports P < 0.01 and about 50%. The dataset holds 7 cells
    in set (i) against the paper''s 8. One of them, 5110-2020-10-20-15, is a failed recording (its action
    currents shrink into the noise, falling from 18.5 to 9.8 noise units during the control file); without
    it the 6 cells give 25.1 against 24.5 Hz, P = 0.53 (reading b -8.9%, P = 0.079).'
  deviations:
  - Spike detection is a threshold of 8 robust noise units on the 300 Hz high-passed current with a 4
    ms dead time, a choice made here where the paper gives no settings (claims file, M1); every rate result
    is also shown at 6 and 12.
  - The drug's application time is not in the files; reading (b) of M1 counts the 6 min from the start
    of the file the notes say the drug was applied in.
  - The paper says the rise was seen 'in these experiments' (the Fig. 2 recordings) 'in the absence of
    GPe axon stimulation' (Results, D2R agonists lowered tonic GABA release, paragraph 1); which cells
    form its n = 8 is not stated, so both sets are run.
  - Seven cell-attached recordings lose their action currents during the experiment (the rate falls under
    a quarter of the condition before, a limit chosen here, and the spike amplitude falls to the noise).
    They are kept in the main test, as the claims file asks for every cell, and the test is also run without
    them.
