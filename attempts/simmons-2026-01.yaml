- claim: fig4a-gpe-gi-dreadd-reduces-ipsc
  outcome: not_reproduced
  notebook: reproduce_simmons_2026.ipynb
  output: claim:fig4a-gpe-gi-dreadd-reduces-ipsc
  notes: Four cells, one electrical pulse at 0.40 s per 1-s sweep. Spontaneous action currents fall into
    23 and 18 CNO sweeps of two cells and 89 of the 100 control sweeps of 6921-2022-09-28-60; they are
    found as high-passed deflections over 50 noise units (clean sweeps stay under 50, action currents
    mostly over 100). On the mean of the clean sweeps, the claims file's measure, the amplitude falls
    in 4 of 4 cells, from 73.1 to 37.5 pA, by 48.7% (mean of cells), 48.7% (of means) and 54.5% (median),
    paired t test P = 0.11 (one-sided 0.056); with the limit at 100 noise units P = 0.12 and 46.4 to 49.6%.
    The reductions are 16 points or more from the 30.1% of fig1c, outside the 10-point margin. On the
    mean of all sweeps the amplitude rises in 2 of 4 (P = 0.42); on the median of sweeps it falls by 42.5%
    (P = 0.13). The current of 6921-2022-09-28-60 is outward in its 11 clean control sweeps, where the
    other three cells at -60 mV are inward. Neither part of the criterion is met.
  deviations:
  - The protocol is named 'Five stim 25Hz' but the sweeps hold one pulse at 0.40 s; the IPSC after it
    is measured 3 to 20 ms after the pulse, past the stimulus artifact.
  - The mean is taken over the sweeps without a spontaneous action current (a 300 Hz high-passed deflection
    over 50 noise units outside the stimulus artifact, a limit chosen here where the clean and contaminated
    sweeps separate; 100 is shown as a variant), and the sign of each cell's current is fixed from its
    clean control sweeps. The mean of all sweeps and the median of sweeps are variants.
