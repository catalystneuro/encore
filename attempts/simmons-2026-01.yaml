findings:
- kind: metadata_insufficient
  statement: The condition of each recording (virus, drugs, which file is the control and which the drug,
    when the drug was applied, measurement windows) is given only in free-text NWB `notes`, in many spellings.
    The files have no icephys tables, intervals or other structured condition labels, and the light and
    electrical stimuli are not stored (the stimulus series hold only a -10 mV test pulse), so stimulus
    times must be read from the responses.
- kind: metadata_error
