- claim: fig1c-quinpirole-reduces-gpe-ipsc
  outcome: reproduced
  notebook: reproduce_simmons_2026.ipynb
  output: claim:fig1c-quinpirole-reduces-gpe-ipsc
  measured: 30.1
  notes: In the 5 labelled cells the first evoked IPSC falls from 265.6 to 198.5 pA in quinpirole, paired
    t test P = 0.0087; the reduction is 30.1% as the mean of the cells' changes (reading a of M2), 25.3%
    of the group means and 27.3% as the median. With the sixth cell (second cell of subject 9019, files
    labelled by an assumed layout) P = 0.0070 and 26.7%. Light pulses at 0.55 s + k x 50 ms are read from
    the responses, which start 1.2 to 2.2 ms after 0.55 s in every cell. Each of the nine files of that
    sixth cell, 0015 to 0023, holds an evoked current of 200 to 246 pA, so none was recorded in gabazine;
    files 0015 to 0018 are 5 min apart and 10 min pass before 0019, which fits the assumed layout.
  deviations:
  - The notes of the second IPSC cell of subject 9019 (files 0015 to 0023) are copies of the first cell's
    and do not say which files are in quinpirole; the cell is left out of the main test and shown as a
    variant with files 15 to 18 as control and 19 to 22 as quinpirole, the first cell's layout.
  - The light pulses are not stored in the files; their times are read from the evoked currents.
  - The notes give holding potentials of -70, -50 and -55 mV for these cells (the paper, -60 mV); the
    currents are inward in the cell at -70 mV and outward in the others, so the amplitude is the peak
    deflection with its sign fixed by the cell's control.
  - Peak window 0.5 to 20 ms after the pulse and baseline the 20 ms before it, a standard choice that
    the claims file leaves open.
