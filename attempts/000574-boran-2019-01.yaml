- claim: sfc-maintenance-over-encoding
  outcome: partially_reproduced
  notebook: reproduce_boran_2019_sfc.ipynb
  output: claim:sfc-maintenance-over-encoding
  measured: 73
  assumed: true
  notes: >-
    73 hippocampal maintenance neurons (atlas regions, paired selection) have at least 100 spikes in the
    last 2 s of maintenance and in encoding (paper 94 +/- 9.4), on 47 microwires. With 3-cycle windows
    over 4 to 30 Hz the percentage of neurons with significant PPC to the LFP of their own wire is higher
    in maintenance than in encoding in all 27 bins (means 58.4% against 42.1%), and in 39 of 40 bins over
    1 to 40 Hz; with 5-cycle windows in 26 of 27 and 38 of 40. Coupling to the bundle's bipolar iEEG is
    well above the 5% chance level (maintenance means 29.6% and 21.0% over 4 to 30 Hz), and to scalp EEG
    near chance on average (5.3% and 5.0%) with single bins up to 16.4%, so the statement's 'not to the
    iEEG or the scalp EEG' does not hold.
  deviations:
  - >-
    Tested in the second notebook, which streams the LFP of the selected wires (360 s).
  - >-
    The window around each spike is not given; Hanning-tapered windows of 3 and 5 cycles (the claims file's
    readings) as in FieldTrip's spike-triggered spectrum, on LFP decimated to 1 kHz.
  - >-
    The 100-spike rule is applied to the last 2 s of maintenance and to encoding, the windows the coherence
    uses.
  - >-
    iEEG is the bipolar pair of contacts 1 and 2 of the neuron's own bundle; scalp EEG is Pz, or O1 where
    Pz was not recorded (assumption; the paper does not say which channels).
  - >-
    Regions of units by the Brainnetome label of each bundle's deepest contact (Methods, Depth electrode
    localization, "assigned to a brain region using the Brainnetome Atlas"); the claims file does not
    say for this claim. Taking contact 1 as the site of the microwires is an assumption (they protrude
    from the tip). The bundle-name reading is shown as a variant.
findings:
- kind: data_missing
  statement: >-
    The dataset holds 37 sessions and 1487 units; the paper reports 36 sessions and 1526 units. Eight
    sessions (subject 1 sessions 3 and 4, subject 6 sessions 3 to 7, subject 7 session 1) have no units
    table, and the 29 sessions with units average 51.3 units, matching the paper's 51 per session, so
    about one session of units seems to be missing.
- kind: metadata_insufficient
  statement: >-
    Units point at macroelectrode rows of the electrodes table (microwire k of a bundle at contact k),
    and the microwire LFP channels reuse the same rows. Microwires have no rows, coordinates or atlas
    labels of their own, so the region of a unit has to be inferred from the bundle name or from a macro
    contact.
- kind: metadata_error
  statement: >-
    Electrode names and atlas labels disagree for several bundles: AR of subject 8 (186 units) and ECL
    of subject 6 have their deepest contact labelled hippocampus, AHR of subject 2 fusiform gyrus, and
    ECL of subject 1 amygdala. Counting units by bundle name gives 446, 456 and 585 in hippocampus, entorhinal
    cortex and amygdala; by the deepest contact's label 640, 421 and 398 (paper 676, 449, 401).
- kind: format_error
  statement: >-
    Spike times are stored unsorted in 43 units of five sessions (subject 1 sessions 1 and 2, subject
    7 sessions 2 to 4).
- kind: metadata_insufficient
  statement: >-
    response_type holds 51 and 52 on correct trials and 1 and 2 on incorrect trials, with no description.
    From solution, 51 and 1 are IN, 52 and 2 OUT.
- kind: metadata_error
  statement: >-
    In the ttl_stage table the Probe stage of each trial carries the next trial's number, and seven files
    have no ttl_stage table at all.
- kind: metadata_error
  statement: >-
    The EEG and iEEG series are labelled volts but hold values of about +/- 150 and +/- 240 (1st to 99th
    percentile), consistent with microvolts.
- kind: metadata_error
  statement: >-
    The electrodes table gives the EEG reference as averaged mastoid channels, but A1 + A2 is not zero
    (its SD is 1.8 to 13.7 times that of A1 - A2 across subjects), so the deposited EEG is not re-referenced
    to the mastoids.
- kind: metadata_insufficient
  statement: >-
    Electrode coordinates are in a frame with +x posterior, +y inferior and +z right, not MNI as the paper
    uses, and the scalp electrode positions are template positions on a sphere; converting to MNI y needs
    an assumption.
- kind: metadata_error
  statement: >-
    The subject description of subject 1 lists AHR among the seizure onset zone electrodes, but subject
    1 has no AHR electrode (the data descriptor's Table 1 has the same entry); is_inside_soz marks only
    LR.
- kind: format_error
  statement: >-
    In subject 2 session 5 the microwire LFP holds 11,264,000 samples for the 46 stored trials, where
    32 kHz times 8 s per trial gives 11,776,000 (30,609 samples per stored second); the EEG and iEEG of
    the same file have the expected length.
- kind: data_missing
  statement: >-
    Only 8 s of each trial are stored (fixation onset to 2 s after the probe), so button presses later
    than 2 s after the probe, and the activity after them, are not in the files.
- kind: methods_unavailable
  statement: >-
    For the authors: how were microwire units assigned to hippocampus, entorhinal cortex and amygdala,
    by electrode name or by the atlas label of a contact (which)? The two give very different counts here.
- kind: methods_unavailable
  statement: >-
    For the authors: how were the seven tapers combined in the PLV (cross-spectra averaged over tapers
    per trial, as FieldTrip does, or each taper normalized), what frequency range was searched for the
    maximal pair, and were the EEG analyses run on correct trials only? This attempt assumed FieldTrip's
    taper averaging, correct trials and 4 to 30 Hz; the frequency range changes the outcome of fig6-power-unchanged-individual-band.
- kind: methods_unavailable
  statement: >-
    For the authors: which window defined the probe response of probe neurons (a fixed window after the
    probe, or up to the press), and in which coordinate frame are the electrode positions of Fig. 6I given?
