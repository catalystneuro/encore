findings:
- kind: data_missing
  severity: major
  statement: The dandiset holds one session of monkey T (09/27/2024), the session of Figures 8 and 9. The
    electrode yields, cultures, drainage volumes, bone growth and margin observations, and every recording of
    monkey J are not in it, so 8 of the 13 claims cannot be tested. The version's release
    notes state this gap.
- kind: other
  about: data
  severity: none
  statement: All streams share one clock. The stored bipolar LFP matches the raw c7b minus c5c in 1 to 8 Hz at
    a lag of 0 to 1 ms (r 0.89 to 0.94 in four trials, over a search of 5 s either way); the raw c5d trough
    falls 8 samples after the thresholded spike times, within 2 samples of the stored waveforms' trough (sample 10); the
    spike-free gap sits 46 to 50 ms after each stored FSCV scan time throughout the session, consistent with
    the stated mapping of scans to within one scan; the large minus small dopamine difference appears only
    after V; and the spike rate is modulated at V far beyond random alignments. How the trial-aligned
    oxidation current relates to the raw scans was not established.
- kind: metadata_insufficient
  severity: minor
  statement: The PCA-extracted dopamine, pH and motion components and the oxidation current have no units, and
    their reference window is not given (the file says so). The dopamine values range from -53.6 to 42.4, so
    their size cannot be compared with the paper's concentration changes.
- kind: metadata_insufficient
  severity: minor
  statement: The bipolar LFP's preprocessing is described in the file as not documented, while the Zenodo record
    it comes from calls it downsampled after spectral interpolation. The data show what it does to the signal,
    it equals the raw c7b minus c5c below 8 Hz (SD ratio 0.87 to 1.02) and keeps 0.14 to 0.17 of the raw SD in
    13 to 30 Hz and 0.07 in 60 to 200 Hz, consistent with removal of the FSCV artifact.
- kind: other
  about: data
  severity: minor
  statement: The thresholded spikes have no interspike interval shorter than 1.562 ms, about the length of a
    stored waveform (48 samples, 1.50 ms), so their interval distribution cannot show refractory violations.
    The thresholded unit 1 and the Plexon unit ch75#1 hold the same spikes (99.5% of Plexon spikes within 0.1
    ms of a thresholded one) and were counted once.
- kind: other
  about: data
  severity: minor
  statement: Classing trials from the events gives the paper's Zenodo lists of large (451) and small (499)
    successful trials exactly, plus the last trial (id 1411, large, with no later trial start), which the
    lists leave out. The first trial-start event (4640.33 s) has no row in the trials table, as the table's
    description says.
- kind: metadata_error
  severity: minor
  statement: The version's release notes say the eye tracking was re-timed with the raw ephys, but the file
    holds no eye tracking series.
- kind: methods_unavailable
  statement: The paper describes none of the analyses of Figures 8 and 9 beyond the legends and reports no test
    of the large against small differences. For Figure 9D it gives no beta band, filter, power measure, baseline
    or window for "the brief time window immediately following the cue". Questions for the authors, which band,
    filter and windows were used, and was the difference in Figure 9D tested? Here the claims file's choices
    (13 to 30 Hz, 0 to 0.5 s against the 0.5 s before V) give a smaller suppression for large than small trials
    that is not significant (p = 0.109).
