outcomes:
- claim: fig8a-single-trial-dopamine
  outcome: reproduced
  notebook: reproduce_choi_2025.ipynb
  output: claim:fig8a-single-trial-dopamine
  notes: In trial id 133 (row 132, a large successful trial) the SD of the dopamine trace referenced at V is
    4.414 over 0 to 5 s after V and 2.180 over the 5 s before, ratio 2.025. Under the other reading (row 133,
    a small trial, with 17 and 22 NaN samples in the two windows) the ratio is 2.199. Over the 941 successful trials
    with a ratio (9 of 950 are NaN) the median ratio is 1.259 (IQR 0.804 to 1.885), 62.7% are above 1, and trial 133 lies at the 0.775 quantile.
    The referenced trace of trial 133 is printed from 5 s before to 5 s after V; it dips to -1.84 about 1.1 s
    before V and rises to 13.59 about 1.9 s after. The paper gives no values to compare with. The trial-aligned
    FSCV lags the raw scans (iox best matches the raw current about 1.5 s earlier, and da follows iox by a further
    0.1 to 0.4 s in 13 trials), so part of the rise after V may come from changes in the raw current just before V.
  deviations:
  - The stored PCA estimate (`da`, units not given) is used; the paper's color plot of the voltammograms cannot
    be compared, as the background-subtracted voltammograms of the trial are not in the file.
- claim: fig8b-dopamine-large-vs-small
  outcome: reproduced
  notebook: reproduce_choi_2025.ipynb
  output: claim:fig8b-dopamine-large-vs-small
  notes: From V to RW the referenced dopamine averages 1.853 in 448 large and 1.095 in 498 small successful
    trials, difference of means 0.758, two-sided Mann-Whitney p = 0.0028; 4 trials dropped as their window holds
    only NaN. Variants, RW to RW + 3 s 1.546 (p = 0.00012); 0 to 2 s after V 0.091 (p = 0.57). V to RW in the
    first half of the session 0.778 (p = 0.051) and in the second 0.745 (p = 0.018). By 1 s windows the large
    minus small difference is 0.33 or less until 2 s after V, 1.15 to 1.44 from 2 to 4 s, 1.32 from 4 to 5 s
    and 1.57 to 1.68 from 5 to 8 s (RW is 4.72 to 5.50 s after V). The criterion tests the V to RW window only.
    On the statement's "especially between the value cue display and reward", the difference arises between V
    and RW (from 0.33 at 1 to 2 s after V to 1.44 at 3 to 4 s) and is then held at about 1.6; referenced at RW
    it grows by only 0.19, 0.48 and 0.25 per 1 s window over 0 to 3 s after RW, and the RW to RW + 3 s window
    is referenced at V, so it carries the difference built up before RW. Only the level of the difference is as
    large after RW as before. A question to a reader asks whether the criterion should test this part. The
    trial-aligned FSCV lags the raw scans by about 1.5 s or more (data check), so the null 0 to 2 s variant may
    in part reflect this delay. The paper reports no test.
  deviations:
  - The trace is referenced at V by subtracting the stored estimate's value there, as the criterion says, in
    place of the paper's background subtraction of the voltammograms at V.
  - Trials are classed from the events, leaving out the last row (id 1411), which has no next trial start and
    which the paper's Zenodo lists leave out; this gives the lists exactly (451 large, 499 small).
- claim: fig9a-spikes-task-aligned
  outcome: reproduced
  notebook: reproduce_choi_2025.ipynb
  output: claim:fig9a-spikes-task-aligned
  notes: All 950 successful trials have a spike from 1 s before to 3 s after V. The variance across the 40
    bins of the PSTH is 0.4807 (spikes/s)^2; the 95th percentile over 200 random alignments is 0.0574 under the
    claim's seed and 0.0574 to 0.0607 under the seed plus 1000 to 4000, and no random alignment reached the
    observed value under any of the five seeds. The rate falls to 3.8 spikes/s 0.1 to 0.2 s after V and rises
    to 7.7 to 7.8 spikes/s 0.3 to 0.5 s after V (baseline about 5.5). V falls at every phase of the FSCV scan
    cycle (77 to 108 trials per 10 ms bin) and each 100 ms bin spans one whole cycle, so the spike-free gap of
    each scan cannot make this fall and rise. The stored times (0.4697) and the Plexon unit (0.4829) give the
    same result. The large and small PSTHs differ by at most 2.03 spikes/s in a bin, mean difference -0.050
    spikes/s over -1 to 3 s; the paper states no difference, and none is judged.
  deviations:
  - Spike times are moved by the offset measured in the data check, 0.5 ms (raw ephys clock later than the
    trial clock), not by the 11812.1 s the claims file's opening comment reports for an earlier version of the
    dandiset; in this version every stream is on one clock.
- claim: fig9bc-unit-waveform-isi
  outcome: reproduced
  notebook: reproduce_choi_2025.ipynb
  output: claim:fig9bc-unit-waveform-isi
  notes: None of the 101732 interspike intervals of thresholded unit 1 is shorter than 1 ms (shortest 1.562 ms,
    fraction under 2 ms 0.00008). The mean waveform's largest absolute value is 56.36 uV (negative) at sample 10
    of 48, 4.79 times the SD across spikes at that sample (11.76 uV); 4.78 and 5.05 in the two halves of the
    session. The refractory test cannot fail on these spikes, as the shortest interval is about the waveform
    length (1.50 ms), so the detector may not report a second spike within one waveform. The Plexon unit has 2
    intervals under 1 ms (0.00002). Both tests of the criterion hold, so the outcome is reproduced; that the
    unit is a single neuron is not shown by them, and the paper does not state it (the claim's statement does);
    a question to a reader asks whether the statement and criterion should change.
- claim: fig9d-beta-suppression-large
  outcome: partially_reproduced
  notebook: reproduce_choi_2025.ipynb
  output: claim:fig9d-beta-suppression-large
  notes: Median log10 ratio of 13 to 30 Hz power over 0 to 0.5 s after V to the 0.5 s before is -0.156 in 451
    large and -0.125 in 499 small trials, difference of medians -0.031, two-sided Mann-Whitney p = 0.112; no
    trial dropped. Both medians are below 0 and large is lower, with p >= 0.05, which the criterion calls
    partially reproduced. Variants with the N = 4 filter, 0 to 0.3 s -0.0001 (p = 0.59), 0 to 1 s -0.008 (p =
    0.83), 1 s baseline -0.023 (p = 0.12), 15 to 30 Hz -0.027 (p = 0.066), 12 to 25 Hz -0.021 (p = 0.20). With
    N = 2 the 15 to 30 Hz band gives -0.035 (p = 0.052) and the others p 0.11 to 0.81. First half of the session
    -0.183 against -0.134 (p = 0.116), second half -0.126 against -0.115 (p = 0.545). The trial-averaged power
    ratio dips lower for large trials (to 0.532, against 0.695; mean over 0 to 0.5 s 0.841, against 0.885),
    which resembles the paper's figure; the criterion compares medians of the per-trial log ratios.
  deviations:
  - The 4th order Butterworth band-pass of the criterion is designed with N = 4 (scipy's and MATLAB's
    convention, a standard choice); N = 2 is shown as a variant.
  - The stored LFP is used, as the criterion says. It equals the raw c7b minus c5c except at the FSCV scan rate
    (10 Hz) and its harmonics, which dominate the raw signal and are removed from the stored one (data check,
    spectra); this is why it carries only 0.14 to 0.17 of the raw SD in 13 to 30 Hz. The beta band thus has gaps
    at 20 and 30 Hz. The paper's preprocessing is not described; the Zenodo record calls it spectral
    interpolation.
