- claim: fig1c-object-tuned-fraction
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: 01_single_cells.ipynb
  output: claim:fig1c-object-tuned-fraction
  notes: The rate-map readings give different outcomes. Under rm a with the Methods' variances (w b), 224 of 1189
    CA1 cells (0.188) are object-tuned against 11 of 219 controls (0.0502) under both control readings, binomial
    p = 7.3e-65, so every part of the criterion is met. Under rm b no reading meets it. With w b the CA1 fraction
    is 0.183, but the chance level is 0.0365 (CON2-CON3) or 0.0822 (CON1-CON2). With the code's SDs (w a) 0.266
    to 0.275 of CA1 cells and 0.110 to 0.169 of controls are tuned under either rm. In every reading the CA1 fraction
    exceeds the control level (p at most 6.5e-20).
  deviations:
  - The claims file does not say how unvisited bins enter the smoothing of a rate map; two readings (rm a, spike
    and time maps smoothed separately then divided; rm b, rate per bin then smoothed) are run and asked.
  - The template is an isotropic Gaussian at bin centres correlated with all 2500 bins, the claims file's reading.
- claim: fig1d-field-distances
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: 01_single_cells.ipynb
  output: claim:fig1d-field-distances
  notes: Depends on fig1c-object-tuned-fraction, which is blocked as methods_underspecified, so it is blocked for
    the same reason (protocol, Author 1.5). Under every reading, the fields of tuned cells cover all eight 45 degree
    sectors and the smallest distances are 2.2 to 7.6 cm. The mean is within 37.7 +/- 3.77 cm under several readings
    (for example 34.2 cm, rm a, w b, field a, distance b). The largest distance is 92.8 to 127.0 cm under every
    reading, beyond the widened bound of 88.8 cm, so no reading meets the whole criterion. Under every rate-map
    and field reading the claim would be partially reproduced.
  deviations:
  - The claims file does not say how unvisited bins enter the smoothing of a rate map; two readings (rm a, spike
    and time maps smoothed separately then divided; rm b, rate per bin then smoothed) are run and asked.
  - Whether a field's 1 Hz rule applies to its peak or to every bin is not given; both are run (asked).
