- claim: fig1c-object-tuned-fraction
  outcome: partially_reproduced
  notebook: 01_single_cells.ipynb
  output: claim:fig1c-object-tuned-fraction
  measured:
  - 0.1867
  - 0.0411
  notes: The answer of 2026-10-21 on rate maps (the rate per bin, unvisited bins 0, then smoothed, as calculateRateMap.m
    does) leaves one map reading in place of two. Before, the outcome was blocked because the two map readings disagreed;
    now no reading meets the whole criterion. With the Methods' variances (w b) 222 of 1189 CA1 cells (0.1867) are
    object-tuned, within 0.199 +/- 0.0199, and far above the controls (binomial p = 6.2e-79 for CON2-CON3, 2.0e-37
    for CON1-CON2). The control level is 9 of 219 (0.0411, CON2-CON3) or 16 of 219 (0.0731, CON1-CON2), outside
    0.0503 +/- 0.00503. The 9 of 219 does not differ from the paper's 11 of 219 by a binomial test (p = 0.64), so
    the procedure's chance level agrees with the paper's within sampling error and the outcome is not blocked on
    that ground. With the code's SDs (w a) 331 cells (0.278) and 26 or 37 controls (0.119, 0.169) are tuned, both
    outside. The measured values are those of w b, CON2-CON3.
  deviations:
  - The template is an isotropic Gaussian at bin centres correlated with all 2500 bins, the claims file's reading.
  - The single-cell rate maps use the method of calculateRateMap.m that the claims file now gives; the paper's code
    for those maps is not given.
