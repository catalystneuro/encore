- claim: fig7ab-umap-embedding
  outcome: partially_reproduced
  assumed: true
  notebook: settling.ipynb
  output: claim:fig7ab-umap-embedding
  notes: Under the claim's seed the 2D embedding predicts the linearized position better than the block-shuffled
    position in 7 of 8 novel runs (R^2 0.185 to 0.717 against -0.194 to -0.108 shuffled), and in 7 or 8 of 8 under
    all five seeds; the exception is e16-3m2-211211 as filed, whose spikes are not tuned to the position filed with
    them. Under E1 reading (b), with that session's linear track, position is mapped in 8 of 8 under all five seeds.
    First-minute bins are farther from the embedding's median than later bins in 1 of 8 sessions, 0 or 1 of 8 under
    all five seeds and both E1 readings, and 0 or 1 of 8 when the first minute is counted from the first tracked
    frame, so by this measure moments just after transfer are not at the periphery. The position part holds and
    the periphery part does not.
  deviations:
  - The paper gives no UMAP parameters and no measure; the claims file's measures were used, with umap-learn defaults.
  - UMAP is run on every fifth 100 ms bin of the first 1000 s of each novel run (2000 vectors), to keep the five
    seeds within the time limit.
  - Position is the linearized position in cm; the x, y position is not in cm in five of the novel runs. This is
    an assumption, as the paper shows a 2D location.
  - 'E1 reading (b) is run for e16-3m2-211211, the one session where both of its novel environments can be run:
    its linear-track epoch (15124 to 16771 s) with the tracking moved onto it (5564.5 s later). In e15-13f1-220118,
    e15-13f1-220119 and e16-3m2-211212 the pinned version tracks only one of the two novel environments, so only
    one reading can be run there.'
  - Time 0 is the start of the maze epoch (claims file E2). Tracking starts 14.6 to 63.3 s later; time 0 at the
    first tracked frame is shown as a variant, not judged, and is asked of a reader (questions/mckenzie-2025.yaml).
- claim: fig7e-novel-settling
  outcome: reproduced
  assumed: true
  notebook: settling.ipynb
  output: claim:fig7e-novel-settling
  notes: In the novel run the smoothed nearest-neighbour correlation of minute 1 is lower than that of minute 10
    by 0.104 (t(6) = -4.07, p = 0.0066, over all bins with minute 10 at 600 s). e13-26m1-211119 enters only from
    minute 2, as its tracking starts 63 s after the epoch start. Every combination of the E1, E5 and E6 readings
    gives p of 0.0261 or less (E1 reading (b) 0.101, t(6) = -3.89, p = 0.0080). Variants not judged; with time counted
    from the first tracked frame 0.106 (t(7) = -6.44, p = 0.000355); neighbours from other visits only, t(6) = -6.77,
    p = 0.000508; all units, t(6) = -3.93, p = 0.00771; 1 x 1 cm bins of (x, y), possible in 4 novel runs only,
    0.112 (t(3) = -2.83, p = 0.0663). The "several minutes" part is not judged; the session means rise from 0.393
    in minute 1 to about 0.50 by minute 7.
  deviations:
  - Location bins are 1 cm bins of the linearized position. The Methods bin the location in 1 x 1 cm (Place field
    detection), but the x, y position of five of the nine novel runs is in 0 to 1 units, so the 2D reading can be
    run only on runs whose x, y are in cm; it is shown as a variant. This is an assumption and the outcome rests
    on it.
  - The Gaussian of the 1 s smoothing is taken as a standard deviation of 1 s, a standard choice for a detail averaged
    over 60 s windows.
  - In e16-3m2-211211 the novel-run tracking is filed in the open-field epoch (finding 2). E1 reading (a) keeps
    it as filed; reading (b) runs the linear-track epoch with the tracking moved onto it. The seven other sessions
    are also shown.
  - Time 0 is the start of the maze epoch (claims file E2). Tracking starts 14.6 to 63.3 s later; time 0 at the
    first tracked frame is shown as a variant, not judged, and is asked of a reader (questions/mckenzie-2025.yaml).
