- claim: figs7cd-movement-not-time-locked
  outcome: partially_reproduced
  assumed: true
  notebook: settling.ipynb
  output: claim:figs7cd-movement-not-time-locked
  notes: The claim holds in the familiar run and not in the novel run. In the novel run the movement differences
    of the nearest neighbours fall with time after transfer. Under the judged reading (3 neighbours, Kalman filter,
    all bins, first 600 s) the mean Spearman correlation is -0.110 for |dvel|NN (t(7) = -5.42, p = 0.0010) and -0.103
    for |dacc|NN (t(7) = -5.77, p = 0.0007). In the familiar run there is none (-0.016, p = 0.537; -0.005, p = 0.842).
    Over the 16 novel combinations of readings 14 find a relationship at p < 0.05 (15 of 16 under E1 reading (b));
    none of the 16 familiar ones does. The criterion asks for no relationship in both runs.
  deviations:
  - Speed and acceleration are taken along the linearized path (its length per second); the x, y position is not
    in cm in five novel runs. The Kalman filter's noise settings are standard choices, as the paper gives none for
    the electrophysiology.
  - Judged under the first reading of each open detail (3 neighbours, Kalman, all bins), as a claim of absence is
    judged on one test; this choice is the assumption the outcome rests on, and two of the sixteen novel combinations
    would not find the relationship.
  - 'E1 reading (b) is run for e16-3m2-211211, the one session where both of its novel environments can be run:
    its linear-track epoch (15124 to 16771 s) with the tracking moved onto it (5564.5 s later). In e15-13f1-220118,
    e15-13f1-220119 and e16-3m2-211212 the pinned version tracks only one of the two novel environments, so only
    one reading can be run there.'
  - Time 0 is the start of the maze epoch (claims file E2). Tracking starts 14.6 to 63.3 s later; time 0 at the
    first tracked frame is shown as a variant, not judged, and is asked of a reader (questions/mckenzie-2025.yaml).
- claim: figs7ef-time-explains-similarity
  outcome: not_reproduced
  notebook: settling.ipynb
  output: claim:figs7ef-time-explains-similarity
  notes: Under no reading is time the only variable whose removal significantly worsens the prediction in both environments.
    With the photometry model's form, 3 neighbours and the Kalman filter, dropping |dvel|NN raises the CVMSE by
    7.58% in the novel run (t(7) = 3.35, p = 0.0122) and 6.91% in the familiar run (p = 0.0003); dropping time raises
    it by 7.78% in the novel run (p = 0.0250) and 2.65% in the familiar run (p = 0.1408); dropping |dacc|NN does
    not matter (p = 0.72 and 0.55). Over all 28 combinations of model form (the sign-constrained variant included),
    neighbours, filter and session set, dropping |dvel|NN is significant in both runs (p of 0.042 or less) and dropping
    time is never significant in the familiar run (p of 0.097 or more).
  deviations:
  - The photometry model's complexity penalty (lambda = 0.001, form not given) is left out; bounded least squares
    replaces fmincon. The tau bounds of the photometry Methods (0.1 to 0.001 and 0.001 to 0.0001) are read as decay
    rates per second.
  - Every beta is bounded at +-10, as the photometry Methods bound them ("All beta values were bound at +-10 s.t.d.",
    Statistical modeling of SignalNE), so the fast term can describe a rise as well as a fall. The first run of
    this attempt kept both exponential betas at 0 or above, which cannot follow a rise of the NN correlation over
    minutes (verifier round 1); that form is shown as a variant and gives the same verdict.
  - The model is fit on every tenth 100 ms bin (1 s steps) of the whole run, as the series is smoothed with a 1
    s Gaussian; the paper does not say which bins enter.
  - 'E1 reading (b) is run for e16-3m2-211211, the one session where both of its novel environments can be run:
    its linear-track epoch (15124 to 16771 s) with the tracking moved onto it (5564.5 s later). In e15-13f1-220118,
    e15-13f1-220119 and e16-3m2-211212 the pinned version tracks only one of the two novel environments, so only
    one reading can be run there.'
