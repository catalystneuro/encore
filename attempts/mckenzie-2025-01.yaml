- claim: figs6b-decorrelation-novel
  outcome: not_reproduced
  notebook: settling.ipynb
  output: claim:figs6b-decorrelation-novel
  notes: In the novel run the decay rate (1/tau) of minute 1 is not higher than that of minute 10 under any reading.
    With 60 s windows the mean difference is +0.022 1/s (t(7) = 0.18, p = 0.865; minute 1 faster in 3 of 8 sessions)
