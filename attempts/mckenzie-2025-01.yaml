  outcome: reproduced
  assumed: true
  notebook: settling.ipynb
  output: claim:figs7gh-unconditioned-similarity
  notes: Under reading (a), the 3 most correlated vectors anywhere in the run, minute 1 is lower than minute 10
    in the novel run (-0.0236, t(7) = -3.01, p = 0.0198) and the familiar run (-0.0378, t(7) = -4.66, p = 0.00231),
