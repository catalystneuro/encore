    and finds no difference (p = 0.059 to 0.60); it cannot test the claim, so the outcome rests on reading (a).
  deviations:
  - Reading (b) of the criterion is near zero by construction under E4's z-scoring, so the outcome is judged on
    reading (a) alone.
  - 'E1 reading (b) is run for e16-3m2-211211, the one session where both of its novel environments can be run:
    its linear-track epoch (15124 to 16771 s) with the tracking moved onto it (5564.5 s later). In e15-13f1-220118,
    e15-13f1-220119 and e16-3m2-211212 the pinned version tracks only one of the two novel environments, so only
    one reading can be run there.'
- claim: fig8b-late-moments-reactivated
  outcome: not_reproduced
  assumed: true
  notebook: reactivation.ipynb
  output: claim:fig8b-late-moments-reactivated
  notes: The false positive rate of the procedure is 0.00098 (0.00095 to 0.00101 by session), the paper's 0.001.
    The detected ripples agree with the deposited ones (79 to 97% of detected peaks inside a deposited ripple, 1.7
    to 3.2% when shifted by 1 s). Under the main reading (pre (a), z-scored vectors, pool (a)) post ripples reactivate
    0.233% of first-minute moments and 0.212% of moments at 10 to 11 minutes (late minus early -0.0214 percentage
    points, t(7) = -1.25, p = 0.253). Under the five seeds the difference is -0.0208 to -0.0247 (p 0.177 to 0.275).
    No other reading finds late moments more reactivated at p < 0.05 (raw counts +0.0255, p = 0.223, and +0.0348
    and +0.0299 with pooled shuffles, p = 0.227 and 0.224; z-scored with pooled shuffles p = 0.493 and 0.204; E1
    reading (b) p = 0.166 to 0.279; deposited ripples -0.0199, p = 0.221). Without e16-3m2-211211, -0.0238 (p =
    0.273). With time 0 at the first tracked frame, a variant not judged, late moments are reactivated more, 0.158%
    against 0.209% (+0.0504, t(7) = 2.90, p = 0.0229), the paper's direction.
  deviations:
  - Ripples are detected as the Methods say (Ripple detection, claims file E9) from the 1250 Hz LFP in each session's
    raw file, which can be streamed one channel at a time, on the channel with the largest 130 to 200 Hz power over
    165 s of home cage before the familiar run (the Methods name no channel). The Chebyshev type and the smoothing
    of the squared signal are not given; type II with 20 dB attenuation, zero phase, and an 11-sample moving average
    are standard choices. The first run of this attempt used the deposited ripples of Huszar et al., which the claims
    file names as a variant; they are now the variant, and give the same results. The LFP of e13-26m1-211119 is
    read from version 0.261113.1035 (inputs).
  - The moments are the 100 ms bins of minute 1 and of minutes 10 to 11 (1200 per run), not the whole run.
  - Each unit's values are permuted across the ripples of the pool, independently for each unit and shuffle; a ripple
    reactivates a moment when its R is above all 1000 shuffles, which gives a false positive rate of 0.00098, the
    paper's 0.001.
  - 'The readings of E10 are fully crossed: six for post ripples (under pool (a) the post set does not depend on
    the pre window) and eight for pre ripples. The first run of this attempt ran them one at a time around the main
    reading (verifier round 1).'
  - The novel and familiar runs are tested in two notebooks, reactivation.ipynb and reactivation_familiar.ipynb,
    to keep each under an hour.
  - 'E1 reading (b) is run for e16-3m2-211211, the one session where both of its novel environments can be run:
    its linear-track epoch (15124 to 16771 s) with the tracking moved onto it (5564.5 s later). In e15-13f1-220118,
    e15-13f1-220119 and e16-3m2-211212 the pinned version tracks only one of the two novel environments, so only
    one reading can be run there.'
  - Time 0 is the start of the maze epoch (claims file E2). Tracking starts 14.6 to 63.3 s later; time 0 at the
    first tracked frame is shown as a variant, not judged, and is asked of a reader (questions/mckenzie-2025.yaml).
    Under that variant the claim would be reproduced.
- claim: fig8d-familiar-no-difference
  outcome: not_reproduced
  assumed: true
  notebook: reactivation_familiar.ipynb
  output: claim:fig8d-familiar-no-difference
  notes: The judged test finds a difference in the familiar run, with early moments reactivated more than late ones
    (0.251% against 0.224%, -0.0274 percentage points, t(7) = -3.29, p = 0.0134), under all five seeds (p 0.0099
    to 0.0338), and with the deposited ripples (-0.0251, p = 0.0065). The other readings find no difference (raw
    counts p = 0.719, and 0.981 and 0.856 with pooled shuffles; z-scored with pooled shuffles p = 0.562 and 0.461).
    With time 0 at the first tracked frame, a variant not judged, there is no difference (+0.0223, t(7) = 1.15,
    p = 0.286). The difference is about a tenth of the reactivation rate, and opposite in sign to the novel effect
    the paper reports.
