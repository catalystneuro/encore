    the onset age of no region can be read. The README's rule that a region without images had no label judged
    present cannot be applied when the region of most images is unknown. No 200X Abeta42 image is labelled
    A1 (its 9 labelled images are DAPI), so no age of A1 label can be read even in the labelled rounds. Fields
    can be placed in their 12.5X overviews for 26 of 66 sampled fields, but no overview is aligned to the atlas
