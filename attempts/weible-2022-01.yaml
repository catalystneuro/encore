- claim: a1-first-in-pathway
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_weible_2022.ipynb
  output: coverage
  notes: Needs the first age with Abeta42 label in each of A1, MGB, IC, SOC, nLL and CN. Only 864 of 12394
    images (7.0%) have a recorded region, all from named follow-up subfolders in 24 of the 62 mice, and none
    of 20 sampled image headers and sidecars holds a stage position, section number or atlas coordinate (notebook,
