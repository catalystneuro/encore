- claim: fig2b-phc-camera-cuts
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_gerken_2025.ipynb
  output: claim:fig2b-phc-camera-cuts
  notes: The Methods' test counts 222 of 293 PHC units (75.77%) responsive at alpha 0.001 and 228 (77.82%)
    at 0.01 (paper 193 of 373, 51.74%). The same test counts 72.35% of PHC units and 68.3% of all units
    responsive at random event times, and all synthetic Poisson units (2 Hz) with 883 random events, so
    its false-positive rate is far from its alpha and the procedure differs from the paper's. The test
    compares integer counts in 100 ms bins with the baseline mean per 100 ms across hundreds of trials,
    which a signed-rank test finds different even without a response. The dataset code's ZETA test (100
    resamplings) is calibrated here (0 and 4 of 293 PHC units at random times at alpha 0.001 and 0.01)
    and finds 37 (12.63%) and 65 (22.18%), below the paper's fraction.
  deviations:
  - The responsive-unit test follows the Methods as fixed in the claims file (baseline count over -1000
    to 0 ms divided by 10, 19 overlapping 100 ms bins, two-sided Wilcoxon signed-rank, Simes); the Methods
    do not say more.
  - The ZETA variant uses 100 resamplings in place of the code's 1000, for time.
  - The fraction is compared, as the dandiset's PHC holds 293 units against the paper's 373.
