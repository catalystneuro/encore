  - 0.359
  notes: Pooled logistic regression, mean over 5 folds, Summer 0.301 (SEM 0.056), Indoor/Outdoor 0.359
    (SEM 0.049), both within tolerance of 0.28 and 0.31; Tom 0.218, McKenzie 0.324 and Persons 0.410 reach
