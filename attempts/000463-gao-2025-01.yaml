- claim: fig11b-ac-prf-responses
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_gao_2025.ipynb
  output: claim:fig11b-ac-prf-responses
  notes: '633 AC units of the constant-PD series, none dropped. Under O2a, Kruskal-Wallis across PRFs
    p = 7.8e-6 during sonication and 5.2e-49 after it; mean normalized rates during 105.9, 99.7, 140.3,
    107.1 and 108.0% at 30, 300, 1500, 3000 and 4500 Hz, after 176.4, 94.3, 147.9, 310.5 and 210.8%, so
    300 Hz is lowest in both windows. 1500 and 3000 Hz are significant during sonication and 30, 1500,
    3000 and 4500 Hz after it under every O3 and O4 reading (6 of 6 named results), and 300 Hz is not
    significant after it. But 4500 Hz is also significant during sonication under all six O3 and O4 readings
    (corrected p 2.4e-6 to 0.009), 30 Hz under three and 300 Hz under the two O3b readings, where the claim
    has only 1500 and 3000 Hz responding. Under O2b every mean, the -134 to -67 ms baseline included,
    is 54 to 74%, the during-sonication Kruskal-Wallis test gives p = 0.021, and at most 2 of the 6 named
    results hold (not reproduced). Session means vary widely (1500 Hz 99 to 302% during sonication; 3000
    Hz 112 to 654% after it). With every AC session at these PRFs (all PDs) the outcome under O2a is also
    partial and 300 Hz is not the lowest. Leaving out any one of the six subjects gives partially reproduced
    or reproduced under every O2a reading, never not reproduced. Under the claims file''s header a claim
    whose method readings disagree is blocked; O2a is adopted as an assumption because O2b does not
    put no change at 100%: on synthetic Poisson units without a stimulus effect O2a gives 99.9 to 101.6%
    at 2 to 40 Hz and O2b 13, 31, 77 and 127% at 2, 5, 15 and 40 Hz. Whether O2b should stay a reading
    is asked of a reader (questions/000463.yaml). Question for the paper''s authors (finding): how was the normalized
    rate formed, the ratio of mean counts or the mean of per-trial ratios.'
  deviations:
  - 'Tested on the paper''s deposit DANDI:000946 (`data: elsewhere`), constant-PD series of the AC group,
    6 subjects (the paper reports 12 rats in the AC group) and 633 units where the paper has 453.'
  - Assumed the normalized rate is the mean count in the window over the mean count in the 67 ms before
