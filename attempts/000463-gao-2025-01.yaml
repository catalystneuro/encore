findings:
- kind: other
  statement: Dandiset 000463 cites this paper as its detailed description, but holds none of the recordings
    the paper analyses. Its 29 files are 32-channel broadband and LFP recordings of one S1 probe from
    rats BH395, BH396, BH401 and BH444 (November 2022 to February 2023), with intensities given in volts
    in the identifiers; the paper's deposit, dandiset 000946, has 19 other subjects recorded from August
    2023, two areas per recording and mostly 500 trials per recording (691 of 814; the others 400 to 499). None of the paper's claims can be tested
    on 000463.
- kind: data_missing
  statement: The files of 000463 have no units, no trials or epochs table and no stimulus series, so the
    sonication onsets and the conditions' trials cannot be read; the conditions appear only in the identifiers
    (for example BH401_3000_200_67_5V, BH396_test5_24V). The description says 200 or 500 trials per recording;
    the recording lengths give 121 to 515 intervals of 2.5 s.
- kind: metadata_insufficient
  statement: In 000463 every electrode's location is 'unknown' and the electrode group's location is the
    placeholder 'brain area', so the recorded area is not stated.
- kind: metadata_error
  statement: In 000946 the units table's celltype_label column is described as 'label 1 = RSU, label 2
    = FSU', but all 22599 values in it are 0 (each recording counted once), and 33 recordings have no such column. No waveforms or waveform
    measures are deposited, so the RSU and FSU types, on which 31 of the 37 claims rest directly, cannot
    be recovered.
- kind: other
  statement: 'Most recordings of 000946 are deposited more than once under different file names: of 1550
    spike files, 728 recordings have two copies, 2 have three and 1 has four (same trial table, spike
    counts and first and last spike times); 84 have one.'
- kind: metadata_error
  statement: In 000946 one recording, BH499_300_200_67_5_POM_S1, has identical spikes in two files noted
    'Recording:S1' and two noted 'Recording:POM', so at least one area label is wrong and that session's
    other area may be missing; the attempt leaves it out of all counts.
- kind: data_missing
  statement: 000946 holds no sham sessions and no sessions targeted at CG1, the paper's control (Figure
    5), and not the hydrophone scans of Figure 1C. It holds M1- and POm-targeted sessions and PRF series
    at 300, 1500 and 4500 Hz that the paper does not describe.
- kind: selection_undocumented
  statement: The AC group of 000946 has 7 subjects and the subjects with POm recordings number 10, where
    the paper reports 12 and 16 rats. The constant-PD AC sessions hold 633 units with more than 2000 spikes
    where the paper reports 453, and each PRF count is higher; which sessions and units the paper used
    is not documented.
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: is the normalized spiking rate the mean count in the
    window divided by the mean count in the 67 ms before onset, or the mean over trials of per-trial ratios?
    fig11b-ac-prf-responses is partially reproduced under the first and not reproduced under the second;
    the attempt assumed the first. Also, is ''against baseline'' a rank-sum test against the prestimulation
    window (all 100%), against another window, or a signed-rank test against 100%, and is the Bonferroni
    factor the number of windows or of parameter levels? These did not change the outcome here.'
