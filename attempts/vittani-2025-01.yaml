- claim: fig1b-camp-dose-dependent
  outcome: reproduced
  notebook: reproduce_vittani_2025.ipynb
  output: claim:fig1b-camp-dose-dependent
  notes: Under all four baseline and peak readings the bPAC mean peak is above zero at every length
    and rises from 0.2 s to 1 s to 3 s (79.6, 104.7 and 113.1% with baseline (a) and filtered peaks;
    4 mice, 1 s the mean of recordings 1 and 4 per mouse). At 1 s the bPAC mice (104.7%) are far
    above the 5 controls (2.5%, t = 11.44). One mouse (PF1) has a lower 3 s than 1 s peak (87.9
    against 93.8%).
  deviations:
  - The thinned-skull ROI and the dark-vessel ROI are not in the files. ASSUMPTION, a central disc of
    radius 160 pixels for the signal and the darkest 0.5% of its pixels in the first frame for the
    Blood Offset (SI Image Data Analysis describes both ROIs as drawn by hand).
  - No motion correction (SI Image Data Analysis applies TurboReg "when needed").
  - The across-recording "Corrected dF/F0" (an exponential fitted to recordings 1 and 4) is not
    applied; the passage does not say what is fitted against what.
  - LED frames are found from the step the light leaves in the red channel (frames 325 or 326,
    lengths matching 0.2, 1 and 3 s), and removed, as SI Image Data Analysis says.
- claim: fig1g-j-camp-kinetics-anesthetized
  outcome: reproduced
  notebook: reproduce_vittani_2025.ipynb
  output: claim:fig1g-j-camp-kinetics-anesthetized
  measured: [79.59, 104.71, 113.11, 6.35, 4.35, 0.25, 29.25, 62.13, 91.65, 35.6, 66.47, 91.9]
  notes: Under F0a-peakf-decayb-t0a (baseline the whole 65 s, peak on the median-filtered trace, decay
    to 20% of the peak, time from the first frame after the LED) the ordering holds for all four
    parameters and 9 of 12 values are within tolerance; the 1 s peak (104.7 against 94.4%) and the
    0.2 s and 1 s rise times (6.35 and 4.35 s against 7.9 and 6.3) are outside. Baseline (b) gives 9
    of 12 too; with decay read as the fall to 80% of the peak, at most 3 match, so Table S1's decay
    values fit reading (b) of "80% decay time". Paired t tests with Benjamini-Hochberg correction find
    every pair of different lengths to differ in decay and duration (q at most 0.0067) and 0.2 s to
    differ from 1 s and 3 s in peak (q 0.0052). The values measured are those of
    F0a-peakf-decayb-t0a.
  deviations:
  - ROI, Blood Offset, motion correction, Corrected dF/F0 and LED frames as in fig1b-camp-dose-dependent.
- claim: fig1f-camp-reproducible
  outcome: reproduced
  assumed: true
  notebook: reproduce_vittani_2025.ipynb
  output: claim:fig1f-camp-reproducible
  notes: Under the adopted reading F0a-peakf-decayb-t0a no parameter differs between recording 1 and
    recording 4 in the 3 mice with both (smallest q 0.20 for family (a), 0.21 for family (b)); the peak
    is 13.4% lower in recording 4, decay and duration 1.9 and 1.5 s shorter. Under 4 of the 16
    readings (decay to 80% of the peak, filtered peak) decay and duration differ at q 0.03 to 0.05 in
    family (a), so the outcome depends on the reading of "80% decay time". Question for the paper's
    authors, does "80% decay time" mean the time for the signal to fall by 80% (to 20% of the peak)?
  deviations:
  - ASSUMPTION, the open details of the claims header (baseline, filtered or unfiltered peak, meaning of
    80% decay, time origin) are taken as F0a-peakf-decayb-t0a, the reading under which the
    anesthetized cAMP values best match Table S1 (9 of 12, fig1g-j-camp-kinetics-anesthetized). Every
    reading is shown.
