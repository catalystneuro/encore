findings:
- kind: format_error
  statement: The "rotated" arteriole movies, the copies on which the kymograph rectangles (image_mask)
    were drawn, hold only the values 0 and 1 (0 to 2 in some files), in each of the four arteriole
    files the notebook checks (one per experiment) and in those surveyed while preparing; the
    background-corrected ratio images appear to have been cast to integers. No rotation angle is stored, so the rectangles cannot be placed on
    the raw movies without recovering each rotation.
- kind: other
  statement: Eight pairs of files hold identical movies. In the awake cAMP data (Figure 3), PF2 recording
    4 equals PF3 recording 1, PF4 recordings 1, 2 and 3 are one movie, PF5 recordings 3 and 4 equal PF6
    recording 1 (a control and a bPAC mouse), and PF10 recording 1 equals PF9 recording 4; in Figure 4,
    PF507 (IP3R2-/-) recording 4 equals PF594 (IP3R2+/+) recording 1; in Figure 1, the control PF5's 1 s
    and 0.2 s files are one movie. The files the movies truly belong to cannot be told.
- kind: data_missing
  statement: The movie of recording 6 of mouse 25ms-PF5 (Figure 6) is stored inside its recording 1 file
    with only 2 frames, and its own file holds no movie.
- kind: format_error
  statement: The movie of PF584-IP3R2-WT recording 2 is stored as 512 x 512 x 1600 (time last), in a
    series named only "OnePhotonSeries", unlike every other movie (frames first).
- kind: metadata_insufficient
  statement: The files hold raw movies only. There are no stimulus times (LED onsets, whisker puffs, tail
    shocks), no ROIs for the astrocyte signals or the Blood Offset, and no traces or results. The LED
    onsets can be recovered from the light's step in most recordings, but not for the 25 ms pulses, the
    startle shocks or the whisker puffs.
- kind: metadata_insufficient
  statement: The two-photon stacks (Figure S5) have channels ChanA and ChanB without saying which holds
    GCaMP6f and which Pink Flamindo, and the slice and two-photon images (Figures 1K and S1J) store two
    frames without saying what each is; in the Figure S1J images the second frame is blank.
- kind: metadata_error
  statement: In a survey of the files' metadata made while preparing, the subject age of
    sub-Ca581-IP3R2-WT recording 4 is P14.3W, where its other recordings give P20.3W.
- kind: methods_unavailable
  statement: Question for the paper's authors. Does "80% decay time" (SI Image Data Analysis) mean the
    time from the peak until the signal has fallen by 80%, to 20% of the peak? Under that reading the
    anesthetized cAMP values match Table S1 (9 of 12); read as the fall to 80% of the peak, 3 of 12
    match. The outcomes of fig1f-camp-reproducible and fig4a-e-camp-ip3r2-no-difference depend on it.
- kind: methods_unavailable
  statement: Question for the paper's authors. Are peaks and rise times read on the median-filtered trace
    (20 frames anesthetized, 50 awake) or on the unfiltered one? With the 50-frame filter of the awake
    data the peaks are lower; the comparison of awake and anesthetized kinetics holds only with
    unfiltered peaks.
- kind: methods_unavailable
  statement: Question for the paper's authors. Where were the signal ROI and the dark-vessel ROI drawn,
    and how was the across-recording "Corrected dF/F0" fitted? The dandiset holds neither ROI, and the
    Ca2+ values of Table S4 (decay and duration) are not reached with the central-disc ROI used here.
