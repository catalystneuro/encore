- claim: fig3cd-camp-awake-stable
  outcome: not_reproduced
  notebook: reproduce_vittani_2025.ipynb
  output: claim:fig3cd-camp-awake-stable
  notes: The paper's test, a mixed-effects model across recordings (REML, mouse random), finds the
    recordings to differ under 10 of the 16 readings. Under F0a-peakf-decayb-t0a the peak (recording
    means 91.9, 93.2, 86.0 and 84.2%), the rise time and the decay time differ (p 0.0031, 0.0025 and
    0.018), and the duration does not (p 0.17). After removing the duplicate files only one mouse has
    all four recordings, so the repeated-measures ANOVA cannot be run. With every file kept, the
    repeated-measures ANOVA on 4 mice finds no difference (p 0.096 to 0.35) and the mixed model finds
    only the rise time to differ (p 0.0008; recording 4 at 11.6 s against 2.9 to 4.4 s). The result
    may reflect the duplicated deposits.
  deviations:
  - The mixed model is statsmodels MixedLM with recording as a fixed factor and a random intercept per
    mouse, tested by a Wald test of the recording terms; Prism's mixed model and its
    Geisser-Greenhouse correction are not reproduced exactly. Several fits did not converge cleanly.
  - Duplicate files left out, as in fig3b-camp-awake.
