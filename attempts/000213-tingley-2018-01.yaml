  outcome: not_reproduced
  notebook: reproduce_tingley_2018.ipynb
  output: claim:fig6c-ca3-coherence-increases
  notes: In 11 CA3 sessions (DT5 6, DT9 5) the median slope of LS-hippocampal theta phase locking
