- claim: fig1g-phase-more-info-fine-scale
  outcome: partially_reproduced
  notebook: reproduce_tingley_2018.ipynb
  output: claim:fig1g-phase-more-info-fine-scale
  notes: At 7 to 50 bins rate carries more information than phase at p < 0.05 in 42 of 44
