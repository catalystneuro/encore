- claim: ls-active-neurons
  outcome: reproduced
  notebook: reproduce_tingley_2018.ipynb
  output: claim:ls-active-neurons
  measured: 793
  notes: 793 LS neurons pass (-5.6% on 840), over 3,694 neuron-condition pairs against the paper's
    4,393; 1,630 of 1,696 LS units have a condition with at least 10 trials. With 1.0, 2.0 and 3.0
    spikes per trial the count is 932, 707 and 563.
  deviations:
  - Conditions are formed from trial type, direction and start and end site, as the paper's trial
    conditions are not in the dandiset; the count depends on them.
- claim: fig2-ls-phase-vs-shuffle
  outcome: not_reproduced
  notebook: reproduce_tingley_2018.ipynb
  output: claim:fig2-ls-phase-vs-shuffle
  measured: 0.521
  notes: 408 of 783 decoded active LS neurons (52.1%) decode position from phase better than
    chance at p < 0.01 in at least one condition, against 89%; 66.0% at p < 0.05 and 43.3% at p <
    0.001. Per rat 39% (DT2) to 63% (DT9). 23.2% of conditions pass. The rate code passes its own
    chance test in 54.4% of neurons. Mean MSE over LS conditions is 6,359 for phase against 6,839
    for its chance; uniform guessing over 200 bins gives 6,666.
  deviations:
  - Linearization (path fraction, 200 bins), conditions and the theta channel are rebuilt; the
    paper's are not in the dandiset.
  - The binning of spike phases (bz_phaseMap2Bins) is not public; the circular mean per bin is used.
  - 10 active LS neurons of DT2 20160217, which has no hippocampal channel, are not decoded.
- claim: fig2-ls-phase-beats-rate
  outcome: not_reproduced
  notebook: reproduce_tingley_2018.ipynb
  output: claim:fig2-ls-phase-beats-rate
  measured:
  - 0.845
  - 0.481
  - 1.0
  notes: Phase beats rate at p < 0.01 in 662 of 783 neurons (84.5%, paper 93.6%), 1,762 of 3,660
    conditions (48.1%, paper 69.3%) and 58 of 58 sessions (paper 62 of 62). The neuron and
    condition fractions are outside tolerance and fewer than half the conditions pass, so the
    criterion gives not reproduced; the direction holds in every rat (neurons 72% to 95%) and
    session, and rate beats phase in 5.3% of conditions. At p < 0.05, 89.5% of neurons and 60.1%
    of conditions; with whole trials held out, 72.9% and 35.4%.
  deviations:
  - As for fig2-ls-phase-vs-shuffle.
  - 58 sessions are decoded, not 62; DT2 20160217 has no theta reference, and three sessions have
    no LS condition that passes.
