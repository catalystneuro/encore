- claim: fig4d-depth-gradient
  outcome: partially_reproduced
  notebook: reproduce_tingley_2018.ipynb
  output: claim:fig4d-depth-gradient
  notes: With depth and session value centred within rat, r = -0.365 (p = 0.005, 58 sessions).
    Per rat r = -0.70 (DT2, p = 0.034), -0.43 (DT5, p = 0.10), -0.62 (DT9, p = 0.024) and +0.24
    (DT8, p = 0.36); DT7 has three sessions. Without centring r = -0.10 (p = 0.45). With the
    second depth of the name the per-rat signs are the same, and the pooled centred r is -0.268 (p =
    0.042). The within-session part could not be tested, as the dandiset gives no recording site
    per unit.
  deviations:
  - The LS depth is the first number in the session name, an assumption; the dandiset does not
    describe the depths. It rests on DT9, where units are labelled ca3 exactly when the second
    depth is 828 um or more; in DT5 the hpc and ca3 files alternate at second depths of 2232 to
    2448 um, and DT8 does not settle it.
  - Session depth only; the paper adds the site of each unit on the shank.
