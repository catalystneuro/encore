- claim: fig5-assemblies
  outcome: blocked
  blocked_by: not_runnable
  notes: The peer prediction fits a GLM for each hippocampal-LS pair at 150 smoothing windows,
    each against 10 trial shuffles, with theta phase, position and velocity as covariates. The
    dandiset holds 20,979 pairs of active units recorded together (the paper examined 11,264), about
    35 million fits, which does not fit the time limit. The paper's assembly code (Tingley et al.
    2015) and the bin size are not in the repositories read. Nothing beyond the pair count was run.
- claim: fig5g-assembly-neurons-stronger-phase
  outcome: blocked
  blocked_by: not_runnable
  notes: Needs the assemblies of fig5-assemblies.
- claim: fig6e-assembly-position
  outcome: blocked
  blocked_by: not_runnable
  notes: Needs the assembly strengths of fig5-assemblies.
- claim: speed-independent
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The paper does not define the rate of phase precession, how it is correlated with
    running speed, or the test of speed modulation of rate maps, and no code for it is in the
    repositories read. The data needed (positions, spikes, LFP) are in the dandiset.
- claim: ls-information-lower
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The information measure is defined per position bin, but the paper does not say how it
    becomes a rate in bits per cm or at which smoothing LS and hippocampal maps were compared, and
    its information function is not public. The data needed are in the dandiset.
- claim: figs6-reference-frame
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: No file, trial or interval marks a maze rotation; the trials carry only type (central or
    wheel alternation) and direction. Head orientation is present (quaternions), but which
    sessions or trials follow a rotation cannot be told. Figure S6 was not read.
- claim: fig7-dynamic-weighting-model
  outcome: blocked
  blocked_by: other
  notes: A simulation that uses no recorded data from the dandiset (its weights come from a file in
    the paper's code repository), so it says nothing about the dandiset. It was not run.
findings:
- kind: metadata_insufficient
  statement: The paper's processed behaviour is not in the dandiset; the linearized position, the
    trial conditions used for every rate and phase map, and the CA1 pyramidal layer channel used as
    the theta reference in each session must be rebuilt, and several outcomes depend on how.
- kind: data_missing
  statement: Units have no waveform, recording site or channel of largest amplitude, so the
    within-session depth analyses of Figure 4 (unit site on the shank) cannot be repeated.
- kind: metadata_insufficient
  statement: The two depths in each session name (for example 1944um and 2232um) are not described;
    which is the LS probe and what the zero is cannot be told from the metadata. The `hpc` unit
    label is not defined as CA1.
- kind: metadata_error
  statement: Eight DT8 files state position in mm but hold values spanning about 1.1 to 1.3, which
    are metres.
- kind: format_error
  statement: In all 67 files the third column (z) of position is a copy of the second (y).
- kind: format_error
  statement: In eight of the eleven DT2 files the position timestamps repeat or go back; the time
    per sample (33.3 ms) can only be taken from the session span.
- kind: format_error
  statement: 11 units in six files hold spike times that are not in increasing order.
- kind: metadata_insufficient
  statement: Every DT2 electrode, and those of two DT9 files, is labelled `unknown`; DT2 positions
    are in pixels with no scale; DT7 20170317 has 43 units with no region or group; DT7 20170324
    has no units.
- kind: metadata_insufficient
  statement: Trials on the linear track, and in two DT8 alternation files (20170207 and 20170224),
    carry no type or direction.
- kind: other
  statement: In DT9 20170501 the trials do not match the positions (speed inside the trial windows
    does not change when they are shifted by up to 3 s), and in DT2 20160221 speed peaks with the
    trials shifted by 1 s, which suggests an offset of up to a second.
- kind: selection_undocumented
  statement: The dandiset holds 1,696 LS units and 3,217 hippocampal units (2,593 hpc, 624 ca3)
    against the paper's 1,647 LS and 2,951 hippocampal units, and 20,979 pairs of active
    hippocampal and LS units against 11,264 examined; which units the paper left out is not
    documented.
- kind: methods_unavailable
  statement: The functions the paper's figure scripts call to bin spike phases (bz_phaseMap2Bins),
    compute information (olypherInfo) and detect assemblies, and the parameters of its place-field
    call, are not in the public repositories; the session files they read (behavior.mat,
    sessionInfo) are not in the dandiset.
- kind: other
  statement: 42 files chunk the LFP as 500 samples by all channels, so reading one channel of a
    session means reading the whole LFP; chunks along time per channel
    would make single-channel access practical.
