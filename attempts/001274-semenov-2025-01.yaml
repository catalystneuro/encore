outcomes:
- claim: fig1-pure-sine-excites-all
  outcome: partially_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig1-pure-sine-excites-all
  measured: 88
  notes: At 2 kHz 27 of 28 neurons (96%) fired at least one AP under both AP readings, at 20 kHz 15
    of 17 (88%), below the criterion's 90% (measured gives the 20-kHz value, the lower of the two).
    The bright-pixel trace gives the same, except 28 of 28 at 2 kHz under reading (b). The two
    neurons not excited at 20 kHz (001033/sub-7-2, 001035/sub-10-4) were tested up to 288 and 324
    V/cm and fired in other sessions (26 and 11 APs), so the Methods' selection of neurons with APs
    does not remove them. The statement's "never as an on-off response" is not tested by the
    criterion. Neurons are pooled over 001032, 001033 and 001035 (28 at 2 kHz, 17 at 20 kHz).
  deviations:
  - The paper does not say which neurons or dandisets form Figure 1; all neurons tested with
    unmodulated 2- or 20-kHz sine waves in 001032, 001033 and 001035 are pooled.
  - F is the mean of the whole 16 x 16 frame (assumption; Methods, "The emission intensity over the
    entire cell soma (F)", but the files have no soma outline). It gives first APs of median 11.4%
    dF against the Methods' typical 11.3%. The brighter half of the frame is run as a variant and
    gives the same outcome.
  - AP peaks closer than 8 ms are merged, the AP duration of the Methods ("8 +- 0.7 ms duration");
    reading (a) also asks a prominence of 2.5% dF, a standard choice. The first frame of every
    recording, a camera artifact, is left out of F0.
- claim: fig1-onset-delay
  outcome: partially_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig1-onset-delay
  notes: The median first-AP latency of the near-threshold sessions is 64 ms (reading a, IQR 41 to
    128, n = 42 neuron-carrier pairs) and 67 ms (reading b), below 90 to 220 ms. By carrier it is
    54 ms at 2 kHz (n = 27) and 124 ms (a) or 101 ms (b) at 20 kHz (n = 15). With only thresholds
    that have a lower-field session without APs it is 67 ms (n = 27). The second part holds; the
    latency falls with field (Spearman rho below 0) in 38 of 38 (a) and 39 of 39 (b) pairs with
    three or more fields with APs. The bright-pixel trace gives 67 and 54 ms. The latency does not
    depend on the field reading.
  deviations:
  - Neuron-carrier pairs are the units for both parts (the criterion says per neuron and
    frequency); sessions repeated at one field are averaged, a standard choice.
  - Soma ROI and AP detection as in fig1-pure-sine-excites-all.
- claim: fig1-max-rate-ceiling
  outcome: reproduced
  assumed: true
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig1-max-rate-ceiling
  measured: 59.9
  notes: The median ceiling over 30 neurons is 59.9 Hz under AP reading (a) (IQR 31.7 to 83.4, range
    16.1 to 110.2), within 54 to 99 Hz, and 42.9 Hz under reading (b), outside it; the bright-pixel
    trace gives 62.4 (a) and 61.7 (b). The rate rises with field before the ceiling in 31 of 31
    neuron-carrier pairs with three fields or more (median slope 0.64 Hz per V/cm). Two neurons
    never fired two APs in one unmodulated session and have no rate.
  deviations:
  - Assumption. The AP readings disagree; reading (a) is adopted. The Methods select neurons whose
    "APs peaked at a more than 5% dF", which is reading (a); reading (b), a rise of 5% within 5 ms,
    misses an AP that starts on the falling phase of the one before, the case that sets the maximum
    rate. Both readings are shown.
  - The detection cannot see rates above 125 Hz (8-ms merge, Methods' AP duration).
- claim: fig1-excitation-block
  outcome: not_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig1-excitation-block
  notes: The highest-field unmodulated session has a last-100-ms mean dF above 5% and above the
    near-threshold session in 3 of 42 neuron-carrier pairs under both AP readings (3 of 42 and 3 of
    43 with the bright-pixel trace), against more than half. The second-half variant also gives 3.
    The highest-field last-100-ms dF has a median of 1.3% (range -0.7 to 9.8). The highest field
    tested was a median 1.36 times the near-threshold field, and 11 of 370 unmodulated sessions have
    a last-100-ms dF above 5%, so most neurons may not have been driven far enough above threshold
    in the deposited sessions.
  deviations:
  - Soma ROI as in fig1-pure-sine-excites-all. Sessions repeated at one field are averaged.
- claim: fig2d-20khz-twofold-threshold
  outcome: partially_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig2d-20khz-twofold-threshold
  measured:
  - 2.27
  - 2.62
  - 2.34
  - 2.49
  notes: Every 20-kHz threshold group is higher than the 2-kHz one with p below 0.0001 under both
    test readings (per group at most 4e-05, pooled 1e-24), but the ratios of mean thresholds (1 AP
    unmodulated, 1 AP modulated, 5 APs unmodulated, 5 APs modulated) are 2.27, 2.62, 2.34 and 2.49
    under AP reading (a) and 2.29, 2.63, 2.28 and 2.82 under (b), all above 1.8 to 2.2. The
    modulated 20-kHz groups have 2 or 3 neurons (all in 001033). The ratio does not depend on the
    field reading. The descriptions say the generator voltages are not the measured amplitude,
    with frequency-dependent calibration factors to be reported separately; a smaller true
    amplitude at 20 kHz would lower the ratio.
  deviations:
  - Neurons of 001032, 001033 and 001035 pooled; the paper does not say which form Figure 2D.
  - The field per session is 36 V/cm times half the generator's peak-to-peak voltage, from the
    session descriptions, without frequency calibration (not in the dandisets).
- claim: fig2d-modulated-thresholds-higher
  outcome: partially_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig2d-modulated-thresholds-higher
  notes: The modulated mean is higher in all three pairs under both readings. Under reading (a) one
    pair reaches p < 0.05 (20 kHz 1 AP, p = 0.021; 2 kHz 5 APs p = 0.082; 20 kHz 5 APs p = 0.082);
    under reading (b) two do (20 kHz 1 AP p = 0.021, 20 kHz 5 APs p = 0.012; 2 kHz 5 APs p =
    0.155). The 20-kHz modulated groups have 3 neurons (2 for 5 APs under b). The 2-kHz 1-AP pair,
    for which the paper reports no difference, gives unpaired p = 0.059 (a) and 0.045 (b), and
    paired p = 0.0001 on 12 neurons. Paired tests on the three pairs give p from 0.095 to 0.29.
  deviations:
  - As in fig2d-20khz-twofold-threshold.
- claim: threshold-2khz-unmodulated
  outcome: not_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:threshold-2khz-unmodulated
  measured: 75.6
  notes: The mean 1-AP threshold for unmodulated 2-kHz sine waves is 75.6 +- 6.2 V/cm (n = 27,
    reading a) and 74.8 +- 5.9 (reading b) with the field as 36 V/cm times half the peak-to-peak
    voltage, and 151.2 and 149.6 V/cm with the whole of it; none is within 57.7 +- 3.6. By
    dandiset it is 92.2 (001032, n = 10), 76.6 (001033, n = 7) and 58.3 V/cm (001035, n = 10).
    With only thresholds bracketed by a lower-field session without APs, 88.0 V/cm (n = 16).
  deviations:
  - The field conversion is the dandisets' (36 V/cm per volt) with two readings of the voltage;
    both give the same outcome. The uncalibrated generator voltage may be above the true one.
- claim: fig2-modulated-locks-to-beats
  outcome: partially_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig2-modulated-locks-to-beats
  notes: Firing locks to the beats; of the APs in the 28 (a) or 22 (b) modulated sessions with 5 APs
    or more, 0.87 and 0.98 fall 12.5 to 37.5 ms into a beat, and over all modulated sessions 0.90
    and 0.96 do, against 0.10 and 0.04 with the beats shifted by 25 ms. Part (i) fails under reading
    (a), with 2 of 84 sessions above 10 APs (12 and 11), and holds under (b) (at most 6). Part (iii)
    fails under both, with one session (001032/sub-2-1, 198 V/cm) ending with a last-100-ms dF of
    5.9%.
  deviations:
  - The beats are counted from the stimulus onset at 50 ms, with the envelope at zero there (the
    claims file's reading of the beat); the data support it, as the shifted beats show.
  - Part (ii) is read on the APs pooled over the sessions with 5 APs or more; per session, 23 of 28
    (a) and 21 of 22 (b) sessions have 80% or more in the window.
- claim: fig2c-pure-more-aps
  outcome: reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig2c-pure-more-aps
  notes: In 52 pairs from 12 neurons (same neuron, carrier and generator voltage), the unmodulated
