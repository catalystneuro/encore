outcomes:
- claim: fig1-pure-sine-excites-all
  outcome: not_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig1-pure-sine-excites-all
  measured: 88
  notes: At 2 kHz 27 of 28 neurons (96%) fired at least one AP under both AP readings, at 20 kHz 15 of
    17 (88%), below the criterion's 90% at each frequency (measured gives the 20-kHz value). The bright-pixel
    trace gives the same, except 28 of 28 at 2 kHz under reading (b). The two neurons not excited at 20
    kHz (001033/sub-7-2, 001035/sub-10-4) were tested up to 288 and 324 V/cm and fired in other sessions
    (26 and 11 APs). Their 20-kHz traces show no AP of 5%; sub-10-4 has 8 upticks of 2.5% at 324 V/cm
    on a falling trace (4 in all its pre-stimulus windows), which may be small APs that no reading counts;
    with it the fraction would be 16 of 17 (94%). Neither neuron is dimmer than the others. The statement's
    "never as an on-off response" is not tested by the criterion. Neurons are pooled over 001032, 001033
    and 001035.
  deviations:
  - The paper does not say which neurons or dandisets form Figure 1; all neurons tested with unmodulated
    2- or 20-kHz sine waves in 001032, 001033 and 001035 are pooled.
  - F is the mean of the whole 16 x 16 frame (assumption; Methods, "The emission intensity over the entire
    cell soma (F)", but the files have no soma outline). It gives first APs of median 11.4% dF against
    the Methods' typical 11.3%. The brighter half of the frame is run as a variant and gives the same
    outcome.
  - 'AP peaks closer than 8 ms are merged, the AP duration of the Methods ("8 +- 0.7 ms duration"). Assumption:
    reading (a) also asks a prominence of 5% dF and a half-width of at least 1 ms (Methods: APs are "brief
    emission upticks" that "lasted about 10 ms"). Without them noise on a depolarized plateau counts as
    APs (about 18 per 250 ms on a synthetic 6% plateau with the data''s noise, against 1.2 with them);
    99% of the first APs of the data have a prominence above 8.6% and a half-width above 1.6 ms. The first
    version used a 2.5% prominence and no width. The first frame of every recording, a camera artifact,
    is left out of F0.'
- claim: fig1-onset-delay
  outcome: not_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig1-onset-delay
  notes: The median first-AP latency of the near-threshold sessions is 64 ms (reading a, IQR 37 to 128,
    n = 42 neuron-carrier pairs) and 67 ms (reading b), below 90 to 220 ms. By carrier it is 49 ms at
    2 kHz (n = 27) and 124 ms (a) or 101 ms (b) at 20 kHz (n = 15). With only thresholds that have a lower-field
    session without APs it is 67 ms (n = 27). The second part holds; the latency falls with field (Spearman
    rho below 0) in 38 of 38 (a) and 39 of 39 (b) pairs with three or more fields with APs. The criterion
    needs both parts. 7 of 50 near-threshold sessions have a first AP within 20 ms; their traces show
    AP-shaped events, not stimulus artifacts (2.6 and 2.9 ms at 180 and 153 V/cm, the other five isolated
    APs at 10 to 16 ms).
  deviations:
  - Neuron-carrier pairs are the units for both parts (the criterion says per neuron and frequency); sessions
    repeated at one field are averaged, a standard choice.
  - Soma ROI and AP detection as in fig1-pure-sine-excites-all.
- claim: fig1-max-rate-ceiling
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig1-max-rate-ceiling
  measured: 39.1
  notes: The median ceiling over 29 neurons is 39.1 Hz under AP reading (a) (IQR 28.8 to 60.5, range 16.1
    to 93.5) and 42.9 Hz under reading (b) (n = 31), both below 54 to 99 Hz; the bright-pixel trace gives
    41.7 (a) and 61.7 Hz (b), the last the noisiest reading (1.18 false APs per 250 ms before stimuli).
    The rate rises with field before the ceiling in 32 of 32 neuron-carrier pairs (median slope 0.66 Hz
    per V/cm). The traces of the 35 sessions that set the ceilings are shown with the APs of both readings;
    5 reach 79 to 94 Hz under both. The first version of reading (a) gave 59.9 Hz by counting plateau
    noise, at a rate near 80 Hz on synthetic traces; the revised reading (a) finds synthetic AP trains
    of 40 to 100 Hz at their rate. Three neurons never fired two APs in one unmodulated session and have
    no rate.
  deviations:
  - Assumption. Reading (a) asks a 5% prominence and a 1-ms half-width (as in fig1-pure-sine-excites-all),
    so that noise on a depolarized plateau is not counted. The outcome rests on it under reading (a);
    reading (b), as the claims file gives it, yields the same outcome.
  - The detection cannot see rates above 125 Hz (8-ms merge, Methods' AP duration).
- claim: fig1-excitation-block
  outcome: not_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig1-excitation-block
  notes: The highest-field unmodulated session has a last-100-ms mean dF above 5% and above the near-threshold
    session in 3 of 42 neuron-carrier pairs under both AP readings (3 of 42 and 3 of 43 with the bright-pixel
    trace), against more than half. The second-half variant also gives 3. The highest-field last-100-ms
    dF has a median of 1.3% (range -0.7 to 9.8). The highest field tested was a median 1.36 times the
    near-threshold field, and 11 of 370 unmodulated sessions have a last-100-ms dF above 5%, so most neurons
    may not have been driven far enough above threshold in the deposited sessions. The traces are not
    corrected for bleaching; the near-threshold sessions end at a median of -0.2%.
  deviations:
  - Soma ROI as in fig1-pure-sine-excites-all. Sessions repeated at one field are averaged.
