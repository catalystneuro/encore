  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig2d-20khz-twofold-threshold
  measured:
  - 2.27
  - 2.62
  - 2.37
  - 2.82
  notes: Every 20-kHz threshold group is higher than the 2-kHz one with p below 0.0001 under both test
    readings (per group at most 2e-05, pooled 3e-24), but the ratios of mean thresholds (1 AP unmodulated,
