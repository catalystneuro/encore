findings:
- kind: metadata_insufficient
  statement: DANDI:001274 holds only raw strobe image stacks (512 x 512 pixels). It has no ROIs, no
    RATIO images, no frame times, no electric field in V/cm (only generator volts) and no
    identifier linking its 20 subjects to the paper's cells C1 to C9, C7 (Figure 5) and C8 (Figure
    S3). The claims of Figures 5, 6 and S3 cannot be tested as the paper made them.
- kind: metadata_insufficient
  statement: DANDI:001273 (Figure 4) holds only raw strobe stacks. The ROIs, each cell's shape
    group (elongated or random) and, in 63 of 181 files, the field direction are not given, so the
    paper's 19 experiments and groups cannot be formed from its 13 subjects.
- kind: other
  statement: DANDI:001034 is a second deposit of DANDI:001032. The subjects (sub-N-3 against sub-N-1),
    session names and sizes match for every asset, and the image arrays and start times of ten
    compared pairs are identical. Each recording is counted once here.
- kind: metadata_error
  statement: The session descriptions of tetrodotoxin recordings in DANDI:001271 and DANDI:001274
    say that tetrodotoxin "abolished the action potentials and caused sustained depolarization".
    The paper says it "fully blocked the sustained depolarization", and in 001271 the mean dF over
    the last 100 ms of the stimulus is at most 0.4% in every tetrodotoxin session.
- kind: metadata_insufficient
  statement: No 250-ms session in DANDI:001032, 001033 or 001035 is described as recorded in the
    sodium gluconate solution of Figures 3A and 3B; all give the NaCl solution.
- kind: metadata_insufficient
  statement: The fast recordings give the generator's peak-to-peak voltage and "1V translates into
    36 V/cm", but say the voltage is not the measured amplitude and that frequency-dependent
    calibration factors "will be reported separately"; they are not in the dandisets. DANDI:001030
    gives one-polarity volts. Whether the 36 V/cm applies to the peak-to-peak or the peak voltage
    is not stated.
- kind: data_missing
  statement: DANDI:001272 holds 3 neurons recorded with Di-8-ANEPPS; the paper reports eight.
- kind: other
  statement: The fast recordings are 16 x 16 pixels, where the paper's Methods give 64 x 64 after
    binning, and 59 of 178 sessions of 001032 have 900 frames, 2 have 1,400 and 1,800, against 1,200
    in the Methods. The first frame of every fast recording is a bright artifact (median 3.05 times
    the other pre-stimulus frames).
- kind: metadata_error
  statement: The descriptions of DANDI:001032 to 001035 give a 140-um gap between the stimulating
    electrodes; the paper's Methods and DANDI:001274 give 120 um.
- kind: metadata_error
  statement: DANDI:001030 makes one subject per session (sub-c7-1-45V and so on), so its 17
    subjects are 4 neurons (c5 to c8). Two of its recordings (c5) have 6,000 frames and end before
    the 2-s stimulus does.
- kind: other
  statement: Many strobe sessions of DANDI:001274 recorded on 2024-08-24 are described as made in
    1 uM tetrodotoxin, which the paper does not mention for Figures 5, 6 or S3.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which pixels form the soma ROI (F) of the fast
    recordings, given the deposited 16 x 16 frames? This attempt assumed the whole frame, whose APs
    have the Methods' typical size (median 11.4% dF against 11.3%), and ran the brighter half as a
    variant; the outcomes do not change between them.
- kind: methods_unavailable
  statement: Question for the paper's authors. How were the generator voltages of the fast
    recordings converted to the field in V/cm (peak or peak-to-peak, and with which frequency
    calibration)? This attempt assumed 36 V/cm times half the peak-to-peak voltage; the 2-kHz
    threshold is 75.6 V/cm with it and 151 V/cm with the whole voltage, against the paper's 57.7.
- kind: methods_unavailable
  statement: Question for the paper's authors. What rule counted APs, for example two APs close
    together or APs riding on a depolarization? The maximum firing rate ceiling is 59.9 Hz with a
    peak above 5% dF and 42.9 Hz with a 5% rise within 5 ms; this attempt assumed the first, as
    the Methods' wording ("APs peaked at a more than 5% dF") reads.
