- claim: threshold-2khz-unmodulated
  outcome: not_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:threshold-2khz-unmodulated
  measured: 75.6
  notes: 'The mean 1-AP threshold for unmodulated 2-kHz sine waves is 75.6 +- 6.2 V/cm (n = 27, reading
    a) and 74.8 +- 5.9 (reading b) with the field as 36 V/cm times half the peak-to-peak voltage, and
    151.2 and 149.6 V/cm with the whole of it; none is within 57.7 +- 3.6. By dandiset it is 92.2 (001032,
    n = 10), 76.6 (001033, n = 7) and 58.3 V/cm (001035, n = 10). With only thresholds bracketed by a
    lower-field session without APs, 88.0 V/cm (n = 16). The half reading fits the paper''s numbers: 63
    and 81 V/cm are 3.5 and 4.5 Vpp under it (2 and 7 sessions) and 1.75 and 2.25 Vpp under the full reading
    (no session). The generator voltage overstates the amplitude by a frequency-dependent factor that
    is not deposited; a 2-kHz factor of 0.76 would give 57.7 V/cm, and the only measured factors in the
