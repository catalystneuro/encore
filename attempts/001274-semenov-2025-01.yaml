- claim: figs1-di8-anepps-control
  outcome: not_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:figs1-di8-anepps-control
  notes: 001272 holds 3 neurons, where the paper used eight. The readings disagree on excitation (3
