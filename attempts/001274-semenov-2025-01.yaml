- claim: fig3c-sustained-firing-2s
  outcome: partially_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig3c-sustained-firing-2s
  notes: Tested on neuron c7 of 001030, the only neuron with a trace without APs (1.0 V), which the
    Methods' bleaching correction needs. (i) APs occur in the last 250 ms at 52, 61 and 72 V/cm (8
    to 15 under reading a, 8 to 10 under b). (ii) The AP count rises with field, from 0 at 36 V/cm
    to 142 at 83 V/cm under (a), and to 90 at 61 V/cm under (b), then 80 and 8. (iii) At the
    highest field, 83 V/cm, the mean dF over 0.25 to 2 s is 6.7% and under (b) the APs stop at 0.21
    s, within the ramp, with one more at 1.68 s, about what reading (b) finds by chance in 1.75 s;
    reading (a) counts 131 peaks on the depolarized plateau after 250 ms. "No APs after 250 ms"
    fails under both readings, by one event under (b). The other three neurons, corrected with the
    same trace, reach no block (mean dF at most 4.0%).
  deviations:
  - The field is 36 V/cm times the one-polarity voltage that 001030 gives.
  - The other neurons are corrected with c7's AP-free trace, as they have none of their own.
