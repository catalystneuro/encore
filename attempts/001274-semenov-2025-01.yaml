- claim: figs2-ttx-blocks-depolarization
  outcome: partially_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:figs2-ttx-blocks-depolarization
  notes: In all 6 neurons recorded in tetrodotoxin (3.6 to 11 min after the normal-solution session
    at the same field), APs present before are absent under reading (a); under reading (b) 5 of 6, as
    (b) finds 5% rises in 15 of 17 tetrodotoxin sessions of one neuron where (a) finds none. The
