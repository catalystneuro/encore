findings:
- kind: metadata_insufficient
  statement: DANDI:001274 holds only raw strobe image stacks (512 x 512 pixels). It has no ROIs, no RATIO
    images, no frame times, no electric field in V/cm (only generator volts) and no identifier linking
    its 20 subjects to the paper's cells C1 to C9, C7 (Figure 5) and C8 (Figure S3). The claims of Figures
    5, 6 and S3 cannot be tested as the paper made them.
- kind: metadata_insufficient
  statement: DANDI:001273 (Figure 4) holds only raw strobe stacks. The ROIs, each cell's shape group (elongated
    or random) and, in 63 of 181 files, the field direction are not given, so the paper's 19 experiments
    and groups cannot be formed from its 13 subjects.
- kind: other
  statement: DANDI:001034 is a second deposit of DANDI:001032. The subjects match (sub-N-3 against sub-N-1),
    all 178 assets match one to one by session start time and size (116 also by name), and the image arrays
    and start times of ten compared pairs are identical. Each recording is counted once here.
- kind: metadata_error
  statement: The session descriptions of tetrodotoxin recordings in DANDI:001271 and DANDI:001274 say
    that tetrodotoxin "abolished the action potentials and caused sustained depolarization". The paper
    says it "fully blocked the sustained depolarization", and in 001271 the mean dF over the last 100
    ms of the stimulus is at most 0.4% in every tetrodotoxin session.
- kind: metadata_insufficient
  statement: No 250-ms session in DANDI:001032, 001033 or 001035 is described as recorded in the sodium
    gluconate solution of Figures 3A and 3B; all give the NaCl solution.
- kind: metadata_insufficient
  statement: The fast recordings give the generator's peak-to-peak voltage and "1V translates into 36
    V/cm", but say the voltage is not the measured amplitude and that frequency-dependent calibration
    factors "will be reported separately"; they are not in the dandisets. DANDI:001030 gives one-polarity
    volts. Whether the 36 V/cm applies to the peak-to-peak or the peak voltage is not stated.
- kind: data_missing
  statement: DANDI:001272 holds 3 neurons recorded with Di-8-ANEPPS; the paper reports eight.
- kind: other
  statement: The fast recordings are 16 x 16 pixels, where the paper's Methods give 64 x 64 after binning,
    and 59 of 178 sessions of 001032 have 900 frames, 2 have 1,400 and 1,800, against 1,200 in the Methods.
    The first frame of every fast recording is a bright artifact (median 3.05 times the other pre-stimulus
    frames).
- kind: metadata_error
  statement: The descriptions of DANDI:001032 to 001035 give a 140-um gap between the stimulating electrodes;
    the paper's Methods and DANDI:001274 give 120 um.
- kind: metadata_error
  statement: DANDI:001030 makes one subject per session (sub-c7-1-45V and so on), so its 17 subjects are
    4 neurons (c5 to c8). Two of its recordings (c5) have 6,000 frames and end before the 2-s stimulus
    does.
- kind: other
  statement: Many strobe sessions of DANDI:001274 recorded on 2024-08-24 are described as made in 1 uM
    tetrodotoxin, which the paper does not mention for Figures 5, 6 or S3.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which pixels form the soma ROI (F) of the fast recordings,
    given the deposited 16 x 16 frames? This attempt assumed the whole frame, whose APs have the Methods'
    typical size (median 11.4% dF against 11.3%), and ran the brighter half as a variant; the outcomes
    do not change between them.
- kind: methods_unavailable
  statement: Question for the paper's authors. How were the generator voltages of the fast recordings
    converted to the field in V/cm (peak or peak-to-peak, and with which frequency calibration)? This
    attempt assumed 36 V/cm times half the peak-to-peak voltage, which matches the voltages behind the
    paper's 63 and 81 V/cm; the 2-kHz threshold is 75.6 V/cm with it and 151 V/cm with the whole voltage,
    against the paper's 57.7, which a 2-kHz calibration factor of 0.76 would give.
- kind: methods_unavailable
  statement: Question for the paper's authors. What rule counted APs, for example two APs close together,
    APs riding on a depolarization, or small upticks below 5% dF? This attempt assumed a peak above 5%
    dF over F0 that also rises 5% above the trace around it and is at least 1 ms wide at half its height;
    without the last two conditions, noise on a depolarized plateau counts as APs and the maximum firing
    rate ceiling moves from 39.1 to 59.9 Hz.
verifications:
- date: '2026-11-01'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: 'Round 1. The first executed notebook with the conclusion cells and the summary removed, the
    helper module and the claims file, with the paper. The verifier queried the archive metadata and tested
    the AP detection on synthetic traces. Its report had no attempt record and gave its own outcome for
    each claim; agrees compares that outcome with the record as it stood before this revision. It found
    three problems that affect a conclusion: reading (a) counted noise on a depolarized plateau as APs,
    the generator calibration was not estimated, and the summary scored as partial claims whose criteria
    have no partial outcome.'
  results:
  - claim: fig1-pure-sine-excites-all
    agrees: false
    outcome: not_reproduced
    reason: 2 kHz passes (27/28 or 28/28), but 20 kHz is 15/17 = 88% under all four readings. The criterion
      needs at least 90% at each frequency and has no partial outcome. The two neurons that never fired
      were tested up to 288 and 324 V/cm, above the mean 20-kHz threshold of 171 V/cm.
    response: Outcome changed from partially_reproduced to not_reproduced, as the criterion has no partial
      outcome. Added the traces of the two neurons' 20-kHz sessions with their mean images and bright-half
      outline, a count of upticks below the 5% level (sub-10-4 has 8 at 324 V/cm), and their brightness
      against the other neurons. Dropped the variant that equalled the main count (problem 8).
  - claim: fig1-onset-delay
    agrees: false
    outcome: not_reproduced
    reason: Latency falls with field in 38/38 pairs, but the median near-threshold latency is 54 to 67
      ms under every reading. The variant that keeps only bracketed thresholds gives 67 ms. Both are outside
      90 to 220 ms, and the criterion needs both parts.
    response: Outcome changed to not_reproduced. Added the near-threshold sessions with a first AP within
      20 ms (7 of 50), their latency histogram and traces; the events are AP-shaped, not stimulus artifacts,
      so the median is not biased low by artifacts.
  - claim: fig1-max-rate-ceiling
    agrees: false
    outcome: blocked
    reason: 'On the adopted whole-frame trace the two AP readings disagree: 59.9 Hz under (a) is inside
      54 to 99 Hz, 42.9 Hz under (b) is outside. The fig1 criterion that this claim inherits blocks when
      readings disagree. The notebook''s reproduced ignores reading (b).'
    response: Reading (a) was revised after problem 1 (5% prominence, 1-ms half-width), with the verifier's
      synthetic test and AP trains run in the notebook. With it the ceiling is 39.1 Hz under (a) and 42.9
      Hz under (b); the readings now agree, both outside 54 to 99 Hz, so the outcome is not_reproduced,
      marked as resting on the revised reading (a). Added the traces of the 35 sessions that set the ceilings
      with both readings' APs and their dF levels. The verifier proposed blocked on the first-round numbers;
      it has not reviewed the new ones.
  - claim: fig1-excitation-block
    agrees: true
    outcome: not_reproduced
    reason: Block in 3 of 42 neuron-carrier pairs under every reading. The second-half variant also gives
      3.
    response: No change of outcome. Added the traces of the highest-field session of every neuron and
      carrier, and a note on bleaching (problem 10).
  - claim: fig2d-20khz-twofold-threshold
    agrees: false
    outcome: not_reproduced
    reason: p < 0.0001 holds pooled and nearly always per group. The 20/2 kHz ratios are 2.27 to 2.82,
      outside 1.8 to 2.2, except two groups under bright/b. The criterion needs every ratio within tolerance.
      The outcome also depends on frequency-dependent generator calibration.
    response: 'Outcome changed to not_reproduced. Added the calibration estimate: the 20-kHz factor would
      have to be 0.64 to 0.97 times the 2-kHz one to bring the ratios into tolerance; the factors are
      not deposited.'
  - claim: fig2d-modulated-thresholds-higher
    agrees: true
    outcome: partially_reproduced
    reason: 'The modulated mean is higher in all three pairs. p < 0.05 holds in only one or two of the
      three under every reading: whole/a 20k-1AP only (p = 0.021); whole/b 20k-1AP and 20k-5AP.'
    response: No change of outcome. With the revised reading (a), two pairs reach p < 0.05 under both
      readings (20 kHz 1 AP p = 0.021, 20 kHz 5 APs p = 0.017 and 0.012).
  - claim: threshold-2khz-unmodulated
    agrees: true
    outcome: not_reproduced
    reason: 75.6 +- 6.2 V/cm (half reading) or 151 V/cm (full reading), both outside 57.7 +- 3.6, and
      the AP readings agree. The dataset itself says its volts overstate the true amplitude, so this miss
      may come from calibration.
    response: No change of outcome. Added the field cross-check (63 and 81 V/cm are 3.5 and 4.5 Vpp under
      the half reading, voltages the sessions use, and 1.75 and 2.25 Vpp under the full one, which none
      uses) and the calibration estimate (a 2-kHz factor of 0.76 would give 57.7 V/cm; the pulse factors
      of 001273 are 0.62 to 0.79). The notes say the miss may come from calibration.
  - claim: fig2-modulated-locks-to-beats
    agrees: false
    outcome: not_reproduced
    reason: '(ii) passes: 0.83 to 0.98 of APs fall in the peak window. (iii) fails under every reading:
      one session has 5.9% in the last 100 ms. (i) fails under whole/a, bright/a and bright/b, with up
      to 13 APs in a session.'
    response: 'Outcome changed to not_reproduced. Part (iii) now applies the whole block test (problem
      4): the 5.9% session is above its near-threshold modulated session (-0.2%), so it fails. With the
      revised reading (a), part (i) holds under whole/a and whole/b (at most 8 and 6 APs). Added the traces
      of the modulated sessions with the most APs and of the failing session.'
  - claim: fig2c-pure-more-aps
    agrees: true
    outcome: reproduced
    reason: Unmodulated beats modulated in 43 to 46 of 52 pairs, against 1 to 2 the other way. Paired
      t test p about 1e-9 under all four readings.
    response: No change of outcome; with the revised reading (a), 47 against 0, p = 7.3e-10.
  - claim: fig3b-low-conductivity-halves-threshold
    agrees: true
    outcome: blocked
    reason: None of the 1,177 assets of 001032/34/35, 001033, 001271 and 001272 mentions gluconate, and
      all list the NaCl solution. Only 001030 (2-s ramps, sodium gluconate only) does, so there is no
      NaCl against sodium gluconate pair to test.
    response: 'No change of outcome. Added the per-neuron threshold series check it asked for: no neuron-carrier
      pair of 47 shows a reversible drop of the threshold to 0.6 or less.'
  - claim: fig3c-sustained-firing-2s
    agrees: false
    outcome: not_reproduced
    reason: '(i) and (ii) pass for c7. (iii) fails under both readings at 82.8 V/cm: reading (a) finds
      131 APs after 250 ms, reading (b) finds one (at 1.682 s); rest dF is 6.7%. Reading (a)''s count
      is probably noise on the plateau, and reading (b) misses by one AP.'
    response: Outcome changed to not_reproduced. With the revised reading (a) the count after 250 ms is
      5, and (b) 1; both fail (iii). Added the corrected c7 traces with both readings' APs marked and
      the times of the peaks after 250 ms.
  - claim: figs1-di8-anepps-control
    agrees: true
    outcome: not_reproduced
    reason: Only 3 of the paper's 8 neurons are deposited. The block test gives 0/3 under every reading,
      and the readings disagree on excitation. The 3 deposited neurons fail it. Whether all 8 would pass
      cannot be decided, so blocked (data_missing) is also defensible.
    response: No change of outcome; the notes and conclusion say that the result is for the 3 neurons
      deposited and that the other five cannot be judged.
  - claim: figs2-ttx-blocks-depolarization
    agrees: false
    outcome: not_reproduced
    reason: APs are abolished in 6/6 neurons under (a) and 5/6 under (b). Only 1 of 6 neurons has last-100-ms
      dF above 5% before TTX, so the depolarization part fails. The vehicle neuron was not identified.
    response: Outcome changed to not_reproduced. The conclusion and notes now say that the vehicle neuron
      is not identified and that the sessions compared are 3.6 to 11 min apart (problem 6).
