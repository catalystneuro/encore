- claim: edfig1-sensor-decay
  outcome: reproduced
  notebook: reproduce_tingley_2021.ipynb
  output: claim:edfig1-sensor-decay
  notes: In all 31 placements (runs of at least 3 days, 22 subjects) the daily mean current falls
    (median -10.7% of the first-day value per day); the daily mean absolute delta current changes
    by a median -4.7% per day, smaller in magnitude than the current's in 18 of 31 placements.
  deviations:
