outcomes:
- claim: fig2-ripple-rate-predicts-glucose
  outcome: reproduced
  assumed: true
  notebook: reproduce_tingley_2021.ipynb
  output: claim:fig2-ripple-rate-predicts-glucose
  measured:
  - -0.176
  - 14.2
  notes: Over the 18 rats with CA1 SPW-Rs and glucose recorded together, 3 of the 16 combinations
    of readings match both expected values. The first the criterion lists (raw delta current,
    Pearson, one correlogram per rat, lags -100 to +100 min) gives a mean peak R of -0.176 at a mean
    lag of 14.2 min; the high-pass delta gives -0.180 at 14.4 min, and Spearman with one correlogram
    per session and the high-pass delta gives -0.184 at 8.8 min. Mean R is within tolerance under all
    16 combinations (-0.159 to -0.216) but the mean lag is not under the other 13 (15.8 to 33.1 min).
    Single-rat lags spread with an s.d. of 26 to 42 min, and leaving out rats with less than 6 h of
    data leaves 1 matching combination of 16. The peak R is negative in every rat; the median
    correlogram has its minimum, -0.108, at +5 min. CGM1, the only rat labelled as the ripple and
    glucose cohort (reading b), peaks at +5 min (R -0.101 Pearson, -0.194 Spearman). The outcome
    rests on the alignment of the SPW-R count with the glucose change (see deviations); with the
    count over the 5 min after each reading no per-rat combination matches (mean lags 19.2 to 37.8
    min), and with the change to the next reading 4 of 8 match. With all stored events (no 5 s.d.
    threshold) the Spearman per-rat reading gives R -0.212 at 16.1 min and the Pearson one -0.175 at
    14.2 min. The paper's n is 30 rats; 18 is all the dandiset allows. The match is fragile. With at
    least 6 h of both per rat only the high-pass, Spearman, per-session, -100 to +100 min combination
    matches. The median of the per-rat lags is 5 to 15 min in every combination, but only 7 to 10 rats
    peak between +5 and +15 min; in the raw, Pearson, per-rat combination single-rat lags run from
    -100 to +80 min, and the mean falls in tolerance because peaks at -100 to -20 min offset peaks at
    +55 to +80 min. R negative in most rats holds by construction, as R is the minimum over 41
    offsets.
  deviations:
  - 18 rats where the paper has 30. The dandiset holds 25 subjects; 7 have no SPW-R table or no
    glucose recorded on the days of the electrophysiology.
  - Assumed that the SPW-R count of a 5-min interval is paired with the glucose change over the same
    interval (the reading at its end minus the one at its start). The paper says only that SPW-R
    rate and glucose change are correlated at 5-min offsets; this pairing makes offset 0 the same
    interval for both. The two alignments one reading apart are shown and change the outcome.
  - SPW-Rs with a stored peak normed power below 5 s.d. are left out, following the Methods (SPW-R
    detection, "The peak power threshold was set to five s.d."); the stored tables of nine subjects
    hold events down to 4 s.d. All stored events are shown as a variant.
  - Glucose timestamps of twelve subjects were repaired by swapping day and month in dates whose
    day is 12 or less (see findings). Without the repair 1139 h of overlap remain of 1717.
  - The high-pass reading subtracts a centred 24-h running mean, a standard choice for a cutoff
    the paper does not give; a session is one file with at least 6 h of bins, a standard choice.
    Differencing already removes slow drift, so this reading changes delta little and nearly repeats
    the raw one.
  - Reading (a) of the rats leaves out CNO days and the stimulation periods of the optogenetic rats.
    The files label neither, so every day of every rat is used.
- claim: fig2ef-correlation-beyond-shuffle
  outcome: reproduced
  notebook: reproduce_tingley_2021.ipynb
  output: claim:fig2ef-correlation-beyond-shuffle
  notes: At +10 min the per-rat Spearman correlations have a median of -0.106 (16 of 18 negative)
    against 0.005 for 1799 circular shuffles (100 per rat), two-sample KS D = 0.575, p = 4.0e-06.
    With Pearson, -0.076 against 0.002, p = 1.5e-04. Seven rats (Spearman) lie below all 100 of
    their own shuffles.
  deviations:
  - 18 rats where the paper has 30; alignment and 5 s.d. threshold as in
    fig2-ripple-rate-predicts-glucose.
- claim: fig2g-clustered-ripples
  outcome: reproduced
  notebook: reproduce_tingley_2021.ipynb
  output: claim:fig2g-clustered-ripples
  notes: Under reading (a), epochs with more than 150 SPW-Rs are followed 10 min later by a mean
    delta current of -0.191 nA (585 epochs, 13 rats), against +0.050 nA after epochs with 1 to 5
    SPW-Rs (1718 epochs), 3.9 times the magnitude and of opposite sign; a Welch test of the two
    gives p = 0.059, which the criterion does not require. Under reading (b), more than 30 per
    epoch, the mean is -0.032 nA, which does not match. The curve is not monotonic (120 to 150 per
    epoch, +0.125 nA), and in 3 of the 13 rats with clustered epochs their mean is not negative.
  deviations:
  - Epochs pooled over 18 rats; the paper does not say whether it pools.
- claim: edfig4-ripple-features
  outcome: partially_reproduced
  notebook: reproduce_tingley_2021.ipynb
  output: claim:edfig4-ripple-features
  notes: With deciles the ranges of the +10-min effect across bins are interval 0.070 nA, duration
    0.069, frequency 0.053 and amplitude 0.040, so the interval leads but the rest of the order
    differs (the criterion's partial case). With 5-percentile bins duration (0.0967) and interval
    (0.0966) are tied ahead of amplitude (0.061) and frequency (0.060). Per rat with deciles,
    amplitude has the largest range in 7 of 18 rats and the interval in 6. 1083233 SPW-Rs from 18
    rats. Resampling rats (1000 bootstraps, decile edges fixed), the interval has the largest range in
    64.7% of resamples and the full order interval > amplitude > duration > frequency occurs in 1.5%.
    The most clustered decile (shortest intervals) has the least negative effect, +0.004 nA against
    -0.027 nA in the decile with the longest intervals, the opposite direction to
    fig2g-clustered-ripples.
  deviations:
  - The inter-SPW-R interval is the time from the previous SPW-R in the same file, a standard
    choice (previous or next is not said).
- claim: fig2h-phase-reset
  outcome: not_reproduced
  notebook: reproduce_tingley_2021.ipynb
  output: claim:fig2h-phase-reset
  notes: 5839 peaks of SPW-R rate from 18 rats in deciles of peak rate. The Spearman correlation of
    the decrease of phase dispersion with the deciles' median rate is rho -0.24 (p = 0.51) with
    baseline (a) and 0.55 (p = 0.098) with baseline (b), the same for the 15 to 75 and 15 to 90 min
    bands. The decrease in the top decile is positive under all four readings (0.022 to 0.506), but
    it is positive in every decile, the lowest included (0.23 to 0.47), so it does not single out
    high rates. The minimum over seven offsets favours a decrease; with the mean over 0 to +30 min in
    its place rho is -0.19 to 0.56 (p = 0.09 to 0.86).
  deviations:
  - Band-pass filtering within runs of at least 24 h of readings (second-order Butterworth, zero
    phase), a standard choice.
- claim: edfig5-cross-frequency-coupling
  outcome: partially_reproduced
  notebook: reproduce_tingley_2021.ipynb
  output: claim:edfig5-cross-frequency-coupling
  notes: Over stretches of at least 12 h with both signals (16 rats), power-power coupling over 15
    to 60 min exceeds 100 circular shuffles per rat (mean R 0.064 against -0.007, paired t = 2.57,
    p = 0.021), and the rate-weighted glucose phases are non-uniform (Rayleigh p = 3.2e-09,
    resultant length 0.033, above all 200 circular shifts of SPW-R rate, whose 95th percentile is
    0.013; p < 0.05 in 10 of 16 rats singly). The comodulogram peak (R 0.216) is on the diagonal at
    79.0 min for both signals, so the third condition, a peak at a longer glucose period, fails; the
    mean correlation above the diagonal is 0.072 against 0.047 below. With 6-h stretches the same
    holds (p = 0.025 and 1.1e-08, peak at 79.0 min for both). With 24-h stretches only 3 rats remain
    and neither test reaches p < 0.05 (p = 0.24 and 0.82). The paper's p bounds (1e-24, 1e-18) are
    not reached.
  deviations:
  - Periods 12 to 120 min in place of 10 to 120, since 10 min is the Nyquist period of 5-min
    readings; band edges at the period divided and multiplied by 1.25 (a standard choice).
  - Both signals are filtered only over stretches where both are recorded, of at least 12 h (six
    cycles of the longest period), a choice; 24 h and 6 h are shown, and the 24-h variant, with 3
    rats, does not match.
- claim: edfig1-glucose-rhythm
  outcome: not_reproduced
  notebook: reproduce_tingley_2021.ipynb
  output: claim:edfig1-glucose-rhythm
  measured: 51.4
  notes: In 25 subjects the delta-current power above a log-log linear fit is elevated from about 22
    to 131 min, with the peak of the mean residual at 51.4 min (per subject 32 to 60 min), outside
    60 +- 6 min. Below 22 min the residual is negative, so it is positive at 51 of the 81
    frequencies between 15 and 90 min. The first side peak of the mean autocorrelogram is at 70 min
    (0.013), also outside the tolerance. Neither condition holds under any of 12 variants of the
    fit's axes (log-log, semi-log, linear), its range (all frequencies or 10 to 300 min) and the
    segment length (24 or 12 h); the residual peak lies at 43.6 to 51.4 min (log-log), 10.1 min
    (semi-log) or 68.6 to 72.0 min (linear). An oscillation of about 50 min is present; the expected
    period and the 15 to 90 min range are not matched.
  deviations:
  - All 25 subjects with a 24-h run of readings, where the legend has 8 rats; Welch spectra with
    24-h segments, a standard choice (12-h segments shown).
- claim: edfig1-glucose-circadian-meals
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_tingley_2021.ipynb
  output: claim:edfig1-glucose-circadian-meals
  notes: The meal times of the fasting experiment (36 meals, 4 rats) are not in the dandiset, and no
    subject is labelled as part of it, so the meal part and both expected values cannot be tested.
    The circadian part was run and does not find a modulation under the criterion's test (one-way
    ANOVA of hour of day on the hourly means of 25 subjects, F = 0.46, p = 0.99; 28.6 to 31.3 nA).
    That test pools hourly means across subjects whose offsets differ by tens of nA. Within
    subjects, with each run's linear decay and each subject's mean removed, hour of day is
    significant (one-way ANOVA p = 0.024, Friedman p = 5.2e-05; lowest at 06:00 to 07:00, -0.84
    nA, highest at 13:00 to 14:00, +0.65 nA).
