    interval in 18 to 22 ms. The stored tables appear to have merged or dropped events closer than
    about 25 to 30 ms, so the data cannot show a 20-ms drop.
- claim: edfig4-nrem-wake
  outcome: reproduced
  notebook: reproduce_tingley_2021.ipynb
  output: claim:edfig4-nrem-wake
  notes: Three rats (CGM1, CGM2, CGM3) have sleep states with SPW-Rs and glucose. In 4-h blocks the
    Spearman R at +10 min is -0.017 in NREM (120 blocks) and -0.083 awake (112), unpaired t p = 0.057;
    per-rat means paired p = 0.27. Across awake-to-NREM transitions (13, two rats) the most negative
    R from +5 to +20 min is -0.261 before and -0.151 after (p = 0.15); across NREM-to-awake (23, one
    rat) -0.234 and -0.165 (p = 0.23). No test reaches p < 0.05, with little power at 3 rats.
  deviations:
  - 3 rats where the paper has 8; sleep states are stored for six subjects only.
  - Transitions between NREM and awake episodes of at least 10 min each, a choice.
  - Spearman correlation, under which the main claim's per-rat reading matched without the
    alignment variants; the claims file does not fix the type for this claim.
- claim: edfig4-no-hour-differs
  outcome: not_reproduced
  notebook: reproduce_tingley_2021.ipynb
  output: claim:edfig4-no-hour-differs
  notes: Over 12 rats with at least 24 h of both signals, Student's t-test finds 10 of 276 pairs of
    hours at p < 0.05 (smallest p = 0.010), where the paper reports a smallest P of 0.53; the paired
    variant finds 25. The integrated correlation is most negative from 17:00 to 21:00 (-0.37 to
    -0.51) and near zero from 02:00 to 05:00. Ten is fewer than the 14 pairs expected by chance
    among 276 uncorrected tests, so the difference from the paper is in the smallest p, not in a
    clear effect of hour.
  deviations:
  - Rats with at least 24 h of both signals, a standard choice; Spearman correlation as in
    edfig4-nrem-wake.
