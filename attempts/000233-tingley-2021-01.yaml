  measured:
  - 10.19
  - 14671
  notes: Under reading (a), 18 rats and 2264 h, SPW-Rs of at least 5 s.d. occur at 10.19 (s.d.
    11.15) per minute and 14671 per day, with up to 258 in a minute; minutes with more than 40
    occur in 18 of 22 subjects. With all stored events the values are 11.07 per minute and 15941 per
