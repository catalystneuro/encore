- claim: edfig2-refractory-period
  outcome: not_reproduced
  notebook: reproduce_tingley_2021.ipynb
  output: claim:edfig2-refractory-period
  measured: 34.4
  notes: The shortest interval between consecutive SPW-R peaks within a file is 25.6 to 38.4 ms
