findings:
- kind: metadata_error
  statement: In twelve subjects (CGM30, CGM31, CGM39, CGM40, CGM41, CGM46, CGM48, CGM51, CGM57,
    CGM58, bruce, flex1) the GlucoseLevel timestamps carry dates with day and month swapped whenever
    the day is 12 or less, so a reading of 4 March 2021 is stored as 3 April 2021 and the series
    jumps by about a month at each midnight. The session reference times of some of these subjects
    are swapped the same way (CGM46 2021-04-03 for files of 4 March). Swapping back joins the
    readings into runs of 5-min steps and raises the hours of glucose overlapping the
    electrophysiology from 1139 to 1717. In CGM32, 86 readings are dated up to 2021-12-02, more than
    30 days from the subject's other readings, which looks like the same swap for 1 to 12 February;
    swapping all of CGM32's dates does not reduce its breaks, so they were left as stored (no CGM32
    recording falls on those days).
- kind: other
  statement: 27 recordings of CGM1, CGM3, CGM30, CGM31 and CGM32 are deposited twice, under file
    names with dashes and with underscores, with the same LFP start, length and SPW-R events.
- kind: metadata_insufficient
  statement: In the SPW-R tables `start_time` and `stop_time` are on the session clock but `peak` is
    seconds from the start of the file; the column descriptions do not say so. Seven table names
    (Ripples, Ca1Ripples, Nonoise_Ca1Ripples, _Remove_Ca1Ripples, Dorsalripples, Ventralripples,
    Globalripples) are not described.
- kind: other
  statement: The stored SPW-R tables of nine subjects hold events with a peak normed power down to 4
    s.d. (7 to 29% of their events), and CGM30's down to 0.23, where the Methods give a 5 s.d. peak
    threshold. Applying 5 s.d. changes the mean SPW-R rate from 11.07 to 10.19 per minute.
- kind: metadata_error
  statement: Session start times hold local wall-clock time but are labelled UTC (file-name times
    equal the reference plus the LFP start). In CGM2 and CGM3 files of one subject carry two
    different reference times, and in CGM1, CGM2 and CGM3 one file stores the glucose series in a
    different order or relative to its own reference; on the wall clock all files hold the same
    readings.
- kind: metadata_insufficient
  statement: Nothing links the 25 subjects (CGM1 to CGM60, bruce, dt15, flex1, ros, Vanessa) to the
    rats 1 to 45 of Supplementary Table 1 or to the cohorts of the paper (ripple and glucose,
    optogenetic CA1, CA3 or PPC, DREADD lateral or medial septum, CNO controls, dorsal and ventral).
    Only the files of CGM1 state an experiment; the others point to Supplementary Table 1.
- kind: data_missing
  statement: The dandiset holds no spike units, no optogenetic stimulation times, no CNO or vehicle
    labels or injection times, and no meal times. Sixteen of the paper's findings (Figures 3 and 4,
    Extended Data Figs 3e, 4d-f, 7, 8 and 10) and the meal part of Extended Data Fig. 1f cannot be
    tested.
- kind: other
  statement: In CGM37, CGM60, dt15 and flex1 the glucose readings and the electrophysiology cover
    different days, and CGM36, bruce and ros have no SPW-R table, so 7 of 25 subjects cannot
    contribute to the SPW-R and glucose analyses. Vanessa's glucose current has a median of 0.25 nA,
    against about 30 nA in the other subjects.
- kind: other
  statement: No interval between stored SPW-R peaks is shorter than 28.8 ms in any rat, and the gap
    from one event's stop to the next one's start is never below 20.0 ms (15.2 ms in CGM1, CGM2 and
    CGM3), with its minimum at exactly 20.0 ms in 19 of 22 rats. This matches a rule in the
    detection that merges events closer than 20 ms, and the 20-ms refractory period of Extended Data
    Fig. 2a may be this rule.
- kind: methods_unavailable
  statement: The Methods say the input parameters of the SPW-R detection are stored with each
    session's ripple events. The NWB SPW-R tables carry only their column names and a description,
    so the thresholds and the merging interval used for each subject are not in the dandiset.
- kind: methods_unavailable
  statement: Question for the authors. How were the 5-min SPW-R counts aligned with the glucose
    readings for the cross-correlograms (the count of the interval ending at a reading paired with
    the change to that reading, or another pairing), which correlation was used (Pearson or
    Spearman), and over which offsets was the peak lag searched? With 18 rats the mean lag of 10.7
    min is matched only under some combinations, and moving the alignment by one reading moves the
    mean lag by 5 min.
