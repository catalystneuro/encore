  output: claim:fig5b-conductivity-calibration
  measured:
  - 1.33
  - 11.87
  notes: Eq. (2) with the constants of Methods 2.3 gives f = 1.49798 for the intact membrane. A 10-fold rise
    in effective conductivity reduces IMP by 1.33% under reading (a), 1 - f/1.5, and by 1.20% under reading
    (b), relative to the intact f, both outside 2 +- 0.2%. A 100-fold rise gives 11.87% and 11.75%, within
    12 +- 1.2%. A 2% reduction needs a 15.2-fold (a) or 16.2-fold (b) rise. With other radii and membrane
    thicknesses (5 to 12 um, 4 to 7 nm; a variant, not the criterion) the 10-fold reduction is 0.60 to
    2.46%, within 2 +- 0.2% only for 10 um with 4 nm (2.06%) or 12 um with 5 nm (1.98%). The claim
    uses no recordings, so the outcome says nothing about the dataset; the paper's ~2% may be read off the
    curve of Fig. 5B.
