findings:
- kind: data_missing
  statement: The dandiset holds only the whole-brain c-Fos light-sheet experiment (Figure 5, Table 4).
    The Homecage Scan behaviour, qRT-PCR, section immunohistochemistry, RNAscope and HCR images, body
    weights and telemetry behind 24 of the paper's 27 findings are not in it, nor in any other dandiset
    found.
- kind: selection_undocumented
  statement: The dandiset holds 22 hemispheres of 13 mice (10 PACAP fl/fl from 6 mice, 12 PACAPko from
    7). The paper analysed 8 PACAP fl/fl hemispheres from 6 mice and 11 PACAPko from 6 mice. Nothing in
    the dandiset says which hemispheres or which mouse were left out, or why; two PACAPko mice (45467ko,
    45478ko) have one hemisphere each.
- kind: metadata_insufficient
  statement: The FRST threshold used for the analysis is not marked. Each hemisphere has binary segmentations
    at 11 or 19 thresholds (2000 to 12000, or 4000 to 40000), count tables at all of them, and one atlas-space
    heatmap whose threshold is not stated.
- kind: data_missing
  statement: Per-region count tables exist for only 13 of the 22 hemispheres (one per mouse); for the
    other 9 the counts can only be recomputed from the segmentations and labels.
- kind: code_mismatch
  statement: The count tables count every connected component of the segmentation. The Supplemental Methods
    count only objects of 9 to 900 voxels; such objects are 43% to 65% of the table totals. A recount
    of every 26-connected component matches the tables to a median 1.25% per-region difference.
- kind: metadata_error
  statement: README.md describes the root image stacks as downsampled to 25 um isotropic voxels, while
    SPIM.json and the files give 3.7 x 3.7 x 5 um voxels (2560 x 2160 pixels per plane). The README links
    CATNIP at github.com/AllenInstitute/CATNIP and a 2024 bioRxiv preprint, while dataset_description.json
    and the paper give github.com/snehashis-roy/CATNIP and the 2023 J Neuroendocrinol paper.
- kind: metadata_error
  statement: The atlas-space heatmaps state 3.7 x 3.7 x 5 um voxels in their OME metadata and 25 um in
    their sidecar (res-25um_SPIM.json).
- kind: metadata_error
  statement: The archive summary lists no species, participants.tsv spells the strain two ways (C57BL6/N
    for the PACAPko mice and C57BL/6N for the PACAP fl/fl mice), and the count tables have 1206 rows where
    the label table has 561 labels.
- kind: paper_inconsistency
  statement: The Supplemental Methods give 462 regions after excluding tracts, nerves and ventricles from
    the 561, and 431 in the end. The dataset's label table has 64 labels with the Allen colours of fibre
    tracts and ventricles, leaving 497, and the stated exclusions leave 438, so the list of 431 regions
    cannot be rebuilt.
- kind: methods_unavailable
  statement: Question for the authors. Which FRST threshold was used for each hemisphere; which 19 of
    the 22 deposited hemispheres were analysed and why the others were left out; whether the 1.5 IQR outlier
    rule was applied within each genotype or to both pooled; what region size the counts were divided
    by (the region's volume in each hemisphere's label image or the atlas volume); the connectivity used
    for connected components; and the list of 431 regions. Under the readings these leave open, DG-sg
    and DG-po are both significant after correction in 12 of 20 readings on the deposited hemispheres.
