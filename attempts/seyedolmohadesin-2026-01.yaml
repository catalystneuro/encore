findings:
- kind: metadata_error
  statement: Files sub-20220403-h3 (hermaphrodite) and sub-20220403-m3 (male) hold the same
    382-row ActivityTraces table, with identical values and labels. It is the traces of both
    animals, h3's (187 rows) followed by m3's (195 rows, with the male-specific CEM and MCM
    neurons), as the responses show when read with each file's stimulus order. Nothing in the files
    says which rows belong to which animal.
- kind: metadata_error
  statement: The subject sex field is "O" (other) in all 47 files; the sex is given only in the
    subject description ("Adult hermaphrodite." or "Adult male.") and the subject id. The strain
    field is "[]" in every file, though the paper names strain OH16230.
- kind: metadata_error
  statement: The StimulusInfo timestamps are labelled seconds but hold frame numbers (up to 4980 in
    a 31-minute recording at 2.66 volumes/s).
- kind: metadata_insufficient
  statement: The activity traces have no unit and no description beyond "list of reading at each
    frame". Blocks of frames are blank (the first 96 frames in 13 recordings, other ranges of 29 to
    514 frames in seven) without a note of why; they are consistent with the per-recording time
    ranges the paper's code ignores, whose spreadsheet is not public.
- kind: metadata_insufficient
  statement: The identification confidence of each neuron, which the paper's code uses to keep only
    confident identities, is not in the dandiset.
- kind: data_missing
  statement: No tail neuron has a trace, though the paper says tail neurons were recorded and the
    NeuroPAL segmentations identify them. The drop-test behaviour of Figure S1 is not in the
    dandiset.
- kind: other
  statement: The stimulus annotations lie 1 to 3 frames after the fixed onset frames the paper's
    code uses for every recording (1323 presentations 2 frames later, 82 three and 5 one). The traces
    have 4979 frames, two fewer than the 4981 image volumes, and the stated rate is 2.66 volumes/s
    where the Methods give 2.67.
- kind: other
  statement: The traces cover 189 distinct sex-shared neuron names across the 47 animals, where the
    paper says 196 sex-shared neurons were studied.
- kind: data_missing
  statement: In sub-20220327-h2 (the file read for this), the tracked neuron ROIs
    (processing/NeuroPAL/TrackedNeurons/TrackedNeuronROIs, "Neuron centers as tracked throughout
    GCaMP video. Formatted as (x, y, z, t)") have x = y = z = 0 in every sampled ROI (every 997th of
    1130705); only the fourth field, 0 to 4980, varies. The tracked labels include 31 tail neurons
    with one ROI per volume, whose traces are not in the file, so the tracked positions that would
    let them be extracted from the raw volumes are missing.
- kind: methods_unavailable
  statement: Question for the paper's authors. For the motor state from AVA (Methods, Classifying
    motor state), which trace is used (AVAL, AVAR or their mean), how is a change of more than 20%
    measured, is the exponential fitted to the whole trace or to its baseline, and is it divided or
    subtracted? Of the 48 combinations run here (with the two exclusion readings), 36 put the
    interneurons highest for Figures S3F and S3G at q < 0.05 and 12 do not, which leaves that claim
    blocked.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which form of the Cook et al. (2019) connectomes, synapse
    counts or EM serial sections, went into the merged table of Figure 4, and over which values is
    the 95% quantile taken? The mean SEM before normalization matches the Methods' 1.14 with sections
    (1.143) and not with counts (0.69 to 0.71), but neither reproduces the fall to 0.62, and the
    Figure 4G result depends on the choice and on the order of its exclusions.
- kind: other
  statement: The connectome table the paper's code reads (prepared by S.J. Cook) is not in the
    repository or the dandiset, nor are neurons/neuron_classes.json, the per-recording spreadsheet of
    time ranges and ganglia to ignore, or the identification confidences.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which test and which neurons support "no dependence
    on response amplitude as a function of stimulus order" (Figure S2E)? A regression on position
    finds none, while a one-way ANOVA over positions finds one under the Methods' exclusion alone (p
    = 0.034) and not with the code's filters (p = 0.056).
