inputs:
- what: Chemical connectomes of the hermaphrodite (White et al. 1986 as annotated by Cook et al.) and
    the male, as synapse counts (Supplementary Information 3, 41586_2019_1352_MOESM6_ESM.xlsx) and as
    EM serial sections (Supplementary Information 5, 41586_2019_1352_MOESM9_ESM.xlsx), used by the
    connectome claims.
  source: doi:10.1038/s41586-019-1352-7 (Cook et al. 2019, supplementary information)
- what: Synapse count matrices of datasets 7 and 8 (41586_2021_3778_MOESM4_ESM.xlsx), used by the
    connectome claims.
  source: doi:10.1038/s41586-021-03778-8 (Witvliet et al. 2021, supplementary table)
- what: Method details the claims file cites from the paper's code (onset frames of config.py, the
    response windows and baseline of compile_all_traces.ipynb, the code's extra exclusion filters of
    Fig2&3_prepare_data.ipynb, the class collapsing of Fig5.ipynb, the band-pass filter and the
    stimulus series of compile_all_traces.ipynb and Fig4_prepare_data.ipynb). Parameters only; no
    data. The code's four band-pass functions are copied into the notebook to check the helper on a
    toy trace.
  source: https://github.com/venkatachalamlab/whole-brain-chemosensory-responses at commit
    b0dbdbf50c579d056d7991b7612fcff30091ffbd
