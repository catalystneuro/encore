  output: claim:fig1c-beta-alpha-peaks
  notes: Welch spectra (Hamming 256, overlap 128, nFFT 450) averaged over C3 and C4 and over the
    participants of each group. Controls have local maxima at 10.24 Hz and 18.2 Hz. The off
    group's mean spectrum has its only maximum from 6 to 13 Hz at 7.96 Hz, below the 8 to 12 Hz
