findings:
- kind: data_missing
  statement: The manual artifact marks (rejected samples) and the list of excluded noisy
    electrodes that the paper's preprocessing used are not in the dataset; every channels.tsv
    marks all channels good and the events files hold only a start trigger. The paper's code
    loads them from rejectscombined.mat, which is not public. Analyses here run without
    rejection.
- kind: metadata_insufficient
  statement: The questionnaire fields of the beh JSON files (Total UPDRS, UPDRS 18-26, Brady kinesia
    UPDRS, Rigidity UPDRS, Left and Right UPDRS, H&Y, Beck) have no description; the only beh
    sidecar describes a dummy trial column. Which part of the UPDRS "Total UPDRS" covers has to
    be inferred from the values.
- kind: other
  statement: The sub-pd16 ses-on recording, which participants.tsv says was exported from a
    preprocessed EEGLAB file, has electrode standard deviations about six times those of every
    other recording after the same preprocessing (median 62.6 uV), about 100 times their power,
    and no alpha peak; its means are near zero but its channels are not average referenced. The
    dataset does not say how it was processed or scaled. The sub-pd6 ses-on file, also exported
    from EEGLAB, is average referenced and lasts 289 s.
- kind: metadata_insufficient
  statement: The events files hold one trigger (value 1) a few seconds into most recordings, and
    other values in sub-pd16 ses-on (130817) and sub-pd17 ses-off (a second 65536); what the
    trigger marks is not described.
- kind: methods_unavailable
  statement: For the paper's authors. The filter length of the mu/alpha (8 to 12 Hz) phase filter
    for PAC is not given (the Methods give 231 ms for beta; the code has no alpha analysis). With
    192 taps (three cycles of 8 Hz, pacpy's default) or the code's 231 taps, alpha PAC off
    against on is not significant after FDR correction (0.061, 0.078), as Table 1 reports; with
    118 samples it is (0.036). Which length was used?
- kind: paper_inconsistency
  statement: Table 2 gives FDR corrected p = 1 for beta sharpness ratio, beta PAC and alpha
    sharpness ratio, where Benjamini-Hochberg over the six tests of the table, as stated,
    gives smaller values (about 0.36 for the printed p-values); Table 1's corrected values do
    match Benjamini-Hochberg. Table 3 gives d = 0.75 for PAC in all patients where Table 1 gives
    0.83.
