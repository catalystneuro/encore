- claim: fig3a-decoding-above-controls
  outcome: reproduced
  notebook: reproduce_xiao_2026.ipynb
  output: claim:fig3a-decoding-above-controls
  notes: 'Under both classifications and both cross-validations the map, proximity, combined and suppressed-only
    groups exceed the shuffled group (10.99 to 11.26%) and the untuned group (15.25 to 16.55%); every
    one of the 32 pairs has rank-sum p = 1.83e-04 (complete separation of 10 against 10). Methods'' classification,
    10-fold: map 63.09, proximity 46.13, combined 55.29, suppressed-only 29.62%.'
  deviations:
  - The SNR criterion (Methods, Isolation of Single Unit Activity) is not applied, as the processed files
    hold no waveforms; units are the 1,160 that pass the ISI criterion (at most 2% of intervals under
    0.8 ms) and are not low-firing.
  - Distance bins pool every pass inside each 2-mm bin (Methods, Wall Distance Tuning Curve Calculation,
    'uniformly binning distance measurements into nine 2-mm-wide bins'); in the two 1-mm-step sessions
    (20221212_sp_session_2, 20221213_sp_session_2) the deposit's tuning curves use one distance per bin.
  - Paired signed-rank tests truncate each distance bin to the smallest number of passes across bins,
    in time order, taken from the code, which truncates 20221213_sp_session_2 to 17 and 20230131_sp_session_2
    to 19 repetitions (Fig2DEF_Pop_Heatmap_Hist_Pie.m).
  - Signed-rank p-values follow MATLAB signrank (zeros dropped, exact for up to 15 non-zero differences,
    else the normal approximation with continuity correction), a standard choice matching the paper's
    software.
  - The decoders are written in Python from the Methods and Fig3ABC_Decoder_Accuracy_Time_Confusion_Avg.m;
    the Neural Decoding Toolbox (MATLAB) is not run. As in the toolbox's standard use by the code, features
    are z-scored with the training set and each time bin is trained and tested on itself.
  - For the Methods' 10-fold cross-validation the 135 pseudo-trials (15 per distance) are split at random
    into 10 folds stratified by distance, as the Methods do not say how 15 trials per distance form 10
    folds; the code's 15 splits are run too.
  - A group with fewer than 118 units is used whole in each subsample (suppressed-only under the Methods'
    classification, 90 units). The shuffled group permutes each unit's passes across distances in every
    resample; the code permutes them once per subsample.
