  output: claim:figs4j-ventral-location
  notes: 'Of 1,082 Poly2 units passing the criteria (the paper''s legend gives 1,050), 1,075 have at least
    20 spikes in the sampled chunks. Methods'' reading: median depth 400 um for 978 responsive and 525
    um for 97 unresponsive units (rank-sum p = 1.38e-07), proximity and map medians 300 and 300 um; fraction
    responsive 0.955 in 0-400 um against 0.872 in 400-800 um, fraction proximity or map 0.577 against
