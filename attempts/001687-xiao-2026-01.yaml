- claim: si-unit-yield
  outcome: reproduced
  notebook: reproduce_xiao_2026.ipynb
  output: claim:si-unit-yield
  measured:
  - 1160
  - 36
  notes: The deposit holds all 1,358 sorted units from 36 mice. 1,188 are not low-firing (the same 170
    low-firing units as the deposit's low_firing column), and 1,160 of these have ISI false alarms at
    most 2%, within 114.1 of 1,141; all 36 mice keep at least one unit. The SNR criterion would remove
    at most 19 more if the paper's count is exact; it cannot be applied here.
  deviations:
  - The SNR criterion (Methods, Isolation of Single Unit Activity) is not applied, as the processed files
    hold no waveforms; units are the 1,160 that pass the ISI criterion (at most 2% of intervals under
    0.8 ms) and are not low-firing.
- claim: fig2-wall-responsive-counts
  outcome: not_reproduced
  notebook: reproduce_xiao_2026.ipynb
  output: claim:fig2-wall-responsive-counts
  measured:
  - 1061
  - 751
  - 657
  - 347
  notes: Under the Methods' uncorrected one-tailed tests (p < 0.05 at any of nine distances, each direction)
    1,061 of 1,160 units are responsive, 751 activated, 657 suppressed and 347 both, all outside tolerance.
    The code's variant (BH-FDR across the nine distances) gives 782, 541, 337 and 96, all within tolerance,
    and reproduces the deposit's own labels unit for unit except for about 40 units that the deposit excludes
    (23 of them fail the ISI criterion). The claims file's main reading for responsiveness is the Methods'
    uncorrected test; a question to a reader asks whether the code's BH-FDR test, which gives the paper's
    counts, should be the main reading (questions/001687.yaml).
  deviations: &id001
  - The SNR criterion (Methods, Isolation of Single Unit Activity) is not applied, as the processed files
    hold no waveforms; units are the 1,160 that pass the ISI criterion (at most 2% of intervals under
    0.8 ms) and are not low-firing.
  - Distance bins pool every pass inside each 2-mm bin (Methods, Wall Distance Tuning Curve Calculation,
    'uniformly binning distance measurements into nine 2-mm-wide bins'); in the two 1-mm-step sessions
    (20221212_sp_session_2, 20221213_sp_session_2) the deposit's tuning curves use one distance per bin.
  - Paired signed-rank tests truncate each distance bin to the smallest number of passes across bins,
    in time order, taken from the code, which truncates 20221213_sp_session_2 to 17 and 20230131_sp_session_2
    to 19 repetitions (Fig2DEF_Pop_Heatmap_Hist_Pie.m).
  - Signed-rank p-values follow MATLAB signrank (zeros dropped, exact for up to 15 non-zero differences,
    else the normal approximation with continuity correction), a standard choice matching the paper's
    software.
