findings:
- kind: data_missing
  statement: The dandiset holds only the wild-type silicon-probe recordings (67 sessions, 36 C57 mice,
    1,358 units). The tungsten recordings, the SpVi-TeLC and GtACR mice, the anesthetized and single-row
    video sessions and all tracked whisker kinematics of the paper are absent, so 16 of the 41 claims
    cannot be tested here. The dandiset's description names local and long-range inhibition perturbations,
    which are not in it.
- kind: metadata_insufficient
  statement: In the 25 whisker-cutting sessions the processed files hold only the full-array passes, and
    trial_condition is empty in every file. The post-cut passes are listed only in the raw files' wall_pass_epochs,
    with no wall distance; the trial log holds the pre-cut sequence only, and the raw wall-actuator line,
    described as the only raw record of wall distance, takes the same two levels at every distance.
- kind: selection_undocumented
  statement: 'The paper''s whisker-cutting population (195 units with stable waveforms from 18 mice) cannot
    be identified: the deposit has 25 cutting sessions from 25 mice with 445 units, no waveform-stability
    flag and no list of the sessions used.'
- kind: metadata_insufficient
  statement: The processed files carry no isolation metrics (SNR, ISI false-alarm rate), no 'acceptable'
    flag and no waveforms or peak channels, so the paper's unit criteria (1,141 of 1,358) and unit depths
    can be recomputed only in part, or from the raw voltage. The deposit's wall_responsive labels already
    exclude units that fail isolation (no labelled-responsive unit has ISI false alarms above 2%), without
    saying so.
- kind: metadata_error
  statement: 'In 20230711_sp_session_1 and 20230608_sp_session_1 the full-array trials table (200 passes
    each) runs past the longest gap between raw passes, in which the session notes place the cutting (49:18-57:15
    and 51-62 min): its trials match raw passes 21 to 220 and 51 to 250, so 20 and 50 of the passes used
    for the full-array tuning were recorded after the cut, if the notes are right. The deposit''s alignment
    of distances to passes is otherwise consistent: realigning to raw passes 1 to 200 abolishes the tuning.'
- kind: code_mismatch
  statement: The Methods give the responsiveness test as one-tailed signed-rank tests at p < 0.05 per
    distance without correction, while Fig2DEF_Pop_Heatmap_Hist_Pie.m corrects the nine p-values of each
    direction with BH-FDR. The paper's counts (768 responsive, Figure 2F) and the deposit's per-unit labels
    follow the corrected test; the uncorrected test marks 1,061 of 1,160 units responsive.
- kind: other
  statement: In the two 1-mm-step sessions (20221212_sp_session_2, 20221213_sp_session_2; 38 units) the
    deposit's stored tuning curves use one of the two distances in each 2-mm bin, while the Methods bin
    all distance measurements into 2-mm bins. For the other 65 sessions the stored curves equal the rates
    computed from the spike times, except for one unit in each of 10 sessions.
- kind: code_mismatch
  statement: In Fig3ABC_Decoder_Accuracy_Time_Confusion_Avg.m at commit b1a9f3c, the branch that builds
    the combined 'map + proximity' subsamples draws 36 map and 82 proximity units but does not update
    rand_unit_names, which selects the saved units, so as published it would save the previous population's
    units, not the drawn mixture. The paper's combined-group results load files of another run date, and
    the mixture drawn here gives values close to the paper's (55.29 to 62.64% against 58.55%).
- kind: paper_inconsistency
  statement: The text gives 656 distance-tuned units (472 activated + 213 suppressed - 29 both), while
    Figure 2F's 177 untuned units of 768 imply 591. With the code's test the data give 600 tuned and 182
    untuned units, consistent with Figure 2F, and 92 units both activated and suppressed among tuned units,
    against 29 in the text.
