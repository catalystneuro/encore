- claim: cell-counts
  outcome: reproduced
  notebook: reproduce_pasquereau_2013.ipynb
  output: claim:cell-counts
  measured: [115, 157, 51, 54, 32, 48, 3]
  notes: Monkey V units with at least 5 perturbations of each direction number 115 before and 157
    after MPTP, with 51 and 54 PTNs and 32 and 48 CSNs, all within tolerance of 112 and 159, 49 and
    54, 31 and 48. The files hold 3 units activated from both the peduncle and the putamen, all in
    monkey V and all among the cells studied. Same outcome as 001636-pasquereau-2013-01, whose counts
    were exactly the table's. The draft adds the trials of the second source file of 12 units, which
    brings v1902.1, v2701.1 and v3607.1 (two PTNs and a CSN, pre-MPTP) to the threshold, and stores the
    two unit copies of repeated files once (v4527b.2, a PTN, and v5812.2, no_response, are gone; v4527.2
    changes from not_tested to PTN); the notebook lists every unit that differs between the versions.
    Counting each unit from its first source file only gives 112 and 157, with 49 and 54 PTNs and 31
    and 48 CSNs.
  deviations:
  - The paper's location and isolation criteria cannot be applied; the units in the dandiset are
    taken as the selected units.
  - Perturbations are counted within each unit's obs_intervals, as the draft observes a unit only in
    the trials of its own source files; counting all perturbations of the session selects the same
    units. Units recorded across two source files are one cell, as the dataset states; counting them
    from their first file only is shown as a variant.
