findings:
- kind: data_missing
  statement: Still present since 001636-pasquereau-2013-01. The monkey L (Leu) files mark no torque
    perturbation; torque_perturbation_type is not_available in every Leu trial, the Leu torque
    command is NaN in every pre-MPTP file, and 15 of 50 post-MPTP Leu files have no analog data. The
    draft's description and the files now say the Leu source files contain no perturbation times.
    The monkey L half of the paper (115 and 73 cells, and its EMG and kinematics) cannot be tested.
- kind: other
  statement: Partly fixed since 001636-pasquereau-2013-01. The torque command's 50 ms pulse still
    has three session sizes (about 46, 91 and 183 units above rest); most pre-MPTP monkey V sessions
    have the smallest (105 of 154) and most post-MPTP sessions the largest (125 of 137), post-MPTP
    pulses are followed by an opposite swing, and within post-MPTP sessions the step varies from
    trial to trial. The torque description now states all of this and that no conversion to
    newton-metres is available. The paper describes one 0.1 Nm, 50 ms impulse; whether the torque or
    only its command changed cannot be told, and movement and EMG results differ between command
    sizes.
- kind: other
  statement: Partly fixed since 001636-pasquereau-2013-01. The EMG description now gives the
    paper's processing (rectified, low-pass filtered at 100 Hz) where it said sample-hold
    integrated; the values are unchanged. The monkey L analog streams are still sampled at 100 Hz
    (the paper says 200 Hz) and the EMG is in uncalibrated A/D units, both now stated in the
    dandiset's description.
- kind: other
  statement: Still present since 001636-pasquereau-2013-01, now stated in the dandiset's
    description. The torque onset comes 1.696 to 1.732 s after center_target_appearance_time in 90%
    of monkey V perturbations, where the Methods put it 1 to 2 s after center capture at random.
- kind: methods_unavailable
  statement: Still present. No analysis code is published. The response detection as described
    gives a false-positive rate of 0.23 over the 200 ms epoch, against the 0.01 its threshold
    implies, and stationary Poisson spike trains give 0.16 to 0.21, most of it, so the paper's exact
    procedure cannot be recovered, and single-trial latencies are not defined.
- kind: paper_inconsistency
  statement: Still present. The pre-MPTP PTN and CSN resting rates are 16.3 and 3.6 spikes/s in the
    text and 18.3 and 3.2 in Table 1. Table 1 marks the CSN change in the fraction of excitatory
    responses p < 0.01, but its own counts (23 of 24 against 19 of 22) give p = 0.54 with the
    Yates-corrected chi-square test that reproduces its other chi-square values.
- kind: other
  statement: New. Three monkey V sessions (v1401, v1402, v1501) have 51 labelled perturbations but no
    pulse in the torque command, as the draft's torque description says. Their perturbations are
    kept here, as the command is not used to select trials.
- kind: code_mismatch
  statement: New. The dandiset names catalystneuro/turner-lab-to-nwb as the code that compiled it,
    but the repository's main branch is still at e80a192917490b50db6871180b6d1d9a24772e35, read for
    001636-pasquereau-2013-01, and does not hold the code that built the draft (merged sessions,
    obs_intervals, the new unit names and descriptions). That code is in open pull request 33,
    branch fix_errors at 5f9bf6320a0160e4e56301d5409fb9242c1d8cf4.
