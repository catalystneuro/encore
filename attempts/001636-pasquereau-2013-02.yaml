# Status of the findings of 001636-pasquereau-2013-01 on the draft (outputs in the notebook's data check):
# - No torque perturbation in any monkey L file (data_missing): still present; the description and the
#   files now say so. Recorded below.
# - Analog streams not on the clock of the trials (format_error): fixed. Each analog segment starts at
#   its trial's start (lag 0 ms at every perturbation), and on the stored clock the torque command steps
#   4 to 6 ms after the labelled onset.
# - Three torque command sizes, differing between the states (other): partly fixed. The data are the
#   same; the torque description now states the sizes, the post-MPTP trial-to-trial variation and the
#   missing scale. Recorded below.
# - Angle reference frame says positive is extension; series named Elbow for monkey L (metadata_error):
#   fixed. The reference frame says positive is flexion in all 424 files with an angle, as the values
#   show, and the monkey L series are WristAngle and WristTorque.
# - Four files repeating another's trials, two unit copies with different projection types
#   (metadata_error): fixed. No file repeats another's trials; the copies are stored once (v4527.2 and
#   v5811.2, both PTNs), and the files' notes say which label was kept.
# - unit_also_in_session_id with wrong prefixes, absent files and other units (metadata_error): fixed.
#   The column is in no file; neurons recorded across two source files are one unit observed in the
#   trials of both (13 units).
# - Dandiset description (systemic MPTP, elbow for both monkeys, Leu in 1993) (metadata_error): fixed.
#   It now says intracarotid MPTP, wrist for Leu, and Leu from August 1992 to December 1993, as the
#   files' dates are.
# - Monkey L analog at 100 Hz, EMG described as sample-hold integrated, A/D units (other): partly fixed.
#   The EMG description now gives the paper's processing; 100 Hz and A/D units remain, now stated in
#   the description. Recorded below.
# - Torque onset 1.70 to 1.73 s after the center target appears (other): still present, now stated in
#   the description. Recorded below.
# - No analysis code; detection false-positive rate near 0.2 (methods_unavailable): still present (the
