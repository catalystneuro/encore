- claim: kinematics-slower
  outcome: not_reproduced
  notebook: reproduce_pasquereau_2013.ipynb
  output: claim:kinematics-slower
  measured: [28.11, 14.56]
  notes: Over 291 monkey V sessions, torque-induced movements are faster and larger after MPTP;
    session-mean peak velocity +28.1% and amplitude +14.6% (flexion +29.7% and +11.4%), MPTP F = 98.6
    and 24.1, p < 0.0001. The torque command's pulse is about four times larger in most post-MPTP
    sessions; in the sessions with the same command size (43 pre, 12 post) the increases are +98.2%
    and +109.0%. The mean of the session-mean peak velocities is 59.0 deg/s, and only one response
    comes from a session in the paper's 130 to 200 deg/s window of matched sessions; mean
    displacements (3.10 deg) are smaller than its 10 deg. The angle's scale agrees with the files'
    own kinematic columns (active movements measured here within 2% of derived_peak_velocity and
    derived_movement_amplitude), so the small movements are in the data. Compared trial by trial at
    the same command step, the change is mixed; at twice the smallest step flexion movements are
    faster after MPTP (median 31.5 against 112.4 deg/s, p < 0.0001) and extension movements do not
    differ (p = 0.37 and 0.20); at the smallest step extension movements are slower and smaller after
    MPTP (43.6 against 13.7 deg/s, 36 post-MPTP trials). The torque command differs
    between the states, so the change cannot be attributed to MPTP. Same outcome as
    001636-pasquereau-2013-01; the sessions are now 291 (the repeated files are folded into the
    sessions they repeat, and none is left out).
  deviations:
  - Monkey V only; the paper's ANOVA has animal as a third factor.
  - The peak velocity and amplitude windows (0 to 200 and 0 to 300 ms) and the FIR length are
    choices; the Methods give the filter and velocity threshold only.
  - Perturbations with the joint moving before onset (503 of 5550) are kept.
- claim: kinematic-latency-unchanged
  outcome: not_reproduced
  notebook: reproduce_pasquereau_2013.ipynb
  output: claim:kinematic-latency-unchanged
  notes: Movement onset is earlier after MPTP (session means 9.65 and 3.05 ms for flexion, 10.86 and
    5.82 ms for extension; MPTP F = 1037, p < 0.0001), with an MPTP by direction interaction (F =
    18.5; the paper reports F > 94). In sessions with the same command size it does not differ
    (7.68 and 7.62 ms, p = 0.83). The zero-phase filter can move an onset earlier, and 241 of 5550
    perturbations have a latency of 0 ms. With a causal 10 ms average of the unfiltered velocity
    the session means are 12.5 to 18.5 ms and still shorter after MPTP (F = 791). On synthetic
    movements the filtered latency is 14 ms early to 5 ms late against the true start, and the causal
    one 1 to 13 ms late. At the same per-trial command step latencies are not shorter after MPTP
    (twice the smallest step, flexion 7.17 and 7.17 ms, p = 0.96; extension 7.99 and 9.00 ms, p =
    0.0023; causal measure longer after MPTP by under 1 ms, p <= 0.0001). Without the
    trials already moving before onset F = 1043 (filtered) and 762 (causal). At the middle command
    size the causal variant gives p = 0.25, and 0.025 without the trials moving before onset. The
    difference goes with the torque command, so it cannot be attributed to MPTP. Same outcome as
    001636-pasquereau-2013-01.
  deviations:
  - Monkey V only.
  - Zero-phase (forward and backward) filtering; the Methods do not say how the filter was
    applied.
