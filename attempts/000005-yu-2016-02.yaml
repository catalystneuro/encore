- claim: exc-inhibition-whisking
  outcome: blocked
  blocked_by: data_missing
  notes: Depends on exc-inhibition-timing; the same 6 depolarized recordings are missing. New claim.
- claim: fs-touch-response
  outcome: partially_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:fs-touch-response
  measured: [8.53, 1.5, 5.23]
  notes: 17 FS cells with a principal whisker (paper 26). Nonwhisking rate 8.53 spikes/s and latency
    5.23 ms (bin edge) or 5.73 ms (centre) over 13 cells are within tolerance; spikes per touch 1.50
