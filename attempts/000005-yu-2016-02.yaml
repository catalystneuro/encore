- claim: fs-vm-touch-whisking
  outcome: not_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:fs-vm-touch-whisking
  measured: [5.56, 1.88, 2.54]
  notes: 5 whole-cell FS cells (paper 7). Touch amplitude 5.56 mV and whisking depolarization 2.54 mV
