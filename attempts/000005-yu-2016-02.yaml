- claim: exc-vm-touch-whisking
  outcome: partially_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:exc-vm-touch-whisking
  measured:
  - -61.69
  - 7.68
  - 4.78
  - 0.83
  notes: 51 whole-cell excitatory cells (the paper has 37 control cells); 48 have at least 5 touches,
    and all 48 have a positive touch PSP and a latency. Resting Vm mean -61.69 mV (O4 a; -61.89 O4 b)
    is within tolerance under every reading. The touch amplitude (4.78 mV) and the latency (7.68 ms with
    dVm/dt at the sampling rate, median 4.90) are outside tolerance and do not depend on the whisking
    readings. A diagnostic shows that the latency rule picks single-sample excursions of dVm/dt in 5 cells
    (under 1 ms) and late crossings in others (up to 101 ms); subtracting the baseline's mean dVm/dt,
    which decides nothing, gives 7.48 ms. Under the 16 combinations of O10, O11 and the two filters, the
    whisking change with the onset windows (reading a) ranges from 0.65 to 0.87 mV and is within 1.2 +-
    0.35 in 2 (zero-phase, O10 a, O11 b-i 0.87 mV and b-ii 0.86 mV); the measured value, 0.83 mV, is the
    first reading the criterion lists (zero-phase, O10 a, O11 a-i), outside tolerance,
    and with the epochs (reading b) it is 1.08 to 1.14 mV, within tolerance in all 16. Without the 8 cells
    of the flagged mice the amplitude is 5.54 mV and the latency 4.97 ms, both within; that variant does
    not decide. Amplitudes go down to 0.01 mV, so that every neuron depolarizes is a weak test. Trials
    of the PV-ChR2 cell held near 0 mV are left out, and its resting Vm is -38.8 mV. The 26 VGAT-ChR2
    cells with too few pulses to tag count as excitatory and include a whole-cell cell with 11,087 spikes
    0.37 ms wide, likely FS, so the group probably holds some FS cells. New claim.
  deviations:
  - The group includes the whole-cell cells of ION-cut mice, which the files do not mark, and 4 more PV-IRES-Cre
    whole-cell cells than Supplementary Table 2 counts.
  - Under O11 the 250 ms touch-free rule of whisking onsets uses the touches of the whiskers the reading
    names; the main rule (every tracked whisker bounding the epochs, principal-whisker touches in the
    250 ms rule) is shown beside them.
  - Trials whose median Vm is above -20 mV (13 trials of the PV-ChR2 cell, held near 0 mV by current)
    are left out at rest, a standard choice.
