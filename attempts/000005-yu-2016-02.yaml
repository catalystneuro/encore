    4,147 and 4,173, and no reading gives the paper's counts (the nearest, 5,212 and 5,149, come from
    reading a with every trial). Performance averages 0.681 under (x) and 0.694 under (y) over all 122
    cortical cells, within tolerance (0.703 and 0.718 without the flagged mice, a variant that no longer
    decides), and 0.585 over the 29 VPM units under both (the VPM sessions have no light), outside 0.71
    +- 0.071. New claim.
