- claim: exc-mainly-touch
  outcome: not_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:exc-mainly-touch
  measured: [0.319, 1.527, 3.549]
  notes: The 97 excitatory cells fire more during whisking than without it (signed-rank p = 9.1e-07
    zero-phase, 7.4e-06 forward; higher in 55 and 51), so the paper's test finds a difference where
    the paper found none (P = 0.20). Spikes per touch 0.319 is within tolerance; the nonwhisking (1.53)
    and whisking (3.55 spikes/s) rates are above 0.4 and 0.6. Cell-attached cells fire more than
    whole-cell ones (2.45 against 0.70 spikes/s without whisking). The earlier attempt also found it
    not reproduced, under a touch-selectivity index the paper does not use (one-sided p = 0.074 and
    0.090); the same outcome now comes from the paper's own test of whisking against nonwhisking rate.
  deviations:
  - The group holds 97 cells against 85, with the excitatory cells of ION-cut mice and the VGAT-ChR2
    cells never tested with isolated pulses; FS cells that the rules cannot find (the fourth PV cell,
    and 5 of the 29 VGAT-ChR2 FS cells of Supplementary Table 2 that no test here finds driven) may be
    among them.
