outcomes:
- claim: behavior-touches
  outcome: partially_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:behavior-touches
  measured: [6.04, 0.85, 0.703, 0.585]
  notes: Under reading (b), all sessions and principal-whisker touches, mice touch the pole 6.04 times
    per lick trial (9,794 trials) and 0.85 times per no-lick trial (8,223 trials), both within
    tolerance; no other reading puts both counts within tolerance. Performance averages 0.703 over
    109 cortical cells (flagged mice left out; 0.695 over all 122 cells), within tolerance, and 0.585
    over the 29 VPM units, outside 0.71 +- 0.071. The trial counts match 4,147 and 4,173 under no
    reading. New claim.
  deviations:
  - The criterion does not say whether light trials count; every trial is counted. Without the light
    trials the counts are 5.74 and 0.80 and the no-lick count is outside tolerance, which would make
    the claim not reproduced; this is asked in questions/000005.yaml.
  - The 111 control cortical cells of reading (a) cannot be identified, as the files do not mark the
    ION-cut mice; the cells of the 4 flagged mice are left out for reading (a).
- claim: vpm-touch
  outcome: not_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:vpm-touch
  measured: [0.403, 0.268, 6.14, 2.5]
  notes: Over the 29 VPM units, spikes per touch (0 to 25 ms after minus 0 to 25 ms before onset,
    principal-whisker touches with ITI of at least 25 ms) average 0.403, median 0.268, outside 0.6 +-
    0.093 and 0.4 +- 0.04. 25 units pass the latency exclusion; the latency (bin centre) has mean
    6.14 ms and median 2.5 ms (bin edge 5.64 and 2.0 ms), one unit at 71.5 ms. The earlier attempt
    found this claim reproduced under its own criterion (a fraction of units with a one-sided test at
    p < 0.01, 0.83); the new criterion tests the paper's spikes per touch and latency, and the files'
    one principal whisker per file lowers the spikes per touch (11 of 20 units in files with several
    whiskers respond most to another whisker; each unit's best whisker gives a mean of 0.485, a
    selection biased upward that the criterion does not make).
  deviations:
  - The files give one principal whisker per VPM file, though the session description says each unit
    has its own; the file's principal whisker is used for every unit.
  - The bin position of the latency (edge or centre) is not fixed; both are shown and the outcome
    holds under both.
- claim: vpm-whisking
  outcome: partially_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:vpm-whisking
  measured: [24, 3.76, 1.71, 11.54]
  notes: The whisking rate exceeds the nonwhisking rate over the 29 units (signed-rank p = 5.2e-08
    zero-phase, 7.1e-08 forward; higher in 28). Significant increases number 24 and 25 (zero-phase,
    per-epoch and per-trial samples), 21 and 24 (forward); 21 is outside 25 +- 2.5. Mean nonwhisking
    rate 3.76 and 3.93 spikes/s and median 1.71 and 1.72, outside tolerance; mean whisking rate 11.54
    (within) and 11.01 (outside). The earlier attempt found this reproduced under its own criterion (a
    phase-modulation test, 0.88 of units); the new criterion asks for the paper's rates, which are
    lower here.
- claim: vpm-whisking-phase
  outcome: reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:vpm-whisking-phase
  measured: 25
  notes: 25 (zero-phase) and 27 (forward) of 29 units have r2 > 0.25 for a sinusoid fit of rate in 12
    phase bins. With spikes moved to the next trial, 16 of 29 units also pass, so the r2 threshold
    marks more than half of the units on a null; the criterion does not ask for a null. New claim.
- claim: exc-vm-touch-whisking
  outcome: partially_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:exc-vm-touch-whisking
  measured: [-61.61, 7.68, 4.77, 0.86]
  notes: 51 whole-cell excitatory cells (the paper has 37 control cells); 48 have at least 5 touches,
    and all 48 have a positive touch PSP and a latency. Resting Vm mean -61.61 mV (O4 a; -61.88 O4 b)
    and the whisking change 0.86 mV (onset windows, zero-phase) or 1.09 mV (epochs) are within
    tolerance; the forward filter gives 0.75 mV with the onset windows, outside. The touch amplitude
    (4.77 mV) and latency (7.68 ms at the full sampling rate, median 4.90) are outside tolerance.
    Without the 8 cells of the flagged mice the amplitude is 5.53 mV and the latency 4.97 ms, both
    within; that variant does not decide. New claim.
  deviations:
  - The group includes the whole-cell cells of ION-cut mice, which the files do not mark, and 4 more
    PV-IRES-Cre whole-cell cells than Supplementary Table 2 counts.
  - The resolution of dVm/dt for the latency is not fixed by the claims file; the full sampling rate
    is used (the claims file's reading of an unsmoothed first difference), and 1 ms bins (mean 14.85
    to 15.35 ms) are shown. Asked in questions/000005.yaml.
- claim: exc-threshold-touch-vs-whisking
  outcome: partially_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:exc-threshold-touch-vs-whisking
  measured: [0.74, 4.36]
  notes: Over 50 whole-cell excitatory cells the touch shift exceeds the whisking shift in 43
    (signed-rank p = 1.9e-09 zero-phase, 1.3e-10 forward). Means, whisking 0.74 mV (zero-phase,
    outside 1.1 +- 0.33) or 0.90 mV (forward, within), touch 4.36 or 4.42 mV (outside 6.1 +- 0.61).
    The two threshold readings O3 give the same values. 17 cells have no spikes and take the default
    threshold of -42 mV. New claim.
- claim: exc-effective-reversal
  outcome: reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:exc-effective-reversal
  notes: Per neuron (48 with both fits) the touch reversal (median -50.0 mV) lies above the whisking
    reversal (median -58.5 zero-phase, -59.8 forward) in 39 and 38 neurons and above the median
    resting Vm (-63.9 mV). Pooled fits give -31.25 mV for touch and -54.98 or -56.05 mV for whisking.
    New claim.
