- claim: pv-enphr-suppression
  outcome: partially_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:pv-enphr-suppression
  measured: 3
  notes: 3 PV cells are identified by their inactivation (the paper has 4), and all 3 are strongly
    inhibited (light rate below the lower bound of the control 95% interval in nonwhisking and
    whisking periods); the fourth PV cell cannot be found, and the count is partly circular since the
    cells are found by their inactivation. In the grand average PSTH aligned to laser onset the
    dPSTH/dt rule finds no fall for the 3 PV cells and a rise at 48 ms for the 42 excitatory cells, so
    neither latency is within tolerance. New claim.
  deviations:
  - The latency rule for laser onset is the Methods' spike-latency rule, an assumption the claims file
    states. The PV grand average rises in the first 3 ms after onset (66.5 spikes/s at 1 ms) before
    falling to 0, possibly an onset artifact.
- claim: fs-suppress-movement-spiking
  outcome: partially_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:fs-suppress-movement-spiking
  measured: [1.256, 2.263, 3.953, 6.135]
  notes: In the 42 excitatory cells of PV-IRES-Cre mice (paper 40) the light raises the nonwhisking
    rate (33 cells, p = 6.2e-05) and the whisking rate (33 cells, p = 7.4e-05), with the same result
    under every window and filter reading (Kruskal-Wallis p = 0.00011, reported only). The rates are
    higher than the paper's (from 1.26 to 2.26 and from 3.95 to 6.14 spikes/s, zero-phase filter and
    control in the light span, against 0.6 to 1.6 and 0.8 to 2.7), outside tolerance. The earlier attempt found this reproduced from 7 whole-cell cells inside
    the light (6 of 7 rising, p = 0.016); the new criterion uses all excitatory cells and also tests
    the paper's rates, which are not matched.
- claim: fs-enhance-touch-selectivity
  outcome: partially_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:fs-enhance-touch-selectivity
  notes: With the light, whisking rates exceed nonwhisking rates (33 of 42 cells, p = 2.2e-06), as the
    paper reports (P = 0.02), but in control trials they do too (31 of 42, p = 3.3e-05), where the
    paper found none (P = 0.55); same under every reading. The earlier attempt found it not reproduced
    by a touch-selectivity index the paper does not use; the new criterion is the paper's test of
    whisking against nonwhisking rate, whose first part holds.
- claim: exc-touch-spikes-enphr
  outcome: not_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:exc-touch-spikes-enphr
  measured: [0.339, 0.448]
  notes: Spikes per touch (4 to 20 ms after minus 0 to 16 ms before, ITI of at least 10 ms) rise with
    the light from 0.339 to 0.448 (40 cells, signed-rank p = 0.044, control in the light span) or from
    0.304 to 0.442 (41 cells, p = 0.0091, control anywhere), so the test finds a change. Cells below
    the median control response rise by 0.123 on average, cells above it by 0.095. New claim.
- claim: auc-weak-strong
  outcome: reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:auc-weak-strong
  notes: Cells whose AUC rises with the light have a lower control touch-evoked rate than cells whose
    AUC falls, 5.93 against 10.87 spikes/s (reading a, 23 and 12 cells) and 8.14 against 8.18 (reading
    b, 17 and 16). The difference under (b) is small and no rank-sum test separates the groups (p =
    0.37 and 1, reported only). New claim.
- claim: auc-groups
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The two readings of the no-touch windows that the criterion names give different outcomes.
    Under (a) the increased-AUC group's response rises (9.99 to 15.16 spikes/s, p = 4.9e-05), the
    reduced-AUC group's does not change (15.98 to 17.85, p = 0.11) and its baseline rises (5.11 to
    12.08, p = 0.0049), with group sizes 23 and 12 and rates outside tolerance (partially reproduced).
    Under (b) the reduced-AUC group's response changes (12.37 to 14.95, p = 0.021), so it is not
    reproduced. New claim.
- claim: behavior-false-alarms
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The claims file does not say whether the chi-squared test is corrected for continuity, and
    the readings give different outcomes. Of 9 PV-IRES-Cre mice with the light (the paper tested 8),
    a significant decrease of no-lick performance is found in 4 (trials pooled, Yates) or 5 (any
    session, Yates), and 5 or 6 without the correction; none shows a significant increase. Asked in
    questions/000005.yaml. New claim.
findings:
- kind: metadata_insufficient
  statement: Still present from 000005-yu-2016-01. No L4 file names the cell type of its neuron; the
    cell types the paper compares can only be inferred from light tagging, waveforms and light
    inactivation.
- kind: metadata_insufficient
  statement: Still present from 000005-yu-2016-01. No file marks the 9 ION-transected mice, and the
    files hold no surgery or notes field; the ION-cut claims cannot be tested and their cells sit in
    every control group.
- kind: metadata_error
  statement: Still present from 000005-yu-2016-01. The genotype is missing for the 6 VPM mice and 3 L4
    mice (anm260074, anm223517, anm250509), and the 5 SOM-IRES-Cre x Ai32 mice are given as Ai32.
- kind: metadata_insufficient
  statement: Still present from 000005-yu-2016-01. Every L4 file gives cortical layer 4 (depth 0.42 to
    0.62 mm), so the layer of each cell cannot be checked.
- kind: metadata_insufficient
  statement: Still present from 000005-yu-2016-01. The optogenetic conditions are not described.
    photo_stim_mode and type have empty descriptions and the mode labels do not map to one kind of
    light, photo_stim_power is NaN in every L4 file, and no file names the opsin (eNpHR3.0 in the
    PV-IRES-Cre mice).
- kind: metadata_error
  statement: Still present from 000005-yu-2016-01. The session description gives the wrong recording
    mode for 24 of 130 L4 files, all from PV-IRES-Cre mice; by the trace PV-IRES-Cre has 9 whole-cell
    and 39 cell-attached cells where Supplementary Table 2 has 5 and 42.
- kind: metadata_error
  statement: Still present from 000005-yu-2016-01. In the L4 files the trial table's first_touch_time
    is the trial start plus the first-touch latency divided by 1000 (it matches the touch series in
    0.956 of trials once multiplied by 1000); in the VPM files it is correct.
- kind: metadata_insufficient
  statement: Still present from 000005-yu-2016-01. The L4 trace is sampled at 10 kHz (92 files) or 20
    kHz (38 files), which only the timestamps state.
- kind: metadata_insufficient
  statement: Still present from 000005-yu-2016-01. 8 files name no principal whisker, and the VPM files
    give one principal whisker per file though the session description says each unit has its own; 11
    of 20 units in files with several tracked whiskers respond most to another whisker.
- kind: other
  statement: Still present from 000005-yu-2016-01. In VGAT-ChR2 mice the light at the site labelled VPM
    is given as 594 nm, and isolated pulses at the site labelled vS1 (594 nm) drive 13 VGAT-ChR2 cells
    at 1.6 to 4.6 ms; ChR2 needs blue light, so the wavelengths look wrong.
- kind: methods_unavailable
  statement: Still present from 000005-yu-2016-01. Neither the paper nor the dandiset links analysis
    code. This attempt read the full text, supplied to it, which gives the windows and rules the earlier
    attempt lacked; the claims file found no code at CRCNS ssc-7.
- kind: metadata_error
  statement: New. The injected current (CurrentClampStimulus) has unit amperes and conversion 1e-6,
    but the end-of-trial test pulse, -0.1 nA in the Methods, is stored as about -0.1, so the stored
    values are in nA and the conversion is wrong by a factor of 1,000.
- kind: data_missing
  statement: New. The dandiset lacks data the paper reports from these experiments, namely the 6 L4
    excitatory neurons recorded with depolarizing current (Fig. 3; only one whole-cell file, of the
    PV-ChR2 cell, has trials held near 0 mV), the 17 thalamic multiunit recordings during
    photoinhibition (Fig. 6b,c), and the rabies tracing histology (Supplementary Fig. 10).
- kind: other
  statement: New. The pulse trains at the site labelled VPM run at 50 Hz in 12 of 33 files, where the
    Methods give 100 Hz.
- kind: metadata_insufficient
  statement: New. The no-lick trial type is spelled Nogo in some files and NoGo in others, and the type
    and response columns have empty descriptions.
