- claim: fs-whisking-rate
  outcome: partially_reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:fs-whisking-rate
  measured: [13, 2, 19.02]
  notes: Over 17 FS cells the whisking rate exceeds the nonwhisking rate (signed-rank p = 0.00029
