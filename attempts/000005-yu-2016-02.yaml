- claim: fs-touch-and-whisking
  outcome: reproduced
  notebook: reproduce_yu_2016.ipynb
  output: claim:fs-touch-and-whisking
  notes: 11 or 12 of 17 FS cells (0.65 to 0.71) have spikes per touch with a 95% interval above zero
