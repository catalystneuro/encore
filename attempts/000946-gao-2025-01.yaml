findings:
- kind: data_missing
  statement: 'The spike waveforms are not in the dataset, and the RSU/FSU cell types are not either: no file has waveforms
    or mean waveforms, and acquisition, analysis and processing are empty in all 1550 unit files. The paper types every
    S1 and POm unit from its waveform (Methods, Neuronal type classification), so 30 of the 33 claims (all those on RSU
    or FSU responses or their correlations) cannot be tested, and the RSU/FSU split of the two count claims cannot be
    tested either.'
- kind: metadata_error
  statement: The units column celltype_label is described as label 1 = RSU, label 2 = FSU, but it is 0 for every unit
    in the 1516 unit files that have it; 34 unit files have no such column.
- kind: other
  statement: 734 of the 1550 unit files are second (or third) copies of another file, with identical spike times and
    trial starts and the same identifier, under session start times up to 57 s apart and different file names; 816 distinct
    recordings remain. Counting the files as they are would double most unit counts.
- kind: data_missing
  statement: No recording is marked as sham (no tFUS) or as tFUS aimed at CG1, the control conditions of Figure 5; every
    recording gives a PRF and a PD and a target of S1, M1 or POm. If the sham and CG1 sessions are in the dataset, they
    cannot be found.
- kind: data_missing
  statement: The dataset has 10 rats with POm recordings and 7 with AC recordings, where the paper reports 16 S1-POm
    rats and 12 S1-AC rats (Methods); 20 rats in all.
- kind: selection_undocumented
  statement: The AC recordings at PD 200 us give 633 units with more than 2000 spikes (112, 89, 138, 167 and 127 at 30
    to 4500 Hz), where Figure 11 reports 453 (83, about 59, 107, 104 and 100), although the dataset has fewer AC rats
    than the paper. The POm totals exceed the paper's RSU + FSU counts by 36 to 44% under every selection of recordings
    by identifier (at 3000 Hz 352 against 250, at 30 Hz 315 against 232, over the five PRFs 1470 against 1019), with
    10 POm rats where the paper reports 16. They come within 10% only if two of the POm rats are left out (9 of the
    45 pairs, for example BH511 and BH513, which nothing marks for exclusion) or if only units with more than 8000 spikes
    are counted. The paper's unit selection cannot be repeated from its description.
- kind: other
  statement: The dataset also holds recordings of M1 and sessions with tFUS aimed at M1 (152 distinct recordings) or
    at POm (65), and a few recordings labelled S1BF (3), VPM (1), S1_R, S1_1, M1_R (1 each) and AC_1, AC_2 (1 each),
    none of which the paper describes; the dandiset description mentions only S1, POm and AC with tFUS at S1.
- kind: metadata_error
  statement: In the 60 sessions at PD 200 us with tFUS at S1 that have files from two of S1, POm and AC (the only sessions
    checked), both files have identical trial start times, so the areas were recorded together, but their session_start_time
    values differ (median 15.5 min, up to 3964 min); session_start_time does not give the start of the recording.
- kind: metadata_insufficient
  statement: The recorded area and the tFUS target are given only in free text in general/notes, in two spellings; the
    electrodes table has location unknown and the electrode group location is 'brain area'. Five recordings of BH500
    leave the area empty, and no other recording does. general/data_collection, which carries the PRF and PD, is empty
    in 33 recordings (BH494 25, BH499 6, BH500 2), where the identifier gives them; where both are given (782 recordings)
    they agree.
- kind: format_error
  statement: 'The arrays of the STTC files do not have the shape their descriptions give: the descriptions list a dimension
    for nine dt values, while the arrays have the 10 time windows, the trials and the units of the two areas (for example
    STTC is 10 x 499 x 20 x 9) and no dt dimension. Which dt was used, and which units the rows and columns are, is not
    stated.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: was the normalized spiking rate the ratio of a unit''s mean rate in
    the window to its mean rate in the 67 ms before stimulation (over trials), or a per-trial ratio averaged over trials;
    and in the post hoc Wilcoxon test against baseline, what was the baseline sample (the normalized pre-stimulus rates,
    which are 100% under the first reading, or another pre-stimulus window)? The Statistical analysis says only that
    rates were normalized to the 67 ms before stimulation. For Figure 11B the readings give different outcomes, and the
    claim is blocked.'
