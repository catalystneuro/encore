- claim: fig4-unit-counts
  outcome: not_reproduced
  notes: The paper types units as RSUs or FSUs by k-means on the initial phase and afterhyperpolarization of the spike
    waveform (Methods, Neuronal type classification); no file holds waveforms, and celltype_label is 0 in all 1516 files
    that have it, so the RSU/FSU split cannot be made. The k-means of the claims file header puts every unit in one of
    its two clusters, so RSU + FSU is the number of units with more than 2000 spikes under every typing reading, and
    an area total more than 10% from the paper's RSU + FSU rules out both the reproduced outcome (every count within
    10%) and the partial one (area totals within 10%), whatever the split. Units with more than 2000 spikes in distinct
    recordings with tFUS at S1 and PD 200 us. POm has 352 units at 3000 Hz (339 without the BH499 POM_S1BF recording)
    against 250, and 315 at 30 Hz against 232, ratios 1.36 to 1.41, so the POm totals are outside 10% under both POm
    selections. S1 has, at 3000 Hz, 572 over all S1 recordings, 383 in the rats with POm recordings and 234 in the sessions
    with a POm file (509, 320 and 234 without the suffixed recordings NEAR, NEW and 2; 591 with the S1_R and S1BF files)
    against 366; at 30 Hz 530, 390 and 213 (624 with S1_R) against 209. One S1 selection matches at 3000 Hz and another
    at 30 Hz, but none matches both, and POm matches in neither. The POm units come from all 10 POm rats (6 to 65 each
    at 3000 Hz). The totals depend on which rats and which unit rule are used, though nothing marks a rat for exclusion
    and the criterion fixes the rule at more than 2000 spikes. Leaving out two of the 10 POm rats brings all three POm
    totals within 10% for 9 of the 45 pairs (BH511 and BH513 give 227, 241 and 1052). With more than 8000 spikes the
    POm totals are 242, 230 and 1031, all within 10%, while no S1 selection fits all three at 1000, 2000, 4000 or 8000
    spikes; for AC, more than 4000 spikes gives 445 units, inside 453 +/- 45.3. So the paper's unit rule or spike counting
    may differ from more than 2000 spikes over the whole file. The RSU/FSU split was not tested.
  notebook: reproduce_gao_2025.ipynb
  output: claim:fig4-unit-counts
  deviations:
  - The RSU/FSU split cannot be made (no waveforms or cell types), so the claim is judged on the area totals, which are
    the same under every typing reading of the claims file header.
  - Which sessions count beyond the sessions of the S1 and POm rats is not fixed; every selection the identifiers allow
    is shown, and the outcome is the same under all of them because the POm totals are outside 10% under each.
  - Recordings deposited twice (identical spike times and trial starts) are counted once.
