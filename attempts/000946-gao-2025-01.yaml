- claim: fig11b-ac-responses
  outcome: blocked
  notebook: reproduce_gao_2025.ipynb
  output: claim:fig11b-ac-responses
  notes: 'AC units with more than 2000 spikes in the 17 distinct AC recordings with tFUS at S1 and PD 200 us, from 6
    rats; 112, 89, 138, 167 and 127 units at 30, 300, 1500, 3000 and 4500 Hz, 633 in all (expected 453 +/- 45.3, so the
    count does not match). The seventh AC rat, BH532, has no PD 200 us recording, and the AC_1 and AC_2 files of BH538
    are at 1500 Hz and PD 40 us. The four readings of the claims file header give different outcomes, and the header
    blocks a claim when they do. N1 with B1 is partially reproduced: Kruskal-Wallis p = 7.83e-06 (0 to 67 ms) and 5.16e-49
    (201 to 268 ms); during sonication 1500 Hz (140.3 +/- 8.8%, corrected p = 2.46e-08), 3000 Hz (107.1 +/- 1.2%, 9.72e-11)
    and also 4500 Hz (108.0 +/- 1.5%, 7.05e-05) are above baseline and 30 Hz is not (105.9%, 0.0189); postsonication
    exactly 30, 1500, 3000 and 4500 Hz are above baseline (176.4, 147.9, 310.5 and 210.8%) and 300 Hz is not (94.3%);
    300 Hz has the lowest mean in both windows. N1 with B2 is not reproduced: 300 Hz is also above baseline during sonication
    (99.7%, corrected p = 6.29e-03). N2 with B1 and with B2 are not reproduced (Kruskal-Wallis p = 0.0213 during sonication).
    No reading is better supported: N2 gives 49.8 to 61.7% at trial starts shifted by 1 s, where N1 gives 94.3 to 99.0%;
    under N1 the B1 sample is 100% for every unit, so the two-sample test becomes a test against a constant; B2 uses
    a window the paper never names. No reading reproduces the claim. With one rat left out, N1 with B1 gives reproduced
    (without BH537), partially reproduced (without BH530, BH535 or BH538) or not reproduced (without BH539 or BH547,
    where 30 Hz joins the during set), and N1 with B2 gives reproduced without BH530, BH537 or BH538; 300 Hz has the
    lowest mean in both windows in all twelve runs. The statement''s PRF dependence (both Kruskal-Wallis tests) holds
    under N1. The question of which normalization and baseline sample the paper used is for the paper''s authors (finding
    methods_unavailable); whether the header''s readings N2 and B1 are readings of the paper is asked of a reader (questions/000946.yaml).'
  deviations:
  - The normalization (N1 or N2) and the baseline sample of the post hoc test (B1 or B2) are not fixed by the paper (Statistical
    analysis, "normalized to the pre-stim period (67 ms pre-stim)"); all four readings were run and they give different
    outcomes.
  - The Bonferroni factor is the five PRF levels of the panel (claims file header, reading C1); reading C2 applies only
    to a panel with a single comparison.
  - The dataset holds AC recordings at PD 200 us from 6 rats (7 AC rats in all) where the paper reports 12 S1-AC rats,
    and it gives 633 units with more than 2000 spikes where the paper reports 453; the paper's selection of AC units
    could not be matched.
  - Each PRF comes from 3 or 4 of the 6 rats, and the rats differ by PRF, so the Kruskal-Wallis test across PRFs mixes
    PRF with rat (for example BH538 averages 654.1% at 3000 Hz, 201 to 268 ms, against 310.5% pooled); the paper also
    pools units across rats.
  - Recordings deposited twice (identical spike times and trial starts) are counted once.
  - Trial start_time is taken as sonication onset; the clock check shows the firing changes after it and not 1 s later,
    which is consistent with this but does not prove there is no fixed delay.
