- claim: fig11b-ac-responses
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_gao_2025.ipynb
  output: claim:fig11b-ac-responses
  measured:
  - 633
  notes: 'AC units with more than 2000 spikes in the 17 distinct AC recordings with tFUS at S1 and PD 200 us, from
    6 rats; 112, 89, 138, 167 and 127 units at 30, 300, 1500, 3000 and 4500 Hz, 633 in all (expected 453 +/- 45.3,
    so the count does not match). Under the adopted reading (N1, B1, Bonferroni over five PRFs) the Kruskal-Wallis
    tests give p = 7.83e-06 (0 to 67 ms) and 5.16e-49 (201 to 268 ms); during sonication 1500 Hz (140.3%, corrected
    p = 2.46e-08), 3000 Hz (107.1%, 9.72e-11) and also 4500 Hz (108.0%, 7.05e-05) are above baseline, 30 Hz is not
    (105.9%, 0.0189); postsonication exactly 30, 1500, 3000 and 4500 Hz are above baseline (176.4, 147.9, 310.5
    and 210.8%) and 300 Hz is not (94.3%); 300 Hz has the lowest mean in both windows. The time-locked set differs
    from the paper''s by one PRF (4500 Hz), which the criterion calls partially reproduced. The readings disagree:
    N1 with B2 adds 300 Hz to the time-locked set (not reproduced); N2 with B1 finds no PRF above baseline and N2
    with B2 finds only 1500 Hz during and 4500 Hz after sonication, with a Kruskal-Wallis p of 0.0213 during sonication
    (both not reproduced). The variant B3 (paired signed-rank of raw rates) gives the same sets as N1 with B1. The
    verdict under N1 and B1 is the same for spike-count rules of 1000, 2000, 4000 and 8000 spikes (667, 633, 445
    and 320 units). By rat, the 4500 Hz time-locked rise is largest in BH537 (135.3%) and near 100% in BH547 (99.4%),
    and the postsonication values vary widely (for 3000 Hz, 112.0 to 654.1% across three rats). The statement''s
    PRF dependence (both Kruskal-Wallis tests) holds. The question of which normalization the paper used is for
    the paper''s authors (finding methods_unavailable).'
  deviations:
  - 'Assumed, normalization N1: a unit''s mean count in the window over trials divided by its mean count in [-67,
    0) ms. The Statistical analysis says the rates were normalized to the 67 ms before stimulation without saying
    whether per trial (N2) or over trials. N2 averages per-trial ratios over the trials with a nonzero baseline
    (a median of 23% of trials for AC units), which biases it below 100% with no stimulus (49.8 to 61.7% at trial
    starts shifted by 1 s, against 94.3 to 99.0% for N1), so N2 cannot be a rate normalized to the pre-stimulus
    period; N1 is adopted and N2 is shown.'
  - 'Assumed, baseline sample B1: the window''s normalized rates are compared with the units'' normalized [-67,
    0) ms rates (100% under N1), the pre-stimulus period the Statistical analysis names. B2 (the [-134, -67) ms
    window, which the paper never names) is shown.'
  - The Bonferroni factor is the five PRF levels of the panel (claims file header, reading C1); reading C2 applies
    only to a panel with a single comparison.
  - The dataset holds AC recordings from 6 rats at PD 200 us (7 AC rats in all) where the paper reports 12 S1-AC
    rats, and it gives 633 units with more than 2000 spikes where the paper reports 453; the paper's selection of
    AC units could not be matched.
  - Recordings deposited twice (identical spike times and trial starts) are counted once.
  - Trial start_time is taken as sonication onset; the clock check shows the firing changes after it and not 1 s
    later, which is consistent with this but does not prove there is no fixed delay.
