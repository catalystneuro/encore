findings:
- kind: format_error
  about: data
  severity: major
  statement: The Nitschke file (sub-Nitschke_ses-20100923) joins five recording segments whose clocks
    overlap. Trial start times, hand timestamps and every unit's spike times jump backwards four times
    (segments span 5 to 6076 s, 6074 to 12077 s, 6071 to 12494 s, 6120 to 13516 s and 6074 to 6658 s),
    so spike times are not sorted and a trial's spikes cannot be selected by time alone; doing so mixes
    spikes of up to four segments. Splitting each unit's spikes at the jumps and assigning trials to
    segments in file order gives condition decoding of 0.41 to 0.46 in segments 0 to 2 and 0.16 in
    segment 3 (chance 0.014; 0.006 to 0.027 with the previous trial's labels).
- kind: metadata_insufficient
  about: data
  severity: major
  statement: The units table holds 96 units per array, one per electrode, in both files, with no column
    for single or multi-unit, sorting quality or isolation. The paper reports 79 to 118 single and
    stable multi-units per array. Whether these units are threshold crossings or sorted units merged
    per electrode is not stated.
- kind: format_error
  about: data
  severity: minor
  statement: In the Jenkins file, one unit's spike train (the second row of the units table) holds two
    sorted runs one after the other, the second restarting at 4.7 s after the first reached 15668.6 s.
    The two runs were merged and sorted here.
- kind: metadata_error
  about: data
  severity: minor
  statement: Hand, cursor and eye positions are labelled "meters" with a conversion of NaN, but hold
    millimetres (reaches of about 130 and positions from -182 to 159).
- kind: data_missing
  about: data
  severity: minor
  statement: The dataset holds no EMG, which the paper's Supplementary Figure 8 removes along with
    kinematic dimensions.
- kind: other
  about: data
  severity: minor
  statement: In the Nitschke file, condition information in segment 3 is lower within the segment
    (decoding 0.161) than in segments 0 to 2 (0.411 to 0.459), while a decoder trained on the other
    segments reaches 0.478 on it, and decoding does not peak at another time offset. This is consistent
    with a change of the recorded units over the session; segment 4 (22 trials) is too small to check
    on its own.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) Which trials were analysed? Successful trials with a
    delay above 400 ms give 1381 (J) and 1884 (N) and all successful trials 1595 and 2121, against
    1469 and 2014 in the Figure 7 legend; the first was used here. (2) Which units were used, and are
    they in the dandiset? The files hold one unit per electrode with no single or multi-unit label.
    (3) What penalty was used for the OU kernel encoding models with length scales 1e11 and 1e12? With
    a penalty of 0.1 they predict only the mean. (4) How were the noise excursion angles of Figure 4c
    computed? (5) Were the jPCA and single-condition LDS values of Supplementary Figure 3
    cross-validated, and how?
- kind: methods_unavailable
  statement: The paper's code (kaufmanlab/LDR-public) loads preprocessed files (ShenoyMonkeyData and
    others) that the Data availability statement offers only on request, so the code cannot be run on
    the public data, and the trial and unit selection behind them cannot be checked.
