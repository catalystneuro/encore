outcomes:
- claim: data-composition
  outcome: reproduced
  notebook: reproduce_sabatini_2024.ipynb
  output: claim:data-composition
  measured:
  - 72
  - 1595
  - 2121
  notes: Both monkeys have the 72 conditions, 36 straight and 36 curved; the two readings of the conditions
    give the same set (maze conditions not a multiple of 3 are exactly the 1-target mazes, once maze 0,
    a set of 203 and 419 trials outside the 108, is left out). Trials, reading (a) all successful, 1595
    (J) and 2121 (N); reading (b) delay above 400 ms, 1381 and 1884; all four within 10% of 1469 and 2014.
    Each array holds 96 units, inside 71 to 130. The units table has no single-unit, multi-unit or quality
    column (its columns are electrode_group, electrodes, id, obs_intervals and spike_times), so all units
    are counted. Each of the 192 electrodes of each file carries exactly one unit, so these are per-electrode
    units and are not shown to be the paper's sorted units (recorded as a finding).
  deviations:
  - Units are the dandiset's 96 per-electrode units per array, with no single or multi-unit label, where
    the paper used 79 to 118 sorted single and stable multi-units. All are kept, including three that
    are not one stable unit's (Jenkins units 0 and 1, whose train is split between their rows, and Nitschke
    unit 170, above 100 spikes/s on 229 trials of segment 3); reproduce_sabatini_2024_stable_units.ipynb
    leaves them out, and its outcome is the same.
  - The paper's MATLAB code was not run; it needs preprocessed files that are available only on request.
    Methods follow the claims file and the Methods.
