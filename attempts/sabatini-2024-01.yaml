  output: claim:data-composition
  measured:
  - 72
  - 1595
  - 2121
  notes: Both monkeys have the 72 conditions, 36 straight and 36 curved; the two readings of the
    conditions give the same set (maze conditions not a multiple of 3 are exactly the 1-target mazes,
    once maze 0, a set of 203 and 419 trials outside the 108, is left out). Trials, reading (a) all
    successful, 1595 (J) and 2121 (N); reading (b) delay above 400 ms, 1381 and 1884; all four within
    10% of 1469 and 2014. Each array holds 96 units, one per electrode, and the units table has no
    single-unit, multi-unit or quality column, so the units the dataset marks as single or multi-units
    cannot be counted; 96 is inside 71 to 130, but the same 96 in all four arrays, one per electrode,
    is not the paper's 79 to 118 sorted units. The counts and conditions hold; the unit part does not
    hold as the criterion states it.
  deviations:
  - The units are the dandiset's per-electrode units; the paper used sorted single units and stable
    multi-units.
- claim: jpca-fit-r2
  outcome: partially_reproduced
  notebook: reproduce_sabatini_2024.ipynb
  output: claim:jpca-fit-r2
  assumed: true
  notes: Reading (a), the skew-symmetric R2 in the first plane, gives 0.776, 0.664, 0.623 and 0.452
    (M1-J, PMd-J, M1-N, PMd-N); three of four in 0.576 to 0.803. Refitted on straight and curved
    reaches alone, straight 0.843, 0.753, 0.763, 0.781 and curved 0.712, 0.574, 0.660, 0.562, all in
    their ranges and straight higher in every dataset. Reading (b), unconstrained, gives 0.823, 0.692,
    0.685, 0.466 (two of four in range), straight 0.811 to 0.897 and curved 0.613 to 0.757. The
    per-condition R2 paired by maze (straight against curved, 36 pairs) gives p = 0.058, 0.28, 5e-05
    and 0.53, against the paper's p < 0.001; this part of the statement is not reproduced, and does not
    decide.
  deviations: &common
  - Units are the dandiset's 96 per-electrode units per array, with no single or multi-unit label,
    where the paper used 79 to 118 sorted single and stable multi-units.
  - Trials are the successful trials of the 72 conditions with a delay above 400 ms (reading (b) of
    the claims file), chosen because its counts are nearest the paper's; the paper gives no trial
    selection. This is an assumption; reading (a) was not run for the analyses for lack of time.
  - The paper's MATLAB code was not run; it needs preprocessed files that are available only on
    request. Methods follow the claims file and the Methods.
