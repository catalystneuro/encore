    PMd-J, M1-N, PMd-N); three of four in 0.576 to 0.803. Refitted on straight and curved reaches alone,
    straight 0.834, 0.708, 0.768, 0.778 and curved 0.689, 0.575, 0.655, 0.565, all in their ranges and
    straight higher in every dataset. Reading (b), unconstrained, gives 0.820, 0.658, 0.684, 0.461 (two
    of four in range). The per-condition R2 paired by maze (each straight maze with the next maze, curved
    with the same target in all 36 pairs of every dataset) gives p = 0.069, 0.009, 1e-05 and 0.63, against
    the paper's p < 0.001; this part does not decide. Trial reading (b) gives 0.776, 0.664, 0.623, 0.452,
    the same outcome.
