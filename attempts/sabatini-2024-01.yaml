  findings:
  - finding: 1
    agrees: false
    severity: critical
    reason: 'Rated major; I would rate it critical. Cell 5 shows what it states: hand timestamps in five segments
      with overlapping bounds, all 192 units with four backward spike-time jumps, and trial start times that are
      not monotonic. Cell 9 shows that assigning trials to segments in file order works. This is signals on different
      clocks within one file, and no metadata says so. An analysis that takes the times as given and selects a trial''s
      spikes by time silently mixes up to four recordings. The segment bounds 6076, 12077, 13516 and 6658 s are
      not printed; cell 5 prints 6075.4, 12075.9, 13515.2 and 6656.8.'
    response: Severity changed from major to critical, the verifier's rating. The bounds now quote the printed values.
  - finding: 3
    agrees: false
    severity: critical
    reason: Rated minor; this cannot be judged from the outputs. Cell 5 shows only one unit with one backward jump.
      If the second run holds another unit's spikes, or duplicates the first, it is a spike train holding another
      unit's spikes, which is critical. The notebook merges the two runs. Printing each run's spike count, and whether
      the two runs overlap or repeat each other, would settle it. "The second row", "4.7 s" and "15668.6 s" are
      not printed.
    response: The unit checks now print both runs (196608 spikes from 4259.1 s and 264946 from 4.7 s, both to 15668.6
      s), the 1049 times they share, the intervals under 1 ms (none in either run, 3.5% merged), and the largest
      share of each run's times found in another unit's train (37.4% and 2.5%). They also show that unit 0's train
      stops at 4259.0 s, 55 ms before the first run begins, with the same sharing (27.9%). Unit 1's row holds what
      appears to be the rest of unit 0's train, so the finding is rewritten and rated critical, as the verifier's
      condition gives. The companion notebook leaves units 0 and 1 out.
