- claim: fig2f-tail-contribution
  outcome: partially_reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:fig2f-tail-contribution
  measured: 52.2
  notes: The measured value is reading (a), z over the epoch, for Phi above 1.8. Reading (a) gives
    52.2%, 56.1% and 16.1% for Phi above 1.8, 1.4 to 1.8 and 1 to 1.4 with z over the epoch, and
