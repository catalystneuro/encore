- claim: supp10-no-coactivation
  outcome: reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:supp10-no-coactivation
  notes: Under reading (a), Pearson cross-correlation averaged over 704 pairs of signal components
    from 56 sessions, the post SWS average has its minimum at zero lag, below chance (-0.0035, p = 0.29
    against 0, with z over the epoch; -0.0099, p = 0.00045, with z over SWS) and below its mean at 200
    to 500 ms (0.0017 and 0.0016). In the awake epoch the zero-lag value is above chance (0.0329, p =
    8.5e-16). Reading (b) is unstable because mean R over SWS is near zero for many components; its
    sleep averages are not compared with chance (zero-lag s.e.m. 33 and 430). The trough is
    significant under one z-transform reading only.
  deviations:
  - Cross-correlations are computed within each SWS interval and pooled, so that no pair of bins
    spans a gap between intervals; lags of -1 to 1 s (a standard choice).
- claim: supp11-shuffle-control
  outcome: partially_reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:supp11-shuffle-control
  notes: Shuffled reactivation is 5.3% to 5.9% of the actual in each signal group with z over the
    epoch, and 5.1% to 5.7% with z over SWS bins, more than an
    order of magnitude smaller. It does not differ between pre and post for Phi 1 to 1.4 (paired t p
    = 0.85 and 0.76) or 1.4 to 1.8 by t-test (p = 0.13 and 0.067), but for Phi above 1.8 post is higher
    (0.0204 against 0.0162, paired t p = 0.031; 0.034 with z over SWS), and by Wilcoxon the two highest
    groups differ (p 0.012 to 0.023). The absence holds in two of three groups by the t-test reading
    and one by the Wilcoxon reading. The differences are under 0.005, against 0.27 for the actual
    patterns in the highest group.
  deviations:
  - The mean over shuffles is computed in closed form, as the mean over all permutations of the
    cells within each bin, instead of 1000 random shuffles per bin; on one session it agrees with
    1000 shuffles (-0.0082 against -0.0086).
