outcomes:
- claim: sessions-and-cells
  outcome: not_reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:sessions-and-cells
  measured:
  - 1499
  - 56
  notes: Measured values are those of reading (b), the inclusion rule, which the Figure 2b legend
    supports. Reading (a), all sessions, gives 86 sessions and 2155 cells; reading (b) gives 56
    sessions and 1499 cells, against 63 (57 to 69) and 1692 (1523 to 1861). Under (b) rats 18 and 20
    match the paper's per-rat counts (11 and 24), rat 19 has 11 against 12 and rat 15 has 10 against
    16. The data set holds only 14 sessions of rat 15 in all, so at least two of the paper's rat-15
    sessions are not in it. With a 3.5 min SWS threshold the totals match (63 sessions, 1682 cells)
    but the per-rat counts do not (11, 12, 11, 29).
  deviations:
  - SWS time per rest epoch is the summed length of the data set's SWS intervals; the paper's own
    SWS detection, from the LFP, cannot be repeated.
- claim: rules-learned
  outcome: not_reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:rules-learned
  measured:
  - 3
  - 4
  - 3
  - 1
  notes: Both readings (within a session, and across consecutive sessions with the same rule) give
    right arm 3 rats (15, 19, 20), lit arm 4, left arm 3 (15, 18, 20) and dark arm 1 (20), against 4,
    4, 2 and 1. Rat 18 never reaches criterion on the right-arm rule in the recorded trials (9 and
    13 trials in sessions 181011 and 181012), though its rule was then changed. Counting instead
    the rules after which the rule was changed, a variant outside the criterion, gives 4, 3, 3 and
    1. The recorded trials may not include every trial run.
  deviations:
  - Sessions are ordered by the month and day in their ids, with rat 20's December sessions put
    before its January to March ones; the data set gives no year.
- claim: learning-sessions
  outcome: not_reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:learning-sessions
  measured: 34
  notes: The measured value is reading (a)(i). No reading gives 9 to 11 sessions over four rats.
    (a)(i) 34 sessions, (a)(ii) 16, (b)(i) 9 sessions from three rats, (b)(ii) 4 from three rats.
    The data set's description lists ten learning sessions from four rats with their learning
    trials, the paper's count. The definition under reading (a) gives the listed trial in 6 of the
    10 (150628, 150630, 181012, 190214, 190228, 201229), and reading (b) gives it for 150628 and
    150707. For 201222 reading (a) gives trial 37 against 23, for 181020 trial 4 against 10.
  deviations:
  - The learning point is computed over all trials of the session, as the definition says, even
    where the rule changed within the session.
  - All 86 sessions are searched, not only those passing the inclusion rule; the table shows
    which of the listed sessions are included.
- claim: fig1b-signal-components
  outcome: partially_reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:fig1b-signal-components
  measured:
  - 285
  - 730
  notes: Over the 56 included sessions, 285 signal components (expected 291 to 355) and 730
    nonsignal (730 to 892); 484 components lie below lambda_min. Per session this is 5.09 signal and
    13.04 nonsignal, against 5.13 and 12.87 for the paper's totals over 63 sessions, so the
    shortfall in the signal total follows the missing sessions. 45 of 56 sessions have 1 to 6
    signal components and 11 have 7 to 11. Over all 86 sessions there are 411 and 1050.
  deviations:
  - The criterion takes the session selection from the matching reading of sessions-and-cells;
    neither matches, so the paper's stated inclusion rule, reading (b), is used.
  - The awake epoch is the data set's single awake interval, binned whole in 100 ms bins.
- claim: fig2b-post-greater-than-pre
  outcome: reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:fig2b-post-greater-than-pre
  measured:
  - 9
  - 35
  - 241
  notes: Post exceeds pre in all three signal groups under all four readings. With z over the
    whole rest epoch, paired t p = 0.0015, 0.00014 and 0.00023 for Phi above 1.8, 1.4 to 1.8 and 1 to
    1.4 (Wilcoxon 0.0039, 9.2e-05, 8.6e-06); with z over SWS bins, 0.00071, 2.2e-06 and 5.2e-07.
    Nonsignal components do not differ (p 0.10 to 0.31). The group sizes, 9, 35 and 241 against 10,
    40 and 273, are within tolerance only for the first; each is about 88% of the paper's, as the
    included sessions are 56 of 63. The opposite order of sizes matches none. By rat the effect is
    found in rats 15, 18 and 20 and not in rat 19 (mean difference -0.003, p = 0.87).
  deviations:
  - The outcome follows the criterion, which tests post against pre; two of the three group sizes
    listed as expected values fall outside tolerance, because the data set holds fewer sessions
    that pass the inclusion rule.
- claim: supp5-sws-only
  outcome: partially_reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:supp5-sws-only
  assumed: true
  notes: Two-way ANOVA over the per-component means of the 285 signal components, epoch effect p =
    0.0005 and state effect p = 0.014 (claim p < 0.01), interaction p = 0.027; SWS means pre 0.1005
    and post 0.1469, non-SWS 0.0985 and 0.1088. In non-SWS bins post exceeds pre by 0.0103 (paired t
    p = 0.042, Wilcoxon p = 0.018), against 0.0464 in SWS, so the claim's third part fails under both
    readings, though within each signal group the non-SWS difference is not significant (p 0.13 to
    0.49). With rest epochs limited to the 30 min next to the awake epoch the outcome is the same
    (state p = 0.018, epoch p = 0.00047, non-SWS t p = 0.044).
  deviations:
  - The data set does not give the bounds of the rest epochs. Assumed, as the claim's criterion
    directs, from the data set's epoch times, pre from the start of the recording to the start of
    the awake interval and post from its end to the end of the position record; this makes pre 23
    to 58 min and post 22 to 59 min in the included sessions, where the Methods give 20 to 30 min. A 30 min variant is shown.
  - Non-SWS bins are z-transformed with the whole rest epoch.
- claim: supp6-pre-post-sws-alike
  outcome: reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:supp6-pre-post-sws-alike
  notes: Paired t-tests over 56 sessions find no difference in total SWS time (630 against 623 s,
    p = 0.87), mean SWS episode duration (203 against 222 s, p = 0.41) or session mean SWS firing
    rate (3.58 against 3.58 Hz, p = 0.93); over 1499 cells, rates do not differ by paired t-test (p =
    0.65), while a Wilcoxon test over cells, a variant, gives p = 0.0013 for a 0.8% difference. SPWR
    rate, delta-wave counts and delta and spindle power cannot be tested, as the data set holds no
    LFP and no event times; the outcome covers the SWS duration and firing-rate parts only.
  deviations:
  - SWS episodes are the data set's SWS intervals; their merging rule (gaps under 1 min) is the
    paper's, applied before deposit.
- claim: fig2b-encoding-correlation
  outcome: not_reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:fig2b-encoding-correlation
  measured: 0.384
  notes: Over 285 signal components, r = 0.620 (r squared 0.384, p = 1.2e-31) with z over the
    epoch and r = 0.646 (r squared 0.417, p = 4.5e-35) with z over SWS bins; the expected r squared
    is 0.549 to 0.671. The correlation is positive and its p-value is below 1e-30, but r squared is
    too low. The r itself is close to the 0.61 the paper prints as r squared. By rat r squared is
    0.20, 0.43, 0.03 and 0.50 (rats 15, 18, 19, 20). Reading (b), inter-SPWR bins, cannot be run.
- claim: fig2b-pre-weaker
  outcome: partially_reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:fig2b-pre-weaker
  notes: Pre slope 0.168 against post 0.434, pre r = 0.283 against post 0.620 (z over the epoch;
    0.150, 0.398, 0.319 and 0.646 with z over SWS). The correlation is lower with p < 1e-5 under both
    readings (Fisher z p = 2.5e-07 and 1.9e-07, Steiger p = 6.2e-13 and 2.5e-15). The slope is lower
    but with p of 2.4e-08 to 3.3e-13 (interaction in a linear model, or bootstrap of the slope
    difference with a normal approximation), not below 1e-20 under any reading.
  deviations:
  - The bootstrap p-value uses a normal approximation from the bootstrap standard error, since
    2000 resamples cannot resolve p below 5e-4; no resample gave a slope difference of zero or less.
