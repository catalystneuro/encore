- claim: supp12-behavior-unchanged
  outcome: reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:supp12-behavior-unchanged
  notes: In the ten learning sessions, trial length does not differ before and after the learning
    trial, by session means (5.48 against 8.23 s, paired t p = 0.16, n = 10) or by trials (5.35 against
    6.81 s, unpaired t p = 0.28; medians 4.30 s both). Speed along the path does not differ in 9 of 10
    bins; the first bin is faster after learning (24.9 against 23.3 units/s, p = 0.034 uncorrected,
    0.34 after Bonferroni over the ten bins). The test has little power (a 2.7 s difference over ten
    sessions is not significant). With the learning points of learning-sessions reading (a) in the
    same ten sessions, session means give p = 0.19.
  deviations:
  - The learning sessions and trials are those listed in the data set's description, since the
    paper's definition does not recover them (learning-sessions).
  - Speed is shown in ten bins of the fraction of the trial's path length, as the data set holds no
    maze geometry for the paper's linearization; it is reported, and does not decide the outcome.
findings:
- kind: data_missing
  statement: The data set holds no LFP, no SPWR, delta-wave or spindle times, and no tetrode of each
    cell. The paper's analyses of hippocampal sharp-wave ripples, cortical delta waves and spindles
    (Figures 5 to 7) and its same-tetrode control cannot be repeated, 14 of 29 claims.
- kind: data_missing
  statement: The data set holds 14 sessions of rat 15, where the paper reports 16 analysed. With the
    paper's inclusion rule (at least ten cells and 4 min of SWS in each rest epoch) 56 sessions and
    1499 cells remain, against 63 and 1,692 in the paper; rats 18 and 20 match the paper's counts,
    rat 19 has one fewer and rat 15 six fewer.
- kind: selection_undocumented
  statement: The data set holds 86 sessions, including 23 of rat 20 that fail the 4 min SWS rule,
    and does not say which sessions the paper analysed.
- kind: metadata_insufficient
  statement: The bounds of the pre and post rest epochs are not given; only the awake interval and
    the SWS intervals are. Position units and the maze's coordinates are not stated.
- kind: other
  statement: Two of the ten learning sessions the description lists (201227 and 201229) have less
    than 4 min of SWS in one rest epoch by the data set's SWS intervals (2.2 min pre, and 3.3 min
    post), so they would fail the paper's inclusion rule, though the paper's Figure 7 uses ten
    learning sessions.
- kind: other
  statement: Sessions without SWS in a rest epoch store a single [0, 0] interval (four sessions) or an
    empty file (150704 SwsPRE), not a documented empty value.
- kind: other
  statement: Cell types are all 0 (unknown) in 200107 and all 1 (interneuron) in 200209, and mostly
    unknown in 200131, 200224 and 200301, which is unlikely for prefrontal recordings.
- kind: other
  statement: In five sessions spikes continue 12 to 176 min after the position record ends (200106
    by 176 min), and in 200213 the position record ends before the awake interval does.
- kind: other
  statement: In the recorded trials rat 18 never reaches the rule-change criterion on the right-arm
    rule, yet its rule was changed, and three rats, not two, reach criterion on the left-arm rule.
- kind: methods_unavailable
  statement: For the authors. Is the match epoch z-transformed over the whole rest epoch or over its
    SWS bins alone? The Methods say "For all epochs, spike trains ... were z transformed", and
    analyses are restricted to SWS. Both were run here and no outcome changes, but the values differ
    (for example r squared 0.384 against 0.417 for Figure 2b).
- kind: methods_unavailable
  statement: For the authors. How were the pre and post rest epochs bounded in the deposited
    sessions, and how were DOWN states detected for Figure 6b (beyond the 80 ms minimum) and the pre
    epoch's smaller modulation judged? Here DOWN states are 80 ms without spikes, and the pre
    modulation is compared over the window where post is significant; compared by the largest value,
    pre is not smaller.
- kind: methods_unavailable
  statement: For the authors. The tests behind Figure 2b, Figure 2e and Supplementary Figure 11D are
    not named, and the r squared of 0.61 for Figure 2b is near the r found here (0.62, r squared 0.38).
    Which tests were used, and is 0.61 an r or an r squared?
verifications:
- date: 2026-11-05
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the
    notebook)
  reviewed: The handover of the first run, the executed notebook with the conclusions and summary
    removed, the helper module and the claims file, with the paper under paper/.
  results:
  - claim: sessions-and-cells
    agrees: true
    outcome: not_reproduced
    reason: Neither reading falls within tolerance. All sessions gives 86 sessions and 2155 cells; the
      inclusion rule gives 56 and 1499 (need 57 to 69 and 1523 to 1861). Per rat under the rule
      10/11/11/24, against the paper's 16/11/12/24. The 3.5 min SWS variant gives 63 sessions and
      1682 cells, matching the totals but not the per-rat counts, and two of the description's
      learning sessions (201227, 201229) fail the 4 min rule, which suggests the deposited SWS
      intervals or the inclusion rule differ from the paper's; the notebook does not mention it.
    response: No change of outcome. The result cell now says that 201227 and 201229 fail the 4 min
      rule and that the deposited SWS intervals, or the rule as applied, differ from the paper's.
  - claim: rules-learned
    agrees: true
    outcome: not_reproduced
    reason: Both readings give right 3, lit 4, left 3, dark 1, against 4/4/2/1. Rat 18 never reaches
      the criterion under the right-arm rule. It asked, for each rat and rule, for the longest correct
      run and the best 12-trial window, to show whether a missing session or the criterion causes the
      mismatch.
    response: No change of outcome. The table was added. On the right-arm rule rat 18 has 22 trials,
      a longest run of 9 and at most 10 correct in 12, one trial short of either form of the
      criterion; on the left-arm rule rats 15 and 18 pass clearly (runs of 14 and 13).
  - claim: learning-sessions
    agrees: true
    outcome: not_reproduced
    reason: No reading gives 9 to 11 sessions over four rats. Reading (b) is computed wrongly,
      learning_point with include_block=False returns None when the qualifying block runs to the end
      of the session, because an empty remainder fails len(rest) (confirmed on [0,0,1,1,1,1,1]), so 7
      of the description's 10 sessions are NaN under (b) and the claim is not settled under reading
      (b).
    response: Fixed. Under reading (b) an empty remainder now counts as passing, with a test on the
      synthetic input in the notebook that fails on the earlier code. Reading (b) now gives 22
      sessions under (i) and 14 under (ii), each over four rats, so no reading gives 9 to 11 and the
      outcome stays not_reproduced.
  - claim: fig1b-signal-components
    agrees: true
    outcome: partially_reproduced
    reason: Signal total is 285, outside 291 to 355; nonsignal is 730, exactly at the lower bound; 45
      of 56 sessions have 1 to 6 signal components; per session the rates match the paper. The 12
      cells silent in the awake epoch are counted in n, which lowers q and raises lambda_max slightly
