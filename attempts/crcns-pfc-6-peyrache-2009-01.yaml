- claim: fig6b-down-up
  outcome: reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:fig6b-down-up
  assumed: true
  notes: In post SWS the signal components' event-triggered reactivation rises above baseline 0.5
    to 0.3 s before DOWN to UP transitions (three bins at p < 0.001 over 285 components, 15415
    transitions), as the paper reports for delta waves (about 400 ms before), and nonsignal
    components have no significant bin. In pre SWS there is one significant bin, and the rise over
    -0.5 to -0.3 s is lower (0.063 against 0.107; per component post minus pre 0.043, p = 0.15); the
    pre average's largest value above baseline (0.145 at +0.2 s) is not lower than the post one
    (0.132). Both definitions of DOWN states give the same transitions, since a fifth of the mean
    count per 10 ms bin is below one spike. The SPWR part of the claim is not tested (no ripple
    times), and the comparison with delta waves rests on the paper's reported 400 ms, as
    fig6a-delta-waves is blocked.
  deviations:
  - Assumed that "the pre average is lower" compares the rise above baseline in the window where
    post is significant (-0.5 to -0.3 s), following the paper's wording for delta waves ("the
    modulation was smaller for pre epoch SWS"); compared by the largest value of the whole average,
    pre is not lower. Both are shown.
  - Event-triggered averages use R over all bins of the rest epoch with Q z-transformed over the
    whole epoch, since the -4 to 4 s windows reach outside SWS; transitions are taken inside SWS.
