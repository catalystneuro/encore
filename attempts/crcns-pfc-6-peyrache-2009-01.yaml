- claim: fig6b-down-up
  outcome: partially_reproduced
  notebook: reproduce_peyrache_2009.ipynb
  output: claim:fig6b-down-up
  assumed: true
  notes: In post SWS the signal components' event-triggered reactivation rises above baseline 0.5
    to 0.3 s before DOWN to UP transitions (three bins at p < 0.001 over 285 components, 15415
    transitions; a fourth significant bin is a dip below baseline at 0 s, -0.059), as the paper reports for delta waves (about 400 ms before), and nonsignal
    components have no significant bin. In pre SWS there is one significant bin, and the rise over
    -0.5 to -0.3 s is lower (0.063 against 0.107; per component post minus pre 0.043, p = 0.15); the
    pre average's largest value above baseline (0.145 at +0.2 s) is not lower than the post one
    (0.132), and that value is at +0.2 s after the transition, pre's one significant bin. The post
    rise before the transition holds, and the pre average is lower only in the window where post is
    significant, without a significant difference, so the claim holds in part. Both definitions of
    DOWN states give the same transitions, since the mean population count per 10 ms SWS bin is 0.21
    to 2.22 spikes and a fifth of it is below one spike in every session. The SPWR part of the claim is not tested (no ripple
    times), and the comparison with delta waves rests on the paper's reported 400 ms, as
    fig6a-delta-waves is blocked.
  deviations:
  - Assumed that "the pre average is lower" holds only if pre is lower both by the rise above
    baseline in the window where post is significant (-0.5 to -0.3 s) and by the largest value of
    the whole average, or if the per-component difference is significant. Pre is lower in the
    window (0.063 against 0.107) but its largest value is higher (0.145 against 0.132), and the
    per-component difference is not significant (p = 0.15), so this part is not established.
    Comparing by the window alone would make the claim reproduced. Both comparisons are shown.
  - Event-triggered averages use R over all bins of the rest epoch with Q z-transformed over the
    whole epoch, since the -4 to 4 s windows reach outside SWS; transitions are taken inside SWS.
