findings:
- kind: data_missing
  statement: The data set holds no reward-well entry times (the infrared beam breaks the Methods use),
    no well positions and no rewarded-well contingencies; the task struct holds only the epoch type. Well
    visits must be inferred from position, and the claim that uses beam-break entries cannot be tested.
- kind: data_missing
  statement: Only the task sessions (epochs 2, 4 and 6) are included; the rest sessions in the sleep box
    that the paper describes are not.
- kind: metadata_insufficient
  statement: Stored spike widths of R1 and N2 run about 0.2 ms longer than in T1, S2 and Q1 (median 0.50
    to 0.57 ms against 0.25 to 0.34 ms, CA1 and PFC alike), so the paper's < 0.4 ms pyramidal-cell rule
    removes every R1 and nearly every N2 CA1 unit. The Methods name two spike filters (600 to 6000 Hz
    or 300 to 6000 Hz); the data set does not say which animal used which, or how width should be compared
    across them.
- kind: metadata_insufficient
  statement: No corpus callosum reference channel and no statement of the LFP's reference are included;
    the LFP is one channel per tetrode, presumably referenced at recording, so the ground-referenced LFP
    the Methods use for spectrograms cannot be rebuilt.
- kind: metadata_insufficient
  statement: 11 unit-days (in all five rats) have an empty area field in both cellinfo and tetinfo, though they
    have spikes, so it cannot be told whether they are CA1 or PFC units; they are left out.
- kind: other
  about: data
  statement: Within a session, LFP start times differ across tetrodes by up to 45 ms in R1 and N2 (none
    in T1, S2, Q1); users must align tetrodes by their starttime field.
- kind: metadata_error
  statement: The data descriptor's summary says 'The CRCNS.org hc-7 data set contains recordings', for
    data set hc-13.
- kind: methods_unavailable
  statement: Question for the paper's authors. The SWR threshold (99.99th percentile of the mirrored noise
    distribution of 'envelope power') lies at about 0 to 0.8 z of the envelope amplitude here, giving
    about 2 SWRs per second of immobility, and below the mean for the squared envelope. Was the envelope
    amplitude or its square used, over which times was the histogram taken, and how many awake SWRs per
    day did the foraging rats give?
- kind: methods_unavailable
  statement: Question for the paper's authors. How were IAPs and MAPs selected in R1 and N2, whose stored
    spike widths mostly exceed 0.4 ms? Without the width rule there the MAP count (250) and the PFC selection
    (113) match the paper's 244 and 112.
- kind: methods_unavailable
  statement: Question for the paper's authors. Without beam-break times, which definition of a well visit
    (radius, minimum duration) reproduces the entries and exits of Figures 1 and 2 and the 6.4 to 6.6
    s interval of Figure 1, supplement 1D?
