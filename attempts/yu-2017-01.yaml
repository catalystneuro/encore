- claim: fig1-iap-map-counts
  outcome: blocked
  blocked_by: data_missing
  notes: The pooled counts (83 IAPs, 659 or 679 MAPs) need the six W-track rats, which are not in
    hc-13. CRCNS hc-6 (Karlsson, Carr and Frank, doi:10.6080/K0NK3BZJ) is public and holds nine
    W-track rats, but the paper does not say which six rats or which days it used, and some come from
    Kay et al. 2016, so the paper's W-track data cannot be identified in a public archive. The block
    was not_runnable in the first round and is data_missing now, as the round-1 verifier gave it. The
    foraging part of the count is under fig1s4b-foraging-counts (14 IAPs and 180 MAPs, not
    reproduced), so the pooled count could not be reached on the foraging cells in any case.
- claim: fig1s4b-foraging-counts
  outcome: not_reproduced
  notebook: reproduce_yu_2017.ipynb
  output: claim:fig1s4b-foraging-counts
  measured:
  - 14
  - 180
  notes: 14 IAPs and 180 MAPs under O2 (a), 17 and 177 under (b), against 33 (tolerance 3.3) and 244 (24.4).
    Unsmoothed speed (O3) gives 19 and 175. Of 395 CA1 unit-days 194 pass the width, rate and spike-count
    rules; R1 gives none and N2 seven. Without the width rule in R1 and N2 (a variant the paper does not
    state) there are 16 IAPs and 250 MAPs; the MAP count then falls within tolerance, the IAP count does
    not. IAP threshold 2 Hz gives 21 IAPs. Unique units across days cannot be counted (no identifier across
    days).
  deviations:
  - 'Wells and well entries and exits follow O1 reading (b), the only one the data allow (no beam-break
    times): wells are the peaks of immobile occupancy in the outer part of each quadrant of the maze,
    pooled over an animal''s days, and entries and exits are the starts and ends of immobility periods.
    The paper does not say how to find wells without the beam break; this is an assumption. In every animal
    the four wells sit at the corners of the tracked area.'
  - SWRs are detected under O5 reading (a), the envelope amplitude. Reading (b), the squared envelope,
    puts the threshold below the mean on all 45 days, so events have no bound; it is shown in the data
    check and not used. The band-pass filter (4th-order Butterworth, forward and back) is a standard choice;
    the paper names none. Under reading (a) 13 to 20% of immobile samples exceed the threshold, about what the
    rule passes on synthetic pure noise (13%); a fixed 3 SD threshold is run as a sensitivity check only.
  - The spike-width rule (< 0.4 ms, Methods, Cell selection) is applied to the stored widths; in R1 and
    N2 these run about 0.2 ms longer than in the other rats, so R1 keeps no CA1 cell and N2 seven. All
    IAPs come from T1 and S2.
  - Units counted per day (O4); the unique-unit variant cannot be run.
  assumed: true
