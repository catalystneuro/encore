  - The occupancy map is smoothed by normalized convolution over visited bins, a standard choice.
  - Reading (b) projects positions on the four perimeter segments joining the wells, an assumption;
    the maze also has diagonal paths ('Paths connect all reward wells', Figure 1, supplement 1A), so
    the projection with the diagonals is a variant. Neither map sets a minimum occupancy (the paper
    gives none); 0.1 s is a variant.
  assumed: true
