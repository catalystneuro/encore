- claim: fig1f-iap-smaller-coverage
  outcome: not_reproduced
  notebook: reproduce_yu_2017.ipynb
  output: claim:fig1f-iap-smaller-coverage
  notes: 'Coverage (bins > 2 Hz) medians, IAPs against MAPs. 2 cm square bins 208 against 203 (p =
    0.62); linearized on the four perimeter segments joining the wells 20 against 23 (p = 0.67); with
    movement only (> 4 cm/s, a variant from the legend''s ''place fields on path segments'') 207
    against 203 (p = 0.62) and 20 against 23 (p = 0.70). Variants: the linearization with the two
    diagonals added (21 to 31% of moving frames are near a diagonal only) 32 against 31 (p = 0.47);
    bins visited for at least 0.1 s 166 against 162 (p = 0.41, square) and 20 against 23 (p = 0.67,
    linearized).'
  deviations:
  - Tested on the five foraging rats only; the six W-track rats the paper pools with them are not in hc-13,
    and their data (CRCNS hc-6) were not used.
  - 'Wells and well entries and exits follow O1 reading (b), the only one the data allow (no beam-break
    times): wells are the peaks of immobile occupancy in the outer part of each quadrant of the maze,
    pooled over an animal''s days, and entries and exits are the starts and ends of immobility periods.
