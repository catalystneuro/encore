- claim: fig4-no-pole-difference
  outcome: reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig4-no-pole-difference
  notes: Two-sided paired t tests, cathodic against anodic, of |dFmax|, charging tau and
    discharging tau. None of the 16 unscaled readings (ROI a and b, weighting none or 1/SEM^2,
    discharge amplitude free or fixed, in both experiment sets) finds a difference at p < 0.05, and
    none of the frame-scaled variants does. Main reading (all 22 experiments, ROI a, unweighted,
    free amplitude) |dFmax| difference -2.36% (95% CI -6.92 to 2.21, p = 0.29, n = 15 pairs),
    charging tau 0.35 us (-0.48 to 1.18, p = 0.38), discharging tau -0.03 us (n = 14). The
    intervals are wide and, in set A, 7 to 10 of 22 experiments per reading lose a pair to a failed fit, so the
    test has little power.
  deviations:
  - The test is run over the 22 experiments in the dataset (set A) and over the 15 at 40 V (set
    B); the paper's 19 cannot be identified.
  - Unscaled data only; the debris ROI used for scaling is not in the dataset (claims file, F2).
  - ROIs rebuilt from the RATIO image under the claims file's readings O1 (a) and (b), within the
    soma region described under fig4-polarized-poles-face-electrodes.
  - Fits that fail or end at a bound (tau 0.005 or 50 us, amplitude 200%) are dropped, a standard
    choice; the counts are printed. Fits are least squares in SciPy, not Origin 8.0.
- claim: fig4-discharging-slower
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig4-discharging-slower
  notes: The criterion needs the elongated parallel group for the exception (O4), which the
    dataset does not label. Reading (a), all experiments and both poles, is shown for each
    reading of the header. Its result depends on the reading. In set A, discharging minus
    charging tau averages -0.09 to 1.25 us, with p from 0.0016 to 0.90; none reaches the
    paper's p < 0.001.
- claim: fig4-pooled-time-constants
  outcome: not_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig4-pooled-time-constants
  measured:
  - 0.87
  - 1.62
  - 0.69
  - 2.22
  notes: Means over experiment fits, all 22 experiments, unscaled. Under no reading of O1 to O3, in
    either experiment set, are all four within the paper's SEMs. In set A the cathodic charging
    means are 0.65 to 1.01 us (0.7 plus or minus 0.08), the cathodic discharging means are 1.37
    to 4.20 us (0.91 plus or minus 0.08), the anodic charging means are 0.62 to 2.28 us (0.65 plus
    or minus 0.05), and the anodic discharging means are 1.32 to 2.22 us (0.8 plus or minus 0.07).
    The measured values are from reading ROI a, unweighted, free amplitude. The medians over
    experiments are lower (cathodic discharging 1.02 to 1.46 us). The frame-scaled variant has
    no row within tolerance either. The per-experiment fits are noisy (charging tau from 0.02 to
    4.3 us at the cathodic pole), and 2 to 6 of 22 fits per pole and reading are dropped.
  deviations:
  - The ROIs and the debris ROI are not in the dataset. The polarized ROIs are rebuilt from the
    RATIO image (O1 a and b), and the traces are unscaled (F2). The paper scaled to the debris ROI
    to remove flash-to-flash laser fluctuations, which this attempt could not do; the
    whole-frame scaling shown as a variant is not the paper's.
  - 22 experiments in the dataset against the paper's 19; set A uses all 22, set B the 15 at 40 V.
  - Dim frames (below 70% of the file's median frame mean, mostly the first image acquired) are
    dropped, a standard choice; 204 of 28,000 frames.
  - The time base is the Methods' (frame 20 is the pulse onset, 50 ns per frame); the onset
    estimated from the data has median 19.9 frames (18.0 to 21.0).
