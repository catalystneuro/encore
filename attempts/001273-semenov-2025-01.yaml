findings:
- kind: metadata_insufficient
  statement: The dandiset holds only the raw images. The ROIs over the de- and hyperpolarized
    poles, the debris ROI used to scale out laser-flash fluctuations, and the shape and
    orientation group of each experiment (elongated parallel, elongated perpendicular, random)
    are not in it, so the group comparisons of Figure 4D and 4E cannot be made and the time
    constants cannot be recomputed as the paper did.
- kind: metadata_insufficient
  statement: The electrode axis is given for the January 19 and March 11 experiments, but the
    January 17 files say "Electrode position not specified", and no file says which electrode was
    the cathode or how the camera image is oriented relative to the named directions.
- kind: selection_undocumented
  statement: The files form 22 runs of 7 or 8 replicates (one run of cell 1 of January 17 has 7)
    plus six single files at 100 V; the paper reports 19 experiments. Nothing says which runs
    the paper used or why the others were left out. The nominal amplitudes vary (40, 60, 80, 100
    and 130 V) where the paper gives one field, 140 V/cm, and no file gives the field.
- kind: metadata_insufficient
  statement: Files recorded "in a backward manner" are stored in acquisition order, so their
    frames run back in time; the data show this (the backward files match the forward ones only
    once reversed), but the files do not say it beyond the stepping direction in prose.
- kind: metadata_error
  statement: The time base of the series (50 ns per frame, pulse 1 us after the first image) is
    given only in prose. The ImageSeries rate is the camera's 6 Hz, and starting_time holds the
    session start as a Unix time (about 1.7e9 s) where NWB expects seconds after the session
    start.
- kind: metadata_error
  statement: The subjects (13) are cells identified by number and date, not animals, and their
    age is P18D with reference birth, for neurons dissected at E18 and cultured about one week.
- kind: paper_inconsistency
  statement: The Results say images ran from 1 us before to 6 us after the pulse, 1,440 images per
    experiment of eight replicates (180 each); the Methods say 160 images over 8 us. The files hold
    160 images each, as the Methods say.
- kind: other
  statement: The first image acquired in 156 of 175 files of the experiments is about half as
    bright as the rest (a failed or partial flash); 204 frames in all were dropped as dim.
- kind: other
  statement: The paper's other dandisets were surveyed from their metadata only, not in a notebook.
    DANDI:001034 holds the same 178 recordings as DANDI:001032, byte for byte, under other subject
    ids (1_1 against 1_3); the 250-ms sessions of 001032 to 001035 are all in NaCl solution, so the
    sodium gluconate thresholds of Figure 3B do not appear to be deposited.
- kind: data_missing
  statement: DANDI:001272, used here for Figure S1, holds three Di-8-ANEPPS neurons (subject ids
    2, 3 and 4 of 2024-08-06) where the paper reports eight, and its files do not give the
    stimulus timing.
- kind: metadata_error
  statement: In DANDI:001030, used here for Figure 3C, every file gives the species as Mus musculus,
    where the paper used E18 rat hippocampal neurons; two of its 17 sessions (cell c5 at 1.5 and
    2.0 V) end at 1.91 s, before the 2-s stimulus does.
- kind: methods_unavailable
  statement: Question for the paper's authors. The Methods do not give the size or placement of
    the ROIs over the polarized membrane, how the fits were weighted in Origin 8.0, or whether the
    discharge amplitude was a free parameter. This attempt rebuilt the ROIs from the RATIO image
    (a 12 x 12 pixel square at the extreme pixel, or the pixels beyond half the extreme) and ran
    every combination; the pooled time constants differ from the paper's under all of them. Could
    the ROIs, the debris ROI and the list of the 19 experiments with their groups be deposited?
