- claim: fig3c-sustained-firing-2s
  outcome: partially_reproduced
  notebook: elsewhere_001030.ipynb
  output: claim:fig3c-sustained-firing-2s
  assumed: true
  notes: DANDI:001030 version 0.240520.1924, 17 sessions of four cells (c5 to c8) at 1.0 to 2.3 V.
    Judged per cell, bleach-corrected. In all four cells, under both AP readings, an intermediate
    field fires in the last 250 ms of the stimulus and the AP count after the ramp rises with
    field. Cell c7 meets the whole criterion under both readings; at 2.3 V it has no AP after the
    ramp and a corrected mean dF of 6.66%. Cells c5 and c8 stop firing at their highest field (1
    and 0 APs after the ramp under reading (a), 0 under (b)) but their mean dF there is 3.48% and
    3.63%, below the 5% level. Cell c6 keeps firing at its highest field, 1.45 V (32 APs after the
    ramp). So the criterion holds in 1 of 4 cells, and the firing part in all 4. With the first
    run's detector it holds in none (reading (a) counts 197 noise peaks on the c7 plateau, reading
    (b) one, at 1,707 ms), which also gives a partial result; without the bleaching correction it
    holds in no cell (c7 at 2.3 V has a mean dF of 3.30%).
  deviations:
  - Data elsewhere, in DANDI:001030, as the claims file assigns from the dandiset's title.
  - F is the mean over the whole 16 x 16 frame. At this resolution the soma the Methods name
    ("emission intensity over the entire cell soma") cannot be outlined.
  - The bleaching trace is the only session without APs during the stimulus under both
    readings (c7 at 1.0 V), used for every cell (Methods, "corrected for bleaching by
    subtracting a trace without APs"). Uncorrected results are shown too.
  - The first 20 frames (6.4 ms) of each file are dropped, a standard choice. The first frame is
    2.6 to 7.6 times brighter than the rest, and the next ones recover from it.
  - The criterion does not say how cells are combined. Each cell's field series is judged on its
    own, as Figure 3C shows one cell ("Sustained firing and depolarization in a neuron", Figure 3
    legend). Assumed that the claim is reproduced when the criterion holds in most cells,
    partially reproduced when it holds in at least one cell or its firing parts hold in most,
    and not reproduced otherwise. The Results present the neuron of Figure 3C as what was
    observed ("we observed sustained firing for the entire duration of the sine wave"), so a
    typical cell should show it, which a single cell does not establish. The outcome rests on
    this rule. Judged on any one cell the claim would be reproduced (c7); judged on most cells it
    would not.
  - AP detection runs on a 1-ms running mean of the trace; a reading (a) peak must stand 5% dF
    above its surroundings, and peaks of both readings must be at least 5 ms apart. These are
    standard choices (APs last about 10 ms, Methods). The first run used no smoothing and a
    prominence of 2.5%, which counted noise on a depolarized plateau as APs; it is shown as a
    variant.
- claim: figs1-di8-anepps-control
  outcome: not_reproduced
  notebook: elsewhere_001272.ipynb
  output: claim:figs1-di8-anepps-control
  notes: DANDI:001272 version 0.250805.1358, 65 sessions of three neurons (the paper reports
    eight). The criterion holds under none of the three AP readings. In no neuron does the
    highest field end in depolarization at the criterion's 5% level; the largest mean inverted dF
    over the last 100 ms of any session is 3.2%. Under reading (c), 5 SD of the pre-stimulus
    trace, every neuron fires and first-AP latency falls with field in all 3; under reading (a)
    the 5% level finds APs only in neuron 3_20240806 (4 sessions), and under reading (b) in no
    neuron.
    In 19 of 52 sessions with APs under reading (c) the first AP comes within 5 ms of the onset,
    which may be an onset artefact; without those, latency falls in 2 of 3. No variant changes
    the outcome. With the first run's detector, without the first 5 ms, or with the depolarization
    level at 5 SD of each neuron's pre-stimulus trace (2.2 to 2.5%), the highest field ends in
    depolarization in at most one neuron under any reading. The Di-8-ANEPPS signals are smaller
    than the FluoVolt signals the 5% level comes from, so the failure may lie in that level and
    not in the data; whether the level suits this dye is asked of a reader
    (questions/001273.yaml).
  deviations:
  - Data elsewhere, in DANDI:001272, as the claims file assigns from the dandiset's title. Three
    neurons where the paper reports eight.
  - F is the mean over the whole 16 x 16 frame (the soma cannot be outlined), inverted, with the
    first 20 frames dropped (standard choices).
  - The stimulus timing (50 ms before, 250 ms during) is from the Methods ("The standard imaging
    protocol started 50 ms before sine wave stimulation and continued for 250 ms during"); the
    files do not give it.
  - The criterion does not fix how "latency falls with field" or the window of "ends in
    depolarization" are judged. Latency falls when the Spearman correlation of field and first-AP
    latency over a neuron's sessions with APs is negative. A neuron ends in depolarization when
    its highest-field sessions have no APs in the last 100 ms of the stimulus and mean dF above 5%
    there, the window the claims file uses for 250-ms stimuli (fig2-modulated-locks-to-beats).
    Both are standard choices; no window gives the 5% level, as no session reaches it over its
    last 100 ms.
  - AP detection runs on a 1-ms running mean, and a peak of reading (a) or (c) must stand above its
    surroundings by the detection level (standard choices, as for fig3c-sustained-firing-2s). The
    first run's detector is a variant.
