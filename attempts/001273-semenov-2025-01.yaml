  notes: The groups of Figure 4D and 4E (elongated parallel n = 3, elongated perpendicular n = 6,
    random n = 10) are not in the dataset, and the paper judged shape and orientation by eye (O4).
    The four January 19 cells were imaged on both electrode axes, but which axis was parallel to
    each cell's long axis is not recorded. Their charging tau per axis is printed for reference
    only.
- claim: fig4-no-pole-difference
  outcome: reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig4-no-pole-difference
  notes: Two-sided paired t tests, cathodic against anodic, of |dFmax|, charging tau and
    discharging tau. None of the 16 unscaled readings (ROI a and b, weighting none or 1/SEM^2,
    discharge amplitude free or fixed, in both experiment sets) finds a difference at p < 0.05, and
    none of the frame-scaled variants does. Main reading (all 22 experiments, ROI a, unweighted,
    free amplitude) |dFmax| difference -2.36% (95% CI -6.92 to 2.21, p = 0.29, n = 15 pairs),
    charging tau 0.35 us (-0.48 to 1.18, p = 0.38), discharging tau -0.03 us (n = 14). The
    intervals are wide and, in set A, 7 to 10 of 22 experiments per reading lose a pair to a failed
    fit, so the test has little power. The time constants do not differ under any variant (each
    experiment's estimated onset, fits with tau beyond its window dropped, ROI a clipped to the
    soma). The amplitude does in two variants. With fits whose tau exceeds its window dropped,
    |dFmax| differs at p = 0.046 in 2 of 8 set A readings (n = 12). The |dF| over the last 0.5 us
    of the pulse, which needs no fit and keeps all 22 experiments, is larger at the anodic pole in
    set A (cathodic minus anodic -2.86%, p = 0.014, ROI a; -2.54%, p = 0.011, ROI b) but not in the
    40 V set (p = 0.28 and 0.24); the difference grows with amplitude (-0.95% at 40 V, -14.82% and
    -12.23% at 100 and 130 V, ROI a), and without the 100 and 130 V runs it is -1.79% (p = 0.048).
    The criterion's quantity, the fitted |dFmax|, shows no difference under any of the header
    readings (O1 to O3); only the window variant, which drops fits, gives p = 0.046 in 2 of its 8
    set A readings. The outcome follows the criterion's quantity and readings. The absence of a
    pole difference in amplitude is weak in set A, and depends on whether the 100 and 130 V runs
    belong to the paper's 19 experiments, which the dataset does not say.
  deviations:
  - The test is run over the 22 experiments in the dataset (set A) and over the 15 at 40 V (set
    B); the paper's 19 cannot be identified.
  - Unscaled data only; the debris ROI used for scaling is not in the dataset (claims file, F2).
  - ROIs rebuilt from the RATIO image under the claims file's readings O1 (a) and (b), within the
    soma region described under fig4-polarized-poles-face-electrodes.
  - Fits that fail or end at a bound (tau 0.005 or 50 us, amplitude 200%) are dropped, a standard
    choice; the counts are printed. Fits are least squares in SciPy, not Origin 8.0.
- claim: fig4-discharging-slower
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig4-discharging-slower
  notes: The criterion needs the elongated parallel group for the exception (O4), which the
    dataset does not label. Reading (a), all experiments and both poles, is shown for each
    reading of the header. Its result depends on the reading. In set A, discharging minus
    charging tau averages -0.09 to 1.25 us, with p from 0.0016 to 0.90; none reaches the
