outcomes:
- claim: fig4-polarized-poles-face-electrodes
  outcome: reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig4-polarized-poles-face-electrodes
  assumed: true
  notes: Tested on the 14 experiments whose session description names the electrode axis (January
    19 and March 11). In 13 of 14 the extreme depolarized and hyperpolarized pixels of the soma lie
    on opposite sides of its centroid with their separation within 45 degrees of the field axis
    (median angle 13.8 degrees); the exception (cell 1 of March 11) is at 48.7 degrees. With the
    axes swapped, 1 of 14 passes. In the 40 V experiments, 10 of 11 pass. The shape groups are not
    in the dataset, so the majority is taken over all experiments with an axis (O4), not per
    group. The polarity of the electrodes is not given, so which pole faced the cathode is not
    tested. With the soma mask opened by a disc of radius 8 pixels, to trim neurite stumps the
    threshold mask can take in, 12 of 14 pass (median angle 17.1 degrees). The neurite part is
    reported, not judged; the 99th percentile of the absolute RATIO change outside the soma is
    below that within it in 21 of 22 experiments.
  deviations:
  - The ROIs are not in the dataset. The extreme pixels are taken from the RATIO image rebuilt as
    the Methods describe (Pulsed laser fluorescence microscopy, CONTROL, POLARIZED and RATIO
    images, 12 x 12 pixel low-pass filter), within the soma, defined as the connected region of
    the filtered CONTROL image brighter than halfway between the image median and the brightest
    central pixel (a standard choice; the neuron was centred in the field, Methods, Sine wave and
    square pulse stimulation). The centroid is that of the soma region.
  - Assumed that "Up and Bottom" in the session description is the image's vertical axis and
    "Right and Left" its horizontal axis. The files do not give the orientation of the camera
    image relative to the stage; this is the plain reading of the description.
  - The 8 January 17 experiments have "Electrode position not specified" and are left out.
