inputs:
- what: The paper's code, read for the lap definition (a lap starts where position wraps to the
    start of the belt). It holds only the deep-network classifier of Figure S3.
  source: https://github.com/losonczylab/Geiller_Vancura_Neuron2020 at commit c37f37c3a0a14df50332ff6c87b0692ba460a97b
outcomes:
- claim: fig1-cells-per-mouse
  outcome: partially_reproduced
  notebook: reproduce_geiller_2020.ipynb
  output: claim:fig1-cells-per-mouse
  measured: [231, 74]
  notes: The mouse has 231 ROIs, inside 226.6 ± 27.3 (199.3 to 253.9). 74 ROIs carry one of the
    six subtypes and 83 are not labelled UNIDENTIFIED; both are below 121.0 ± 28.4 (92.6 to
    149.4).
  deviations:
  - One mouse, compared with the paper's mean and standard deviation over 16 mice.
  - Two readings of "assigned a subtype" were allowed, as the labels NOTHING and UNIDENTIFIED are
    not explained.
- claim: fig1-depth-distribution
  outcome: blocked
  blocked_by: data_missing
  notes: The files hold no depth or 3D coordinates of the ROIs. The plane segmentation has only
    id and pixel_mask (x, y, weight, no z); the masks lie on a strip of the 231 cropped frames side
    by side, and the imaging plane's origin_coords and grid_spacing are placeholders. The paper's Z-stacks and coordinates are not public as far as the dandiset
    and the paper's repository show.
- claim: fig2c-most-positive
  outcome: reproduced
  notebook: reproduce_geiller_2020.ipynb
  output: claim:fig2c-most-positive
  measured: 0.095
  notes: Averaged over sessions, 90.5% of the 74 ROIs in the six subtypes are positively
    correlated with velocity and 0.095 negatively, inside 0.088 to 0.108. Among all 228 imaged
    ROIs 96.5% are positive and 0.035 negative, outside the tolerance. The claim holds under the
    six-subtype reading, and only because r is averaged over sessions; per session that reading
    gives 0.055, 0.143 and 0.164, all outside the range. Per session the all-ROI reading gives
    0.065, 0.111 and 0.089, in range in session 21322 only. The sign of r changes between
    sessions in 17 of the 74 subtyped ROIs (7 of 15 CCKC); 18 are negative in at least one session
    and 7 on average. The result is at the edge of the range; 6 or 8 of 74 would fall outside it.
  deviations:
  - One mouse, three sessions, where the paper has seven mice.
  - Frame rates for sessions 21324 and 21322 fitted from the data; on the stated clock 28% of ROIs
    in session 21322 are negatively correlated.
  - Velocity smoothed with a Gaussian of 0.5 s, a width the paper does not give; 0 and 1 s change
    the averaged fractions by no more than 0.005 under either reading, and a per-session fraction
    by at most 0.014.
  - Correlations averaged over sessions on the assumption that the ROI index is the same cell,
    which the data are consistent with but do not show.
  - The denominator can be read two ways; the six-subtype reading matches and the all-ROI reading
    does not.
- claim: fig2c-cck-negative
  outcome: reproduced
  notebook: reproduce_geiller_2020.ipynb
  output: claim:fig2c-cck-negative
  notes: 6 of 15 CCKC (0.40) are negatively correlated against 1 of 59 cells in the other five
    subtypes, one-sided Fisher exact p = 0.00017. By session the CCKC fraction is 0.13, 0.50 and
    0.43.
  deviations:
  - One mouse, 15 CCKC, where the paper has 44 from seven mice.
  - The threshold of 0.35 for "nearly half" is ours.
- claim: fig2c-subtypes-differ
  outcome: reproduced
  notebook: reproduce_geiller_2020.ipynb
  output: claim:fig2c-subtypes-differ
  notes: One-way ANOVA across the six subtypes gives p = 0.0015. Tukey's test places the
    difference with CCKC, lower than PVBC (p = 0.0009) and IvC/NGFC (p = 0.005). Per session the
    ANOVA is significant in one session of three. The paper's p < 1e-10 rests on seven mice and
    is not reached here.
  deviations:
  - One mouse; significance threshold 0.05 in place of the paper's reported p-value.
- claim: fig2c-ngfc-less-modulated
  outcome: not_reproduced
  notebook: reproduce_geiller_2020.ipynb
  output: claim:fig2c-ngfc-less-modulated
  notes: Averaged over sessions IvC/NGFC have a mean correlation of 0.511 against 0.484 for PVBC,
    SomC, BiC and AAC pooled (one-sided Mann-Whitney p = 0.58), and the same for the absolute
    correlation. Session 21324 alone shows a lower correlation for IvC/NGFC (0.368 against 0.525,
    p = 0.005); the other two sessions do not.
  deviations:
  - One mouse with 13 IvC/NGFC, where the paper has 119.
  - The comparison group (PVBC, SomC, BiC and AAC pooled) and the test are ours.
- claim: fig2d-negative-cells-in-oriens
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the depth of each ROI, which the files do not hold.
- claim: s2-lags
  outcome: not_reproduced
  notebook: reproduce_geiller_2020.ipynb
  output: claim:s2-lags
  notes: Positively correlated ROIs lag velocity (median -1.67 s), as stated. The 8 negatively
    correlated ROIs have a larger median absolute lag (2.06 s against 1.67 s, one-sided p = 0.60),
    and the same direction holds in each session taken alone. Lags are averaged over sessions even
    where the sign of r changes; keeping only ROIs with the same sign in every session leaves 1
    negatively correlated ROI, too few to test. Figure S2 itself was not available.
  deviations:
  - One mouse; the paper's Figure S2 was not available, so the criterion rests on the Results text.
  - Lags depend on imaging and behaviour starting together at time 0, which the files state and
    which could not be checked independently.
- claim: s2-cck-run-stop
  outcome: partially_reproduced
  notebook: reproduce_geiller_2020.ipynb
  output: claim:s2-cck-run-stop
  notes: At run stops the other five subtypes drop by 0.06 to 0.10 dF/F while CCKC stay flat on
    average (-0.003), a significant difference (one-sided Mann-Whitney p = 0.0009 at separations
    of 3, 5 and 10 s). CCKC do not rise on average, which the criterion requires. The 6 negatively
    correlated CCKC rise (0.084) and the other 9 fall (-0.061). By session the mean CCKC response is
    -0.005, 0.024 and -0.023, while every other subtype falls in every session (-0.021 to -0.173);
    the CCKC negatively correlated in a session rise in all three (0.019, 0.123 and 0.102).
  deviations:
  - One mouse; event separation of 5 s chosen for "several seconds", with 3 and 10 s shown.
- claim: s3-subtype-classification
  outcome: blocked
  blocked_by: data_missing
  notes: The reported accuracies come from a network trained on cells pooled from the paper's
    mice with depth as a feature. The dandiset holds one mouse (74 identified cells, 13 to 33 per
    merged class) and no depth. A dF/F-only network could be trained on this mouse, but it would
    not test the reported accuracies. The code is public (TensorFlow 2.1, Keras 2.3.1); its data
    files are not.
- claim: fig3-swr-pvbc-vs-somc
  outcome: blocked
  blocked_by: data_missing
  notes: The ripple experiments used LFP and 40 Hz imaging of about 30 cells in four other mice.
    The dandiset holds no LFP and no 40 Hz sessions.
- claim: fig3-swr-bimodal
  outcome: blocked
  blocked_by: data_missing
  notes: As for fig3-swr-pvbc-vs-somc.
- claim: fig4-fraction-spatial
  outcome: not_reproduced
  notebook: reproduce_geiller_2020.ipynb
  output: claim:fig4-fraction-spatial
  measured: 0.010
  notes: With the paper's rule, including a peak above 100% dF/F, 1.0% of ROIs are selected on
    average over sessions, since only 1.1% of ROIs have a tuning curve reaching 1.0 dF/F. Without
    the peak rule 69.8% are selected, against 8.6% on a surrogate with dF/F rotated against
    behaviour. Neither reading is within 17.5 ± 6.4%. A peak rule of 50% dF/F gives 13.0%, but
    that threshold is not the paper's. The paper states no false-positive rate for the rule.
  deviations:
  - One mouse, three sessions, where the paper has six mice with three sessions each.
  - Fields may wrap around the end of the belt (not stated in the paper); without wrapping the
    rule without the peak selects 66.0%.
  - The belt is 2.11 m long in the data, divided into 100 bins of 2.11 cm, where the paper has
    2 m and 2 cm bins.
  - The dF/F in the files may not be scaled as the paper's was; this cannot be checked.
- claim: fig4-fraction-negative
  outcome: not_reproduced
  notebook: reproduce_geiller_2020.ipynb
  output: claim:fig4-fraction-negative
  measured: 0.664
  notes: On average 66.4% of ROIs have a negative field (47.0%, 74.5% and 77.7% by session),
    against 10.8% on the surrogate and 12.7 ± 8.3% in the paper. Under the paper's rule the two
    kinds of field are coupled, as a strong field raises the rotated shuffles at every bin. On
    synthetic cells, a cell with only a positive field is also flagged negative, and a cell with
    only a negative field is flagged positive under the rule without the peak. With the positive
    rule without the peak, 55.8% of ROIs on average have both kinds, 10.6% only a negative field
    and 13.9% only a positive one. The coupling explains part of the 66.4%, not all of it; 78.4%
    of ROIs with a positive field have a negative field, and so do 37.7% of ROIs without one, about
    3.5 times the surrogate rate. Counting only ROIs with a negative field and no positive field
    gives 10.6%, inside the paper's range, but that variant depends on the positive rule without
    the peak (65.3% with the peak rule), excludes real negative cells flagged positive, and was
    chosen after the result, so the outcome is kept.
  deviations:
  - As for fig4-fraction-spatial.
- claim: fig4d-decoding
  outcome: not_reproduced
  notebook: reproduce_geiller_2020.ipynb
  output: claim:fig4d-decoding
  notes: The criterion holds in one session of three. In 21324 the 162 selected ROIs give an
    error of 13.8 cm, against 13.2 cm from all ROIs, 14.4 cm from random subsets and 48.7 cm with
    position shuffled. In 21333 the 118 selected ROIs do no better than random subsets (25.2
    against 24.8 cm). In 21322 the 6 peak-rule ROIs give 30.3 cm against 15.4 cm from all ROIs.
    Shuffling position brings the error to about chance (49 to 53 cm, chance 52.7 cm) in every
    session, and all ROIs decode position with errors of 13 to 21 cm.
  deviations:
  - The selected subset is not small in two sessions (118 and 162 ROIs), because the peak rule
    selects fewer than 5 ROIs there and the rule without the peak is used.
  - A one-vs-one linear SVM (scikit-learn SVC, C = 1); the paper names a linear SVM without
    the multi-class scheme or penalty.
  - Shuffled position made by rotating dF/F against position by at least 60 s, three draws; ten
    random subsets.
- claim: fig4e-bic-recurrence
  outcome: blocked
  blocked_by: other
  notes: The dandiset has 3 BiC, below the 5 the criterion requires; the paper had 50.
- claim: fig4f-selectivity-no-difference
  outcome: reproduced
  notebook: reproduce_geiller_2020.ipynb
  output: claim:fig4f-selectivity-no-difference
  notes: One-way ANOVA across the six subtypes of the selectivity index of selected cells gives
    p = 0.17, so no difference is found. Subtype means range from 0.012 to 0.033 with a standard
    deviation of 0.020 across cells. The tuning curves of the selected subtyped cells have a
    median minimum of 0.158 dF/F and a median maximum of 0.255; subtracting each curve's minimum
    raises the median index from 0.016 to 0.307. The test compares near-flat curves and has
    little power.
  deviations:
  - Selection without the peak rule in two sessions, as for fig4d-decoding, so the cells are
    many more than the paper's spatially selective cells.
- claim: fig4h-pvbc-more-stable
  outcome: not_reproduced
  notebook: reproduce_geiller_2020.ipynb
  output: claim:fig4h-pvbc-more-stable
  notes: For 22 spatially selective PVBC and 9 SomC, the mean odd-even correlation is 0.678 and
    0.736 (unpaired t-test p = 0.42); SomC are higher in each session where both are present.
  deviations:
  - Selection as for fig4d-decoding.
  - Each cell's correlation averaged over the sessions in which it was selected.
- claim: s6-within-session-order
  outcome: partially_reproduced
  notebook: reproduce_geiller_2020.ipynb
  output: claim:s6-within-session-order
  notes: CCKC have the lowest mean odd-even correlation (0.500). PVBC (0.598) are second to SomC
    (0.606). The one-way ANOVA across the five subtypes with at least 5 cells gives p = 0.56, so
    the statement that subtypes differ does not hold here.
  deviations:
  - One mouse; Figure S6 was not available, so the criterion rests on the Results text.
- claim: s6-later-lower-above-chance
  outcome: partially_reproduced
  notebook: reproduce_geiller_2020.ipynb
  output: claim:s6-later-lower-above-chance
  notes: Across-session correlations are lower than within-session ones in every pair (0.22
    against 0.61 for the same-day pair, Wilcoxon p = 4e-07; 0.06 and 0.14 for the two-day
    pairs). Above chance holds only for the same-day pair with identities shuffled among all
    cells (p = 0.047), not with shuffles within subtype (p = 0.10), and for neither two-day pair
    (p = 0.075 and 0.53).
  deviations:
  - Sessions 2.5 h and 54 to 56 h apart stand in for 1 h and 24 h. The order rests on the stated
    start times, which put 21333 first although its id is the highest; nothing else in the files
    dates the sessions.
  - The ROI index is taken as the same cell across sessions; tuning curves of the same index
    agree above a shuffled null only for one pair, so a failure here may reflect the ROI mapping.
- claim: fig5-context-decorrelation
  outcome: blocked
  blocked_by: data_missing
  notes: All three sessions are random foraging; no novel-belt session is included, and the
    files do not name the belt.
- claim: fig5-novel-context-decrease
  outcome: blocked
  blocked_by: data_missing
  notes: As for fig5-context-decorrelation.
- claim: fig6-reward-somc-bic
  outcome: blocked
  blocked_by: data_missing
  notes: No goal-oriented learning session and no lick record are included.
- claim: fig6-old-zone
  outcome: blocked
  blocked_by: data_missing
  notes: As for fig6-reward-somc-bic.
- claim: fig7-vip-subtypes-immobility
  outcome: blocked
  blocked_by: data_missing
  notes: These cells come from VIP-Cre mice and strategy 3 VGAT-Cre mice; the dandiset's mouse
    tg19 is a strategy 1 mouse, without VIP, CR or M2R staining.
- claim: fig7-isi-correlations
  outcome: blocked
  blocked_by: data_missing
  notes: As for fig7-vip-subtypes-immobility.
findings:
- kind: metadata_error
  statement: The imaging rate is stated as 5.7981 Hz for all three sessions. For sessions 21324
    and 21322 that makes imaging 680 s long against 900 s and 879 s of behaviour, and the
    population activity does not follow running (r = 0.16 and 0.09). Rates of 4.395 and 4.385 Hz
    give r = 0.72 and 0.87, decode running at 0.94 and 0.89 balanced accuracy, and make all three
    sessions about 898 s long. Session 21333's stated rate fits.
- kind: metadata_error
  statement: The unit of the dF/F series is given as lumens; the values are dF/F fractions.
- kind: data_missing
  statement: The Fluorescence series is the same HDF5 object as the DfOverF series, so the raw
    fluorescence the description lists is not in the files.
- kind: metadata_error
  statement: The description of the subtype column reads "Recording location in Middle Earth",
    and the subtype table has 232 rows for 231 ROIs (id 231 has no ROI).
- kind: metadata_insufficient
  statement: The labels NOTHING and UNIDENTIFIED, the label "AAC (RIGHT CELL)", and the reward
    and water intervals have no description.
- kind: identifier_missing
  statement: Nothing states that a ROI index refers to the same cell in every session. The data
    are consistent with it (velocity correlations of the same index agree across sessions above a
    shuffled null) but tuning curves agree above the null for only one pair of sessions.
- kind: data_missing
  statement: The files hold no depth or position of the ROIs in the imaged volume, which several
    of the paper's analyses use, and no lick record.
- kind: metadata_error
  statement: All three sessions are described as "session 1 of 4", and the experiment description
    names four random-foraging sessions; only three are in the dandiset. The session ids (21322,
    21324, 21333) and the start times (21333 two days before the other two) give different
    orders, and nothing else in the files dates the sessions.
- kind: metadata_insufficient
  statement: The pixel masks lie on a strip of the 231 cropped frames side by side (x from 0 to
    10625), the imaging plane's origin_coords (0, 0) and grid_spacing (50, 50 um) are
    placeholders, and there are no reference images, so a ROI has no position in the field of
    view or in depth.
- kind: selection_undocumented
  statement: The dandiset holds one of the paper's 16 mice and only its random-foraging sessions,
    without saying which part of the paper it covers.
- kind: metadata_error
  statement: The emission wavelength is given as 920 nm, equal to the excitation, and the
    subject's age is P60D in sessions two days apart, where the paper gives 3 to 5 months.
- kind: metadata_insufficient
  statement: The description lists raw images of individual cropped ROIs, but each file holds a
    single cropped series (33 x 46 or 25 x 46 pixels) without saying which ROI it shows.
- kind: other
  statement: With the paper's place-field rule, which requires a peak above 100% dF/F, 1.0% of
    ROIs qualify, as only 1.1% of tuning curves reach 1.0 dF/F. The dF/F in the files may be
    scaled or smoothed differently from the paper's.
verifications:
- date: '2026-10-14'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: The first executed notebook with the conclusion cells and the summary removed, the helper
    module, the claims file and the paper's full text (PMC7736348). The verifier checked the archive's
    version and asset metadata through the DANDI REST API, and ran synthetic checks of place_fields, run_events,
    sparsity_index, velocity_correlation, decode_position and lap_tuning.
  results:
  - claim: fig1-cells-per-mouse
    agrees: true
    outcome: partially_reproduced
    reason: Imaged ROIs (231 in files, 228 imaged at least once) fall inside 226.6 ± 27.3. ROIs with a
      subtype (74 in the six subtypes, 83 not UNIDENTIFIED) fall below the 92.6 to 149.4 range under both
      allowed readings.
    response: No change needed.
  - claim: fig1-depth-distribution
    agrees: true
    outcome: blocked
    reason: No depth or z coordinate is read. The asset metadata lists only one PlaneSegmentation and
      ImagingPlane per file. It could not confirm from the REST API that no depth or z coordinate exists,
      for example a z field in pixel_mask, ImagingPlane origin_coords or grid_spacing, or per-ROI offsets
      in the cropped image series.
    response: The data check now prints the PlaneSegmentation columns (id, pixel_mask, pixel_mask_index),
      the pixel_mask fields (x, y, weight, no z) and their ranges, and the ImagingPlane fields with origin_coords
      (0, 0) and grid_spacing (50, 50) um. The masks lie on a strip of the 231 crops side by side, so
      they give no position. Outcome kept; notes and a finding updated.
  - claim: fig2c-most-positive
    agrees: true
    outcome: reproduced
    reason: Under the six-subtype reading, 0.905 are positive and 0.095 (7/74) negative, inside 0.088
      to 0.108. The all-ROI reading gives 0.035, far outside. The result is fragile, as 6/74 would fail.
      Averaging r over sessions cuts the all-ROI negative fraction from 0.065 to 0.111 per session to
      0.035, which is why fig2c passes only under the 74-ROI reading (affects a conclusion). The frame-rate
      fit maximises the population-speed correlation, which is partly circular, though the independent
      evidence is strong (does not affect a conclusion). It asked for a per-ROI table of r in each session
      for the subtyped ROIs.
    response: Added the per-ROI table of r in each session for the 74 subtyped ROIs. The sign changes
      between sessions in 17 of them (7 of 15 CCKC); 18 are negative in at least one session and 7 on
      average. The notes now say that averaging lowers the negative fraction and that the result is near
      the edge of the range. Outcome kept.
  - claim: fig2c-cck-negative
    agrees: true
    outcome: reproduced
    reason: 6 of 15 CCKC are negative (0.40, which is at least 0.35), against 1 of 59 in the other five
      subtypes; one-sided Fisher p = 1.7e-4.
    response: No change needed.
  - claim: fig2c-subtypes-differ
    agrees: true
    outcome: reproduced
    reason: ANOVA p = 0.0015. The difference is driven by CCKC, as Tukey is significant only for PVBC-CCKC
      and CCKC-IvC/NGFC. Only one of three sessions is significant on its own.
    response: No change needed; the notes already state both points.
  - claim: fig2c-ngfc-less-modulated
    agrees: true
    outcome: not_reproduced
    reason: IvC/NGFC mean r is 0.511 against 0.484 for the pooled four subtypes, the wrong direction;
      Mann-Whitney p = 0.58 for both r and |r|. Only session 21324 alone goes the claimed way.
    response: No change needed.
  - claim: fig2d-negative-cells-in-oriens
    agrees: true
    outcome: blocked
    reason: No depth or layer per ROI.
    response: The new output on the plane segmentation and imaging plane (see fig1-depth-distribution)
      shows there is none.
  - claim: s2-lags
    agrees: true
    outcome: not_reproduced
    reason: The median lag of positive ROIs is -1.67 s, which meets the criterion. But negative ROIs have
      larger |lag| (2.06 s), not smaller; p = 0.60, and every session gives p of at least 0.82. Lags are
      averaged across sessions even when the sign of r flips between them (affects a conclusion).
    response: Added a variant keeping only ROIs whose r has the same sign in every session; it leaves
      1 negatively correlated ROI, too few to test, so the per-session results stand as the check. Notes
      updated. Outcome kept.
  - claim: s2-cck-run-stop
    agrees: true
    outcome: partially_reproduced
    reason: CCKC run-stop responses are higher than the other subtypes (Mann-Whitney p about 9e-4 at 3,
      5 and 10 s separation). The mean CCKC run-stop response is -0.003, not positive; only the 6 negatively
      correlated CCKC respond positively (0.084). It asked for per-session CCKC run-stop means, to show
      whether the near-zero average hides a session-dependent sign. run_events thresholds a jittery speed
      trace, though event counts look plausible (does not affect a conclusion).
    response: Added per-session run-stop means by subtype. CCKC give -0.005, 0.024 and -0.023, while every
      other subtype falls in every session (-0.021 to -0.173); the CCKC negatively correlated in a session
      rise in all three. Notes updated. Outcome kept.
  - claim: s3-subtype-classification
    agrees: true
    outcome: blocked
    reason: No depth, and one mouse with 74 labelled ROIs. The dF/F and velocity feature sets exist, so
      a weak cell-wise variant could be run but would not be comparable.
    response: No change needed.
  - claim: fig3-swr-pvbc-vs-somc
    agrees: true
    outcome: blocked
    reason: variableMeasured has no ecephys or LFP series. Imaging is at 4.4 to 5.8 Hz, not the 40 Hz
      SWR protocol.
    response: No change needed.
  - claim: fig3-swr-bimodal
    agrees: true
    outcome: blocked
    reason: variableMeasured has no ecephys or LFP series. Imaging is at 4.4 to 5.8 Hz, not the 40 Hz
      SWR protocol.
    response: No change needed.
  - claim: fig4-fraction-spatial
    agrees: true
    outcome: not_reproduced
    reason: 0.010 with the 100% peak rule and 0.698 without it, against 0.175 ± 0.064. Only 1.1% of ROIs
      have a tuning peak above 1.0 dF/F. The 50% peak variant (0.130) would fall in range but is not an
      allowed reading. The no-peak rule is anti-conservative (surrogate false-positive rate 0.04 to 0.16
      per session; its own AR-noise test gave 0.22 positive and 0.20 negative).
    response: No change needed; the notes already give the surrogate rates.
  - claim: fig4-fraction-negative
    agrees: true
    outcome: not_reproduced
    reason: 0.664 against 0.127 ± 0.083. Positive and negative fields are mechanically coupled; on synthetic
      data a cell with only a positive field was also flagged negative, and a cell with only a negative
      field was flagged positive under the no-peak rule. Out-of-field
      bins sit below the shuffled 5th percentile because rotated curves spread the field everywhere, so
      the estimate is not comparable to the paper's 12.7%. The notebook neither reports the overlap of
      the two sets nor discusses it (affects a conclusion).
    response: Added the overlap per session and its mean (55.8% both, 10.6% negative only, 13.9% positive
      only) and a variant excluding ROIs also flagged positive (10.6%, inside the range). The coupling
      follows from the paper's stated rule, which the helper implements, so it is explained in the notebook
      and notes and not changed. The variant was chosen after the result and is not the paper's rule,
      so the outcome is kept.
  - claim: fig4d-decoding
    agrees: true
    outcome: not_reproduced
    reason: Holds in 1 of 3 sessions; at least 2 are required. In 21333 the selected subset (25.2 cm)
      is worse than random subsets (24.8 cm). In 21322 the 6 peak-rule cells give 1.97 times the all-ROI
      error. Where the no-peak rule applies, the subset is 55 to 75% of ROIs, so this barely tests the
