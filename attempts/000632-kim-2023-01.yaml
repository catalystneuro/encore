outcomes:
- claim: fig3-1hz-co-equals-cross
  outcome: reproduced
  notebook: reproduce_kim_2023.ipynb
  output: claim:fig3-1hz-co-equals-cross
  notes: Under background reading (b) the co-directional dishes at 1 Hz (mean 665, n = 5) average 0.68
    of the cross-directional ones (972, n = 6); two-tailed Student's t-test p = 0.32, so the test does
    not find a difference. Reading (a) gives ratio 0.75, p = 0.31; Welch's test and the variants (whole-disc
    footprint background, YP over MemBrite, center ROIs of 150 and 250 um, without dishes whose footprint
    centers are more than 400 um from a parallelogram, the deposit as labelled) give p from 0.28 to 0.68.
    By experiment day the comparison goes opposite ways, 0.45 on 2022-11-29 (p = 0.023, n = 3 and 3) and
    1.43 on 2022-12-04 (p = 0.49, n = 2 and 3).
  deviations: &id001
  - The center ROI is placed automatically at the mean of the four electrode footprint centers, located
    by template matching on a reduced YP image (epimg.find_footprints); the paper placed it by hand in
    MetaMorph (Methods 4.4). The located footprints and ROI are shown for every dish.
  - The files give no pixel size. 0.65 um per pixel is assumed (the 6.5 um ORCA-Flash4 pixel behind the
    10x objective named in Methods 4.4); under it the footprints measure a median 1.59 mm across against
    the 1.5 mm needles (Methods 4.2), so the 200 um ROI may be about 6% larger than the paper's. Center
    ROIs of 150 and 250 um sides are run as variants and give the same outcomes.
  - Background reading (b) subtracts the mean YP of a 200 x 200 um ROI at the center of each of the four
    footprints. Methods 4.4 says only that measurements were made within the footprints 'to account for
    spontaneous YP uptake'; the ROI size is the paper's, its place a stated choice, and a variant over
    the whole disc inside 0.6 of the footprint radius gives the same outcome.
  - The dataset holds 23 distinct dishes, not 24. The file labelled co-directional 1 Hz, sub-BPAE-8unipolar-1Hz-04,
    is a copy of the cross-directional 1 Hz file sub-BPAE-8bipolar-1Hz-600ns-04 and is counted once, as
    cross-directional (its start time is in the 2022-11-29 series, where number 04 is otherwise missing,
    and its anisotropy index is in the cross-directional range). The groups then have 5, 6, 5 and 7 dishes
    (co 1 Hz, cross 1 Hz, co 770 kHz, cross 770 kHz) against the paper's n = 6 each. The deposit as labelled
    is shown as a variant and gives the same outcome.
- claim: fig3-770khz-co-enhanced
  outcome: not_reproduced
  notebook: reproduce_kim_2023.ipynb
  output: claim:fig3-770khz-co-enhanced
  notes: The co-directional mean at 770 kHz is higher than at 1 Hz, 1.67-fold under reading (a) and 1.96-fold
    under reading (b) (1301 against 665, n = 5 and 5), but the two-tailed Student's t-test does not find
    the difference (p = 0.15 and 0.16). No variant reaches p < 0.05; the smallest p is 0.087 (YP over
    MemBrite). The two background readings agree, so the claim is not blocked. On 2022-11-29 the 770 kHz
    mean is 2.74 times the 1 Hz one (p = 0.060, n = 3 and 3), on 2022-12-04 0.76 times it (p = 0.47, n
    = 2 and 2). The temporal summation explanation is not tested.
  deviations: *id001
- claim: fig3-770khz-cross-same-as-1hz
  outcome: reproduced
  notebook: reproduce_kim_2023.ipynb
  output: claim:fig3-770khz-cross-same-as-1hz
  notes: Under reading (b) the cross-directional dishes at 770 kHz (mean 819, n = 7) average 0.84 of those
    at 1 Hz (972, n = 6); Student's p = 0.56, so the test does not find a difference. Reading (a) gives
    0.87, p = 0.53, and no variant finds one (p from 0.37 to 0.82). By day the ratio is 0.71 on 2022-11-29
    (p = 0.073) and 1.40 on 2022-12-04 (p = 0.36). The statement's interpretation, that charging two membrane
    regions does not sum, is not tested.
  deviations: *id001
- claim: fig3-770khz-co-above-cross
  outcome: not_reproduced
  notebook: reproduce_kim_2023.ipynb
