findings:
- kind: other
  statement: One recording is deposited twice under two conditions. sub-BPAE-8unipolar-1Hz-04 (session
    Co-directional_1Hz) and sub-BPAE-8bipolar-1Hz-600ns-04 (session Cross-directional_1Hz) have identical
    chunk indexes, identical images and the same start time (2022-11-29 16:57). The start time and the
    image's pattern of uptake point to the cross-directional label, so the co-directional 1 Hz group holds
    5 distinct dishes.
- kind: metadata_error
  statement: The group sizes do not match the paper. By label the files are 6 co-directional 1 Hz, 6 cross-directional
    1 Hz, 5 co-directional 770 kHz and 7 cross-directional 770 kHz (5, 6, 5 and 7 with the copy counted
    once), where the paper's Figure 3 reports n = 6 for each group. The 2022-12-04 series has four cross-directional
    and two co-directional dishes at 770 kHz, and lacks a number 04. One cross-directional dish more and
    one co-directional dish fewer than the paper's n = 6 at 770 kHz would follow from one mislabelled
    dish, but the four cross-directional 770 kHz dishes of 2022-12-04, the day with the extra dish,
    have anisotropy indexes of 0.06 to 0.18, below every co-directional dish (0.31 to 0.75), so the
    labels are used as deposited.
- kind: metadata_error
  statement: The dandiset description and every session description say the electrodes were arranged in
    a triangular array. The images show four electrode footprints in a square, as the paper describes
    for this experiment (Methods 4.2, a 4-electrode square array).
- kind: metadata_insufficient
  statement: The files give no pixel size (the ImageSeries has no resolution or field of view) and name
    the channels only in a free-text description. A scale of 0.65 um per pixel had to be inferred from
    the camera and objective; under it the electrode footprints measure 1.59 mm against the 1.5 mm needles.
- kind: metadata_insufficient
  statement: The subject names carry undocumented tokens ('8bipolar', '8unipolar', '600ns'). 'bipolar'
    and 'unipolar' match the cross- and co-directional sessions, and '600ns' marks the files of 2022-11-29;
    the trailing numbers run 01 to 12 in order of start time within each day. None of this is described.
- kind: other
  statement: The dataset holds only the Figure 3 experiment. The data of Figures 2, 4 and 5 are in DANDI:000631,
    000633 and 000634, whose metadata name the paper, but 000632 does not point to them, and the paper's
    Data Availability Statement says the data are available on request without naming any of the four
    dandisets.
- kind: methods_unavailable
  statement: Question for the paper's authors. Methods 4.4 says spontaneous YP uptake was measured within
    the electrode footprints but not where in the footprint, over what area, or how it entered the Figure
    3 values (subtracted from the center ROI, or not). This attempt subtracts the mean of a 200 x 200
    um ROI at the center of each footprint, and shows the raw values and a whole-disc variant; all give
    the same outcomes. Which pairs of groups the p-values printed in Figure 3 compare is also not stated
    in the text.
verifications:
- date: '2026-10-31'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The executed notebook with the conclusion cells and the summary removed, the helper
    module and the claims file, with the paper. The verifier tested find_footprints, _roi_mean, _disc_mean
    and ov_to_px on synthetic input, and checked the archive's other dandisets. It agreed with every outcome.
    Its main point was that the Figure 2, 4 and 5 data are public in DANDI:000631, 000633 and 000634, so
    the notebook's statement that they are not public elsewhere is false. It asked for each dish's center
    offset or a finer view of the center ROI, and for an independent check of the 0.65 um pixel size.
    In reply the revision locates the footprints again on a finer image, prints the offsets and shows
    the arrays at 10.4 um, runs the refined positions as a variant, prints the 95% interval and the
    smallest detectable difference for each test, lists the three other dandisets from the archive,
    changes the reason of the seven blocks to other, and asks a reader whether to mark those claims data
    elsewhere. The verifier also noted that the extra cross-directional and missing co-directional 770
    kHz dish were not discussed; the notebook and the group-size finding now discuss them. Its other points
    (the assignment of the duplicated image, the YP and MemBrite correlation, the opposite day effects,
    the footprint background area, the triangular-array description) were already shown in the notebook
    and needed no change.
