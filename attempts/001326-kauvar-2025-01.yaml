- claim: fig4-recordings-scale
  outcome: reproduced
  notebook: reproduce_kauvar_2025.ipynb
  output: claim:fig4-recordings-scale
  measured:
  - 13
  - 10
  - 6698
  notes: 13 sessions from 10 mice, 9554 curated units, 6698 puff-modulated units (6491 if the code's minimum
    of 250 is read as spikes). The median session has units in 32 finest-level regions (range 11 to 37;
    10 of 13 sessions have at least 24).
  deviations:
  - The units in the files are already curated (all labelled good, SNR at least 2.0, at least 517 spikes);
    the BombCell and ISI criteria cannot be re-applied, as the files hold no waveforms or ISI metrics.
- claim: fig4de-response-clusters
  outcome: partially_reproduced
  notebook: reproduce_kauvar_2025.ipynb
  output: claim:fig4de-response-clusters
  measured:
  - 11
  - 941
  - 786
  - 755
  - 713
  - 645
  - 643
  - 568
  - 542
  - 526
  - 392
  - 187
  - 0
  notes: Leiden gives 11 clusters (within one of 12). In descending order the sizes are 941, 786, 755,
    713, 645, 643, 568, 542, 526, 392 and 187; 7 of 11 are within tolerance and there is no 12th (expected
    176). By the criterion's measures (code find_decay, absolute values) clusters 6 and 8 are rapid and
    brief (decay 0.10 and 0.24 s) and only cluster 10 is persistent (mean |1 to 2 s| 0.34 of the peak,
    peak at 0.28 s); the condition of three persistent clusters with two early peaks fails under both
    numberings. Clusters 0, 1, 5 and 9 decay after 1.03 to 1.21 s, with means over 1 to 2 s of 0.14 to
    0.16 of their peaks. Two of the 11 clusters (0 and 5) are suppressed, not excited.
  deviations:
  - Leiden runs on the neighbor graph, as scanpy does and as the code calls it, not on the UMAP embedding
    the Methods name (criterion).
  - Peak, decay and the |z| < 1 rule follow analysis.py find_decay (plot_cluster_distribution), which
    works on absolute values; the criterion cites it.
- claim: figs31b-cluster-overrepresentation
  outcome: reproduced
  notebook: reproduce_kauvar_2025.ipynb
  output: claim:figs31b-cluster-overrepresentation
  notes: '54 regions have more than 30 clustered cells. Under FDR 0.05 and 0.01, PAG is overrepresented
    in clusters 4 and 6 and VPM in cluster 2 (faster half by decay: clusters 6, 8, 4, 2, 10), and frontal
    or limbic regions in slower-half clusters (0.01: ACAv5, AId5, ORBl5 and PL2/3 in cluster 0, ORBvl2/3
    in 1 and 9, ORBvl5 in 9). VPM is also overrepresented in cluster 3, of the slower half.'
  deviations:
  - With 11 clusters the faster half is taken as the 5 fastest by find_decay.
- claim: fig4g-ketamine-alters-slow-clusters
  outcome: not_reproduced
  notebook: reproduce_kauvar_2025.ipynb
  output: claim:fig4g-ketamine-alters-slow-clusters
  notes: Spearman correlation across 11 clusters between Pre decay time and the Pre to Ketamine change
    is 0.127 (p = 0.71) for the cosine distance and 0.209 (p = 0.54) for the absolute difference over
    1 to 2 s. The largest changes are in the suppressed clusters 0 and 5 (cosine distance 1.43 and 0.70);
    the fast cluster 10 changes by 0.49 and the slow cluster 9 by 0.16.
  deviations:
  - Ketamine is series 23 to 32 (10 series, code), where table S3 gives 64 Ketamine puffs (8 series);
    the criterion names this conflict and follows the code.
