  outcome: reproduced
  notebook: reproduce_kauvar_2025.ipynb
  output: claim:fig4i-rise-times-unchanged
  notes: 35 regions pass at the d' threshold 1.3 and 31 at 2. The median over regions of the bootstrap
    median change in rise time is -0.0021 s (Ketamine 23 to 32) or -0.0021 s (22 to 32) under every setting,
    within one 10 ms bin of zero. The Pre median rise is below 0.1 s in 31 of 35 and 29 of 31 regions.
    The more-than-30 and at-least-30 rules give the same regions.
  deviations:
