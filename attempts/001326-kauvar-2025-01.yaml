findings:
- kind: format_error
  statement: 'The spike times of every one of the 9554 units are stored in no particular order (about
    half of successive differences are negative); NWB expects them ascending. Sorted, they agree with
    the stimulus table: the population response 0 to 200 ms after each puff is 0.03 to 0.19 z in every
    session and -0.03 to 0.003 at onsets shifted by 1.5 s.'
- kind: metadata_insufficient
  statement: The animal excluded from the paper's Figure 5 and 6 analyses (Harderian gland secretion)
    is not identified in the dandiset or the paper. Removing sub-1, sub-3 or sub-5 each leaves 11 sessions
    from 9 mice; only removing sub-5 also leaves 7 tone sessions from 7 mice as table S3 reports, and
    several outcomes depend on the choice.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which animal was excluded from the cross-puff and population
    analyses (Figs. 5 and 6, fig. S34)? This attempt assumes sub-5 (both sessions), the only choice that
    gives the 7 tone sessions from 7 mice of table S3; fig6d, fig6h, figs34d and figs34g change outcome
    if sub-1 or sub-3 was excluded instead.
- kind: methods_unavailable
  statement: Question for the paper's authors. Fig. 4B and 5B normalize each condition's mean eye-closure
    trace by its own maximum in analysis.py; is that the normalization behind the reported reduction?
    Without it, or with both conditions divided by the Pre maximum, the late closure of the recorded mice
    does not differ between Pre and Ketamine (0.026 [-0.030, 0.082]).
- kind: other
  statement: Tone series are in 9 sessions from 8 mice, where table S3 reports 7 sessions from 7 mice,
    and 9 sessions also hold light stimuli (240 to 248 per session) that the paper does not describe.
- kind: metadata_insufficient
  statement: The ketamine infusion time in each file is described as approximate and falls 94 to 420 s
    after the code's ketamine onset (30 s after the last puff of series 20); with the code's onset, the
    tenth pre-infusion tone series counts as post-infusion.
- kind: metadata_insufficient
  statement: 867 of 9554 units carry the region label NA, and the files give no description of the region
    labels beyond the acronyms.
- kind: data_missing
  statement: DANDI 001326 holds no eye closure; the recorded mice's eye closure is in DANDI 001347, with
    no file for sub-3_ses-20230225, sub-5_ses-20230706 or sub-5_ses-20230822, and with no tone events.
- kind: metadata_insufficient
  statement: In DANDI 001347 the behavior-rig files hold only an eye-closure trace and an experiment id,
    with no drug, dose, pressure or injection label, and the human P50 files label trials only as pre
    and post. The conditions come only from the session lists of the paper's code (Zenodo doi:10.5281/zenodo.14920570).
- kind: identifier_missing
  statement: The recorded-mouse eye-closure files of DANDI 001347 (sub-m<mouse>-<recording>) carry no
    identifier of the 001326 sessions; the link comes from the paper's conversion script and a clock fit
    to the series onsets.
- kind: data_missing
