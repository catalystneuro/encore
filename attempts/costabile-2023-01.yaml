  about: data
  severity: major
  datasets:
  - '000235'
  - '000236'
  - '000237'
  notebook: reproduce_costabile_2023.ipynb
  output: finding-not-deposited
  statement: The files hold no registration to the Z-Brain atlas and no anatomical coordinates of the
    components beyond their pixel masks in each plane, and only a plane-level location label (such as
    "Dorsal Forebrain"). The paper's regional analyses (Figure 6, figure supplement 1; Figure 7A, C and
    F) cannot be run from the dandisets; the paper's processed data on Zenodo (doi:10.5281/zenodo.7737788)
    hold its registered centroids.
