  notebook: reproduce_costabile_2023.ipynb
  output: claim:data-zebrafish-coverage
  statement: The whole-brain dandisets hold the paper's 25 fish, 750 planes and 706,543 CaImAn
    components exactly, and the brightness criterion recomputed from the movies keeps 434,651 (the
    paper 432,882). No plane is deposited twice. The pixel masks line up with the movie (traces from
    the mask pixels correlate a median 0.834 with CaImAn's). The calcium is predicted far better by
    its own plane's temperature than by the next plane's (held-out correlation 0.656 against 0.393,
    in 98.4% of planes and every fish) and rises after swim starts (peak at 1.8 s), consistent with
    shared clocks.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. Which threshold on the smoothed absolute angular derivative of
    the tail, and which minimum bout length, were used to detect swim bouts (Methods, "an empirically
    determined threshold")? The bout detection the paper names (bitbucket.org/jcostabile/2p,
    detectBouts) defaults to 2 rad/s, which on the deposited tail angles detects about 4.9 bouts per
    second, inside the tracking noise; 5 to 10 rad/s give about 0.1 per second. This attempt used 5
    and 10 rad/s with 10 or 5 frames as readings. Were the angles fed to anglePrep the cumulative
    sums of the deposited segment angles, and is "sum_tail" the cumulative tail angle?
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. Was the time-average projection behind the brightness
    criterion (avg_component_brightness) taken from the raw movie, as deposited, or from CaImAn's
    motion-corrected movie? The raw movie gives 434,651 components at 0.1 photons, against the
    paper's 432,882.
