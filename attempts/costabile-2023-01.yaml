inputs:
- what: The paper's analysis code, read for the method details the claims file cites and for the brightness
    criterion (experiment.py, avg_component_brightness), the 5 Hz time base and the binning of behavior
    (rwave_data_fit.py), the CNN and its training (model.py, utilities.py) and the inter-trial correlations
    (rwave_plot_panels.py). No code is run from it; the entry's helpers re-implement what they use.
  source: https://github.com/haesemeyer/mine_pub at commit 368d75650a1de92d9dd6c7dd1aadff24be6ba379
- what: The lab's tail-processing code that the paper names (Methods, Processing of zebrafish data), read
    for the bout detection (helper_functions.py, detectBouts and anglePrep), which the entry re-implements
    to re-derive swim bouts, vigor and direction from the deposited tail angles.
  source: https://bitbucket.org/jcostabile/2p at commit 5ffaa2d2b2eeeb50466755a3520de5e5bf0687e2
outcomes:
- claim: data-zebrafish-coverage
  outcome: reproduced
  notebook: reproduce_costabile_2023.ipynb
  output: claim:data-zebrafish-coverage
  measured:
  - 25
  - 750
  - 706543
  - 434651
  notes: The three whole-brain dandisets hold 25 fish (8, 9 and 8 files) with 30 planes each, 750 planes,
    and 706,543 CaImAn components, the paper's count exactly. 434,651 components have a mean brightness
    of at least 0.1 photons over imaging time, 0.41% more than the paper's 432,882 (a fraction of 0.615
    against 0.613). The count changes by about 4,000 per 0.01 of the cut (439,048 at 0.09, 430,311 at
    0.11). Per dandiset the bright components are 114,471 (000235), 172,795 (000236) and 147,385 (000237);
    per fish the bright fraction ranges from 0.44 to 0.83. No plane is deposited twice (no repeated digest
    of calcium, temperature or tail data among 925 planes; largest correlation of two planes' temperature
    traces 0.926).
  deviations:
  - Brightness is the unweighted mean, over each component's pixel mask, of the time-average of the GCaMP
    channel of the movie the NWB files hold (as experiment.py, avg_component_brightness). The code averages
    the projection of its own experiment store; whether that projection was of the raw or the motion-corrected
    movie is not stated. The raw movie is assumed here; the count matches the paper's to 0.4%.
- claim: figs6-train-test-uncorrelated
  outcome: reproduced
  assumed: true
  notebook: reproduce_costabile_2023.ipynb
  output: claim:figs6-train-test-uncorrelated
  notes: Over 750 planes and 2,250 trial pairs the median inter-trial correlation is -0.051 for temperature,
    and -0.009 (swim starts), -0.006 (vigor) and -0.001 (direction) under the main bout reading (5 rad/s,
    at least 10 frames); every bout reading, including the code's default threshold of 2 rad/s, gives
    medians within 0.013 of zero for the behavior traces. All four predictors meet both readings of the
    criterion (absolute median below 0.2 and below 0.1). The temperature correlations spread widely (range
    -0.909 to 0.873, 5th to 95th percentile -0.620 to 0.544), so their median absolute value is 0.266,
    and a stricter variant (median of absolute values below 0.2) fails for temperature; the behavior traces
    pass it (0.015 or less). Per dandiset the temperature median absolute value is 0.249, 0.268 and 0.286.
    Under the main reading 117 of 2,250 behavior pairs are undefined, from trials without a bout. No random
    draws are involved. The paper's panel uses the raw behavior traces (rwave_plot_panels.py reads bout_start,
    rolling_vigor and sum_tail from rwave_build_main.get_behaviors, which reads raw_behavior, stored before
    the Gram-Schmidt step); the orthogonalized and z-scored traces give medians within 0.009 of zero too
    (median absolute values 0.025 or less). The criterion tests the median of the signed correlations,
    which any distribution centred on zero passes; the round-1 verifier noted this, and it is asked of
    a reader (questions/costabile-2023.yaml).
  deviations:
  - The dandisets hold no swim bouts, vigor or direction traces, so they are re-derived from the tail
    angles with the lab's bout detection (2p helper_functions.py at 5ffaa2d, detectBouts after anglePrep).
    Assumed, as the code's input is not deposited in that form, that the NWB segment angles are relative
    (their sum equals the stored cumulative tail angle to 3e-14), so point angles are their cumulative
    sum, and that the direction metric sums the cumulative tail angle (the code's column "sum_tail").
    The Methods give the threshold only as "empirically determined". The code's default of 2 rad/s lies
    inside the tracking noise here (4.9 bouts per second), so 5 and 10 rad/s, with minimum lengths of
    10 or 5 frames, are the readings and the default is a variant. The outcome is the same under all four.
    The question is recorded for the paper's authors (findings).
  - Planes are cut to the shortest length and split into trials of 824 bins of 0.2 s, as rwave_plot_panels.py
    does.
- claim: fig6d-mine-identifies-more-than-lm
  outcome: blocked
  blocked_by: too_large
  notebook: reproduce_costabile_2023.ipynb
  output: claim:fig6d-mine-identifies-more-than-lm
  notes: 'Needs the paper''s CNN fit to each of the 432,882 bright components (434,651 here). One fit
    of the paper''s architecture takes a median 1.89 s on one thread here (fits 2 to 20 of one plane,
    main notebook section 5); in four parallel processes a fit takes about 4 s, 1.08 s of wall time per
    fit over 600 fits (mine_fits_subsample.ipynb), so the 432,882 real-data fits come to about 130 h on
    the runner''s four CPUs, and about 261 h with the rotated controls, against a run of five hours. The
    linear comparison model is fit to every bright component (434,648; 2 planes with fewer than 5 bright
    components are left out): 26,326 reach a test correlation of sqrt(0.5) under the main bout reading
    (25,375 to 26,726 under the others), against about 25,300 implied by the paper (60% of 42,229). MINE''s
    side is estimated from a seeded random subsample of 600 components (20 in each of 30 random planes,
    16 fish), which decides no outcome. MINE identifies 45 and the linear model 30 of them; scaled to
    the dataset, the union is about 54,491 (95% interval over planes 26,711 to 86,594), 0.374 only by
    MINE (0.226 to 0.607), 0.514 by both (0.297 to 0.640) and 0.113 only by the linear model (0.046 to
    0.194). The paper''s values lie inside these intervals, which are far wider than the tolerances. Seven
    of the 600 MINE fits gave no test correlation (constant prediction). The subsample was not repeated
    under the four further seeds (four more sets of 600 fits); the bootstrap over planes gives the sampling
    error instead.'
  deviations:
  - The estimates in the notes come from a random subsample of 600 bright components (mine_fits_subsample.ipynb),
    not from all of them; the linear model's count is over all of them. Bouts are re-derived from the
    tail tracking as in figs6-train-test-uncorrelated (main reading thr5_min10). The test frames follow
    rwave_data_fit.py, which scores the prediction from train_frames on in the shifted series (the CNN's
    and the linear model's test frames start 49 frames after the last training frame).
