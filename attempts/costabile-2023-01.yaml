- kind: other
  about: data
  severity: major
  datasets:
  - '000235'
  - '000236'
  - '000237'
  notebook: reproduce_costabile_2023.ipynb
  output: finding-plane-anomalies
  statement: 'In 10 of 925 planes the tail timestamps hold a single step of 128.004 s, where every other
    step is 4 ms (the largest step in the other planes is 0.70 s). The 125,300 or so samples then span
    about 629 s: in 8 planes the timestamps end at 623.8 s, 128 s after imaging ends, and in 2 they start
    at -133.5 s, where the others run from about -5.4 s to 495.8 s. The jump lies at tail times from -113.7
    to 474.6 s, and nothing in the files says which side of it is placed correctly, so in each of these
    planes part of the tail recording, and the bouts derived from it, are misplaced by 128 s relative
    to the imaging. The affected planes are Fish31 planes 12 and 29, Fish47 planes 13 and 22, Fish58 planes
    0, 7 and 8, Fish10 plane 5, Fish36 plane 11 and Fish39 plane 16.'
