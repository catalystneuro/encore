  notebook: reproduce_costabile_2023.ipynb
  output: finding-frame-rate
  statement: The imaging rate is 2.384 Hz in every plane of every file (frame duration 0.4194304 s in
    the experiment description), where the Methods say 2.5 Hz. The files are consistent with
    themselves and with the paper's 495 s per plane (1,182 frames last 495.8 s); the paper's rate
