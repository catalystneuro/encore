inputs:
- what: The paper's analysis code, read for the method details the claims file cites and for the
    brightness criterion (experiment.py, avg_component_brightness), the 5 Hz time base and the
    binning of behavior (rwave_data_fit.py), the CNN and its training (model.py, utilities.py) and
    the inter-trial correlations (rwave_plot_panels.py). No code is run from it; the entry's helpers
    re-implement what they use.
  source: https://github.com/haesemeyer/mine_pub at commit 368d75650a1de92d9dd6c7dd1aadff24be6ba379
- what: The lab's tail-processing code that the paper names (Methods, Processing of zebrafish data),
    read for the bout detection (helper_functions.py, detectBouts and anglePrep), which the entry
    re-implements to re-derive swim bouts, vigor and direction from the deposited tail angles.
  source: https://bitbucket.org/jcostabile/2p at commit 5ffaa2d2b2eeeb50466755a3520de5e5bf0687e2
outcomes:
- claim: data-zebrafish-coverage
  outcome: reproduced
  notebook: reproduce_costabile_2023.ipynb
  output: claim:data-zebrafish-coverage
  measured:
  - 25
  - 750
  - 706543
  - 434651
  notes: The three whole-brain dandisets hold 25 fish (8, 9 and 8 files) with 30 planes each, 750
    planes, and 706,543 CaImAn components, the paper's count exactly. 434,651 components have a mean
    brightness of at least 0.1 photons over imaging time, 0.41% more than the paper's 432,882 (a
    fraction of 0.615 against 0.613). The count changes by about 4,000 per 0.01 of the cut (439,048
    at 0.09, 430,311 at 0.11). Per dandiset the bright components are 114,471 (000235), 172,795
    (000236) and 147,385 (000237); per fish the bright fraction ranges from 0.44 to 0.83. No plane
    is deposited twice (no repeated digest of calcium, temperature or tail data among 925 planes;
    largest correlation of two planes' temperature traces 0.926).
  deviations:
  - Brightness is the unweighted mean, over each component's pixel mask, of the time-average of the
    GCaMP channel of the movie the NWB files hold (as experiment.py, avg_component_brightness).
    The code averages the projection of its own experiment store; whether that projection was of
    the raw or the motion-corrected movie is not stated. The raw movie is assumed here; the count
    matches the paper's to 0.4%.
- claim: figs6-train-test-uncorrelated
  outcome: reproduced
  assumed: true
  notebook: reproduce_costabile_2023.ipynb
  output: claim:figs6-train-test-uncorrelated
  notes: Over 750 planes and 2,250 trial pairs the median inter-trial correlation is -0.051 for
    temperature, and -0.009 (swim starts), -0.006 (vigor) and -0.001 (direction) under the main
    bout reading (5 rad/s, at least 10 frames); every bout reading, including the code's default
    threshold of 2 rad/s, gives medians within 0.013 of zero for the behavior traces. All four
    predictors meet both readings of the criterion (absolute median below 0.2 and below 0.1). The
    temperature correlations spread widely (range -0.909 to 0.873, 5th to 95th percentile -0.620
    to 0.544), so their median absolute value is 0.266, and a stricter variant (median of absolute
    values below 0.2) fails for temperature; the behavior traces pass it (0.015 or less). Per
    dandiset the temperature median absolute value is 0.249, 0.268 and 0.286. Under the main
    reading 117 of 2,250 behavior pairs are undefined, from trials without a bout. No random draws
    are involved.
  deviations:
  - The dandisets hold no swim bouts, vigor or direction traces, so they are re-derived from the
    tail angles with the lab's bout detection (2p helper_functions.py at 5ffaa2d, detectBouts after
    anglePrep). Assumed, as the code's input is not deposited in that form, that the NWB segment
    angles are relative (their sum equals the stored cumulative tail angle to 3e-14), so point
    angles are their cumulative sum, and that the direction metric sums the cumulative tail angle
    (the code's column "sum_tail"). The Methods give the threshold only as "empirically
    determined". The code's default of 2 rad/s lies inside the tracking noise here (4.9 bouts per
    second), so 5 and 10 rad/s, with minimum lengths of 10 or 5 frames, are the readings and the
    default is a variant. The outcome is the same under all four. The question is recorded for the
    paper's authors (findings).
  - Planes are cut to the shortest length and split into trials of 824 bins of 0.2 s, as
    rwave_plot_panels.py does.
- claim: fig6d-mine-identifies-more-than-lm
  outcome: blocked
  blocked_by: too_large
  notebook: reproduce_costabile_2023.ipynb
  output: claim:fig6d-mine-identifies-more-than-lm
  notes: Needs the paper's CNN fit to each of the 432,882 bright components (434,651 here). One fit
    of the paper's architecture on a real plane takes 2.08 s on one thread here (three fits timed in
    the notebook), so the fits alone come to about 250 h on one thread, 62 h on the runner's four,
    against a run of five hours. The Ridge comparison model is cheap, but the claim needs both. The
    inputs to the fits (calcium, temperature, tail) are in the dandisets; the bout calls have to be
    re-derived (see figs6-train-test-uncorrelated).
