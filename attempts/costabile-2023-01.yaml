findings:
- kind: data_missing
  about: data
  severity: major
  datasets:
  - "000235"
  - "000236"
  - "000237"
  - "000238"
  notebook: reproduce_costabile_2023.ipynb
  output: finding-bout-threshold
  statement: The files hold the tail tracking (segment angles and cumulative tail angle at 250 Hz)
    but no swim bouts, and none of the three behavior predictors the paper fits (swim starts, vigor,
    direction). They have to be re-derived, and the threshold the paper uses is not given. The lab's
    bout detection with its default threshold of 2 rad/s finds a median 4.9 bouts per second on
    these data, inside the tracking noise (segment angles move in steps of 0.0997 rad); 5 or 10 rad/s
    give 0.075 to 0.095 per second. Every analysis of behavior-driven activity depends on this
    choice.
- kind: data_missing
  about: data
  severity: major
  datasets:
  - "000235"
  - "000236"
  - "000237"
  notebook: reproduce_costabile_2023.ipynb
  output: finding-not-deposited
  statement: The files hold no registration to the Z-Brain atlas and no anatomical coordinates of the
    components beyond their pixel masks in each plane, and only a plane-level location label (such
    as "Dorsal Forebrain"). The paper's regional analyses (Figure 6, figure supplement 1; Figure 7A,
    C and F) cannot be run from the dandisets; the paper's processed data on Zenodo
    (doi:10.5281/zenodo.7737788) hold its registered centroids.
