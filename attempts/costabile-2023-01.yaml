- kind: other
  about: data
  severity: minor
  datasets:
  - "000235"
  - "000236"
  - "000237"
  notebook: reproduce_costabile_2023.ipynb
  output: finding-plane-anomalies
  statement: In 10 of 925 planes the tail timestamps span about 629 s for the usual 125,300 samples
    at a median interval of 4 ms; 8 end at 623.8 s, 128 s after imaging ends, and 2 start at
    -133.5 s, where the others run from about -5.4 s to 495.8 s. The timestamps of these planes must
    hold a gap or jump that the files do not explain (where it lies was not located here), and
    bouts placed by them can be misplaced by up to 128 s. The affected planes are
    Fish31 planes 12 and 29, Fish47 planes 13 and 22, Fish58 planes 0, 7 and 8, Fish10 plane 5,
    Fish36 plane 11 and Fish39 plane 16.
