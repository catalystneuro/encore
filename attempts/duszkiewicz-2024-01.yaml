- kind: data_missing
  statement: Of the five ArchT mice of the PoSub optogenetic experiment the dandiset holds two (A1813,
    A1815); the other three (A1801, A1804, A1806, six sessions) are only in figshare Dataset_6. The paper's
    83 HD and 47 FS ArchT cells cannot be reached from the dandiset (62 and 33 here; 102 and 50 with the
    figshare mice added).
- kind: format_error
  statement: In eight files processing/ogen/optogenetic_stim holds four channels interleaved in one dimension,
    so its length at the stated 20 kHz is four times the session's (in A1813, 933,367,680 samples against
    233,341,920 of the ElectricalSeries, an 11,667 s session); only every fourth sample carries the light,
    with values 0 and 16368, and the other three channels are 0 throughout. In A1808 it holds one channel
    of 0 and 1 at the session's length. The light pulses are recoverable, but the series' shape and units (watts) do
    not describe it. The decoded pulses match the figshare Opto_TS.csv tables within 0.1 ms.
- kind: metadata_insufficient
  statement: The files hold no speed series, though every analysis restricts tuning curves by speed, and
    no table of light pulse times; both must be derived. The probe orientation (vertical or parallel)
    is stated only in the free-text device description.
- kind: metadata_error
  statement: The sleep states (intervals/sleep_states) of A3711, A3717 and A3723 run to about twice the
    session's length (to 24,351 s in a 12,177 s session), so that 298, 518 and 223 s of their REM lie
    after the recording ends; in A1821 (16 s in the square epoch and 41 s in the optogenetic epoch), A3712
    (12 s in the square epoch) and A3701 (0.3 s in the triangle epoch) REM intervals lie inside exploration
    epochs. The REM intervals are the same
    in version 0.250207.0025, whose 2026 successor says it fixed the indexing of the sleep scoring epochs.
- kind: metadata_error
  statement: The units' is_excitatory and is_fast_spiking labels follow the code's 0.35 ms trough-to-peak
    cut (agreement 99.9% with it), not the Methods' 0.4 ms; the column descriptions give no criterion.
- kind: methods_unavailable
  statement: Question for the authors. Is the Fourier power of the Methods ("root mean square of the projection
    values onto the sine and cosine basis") the squared modulus of the coefficient, as the code and the
    Parseval check imply? The choice decides fig3-ten-components-power (0.989 against 0.872 in harmonics
    1 to 10), fig3g (components 1 to 3 against 1 to 4 above control) and the significance of the Fig.
    3e interaction.
- kind: methods_unavailable
  statement: Question for the authors. Fig. 3e's repeated-measures ANOVA enters cell type as a numeric
    covariate (1, 2, 3) in Figure_Fourier.m. Was that intended? Here it gives p = 0.365, while cell type
    as a factor gives p = 5e-82.
- kind: methods_unavailable
  statement: Question for the authors. The gain analysis excludes ArchT cells that "did not show ... and
    did not show" significant modulation and tuning correlation. Is a cell excluded when both fail or
    when either fails? The code excludes on the correlation alone; reading "either" excludes half of the
    HD cells here and changes the HD additive comparison with control.
- kind: methods_unavailable
  statement: Question for the authors. In the gain simulations (Extended Data Fig. 8c,d), was the noise
    titrated to the observed correlations, as the Methods say, or fixed at 1.8 x 1.8 Hz, as Figure_GainSimulation.m
    sets it, and were simulated factors compared with simulated or recorded control cells? The outcome
    depends on both; the criterion holds only with titrated noise and simulated control cells.
- kind: methods_unavailable
  statement: Question for the authors. Which glmfit warnings removed a pair from the GLM analysis, and
    at how many lags? Figure_GLMRemWake.m removes a pair with any warning at any of 201 lags. Here, at
    lag 0, 4.9% of HD-HD pairs have fits flagged as ill-conditioned by a mirror of glmfit; keeping them
    lowers the pooled WAKE-REM Pearson correlation of HD-HD coupling from 0.641 to 0.000.
- kind: methods_unavailable
  statement: Question for the authors. How was the speed series (Velocity.mat) computed from the tracking,
    and how were the cue rotation exclusion condition (1) and its control defined? These are not in the
    Methods or in the deposited code.
- kind: code_mismatch
  statement: Figure_Fourier.m computes the KL divergence as D_KL(S || sigma_i), the reverse of the Methods'
    D_KL(sigma_i || S); with squared-modulus power the PoSub-HD against ADN-HD test gives p = 1e-7 in
    the code's direction and p = 0.008 in the Methods'.
