- claim: ed4cd-isomap-posub-central
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:ed4cd-isomap-posub-central
  notes: Median distance to the FS centre 2.34 for PoSub-HD against 3.39 for ADN-HD, z = 2.93, p = 0.0034,
    n = 1,512 and 97 (paper z = 4.26).
  deviations:
  - Isomap from scikit-learn, not the MATLAB Dimensionality Reduction Toolbox.
- claim: fig4-random-connectivity-simulation
  outcome: blocked
  blocked_by: methods_underspecified
  notes: A result of simulation. The Python simulation code is not in the figshare item (version 3 holds
    MATLAB code only) nor linked elsewhere in the paper, and the Methods and Supplementary Methods do
    not give the input tuning widths, the number of inputs or the log-normal weight parameters of each
    simulated point.
- claim: fig4f-synaptic-weights-dispersed
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:fig4f-synaptic-weights-dispersed
  measured: 1.9
  notes: 1,176 connections among 24,498 HD-FS pairs (4.8%), in every session. strZ mean 8.58, s.d. 16.32,
    CV 1.90, skewness 9.34, median 4.60. Spans of 50 and 25 ms give identical results because the test
    window (0 to 2 ms) and the baseline kernel never reach either edge, so the span variant tests nothing.
    strR, a variant, has CV 0.71.
  deviations:
  - In cch_conv the window of 41 bins has an odd width, so its centre index is fractional; the two central
    samples are hollowed here (an assumption that only shifts the baseline slightly).
- claim: fig4h-model-fit
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The PyTorch fitting code is not in the figshare item, and the Supplementary Methods do not give
    the numbers of inputs or the initial values; a reimplementation would rest on choices not in the paper.
- claim: ed7-adn-disinhibition
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:ed7-adn-disinhibition
  notes: Figshare Dataset_6, 10 ADN sessions from 3 mice, 127 cells kept (paper 127), 53 ADN-HD (paper
    52) and 74 non-HD (paper 75). ON/OFF ratio 1.54 against 1.06, z = 6.85, p = 8e-12 (paper z = 6.57);
    non-HD rates do not change (p = 0.13). ADN-HD width 62 against 58 degrees, signed-rank p = 0.61, rank-sum
    p = 0.80 (paper p = 0.5). The ratio is near 1.5 in each mouse.
- claim: fig5b-posub-rates-increase
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:fig5b-posub-rates-increase
  notes: Two ArchT mice (A1813, A1815) and three control mice. FS ON/OFF ratio 1.33 against 1.04, z =
    5.41, p = 6e-8, n = 33 and 43 (paper z = 4.99, n = 47 and 38); HD 1.46 against 1.00. Both ArchT medians
    exceed 1 and the control medians, in each ArchT mouse. The HD comparison with control is significant
    here (z = 7.77, n = 62 and 92), where the paper's is not (z = 1.69, 83 and 89); the criterion does
    not judge it. With every window moved 2.5 s from the pulses the ArchT ratio is 0.91, and the decoded
    pulses match the figshare pulse table within 0.1 ms, so the pulse times share the spike clock. Variant
    with the three figshare ArchT mice added (102 HD, 50 FS ArchT cells, 5 mice), deciding nothing. FS
    z = 5.60, p = 2e-8, ArchT medians 1.29 (FS) and 1.32 (HD); one figshare mouse (A1804) has medians
    below 1.
  deviations:
  - The dandiset holds 2 of the paper's 5 ArchT mice; the other three are in figshare Dataset_6. The claim
    is judged on the dandiset, as the claims file gives it data dataset; the five-mouse result is a variant
    (notebook, after ed8e).
  - Light pulses are read from the optogenetic series as four interleaved channels (see findings); they
    match the figshare Opto_TS.csv tables.
- claim: ed7gj-tuning-preserved
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:ed7gj-tuning-preserved
  notes: PoSub-HD width OFF against ON 44 and 46 degrees, signed-rank p = 0.53, n = 62 (paper z = 0.30);
    rank-sum p = 1.0. FS ON-OFF tuning correlation, ArchT 0.72 against control 0.69, p = 0.68, n = 33
    and 43 (paper z = 1.14). These are claims of absence on smaller samples than the paper's (83 and 47);
    with the three figshare ArchT mice added, a variant, n = 102 and 50, p = 0.24 and 0.95.
  deviations:
  - Two of five ArchT mice (see fig5b-posub-rates-increase); the five-mouse result is a variant.
- claim: fig5e-hd-multiplicative-fs-additive
  outcome: partially_reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:fig5e-hd-multiplicative-fs-additive
  notes: Under readings (a), (b) and (c), HD multiplicative above FS (p 1e-5 to 2e-8), FS additive above
    HD (5e-7 to 3e-10), HD multiplicative above control (below 3e-7), FS additive above control (below
    4e-4), FS multiplicative not different from control (p 0.21 to 0.40). HD additive against control
    is not different under (a) and (c) (p = 0.19) but is under (b) (p = 0.015), which excludes 31 of 62
    HD cells. The criterion asks for every reading. Readings (a) and (c) exclude 0 HD and 0 or 1 FS cells,
    as the Methods report (1 of 47 FS cells and no other cells); whether reading (b) belongs in the criterion
    is asked of a reader (questions/000939.yaml). With the three figshare ArchT mice, a variant, the same
    pattern; all conditions hold under (a) and (c), and HD additive against control gives p = 0.016 under
    (b).
  deviations:
  - Two of five ArchT mice (see fig5b-posub-rates-increase); the five-mouse result is a variant.
- claim: ed8cd-multiplicative-detectable
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:ed8cd-multiplicative-detectable
  notes: With the noise titrated to the observed correlations (4.25 Hz; no-gain median r 0.731 against
    the observed 0.730) and the simulated control, the multiplicative simulation gives multiplicative
    factors above control (p = 0.022) and the additive simulation reproduces the data's pattern (additive
    p = 8e-5, multiplicative p = 0.13; data p = 3e-4 and 0.27); over 50 seeds all three hold in 80% of
    runs. Against the recorded control factors the titrated additive simulation also changes the multiplicative
    factor (p = 0.0008), but the titrated no-gain simulation already differs from the recorded control
    (multiplicative p = 0.0026, additive p = 0.039), so that comparison cannot tell gain types apart.
    Variant with the code's fixed noise of 1.8 x 1.8 Hz (simulated r 0.82, above the observed 0.73), which
    the criterion does not call for, as it titrates the noise. The additive simulation changes the multiplicative
    factor against the simulated control (p = 0.008), and against the recorded control the multiplicative
    simulation is not detected (p = 0.80). The outcome was partially_reproduced until round 3, as it counted
    the fixed-noise readings; round 2 found that they are not readings of the criterion, and round 3 agreed
    with reproduced. With
    the three figshare ArchT mice, a variant, the same split (titrated noise 4.00 Hz; simulated control
    p = 0.019, 3e-7 and 0.38; recorded control, additive simulation multiplicative p = 7e-5).
  deviations:
  - The noise is titrated as the Methods and the criterion describe (simulated high-gain curves "until
    we obtained a similar distribution of tuning curve correlations to the one observed experimentally"),
    on a grid of s.d. matched by the median correlation; the code's fixed s.d. of 1.8 x 1.8 Hz is a variant.
    The match by median is a choice.
  - Simulated factors are compared with the simulated control group (control cells with ON = OFF plus
    noise, as Figure_GainSimulation.m builds it) and with the recorded control factors, two readings of
    the criterion's control group.
- claim: ed8e-adn-mixed-gain
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:ed8e-adn-mixed-gain
  notes: Figshare ADN-HD (53) against the dandiset's ArchT PoSub-HD cells (62). Multiplicative 1.26 against
    1.30, p = 0.47; additive 0.032 against 0.009, p = 7e-6 (paper z = 0.55 and 5.07). Under reading (b),
