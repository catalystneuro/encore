    dandiset lacks are also used in a variant of the PoSub optogenetic claims that decides no outcome.
    Dataset_6.tar.gz.
  source: figshare doi:10.6084/m9.figshare.24921252 version 3 (file 43857159)
- what: Neuropixel session A8603-210602 (spike times, head direction, speed, trough-to-peak, cell depth),
    for fig1ac-posub-border, and its unit count for the missing session of cell-classes-counts. Dataset_4.tar.gz.
  source: figshare doi:10.6084/m9.figshare.24921252 version 3 (file 43857156)
- what: Cue rotation sessions (6 sessions, spike times, head direction, tracking, cue epochs, LED times
    and the files' cell types), for fig2f-cue-rotation. Dataset_3.tar.gz.
  source: figshare doi:10.6084/m9.figshare.24921252 version 3 (file 43857153)
- what: The paper's MATLAB analysis code, read for method details and not run (MatlabCode_Duszkiewicz2024.zip,
    md5 8f391dec0d3fa120ef58f3158443f5df).
  source: figshare doi:10.6084/m9.figshare.24921252 version 3 (file 43857246)
- what: The code's session lists (SessionLists_ForAnalysis.zip, dataset_All.list), to identify the session
    the dandiset lacks (cell-classes-counts); not used in any measure.
  source: figshare doi:10.6084/m9.figshare.24921252 version 3 (file 43857237)
outcomes:
- claim: cell-classes-counts
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:cell-classes-counts
  measured:
  - 1661
  - 430
  - 1512
  - 0.91
  - 931
  - 1760
  notes: Under the Methods' classes there are 1,661 excitatory cells, 430 FS cells and 1,512 HD cells
    (fraction 0.910), all within tolerance; the code's 0.35 ms cut gives 1,699, 415, 1,532 and 0.902,
    and the HD threshold as the 99th percentile of the time-reversed information (0.272 bits per spike)
    1,481 and 1,501. The 14 vertical sessions hold 931 units, the paper's number. The 17 parallel sessions
    hold 1,760 units, below the tolerance of 1,999 - 200. The code's list of the paper's 32 PoSub sessions
    (dataset_All.list) has one session the dandiset lacks, A8603-210602, the Neuropixel recording of figshare
    Dataset_4, with 239 units; 1,760 + 239 = 1,999, the paper's count. The shortfall is that one session's
    units, the case the criterion foresees, so the counts reproduce. The dandiset's labels agree with
    the code's classes for 99.9% of units (excitatory and FS) and 99.7% (HD).
  deviations:
  - A negative waveform is read as a finite trough-to-peak in the units table; the code marks positive
    spikes with NaN, and 177 units have none.
  - Speed is computed from the position (Gaussian smoothing of 0.1 s s.d.), as the files hold no speed
    series; the agreement of the recomputed classes with the dandiset's labels (99.9%) supports it.
  - Viable units are those at or above 0.5 Hz (Methods, at least 0.5 Hz; the code's gd uses > 0.5).
  - The time-reversed control reverses the HD series over the used span (the tracked epoch, or its half)
    before the speed mask, as the claims file says; round 1 reversed only the used samples.
- claim: ed2b-excitatory-hd-information
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:ed2b-excitatory-hd-information
  notes: Median log10 HD information 0.10 against -1.41 for the time-reversed controls, |z| = 35.3, p
    = 7e-273, n = 1,661 (paper z = 37.1, n = 1,835); 97 to 100% of excitatory cells per session are above
    their control. The histogram over viable units has maxima near log10 = -1.67 and 0.19, shown and not
    judged.
- claim: fig2a-fs-hd-information
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:fig2a-fs-hd-information
  notes: Median log10 HD information -1.70 against -2.63, |z| = 17.86, p = 2e-71, n = 430 (paper z = 17.9,
    n = 427); 419 of 430 FS cells exceed their control. Median HD information of HD cells 1.35 bits per
    spike, of FS cells 0.02.
- claim: fig2b-decoding-from-fs
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:fig2b-decoding-from-fs
  notes: Mean over 31 sessions of the FS decoder's median error 36.0 degrees, chance 92.8, both scored
    against the real HD (signed-rank over sessions p = 1.3e-6); Pearson r between FS cell number and error
    -0.449, p = 0.011, n = 31. HD-cell decoder 9.9 degrees.
  deviations:
  - 31 sessions where the paper has 32.
- claim: fig2c-geometry-independent
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:fig2c-geometry-independent
  notes: 20 sessions with a triangle. FS median r 0.80 against -0.01, |z| = 14.2, p = 1e-45, n = 273 (paper
    264, z = 14.0); HD 0.96 against -0.01, |z| = 28.9, p = 4e-184, n = 1,118 (paper 1,013, z = 27.6).
    The 2 degree smoothing of the code gives the same.
  deviations:
  - The control correlates the time-reversed square curve with the time-reversed triangle curve shifted
    by the same session rotation; the criterion says "the same for time-reversed curves" without saying
    which curves are paired.
- claim: ed2hi-within-epoch-stability
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:ed2hi-within-epoch-stability
  notes: FS median r 0.83 against -0.011, |z| = 17.91, p = 1e-71, n = 430; HD 0.97 against -0.011, |z|
    = 33.7, p = 1e-248, n = 1,512; the same at 2 degree smoothing.
  deviations:
  - The halves are halves of the time above 2 cm/s, taken in order; the code's regIntervals(ep, 2) is
    not described further.
- claim: fig2f-cue-rotation
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:fig2f-cue-rotation
  notes: Six figshare sessions, 99 FS cells, the paper's number. Under the main exclusion reading 89 of
    96 rotations are kept; the median absolute difference between FS and mean HD realignment is 36.2 degrees
    against 91.8 for the control, |z| = 8.57, p = 1e-17 (paper z = 8.25). The second reading (95 kept),
    the change condition alone (93) and the code's rule (91) give |z| 8.58 to 8.59.
  deviations:
  - Condition (1) of the Methods ("less than 45 degrees of mean decoder error in the following 200 s epoch")
    is read as the change of circular mean error from the 200 s before the rotation to the 200 s after
    it, as the code computes it; read literally it would exclude every rotation back to the first wall.
  - The sigmoid is fitted to the decoder error re-centred on the preceding epoch's mean, from 50 s before
    to 200 s after each rotation (the code's window), with scipy's curve_fit; the code's second, fine
    sigmoid fit is not run.
  - The control is the FS cells' realignment from curves with the HD time-reversed within each epoch segment,
    against the real HD cells' mean; the paper does not say what the control reverses.
  - Cell classes are the figshare files' own CellTypes.
  - The code's angular head velocity is computed here from the head direction in the 50 s before each
    rotation, as Ahv.mat is not read.
- claim: fig3c-adn-broader
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:fig3c-adn-broader
  notes: 97 ADN-HD cells recomputed from the figshare spike times (the files' CellTypes also give 97,
    agreement 100%). Median width 62 against 42 degrees for 1,512 PoSub-HD cells, z = 11.58, p = 4e-31
    (paper z = 11.4). The figshare data give ADN-HD cells only, so the claim's notes on the dataset side
    are the PoSub-HD widths of the dandiset.
- claim: fig3-ten-components-power
  outcome: partially_reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:fig3-ten-components-power
  measured: 0.9888
  notes: Squared-modulus power gives a mean fraction of 0.989 in harmonics 1 to 10 for FS and HD cells
    pooled, 0.969 for FS and 0.994 for HD, all within 0.98 +- 0.02; mean power falls to 0.10 of the first
    harmonic's at the fifth. Root-mean-square power gives 0.872, 0.778 and 0.898, none within tolerance.
    The criterion asks for a population within tolerance under each power reading, so it holds under one
    of the two. Only the squared modulus satisfies the Parseval check that the Methods report (ratio 1.0000
    here).
  deviations:
  - The Methods' "root mean square of the projection values onto the sine and cosine basis" is read as
    sqrt((re^2 + im^2) / 2) of the complex coefficient.
- claim: fig3e-fourier-signatures-differ
  outcome: partially_reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:fig3e-fourier-signatures-differ
  notes: The direction holds under both readings and both powers (ADN-HD mean at component 1 0.509 against
    0.398 and 0.358; ADN cumulative signature above both at components 1 to 9). With squared-modulus power
    and cell type as a numeric covariate (the code), the component by cell type interaction gives F(9,18333)
    = 1.09, p = 0.365 (paper F(9,19116) = 2.76, p = 0.003). Root-mean-square power gives F = 10.68, p
    = 1e-16, and a categorical cell type gives F(18,18324) = 24.7, p = 5e-82 (squared modulus) and 44.6,
    p = 2e-155. The test holds under some readings and not under the one that follows the code, so the
    claim holds in part. A numeric code for three cell types tests a linear trend from FS through PoSub-HD
    to ADN-HD; FS and ADN-HD both depart from PoSub-HD at component 1 in the same direction, which such
    a trend does not capture. The PoSub-only ANOVA, a variant, gives F(9,17460) = 11.4, p = 6e-18.
  deviations:
  - The repeated-measures interaction is computed as the univariate test of ranova, with the within-subject
    deviations regressed on the between-subjects term, not with MATLAB.
  - 1,942 PoSub cells from 31 sessions where the paper has 2,029 from 32.
- claim: fig3f-posub-hd-closer-to-fs
  outcome: partially_reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:fig3f-posub-hd-closer-to-fs
  notes: PoSub-HD spectra are closer to the mean FS spectrum under all four readings. Squared modulus,
    D_KL(cell||FS) (the Methods' direction), median 0.082 against 0.133, p = 0.008; squared modulus, D_KL(FS||cell)
    (the code's), p = 1e-7; root mean square, p = 1.8e-9 and 3e-12. p is below 1e-9 under one reading
    only, which is the criterion's partial outcome.
- claim: ed3k-robust-to-controls
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:ed3k-robust-to-controls
  notes: The Fig. 3f test holds under every control and reading, PoSub-HD closer than ADN-HD with p from
    0.019 to 5e-22 (multipeak below 0.05, 762 and 69 cells, paper 789 and 69; contamination at most 0.2,
    1,399 and 81, paper 1,472 and 83; 10 cm/s, 1,512 and 97). The multipeak scores differ (z = 4.18, p
    = 3e-5; paper z = 4.25), ADN-HD cells scoring lower (median 0.022 against 0.049), as the paper's counts
    below 0.05 (69 of 97 ADN-HD, 789 of 1,602 PoSub-HD) imply. The answer to the question in questions/000939.yaml
    changed the outcome. The statement had ADN-HD scores higher, the reverse of what was found, and the
    outcome was partially_reproduced; the reader found that the paper gives no direction for this test
    and amended the claim to say only that the scores differ, with the multipeak test accepted in either
    direction. The analysis is unchanged; all four tests now meet the criterion.
  deviations:
  - The contamination score takes the autocorrelogram bin next to zero (0.5 to 1.5 ms), as the code does
    (it zeroes the zero bin); the Methods say "the value at 0.1 ms".
  - The contamination and speed controls are applied to FS cells too when computing the FS mean, as the
    code's onlyGoodClusters filters FS cells; the 10 cm/s control recomputes all curves.
- claim: fig3g-first-three-components
  outcome: partially_reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:fig3g-first-three-components
  notes: Interaction significant under both powers (squared modulus F(9,3861) = 122.9, p = 1e-203; root
    mean square F = 227.2; paper F(9,3834) = 64.1, p = 4e-110). After Bonferroni correction, squared modulus,
    components 1 and 2 are above control (p = 4e-28, 8e-20) and component 3 is higher in median (0.114
    against 0.093) but p = 0.064; root mean square, components 1 to 4 are above control (component 4,
    p = 0.003). The set 1, 2 and 3 and no other holds under neither power. Round 1 had component 3 significant
    (p = 0.028) with squared-modulus power; the change comes from the corrected time-reversed control
    (the HD series reversed before the speed mask, as the claims file says).
  deviations:
  - The time-reversed control reverses the HD series over the tracked epoch before the speed mask (claims
    file).
- claim: fig3h-dominant-component
  outcome: not_reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:fig3h-dominant-component
  measured:
  - 237
  - 146
  - 47
  notes: 237 and 146 FS cells peak in components 1 and 2, within tolerance; 47 peak in component 3, below
    55 - 6. The criterion's reproduced and partial outcomes both need every count within tolerance, so
    with one count outside it the claim is not reproduced. The proportions (0.551, 0.340, 0.109) are in
    the order of the renormalized mean powers (0.486, 0.326, 0.187), reading (a), but differ from them
    by 13%, 4% and 42%, so reading (b) fails, under both power readings. The dandiset has 430 FS cells
    where the paper has 427.
- claim: ed3g-fs-spectra-heterogeneous
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:ed3g-fs-spectra-heterogeneous
  notes: FS distances from their own population mean exceed PoSub-HD distances under all four readings
    (z/3 5.78 to 5.97, p x 3 below 1e-66; paper z = 5.71). With the figshare ADN-HD cells, reported and
    not judged, the one-way ANOVA gives F(2,2036) = 184.3, p = 3e-74 (Euclidean, squared modulus; paper
    F(2,2123) = 169), FS against ADN z/3 = 3.42 and PoSub-HD against ADN z/3 = 0.48 (paper 3.40 and 0.45).
- claim: ed3l-fs-phases-independent
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:ed3l-fs-phases-independent
  notes: PoSub-HD rho = 0.322 (p below 1e-15) and 0.087 (p = 1e-4); FS rho = 0.014 (p = 0.77) and 0.005
    (p = 0.91); with the code's classes FS p = 0.90 and 0.74.
- claim: ed4a-autocorrelogram-symmetries
  outcome: reproduced
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:ed4a-autocorrelogram-symmetries
  notes: Twofold FS cells (146) at 180 degrees, median 0.19 against 0.02, signed-rank p = 3e-13, rank-sum
    p = 2e-13; threefold cells (47) at 120 degrees, 0.17 against -0.002, p = 2e-4 and 6e-5; at 240 degrees,
