- claim: fig6c-coupling-preserved-wake-rem
  outcome: reproduced
  assumed: true
  notebook: reproduce_duszkiewicz_2024.ipynb
  output: claim:fig6c-coupling-preserved-wake-rem
  notes: 27 sessions with at least 100 s of REM inside the home-cage epochs (paper 26). With the code's
    cell selection (HD and FS cells, no rate condition) and pairs with a glmfit warning removed, WAKE
    against REM coupling gives HD-HD r = 0.641 (34,611 pairs), FS-FS r = 0.364 (2,683, p = 1e-84), HD-FS
    r = 0.359 (19,602), all positive with p below 1e-80, FS-FS below HD-HD; the pair counts are close
    to the paper's (34,270, 2,492, 18,992). Spearman 0.762, 0.417 and 0.514. The glmfit mirror flags 1,795
    HD-HD pairs (4.9%), 24 HD-FS and no FS-FS; the round-1 rule flags the same pairs. The flagged fits
    diverge (median |coupling| 2.77 in WAKE, up to 3e73, against 0.28 in kept pairs; the lower REM rate
