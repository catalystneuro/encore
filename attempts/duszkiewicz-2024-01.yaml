    statement; it is now a variant.
  - REM is the scored REM inside the home-cage epochs; the files' sleep states run past the recording
    in three sessions and put REM inside an exploration epoch in two (see findings).
  - Pairs counted once, unordered; the coupling is the mean of the two ordered fits, as the Methods say.
