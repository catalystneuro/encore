- claim: rotation-frequency
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2012.ipynb
  output: claim:rotation-frequency
  measured: 1.40
  notes: The largest eigenvalue of M_skew is 8.44 rad/s (1.344 Hz) in J-array and 8.81 rad/s (1.402
    Hz) in N-array, inside 1.26 to 2.75 Hz; the measured value given is the larger. With the range
    over -1000 to +700 ms, 1.333 and 1.416 Hz. Under the move_begins readings J-array gives 1.063
    to 1.098 Hz, below the range, which would make the claim partially reproduced. With 24 ms
    smoothing, 1.290 and 1.372 Hz. The paper's own values for the array datasets are not stated.
  deviations:
  - Assumed the offline_move_onset_time column as the movement onset (see
    fig3-independent-of-curvature); under move_begins_time the outcome would be partially reproduced.
  - The derivative is the difference of samples 10 ms apart (Methods), so eigenvalues per sample are
    multiplied by 100 to give rad/s.
- claim: suppfig3-shuffle-controls
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_churchland_2012.ipynb
  output: claim:suppfig3-shuffle-controls
  notes: Dividing points -277 ms (J-array) and -268 ms (N-array) from movement onset. In J-array the
    original R2(M_skew) is 0.381; no shuffled run reaches it, and the medians are 0.01 (shuffle 1),
    0.63 (shuffle 2) and 0.75 (shuffle 3, 0.745) of it, so all three shuffles meet the criterion. In
    N-array the original is 0.527, and the medians are 0.01, 0.76 and 0.87 of it, so only shuffle 1
    meets it. The partial outcome (all three shuffles in one dataset) holds under each of the five
    seeds (J-array shuffle-3 medians 0.725 to 0.745 of the original, N-array 0.850 to 0.866). With
    the range over -1000 to +700 ms the outcome is also partial (J-array shuffle 3 at 0.77, N-array
    shuffle 2 at 0.74); under the two move_begins readings it is not reproduced, as J-array shuffle 3
    is at 0.77 to 0.79 and N-array meets only shuffle 1. After shuffles 2 and 3 the median share of
    conditions rotating counter-clockwise stays at 93 to 98% and the R2 ratio at 0.86 to 0.94; after
    shuffle 1 it is 58 to 61% and 0.09 to 0.16. The claim's statement that the shuffles largely
    remove the rotational structure holds for shuffle 1 only in N-array.
  deviations:
  - Shuffle 1 inverts exactly half of the conditions (54 of 108) per unit, drawn at random
    (Supplementary Figure 2 legend). Inversion reflects each rate after the dividing point about its
    value there, and reassignment adds the other condition's change from its dividing-point rate to
    this condition's rate at that point (legend, "simply appended to the final firing rate during the
    preparatory state, such that there was no discontinuity").
  - Assumed the offline_move_onset_time column as the movement onset (see
    fig3-independent-of-curvature); under move_begins_time the outcome would be not reproduced.
