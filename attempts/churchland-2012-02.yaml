findings:
- kind: data_missing
  severity: major
  statement: The Units tables of all ten files hold unsorted threshold crossings, one unit per
    electrode (192 per session), as their description says, where the paper analysed 146 (J-array)
    and 218 (N-array) sorted single and multi-unit isolations. The sorted isolations are not in the
    dandiset. On these units the first jPCA plane captures 14.9% and 22.9% of the variance, against
    the paper's average of 28%.
- kind: data_missing
  severity: major
  statement: The dandiset holds the paper's two array datasets (sub-Jenkins ses-20090918 and
    sub-Nitschke ses-20100923) and eight further array sessions, one of which (sub-Nitschke
    ses-20100910) matches the N-9-10-2010 session of Supplementary Figure 5. The seven
    single-electrode datasets, the EMG, the leech and walking-monkey recordings and the J-11-06-2009
    session of Supplementary Figure 5 are not in it. Six of the paper's 22 claims cannot be tested.
- kind: metadata_insufficient
  severity: major
  statement: Two sessions, sub-Nitschke ses-20100920 and ses-20100922, have no maze_condition,
    correct_reach, trial_version, active_target, proto_trial, novel_maze or unhittable columns, which
    the other eight files have, so their trials cannot be grouped by condition or selected for
    consistent reaches as in the paper. The paper does not use these sessions.
- kind: metadata_insufficient
  severity: minor
  statement: The trial table has two movement-onset columns, move_begins_time (described as movement
    onset time) and offline_move_onset_time (calculated offline using a robust algorithm), which
    differ by a median of 25 ms in J-array and 52 ms in N-array. Nothing says which one is the onset
    the paper aligned on, and several results change with it (the variance captured by the jPCA
    plane, 14.9 against 18.7% in J-array, and its frequency, 1.344 against 1.098 Hz). The hand speed
    starts to rise at offline_move_onset_time.
- kind: other
  about: data
  severity: none
  statement: The spikes of both arrays are consistent with the clock of the trial table. Reach
    direction decodes at chance from each array before target onset (0.12 to 0.17 against 0.14 to
    0.17 with shuffled labels) and above it after target onset (0.37 to 0.70). The lag between the
    arrays' movement-related changes is constant across six blocks of each session (-4 to 11 ms in
    J-array, 25 to 32 ms in N-array, M1 later), so there is no drift like that of the LFP's second,
    slower clock. A constant offset of about 25 ms between the N-array arrays cannot be told apart
    from a later M1 response.
- kind: other
  about: data
  severity: none
  statement: Checks that passed. No recording is deposited twice (the trial-interval and spike-count
    hashes of the ten files all differ). Spike times are sorted within every unit and every analysis
    window lies inside its trial. Hand position is in mm with a conversion to metres, its speed
    rises at offline_move_onset_time, and the hand ends a median 9.1 mm (J-array) and 11.4 mm
    (N-array) from the hit target minus the cursor offset. Electrode groups 1 and 2 are described as
    the PMd and M1 arrays, 96 units each.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which movement onset were the array datasets aligned
    on, the rig's online detection (move_begins_time in the files) or the offline estimate
    (offline_move_onset_time), and over which times was each neuron's firing-rate range taken for the
    soft normalisation? The paper says the data were precisely aligned on movement onset. This
    attempt assumed the offline estimate and the analysed window; with the online onset the
    outcomes of five claims would change (fig3-independent-of-curvature, var-captured-jpc-plane,
    pc23-variance, rotation-frequency and suppfig3-shuffle-controls), while the range window
    changes none.
- kind: methods_unavailable
  statement: Question for the paper's authors. For the velocity and complex kinematic models, how far
    did the simulated rates lead the hand, what was the time course of the preparatory term (did it
    end at movement onset or persist), and how were the factors weighted? With a 100 ms lead and a
    preparatory term ending at onset, the simulated velocity population here has an angle
    distribution peaking at 0.42 and 0.64 pi; with no lead it peaks near 0 as in Figure 6a. M_skew
    fits poorly under every choice.
