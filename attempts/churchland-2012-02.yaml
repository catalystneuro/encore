- claim: fig6b-skew-fit
  outcome: reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig6b-skew-fit
  notes: In 6-D, R2 is 0.415 for M and 0.381 for M_skew in J-array (ratio 0.918), and 0.580 and 0.527
    in N-array (ratio 0.909). In the first plane the ratios are 0.946 and 0.953. Under the four
    readings and with 24 ms smoothing, the 6-D ratios are 0.870 to 0.931 and the plane ratios 0.908
