findings:
- kind: data_missing
  severity: major
  statement: The Units tables of all ten files hold unsorted threshold crossings, one unit per electrode
    (192 per session), as their description says, where the paper analysed 146 (J-array) and 218 (N-array)
    sorted single and multi-unit isolations. The sorted isolations are not in the dandiset. On these units
    the first jPCA plane captures 14.9% and 22.9% of the variance, against the paper's average of 28%.
- kind: data_missing
  severity: major
  statement: The dandiset holds the paper's two array datasets (sub-Jenkins ses-20090918 and sub-Nitschke
    ses-20100923) and eight further array sessions, one of which (sub-Nitschke ses-20100910) matches the
    N-9-10-2010 session of Supplementary Figure 5. The seven single-electrode datasets, the EMG, the leech
    and walking-monkey recordings and the J-11-06-2009 session of Supplementary Figure 5 are not in it.
    Six of the paper's 22 claims cannot be tested.
- kind: metadata_insufficient
  severity: major
  statement: Two sessions, sub-Nitschke ses-20100920 and ses-20100922, have no maze_condition, correct_reach,
    trial_version, active_target, proto_trial, novel_maze or unhittable columns, which the other eight
    files have, so their trials cannot be grouped by condition or selected for consistent reaches as in
    the paper. The paper does not use these sessions.
- kind: metadata_insufficient
  severity: minor
  statement: The trial table has two movement-onset columns, move_begins_time (described only as "movement
    onset time") and offline_move_onset_time ("movement onset time, calculated offline using a robust
    algorithm"), which differ by a median of 25 ms in J-array and 52 ms in N-array. Nothing says which
    one is the onset the paper aligned on, and several results change with it (the variance captured by
    the jPCA plane, 14.9 against 18.7% in J-array, and its frequency, 1.344 against 1.098 Hz). The hand
    speed starts to rise at offline_move_onset_time (median 43 and 15 mm/s); at move_begins_time it is
    already 137 and 160 mm/s.
- kind: other
  about: data
  severity: none
  statement: The spikes of both arrays are consistent with the clock of the trial table. Reach direction
    decodes at chance from each array before target onset (0.12 to 0.17 against 0.14 to 0.17 with shuffled
    labels) and above it after target onset (0.37 to 0.70). The lag between the arrays' movement-related
    changes is constant across six blocks of each session (-4 to 11 ms in J-array, 25 to 32 ms in N-array,
    M1 later), so there is no drift like that of the LFP's second, slower clock. After target onset, an
    event that does not depend on the movement onset, the arrays respond nearly together (M1 lag -4 ms
    in J-array and 9 ms in N-array, half-rise of the across-condition spread at 99 and 101 ms in N-array),
    so a fixed offset of 25 ms or more between the N-array arrays' clocks is not supported; the later
    M1 change around movement is consistent with a later M1 response.
- kind: other
  about: data
  severity: none
  statement: Checks that passed. No recording is deposited twice (the trial-interval and spike-count hashes
    of the ten files all differ). Spike times are sorted within every unit and every analysis window lies
    inside its trial. Hand position is in mm with a conversion to metres, its speed rises at offline_move_onset_time,
    and the hand ends a median 9.1 mm (J-array) and 11.4 mm (N-array) from the hit target minus the cursor
    offset. Electrode groups 1 and 2 are described as the PMd and M1 arrays, 96 units each.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which movement onset were the array datasets aligned on,
    the rig's online detection (move_begins_time in the files) or the offline estimate (offline_move_onset_time),
    and over which times was each neuron's firing-rate range taken for the soft normalisation? The paper
    says the data were precisely aligned on movement onset. This attempt assumed the offline estimate
