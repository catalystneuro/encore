  notes: With jPCA on the top 10 PCs of J-array, the first three planes capture 13.3%, 13.3% and
    12.2% (38.8% together), and the top six PCs 51.9%; only the third plane is within tolerance. The
    rotations are coherent in each plane, with 98%, 97% and 92% of conditions counter-clockwise, at
