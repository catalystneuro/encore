- claim: rotation-frequency
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2012.ipynb
  output: claim:rotation-frequency
  measured: 1.4
  notes: The largest eigenvalue of M_skew is 8.44 rad/s (1.344 Hz) in J-array and 8.81 rad/s (1.402 Hz)
    in N-array, inside 1.26 to 2.75 Hz; the measured value given is the larger. With the range over -1000
    to +700 ms, 1.333 and 1.416 Hz. Under the move_begins readings J-array gives 1.063 to 1.098 Hz, below
    the range, which would make the claim partially reproduced. With 24 ms smoothing, 1.290 and 1.372
