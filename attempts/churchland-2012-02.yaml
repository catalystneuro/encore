- claim: fig3ef-same-direction
  outcome: reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig3ef-same-direction
  notes: Under the main reading 103 of 108 J-array conditions (95.4%) and 107 of 108 N-array
    conditions (99.1%) rotate counter-clockwise from -50 to +150 ms; the median net rotation is 97
    and 113 degrees. Under the four readings the shares are 94.4 to 96.3% (J-array) and 99.1 to 100%
    (N-array), and 96.3% and 99.1% with 24 ms smoothing. After shuffles 2 and 3 the median share
    stays at 93 to 98%, and after shuffle 1 it is 58 to 61% (see suppfig3-shuffle-controls). The
    units are unsorted threshold crossings (192 per session).
  deviations:
  - Units are the dandiset's 192 unsorted threshold crossings per session, where the paper used 146
    and 218 sorted isolations, as the claims file says.
  - The paper's custom smoothing step that discards features not shared across conditions is not
    applied; the Methods say it had essentially no effect on the population analyses
    (Methods, "Computing average firing rate as a function of time").
  - Rates are aligned on movement onset only; the paper also aligned on target onset and the go cue,
    for presentation.
  - The trial table has two movement-onset columns, offline_move_onset_time ("calculated offline
    using a robust algorithm") and move_begins_time, 25 ms (J-array) and 52 ms (N-array) apart at
    the median, and the paper does not say which onset it used ("data are precisely aligned on
    movement onset", Results). The window over which a unit's range is taken for the soft
    normalisation is not stated either; the codepack takes it over all the times it is given. Both
    details are run under both readings (four in all); here all four give the same outcome.
- claim: fig3-independent-of-curvature
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig3-independent-of-curvature
  notes: Under the main reading (offline onset), J-array has 34 clockwise-curving, 21 straight and 53
    counter-clockwise-curving conditions, of which 88.2%, 100% and 98.1% rotate counter-clockwise;
    N-array has 36, 18 and 54, at 100%, 100% and 98.1%. The clockwise class of J-array is below 90%
    and above 75%. Under the two move_begins readings every class is at 92.5% or more in both
    datasets, which would make the claim reproduced. The velocity-heading variant gives the same
    outcome as the main measure under each reading (J-array clockwise class 89.7% under the main
    reading). In J-array a logistic fit finds that reaches curving more clockwise are less likely to
    rotate counter-clockwise (slope 1.524 per 100 degrees of curvature, p = 0.029); in N-array it
    finds no relation (slope -0.175, p = 0.873).
  deviations:
  - The heading is undefined while the hand is at rest, at onset and when it stops. The net change
    of heading is taken between the mean path's direction over 5 to 20% of its length and over 80
    to 95% of it, from movement onset to +500 ms (path smoothed with a 10 ms Gaussian). A variant
    takes the unwrapped heading of the velocity where speed exceeds 10% of its peak. Both are
    choices made here, and they agree on the outcome.
  - Assumed, as the main reading, that the paper's movement onset is the trial table's
    offline_move_onset_time, which the file describes as calculated offline with a robust algorithm
    and at which the hand speed starts to rise (median 43 and 15 mm/s at it, under 6 mm/s 50 ms
    before). The paper says only that the data were precisely aligned on movement onset. Under
    move_begins_time the outcome would be reproduced.
- claim: fig3-phase-from-prep-state
  outcome: partially_reproduced
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig3-phase-from-prep-state
  notes: The leave-one-condition-out R2 of the state at +150 ms predicted from the state at -50 ms by
    one complex gain is 0.568 in J-array and 0.676 in N-array. The median over 20 shuffle-3 runs is
    0.686 in J-array (0.678 to 0.688 over the five seeds) and 0.600 in N-array (0.586 to 0.600). The
    criterion holds in N-array and not in J-array, where the shuffled data predict better. All four
    readings give the same (J-array 0.568 to 0.634 against shuffle medians 0.680 to 0.686).
  deviations:
  - The shuffle-3 runs are this claim's own, drawn from its seed, with the dividing point of
    suppfig3-shuffle-controls (median go cue relative to movement onset plus 50 ms, -277 ms in
    J-array and -268 ms in N-array); each shuffle's R2 is computed in its own jPCA plane.
- claim: var-captured-jpc-plane
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_churchland_2012.ipynb
  output: claim:var-captured-jpc-plane
  measured: 18.9
  notes: Under the main reading the first jPCA plane captures 14.9% (J-array) and 22.9% (N-array) of
    the variance, mean 18.9%; the mean is outside 28 +- 2.8% (reading a) and J-array is below 18%
