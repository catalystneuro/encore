  notes: Both sessions are in the dandiset (sub-Jenkins ses-20090918 and sub-Nitschke ses-20100923), each
    with 108 conditions among the 1980 and 2791 trials the Methods select. Each Units table has 192 rows,
    outside 146 +- 14.6 and 218 +- 21.8. The files describe the rows as threshold crossings on each electrode,
