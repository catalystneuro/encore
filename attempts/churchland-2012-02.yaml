  deviations:
  - Assumed the offline_move_onset_time column as the movement onset (see fig3-independent-of-curvature);
    under move_begins_time the outcome would be partially reproduced.
  - The derivative is the difference of samples 10 ms apart (Methods), so eigenvalues per sample are multiplied
