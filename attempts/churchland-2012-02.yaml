- claim: fig6-velocity-model
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig6-velocity-model
  notes: Under the main reading (rates lead the hand by 100 ms, preparatory term falling as the movement
    term starts) M_skew fits the simulated population poorly in both datasets, with 6-D ratios of 0.590
    (J-array) and 0.153 (N-array), below 0.6 and below the neural 0.918 and 0.909. The N-array angle distribution
    peaks at 0.083 pi, below pi/4, and the J-array one at 0.472 pi, above it, so the criterion holds in
    N-array only. All five seeds give partially reproduced (J-array 6-D ratios 0.517 to 0.590 and peaks
    0.472 to 0.528 pi; N-array ratios 0.134 to 0.174 and peaks 0.083 to 0.139 pi). Under the main reading
    28% (J-array) and 39% (N-array) of the simulated angles lie within pi/4 of zero, against 36% and 36%
    within pi/4 of pi/2. The other readings differ. With the preparatory term falling around hand onset
    (100 ms lead) the outcome is not reproduced (peaks 0.417 and 0.639 pi), as with a persisting term
    and a 100 ms lead (0.639 and 0.417 pi; one seed of five gives partially reproduced) and with a persisting
    term and no lead (0.250 and 0.361 pi); with no lead and the falling term it is reproduced under every
    seed (peaks -0.083 to 0.028 pi and 0.028 to 0.083 pi). The stricter reading of the peak, 0 <= peak
    < pi/4, changes only the no-lead reading, to partially reproduced. The part of the statement that
    M_skew fits poorly holds under every reading and seed (6-D ratios 0.056 to 0.590). The simulated population
    is this attempt's construction from the Methods' description.
  deviations:
  - The Methods give the factors (velocity, speed; endpoint and peak speed for the preparatory activity),
    uniform preferred directions, rates and trial counts matched to the recorded units, and gamma-interval
    spiking of order 2. They do not give how far the rates lead the hand, the time course of the preparatory
    term, or the factors' relative weights. Assumed a lead of 100 ms, the usual lead of motor cortical
    activity over the hand in velocity-tuning models such as the one the paper cites (ref. 27), and a
    preparatory term that falls to zero over 100 ms centred on the time the movement term starts (100
    ms before hand onset), since in the model both terms are neural activity and preparatory activity
    gives way when movement activity begins. The first version of this attempt centred the fall on hand
    onset, which with the 100 ms lead overlaps the two terms inside the analysed window; it was changed
    after round 1 of verification, before the new reading was run, and is kept as a reading. A lead of
    0 ms and a persisting preparatory term are the other readings. Factors are scaled to unit SD and weighted
    by uniform draws on 0 to 1 (Methods, "a random combination of the underlying factors").
  - Each simulated unit's noiseless rate is scaled to the recorded unit's mean and range over -1000 to
    +700 ms and rectified; the paper says only that firing rates were matched.
  - Simulated with the condition-mean hand paths of the session (smoothed with a 20 ms Gaussian before
    differentiating), under the main pipeline reading only.
  - The criterion's "angle peak is below pi/4" is read as |peak| < pi/4, a peak near zero; a peak near
    -pi, where the state and its derivative point in opposite directions, does not count. The stricter
    0 <= peak < pi/4 is shown as well.
