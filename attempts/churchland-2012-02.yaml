- claim: fig6-velocity-model
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig6-velocity-model
  notes: Under the main reading (rates lead the hand by 100 ms, preparatory term falling at movement
    onset), M_skew fits the simulated population poorly, with 6-D ratios of 0.400 (J-array) and
    0.244 (N-array), below 0.6 and below the neural 0.918 and 0.909; but the angle distribution peaks
    at 0.417 pi and 0.639 pi, above pi/4, in both datasets, and 76% and 87% of the simulated
    conditions rotate counter-clockwise. All five seeds give not reproduced (6-D ratios 0.345 to
    0.400 and 0.178 to 0.244, peaks 0.306 to 0.472 pi and 0.250 to 0.639 pi). With no lead the
    criterion holds in both datasets (ratios 0.077 and 0.083, peaks -0.083 pi and 0.083 pi), which
    would make the claim reproduced; with a persisting preparatory term it fails in both under
    either lead. The part of the statement that M_skew fits poorly holds under every reading. The
    simulated population is this attempt's construction from the Methods' description.
  deviations:
  - The Methods give the factors (velocity, speed; endpoint and peak speed for the preparatory
    activity), uniform preferred directions, rates and trial counts matched to the recorded units,
    and gamma-interval spiking of order 2. They do not give how far the rates lead the hand, the time
    course of the preparatory term, or the factors' relative weights. Assumed a lead of 100 ms, the
    usual lead of motor cortical activity over the hand in velocity-tuning models such as the one the
    paper cites (ref. 27), a preparatory term that falls to zero from -50 to +50 ms around movement
    onset, and uniform weights from 0 to 1 on unit-SD factors. A lead of 0 ms and a persisting
    preparatory term were run as the other readings.
  - Each simulated unit's noiseless rate is scaled to the recorded unit's mean and range over -1000 to
    +700 ms and rectified; the paper says only that firing rates were matched.
  - Simulated with the condition-mean hand paths of the session (smoothed with a 20 ms Gaussian
    before differentiating), under the main pipeline reading only.
- claim: fig6-complex-kinematic-model
  outcome: partially_reproduced
  assumed: true
  seed_sensitive: true
  notebook: reproduce_churchland_2012.ipynb
  output: claim:fig6-complex-kinematic-model
  notes: Under the main reading M_skew fits poorly in both datasets (6-D ratios 0.095 in J-array and
    0.144 in N-array, against the neural 0.918 and 0.909). The J-array angle peak is at -0.972 pi,
    below pi/4 as the criterion asks (the state and its derivative point in opposite directions,
    not a rotation), and the N-array peak at 0.861 pi is above it. Under the five seeds the outcome
    is partially reproduced twice and not reproduced three times (6-D ratios 0.089 to 0.096 and 0.129
    to 0.144; J-array peaks -0.972 to 0.750 pi, N-array 0.528 to 0.861 pi). The other readings give
    partially reproduced (no lead, either preparatory term) or not reproduced (persisting
    preparatory term, 100 ms lead). The part of the statement that M_skew fits poorly holds under
    every reading and seed.
  deviations:
  - Uses the Methods' sensitivities (25, 10, 1 and 0.05 spikes/s per m, m/s, m/s2 and m/s3 along the
    preferred direction). The preparatory term, "sensitive to target endpoint", is given 25 spikes/s
    per m of endpoint along a preparatory preferred direction, an assumption. The lead and the
    preparatory time course are assumed as for fig6-velocity-model.
