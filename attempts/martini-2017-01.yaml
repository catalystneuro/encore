findings:
- kind: data_missing
  statement: The data set holds raw movies and stimulus files only. No ROIs, traces, neuron positions
    or tuning labels are deposited, so every result must be rebuilt from the movies and the paper's 1054
    neurons cannot be identified; an automatic detector finds 2626 ROIs.
- kind: selection_undocumented
  statement: The paper does not say how its 1054 neurons (about 21 per field) were chosen from the somata
    visible in the mean images (34 to 70 per field were found here), nor how fields with excessive motion
    were judged. Fractions and correlations depend on that selection.
- kind: data_missing
  statement: Six movies have no stimulus file, the first recording of a field in six mice (exp2/exp1_0001,
    exp3/exp1_0001, exp4/exp1_0001, exp6/exp2_0001, exp7/exp2_0001, exp8/exp2_0001), so their responses
    cannot be aligned to the stimulus.
- kind: paper_inconsistency
  statement: Each complete stimulus file holds 89 deflections, with the smallest position stimulus presented
    9 times, where the paper states each stimulus was presented 10 times per recording; and 188 of 190
    files hold one and the same order, where the paper states that waveforms and amplitudes were randomly
    interleaved (the order is mixed within a recording but repeated across recordings and mice).
- kind: other
  statement: Two stimulus files are incomplete (exp10/exp3_0004 holds 52 deflections with a 40 s gap,
    exp6/exp2_0003 holds 87), and nine start just after a frame pulse, holding 831 pulses where the others
    hold 832; in those nine the deflections fall one frame earlier relative to the first pulse, consistent
    with one frame before the file's start. The movies have 833 frames, one more than the pulses in a
    95 s file. In exp10/exp3_0004 the command lies 13 mV from rest for the first 39 s, which the parser
    counts as a deflection; it has no response window and enters no analysis.
- kind: metadata_insufficient
  statement: Of the histology figures of experiments 8 to 10 only exp8's places its fields and their neurons
    on the surface image; exp9 shows neurons without field labels and exp10 a dashed square only, and
    the surface image the paper used for the alignment is not deposited, so the barrel and septum analyses
    (Figure 4) cannot be repeated.
- kind: metadata_error
  statement: The data description says 3 to 6 fields were acquired per mouse; the data hold 3 to 8 (8
    in exp3). The description's header and the tar's README.txt name the data set "ssc-5".
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) How were the 1054 neurons selected, and which ROIs
    are they? (2) What defines a neuron that "responded to whisker stimulation" (50.2%)? (3) Was fdr_bh
    run with 'pdep' or 'dep', over all 3 x N p-values of a field or per feature, and did negative slopes
    count as tuning? (4) Was SI computed on raw coefficients, coefficients in percent dF/F0 or unit vectors,
    and which 26 fields entered Figure 3G? (5) Which mouse and field hold the example neuron of Figure
    2A-C and the example field of Figure 3? (6) Where is each field on the barrel maps of experiments
    8 to 10? The choices made here are stated in the attempt's deviations; most tuning readings give the
    paper's non-tuned fraction, and the response fraction falls just short under the closest reading.
verifications:
- date: '2026-11-10'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: The first executed notebook with the conclusion cells and the summary removed, the helper
    module and the claims file, with the paper's full text. The verifier tested the helpers fdr, regress_joint,
    regress_separate, responses, shuffled_series, spearman_upper and parse_stim on synthetic inputs and
    checked the archive's file list. It had no attempt record and took the claims from the claims file.
  results:
  - claim: dataset-size
    agrees: true
    outcome: partially_reproduced
    reason: Mice 10, fields 49 and movies per field 4 all match (cell 8). Neurons are 2624 against 1054
      +- 105, and P1 is presented 9 times, not 10, in all 188 complete stimulus files, which fails the
      zero tolerance. Problem 1, the ROI detector finds 2624 ROIs, a median of 54 per field, with several
      centroids in dim neuropil, and no sensitivity run with a stricter detector was done. Problem 8,
      nothing shows whether a 90th deflection is outside the file or missed by the parser, and one file's
      first deflection falls at frame phase 0, unexplained.
    response: Added ROI overlays for all 49 fields, a strict ROI set (the 1054 strongest by detection
      strength) and a section that reruns the main reading of every tested claim on it. Printed the onset
      range (1.96 to 90.01 s in 95 s files), the largest command excursion outside the deflections (9.8
      mV) and the first and last 3 s of one file; the 90th presentation was not given. The phase-0 file
      (exp10/exp3_0004) starts with the command 13 mV from rest for 39 s, counted as a deflection with
      no response window. Outcome unchanged.
  - claim: stimulus-set
    agrees: true
    outcome: partially_reproduced
    reason: There are 3 shapes x 3 levels with ratios 4.99-5.00 and 2.996-2.999, and onsets 1.000 s apart
      (cell 10). The criterion also requires the order to differ between recordings, but 188 of 190 files
      share one order and the other two are truncated (problem 7).
    response: No change.
  - claim: fig2ab-example-neuron
    agrees: true
    outcome: blocked
    reason: The neuron is not identified in the paper or the data. The criterion asks for a match of the
      Figure 2C mask against the field mean images, and cell 11 says this was not attempted (problem 6);
      the blocked outcome rests on a step that was skipped, not one that failed.
    response: Added overlays of all 49 fields with their ROIs. Figure 2C shows masks as circles on a uniform
      grey background with no image of the field, so only about ten centres could be matched against ROIs
      that are not the paper's; the match was not attempted, and the notes now say why. Outcome unchanged.
  - claim: responsive-fraction
    agrees: true
    outcome: not_reproduced
    reason: Reading (a) gives 44.7%, (b) BY gives 17.5% and the BH variant gives 33.9%. All are outside
      45.2-55.2 (cell 13). (a) misses by 0.5 points, so the result is fragile to the ROI set (problem
      1).
    response: Reran both readings with the literal halo formula, the strict ROI set, both, and without
      the five fields that fail the clock check; reading (a) gives 41.3, 42.6, 39.5 and 45.5%, the last
      just inside the tolerance. The main analysis keeps all 49 fields, so the outcome is unchanged, and
      the notes record its fragility.
  - claim: fig2de-tuned-fraction
    agrees: true
    outcome: reproduced
    reason: Main reading 78.4% non-tuned pooled and as the mean over fields, inside 64.6-79.0. Problem
      2, for experiments 8 to 10, the only mice with per-mouse counts in the paper (59/167, 39/102 and
      47/117 tuned), the notebook has about 6.3%, 11.4% and 6.7% tuned, so the pooled match is not supported
      mouse by mouse; it comes from a mix of very different mice. The verifier keeps the outcome as reproduced
      because the criterion is pooled, but it is weak.
    response: The notebook now prints the tuned counts of exp8 to exp10 next to the paper's, under the
      main reading and over all 16 readings (at most 54, 28 and 43), and the conclusion and notes state
      that the match does not hold mouse by mouse. The strict ROI set gives 74.0% and the literal halo
