  - claim: fig2e-all-categories
    agrees: true
    outcome: reproduced
    reason: All four classes are non-empty in all 16 readings (cell 17).
    response: No change; all four classes are also present under every sensitivity variant.
  - claim: tuning-consistency
    agrees: true
    outcome: reproduced
    reason: With all neurons as the denominator 99.5% and 86.5%, inside 85.5-104.5 and 72.9-89.1 (cell
