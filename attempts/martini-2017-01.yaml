  - The halo correction is run under both readings of the Methods (halo fluorescence was scaled (optimal
    factor = 0.7) and subtracted from the background-subtracted mean fluorescence); (F - bg) - 0.7 (H
    - bg), the main reading, and the literal (F - bg) - 0.7 H. They differ by 0.7 bg(t), common to all
    ROIs.
