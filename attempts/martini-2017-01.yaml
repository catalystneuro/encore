  notes: True correlations exceed shuffled ones in all 49 fields under every reading (Wilcoxon p = 3.6e-15).
    On corrected fluorescence with shuffles within recordings (the first reading, given as measured) the
    means are 0.2328 and 0.1195; with shuffles over the whole series 0.2328 and 0.0351. With the literal
