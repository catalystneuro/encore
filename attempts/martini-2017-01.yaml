findings:
- kind: data_missing
  statement: The data set holds raw movies and stimulus files only. No ROIs, traces, neuron
    positions or tuning labels are deposited, so every result must be rebuilt from the movies and
    the paper's 1054 neurons cannot be identified; an automatic detector finds 2626 ROIs.
- kind: selection_undocumented
  statement: The paper does not say how its 1054 neurons (about 21 per field) were chosen from the
    somata visible in the mean images (34 to 70 per field were found here), nor how fields with
    excessive motion were judged. Fractions and correlations depend on that selection.
- kind: data_missing
  statement: Six movies have no stimulus file, the first recording of a field in six mice
    (exp2/exp1_0001, exp3/exp1_0001, exp4/exp1_0001, exp6/exp2_0001, exp7/exp2_0001,
    exp8/exp2_0001), so their responses cannot be aligned to the stimulus.
- kind: paper_inconsistency
  statement: Each complete stimulus file holds 89 deflections, with the smallest position stimulus
    presented 9 times, where the paper states each stimulus was presented 10 times per recording;
    and 188 of 190 files hold one and the same order, where the paper states that waveforms and
    amplitudes were randomly interleaved (the order is mixed within a recording but repeated across
    recordings and mice).
- kind: other
  statement: Two stimulus files are incomplete (exp10/exp3_0004 holds 52 deflections with a 40 s
    gap, exp6/exp2_0003 holds 87), and nine start just after a frame pulse, holding 831 pulses
    where the others hold 832; in those nine the deflections fall one frame earlier relative to the
    first pulse, consistent with one frame before the file's start. The movies have 833 frames, one
    more than the pulses in a 95 s file.
- kind: metadata_insufficient
  statement: The histology figures of experiments 8 to 10 do not locate each field or its neurons
    on the barrel map, and the surface image the paper used for the alignment is not deposited, so
    the barrel and septum analyses (Figure 4) cannot be repeated.
- kind: metadata_error
  statement: The data description says 3 to 6 fields were acquired per mouse; the data hold 3 to 8
    (8 in exp3). The description's header and the tar's README.txt name the data set "ssc-5".
- kind: methods_unavailable
  statement: 'Questions for the paper''s authors. (1) How were the 1054 neurons selected, and which
    ROIs are they? (2) What defines a neuron that "responded to whisker stimulation" (50.2%)? (3)
    Was fdr_bh run with ''pdep'' or ''dep'', over all 3 x N p-values of a field or per feature, and
    did negative slopes count as tuning? (4) Was SI computed on raw coefficients, coefficients in
    percent dF/F0 or unit vectors, and which 26 fields entered Figure 3G? (5) Which mouse and field
    hold the example neuron of Figure 2A-C and the example field of Figure 3? (6) Where is each
    field on the barrel maps of experiments 8 to 10? The choices made here are stated in the
    attempt''s deviations; most tuning readings give the paper''s non-tuned fraction, and the
    response fraction falls just short under the closest reading.'
