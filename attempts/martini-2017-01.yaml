  outcome: reproduced
  assumed: true
  notebook: reproduce_martini_2017.ipynb
  output: claim:tuning-consistency
  measured:
  - 99.5
  - 86.5
  notes: With all neurons as the denominator (the criterion's first reading), 99.5% have identical tuning
    to at least one feature and 86.5% to all three in recordings 1-2 and 3-4, both within tolerance. Over
    neurons tuned in the full data the shares are 97.7% and 43.8%, and over neurons tuned in at least
    one half 96.7% and 11.3%, so the second value matches only with all neurons as the denominator, which
    the paper does not state; under it most of the agreement comes from neurons non-tuned in both halves,
    each half having half the presentations. With the joint regression, 99.0% and 77.3%. Mice range from
    60.7% to 99.5% for all three features. The literal halo formula gives 99.6% and 86.7%, the 1054 strongest
    ROIs 99.3% and 82.2%.
  deviations:
  - In the six fields whose first movie has no stimulus file the first half is recording 2 alone.
- claim: shuffle-significance
  outcome: reproduced
  assumed: true
  notebook: reproduce_martini_2017.ipynb
  output: claim:shuffle-significance
  notes: With tuning scored by 1000 shuffles of responses across amplitudes, non-tuned neurons remain
    the majority (77.4% with BH over the field, 57.0% without a correction), all four classes are present
    (38, 193, 81 and 282 with the correction; 163, 284, 190 and 492 without), and the SI test finds no
    difference from shuffled (p = 0.521 over 40 fields and 0.629 over 49). With the correction 97.1% of
    neurons have the same tuning as under the regression test. The barrel-map tests (fig4c, fig4d) could
    not be run, as they are blocked; this part of the claim is untested.
  deviations:
  - The shuffled p-value is two-sided, the fraction of shuffled slopes at least as large in magnitude
    as the observed one, as the criterion says.
