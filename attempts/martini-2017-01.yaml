outcomes:
- claim: dataset-size
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_martini_2017.ipynb
  output: claim:dataset-size
  measured:
  - 10
  - 49
  - 4
  - 9
  - 2626
  notes: Mice (10), fields (49) and movies per field (4 in every field) match. Each of the 188 complete
    stimulus files holds 89 deflections; eight stimuli are presented 10 times and the smallest position
    stimulus 9 times, so the presentation count fails its zero tolerance for that stimulus (measured gives
    the 9). The 89 onsets run from 1.96 to 90.01 s in 95 s files, and the command shows no excursion from
    rest over 9.8 mV outside the deflections found (the smallest peaks at 724 mV), so the 90th presentation
    was not given and was not missed by the parser. Six movies have no stimulus file. The ROI detector
    finds 2626 ROIs (2624 after dropping two whose F0 reaches zero), against 1054 with a tolerance of
    105; the count rests on the detector, an assumption, as the paper's Caltracer detection with manual
    supervision cannot be repeated and its cell selection is not described. A strict set of the 1054 strongest
    ROIs is run as a sensitivity check; its count is set from the paper's and is not a test of this claim.
  deviations:
  - Neurons are ROIs found again on the mean image of each field by a Laplacian-of-Gaussian blob detector
    with soma-sized area limits (ssc6.detect_rois), in place of Caltracer with manual supervision (Methods,
    2-Photon Image Analysis). The parameters were fixed before any tuning or correlation was computed
    and were not tuned to the paper's count.
- claim: stimulus-set
  outcome: partially_reproduced
  notebook: reproduce_martini_2017.ipynb
  output: claim:stimulus-set
  measured:
  - 3
  - 3
  - 5.0
  - 3.0
  - 1.0001
  notes: The command signal holds three shapes (one positive lobe, a positive then negative lobe, and
    a large negative lobe between two positive ones) at three amplitudes each, about 0.73, 2.20 and 3.66
    V, ratios to the smallest 4.99 to 5.00 and 2.996 to 2.999. Onsets are 1 s apart (median 1.0001 s).
    The order is mixed within a recording (2 of 88 neighbours share a class), but 188 of 190 stimulus
    files hold the same order and the other two are incomplete (52 and 87 deflections), so the order does
    not differ between recordings, as the criterion requires.
  deviations:
  - Shapes are classed from the lobes of the command signal and amplitudes from its largest excursion
    (ssc6.parse_stim); the classes match Figure 1B.
- claim: fig2ab-example-neuron
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The paper does not identify the mouse, field or ROI of the example neuron (claims file, open
    detail 11), and the data set holds no ROI masks. Figure 2C shows about ten cell masks as circles on
    a uniform grey background, with no image of the field, so only the arrangement of about ten centres
    could be matched, against 2624 ROIs found again that are not the paper's; this point-pattern match
    was not attempted, as it could not identify the field. Asked of the paper's authors (methods_unavailable
    finding).
- claim: responsive-fraction
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_martini_2017.ipynb
  output: claim:responsive-fraction
  measured: 44.7
  notes: Reading (a), mean response over all presentations above zero (one-sided signed-rank p < 0.05),
    gives 44.7% of 2624 neurons; reading (b), any of the nine stimuli above zero with the BY correction
    over the field, gives 17.5% (33.9% with BH). Both are below 45.2 to 55.2%; (a) misses by 0.5 points.
    Mice range from 15.5% to 88.5% under (a). Section Sensitivity repeats the main reading with the literal
    halo formula, with the 1054 ROIs of highest detection strength (a threshold set from the paper's count),
    with both, and without the five fields that fail the clock check. Reading (a) gives 41.3%, 42.6% and
    39.5% under the first three and 45.5%, just inside the tolerance, without the five fields, so the
    outcome is fragile to the field and ROI sets. The paper does not define a responding neuron; the outcome
    rests on the criterion's readings and on the re-detected ROIs.
  deviations:
  - The definition of a responding neuron is not in the paper; the two readings of the criterion were
    run, and the BH variant of (b) is shown.
- claim: fig2de-tuned-fraction
  outcome: reproduced
  assumed: true
  notebook: reproduce_martini_2017.ipynb
  output: claim:fig2de-tuned-fraction
  measured: 78.4
  notes: Under the main reading (separate regressions, BH, family of all 3 x N p-values of a field, either
    sign) 78.4% of 2624 neurons are non-tuned, pooled and as the mean over fields, within 64.6 to 79.0%.
    Ten of the 16 readings fall within the tolerance; the others give 64.5% (joint regression, BH, per
    feature, either sign) or 79.1 to 87.3% (the four BY readings with separate regressions, and BH over
    the field with positive slopes only). Non-tuned neurons are the majority under every reading. The
    pooled value mixes very different mice, from 39.3% to 99.5% non-tuned, and 8 of 49 fields have no
    tuned neuron. For the three mice whose counts the paper gives the match does not hold mouse by mouse;
    22 of 349, 25 of 219 and 16 of 238 are tuned (6.3 to 11.4%) against 59 of 167, 39 of 102 and 47 of
    117 (35 to 40%), and the most permissive reading gives at most 54, 28 and 43. The literal halo formula
    gives 78.7%, the 1054 strongest ROIs 74.0%, and the 44 fields that pass the clock check 76.8%.
  deviations:
  - The main reading for the analyses that use tuning is separate regressions (Figure 2B plots one line
    per waveform type), fdr_bh's default 'pdep' (the Methods name fdr_bh), the family of all p-values
    of a field (Methods, "for all neurons in a field of view ... in the simultaneously recorded population")
    and the two-sided slope test. Adopted as the best-supported choice; all 16 readings are shown.
  - Amplitudes enter the regression as 1, 3 and 5 (Figure 2B legend, "normalized to the smallest value")
    and responses as dF/F0 fractions; significance does not depend on these units.
  - Responses use the recordings that have a stimulus file (three in six fields).
- claim: fig2e-all-categories
  outcome: reproduced
  assumed: true
  notebook: reproduce_martini_2017.ipynb
  output: claim:fig2e-all-categories
  notes: Under the main reading, which reproduces fig2de-tuned-fraction, 36 neurons are tuned to position
    only, 183 to velocity only, 76 to acceleration only and 273 are mixed; all four classes are present
    under all 16 readings. All four classes are present under every sensitivity variant (22, 76, 33 and
    143 with the 1054 strongest ROIs).
  deviations:
  - Rests on the ROIs found again (dataset-size) and on the main tuning reading of fig2de-tuned-fraction,
    as the criterion asks for the reading that reproduces that claim.
