  - claim: shuffle-significance
    agrees: true
    outcome: reproduced
    reason: With FDR 77.4% non-tuned, all classes present, SI p = 0.521. Without FDR 57.0%, all classes,
      SI p = 0.629 (cells 21 and 34). The Figure 4 parts are untestable.
    response: No change.
  - claim: fig3b-example-correlation
    agrees: true
    outcome: blocked
    reason: The field is not identified. The Figure 3F inset or the n = 31 count was not tried as a match;
      the verifier agrees a match is unlikely with re-detected ROIs.
    response: The notes and notebook now say why neither the count of 31 nor the inset's ten circles on
      a grey background identifies a field with 34 to 70 re-detected ROIs per field; the match was not
