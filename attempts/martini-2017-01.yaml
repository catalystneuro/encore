- claim: fig3e-correlation-falls-with-distance
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_martini_2017.ipynb
  output: claim:fig3e-correlation-falls-with-distance
  measured:
  - -0.287
  - -0.094
  notes: Slopes of correlation on distance are below shuffled under every reading (true below
    shuffled in 42 to 48 of 49 fields, Wilcoxon p from 1.1e-14 to 8.1e-09). The true median is
    within tolerance (-0.287 per mm on corrected fluorescence, -0.237 on dF/F0; pairs up to 300 um
