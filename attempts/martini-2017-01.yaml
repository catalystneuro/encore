- claim: correlation-gradient-beyond-200um
  outcome: reproduced
  assumed: true
  notebook: reproduce_martini_2017.ipynb
  output: claim:correlation-gradient-beyond-200um
  measured:
  - -0.027
  - -0.021
  - 49
  notes: Under the main reading (corrected fluorescence, shuffles within recordings, slopes over the
    pairs more than 200 um apart) the slopes do not differ from shuffled (median -0.027 against
    -0.021 per mm, p = 0.459, median difference -0.025); shuffles over the whole series give p =
    0.76 and dF/F0 p = 0.412. All 49 fields have more than 4 pairs over 200 um apart (25 to 437),
    where the paper has 30, so the field count is outside its tolerance, and the shuffled median is
    just outside its tolerance (-0.194 to -0.024). Fitted over all pairs of those fields (the
    variant), slopes differ from shuffled (p <= 3.1e-13).
  deviations:
  - The shuffled slope over the far pairs is the mean over the field's 100 permutations of
    fig3c-correlation-above-shuffle; distances rest on the ROIs found again.
