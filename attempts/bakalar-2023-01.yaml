- claim: fig5-dg-fos
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_bakalar_2023.ipynb
  output: claim:fig5-dg-fos
  notes: 'Tested on all 22 hemispheres (10 PACAP fl/fl from 6 mice, 12 PACAPko from 7) with cells recounted
    from the deposited segmentations by the 9 to 900 voxel rule of the Supplemental Methods. Over the 20 readings
    the criterion names (thresholds 4000 to 12000, region size as the hemisphere''s label volume or the atlas
    volume, outliers removed within genotype or pooled), DG-sg and DG-po are both higher in PACAPko with BKY-adjusted
    p < 0.05 in 12 readings, one of the two in 3 and neither in 5, so the criterion blocks the claim. With
    density and outliers removed within genotype both hold at every threshold (DG-sg adjusted p 0.0013 to 0.035,
    DG-po 0.0014 to 0.0088); with the pooled outlier rule or raw counts they fail at some thresholds from 8000
    up. PACAPko is higher under every reading; DG-sg at 199.7% to 238.9% of PACAP fl/fl (ratio of means; paper
    224.23%) and DG-po at 260.8% to 546.8% (paper 325.82%). Raw p is 3.1e-06 to 6.2e-03 for DG-sg and 6.8e-06
    to 3.7e-03 for DG-po (paper 2.65e-05 and 1.85e-04); U 93 to 120 and 80 to 120 against 88 and 85, as 22
    hemispheres allow U up to 120. At threshold 4000 every PACAPko mouse is above every PACAP fl/fl mouse in
    both regions. The statement''s ''only two regions'' does not hold; under density and within-genotype outliers
    11 to 38 regions have adjusted p < 0.05. Variants. Counting every component (the rule of the dataset''s
    count tables) gives 15 readings with both, 2 with one and 3 with neither. The 13 hemispheres of the count
    tables give neither region at adjusted p < 0.05 in any reading (raw p 0.0012 to 0.035). With 7 and 6 hemispheres
    the smallest possible raw p is 2/C(13,6) = 1.2e-03, so this variant has little power over 438 regions and
    is not evidence against the claim. Over the 48 choices of 8 PACAP fl/fl hemispheres from 6 mice and 11
    PACAPko from 6 mice (the paper''s numbers), 480 of 960 subset analyses give both, 128 one and 352 neither;
    in 150 DG-sg has U = 88 and raw p 2.65e-05, the values of Table 4. BKY at alpha 0.1 changes no outcome.
    More variants of the main rule, each over the 20 readings: unmasked labels for all 22 hemispheres give
    14 readings with both, 3 with one and 3 with neither; leaving out the 2 hemispheres with a corrected heatmap
    gives 7, 6 and 7; the 18 hemispheres that hold the higher thresholds give 5, 2 and 13. At thresholds 14000
    to 26000 on those 18 hemispheres, 55 of 56 analyses (both counting rules) give neither region and 1 gives
    one, with PACAPko higher in all 56. With the 4 hemispheres of the finer series at each threshold of their
    own series, 133 of 220 analyses give both, 37 one and 50 neither. Thresholds 28000 to 40000 were not run,
    for time. Question for the paper''s authors (recorded as a methods_unavailable finding): which FRST threshold
    was used for each hemisphere, which 19 of the 22 deposited hemispheres were analysed, whether the 1.5 IQR
    rule was applied within each genotype, what region size the counts were divided by, which label image was
    used for the 6 hemispheres without a masked one, which regions an artifact mask removed, and which 431
    regions were tested. The readings differ in outcome mainly through the outlier rule and the region size
    at thresholds of 8000 and above.'
  deviations:
  - The dataset's count tables cover 13 of the 22 hemispheres and count every connected component, so cells
    were recounted from the deposited binary FRST segmentations by the Supplemental Methods' rule (Cell counting,
    'its volume was chosen to be within 9 and 900 voxels', each cell assigned to the label 'which contained
    the highest proportion of the cell volume'). Counting every component reproduces the tables to a median
    summed per-region difference of 1.25% (at most 2.26%); the tables' rule is shown as a variant.
  - Connectivity of the components is not stated; 26-connectivity was assumed (the 3-D default of MATLAB's
    bwconncomp, the CATNIP binaries being compiled MATLAB, Supplemental Methods, Atlas alignment), and it is
    the reading that matches the dataset's count tables.
  - Components that reach the edge of a slab (which takes more than 48 z-planes) cannot be measured by the
    slab-wise count and are dropped; the dropped pieces are 1.6e-04 of all components and count pieces, an
    upper bound on the components. Every component of at most 48 planes is counted exactly, as a check against
    scipy.ndimage.label on a synthetic volume shows.
  - Cells are counted on AtlasLabelMasked where the dataset has it and AtlasLabel for the 6 hemispheres without
    it (CATNIP.sh at commit 4fb92da counts on the hemisphere-masked labels); the region volumes so obtained
    equal the label_volume_pixels of every count table. Counting on the unmasked AtlasLabel for all 22 hemispheres,
    the one label image every hemisphere has, is shown as a variant; the DG cell counts are the same on both,
    and the unmasked DG regions are larger, so DG densities are 0% to 17% lower.
  - The FRST threshold is not stated (Supplemental Methods, Segmentation, 'An expert user determined which
    threshold(s) to use') and the dataset does not mark one. The five thresholds that the segmentations of
    all 22 hemispheres share (4000 to 12000) are the main readings. Thresholds 14000 to 26000 were run on the
    18 hemispheres that hold them, in a second notebook. The 4 hemispheres segmented on the finer series 2000
    to 12000 were also run at each threshold of their own series, with the other 18 at each shared threshold
    (thresholds chosen per hemisphere, the same passage). Thresholds 28000 to 40000 were not run, as the run
    that counted them was stopped for time.
  - All 22 deposited hemispheres were used (reading 4b); the paper used 8 PACAP fl/fl hemispheres from 6 mice
    and 11 PACAPko from 6 without saying which, and the dataset marks none. Every choice of hemispheres matching
    those numbers (48) is shown as a variant (protocol, author step 1.6).
  - 'The paper''s 431 regions could not be rebuilt; the exclusions were read from the dataset''s label table
    (fibre-tract colour #cccccc for tracts and nerves, #aaaaaa for ventricles, the 17 cerebellar labels, labels
    ending in layer_1 and NLOT1, SPVI, and the catch-all labels root and grey), leaving 438 regions. The label
    table gives 497 regions after tracts, nerves and ventricles where the paper gives 462.'
  - Mann-Whitney U is two-sided and exact (criterion), with U of the PACAPko sample; scipy's exact method ignores
    ties. Quartiles for the IQR rule use linear interpolation, a standard choice.
  - The criterion blocks the claim when the readings of threshold, region size, outlier rule and hemispheres
    give different outcomes; this rule was followed, though the readings density with within-genotype outliers,
    which the Figure 5 legend's per-genotype outlier counts suggest, reproduce the claim at every threshold.
  - The Supplemental Methods ignore the counts of regions overlapping an artifact mask. The dataset holds no
    artifact mask in the space of the counts. Its corrected heatmaps of 2 hemispheres (45670ko Left, 45925flox
    Left) set 54467 and 1095526 atlas-space voxels to 0, but the dataset holds no atlas-space label image to
    say which regions they cover. No region was excluded; leaving out both hemispheres, the most the exclusion
    could remove for them, is shown as a variant.
- claim: table4-lenient-regions
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_bakalar_2023.ipynb
  output: claim:table4-lenient-regions
  notes: 'Blocked because it depends on fig5-dg-fos (protocol, a claim that depends on a blocked claim is blocked
    for the same reason). Its own test was run under the same 20 readings and gives partially reproduced under
    every one. IGL meets raw p <= 0.01 with PACAPko higher in all 20 readings, SNr in 16, STN in 2 (threshold
    4000 with density). The number of other regions at raw p <= 0.01 is 9 to 44 against 13 +/- 1.3; it is within
    tolerance in one reading (raw counts, pooled outliers, threshold 8000), where STN fails. The regions found
    overlap 4 to 13 of the 15 of Table 4. Counting every component gives partial in all 20 readings, with STN
    meeting the cutoff in 7. On the paper-sized subsets all three meet the cutoff in some analyses at thresholds
    4000 to 8000 with density (in all 96 at 4000) and at 4000 with raw counts, and in none at 10000 and 12000.
    Variants of the main rule: partial in all 20 readings on unmasked labels, in 15 of 20 without the corrected-heatmap
    hemispheres (5 not reproduced) and in 14 of 20 on the 18 hemispheres (6 not reproduced). At thresholds
    14000 to 26000 on the 18 hemispheres, 54 of 56 analyses are not reproduced (SNr and STN never meet the
    cutoff, IGL in 2) and 2 partial. With the finer series, 191 of 220 are partial and 29 not reproduced; all
    three of SNr, STN and IGL meet the cutoff in 33, never with the count of other regions within tolerance.
    So the claim''s own test also depends on the threshold.'
