  - claim: fig5-dg-fos
    agrees: true
    outcome: blocked
    reason: 'The readings of (1) to (3) disagree. Under the main rule they give 12 reproduced, 3 partial and
      5 not; under the every-component rule 15, 2 and 3. The criterion says that case is blocked. The reading
      closest to the paper (density, IQR within genotype) is reproduced at all 5 thresholds, with DG-sg and
      DG-po p_adj between 0.001 and 0.035. The pooled-IQR readings fail at 10000 to 12000. Problems: only the
      5 thresholds all 22 hemispheres share were run, not 14000 to 40000 (18 hemispheres) or the finer 2000
      to 12000 series of 4 re-segmented hemispheres, which points to thresholds chosen per hemisphere; the
      artifact mask is neither implemented nor mentioned, and HeatmapsAtlasSpaceCorrected for two hemispheres
      is never examined; 6 hemispheres, 5 of them PACAPko, fall back to unmasked labels, and the shift in densities
      is not shown; a component split by the slab boundary appears to be counted twice among those dropped.'
    response: 'Outcome kept. Ran thresholds 14000 to 26000 on the 18 hemispheres in a second notebook (neither
      region in 55 of 56 analyses, one in 1); 28000 to 40000 were not run, as the run was stopped for time.
      Ran the 4 hemispheres of the finer series at each threshold of their own series (133 of 220 with both,
      37 one, 50 neither). Compared the corrected heatmaps with the uncorrected ones (54467 and 1095526 voxels
      set to 0, in atlas space, for which the dataset has no label image), recorded this as a finding and a
      deviation, and ran a variant without the 2 hemispheres (7, 6 and 7). Counted every hemisphere on the
      unmasked labels in the same pass: DG cell counts are the same, DG densities 0% to 17% lower where a masked
      image exists, and the 20 readings give 14, 3 and 3. Printed the 438 included regions and the 59 labels
      excluded besides tracts, nerves and ventricles. Added a check of the slab count against scipy.ndimage.label
      on a synthetic volume: every component of at most 48 planes is counted exactly; the dropped number counts
      pieces and is now reported as an upper bound. The readings still disagree, so the criterion still blocks
      the claim.'
