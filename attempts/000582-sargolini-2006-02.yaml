findings:
- kind: metadata_error
  statement: >-
    Still present from 000582-sargolini-2006-01. Every file says the enclosure was 1 x 1 m, but on
    the larger axis the positions span 150 cm in 2 files and 200 cm in 20, 19 of which look
    circular (under 1% of samples outside the inscribed circle).
- kind: metadata_error
  statement: >-
    Still present from 000582-sargolini-2006-01. Every file says position is given for two LEDs, but
    47 of 118 files have one, so head direction cannot be computed for 167 of 620 cell-sessions.
    Rat 11084 has files of both kinds, while the paper says each rat had one or two LEDs.
- kind: identifier_missing
  statement: >-
    Still present from 000582-sargolini-2006-01. No identifier links a cell across files. Of 584
    cell-sessions with a depth, there are 425 distinct (rat, depth, hemisphere, name), 99 of which
    appear in 2 to 7 files.
- kind: selection_undocumented
  statement: >-
    Still present from 000582-sargolini-2006-01. The dandiset is described as a sample of the
    paper's data without saying how it was selected. It holds 620 cell-sessions from 15 rats
    against the paper's 627 cells from 17; layer II has 71 against 108, while layers III, V and VI
    hold slightly more than table S1A (227, 118 and 198 against 223, 110 and 186).
- kind: methods_unavailable
  statement: >-
    Partly fixed since 000582-sargolini-2006-01. This attempt read the methods in the paper's
    Supporting Online Material, supplied by a person; the paper is still not open access, the
    dandiset states no analysis parameter, and no analysis code is public.
- kind: metadata_error
  statement: >-
    New. The positions are rescaled without saying so. In all 118 files they span exactly 100, 150
    or 200 cm on the larger axis and the first trial is centred on zero; the 19 circular files
    spanning 200 cm are most likely the paper's 180 cm circle, about 11% too large. The distance
    between the two LEDs (median 5.2 cm per file, 2.6 to 36 cm, against 7 cm in the paper) is too
    variable to fix the scale.
- kind: metadata_insufficient
  statement: >-
    New. The 23 twenty-minute files hold two 10-minute trials joined near 600 s (in all 23 the
    position jumps between 599.9 and 600.1 s by more than 99.9% of the file's 0.2-s steps, and only
    the first trial is centred). There is no trial table, and nothing says which 10-minute files,
    if any, are the two trials of one recording.
- kind: data_missing
  statement: >-
    New. No file gives the recording sites' distance from the postrhinal border, which the paper's
    dorsoventral analyses (fig. S3) use; `depth` is the depth the electrodes were lowered to.
- kind: data_missing
  statement: >-
    New. No file names its enclosure, condition or the position of the cue card, so the
    cue-rotation trials of five rats cannot be found.
- kind: metadata_insufficient
  statement: >-
    New. Six cells have no layer (one in rat 11084, five in 11207), 36 no depth and 230 no
    hemisphere.
- kind: metadata_error
  statement: >-
    New. The descriptions disagree with the files. The experiment description says the sample holds
    conjunctive and head-direction cells from layers III and V, and the dandiset description that it
    holds spike times for recorded grid cells; the files hold cells of layers II, III, V and VI and
    of every class.
- kind: metadata_insufficient
  statement: >-
    New. The files do not say which LED is the red one, whose positions the paper uses. LED1 is the
    only LED in single-LED files, where the paper says rats carried a red LED, so it is taken as
    red.
