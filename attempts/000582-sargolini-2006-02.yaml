- claim: grid-phase-orientation
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:grid-phase-orientation
  notes: >-
    The analysis ran. The phase part holds in every layer under every reading (75% to 96.5% of
    simultaneous pairs displaced by more than a fifth of the spacing, 93% to 100% by more than 3
    cm). Orientation is more alike within files than between rats in layers II and III under every
    reading (p below 0.001) but not under every reading in layers V (p up to 0.23, holds under 75%
    of readings) and VI (p up to 0.38, 59%), each from three rats. Both parts hold in every layer
    under 14 of 32 readings (12 when other rats' pairs are drawn from all layers). The earlier
    attempt had no such claim.
  deviations:
  - Whether other rats' pairs are taken within the layer or from all layers is not fixed by the claims file; both are run (asked).
- claim: hd-layers
  outcome: not_reproduced
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:hd-layers
  measured: [9, 0.733, 0.599, 0.937, 0.790]
  notes: >-
    Layer II has cells passing both head-direction criteria under all four readings (9, 7, 4 and 2
    of 43), all from rat 11265 in its two 20-minute files, with U2 0.36 to 9.8 against a median of
    13.1 in deeper head-direction cells. Watson's U2 alone is significant for 39 to 41 of the 43
    layer II cells, so the block correlation decides. The deeper fraction, 0.671 to 0.733, and layer
    V (0.924 to 0.937) are within tolerance; layer III (0.527 to 0.599) is below its range under
    every reading and layer VI (0.713 to 0.790) above it under two of four. The claim needs no
    layer II cell to pass, even for a partial reproduction. The earlier attempt had no such claim;
    its deep-hd-conjunctive found 12% of layer II cells tuned with its own measure.
  deviations:
  - Two-LED files, not two-LED rats; rat 11084 has files of both kinds.
  - The block correlation passes when r > 0 with a two-sided p below the level, a standard choice.
- claim: hd-with-grid-colocalized
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:hd-with-grid-colocalized
  notes: >-
    The analysis ran; the two units of colocalization disagree under all 64 readings. By file, 79%
    to 91% of the 49 to 56 files with a pure head-direction cell in layers III to VI also hold a grid
    or conjunctive cell; by tetrode, 39% to 48% of 107 to 126 tetrodes do. The earlier attempt had
    no such claim.
  deviations:
  - Head-direction cells are the pure head-direction cells of table S1B, and the grid or conjunctive cell must be another cell; the claims file does not say (asked).
- claim: hd-tuning-breadth-layers
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:hd-tuning-breadth-layers
  notes: >-
    The analysis ran; the readings disagree. On U2 no ANOVA and 7 of 68 Kruskal-Wallis tests find a
    difference between layers III, V and VI; on the angular standard deviation many do (angular
    deviation, ANOVA 28 and Kruskal-Wallis 36 of 68; circular standard deviation, 45 and 36 of 68),
    layer V being more sharply tuned (46 to 47 degrees against 53 to 55, with conjunctive cells).
    Means are within tolerance in 2 of 204 rows. The earlier attempt had no such claim.
  deviations:
  - The angular standard deviation is run both as Batschelet's angular deviation and as his circular standard deviation (asked); the outcome does not depend on the answer.
- claim: hd-full-range
  outcome: reproduced
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:hd-full-range
  notes: >-
    Under all four readings the preferred directions fill all twelve 30-degree sectors, and so all
    60- and 90-degree sectors, in layers III (96 to 109 cells), V (73 to 74) and VI (102 to 113).
    The earlier attempt had no such claim.
  deviations:
  - Sectors start at 0 degrees of the camera frame, a standard choice.
- claim: hd-colocalized-distributed
  outcome: reproduced
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:hd-colocalized-distributed
  notes: >-
    Under every reading fewer than half of the ensembles of five or more simultaneous
    head-direction cells are clustered by Watson's one-sample U2 test, 0 to 2 of 9 to 16 ensembles
    of pure head-direction cells and 2 to 4 of 26 to 28 with conjunctive cells. The counts differ
    from the paper's 4 of 12; the clustered count is within 4 +/- 0.4 under one reading only (4 of
    26, with conjunctive cells). Most ensembles are from rats 11207 (18 of 28) and 11265 (6). The
    earlier attempt had no such claim.
  deviations:
  - Critical values of the one-sample U2 test by Stephens' small-sample form, which gives the paper's 0.177 to 0.182.
- claim: hd-stable-trials
  outcome: reproduced
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:hd-stable-trials
  measured: 0.781
  notes: >-
    For 88 to 96 head-direction and conjunctive cells in the 19 or 20 two-trial files of 3 rats, the
    circular correlation of preferred direction between trials is 0.78 to 0.85 and the mean
    correlation of the trials' tuning curves 0.77 to 0.81, all p below 0.001 and within
    0.84 +/- 0.084 under both readings and all four classifications. The statement's "always"
    holds less well, as 7 to 14 cells have tuning curves correlated below 0.5 between trials; two
    cells silent in one trial are left out. The earlier attempt had no such claim.
  deviations:
  - Only the 23 twenty-minute files hold two trials, all from 3 rats (11025, 11138, 11207 among the head-direction cells).
  - Circular correlation by Jammalamadaka and SenGupta, a standard choice.
- claim: hd-rates
  outcome: not_reproduced
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:hd-rates
  notes: >-
    The median background rate is 0 Hz (lowest bin) or 0.33 to 0.50 Hz (beyond 90 degrees),
