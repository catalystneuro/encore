outcomes:
- claim: layer2-grid
  outcome: partially_reproduced
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:layer2-grid
  measured: [0.634, 0.559, 0.314, 0.359]
  notes: >-
    Under all 32 readings (O1 to O3, and the peak centre as maximum or centroid) layer II has the
    largest fraction of grid cells, 0.620 to 0.718, above 0.5 and above layers III (0.542 to
    0.604), V (0.305 to 0.415) and VI (0.359 to 0.485). Layer II is within tolerance under 13 of
    32 readings; no deeper layer is within tolerance under any, each being well above the paper's
    fraction. Gridness above 0 makes 280 to 329 of 614 cells grid cells, against 203 of 627 in the
    paper. Per rat, layer II fractions are 0.41 to 0.90 and deeper ones 0 to 0.67; counting each
    (rat, depth, hemisphere, name) once keeps the order (0.680, 0.511, 0.356, 0.329). Same outcome
    as 000582-sargolini-2006-01, for another reason. That attempt used its own grid score with a
    shuffled-data threshold, under which about a third of layer II cells were grid cells, so the
    majority part was in doubt; with the paper's criterion, gridness above 0, the majority and the
    order hold and the deeper layers' fractions are what falls short.
  deviations:
  - Each cell-session counts as a cell; no identifier links cells across files.
  - The dandiset holds 71 layer II cell-sessions against the paper's 108, and 15 rats against 17.
  - A peak's centre is run as its maximum and as its centroid, and a peak's radius is that of a disc of the same area; the claims file does not fix either (asked).
  - Positions are rescaled in the files; rate maps use them as deposited.
- claim: grid-all-layers
  outcome: reproduced
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:grid-all-layers
  notes: >-
    Every layer has grid cells under all 32 readings, at least 44 in layer II, 123 in III, 36 in V
    and 71 in VI, from 5, 6, 3 and 3 rats under the first reading. The earlier attempt had no such
    claim.
  deviations:
  - As for layer2-grid.
- claim: gridness-range-similar
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:gridness-range-similar
  notes: >-
    The analysis ran; the criterion's two tests disagree. The Mann-Whitney test of layer II against
    layers III to VI finds a difference under 2 of 32 readings (p 0.013 to 0.993); the
    Kruskal-Wallis test across the four layers finds one under all 32 (p 0.0001 to 0.047). The
    Kruskal-Wallis difference lies among the deeper layers (median gridness of grid cells 0.46 to
    0.76 in layer III, 0.21 to 0.43 in layer V, 0.28 to 0.57 in layer II). The ranges are alike,
    from about 0 to between 1.14 and 1.49 in every layer. The earlier attempt had no such claim.
- claim: grid-stable
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:grid-stable
  measured: 280
  notes: >-
    The analysis ran. No combination of readings has every grid cell stable, and the 256
    combinations split between partially reproduced (51, at least 90% stable) and not reproduced
    (205). With map correlations within trials (odd and even minutes) and between trials, 91.8% to
    96.3% of grid cells are stable; with gridness above 0 required in both parts of each trial,
    54% to 65%. Between trials, 87% to 95% of the 72 to 85 grid cells in two-trial files have a
    significant positive map correlation and 55% to 70% have gridness above 0 in both trials. The
    number of grid cells, 280 to 329, is outside 203 +/- 20. The earlier attempt had no such claim.
  deviations:
  - Only the 23 twenty-minute files hold two trials; between-trial stability is tested on their 72 to 85 grid cells.
