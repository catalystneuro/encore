- claim: gridness-range-similar
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:gridness-range-similar
  notes: >-
    The analysis ran; the criterion's two tests disagree. The Mann-Whitney test of layer II against
    layers III to VI finds a difference under 8 of 56 readings (p 0.009 to 0.993); the
    Kruskal-Wallis test across the four layers finds one under 53 of 56 (p 0.0001 to 0.159). The
    median gridness of grid cells is 0.42 to 0.78 in layer III, 0.23 to 0.58 in layer II, 0.28 to
    0.53 in layer VI and 0.17 to 0.47 in layer V, and the layer III median is above the layer II
    median under all 56 readings. Pairwise Mann-Whitney tests, not the criterion's and uncorrected,
    find layer II different from layer III under 46 of 56 readings, layer III from V under 49 and
    from VI under 25, and layer II from V under 2 and from VI under none; so the Kruskal-Wallis
    difference comes mostly from layer III, including against layer II, which pooling layers III
    to VI hides from the Mann-Whitney test. The ranges are alike, from about 0 to between 1.14 and
    1.49 in every layer. Counting each (rat, depth, hemisphere, name) once, the Mann-Whitney test
    finds a difference under 3 of 56 readings and the Kruskal-Wallis test under 10, so the tests
    still disagree. What the answer changed: the peak-radius reading adds 24 readings, and the
    tests still disagree (2 of 32 and 32 of 32 before). The earlier attempt had no such claim.
