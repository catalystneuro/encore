- claim: hd-layers
  outcome: not_reproduced
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:hd-layers
  measured: [9, 0.733, 0.599, 0.937, 0.790]
  notes: >-
    Layer II has cells passing both head-direction criteria under all four readings (9, 7, 4 and 2
    of 43), all from rat 11265 in its two 20-minute files, with U2 0.36 to 9.8 against a median of
    13.1 in deeper head-direction cells. Watson's U2 alone is significant for 39 to 41 of the 43
    layer II cells, so the block correlation decides. The deeper fraction, 0.671 to 0.733, and layer
    V (0.924 to 0.937) are within tolerance; layer III (0.527 to 0.599) is below its range under
    every reading and layer VI (0.713 to 0.790) above it under two of four. The claim needs no
    layer II cell to pass, even for a partial reproduction. The two files, of 16 March 2006, show no
    sign of bad tracking: median LED separation 3.7 and 3.9 cm (4th and 6th smallest of 71 two-LED
    files), with fewer than 0.05% of samples above 15 cm; they are the only files spanning 150 cm.
    Without them layer II has no passing cell (0 of 17) and the deeper fractions are unchanged, which
    would be partially reproduced, but that variant selects files after seeing the result and does
    not decide the outcome. It is also weak: the 17 layer II cells left are all from rat 11278, 11
    of them in sub-11278_ses-31080502, whose LEDs are more than 15 cm apart in 62% of samples;
    leaving that file out too, 0 of 6 pass, so the variant rests on 6 layer II cells with plausible
    tracking. Leaving out the two files with LEDs more than 15 cm apart in most samples
    leaves 9, 7, 4 and 2 of 32 layer II cells passing, and counting each (rat, depth, hemisphere,
    name) once 9, 7, 4 and 2 of 26. The earlier attempt had no such claim; its deep-hd-conjunctive
    found 12% of layer II cells tuned with its own measure.
  deviations:
  - Two-LED files, not two-LED rats; rat 11084 has files of both kinds.
  - The block correlation passes when r > 0 with a two-sided p below the level, a standard choice.
