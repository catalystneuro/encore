- claim: speed
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:speed
  notes: >-
    The analysis ran. Counted as cells with a positive slope at P < 0.001, 13% to 44% of grid
    cells, 11% to 28% of head-direction cells and 9% to 41% of conjunctive cells pass, far below
    the paper under every combination. Counted by a positive slope, 82% to 89%, 62% to 71% and 69%
    to 82% pass; all three are within tolerance under 54 combinations (reproduced) and the order
    alone holds under 200 (partially reproduced). The criterion calls disagreement between these
    outcomes methods_underspecified, and also says reproduced under a combination; how to read it
    was asked. The sign test against half has p at most 2.1e-17, 0.0015 and 4.5e-05 for the three
    classes. The earlier attempt called this claim reproduced; its claim was the abstract's "all
    cell types were modulated by running speed", tested as the correlation of rate with speed over
    5 cm/s bins against shuffled spike trains, at the level of each cell type. The claim now
    carries the paper's per-cell counts and regression method, whose readings disagree.
  deviations:
  - Speeds rest on positions rescaled in the files; in the 19 circular files spanning 200 cm they are about 11% too large.
- claim: speed-slope-steeper
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:speed-slope-steeper
  notes: >-
    Blocked because it depends on speed, which is blocked. The analysis ran. Under all 256
    combinations the ANOVA is significant (F 4.5 to 13.4, p at most 0.012) and grid cells have
    steeper slopes than head-direction cells (Tukey p at most 0.0084), but conjunctive cells do not
