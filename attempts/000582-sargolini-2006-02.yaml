- claim: deep-hd-conjunctive
  outcome: not_reproduced
  notebook: reproduce_sargolini_2006.ipynb
  output: claim:deep-hd-conjunctive
  measured: [0.30, 0.55, 0.93, 0.70]
  notes: >-
    Layer II has conjunctive cells under all 64 readings (1 to 8, all from rat 11265); the claim
    needs none even for a partial reproduction. The conjunctive fraction of grid cells is 0.87 to
    0.95 in layer V (within tolerance), 0.46 to 0.57 in layer III (paper 0.66) and 0.55 to 0.73 in
    layer VI (paper 0.28). Four-layer chi-square p 1.9e-11 to 0.09, three-layer p 1.6e-05 to 0.78.
    The earlier attempt called this claim reproduced. Its claim was the abstract's sentence, that
    grid, head-direction and conjunctive cells occur together in the deeper layers, which the data
    still show (table S1B, first reading, conjunctive cells 58, 25 and 30 in layers III, V and VI).
    The claim now carries the paper's per-layer fractions and requires no conjunctive cell in layer
    II, and with the paper's criteria neither holds.
