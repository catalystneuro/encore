- claim: fig4e-opto-modulation-genotypes
  outcome: not_reproduced
  notebook: reproduce_calvigioni_2023.ipynb
  output: claim:fig4e-opto-modulation-genotypes
  assumed: true
  notes: Opto-tuned fraction of GLM-fitted units, Ctl 49/492 (10.0%), Vglut2 369/743 (49.7%, Fisher p = 6.9e-52),
    Esr1 110/317 (34.7%, p = 1.2e-17), Npy 64/443 (14.4%, p = 0.044). Npy is higher than Ctl at p < 0.05, which
    the criterion excludes; the rest holds, with all four genotypes above chance for sound 1 (41 to 64% tuned) and
    air puff (37 to 50%). Over the whole session Npy is below Ctl (6.7% against 21.4%) and the criterion would be
    met; with the code's own tuned flags Npy (14.5%) does not differ from Ctl (11.0%, p = 0.128). The Npy excess
    comes from two of four mice (33/201 and 26/94). Second reading, block-2 PSTH over 0.7 to 1.2 s, mean z Vglut2
    1.81 and Esr1 1.75 (medians 0.38 and 0.42), Ctl -0.010 and Npy 0.0004 (medians -0.14 and -0.15, p = 3.7e-11
    and 2.0e-6 against 0). The claim's statement that Npy units are not modulated by the light holds in the PSTH
    reading, not in the GLM reading the criterion names.
  deviations:
  - The GLM period is not stated in the Methods. Fig4g_GLM_tuning.m sets GLM_restrict = 0 (whole session) but reads
    binned counts from files not in the repository; the same script holds a commented restriction to blocks 1 to
    4 (stop 2 s before the first block-5 trial). The code's fitted units match that restriction (no tmu unit missed,
    18 of 25 sessions identical) and not the whole session (4 identical, 57 tmu units missed). The period from the
    session start to 2 s before block 5 is adopted as an assumption, and the whole session is shown as a variant.
  - Spikes within 1 s of the files' 'spike saturation' periods are removed. The Methods say 'LFP saturation periods';
    the code (RemoveSaturationSpikes, +- 1 s) reads the 'spike saturation' series, and the 'LFP saturation' series
    would remove 19.5 min of session 147463 including all of block 3. The code's series is used, as a standard reading
    of the Methods' step; the LFP series is shown in the data check.
  - The Poisson GLM is fitted by its closed form (exact for mutually exclusive 0/1 regressors with an intercept),
    with all circular shifts computed by FFT; in session 147463 light trains outside block 2 overlap other regressors
    in 288 bins, which are left out of that session's fit.
  - Fisher's exact test and the binomial test are the criterion's choices, not the paper's.
