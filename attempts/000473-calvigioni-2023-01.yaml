- claim: ed7bd-latency-similar
  outcome: reproduced
  notebook: reproduce_calvigioni_2023.ipynb
  output: claim:ed7bd-latency-similar
  assumed: true
  notes: With the window before each event as baseline (1 s before the tone, 0.5 s before the air puff), tone latencies
    are 20 to 50 ms and lie within 20 ms across genotypes in 4 of 4 subregions under both thresholds; air-puff latencies
    are 60 to 90 ms and lie within 20 ms in 3 of 4 (PL spreads 30 ms). With the 1 s before the trial start as baseline,
    the air puff agrees in 2 (3 s.d.) or 1 (2 s.d.) of 4 subregions, because the Vglut2 rate in ORBm and PL is still
    above the pre-trial baseline at puff onset (0.7 s after the blue noise).
  deviations:
  - The criterion says 'pre-event baseline' without its length; 1 s before the tone (the Methods' pre-tone baseline)
    and 0.5 s before the air puff (between the end of the blue noise and the puff) are assumed, as the literal reading
    of the criterion; the pre-trial baseline, which fails for the air puff, is shown.
