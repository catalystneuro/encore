outcomes:
- claim: code-outputs-link
  outcome: partially_reproduced
  notebook: reproduce_calvigioni_2023.ipynb
  output: claim:code-outputs-link
  assumed: true
  notes: All 25 sessions match the code's session table by subject and date; the files give Vglut2-cre for 216300
    and 216301, which the table lists as C57BL-6J. Over blocks 1 to 4 without saturation removal, 18 of 25 sessions
    give the code's tmu units index for index (4 of these have no units), below the 22 the criterion asks; 1,937
    units are common, 61 are fitted here only (58 on ILA6a or ORBm6a channels, 38 in session 128516) and none are
    in the code's outputs only. Per genotype 492/482 (Ctl), 743/738 (Vglut2), 445/406 (Npy), 318/311 (Esr1), all
    within 10%. Over the whole session 4 sessions match and the counts are not within 10%. With the Methods' saturation
    removal, 16 sessions match. The own mean rate is a median 1.03 to 1.09 times the code's Mean_FR rate per session;
    the selection differs by 5 units (4,159 against 4,154). The dandiset's tuning scores correlate with the code's
    (Spearman r 0.95 to 0.99) and the tuned flags agree for 90 to 92% of units.
  deviations:
  - The GLM period is not stated in the Methods. Fig4g_GLM_tuning.m sets GLM_restrict = 0 (whole session) but reads
    binned counts from files not in the repository; the same script holds a commented restriction to blocks 1 to
    4 (stop 2 s before the first block-5 trial). The code's fitted units match that restriction (no tmu unit missed,
    18 of 25 sessions identical) and not the whole session (4 identical, 57 tmu units missed). The period from the
    session start to 2 s before block 5 is adopted as an assumption, and the whole session is shown as a variant.
  - Spikes within 1 s of the files' 'spike saturation' periods are removed. The Methods say 'LFP saturation periods';
    the code (RemoveSaturationSpikes, +- 1 s) reads the 'spike saturation' series, and the 'LFP saturation' series
    would remove 19.5 min of session 147463 including all of block 3. The code's series is used, as a standard reading
    of the Methods' step; the LFP series is shown in the data check.
