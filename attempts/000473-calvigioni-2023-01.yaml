findings:
- kind: metadata_error
  statement: Sessions 216300 and 216301 are labelled Vglut2-cre in the files' subject genotype, while the paper's
    code lists them as C57BL-6J controls. With the files' labels the dandiset has 3 controls and 7 Vglut2-cre mice,
    where the paper has 5 and 5.
- kind: metadata_error
  statement: The files give sex F for 10 of the 25 mice; the Fig. 4 legend states that all data were acquired in
    male mice.
- kind: other
  statement: Four sessions (128515, 258412, 259112, 273853) have no unit whose main channel is labelled ACAd, PL,
    ILA or ORBm (their probes are labelled in ORBl, ORBvl, AON, MOs and other areas), so only 21 of the 25 mice
    contribute units to the paper's analyses, 7 of the 10 Esr1-cre mice and 4 of the 5 Npy-cre mice. The paper reports
    25 mice and n = 10 Esr1-cre mice for its tests.
- kind: metadata_error
  statement: The trials table's opto_power column is 0 in every trial, and the OptogeneticSeries (unit 'mW') peaks
    at 0.9 to 3.3 per session, where the paper states 6 mW in block 2.
- kind: metadata_insufficient
  statement: The trials table holds blocks 9 to 12 (light at 5, 10 and 20 Hz and a block without frequency) and,
    in two sessions, a block 0, none described in the paper or the files; 259112 has 100 trials in block 1 and some
    blocks have 51 to 61 trials where the paper states 50.
- kind: metadata_insufficient
  statement: The trials table's opto_pulse_ts column has no unit or description; its values are the light-pulse
    times multiplied by about 11,574.
- kind: other
  statement: Sessions 268951, 273853 and 273858 hold 629, 520 and 570 tone events in AudStim_10kHz, where the trials
    table has 200 tone trials; the extra events have no trials.
- kind: metadata_error
  statement: The airpuff_duration column gives 20 ms, where the paper states a 50 ms air puff.
- kind: metadata_insufficient
  statement: The optogenetic stimulus site is 'LHA' in all 25 files, while the paper stimulates LHA somata in retrograde
    and LHb terminals in anterograde Esr1-cre mice; the files do not say which Esr1-cre mice are which (the code's
    table does).
- kind: other
  statement: The files hold two saturation series. The 'LFP saturation' series of session 147463 spans 1500 to 2671
    s, all of block 3; removing spikes in it, as the Methods' words say, silences block 3 for all 209 units of that
    session. The paper's code uses the 'spike saturation' series (274 s at most).
- kind: code_mismatch
  statement: Fig4g_GLM_tuning.m sets GLM_restrict = 0 (fit over the whole session), but the code's fitted units
    (tmu) match a fit over blocks 1 to 4 only (all 1,937 found, 18 of 25 sessions identical); over the whole session
    57 of them are not fitted. The binned counts it reads are not in the repository.
- kind: code_mismatch
  statement: The code's GLM outputs omit 61 units that pass its own selection on the dandiset, 58 of them on ILA6a
    or ORBm6a channels (38 in session 128516).
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: over which period was the GLM fitted (the whole session or blocks
    1 to 4), and which saturation series was used to remove spikes? The tuned-unit counts and the Npy result of
    Fig. 4e depend on it: over blocks 1 to 4 Npy has 14.4% opto-tuned units against 10.0% in controls (p = 0.044),
    over the whole session 6.7% against 21.4%.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: how was the onset latency of Extended Data Fig. 7b-d detected,
    and against which baseline? With the window before the air puff the genotypes agree within 20 ms in 3 of 4 subregions;
    with the pre-trial baseline only in 1 or 2.'
- kind: metadata_insufficient
  statement: The Patch-seq deposit (BioStudies S-BSST1069) labels cells with Ephys_Category codes 1 to 6 and gives
    no mapping of the codes to the paper's six neuron types.
- kind: data_missing
  statement: The pupil and eye tracking of Fig. 4f and Extended Data Fig. 7g-j are not in the dandiset; one file
    (128514) holds an eye-area trace. The LHA optotagging recordings of Extended Data Fig. 1e-j are not in it either.
