- claim: fig3c-model-theta-builds-fields
  outcome: partially_reproduced
  notebook: reproduce_wang_2014.ipynb
  output: claim:fig3c-model-theta-builds-fields
  assumed: true
  notes: A simulation; it uses no recorded data, so it says nothing about the data set. With theta (adopted
    noise reading, 5 seeds) activity is confined to theta cycles (population minimum over maximum 0.002)
    and the bump moves forward within 98% of cycles by a median 0.45 rad, so theta sequences are present
    in 5 of 5 seeds; without theta they are present in 0 of 5 and the activity is scattered (concentration
    0.19 against 0.84). Fields with theta last 0.431 s, 3.01 cycles of 7 Hz around the peak (2.96 to 3.12
    over seeds, 2 of 5 above three cycles), 2.98 cycles counting every run, against 1.33 and 0.65 cycles
    without theta (ratios 2.26 and 4.57). With a 0.05 ms step the mean is 3.00 (3 of 5 seeds above three),
    with 30 s simulated 2.98 (0 of 5); with the shared-noise variant 2.88 (0 of 5). The sequence part
    and the disruption by removing theta hold; the field length sits at the criterion's threshold of three
    cycles and does not clearly exceed it, hence partially reproduced. The paper's Supplementary Figure
    10f shows field durations of about 1.2 s for this model, longer than the 0.43 s found here, so this
    implementation may differ from the paper's in a way the Supplementary Modeling does not reveal (asked
    of the authors under findings).
  deviations:
  - The model is integrated from Supplementary Modeling (equations 1-3, N = 100, tau = 10 ms, J1 = 15,
    J0 = 30, tau_R = 0.1 s, tau_F = 0.3 s, U = 0.05, g = 1.5, k = 2.5, delta = 0.2 rad, Ornstein-Uhlenbeck
    noise of 10 ms and s.d. 5) and Supplementary Table 1. The duration (10 s, first 1 s discarded), Euler
    step (0.1 ms), initial state (uniform rates near 1 Hz) and seeds (0-4) are the standard choices the
    criterion names; a 0.05 ms step and 30 s are shown for fig3c.
  - Assumption. The noise is written eta(t), with no index for the unit. It is taken as independent noise
    in each unit, from the paper's Figure 3c,d (the no-theta panels show activity scattered independently
    over the neurons) and the Results ("Without the synchronized change in the network excitability, neurons
    in the network were activated randomly"). One process shared by all units, the equation as printed,
    is shown as a variant.
  - The paper gives no measure of theta sequences or fields in the model; the claims file's measures are
    used (bump displacement within each cycle; time a unit's rate, smoothed over a cycle, stays above
    half its peak). Two thresholds were set here to apply them, activity confined to cycles (population
    minimum over maximum below 0.1 within a cycle) and forward movement in at least 90% of cycles; fields
    are measured around each unit's peak, with every run above half the peak shown too.
- claim: fig3d-model-cues-keep-fields
  outcome: reproduced
  notebook: reproduce_wang_2014.ipynb
  output: claim:fig3d-model-cues-keep-fields
  assumed: true
  notes: A simulation; it uses no recorded data. Adopted noise reading, 5 seeds. Without theta and with
    cues (I_L = 5), no seed has theta sequences at any cue speed (population minimum over maximum 0.75
    to 0.79 against 0.004 to 0.005 with theta), the bump travels at 1.00 times the cue speed, and fields
    around the peak last 8.34, 5.90 and 3.32 cycles of 8 Hz at cue speeds pi/5, 2pi/5 and 4pi/5 rad/s,
    above three cycles in 5 of 5 seeds at each speed (counting every run 1.33, 4.48 and 3.23 cycles).
    With theta and cues, sequences are present at 2pi/5 and 4pi/5 in 5 of 5 seeds but not at pi/5 (forward
    movement in 69% of cycles, below the 90% threshold). With the shared-noise variant, fields without
    theta last 2.78, 3.00 and 2.28 cycles (above three in 2, 2 and 0 of 5 seeds), so the outcome rests
    on the noise reading.
  deviations:
  - The model is integrated from Supplementary Modeling (equations 1-3, N = 100, tau = 10 ms, J1 = 15,
    J0 = 30, tau_R = 0.1 s, tau_F = 0.3 s, U = 0.05, g = 1.5, k = 2.5, delta = 0.2 rad, Ornstein-Uhlenbeck
    noise of 10 ms and s.d. 5) and Supplementary Table 1. The duration (10 s, first 1 s discarded), Euler
    step (0.1 ms), initial state (uniform rates near 1 Hz) and seeds (0-4) are the standard choices the
    criterion names; a 0.05 ms step and 30 s are shown for fig3c.
  - Assumption. The noise is written eta(t), with no index for the unit. It is taken as independent noise
    in each unit, from the paper's Figure 3c,d (the no-theta panels show activity scattered independently
    over the neurons) and the Results ("Without the synchronized change in the network excitability, neurons
    in the network were activated randomly"). One process shared by all units, the equation as printed,
    is shown as a variant.
  - The paper gives no measure of theta sequences or fields in the model; the claims file's measures are
    used (bump displacement within each cycle; time a unit's rate, smoothed over a cycle, stays above
    half its peak). Two thresholds were set here to apply them, activity confined to cycles (population
    minimum over maximum below 0.1 within a cycle) and forward movement in at least 90% of cycles; fields
    are measured around each unit's peak, with every run above half the peak shown too.
  - The cue speed for Figure 3d is not given; the criterion's readings (2pi/5 rad/s, the 2D case's speed,
    and half and twice it) are all run. Following the cue is judged as the bump's mean travel within 20%
    of the cue speed, a threshold set here.
- claim: figs10-model-dc-no-fields
  outcome: reproduced
  notebook: reproduce_wang_2014.ipynb
  output: claim:figs10-model-dc-no-fields
  assumed: true
  notes: A simulation; it uses no recorded data. Adopted noise reading, 5 seeds. With theta the field
    sequence travels at 2.99 rad/s and fields last 0.431 s. Without theta, at I = 10 the bump (concentration
    0.88) travels at 14.85 rad/s and at I = 6 at 6.36 rad/s, faster than with theta in 5 of 5 seeds, and
    fields last 0.147 and 0.224 s, shorter in 5 of 5. At I = 4 the bump is weak (concentration 0.30) and
    travels at 2.61 rad/s, faster in 1 of 5 seeds. The shared-noise variant gives a faster bump at all
    three levels (3.96, 6.42, 14.68 rad/s).
  deviations:
  - The model is integrated from Supplementary Modeling (equations 1-3, N = 100, tau = 10 ms, J1 = 15,
    J0 = 30, tau_R = 0.1 s, tau_F = 0.3 s, U = 0.05, g = 1.5, k = 2.5, delta = 0.2 rad, Ornstein-Uhlenbeck
    noise of 10 ms and s.d. 5) and Supplementary Table 1. The duration (10 s, first 1 s discarded), Euler
    step (0.1 ms), initial state (uniform rates near 1 Hz) and seeds (0-4) are the standard choices the
    criterion names; a 0.05 ms step and 30 s are shown for fig3c.
  - Assumption. The noise is written eta(t), with no index for the unit. It is taken as independent noise
    in each unit, from the paper's Figure 3c,d (the no-theta panels show activity scattered independently
    over the neurons) and the Results ("Without the synchronized change in the network excitability, neurons
    in the network were activated randomly"). One process shared by all units, the equation as printed,
    is shown as a variant.
  - The paper gives no measure of theta sequences or fields in the model; the claims file's measures are
    used (bump displacement within each cycle; time a unit's rate, smoothed over a cycle, stays above
    half its peak). Two thresholds were set here to apply them, activity confined to cycles (population
    minimum over maximum below 0.1 within a cycle) and forward movement in at least 90% of cycles; fields
    are measured around each unit's peak, with every run above half the peak shown too.
  - Assumption. The high DC level is not given; the readings I = 4, 6 and 10 differ in outcome at I =
    4. I = 10 is adopted because Supplementary Figure 10c plots the DC input from 1 to 10 and its panel
