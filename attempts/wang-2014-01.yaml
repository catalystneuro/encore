findings:
- kind: data_missing
  statement: CRCNS hc-5 names this paper among three that used some of its data, but it holds none of
    the recordings the paper's findings rest on. Its 13 sessions are of one rat (i01) recorded on 1 to
    19 June 2008 (dates in the .xml files) in the alternation maze with 15-20 s wheel runs (median 19.7
    s over 150 runs), its home cage and an open platform. No session is a muscimol, saline, pre- or post-injection
    session (no description, note or file name mentions an injection, and theta during running is present
    in all sessions), there is no linear track, and the paper's rats ran 9 or 10 s before the doors opened.
    All 26 claims on recorded data are blocked; the data are consistent with the rat of Pastalkova et
    al. (2008) and Mizuseki et al. (2009), the other papers the descriptor names.
- kind: metadata_insufficient
  statement: The MS in every file name (i01_maze08_MS.001) is not explained. The .cat.evt files show that
    it marks a maze recording (M) concatenated with the following sleep recording (S); read as medial
    septum, it suggests septal injections that the data set does not contain.
- kind: metadata_error
  statement: The processed files of i01_maze13.002 and i01_maze15.001 label the task WheelHomeCage, while
    the descriptor and their .xml describe large open-field exploration, and they hold no laps or wheel
    runs.
- kind: metadata_error
  statement: The .xml description of i01_maze08.001 says home cage wheel running, while its processed
    file and the descriptor give an alternation session (28 laps with trial outcomes). The .xml and the
    descriptor give 53 min for i01_maze13.003, whose data last 60.2 min. The descriptor lists i01_maze08.006.tar.gz;
    the bucket holds i01_maze8.006.tar.gz.
- kind: metadata_error
  statement: The .meta files of the platform sessions give the recording start date as Sun Apr 22 2012,
    while their .xml dates are in June 2008; the 2012 date appears to be that of a conversion.
- kind: metadata_insufficient
  statement: The descriptor's field list for the processed MATLAB structure (Spike.xMM, Track.xMM, Laps.lapID)
    fits only the three MATLAB 7.3 files (*_BehavElectrDataLFP.mat). The ten MATLAB 5 files (*_BehavElectrData.mat)
    use other names (Spike.X, Track.X, Laps.NLap, Par), which also differ between sessions (Clu.FirRateHz
    in some, Clu.FirRate in others), and their units of position and speed are not stated and differ between
    sessions (x up to about 1,300 in five alternation sessions, 460 in i01_maze13.003; wheel speed up
    to about 1,000, but 18,400 in i01_maze13.003). Spike.res is a 1-based index into the tracking table,
    which is not stated; read so, the stored position at every spike equals the tracking table's. The
    descriptor gives 125 neural channels; 12 of 13 sessions have 102.
- kind: format_error
  statement: In i01_maze13.002, i01_maze13.003 and i01_maze15.001 the spike theta-phase array (Spike.thPhase)
    is shorter than the spike-time array (1,120,025 against 1,161,841; 1,243,637 against 1,303,858; 2,931,046
    against 3,166,564), so the phases cannot be assigned to spikes. In 9 of the other 10 sessions the
    stored spike phase equals the tracking table's theta phase at the spike for only 5 to 41% of spikes,
    so the two fields are different phase estimates, which the files do not say.
- kind: other
  statement: In i01_maze8.006 the LFP channel's theta barely differs between running and stillness (theta/delta
    2.84 against 2.65) and its correlation with running is flat, so the shared clock of LFP and behaviour
    could not be established there; in the other 12 sessions it peaks within a second of zero lag.
- kind: methods_unavailable
  statement: For the authors. The model's noise eta(t) is printed without a unit index; is it independent
    in each unit, as Figure 3c,d suggest, or shared by all units? The outcome of Figure 3d depends on
    it here (fields without theta are kept with independent noise, not with shared noise). What DC level
    is the high level of Supplementary Figure 10b, and how long were the simulations and what was the
    integration step? With the published parameters, fields with theta last about 0.43 s (three theta
    cycles), against the about 1.2 s of Supplementary Figure 10f for the same release probability; what
    measure of field duration, or which other setting, gives that value?
