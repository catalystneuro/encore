findings:
- kind: data_missing
  statement: The dandiset holds only the burst-number series of Fig. 7 and CANCAN and control wells at
    a packet rate of 1 Hz. The paper's 1 kHz and 10 kHz rates, raised electrodes, propidium images,
    post-exposure Hoechst, 300 and 900 ns pulses and thermometry are not in it. Three other dandisets
    citing the paper (001047, 001277, 001284) appear to hold several of these series, but 001276 does
    not point to them.
- kind: metadata_insufficient
  statement: The files give no pixel size or spatial calibration, no electrode positions and no ROI
    coordinates. Cell line is in the subject strain, but protocol, packet rate, number of bursts,
    channel and phase are only in free-text descriptions. The stated inter-electrode distance of
    10.0 mm fits the paper's 15.3 mm diagonal only as the edge-to-edge distance along a side; the
    electrode footprints in the images are 12.8 mm apart center to center at 1.625 um per pixel.
- kind: selection_undocumented
  statement: The dandiset has 3, 6, 3 and 3 CT26 wells and 5, 8, 7 and 8 CHO wells for 1, 2, 4 and 6
    bursts (x4), where Fig. 7 reports n = 3 to 5 and n = 4, and CHO wells at 1 Hz that the paper does
    not report. Nothing records which wells the paper used.
- kind: metadata_error
  statement: Every file's session_start_time is 2024-12-12, the conversion date; the experiment dates
    (June to September 2024) are only in the subject ids. Each subject is a culture well, but its age
    is given as P1D.
- kind: other
  statement: Two Hoechst files (P1_20240821_A1 and the 12.5 MB file of P1_20240821_A2) hold a second
    image plane that the description does not mention, with values near the camera offset. The
    12.5 MB file covers 1% of the well and matches the same region of the full Hoechst image of the
    same well (r = 0.89), a fragment deposited twice. Well P1_20240702_A1 has no Hoechst file.
- kind: other
  statement: In three YO-PRO-1 images (P1_20240627_B1, P1_20240821_A1, P1_20240827_A1) the electrode
    footprints are too faint, or lie partly outside the stitched area, to locate the array, so the
    paper's center cannot be placed from the image; in some others the array is off-center and its
    lower footprints touch the edge of the stitched area.
- kind: methods_unavailable
  statement: The paper does not give the spacing of the ROIs along the diagonals, the fit range used
    for Fig. 7, or which electrode footprint holds the background ROIs. With 1 mm spacing the 1-burst
    CT26 FWHM is 1.00 mm and with 0.5 mm spacing 1.09 mm, which decides whether the 7.3% and 2.3%
    figures are reproduced. Question for the authors, what ROI spacing and fit range were used for
    the FWHM values of Fig. 7, and which wells of the dandiset form each group.
