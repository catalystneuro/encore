- claim: fig7cf-fwhm-with-bursts
  outcome: reproduced
  notebook: reproduce_silkuniene_2025.ipynb
  output: claim:fig7cf-fwhm-with-bursts
  notes: Both parts hold under 2 of the 12 readings the criterion names, ROI spacing 0.5 mm, fit
    range 5 or 6 mm, fits to individual experiments; there the CT26 slope is 1.13 and 1.18 mm per
    burst with p < 0.0001 and the CHO slope has p = 0.064 and 0.090. The CT26 part fails in every
    group-mean reading (p 0.008 to 0.029), and the CHO part fails in four of the six
    individual-experiment readings (p 0.025 to 0.047). CT26 FWHM is 1.01, 2.02, 3.38 and 7.26 mm for 1, 2, 4
    and 6 bursts (x4), and CHO FWHM 2.09, 2.08 and 2.65 mm for 2, 4 and 6 (fit range 5 mm, 1 mm spacing). The
    outcome follows the criterion's rule of one reading; under the fit range and spacing adopted for
    fig7-sharpest-peak-one-burst (0.5 mm, 5 mm) it also holds.
  deviations:
  - The ROI spacing and the fit range for Fig. 7 are not in the paper; all readings of the claims
    file are run.
  - Same wells, center and background as fig7be-center-linear-with-bursts.
- claim: fig7-sharpest-peak-one-burst
  outcome: reproduced
  assumed: true
  notebook: reproduce_silkuniene_2025.ipynb
  output: claim:fig7-sharpest-peak-one-burst
  measured:
  - 1.093
  - 7.14
  - 2.29
  notes: CT26 with 1 burst (x4) gives the smallest group-mean FWHM of the dataset. With 0.5 mm ROI
    spacing the mean FWHM is 1.093, 1.099 and 1.103 mm for fit ranges of 4, 5 and 6 mm (s.e. about
    0.11, n = 3), 7.14 to 7.21% of the 15.3 mm gap, and 2.29 to 2.33% of the array area under area
    reading (b), all within tolerance; readings (a) and (c) give 0.80 and 0.57%. With 1 mm spacing
    the FWHM is 1.001 to 1.011 mm, within tolerance, but the gap percentage is 6.55 to 6.61% against
    a lower edge of 6.57% and area reading (b) gives 1.92 to 1.96%, outside 2.07 to 2.53%, which would
    make the claim partially reproduced. The three experiments give 0.92, 1.07 and 1.29 mm (fit range
    4 mm, 0.5 mm spacing). Measured values are for 0.5 mm spacing, fit range 4 mm and area reading (b).
  deviations:
  - Assumed ROI spacing of 0.5 mm along the diagonal. The paper gives no spacing; Methods 2.5 places
    the ROIs "along the diagonals of the square, connecting electrodes' footprints", which reads as a
    dense chain of ROIs, and a peak 1 mm wide is sampled by only three points of a 1 mm grid. The
    results under 1 mm spacing are shown and differ in outcome.
  - The fit range for Fig. 7 is not in the paper; 4, 5 and 6 mm are run and agree.
  - Same wells, center and background as fig7be-center-linear-with-bursts.
