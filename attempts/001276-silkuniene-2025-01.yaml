outcomes:
- claim: fig7be-center-linear-with-bursts
  outcome: partially_reproduced
  notebook: reproduce_silkuniene_2025.ipynb
  output: claim:fig7be-center-linear-with-bursts
  notes: Center YP rises with burst number in both cell lines. CHO, fit to individual experiments over
    1, 2, 4 and 6 bursts (x4), slope 643.9 a.u. per burst, p = 2.2e-10 (26 wells); fit to group
    means p = 0.0026. CT26 over 1, 2 and 4 bursts (x4), slope 1058.2 a.u. per burst, p = 0.0013 to
    individual experiments (11 wells) and p = 0.024 to group means, so p < 0.001 holds in CHO only.
    With the 6-burst point included, the CT26 slope has p = 0.00011 (individual experiments). The
    CT26 wells come from three experiment dates, 1 burst (x4) from one date only.
  deviations:
  - The dandiset has 3, 5 (one of 6 left out, see the findings), 3 and 3 usable CT26 wells and 3,
    8, 7 and 8 CHO wells for 1, 2, 4 and 6 bursts (x4), where the paper has n = 3 to 5 and n = 4.
    The paper does not say which wells it used.
  - Pixel size 1.625 um, from the 4x objective and ORCA-Flash4 camera of Methods 2.4 (6.5 um sensor
    pixels), checked against the electrode spacing; the array center is the center of a square of
    the paper's size (Methods 2.2) fitted to the dark electrode footprints (Fig. 3A legend), on
    images reduced to 16.25 um bins. The paper placed ROIs in MetaMorph.
  - Background is the median over the four footprints of 3 ROIs in each, where Methods 2.5 places 3
    ROIs in one footprint without saying which; a standard choice, with the spread between
    footprints shown.
