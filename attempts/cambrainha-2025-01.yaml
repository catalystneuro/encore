- claim: fig4-exponents-active
  outcome: not_reproduced
  notebook: reproduce_cambrainha_2025.ipynb
  output: claim:fig4-exponents-active
  measured:
  - 1.481
  - 0.760
  - 1.575
  - 0.156
  notes: No reading of O2, O9 and O10 puts more than two of the four means within tolerance (none of
    48 has three). Main reading, mean +/- SD over 97 sessions, alpha 1.481 +/- 0.053, beta 0.760
    +/- 0.056, mu 1.575 +/- 0.181 (44 sessions with a window of r^2 >= 0.85; 1.7% of windows pass
    that rule) and z 0.156 +/- 0.043. Beta is within tolerance under 46 readings, alpha under 24,
    mu and z under none. Surrogate windows give alpha 1.068 and beta 0.968.
  deviations:
  - F is fitted only over cluster sizes where P_silence > 0 (with at least three sizes), as -log 0
    cannot be fitted; with 50-ms bins large clusters are never silent.
  - tau_c is searched up to 2 s of lags, a standard limit.
