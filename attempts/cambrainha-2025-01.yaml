findings:
- kind: selection_undocumented
  about: data
  severity: major
  statement: The paper analyses 62 sessions from 44 mice with more than 128 V1 units, and 43
    sessions under stricter sorting criteria. In the dandiset 97 sessions from 68 mice have more
    than 128 units whose peak channel is in VISp, 68 sessions (54 mice) with units labelled good,
    and 1 session with the default quality filters. No documented rule gives the paper's sessions,
    and the files do not say which were used.
- kind: methods_unavailable
  statement: Following Eqs. 2 to 5 as printed, ISI-shuffled surrogate windows have kurtoses around
    3.6 (minimum 2.80) and real windows around 6.2, where the paper reports surrogate kurtoses no
    lower than about 6 and a surrogate maximum of about 7. The kurtosis scale of the paper is not
    reached, so the fixed thresholds of its figures (8, 12) and its surrogate range cannot be
    matched. With z-scored counts (the correlation matrix) the surrogate kurtoses are higher
    (minimum 4.09, median 15.88, maximum 524.10 in the active phase) and overlap the real ones, so
    that reading does not match either. Question for the authors. What exactly is pooled and
    normalised when the kurtosis is computed (Eq. 5 prints phi_i inside the sum), is the covariance
    or the correlation matrix diagonalised, and how are silent units handled?
- kind: methods_unavailable
  statement: The surrogate maximum kappa_surr_max (about 7 in Figure 3) is, as defined here, set by a
    few windows (34.29 in the active phase, 24.45 to 35.46 over seeds; 13 of 28335 surrogate windows
    above 15), which leaves every plotted threshold range empty. The windows that set it are not
    windows with few active units. Five claims are judged with the range started at every threshold
    below it. Question for the authors. Is kappa_surr_max the maximum over every surrogate window of
    all sessions, one surrogate per window, or another summary?
- kind: methods_unavailable
  statement: The CV of Appendix 1 ("of the activity across the window") is not defined. The CV of
    the population count never exceeds 5 here (no window excluded), the pooled unit-bin CV excludes
    209 of 11639 active windows, and the mean unit CV excludes 9702. Question for the authors. Which
    activity is the CV computed on?
- kind: methods_unavailable
  statement: The real-space details are not given. The K range of the fits, how P_silence is
    averaged over clusters, which spectra enter the fit of mu, and the r^2 rule (which only 1.7% of
    windows pass here, for the fit pooled over K >= 16). Here alpha and beta come out near
    the paper's values (1.48 and 0.76 active), mu about twice (1.58) and z about half (0.16).
    Fitted over ranks 1 to K/2 only, mu passes the r^2 rule in 99.9% of windows and is 1.06.
    Question for the authors. Over which K and ranks are the exponents fitted?
- kind: other
  about: data
  severity: minor
  statement: The stimulus blocks are, in every session, active task, 10-s gray screen, Gabors (15.2
    min), gray screen (4.8 min), full-field flashes (5.0 min) and passive replay. The Appendix puts
    the gray screen last, after the flashes. In one session (sub-585329, 2021-11-11) the time
    between the active and passive blocks is 80.8 min, against about 26 in the others.
- kind: other
  about: data
  severity: minor
  statement: Active 30-s windows hold 0 to 4 go trials with a hit or miss outcome (median 2), where
    Appendix 5 says three to five trials are performed in each window. Counting aborted trials as
    well gives a median of 5 per window (60.4% of windows with three to five), so the paper's count
    may include aborted trials; the files do not say which trials the paper counted.
- kind: other
  about: data
  severity: minor
  statement: Some units are assigned to a structure labelled only `VIS` (a visual area not named),
    and in a few windows almost all V1 units are silent (up to 203 units in one window; 14 windows
    of 3 sessions keep fewer than 64 active units), which looks like a recording dropout. Both are
