- claim: sessions-selected
  outcome: not_reproduced
  notebook: reproduce_cambrainha_2025.ipynb
  output: claim:sessions-selected
  measured:
  - 97
  - 68
  notes: With all units whose peak channel is in VISp (O1 (a)), 97 sessions from 68 mice have more
    than 128 V1 units (98 with at least 128). The default quality filters (O1 (b); ISI violations
    below 0.5, amplitude cutoff below 0.1, presence ratio above 0.95) leave 1 session. As variants,
    the `good` label gives 68 sessions (within 62 +/- 6.2) but from 54 mice (outside 44 +/- 4.4),
    and the valid-channel flag changes nothing. No reading gives both counts. The 97 sessions of
    reading (a) are the analysis set of every other claim.
  deviations:
  - The paper does not say how units were assigned to V1 or which sessions were dropped; units are
    assigned by the structure of their peak channel (`electrodes.location == VISp`).
- claim: fig3a-kurtosis-broader-than-surrogate
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_cambrainha_2025.ipynb
  output: claim:fig3a-kurtosis-broader-than-surrogate
  measured:
  - 2.80
  notes: Active phase, CV reading (a). The real windows spread more than their surrogates
    (interquartile range 1.98 against 0.64; median kurtosis 6.18 against 3.64), and some real
    windows exceed kappa_surr_max (largest real 89.8 against 34.29), but the lowest surrogate
    kurtoses are 2.80 (minimum) and 3.16 (5th percentile), far from 6 +/- 0.6, and fewer than 0.1%
    of windows lie above kappa_surr_max, so the majority condition fails. The largest real window
    exceeds the largest surrogate in 96 of 97 sessions. CV reading (c) gives not reproduced (no
    real window above 34.29, largest 31.9); reading (b) gives partially reproduced. All phases
    pooled give the same. Over the five seeds kappa_surr_max is 34.29, 25.15, 25.47, 24.45 and
    35.46 and the minimum 2.80, 2.57, 2.55, 2.82 and 2.83; the outcome is the same under each. The
    two poolings of O3 give identical values (psi has unit variance per unit, so the pooled
    kurtosis is the mean of the unit kurtoses). The largest surrogate window (34.29) has 182 active
    units, a rate of 0.170 spikes per bin and a CV (a) of 0.53; leaving out windows with fewer than
    64 or 128 active units leaves the active maximum at 34.29, and 13 of 28335 surrogate windows lie
    above 15. The 99th and 99.9th percentiles of the active surrogate kurtoses are 6.51 and 10.43.
    With z-scored counts (the correlation matrix in place of the covariance of Eq. 2, a variant the
    verifier asked for) the active surrogate kurtoses have a minimum of 4.09, a 5th percentile of
    7.10, a median of 15.88 and a maximum of 524.10, and overlap the real ones (median 22.07; a real
    window exceeds its surrogate in 78.0% of windows); neither input recovers lowest surrogate
    kurtoses of 6 +/- 0.6 together with a maximum near 7.
  deviations:
  - CV readings disagree (a and b partially reproduced, c not reproduced); reading (a), the CV of
    the population count, is adopted as an assumption. The Appendix describes the CV > 5 exclusion
    as removing rare artefacts not seen in awake mice; reading (b) removes 9702 of 11639 active
    windows, (a) none and (c) 209.
  - Units with no spike in a window are left out of that window (median 14 per window), a standard
    choice, since they cannot be normalised (Eq. 5).
  - The surrogate permutes the intervals between the window start, the unit's spikes and the window
    end, a standard implementation of the Appendix 2 shuffle.
- claim: fig3c-scaling-hit-rate-higher
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_cambrainha_2025.ipynb
  output: claim:fig3c-scaling-hit-rate-higher
  notes: Under the adopted CV reading (a), and under (c), kappa_surr_max is 34.29 (O6 (a)) or 48.34
    (O6 (b)), so the criterion's grid to 12.5 is empty. Started at any threshold from 3 to 12.45
    (190 starts, CV (a) and (c), O5 (a) and (b)), the criterion gives not reproduced at every start,
    so the outcome does not depend on where kappa_surr_max lies. From the paper's value of 7 (M4)
    the scaling hit rate exceeds both comparators at none of 111 points (CV (a), O5 (a)); at 7 it
    is 0.615 against 0.655 for no scaling and 0.605 trial-shuffled. Over the thresholds 3 to 15 it
    is above both at none of 236 points (0.625 against 0.645 at 8, 0.591 against 0.642 at 12). The
    99th and 99.9th percentiles of the active surrogate kurtoses (6.51 and 10.43) give 0 of 120 and
    0 of 42 points. Counting aborted trials as failures, or every trial (variants outside O5, asked
    of a reader), gives not reproduced at every start as well (47.7% and 44.1% of points from 7).
    Only CV reading (b), which keeps 1937 of 11639 active windows, gives the criterion's own grid.
    From 8.55 the scaling hit rate beats both comparators at 67.5% of 80 points (not reproduced);
    from 10.30 (O6 (b)) at all 44 points (reproduced), with 7 trials above 12.5. Under the seed
    variants that reading gives partially reproduced (+1000, +4000), not reproduced (+2000) and no
    grid (+3000). Trials placed by start time give 31.2% of points under CV (b). The outcome rests
    on the kurtosis of Eqs. 2 to 5 as printed, whose surrogate reference here (minimum 2.80, median
    3.64) is far from the paper's (lowest about 6, maximum about 7). Question for the authors, as in
    the findings. How is the kurtosis computed so that surrogate windows give values of 6 or more,
    and is kappa_surr_max the maximum over every surrogate window or a summary less sensitive to
    single windows?
  deviations:
  - CV readings disagree (b gives reproduced from 10.30, a and c not reproduced at every start);
    reading (a) is adopted as an assumption, as for fig3a-kurtosis-broader-than-surrogate.
  - The grid from kappa_surr_max (O6) is empty under CV (a) and (c); the criterion is applied with
    the grid started at every threshold from 3 to 12.45, and gives the same outcome at each.
  - The surrogate reference computed here is far from the paper's. The claim is still judged, not
    blocked, because its result is the same at every threshold and every grid start; the
    difference in the kurtosis itself is judged by fig3a-kurtosis-broader-than-surrogate.
  - Bootstrap SEs use 10^4 Poisson resamples over windows, not 10^5 resamples of fixed size (a
    standard approximation that lets one draw serve every threshold).
  - The trial shuffle follows Appendix 6 as written (each trial swaps its outcome with a random
    trial of the session), 500 repetitions.
