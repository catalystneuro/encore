- claim: neuron-counts
  outcome: not_reproduced
  notebook: reproduce_martinez_conde_2019.ipynb
  output: claim:neuron-counts
  measured: [53, 22, 29, 26, 7, 10, 36]
  notes: >-
    The spreadsheet V1_Vasarely_data_SMC.xlsx has 58 rows, the paper's total, but 5 mark no
    condition and have no files, so the files hold 53 neurons (49 from monkey J, 4 from A), as the
    data descriptor says. By folder they give 22 Square and Edge, 29 Star and 26 Corners neurons, with
    7 in three conditions, 10 in two and 36 in one (measured, in the claim's order). Counting the
    two ABS files of the Star folder as the Corners recordings they are gives 22, 27 and 26, with 7,
    8 and 38. No per-condition count is the paper's (25, 30, 28); of the overlap counts only the 7
    in all three conditions matches. The 118 recorded and 102 and 16 per monkey cannot be checked,
    as the discarded neurons are not in the data set.
  deviations:
  - Neurons are identified across conditions by the cell code without its trailing letter (date,
    monkey and cell number), as the spreadsheet lists them; nothing else in the files confirms it.
- claim: spikes-per-condition
  outcome: blocked
  blocked_by: data_missing
  notes: >-
    The files hold no spike count map and no spike times. The stored image is the spike rate per 1
    ms eye-time sample, and only one file of 77 (ABC050900J1A) also holds the eye time map, from
    which its count is 15,644 spikes. Neither reading of the criterion can be computed for the
    others. The data set's documentation (docs/crcns_pvc-12_data_description.pdf) names no other
    file that holds them.
- claim: s4-baseline-no-difference
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_martinez_conde_2019.ipynb
  output: claim:s4-baseline-no-difference
  notes: >-
    With the baseline squares centred on the corners of the circumscribing square (and for Corners
    at the bottom corners of the ROI), the medians are 5.28 (Square and Edge, n = 22), 1.42 (Star,
    n = 12) and 2.57 spikes/s (Corners, n = 26), and all three readings find a difference at 0.05;
    (a) Square and Edge against Star, BH p = 0.043 (the other pairs 0.108 and 0.315), (b)
    Kruskal-Wallis p = 0.035, (c) ANOVA p = 0.031. With the squares inside the corners the
    difference is larger (Kruskal-Wallis p = 0.008). With the files' own BaseActivity, present in
    38 of 60 files, no test finds a difference (smallest p 0.109). The outcome rests on the
    placement of the baseline squares, which the text does not fix, and the Star group has 12
    neurons in place of 30.
  deviations:
  - The baseline squares are centred on the corners of the circumscribing square, the most direct
    reading of "at the corners of the ... circumscribing square" (Methods, Visual stimuli); squares
    drawn inside the corners and the files' BaseActivity are shown as readings. This is an
    assumption.
  - The Corners baseline squares are placed at the two bottom corners of the ROI, 8 DU in from each
    side, in the 0% area. The text says only "two 1 x 1 DVA (16 x 16 DU) square regions in 0%
    luminance areas within the ROI (shown in Fig 2C)" (Methods, Corners); Fig 2C is not in the
    text read. This is an assumption.
  - Star results rest on the 12 of 27 Star recordings that hold the authors' aligned map.
- claim: fig4a-above-baseline
  outcome: reproduced
  assumed: true
  notebook: reproduce_martinez_conde_2019.ipynb
  output: claim:fig4a-above-baseline
  notes: >-
    Neurons above baseline, 21 of 22 (P180), 20 of 22 (S90), 12 of 12 (S52), 26 of 26 (S40). Under
    reading (a) every mass centre lies above the unit line and its distance grows from P180 (6.47
    spikes/s) through S90 (10.83) and S52 (20.30) to S40 (26.27). Under reading (b), the mean log
    ratio, S52 (1.21) exceeds S40 (1.00) in the main baseline, so the order holds under (a) alone;
    with the squares inside the corners or with the files' BaseActivity it holds under both. With
    the two S40 folds averaged, S40 (19.09) falls below S52.
  deviations:
  - The Corners response is taken at the bright S40 fold, following "we only analyzed symmetric
    bright corner-folds" (Methods, Corners, paragraph 2); the pattern has one bright and one dark
    S40 fold in every file. Asked of a reader (questions/martinez-conde-2019.yaml).
  - Baseline placement as in s4-baseline-no-difference (assumption).
  - Star results rest on 12 neurons in place of 30, Corners on 26 in place of 28, Square and Edge
    on 22 in place of 25.
