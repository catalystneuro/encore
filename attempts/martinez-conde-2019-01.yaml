  assumed: true
  notebook: reproduce_martinez_conde_2019.ipynb
  output: claim:fig7c-fold-edge-equivalence
  notes: >-
    The Edge response (16 x 16 DU squares on the Edge) ranges from 11.24 spikes/s at 0% luminance to
    22.77 at 90%. Under reading (a) the P180 mean (6.47) lies below the whole Edge profile and is
    nearest the 0% level, not within one step of 50%; S40 (26.27) is nearest 90%, as claimed.
