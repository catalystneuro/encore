- claim: fig5b-sepsc-frequency
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig5b-sepsc-frequency
  notes: The threshold readings the criterion names disagree, so the criterion blocks the claim. At 5 pA,
    VEN 2.06 against PC 9.36 Hz (p = 0.029, 8 VEN and 11 PC entries; 10 distinct PCs p = 0.027). At the
    recording's RMS noise (thresholds 0.9 to 8.2 pA), VEN 32.1 against PC 23.0 Hz (p = 0.090; 10 PCs
    p = 0.146), VEN higher. The first 30 s split the same way. With three times the noise, a variant, VEN
    2.82 against PC 3.57 Hz, p = 0.30. The 5 pA difference rests partly on noise, as 8 of the 11 PC rows
    come from the noisier subject Mfa201126, where the 5 pA frequencies are 4.6 times the code's sheet;
    within the low-noise subject Mfa201023 VENs are lower (0.98 against 3.02 Hz, 4 and 3 cells). The reading
    the paper's text supports best is 5 pA, the number it prints; the criterion still blocks the claim when
    the readings disagree. The question of the detection settings is for the paper's authors (finding).
  deviations:
  - Events are detected with a detector of miniAnalysis's scheme and standard parameters (helper docstring),
    not with miniAnalysis; the paper gives only the 5 pA threshold.
  - Cell types are the code's table metadata_PSC.csv; the files carry none.
  - Whole deposited recordings are analysed (120 to 480 s); 14 of the 18 files are shorter than the 5 min
    the Methods give as the minimum.
- claim: fig5b-sipsc-frequency
  outcome: not_reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig5b-sipsc-frequency
  notes: Under neither threshold reading is the VEN median below the PC median. At 5 pA, VEN 19.9 against PC
