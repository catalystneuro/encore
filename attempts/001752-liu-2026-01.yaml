findings:
- kind: metadata_insufficient
  statement: The NWB files carry no cell type (VEN or PC), the variable every Fig. 5 comparison needs. It is
    given only in a table in the paper's code (metadata_PSC.csv); the cell_id in the files is not unique
    within a session (three pairs share one).
- kind: metadata_error
  statement: In the code's table of deposited files, one sIPSC file (obj-1s3ysck) is given to two cells, PC
    20201126s5c11a and VEN 20201126s5c11b, and the other file of that session's Cell_AS011 (obj-fwphyw) is
    named by no row.
- kind: code_mismatch
  statement: For every mEPSC cell the code's table of deposited files (metadata_PSC.csv) gives the opposite
    cell type to the code's analysis sheet (miniEPSCs_Fig7ab.xlsx, sheet mEPSC_sum), which the Fig. 5 script
    reads. With the table's labels VENs have the higher mEPSC frequency; with the sheet's, the lower.
- kind: data_missing
  statement: The dandiset holds 15 mEPSC recordings (7 VENs and 8 PCs by the code's table) where the paper
    reports 8 VENs and 8 PCs; the sheet's cell S02C0321 has no file.
- kind: paper_inconsistency
  statement: The Methods state that IPSCs were recorded at -60 mV with a CsCl internal; the spontaneous IPSC
    files are described as held at +20 mV, hold positive currents of 107 to 979 pA and outward events, and the
    code names them +20mV.
- kind: format_error
  statement: 22 of the 36 mIPSC files end in runs of exact zeros (6,795 to 30,167 samples, up to 30 s),
    padding that is not data.
- kind: other
  statement: 44 of the 84 recordings are shorter than the 5 min the Methods give as the minimum recorded
    after stabilization (sEPSC 14 of 18, sIPSC 8 of 15, mIPSC 22 of 36 after the padding); and the noise of
    11 of 15 sIPSC and 2 of 18 sEPSC recordings exceeds the 5 pA the Methods give as the largest RMS noise.
- kind: methods_unavailable
  statement: For the authors. Which miniAnalysis settings (amplitude and area thresholds, baseline and peak
    windows, filtering) detected the Fig. 5 events, and which stretch of each recording was analysed? The
    Methods give only a 5 pA threshold, and with it a standard detector finds 4.6 to 15 times the sheet's
    sEPSC and sIPSC events in the noisier recordings; the code's mIPSC sheet counts events over 30 s per cell.
    The sEPSC and mIPSC frequency claims are blocked because a 5 pA threshold and one at the recording's RMS
    noise give different outcomes.
- kind: methods_unavailable
  statement: For the authors. In the code's Patch-seq mapping tables, which rows are the 34 inhibitory
    neurons and which cluster numbering do their predicted clusters follow? This attempt assumed the 33 cells
    labelled as interneurons.
- kind: code_mismatch
  statement: The Fig. 8 legend and Results name Welch's ANOVA followed by the Games-Howell test; the code's
    metabolomics notebook tests the plotted metabolites with Dunn's test (Holm correction), and its normalized
    table holds 558 identified metabolites where the paper reports 581. With the named tests on that table, 179
    metabolites differ between AIC and V1 and 85 between AIC and PrC, against 228 and 108.
- kind: code_mismatch
  statement: The code's annotation of the multi-patch dandiset (metadata_multiPatch.xlsx) lists 1,416 tested
    pairs and 26 connections, including one VEN-to-PC connection, where the paper reports 1,292 pairs, 31
    connections and no VEN-to-PC connection.
- kind: code_mismatch
  statement: The code's README places the NEURON model's hoc scripts in a 'modelling/' folder that the
    repository at commit 44cd8a6 does not hold, so the model results (Fig. 4g-l) cannot be rerun.
