inputs:
- what: Allen Brain Observatory Visual Coding Neuropixels, Brain Observatory 1.1 sessions (32 session files, natural
    scenes, units, running speed and pupil area), the paper's main dataset, for the claims with data elsewhere.
    Streamed at the pinned version, the only published one.
  source: doi:10.48324/dandi.000021/0.251116.2246
- what: Allen Brain Observatory Visual Coding Neuropixels, Functional Connectivity sessions (26 session files, natural
    movie one), for figs5a-movie-slope-near-1. Streamed at the pinned version, the only published one.
  source: doi:10.48324/dandi.000022/0.251116.2247
- what: The paper's analysis code, for method details the claims file and the Methods leave open (names of the Illusion
    image codes, the example session, slope manipulation, overlap, geodesic distance, orthogonal variance, alignment,
    RSM and decoding procedures).
  source: https://github.com/jhk4839/Neural_variability_robustness at commit ac3300b007c2348ccda73c0c87fb02f557791089
- what: AllenSDK, the software through which the paper read the Allen data. Its default unit filter (units with
    quality label good only, filter_by_validity) gives the unit selection of every claim on dandisets 000021 and
    000022, and its rule for invalid stimulus presentations (_mask_invalid_stimulus_presentations, presentations
    overlapping an invalid_times interval tagged stimulus) identifies the movie sessions the paper's code excludes.
  source: https://github.com/AllenInstitute/AllenSDK at commit a56bd8ea7613a812334602b64746cdd30c325a96 (allensdk/brain_observatory/ecephys/probes.py,
    lines 128 to 129; allensdk/brain_observatory/ecephys/ecephys_session.py, lines 645 to 680)
outcomes:
- claim: illusion-data-link
  outcome: reproduced
  notebook: reproduce_kim_2025.ipynb
  output: claim:illusion-data-link
  notes: Session sub-630506 (the code's index 6) is in the dandiset with an ICwcfg1 block. Its trial slots hold
    12 stimuli with 400 repeats, the image codes 1 to 7 and 10 to 13 and 400 Blank trials, as the code expects (num_trial_types
    12). Codes 3, 4, 10 and 11 (Ic1, Lc1, Tre1, Tre2 by the code's map) are among them, and the session has 75 V1
    units (22 by the Allen quality criteria). The dandiset names no image code; the 22 templates drawn in the notebook
    agree in kind with the code's names (codes 8 to 13 carry a real bar, 14 to 21 one inducer at the named corner,
    in or out), which cannot tell the variants 1 and 2 apart. All 11 subjects of the code are present, each with
    12 stimuli of 400 repeats; a twelfth session, sub-619293, is in the dandiset and not in the code's list.
  deviations:
  - The Blank trials are not marked in the files. They are recovered as gray frames (code 0) in trial slots, after
    60 leading gray frames, from the alternation of trials and gray inter-trial frames; every session then has 400
    Blank trials and no image frame outside a trial slot. The code read a post-processed copy (v240130) that is
    not public.
- claim: illusion-fig1c-isomap-geometry
  outcome: reproduced
  notebook: reproduce_kim_2025.ipynb
  output: claim:illusion-fig1c-isomap-geometry
  notes: Among Ic1, Lc1 and Tre1 in sub-630506 (75 V1 units), the largest strongly connected component has 1 member
    at slope 0 and 3 as-is, and the mean of the six directed overlaps is 0.000 at slope 0, 0.221 as-is and 0.318
    at slope 2 (N-neuron space, Methods threshold). All three tests hold under every reading run, the N-neuron space
    and the 2D Isomap coordinates, the Methods and the code's overlap threshold, all VISp units and the 22 quality
    units (in the 2D Isomap of the quality units the slope-0 component has 2 members). Over all 12 sessions (variant)
    the three tests hold in 9; in sub-619293, sub-620333 and sub-631570 the three stimuli still overlap at slope
    0, while their overlap rises with slope. Test (i) is computed on the graph among the three stimuli, as the criterion's
    "among" reads; on the graph over all 12 stimuli, where a path may pass through the others, the three are also
    not in one strongly connected component at slope 0 in sub-630506, under every reading. Over the 12 sessions,
    read that way, they are in one component at slope 0 in 5 (sub-619293, sub-620333, sub-625554, sub-625555, sub-631570).
- claim: illusion-fig3a-orthogonal-variance-example
  outcome: reproduced
  notebook: reproduce_kim_2025.ipynb
  output: claim:illusion-fig3a-orthogonal-variance-example
  notes: In sub-630506 the geodesic distance from Lc1 to Ic1 is 60.0 and to Tre2 17.6; the orthogonal variance of
    Lc1 is 0.0270 toward Ic1 and 0.0161 toward Tre2 (ratio 1.67). With the 22 quality units, 40.1 against 25.8 and
    0.0436 against 0.0295. The variant over all 132 ordered stimulus pairs gives a weak Spearman correlation between
    geodesic distance and orthogonal variance (0.150, p = 0.086; 0.163, p = 0.061 with the quality units).
- claim: illusion-geometry-similar-across-datasets
  outcome: reproduced
  notebook: reproduce_kim_2025.ipynb
  output: claim:illusion-geometry-similar-across-datasets
  notes: Over the 12 sessions with an ICwcfg1 block, the mean effective dimensionality falls from 0.243 at slope
    0 to 0.081 at slope 1 and 0.033 at slope 2 (as-is 0.073), and the mean overlap rises from 0.142 to 0.398 and
    0.603 (as-is 0.429), at every 0.1 step; slopes 0 and 2 differ from as-is by the Wilcoxon signed-rank test, p
    = 0.0005 each. The directions hold in each session and with the quality units. The example session alone gives
    the same directions.
  deviations:
  - All 12 sessions of the dandiset are used, including sub-619293, which the paper's code does not list.
- claim: data-v1-units
  outcome: reproduced
  assumed: true
  notebook: reproduce_kim_2025_allen.ipynb
  output: claim:data-v1-units
  measured:
  - 30
  - 66.9
  - 25.5
  - 2008
  notes: Tested on the DANDI copy of the Allen data (dandiset 000021). Two of 32 sessions have more than 10% of
    natural scenes trials silent in all V1 units, under either unit reading (index 0 and 9 in DANDI order, the first
    and seventh by session id, the order AllenSDK uses, as the data check prints; the code drops indices 0 and 6), leaving 30 sessions of
    30 mice with 119 stimuli each. With the units AllenSDK serves by default (the three criteria of the Methods
    and the quality label good), used in every analysis of the Allen data, there are 66.9 +- 25.5 V1 units per session,
    14 to 112, 2008 in all, every value within tolerance. With the three criteria alone, 71.1 +- 27.1, 14 to 113,
    2133 in all; the mean and the total are outside their tolerances (57.6 to 70.4, 1728 to 2112) and the SD and
    range inside.
  deviations:
  - Assumed that the paper's units are those of AllenSDK's default units table, which keeps only units labelled
    good (filter_by_validity, AllenSDK probes.py lines 128 to 129) in addition to the three criteria of the Methods.
    The paper reads the data through AllenSDK (Methods, Main dataset and visual stimuli; its code's pickles are
    named allensdk, and its movie extraction reads AllenSDK's units table, extract_natural_movie_neuropixels.m)
    and states only the three criteria. The two readings give different outcomes; both are shown. Since the first
    verification round the assumption applies to every claim on the Allen data, not only to the counts.
