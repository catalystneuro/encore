- claim: fig2d-tangent-angle-rises-below-1
  outcome: blocked
  blocked_by: not_runnable
  notes: Not run within this attempt's five-hour limit. The tangent space angle (tangent_angle.py in the
    paper's code, points of tangency, local PCA, weighted angle) was not ported; the geodesic neighbours
