  notebook: reproduce_kim_2025_allen.ipynb
  output: claim:figs5a-movie-slope-near-1
  measured:
  - 24
  - 75
  notes: Of the 26 Functional Connectivity sessions in dandiset 000022, none has an incomplete movie repeat
