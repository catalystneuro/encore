findings:
- kind: metadata_insufficient
  severity: major
  statement: The ICwcfg1 presentations table lists every 400 ms frame of the block, including the gray inter-trial
    frames, under one column frame. The gray frames show the same image as the Blank stimulus (template 0), and
    nothing marks which of them are Blank trials. The image codes 0 to 21 have no names in the files or the dandiset
    metadata; the names come only from the paper's code. The trials can be recovered from the sequence (60 leading
    gray frames, then trial and gray frame alternating, 400 Blank trials in every session), and the templates agree
    in kind with the code's names.
- kind: metadata_insufficient
  severity: minor
  statement: The units table describes none of its columns (quality, isi_violations, firing_rate and the others
    read "no description").
- kind: other
  about: data
  severity: none
  statement: The spikes share the clock of the ICwcfg1 table. The V1 population rate rises 75 ms after image onsets
    and not after Blank onsets, and the image identity is decoded from the 400 ms after onset (0.576, chance 0.083)
    and not from the 400 ms before (0.089). No session is deposited twice. All 11 sessions the paper's code lists
    are present, with a twelfth (sub-619293) that it does not list.
- kind: methods_unavailable
  statement: The Methods select units by isi_violations, amplitude_cutoff and presence_ratio. The unit counts (64
    +- 25, 1920 in all) and the across-neuron slope (1.048) match only when units not labelled good are also dropped,
    as AllenSDK does by default (filter_by_validity). Question for the authors, were the units those of AllenSDK's
    default units table? This attempt assumed so for every claim on the Allen data.
- kind: methods_unavailable
  statement: 'The paper excludes 3 of 26 Functional Connectivity sessions for truncated movies or no V1 units, without
    naming them. In dandiset 000022 no session has an incomplete repeat of natural movie one and 2 have no V1 quality
    units. The paper''s code names the third: it skips sessions whose movie one presentations AllenSDK marks invalid
    (extract_natural_movie_neuropixels.m lines 19 and 101), which is sub-769319621, whose movie block overlaps an
    invalid_times interval tagged stimulus and has repeats up to 30.72 s long. The Methods'' word truncated does
    not describe this.'
