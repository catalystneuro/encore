- claim: figs2-behavioral-state
  outcome: reproduced
  notebook: reproduce_kim_2025_allen.ipynb
  output: claim:figs2-behavioral-state
  notes: Moving trials (trial mean speed >= 1 cm/s, 44.6% of trials) give lower across-neuron slopes than
    stationary ones (medians 0.999 against 1.067, two-sided Mann-Whitney p = 1.5e-303; 3550 and 3264
    fits). Over the 25 included sessions with eye tracking, pupil tertiles pooled over sessions (code)
    give medians 1.077, 1.053 and 1.039, the largest tertile lowest, Kruskal-Wallis p = 2e-46; per-session
    tertiles give 1.075, 1.053 and 1.043, p = 3e-42. All state medians lie in 0.9 to 1.1. Five included
    sessions have no eye tracking and 10.5% of trials in the others have no pupil value. The pupil area
    (processing/filtered_gaze_mapping/pupil_area) is labelled Pixels ^ 2 but ranges from 0.0002 to 0.012,
    which cannot be pixels; the tertiles do not depend on the scale.
  deviations:
  - Pupil area is the blink-filtered series of the DANDI files, averaged over the 250 ms window; the
    Methods say trial mean pupil area without naming the series. Stimulus and state cells with fewer
    than 2 trials are dropped.
- claim: figs3-higher-visual-areas
  outcome: reproduced
  notebook: reproduce_kim_2025_allen.ipynb
  output: claim:figs3-higher-visual-areas
  measured:
  - 24
  - 28
  - 24
  - 20
  - 26
  notes: Over all 32 sessions, sessions with at least two quality units are LM 24, RL 28, AL 24, PM 20 and
