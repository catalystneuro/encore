- claim: figs2-behavioral-state
  outcome: reproduced
  notebook: reproduce_kim_2025_allen.ipynb
  output: claim:figs2-behavioral-state
  notes: With the good units, moving trials (trial mean speed >= 1 cm/s, 44.6% of trials) give lower across-neuron
    slopes than stationary ones (medians 0.991 against 1.061, two-sided Mann-Whitney p = 2e-307; 3550 and 3264 fits).
    Over the 25 included sessions with eye tracking, pupil tertiles pooled over sessions (code) give medians 1.070,
    1.046 and 1.029, the largest tertile lowest, Kruskal-Wallis p = 1e-48; per-session tertiles give 1.067, 1.046
    and 1.034, p = 5e-42. All state medians lie in 0.9 to 1.1. With the Methods' criteria alone the same holds (moving
    0.999 against stationary 1.067, p = 1.5e-303; tertiles 1.077, 1.053, 1.039, p = 2e-46). Five included sessions
    have no eye tracking and 10.5% of trials in the others have no pupil value. The pupil area (processing/filtered_gaze_mapping/pupil_area)
    is labelled Pixels ^ 2 but ranges from 0.0002 to 0.012, which cannot be pixels; the tertiles do not depend on
    the scale.
  deviations:
  - Pupil area is the blink-filtered series of the DANDI files, averaged over the 250 ms window; the Methods say
    trial mean pupil area without naming the series. Stimulus and state cells with fewer than 2 trials are dropped.
- claim: figs3-higher-visual-areas
  outcome: reproduced
  notebook: reproduce_kim_2025_allen.ipynb
  output: claim:figs3-higher-visual-areas
  measured:
  - 24
  - 28
  - 24
  - 20
  - 26
  notes: With the good units, over all 32 sessions, sessions with at least two units are LM 24, RL 28, AL 24, PM
    20 and AM 26, all within tolerance; median slopes 1.056, 1.047, 1.045, 1.002 and 1.024, all within 0.9 to 1.1.
    The Methods' criteria alone give the same counts and medians 1.058, 1.061, 1.046, 1.004 and 1.026. Over the
    30 included sessions, 22, 26, 23, 18 and 25 sessions, medians within 0.9 to 1.1 under both readings. Over all
    32 sessions RL has one session more than the paper's 27. With the Methods' area-specific exclusion ("2 sessions
    for V1 and 1 session for RL" with more than 10% of trials silent), applied over all 32 sessions as a variant,
    the counts are 24, 27, 24, 20 and 26, the paper's exactly, under both unit readings, with medians 1.056, 1.044,
    1.045, 1.002 and 1.024 (good units). This suggests the paper used all 32 sessions with its area-specific exclusion;
    the outcome is the same under all three session sets.
  deviations:
  - A session counts for an area when it has at least two units there, the fewest a line can be fitted to; with
    one unit or more the counts are the same. The main count uses all 32 sessions without the area-specific exclusion
