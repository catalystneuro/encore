findings:
- kind: data_missing
  statement: The dandiset holds only the Di-8-ANEPPS experiments of Fig. 2C and D (11 cells) and Fig.
    4D (8 cells). The FluoVolt experiments (Fig. 2A, 3, 4A), the Di-8-ANEPPS 1 us escalation (Fig. 1,
    2B, 3, 4B, 4C, 7B top), the Gd3+ experiments (Fig. 5), the Fluo-4 calcium imaging (Fig. 6) and the
    two-pulse experiments (Fig. 7) are not in it; 25 of 30 claims cannot be tested.
- kind: metadata_insufficient
  statement: The files give pulse amplitudes in volts and no field strengths, while the paper reports
    every result in V/cm from a Sim4Life model; the mapping (50, 70 and 250 V to 150, 230 and 1000 V/cm;
    100 to 800 V to 357 to 3320 V/cm) had to be inferred by order from the paper's figure labels. A 450
    V set (2025-05-06 c1) has no counterpart in Fig. 4D.
- kind: metadata_error
  statement: The files state an electrode distance of 1.00 mm; the paper (section 2.2) states a 1.6 mm
    spacing.
- kind: metadata_error
  statement: Every file carries the same general description, of the 2025-05-01 protocol (50, 70 or 250
    V, 13 recordings), including the 2025-05-06 files that hold 0.3 us pulses of 100 to 800 V. The description
    also calls each recording a single pulse, while each set holds 60 pulsed images, and the dandiset's
    title and description mention only the post-electroporation experiment.
- kind: metadata_error
  statement: StrobeImaging starting_time holds Unix times (1746136603 to 1746572254 s), not seconds from
    session_start_time.
- kind: metadata_insufficient
  statement: No pixel size is given, so cell radii (needed for IMPC in Eq. 1) are known only in pixels.
- kind: selection_undocumented
  statement: Most fields of view hold several cells, and the files do not say which cell was analysed.
    The dataset holds 11 cells for the Fig. 2C and D protocol where the paper reports n = 8, and 8 cells
    for Fig. 4D where it reports n = 10, without saying which cells form the paper's groups.
- kind: other
  statement: In 174 of 232 cell recordings the first image is about 22% darker over the whole frame than
    the next 39 (median ratio 0.782), which biases F0, defined as the mean of the first 40 images.
- kind: methods_unavailable
  statement: Question for the paper's authors. Was a background (or the camera offset) subtracted from
    the potentiometric images before computing dF? Section 2.3 describes none; section 2.4 subtracts a
    cell-free region for Fluo-4. Cell-free background is about 52% of the membrane intensity in these
    files, so dF without subtraction is about 40% of dF with it. This attempt assumed subtraction of a
    cell-free annulus; the outcome of fig2cd-nonelectroporating-stable (not reproduced with subtraction,
    reproduced without) and of fig2c-1000-within-set (reproduced only with subtraction) depends on the
    answer.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which cell in each field of view, and which 8 of the 11
    cells of the 2025-05-01 session, form Fig. 2C and D, and are 10 cells of Fig. 4D in the dandiset (it
    holds 8)? This attempt used the cell nearest the image centre and every cell in the dandiset.
- kind: paper_inconsistency
  statement: Eq. (2) as printed, with the parameters of section 2.3, gives a 1.3% IMP reduction for a
    10-fold increase of membrane conductivity, where section 3.5 states ~2% (the 100-fold value, 11.9%,
    matches the stated 12%).
