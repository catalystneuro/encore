- claim: fig2cd-nonelectroporating-stable
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_semenov_2026.ipynb
  output: claim:fig2cd-nonelectroporating-stable
  notes: Paired t-tests of each pre-exposure 150 or 230 V/cm set against the first set of its field, per
    pole, n = 11 cells (10 for the fourth 230 V/cm set). With the annulus background (adopted), 1 of 12
    comparisons has p < 0.05, the third 150 V/cm set at the cathodic pole, 10.2% against 15.4% (p = 0.047).
    With the background recording subtracted, 2 of 12 (smallest p 0.034). Without subtraction none (smallest
    p 0.057), which would reproduce the claim. F0 from images 2 to 40 gives 2 of 12 under both. At the
    cathodic pole every later pre-exposure 150 V/cm set is 26 to 34% below the first (annulus), the 230
    V/cm sets -8.5 to 8.1%. Within sets, the first and last 10 PEF images differ by under 1% (p 0.37 or
    more). The outcome rests on the background reading; the question is put to the paper's authors (findings).
    Two cells (c3, c4) deviate from the alternation order; sets are matched by their rank at each field.
  deviations:
  - Background subtraction is an assumption. Section 2.3 describes dF = 100 (F - F0)/F0 with no background
    step, section 2.4 subtracts a cell-free region for Fluo-4, and the claims file names both readings.
    The adopted reading subtracts the per-image median of a cell-free annulus 2 to 3 radii from the cell,
    because cell-free background is 52% of the trace intensity in these files (it holds the camera offset),
    subtracting it is the field's standard practice for a fluorescence ratio, and the paper's own values
    at 1000 V/cm (40 and 26.6%) are on the scale of the subtracted readings and about 2.5 times the unsubtracted
    ones. The notebook shows every reading (annulus, the cell's background recording, none).
  - The analysed cell is the one nearest the image centre of the cell's sham recording (an assumption;
    the files do not say which of the several cells in the field was analysed, and section 2.2 centres
    the field of view between the electrodes).
  - The 6-pixel-wide perimeter trace is found automatically as the outer ridge of the membrane staining
    in the sham recording's baseline image and moved by the measured drift (at most 2 pixels), where the
    paper draws it by hand in MetaMorph (section 2.3); the 360 points are spaced by 1 degree of angle,
    not by equal arc length.
  - The cathodic pole angle is the median over the session's cells of the phase of a cosine fitted to
    the polarization profile at non-electroporating fields (83.0 degrees for 1 us, 82.1 degrees for 0.3
    us, close to straight up, as in Fig. 1); the paper places the poles by the field direction.
  - Field strengths are the paper's labels (Fig. 2C, Fig. 4D axis labels) matched by order to the pulse
    amplitudes in volts that the files give.
  - 11 cells are used where the paper reports n = 8; the dataset does not say which 8.
  - The fifth pre-exposure 150 V/cm set exists in one cell only and is not tested.
