- claim: fig2d-lasting-reduction
  outcome: partially_reproduced
  notebook: reproduce_semenov_2026.ipynb
  output: claim:fig2d-lasting-reduction
  measured: 27.48
  notes: Measured is the mean reduction over the four post-exposure sets of both poles' |dF| averaged
    (readings b and i), annulus background. Per set 33.2, 29.2, 25.7 and 21.8% (p = 0.010, 0.021, 0.024,
    0.149). Without subtraction 31.3, 29.7, 27.9 and 23.8% (mean 28.1%). With the paper's F0 no background,
    pole and size reading gives a set whose reduction is within 18 to 22% with p < 0.05. At single poles
    the drop is at the cathodic pole for 150 V/cm (53.4 and 40.8%, p = 0.009 and 0.022) and at the anodic
    pole for 230 V/cm (29.9 and 28.4%). The criterion's condition that no pre-exposure set differs fails
    under the annulus reading (p = 0.047) and holds without subtraction. The reduction is significant
    under every reading and larger than about 20%, which is the partial case the criterion names; the
    outcome is the same under both background readings. With F0 from images 2 to 40 and the annulus, one
    set is at 21.2% and no pre-exposure set differs, a variant not following section 2.3's F0.
