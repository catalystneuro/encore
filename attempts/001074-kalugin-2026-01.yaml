findings:
- kind: metadata_insufficient
  statement: No file gives the sensor expressed by each cell, though the identities were made by
    post hoc dipping and every analysis of the paper rests on them. No file gives well, wash-on,
    KCl, optogenetic or injection times, the ligand of each well, the brain region of a slice or
    the injections of a mouse; there is no acquisition or stimulus data. Only the in vitro dipping
    of the ten revision probes could be labelled, from the paper's code.
- kind: metadata_error
  statement: Every file states an imaging rate of 30 Hz and timestamps from 0 in steps of 1/30 s,
    the same session start (2023-01-01T12:30), the indicator OGB-1 and the location "brain". The
    Methods give about 0.5 volumes per second (31 per minute in the code for the 2025 recordings, 52
    per minute for some 2023 ones), the sensors are GRAB sensors, and the dipping recordings are of
    HEK cells in a hydrogel, not of a mouse brain. The session dates are only in the subject names.
- kind: format_error
  statement: The 3D image masks are stored scrambled. Each is the Fortran-order flattening of the
    (x, y, z) volume written into a C-order array of the same shape, so read as stored every mask
    spans the full width of the volume with equal weight in every plane; reordered with
    order="F" it is a compact cell.
- kind: metadata_error
  statement: 67 files belong to a subject named "0" with session names that carry no context. 16
    of them repeat named files of 20230922-PL28, 20230829-SL1PL56 and 220408-PK27PL20; the other 51
    cannot be placed.
- kind: metadata_error
  statement: The six files of sub-250918-SL1ZS5-slice and of sub-250918-SL1ZS5-wells001 are
    identical in shape and values, so one recording of that probe is deposited under both names and
    the other is missing.
- kind: metadata_error
  statement: The matched-file suffixes of probe 20230922-PL28 do not fit its pairs. wells201 holds a
    "matched" and a "matched1" file that are copies, and the "matched" file of wells401 has 96
    cells, the count of wells001's "matched3", where wells001's "matched" has 82.
- kind: other
  statement: The matched pair of probe 251119-ZS16 has 143 cells in wells001 and 142 in wells101;
    the paper's code deletes row 53 of the identification file (morse_figs3_rev cell 6), which
    nothing in the files records.
- kind: metadata_insufficient
  statement: The accepted and rejected columns of every PlaneSegmentation are all false, so they
    carry no curation information, and the stage of each file (mr-raw, mr-m-raw, refit, matched<k>)
    is described only by the paper's code README.
- kind: other
  statement: The mask volumes have 15 to 26 planes, where the Methods describe 30 planes per volume
    (about 270 um); the files do not say whether planes were cropped.
- kind: data_missing
  statement: The deformation fields, raw two-photon imaging, Cellpose probability maps, fiber
    photometry, ELISA and mass spectrometry tables, choroid plexus imaging and histology are not
    deposited. The paper states that raw imaging and photometry are available on request; 13 claims
    cannot be tested for this reason.
- kind: methods_unavailable
  statement: Questions for the authors. (1) Sensor identity. The Methods' clustering without the
    code's hand corrections (morse_figs3_rev cells 73-78) gives 382 or 559 labelled cells against
    506; which corrections were made and why? (2) Dose-response normalization. The Methods say
    "corrected with an exponentially decaying background fit and then peak-normalized"; the code
    subtracts a baseline well and divides by a peak well, after per-cell background fits over
    hand-set windows (cells 285-293, 338-339). Which windows and wells were used, and is the noise
    cut of cells 343 and 365 part of the published fits? The EC50s fitted here depend strongly on
    this (median log10 distance from Table 1 0.12 to 1.49 across readings). (3) Is the deposited
