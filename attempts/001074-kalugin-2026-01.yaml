    not tested.
  deviations:
  - Reading (a) of the criterion cannot be run; only reading (b) is tested.
  - Assumed that the gel thickness is the imaged z range of each recording (16 to 26 planes); the claims file and
    the paper do not say how the thickness is bounded.
  - Depth uses the masks reordered from their scrambled storage (see findings).
  - Probes are pooled over all contexts (dipping, slice and in vivo recordings); Figure 1C shows one dipping probe.
- claim: fig1g-sensor-yield
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_kalugin_2026.ipynb
  output: claim:fig1g-sensor-yield
  measured:
  - 559
  - 9.0
  - 8.0
  - 9.0
  - 6.82
  notes: 'Reading (b), pooled clustering plus a per-probe pass, gives 559 labelled cells (expected 455 to 557),
    median 9 sensors per probe, 25th percentile 8, 75th 9, and 6.82 cells per sensor per probe (expected 5.42 to
    6.62). Reading (a), pooled only, gives 384 cells, median 8.5, 8 and 9, and 4.74. Sensors per probe are 5, 8,
    9, 10, 5, 9, 10, 9, 8, 9 against the code''s 5, 8, 9, 10, 6, 9, 10, 9, 9, 9. Variants (b and a): the code''s
    30-frame window 550 and 383 cells (6.71 and 4.73); without the peak rule 606 and 402 (7.21 and 4.90); a whole-well
    boxcar 539 and 372 (6.57 and 4.59). The sensor counts match; the cell counts do not under any variant. The run
    of the first round gave 382 cells in reading (a); this run gives 384, with the same code. The claims file''s
    header gives the derivative window as 30 frames, the Methods 1 minute (31 frames); this is asked of a reader
    in questions/001074.yaml.'
  deviations:
  - The dandiset gives no sensor labels. Labels are made from the identification traces by the Methods' procedure
    (Quantification and statistical analysis, paragraphs 2-3) with these choices, assumed where the Methods do not
    fix them. The jump artefact is an exponential with the Methods' 30 s decay scaled by the jump measured as in
    morse_figs3_rev cell 23. The exponential background is fitted only when two wells precede activation, with its
    decay bounded by the fitted segment. The ligand administration time course used to match clusters is a boxcar
    over the first minute of each well (a whole-well boxcar is shown as a variant), and a match is kept only when
    the cluster's mean derivative also peaks in that ligand's well. This peak rule is the author's own, not in the
    Methods; it leaves 47 cells unlabelled in reading (b) and 18 in reading (a), and results without it are shown.
  - The code's hand corrections of clusters (morse_figs3_rev cells 73-78) are not repeated, so the labelled cells
    are not the paper's 506.
  - The time base is the code's 31 frames per minute (93 per well); the files state 30 Hz.
- claim: fig1g-all-ten-sensors-respond
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_kalugin_2026.ipynb
  output: claim:fig1g-all-ten-sensors-respond
  notes: All ten sensors carry labels, on 5 to 10 probes each. As the criterion is written, the mean peak-normalized
    trace is highest in the sensor's own or partner's well for 2 of 10 sensors by the per-well maximum (OXT, ATP)
    and 3 of 10 by the per-well mean (adding ACh), under both labelling readings. Allowing the well after the ligand's,
    as the code does for AVP, NE and CCK (cell 248), 7 of 10. For CCK and MT the maximum is in the PBS well, for
    NE, DA and ACh in the ATP well. Responses persist into later wells; measured as the rise of each well's plateau
    over the previous well's, every sensor rises most in its own ligand's well (10 of 10, both readings). Whether
    Figure 1G means the highest level or the onset is asked of a reader in questions/001074.yaml; the outcome follows
    the criterion as written. Changed from partially_reproduced after the verifier's round 1.
  deviations:
  - Labels as in fig1g-sensor-yield, reading (b).
  - The criterion's background correction is the one of fig1g-sensor-yield.
  - Variant added in revision, the largest rise of the well plateau (mean of the third minute) of the mean trace
    over the previous well's plateau, the first well over the mean of its first 10 frames.
- claim: fig1h-crosstalk-pairs
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_kalugin_2026.ipynb
  output: claim:fig1h-crosstalk-pairs
  notes: With the Methods' 1-minute window and the reading (b) labels, DA-NE has the largest correlation (0.77);
    AVP-OXT is 0.16, rank 12 of 45, below 5-HT-DA (0.46), DA-ACh (0.45), 5-HT-NE (0.37) and NE-ACh (0.33). With
