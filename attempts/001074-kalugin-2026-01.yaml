- claim: link-revision-well-order
  outcome: reproduced
  notebook: reproduce_kalugin_2026.ipynb
  output: claim:link-revision-well-order
  notes: 'Recordings are matched by date and probe in the subject names (for example sub-251003-PL65-wells001).
    All ten identification recordings have 1023 frames (11 wells of 93) and all ten dose recordings 1395 (15 wells).
    86% of 829 cells rise most steeply within the first minute of a well, against 23%, 11% and 3% with the onsets
    shifted by 15, 31 and 46 frames. In the dose recording, 79% of the 559 labelled cells rise more in the block
    of their own mixture; per sensor 0.73 to 0.92, except the DA sensor cells (41%), which also respond to the NE
    of the other block. Label check (added in revision): under both labelling readings the plateau of every sensor''s
    mean identification trace rises most in its own ligand''s well (10 of 10; 0.47 to 0.74 of the peak-normalized
    range in reading b). This is not independent of the labels, which are made from the time of each cell''s steepest
    rise.'
  deviations:
  - The link claim and its criterion were written by the author during the analysis, after the frame counts were
    seen; its thresholds (more than half) are the author's.
- claim: fig1c-cells-per-gel
  outcome: reproduced
  assumed: true
  notebook: reproduce_kalugin_2026.ipynb
  output: claim:fig1c-cells-per-gel
  measured:
  - 21
  - 205
  notes: Reading (b), curated masks per recording (mr-raw files), over 59 recordings of 43 probes after removing
    duplicates. Masks per recording range from 21 to 205 (median 128; given as measured), and 38 of 43 probes (0.88)
    have a mean count in 90 to 220. With the further merged mr-m-raw masks, 31 of 38 probes. In each of the five
    revision identification recordings with an mr-raw file, mask centres fall in the top (5 to 21 cells), middle
    (44 to 88) and bottom (27 to 67) thirds of the imaged z range, and so do the matched masks of the dose recordings
