- claim: figs3e-tau-on-under-one-minute
  outcome: reproduced
  assumed: true
  notebook: reproduce_kalugin_2026.ipynb
  output: claim:figs3e-tau-on-under-one-minute
  notes: 'Median tau-on under 60 s for 10 of 10 sensors on the normalized dF/F0 (28.6 to 53.7 s) and 8 of 10 on
    the Eq. 8 concentration (34.4 to 58.9 s for those; AVP 74.2 s and 5-HT 62.3 s). Both readings meet at least
    8 of 10, so the outcome is the one both give. The outcome rests on the labelling: with the reading (a) labels
    the concentration fits give 7 of 10 (MT 63.6 s), so the two readings of the criterion would differ there. With
    the EC50s fitted in reading (i) of table1-ec50-on-target in place of Table 1''s, 8 and 7 of 10 (reading b labels),
    10 and 8 (reading a). Fixing xinf to the median of frames 47-78, as the code does, underestimates long time
    constants (a synthetic 40-frame tau is fitted as 24.7); with xinf fitted, 9 and 6 (b) and 8 and 6 (a). The outcome
    is marginal: the concentration count is exactly at the threshold (8 of 10), and each alternative (the reading
    (a) labels, the fitted EC50s, xinf fitted) gives a split between the criterion''s two readings, so it holds
    only under the main choices. The "most signals plateau within 1 minute" part of the statement is not tested
    by the criterion.'
  deviations:
  - The well and the concentration conversion use the claims file's CONSTANTS (Table 1 EC50s, the code's F), since
    the EC50s fitted here do not reproduce Table 1.
  - Labels as in fig1g-sensor-yield, reading (b), assumed; reading (a) shown. Dose traces normalized as in reading
    (i) of table1-ec50-on-target.
  - tau is fitted by least squares over a grid and a bounded search; the code uses curve_fit.
