- claim: fig1g-sensor-yield
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_kalugin_2026.ipynb
  output: claim:fig1g-sensor-yield
  measured:
  - 559
  - 9.0
  - 8.0
  - 9.0
  - 6.82
  notes: Reading (b), pooled clustering plus a per-probe pass, gives 559 labelled cells (expected
    455 to 557), median 9 sensors per probe, 25th percentile 8, 75th 9, and 6.82 cells per sensor
    per probe (expected 5.42 to 6.62). Reading (a), pooled only, gives 382 cells, median 8.5, 8 and
    9, and 4.72. Sensors per probe are 5, 8, 9, 10, 5, 9, 10, 9, 8, 9 against the code's 5, 8, 9,
    10, 6, 9, 10, 9, 9, 9. The code's 30-frame derivative window changes the counts by at most 8
    cells. The sensor counts match; the cell counts do not.
  deviations:
  - The dandiset gives no sensor labels. Labels are made from the identification traces by the
    Methods' procedure (Quantification and statistical analysis, paragraphs 2-3) with these
    choices, assumed where the Methods do not fix them. The jump artefact is an exponential with
    the Methods' 30 s decay scaled by the jump measured as in morse_figs3_rev cell 23. The
    exponential background is fitted only when two wells precede activation, with its decay bounded
    by the fitted segment. The ligand administration time course used to match clusters is a boxcar
    over the first minute of each well, and a match is kept only when the cluster's mean derivative
    also peaks in that ligand's well.
  - The code's hand corrections of clusters (morse_figs3_rev cells 73-78) are not repeated, so the
    labelled cells are not the paper's 506.
  - The time base is the code's 31 frames per minute (93 per well); the files state 30 Hz.
