- claim: link-revision-well-order
  outcome: reproduced
  notebook: reproduce_kalugin_2026.ipynb
  output: claim:link-revision-well-order
  notes: Recordings are matched by date and probe in the subject names (for example
    sub-251003-PL65-wells001). All ten identification recordings have 1023 frames (11 wells of 93)
    and all ten dose recordings 1395 (15 wells). 86% of 829 cells rise most steeply within the first
    minute of a well, against 23%, 11% and 3% with the onsets shifted by 15, 31 and 46 frames. In
    the dose recording, 79% of the 559 labelled cells rise more in the block of their own mixture;
    for the six sensors without crosstalk the fractions are 0.73 to 0.85. The DA sensor cells do so
    in 41%, since they also respond to the NE of the other block.
  deviations:
  - The link claim and its criterion were written by the author during the analysis, after the
    frame counts were seen; its thresholds (more than half) are the author's.
