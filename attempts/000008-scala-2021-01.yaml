- claim: stimulus-protocol
  outcome: partially_reproduced
  notebook: scala_2021_ephys.ipynb
  output: claim:stimulus-protocol
  notes: Every step lasts 600 ms (samples 2,500 to 17,500 at 25 kHz) and every series rises in 20 pA steps.
    1,183 cells (89.1%) start at -200 pA, 90 at -100 pA and the rest between -320 and -80 pA; 112 cells go
    above 1,380 pA (87 to 1,480, one to 1,780). 89.0% conform on the steps, between the criterion's 80% and
    95%. The intervals between pulses cannot be tested, as no series has a start time, and no file holds a
    second series (0 cells), so the repeated stimulation is not in the dandiset.
  deviations:
  - The interval part of the criterion could not be applied; conformance is judged on the steps alone.
- claim: soma-depth-count
  outcome: reproduced
  notebook: scala_2021_ephys.ipynb
  output: claim:soma-depth-count
  measured: 1283
  notes: 1,283 cells have a soma depth, in the field cortical_thickness_4x (4x image units), which the data
    check shows to be a depth (its ratio to cortical_thickness_um lies between 0.031 and 0.977 and gives the
    files' inferred layer for 1,264 of 1,283 cells) and the link shows to be the table's 4x soma depth. The
    field soma_depth_um is present in 43 files and empty in all. The cell missing from the dandiset has a
    depth, so 1,283 is the count the criterion accepts (the table has 1,284).
  deviations:
  - The depth is read from a field whose name says cortical thickness; the identification rests on the
    values and on the link to the paper's table.
