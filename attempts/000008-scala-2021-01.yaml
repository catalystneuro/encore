- claim: fig5c-vip-mybpc1-rebound
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: scala_2021_transcriptomics.ipynb
  output: claim:fig5c-vip-mybpc1-rebound
  notes: The two readings disagree. 34 Vip Mybpc1_2 cells (22 mice), rebound 0.3 to 19.8 mV, median 11.31 mV
    against 2.26 mV for Vip Sncg. Reading (a), rebound rises with the distance to the nearest Vip Sncg
