  measured: -0.012
  notes: Spearman correlation between hold time and log cDNA yield over the 1,319 dandiset cells with both
    values, -0.012 (p = 0.65); over all 1,320 cells of the table, also -0.012. Neither value is in the
    dandiset's files.
findings:
- kind: other
  statement: Three pairs of files hold identical voltage recordings although each pair is two different cells
    of one mouse, with different slices, depths, read counts and in one pair different t-types
    (20190731_sample_5 and 20190731_sample_8; 20181116_sample_2 and 20181116_sample_4; 20190829_sample_2 and
    20190829_sample_6). The paper's feature table has identical values for each pair, so the duplication
    predates the deposit and the paper analysed each recording twice. Which cell each recording belongs to
    is not recorded.
- kind: other
  statement: Three files (20190128_sample_3, 20180215_sample_1, 20190222_sample_5) hold other traces than the
    ones the paper's published features were computed from; one of them has 41 sweeps. The features of
    1,320 files reproduce the published table on every feature but the rheobase, which the paper fits with
    an unseeded random procedure.
- kind: metadata_error
  statement: The field cortical_thickness_4x holds the soma depth and cortical_thickness_um the cortical
    thickness, both in 4x image units (the paper's table columns Soma depth (4x) and Cortical thickness
    (4x)). The field soma_depth_um is present in 43 files and empty in all. The paper's µm soma depths and
    cortical thicknesses, which its analyses use, are not in the dandiset.
- kind: metadata_error
  statement: Voltage series are labelled volts with conversion 1 but hold millivolts; stimulus series are
    labelled amperes but hold picoamperes.
- kind: data_missing
  statement: No series has a start time (starting_time is NaN in all 104,409 voltage series) and there are no
    timestamps, so the timing of sweeps, including the 1.3 or 1.4 s intervals the Methods give, is lost. Each
    file holds a single series of current steps, while the Methods say the series was repeated for most
    neurons.
- kind: metadata_insufficient
  statement: The five cells with a t-type that the paper excludes (four with excitatory RNA but inhibitory
    firing, one outside MOp) are not marked in the files; they can be identified only from the paper's
    table. The t-types and families use an older name for the ET subclass (PT).
- kind: data_missing
  statement: The hold time and cDNA yield of each cell, used in the Methods, are not in the files; they are
    in the paper's metadata table.
- kind: other
  statement: The step protocol departs from the Methods in part of the cells; 145 of 1,328 cells (10.9%) do
    not start at -200 pA (90 start at -100 pA), and 112 go above 1,380 pA, up to 1,780 pA.
- kind: other
  statement: One file (20190625_sample_13) has voltages of about +-1,025 mV in some sweeps, values outside
    any physiological range.
- kind: metadata_insufficient
  statement: One mouse has the genotype Scnn1a-Tg3-Cre/wt; Ai9/wt, which the paper does not list; the paper
    counts 27 wild-type mice where the files have 26.
- kind: paper_inconsistency
  statement: The Extended Data Fig. 4 legend gives an AP threshold of -40.18 mV for the example cell; the
    paper's own feature table and the extraction from the file give -43.18 mV. The legend also gives the sag
    time in ms where the value is in seconds.
