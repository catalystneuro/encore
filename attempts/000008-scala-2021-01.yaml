inputs:
- what: The paper's code and preprocessed data, read at a pinned commit. Code executed unchanged, the
    feature extraction (code/ephys_extractor.py, code/ephys_features.py, and the functions
    extract_spike_features and get_cell_features of code/preprocess-ephys-files.ipynb), the mapping
    functions (code/rnaseqTools.py) and the sparse reduced-rank regression (code/sparseRRR.py). Data, the
    per-cell metadata table (data/m1_patchseq_meta_data.csv; exclusions, µm soma depths, hold time, cDNA
    yield), the published feature table (data/m1_patchseq_ephys_features.csv), the exon and intron count
    tables and gene lengths, the ion channel gene list, the morphometric features and z-profiles, the
    reference cluster annotation (data/raw/allen/yao2020/cluster.annotation.csv) and the reference t-SNE
    coordinates (data/processed/rnaseq/10x-tsne-*.pickle).
  source: https://github.com/berenslab/mini-atlas at commit 3bf98a524b8e48aa8647e1b9ae8f2351d9c712c9
- what: The paper's preprocessed Allen Institute reference data (reduced-allen-data.zip, the seven MOp
    reference data sets of Yao et al. 2021 and the Tasic et al. 2018 data set, as the code reads them),
    read member by member over HTTP range requests.
  source: Zenodo record 5118962, doi:10.5281/zenodo.5118962
outcomes:
- claim: link-metadata-table
  outcome: reproduced
  notebook: scala_2021_ephys.ipynb
  output: claim:link-metadata-table
  notes: All 1,328 cells of the dandiset match a row of the paper's table by cell id; the table's one other
    cell, 20190211_sample_10 (L6 CT Gpr139), has no file. For all 1,328 cells the records agree on mouse,
    slice, genotype, sex, Cre label, targeted and inferred layer, exon, intron and intergenic reads, batch,
    genes detected, t-type confidence, the ALM/VISp mapping and age, and on t-type and family with the files'
    PT read as the paper's ET (1,279 agree in the files' spelling). The files' cortical_thickness_4x equals
    the table's soma depth in 4x units and cortical_thickness_um its cortical thickness in 4x units for all
    1,328 cells; the µm columns are not in the files. The five cells with a t-type that the table excludes
    are all in the dandiset and are not marked. Numbers are compared exactly, as floats without rounding.
- claim: link-ephys-features
  outcome: reproduced
  notebook: scala_2021_ephys.ipynb
  output: claim:link-ephys-features
  notes: Every file matches a published row; 1,320 of 1,328 cells (99.4%) agree to a relative 1e-4 on all 28
    features other than the rheobase. Three cells (20190128_sample_3, 20180215_sample_1, 20190222_sample_5)
    differ in 22 to 25 features, so their files hold other traces than those the published features were
    computed from; four differ in 5 or 6 features of the highest-firing trace (Fano factors, CVs, spike
    frequency adaptation, wildness, or the spike count), and one in the time constant only. The rheobase differs for 41 cells (-40 to 20 pA); it is
    fitted by RANSAC with no seed in the paper's code, and for 4 of the first 8 such cells one of seeds 0 to 9
    gives the published value.
  deviations:
  - The rheobase is computed with the global numpy seed set to 0 before each cell; the paper's code sets no
    seed.
- claim: cohort-cells-mice
  outcome: reproduced
  notebook: scala_2021_ephys.ipynb
  output: claim:cohort-cells-mice
  measured:
