- claim: ed8-leiden-entropy
  outcome: not_reproduced
  notebook: scala_2021_ephys.ipynb
  output: claim:ed8-leiden-entropy
  notes: Leiden at resolution 2 gives 15 to 20 clusters per run. Across 35 t-types the Spearman correlation
