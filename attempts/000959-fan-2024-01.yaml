- claim: figs1e-eyes-more-than-face
  outcome: reproduced
  notebook: reproduce_fan_2024.ipynb
  output: claim:figs1e-eyes-more-than-face
  notes: Under both day counts (a, total; b, mean per run) and both event sets (M1-only and mutual,
    M1-only), Eyes fixations exceed non-eye Face fixations for every area, corrected p from 1.1e-07 to
    3.1e-05, all below 1e-4. Median day totals are 382 to 408 Eyes and 134 to 179 non-eye Face
    fixations.
  deviations:
  - The events counted are not fixed by the claims file. M1's fixations in the ROI including the M1
    side of mutual events are the main set, following the Methods' "total number of gaze fixations
    ... of the stimulated monkey" (STAR Methods, Frequency of microstimulations and regions of
    interest); M1-only events are shown and give the same outcome.
  - The non-eye Face is the files' m1_neface table, which includes the Mouth, with mutual_face and
    mutual_mouth for mutual events (mutual_face is the face outside the Eyes and the Mouth; the
    notebook shows that m1_wholeface equals m1_eye plus m1_neface and that mutual_wholeface equals
    mutual_eye plus mutual_face plus mutual_mouth).
