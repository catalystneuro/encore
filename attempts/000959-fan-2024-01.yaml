- claim: fig1e-stim-counts-comparable
  outcome: reproduced
  notebook: reproduce_fan_2024.ipynb
  output: claim:fig1e-stim-counts-comparable
  notes: Over the 12 rank-sum tests for stimulations and the 12 for shams, the smallest
    FDR-corrected p is 0.908 and 0.942, so all exceed 0.90 as reported (smallest uncorrected 0.509
    and 0.187). Kept trials per day average 116 to 125 per type and area.
