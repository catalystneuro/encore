findings:
- kind: other
  statement: The dataset holds 6.0 control (Dot) runs per day on average for monkey L (4 to 8; 14 of
    45 days have 8), where the paper reports 5 on average, and 14 social runs on every Eyes day of
    monkey T, where the paper reports 15 on average (14 to 15). Either some runs were not analysed in
    the paper or the counts in the paper are off; the files do not say which runs the paper used. On
    the 14 monkey L days with 8 control runs, the runs are numbered 1 to 8, each 295.8 to 296.9 s
    long with 9 to 32 kept trials, so nothing in the files marks any of them as extra.
- kind: code_mismatch
  statement: The Methods give the fixation counts of Figure S1E as the total per day, and the paper's
    code takes the mean per session. Because a day has about twice as many social runs as control
    runs, the Eyes against RDM comparison is significant for every area with day totals (corrected p
    0.000025 to 0.00041) and comparable with means per run (0.40 to 0.52), as the paper reports.
- kind: metadata_insufficient
  statement: Neither the files nor the paper give the padding of the Eyes ROI (the Methods text has
    the number missing), nor how fixation events were assigned to ROIs. 6% of the M1 Eyes events of
    social runs and 11% of those of Dot runs have a mean gaze position outside the Eyes rectangle of
    their file, and 3% and 10% of whole Face events outside the Face rectangle. The description of
    `laterality_label` does not name its reference; it matches the centre of `roi_m2_face` for
    99.98% of M1 events.
- kind: metadata_insufficient
  statement: The Dot (control) runs do not hold `roi_m2_face`, the reference of their hemifield
    split, nor say that their `roi_m1_eyes` is the RDM stimulus; both are inferred, the first from
    the same day's social runs and the second from the Methods.
- kind: methods_unavailable
  statement: Question for the paper's authors. For the inter-looking interval, does a whole Face
    event that starts on the trial sample itself (91 trials; likely the triggering fixation as the
    offline detection found it) count as the look back with latency 0? Counting it changes the OFC
    day-level p from 0.044 to 0.058. And is the inter-looking interval taken over M1-only events or
    M1-only and mutual events, as the Methods say (OFC p 0.0022 against 0.044)?
- kind: methods_unavailable
  statement: Question for the paper's authors. Is M2's reciprocation latency measured from the start
    of M1's look at M2 or from the trial time? Measured from M1's look, dmPFC gives p = 0.044; from
    the trial, no area is below 0.46. And how is the p-value of the Eyes against Mouth bootstrap
    computed (one- or two-sided, and which tail)?
- kind: other
  statement: Trial times fall inside an offline M1 event in the triggering ROI on 71% of social Eyes
    trials and 62% of Dot Eyes trials, against 5 to 20% for times shifted by 0.5 to 2 s; this is
    consistent with a shared clock of trials and events, and shows that about 30% of online
    triggers do not coincide with an offline fixation in the ROI (65 of 954 social Eyes runs are
    below 50%).
- kind: metadata_insufficient
  statement: The fixation tables are named alike but cut the face differently. m1_neface (and
    m2_neface) is the face outside the Eyes and includes the Mouth (all 23,641 m1_mouth events are
    in it), while mutual_face is the face outside both the Eyes and the Mouth (mutual_wholeface
    equals mutual_eye plus mutual_face plus mutual_mouth). The table descriptions do not say so.
- kind: other
  statement: The files hold no saccade events. Run on M1's gaze as the paper's code calls it, the
    Otero-Millan et al. (2014) detector finds 386 saccades per social run with a median duration of
    147 ms and a 95th percentile of 1,062 ms; the gaze velocity inside fixations (median about 20
    deg/s in one run) is above the detector's 5 deg/s saccade limit for about 95% of samples, so many
    detected saccades span several fixations. In 202 of 1,179 social runs, the MATLAB code's merge of
    overlapping saccades yields unequal numbers of starts and ends, where that code would stop with
    an error. Whether the paper's gaze was filtered before detection is not stated.
