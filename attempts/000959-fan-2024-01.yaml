  notebook: reproduce_fan_2024.ipynb
  output: claim:figs1e-eyes-vs-rdm-comparable
  notes: Under reading (a), the day's total, which the criterion judges, Eyes fixations exceed RDM
    fixations for every area (corrected p 0.00036, 0.000025 and 0.00041 for OFC, dmPFC and ACCg;
