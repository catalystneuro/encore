- claim: figs4a-causal-strength-no-stim-effect
  outcome: blocked
  blocked_by: too_large
  notebook: reproduce_fan_2024.ipynb
  output: claim:figs4a-causal-strength-no-stim-effect
  notes: The relative causal strength needs the causal decomposition of Yang, Peng and Huang (2018),
    built on ensemble empirical mode decomposition. One EEMD of one 150-bin series with 100
    ensembles takes about 1.0 s here (PyEMD) and yields 7 IMFs; with one decomposition of each
    series and one per IMF of each series with that IMF removed, the claims file's reading (a), 1,000
    ensembles, needs about 160 s per trial, or about 870 CPU hours for the 19,474 social trials (about 90
    hours at a tenth of the ensembles). This is beyond the notebook limit and the run. The trials,
    distances and epochs the analysis would use are all in the dataset.
