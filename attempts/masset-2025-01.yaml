- claim: fig3-common-value-fit
  outcome: reproduced
  assumed: true
  notebook: vr_population.ipynb
  output: claim:fig3-common-value-fit
  measured:
  - 0.446
  - 0.237
  notes: Mean 0.446 and s.d. 0.237 of the per-neuron discount factors under the claims' seeds (0.437
    to 0.447 and 0.231 to 0.243 over the five), within tolerance. The mean value function is convex
    under both readings (second difference positive at 66 to 68% of bins; at or below the chord at
    every interior bin). Percentiles 20, 70 and 90 are 0.220, 0.555 and 0.731 (paper 0.25, 0.56,
