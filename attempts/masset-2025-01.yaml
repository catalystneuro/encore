- claim: link-units-across-tasks
  outcome: reproduced
  notebook: cued_delay_and_cross_task.ipynb
  output: claim:link-units-across-tasks
  notes: All 101 DANDI open-loop units and all 67 Mendeley cued delay units match one distinct row each of FinalAverageArray.mat,
    0.00 to 0.32 spikes per trial apart, with the next best row 3.8 or more apart, and the matched rows carry the
    files' ML positions. The table has 78 cued delay rows (all flagged Valid.OdorNew); 11 have no unit in the Mendeley
    file (4 of mouse 3044, 4 of 3049, 1 each of 3050, 3053 and 3054; 5 at ML above 900 um). Every one of the 67
    rows with a cued delay unit also has a DANDI VR unit; 66 of these pairs were recorded on the same day. All 101
    matched VR rows are flagged Valid.VR (121 rows flagged). Matching also shows that the cued delay trials are
    aligned on the VSTIM_ON column, the odor onset.
- claim: cued-delay-neurons
  outcome: reproduced
  notebook: cued_delay_and_cross_task.ipynb
  output: claim:cued-delay-neurons
  measured:
  - 78
  - 48
  notes: The paper's table flags 78 cued delay neurons (Valid.OdorNew), within 78 +- 7.8. The Mendeley spike file
    holds 67 of them; with the other 11 taken from the table's 10 ms rates, 48 pass M3 under the claim's seed (43
    of the 67 and 5 of the 11), within 50 +- 5, and 48 to 50 over the five seeds. Exclusions 18 (held-out R2 at
    or below 0), 11 (mean cue response at or below 2 spikes/s) and 5 (ML at 900 um or more), against the paper's
    17, 11 and 4. On the spike file alone the counts are 67 and 43 (43 to 45 over the seeds), both outside tolerance;
    the outcome rests on taking the 11 undeposited neurons from the table.
  deviations:
  - Tested on the paper's Mendeley deposit, as DANDI:000251 holds no cued delay recordings.
  - The units are taken as the identified dopamine neurons; the file has no identification flag, and the link shows
    each unit is a row the paper flags Valid.OdorNew.
  - Cue responses are computed from the spike times (0.1 to 0.4 s after VSTIM_ON); the code reads precomputed per-trial
    rates (CellValuesArray.mat).
  - Fits use scipy's bounded least squares (least_squares) with the code's start points and bounds, where the code
    uses MATLAB fit; half splits are disjoint, where the code's two halves share one trial (Olfaction_Script.m,
    FirstHalf and SecondHalf).
  - The 11 cued delay neurons the spike file lacks (rows of the paper's table flagged Valid.OdorNew) are taken from
    the table, their cue responses being the mean of its 10 ms rates from 0.1 to 0.4 s after odor onset; on the
    67 linked units these match the spike counts (mean absolute difference 0.43 spikes/s per trial, median correlation
    0.987). Assumption, as the paper's 78 recorded neurons are the table's flagged rows (claim criterion, Valid.OdorNew
    variant).
  assumed: true
- claim: session-trial-counts
  outcome: partially_reproduced
  notebook: cued_delay_and_cross_task.ipynb
  output: claim:session-trial-counts
  measured:
  - 44
  - 81.9
  - 66
  - 58.8
  notes: On the paper's 78 flagged cued delay neurons (the reading adopted for cued-delay-neurons), reading (a)
    gives 44 cued delay sessions with 81.9 +- 14.3 trials and reading (b), sessions with an M3 neuron, 32 sessions
    with 82.3 trials under the claim's seed (32 to 34 over the seeds; 34 under seed plus 2000 and 33 under plus
    3000 are within 36 +- 3.6). VR, from DANDI, 66 sessions with 58.8 +- 19.5 trials (reading a) or 62 with 59.2
    (b), within tolerance. The cued delay session count is outside tolerance under both readings at the claim's
    seed; the other counts and both trial means hold. On the deposited spike file alone, reading (a) gives 39 cued
    delay sessions with 81.4 trials, within tolerance; the 11 neurons it lacks add 5 sessions (m3049 s57, s59, s69,
    m3050 s71, m3053 s64). The VR files hold only the open-loop trials of the standard track and the cued delay
    file only the four odor trial types, so the two trial readings give the same counts. Sessions are a mouse and
    a start time, or for the table a mouse and session number (39 either way for the deposited units).
  deviations:
  - The cued delay half of the claim is tested on the Mendeley deposit (data with_inputs).
  - The 11 cued delay neurons the spike file lacks (rows of the paper's table flagged Valid.OdorNew) are taken from
    the table, their cue responses being the mean of its 10 ms rates from 0.1 to 0.4 s after odor onset; on the
    67 linked units these match the spike counts (mean absolute difference 0.43 spikes/s per trial, median correlation
    0.987). Assumption, as the paper's 78 recorded neurons are the table's flagged rows (claim criterion, Valid.OdorNew
    variant).
  assumed: true
  seed_sensitive: true
