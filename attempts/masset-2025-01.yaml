findings:
- kind: other
  about: data
  severity: critical
  statement: 78 open-loop units are deposited twice. Each SU-VR-ALL-OL file holds the same spike
    train as an SU-VR-OL file of the same subject, under another session number (for example
    sub-3014 SU-VR-ALL-OL-1 and SU-VR-OL-2), and nothing in the files or the dandiset's description
    says so. An analysis of all single-unit files counts these units twice.
- kind: metadata_error
  severity: major
  statement: sub-3015/sub-3015_ses-SU-VR-OL-4.nwb, named as an open-loop session, holds a teleport
    session; its trial table has the four teleport trial types, and its spike train is the same as
    that of SU-VR-ALL-TP-3 and SU-VR-ALL-OL-3.
- kind: data_missing
  severity: major
  statement: The dandiset holds no cued delay (odor) task recordings, although the paper's
    deposit (doi:10.17632/tc43t3s7c5.1) says its raw electrophysiological data are in
    DANDI:000251. Only the VR task single units are there; the cued delay units are in the
    Mendeley deposit.
- kind: metadata_insufficient
  severity: major
  statement: The single-unit files have no description of their units and no flag for optogenetic
    identification, and the dandiset's description does not say which units are identified
    dopamine neurons. The paper's own flags (Valid_S.mat in its Mendeley deposit) mark all 101
    open-loop units as analysed, so the units can be taken as identified only through that deposit.
- kind: other
  about: data
  severity: minor
  statement: The dandiset has no published version; it exists only as a draft (last modified
    2023-06-20), which can change and has no DOI.
- kind: other
  about: data
  severity: none
  statement: Checks that passed. All 101 open-loop units match the paper's per-neuron table trial by
    trial, and the spikes, licks and trial events share one clock (reward responses at the trial
    table's reward times, none at times shifted by 5 s). The reward comes a median 7.31 s after
    scene motion onset in the files, where the paper gives 7.35 s.
- kind: other
  about: paper
  statement: The paper's Mendeley deposit holds 67 of the 78 cued delay units of its own table
    (Valid.OdorNew); 11 are missing, 5 of them at ML above 900 um. Its HDF5 file does not say that
    the VSTIM_ON event column is the odor onset (the alignment of the paper's table and the
    reward times show that it is).
- kind: methods_unavailable
  statement: Question for the authors. How far did the common value model fits converge? The code
    caps fmincon at 2000 iterations; here few fits reach a tolerance even at 10,000 L-BFGS-B
    iterations, and the population's discount factors and their correlation with the ramp slope
    change with the cap (on 20 fits, mean 0.479 at 3000 iterations, 0.443 at 10,000; Spearman with
    the slope 0.62 and 0.72). This attempt assumes 10,000 iterations.
- kind: methods_unavailable
  statement: Question for the authors. DecodeTime, the decoder of Fig. 2k, is not in the deposit.
    Does it use every singular component of the discount matrix (Eq. 21-22) or the first 12, as the
    single-discount SVD in the code does? Both were run here and give the same outcomes.
- kind: methods_unavailable
  statement: Question for the authors. The sharing parameter of the mixing model (Methods, Mixing in
    distributed RL models) is lost from the text, and the code that adds sharing to the agents is in
    neither deposit. What value gives the reported 82, 94, 92 and 93% accuracies?
- kind: paper_inconsistency
  statement: The Methods exclude 17 neurons for negative held-out R2, 11 for a low cue response and
    4 for ML above 900 um from 78, which leaves 46, not the 50 analysed; Extended Data Fig. 3b shows
    23 non-selected neurons and Fig. 3c 13 with negative R2. On the deposited units this attempt
    finds 17, 10 (3 overlapping) and 0.
