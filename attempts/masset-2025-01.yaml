- claim: fig2k-reward-timing-decoded
  outcome: reproduced
  notebook: cued_delay_and_cross_task.ipynb
  output: claim:fig2k-reward-timing-decoded
  notes: Under every reading (all components or the first 12; the Methods' or the code's baseline) and all five
    seeds, data beat shuffle at all four delays (largest p 0.012, at 0.6 s under seed plus 2000), and in all 20
    shuffle draws. The two component readings give the same data decodings (largest difference 1.9e-6 s), as the
    singular components past the first few are too small to matter. Claim's seed, all components and the Methods'
    baseline, median distances 0.40, 0.84, 2.48 and 3.55 s against 1.15, 1.93, 3.45 and 7.13 s for the shuffle;
    p = 1.2e-11, 1.1e-34, 4.0e-18 and 8.5e-32.
  deviations:
  - The Wasserstein distance to the true delay is computed exactly (expected absolute distance); the code samples
    100,000 points.
  - The number of singular components is open (DecodeTime is not in the deposit); both readings of the criterion
    are run and give the same outcome.
  - The shuffle control draws one permutation of the neurons per decoding, as the code; every reading uses the same
    permutations, and 20 draws are made, the first being the test.
