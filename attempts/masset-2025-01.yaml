- claim: ed9g-models-agree
  outcome: partially_reproduced
  notebook: vr_reward_expectation.ipynb
  output: claim:ed9g-models-agree
  notes: Spearman rho = 0.743 (p = 3.3e-17, 91 neurons) between the per-neuron mean discount factors of the two
    models over 200 fits each under the claims' seeds, below 0.93 +- 0.093. 187 of the 200 reward expectation fits
    converged, and the constraint holds in all to within 1.1e-6. Under the four other seeds, on the first 10 bootstraps
    (20 fits), rho = 0.769 to 0.809, also below. The discount factors are strongly correlated, less than reported.
    The reward expectation model puts 17 neurons below 0.06, at the lower bound of 0.05 (its mean discount factor
    0.218, against 0.446 for the common value model).
  assumed: true
  measured: 0.743
  deviations:
  - The reward expectation model is fitted by SLSQP with analytic gradients (checked against finite differences),
    at most 2000 iterations, where the code uses fmincon (interior point); the optimiser is a substitute.
  - The folded normal density is written as a sum of two Gaussians, equal to the code's FoldedNormal.m, which overflows
    at small widths (the code sets the resulting values to 1e-4).
  - Under the four other seeds only the first 10 bootstraps are fitted (20 fits), for time.
  - Rests on the iteration cap of the common value fit (see fig3-common-value-fit).
