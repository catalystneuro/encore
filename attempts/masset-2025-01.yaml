inputs:
- what: The paper's own deposit, version 1 (2025-04-09). DA_SU_ODOR_NEW_W_OL.h5 holds the cued
    delay task single units (spike, lick and event times, mouse, ML position), which DANDI:000251
    does not hold; the cued delay claims are tested on it (data elsewhere). FinalAverageArray.mat,
    the paper's per-neuron table, is used only to pair each neuron's VR and cued delay units (link
    claim); Valid_S.mat gives the paper's flags of the neurons recorded in each task. Files are
    streamed into memory; their SHA-256 sums from the deposit's file list are in the helper. The
    deposit is in Mendeley Data, which the registry does not read, so the paper cannot be listed
    on it there.
  source: doi:10.17632/tc43t3s7c5.1
outcomes:
- claim: fig1f-multi-timescale-advantage
  outcome: blocked
  blocked_by: other
  notes: Not attempted in this run. The claim rests on simulations made by the paper's public
    code (github.com/pablotano8/multi_timescale_RL at 37f11c6), not on any recorded data. The run's
    five hours went to the 23 claims on recorded data, which needed about 70 minutes of computing
    in their final run alone. A later attempt can run the simulation code.
- claim: mixing-model-accuracy
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The sharing parameter of the mixing model (Methods eq. 32-33) is lost from the text, and
    the modification is not in the simulation repository at 37f11c6 nor in the Mendeley scripts,
    as the claims file records. No value of the parameter has a basis in the paper, so the
    reported accuracies cannot be checked. The question is in the findings.
- claim: ed2e-branching-myopic-bias
  outcome: blocked
  blocked_by: other
  notes: Not attempted in this run, for the reason given for fig1f-multi-timescale-advantage
    (a simulation, Fig_2_f_myopic_mdp.py at 37f11c6).
- claim: ed2-myopic-bias-maze-lunar
  outcome: blocked
  blocked_by: other
  notes: Not attempted in this run, for the reason given for fig1f-multi-timescale-advantage. The
    Lunar Lander part trains 10 DQNs, which would not fit the time left in any case.
- claim: link-units-across-tasks
  outcome: reproduced
  notebook: cued_delay_and_cross_task.ipynb
  output: claim:link-units-across-tasks
  notes: All 101 DANDI open-loop units and all 67 Mendeley cued delay units match one distinct row
    each of FinalAverageArray.mat, 0.00 to 0.32 spikes per trial apart, with the next best row 3.8
    or more apart, and the matched rows carry the files' ML positions. The table has 78 cued delay
    rows (all flagged Valid.OdorNew); 11 have no unit in the Mendeley file (4 of mouse 3044, 4 of
    3049, 1 each of 3050, 3053 and 3054; 5 at ML above 900 um). Every one of the 67 rows with a cued
    delay unit also has a DANDI VR unit; 66 of these pairs were recorded on the same day. All 101
    matched VR rows are flagged Valid.VR (121 rows flagged). Matching also shows that the cued delay
    trials are aligned on the VSTIM_ON column, the odor onset.
- claim: cued-delay-neurons
  outcome: not_reproduced
  notebook: cued_delay_and_cross_task.ipynb
  output: claim:cued-delay-neurons
  measured:
  - 67
  - 43
  notes: The Mendeley file holds 67 cued delay units (78 expected, tolerance 7.8). Under the
    claim's seed 43 pass M3 (50 +- 5); 17 have a mean held-out R2 at or below 0, 10 a mean cue
    response at or below 2 spikes/s (3 both), none an ML at or above 900 um. Over the five seeds
    43 to 45 are selected. The paper's table flags 78 units, so 11 were not deposited; 5 of them
    are at ML above 900 um and the paper excludes them, which leaves 73 against the 67 here. The
    exclusion counts here (17, 10, 0) compare with the paper's 17, 11 and 4.
  deviations:
  - Tested on the paper's Mendeley deposit, as DANDI:000251 holds no cued delay recordings.
  - The units are taken as the identified dopamine neurons; the file has no identification flag,
    and the link shows each unit is a row the paper flags Valid.OdorNew.
  - Cue responses are computed from the spike times (0.1 to 0.4 s after VSTIM_ON); the code reads
    precomputed per-trial rates (CellValuesArray.mat).
  - Fits use scipy's bounded least squares (least_squares) with the code's start points and
    bounds, where the code uses MATLAB fit; half splits are disjoint, where the code's two halves
    share one trial (Olfaction_Script.m, FirstHalf and SecondHalf).
- claim: session-trial-counts
  outcome: reproduced
  notebook: cued_delay_and_cross_task.ipynb
  output: claim:session-trial-counts
  measured:
  - 39
  - 81.4
  - 66
  - 58.8
  notes: Reading (a), every session with a unit. Cued delay 39 sessions (36 +- 3.6) with 81.4 +-
    12.7 trials; VR 66 sessions (60 +- 6, at the edge of the tolerance) with 58.8 +- 19.5 trials.
    Reading (b), sessions with an analysed unit, gives 62 VR sessions with 59.2 trials and 30 cued
    delay sessions with 82.6 trials, the latter outside tolerance. The VR files hold only the
    open-loop trials of the standard track and the cued delay file only the four odor trial types,
    so the two trial readings give the same counts. Sessions are a mouse and a start time.
  deviations:
  - The cued delay half of the claim is tested on the Mendeley deposit (data with_inputs).
- claim: fig2b-anticipatory-licking
  outcome: reproduced
  notebook: cued_delay_and_cross_task.ipynb
  output: claim:fig2b-anticipatory-licking
  notes: Under onset reading (a) the onset is at 0.3, 0.5, 2.3 and 7.9 s after the odor for the
    0.6, 1.5, 3.75 and 9.375 s cues, over all 67 units and over the 43 selected, increasing with
    delay. Reading (b) (2 s.d. above the pre-cue bins) gives no order, as pre-cue licking is near
    zero (0.10 licks/s) and is crossed in the first bins. No random draws.
  deviations:
  - 67 units in place of the paper's 78 recorded neurons.
- claim: fig2c-mean-cue-response-decreases
  outcome: reproduced
  notebook: cued_delay_and_cross_task.ipynb
