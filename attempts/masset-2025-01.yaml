- claim: fig3-common-value-fit
  outcome: reproduced
  assumed: true
  notebook: vr_population.ipynb
  output: claim:fig3-common-value-fit
  measured:
  - 0.446
  - 0.237
  notes: Mean 0.446 and s.d. 0.237 of the per-neuron discount factors under the claims' seeds (0.437 to 0.447 and
    0.231 to 0.243 over the five), within tolerance. The mean value function is convex under both readings (second
    difference positive at 66 to 68% of bins; at or below the chord at every interior bin). Percentiles 20, 70 and
    90 are 0.220, 0.555 and 0.731 (paper 0.25, 0.56, 0.88). Few fits reach the optimiser's tolerance (9 to 16 of
    200 per seed). On 20 fits the iteration cap moves the mean from 0.479 (3000 iterations) to 0.443 (10,000) and
    0.442 (30,000).
  deviations:
  - Assumption. The fit is capped at 10,000 iterations of L-BFGS-B, with gains and baselines solved exactly at each
    step (variable projection, same bounds), where the code runs fmincon (interior point, MaxIter 2000, TolFun 1e-5).
    The cap is chosen because 30,000 iterations change the result little on a subset while 3000 change it; the paper
    does not say how far its fits converged.
