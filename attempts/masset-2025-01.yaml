inputs:
- what: The paper's own deposit, version 1 (2025-04-09). DA_SU_ODOR_NEW_W_OL.h5 holds the cued delay task single
    units (spike, lick and event times, mouse, ML position), which DANDI:000251 does not hold; the cued delay claims
    are tested on it (data elsewhere). FinalAverageArray.mat, the paper's per-neuron table, is used to pair each
    neuron's VR and cued delay units (link claim) and, for the 11 cued delay neurons the HDF5 file lacks, to give
    their cue responses from its 10 ms rates; Valid_S.mat gives the paper's flags of the neurons recorded in each
    task. Files are streamed into memory; their SHA-256 sums from the deposit's file list are in the helper. The
    deposit is in Mendeley Data, which the registry does not read, so the paper cannot be listed on it there.
  source: doi:10.17632/tc43t3s7c5.1
outcomes:
- claim: fig1f-multi-timescale-advantage
  outcome: blocked
  blocked_by: other
  notes: Not attempted in this run. The claim rests on simulations made by the paper's public code (github.com/pablotano8/multi_timescale_RL
    at 37f11c6), not on any recorded data. The run's five hours went to the 23 claims on recorded data, which needed
    about 70 minutes of computing in their final run alone. A later attempt can run the simulation code.
- claim: mixing-model-accuracy
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The sharing parameter of the mixing model (Methods eq. 32-33) is lost from the text, and the modification
    is not in the simulation repository at 37f11c6 nor in the Mendeley scripts, as the claims file records. No value
    of the parameter has a basis in the paper, so the reported accuracies cannot be checked. The question is in
    the findings.
- claim: ed2e-branching-myopic-bias
  outcome: blocked
  blocked_by: other
