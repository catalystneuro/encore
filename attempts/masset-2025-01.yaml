    iteration cap moves the mean from 0.479 (3000 iterations) to 0.443 (10,000) and 0.442 (30,000).
  deviations:
  - Assumption. The fit is capped at 10,000 iterations of L-BFGS-B, with gains and baselines solved
    exactly at each step (variable projection, same bounds), where the code runs fmincon (interior
    point, MaxIter 2000, TolFun 1e-5). The cap is chosen because 30,000 iterations change the
    result little on a subset while 3000 change it; the paper does not say how far its fits
    converged.
