findings:
- kind: metadata_error
  statement: The session start times are stated with a Pacific offset (-07:00 or -08:00), but their
    clock values are those Supplementary Table 1 gives as UTC, for all 50 sessions. For four sessions
    (412933 session 765427689, and 418779's three sessions) the stated date is a day after the
    imaging date of Table 2, and the date of birth implied by 418779's age is a day after Table 1's.
- kind: metadata_error
  statement: The three sessions of mouse 433414 are recorded at a depth of 60 um; Table 2 and
    Supplementary Table 1 give 75 um. Which is right is not known from the files.
- kind: metadata_insufficient
  statement: The files hold no QC result, local session number or stimulus seed. The paper's analyses
    use only sessions 1 to 3 that passed QC, and the dandiset's description points to an outside
    table (the metadata repository) for which sessions were excluded.
- kind: metadata_insufficient
  statement: The imaging plane (somata or distal apical dendrites) is not recorded; it follows from
    the depth. The field of view in um is not recorded.
- kind: metadata_insufficient
  statement: Visual flow square size and position are given in pixels of the unwarped stimulus, with
    no screen geometry to convert them to the degrees the paper states (8 degrees, 50 degrees/s).
- kind: other
  statement: The dF/F of the 28 dendritic sessions is stored gzip-compressed in small chunks (991 to
    1994 frames by 5 to 26 ROIs), and the chunk index is spread through the file, so streaming it
    through remfile and h5py is slow; the 22 somatic files store it contiguous. The notebook
    therefore streams each basic file whole into memory before reading it.
- kind: other
  statement: In two sessions the dF/F response to grey screen transitions does not exceed the 99th
    percentile of the responses at shifted times (777496949, 15 ROIs, above 94.6% of them; 838633305,
    which failed QC and whose experimental notes in Supplementary Table 1 say the laser was set to 800
    nm, while the file states 910 nm), so their alignment to the trial table could not be shown. It is
    shown in the other 48.
- kind: methods_unavailable
  statement: The per-ordering ROI matching counts behind Fig. 8 are published for two mice only, and
    the paper's modified matching code is not linked, so the comparison of order dependence between
    somata and dendrites cannot be repeated.
verifications:
- date: '2026-10-22'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The executed notebook with the conclusion cells and the summary removed, the helper
    module and the claims file, with the paper. The verifier checked the archive's metadata for the blocked
    claims and tested helper functions on synthetic inputs (rolling_mean, robust_scale, windows, the Pearson
    correlation, select_gabor_rois, select_flow_rois, grey_transitions, flow_onsets, calculate_snr), finding
    them as documented; the SNR port matches the source data. It found no misreadings of the paper in
    the claims file, and spot-checked Supplementary Table 1 against the paper's Tables 1 and 2 for 765427689,
    777496949 and 826187862 to 827833392, finding agreement. It agreed with 33 of 35 outcomes and would
    give outcomes to the two claims blocked only by dependency. It could not read the full outputs of
    the session table and of the Gabor and visual flow tables, cut by its own 6000-character limit; the
    summary lines were complete. Those tables are unchanged, except that the session table now
    prints each start time in full.
  results:
  - claim: table1-subjects
    agrees: true
    outcome: reproduced
    reason: All 13 subjects are present and sex and genotype agree for every one, 0 disagreements. The
      files record no date of birth or plane; these are listed, not counted.
    response: No change needed.
  - claim: cohorts-by-plane
    agrees: true
    outcome: reproduced
    reason: 3/3/4/3 mice per group, each with at least 3 sessions.
    response: No change needed.
  - claim: sex-split
