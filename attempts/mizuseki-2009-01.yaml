- claim: figs11-phase-time-agreement
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_mizuseki_2009.ipynb
  output: claim:figs11-phase-time-agreement
  measured: 0.361
  notes: 5493 CA1 pairs from the same session, both members modulated and more than 100 CCG events in
    [-150, 150] ms. With the CCG peak lag unwrapped to one theta cycle (the criterion's reading), the
    Pearson correlation with the phase difference as time is 0.614 for 1840 pyramidal cell-interneuron
    pairs (Figure S11B), 0.146 for 3406 pyramidal cell pairs (Figure S11A) and 0.361 over all pairs (criterion
    r > 0.5, all p < 1e-17); circular correlations 0.659, 0.205 and 0.395. Without unwrapping r is 0.061
    over all pairs, as many peaks fall in the neighbouring cycle (41% outside +/-62.5 ms). The claim holds
    for principal-interneuron pairs and not for principal pairs. The measured value is the correlation
    over all pairs.
  deviations:
  - Theta phase is referred to the CA1 pyramidal layer LFP, as hc-2 has no EC3 LFP; the paper uses EC3
    theta except for rat i01 and Figure S10, and reports CA1 leading EC3 by 0 to 80 degrees (Figure S10
    legend).
  - Theta epochs are windows (2 s, 1 s step) where the ratio of 5-11 Hz power to the 1-4 and 12-14 Hz
    power exceeds 2 and running speed exceeds 3 cm/s. The paper gives the ratio (Supplemental Experimental
    Procedures) but no threshold, adjusts epochs by hand, and says only walking/running; the threshold
    and speed are assumptions, varied (ratio 1.5 or 3, speed 5 cm/s or none).
  - Putative interneurons are units with a trough-to-peak latency below 0.4 ms or a mean rate above 10
    Hz. The paper separates hippocampal cells by autocorrelograms, waveforms and rates (Supplemental Experimental
    Procedures, Cell Type Classification) without thresholds, and hc-2 has no labels; the rule is an assumption,
    with two variants shown (waveform alone; narrow and above 1 Hz, or above 10 Hz).
  - Pairs are taken within each session; the CCG uses theta-epoch spikes, 1 ms bins, normalised by (1
    - |t|/T) with T the theta duration (Supplemental Experimental Procedures, Analysis of temporal relationships),
    smoothed with SD 10 ms (Figure S11 legend).
