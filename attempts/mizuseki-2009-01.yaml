- claim: fig3-interneurons-min-ascending
  outcome: reproduced
  assumed: true
  notebook: reproduce_mizuseki_2009.ipynb
  output: claim:fig3-interneurons-min-ascending
  notes: Tested on the CA1 groups hc-2 holds. The minimum of the pooled phase histogram is at 335 degrees
    for 739 pyramidal cells and 315 for 181 interneurons, inside both readings of the ascending phase
    (180-360 and 265-360), in each rat (305 to 355) and under every classification and theta-epoch variant.
    Referred to EC3 with the paper's 0 to 80 degree lead of CA1, the minima would be 255-335 and 235-315,
    inside reading (a) for any shift and inside (b) for shifts up to 70 and 50 degrees. The EC and DG/CA3
    groups of the statement cannot be tested.
  deviations:
  - Theta phase is referred to the CA1 pyramidal layer LFP, as hc-2 has no EC3 LFP; the paper uses EC3
    theta except for rat i01 and Figure S10, and reports CA1 leading EC3 by 0 to 80 degrees (Figure S10
    legend).
  - Theta epochs are windows (2 s, 1 s step) where the ratio of 5-11 Hz power to the 1-4 and 12-14 Hz
    power exceeds 2 and running speed exceeds 3 cm/s. The paper gives the ratio (Supplemental Experimental
    Procedures) but no threshold, adjusts epochs by hand, and says only walking/running; the threshold
    and speed are assumptions, varied (ratio 1.5 or 3, speed 5 cm/s or none).
  - Putative interneurons are units with a trough-to-peak latency below 0.4 ms or a mean rate above 10
    Hz. The paper separates hippocampal cells by autocorrelograms, waveforms and rates (Supplemental Experimental
    Procedures, Cell Type Classification) without thresholds, and hc-2 has no labels; the rule is an assumption,
    with two variants shown (waveform alone; narrow and above 1 Hz, or above 10 Hz).
