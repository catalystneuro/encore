  notes: hc-2 holds no entorhinal cortex recordings (CA1 probe only, data descriptor), so there are no
    EC interneurons or EC2 principal cells.
findings:
- kind: data_missing
  statement: hc-2 holds only the CA1 open-field part of the paper's data, 21 sessions of rats ec13, ec14
    and ec16. The entorhinal recordings, the CA3 and dentate recordings, the linear track, T-maze and
    wheel sessions, and rats ec12 and i01 are not in it, so 26 of the 37 claims cannot be tested.
- kind: metadata_insufficient
  statement: No unit carries a cell type or a region or layer label; the structure and type fields of
    the units in the .xml files are empty or '--'. Principal cells and interneurons had to be classified
    by an assumed rule, which several results depend on.
- kind: metadata_insufficient
  statement: The files do not say which channel lies in the CA1 pyramidal layer, which the paper uses
    for theta and ripples, and some channels are noisy (in ec016.582 the channel with the largest ripple-band
    power correlates with its shank at r = 0.52). Positions in the .whl files are in video pixels with
    no scale.
- kind: other
  statement: Sessions ec015.041 and ec015.047 carry the prefix ec015 but are listed under rat ec14 in
    the data descriptor; nothing in the files confirms which animal they come from. With positions scaled
    to the platform sides of the descriptor, the 120 cm sessions give 0.86 to 0.91 cm per pixel and the
    180 cm sessions 1.01 to 1.09, so either the camera view changed or the stated sizes do not match the
    tracked area.
- kind: methods_unavailable
  statement: 'Question for the authors. How were theta epochs set: what threshold on the 5-11 Hz to 1-4
    and 12-14 Hz power ratio, over which window, and what speed or behaviour criterion defined walking/running?
    The manual adjustment cannot be repeated. Here a ratio above 2 in 2 s windows and speed above 3 cm/s
    were assumed; the share of modulated CA1 pyramidal cells moves from 91.1 to 95.8% across the variants,
    across the bound of fig3d-hippocampal-modulation.'
- kind: methods_unavailable
  statement: Question for the authors. What thresholds on autocorrelogram, waveform and mean rate separated
    CA1 principal cells from interneurons? Here a trough-to-peak latency below 0.4 ms or a mean rate above
    10 Hz was assumed, giving 19.7% interneurons against 14.8% in the paper's open-field counts; the interneuron
    rate-phase shift (figs13-interneuron-rate) and between-rat agreement depend on it.
- kind: methods_unavailable
  statement: Question for the authors. For the ripple-triggered rates of Figure S2, what bin and what
    baseline define the 6-fold and 3-fold increases of CA1 pyramidal cells and interneurons? With a pre-ripple
    baseline the increases here are 10.05 and 4.41, with the rate outside ripples 7.41 and 2.12.
