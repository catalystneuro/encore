- claim: tables1-cell-counts
  outcome: blocked
  blocked_by: data_missing
  notes: Every expected count includes data hc-2 does not hold. The per-rat CA1 counts of Table S1 cover
    all tasks, and hc-2 holds open-field sessions only; the open-field counts (1083 principal cells, 188
    interneurons) include rat i01, which hc-2 does not hold; the EC, CA3 and DG counts have no data. hc-2
    gives 739 putative pyramidal cells and 181 putative interneurons counted session by session (545 and
    127 once per unit), ec13 299 and 95, ec14 237 and 46, ec16 203 and 40, under the assumed classification.
    These are below the paper's open-field totals, as a subset should be, but the interneuron count (181
    in three rats against 188 in four) suggests the classification marks more interneurons than the paper's.
  notebook: reproduce_mizuseki_2009.ipynb
  output: claim:tables1-cell-counts
  deviations:
  - Putative interneurons are units with a trough-to-peak latency below 0.4 ms or a mean rate above 10
    Hz. The paper separates hippocampal cells by autocorrelograms, waveforms and rates (Supplemental Experimental
    Procedures, Cell Type Classification) without thresholds, and hc-2 has no labels; the rule is an assumption,
    with two variants shown (waveform alone; narrow and above 1 Hz, or above 10 Hz).
