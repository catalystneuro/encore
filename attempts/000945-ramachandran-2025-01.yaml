outcomes:
- claim: fig3-cell-type-sorting
  outcome: partially_reproduced
  notebook: reproduce_ramachandran_2025.ipynb
  output: claim:fig3-cell-type-sorting
  measured:
  - 28
  - 34
  - 62
  notes: With the dataset's cell-type labels (reading K0), two single recordings (reading R1) give
    all three counts within tolerance, BH527_30_200 with 28 FSU, 34 RSU and 62 units (given as
    measured) and BH508_4500_200_2 with 28 FSU, 30 RSU and 58 units. No rat's whole series matches
    (R2; totals 77 to 616). FSU have the higher median baseline rate in 46 of 59 labelled
    recordings (8.60 against 5.84 Hz over units). The k-means sorting and the separation of the
    clusters on the initial phase and after-hyperpolarization durations cannot be tested, as the
    files hold no waveforms; K1 and K2 could not be run. The criterion has no branch for a count
    match with the feature part untestable; the outcome is partial because only the count part
    could be tested and it holds.
  deviations:
  - Cell types are the dataset's labels (K0); the k-means of K1 and K2 cannot be run without
    waveforms, so their agreement with the labels is not reported.
  - The dependent claims use the labels directly; they do not need the k-means features, so they
    are not affected by the untested part of this claim.
- claim: fig4-rsu-time-locked-both-states
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_ramachandran_2025.ipynb
  output: claim:fig4-rsu-time-locked-both-states
  notes: The criterion compares the 1500 Hz, 200 us RSU time-locked responses with the sham
    sessions of each state, and the dandiset holds no sham recording. Shown without a test, RSU
    at 1500 Hz average 98.1 to 98.7% of baseline awake (n = 227 or 303) and 106.4 to 107.0%
    anesthetized (n = 78, two rats).
- claim: fig4hi-fsu-delayed-latency
  outcome: not_reproduced
  notebook: reproduce_ramachandran_2025.ipynb
  output: claim:fig4hi-fsu-delayed-latency
  measured:
  - 0.506
  - 0.447
  notes: Under none of the 16 readings (S1/S2, D1/D2, L1/L2, Rep1/Rep2) are awake onsets later at
    p < 0.001; rank-sum p is 0.018 to 0.85, and in 6 readings the anesthetized mean is the later.
    Awake means are 0.40 to 0.58 s (within 0.51 +- 0.14), anesthetized means 0.38 to 0.52 s (all
    outside 0.24 +- 0.08). Measured values are the S1 D1 L1 Rep1 means (anesthetized, awake).
    193 to 265 of 306 awake FSU and 34 or 39 of 50 anesthetized FSU have a delayed response under
    the paper's rule. The anesthetized FSU come from two rats (BH498, BH512). Q1 and Q2 select
    the same recordings here.
  deviations:
  - The anesthetized FSU come from two labelled rats where the paper had ten; batch 2 is not in
    the dandiset.
  - T2 (505 trials) cannot be run; the files hold 500 trials, or fewer in five recordings.
- claim: fig4h-awake-latency-wider
  outcome: not_reproduced
  notebook: reproduce_ramachandran_2025.ipynb
  output: claim:fig4h-awake-latency-wider
  notes: The awake SD exceeds the anesthetized SD in 10 of 16 readings, by at most 0.02 s (0.381 to
    0.393 s awake, 0.367 to 0.406 s anesthetized); the criterion asks for every reading. The
    awake histogram (S1 D1 L1 Rep1) has its largest count in the first allowed bin (61 of 262 at
    0.071 s) and several smaller local maxima.
- claim: fig5a-rsu-time-locked-prf-awake
  outcome: not_reproduced
  notebook: reproduce_ramachandran_2025.ipynb
  output: claim:fig5a-rsu-time-locked-prf-awake
  notes: PRF is a significant factor (Kruskal-Wallis p = 3.3e-16, W1 Rep1) but the post hoc
    pattern differs. The highest mean is at 3000 Hz (108.2%; 1500 Hz 98.5%), and 3000 Hz differs
    from 1500 and 4500 Hz, so part (4) fails under every reading; part (3) fails under every
    reading; part (2) holds only under W2 Rep1. Parts (5) and (6) need the sham and were not
    tested.
  deviations:
  - No sham recording exists; parts (5) and (6) are reported as not tested and the claim is judged
    on parts (1) to (4), as the claims file's header says for an anesthetized sham.
  - Ten awake recordings are `_2` repeats of a condition in the same rat; results are given with
    (Rep1) and without (Rep2) them.
- claim: fig5c-rsu-time-locked-prf-anesth
  outcome: not_reproduced
  notebook: reproduce_ramachandran_2025.ipynb
  output: claim:fig5c-rsu-time-locked-prf-anesth
  notes: The Kruskal-Wallis is significant (p = 7.3e-08 W1, 7.7e-07 W2) and 30 and 300 Hz do not
    differ (part 7), but parts (2), (3) and (4) fail under both readings. 1500 Hz is the peak
    (107.0%) and differs from 4500 Hz; 30 and 300 Hz are not below 3000 or 4500 Hz. The 1500 Hz
    peak comes from BH512 (110.4% against 101.7% in BH498).
  deviations:
  - Two labelled rats (BH498 at five PRFs, BH512 without 30 Hz) where the paper had ten; BH521's
    anesthetized recordings have no labels.
  - Parts (5) and (6) need the sham and were not tested.
- claim: rsu-time-locked-anesthesia-factor
  outcome: not_reproduced
  notebook: reproduce_ramachandran_2025.ipynb
  output: claim:rsu-time-locked-anesthesia-factor
  notes: Anesthesia is a factor at p = 0.011 to 0.018 over the eight readings (A1/A2, W1/W2,
    Rep1/Rep2), all above the 0.01 bound, and in the reverse direction; the anesthetized mean
    (102.6 to 102.9%) is above the awake mean (100.1 to 100.4%). With only BH498 and BH512, p =
    0.425.
  deviations:
  - Anesthetized units from two rats; awake units from seven.
- claim: fig5bd-fsu-time-locked-no-prf
  outcome: not_reproduced
  notebook: reproduce_ramachandran_2025.ipynb
  output: claim:fig5bd-fsu-time-locked-no-prf
  notes: By the paper's test FSU time-locked responses differ across PRF in both states,
    Kruskal-Wallis p = 1.8e-12 awake and 5.5e-04 anesthetized (W1 Rep1), with 5 or 6 significant
    post hoc pairs awake and 2 or 3 anesthetized under every reading. The effects are small;
    group medians span 98.7 to 103.4% awake and 99.8 to 103.9% anesthetized, and the awake 3000 Hz
    mean is 106.8%. G2 (with sham) cannot be run.
- claim: fig5e-rsu-delayed-prf-awake
  outcome: not_reproduced
  notebook: reproduce_ramachandran_2025.ipynb
  output: claim:fig5e-rsu-delayed-prf-awake
  notes: PRF is a significant factor (p = 6e-20 Rep1) but the two highest means are 1500 and 30 Hz
