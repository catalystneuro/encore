- claim: delayed-anesthesia-factor
  outcome: reproduced
  assumed: true
  notebook: reproduce_ramachandran_2025.ipynb
  output: claim:delayed-anesthesia-factor
  notes: Without the `_2` repeats (Rep2, adopted), anesthesia is a factor for RSU at p = 4.2e-09 to
    5.6e-09 and for FSU at p = 0.0013 to 0.0015 under A1/A2 and W1/W2, and the anesthetized mean
    is lower in both (RSU 99.7 against 104.6%, FSU 99.7 against 101.3%). With the repeats (Rep1)
    RSU holds (p = 3.6e-06 to 4.3e-06) but FSU gives p = 0.038 to 0.041, which misses the 0.01
    bound; that reading gives partially reproduced. The question is recorded for the paper's
    authors.
  deviations:
  - Assumed that the paper's analysis did not include the `_2` repeat recordings (Rep2). Methods
    2.3 describes one recording per parameter set per rat ("Recordings for a single rat for each
    set of parameters were completed on the same day"); the dandiset holds ten awake repeats in
    BH498, BH506 and BH508 that the paper does not mention.
  - Anesthetized units from two rats.
