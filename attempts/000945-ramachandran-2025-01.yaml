- claim: fig7a-rsu-time-locked-dc
  outcome: not_reproduced
  notebook: reproduce_ramachandran_2025.ipynb
  output: claim:fig7a-rsu-time-locked-dc
  notes: The DC effect is significant (Kruskal-Wallis p = 1.5e-22, W1 C1) but 6% is the highest
    group (180.8%; 60% 147.5%; 30% 90.4 to 98.7%) under every reading. 6% does not differ from 60%
