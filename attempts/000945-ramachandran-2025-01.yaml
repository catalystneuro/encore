- claim: sham-no-auditory-response
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The criterion blocks the claim, as the paper names no test of the sham against baseline.
    The dandiset also holds no sham recording, so the sham's responses cannot be shown either.
findings:
- kind: data_missing
  statement: The sham condition and the second batch of five rats (awake and anesthetized
    recordings in the same week at a low PRF and 1500 Hz) are not in the dandiset. Four claims
    cannot be tested, and every comparison with sham in the others is left out.
- kind: data_missing
  statement: Only part of the first batch is here. The awake PRF series covers seven rats, the
    anesthetized PRF series three (BH498 at five PRFs, BH512 without 30 Hz, BH521 at three PRFs,
    unlabelled), and the awake DC series three rats at 6% and 60% only, with no 30% recording of
    its own. The paper describes ten rats for each series.
- kind: data_missing
  statement: The files hold no waveforms, voltage traces or electrode positions, so the cell-type
    sorting (k-means on the initial phase and after-hyperpolarization durations) cannot be
    repeated or checked.
- kind: metadata_error
  statement: Twelve files are second copies of other recordings. The five anesthetized BH498
    recordings are deposited under BH498 without labels and under subject folder BH497 with
    labels; four anesthetized BH512 recordings under BH512 without labels and under BH514 with
    labels; BH512_1500_200_anes2 is a third copy of the BH512 1500 Hz anesthetized recording,
    sorted differently. Trial times, per-unit spike counts and first spike times are identical
    within each pair. The identifiers name BH498 and BH512.
- kind: metadata_error
  statement: BH498_30_200 (sub-BH498) and BH508_30_200_2 (sub-BH508) share all 203 trial times
    and 18,860 spike times; they are one recording sorted twice and filed under two rats.
- kind: metadata_error
  statement: The labelled copies of anesthetized recordings (sub-BH497, sub-BH514) are described
    as "Awake S1 Stimulation by tFUS". Every file gives the age P24W, where the paper gives 7, 9
    and 10 months for the three series. Electrode columns carry placeholder descriptions ("my
    description") and the location "brain area".
- kind: metadata_insufficient
  statement: The PRF, tone-burst duration and anesthesia state of a recording are coded only in
    the file's identifier. The `_2` suffix of ten awake recordings and the trial table's
    stop_time (always 2.2 s after start_time) are not described.
- kind: metadata_insufficient
  statement: Fifteen anesthetized files have no cell-type labels, among them all of BH521's and
    BH512's DC recordings, which cannot enter any cell-type analysis.
- kind: other
  statement: Five recordings hold fewer than the 500 trials the Methods describe (203, 238, 328
    and 339 trials, all from BH508 or the BH498/BH508 duplicate).
- kind: methods_unavailable
  statement: Were the `_2` repeat recordings (BH498, BH506, BH508) part of the paper's analysis,
    and if not, which recording of each pair was? Methods 2.3 describes one recording per
    parameter set per rat. The FSU part of delayed-anesthesia-factor depends on it (p = 0.0013
    without the repeats, 0.038 with them); this attempt assumed they were left out.
- kind: methods_unavailable
  statement: Which recordings form the 30% DC group of Figure 7? Methods 2.3 describes a DC series
    at 10 months with TBD 40, 200 and 400 us, and the dandiset holds no 200 us recording from it.
    With the 1500 Hz, 200 us recordings of the same three rats, fig7c is not reproduced; with
    those of all rats, it is partially reproduced. This attempt assumed the same rats.
- kind: methods_unavailable
  statement: Was a response window that does not fall on the 35.7 ms bin edges (0 to 67 ms, 0.2
    to 0.7 s) measured from exact spike times or from the PSTH bins that overlap it? It decides
    fig6ef-rsu-ispta-rise-then-fall without the repeats; this attempt assumed the bins (Methods
    2.4 derives responses from the binned PSTH).
