- claim: fig7d-fsu-delayed-dc
  outcome: reproduced
  notebook: reproduce_ramachandran_2025.ipynb
  output: claim:fig7d-fsu-delayed-dc
  notes: Under every reading (C1, C2 Rep1, C2 Rep2) the DC effect is significant (Kruskal-Wallis p
