- claim: fig6ef-rsu-ispta-rise-then-fall
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_ramachandran_2025.ipynb
  output: claim:fig6ef-rsu-ispta-rise-then-fall
  notes: Time-locked RSU means rise from 30 Hz (96.8%) to a peak at 3000 Hz (60.26 mW/cm2,
    108.2%) and fall at 4500 Hz (99.2%) under W1 Rep1, W2 Rep1 and W2 Rep2; under W1 Rep2 the 300
    Hz mean (98.2%) is 0.1 point above the 1500 Hz mean (98.1%, SEMs 1.1 and 1.3), so the rise is
    not monotone. The delayed means do not rise to their peak (106.6% at 30 Hz, 101.2% at 300 Hz,
    106.7% at 1500 Hz, Rep1). One window holds under W2, the reading adopted.
  deviations:
  - Assumed W2, a window measured from the PSTH bins that overlap it, where W1 and W2 give
    different outcomes under Rep2. Methods 2.4 derives responses from the binned PSTH ("resulting
    in a histogram of average spikes per time bin for each neuron").
