findings:
- kind: data_missing
  statement: The data set holds only the current-step recordings of the three O-LM interneurons of Figure
    7. None of the Cajal-Retzius cell recordings behind the paper's main findings (Figures 1 to 6 and
    8 to 12) are in it, nor the light-evoked responses of Figure 7C and 7D, so 25 of the 26 claims cannot
    be tested. The data set's title and description say it holds only the O-LM firing patterns.
- kind: metadata_error
  statement: The description gives the current steps as -100:30:+250 pA. All three files hold 15 steps
    from -100 to +250 pA in 25 pA increments, as the current channel shows.
- kind: metadata_error
  statement: The description says the current injection usually starts about half a second into the sweep.
    In all three files it starts at 75 ms and ends at 1.075 s.
- kind: metadata_insufficient
  statement: The current description (version 0.7) does not give each cell's animal, age or mouse line,
    or the panel of Figure 7 that shows it. The superseded description under hc-9/old/ does (1May2012_P3
    P13 and 20Sept2011_P2 P14, CXCR4-EGFP; 24October2012_C2 P15, Sst-IRES-Cre;ChR2(H134R)-EYFP), and these
    match the Figure 7 legends. That old description also calls the files ABF; they are ATF text files.
- kind: methods_unavailable
  statement: Question for the paper's authors. The Figure 7A and 7D legends point to a sag in the hyperpolarizing
    response at -100 pA, but the paper defines no measure of sag or criterion for its presence. Was it
    judged by eye, or by a measure such as the sag ratio (V_end - V_min) / (V_baseline - V_min)? This
    attempt used two standard readings, which agree for all three cells (sag ratios 0.21 to 0.45).
