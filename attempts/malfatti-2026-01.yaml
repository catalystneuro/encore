- claim: fig1fh-no-genotype-effect-learning
  outcome: reproduced
  notebook: reproduce_malfatti_2026.ipynb
  output: claim:fig1fh-no-genotype-effect-learning
  notes: 13 mice (6 Cre+, 7 WT), as the paper. Over all sessions the mixed ANOVA (Shapiro's test
    did not reject normality) gives genotype F(1,11) = 0.043, p = 0.84 for total prehensions per
    10 min, 0.041, p = 0.84 for successful prehensions and 0.327, p = 0.58 for the success ratio
    (paper 0.83, 0.856 and 0.574). Cre+ minus control means are 4.9 and 1.5 prehensions per 10 min
    and -0.024 in success ratio. Under every reading of the criterion (all sessions or sessions 1,
    2 and 6, raw counts or counts per 10 min) the genotype p is above 0.05; the smallest is 0.145
    (success ratio, sessions 1, 2 and 6). The variants (the duplicated session counted, the
    Methods' four body parts, each half of session 5 divided by its own length) give p of 0.141
    and above. No random draws are used.
  deviations:
  - The deposited session 5 holds both the spoon and the plate halves, as the Methods say ("After
    five minutes in the fifth session, the pellet was instead placed on a fixed position on the
    plate"); it is split at 300 s into sessions 5 and 6, as BehavOnly.py does from a per-mouse
    table that is not in the repository. The pellet's tracked position moves at 300 s in all 13
    mice (median 112 px).
  - The deposited session 6 is the same recording as session 5 in every mouse and is dropped, so
    10 sessions are tested where the paper's degrees of freedom (F(10,110)) imply 11. Counting
    the copy as a session gives the paper's degrees of freedom and the same outcome; that variant
    has no meaning of its own.
  - Deposited sessions after 5 are renumbered +1, as BehavOnly.py (line 330) does, so deposited
    sessions 7 to 10 are sessions 8 to 11. This changes no test, only the labels of the later
    sessions.
  - BehavOnly.py splits session 5 at per-mouse times from Session5Split.dict, which is not in the
    repository; 300 s is the Methods' "After five minutes". The DeepLabCut start time is 0 s in
    all 13 session 5 files.
  - Counts per 10 min divide by the recording's duration, and both halves of session 5 by the whole
    recording's (about 607 s), as BehavOnly.py does (lines 333-344 copy the file's TotalTimes to
    both halves, line 378 divides by it). So the values per 10 min of sessions 5 and 6 are per 10
    min of the recording, not of the half. Dividing each half by its own length is run as a
    variant.
  - Prehensions and accuracy are taken from the deposited DeepLabCut tracking with the paper's
    code; the paper's own per-prehension classes are not public, so they cannot be compared.
  - The ANOVA-type statistic is a Python implementation of the formulas of nparLD (Brunner,
    Domhof and Langer), with infinite denominator degrees of freedom as nparLD's ANOVA.test
    reports; R was not available.
- claim: fig1fh-session-effect
  outcome: reproduced
  notebook: reproduce_malfatti_2026.ipynb
  output: claim:fig1fh-session-effect
  notes: Over all 10 distinct sessions the session effect is F(9,99) = 9.57, p = 2.2e-10 for total
    prehensions per 10 min, 7.86, p = 1.1e-08 for successful prehensions and 6.30, p = 5.3e-07 for
    the success ratio (paper F(10,110) = 9.525, 7.571 and 5.536). Means over mice of raw counts of
    total prehensions are 48.1 in session 1, 90.0 in session 2, 61.5 in session 5 and 44.8 in
    session 6, and of successful prehensions 16.7, 24.3, 15.2 and 11.2, so both rise from session 1
    to 2 and fall below session 2 in sessions 5 and 6. Per 10 min as the paper's code computes them
    (the halves of session 5 per 10 min of the whole recording) they are 47.4, 88.7, 60.8 and 44.3,
    and 16.5, 24.0, 15.0 and 11.0, with the same directions, also with the copy counted and with
    the four body parts. With each half divided by its own length, session 5 has 123.1 total and
    30.3 successful prehensions per 10 min, above session 2 (88.7 and 24.0), and session 6 has 87.5
    and 21.8, so under that variant the decrease in session 5 does not hold; its session effects
    have F(9,99) = 5.58, p = 3.3e-06, and 3.44, p = 0.001. The outcome is judged on the raw counts,
    the first reading the criterion lists, and holds also for the code's counts per 10 min;
    Figure 1F-H plots the number of prehensions. With the copy counted as a session F(10,110) =
    8.94, 6.86 and 6.06. With the sessions after 5
    renumbered +1, as the paper's code does, sessions 8 to 11 average 141.5, 175.5, 136.4 and 177.6
    total prehensions per 10 min, above every one of sessions 1 to 6 ("stable after session 7" is
    reported, not judged).
  deviations:
  - As for fig1fh-no-genotype-effect-learning, session 5 split at 300 s, the duplicated session 6
    dropped and later sessions renumbered +1, so 10 sessions where the paper has 11, and the halves
    of session 5 counted per 10 min of the whole recording, as the paper's code does.
