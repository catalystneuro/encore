- claim: fig1fh-no-genotype-effect-learning
  outcome: reproduced
  notebook: reproduce_malfatti_2026.ipynb
  output: claim:fig1fh-no-genotype-effect-learning
  notes: 13 mice (6 Cre+, 7 WT), as the paper. Over all sessions the mixed ANOVA (Shapiro's test
    did not reject normality) gives genotype F(1,11) = 0.043, p = 0.84 for total prehensions per
    10 min, 0.041, p = 0.84 for successful prehensions and 0.327, p = 0.58 for the success ratio
    (paper 0.83, 0.856 and 0.574). Cre+ minus control means are 4.9 and 1.5 prehensions per 10 min
    and -0.024 in success ratio. Under every reading of the criterion (all sessions or sessions 1,
    2 and 6, raw counts or counts per 10 min) the genotype p is above 0.05; the smallest is 0.145
    (success ratio, sessions 1, 2 and 6). The variants (the duplicated session counted, the
    Methods' four body parts) give p of 0.141 and above. No random draws are used.
  deviations:
  - The deposited session 5 holds both the spoon and the plate halves, as the Methods say ("After
    five minutes in the fifth session, the pellet was instead placed on a fixed position on the
    plate"); it is split at 300 s into sessions 5 and 6, as BehavOnly.py does from a per-mouse
    table that is not in the repository. The pellet's tracked position moves at 300 s in all 13
    mice (median 112 px).
  - The deposited session 6 is the same recording as session 5 in every mouse and is dropped, so
    10 sessions are tested where the paper's degrees of freedom (F(10,110)) imply 11. Counting
    the copy as a session gives the paper's degrees of freedom and the same outcome.
  - Prehensions and accuracy are taken from the deposited DeepLabCut tracking with the paper's
    code; the paper's own per-prehension classes are not public, so they cannot be compared.
  - The ANOVA-type statistic is a Python implementation of the formulas of nparLD (Brunner,
    Domhof and Langer), with infinite denominator degrees of freedom as nparLD's ANOVA.test
    reports; R was not available.
- claim: fig1fh-session-effect
  outcome: reproduced
  notebook: reproduce_malfatti_2026.ipynb
  output: claim:fig1fh-session-effect
  notes: Over all 10 distinct sessions the session effect is F(9,99) = 9.57, p = 2.2e-10 for total
    prehensions per 10 min, 7.86, p = 1.1e-08 for successful prehensions and 6.30, p = 5.3e-07 for
    the success ratio (paper F(10,110) = 9.525, 7.571 and 5.536). Means over mice of total
    prehensions are 47.4 in session 1, 88.7 in session 2, 60.8 in session 5 and 44.3 in session 6,
    and of successful prehensions 16.5, 24.0, 15.0 and 11.0, so both rise from session 1 to 2 and
    fall below session 2 in sessions 5 and 6, raw and per 10 min, and under both variants. With
    the copy counted as a session F(10,110) = 8.94, 6.86 and 6.06. Sessions 7 to 10 average 141.5,
    175.5, 136.4 and 177.6 total prehensions (reported, not judged).
  deviations:
  - As for fig1fh-no-genotype-effect-learning, session 5 split at 300 s and the duplicated
    session 6 dropped, so 10 sessions where the paper has 11.
