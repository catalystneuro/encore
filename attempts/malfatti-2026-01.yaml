  - claim: fig4fh-gamma-session13
    agrees: false
    outcome: not_reproduced
    reason: 'No reading gives both genotype effects, and no reading gives an accuracy effect (0 of 12).
      One band holds only in 4 of 12 readings, all realigned, 3 of them through the ATS. No deposited
      reading gives even the partial outcome. The realigned reading is the notebook''s own: it moves the
      onsets of four mice by a lag chosen to maximise the prehension-locked LFP and then tests prehension-locked
