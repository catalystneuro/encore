- claim: fig4b-clz-improves-success
  outcome: reproduced
  notebook: reproduce_malfatti_2026.ipynb
  output: claim:fig4b-clz-improves-success
  notes: 11 mice (5 Cre+, 6 WT), sessions 8 to 13. In Cre+ mice the mean success ratio is 0.075
    under saline and 0.135 under CLZ, higher in 5 of 5 mice; treatment within mouse F(1,4) =
    19.66, p = 0.011, and one-way over mouse-session values F(1,28) = 8.01, p = 0.0085. In controls
    0.128 and 0.135, F(1,5) = 0.28, p = 0.62, and F(1,34) = 0.24, p = 0.63 (paper F(1,15) = 10.974,
    p = 0.01, and F(1,19) = 0.878, p = 0.361). Session effect in Cre+ F(5,20) = 7.40, p = 0.00045,
    in controls F(5,25) = 0.31, p = 0.90; genotype by session F(5,45) = 2.60, p = 0.038 (paper
    F(6,54) = 2.203, p = 0.057). With the Methods' four body parts the outcome is the same (Cre+ p
    = 0.0012 and 0.0069, controls p = 0.63 and 0.52).
  deviations:
  - Session 7, which the criterion includes, is not in the dandiset; sessions 8 to 13 are used,
    so the session terms have 5 degrees of freedom where the paper's have 6.
- claim: fig4d-theta-genotype
  outcome: not_reproduced
  notebook: reproduce_malfatti_2026.ipynb
  output: claim:fig4d-theta-genotype
  notes: 10 mice (4 Cre+, 6 WT) have prehensions of both accuracies in sessions 11 to 13, as the
    paper's F(1,8) implies; 66127 has no successful prehension in session 11. Under the reading
    adopted (four offset mice realigned, 1 s windows, per-bin normalisation) the mixed ANOVA gives
    a theta genotype effect F(1,8) = 1.99, p = 0.20, and low theta F(1,8) = 2.44, p = 0.16 (paper
    6.783, p = 0.031, and 6.489, p = 0.034); theta accuracy p = 0.26. Over all 12 readings the theta
    genotype p is 0.17 to 0.48 and low theta 0.14 to 0.45, with Cre+ mean power above control in
    all 12. The ANOVA-type statistic alone, with infinite denominator degrees of freedom, gives a
    theta genotype p below 0.05 in 7 readings, but Shapiro's test selects the mixed ANOVA in them.
    The outcome is the same under every reading.
  deviations:
  - The dandiset holds one LFP channel per mouse ("All accepted MOp5 channels"), so the channel
    reading of the criterion has one answer.
  - The LFP is decimated from 30 kHz to 1 kHz before filtering, a standard choice that cannot
    change power below 100 Hz; the band-pass is a second-order Butterworth applied forward and
    backward, as sciscripts FilterSignal does.
  - The Methods' "cumulative mean" is read three ways, all run (per-bin mean over the recording,
    mean over all bins, and the running mean of each bin); the spectrogram window is 1 s or 0.5 s
    (Hann, 50% overlap). The outcome does not depend on them.
  - The LFP of four control mice (69107, 69109, 69110, 69204) is about 8 s off the tracking
    (clock check). The reading adopted moves their prehension onsets by the offset found (-7.96
    to -8.68 s), and the files as deposited are run as well.
- claim: fig4e-high-theta-accuracy
  outcome: not_reproduced
  notebook: reproduce_malfatti_2026.ipynb
  output: claim:fig4e-high-theta-accuracy
  notes: Under the reading adopted the high theta accuracy effect is F(1,8) = 2.17, p = 0.18 (paper
    8.724, p = 0.018). Successful prehensions have higher mean power than failed ones in all 12
    readings, and the accuracy p is 0.12 to 0.74; none is below 0.05. The outcome is the same
    under every reading.
  deviations:
  - Band power and readings as in fig4d-theta-genotype.
- claim: fig4fh-gamma-session13
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_malfatti_2026.ipynb
  output: claim:fig4fh-gamma-session13
  notes: Session 13 alone, 10 mice. Under the reading adopted (four offset mice realigned, 1 s
    windows, per-bin normalisation) the ANOVA-type statistic (Shapiro's test rejects normality)
    gives a low gamma genotype effect F(1,inf) = 6.26, p = 0.012, Cre+ higher (1.19 against 0.79),
    and a high gamma genotype effect F = 2.64, p = 0.10; the genotype part holds for one band. No
    reading gives an accuracy effect in a gamma band in session 13 (p 0.14 to 0.99). With the files
    as deposited, neither genotype part holds in any of the six readings (low gamma p 0.17 to 0.40,
    high gamma 0.14 to 0.19), which would make the claim not reproduced. With the four mice
    realigned one genotype part holds in four of six readings (low gamma in three, high gamma in
    one, the 1 s running-mean reading, p = 0.027), always under the ANOVA-type statistic. The
    mixed ANOVA, which Shapiro's test does not select there, gives p of 0.12 to 0.44 for both
    bands. The question of the spectrogram window and the normalisation is asked of the paper's
    authors (findings).
  deviations:
  - Band power and readings as in fig4d-theta-genotype.
  - Assumed that the four mice whose LFP shows no locked potential at the deposited alignment are
    analysed with their onsets moved by the offset at which the potential appears (about -8 s),
    since the Methods synchronised the streams by the LED and the deposited timing of these mice
    is inconsistent with a prehension-locked potential that the other seven mice show at lag 0.
    The outcome rests on this choice; as deposited it is not reproduced.
- claim: supfig7-lfp-nonprehension
  outcome: not_reproduced
  notebook: reproduce_malfatti_2026.ipynb
  output: claim:supfig7-lfp-nonprehension
  notes: 11 mice, sessions 11 to 13, power outside every -1 to 1 s prehension window. The genotype
    by session interaction has p < 0.05 in at most two of the seven plotted bands under any
    reading and in none as deposited; in the four realigned readings with per-bin or all-bin
    normalisation it holds for gamma (p 0.012 to 0.031) and for full or theta (p 0.029 to 0.050).
    Under the reading adopted it holds in two bands (full p = 0.032, gamma p = 0.031; theta 0.063,
    beta 0.072, low theta 0.116, low gamma 0.090, high gamma 0.072). Cre+ power in session 13 is
    below sessions 11 and 12 for full, theta and beta in 8 of 12 readings (not with the running
    mean), for example 0.894 against 1.002 and 0.988 (full, per-bin, 1 s). High theta has no
    effect at p < 0.05 except in two realigned readings (smallest p 0.049). The outcome is the same
    under every reading.
  deviations:
  - Band power and readings as in fig4d-theta-genotype; beta 13-30 Hz, as the criterion's
    standard choice.
