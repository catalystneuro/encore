- claim: fig4b-clz-improves-success
  outcome: reproduced
  notebook: reproduce_malfatti_2026.ipynb
  output: claim:fig4b-clz-improves-success
  notes: 11 mice (5 Cre+, 6 WT), sessions 8 to 13. In Cre+ mice the mean success ratio is 0.075
    under saline and 0.135 under CLZ, higher in 5 of 5 mice; treatment within mouse F(1,4) =
    19.66, p = 0.011, and one-way over mouse-session values F(1,28) = 8.01, p = 0.0085. In controls
