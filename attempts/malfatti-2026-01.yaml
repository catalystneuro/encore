findings:
- kind: data_missing
  severity: major
  statement: The miniscope recordings are deposited only as raw videos (342 AVI files, 89.4 GB),
    referenced from OnePhotonSeries objects with empty data. No cell footprints, fluorescence or
    detrended traces, and no cell matching across sessions, are in any file, so none of the 21
    calcium imaging findings can be tested without rerunning the whole extraction.
- kind: data_missing
  severity: major
  statement: The histology (c-Fos and mCherry counts, tdTomato counts after ablation) and the
    caspase ablation group (prehension sessions 7 to 12, pasta handling, hanging wire) are not in
    the dandiset. Five findings cannot be tested.
- kind: metadata_error
  severity: critical
  statement: In all 13 mice of the behaviour-only group the files labelled session 6 hold the same
    DeepLabCut tracking as session 5, one recording deposited twice. The Methods put the spoon and
    plate halves of the fifth session in one 10 min recording, so the paper's session 6 is the
    second half of the deposited session 5, and one of the 11 sessions the paper analyses
    (F(10,110)) is missing from the dandiset. An analysis of the files as labelled counts session
    5 twice.
- kind: metadata_error
  severity: critical
  statement: The two session 2 recordings of miniscope mouse 67111 (Trial1 and Trial2) hold the same
    behaviour video, tracked twice (same frame count, pellet positions r = 0.98 and a median 0.97 px
    apart), each deposited with a different imaging recording. At most one of the two imaging
    recordings has its own behaviour.
- kind: metadata_error
  severity: major
  statement: In four LFP mice (69107, 69109, 69110, 69204, all controls) the LFP shows no potential
    locked to the DeepLabCut prehension onsets at the deposited alignment in any of 24 sessions,
    while in 16 of them a locked potential appears 6.9 to 9.0 s before the onsets (pooled -8.0 to
    -8.7 s). The other seven mice show it at lag 0. This is consistent with the LFP and the
    tracking of these four mice being on clocks about 8 s apart, but the files hold no LED or sync
    trace that would settle it. Two further sessions (66128 session 11, 66546 session 12) show no
    locked potential at lag 0 and their strongest away from it (at 3.3 s, z 4.5, and at -2.0 s, z
    18.6), so their clock could not be established either.
- kind: metadata_error
  severity: major
  statement: The LFP is stated in volts, but its values have standard deviations of 72 to 1057 and
    reach plus or minus 6389.6, so they are microvolts or amplifier units. Mouse 67584 has a
    standard deviation of 4011 to 4397 in every session, 4 to 60 times the other mice, so the scale
    differs between files.
- kind: metadata_error
  severity: major
  statement: Every file gives the mouse's sex as female. The Methods state that the miniscope mice
    were male (and the LFP mice female); the files do not settle which is right.
- kind: metadata_error
  severity: minor
  statement: The file of mouse 66415 session 6 gives the genotype as unknown, where the mouse's
    other nine files give ChRNA2-Cre.
- kind: selection_undocumented
  about: data
  severity: minor
  statement: The miniscope group holds 7 mice (4 WT, 3 Cre+), one of them (67113) with sessions 1 and
    2 only, where the paper analysed 6 (3 and 3) of 8 implanted, and 4 for the assembly analysis.
    Neither the dandiset nor the paper says which mice were analysed.
- kind: other
  about: data
  severity: minor
  statement: Miniscope mouse 67314 has 20 s of DeepLabCut tracking in session 1 against 602 s of
    imaging, and 455 s of imaging in session 2; mouse 67109 has 296 s of imaging in session 6.
    Six of the 28 miniscope files have no prehension detected. In the miniscope files LFinger1 is
    tracked above 0.7 likelihood in at most 3.6% of frames, and LPaw and LFinger1 together in a
    median of 0.2%, against 1.4% and 2.4% in the behaviour-only and LFP groups, so the tracking of
    this group finds few prehensions (median 9.7 per 10 min, against 66.8 and 117.2).
- kind: data_missing
  severity: minor
  statement: The LFP group's session 7, the last training session before injection, is not in the
    dandiset; the paper's statistics of the success ratio use sessions 7 to 13.
- kind: other
  about: data
  severity: none
  statement: The counts of the behaviour-only group (13 mice, 6 Cre+ and 7 control) and the LFP
    group (11 mice, 5 Cre+ and 6 control) match the paper; the tracking is at the Methods' 50
    frames/s and inside a 1920 x 1080 frame; the prehension detector of the paper's code, applied
    to the tracking, gives learning curves whose session F values are close to the paper's.
- kind: methods_unavailable
  statement: Question for the authors. The Methods do not give the spectrogram window, overlap or
    the exact normalisation ("dividing each power value by the cumulative mean"), and the code at
    commit 86efdf1 has no spectrogram. This attempt ran 1 s and 0.5 s Hann windows with 50% overlap,
    and three normalisations (each frequency bin by its mean over the recording, by the mean over
    all bins, and by its running mean). Which were used? The LFP outcomes do not change with them.
- kind: methods_unavailable
  statement: Question for the authors. The LED synchronisation of the LFP group (Methods, "LFP
    electrophysiology analysis") is not deposited. For four control mice the deposited LFP appears
    about 8 s off the tracking. Was the alignment of these mice in the paper's analysis the one in
    the files? The outcomes here are judged as deposited; leaving the four mice out gives the same
    outcomes.
- kind: metadata_error
  severity: minor
  statement: The session_start_time of 65 of the 66 LFP files is 23:59:5x on the last day of a
    month (31 July, 31 August or 31 December 2021); one file of 69204 gives 30 April 2020. These
    look like placeholders, so the files do not say when each session was recorded.
- kind: other
  about: paper
  statement: BehavOnly.py splits session 5 into sessions 5 and 6 and copies the whole recording's
    TotalTimes to both halves (lines 333-344), then divides the counts by it to give counts per 10
    min (line 378). So the counts per 10 min of sessions 5 and 6 are per 10 min of the 10 min
    recording, about half the rate within each 5 min half. Per 10 min of its own half, session 5
    has more total and successful prehensions than session 2 here (123.1 and 30.3 against 88.7 and
    24.0), so the decrease in the fifth session that the paper reports holds for the counts and
    the code's values, not for rates within the half.
