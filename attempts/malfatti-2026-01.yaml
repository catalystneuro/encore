  - claim: fig1fh-no-genotype-effect-learning
    agrees: true
    outcome: reproduced
    reason: The genotype p is above 0.05 under every reading and variant (smallest 0.141). The main table's
      raw-count total gives F(1,11) = 0.048, p = 0.831, against the paper's 0.048 and 0.83. The success
      ratio gives 0.327, p = 0.579, against 0.336 and 0.574. learning_table keeps deposited sessions 7
      to 10 under their own numbers, where the module docstring and BehavOnly.py line 330 renumber sessions
      after 5 by +1. Session 5 is split at a fixed 300 s, while the code uses per-mouse thresholds from
      Session5Split.dict, which is not in the repository; the Methods' "after five minutes" supports 300
      s, and the DLC start time is 0 in all 13 session-5 files. The keep_copy variant counts a duplicated
      recording as an eleventh session; it only serves to match the paper's degrees of freedom and has
      no meaning of its own, but the genotype outcome is the same.
    response: learning_table now renumbers the deposited sessions after 5 by +1, as BehavOnly.py does
      (deposited 7 to 10 are sessions 8 to 11, the copy is session 7 under keep_copy); no test changes.
      The session 5 data check prints the DLC start times (0 s in all 13). Deviations added for the renumbering
      and the per-mouse split times, and the keep_copy variant is described as having no meaning of its
      own. Outcome unchanged.
  - claim: fig1fh-session-effect
    agrees: true
    outcome: reproduced
    reason: The session effect has p of 5.25e-07 or less for all three measures under the auto test (ATS
      0.002 or less). Means over mice rise from session 1 to 2 (for example 48.1 to 90.0 for total, raw)
      and fall in sessions 5 and 6, in every table. The degrees of freedom are 9,99 not 10,110 because
      only 10 distinct sessions are deposited. Only the unjudged "stable after session 7" description
      is affected by the session numbering.
    response: With the renumbering the later sessions are 8 to 11; the notes and the conclusion give their
      means (141.5 to 177.6 total prehensions per 10 min) under those numbers, still not judged. Outcome
      unchanged.
  - claim: prehension-overlap
    agrees: true
    outcome: partially_reproduced
    reason: 'Failed exceeds successful in every session under all 24 readings and variants. At most 1
      of the 10 values is within tolerance; for example, successful in session 1 is 13.9 to 30.6% against
      3.17%. The miniscope DLC gives very few prehensions: six of 28 files have none, 67111 has none in
      sessions 1 and 2, 67110 has 4, 11, 0 and 6, and 67109 alone supplies 322 of the 841 prehensions.
      This is hard to square with the paper analysing PCs for 3 control and 3 Cre+ mice in all four sessions.
      The notebook never checks tracking quality per file, nor which 6 mice the paper used, so the overlap
      magnitudes that fail may reflect detection that does not match the paper''s in this group. A per-file
      table would show it: the fraction of frames with LPaw and LFinger1 likelihood above 0.7, each subject''s
      genotype, and prehensions per genotype and session.'
    response: 'Added the per-file table the verifier asked for (fraction of frames with LPaw, LFinger1,
      both and the pellet above 0.7, genotype, prehensions) with prehensions and mice per genotype and
      session, and the same fractions for the other two groups: both parts are above 0.7 in a median of
      0.2% of miniscope frames against 1.4% and 2.4%, and the median file has 9.7 prehensions per 10 min
      against 66.8 and 117.2. Added a variant leaving out 67109, the overlap per mouse and the mean over
      mice. Failed exceeds successful in every session in 27 of 30 readings and variants (not in the four-body-part
      detection without 67109), and at most 3 of 10 values match in any variant. The notes say the failing
      magnitudes may reflect detection. Which 6 mice the paper used cannot be told from the paper or the
      files. Outcome unchanged.'
  - claim: fig4b-clz-improves-success
    agrees: true
    outcome: reproduced
    reason: In Cre+ mice CLZ beats saline in 5 of 5 mice (reading a, F(1,4) = 19.7, p = 0.011; reading
      b, p = 0.0085). Controls show no effect (p = 0.62 and 0.63). The same holds with the four-body-part
      variant.
    response: No change.
  - claim: fig4d-theta-genotype
    agrees: true
    outcome: not_reproduced
    reason: Under the criterion's test (mixed ANOVA, since Shapiro does not reject) the genotype p is
      0.167 to 0.480 for theta and 0.143 to 0.447 for low theta, 0 of 12 readings, although Cre+ is higher
      in all 12. The accuracy effect also has p > 0.17. The realigned reading is the notebook's own, circular
      and confounded with genotype. The auto test almost always picks the mixed ANOVA (Shapiro with Holm
      over 24 cells of 4 to 6 mice each); the ATS would give a theta genotype p < 0.05 in 7 of 12 readings.
      The criterion and the paper's F(1,8) both point to the ANOVA, so the outcome stands, but it rests
      on that choice.
    response: The outcome is now judged on the files as deposited (theta genotype p 0.235 to 0.480, low
      theta 0.198 to 0.447), with the four mice left out as a variant (p 0.76 or more) and the realigned
      onsets shown only for comparison. The notes and the conclusion say that the ATS alone would give
      a theta genotype p of 0.017 to 0.034 in four of the six deposited readings, so the outcome rests
      on the criterion's choice of test. Outcome unchanged.
