- claim: figs1fg-resolution-robustness
  outcome: not_reproduced
  notebook: reproduce_brudner_2026.ipynb
  output: claim:figs1fg-resolution-robustness
  notes: 'On the dandiset''s complex window (1500 frames), the time-averaged gradient map of sensor pairs
    6, 9 and 12 pixels apart correlates with the 3-pixel map at r = 0.817, 0.703 and 0.613 (0.816, 0.702,
    0.610 in the Otsu mask), against about 0.89 at 12 pixels in Fig. S1F and the criterion''s 0.8; with
    every frame smoothed by a Gaussian of SD 1.5 pixels (a variant) the gradient r is 0.968, 0.911 and
    0.809. The motion maps against the 3-pixel, 1-frame map of the same reading fail under all six readings
    (three cue forms, frames as stored or smoothed): at a 4-frame delay r is 0.729 to 0.820 as stored
    and 0.780 to 0.855 smoothed, below 0.8 at 3 pixels in every reading (the lowest r over delays 1 to
    4 is 0.729 to 0.784), against r near 1 in Fig. S1G. The r at 8 and 15 frames is below the 4-frame
    value at every spacing in every reading. The centered form of the Fig. 1 cue and the two-sensor correlator
    give the same correlations to three decimals; the backward form gives 0.731 to 0.745 at 4 frames as
    stored.'
  deviations:
  - The motion cue for a sensor spacing and a delay is not defined in the paper or its code. Three forms
    were run, the Fig. 1 cue -(dI/dy)(dI/dt) with centered differences and the spacing and the delay widened
    (Fig. S1 column iv is that cue), the same with a backward difference in time, and the correlator A(t
    - tau) B(t) - A(t) B(t - tau) of the SI's motion feature; all fail the criterion.
  - Whether the Fig. S1F-G maps are of smoothed frames is not stated; each map is computed from the frames
    as stored and from frames smoothed by the antennae's Gaussian (SD 1.5 pixels), as the code smooths
    its Fig. 1 cue panels. The motion part fails under both.
  - Maps use every 4th column (432 of 1728), a standard choice that cannot change the result, since the
    cues are crosswind and columns are computed independently; Pearson r is over all those pixels, and
    over the Otsu mask as a variant.
  - Sensor pairs are aligned on the row between them (rows y - floor(d/2) and y + ceil(d/2)), and 6 rows
    are cropped at each edge so maps of every spacing share their pixels.
