- claim: fig2c-complex-auc
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_brudner_2026.ipynb
  output: claim:fig2c-complex-auc
  measured:
  - 0.603
  - 0.560
  - 0.5
  notes: Means over 10 repeats, region mean intensity above 5, mirror-balanced samples (the reading
    recorded under measured). Motion AUC 0.603 (SD 0.006) against 0.618 +/- 0.005, gradient 0.560
    against 0.537 +/- 0.012, sum 0.500 (SD 0). Over the six readings (two regions, three samplings)
    the motion AUC is 0.601 to 0.604 and the gradient AUC 0.552 to 0.566, so motion exceeds the
    gradient under every reading and neither value is within tolerance under any. The sum AUC is
    0.500 under the mirror-balanced sampling and 0.630 to 0.665 under the two samplings the claims
    file names, as the deposited plume is not symmetric about row 590 (the share of locations on
    the right of the centerline is 0.484 and 0.488). Under those two samplings the criterion's sum
    condition fails, which would make the outcome not reproduced; under the mirror-balanced one the
    ordering and the sum hold and the values do not, which is partially reproduced.
  deviations:
  - Assumed that the samples are balanced by mirroring each sample (antennae swapped, label flipped).
    The paper does not say how samples are drawn or balanced. Its Fig. 2B-C and the code's
    published table give a sum AUC of exactly 0.5 with SD 0 over 100 repeats and a sum weight of
    0.000 "as expected" (Results, Plume-Specific Features Predict Centerline Direction, paragraph
    3), which only a sample symmetric under the mirror gives; on the deposited plume the samplings
    the claims file names give a sum AUC of 0.63 to 0.67. The two named samplings are shown.
  - 10 repeats per reading, not the paper's 100; each repeat draws 1000 new locations and 2,400,000
    training and 600,000 test samples, as the SI (Plume movies, Logistic regression models).
  - The two antennae are at rows r and r + 3 of column c, the label is whether r + 1.5 is above row
    590 (SI, centerline of the complex plume), and frames are filtered by a Gaussian of SD 1.5
    pixels before sampling (SI). Which antenna is left is a convention that changes no AUC.
  - The Otsu region is the mask of figs1-antisymmetry-index with the bias of 48 subtracted from the
    Otsu threshold (0.841 of pixels); the region of mean intensity above 5 covers 0.890.
  - The complex window is used as stored (0 to 255). Its provenance names a preprocessing run
    "bgsub_gauss3_fullslice_p001_p99", which may differ from the movie the paper analysed.
