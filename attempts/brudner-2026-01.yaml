- claim: fig5e-cue-betas
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_brudner_2026.ipynb
  output: claim:fig5e-cue-betas
  measured:
  - -0.1114
  - -0.0107
  - -0.0119
  - -0.0124
  notes: 'Measured values are under the code''s readings, as the criterion compares them (files'' turn
    start, 15 mm margin, no z-scoring, complex smoke-2a files, heading 150 to 210 in the complex plume;
    2949 and 1002 turns). There the smooth coefficients are within tolerance (gradient -0.1114, p 0.0008;
    motion -0.0107, p 0.35) and the complex ones are not (motion -0.0119, p 0.15, against +0.0441 +/-
    0.0159; gradient -0.0124, p 0.036, against +0.0185 +/- 0.0161). The significance pattern is tested
    under the criterion''s onset (the SI''s 20% rule, computed from the files'' dtheta in the turn''s
    direction) with the smoke-1a files as the complex plume (assumed). There it fails under every reading
    (0 of 24): the complex motion coefficient has p 0.046 at 160 to 200 degrees and 0.090 at 150 to 210
    (as stored or pooled; 295 and 409 turns), and with per-trajectory z-scoring (complex motion p 0.0046
    and 0.013) the smooth motion coefficient becomes significant (p 0.0079). The smooth part holds under
    the other z-scorings (gradient p below 0.0001, motion p 0.23; 2846 turns, 1011 trajectories). With
    the code''s smoke-2a files the criterion holds in 16 of 24 readings (as stored or pooled) and fails
    per trajectory (complex motion p 0.098 and 0.20), with a negative motion coefficient (-0.028 and -0.024)
    opposite to the published one; both sets together pass none. Within each set the motion coefficient
    has the same sign in flipped and unflipped trials (smoke-1a +0.049 and +0.020, smoke-2a -0.028 and
    -0.030). With the dataset''s turn start, the smoke-1a files pass at 160 to 200 as stored or pooled
    (complex motion p 0.0059, gradient p 0.28; smooth gradient p 0.0008, motion p 0.35) and fail at 150
    to 210 and per trajectory; this reading is within 0.1 SE of the code''s published complex coefficients
    and within 0.001 per turn of its four log-likelihoods. Whether the dataset''s turn start is the SI''s
    onset is asked of a reader (questions/brudner-2026.yaml).'
  deviations:
  - Assumed that the smoke-1a files are the paper's complex plume. The paper does not say which complex-plume
    behavior files it analysed; the dandiset's description says the smoke_1a_orig plume 'was analyzed
    throughout the paper', and the session descriptions of the smoke-1a files name that movie (smoke_1a),
    those of the smoke-2a files another (smoke_2a). The code selects smoke-2a (metadata/published_panel_params.json);
    its published tables are matched by smoke-1a, not smoke-2a. Both alternatives and both sets together
    are shown.
  - Onset is the SI's (the time the rotation in the turn's direction crosses 20% of its peak on the rising
    edge; SI, Behavioral Analysis), as the criterion asks when the dataset's turn start is defined otherwise.
    The files' events start a median of 4 frames after that onset (every 6th file, 15841 turns). The peak
    is searched between the event's start and stop, a standard choice. The first version of this attempt
    followed |dtheta|, whose run went on into rotation the other way in 0.2% of turns; the rule now follows
    the signed rotation. The files' turn start, which the code uses, is shown as a variant.
  - Z-scoring (SI, Behavioral Analysis, which the code does not do) run as none, over all frames of the
    plume group (same p-values) and per trajectory, the claims file's three readings.
  - The predictor is read at the last frame at or before onset minus 50 ms within one frame, after rounding
    the target time to 10 decimals, exactly as the code's merge_asof does. Heading is read at that frame
    and position at the event start (turn_x, turn_y), as the code does.
  - The criterion's other readings (heading window, margin, alpha of 0.05 or 0.01 for not significant)
    are all run; the margin removes no kept turn, as the position filter lies inside it.
- claim: fig5f-cue-dominance
  outcome: partially_reproduced
