findings:
- kind: code_mismatch
  statement: The code's published Fig. 5E and 5F tables (data/published_panel_tables at commit effc7b0)
    are matched most closely by the smoke-1a behavior files with the dataset's turn start and the SI's
    heading window of 160 to 200 degrees (complex coefficients within 0.1 SE, all four log-likelihoods
    within 0.001 per turn), and not by what the code's metadata/published_panel_params.json names, the
    smoke-2a files with 150 to 210 degrees. Those give a Fig. 5E motion coefficient of -0.0119 (p 0.15)
    and gradient coefficient of -0.0124 (p 0.036), and a Fig. 5F cue dominance of +0.388, where the tables
    give +0.0441 (p 0.0055), +0.0185 (p 0.25) and -0.662. A port of the code was used; it was not run
    beside the code here. The smoke-1a files with the SI's onset at 160 to 200 degrees are also close
    (0.45 SE in motion).
- kind: metadata_insufficient
  statement: The complex-plume behavior files come in two sets, 'smoke-1a' (24 files) and 'smoke-2a' (24),
    recorded on the same days and vials, each with 12 flipped and 12 unflipped projections, whose session
    descriptions name two different movies (smoke_1a and smoke_2a) and whose signals differ (99th percentile
    of the intensity 171 and 252; the turn-direction coefficient of motion is positive in one set and
    negative in the other, in both projection flips). Nothing in the files or the dandiset says what smoke_2a
    is; the dandiset's description says the deposited smoke_1a_orig plume was analysed throughout the
    paper, the code selects smoke-2a only, and the Yale Dataverse deposit lists both as complex plume.
    The two sets' intensity layouts across y are not mirrored relative to each other, and the mean gradient
    cue of neither follows its mean intensity profile, so a sign convention differing between the sets
    cannot be ruled out from the files.
- kind: metadata_insufficient
  statement: The turn_events table gives direction as +1 or -1 ("Turn direction label") without saying
    which is left or right, and the heading is described as in "standardized arena coordinates" but is
    atan2(-vy, vx), so y is reversed relative to the heading. Left and right turns cannot be named, which
    the paper's rightward bias towards the projector needs.
- kind: metadata_insufficient
  statement: The turn events are not described. Their start comes a median of 4 frames (about 67 ms) after
    the turn onset the SI defines (20% of the peak rotational speed on the rising edge) and a median of
    1 frame after the crossing of half the peak; they stop a median of 1 frame before the falling crossing
    of half the peak and 4 frames before the falling 20% crossing, and last 5 to 11 frames (all but 8
    of 15841 sampled events 5 to 9). Turn displacements over the events (median about 21 degrees) are
    smaller than the paper's 34 degrees, which the turns bounded by the 20% crossings give.
- kind: metadata_insufficient
  statement: The odor signals in the behavior files cannot be aligned with the deposited complex plume
    window. No file gives the movie frame shown at a trajectory frame or the trial's start in the movie.
- kind: metadata_insufficient
  statement: odor_velocity (the motion cue) is NaN on 95 to 98% of frames, which its description ("estimated
    from frame-to-frame correlation of antenna-segment odor profiles") does not explain; the paper's code
    holds the last value through the gaps.
- kind: metadata_error
  statement: Four smooth-plume files (sessions 2023811 ...4b490d04 and ...ba163898, 2023822 ...93542ebb
    and ...e5c9250e) hold 10 frames with y of 768 to 814 mm, in an arena 170 mm wide.
- kind: metadata_insufficient
  statement: 205 of 7235 trajectories have no position at all (every x and y NaN) and are stored at full
    length, with nothing to say why; in 47 files some trajectories carry timestamps and others a starting
    time and rate.
- kind: data_missing
  statement: The smooth plume movie, used by 15 of the paper's 22 claims (Figs. 1 to 4, S1 to S4 and S5F-H),
    is not in the dandiset. The description points to Dryad (doi:10.5061/dryad.g27mq71), whose downloads
    need an API token; the paper's own rescaled version is in neither the dandiset nor its Yale Dataverse
    deposit.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) Which complex-plume behavior files are the complex
    plume of Fig. 5, smoke-1a, smoke-2a or both, what is the smoke_2a movie, and why does the code name
    smoke-2a and 150 to 210 degrees when its published tables match smoke-1a and 160 to 200? (2) Fig.
    5E-F take cues 50 ms before turn onset, defined in the SI as the 20% crossing of the peak, while the
    code uses the deposited event start, which is later than that crossing on the files' dtheta; which
    was used, and on what turn speed? (3) How were the Fig. 2 and 3 samples balanced; were they mirrored
    (antennae swapped, label flipped), as the sum AUC of exactly 0.5 suggests? (4) Where does a turn end
    for the displacement of Fig. S5C? (5) How is the motion cue of Fig. S1G defined for a sensor spacing
    and a delay, and were the maps of Fig. S1F-G smoothed? (6) Were the Fig. 5 predictors z-scored over
    all frames or per trajectory? (7) Do the smoke-1a and smoke-2a files compute the gradient and motion
    cues with the same sign convention, given that they give complex coefficients of opposite sign?
