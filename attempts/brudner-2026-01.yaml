  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The handover of the author run, the executed notebook with the conclusions and summary
    removed, the helper module and the claims file; the verifier also read the paper under paper/ and
    the archive's file list and dandiset description.
  results:
  - claim: fig5e-cue-betas
    agrees: false
    outcome: not_reproduced
    reason: 'The criterion counts a claim as reproduced only if every reading gives that result; here
      the result depends on the reading. With the SI onset and smoke-2a, both plumes pass with stored
      or pooled z-scored signals; per-trajectory z-scoring fails both plumes. Under the code''s readings
      the complex coefficients have the wrong sign and are out of tolerance. The choice of complex file
      set is doubtful: the archive''s dandiset description says smoke_1a_orig was analyzed throughout
      the paper, and smoke-1a with the event start and heading 160 to 200 reproduces the published Fig.
      5E coefficients almost exactly. The onset rule ignores the sign of the rotation and can run into
      an adjacent opposite-direction turn.'
    response: Changed to not_reproduced. The smoke-1a files are now the assumed complex plume, citing
      the dandiset description and the session descriptions (smoke_1a and smoke_2a movies). The onset
      rule now follows the rotation in the turn's direction; the old rule's run reversed in 0.2% of turns
      and the results barely moved. Added the fits per projection flip (same sign within each set, so
      not a flip convention) and a comparison of every reading with the code's published tables read at
      the pinned commit, which the smoke-1a files with the event start at 160 to 200 match within 0.1
      SE. With the SI onset and smoke-1a no reading passes; with smoke-2a per-trajectory z-scoring fails.
      Asked a reader whether the dataset's event start is the SI's onset (questions/brudner-2026.yaml).
  - claim: fig5f-cue-dominance
    agrees: false
    outcome: reproduced
    reason: 'One reading gives both values within tolerance with the right signs (SI onset, smoke-2a,
      heading 150 to 210, z none or pooled, 0.935 and -0.715); smoke-1a with the event start and heading
      160 to 200 also gives 0.879 and -0.701. The result is fragile: under the code''s readings the complex
      value is +0.388.'
    response: Changed to partially_reproduced, disagreeing with the verifier. With the smoke-1a files
      adopted for fig5e (the verifier's problem 1) and the criterion's onset, the signs hold in 4 of 6
      readings and the two values are never both within tolerance (0.937 and -0.492 at 160 to 200). Both
      readings the verifier names still give both values within tolerance and are reported; the second
      uses the event start, which the criterion does not take as the onset, and is the subject of the
      question to a reader.
  - claim: figs5c-turn-angles
    agrees: true
    outcome: reproduced
    reason: With the files' event bounds, both readings in the claims file give medians of about +/-21
      degrees, outside tolerance. Only the notebook's own turn bounds (20% crossings on the rising and
      falling edges) give -35.0 and +35.9, or -33.1 and +36.6 for the kept turns. That rule has a bug
      (the onset scan ignores the sign of the rotation).
    response: Fixed the rule (signed rotation in the turn's direction) and re-ran; the medians are unchanged
      (-34.3 and +35.2 with smoke-1a, -35.0 and +35.9 with smoke-2a), and the first version's medians
      are shown beside them. Outcome kept, resting on the stated end of the turn.
  - claim: fig2c-complex-auc
    agrees: true
    outcome: partially_reproduced
    reason: Motion AUC is above gradient AUC under every reading. Under the two samplings the claims file
      names, the sum AUC is 0.63 to 0.67, which fails the sum condition; only the added mirror sampling
      gives a sum AUC of 0.500. The assumption is reasonable, but it is the author's own reading; under
      the claims file's readings, fig2c is not_reproduced. The values miss under every reading. Draws
      with replacement put many test windows also in training.
    response: Outcome kept, with the assumption stated and the not_reproduced result under the claims
      file's samplings recorded in the notes. Added a mirror-balanced sampling split by location, so no
      test window is a training window; it gives the same AUCs. Added the centerline at row 571 as a variant
      (motion 0.598, gradient 0.564).
  - claim: fig2e-complex-weights
    agrees: true
    outcome: partially_reproduced
    reason: '|motion| (0.415 to 0.424) is larger than |gradient| under every reading. The gradient weight
      (0.234 to 0.271) is outside 0.098 +/- 0.041 under every reading.'
    response: No change of outcome; re-run with the added samplings and the row 571 variant, which give
      the same outcome.
  - claim: figs1fg-resolution-robustness
    agrees: true
    outcome: not_reproduced
    reason: Gradient r at 12 px is 0.613 without smoothing (0.809 with sigma 1.5 smoothing, a variant).
      Motion r at a 4-frame delay is 0.73 to 0.82 against the required 0.8 at every spacing. The drop
      at 8 and 15 frames does hold. The smoothing variant was run for the gradient only, not for motion.
      The motion cue uses a backward temporal difference, where Fig. 1 uses a centered one.
    response: Added smoothing of every frame for all maps, and a centered form of the motion cue (now
      the main form, with the backward one kept). The motion part fails under all six readings (lowest
      r over delays 1 to 4 of 0.729 to 0.784); the gradient part holds only with smoothing. No change
      of outcome.
  - claim: figs2c-one-frame-delay
    agrees: true
    outcome: blocked
    reason: 'The smooth plume was not read. The complex half holds: AUC at tau 1 is 0.603, at tau 15 is
      0.505, and tau 1 is the highest.'
    response: No change of outcome; the complex part now uses the mirror-balanced samples split by location
      (0.601 at tau 1, 0.505 at tau 15).
  - claim: methods-intensity-right-bias
    agrees: true
    outcome: blocked
    reason: 'The files do not say whether turn direction -1 is left or right. Both conditional outcomes
      can be stated: the smooth intensity coefficient is -0.050 with p below 1e-4, and complex smoke-2a
      is not significant, so the claim holds if -1 is a right turn and fails if not. The notebook did
      not state this.'
    response: 'Added a cell that evaluates the criterion under both mappings, for both complex sets, both
      onsets and two z-scorings: it holds under every reading if -1 is a right turn and fails under every
      reading if +1 is. Stated in the notes; outcome kept blocked.'
