- claim: figs1-antisymmetry-index
  outcome: blocked
  blocked_by: other
  notes: Needs the smooth plume (see fig1il-zscore-reliability); the criterion places the smooth index
    below the 10 cm/s one. The other parts were computed (notebook, Parts of the blocked Fig. S1 claims).
    From the dandiset's deposited freestream maps (mean vertical gradient and motion cue), with Otsu masks
