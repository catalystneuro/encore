- claim: fig5e-cue-betas
  outcome: reproduced
  assumed: true
  notebook: reproduce_brudner_2026.ipynb
  output: claim:fig5e-cue-betas
  measured:
  - -0.1114
  - -0.0107
  - -0.0119
  - -0.0124
  notes: Measured values are under the code's readings, as the criterion compares them (files' turn
    start, 15 mm margin, no z-scoring, complex smoke-2a files, heading 150 to 210 in the complex
    plume; 2949 and 1002 turns kept, the code's own counts on these files). There the smooth
    coefficients are within tolerance (gradient -0.1114, p 0.0008; motion -0.0107, p 0.35) and the
    complex ones are not (motion -0.0119, p 0.15, against +0.0441 +/- 0.0159; gradient -0.0124, p
    0.036, against +0.0185 +/- 0.0161). The criterion's significance pattern depends on the reading.
    Under the adopted one (SI onset, smoke-2a, predictors as stored or z-scored over all frames,
    either heading window and either margin) it holds; smooth gradient p below 0.0001 and motion p
    0.22 (2848 turns, 1011 trajectories), complex motion p 0.0051 (160 to 200, 685 turns) or 0.0057
    (150 to 210, 996 turns) and gradient p 0.14 or 0.26. It fails with the files' turn start (complex
    motion p 0.12 to 0.95), with per-trajectory z-scoring (complex motion p 0.10 and 0.20 with the
    SI onset; smooth gradient p 0.25 with the files' start), and with the smoke-1a and smoke-2a
    files together (no reading passes); the smoke-1a files alone pass in 10 of 24 readings. The
    statement's direction is not tested by the criterion; the complex motion coefficient is
    negative under the adopted reading (-0.028 and -0.024 as stored), opposite in sign to the
    published +0.044 and to Fig. 5E, while the smooth gradient coefficient has the published sign.
  deviations:
  - Assumed the SI's turn onset (the time rotational speed crosses 20% of the peak on the rising
    edge; SI, Behavioral Analysis), as the claims file asks when the dataset's turn start is defined
    otherwise. The files' events start a median of 4 frames after that onset (every 6th file,
    15841 turns); the code uses the files' start. The peak is searched between the event's start
    and stop, a standard choice.
  - Assumed the code's complex files (paths with "smoke-2a"; code summary_tables.py DEFAULT_PLUMES).
    The paper does not say which complex-plume behavior files it analysed; the dandiset has two sets
    recorded on the same days and vials, smoke-1a and smoke-2a, and the Yale Dataverse deposit files
    both as complex plume. Both alternatives are shown.
  - Z-scoring (SI, Behavioral Analysis, which the code does not do) run as none, over all frames of
    the plume group (same p-values) and per trajectory; the adopted reading uses the first two, as
    the SI does not say per trajectory.
  - The predictor is read at the last frame at or before onset minus 50 ms within one frame, after
    rounding the target time to 10 decimals, exactly as the code's merge_asof does.
  - The criterion's other readings (heading window, margin, alpha of 0.05 or 0.01 for not
    significant) do not change the result under the adopted reading.
- claim: fig5f-cue-dominance
  outcome: reproduced
  assumed: true
  notebook: reproduce_brudner_2026.ipynb
  output: claim:fig5f-cue-dominance
  measured:
  - 0.935
  - -0.715
  notes: Under the adopted reading of fig5e-cue-betas (SI onset, smoke-2a files) with the code's
    complex heading window (150 to 210) and the predictors as stored or z-scored over all frames,
    either margin, the smooth dominance is 0.935 and the complex -0.715, both within tolerance
    (0.946 +/- 0.095 and -0.662 +/- 0.066). With the SI's window (160 to 200) the complex value is
    -0.579, negative but outside tolerance. With the files' turn start the complex dominance is
    positive (0.388 under the code's readings, 0.400 with 160 to 200), so the signs fail; under the
    code's readings the smooth value is 0.879, within tolerance. Per-trajectory z-scoring gives
    smooth 0.504 or -0.542. With smoke-2a, the signs hold in 10 of 24 paired readings and both
    values are within tolerance in 4 (all SI onset, 150 to 210). The complex log-likelihoods behind
    the adopted value differ little (full minus base 0.0055 per turn, gradient minus motion -0.0039).
  deviations:
  - The assumptions of fig5e-cue-betas (SI onset, smoke-2a files), on which this outcome rests.
  - The code's four models (VARIANT_FORMULAS) with trajectory-clustered SE; LL is the mean per turn.
    Smooth and complex readings are paired by onset, margin and z-scoring.
- claim: methods-intensity-right-bias
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The files code turn direction as +1 or -1, the sign of the rotational velocity at the
    event's peak (all 15841 turns checked), and describe it only as "Turn direction label". The
    heading is atan2(-vy, vx) (92.5% of moving frames within 30 degrees), so +1 turns are
    counterclockwise in the (x, -y) frame, but whether that is left or right depends on how the
    camera viewed the arena, which the files do not state; nor do they say where the projector mount
    is. The intensity coefficient was estimated (fig5e cell). In the smooth plume it favours the -1
    direction strongly (-0.0497 as stored, p below 0.0001, adopted reading; -0.0506 under the code's
    readings); in the complex plume (smoke-2a) it is near 0 (-0.0001, p 0.95). If -1 is a right
    turn, the claim would hold in the smooth plume and not be contradicted in the complex one.
- claim: figs5c-turn-angles
  outcome: reproduced
  assumed: true
  notebook: reproduce_brudner_2026.ipynb
  output: claim:figs5c-turn-angles
  measured:
  - -35.0
  - 35.9
  notes: All detected turns of both plumes pooled (smooth and smoke-2a, 86450 turns), the integral
    of rotational velocity over the turn bounded by the 20% crossings of its peak, gives medians of
    -35.0 and +35.9 degrees (with both complex sets -35.0 and +35.8; kept turns -33.1 and +36.6), all
    within tolerance of -34.2 +/- 3.42 and +33.8 +/- 3.38. Over the files' events (start to stop,
    5 to 9 frames) the medians are -21.2 and +21.8 (heading change) and -20.8 and +21.3 (integral),
    outside tolerance, and likewise for the kept turns (-19.9 and +21.5; -19.8 and +20.9). By group,
    over the SI-bounded turn, smooth -34.1 and +35.2, smoke-2a -37.6 and +37.7, smoke-1a -35.1 and
    +35.1.
  deviations:
  - Assumed the turn runs from the SI's onset (20% of the peak on the rising edge; SI, Behavioral
    Analysis) to the 20% crossing on the falling edge, the end the paper does not state. The claims
    file's readings integrate over the event; the files' events start after the paper's onset (a
    median of 4 frames), so the paper's turn is taken as the event, bounded as the SI defines its
    onset. Over the files' events neither displacement is within tolerance.
- claim: figs5fh-smoothing-agent
  outcome: blocked
  blocked_by: other
  notes: Agents navigate both plumes, and the smooth plume cannot be read (see fig1il-zscore-reliability);
