    with wind speed and the complex index is above every freestream one. s_gradient is 11.7, 16.2 and
    16.3 and s_motion 1.5, 5.6 and 16.8. The deposited maps scale with the one-pixel cues computed from
    the windows by similar factors, 0.169 to 0.172 for the gradient (r 0.94 to 0.95) and 0.196 to 0.221
    for motion, whose fits are loose (r 0.24 to 0.46), so their ratio is roughly on the scale of the complex
    window's cues.
  notebook: reproduce_brudner_2026.ipynb
- claim: figs1-temporal-statistics
  outcome: blocked
  blocked_by: other
  notes: Needs the smooth plume (see fig1il-zscore-reliability); the criterion compares the smooth medians
