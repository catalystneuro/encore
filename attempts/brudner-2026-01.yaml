- claim: figs1fg-resolution-robustness
  outcome: not_reproduced
  notebook: reproduce_brudner_2026.ipynb
  output: claim:figs1fg-resolution-robustness
  notes: On the dandiset's complex window (1500 frames), the time-averaged gradient map of sensor
    pairs 6, 9 and 12 pixels apart correlates with the 3-pixel map at r = 0.817, 0.703 and 0.613
    (0.816, 0.702, 0.610 in the Otsu mask), against about 0.89 at 12 pixels in Fig. S1F and the
    criterion's 0.8. The motion maps against the 3-pixel, 1-frame map fall to r = 0.731 to 0.745 at a
    4-frame delay for the widened -(dI/dy)(dI/dt) cue and 0.729 to 0.820 for the two-sensor
    correlator, against r near 1 in Fig. S1G, so the motion part fails under both definitions. The
    r at 8 and 15 frames is below the 4-frame value at every spacing (0.52 to 0.56 and 0.35 to 0.37
    for the first cue). With the mean map smoothed by a Gaussian of SD 1.5 pixels (a variant, not
    the code's unsmoothed maps), the gradient r is 0.968, 0.911 and 0.809.
  deviations:
  - The motion cue for a sensor spacing and a delay is not defined in the paper or its code. Two
    definitions were run, the Fig. 1 cue -(dI/dy)(dI/dt) with the spacing and the delay widened
    (Fig. S1 column iv is that cue) and the correlator A(t - tau) B(t) - A(t) B(t - tau) of the SI's
    motion feature; both fail the criterion.
  - Maps use every 4th column (432 of 1728), a standard choice that cannot change the result, since
    the cues are crosswind and columns are computed independently; Pearson r is over all those
    pixels, and over the Otsu mask as a variant.
  - Sensor pairs are aligned on the row between them (rows y - floor(d/2) and y + ceil(d/2)), and
    6 rows are cropped at each edge so maps of every spacing share their pixels.
- claim: fig2b-smooth-auc
  outcome: blocked
