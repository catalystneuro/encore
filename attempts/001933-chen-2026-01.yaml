  - Run on the dandiset's Calb1 dF/F, which differs from the trace behind Supplementary Figure 8.
- claim: cohens-d-anxa1-larger
  outcome: not_reproduced
  notebook: reproduce_chen_2026.ipynb
  output: claim:cohens-d-anxa1-larger
  measured:
  - 2.21
  - 1.40
  notes: Anxa1 d = 2.21 is within tolerance; Calb1 d = 1.40 is not (0.684 to 0.836), and the ratio 1.58 is under the
    factor of 2 the criterion asks. With the code's window, 2.06 and 1.25. The paper's published integrals give 2.06 and
    0.765, so the miss is consistent with the Calb1 dF/F in the dandiset not being the paper's. The Anxa1 effect is
    larger than the Calb1 effect at every power and window that starts by onset (ratio 1.29 to 1.74), so the direction
    of the paper's comparison holds, with a smaller gap.
  deviations:
  - Run on the dandiset's Calb1 dF/F, which differs from the trace behind Supplementary Figure 8.
