findings:
- kind: data_missing
  statement: The Calb1 dF/F in the dandiset is not the trace behind Supplementary Figure 8. None of the 384 published
    Calb1 triggered traces or evoked integrals match it, no epoch of any power matches a published trace, the
    transient counts match for 1 of 12 mice, and dF/F
    recomputed from the deposited raw signal with the published code reproduces the dandiset's series, not the
    paper's, at any single background fraction. The processing the paper used for Calb1 is neither deposited nor
    described, so the Calb1 results of the paper cannot be recomputed from the dandiset.
- kind: data_missing
  statement: The dandiset holds only the fiber photometry of Figure 6 and Supplementary Figures 7 and 8. The imaging,
    proteomics and western blots of Figures 1 to 5 are elsewhere (BioImage Archive, PRIDE, Zenodo), so eight of the
    paper's main findings cannot be tested on it.
- kind: other
  statement: The processed series of mouse 4398 ends 0.8 s after its last onset, a 4 mW stimulation, while the paper's
    trace for that stimulation is complete and differs from the dandiset's in the samples both hold.
- kind: metadata_error
  statement: The OptogeneticEpochsTable description gives 8 ms on and 8 ms off for 500 ms, four powers and trains at
    least 20 s apart. The tables hold eight powers, two kinds of train in Anxa1 files (9 ms pulses every 10 ms for
    0.33 s, and 8 ms every 16 ms for 0.51 s), and pairs of trains 15.3 s apart (51% of gaps under 20 s). One train each
    in mice 4652 and 740 has a pulse length of 0, no period and one pulse.
- kind: other
  statement: Two Anxa1 G2019S mice (3742 and 4885) received the paper's four powers as 0.33 s trains of 9 ms pulses,
    while every other mouse received them as 0.51 s trains of 8 ms pulses. Neither the paper nor the dandiset says so.
    In these two mice the response does not follow the labelled power (in 3742 the 0.5 mW trains give the smallest
    response, median 5.7 against 33.5 % dF/F x s at 0.1 mW), so the data cannot confirm their power labels. Leaving
    the two mice out does not change the Anxa1 result.
- kind: metadata_error
  statement: The dF/F series (FiberPhotometryResponseSeriesDfOverF) is stated in a.u.; its description and its values
    are percent dF/F.
- kind: metadata_error
  statement: The archive's summary of the dandiset lists only a behavioral approach and BehavioralTimeSeries; the files
    hold fiber photometry and optogenetics.
- kind: selection_undocumented
  statement: The dandiset holds the 27 mice the paper kept after excluding four on histology (one Anxa1 G2019S, one
    Calb1 G2019S, two Calb1 WT). It does not say that mice were left out or why.
- kind: code_mismatch
  statement: chunking_index.m computes the start of each window as trigger - fs*ti, so with ti = -1 the window used for
    the evoked integral and for the spontaneous exclusion starts 1 s after onset. The source data show that the
    figures used the intended window starting 1 s before onset; the code as published gives the reverse sign.
- kind: code_mismatch
  statement: plot_results.m selects power code 'h' for Figure 6E, which the lab's stimulation key, as used by the
    conversion, maps to 4 mW; the figure, its legend and the source data are at 0.5 mW.
- kind: code_mismatch
  statement: The Methods and transient_by_threshold.m give the integral of dF/F over each spontaneous transient; the
    published values of Figure 6F and Supplementary Figure 8C are 0.005 times the mean dF/F over each transient, a
    duration-normalized integral. The code that computes them is not in the repository.
- kind: paper_inconsistency
  statement: For the per-mouse comparisons the Methods and the asterisks name Welch's test, the legends give one-tailed
    two-sample t-test p-values, and the code runs a two-tailed Student test. The Figure 6F count of 6 of 8 follows the
    one-tailed Student test; Welch's test gives 7.
- kind: other
  statement: The paper does not cite the dandiset; its data statement names Zenodo, PRIDE and the BioImage Archive.
