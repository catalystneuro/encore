  - Run on the dandiset's Calb1 dF/F, which differs from the trace behind Supplementary Figure 8.
- claim: cohens-d-anxa1-larger
  outcome: not_reproduced
  notebook: reproduce_chen_2026.ipynb
  output: claim:cohens-d-anxa1-larger
  measured:
  - 2.21
  - 1.40
  notes: Anxa1 d = 2.21 is within tolerance; Calb1 d = 1.40 is not (0.684 to 0.836), and the ratio 1.58 is under the
