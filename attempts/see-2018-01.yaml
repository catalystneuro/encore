findings:
- kind: data_missing
  statement: The data set holds the 16 columnar recordings made with the 10-min DMR and RN (Figures 1 to 7, 10 and
    11C to F). It does not hold the 50 repeats of the 5-s segments (Figure 9 and its supplements), the 15 repeats
    of the 10-min RN (Figure 11A, B and the 'repeat' coincidence ratios) or the eight 64-channel recordings with
    spontaneous and evoked epochs (Figure 8), although the paper's data availability statement points to this data
    set for its data.
- kind: metadata_insufficient
  statement: The descriptor does not say that rn1 is the dynamic moving ripple and rn16 the ripple noise (the paper's
    names), that `position` is a pair of a lateral offset and a depth below the surface in um, or whether files
    with the same tip depth (sites 1 and 2, 3 and 4, and so on) are one penetration recorded with both stimuli.
    Their units were sorted separately and cannot be matched.
- kind: format_error
  statement: Two units have spike times out of order, site 4 unit 17 (1 step back of 0.03 ms, 8 repeated times)
    and site 7 unit 21 (28 steps back of up to 0.09 ms, 107 repeated times), against sorted times in the other 653.
- kind: methods_unavailable
  statement: Not fixed by the paper; a question for its authors, so that they can confirm or correct the choice.
    How IC weights were scaled and membership thresholds set. With the Methods' detection, the number of cNEs matches
    the paper (104, 6.5 per recording, R2 0.745 against units), but the cNEs are smaller (4.6 against 7.4 members),
    34% of units belong to none (paper 9%) and 24 cNEs have a negative member (paper 9).
- kind: methods_unavailable
  statement: Not fixed by the paper; a question for its authors, so that they can confirm or correct the choice.
    The lag bin, lag range and any baseline correction of the pairwise correlation functions. The half-count width
    of a 1-ms histogram over +-50 ms gives a median of 12 ms for cNE pairs, not about 2 ms, and the R2 against the
    correlation coefficient is 0.1 to 0.2, not about 0.5.
- kind: methods_unavailable
  statement: Not fixed by the paper; a question for its authors, so that they can confirm or correct the choice.
    The STRF window and resolution, the MI projection bins, and how cNE events are timed for STRFs. With 5-ms bins
    and 20 lags (the data set's sample code), STRF MI over bin sizes peaks at 35 ms or 2 ms depending on how the
    5000 events are taken, not at 10 to 15 ms, and cNE STRF MI exceeds member MI only at p = 0.0015.
- kind: methods_unavailable
  statement: Not fixed by the paper; a question for its authors, so that they can confirm or correct the choice.
    How the STRF PWC of Figure 6 was computed and how its sharpness was measured, given that a cross-correlation
    of temporal profiles has negative values. Subtracting its minimum (assumed here) makes spike PWCs sharper for
    63% of cNE pairs; clipping at zero makes the STRF PWCs 4 ms wide and reverses this. Also the time bin of the
    PR model (5 ms assumed; 10 ms gives a median STRF similarity of 0.645, not 0.74).
- kind: other
  about: paper
  statement: The per-recording cNE pair counts in Supplementary file 1 (Figure 6J and its supplement, 3087 cNE pairs
    in all) exceed the number of member pairs the reported cNE sizes allow if each pair is counted once (for example
    365 cNE pairs in a recording), so the paper may count cNE pairs per ordered pair or per cNE; this attempt finds
    1012 unique pairs.
