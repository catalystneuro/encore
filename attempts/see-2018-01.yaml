- claim: fig5a-mi-peaks-10-15ms
  outcome: not_reproduced
  notebook: reproduce_see_2018.ipynb
  output: claim:fig5a-mi-peaks-10-15ms
  notes: No reading puts the largest MI at 10 or 15 ms. With the 5000 largest 1-ms samples of the interpolated activity
    as events (event reading a), the mean and median MI rise with bin size and peak at 35 ms under both projections
    (mean 0.698 bits linear, 0.730 quadratic), nearly flat from 15 ms. With the 5000 largest local peaks (event
    reading b), MI is highest at 2 ms and falls with bin size. Under reading (a) the 5000 events of a cNE fall in a
    median of 2857 (linear) distinct bins at 2 ms and 230 at 50 ms, so that at large bins the events are runs of
    neighbouring samples. With the STRF estimated on the events of the other half of the stimulus (a check the paper
    does not describe), the MI is a tenth to a fifth as large and still does not peak at 10 or 15 ms; under (a) the
    mean peaks at 5 ms (linear; 0.074 bits against 0.073 at 8 to 15 ms) or 50 ms (quadratic), the median at 50 ms,
    and under (b) at 2 ms. The result rests on the STRF resolution and MI bins, which the paper does not give.
  deviations:
  - cNE detection details the paper does not fix are this attempt's readings, from the claims file's opening comment
    and cne.py (Marcenko-Pastur bound (1 + sqrt(n/T))^2, symmetric fastICA with logcosh, sign reading (a) for membership,
    spikes inside the stimulus period only).
  - STRFs are event- or spike-triggered averages on 5-ms stimulus bins with 20 lags (100 ms), an assumption taken
    from the data set's sample code by the first author (Codes.zip, create_stim_segments_from_stim_mat.m, 'for AI
    cells, and 5 ms bins, nlags = 20 is sufficient'); the paper gives no STRF parameters. MI projection bins (25
    bins over -5 to 5 SD) are a standard choice.
  - Each cNE's 5000 events are taken as its 5000 largest 1-ms activity samples or local peaks, readings of 'a threshold
    such that each cNE had 5000 events' (Materials and methods, STRF mutual information).
