- claim: fig2b-phase-cluster-kuiper
  outcome: reproduced
  notebook: lfp_elliott_2026.ipynb
  output: claim:fig2b-phase-cluster-kuiper
  notes: With the 60 units significant in the seizure windows, the Methods' split by angular
    difference from the polar mode (reading b) gives Kuiper p below 1e-4; this split separates
    the angles by construction, so its test is bound to be significant. The spatial splits give
    p = 0.037 (code thresholds, 32 and 26 units after removing duplicate positions) and 0.11 (k-means
    on position). With the code's spike selection the spatial splits give 0.0042 and 0.0014, and
    with units significant over the whole recording 0.035 to 0.051 (Methods) and 0.0008 to 0.013
    (code). The statement's two spatial groups with different phases are supported at p <= 0.01
    only with the code's spike selection. Whether reading b, which cannot fail, is a reading of
    the paper is asked of a reader.
  deviations:
  - The polar mode is taken from a 36-bin histogram, a standard choice.
