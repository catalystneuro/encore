- claim: ext10-baseline-same-circuit
  outcome: reproduced
  notebook: reproduce_elliott_2026.ipynb
  output: claim:ext10-baseline-same-circuit
  notes: Both baseline recordings are bipolar (S1 R2 0.34 against R1 0.08; S2 0.67 against 0.32),
    with modes 0 and 0 degrees (S1) and 0 and 22 degrees (S2) from the KA recording's modes.
- claim: table3-geometry-test
  outcome: reproduced
  notebook: reproduce_elliott_2026.ipynb
  output: claim:table3-geometry-test
  measured: [19.02, 12.06, 67.59, 5.98, 0.94, 0.44, 3.38, 2.97]
  notes: With y as stored all eight -log10 p are within tolerance; with y flipped 2 of 8. Under both,
    the largest p of S1 and S2 is 400 to 4600 times smaller than the smallest p of S3 to S6.
- claim: ext12-simulation-recurrence
  outcome: blocked
  blocked_by: not_runnable
  notes: The simulation needs NEST with a neuron model compiled by NESTML; the code pins conda
    nest-simulator 3.4 and nestml 5 (environment.yml), which the registry's pip lock cannot provide.
    Tried with PyPI nest-simulator 3.10.0. NESTML 9.0.1 fails to parse the model
    (models/izh_cond_exp2syn.nestml uses the older keyword "neuron"), and NESTML 5 fails against
    NEST 3.10 (nest.ll_api has no sli_func). The sweep itself (275 simulations of 30 s) was not
    timed.
findings:
- kind: data_missing
  about: data
  severity: major
  statement: The raw recordings of slices S5 and S6 (the paper's recordings 7 and 8, 136 and 100
    units) are not in the dandiset. Their sortings fall on the electrode layouts of the sub-3C and
    sub-8D files, but none of those files aligns with their spike times, so the phase locking and
    electrode clustering of the CA1 slices cannot be repeated from the dandiset.
- kind: data_missing
  about: data
  severity: major
  statement: The dandiset holds raw voltage only. The curated spike sortings that every analysis of
    the paper uses are not in it; they are in the paper's GitHub repository, in three formats (acqm
    zips, Phy zips and pickled braingeneers SpikeData objects that need that package or a custom
    reader).
- kind: metadata_insufficient
  about: data
  severity: major
  statement: No file records the experimental condition (baseline, zero magnesium, kainic acid,
    optogenetic stimulation) or when kainic acid was applied; session descriptions are empty and
    there are no epochs, intervals or stimulus series. Which file is the S1 or S2 baseline or KA
    recording can only be found from the sortings, and the latency from KA to seizure-like
    activity cannot be measured.
- kind: metadata_error
  about: data
  severity: minor
  statement: The session start times of all 69 files are the conversion date (2024-09-28), not the
    recording dates (2022 and 2023 in the paper's repository).
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: Subjects are named by slice with patient letters that differ from the paper's (the
    paper's patient A, 52 F, is sub-10F; patient C, 20 M, is sub-1A), electrode locations are all
    "unknown", and the hippocampal region of each slice (dentate gyrus or CA1) is not given.
- kind: selection_undocumented
  about: data
  severity: minor
  statement: Two analysed recordings are parts of longer files. The S1 baseline sorting starts 20.0 s
    into sub-10F-0 and the S4 sorting 30.0 s into sub-9E-2; nothing in the dandiset or the paper
    states the offsets, which were found by aligning spikes with the raw voltage.
- kind: other
  about: data
  severity: none
  statement: Recordings 1 to 6 of the paper are in the dandiset and align exactly with the
    paper's sortings (offset scan peaks 74 to 169 times chance), and with those sortings the
    circuit-pair counts of all eight recordings equal the paper's and the geometry-test p-values
    match Extended Data Table 3.
- kind: other
  about: data
  severity: major
  statement: Four files of one slice, sub-3C-1 to sub-3C-4 (40 s each, same electrodes), may hold
    copies of one recording. In one second of raw data (10 to 11 s, 64 channels) 78 to 82% of
    their samples are identical between every pair, and their sample-to-sample changes correlate at
    0.86 to 0.90; the 24 other pairs of same-length files of a slice share 4 to 8% of samples and
    correlations of -0.01 to 0.01. Whether these are duplicates, or share a large common artifact,
    was not settled. No analysis here uses these files.
- kind: paper_inconsistency
  about: paper
  statement: The Methods state that the STTC matrix is positive semidefinite and interpret its
    eigendecomposition like PCA; the S1 STTC matrix has negative eigenvalues (smallest -2.64).
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. How were bursts and superbursts detected for the counts of 67
    bursts and 11 superbursts (S1) and 47 bursts (S2), and for the 6 to 8 bursts per epoch? Neither
    the paper nor its code defines them; the readings named in the claims file (population-rate
    peaks above twice a pre-KA mean or the mean plus 3 SD, gaps under 5 s) give 124 to 353 bursts
    and 12 epochs in S1.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. Which spike selection produced Extended Data Table 2? The
    Methods keep spikes while the theta envelope exceeds the RMS; the code keeps spikes in theta
    cycles whose peak exceeds the RMS of the envelope. Here the code's selection gives 73 and 107
    phase-locked units in the S1 and S2 seizure windows (70 and 101 reported) and the Methods'
    gives 60 and 104.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. How were the two phase clusters of Fig. 2b formed for the
    Kuiper test? The Methods partition units by their angular difference from the polar mode, which
    makes the angle distributions differ by construction; the code sets position thresholds by
    hand. Was p = 0.01 from a spatial split?
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. How were the onset of seizure-like activity, the stage
    windows, the propagation directions and the rolling waves defined and counted? The paper shows
    them in videos and the code sets times by hand; here the onset was assumed at the first burst
    the code splits into sub-bursts (14.4 s in S1), and plane fits to theta lags did not recover
    distinct initiation and seizure directions.
- kind: other
  about: paper
  statement: The simulation of Extended Data Fig. 12 pins conda nest-simulator 3.4 and nestml 5. With
    the NEST available from PyPI (3.10) neither NESTML 9 (cannot parse the model's syntax) nor NESTML
    5 (calls an API NEST 3.10 removed) compiles the model, so the code does not run outside that
    conda environment.
