inputs:
- what: The curated spike sortings of the eight recordings (Kilosort2 with manual curation; acqm
    zip files, Phy zip files and pickled SpikeData objects under data/ephys), assigned to recordings
    by the latency notebooks under figures/figure_3/latencies/t_test_try30_try3; the hand-set S1
    and S2 seizure and non-seizure windows, sub-burst times (figures/figure_2/burst_peak_comparison.ipynb,
    figures/supplement/seizure_2/seizure2_burst_peaks.ipynb), phase-cluster position thresholds and
    get_raw_data spans quoted in the claims file. Read into memory, not saved.
  source: https://github.com/braingeneers/human_hippocampus at commit 0f83f704ee4c9b4d8d7f75eb53d94f525c85abb2
outcomes:
- claim: sorting-dandiset-link
  outcome: partially_reproduced
  notebook: reproduce_elliott_2026.ipynb
  output: claim:sorting-dandiset-link
  notes: Every unit position of each sorting is an electrode position of one slice's files. The
    offset scan links recordings 1 to 6 to single files with peaks 74 to 169 times the chance level
    (S1 KA sub-10F-6 from 0 s, S1 baseline sub-10F-0 from 20.0 s, S2 KA sub-11G-2, S2 baseline
    sub-11G-4, S3 sub-1A-0, S4 sub-9E-2 from 30.0 s). Recordings 7 (S5) and 8 (S6) match the layout
    of the sub-3C and sub-8D files but no file by time (best ratio 1.3 and 1.4), so their raw
    recordings are not in the dandiset. The same scan run in lfp_elliott_2026.ipynb gives the same
    links. Each sorting file is the one the paper's latency notebook for that recording loads
    (printed with its cell and line). The scan finds the S3 sorting in a 40 s piece of its file
    (ratio 39 at the expected offset), and every sub-3C file is at least 40 s long, so no sub-3C
    file holds a stretch of the S5 recording, alone or joined to the others. The unit counts and
    durations of the linked records are compared in table1-unit-counts.
  deviations:
  - A link claim added by the author, as the claims that use the sortings with the raw voltage need
    the match (protocol, author step 1.4).
- claim: table1-unit-counts
  outcome: not_reproduced
  notebook: reproduce_elliott_2026.ipynb
  output: claim:table1-unit-counts
  notes: Unit counts are 212, 249, 180, 51, 87, 109, 136 and 100, all equal to the paper's. Durations
    of the linked dandiset files are 6.00, 5.22, 8.50, 5.01, 6.97 and 2.67 min for recordings 1 to
    6; recordings 7 and 8 are not in the dandiset. Five recordings match on both units and duration
    (S4's file is 2.67 min against 2.2), where the criterion asks for six. The spans of the sortings
    (6.00, 4.55, 8.50, 5.01, 6.97, 2.17, 6.42, 1.78 min) match all eight durations; the S4 sorting
    covers 30 to 160 s of its file. The failure is a property of the dandiset (two recordings
    missing, one held inside a longer file), not a disagreement with the paper's numbers.
- claim: fig1g-ka-synchronized-bursting
  outcome: not_reproduced
  notebook: reproduce_elliott_2026.ipynb
  output: claim:fig1g-ka-synchronized-bursting
  measured: 40
  notes: Under the four readings (threshold a or b, sigma 10 or 20 ms) the median number of bursts
    per epoch in the first 150 s is 40, 21.5, 22 and 15, and the first epoch holds 4, 2, 3 and 2
    bursts; none is in 5.4 to 8.8. The first epoch starts at 0.73 to 0.90 s, before the paper's
    initiation at 14.4 s; under reading b with sigma 20 the second epoch, which starts at 15.0 s
    near the paper's initiation, holds 7 bursts, but that is not a reading the criterion names.
    The median fraction of units whose rate rises at a burst is 0.49 to 0.53, so the synchrony part
    is borderline. All readings give 12 epochs. Measured is the first reading the criterion lists
    (reading a, sigma 10, median over the first 150 s). Outside the criterion, merging peaks closer
    than 500 ms (the code's S1 sub-bursts are 170 to 180 ms apart) gives a median of 7.5 to 10
    bursts per epoch (7.5 and 8.0 under reading b) and 60 to 83 bursts in S1; whether the
    criterion's 50 ms merge counts sub-bursts as bursts is asked of a reader
    (questions/elliott-2026.yaml).
  deviations:
  - Reading a needs the pre-KA part of the KA recording; no time of KA application is recorded and
    bursting starts within the first second, so the separate baseline recording of the same slice
    (recorded before KA; Results, paragraph 10) is used as the pre-KA reference, and the
    recording's own mean for slices without one.
  - Peaks closer than 50 ms are merged by keeping the higher (scipy find_peaks distance); the
    synchrony window of +-50 ms around a burst is a standard choice.
- claim: methods-burst-counts
  outcome: not_reproduced
  notebook: reproduce_elliott_2026.ipynb
  output: claim:methods-burst-counts
  measured: [353, 12, 344.1, 157, 19.4, 490.8]
  notes: Under every reading S1 has 12 epochs (within tolerance of 11) over 344 s (within tolerance
    of 350) but 124 to 353 bursts against 67; S2 has 89 to 157 bursts against 47, a first epoch of
    19.4 s against 50 s, and bursts over 486 to 491 s against 350. No reading matches all S1 or all
    S2 values. In the first 254 s every reading has 9 epochs where the code lists 8 seizure
    windows, and 90 to 92% of S1 bursts fall in those windows. Measured is reading a, sigma 10.
  deviations:
  - The S2 duration of synchronized bursting is read as the span of its first epoch; the paper
    does not define it.
- claim: methods-rate-increase-after-ka
  outcome: not_reproduced
  notebook: reproduce_elliott_2026.ipynb
  output: claim:methods-rate-increase-after-ka
  measured: [-0.116, -0.1]
  notes: The mean rate per unit falls from the baseline to the KA recording, S1 4.32 to 4.20
    spikes/s (-0.12) and S2 2.38 to 2.28 (-0.10) (reading b); over the bursting period (reading c)
    the change is -0.03 to -0.05 under every burst reading. Reading a cannot be run, as no time of
    KA application is recorded. The KA and baseline sortings were curated separately (212 and 249
    units in S1, 180 and 51 in S2), so the rates are of different unit sets. The statement's
    "neural activity increased" does not hold on these sortings.
  deviations:
  - Reading a of the criterion is not available for lack of the KA application time.
- claim: methods-onset-latency
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_elliott_2026.ipynb
  output: claim:methods-onset-latency
  notes: The criterion needs the time of KA application from the dandiset. The files hold no
    epochs, intervals, annotations or stimulus series, their session descriptions are empty, and
    the session start times are all the conversion date. The first detected burst is at 0.73 to
    0.90 s (S1) and 0.37 s (S2) of the recordings, which bounds the latency only if KA was applied
    at the recording start, which nothing states.
- claim: s4-ka-no-epileptiform
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_elliott_2026.ipynb
  output: claim:s4-ka-no-epileptiform
  notes: With a burst counted as synchronized when more than half of the units rise (the fig1g
    criterion's definition of a synchronous burst), S3 to S6 have no synchronized burst under any
    reading, while S1 has 77 to 138 and S2 89 to 134. S2 has two epochs longer than 10 s (19 s)
    under every reading; S1 has none, its longest epoch lasting 8 to 10 s. The test finds no
    sustained synchronized bursting in S3 to S6, the absence the claim states, and the positive
    control holds for S2 but not for S1, so neither the criterion's reproduced clause (which needs
    S1 too) nor its not-reproduced clause (any of S3 to S6) applies; partially reproduced. At a
    fraction of 0.4, S4 to S6 have 1 to 6 synchronized bursts and no epoch longer than 2 s; at 0.6
    none. With every burst kept (the first version, which dropped "synchronized"), at least three
    of S3 to S6 have epochs longer than 10 s (longest 16 to 418 s), as their bursts raise the rate
    of few units (median fraction 0.15 to 0.34 against 0.49 to 0.74 in S1 and S2). The LFP part of
    the paper's classification is not tested (claims file).
  deviations:
  - Sustained synchronized bursting is read as an epoch (bursts with gaps under 5 s) lasting more
    than 10 s from its first to its last burst, an assumption; the outcome for S1 rests on it.
  - A synchronized burst is one in which more than half of the units fire above their mean rate
    within 50 ms of the peak, from the fig1g criterion ("a burst raises the rate of most units");
    0.4 and 0.6 are shown.
- claim: ext3-onset-spectral-signature
  outcome: reproduced
  assumed: true
  notebook: lfp_elliott_2026.ipynb
  output: claim:ext3-onset-spectral-signature
  notes: The criterion's onset, the first burst of the first epoch, falls at 0.73 to 0.90 s under the
    four burst readings, so only 0.73 to 0.90 s of baseline exists and the 2 s after onset lie
    within the 2 s e-folding half-width of the 0.5 Hz wavelet from the recording's start; these runs
    cannot test the claim, and the criterion fails there at all six electrodes (delta ratios 0.60 to
    1.54, amplitude ratios 0.77 to 1.31). With onset at the paper's initiation burst (14.4 s, 5 s
    baseline), delta power in the 2 s after onset is 2.4 to 5.6 times the baseline at all six
    electrodes and the 0.1 to 100 Hz amplitude 2.09 to 2.97 times, so the criterion holds at three
    of three electrodes under both electrode readings with the broadband amplitude. With onset at
    the first epoch that has 5 s of recording before it, the criterion holds at three of three
    electrodes under burst reading b (onset 14.98 and 15.05 s) and at none or one under reading a
    (13.15 and 13.76 s, isolated bursts before the initiation). The theta amplitude never reaches
    twice the baseline (at most 1.92 times), so the statement's increase in theta amplitude holds
    only weakly. Whether the criterion's onset is the paper's is asked of a reader. The alignment
    of theta with bursts is tested in table2-phase-locking-counts.
  deviations:
  - Assumed onset at 14.4 s, the first burst of S1 as the paper's code sets it (sub-bursts at 14.4 to
    14.91 s) and its figures show it (Extended Data Fig. 4c, baseline at 14.62 s; Fig. 4d,
    initiation from 14.67 s). The criterion's onset, the first burst of the first superburst under
    the fig1g readings, falls at 0.9 s, an event of two bursts at the recording's start, before the
    5 s baseline the criterion asks for.
  - LFP is the 20-sample mean of the raw voltage (1 kHz), then 0.1 Hz high-pass (order 2) and
    100 Hz low-pass (order 5), zero phase; wavelet cmor1-1 from PyWavelets, as the Methods name
    pycwt's.
- claim: fig1j-theta-propagation-stages
  outcome: not_reproduced
  notebook: lfp_elliott_2026.ipynb
  output: claim:fig1j-theta-propagation-stages
  notes: Plane fits to arrival time explain little (R2 0.02 at initiation and 0.05 in the seizure
    stage of S1; 0.02 and 0.31 in S2). The initiation direction is 75 to 79 degrees from the layer's
    long axis in both slices, initiation and seizure directions differ by 4 to 16 degrees, and the
    seizure direction is 151 to 173 degrees from the outward normal (7 to 29 degrees from the
    inward normal, were the hilus on the convex side). In S1 the baseline R2 (0.000 to 0.001) is the
    lowest of the three stages; in S2 it (0.06 to 0.07) is above that of the code's initiation
    window. With a 250 ms S2 initiation window (one theta cycle) the initiation direction is 27
    degrees from the long axis (R2 0.43) but 34 degrees from the seizure direction, outside 60 to
    120. Filter order 4 and 5 give the same. Sign conventions of lag_matrix and plane_direction were
    checked by the verifier on a synthetic travelling wave.
  deviations:
  - Stage windows from the paper's figures and code (S1 initiation 14.4 to 14.91 s, seizure 15.0 to
    28.0 s; S2 initiation 35.208 to 35.302 s, seizure 35.3 to 38.5 s; Extended Data Figs. 4 and 5,
    figures/figure_2/burst_peak_comparison.ipynb, figures/supplement/seizure_2/seizure2_burst_peaks.ipynb,
    printed with cell and line in the notebook). Bursting starts within the first second, so no
    window lies before the first burst; the baselines are stretches free of detected bursts under
    every reading just before initiation, S1 12.0 to 13.0 s and S2 34.45 to 35.2 s.
  - That the hilus lies on the concave side of the fitted layer is an assumption used for the
    outward direction; the other side is shown.
- claim: ext4b-theta-delay
  outcome: not_reproduced
  notebook: lfp_elliott_2026.ipynb
  output: claim:ext4b-theta-delay
  measured: -23
  notes: Along the fitted seizure direction at 200 to 300 um the median lag is -23 ms (IQR -38 to
    -9, 13% positive); at 150 to 250 and 250 to 350 um, -19 and -23 ms. 19 to 34% of lags sit at
    the +-40 ms edge of the window. The sign is opposite to the fitted direction, which fig1j finds
    weakly defined. The reading with the figure's three electrodes could not be run.
  deviations:
  - The electrode spacing (about 200 to 300 um) is read from Extended Data Fig. 4a against its
    500 um scale bar, an approximate reading.
  - The second reading of the criterion (the three electrodes of the figure) was not run; the map
    is drawn over histology without electrode coordinates.
- claim: ext4-electrode-lag-clusters
  outcome: partially_reproduced
  notebook: lfp_elliott_2026.ipynb
  output: claim:ext4-electrode-lag-clusters
  notes: Clusters are coherent beyond all 1000 shuffles in the S1 initiation (0.69 against a shuffle
    maximum of 0.57) and seizure stages (0.90 against 0.52) and in the S2 seizure stage (0.86
    against 0.48), under both filter orders and all five seeds. The S2 initiation window of the code
    (94 ms, shorter than one theta cycle; median lag 0 ms, 0.2% of lags at the window edge) gives
    0.84 against 0.86 and fails; every window of one theta cycle or longer passes under all five
    seeds (250 ms from 35.208 s, 0.92 to 0.93 against 0.64 to 0.65; 500 ms, 0.88 against 0.48; 1 s,
    0.88 against 0.47; 35.0 to 35.5 s, 0.91 against 0.76), with 11 to 22% of lags at the edge. So
    the first part of the criterion holds once the S2 initiation window spans a theta cycle. S3 and
    S4 are less coherent (0.44 each, below their shuffle maxima 0.49 and 0.48), but S5 and S6 have
    no raw recording here, so the second part is shown for 2 of the 4 slices it names; partially
    reproduced under every initiation window. The S1 baseline is not coherent (0.37 against 0.44);
    the S2 baseline is (0.67 against 0.50), where the paper reports no pattern at baseline.
  deviations:
  - Stage windows as in fig1j-theta-propagation-stages; S2 initiation windows of 250 ms, 500 ms and
    1 s from 35.208 s and 35.0 to 35.5 s as variants of the code's 94 ms window; for S3 and S4 the
    8 s window with the most spikes (the paper's segments "with higher than average burst-like
    activity" have no stated length).
  - S5 and S6 not tested (raw recordings not in the dandiset).
- claim: methods-rolling-wave-counts
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: lfp_elliott_2026.ipynb
  output: claim:methods-rolling-wave-counts
  notes: The paper counted rolling waves by watching videos and gives no detector or list of bursts
    investigated. The criterion allows a detector built on the plane fits of
    fig1j-theta-propagation-stages; those fits explain 2 to 5% of the arrival-time variance in S1
    and give initiation and seizure directions within 16 degrees of each other, so a detector built
    on them has no defensible basis. Run as the criterion defines it on S1's first seizure window
    (15 to 28 s), it finds no rolling wave. Of 63 theta cycles none has a plane fit with R2 above
    0.5 (median 0.0023, largest 0.38), though 37 point within 45 degrees of the seizure direction,
    and none of the 7 to 22 bursts there has a rolling wave. Adopting it would give 0 for every
    expected value; it is not adopted. The question is put to the paper's authors (findings).
- claim: fig2a-subbursts-track-theta
  outcome: not_reproduced
  notebook: lfp_elliott_2026.ipynb
  output: claim:fig2a-subbursts-track-theta
  notes: In S1 the cluster difference in firing change is 0.22 then 0.91 Hz (no flip) and the theta
    difference between clusters is 0.24, -0.26 and -0.65 uV over the three sub-bursts. In S2 the
    firing difference flips (3.90 then -7.06 Hz) but the theta difference does not alternate (4.68,
    2.45, -0.76 uV). The S2 initiation clusters come from the code's 94 ms window, which fails the
    coherence test in ext4-electrode-lag-clusters; with the clusters of the 250 ms window the
    firing difference flips (-8.92 then 5.51 Hz) and theta again does not alternate (-7.20, -4.42,
    1.14 uV). The sub-burst times are printed beside their source lines in the code
    (burst_peak_comparison.ipynb cell 5, seizure2_burst_peaks.ipynb cell 7); the S2 sub-bursts last
    26 to 37 ms, a fraction of one theta cycle.
- claim: table2-phase-locking-counts
  outcome: not_reproduced
  notebook: lfp_elliott_2026.ipynb
  output: claim:table2-phase-locking-counts
  notes: With the Methods' spike selection, S1 KA 60 (70 expected) and S2 KA 104 (101); recordings
    2, 4, 5 and 6 give 19, 5, 11 and 3 over the whole recording and 12, 0, 10 and 5 over the code's
    spans (14, 2, 8, 6 expected); 1 or 2 of 6 counts within tolerance, and S1 misses, so the partial
    clause fails too. With the code's cycle selection (variant) S1 73 and S2 107 match, 3 to 4 of 6
    are within tolerance, and over the code's spans the other recordings are below 10% (5.5 to
    8.0%). Recordings 7 and 8 cannot be tested (no raw recording). Spikes shifted within the
    seizure windows give 10 of 212 and 15 of 180 significant, near chance.
  deviations:
  - LFP is the 20-sample mean of the raw voltage (1 kHz) where the paper used its own filtered,
    downsampled pickles.
  - The code's spans are the start and stop times in the names of the LFP files it saved
    (data/ephys_raw at commit 0f83f70, printed in the notebook; the get_raw_data notebooks list
    only some of them). They are in file time (the S4 span 145 to 155 s lies beyond the 130 s
    sorting) and are moved to the sorting's clock by the offsets of the link.
  - Theta is filtered within each window, as the code filters each saved window
    (TJ_phase_locking_basics.ipynb cell 3 line 107, printed in the notebook).
- claim: table2-phase-locking-seizure-vs-not
  outcome: partially_reproduced
  notebook: lfp_elliott_2026.ipynb
