- claim: fig3a-bipolar-angle-histograms
  outcome: partially_reproduced
  notebook: reproduce_elliott_2026.ipynb
  output: claim:fig3a-bipolar-angle-histograms
  notes: S1 and S2 are bipolar (modes 180 degrees apart; R2 0.52 and 0.68 against R1 0.12 and 0.10),
