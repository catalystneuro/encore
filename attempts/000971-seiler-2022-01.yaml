findings:
- kind: data_missing
  statement: The Methods say photometry was recorded during RI30 and on both shock probes, but the
    dandiset holds photometry only for RI60 and RR20 training (62 sessions) and one session described as
    a probe test. The RI30 stage of Figures 3E-F and 4E-F cannot be tested.
- kind: data_missing
  statement: Mice are missing against the paper. 6 RR20 mice against 9 in Figure 1D (7 in the Methods),
    33 DMS excitatory mice against 39, 42 DMS inhibitory mice against 47 in Figure 6F, and 35 DLS
    excitatory mice against 36. Of the photometry RI60 mice, 028.392 and 62.207 have no late probe and
    89.247 and 78.214 no early one; several optogenetic mice lack a late probe.
- kind: data_missing
  statement: The fear conditioning (Figure S1A), open field (Figure S3C-D) and histology (Figures 3C, 4C
    and the probe placements) are not in the dandiset, and the paper says data are available on request.
- kind: metadata_insufficient
  statement: Optogenetic mice have no stored phenotype (the notes read 'Punishment Group nan'), and the
    DMS inhibitory files do not say whether a mouse belongs to group 1 (light from FR1) or group 2 (light
    from RI30). Only two mice carry a 'Did Not Learn' flag, one of them an EYFP control, while the paper
    drops NpHR and NpHR Scrambled mice.
- kind: other
  statement: The 137 files of the group 'Opto-DLS-Excitatory-Unknown' repeat sessions of mice that are also
    deposited under a named arm; 135 share subject and start time with a named file, and those loaded
    here have identical events. They count the same sessions twice if taken at face value.
- kind: metadata_error
  statement: Mouse 290.407 is filed under two experiments, 24 files as DMS excitatory ChR2 Scrambled and
    2 (plus 2 'Unknown') as DLS excitatory ChR2.
- kind: format_error
  statement: In shock probes on the left nosepoke, the reward series is named right_reward_times while
    its times are left nosepokes (151 files).
- kind: format_error
  statement: In the stitched photometry session of 332.393 on 2020-07-28, the reward times are MedPC
    times that coincide with no nosepoke time, while the nosepokes and port entries are TDT times, so
    rewarded nosepokes cannot be identified.
- kind: other
  statement: Several photometry recordings hold dropouts where a raw channel falls near zero (6 sessions
    reach |z| above 50 after the authors' processing, up to 1758), and in one (141.308, 2019-08-09) the DLS
    channels drop out through most of the recording. The dandiset does not mark these or say which
    recordings the paper excluded for artifacts.
- kind: metadata_error
  statement: The fiber photometry table stores the fiber coordinates without the signs the Methods give
    (DV 2.8 for -2.8 and DLS AP 0.1 for -0.1).
- kind: code_mismatch
  statement: The authors' MATLAB code comments call Dv1A the control and Dv2A the GCaMP signal, while the
    conversion and the files take Dv1A as the DMS 465 nm signal. The data side with the files (a larger
    rewarded response as labelled than swapped in 46 of 61 DMS sessions).
- kind: selection_undocumented
  statement: Mouse 048.392 is stored as PR with 13 shocks on its early probe, where the Methods classify
    as PR mice with more than 13, and the Methods call 13 a median split while the median early count of
    the RI60 mice is 9. How the stored labels were assigned is not documented.
- kind: paper_inconsistency
  statement: The Results give omission completion times in seconds (PR 51.50, PS 27.92), but sessions
    last at most 60 minutes and the Methods split omission times at 29 minutes; the data fit minutes. The
    Methods give 26 DMS inhibitory mice and 7 RR20 mice, Figure 6F counts 47 and Figure 1D 9.
- kind: other
  statement: The Zenodo densitometry table the dandiset names holds female samples only, labelled as
    three lanes of one wild-type mouse and four of one heterozygous mouse, while the dandiset's blot images
    include males.
- kind: data_missing
  statement: 20 RR20 training files (mice 96.259, 97.257, 99.257 and 100.258, 2019-04-29 to 2019-05-03)
    hold port entries only, with no nosepoke or reward series, so those sessions' nosepokes and rewards
    are not in the dandiset.
- kind: other
  statement: Several fiber photometry mice have two or three RI60 files on one day (11 mouse-days), most
    a short file of 0 to 7 rewards beside a full session, some not (81.236 on 2019-02-06 has 6, 28 and
    42 rewards). The dandiset does not say which file is the day's training session.
- kind: data_missing
  statement: Figure 6F counts 16 NpHR, 15 NpHR Scrambled and 16 EYFP mice; the dandiset holds 13, 13 and
    16. The mice missing are about the number the paper dropped for not learning, so the dropped mice
    are mostly not deposited, and the 'Did Not Learn' flag marks one NpHR mouse and one EYFP mouse that
    reached RI60.
- kind: other
  statement: In 45 of 64 RR20 training files with rewards, the reward times coincide with no nosepoke
    time, unlike RI60 and FR1 files; the relation of RR20 rewards to nosepokes is not described.
