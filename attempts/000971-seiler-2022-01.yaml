outcomes:
- claim: fig1d-ri60-vs-rr20-shocks
  outcome: not_reproduced
  notebook: reproduce_seiler_2022.ipynb
  output: claim:fig1d-ri60-vs-rr20-shocks
  notes: In the 32 RI60 and 5 RR20 mice with both probes, RI60 mice accept more shocks (early 11.38,
    late 16.31, against 4.80 and 6.60), but the schedule effect has p = 0.071 (F1,35 = 3.46) and the
    interaction p = 0.59. The RI60 rise has paired p = 0.032, 0.063 after Bonferroni correction, where
    the claim needs p < 0.01. Summing a probe day's files gives the same picture. The dandiset holds 6
    RR20 mice (5 with both probes) against 9 in Figure 1D, so the test has little power on the RR20 side.
  deviations:
  - 5 RR20 mice with both probes where the paper has 9, and 32 RI60 mice where it has 36 (4 lack a probe
    in the dandiset).
  - The test is a two-way mixed ANOVA on complete cases, in Python; the paper used Prism.
- claim: fig1e-omission-ri60-longer
  outcome: partially_reproduced
  notebook: reproduce_seiler_2022.ipynb
  output: claim:fig1e-omission-ri60-longer
  notes: RI60 mice take 33.97 min (n = 19) and RR20 mice 17.72 min (n = 4); unpaired t-test p = 0.070,
    Welch p = 0.0005. The direction holds without significance by the paper's test. The RR20 variance is
    251 times smaller than the RI60 one, so the Student and Welch tests disagree.
  deviations:
  - 4 RR20 omission probes in the dandiset against 7 in the paper, and 19 RI60 against 20.
  - Completion time is the time of the 50th reward, or 60 min when fewer were earned; the Methods give
    the 50 reward and 60 min limits but not how incomplete sessions were scored.
