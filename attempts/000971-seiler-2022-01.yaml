- claim: fig3f-dms-score-phenotype
  outcome: not_reproduced
  notebook: reproduce_seiler_2022.ipynb
  output: claim:fig3f-dms-score-phenotype
  notes: Mean DMS score PR 2.35, DPR 1.66, PS 1.05 z, the paper's order, but the phenotype effect has
    likelihood ratio p = 0.100 and neither stage alone is significant (p = 0.124 early, 0.270 late). The
    score rises from early to late (paired p = 0.046, 17 mice; model stage p = 0.088). Without the
    dropout step the phenotype p is 0.389. 51 scores from 34 mice. The mice with a score differ from
    Figure 3E (late PR 4, DPR 7, PS 10 against 5, 6, 13), so the comparison with F2,33 is not like for
    like.
  deviations:
  - Early and late RI60 only; the paper's test also includes RI30, which is not in the dandiset.
  - Channel dropouts are left out (samples below half the channel median, with 1 s around them), a step
    the authors' code does not have; it was added after seeing that dropouts made some session z-scores
    near zero, and after the per-session scores had been seen. The authors' processing without it is
    shown and gives p = 0.389.
  - One DLS recording with dropouts over 10% of samples is excluded, and one session without rewarded
    nosepokes (mixed clocks) has no score.
  - A linear mixed model with a random intercept per mouse replaces Prism's mixed-effects analysis.
