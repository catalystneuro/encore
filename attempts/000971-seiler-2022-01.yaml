- claim: fig5f-dms-chr2-escalation
  outcome: not_reproduced
  notebook: reproduce_seiler_2022.ipynb
  output: claim:fig5f-dms-chr2-escalation
  notes: In the pooled fit no ChR2 slope differs from a control (FR1 interaction p = 0.63 and 0.98, RI30
    p = 0.82 and 0.49), and the pooled FR1 ChR2 slope (0.011) is not above the controls (0.051 and
    0.005). Per-mouse slopes, a variant, put ChR2 above EYFP (p = 0.015) and Scrambled (p = 0.021) in FR1
    but not in RI30. ChR2 mice nosepoke more in RI30 (7.75 against 4.01 and 4.21 per minute). The pooled
    fit mixes mice with 1 to 13 FR1 sessions, which the per-mouse slopes avoid. A mixed model with a
    random intercept and slope per mouse puts the FR1 ChR2 slope above ChR2 Scrambled (p = 0.034) and
    EYFP (p = 0.0075) but not in RI30 (p = 0.68 and 0.70); under that model the rule would give
    partially_reproduced. That FR1 fit converged only after a retry with lbfgs, warns that the MLE may be
    on the boundary and has a random intercept variance near zero, and a model with a random intercept
    only puts ChR2 above neither control (p = 0.46 and 0.33). The criterion fixed the pooled fit before
    the analysis, so the outcome stays.
  deviations:
  - The paper fits a segmental linear regression in Prism; the pooled least squares fit with a group by
    session interaction was chosen before the analysis.
  - 33 DMS excitatory mice in the dandiset where the paper has 39.
