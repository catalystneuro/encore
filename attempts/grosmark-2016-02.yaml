- claim: sessions-and-tracks
  outcome: reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:sessions-and-tracks
  measured:
  - 4
  - 8
  notes: Both datasets hold 4 rats (Achilles, Buddy, Cicero, Gatsby) and 8 sessions, each with PRE, MAZE
    and POST epochs that abut in this order. MAZE is on a 1.6 m linear track in 4 sessions, a 2 m linear
    track in 1 and the circular track in 3, as the Methods give them. Track lengths as linearised are
    1.6 m and 2.0 m for the linear tracks and 2.84 to 2.90 m for the circular one. PRE lasts 2.98 to 5.37
    h and POST 2.22 to 4.51 h.
- claim: place-cell-count
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:place-cell-count
  measured:
  - 573
  - 562
  - 63.0
  notes: The datasets hold 562 pyramidal cells (and 128 interneurons), as the paper states. The place-field
    method of the Methods finds 573 place cells per running direction (442 to 540 expected), 63.0% of
    the 910 pyramidal cells times directions (reading a; 54% expected within 5.4) and 102.0% of the 562
    (reading b). 409 distinct cells have a field in some direction. By session and direction the place
    cells are 19 to 87.
  deviations:
  - The running direction on the linear tracks is the sign of the smoothed 1D velocity, and the lab's
    1D position (defined only while the rat runs along the track) is taken as the track outside the reward
    areas; the paper does not say how direction was assigned. This is an assumption.
  - The 5 cm Gaussian kernel is read as its SD, as the claims file says.
- claim: fig1c-above-chance
  outcome: reproduced
  assumed: true
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig1c-above-chance
  notes: Under the main reading (Y-a, L-a, S-a, D-a) mean rZ is 0.233 in PRE (n 20031), 0.652 in MAZE
    (n 2979) and 0.311 in POST (n 26429), signed-rank p 6.93e-80, 9.63e-105 and 3.25e-211. All 24 readings
    of Y, L, S and D give rZ above zero at p below 1e-12 in every epoch. The time-bin-shuffle variant
    of Figure S22B was not run.
  deviations:
  - 200 null templates per event in place of the paper's 1,000, and 100 cell-specific shuffles per cell
    and event for the PCC in place of 1,000; a full run with 1,000 of each took over an hour for five
    of the eight sessions while preparing, beyond the notebook limit.
  - Offline states (reading S-a) are the lab's NREM, Intermediate and Drowsy epochs in PRE and POST, with
    Drowsy read as quiet waking, and immobility below 5 cm/s on the maze; reading S-b is the automatic
    buzcode NREM scoring held in the NWB files. The paper defines offline states as quiet waking and NREM
    (Methods, Ripple Event Detection) without thresholds. Assumption.
  - LFP ripples are detected on one channel, the one with the highest 150-250 Hz power among the 16 channels
    of the chunk column holding the shank with most pyramidal cells; Hilbert envelope smoothed 8 ms, z-scored
    over NREM. The paper does not describe its detector beyond the band. Assumption.
  - The replay pipeline was run under the claims' seeds only; the five-seed check was not run for it,
    as one run takes 35 minutes.
- claim: fig1c-post-gt-pre
  outcome: reproduced
  assumed: true
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig1c-post-gt-pre
  notes: Mean rZ is 0.311 in POST and 0.233 in PRE under the main reading; Kruskal-Wallis p 8.99e-53 and
    Tukey-Kramer on mean ranks POST above PRE at p < 0.05 under all 24 readings (largest p 3.84e-05),
    and on values under all 24. By animal POST exceeds PRE in all four, significantly in Achilles (+0.155,
    p 8.69e-11) and Cicero (+0.042, p 0.0275) and not in Buddy (+0.076, p 0.259) or Gatsby (+0.052, p
    0.169). Gatsby is rat B in the data set's channel documentation, the animal Figure S6 shows without
    the increase. The POST - PRE change of mean |r| (0.0149) exceeds the null change (0.0046); the bootstrap
    interval of the difference is 0.0078 to 0.0127.
  deviations:
  - 200 null templates per event in place of the paper's 1,000, and 100 cell-specific shuffles per cell
    and event for the PCC in place of 1,000; a full run with 1,000 of each took over an hour for five
    of the eight sessions while preparing, beyond the notebook limit.
  - Offline states (reading S-a) are the lab's NREM, Intermediate and Drowsy epochs in PRE and POST, with
    Drowsy read as quiet waking, and immobility below 5 cm/s on the maze; reading S-b is the automatic
    buzcode NREM scoring held in the NWB files. The paper defines offline states as quiet waking and NREM
    (Methods, Ripple Event Detection) without thresholds. Assumption.
  - LFP ripples are detected on one channel, the one with the highest 150-250 Hz power among the 16 channels
    of the chunk column holding the shank with most pyramidal cells; Hilbert envelope smoothed 8 ms, z-scored
    over NREM. The paper does not describe its detector beyond the band. Assumption.
  - The replay pipeline was run under the claims' seeds only; the five-seed check was not run for it,
    as one run takes 35 minutes.
  - The post hoc test is Tukey-Kramer on mean ranks, the test MATLAB's multcompare applies after kruskalwallis,
    as the Figure 1C legend's "Kruskal-Wallis test, followed by post hoc Tukey-Kramer tests" suggests;
    Tukey-Kramer on the values is shown and agrees.
