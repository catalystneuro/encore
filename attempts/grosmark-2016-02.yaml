  notes: On the events of the replay analysis under the main reading the medians are 180 ms in PRE and
    176 ms in POST, both within tolerance, and the paper's rank-sum test finds the difference (p 0.000531,
    n 12445 and 17118). The yoking reading decides the test; under Y-b p is 0.455 (L-a) and 0.717 (L-b),
