findings:
- kind: other
  about: data
  severity: none
  datasets:
  - '000044'
  - crcns-hc-11
  statement: DANDI 000044 and CRCNS hc-11 hold the same eight sessions. In every session the unit ids,
    the putative cell types, every spike time and the lab's state epochs are identical between the NWB
    files and the sessInfo files, so the two datasets are one recording deposited twice, as both descriptions
    say. The counts (4 rats, 8 sessions, 562 pyramidal cells, 128 interneurons, mazes) agree with the
    paper, and the LFP and position share the spikes' clock.
  notebook: reproduce_grosmark_2016.ipynb
  output: sanity
- kind: metadata_error
  severity: minor
  datasets:
  - '000044'
  - crcns-hc-11
