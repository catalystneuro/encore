  severity: minor
  datasets:
  - '000044'
  - crcns-hc-11
  statement: The paper's offline states are quiet waking and NREM sleep, but the lab's state epochs label Wake,
    Drowsy, NREM, Intermediate and REM, with no quiet waking state, and no movement signal marks immobility outside
    the maze. Which epochs the paper counted as quiet waking is not recorded; this attempt took Drowsy.
- kind: methods_unavailable
  about: paper
  statement: Question for the paper's authors. PRE and POST analyses were "yoked to the duration of the shortest
    of the two epochs", but which part of the longer epoch was kept is not stated (the part nearest the maze, the
    first part of each, or offline time). The figs5e duration test turns on it (p 0.000531 with the parts nearest
    the maze, 0.455 with the first part of each). This attempt assumed the parts nearest the maze.
- kind: methods_unavailable
  about: paper
  statement: Question for the paper's authors. For the PCC and the rigid and plastic split on the linear tracks,
    was each event scored with both direction templates, or assigned to one direction by the decoder of equation
    6? With both, the split gives 120 rigid and 120 plastic cells and 246 strongly contributing cells, 71.7% of
    PRE contributors also contributing in POST; with one, 104, 104, 217 and 54.1%, against the paper's 105, 105,
    216 and 73%. With one direction, rigid-plastic-counts and figs16ab-plastic-synchrony-increase would be reproduced,
    fig2b-strong-contributors partially reproduced and fig2-pre-post-overlap not reproduced. This attempt assumed both, as the Methods' independent analysis of each running direction suggests.
- kind: paper_inconsistency
  about: paper
  statement: The Methods test strongly contributing cells with a one-tailed rank-sum test over the per-event PCC
    scores, while the Figure S19B legend names a one-tailed signed-rank test. A signed-rank test of the PCC against
    zero gives 217 to 249 cells (216 in the paper); a rank-sum test of the events' observed rZ against their cell-shuffled
    rZ gives 13 to 24.
- kind: methods_unavailable
  about: paper
  statement: Question for the paper's authors. The LFP sharp wave-ripple detector (channel, envelope, threshold)
    is not described beyond the 150-250 Hz band of Figure S4. With a 3 SD threshold 34.6% to 58.6% of population
    events hold a ripple (50.6% in the paper); the inter-ripple intervals of Figure S16E (1.21 and 1.06 s) are matched
    by neither a 3 SD nor a 5 SD threshold here.
- kind: methods_unavailable
  about: paper
  statement: 'Question for the paper''s authors. For Figure 2D, the Methods give "place field templates (n = 1,000
    each)": are 1,000 templates with the chosen cells'' fields shuffled averaged for each percentage, or is one
    shuffled template tested against 1,000 null templates? With one shuffled template the replay here is first eliminated
    at 5% of cells; averaged over 100, at 10% under five of the six readings of yoking and direction. This attempt
    averaged over 100.'
- kind: methods_unavailable
  about: paper
  statement: Question for the paper's authors. The place fields are smoothed "with a 5 cm Gaussian kernel"; is 5
    cm the kernel's SD or its width? With the SD (the claims file's reading) the method finds 573 place cells per
    running direction (63.0%), with 5 cm as the full width at half maximum 507 (55.7%), against the paper's 491
    (54%). Carried through the per cell contribution, the width gives 232 strongly contributing cells and 112 rigid
    and 112 plastic cells, against 246 and 120 with the SD and the paper's 216 and 105.
- kind: methods_unavailable
  about: paper
  statement: 'Question for the paper''s authors. Figures 4B and 4C sort cells by their "overall session (SESS) firing
    rates": is this the rate over the whole recording or over the offline states? With the whole recording the slow-cell
    replay of Figure 4C (partial correlation) falls with rate rank only under pooled ranks; with the offline PRE
    and POST rate it falls under both rankings and peaks in slow windows.'
