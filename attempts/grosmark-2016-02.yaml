  statement: On the circular maze the 1D position runs from 0 to 2.84 to 2.90 m. The data description says the rat
    was rewarded at position 0, while the paper linearises from the edge of the 30 cm reward area and excludes it;
    the files do not say whether the reward area is excluded, so the stretch to drop cannot be told. The lap directions
    of the NWB trials table exist only for the linear tracks and are not in the CRCNS sessInfo files.
  notebook: reproduce_grosmark_2016.ipynb
  output: finding-position-rate
