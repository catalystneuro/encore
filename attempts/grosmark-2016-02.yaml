- claim: figs5b-abs-r-above-null
  outcome: reproduced
  assumed: true
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:figs5b-abs-r-above-null
  notes: Observed |r| exceeds the pooled null |r| in PRE (median 0.142 against 0.122), MAZE (0.187 against
    0.124) and POST (0.155 against 0.127) under the main reading, rank-sum p below 1e-18 in every epoch
    under all 24 readings. The POST - PRE change of mean |r| is 0.0149 observed against 0.0046 null; reading
    (a), the bootstrap interval of the difference, is 0.0078 to 0.0125, and reading (b), the 95th percentile
    of the null change, is 0.0056; both hold under all 24 readings. Over the five seeds the interval's
    lower bound is 0.0078 to 0.0080. Compared with each event's own null mean in place of the pooled null
    samples, PRE |r| is not higher (p 1).
