  - crcns-hc-11
  statement: In session Gatsby_08022013 the session duration (sessInfo.Epochs.sessDuration) and the end of the POST
    epoch (in sessInfo and in the NWB epochs table) are 30413.6 s, but 263,976 spikes, the LFP and the lab's own
    state epochs continue to 32002.4 s, about 26 minutes more. An analysis that takes the POST epoch as given drops
