findings:
- kind: metadata_insufficient
  statement: The files carry no figure, cohort, genotype or virus-construct labels; subject metadata is
    a placeholder in every file (age P0D, sex U, no genotype), where the paper used male mice 6 to 8 weeks
    old. Cohorts can be formed only from manuscript_sessions.csv of the export repository the dandiset
    links.
- kind: metadata_error
  statement: The trials tables' times (start_time, side_in_time and the others) are not on the clock of
    the photometry series. They are offset from the trials' own photometry sample indices by a median
    of -4.6 s (range -125 to +1.2 s) and drift within one session. The sample indices land on the port
    onsets of the event channels in every session.
- kind: metadata_error
  statement: In a median of 17% of trials per session (up to 43%, above 10% in 282 sessions) the trials
    table's photometry_center_out_index is after photometry_side_in_index, which cannot happen in the
    task.
- kind: metadata_error
  statement: The trials tables' center_laser and side_laser columns are False in every session, while
    the laser channel of the seven CIN-stimulation sessions has bursts starting at side entry in about
    a quarter of trials.
- kind: data_missing
  statement: Channels whose notes name a sensor have no raw trace in 193 channel-sessions (23 mice) and
    no z-scored trace in 30 (14 mice). This removes the right-hemisphere dLight1.1 of all CIN-stimulation
    mice, the raw traces of the thalamic mCherry mice and of several Drd2 and Fig. 5 mice, and some Ach
    channels.
- kind: metadata_error
  statement: The stored baseline_f0 series is about 0.07 times the raw trace it is described as the dF/F
    baseline of (median ratio over channels), so dF/F0 computed with it is wrong.
- kind: metadata_error
  statement: The sensor field of the channel metadata holds virus codes in S950, S952, S1142 and S1143
    ('279B', '333 + 304'), and three viruses are named only by number ('unknown (virus 216)', 'unknown
    (virus 390)', and 222 in a compound code); 216 is the Chrimson of the CIN-stimulation cohort and 222
    appears to be the TelC of S1142 and S1143, neither stated.
- kind: metadata_insufficient
  statement: Nothing marks the cue-omission sessions of Fig. 1f; the LED channel has onsets in them. They
    are known only from the paper's analysis script.
- kind: data_missing
  statement: The slice amperometry and cell-attached recordings, the histology, the head-fixed optogenetic
    sessions, the stGtACR2 DAN-inhibition sessions and the dLight1.1 ligand-binding mutant are not in
    the dataset. The export table lists 21 mice and 64 sessions that are not in it (for example the six
    Fig. 4 'Chat Dat' mice and two cortical TelC mice).
- kind: selection_undocumented
  statement: Cohorts formed from the export table differ in size from the paper's in several places (Fig.
    1, 14 DA and 16 Ach mice against 13 and 14; jRCaMP1b, 9 against 6; Extended Data Fig. 3, 14 DA mice
    against 7), and the mice of Extended Data Fig. 1 (n = 8) cannot be identified. The table's figure
    labels do not follow the published numbering (EDFig10, EDFig12, EDFig16).
- kind: other
  statement: The high-port reward probability is 0.95 in 180 of 379 sessions and 0.8, 0.85, 0.9 or 1.0
    in the others; the Methods state P(high) = 95%.
- kind: methods_unavailable
  statement: Question for the paper's authors on the GLMs (Extended Data Figs. 5, 6h and 11b,c). Were
    models fitted per session, per mouse, or once over all sessions, and which events were predictors?
    Per mouse puts both base R2 at the reported 0.206 (DA 0.203 to 0.212, Ach 0.215 to 0.226); one model
    over all sessions gives 0.13 to 0.17.
- kind: methods_unavailable
  statement: Question for the paper's authors on Extended Data Fig. 8f. Which DA sensor's dF/F0 amplitudes
    does it show? With dLight1.1 the TelC hemisphere has the larger peak in all 4 mice; with rDAh the
    sign is mixed.
- kind: methods_unavailable
  statement: Question for the paper's authors on Extended Data Fig. 11d. Is the Ach measure delta-Ach
    or the mean z-scored Ach? The code computes both. Delta-Ach does not separate the genotypes; the mean
    does (one value per mouse, p = 0.0005 before side entry, p = 0.0001 after it in rewarded trials, cKO
    highest).
- kind: methods_unavailable
  statement: Question for the paper's authors on the windows of the Supplementary Methods. Is the side-entry
    sample in the 17-sample pre or post window? It decides one claim here (7 against 6 of 14 mice with
    a pre-entry DA difference). And is the bootstrap of conditional switch probabilities (Extended Data
    Fig. 11j) over sessions or trials? Only trials give a significant history.
