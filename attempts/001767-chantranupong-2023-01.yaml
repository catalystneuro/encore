  notebook: reproduce_chantranupong_2023.ipynb
  output: claim:ed3-not-lateralized
  notes: The criterion requires that no DA mouse differ. In rewarded trials 10 of 14 DA mice differ between
    ipsilateral and contralateral trials with T1 p < 0.05 under W1 (7 higher ipsilateral, 3 lower) and
    10 under W2; 6 and 7 in unrewarded trials. The differences are small (median 0.06 z, largest 0.19
