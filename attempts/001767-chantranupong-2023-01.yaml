outcomes:
- claim: link-manuscript-sessions
  outcome: reproduced
  notebook: reproduce_chantranupong_2023.ipynb
  output: claim:link-manuscript-sessions
  notes: All 379 files match a row of the export table by mouse and date (the table lists 443 sessions;
    64 are not in the dataset). 1164 of 1196 channel virus codes (97.3%) equal the table's; the rest are
    compound codes written in one place only and one session of WT65. Each mouse has one genotype label.
    The table's cohorts have the paper's sizes for the Drd2 cohort (12, 7, 8), Fig. 2 (6) and the striatum-wide
    TelC and mCherry mice (5 and 5). Its figure labels do not follow the published numbering (EDFig10,
    EDFig12, EDFig16).
  deviations:
  - Link claim added by the author; the table is the dandiset's own export code, linked from the dandiset
    metadata, at commit f9a4ca95370e8d7451f2a29d81e184dd67a735ca.
- claim: ed1b-switch-after-block-transition
  outcome: reproduced
  notebook: reproduce_chantranupong_2023.ipynb
  output: claim:ed1b-switch-after-block-transition
  notes: On the 26 Fig. 1 mice (121 sessions, 696 transitions), mean P(switch) over mice is 0.175 in the
    10 trials before a transition, 0.216 in the first 10 after it and 0.174 at block positions 20 to 30.
    P(high port) falls to 0.119 at the transition and recovers to 0.793 by position 10; tau_highport is
    2.82 trials for the mean curve and positive in all 26 mice. P(switch) rises after the transition in
    21 of 26 mice.
  deviations:
  - The n = 8 mice of Extended Data Fig. 1 are not identified in the dataset; the Fig. 1 mice are used.
  - Most of these sessions have a high-port probability of 0.85 or 0.9; the Methods state 95%.
  - tau_highport is reported as -1/k of the fit, as in the code's tau_and_error, so that a recovering
    curve gives a positive value.
  - Cohorts are selected by the figure and genotype labels of the export table manuscript_sessions.csv
    (link-manuscript-sessions); the paper selected them from its data folders.
- claim: ed1hj-rflr-predicts-switching
  outcome: not_reproduced
  notebook: reproduce_chantranupong_2023.ipynb
  output: claim:ed1hj-rflr-predicts-switching
  notes: Under reading (a), held-out sessions, and reading (b), all sessions, the model's conditional
    P(switch) is within the binomial s.e. of the mice's for 1 of 8 two-trial histories (Aa). The model
    overestimates AB (0.34 against 0.19 to 0.22) and underestimates aB and ab. Around transitions the
    correlation of model and mouse is 0.970 (a) and 0.986 (b) for P(high port) and 0.803 (a) and 0.918
    (b) for P(switch). With thousands of trials per history the s.e. is 0.002 to 0.03.
  deviations:
  - The RFLR likelihood of bandit_models.py is maximised with Nelder-Mead; the SGD module the code calls
    is not in the repository.
  - Model probabilities are evaluated on the mice's own choice histories (one-step prediction); the code
    samples choices from them.
  - The held-out split is 70/30 by session per mouse, a standard choice; the paper gives none.
  - Fig. 1 mice in place of the 8 mice of Extended Data Fig. 1.
  - Cohorts are selected by the figure and genotype labels of the export table manuscript_sessions.csv
    (link-manuscript-sessions); the paper selected them from its data folders.
- claim: fig1e-reward-outcome-post
  outcome: reproduced
  notebook: reproduce_chantranupong_2023.ipynb
  output: claim:fig1e-reward-outcome-post
  notes: After side entry mean DA is lower in unrewarded trials in 14 of 14 mice with T1 p < 0.05 under
    W1, W2 and the code's window (median -0.80 z, W1), and delta-Ach higher in 12 of 16 mice under each
    (median +0.62 z); 2 mice (W1) and 1 (W2) differ significantly the other way. T2 p < 0.001 for both
    signals.
  deviations:
  - The Fig. 1 cohort has 14 DA and 16 Ach mice where the paper has 13 and 14; the paper's scripts do
    not list their mice, so all mice the export table labels Fig1 are kept.
  - Cohorts are selected by the figure and genotype labels of the export table manuscript_sessions.csv
    (link-manuscript-sessions); the paper selected them from its data folders.
- claim: fig1e-reward-outcome-not-pre
  outcome: reproduced
  notebook: reproduce_chantranupong_2023.ipynb
  output: claim:fig1e-reward-outcome-not-pre
  notes: Before side entry 6 of 14 DA mice differ significantly under W1 and under the code's window,
    all lower in unrewarded trials (median -0.05 z, T2 p = 0.0045), and 7 of 14 under W2, which is not
    fewer than half. For Ach 3 of 16 mice differ under W1 and W2 (2 under the code's window), all opposite
    to the post effect. The outcome takes W1.
  deviations:
  - The window readings disagree for DA (W1 6 of 14, W2 7 of 14 against a rule of fewer than half). Assumed
    W1, in which 'before side entry' excludes the side-entry sample, as the paper's Fig. 1f, Fig. 3 and
    Drd2 scripts do with startDrop = -1; the code's own Fig. 1 window also gives 6 of 14.
  - The Fig. 1 cohort has 14 DA and 16 Ach mice where the paper has 13 and 14; the paper's scripts do
    not list their mice, so all mice the export table labels Fig1 are kept.
  - Cohorts are selected by the figure and genotype labels of the export table manuscript_sessions.csv
    (link-manuscript-sessions); the paper selected them from its data folders.
  assumed: true
- claim: fig1e-lda-accuracy
  outcome: reproduced
  notebook: reproduce_chantranupong_2023.ipynb
  output: claim:fig1e-lda-accuracy
  measured:
  - 51.6
  notes: Reading (a), mean over mice. Post-entry accuracy 0.934 (W1) and 0.935 (W2) for DA, 0.837 and
    0.840 for Ach; pre-entry 0.516 and 0.518 for DA, 0.539 and 0.542 for Ach. Under reading (b), every
    mouse, DA post exceeds 0.80 in all 14 mice (minimum 0.818) and Ach does not (WT59 0.494, WT62 0.660).
    Shuffled labels give 0.49 to 0.54. The measured value is DA pre, W1, reading (a).
  deviations:
  - scikit-learn's LDA with Ledoit-Wolf shrinkage replaces MATLAB's fitcdiscr with hyperparameter optimisation
