- claim: fig2e-reliability
  outcome: not_reproduced
  notebook: reproduce_daste_2025_passive.ipynb
  output: claim:fig2e-reliability
  measured:
  - 18.33
  - 5.52
  - 18.81
  - 1.9
  notes: 'With Bonferroni over the 3 group pairs, both tests hold under no combination of the 16 readings:
    OB-p has more reliable responsive cells per trial than mPFC-p under all of them (corrected p <= 0.0003),
    but not more unreliable ones (smallest corrected p = 0.063, under b, c, e, h). At most one of the
    four percentages is within tolerance under any combination (for example a, c, f, g gives OB-p 7.64%
    unreliable and 16.20% reliable, mPFC-p 8.69% and 12.02%). With Bonferroni over the 2 tests, both tests
    hold under b, c, e, h (unreliable 17.23% against 15.93%, raw p = 0.0211, corrected 0.042), with no
    value within tolerance, which would make the claim partially reproduced. Bonferroni over the 2 tests
    is a reading this attempt added, not one the criterion names. The question of the correction is recorded
    as a finding for the paper''s authors.'
  deviations:
  - The number of comparisons in the Bonferroni correction is not stated for Figure 2E. Assumed 3, the
    pairs of the panel's three groups, as for the other Figure 2 comparisons (for example the latencies
    of Figure 2F); Bonferroni over the 2 tests is shown and gives a different outcome.
  - The reliability rule (a cell responds when its mean 0 to 5 s exceeds the baseline mean plus 2.33 SD)
    is from the Methods; its baseline window, per-trial or pooled baseline, and the 'more than half' denominator
    are the claims file's readings.
  assumed: true
