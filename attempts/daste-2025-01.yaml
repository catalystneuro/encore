  notes: With the code's rule (planes without a red cell skipped), identity has 81 OB-p, 84 mPFC-p and
    1937 untagged neurons from 10 mice and concentration 87, 102 and 2132 from 10 mice, all within tolerance;
    over all planes the identity untagged count is 2328. The Go/NoGo per-session OB-p mean is 103.3 (days
    1 to 3, reading a) or 107.5 (days 0 to 3, reading b), outside 95 +/- 2 under every reading. The mPFC-p
    mean is 91.7 (a) and 94.5 (b) without sub-668, within 87 +/- 8, and 95.7 and 98.2 with it. The untagged
