- claim: fig2e-reliability
  outcome: not_reproduced
  notebook: reproduce_daste_2025_passive.ipynb
  output: claim:fig2e-reliability
  measured:
  - 18.33
  - 5.52
  - 18.81
  - 1.9
  notes: 'With Bonferroni over the 3 group pairs, both tests hold under no combination of the 16 readings:
    OB-p has more reliable responsive cells per trial than mPFC-p under all of them (corrected p <= 0.0003),
    but not more unreliable ones (smallest corrected p = 0.063, under b, c, e, h). At most one of the
    four percentages is within tolerance under any combination (for example a, c, f, g gives OB-p 7.64%
    unreliable and 16.20% reliable, mPFC-p 8.69% and 12.02%). With Bonferroni over the 2 tests, both tests
    hold under b, c, e, h (unreliable 17.23% against 15.93%, raw p = 0.0211, corrected 0.042), with no
    value within tolerance, which would make the claim partially reproduced. Bonferroni over the 2 tests
    is a reading this attempt added, not one the criterion names. The question of the correction is recorded
    as a finding for the paper''s authors.'
  deviations:
  - The number of comparisons in the Bonferroni correction is not stated for Figure 2E. Assumed 3, the
    pairs of the panel's three groups, as for the other Figure 2 comparisons (for example the latencies
    of Figure 2F); Bonferroni over the 2 tests is shown and gives a different outcome.
  - The reliability rule (a cell responds when its mean 0 to 5 s exceeds the baseline mean plus 2.33 SD)
    is from the Methods; its baseline window, per-trial or pooled baseline, and the 'more than half' denominator
    are the claims file's readings.
  assumed: true
- claim: fig2f-latency
  outcome: reproduced
  notebook: reproduce_daste_2025_passive.ipynb
  output: claim:fig2f-latency
  notes: 'Per trial (a): median latency 3.58 s for OB-p and 4.65 s for mPFC-p, corrected p = 3.1e-16;
    OB-p against untagged (3.61 s) corrected p = 1.0; mPFC-p against untagged 2.7e-22. Per neuron (b):
    3.84 against 4.62 s, corrected p = 0.030. By mouse the OB-p medians are 2.70 to 4.96 s and the mPFC-p
    medians 4.59 to 4.79 s. The odor onset (stim_onset_timestamp) falls 1 to 10 ms after a rising edge of
    the files'' sniff signal (acquisition/sniff_on) in all 500 trials, so latencies are measured from a
    sniff-aligned onset, as the paper describes. Projection is confounded with mouse: sub-2456 and sub-2457
    are the only mPFC mice of this dataset, and their untagged neurons are slow too (medians 4.82 and 4.12
    s, against 2.70 to 3.73 s in the OB mice). Within each mouse OB-p is not faster than untagged (2.70
    against 2.70 s, p = 0.55; 3.51 against 2.97 s, p = 0.00034; 4.96 against 3.73 s, p = 8e-16), and mPFC-p
    is as slow as its own mouse''s untagged neurons or slower (4.59 against 4.82 s, p = 0.46; 4.79 against
    4.12 s, p = 0.00065). The criterion pools neurons, so the outcome stands, but the latency difference
    follows the mouse at least as much as the projection. These two mice also supply 61 of the 93 day 3
    Go/NoGo mPFC-p cells.'
  deviations:
  - The first second of each trial is left out by starting the trace 4 s before onset; the trace ends
    15 s after onset, more than a second before the trial's end.
