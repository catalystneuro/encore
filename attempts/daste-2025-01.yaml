findings:
- kind: metadata_error
  statement: 'The imaging rate stated in the ImagingPlane metadata is wrong in 21 files: 30 Hz (concentration
    session of sub-2400) and 50 or 100 Hz (all GNG_2023b sessions) where the plane timestamps give 4.51
    to 4.52 Hz per plane.'
- kind: selection_undocumented
  statement: The Go/NoGo experiment holds 8 mice, 4 OB-tagged and 4 mPFC-tagged, where the paper has 7
    (4 OB-p, 3 mPFC-p). The extra mPFC mouse is presumably sub-668, the only one without tracking identifiers,
    with 24 to 58 cells per session; its day 3 performance (90% correct) passes the paper's exclusion
    threshold of 60%, and nothing in the dandiset says why it is left out.
- kind: selection_undocumented
  statement: The paper's counts are matched only when planes without red cells are left out, as the paper's
    code does; over all planes the identity experiment has 2328 untagged neurons, against 1937 with the
    rule and 1978 in the paper. In sub-164 and sub-8 the plane without red cells nearly repeats plane
    0 (mean-image r = 0.994 and 0.996), consistent with the code's comment about duplicated planes. The
    files do not mark these planes.
- kind: other
  statement: Four identity sessions (sub-8, sub-9, sub-163, sub-164, recorded in 2020) have 80 trials
    of 30 s with odor onset about 10 s into the trial, while the other six have 100 trials of 22 s with
    onset at 5.1 s; the paper describes 22 s trials with a 5 s baseline.
- kind: other
  statement: Under the paper code's criterion, the 46 tracked OB-p neurons come from 3 OB-p mice (sub-664
    contributes none), not 4.
- kind: paper_inconsistency
  statement: The Methods count 18 mice as 9 OB-p and 8 mPFC-p, and the Figure S2B legend has 9 OB-p and
    10 mPFC-p mice; the dandiset has 18 subjects, 10 OB-tagged and 8 mPFC-tagged.
- kind: methods_unavailable
  statement: 'The transformer and MLP hyperparameters and the held-out animal pairs (Tables 5, 6 and 8)
    are missing from the preprint''s text, and the figure analysis code is not yet released, so the projection-classifier
    claims cannot be run. Question for the authors: can Tables 2 to 8 and the analysis code be released?'
- kind: methods_unavailable
  statement: 'Question for the authors: how many comparisons does the Bonferroni correction of Figure
    2E cover? With the 3 group pairs the unreliable-cell difference is not significant under any reading
    tried here; with the 2 tests it is under one (baseline over the 5 s before onset, per-trial baseline,
    reliability over all odor trials, each mouse''s own trials).'
- kind: methods_unavailable
  statement: 'Question for the authors: how do neurons without a defined lifetime sparseness (never active
    in a phase on a day) enter the slope analysis of Figure S10E and the comparison of Figure 2B? Leaving
    them out keeps 16 of 87 tracked neurons; setting their sparseness to 0 or 1 keeps all and changes
    the projection p-value from 0.29 to 0.08 or 0.38.'
- kind: methods_unavailable
  statement: 'Question for the authors: which mice form the Go/NoGo dataset, and is sub-668 excluded?
    The analyses here assume it is. Also, is the 0.7 s window of the response binarization placed at the
    start of each frame or centred on it? Both readings were run and give the same outcomes here.'
- kind: methods_unavailable
  statement: 'Question for the authors: how were the correct-trial pseudo-populations of Figures 4I-J and
    S8E-G built? Matched by CS and order across the 7 mice, day 3 keeps 17, 6, 4 and 3 correct trials per
    CS (77% CS+), and shuffled labels then give 65 to 69% for valence, not the stated 50%. Balancing each
    CS to 3 trials gives a chance near 50% but only 12 trials. The analyses here assume the balanced table.'
