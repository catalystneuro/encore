    out sub-668, an assumption: it is the only Go/NoGo mouse without tracking identifiers and has 24 to
    58 cells per session against 98 to 361 for the others. Its day 3 performance (90%) passes the Methods''
    60% exclusion threshold, so the paper''s stated rule does not exclude it.'
