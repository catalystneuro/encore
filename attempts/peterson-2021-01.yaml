- claim: fig5-recording-day-effects
  outcome: reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:fig5-recording-day-effects
  notes: With the band mean, the per-subject Kruskal-Wallis tests across days agree with the paper on
    all 24 subject and band pairs, the 11 the paper names significant (largest p 0.0331, HFB S07) and
    the 13 others not (smallest p 0.068, HFB S01). With the code's band median, 23 of 24 agree; LFB
    S05 gives p = 0.088. With only segments with missing samples dropped, the same 11 pairs are
    significant.
  deviations:
  - As for fig5-band-power-differs-across-subjects.
- claim: extfig5-1-baseline-reduces-day-variability
  outcome: reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:extfig5-1-baseline-reduces-day-variability
  assumed: true
  notes: Reading a (precentral region per subject), the SD across days of the day means is lower
    with baseline subtraction for 9 of 12 subjects in LFB (median 0.202 against 0.865 dB) and 12 of
    12 in HFB (0.140 against 0.480 dB). Reading b (per good electrode), for 1006 of 1096 electrodes
    in LFB and 988 of 1096 in HFB. Variability remains, as 11 subject and band pairs have significant
    day effects after baseline subtraction (fig5-recording-day-effects).
  deviations:
  - As for fig3-group-lfb-decrease-hfb-increase. Power without baseline is the 10*log10 band power
