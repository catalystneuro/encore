- claim: no-angular-velocity-tuning
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_park_2019.ipynb
  output: claim:no-angular-velocity-tuning
  notes: In 30 Hz samples of stable1, 12 of 115 cells (10.4%) correlate with signed angular velocity
    at p < 0.05 (binomial p = 0.0127 against 5%) and 49 of 115 (42.6%) with unsigned angular
    velocity (binomial p = 5.71e-33). The correlations are small (signed r -0.028 to 0.020,
    unsigned -0.068 to 0.040) and split in sign (6 of 12 and 26 of 49 positive). In 1 s bins 22 and
    78 of 115 are significant. Successive samples are not independent, so per-cell p values are
    optimistic.
  deviations:
  - Assumed, as the claims file states, the measure (Pearson correlation in 30 Hz samples) and the
    binomial test; the paper shows no data and names no test.
- claim: fig4-internal-tuning-preserved
  outcome: not_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig4-internal-tuning-preserved
  notes: Main readings (5 s, cell 2 spikes before cell 1, normalization by the sum of offsets; 142
    of 146 pairs with a curve in every condition). Instability differs across the three trial
    pairs (F(2.00, 282.00) = 9.72, p = 8.27e-05) and between trial pairs and halves (F(3, 564) =
    3.11, p = 0.026); the preference change does not (p = 0.0528, p = 0.303). Mean instability
    0.196 (stable1-stable2), 0.214 (room), 0.156 (arena), 0.187 (halves). In the clean variant,
    without the unit-trials shown wrong in the data check (114 pairs), all four tests have
    p ≥ 0.05 (0.0991, 0.228, 0.227, 0.744). The 30 s, after-side, occupancy and ordered-pair
    variants each have at least one test at p < 0.05.
  deviations:
  - One ordering per pair (cell 1 the first in file order); the paper does not say whether pairs
    are ordered, and the ordered pairs are a variant.
  - Spike and sample times are the sample times (index over rate), so that both share a clock; the
    paper's code mixes spike timestamps with sample times built from the header rate, which drift
    apart by up to about 0.8 s over a trial in these files.
  - For the KLD, the Krichevsky-Trofimov estimate is applied to the histogram counts (the Methods'
    n_i); with the occupancy normalization to the rate curve scaled to the histogram's total.
- claim: fig4c-arena-registration-short-lived
  outcome: partially_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig4c-arena-registration-short-lived
  notes: Main readings. The four conditions do not differ at 3, 4 and 5 s (p = 0.1747, 0.2438,
    0.1703) and do at 10 s (p = 0.0106), and differ at every interval beyond 10 s (p < 0.0001).
    Beyond 10 s both rotating frames lose strength; at 20 to 60 s the room frame is as low as the
    arena frame (Tukey room against arena p = 0.0611 to 0.9176), so the arena frame alone is not
    below the other three. At 300 and 600 s the room frame is below both stable trials (p ≤ 0.0002)
    and the arena frame below the room frame (p = 0.0135, 0.0046). The occupancy and after-side
    variants give the same pattern.
  deviations:
  - Strength is the Rayleigh vector length of the curve, the only reading the claims file gives.
- claim: fig5-error-inhomogeneous
  outcome: partially_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig5-error-inhomogeneous
  measured:
  - 0.172
  - 0.014
  - 0.035
  - 0.276
  notes: Reading (a), seven ensembles pooled, 660 ms. Room-frame error r = 0.172 (n = 13381, p =
