outcomes:
- claim: cell-counts
  outcome: partially_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:cell-counts
  notes: The dataset holds 115 head-direction cells from 13 rats in 44 sessions, the paper's count.
    Per rat the counts match Table S1 except R029 (40 against 41) and R523 (2 against 1). Under the
    paper's head-direction criteria in stable1 (rate below 10 AP/s, Rayleigh and Kuiper tests at
    p < 0.05) 110 of 115 pass (83 with the Rayleigh n taken as 36 bins). The 353 MEC cells and 556
    MEC pairs of Table S1 cannot be counted, as only the head-direction cells are deposited. The 44
    sessions give 146 simultaneously recorded head-direction pairs, against 142 in the Results. The
    two R523 units come from one session recorded on 1 October 2014 and the three 1001R029 units
    from a session of 1 October 2013 (tracker headers); the TSD headers carry no date or rat, so the
    files cannot show where the per-rat difference comes from.
  deviations:
  - Only the head-direction count could be tested; the two MEC counts need cells the dataset does
    not hold.
  - The Rayleigh test of the classification uses the tuning curve's vector with n the number of
    spikes (STAR Methods, Quantifying Head-direction Signals, Directionality, which converts the
    tuning curve's Rayleigh vector to a z statistic without naming n); n = 36 bins is shown as a
    variant. Spike width cannot be applied without waveforms.
- claim: hd-cell-rate
  outcome: reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:hd-cell-rate
  measured: 1.392
  notes: Mean stable1 rate 1.392 AP/s (SEM 0.207, median 0.668, range 0.019 to 13.768, n = 115);
    the mean of the three trials is 1.433 AP/s. Both are within 1.41 ± 0.20. Spike width is not
    tested.
  deviations:
  - Spike width is not tested; no waveforms are in the dataset.
- claim: fig1a-avoidance-learning
  outcome: blocked
  blocked_by: data_missing
  notes: The learning curves come from the pretraining and training sessions. The dataset holds
    only the stable1, rotating and stable2 recording trials of 44 sessions (88 .dat files under
    data/DAT/SA and 88 under data/DAT/RA, each a recording trial), and no training sessions.
- claim: fig1c-speed
  outcome: reproduced
  assumed: true
  notebook: reproduce_park_2019.ipynb
  output: claim:fig1c-speed
  notes: Over 44 sessions the condition effect is significant in every reading (p from 2.9e-15 to
    3.27e-17) and stable2 is lowest (reading a, 10.82 cm/s against 15.3, 14.64 and 15.67 for
    stable1, room and arena), below each other condition at p < 0.0001. In reading (a) with steps
    above 100 cm/s dropped, stable1, room and arena do not differ (repeated-measures Tukey p =
    0.9097, 0.2654, 0.0658; between-groups 0.9628, 0.5485, 0.2733). Without that filter the room
    and arena frames differ at p = 0.0481 (0.2739 with the between-groups Tukey test), and in
    reading (b), 1 s steps, with or without the filter, they differ at p = 0.0058 (0.0768 with the
    between-groups test). So the outcome holds in reading (a) with the filter under either Tukey
    test, and in both readings under the between-groups test; with the repeated-measures test it
    fails in reading (b) and in reading (a) without the filter. The clean variant
    (39 sessions) gives the reading (a) pattern with room against arena p = 0.1020.
  deviations:
  - Assumed, a filter dropping steps faster than 100 cm/s (tracking jumps), which the paper does
    not state (the notebook first called it a standard choice; it is this attempt's assumption);
    the outcome rests on it in reading (a) with the repeated-measures Tukey test, and the unfiltered
    results are shown.
  - Assumed, the post hoc Tukey test uses the error term of the repeated-measures ANOVA, as the
    test that follows a repeated-measures ANOVA (STAR Methods, Statistics); the between-groups
    Tukey test is shown as a variant.
  - 44 sessions, where the paper's degrees of freedom imply about 38; the paper does not say which
    sessions it used.
- claim: fig1c-lfp-power
  outcome: blocked
  blocked_by: data_missing
  notes: No LFP is in the dataset; the zip holds TSD spike files and tracker files only, and the
    data descriptor does not mention LFP.
- claim: fig1c-firing-rate
  outcome: reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig1c-firing-rate
  notes: Repeated-measures ANOVA on rate over stable1, rotating and stable2, F(1.35, 154.10) = 1.76,
    p = 0.184 with the Greenhouse-Geisser correction (Mauchly p = 9.4e-17); the paper gives
    F(1.34, 153.21) = 1.89, p = 0.17. Means 1.392, 1.71 and 1.198 AP/s (rotating - stable1 0.318,
    stable2 - stable1 -0.194); the rotating mean includes one unit at 40.1 AP/s (1001R523 P9C1).
    The clean variant gives p = 0.186. On log rates the trials differ
    (p = 0.00149), a variant the paper does not use.
- claim: fig1c-directionality
  outcome: reproduced
  assumed: true
  notebook: reproduce_park_2019.ipynb
  output: claim:fig1c-directionality
  notes: Directionality differs across the four conditions, F(2.77, 315.60) = 72.66, p = 8.88e-34
    (uncorrected p = 2.23e-36; paper F(3, 342) = 70.36). Means 0.46 (stable1), 0.421 (stable2),
    0.344 (room), 0.17 (arena). With the repeated-measures Tukey test, stable1 = stable2 (p =
    0.2652), stable1 > room (p < 0.0001), stable2 > room (p = 0.0019), room > arena (p < 0.0001).
    With the between-groups Tukey test stable2 against room has p = 0.0553, so the outcome rests on
    the choice; with that test the claim would be partially reproduced. In the clean variant (99 cells) room is below stable1 at p = 0.0407 and not below
    stable2 (p = 0.4225), while arena stays below all (p < 0.0001); the excluded sessions include
    the four whose rotating tracks disagree between frames.
  deviations:
  - Assumed, the post hoc Tukey test uses the error term of the repeated-measures ANOVA (STAR
    Methods, Statistics, and the Figure 1 legend, "ANOVAs on data in (C) and (D) ... with
    repeated-measures, Tukey-Kramer HSD tests"). The paper does not say which error term; each
    cell is measured in every condition, and the within-cell error is the one the ANOVA it follows
    uses. The between-groups Tukey-Kramer test, which ignores the pairing, is shown and gives
    p = 0.0553 for stable2 against room.
- claim: fig1d-preference-change
  outcome: partially_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig1d-preference-change
  notes: Both ANOVAs are significant, three trial pairs F(2.00, 228.00) = 17.80, p = 6.56e-08, and
    the four groups with the halves F(3, 456) = 19.62, p = 5.55e-12. Every trial pair exceeds the
    stable1 halves by Dunnett's test (two-sided p = 0.019, 0.0073, < 0.0001; mean changes 58.1,
    60.3 and 91.3 degrees against 39.5). The Tukey order is stable1-stable2 = stable1-room (p =
    0.9351) < stable1-arena (p < 0.0001), where the legend reads stable1-stable2 = stable1-room >
    stable1-arena. The between-groups Tukey test gives the same order (p = 0.949, < 0.0001,
    < 0.0001). The clean variant gives the same pattern.
  deviations:
  - The two halves of stable1 are its first and second 15 min, as the claims file reads them; the
    half curves have half the data of the trial curves.
  - Dunnett's test is two-sided (the paper does not say); the one-sided p are shown.
- claim: fig1d-instability
  outcome: partially_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig1d-instability
  notes: With KLD from spike counts, the three trial pairs differ (F(1.60, 182.42) = 11.74, p =
    7.22e-05) and the four groups differ (F(3, 456) = 13.74, p = 1.36e-08), but Dunnett's test
    against the halves is significant for stable1-stable2 (p = 0.0044) and stable1-arena
    (p < 0.0001) and not for stable1-room (p = 0.1274; one-sided 0.0637). With KLD from rates, the
    ANOVAs give p = 0.000842 and 0.00256 and only stable1-arena exceeds the halves (p = 0.0008).
    Mean KLD (counts) 0.255, 0.218, 0.348 against 0.159 for the halves.
  deviations:
  - Dunnett's test is two-sided (the paper does not say); the one-sided p are shown.
- claim: fig2-decoding-stable-vs-rotating
  outcome: reproduced
  assumed: true
  notebook: reproduce_park_2019.ipynb
  output: claim:fig2-decoding-stable-vs-rotating
  measured: 7
  notes: Seven sessions have at least five simultaneously recorded head-direction cells (four with
    six, three with five). With 660 ms windows the stable2 error is below the arena-frame error in
    4 of 7 ensembles and below the room-frame error in 5 of 7, by the median and by the mean
    absolute error; 133 ms windows give the same counts. Median errors range 23.2 to 135.3 degrees
    in stable2, 26.7 to 103.0 in the room frame and 79.5 to 115.0 in the arena frame. In 1026R157
    and 1117R157 stable2 decoding is poor (135.3 and 102.0 degrees, at or above the 5 min shifted
    reference; 1.4 and 0.0 degrees from it) and near chance in 1121R157 (11.7 degrees below), where
    the paper reports one ensemble with poor stable2 decoding. Unit 1121R157 P11C2 is left out of
    that session's stable2 decoding, as its stable2 file holds a different, shorter track. The
    count of 4 of 7 below the arena frame needs 1023R029, whose rotating tracks are shown wrong (they
    lag the spikes by up to 1500 samples). In the clean variant, without it, stable2 is below the
    arena frame in 3 of 6 ensembles and below the room frame in 4 of 6, for both measures and both
    windows. The outcome is decided on the files as deposited, as the paper's seven ensembles imply
    it used them, and depends on that session.
  deviations:
  - Assumed, as the claims file states, that "relatively accurate" means a majority, at least four
    of seven ensembles.
  - Windows without any valid direction are dropped during training; the paper's code bins them at
    0 degrees (HD_Max_likelihood.py), which is taken as a defect.
  - Decoded directions are labelled by the start of their 10 degree bin, as in HD_Max_likelihood.py,
    which biases the signed error by about -5 degrees.
- claim: figs2-frame-preference
  outcome: reproduced
  assumed: true
  notebook: reproduce_park_2019.ipynb
  output: claim:figs2-frame-preference
  measured:
  - 4
  - 2
  notes: Of the 16 readings the criterion names, one (45 degree bins, probabilities from the
    rotating trial, the SD of the ensemble's ΔIdir series, no preference when both probabilities
    are below 0.05) gives 4 room-preferring and 2 arena-preferring ensembles. 14 of 16 readings give
    more room- than arena-preferring ensembles; the others give 0 to 5 room and 0 or 1 arena
    ensembles. In the matching reading two ensembles are classed on probabilities near 0.05
    (1117R157 room, p(ΔIdir > 2 SD) 0.0539 against p(ΔIdir < -2 SD) 0.0303; 1121R157 arena, 0.0413
    against 0.0606), so the result depends on the readings. With the margin at 0.04 to 0.05 the
    counts are 4 and 2, at 0.055 or 0.06 3 and 2, at 0.07 3 and 1, at 0.03 5 and 2. The other arena
    ensemble is 1023R029, whose rotating tracks are shown wrong; in the clean variant (six
    ensembles) the matching reading gives 4 room and 1 arena, and no reading gives 4 and 2. The
    outcome is decided on the files as deposited and depends on that session.
  deviations:
  - Assumed, the readings the claims file names for the open details of Idir (direction bins, the
    source of the probabilities, the SD of the 2 SD rule, the margin for no preference); the paper
    does not fix them, and only one of 16 readings gives the reported counts.
  - The SD of the stable1 reading is the SD of the ensemble's summed stable1 Idir series, since
    ΔIdir is zero in a stable trial; the Figure 2C legend gives stable1 Idir for calibration.
- claim: fig2c-proximity-anticorrelation
