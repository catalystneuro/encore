- claim: no-angular-velocity-tuning
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_park_2019.ipynb
  output: claim:no-angular-velocity-tuning
  notes: In 30 Hz samples of stable1, 12 of 115 cells (10.4%) correlate with signed angular velocity
    at p < 0.05 (binomial p = 0.0127 against 5%) and 49 of 115 (42.6%) with unsigned angular
    velocity (binomial p = 5.71e-33). The correlations are small (signed r -0.028 to 0.020,
    unsigned -0.068 to 0.040) and split in sign (6 of 12 and 26 of 49 positive). In 1 s bins 22 and
    78 of 115 are significant. Successive samples are not independent, so per-cell p values are
    optimistic.
  deviations:
  - Assumed, as the claims file states, the measure (Pearson correlation in 30 Hz samples) and the
    binomial test; the paper shows no data and names no test.
- claim: fig4-internal-tuning-preserved
  outcome: not_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig4-internal-tuning-preserved
  notes: Main readings (5 s, cell 2 spikes before cell 1, normalization by the sum of offsets; 142
    of 146 pairs with a curve in every condition). Instability differs across the three trial
    pairs (F(2.00, 282.00) = 9.72, p = 8.27e-05) and between trial pairs and halves (F(3, 564) =
    3.11, p = 0.026); the preference change does not (p = 0.0528, p = 0.303). Mean instability
    0.196 (stable1-stable2), 0.214 (room), 0.156 (arena), 0.187 (halves). In the clean variant,
    without the unit-trials shown wrong in the data check (114 pairs), all four tests have
    p ≥ 0.05 (0.0991, 0.228, 0.227, 0.744). The 30 s, after-side, occupancy and ordered-pair
    variants each have at least one test at p < 0.05. The gap between room (0.214) and arena
    (0.156) that drives the instability test comes with a shift of the displacement histograms, a
    median circular mean of -4.6 degrees in the room frame and 6.3 in the arena frame, against 4.0 in
    stable1. The displacement histograms of the tracker samples alone, with nothing of cell 2, show
    the same shift (-4.8, 6.9, 3.3) and the same order of KLD from stable1 (room 0.068, arena
    0.048, paired p = 7.55e-08), while the valid spike counts of the two frames differ by a median
    of 1.4%. The samples explain the direction of the shift, not the size of the gap. The spike gap
    is about three times the samples-only gap, per pair the two gaps are not correlated (r =
    -0.01), and in the clean pairs the spike gap shrinks to 0.176 against 0.149 while the
    samples-only gap stays at 0.070 against 0.047. What drives the size of the gap is not
    established.
    Under the Methods' normalization by the sum of the time offsets, a single scale factor per
    curve, the KLD, preferred bin and strength are those of the raw displacement histogram.
  deviations:
  - One ordering per pair (cell 1 the first in file order); the paper does not say whether pairs
    are ordered, and the ordered pairs are a variant.
  - Spike and sample times are the sample times (index over rate), so that both share a clock; the
    paper's code mixes spike timestamps with sample times built from the header rate, which drift
    apart by up to about 0.8 s over a trial in these files.
  - For the KLD, the Krichevsky-Trofimov estimate is applied to the histogram counts (the Methods'
    n_i); with the occupancy normalization to the rate curve scaled to the histogram's total.
- claim: fig4c-arena-registration-short-lived
  outcome: not_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig4c-arena-registration-short-lived
  notes: Main readings. The four conditions do not differ at 3, 4 and 5 s (p = 0.1747, 0.2438,
    0.1703) and do at 10 s (p = 0.0106), and differ at every interval beyond 10 s (p < 0.0001).
    Beyond 10 s both rotating frames lose strength; the room frame falls first and is below the
    arena frame at 20 to 40 s (0.378 against 0.438 at 20 s), and at 20 to 60 s the two do not
    differ (Tukey room against arena p = 0.0611 to 0.9176), so the arena frame is not below the
    other three. At 300 and 600 s the room frame is below both stable trials (p ≤ 0.0002) and the
    arena frame below the room frame (p = 0.0135, 0.0046). The criterion's partial outcome needs
    the arena frame to fall below the others beyond 10 s and not before, which fails at 10 s and at
    20 to 60 s, so the claim is not reproduced (changed from partially reproduced after the first
    verification). In the occupancy and after-side variants the arena frame is again not below all
    three others at every interval from 20 to 60 s, but the pattern differs. With occupancy
    normalization the arena frame has a lower mean than the room frame at 40 to 60 s and is below
    all three others at 60 s (Tukey p ≤ 0.0028); with cell 2 spikes after cell 1 the room frame is
    below the arena frame at 20 s (p = 0.0167). The clean variant (112 to 118 pairs) differs already at 3 to 5 s (p = 0.0109, 0.0198, 0.0127) and
    puts the arena frame below the room frame at p < 0.05 only from 60 s (p = 0.0368).
  deviations:
  - Strength is the Rayleigh vector length of the curve, the only reading the claims file gives.
