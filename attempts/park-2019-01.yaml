- claim: fig5c-error-minima-at-cues
  outcome: reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig5c-error-minima-at-cues
  measured:
  - 105
  - 345
  notes: Under reading (a), mean absolute error by room head direction, with the seven ensembles
    pooled and 660 ms windows, the two deepest minima are at 105 and 345 degrees, within 10 of 110
    and 350. They are shallow (63.2 and 63.3 degrees in a range of 63.2 to 91.3). Reading (b), the
