findings:
- kind: data_missing
  statement: The dataset holds only the 115 head-direction cells. The other MEC cells of Table S1
    (353 cells, 556 pairs), the 921 cells of the Gaussian process model, the LFP, the waveforms and
    the pretraining and training sessions are not in it, so the findings of Figures 1A, 1C (LFP),
    S4, S5 and S6 cannot be tested.
- kind: metadata_error
  statement: FileNameList.xlsx misaligns its stable2 column for five units of session 1121R157. The
    rows for SA1 P11C2, P11C3, P11C4, P9C2 and P9C3 list SA2 P11C3, P11C4, P9C2, P9C3 and cl1.P11C2,
    one row off. Its second sheet also names the stable2 files of 1020R035 and 1030R035 as CON
    files, while the files are named SA2.
- kind: other
  about: data
  statement: The rotating-trial spike file of unit 1024R157 P9C1 (RA_rm and RA_ar) holds exactly
    its stable1 spike times (2919 spikes, same timestamps), while the other units of the session
    have distinct rotating spikes, so one of the two files holds the wrong spikes.
- kind: other
  about: data
  statement: The rotating room-frame track of session 1211R039 (RA_rm) is identical to that of
    session 1212R039, and does not agree with its own arena-frame track (the distance from the arena
    centre differs by a median of 22 px, against 0.3 px in other sessions). Its arena-frame TSD
    track matches its own .dat file, so its room-frame TSD files carry another session's track.
- kind: format_error
  statement: In sessions 1009R029, 1015R029, 1023R029 and 1025R029 the room-frame and arena-frame
    tracks of the rotating trial disagree with each other (median 7 to 13 px in distance from the
    arena centre at the best constant lag) and with the session's .dat files, which agree with each
    other. The lag of the TSD tracks behind the .dat track grows through the trial, to about 700
    to 1500 samples in the room frame and half that in the arena frame, so the spikes cannot be
    aligned with both frames. Excluding these sessions changes the room-frame results of the
    paper's directionality and internally referenced tuning comparisons.
- kind: metadata_error
  statement: The stable2 file of unit 1017R035 P11C2 states a sampling interval of 2000 samples/s
    and a first timestamp of 5, against about 30.02 samples/s in every other file; its 54185
    samples and spike times span about 30 min, and 614 of its spikes lie far from the sample that
    holds them.
- kind: other
  about: data
  statement: The stable2 file of unit 1121R157 P11C2 (named cl1) holds 26954 samples, half the
    trial, with a track that differs from the other units of the session.
- kind: metadata_insufficient
  statement: The spike timestamps run ahead of the tracker samples by about 0.05% (about 25 samples,
    0.8 s, by the end of a 30 min trial) when sample times are computed from the header's sampling
    rate and first timestamp; the data descriptor does not say how spike times relate to samples.
- kind: other
  about: data
  statement: Per rat, the dataset's head-direction cells match Table S1 except R029 (40 against 41)
    and R523 (2 against 1), and the 44 sessions give 146 simultaneously recorded head-direction
    pairs, against 142 in the Results.
- kind: methods_unavailable
  statement: Questions for the authors on momentary directional information (Figures 2C, S2, S3),
    which this attempt could not settle from the paper. Which direction bins and which trial's
    probabilities define p(n|d) and p(n) in Idir; which SD the 2 SD rule uses, given that the
    exemplar's p(ΔIdir > 2 SD) = 0.56 exceeds what the SD of the ΔIdir series itself allows; what
    margin defines no frame preference; how relative proximity to the two shock zones is computed;
    and the n of the weighted Rayleigh test of Figure S3. The 16 readings tested give 0 to 5
    room-preferring ensembles, and only one gives the reported 4 and 2.
- kind: methods_unavailable
  statement: Questions for the authors on the statistics and on internally referenced tuning.
    Whether the Tukey-Kramer tests after the repeated-measures ANOVAs use the repeated-measures
    error term (the outcome for Figure 1C directionality depends on it); how speed is computed for
    Figure 1C; whether internally referenced tuning uses ordered pairs, which pairs were dropped
    (the degrees of freedom imply about 130 to 137 of 142), and what "divided by the sum of the
    time offsets" means, since dividing a histogram by one number does not change its shape.
- kind: paper_inconsistency
  statement: The decoding window is 660 ms in the STAR Methods (20 samples in the code, 667 ms at
    30 Hz) and 133 ms in the Figure 2 legend. The arena-frame error z is 289.63 in the Results and
    153.24 and 230.58 in the Figure 5 legend, the values given for the head-direction distributions.
