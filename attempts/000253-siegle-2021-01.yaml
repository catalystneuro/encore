findings:
- kind: metadata_error
  statement: Dandiset 000253 names this paper as IsSupplementTo, but it holds the OpenScope
    Global/Local Oddball experiment (14 mice, oddball gratings, a 1,944-presentation receptive field
    mapping, optotagging) and none of the paper's recordings; it has no full-field flashes, no
    81-location Gabor block of 3,645 presentations and no drifting gratings of 75 repeats. The
    paper's data are in dandisets 000021 and 000022, which its Data availability names.
- kind: metadata_error
  statement: In all 58 sessions of 000021 and 000022 the electrodes table's y and z columns are
    identical on every channel, so one CCF coordinate (left-right) is missing. Distances between
    areas (Extended Data Fig. 7e) cannot be computed.
- kind: other
  statement: The units tables of 000021 and 000022 carry no stimulus metrics (p_value_rf, area_rf,
    mod_idx_dg, firing_rate_dg), which the paper's figure code reads from the AllenSDK. They were
    recomputed from the spike times as the Methods describe; the receptive field, latency and
    modulation results match the paper's.
- kind: data_missing
  statement: The 21 behaviour sessions of Figure 4 (12 mice) are not deposited as recordings in any
    of the three dandisets, and the paper names no deposit; only metric tables are in its GitHub
    repository, so the behavioural performance (hit and false alarm rates) cannot be checked.
- kind: code_mismatch
  statement: The Methods compute the time to first spike within 250 ms, the response decay timescale
    over 0 to 250 ms and the intrinsic timescale over the 1 s before each flash; the paper's scripts
    use 200 ms (get_flash_PSTH.py), 40 to 290 ms and 1.0 to 2.0 s after onset
    (timescale_calculation.py). The paper's timescale table matches the scripts' windows (99.3% and
    99.6% of units within 1%). The windows change the unit counts of Figure 3 (13,347 against 17,167
    after the latency cut) and the pairwise tests of Extended Data Fig. 9h.
- kind: code_mismatch
  statement: The paper's time_to_first_spike.csv does not match latencies recomputed from the
    dandisets with its own script's procedure (first spike from 30 ms within 200 ms, all flashes,
    1 ms bins); 16% of 62,483 units agree within 1 ms, median difference 4 ms, without bias.
- kind: metadata_insufficient
  statement: The layer codes of the paper's layer_info.csv are not described; codes 2 and 4 are
    named L2/3 and L4 in ExtDataFigure10.py, while codes 1, 2 and 3 are also given to CA1, CA2 and
    CA3 units.
- kind: selection_undocumented
  statement: The CCG analyses use 25 mice of the Functional Connectivity set; 000022 holds 26, and the
    one left out is not identified (the code lists internal mouse ids that are not in the files).
    The quality filter of the CCG units is not stated; the paper's pair count is matched with all
    non-noise units, not with the Extended Data Fig. 1j filters.
- kind: methods_unavailable
  statement: Question for the paper's authors - were Figure 3 and Extended Data Figs. 9 and 10 made
    with the Methods' windows (latency within 250 ms; decay timescale over 0 to 250 ms) or the
    scripts' (200 ms; 40 to 290 ms)? The unit counts of Figure 3 match only the scripts', and the
    pairwise decay tests (Extended Data Fig. 9h) and layer differences (Extended Data Fig. 10b)
    depend on it; this attempt assumed the scripts' windows for the counts and the layer
    differences.
- kind: methods_unavailable
  statement: Question for the paper's authors - which units entered the CCG analysis (the
    all_qc_meta files the code reads are not public), which CCG window was used (the 2 s
    presentation or the 3 s with grey), and how the 30 min spontaneous block was cut into trials
