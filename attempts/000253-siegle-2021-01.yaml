    flashes or one half, median or mean) brings more than 14.5% within 1 ms. No script of the repository writes
    the latency table; Figure3/get_flash_PSTH.py reads it and writes a different file. Layer codes 1, 2 and 3 are
    also given to CA1, CA2 and CA3 units; with cortical_depth > 0 only VIS* units remain. ed10b and ed10ce use the
    layer table only, whose ids link fully.
