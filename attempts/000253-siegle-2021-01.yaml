- claim: fig1g-receptive-fields
  outcome: partially_reproduced
  notebook: reproduce_siegle_2021.ipynb
  output: claim:fig1g-receptive-fields
  measured:
  - 0.6068
  - 0.0158
  notes: 26,694 of 43,990 non-noise units of the eight areas (60.7%) have p < 0.01. In CA1, CA3 and DG 415 of 26,289
    (1.58%) do pooled, and 1.71% on the mean over 52 mice; both readings are outside 1.4% +/- 0.14%. The criterion
    names no partial outcome; the 60% holds and the hippocampal fraction is near the paper's but outside its tolerance,
    so the claim holds in part. Without the 10-spike rule 60.8%, 1.61% and 1.74%; with the units without a p-value
    left out of the denominator 67.2%, 1.81% and 1.94%. The fraction in the eight areas is 55.4% at p < 0.001 and
    62.5% at p < 0.02; in the hippocampus 1.03% at p < 0.005 and 2.58% at p < 0.02.
  deviations:
  - The p-value is computed from the spike times as the Methods describe (the AllenSDK value the figure code reads
    is not in the NWB files). Shuffles stop once 10 of them reach the observed statistic, which settles p >= 0.01;
    the threshold decision is the same as with 1,000.
  - As the AllenSDK's ReceptiveFieldMapping (github.com/AllenInstitute/AllenSDK, tag v2.0.0, commit 5200c742, minimum_spike_count=10.0),
    the code the paper names for its stimulus metrics, a unit with fewer than 10 spikes over all Gabor presentations
    has no p-value and counts as not significant, as Figure1g.py counts it. The AllenSDK resamples presentations
    with replacement for its null; the Methods' location shuffles are used.
- claim: link-unit-tables
  outcome: partially_reproduced
  notebook: reproduce_siegle_2021.ipynb
