- claim: foveation-selectivity
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Depends on gaze-aligned-dynamics; needs foveation epochs and landmark onsets.
- claim: fields-per-cell
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The paper's text and legends do not define a positional field (S5B counts peaks); the
