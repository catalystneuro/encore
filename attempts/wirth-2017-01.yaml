findings:
- kind: metadata_insufficient
  datasets:
  - crcns-hc-12
  - crcns-hc-21
  statement: The horizontal and vertical eye signals have no units, calibration or sign convention. They
    are on a +-5000 scale in 36 hc-12 sessions and a +-5 scale in 26, with saturated samples at the bound
    (up to 22% of a session). The paper's point-of-gaze maps, foveation and landmark eccentricity cannot
    be computed, which blocks 11 of the 28 claims and part of a twelfth. The sign used here is inferred
    from the slow phases during turns.
- kind: metadata_error
  datasets:
  - crcns-hc-12
  statement: The descriptor puts the probability of a correct response in the middle column of learning_curves
    and the bounds in columns 1 and 3. In all 187 files column 2 is the lowest and column 3 the highest,
    so the columns are probability, lower bound and upper bound. The field learningtrial, not described,
    is the first trial whose lower bound exceeds 1/4 (-2 when none).
- kind: metadata_error
  datasets:
  - crcns-hc-12
  statement: The descriptor gives the eye positions at 250 Hz; eye_times are 5 ms apart (200 Hz) in every
    file.
- kind: metadata_error
  datasets:
  - crcns-hc-12
  statement: The descriptor says code 43 is the rewarded start arm and code 53 the rewarded chosen arm.
    The arm chosen on rewarded trials is 53 in 32 of 66 sessions and another arm in the rest, as the reward
    moved each day.
- kind: data_missing
  datasets:
  - crcns-hc-12
  statement: Two hc-12 files (sn20121015_HPC_e2_c1a and c1c) have no new-maze (newallo) data, the only
    maze the paper analyses, so 187 of the 189 cells can be analysed.
- kind: data_missing
  datasets:
  - crcns-hc-12
  - crcns-hc-21
  statement: hc-12 holds 12 probe sessions of monkey K and none of monkey S, where the paper reports 15
    and 9; hc-21 holds 8 probe-like sessions, all among K's 12.
- kind: other
  about: data
  datasets:
  - crcns-hc-12
  - crcns-hc-21
  statement: 87 of the 101 hc-21 files hold the same spike trains (same spike count and first five spike
    times) as hc-12 files, under other file names. Neither descriptor says that the two data sets overlap.
- kind: other
  about: data
  datasets:
  - crcns-hc-12
  statement: The files come in seven layouts. The spike times are under file.elec in 175 files and only
    under newallo.elec in 12; camera data are at the top level or under newallo; the camera orientation
    runs from 0 to 360 in some files and -180 to 180 in others. The descriptor gives one layout.
- kind: methods_unavailable
  statement: How were the 5 s chunks of recording "randomly shifted" for the surrogates (their order permuted,
    or each shifted by its own offset), and did the maps include the passive returns after successful
    trials? Significant counts change between these readings (state space 57 or 47 of 186 cells with returns,
    42 or 37 without), sparsity-state-vs-direction holds only with the returns, and state-space-selectivity
    is decided only with permuted chunks.
- kind: methods_unavailable
  statement: Which learning-curve method is reference 60, and how were trials to criterion counted after
    the new entries of probe sessions? The files hold only whole-session curves.
- kind: methods_unavailable
  statement: How is a positional field defined for the count of 2.7 fields per cell, and how was the control
    for the dimensionality of the state space done (S1 Appendix A5)? S1 Appendix was not available to
    this attempt.
- kind: methods_unavailable
  statement: Which three rotational moves enter the state-space selectivity index, and were the two-way
    ANOVA's laps all trials or only successful ones? The residual df of 756 in Fig 5 fits all 193 laps
    of session sn20110624.
- kind: other
  about: data
  datasets:
  - crcns-hc-12
  statement: In 3 of the 12 probe sessions of monkey K the first entries lie on both sides of the rewarded
    arm (for example ke20140306 starts from arms at -72 and +144 degrees from it), and in the other 9
    they lie on one side, clockwise in 2 and counterclockwise in 7. The paper describes probe sessions
    as starting from the northeastern and southeastern entries.
verifications:
