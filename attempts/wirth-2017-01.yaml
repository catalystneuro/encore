outcomes:
- claim: gaze-anticipates-action
  outcome: reproduced
  assumed: true
  notebook: reproduce_wirth_2017.ipynb
  output: claim:gaze-anticipates-action
  notes: Before right turns (code 1) the horizontal eye signal, standardized within session, lies on the
    negative side of that before left turns (code 2) in each monkey, in the 500 and the 300 ms windows,
    for each eye and both eyes, successful or all trials, with rank-sum p below 1e-100. 500 ms, both eyes,
    successful trials, K median difference -0.77 session SD (p = 4.0e-148, 39 of 40 sessions, signed-rank
    across sessions p = 1.3e-11), S -1.00 (p = 4.3e-146, 20 of 20 sessions, p = 1.9e-6). Negative is rightward
    by the slow phases (deviations), so gaze lies on the side of the coming turn. Both monkeys, each window
    and the pooled test agree, so the readings of the criterion give one outcome. In the 500 ms before
    the code the view already rotates slowly toward the turn (median 0.49 to 0.75 degrees, in that direction
    in 95% to 99% of turns), and in K the eye velocity there differs between right and left turns in the
    direction of the slow phases (0.250 against -0.189 session SD, 38 of 40 sessions, p = 2.3e-9); in S
    it does not (9 of 20, p = 0.40). The position effect remains in turns with less than 0.25 degrees
    of rotation before the code (K -0.27 session SD, p = 3.3e-5; S -0.54, p = 0.0059) and less than 1
    degree (K -0.37, S -0.695), where K's velocity difference also remains (0.248, p = 2.6e-10). Part
    of K's position effect may continue an eye movement under way before the window; it is a third to
    a half as large in the low-rotation turns as over all turns. The S2B control (second of two turns)
    was not run.
  deviations:
  - The eye signal has no calibration, units or sign in the files, and is on a +-5000 scale in 36 sessions
    and a +-5 scale in 26. Values are standardized within each session (minus the session median, over
    its SD) before sessions are pooled; per-session differences are also counted and tested across sessions.
  - Assumed that a negative horizontal value is rightward, from the slow phases. During a turn the scene
    flows across the screen opposite to the turn and the slow phases of optokinetic nystagmus and pursuit
    follow it; the median eye velocity from 0 to 600 ms after the code is positive during right turns
    and negative during left turns in 40 of 40 sessions of K and 20 of 20 of S (signed-rank p = 1.8e-12
    and 1.9e-6). This uses the eye velocity only, not the position the claim tests. The mean position
    during the turn moves toward the turn, as it does during optokinetic stimulation.
  - S1 Appendix A2, which holds the paper's analysis, was not available; the test is the rank-sum of the
    claims file.
- claim: gaze-anticipates-landmarks
  outcome: reproduced
  assumed: true
  notebook: reproduce_wirth_2017.ipynb
  output: claim:gaze-anticipates-landmarks
  notes: Passive returns (tags 5xy) turn right when the camera orientation falls over them, as it does
    after code 1. During right-turning returns the standardized eye signal lies on the negative (rightward)
    side in each monkey (all returns, both eyes, K -0.56 session SD, p = 6.2e-58, 39 of 41 sessions, signed-rank
    across sessions p = 1.3e-9; S -0.56, p = 6.4e-30, 20 of 21 sessions, p = 1.9e-6) and after successful
    trials only (p = 4.7e-34 and 1.5e-10). The sign is set by the slow phases during turns at the centre,
    which do not use eye position; the eye velocity over the returns gives the same sign (40 of 41 and
    21 of 21 sessions). The test measures where the eyes are during the return, as the criterion does;
    whether this is anticipation or the eye position that goes with any rotation of the view cannot be
    told apart here. The criterion, which takes the mean over the whole return, does not test the proactive
    part of the claim; this is asked of a reader in questions/wirth-2017.yaml, and the claim is tested
    as the claims file has it.
  deviations:
  - The same standardization and sign as gaze-anticipates-action.
  - The side of a return is taken from the change of camera orientation over it (median absolute change
    102.5 degrees); the files do not say where the landmarks appear.
- claim: learning-trials
  outcome: reproduced
  notebook: reproduce_wirth_2017.ipynb
  output: claim:learning-trials
  measured:
  - 12.26
  - 16.53
  notes: Using the files' own learning curves, the first trial whose lower bound exceeds 1/4 is on average
    12.26 +- 3.28 (SEM, 23 sessions) for monkey S and 16.53 +- 2.69 (38 sessions) for monkey K over all
    sessions (reading a), and 15.82 +- 3.44 for K without the probe sessions (reading b). Both monkeys
    fall within the paper's SEMs under both readings. Two sessions of S and three of K never reach the
    criterion and are left out. The field learningtrial of every session equals this trial.
  deviations:
  - The curves are the files' own; the method of the paper's reference 60 is not named in the text read.
    The columns are read as probability, lower and upper bound, as the values show, where the descriptor
    puts the probability in the middle column.
- claim: learning-to-90
  outcome: reproduced
  notebook: reproduce_wirth_2017.ipynb
  output: claim:learning-to-90
  measured: 0.898
  notes: Of the 59 sessions that reach both the lower bound above 1/4 and the upper bound at 0.9, 53 need
    fewer than 10 trials between them (0.898). Over all 66 sessions the fraction is 0.803, also within
    0.89 +- 0.089, and without the probe sessions 0.898 and 0.815. One session has its upper bound at
    0.9 already at the criterion trial (0 trials); the median is 2 trials and the upper bound at the criterion
    trial has a median of 0.835. Without that session the fraction is 52 of 58 (0.897).
  deviations:
  - The denominator is not stated; the fraction is given over the sessions reaching both criteria and
    over all sessions, and both match.
- claim: probe-transfer
  outcome: not_reproduced
  notebook: reproduce_wirth_2017.ipynb
  output: claim:probe-transfer
  measured:
  - 58.3
  - 28.3
  notes: 'hc-12 holds 12 probe sessions of monkey K (the paper reports 15) and none of monkey S (the paper
    reports 9); the 8 probe-like sessions of hc-21 are among the 12. For K, 28.3% correct over the first
    5 trials and 58.3% over the 5 trials after the new entries, both below the paper''s 44% and 73% by
    more than the tolerance; Wilcoxon signed-rank over the 12 sessions p = 0.072 (median gain 0.30). The
    first entries lie on one side of the rewarded arm in 9 sessions (clockwise in 2, counterclockwise
    in 7) and on both sides in 3, where the paper describes northeastern and southeastern entries. No
    variant brings both means within tolerance: the first 5 trials from a new entry give 60.0% (p = 0.057);
    the 9 one-sided sessions give 15.6% and 62.2% (p = 0.023); the 5 sessions whose introduction comes
    after trial 20 give 16.0% and 64.0% (p = 0.125). The two values of monkey S could not be computed;
    the criterion fails on K''s values alone.'
  deviations:
  - Probe sessions are found from the start arms (the first 10 trials use one or two entries and later
    ones others), as the files do not mark them. The introduction is the first trial from an entry not
    used in the first 10 (S3C legend); the variants are shown.
  - The measured values are monkey K's, after and at the start; monkey S has no probe session in the data.
- claim: probe-faster-criterion
  outcome: blocked
  blocked_by: methods_underspecified
  notes: Counting trials to criterion from the introduction of the new entries needs learning curves recomputed
    on part of the session, with the confidence bounds of the paper's reference 60, which the text read
    does not name (S3B legend, "methods based on [60]"). The files hold only whole-session curves. Any
    other curve method would set the criterion differently. hc-12 also holds no probe session of monkey
    S. The question is for the paper's authors (findings).
- claim: cells-recorded
  outcome: partially_reproduced
  notebook: reproduce_wirth_2017.ipynb
  output: claim:cells-recorded
  measured:
  - 189
  - 186
  notes: hc-12 holds 189 cell files (99 of monkey K, 90 of monkey S), the paper's analysed count; 187
    have new-maze data and 186 fire more than 100 spikes in the new-maze session (within 189 +- 18.9).
    The 270 cells recorded (128 S, 142 K) are not deposited beyond these 189, so that count cannot be
    checked. The files give recording coordinates but no subfield.
- claim: responsive-cells
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Responsiveness is defined over four spaces, one of them the point of gaze, which needs the gaze
    direction in degrees; the eye signal has no calibration, units or sign in the files. Responsive in
    the three spaces computed here are 59 of 186 cells (full trials, permuted chunks; 51, 55, 47, 59 and
    52 under the other readings), a lower bound of the four-space count, which could lie anywhere from
    59 to 186.
- claim: state-space-most-responsive
  outcome: not_reproduced
  notebook: reproduce_wirth_2017.ipynb
  output: claim:state-space-most-responsive
  measured: 57
  notes: 57 of 186 cells have significant state-space IC under the main reading (full trials, permuted
    chunks) and 47, 42, 37, 57 and 47 under the other five readings (shifted chunks; start to reward;
    start to reward with the returns), all below 75.6 to 92.4. With the upper tail alone the counts are
    41 to 58. The count needs no gaze, so the missing gaze space does not change the outcome; the chi-squared
    tests across the four spaces could not be run. State space has the most cells of the three spaces
    computed under every reading (57 against 46 for position and 40 for direction under the main reading).
  deviations:
  - Map resolution steps (square bins for position and state space, as in the dataset's scripts, equal
    angular bins for direction), two readings of the surrogate shifting and three of the trial window,
    as in the claims file (Method W). The start to reward window with the returns is almost the full one,
    as the trial ends at the reward (median 0 s from code 11 to 23).
  - The shift reading rotates each 5 s chunk within itself by its own random offset. The first version
    moved each chunk over the whole session, so chunks overlapped; on synthetic trains without coding
    its surrogates had 2.1 times the actual IC and every train came out significant. The corrected version
    gives 3.3% of such trains p < 0.01 (permuted chunks 0%).
- claim: multi-space-coding
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Depends on responsive-cells (the gaze space). Of the 59 cells responsive in the three spaces
    computed, 46 are significant in two or more; cells responsive only in gaze space would add to the
    denominator, so the fraction over the paper's set cannot be bounded above one half.
- claim: direction-center-vs-periphery
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_wirth_2017.ipynb
  output: claim:direction-center-vs-periphery
  notes: For the 40 cells with significant direction IC (reading a, permuted chunks) normalized sparsity
    is higher in the centre than on return paths (median difference 0.020, 25 of 40, Wilcoxon p = 0.031)
    and IC is not (0.012, p = 0.43); with shifted chunks (28 cells) p = 0.016 and 0.095. Reading (a) meets
    neither level. Reading (b) needs the paper's responsive set, which needs the point-of-gaze space.
    Over the 59 three-space responsive cells, which it contains, IC and sparsity are both higher with
    p = 0.045 and 0.0074, the partial level; with shifted chunks (51 cells) IC is not (p = 0.14, sparsity
    p = 0.013). Over all 180 cells with both maps neither is higher (IC p = 0.31, sparsity p = 0.29, permuted
    chunks), so a signed-rank result over the 59 cells puts no bound on the result over the paper's set,
    which may lie at any level. No set reaches p < 0.001. Reading (a) fails and reading (b) cannot be
    formed, so the claim cannot be decided, as for landmark-identity-center.
  deviations:
  - Centre and return maps at one common angular resolution per session, chosen so the number of bins
    valid in both is closest to 200 (median 151 centre and 157.5 return bins valid); the paper does not
    say how the two maps were binned.
  - Reading (b), all responsive cells, cannot be formed without the gaze space; the three-space responsive
    cells, which it contains, stand in for it, an assumption.
- claim: direction-tuning-not-maintained
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_wirth_2017.ipynb
  output: claim:direction-tuning-not-maintained
  measured:
  - 15
  - 40
  - 4
  notes: Of 40 direction-selective cells (permuted chunks), 15 (38%) have a significantly low centre-return
    correlation (binomial p = 2.1e-14 at chance 0.025) and 4 a significantly high one (p = 0.017). The
    high count is inside 2 to 4, but the number of cells tested (40, expected 56 +- 5.6) and the low count
    (15, expected 20 +- 2) are outside the tolerance. Over the 59 three-space responsive cells 16 are
    low and 4 high; with shifted chunks 11 of 28 and 14 of 51 are low. Over these sets the low count misses
    18 to 22, although more cells than chance have a low correlation under all of them (binomial p below
    1e-10). The criterion has no partial level. Reading (a) fails on the number of cells (40 and 28).
    Reading (b) needs the paper's responsive set, which needs the point-of-gaze space. That set lies
    between the three-space responsive cells and all cells (181 tested, 25 low and 8 high with permuted
    chunks; 18 and 7 with shifted chunks), and a set between the two can meet the criterion, in one combination
    with permuted chunks (n 61, low 18, high 4) and in 13 with shifted chunks (for example n 55, low 18,
    high 3). A set that meets the criterion and one that fails it (the stand-in) both exist, so the claim
    cannot be decided.
  deviations:
  - Cells with at least 10 common valid bins, a standard choice for "enough"; with 2 the counts do not
    change.
  - Reading (b), all responsive cells, cannot be formed without the gaze space; the three-space responsive
    cells stand in for it, an assumption, as in direction-center-vs-periphery.
- claim: state-space-ic-higher
  outcome: partially_reproduced
  notes: 'Normalized IC is higher in state space than in position space (full trials, permuted chunks:
    44 cells, median difference 0.014, 35 higher, Wilcoxon p = 1.1e-4) and than in direction space (40
    cells, 0.021, 35 higher, p = 2.5e-7), with p < 0.01 under all six readings (largest 0.0022). The comparison
    with the point-of-gaze space cannot be made, as the eye signal has no calibration, so two of the three
    comparisons hold, the criterion''s partial level.'
  notebook: reproduce_wirth_2017.ipynb
  output: claim:state-space-ic-higher
  deviations:
  - The cells of each comparison are those significant in both spaces compared, which needs no gaze; the
    point-of-gaze comparison is missing.
- claim: sparsity-state-vs-direction
  outcome: reproduced
  assumed: true
  notebook: reproduce_wirth_2017.ipynb
  output: claim:sparsity-state-vs-direction
  measured: 0.0022
  notes: For the 40 cells with significant IC in both state and direction space (full trials, permuted
    chunks), normalized sparsity is higher in state space (median difference 0.016, 28 of 40 cells, Wilcoxon
    p = 0.0022); with shifted chunks, 27 cells, 0.020, p = 0.0059. With the start-to-reward window it
    is not significant (p = 0.92 and 0.98); the start-to-reward window with the returns gives the full-trial
    numbers. The outcome rests on keeping the returns in the maps.
  deviations:
  - The main reading takes the trial window from start to next start (the state space includes the returns,
    Fig 1F legend); the paper does not settle it, and the outcome depends on it (findings). Both surrogate
    readings agree.
- claim: sparsity-state-vs-position
  outcome: not_reproduced
  notebook: reproduce_wirth_2017.ipynb
  output: claim:sparsity-state-vs-position
  measured: 9
  notes: State space is significantly sparser than position space over the cells responsive in both under
    every reading (Wilcoxon p = 0.00013 to 0.00043, median difference 0.014 to 0.028; main reading 44
    cells, 0.016, p = 0.00043), where the paper's test finds no significant difference. 7 to 11 cells
    (per-cell level 0.05) or 3 to 5 (0.01) differ individually, against 15 +- 1.5 (main reading 9 and
    5); those cells are sparser in state space (p = 0.00098 to 0.016 at level 0.05). No reading meets
    the first two parts.
- claim: sparsity-gaze-vs-state
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Needs the point-of-gaze space; the eye signal has no calibration.
- claim: state-space-selectivity
  outcome: not_reproduced
  notebook: reproduce_wirth_2017.ipynb
  output: claim:state-space-selectivity
  notes: 'The paper''s responsive set contains the three-space responsive cells and lies within all cells,
    so its counts are bounded by the counts over these two sets. With permuted chunks the low count over
    the three-space responsive cells is already 6 or 7 under every move typing and trial window, above
    the 3 to 5 the criterion allows, so no responsive set can meet the criterion (main reading, arc moves:
    high 15 to 23, low 7 to 12). With shifted chunks the bounds include the targets in most combinations
    (arc moves, full trials: high 13 to 21, low 5 to 8), so the claim cannot be decided there without
    the gaze space. The outcome rests on the permuted reading of the surrogates and does not depend on
    the move typing.'
  deviations:
  - 'The three rotational moves are not named in the paper. Three typings are run: the 36 degree alignment
    (tags 2xy) and the 72 degree rotations to the right and to the left (tags 3xy, by the sign of the
    orientation change); the 36 degree alignment right and left and the 72 degree rotation; each transition
    tag as its own move. High and low are the upper and lower 5% of the surrogates, the level implied
    by the binomial chance rate of the claims file.'
  - The paper's responsive set cannot be formed (gaze space); the outcome rests on the bounds.
  - Assumed that the 5 s chunks were permuted (Results, "randomly shuffling periods of spiking activity
    in time"); under the other reading the outcome is open.
  assumed: true
- claim: landmark-identity-distance
  outcome: not_reproduced
  notebook: reproduce_wirth_2017.ipynb
  output: claim:landmark-identity-distance
  notes: At most 24 cells (over all 186) show a main effect of relative distance with successful laps,
    and at most 31 with all laps (27 and 33 with type III sums of squares), against 64 +- 6.4; this bound
    holds for any responsive set. The identity count lies between 15 and 32 (successful laps) or 21 and
    47 (all laps) and the interaction count between 5 and 14 or 8 and 17, but the distance count fails
    under every reading, and with it the partial level. With all laps the one session of 193 trials (sn20110624)
    gives the residual df of Fig 5, 756, and its three cells have interaction F of 1.83, 3.19 and 1.56,
    not the 4.41 and 2.12 of Fig 5.
  deviations:
  - Laps read two ways, successful trials (Method W) and all trials (Methods, "each of the animal's laps");
    the residual df of 756 in Fig 5 is reached only with all laps of sn20110624 (193 x 4 - 16), which
    supports the second.
  - Relative distance from the files' curvilinear abscissa in quarters; on the entry paths the abscissa
    is the distance from the centre over 16 m (0 centre, 1 arm end; median absolute difference at most
    0.0023 per file), checked in the notebook; the landmark
    identity is the entry path. Rates per lap and segment, ANOVA with interaction, type II sums of squares,
    alpha 0.05; type III, the default of MATLAB's anovan, is shown and gives the same outcome.
