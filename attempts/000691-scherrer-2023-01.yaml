- claim: ed9b-octant-decoding
  outcome: reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:ed9b-octant-decoding
  notes: Median class accuracy 0.313 over 50 decoders (0.211 to 0.416), chance 0.125, null 95th
    percentile 0.144; all 50 exceed it, and each octant's mean accuracy (0.236 to 0.499) is above
    chance. On six splits fit by both solvers, SGD stops at objectives of 3.89 to 6.18 and the exact
    solver at 0.071 to 0.094 (at its limit of 10,000 iterations in all six); the exact solver gives
    0.220 to 0.292 for three real decoders and 0.092 to 0.145 for three with shifted labels, so the
    claim also holds with it.
  deviations:
  - Position tracked here from the video (the paper's tracking output is not in the dandiset), in
    the unrotated frame, with the loop's sides at the 2nd and 98th percentiles of position.
  - All 2948 footprints in place of the 2382 curated ones.
  - scikit-learn's SGD classifier (hinge loss, ridge alpha equal to the code's lambda, 10 passes) in
    place of MATLAB's fitcecoc with templateLinear, whose default for more than 100 predictors is 10
    passes of dual SGD; 50 decoders in place of 200.
- claim: ed9c-local-decoding-map
  outcome: reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:ed9c-local-decoding-map
  notes: With 32 footprints within 270 um (45 px), 150 grid points qualify and 18 (12%) are
    significant at Benjamini-Hochberg 5%, with scores of 0.112 to 0.187 (range 0.075, where the
    criterion asks for 0.05). Scores over all points 0.068 to 0.187, median 0.125, against null
    means of 0.065 to 0.123. The outcome depends on the solver. With 10 passes of SGD, as in round 1,
    on the same points and seeds, 1 point is significant and the criterion is not met; at four points
    SGD stops at objectives of 19.8 to 68.9 where the exact solver reaches 1.976 to 2.000, close to
    the 2.0 of predicting every class absent, so the scores rest on weak classifiers. liblinear
    reached its limit of 10,000 iterations in 2268 of 3000 fits. Null standard deviations per point
    0.018 to 0.046 (5th to 95th percentile) from 10 shifted decoders; a point alone needs z above
    3.40, and the smallest z among the significant points is 2.53. A Welch t-test of the 10 real
    against the 10 shifted decoders marks 80 points significant (range 0.079), and 5 with SGD
    (range 0.052). With the code's 64 footprints within 50 px, on a 60 px grid, 22 of 34 points are
    significant (scores 0.141 to 0.211, range 0.070), and 32 with the t-test. The exact fits stop
    at an iteration limit, so the counts can differ slightly between machines.
  deviations:
  - The legend says 32 footprints within 270 um; the code uses 64 within 50 pixels. The legend is
    followed for the outcome and the code's choice is shown as a variant.
  - The paper does not describe its significance test. Here, 10 decoders and 10 shifted-label
    decoders per point and a one-sided z-test, chosen before the analysis.
  - Local decoders are fit by liblinear (LinearSVC) on the same objective, as MATLAB's default for
    100 or fewer predictors is BFGS run to convergence; liblinear also penalizes the intercept,
    weakly. Round 1 used 10 passes of SGD here, which is shown as a variant.
  - A 30 pixel grid where the code uses 5 pixels; all 2948 footprints in place of 2382; position
    tracked from the video, as for octant decoding.
  - The code's variant is run on a 60 pixel grid where the criterion says 40; on the 40 pixel grid
    the notebook took 32 minutes on four cores, over the 30 minute limit.
- claim: ed10-localized-activity
  outcome: reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:ed10-localized-activity
  notes: 100 of 2948 footprints (3.4%) have an entropy over linear position below all 100 shifted
    values, against 29 expected (binomial p = 4.5e-25); 448 against 175 at a looser threshold. For the
    100, the entropy is 0.20 to 0.90 bits below the shifted mean (5th to 95th percentile), out of a
    maximum of 6.64 bits. The binomial test treats footprints as independent, but the same 100 shifts
    serve every footprint; treating each shifted copy in turn as the observed data gives counts with
    a median of 28, a 95th percentile of 54 and a maximum of 62, and none of the 100 copies reaches
    100.
  deviations:
  - The paper selected its examples by eye and shows two-dimensional maps; here a test over all
    footprints on linear position, with the entropy measure of place_cells.m.
  - All 2948 footprints in place of 2382; position tracked from the video, as for octant decoding.
- claim: ed2b-featherscope-flat-illumination
  outcome: partially_reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:ed2b-featherscope-flat-illumination
  notes: At 0.4 mm the corrected profile is 0.742, total vignetting 0.342 and optical vignetting
    0.628; the corrected profile is higher, but falls below 0.8 (minimum 0.742 over 0 to 0.4 mm).
    The minimum is 0.785 out to 0.38 mm and 0.698 out to 0.42 mm; with the centre moved by 100 um it
    is 0.626 to 0.867, and 0.766 about the image centre.
  deviations:
