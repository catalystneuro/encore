- claim: ed8-coactive-distributed
  outcome: reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:ed8-coactive-distributed
  notes: For all 8 components the event has 196 to 320 active footprints, more than half of the
    component's members, with a spread of 0.945 to 1.055 times that of all footprints (0.98 mm) and a
    90th percentile of pairwise distance of 2.05 to 2.29 mm. Active thresholds of 0.3 and 0.7 also
    give 8 of 8. The best of 4 NMF replicates was kept (errors 97.55 to 97.58).
  deviations:
  - All 2948 footprints in place of the 2382 curated ones.
  - Event times are each component's largest temporal weight; the code sets them by hand.
  - Distances use the code's 5.94 um per pixel, which the dandiset does not state; the outcome uses
    ratios and does not depend on it.
- claim: fig2-quadrant-direction-decoding
  outcome: reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:fig2-quadrant-direction-decoding
  notes: Median class accuracy 0.415 over 50 decoders (0.304 to 0.604), chance 0.125, 95th
    percentile of 50 shifted-label decoders 0.145; all 50 exceed it. 3.32 times chance; the
    preprint's text says at least four times chance, a number not used here as the version of record's
    text was not available. Six of eight classes reach 0.443 to 0.594, two only 0.236 and 0.239. On
    all frames, without the running selection, 0.348 against a null 95th percentile of 0.127.
  deviations:
  - Position tracked here from the video (the paper's tracking output is not in the dandiset), in
    the unrotated frame, with the loop's sides at the 2nd and 98th percentiles of position.
  - All 2948 footprints in place of the 2382 curated ones.
  - scikit-learn's SGD classifier (hinge loss, ridge alpha equal to the code's lambda, 10 passes) in
    place of MATLAB's fitcecoc with templateLinear; 50 decoders in place of 200.
  - The legend of Figure 2 was not available, so the claim is stated from the Extended Data legends
    and the code.
- claim: ed9b-octant-decoding
  outcome: reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:ed9b-octant-decoding
  notes: Median class accuracy 0.313 over 50 decoders (0.211 to 0.416), chance 0.125, null 95th
    percentile 0.144; all 50 exceed it, and each octant's mean accuracy (0.236 to 0.499) is above
    chance.
  deviations:
  - As for fig2-quadrant-direction-decoding.
- claim: ed9c-local-decoding-map
  outcome: not_reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:ed9c-local-decoding-map
  notes: With 32 footprints within 270 um (45.5 px), 151 grid points qualify and none is significant
    at Benjamini-Hochberg 5% (smallest q 0.61); scores 0.015 to 0.140, median 0.071, against null
    means of 0.014 to 0.093. The score (median of eight class accuracies) is below chance at most
    points, as decoders on 32 footprints predict few of the classes. With the code's 64 footprints
    within 50 px, 4 of 77 points are significant (scores 0.123 to 0.177, range 0.054), which would
    meet the criterion.
  deviations:
  - The legend says 32 footprints within 270 um; the code uses 64 within 50 pixels. The legend is
    followed for the outcome and the code's choice is shown as a variant.
  - The paper does not describe its significance test. Here, 10 decoders and 10 shifted-label
    decoders per point and a one-sided z-test, chosen before the analysis; with so few null decoders
    the test has little power.
  - A 30 pixel grid where the code uses 5 pixels; all 2948 footprints in place of 2382; position and
    classifier as for fig2-quadrant-direction-decoding.
- claim: ed10-localized-activity
  outcome: reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:ed10-localized-activity
  notes: 100 of 2948 footprints (3.4%) have an entropy over linear position below all 100 shifted
    values, against 29 expected (binomial p = 4.5e-25); 448 against 175 at a looser threshold. For the
    100, the entropy is 0.20 to 0.90 bits below the shifted mean (5th to 95th percentile), out of a
    maximum of 6.64 bits.
  deviations:
  - The paper selected its examples by eye and shows two-dimensional maps; here a test over all
    footprints on linear position, with the entropy measure of place_cells.m.
  - All 2948 footprints in place of 2382; position as for fig2-quadrant-direction-decoding.
