    of the same size have spread ratios of 0.951 to 1.042 (5th to 95th percentiles), so any set this
    large passes the criterion's half. The event's spread ratio lies within its own component's
    random range for 3 of 8 components, below it for 2 (0.945 and 0.956, against 5th percentiles
    of 0.962) and above it for 3 (1.042, 1.055 and 1.050, against 95th percentiles of 1.037, 1.042
    and 1.036).
  deviations:
  - All 2948 footprints in place of the 2382 curated ones.
  - Event times are each component's largest temporal weight; the code sets them by hand.
  - Distances use the code's 5.94 um per pixel, which the dandiset does not state; the outcome uses
