findings:
- kind: data_missing
  statement: The dandiset holds one of the paper's four mice and none of the songbird recordings or
    optical test data. The Academic Torrents deposit the paper names for its imaging data holds
    files of the same mouse session only, so the other mice and the birds are not public.
- kind: metadata_error
  statement: The device description reads "Head-mounted microscope (Kiloscope) optimized for weight
    (1.0 mm FOV; 1.0 g)", and the dandiset description says the data come from the microscope
    optimized for weight. The data are from the large-FOV microscope (1.4 g, about 4 mm FOV) that
    the paper calls the Kiloscope; a 4 mm window, 2948 footprints and 808 x 608 pixel frames.
- kind: metadata_error
  statement: The imaging is stored as a TwoPhotonSeries and the dandiset lists two-photon microscopy
    among its techniques, but the microscope is a one-photon head-mounted epifluorescence
    microscope.
- kind: metadata_error
  statement: The behaviour video is described as about 30 fps and its AVI header says 30 frames/s,
    but its 15521 timestamps run at a median 12.5 frames/s over 1234 s; at 30 frames/s it would
    cover only 517 s of the 1234 s of imaging.
- kind: metadata_insufficient
  statement: The imaging plane gives no pixel size, and its indicator and location are "unknown"
    with no excitation wavelength, although general/virus says GCaMP7f. Distances in the paper's
    figures cannot be computed from the dandiset alone.
- kind: selection_undocumented
  statement: The 2948 footprints are the EXTRACT output before curation; the paper analyses the
    2382 it kept (Extended Data Fig. 6a). Nothing in the dandiset marks the curated set or says that
    the footprints are uncurated.
- kind: data_missing
  statement: The mouse's position, which the paper's decoding and place analyses use, is not in the
    dandiset; it must be tracked from the behaviour video. The first 64 s of the video (by its
    nominal rate), which the paper's code drops because the experimenter is in view, are not marked.
- kind: code_mismatch
  statement: The Extended Data Fig. 9c legend describes decoders on the 32 closest footprints within
    270 um; the code (subregion_map_octant.m) uses 64 footprints within 50 pixels, which at the
    code's own 5.94 um per pixel (sf3/widefield/analysis.m) is 297 um.
- kind: paper_inconsistency
  statement: The title of Extended Data Fig. 8 refers to the Kiloscope data "shown in Figure 3",
    and its legend takes the ridgeline plot from Fig. 2d, while the version of record has two
    figures, and Supplementary Video 1 and Extended Data Fig. 10 place the bird data in Fig. 2a-d and
    the mouse data in Fig. 2e-h.
