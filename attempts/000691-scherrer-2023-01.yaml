- claim: ed2c-kiloscope-flat-illumination
  outcome: partially_reproduced
  notebook: reproduce_scherrer_2023.ipynb
  output: claim:ed2c-kiloscope-flat-illumination
  notes: At 1.5 mm the corrected profile is 0.797, total vignetting 0.253 and optical vignetting
