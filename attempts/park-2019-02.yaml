outcomes:
- claim: cell-counts
  outcome: partially_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:cell-counts
  measured:
  - 115
  - 115
  - 146
  notes: The data set holds 115 head-direction units from 13 rats, matching the paper's 115 from 13
    rats; per rat they match Table S1 except R029 (40 against 41) and R523 (2 against 1). Applying
    the paper's criteria at p < 0.05 (reading b), 110 of 115 pass; two units fire above 10 AP/s in
    stable1 (13.8 and 11.9), two have Kuiper p of 0.051 and 0.054 and one a Rayleigh p of 0.089.
    The data set holds no other MEC units, so the 353 MEC cells and 556 MEC cell pairs of Table S1
    cannot be counted; the measured values for them are the 115 units and the 146 simultaneously
    recorded pairs the data set holds, all head-direction cells. The paper analyses 142
    head-direction pairs in Figure 4; 142 of the 146 have a defined 5 s internally referenced curve
    in every condition (fig4-internal-tuning-preserved), which may be how the paper counted them.
  deviations:
  - Spike width cannot be applied (no waveforms are deposited).
  - Units matched across trials by tetrode and cluster in the file names, as FileNameList.xlsx is
    shifted for five units of session 1121R157.
- claim: hd-cell-rate
  outcome: reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:hd-cell-rate
  measured: 1.392
  notes: Mean stable1 rate 1.392 AP/s (reading a) and mean over three trials 1.433 AP/s (reading b),
    both within 1.41 ± 0.20. The median is 0.668 AP/s. Two units fire above 10 AP/s in stable1, the
    paper's stated upper limit. Spike width is not tested.
- claim: fig1a-avoidance-learning
  outcome: blocked
  blocked_by: data_missing
  notes: The learning curves are over the pretraining and training sessions. The data set's 176
    tracker files hold only the 44 recording sessions (stable1, rotating in room and arena
    coordinates, stable2), 1 to 12 per rat; the training sessions are not deposited, and the data
    descriptor does not mention them.
- claim: fig1c-speed
  outcome: reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig1c-speed
  notes: Mean speed per session from the TSD positions (2.1333 pixels/cm). With the 40 sessions whose
    tracking is not duplicated, reading (a), successive samples, gives F(1.94, 75.59) = 64.80, p =
    7.6e-17 (the paper F(2.02, 74.68) = 46.61); stable2 10.76 cm/s against 14.63 to 15.60 for the
    others, each Tukey-Kramer adjusted p below 0.0001, and stable1 and the two rotating frames do
    not differ (adjusted p 0.38 to 1.00). Reading (b), 1 s steps, F(1.87, 72.82) = 55.86, p = 6.9e-15,
    the same pattern (others adjusted p 0.07 to 0.84). All 44 sessions give the same.
  deviations:
  - The four sessions whose tracking duplicates another session's (1015R029, 1025R029, 1211R039,
    1212R039) are left out of the main test, as one trial of each pair carries another day's
    tracking; they are kept in a variant.
  - Tukey-Kramer HSD between groups (statsmodels), where JMP's repeated-measures post hoc may differ;
    paired t-tests are shown as a variant and agree.
- claim: fig1c-lfp-power
  outcome: blocked
  blocked_by: data_missing
  notes: The data set holds no LFP; the zip holds only TSD spike and tracking files and tracker .dat
    files, and the data descriptor does not mention LFP.
- claim: fig1c-firing-rate
  outcome: reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig1c-firing-rate
  notes: Mean rates 1.392, 1.710 and 1.198 AP/s in stable1, rotating and stable2; repeated-measures
    ANOVA with Greenhouse-Geisser correction (Mauchly p = 9.4e-17) F(1.35, 154.10) = 1.76, p = 0.184
    (the paper F(1.34, 153.21) = 1.89, p = 0.17). Mean change +0.318 AP/s in rotation and -0.194 in
    stable2. Variants find differences, a Wilcoxon test of rotating against stable1 (p = 0.02) and
    the ANOVA on log rates (p = 0.0015), so the absence rests on the paper's test on raw rates.
- claim: fig1c-directionality
  outcome: partially_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig1c-directionality
  notes: Directionality differs across conditions, F(2.77, 315.60) = 72.66, p = 8.9e-34 (the paper
    F(3, 342) = 70.36). Means 0.460 stable1, 0.421 stable2, 0.344 room, 0.170 arena. Stable1 and
    stable2 do not differ (Tukey p = 0.58); arena is below room and both stable trials (p < 0.0001);
    room is below stable1 (p = 0.0009) but not below stable2 at p < 0.01 (p = 0.055). One of the
    five orderings the criterion requires fails; the criterion's partial form (rotating frames not
    differing) does not apply either, so the outcome is partial because the effect holds in part.
  deviations:
  - Greenhouse-Geisser applied, as Mauchly's test is significant (p = 0.0042); the paper's degrees
    of freedom, F(3, 342), are uncorrected.
- claim: fig1d-preference-change
  outcome: partially_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig1d-preference-change
  notes: Trial pairs F(2, 228) = 17.80, p = 6.6e-08 (the paper F(2, 228) = 10.54); four groups
    F(3, 456) = 19.62, p = 5.6e-12 (the paper F(3, 456) = 15.38). Every trial pair exceeds the
    stable1 halves by Dunnett's test (p = 0.019, 0.0073, below 0.0001). Stable1-stable2 and
    stable1-room do not differ (58 and 60 degrees, Tukey p = 0.95), but stable1-arena is larger
    (91 degrees, p < 0.001), where the legend orders it below the other two. The criterion makes
    this partial.
  deviations:
  - Halves of stable1 are its first and second 15 min, as the claims file reads them.
- claim: fig1d-instability
  outcome: partially_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig1d-instability
  notes: KLD on spike counts (reading a) gives trial pairs F(1.60, 182.42) = 11.74, p = 7.2e-05 (the
    paper F(1.62, 184.22) = 7.78) and four groups F(3, 456) = 13.74, p = 1.4e-08; stable1-stable2
    and stable1-arena exceed the halves by Dunnett's test (p = 0.0044 and below 0.0001), but
    stable1-room does not (p = 0.13). KLD on rates (reading b) gives F(1.60, 182.29) = 8.47, p =
    0.00084, four groups p = 0.0026, and only stable1-arena exceeds the halves (p = 0.0008). The
    criterion has no partial form; the outcome is partial because two of the three comparisons with
    the halves hold.
- claim: fig2-decoding-stable-vs-rotating
  outcome: reproduced
  assumed: true
  notebook: reproduce_park_2019.ipynb
  output: claim:fig2-decoding-stable-vs-rotating
  measured: 7
  notes: Seven sessions hold at least five head-direction units (four of 6 and three of 5). With
    20-sample windows the stable2 error is below the arena-frame error in 4 of 7 ensembles and below
    the room-frame error in 4 of 7, by the median and by the mean absolute error, and the same with
    4-sample windows. Stable2 decoding is near or above chance (90 degrees) in 1026R157, 1117R157
    and 1121R157 (medians 102 to 135), where decoding the second half of stable1 from its first half
    is also poor (65 to 116 degrees). Room is decoded better than arena in 6 of 7. The outcome rests
    on the claims file's majority rule (four of seven), which the paper does not give.
  deviations:
  - Windows without any tracked direction are dropped from training; the code would place them in
    the first bin.
  - The stable2 decoding of 1121R157 uses the first 15 min, as one of its stable2 files lasts 15 min.
- claim: figs2-frame-preference
  outcome: reproduced
  assumed: true
  notebook: reproduce_park_2019.ipynb
  output: claim:figs2-frame-preference
  measured:
  - 4
  - 2
  notes: Of the 16 readings the criterion names (bins 10 or 45 degrees, probabilities from the
    rotating trial or stable1, SD of the ΔIdir series or of stable1 Idir, no-preference margin a
    factor of 2 or both below 0.05), one gives 4 room- and 2 arena-preferring ensembles (45 degree
    bins, rotating-trial probabilities, ΔIdir SD, both below 0.05). The other 15 give 0 to 5 room
    and 0 to 1 arena; 14 of 16 give more room- than arena-preferring ensembles. The criterion
    reproduces the claim under any reading; the outcome rests on that one reading.
  deviations:
  - Idir is undefined where the observed count never occurs at that direction in the reference
    trial; such intervals are left out of the sums (nansum over cells).
  - The direction of an interval is the circular mean of its tracked samples.
- claim: fig2c-proximity-anticorrelation
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_park_2019.ipynb
  output: claim:fig2c-proximity-anticorrelation
  measured: -0.071
  notes: Under every reading (Idir bins and probabilities, proximity a or b) the mean of the 14
    frame-specific correlations is negative, -0.051 to -0.087 (first reading -0.071), outside
    -0.141 ± 0.029 and -0.132 ± 0.024; 10 to 12 of 14 are negative and 7 to 11 negative with p <
    0.0001. ΔIdir correlates negatively with proximity at p < 0.05 in 4 to 6 of 7 ensembles (mean r
    -0.054 to -0.128). The criterion makes this partial.
  deviations:
  - Relative proximity uses the distance to the centre of each shock zone (centre angle and mid
    radius from the tracker headers, angle counted with y up as the tracker's zone flags show); the
    paper does not define the distance. This is an assumption the outcome rests on.
- claim: figs3-no-head-direction-bias
  outcome: reproduced
  assumed: true
  notebook: reproduce_park_2019.ipynb
  output: claim:figs3-no-head-direction-bias
  measured: 0.166
  notes: With 10 degree Idir bins and rotating-trial probabilities the average Rayleigh r is 0.166
    (expected 0.17 ± 0.02). With n the sum of the weights no test of 14 is significant (smallest p =
    0.35); with n the number of bins one is (1121R157 room frame, p = 0.014). The other Idir
    readings give average r 0.180 to 0.264 and 1 to 5 significant tests of 14.
  deviations:
  - The n of the weighted Rayleigh test is taken as the sum of the weights, the convention of the
    weighted Rayleigh test in CircStat (circ_rtest), the field's standard MATLAB toolbox; the paper
    does not say. With n the number of bins the claim is not reproduced (1 of 14 tests at p <
    0.05). The Idir reading is the first the figs2 criterion lists. This is an assumption.
- claim: fig3-hd-pair-correlations-preserved
  outcome: reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig3-hd-pair-correlations-preserved
  notes: 146 simultaneously recorded head-direction pairs; one-way ANOVA of the Fisher-transformed
    Kendall tau over the three trials F(2, 435) = 0.098, p = 0.907 at 40 ms, 0.329, p = 0.72 at 250
    ms, 0.483, p = 0.617 at 1000 ms (the paper F(2, 420) = 0.097, 0.305, 0.44). Tau in stable1
    correlates with tau in rotation at r = 0.85 to 0.97. A repeated-measures ANOVA, a variant, finds
    small differences at 250 and 1000 ms (p = 0.034 and 0.036), with stable2 lowest.
  deviations:
  - 146 pairs where the paper's degrees of freedom imply about 141.
  - Counts binned from the spike times over each trial, not from the tracker samples.
- claim: figs4-all-pair-correlations-preserved
  outcome: blocked
  blocked_by: data_missing
  notes: The claim uses all 556 MEC cell pairs. The data set holds only the 115 head-direction units
    (115 files in each trial folder, all listed in FileNameList.xlsx); the other MEC units are not
    deposited.
- claim: figs5-hd-cells-high-model-information
  outcome: blocked
  blocked_by: data_missing
  notes: The claim compares the head-direction cells with the 921 modelled MEC cells, which are not
