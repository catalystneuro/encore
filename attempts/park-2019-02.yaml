- claim: no-angular-velocity-tuning
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_park_2019.ipynb
  output: claim:no-angular-velocity-tuning
  notes: In stable1, 12 of 115 units correlate with signed angular velocity at p < 0.05 (binomial p =
    0.013 against 5%) and 49 of 115 with unsigned angular velocity (p = 5.7e-33); rotating and stable2
    give the same. The correlations are small (|r| at most 0.028 signed, 0.068 unsigned), and the
    sample-to-sample angular velocity reaches about 5400 degrees/s, which points to tracking noise.
    Tested against circular shifts of at least 30 s, which keep the serial dependence of the
    samples, 11 of 115 (binomial p = 0.029) and 41 of 115 (p = 3e-24) are significant, and after
    removing the head-direction bin means from both series 14 (p = 0.0019) and 34 (p = 1.8e-17), so
    the excess does not come from treating the samples as independent. The correlations are of
    both signs (49 to 53 of 115 positive for unsigned velocity) and at most 0.068 in size. The
    paper shows no data and names no test; the test is the claims file's assumption, and the
    outcome rests on it.
  deviations:
  - The test (per-unit Pearson correlation with angular velocity from successive samples, and a
    binomial test of the fraction significant) is the claims file's assumption; the paper names
    none. Stable1 is the main trial, as the classification trial; the others are variants.
- claim: fig4-internal-tuning-preserved
  outcome: not_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig4-internal-tuning-preserved
  notes: Under the main readings (5 s, cell 2 spikes before the cell 1 spike, the Methods'
    normalisation; 142 pairs with a defined curve in every condition) instability differs across
    trial pairs, F(2.00, 282.00) = 10.20, p = 5.3e-05, and in the four-group ANOVA, F(3, 564) =
    3.76, p = 0.011, and the preference change across trial pairs, F = 6.39, p = 0.0019; only the
    four-group preference test has p ≥ 0.05 (0.125). The differences are small (mean KLD 0.148 to
    0.207 against 0.166 for the halves; stable1-room the largest). Of the eight readings, only 5 s,
    before, with the code's occupancy normalisation has all four at p ≥ 0.05. Its KLD is near 0
    (means about 0.001), as the Krichevsky-Trofimov 0.5 swamps the normalised values; with the curve
    rescaled to its spike count (variant) that reading still has all four at p ≥ 0.05, the
    instability test at p = 0.052.
  deviations:
  - Cell 1 is the first-listed unit of each pair, as the code labels pairs i < j.
  - With the Methods' normalisation (a single number per curve) the curve is the spike-difference
    histogram; KLD uses its counts.
- claim: fig4c-arena-registration-short-lived
  outcome: not_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig4c-arena-registration-short-lived
  notes: Run under the four readings of window side and normalisation. With the Methods'
    normalisation and cell 2 spikes before, the conditions do not differ at 3, 4 and 5 s (p = 0.13,
    0.17, 0.11) but do at 10 s (p = 0.0086); with cell 2 spikes after they differ at 5 s (p = 0.020)
    and 10 s (p = 0.0024); with the code's normalisation they do not differ up to 10 s with cell 2
    before (p = 0.096 to 0.50) and differ at 10 s with cell 2 after (p = 0.0094). Every reading
    differs at every interval beyond 10 s (p below 0.002). The arena frame is below all three other
    conditions at none of 20 to 60 s with the Methods' normalisation, and only at 60 s (before) or
    50 and 60 s (after) with the code's; at 20 to 50 s the room frame falls as far as or further
    than the arena frame (Methods' normalisation, before, 40 s, 0.267 and 0.281 against 0.410 and
    0.452). At 300 and 600 s the arena frame is below the others in every reading, and the room
    frame below both stable trials with the Methods' normalisation, as reported, but not at 600 s
    with the code's. The criterion's partial form needs the arena frame to fall below the others
    beyond 10 s; it falls only from 50 or 60 s, after the room frame, so the effect claimed for 20
    to 60 s is not found. The outcome was partially reproduced before the first verification
    round, when only cell 2 spikes before were run; the verifier gave not reproduced.
  deviations:
  - Strength is the Rayleigh vector length of the internally referenced curve, the reading the
    claims file gives.
  - One-way ANOVA on 141 to 146 pairs per interval (pairs with a defined curve in all four
    conditions at that interval), with between-groups Tukey-Kramer HSD, as the criterion's one-way
    ANOVA implies.
- claim: fig5-error-inhomogeneous
  outcome: partially_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig5-error-inhomogeneous
  measured:
  - 0.604
  - 0.484
  - 0.0718
  - 0.36
  notes: A reader amended the criterion on 2026-11-13 in answer to a question
    (questions/park-2019.yaml) so that it names three readings of what the error distribution is
    over, (i) mean absolute error per 10 degree head-direction bin, (ii) head directions of windows
    decoded within 15, 30 or 45 degrees, (iii) the signed error angles. Before the answer only
    (iii) was run. The claim was re-run under all three with the three pooling readings and both
    windows. Every test holds (all four distributions non-uniform, both Kuiper's tests at p <
    0.05) in 75 of 80 combinations, but none has all four r within tolerance; the most is two. With
    the six-cell ensemble 0930R029 (reading b) and 20-sample windows, the room-frame r is 0.604
    under reading (ii) at 15 degrees, 0.555 at 30 degrees and 0.560 under reading (iii), within
    tolerance of 0.589, and the arena-frame head-direction r is 0.360 (0.378); the arena-frame r is
    0.484, 0.543 and 0.144 (0.653) and the room-frame head-direction r 0.072 (0.147). The measured
    values are those of reading (ii) at 15 degrees, the first listed reading with two r within
    tolerance. Reading (i) gives error r of 0.030 to 0.426 at 20 samples. Pooled (reading a) no r
    is within tolerance under any reading, and the medians over ensembles (reading c) reach at most
    0.343 (room) and 0.548 (arena, reading ii at 133 ms). The answer brings the arena-frame error r
    closer to 0.653 but not within tolerance, and leaves the outcome as it was under reading (iii)
    (partially reproduced, with measured values 0.560, 0.144, 0.0718 and 0.360). Four ensembles
    tie at six cells; the other three match at most one value under any reading. The paper's z
    values imply about 681 and 679 windows for the error distributions and 10,671 and 1,072
    samples for the head-direction distributions; no row has both error counts within 10% of 681
    and 679, and no ensemble or sum of ensembles matches the head-direction counts of both frames,
    so the paper's pooling cannot be recovered from the counts.
  deviations:
  - For reading (i) the paper does not give the n of the Rayleigh test; it is taken as the number
    of decoded windows, as the paper's z = 236.36 at r = 0.589 implies about 680, and n = 36 bins
    is shown as a variant (which leaves the arena-frame error uniform for every ensemble). Neither
    choice changes the outcome, which readings (ii) and (iii) also give.
  - For reading (i) Kuiper's test compares the error weights with the head-direction occupancy
    over the same 10 degree bins, with n the number of windows on each side; the paper does not say
    how the test was applied to this reading.
- claim: fig5c-error-minima-at-cues
  outcome: reproduced
  assumed: true
  notebook: reproduce_park_2019.ipynb
  output: claim:fig5c-error-minima-at-cues
  measured:
  - 105
  - 345
  notes: With the seven ensembles pooled and 20-sample windows, the mean absolute room-frame error by
    room-frame head direction (reading a) has its two deepest minima in the bins starting at 100 and
    340 degrees (centres 105 and 345), within 10 degrees of 110 and 350 by their bin centres. This
    is 1 of 32 combinations of window, pooling and reading, against 0.20 expected by chance for two
    minima placed at random; 10 others find one of the two minima (6.6 expected by chance) and the
    pooled 133 ms variant finds neither. The outcome rests on the pooled reading. Whether the minima match
    the cue positions cannot be tested.
  deviations:
  - The paper does not say which recordings are pooled or which measure Figure 5C plots; the match
    is found with all seven ensembles pooled and the mean error by head direction, an assumption
    the outcome rests on.
  - The decoded direction is the start of the winning bin, as in the code, which biases the signed
    error by about -5 degrees; minima are located by their bin centres.
findings:
- kind: data_missing
  statement: The data set holds only the 115 head-direction units. The other MEC units of the paper
    (353 cells and 556 pairs in Table S1, 921 modelled cells in Figures S5 and S6), the LFP, the
    waveforms and the pretraining and training sessions are not deposited, so the claims of Figures
    1A, 1C (LFP), S4, S5 and S6 cannot be tested.
- kind: metadata_error
  statement: In FileNameList.xlsx the stable2 column of session 1121R157 is shifted by one row for
    five units (P11C2 to P9C3); each is listed with the next unit's stable2 file, and the last with
    1121SA2R157-cl1.P11C2Rm. The spike counts confirm the shift (P11C2 has 327 spikes in stable1, 52
    in rotation, and is listed with a stable2 file of 21567).
- kind: other
  about: data
  statement: Two pairs of trials from different days carry identical tracking (positions and
    directions, sample for sample) with different spikes. Stable2 of 1015R029 and of 1025R029, and
    the room-frame rotating trial of 1211R039 and of 1212R039, whose arena-frame tracking differs.
    One trial of each pair holds another day's tracking.
- kind: other
  about: data
  statement: The stable1 TSD file of unit 1024R157-P9C1 holds the same spikes, sample for sample, as
    its rotating-trial files (2919 spikes), on stable1 tracking; its stable1 spike train is very
    likely the rotating trial's.
- kind: format_error
  statement: The header of 1017SA2R035-cl.P11C2Rm states a sampling rate of 2000 samples/s and a
