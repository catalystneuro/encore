- claim: no-angular-velocity-tuning
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_park_2019.ipynb
  output: claim:no-angular-velocity-tuning
  notes: In stable1, 12 of 115 units correlate with signed angular velocity at p < 0.05 (binomial p =
    0.013 against 5%) and 49 of 115 with unsigned angular velocity (p = 5.7e-33); rotating and stable2
    give the same. The correlations are small (|r| at most 0.028 signed, 0.068 unsigned), and the
    sample-to-sample angular velocity reaches about 5400 degrees/s, which points to tracking noise.
    The paper shows no data and names no test; the test is the claims file's assumption, and the
    outcome rests on it.
  deviations:
  - The test (per-unit Pearson correlation with angular velocity from successive samples, and a
    binomial test of the fraction significant) is the claims file's assumption; the paper names
    none. Stable1 is the main trial, as the classification trial; the others are variants.
- claim: fig4-internal-tuning-preserved
  outcome: not_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig4-internal-tuning-preserved
  notes: Under the main readings (5 s, cell 2 spikes before the cell 1 spike, the Methods'
    normalisation; 142 pairs with a defined curve in every condition) instability differs across
    trial pairs, F(2.00, 282.00) = 10.20, p = 5.3e-05, and in the four-group ANOVA, F(3, 564) =
    3.76, p = 0.011, and the preference change across trial pairs, F = 6.39, p = 0.0019; only the
    four-group preference test has p ≥ 0.05 (0.125). The differences are small (mean KLD 0.148 to
    0.207 against 0.166 for the halves; stable1-room the largest). Of the eight readings, only 5 s,
    before, with the code's occupancy normalisation has all four at p ≥ 0.05.
  deviations:
  - Cell 1 is the first-listed unit of each pair, as the code labels pairs i < j.
  - With the Methods' normalisation (a single number per curve) the curve is the spike-difference
    histogram; KLD uses its counts.
- claim: fig4c-arena-registration-short-lived
  outcome: partially_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig4c-arena-registration-short-lived
  notes: With the Methods' normalisation the four conditions do not differ at 3, 4 and 5 s (p = 0.13,
    0.17, 0.11) but do at 10 s (p = 0.0086), and differ at every interval beyond 10 s (p below
    2e-07). At 300 and 600 s the order is stable1 and stable2 above room above arena, as reported.
    At 20 to 60 s the room frame falls as much as the arena frame (40 s, 0.267 and 0.281 against
    0.410 and 0.452), so the arena frame is not below the room frame there. With the code's
    normalisation the conditions do not differ up to 10 s (p = 0.096 to 0.50) and differ beyond;
    the arena frame is below the three others from 60 s and not below the room frame at 20 to 50
    s. The criterion's partial form (arena falls beyond 10 s, room order at long intervals not
    found) does not fit exactly; the outcome is partial because the effect holds in part.
  deviations:
  - Strength is the Rayleigh vector length of the internally referenced curve, the reading the
    claims file gives.
  - One-way ANOVA on 141 to 146 pairs per interval (pairs with a defined curve in all four
    conditions at that interval).
- claim: fig5-error-inhomogeneous
  outcome: partially_reproduced
  notebook: reproduce_park_2019.ipynb
  output: claim:fig5-error-inhomogeneous
  measured:
  - 0.56
  - 0.144
  - 0.0718
  - 0.36
  notes: Under reading (b), the six-cell ensemble 0930R029 (20 samples), all four distributions are
    non-uniform (Rayleigh p below 1e-6) and both Kuiper's tests have p below 1e-75; room-frame
    error r 0.560 (expected 0.589) and arena-frame head-direction r 0.360 (0.378) are within
    tolerance, arena-frame error r 0.144 (0.653) and room-frame head-direction r 0.072 (0.147) are
    not. Four ensembles tie at six cells; the other three match none of the four values. Pooled
    (reading a) the arena-frame error is not significantly non-uniform (p = 0.054) and no r is
    within tolerance; reading (c) gives median error r 0.139 (room) and 0.100 (arena).
- claim: fig5c-error-minima-at-cues
  outcome: reproduced
  assumed: true
  notebook: reproduce_park_2019.ipynb
  output: claim:fig5c-error-minima-at-cues
  measured:
  - 105
  - 345
  notes: With the seven ensembles pooled and 20-sample windows, the mean absolute room-frame error by
    room-frame head direction (reading a) has its two deepest minima in the bins starting at 100 and
    340 degrees (centres 105 and 345), within 10 degrees of 110 and 350. This is 1 of 32
    combinations of window, pooling and reading; 14 others find one of the two minima and the pooled
    133 ms variant finds neither. The outcome rests on the pooled reading. Whether the minima match
    the cue positions cannot be tested.
  deviations:
  - The paper does not say which recordings are pooled or which measure Figure 5C plots; the match
    is found with all seven ensembles pooled and the mean error by head direction, an assumption
    the outcome rests on.
  - The decoded direction is the start of the winning bin, as in the code; minima are located by
    their bins.
findings:
- kind: data_missing
  statement: The data set holds only the 115 head-direction units. The other MEC units of the paper
    (353 cells and 556 pairs in Table S1, 921 modelled cells in Figures S5 and S6), the LFP, the
    waveforms and the pretraining and training sessions are not deposited, so the claims of Figures
    1A, 1C (LFP), S4, S5 and S6 cannot be tested.
- kind: metadata_error
  statement: In FileNameList.xlsx the stable2 column of session 1121R157 is shifted by one row for
    five units (P11C2 to P9C3); each is listed with the next unit's stable2 file, and the last with
    1121SA2R157-cl1.P11C2Rm. The spike counts confirm the shift (P11C2 has 327 spikes in stable1, 52
    in rotation, and is listed with a stable2 file of 21567).
- kind: other
  about: data
  statement: Two pairs of trials from different days carry identical tracking (positions and
    directions, sample for sample) with different spikes. Stable2 of 1015R029 and of 1025R029, and
    the room-frame rotating trial of 1211R039 and of 1212R039, whose arena-frame tracking differs.
    One trial of each pair holds another day's tracking.
- kind: other
  about: data
  statement: The stable1 TSD file of unit 1024R157-P9C1 holds the same spikes, sample for sample, as
    its rotating-trial files (2919 spikes), on stable1 tracking; its stable1 spike train is very
    likely the rotating trial's.
- kind: format_error
  statement: The header of 1017SA2R035-cl.P11C2Rm states a sampling rate of 2000 samples/s and a
    first timestamp of 5; the file holds 54,185 samples, a 30 min trial at 30 Hz.
- kind: format_error
  statement: The spike times of 1020RAR157-cl.P11C1 (room and arena files) decrease once, by 1.5 ms.
- kind: other
  about: data
  statement: The stable2 file 1121SA2R157-cl1.P11C2Rm holds 26,954 samples (15 min), where every
    other trial file holds about 54,000 (30 min).
- kind: metadata_insufficient
  statement: Samples without a tracked direction (direction 4294967295, that is -1, 4 to 73% of a
    file's samples) and without a position (x = y = 0) are not described in the data descriptor.
- kind: metadata_insufficient
  statement: The data descriptor does not say that the tracker's shock zone angles are counted with
    y pointing up (pixel y grows downwards), nor that spike times run ahead of the nominal sample
    times (first timestamp plus index over rate) by up to about 3 s within a trial, so the tracker
    samples are not evenly spaced at the stated rate.
- kind: other
  about: data
  statement: The per-rat counts of head-direction units differ from Table S1 for R029 (40 in the data
    set, 41 in the table) and R523 (2 against 1); the totals agree (115). Two deposited units fire
    above 10 AP/s in stable1 (13.8 and 11.9 AP/s), above the paper's stated limit for
    head-direction cells.
- kind: metadata_error
  statement: The tracker file 0803SA2R024RoomTrack_Room_20150803_153906.dat belongs to the session of
    rat R027 on 0803 (the other three trial files and the TSD files are R027), and
    1007SA1R29RoomTrack... drops the leading zero of R029.
- kind: methods_unavailable
  statement: For Idir and ΔIdir (Figure 2C, S2, S3), the paper does not give the direction bins, the
    trial from which p(n|d) and p(n) are estimated, which SD the 2 SD rule uses, or the margin for no
    frame preference. The 4 room and 2 arena counts are found under 1 of 16 readings. Which were
    used?
- kind: methods_unavailable
  statement: Relative proximity to the shock zones (Figure 2C) is not defined. Is it a normalised
    difference of distances to the zones, and measured to the zone centre or its nearest edge?
- kind: methods_unavailable
  statement: For the Rayleigh test of the normalised ΔIdir over head direction (Figure S3), is n the
    number of bins or the sum of the weights? With n the number of bins one of 14 tests is
    significant here (p = 0.014); with the sum of weights none is.
- kind: methods_unavailable
  statement: For internally referenced tuning (Figure 4), the Methods normalise the histogram by the
    sum of the time offsets and the code by the occupancy of each displacement; the strength
    measure of Figure 4C is not defined; and the Methods do not say on which side of the cell 1 spike
    the cell 2 spikes are taken. Which normalisation and strength measure were used? Under the
    Methods' normalisation the trial-pair differences of Figure 4D are significant here (p = 5.3e-05
    for instability).
- kind: methods_unavailable
  statement: Which decoded windows are pooled in the Figure 5 error distributions (the Rayleigh z
    values imply about 680 windows), and which measure Figure 5C plots (error by head direction, or
    the signed error histogram)?
- kind: other
  about: data
  statement: The paper reports 142 simultaneously recorded head-direction pairs; the 115 deposited
    units form 146. 142 of them have a defined 5 s internally referenced curve in every condition,
    which may be the count the paper used.
