- claim: fig2-excited-inhibited-split
  outcome: reproduced
  notebook: reproduce_moaddab_2021.ipynb
  output: claim:fig2-excited-inhibited-split
  measured:
  - 130
  - 127
  notes: On the 257 neurons of the authors' screen, baseline-subtracted Hz with the two window means averaged
    gives 130 cue-excited and 127 cue-inhibited, normalized firing (three-cue pool) gives 125/132 or 121/136;
    the four-type pool gives 124/133; pooling the 6 s with Hz gives 118/139 (outside tolerance). The authors'
    normalization gives 131/126. On the Methods' 271 neurons no reading is within tolerance (142 to 155
    cue-inhibited, tolerance 113.4 to 138.6). The authors' split, used for the later claims, and the Hz
    two-means split differ on 25 of the 257 neurons (13 and 12 each way). The claim is tested on the
    257 neurons its statement names; that population is the code's screen (A1).
  deviations:
  - Assumption A1. The neuron groups are those of the authors' code (vpAnalysis.m, lines 7-64 and 1182-1205,
    on the cube built by cubeScriptPR25.m), the screen on rates floored to integers, which gives the paper's
    257 neurons from 153 sessions, and the split by the code's per-trial normalization, which gives the
    paper's 131 cue-excited and 126 cue-inhibited neurons. The Methods do not say rates are rounded; their
    unfloored rates give 271 neurons (groups B, shown as a variant). Chosen because the claims concern
    the neurons the paper analysed, and the code reproduces every count the paper gives.
  assumed: true
- claim: ancova-excited-no-baseline-effect
  outcome: reproduced
  notebook: reproduce_moaddab_2021.ipynb
  output: claim:ancova-excited-no-baseline-effect
  notes: Groups A, 131 cue-excited neurons, baseline x cue x interval F(110,14190) = 1.09, p = 0.235 (three-cue
    pool), 1.12, p = 0.182 (four types), 1.12, p = 0.187 (authors' normalization); paper F(110,14080)
    = 1.12, p = 0.18, whose degrees of freedom imply 130 neurons. On groups B (123 neurons) the interaction
    is significant (p = 0.0006, 0.0001, 0.0003), so the outcome rests on A1.
  deviations:
  - Assumption A1. The neuron groups are those of the authors' code (vpAnalysis.m, lines 7-64 and 1182-1205,
    on the cube built by cubeScriptPR25.m), the screen on rates floored to integers, which gives the paper's
    257 neurons from 153 sessions, and the split by the code's per-trial normalization, which gives the
    paper's 131 cue-excited and 126 cue-inhibited neurons. The Methods do not say rates are rounded; their
    unfloored rates give 271 neurons (groups B, shown as a variant). Chosen because the claims concern
    the neurons the paper analysed, and the code reproduces every count the paper gives.
  - Firing is normalized as the Methods describe (Z-score normalization, trial-averaged 250 ms rates minus
    the trial type's mean 10 s baseline, Z-scored over all bins of all trial types), under the claims
    file's readings O1 (a) and (b). The authors' code instead subtracts each trial's 2 s baseline, floored
    to an integer rate, and Z-scores single trials (cubeScriptPR25.m); this is shown as a variant, and
    it gives the paper's printed values.
  - Univariate repeated measures ANCOVA (sphericity assumed) with the centred baseline rate as covariate,
    written for this entry.
  assumed: true
