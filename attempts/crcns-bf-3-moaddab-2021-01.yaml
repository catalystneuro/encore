- claim: kmeans-three-clusters
  outcome: reproduced
  notebook: reproduce_moaddab_2021.ipynb
  output: claim:kmeans-three-clusters
  measured:
  - 74
  - 34
  - 18
  notes: With one Matlab k-means++ start after rng(1) on groups A's 126 cue-inhibited neurons, Low 74,
    Intermediate 34, High 18, with the claims file's reading (b) for the ISIs (10 s baselines; ANOVA F
    = 545.55, 9.73, 16.67, 17.90, 2.12 for baseline rate, CV, skewness, half duration, amplitude ratio)
    and with the authors' features (20 s baselines, floored baseline rate), which give the paper's F values
    to the printed digits (546.73, 8.79, 18.20, 17.90, 2.12; amplitude ratio p = 0.12). Reading (a) (whole-session
    ISIs) with one start gives 58/48/20. With 100 restarts, k-means finds partitions with lower within-cluster
    sums of squares (groups A, 56/48/22 to 58/46/22; groups B, 74/54/20 or 76/52/20), none within tolerance;
    on the authors' features the global partition has SSE 7254 against 7997 for the paper's. Over seeds
    1 to 300, one start reaches the paper's partition 98 times. Z-scored features (O7 b) give 30/64/32
    or 46/56/24. The partitions of the claims file's reading (b) and of the authors' features have the
    same members (adjusted Rand index 1.000); the lower-SSE partition moves 16 Low neurons to Intermediate
    and 4 Intermediate to High (index 0.579). So the seed and number of starts change the clusters, against
    the claims file's statement that the seed cannot change a conclusion beyond the edge of an interval;
    whether the reading should be Matlab's default of one start is asked in questions/crcns-bf-3.yaml.
  deviations:
  - Assumption A1. The neuron groups are those of the authors' code (vpAnalysis.m, lines 7-64 and 1182-1205,
    on the cube built by cubeScriptPR25.m), the screen on rates floored to integers, which gives the paper's
    257 neurons from 153 sessions, and the split by the code's per-trial normalization, which gives the
    paper's 131 cue-excited and 126 cue-inhibited neurons. The Methods do not say rates are rounded; their
    unfloored rates give 271 neurons (groups B, shown as a variant). Chosen because the claims concern
    the neurons the paper analysed, and the code reproduces every count the paper gives.
  - Assumption A2. The cue-inhibited clusters are those of one Matlab k-means++ start after rng(1) (vpAnalysis.m,
    lines 1485-1487; Methods, K-means clustering, name Matlab's kmeans, whose default is one start), repeated
    here with numpy's Mersenne Twister, which gives Matlab's rng(1) stream. They are Low 74, Intermediate
    34, High 18, the paper's clusters. The claims file's standard choice of 100 restarts gives other clusters
    (58/46/22).
  - Features as the Methods define them, computed from the spike times and the stored mean waveform; half
    duration and amplitude ratio follow the authors' code (vpAnalysis.m, lines 1035-1049).
  assumed: true
