- claim: recorded-units
  outcome: partially_reproduced
  notebook: reproduce_moaddab_2021.ipynb
  output: claim:recorded-units
  measured:
  - 435
  - 14
  - 195
  notes: 435 unit files and 14 rats, as the paper reports. The files hold 195 sessions (distinct session
    file names, each with its own trial table; no rat has two on one date), one more than the paper's
    194. The criterion reads a different count as a difference in the data set. Four pairs of units from
    one session share 70 to 88% of their spikes within 0.1 ms and may be one neuron recorded on two wires;
    they are counted as the paper counts them.
- claim: cue-responsive-screen
  outcome: reproduced
  notebook: reproduce_moaddab_2021.ipynb
  output: claim:cue-responsive-screen
  measured:
  - 271
  - 160
  notes: With the Methods' rates (mean Hz, unrounded), 271 of 435 neurons (62%) from 160 sessions pass
    the screen, within tolerance of 257 and 153, and every rat has one. With the rates floored to integers
    as the authors' code does, and Matlab's ttest treating a constant nonzero difference as significant,
    the screen gives 257 neurons from 153 sessions, the paper's counts. 240 neurons pass under both. The paper gives no chance level;
    the same screen on pre-cue windows (20 to 10 s before onset as baseline, 10 to 9 s and 5 to 0 s before
    onset as the two windows) passes 119 of 435 neurons (27%), near the 26.5% six independent tests at
    0.05 give.
  deviations:
  - The authors' floored rates are shown as a variant (vpAnalysis.m, lines 7-64).
- claim: fig1f-suppression-cue-effect
  outcome: reproduced
  notebook: reproduce_moaddab_2021.ipynb
  output: claim:fig1f-suppression-cue-effect
  notes: Under every reading (groups A or B, 0/0 trials dropped, set to 0, or set to 1 as in the authors'
    code, sessions counted once or per neuron) the rat means order danger (0.92 to 0.93) > uncertainty
    (0.62 to 0.64) > safety (0.11 to 0.13), and the one-way repeated measures ANOVA on 14 rats gives F(2,26)
    = 74.6 to 80.9, p about 1e-11 (main reading 75.80, partial eta squared 0.85; paper 75.34, 0.85). 8
    of 2448 trials are 0/0.
  deviations:
  - Sessions are those with a cue-responsive neuron of groups A (153); groups B (160) give the same outcome.
- claim: fig1f-differential-suppression
  outcome: reproduced
  notebook: reproduce_moaddab_2021.ipynb
  output: claim:fig1f-differential-suppression
  measured:
  - 0.29
  - 0.512
  - 0.802
  notes: All three bootstrap intervals over 14 rats exclude zero under every reading, with means within
    tolerance; main reading danger - uncertainty 0.290 [0.198, 0.391], uncertainty - safety 0.512 [0.359,
    0.720], danger - safety 0.802 [0.639, 0.951] (paper 0.28, 0.52, 0.80).
