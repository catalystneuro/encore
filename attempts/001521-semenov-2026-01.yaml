findings:
- kind: data_missing
  statement: The dandiset holds only the Fluo-4 imaging of Fig. 6. The pulsed-laser potentiometric imaging
    behind Figs. 1 to 5 and 7, which carries most of the paper's findings (21 of 27 claims), is not in
    it. Six other dandisets of the lab (001515, 001516, 001517, 001518, 001525, 001526) name the same
    paper and by their titles hold these experiments, but neither the paper's Data availability (on request)
    nor this dandiset's description points to them.
- kind: metadata_insufficient
  statement: The files give each pulse as a generator voltage (0 to 400 V); the paper reports only field
    strengths and gives no conversion. The voltages of the single-pulse session fit the paper's field
    series at about 3.9 V/cm per V, while the fields the paper names for the trains (230, 650, 780 V/cm)
    fit the train voltages at about 3.3 V/cm per V, so which recordings form the paper's groups cannot
    be settled from the data.
- kind: metadata_error
  statement: Every file states an electrode gap of 1.00 mm and an electrode diameter of 0.5 mm; the paper's
    Methods 2.2 give tungsten rods 500 um in diameter at 1.6 mm spacing.
- kind: other
  statement: In the train session (2025-05-02) each subject is one field of view recorded at 1 to 7 escalating
    voltages after a sham, so the same 82 cells account for 311 exposures to trains. The paper states
    that each cell was tested only once, 28 to 54 cells per field strength, 224 cells in all. Either the
    dandiset holds different recordings from Fig. 6B, or the paper's description is wrong.
- kind: selection_undocumented
  statement: The single-pulse session holds 27 cells in 6 fields of view, recorded at 0 to 400 V; Fig.
    6A averages 14 cells over 0 to 1200 V/cm. The dandiset does not say which cells or recordings the
    paper used, and it holds no cell regions or traces, so the paper's selection cannot be repeated.
- kind: metadata_error
  statement: The dandiset's description and title describe only single 1-us pulses with recordings of
    5 min at 1 frame/s, but 42 of the 73 files are 60-pulse 6 Hz trains recorded for 3 min at 0.5 frame/s.
    Subjects are fields of view of a cell line, yet each has an age of P1D, and the species is named 'Cricetulus
    griseus - Cricetulus aureus' for NCBITaxon 10029 (Cricetulus griseus).
