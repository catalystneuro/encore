  statement: Question for the authors. Unpulsed cells lose 12% (single-pulse session) and 16% (train session)
    of their Fluo-4 signal by the end of a recording relative to the pre-pulse mean. Were the dF traces
    of Fig. 6 corrected for this decline, and which test gave 'not statistically significant' at 780 V/cm?
    Without a correction the end-of-recording dF at 1000 and 1200 V/cm is below zero, and fig6a-ca-sustained
