- claim: fig6a-ca-entry-1000-1200
  outcome: reproduced
  notebook: reproduce_semenov_2026.ipynb
  output: claim:fig6a-ca-entry-1000-1200
  notes: Under M1 (1000 and 1200 V/cm at 250 and 300 V) three of the four readings hold at both fields.
    The end value (last 10 frames) is above the 0 V/cm group by 6.58 and 8.19% (Student's t-test p below
    1e-8), and the peak is above zero (2.30 and 5.35%, p below 1e-6) and above the 0 V/cm peak (p below
    1e-5); the group means at both fields exceed those at 650 V/cm or less (0 and 150 V, at most -10.26%
    for the end value and 0.55% for the peak). The end value against zero fails, as it is negative at
    both fields (-5.44 and -3.83%), with the sham at -12.02%. Under M2 (300 and 350 V) the same three
    readings hold. The peak at 250 and 300 V is above that at 0 V in every field of view recorded at them.
    Cells come from 6 fields of view (18 and 23 cell recordings at 250 and 300 V); the paper averaged
    14 cells, which cannot be identified. The results hold with regions of 0.5 and 1.0 of the radius and
    end windows of 5 and 20 frames.
  deviations:
  - The files give generator voltages and the paper field strengths, with no conversion in either. Two
    readings are run, M1 at 3.9 V/cm per V (the single-pulse voltages fall on the paper's field series
    570 to 1400 V/cm) and M2 at 3.3 V/cm per V (the train voltages 70, 200 and 230 V fall on the 230,
    650 and 780 V/cm named for the trains in Section 3.6); a named field is assigned to the nearest voltage.
    Both give the same outcome.
  - Cells are found by an Otsu threshold and watershed of the pre-pulse mean image, with a circular region
    of 0.7 of each cell's equivalent radius and the median of pixels more than 15 px from any cell as
    background; the paper drew the regions by hand (Methods 2.4) and these are standard choices, shown
    with regions of 0.5 and 1.0 of the radius and end windows of 5 and 20 frames.
  - Every detected cell in every file is used, as the dataset does not say which cells the paper used.
  - The paper names no test for this panel; the claims file's readings (one-sample t-test or Student's
    t-test against 0 V/cm, end value or peak) are all run.
- claim: fig6a-ca-sustained
  outcome: not_reproduced
  notebook: reproduce_semenov_2026.ipynb
  output: claim:fig6a-ca-sustained
  notes: The mean dF over the last 10 frames is below zero at 1000 and 1200 V/cm under M1 (-5.44 +- 0.55%
    and -3.83 +- 0.71%) and at 1000 V/cm under M2 (-3.83%); at 1200 V/cm under M2 (350 V) it is +1.24
    +- 1.95%, p = 0.53. The ratio of final to peak group mean is -63 and -2.4 under M1, -2.4 and 0.18
    under M2. Unpulsed cells decline to -12.0% over the same window, a fall of the Fluo-4 signal through
    the recording that the paper's dF (F0 before the pulse) does not correct. Against the 0 V/cm group
    the end value is higher by 6.6 and 8.2% under M1 (p below 1e-8), and less the same field of view's
    sham trace it is 6.4 and 8.4% above zero (p below 1e-5), so the signal stays above that of unpulsed
    cells to the end of the 5 min, but not above its own pre-pulse level, which is what the criterion
    tests. With other region sizes and end windows the end values move by less than 1% and stay negative
    at 250 and 300 V. The question of how the paper's traces handle the decline is for the authors (see
    findings).
  deviations:
