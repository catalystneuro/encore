- claim: fig6a-780-not-significant
  outcome: reproduced
  notebook: reproduce_semenov_2026.ipynb
  output: claim:fig6a-780-not-significant
  notes: The criterion's test, a one-sample t-test of the end value against zero, finds no increase at
    780 V/cm, with -7.42 +- 0.52% under M1 (200 V, n = 24) and -5.44 +- 0.55% under M2 (250 V, n = 18),
    one-sided p = 1 for both. The variants find an effect. Against the 0 V/cm group the end value is higher
    by 4.60% (M1, p = 1.3e-06), and the peak is 1.76 +- 0.61% (one-sample p = 0.0086; against the sham
    peak p = 0.021). The decline of the signal in unpulsed cells biases the criterion's test toward finding
    no increase, so the outcome says little about the detection limit.
  deviations:
