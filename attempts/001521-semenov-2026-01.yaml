  statement: Question for the authors. How were generator voltages converted to the field strengths of
    Fig. 6, and was the same conversion used for single pulses and trains? Under 3.9 V/cm per V the single-pulse
    voltages fall on the paper's series, under 3.3 V/cm per V the train voltages fall on 230, 650 and
    780 V/cm; the train results (fig6b-train-threshold, fig6b-650-weak-but-significant) differ between
