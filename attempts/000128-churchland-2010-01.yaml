- claim: fig4-no-separate-populations
  outcome: reproduced
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig4-no-separate-populations
  notes: J-array only. Under T1 and T2 with S1 the dip statistic is 0.073 and 0.071 (p 0.596 and
    0.683), so U1 holds, and 18 of 18 and 16 of 17 neurons have |r| below 0.5, so U2 holds. No neuron
    has |r| of 0.8 or more; median r 0.026 and 0.013. S2 selects no neuron. The panel B part of the
    statement (monkey B) cannot be tested.
- claim: fig4e-correlation-time-course
  outcome: reproduced
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig4e-correlation-time-course
  notes: Under T1 and T2 with S1 and rates A1 and A2, the mean correlation is 0.700 to 0.759 at -400
    ms, 0.550 to 0.608 at -200 ms and -0.006 to 0.012 at movement onset, where no test is significant
    (smallest p 0.854). 75% to 82% of the drop from -400 ms to onset comes after -200 ms. S2 selects
    no neuron.
  deviations:
  - Under A2 the criterion's linear joining was implemented as a straight line between the last
    go-locked value and the first movement-locked one where they leave a gap, and a linear fade from
    one to the other where they overlap, with each condition's go cue placed at its mean reaction
    time before onset. A1 and A2 differ only before -300 ms and give the same outcome.
- claim: suppfig1-population-averages
  outcome: reproduced
  notebook: reproduce_churchland_2010.ipynb
  output: claim:suppfig1-population-averages
  notes: The strongest-minus-weakest separation is 0.207 to 0.346 of the maximum rate in the
    preparatory epoch and 0.225 to 0.308 of that at movement onset. R1 holds under every reading; R2
    holds with normalisation (a) (ratios 0.225, 0.240) and not with (b) (0.308, 0.274).
  deviations:
  - The claims file does not say over what the maximum rate is taken; readings (a) all conditions
    and times of the go- and movement-locked averages and (b) the four chosen conditions were run,
    and both give the outcome. Asked in questions/000128.yaml.
