- claim: fig4d-mean-correlation-jarray
  outcome: not_reproduced
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig4d-mean-correlation-jarray
  measured:
  - 0.025
  - 0.054
  notes: No combination of readings puts the means within tolerance or gives p below 0.05. T1 with
    S1, 18 neurons, mean Pearson r 0.025, mean Spearman r 0.054, p 0.64 to 0.67 (P1 to P3). T2 with
    S1, 17 neurons, 0.051 and 0.072, p 0.42 to 0.61. S2 (SD over conditions above 5 spikes/s) selects
    6 units with preparatory tuning and none that also pass the peri-movement rule, so it gives no
    result. The means are positive but below half the paper's 0.13 and 0.11.
  deviations:
  - The dataset has 182 units, not the paper's 146, and the paper's unit selection is not
    recorded; the selected neurons may differ from the paper's.
  - Under T1 two conditions keep no trial and are left out (106 conditions).
- claim: fig4abc-mean-correlation-single-electrode
