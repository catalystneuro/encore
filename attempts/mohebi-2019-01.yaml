- claim: fig1b-latency-scales-with-reward-rate
  outcome: reproduced
  notebook: reproduce_mohebi_2019.ipynb
  output: claim:fig1b-latency-scales-with-reward-rate
  notes: 21 distinct bandit sessions (29 units; units of one session share identical events and are counted
    once), 6189 trials with a latency. Pearson r of the leaky-integrator reward rate at Light-On with
    log(latency) is negative in 21 of 21 sessions, mean -0.307 (one-sample t = -12.50, p = 6.6e-11), range
    -0.496 to -0.136; best tau 12 to 295 s, median 58 s, none at the grid's edge. Because tau is chosen
    to make r negative, a null was computed by repeating the choice of tau on latencies shuffled within
    the session (200 shuffles); 19 of 21 sessions have r below the null's 1st percentile. With one tau
    of 58 s for every session, r is negative in 21 of 21 (mean -0.291). The paper's statement covers its
    photometry and microdialysis rats too; only the electrophysiology sessions are in the data set.
  deviations:
  - Only the 21 electrophysiology bandit sessions are in the data set; the criterion names the photometry
    and microdialysis sessions as further readings where available.
  - A reward is counted at the rewarded Side-In, when the Results say the food hopper clicks; the Methods
    say only that reward rate is incremented each time a reward was received. A standard choice; no Light-On
    falls between Side-In and Food-Port-In.
  - Latency is Center-In minus Light-On from the event table, as the claims file defines it; the CNIlatency
    field is clipped at 65535 ms and not used. One trial with no latency (IM-1002_170118) is left out.
  - tau searched on a 1 s grid from 1 to 1200 s (Extended Data Fig. 1 legend gives the range); the shuffled-latency
    null uses 76 log-spaced values to keep the run short.
