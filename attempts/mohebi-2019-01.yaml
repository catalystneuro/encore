- claim: fig2-tagged-dopamine-cells
  outcome: partially_reproduced
  notebook: reproduce_mohebi_2019.ipynb
  output: claim:fig2-tagged-dopamine-cells
  measured:
  - 23
  - 2
  notes: Only the 29 cells the paper selected are deposited, so the test is whether each passes the paper's criteria.
    SALT (Kvitsiani et al. 2013 defaults) on the 5 and 10 ms trains at 2 Hz gives p < 0.001 for 26 of the 27 VTA-l
    cells and both IM-1078 cells; none of the 29 passes with sham pulse times 250 ms later. IM1003170321t01c has
    p = 0.087 (5 ms) and 0.05 (10 ms), though p < 0.001 for two of its 1 ms trains. The correlation of the light-evoked
    with the session-wide waveform exceeds 0.9 for 23 of 27 VTA-l cells and 2 of 2 IM-1078 cells on the largest
    wire, and for 18 and 1 with the four wires concatenated, where the Methods say all light-evoked units exceeded
    0.9. Cells meeting both criteria are 23 and 2 (largest wire, given as measured) or 18 and 1 (four wires); 23
    is outside 27 +- 2.7, and 2 matches. By rat the data hold IM657 1, IM1002 3, IM1003 15, IM1037 8, IM-1078 2;
    the Methods give IM1037 9. Counting the two units with no 5 or 10 ms pulses as failing, instead of testing their
    1 ms trains, gives 24 light-responsive VTA-l cells and 22 (largest wire) or 17 (four wires) passing both criteria;
    no reading brings the VTA-l total within tolerance.
  deviations:
  - The selection cannot be repeated from all recorded units, which are not deposited; only the deposited cells
    are tested against the criteria.
  - Units IM657160613t11a and IM1002170114t05b received no 5 or 10 ms pulses (their longest pulses are 1 ms, by
    the pulseWidth field); their 1 ms trains at 2 Hz are tested instead. This substitution is this attempt's choice,
    not the criterion's; counting both units as failing is shown and gives 22 (largest wire) and 17 (four wires).
  - SALT's baseline is the 400 ms before each pulse, with the test's published 10 ms window and 1 ms bins (claims
    file criterion); the baseline length is a standard choice. With 40 baseline windows the null has 780 distances,
    so the smallest nonzero p is 0.0013 and p < 0.001 means p = 0.
  - The waveforms are the deposited meanWave and meanLightEvoked; which wires the paper correlated is not given,
    and both readings are shown.
