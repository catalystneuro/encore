- claim: ed5a-pavlovian-behavior
  outcome: reproduced
  notebook: reproduce_mohebi_2019.ipynb
  output: claim:ed5a-pavlovian-behavior
  notes: 'Seven distinct sessions with 75/25/0% tones (IM-1037 and IM-1078). Fraction of 0.3 to 3 s after cue onset
    at the food port, one-way ANOVA across the three tones per session: the 75% cue is highest with p < 0.05 in
    5 of 7 sessions, all 5 with p < 1.2e-6 (largest F 55.6, smallest p 1.1e-17); whether the rat entered the port
    at any time in the epoch gives the same counts (largest F 76.6). In the 14 sessions with 100/50/0% tones the
    high cue is highest in 11 but p < 0.05 in only 2 (fraction) or 5 (any entry).'
  deviations:
  - The food-port status (portStatus) is taken as aligned on trial onset from 2 s before to 10 s after (its Win
    field), at 30 kHz (360000 samples over 12 s); neither is documented, and occupancy rising after the click on
    unpredicted trials is consistent with it. Kept at 1 kHz.
- claim: fig2efgh-tonic-firing-indifferent-to-reward-rate
  outcome: partially_reproduced
  notebook: reproduce_mohebi_2019.ipynb
  output: claim:fig2efgh-tonic-firing-indifferent-to-reward-rate
  notes: 'Blocks split per session at the median of block-mean reward rate (high blocks have a mean reward rate
    2.10 rewards higher on the integrator''s scale). The two readings disagree. Reading (b), rank-sum of block-mean
    rates: 2 of 27 cells differ at p < 0.05 with the median block dropped, 0 with it put low; with 2 or 3 blocks
    a side, 6 of the 27 cells cannot reach p < 0.05 even with complete separation, so this reading has little power.
    Reading (a), rank-sum of 1 min bin rates: 18 of 27 cells differ (19 with the median block put low), against
    1.35 expected (binomial p = 1.2e-17); regressing bin rates on block type and time in session, 16 of 27; against
    circular shifts of the bins'' high/low labels, which keep the bins'' serial dependence, 9 of 27 (7 with the
    median block put low; binomial p = 4.0e-6). Across cells firing is higher in high-reward blocks by a median
    0.50 Hz (range -0.63 to 1.38 Hz; signed-rank p = 0.0006). Tonic firing changes little, about 0.5 Hz on a mean
    near 7.7 Hz, as the paper describes, but individual cells change under every test with the power to detect it,
    where the claim says none did. The question of the test is put to the authors (findings).'
  deviations:
  - The test of Fig. 2f is in the unread legend; the claims file names two readings, both run. Reading (a) is also
    run against circular shifts of the high/low labels of the 1 min bins (shifts of 10 or more bins), because the
    bins are not independent; the minimum shift is a standard choice.
  - With an odd number of blocks the median block is dropped (a standard choice); putting it with the low blocks
    is shown as a variant.
  - 1 min bins are laid from the session's first Light-On, and a bin counts for a block when it lies wholly inside
    it; block limits run from a block's first attempt to the next block's first attempt.
