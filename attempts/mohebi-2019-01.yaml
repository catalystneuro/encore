- claim: fig5a-early-trial-firing-not-reward-rate
  outcome: not_reproduced
  notebook: reproduce_mohebi_2019.ipynb
  output: claim:fig5a-early-trial-firing-not-reward-rate
  notes: 29 cells. Firing in the 0.5 s after Light-On correlates with reward rate at p < 0.01 in 8 cells (7 positive),
    against 1% by chance (binomial p = 3.6e-10); in the 0.5 s before Center-In in 6 cells (4 positive; p = 3.9e-7).
    The population Friedman test across reward-rate terciles finds no dependence (p = 0.080 and 0.19); tercile means
    after Light-On are 8.53, 8.76 and 8.92 Hz. With the 27 cells, 8 and 6 cells (binomial p = 1.9e-10 and 2.5e-7)
    and Friedman p = 0.20 and 0.32. The criterion requires neither test to show a dependence; the per-cell count
    does, with firing mostly higher at higher reward rate. The second part of the statement (reward rate affects
    motivation) is fig1b, reproduced. Against circular shifts of reward rate over trials (shifts of 20 or more trials),
    which keep the serial dependence the Pearson p-values ignore, 1 and 2 of 29 cells are significant (binomial
    p = 0.25 and 0.034), so most of the per-cell count may come from slow drift shared by firing and reward rate;
    the outcome follows the criterion's Pearson test.
  deviations:
  - The windows and test of Fig. 5a are in the unread legend; the claims file names the readings, all run.
  - The circular-shift null is a variant added at the verifier's request; the minimum shift of 20 trials is a standard
    choice.
