findings:
- kind: data_missing
  statement: The data set holds only the spike times and behaviour of the 29 tagged dopamine cells. The paper's
    microdialysis (26 sessions, 12 rats), dLight photometry (10 sessions), in vitro dLight imaging, CTb histology
    and the untagged VTA-l units recorded with the tagged cells (including the 38 non-dopamine cells) are not in
    it, though the paper says all data will be available through CRCNS. 20 of the 37 claims cannot be tested.
- kind: metadata_error
  statement: The data description says the 29 cells were recorded from 4 rats; they come from 5 (IM-657 1, IM-1002
    3, IM-1003 15, IM-1037 8, IM-1078 2), the last being the rat with NAc core virus.
- kind: format_error
  statement: The CNIlatency field ("latency to center-nose-in", ms) is stored as 65535 for every latency above 65.535
    s (120 trials in 19 of 21 sessions), the largest 16-bit integer; and in 4 sessions one value differs from Center-In
    minus Light-On by more than 5 ms (in IM-657_160613 the last trial repeats the previous trial's value). ReactionTime
    also differs from Center-Out minus Go cue by up to 273 ms in 3 sessions.
- kind: format_error
  statement: Spike times are not in ascending order in at least one segment of 13 of the 29 units (inversions of
    under 1 ms, for example 2399.4926 after 2399.4930 s in IM657160613t11a).
- kind: paper_inconsistency
  statement: The Methods give the tagged cells per rat as IM657 1, IM1002 3, IM1003 15 and IM1037 9, which sums
    to 28, while the text says 27 VTA-l cells. The data hold 8 IM1037 cells (27 in all). Extended Data Fig. 5b gives
    9 cells with 75/25% Pavlovian tones and 18 with 100/50%; the data hold 8 and 19, the IM657 cell having 100/50%
    tones.
- kind: metadata_insufficient
  statement: Several fields are not described. The FR field ("session-wide average firing rate") matches none of
    the rates computable from the segments (it differs from the bandit-task rate by up to 1.95 Hz). The seven rows
    of the bandit event table are named only in Fig5_replicate.m, and the two rows of the Pavlovian one not at all.
    The Pavlovian portStatus window (Win, -2 to 10 s) does not say what it is aligned to, nor its 30 kHz sampling.
    meanWave and meanLightEvoked have no units or sampling rate.
- kind: other
  statement: 'Against the Methods'' identification criteria: the deposited light-evoked and session-wide mean waveforms
    correlate below 0.9 for 4 of the 27 VTA-l cells on the largest wire (9 with the four wires), where the Methods
    say all light-evoked units exceeded 0.9; units IM657160613t11a and IM1002170114t05b received no 5 or 10 ms pulses,
    where the Methods require p < 0.001 for 5 and 10 ms trains; and IM1003170321t01c is not significant by SALT
    with its 5 and 10 ms trains (p = 0.087 and 0.05), though it is with 1 ms trains.'
- kind: code_mismatch
  statement: The authors' script in the data set (Fig5_replicate.m) splits trials by the number of rewards in the
    previous 10 trials into four groups (0-2, 3-5, 6-7, 8-10), while Fig. 5a and Extended Data Fig. 8 use terciles
    of the leaky-integrator reward rate. Its Gaussian kernel has SD 20 ms (getFiringRate.m, sigma = twsize = 0.02),
    where the Methods say variance 20 ms.
- kind: methods_unavailable
  statement: 'Question for the authors on Fig. 2f,h: which per-cell test compared tonic firing between high- and
    low-reward blocks, and on what samples (1 min bins, as the Methods count tonic spikes, or block means), and
    how was the median block handled with an odd number of blocks? With rank-sum tests on 1 min bins 18 of 27 cells
    differ (p < 0.05), 9 against circular shifts of the block labels, and firing is higher in high-reward blocks
    by a median 0.50 Hz; with block means 2 (or 0) cells differ, but 6 of 27 cells have too few blocks for that
    test to reach p < 0.05.'
- kind: methods_unavailable
  statement: 'Question for the authors on the time-to-cue-response test (Methods, Analysis, paragraph 1, and Fig.
    4c,e): what was shuffled, how was the correction for multiple comparisons made, and over what post-cue window?
    With paired shuffles and Bonferroni over the bins of a 0.5 s window, 16 of 27 cells respond to Light-On (13
    with 1 s, 22 without correction), where the paper reports 25. This attempt adopted the 0.5 s window.'
- kind: methods_unavailable
  statement: 'Question for the authors on Extended Data Fig. 8: is the pause the longest interval between spikes
    within the 2 s after unrewarded Side-In, does it include the intervals to the window''s bounds, or is it the
    longest whole inter-spike interval overlapping the window, and what smoothing gave the valley? Intervals between
    spikes only give the paper''s 2/29 pause cells; counting the bounds gives 8 (5 after correction) and whole intervals
    9 (5). With the 20 ms kernel, or the 4.5 ms one, the valley is 0 Hz on nearly every unrewarded trial, so it
    cannot correlate with reward rate. The data set''s Fig5_replicate.m computes neither.'
