- claim: fig4ac-dopamine-cue-responses
  outcome: partially_reproduced
  notebook: reproduce_mohebi_2019.ipynb
  output: claim:fig4ac-dopamine-cue-responses
  notes: 'Time-to-cue-response shuffle test (40 ms bins in 20 ms steps, 10,000 paired shuffles against the 250 ms
    before the event, p < 0.01 Bonferroni over the bins). With the 0.5 s window: Go cue 27 of 27, rewarded Side-In
    24 of 27, Light-On 16 of 27 (59%), so two events reach the 75% read as a great majority and Light-On exceeds
    half only. With the 1 s window: 27, 25 and 13 of 27 (Light-On 48%). Without the correction 22 of 27 respond
    to Light-On (0.5 s window). With events shifted 5 s earlier no cell responds. Median first significant bin 0.12
    s (Light-On), 0.04 s (Go), 0.06 s (Side-In). On trials with latency over 0.5 s only, so that no Center-In falls
    in the 0.5 s window, 11 of 27 respond to Light-On (median 258 of 298 trials kept), so leaving Center-In out
    of the window does not bring the count nearer the 75% bar.'
  deviations:
  - 'The post-cue window over which bins are tested is not given. Assumed: 0.5 s, because the Methods'' test looks
    for the first significant bin after a cue and the responses are described as rapid; the 1 s window (Bonferroni
    over 49 bins) is shown and gives the same outcome for the Go cue and Side-In, and under half of the cells for
    Light-On.'
  - What the shuffle exchanges is not given; here it swaps, trial by trial, the post-cue bin rate and the baseline
    rate (a paired permutation). The correction is read as Bonferroni over the bins tested (claims file header).
