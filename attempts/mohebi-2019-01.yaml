- claim: fig2efgh-tonic-firing-indifferent-to-reward-rate
  outcome: not_reproduced
  notebook: reproduce_mohebi_2019.ipynb
  output: claim:fig2efgh-tonic-firing-indifferent-to-reward-rate
  notes: 'Blocks split per session at the median of block-mean reward rate (high blocks have a mean reward
    rate 2.10 rewards higher on the integrator''s scale). Reading (a), rank-sum of 1 min bin rates (bins
    wholly inside a block): 18 of 27 cells differ at p < 0.05 (19 of 27 with the median block put low),
    against 1.35 expected by chance (binomial p = 1.2e-17); regressing bin rates on block type and time
    in session, 16 of 27 still differ. Across cells firing is higher in high-reward blocks by a median
    0.50 Hz (range -0.63 to 1.38 Hz; signed-rank p = 0.0006). Reading (b), rank-sum of block-mean rates:
    2 of 27 cells differ with the median block dropped, 0 with it put low (4 to 12 blocks per session).
    The readings disagree, so the outcome rests on reading (a). The question is put to the authors (findings).'
  deviations:
  - 'The test of Fig. 2f is in the unread legend; the claims file names two readings. Assumed: reading
    (a), the per-cell rank-sum of 1 min bin rates, because the Methods say that for comparing tonic firing
    to reward rate dopamine spikes were counted in 1 min bins (Methods, Electrophysiology, Analysis, paragraph
    1). Reading (b) is shown and gives 2 or 0 significant cells.'
  - With an odd number of blocks the median block is dropped (a standard choice); putting it with the
    low blocks is shown as a variant.
  - 1 min bins are laid from the session's first Light-On, and a bin counts for a block when it lies wholly
    inside it; block limits run from a block's first attempt to the next block's first attempt.
  assumed: true
