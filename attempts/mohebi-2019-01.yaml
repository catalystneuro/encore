- claim: ed5a-pavlovian-behavior
  outcome: reproduced
  notebook: reproduce_mohebi_2019.ipynb
  output: claim:ed5a-pavlovian-behavior
  notes: 'Seven distinct sessions with 75/25/0% tones (IM-1037 and IM-1078). Fraction of 0.3 to 3 s after
    cue onset at the food port, one-way ANOVA across the three tones per session: the 75% cue is highest
