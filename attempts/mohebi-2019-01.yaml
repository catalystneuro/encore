  - 19
  notes: Peak spike density (20 ms SD) in the 0.5 s after the click, rewarded trials. Means over the 27 cells are
    unpredicted 47.3, medium 42.3, high 37.5 Hz, ordered as the claim states (50 ms bins 46.5, 41.8, 37.1; 29 cells
    48.9, 43.9, 39.1), and 16 of 27 cells show the order individually. The per-cell one-way ANOVA has p < 0.05 in
