    data hold 8 VTA-l cells with 75/25% tones and 19 with 100/50%; 19 is within 18 +- 1.8 and 8 is outside 9 +-
    0.9. The click times are the FoodDrop events, 3.136 s after trial onset. With the SD 4.5 ms kernel (the claims
    file's primary reading of variance 20 ms) the means are 112.6, 104.7 and 101.3 Hz, still ordered, and the ANOVA
    has p < 0.05 in 7 of 27. The tone-set count of 8 against 9 follows from the data holding 8 IM-1037 cells where
    the Methods give 9.
  deviations:
