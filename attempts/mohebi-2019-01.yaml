    the window, 2 and 2, which drops 50 of 3695 trials (38 in one cell). Only the last matches the paper''s 2/29.
    Under every reading fewer cells code negative RPE by the pause than code positive RPE by the peak (21 before,
    17 after correction). The valley part cannot be tested: the minimum of the 20 ms spike density is under 0.5
    Hz on all 3695 unrewarded trials and the same on every trial in 21 (1 to 3 s window) and 27 (0 to 2 s) of the
    29 cells, and in all 29 with the SD 4.5 ms kernel, so no valley correlation can be significant and the comparison
    with the peak holds by construction. The authors'' Fig5_replicate.m computes neither the valley nor the pause.
    Population pause by tercile 0.49, 0.52, 0.55 s (Friedman p = 9.7e-5, bounds reading). Measured is the bounds
    reading before correction.'
  deviations:
  - How the pause is measured at the window's edges is not given (Extended Data Fig. 8 legend, maximum inter-spike
    interval within 2 s after unrewarded Side-In); three readings are run and they disagree, so the outcome is partial
    and rests on no single one.
  - The valley uses the 20 ms SD kernel of the authors' code, and the SD 4.5 ms kernel as a variant; with either
    the minimum is 0 Hz on nearly every trial. The paper does not say how its valley avoided this, and the authors'
    code in the data set does not compute it.
  - Correction for the 2/29 count is read both ways (before and after Bonferroni over 29).
