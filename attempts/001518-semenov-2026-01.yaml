  deviations:
  - The mean of per-image dF over the pulse images equals the collapsed-image dF, as both use the
    same F0; the Fig. 2 and Fig. 4 measures coincide.
  - FluoVolt n is 5 experiments here, against 4 in the paper.
  - Mapping, cell, trace, pixel and background choices as in fig3-dye-sensitivity.
- claim: fig2a-fluovolt-stable
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_semenov_2026.ipynb
  output: claim:fig2a-fluovolt-stable
  notes: In the baseline images (bottom mapping, experiment means, the four sets at the paper's
    levels) the cathodic pole at 150 V/cm changes by -2.65% from the first 10 to the last 10 images
    (2-tailed paired t-test p = 0.010, n = 5), and with the first and last image 1 of 8 baseline
    tests is also significant. The other baseline changes lie between -2.2% and +0.02%. With the
    cell nearest the centre and 10-image windows none of 8 differ; over all 19 sets 4 to 9 of 38
    tests differ by reading, near what 38 tests at p < 0.05 give by chance. The pulse sets at 1000
    to 1400 V/cm exist only under the top mapping, where none of the 6 tests differs (changes -0.8
    to -2.0%, p 0.09 to 0.54). The criterion counts any significant baseline change, so the claim
    is not reproduced, with a small (about 2%) bleaching drift as the effect.
  deviations:
  - The sets are those nearest the paper's levels; all 19 sets are shown as a variant.
