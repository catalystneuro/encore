inputs:
- what: The charging time constant of Eq. (1), tau = 44.5 ns/um times the cell radius, the fit through
    the origin of tau against radius in the Results of reference [20] of the paper (Semenov et al. 2025,
    Bioelectrochemistry 168, 109143), which the paper's Methods 2.3 say this study used. Read from the
    open-access full text (PMC12553484).
  source: doi:10.1016/j.bioelechem.2025.109143
outcomes:
- claim: fig3-dye-sensitivity
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_semenov_2026.ipynb
  output: claim:fig3-dye-sensitivity
  measured:
  - 6.1
  - 2.37
  - 0.775
  - 0.481
  notes: Under the adopted reading (top mapping, background subtracted, equal-area radius, all responding
    cells, the four sets from 140 to 336 V/cm) FluoVolt gives 6.10% dF per 100 mV (26 +- 2.6) with r 0.775
    (Pearson) and 0.743 (uncentred), against 0.96 +- 0.096, and Di-8-ANEPPS 2.37% (9.1 +- 0.91) with r
    0.481 and 0.402 (0.78 +- 0.078). Over the 16 top-mapping readings the slopes are 2.72 to 6.10 and
    0.83 to 2.37; by experiment 5.36 to 6.64 and 2.20 to 2.53. The slope varies as one over the factor;
    the paper's slopes would need 1.31 and 1.46 V/cm per V, far below the 4.64 to 7.19 of the electrode
    geometry. Under the bottom variant, which was set from this same response, the slopes are 23.98 and
    10.52 with r 0.908 and 0.824. None of 32 readings and no factor from 1.5 to 8 meets the criterion
    for both dyes. With the edge trace the slopes are 4.5 and 1.8 at the adopted factor.
  deviations:
  - The pulse is given in volts; the factor to V/cm is assumed to be 5.6 V/cm per V (1400 V/cm at 250
    V, the top mapping). A two-dimensional model of the electrodes of Methods 2.2 (rods 0.5 mm in diameter,
    1.6 mm apart) gives 4.64 to 7.19 V/cm per V at the midpoint, depending on whether 1.6 mm is the gap
    or the centre distance. The bottom mapping (43 V/cm at 25 V, 1.72 V/cm per V) matches the paper's
    dye sensitivities, which fig3-dye-sensitivity tests, and is run as a variant. Every criterion is also
    run over factors from 1.5 to 8 V/cm per V.
  - Each field of view holds 3 to 6 cells; the paper used one cell per experiment and does not say which.
    Experiment means (adopted), the cell nearest the image centre and all cells are run.
  - The membrane trace is found automatically (peak of the baseline image along rays from the cell centre,
    6 samples 1 pixel apart), not drawn by hand; 360 points at equal angles stand for the resampling along
    the perimeter (Methods 2.3). In some cells the trace is drawn inwards by bright spots inside the cell,
    and one object in c7 is two touching cells; a trace that follows the cell edge is run as a variant
    over every criterion and changes no result at the adopted factor.
  - Pixel size 0.267 um (16-um camera pixels over the 60x objective of Methods 2.3) is assumed; the files
    give none. The mean radius is 6.7 um with the peak trace and 9.9 um with the edge trace, against the
    about 8 um the paper uses in Eq. (2).
  - Frame 0 and other dark frames (laser misfires) are left out, so most baselines have 39 images.
  - Background subtraction (median of cell-free pixels of the same image) is adopted; the paper states
    it only for Ca2+ imaging (Methods 2.4). No subtraction and the camera offset alone are run as variants.
