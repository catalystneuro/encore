findings:
- kind: data_missing
  statement: The dandiset holds ten escalations of 1-us pulses, 19 sets each from 25 to 250 V, five with
    FluoVolt and five with Di-8-ANEPPS, all from 2025-01-24. It holds none of the alternating sets (Fig.
    2C, D), 0.3-us pulses (Fig. 4D), Gd3+ experiments (Fig. 5), Ca2+ imaging (Fig. 6) or two-pulse experiments
    (Fig. 7). Its voltages span a factor of 10, so it cannot hold the paper's 43 to 1400 V/cm escalation
    (a factor of 33, in 9 sets). The paper's FluoVolt series has n = 4; the dandiset has 5.
- kind: metadata_insufficient
  statement: The files give the pulse amplitude in volts, and the paper reports field strengths in V/cm
    from Sim4Life modelling; neither the files, the paper nor its reference [20] give the factor between
    them, so the sets cannot be matched to the paper's field strengths without assuming one.
- kind: metadata_error
  statement: Every file states an electrode distance of 1.00 mm, while the paper's Methods 2.2 state 1.6
    mm. A two-dimensional model of two 0.5-mm rods gives 8.0 to 17.5 V/cm per volt at the midpoint for
    1.00 mm and 4.6 to 7.2 for 1.6 mm (gap or centre distance). The paper's dye calibration, applied to
    the low-field response, would imply about 1.5 V/cm per volt, so either the stated geometry and voltage
    do not describe the field, or the dyes respond less here than in the paper.
- kind: identifier_missing
  statement: Each field of view holds 3 to 6 cells, while the paper analysed one cell per experiment.
    Nothing in the files identifies the cell analysed, or gives cell outlines.
- kind: metadata_insufficient
  statement: The files give no pixel size, no field direction and no description of which images carry
    the pulse. The field direction (cathode-facing side towards the bottom of the image, 94 to 106 degrees)
    and the pulse onset at image 41 are clear from the data.
- kind: other
  statement: Frame 0 is dark (laser not fired) in 175 of 190 sets, and 51 other frames in 45 sets are
    dark; the files do not mention it. With these frames left out, most baselines have 39 lit images,
    not 40.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) What field strength in V/cm does each pulse amplitude
    in the files correspond to, and are these the escalations of Fig. 2A, 2B and 3 or other experiments?
    The attempt assumed 1400 V/cm at 250 V (5.6 V/cm per volt), from the electrode geometry, and ran 1.5
    to 8. (2) Which cell in each field of view was analysed? The attempt ran experiment means, the cell
    nearest the image centre and all cells. (3) Was background subtracted from the laser images, as for
    Ca2+ (Methods 2.4)? The attempt subtracted the cell-free median; without it dF halves. (4) What is
    the pixel size? The attempt assumed 0.267 um.
- kind: paper_inconsistency
  statement: Eq. (2) with the constants the Methods give (lambda_i 0.4 S/m, lambda_o 1.64 S/m, R 8 um,
    d 5 nm, lambda_m 3e-7 S/m) gives a 1.3% IMP reduction for a 10-fold rise in membrane conductivity,
    while Results 3.5 says about 2%; the 100-fold value (11.9%) agrees with the stated 12%.
