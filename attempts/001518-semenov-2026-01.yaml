inputs:
- what: The charging time constant of Eq. (1), tau = 44.5 ns/um times the cell radius, the fit
    through the origin of tau against radius in the Results of reference [20] of the paper
    (Semenov et al. 2025, Bioelectrochemistry 168, 109143), which the paper's Methods 2.3 say
    this study used. Read from the open-access full text (PMC12553484).
  source: doi:10.1016/j.bioelechem.2025.109143
outcomes:
- claim: fig3-dye-sensitivity
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_semenov_2026.ipynb
  output: claim:fig3-dye-sensitivity
  measured:
  - 23.98
  - 10.52
  - 0.908
  - 0.824
  notes: Under the adopted reading (bottom mapping, background subtracted, equal-area radius, all
    40 responding cells, the 18 sets from 43 to 344 V/cm) FluoVolt gives 23.98% dF per 100 mV
    (26 +- 2.6) with r 0.908 (Pearson) and 0.902 (uncentred), and Di-8-ANEPPS 10.52% (9.1 +- 0.91,
    just above the bound of 10.01) with r 0.824 and 0.804 (0.78 +- 0.078). With the cell nearest
    the image centre Di-8-ANEPPS gives 9.04 and FluoVolt 22.46 (below 23.4). None of the 32
    readings has both slopes within tolerance, so three of the four expected values hold under
    the adopted reading and each slope holds under some reading. Without background subtraction
    the slopes are 11.67 and 5.28; under the top mapping 6.10 and 2.37. By experiment the slopes
    are 21.2 to 25.9 (FluoVolt) and 10.0 to 11.3 (Di-8-ANEPPS). The mapping was checked against the
    same low-field response, so the agreement supports the mapping and the paper's calibration
    together and does not test either alone.
  deviations:
  - The pulse is given in volts; the factor to V/cm is assumed to be 43 V/cm at 25 V (1.72 V/cm
    per V), from the paper's lowest level and the dataset's lowest voltage. The low-field response
    of each dye under the paper's calibration implies a median of 1.5 to 1.6 V/cm per V; the
    alternative, 1400 V/cm at 250 V, would make both dyes 3 to 4 times less sensitive. The top
    mapping is run as a variant.
  - Each field of view holds 3 to 6 cells; the paper used one cell per experiment and does not say
    which. All responding cells (adopted) and the cell nearest the image centre are both run.
  - The membrane trace is found automatically (peak of the baseline image along rays from the
    cell centre, 6 samples 1 pixel apart), not drawn by hand; 360 points at equal angles stand
    for the resampling along the perimeter (Methods 2.3).
  - Pixel size 0.267 um (16-um camera pixels over the 60x objective of Methods 2.3) is assumed;
    the files give none. The mean radius is 6.7 um, against the about 8 um the paper uses in Eq. (2).
  - Frame 0 and other dark frames (laser misfires) are left out, so most baselines have 39 images.
  - Background subtraction (median of cell-free pixels of the same image) is adopted; the paper
    states it only for Ca2+ imaging (Methods 2.4). Both readings are shown.
- claim: fig3-fluovolt-nonlinear
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_semenov_2026.ipynb
  output: claim:fig3-fluovolt-nonlinear
  notes: Under the bottom mapping the FluoVolt smooth departs from the fitted line at every |IMPC|
    from 220 mV to the end of the data (440 mV) under all four smooths (at +400 mV it is 21 to 47%
    of the line, at -400 mV 45 to 68%), as the paper says. Di-8-ANEPPS departs too, at 58 to 64 grid
    points under every smooth (57 to 84% of the line at +400 mV, 48 to 79% at -400 mV), so it does
    not stay linear over the +-430 mV the data cover. Under the top mapping FluoVolt does not depart
    under any LOWESS span and Di-8-ANEPPS departs, so the claim fails under both mappings. The
    data reach +-430 mV, not the paper's +-500 mV.
  deviations:
  - Points, line and readings as in fig3-dye-sensitivity (adopted reading); LOWESS with delta of 1%
    of the IMPC range, a standard speed-up.
- claim: fig2a-fluovolt-saturation
