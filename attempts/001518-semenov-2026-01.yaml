  outcome: not_reproduced
  assumed: true
  notebook: reproduce_semenov_2026.ipynb
  output: claim:fig3-fluovolt-nonlinear
  notes: Under the top mapping the FluoVolt smooth does not depart from the line at |IMPC| of 220 mV and
    above under any LOWESS span (0 of 48 grid points; 12 of 42 with 50-mV bins); it lies above the line
    (107 to 113% of it at +220 mV, 128 to 134% at -220 mV). Di-8-ANEPPS departs at 22 to 23 grid points
    under every smooth, near zero on the positive side, from the uniform bleaching offset. With each profile's
    offset removed FluoVolt still does not depart, and Di-8-ANEPPS departs under span 0.3 and bins but
    not under 0.5 and 0.75. Under the bottom variant FluoVolt departs from 220 mV under every smooth,
    but Di-8-ANEPPS departs at 58 to 64 points (40 to 50 with the offset removed). No factor from 1.5
    to 8 meets the criterion.
  deviations:
  - Points, line and readings as in fig3-dye-sensitivity (adopted reading); LOWESS with delta of 1% of
    the IMPC range, a standard speed-up.
  - The fit through the origin keeps the uniform bleaching offset of each profile, as the paper reports
    bleaching in its own Di-8-ANEPPS dF (Results 3.2, paragraph 3); removing it is run as a variant.
