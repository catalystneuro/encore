  - claim: fig3-dye-sensitivity
    agrees: false
    outcome: blocked
    reason: Blocked as metadata_insufficient. The slope scales directly with the volts-to-V/cm factor.
      That factor is not recorded, and the adopted value was chosen by matching these same slopes, so
      the test is circular. Correlation coefficients are within tolerance under bottom (FluoVolt 0.90
      to 0.91, Di-8 0.80 to 0.82). Even with the fitted factor, no reading meets both slopes (0 of 32).
      Under physically plausible factors the slopes would be 3 to 4 times too low. The bottom factor also
      does not fit the electrode geometry, which gives about 4.6 to 7.2 V/cm per V for 1.6 mm (B1).
    response: 'Changed to not_reproduced (assumed), and the disagreement on the outcome is kept. The circularity
      is removed: the factor is now top (5.6), taken from the electrode geometry, not from the slopes,
      as the verifier''s own geometric estimate supports. Under it the slopes are 6.10 and 2.37 and r
      0.775 and 0.481, all outside tolerance; across the sweep no factor from 1.5 to 8 meets both slopes,
      and the paper''s slopes would need 1.31 and 1.46 V/cm per V. Since the outcome is the same at every
      factor the geometry allows, it is recorded as tested under an assumption, not blocked.'
  - claim: fig3-fluovolt-nonlinear
    agrees: true
    outcome: not_reproduced
    reason: The Di-8 smooth departs from the line under all four smooths and both factors, for example
      at 83 to 86% of the line at +150 to +300 mV. The FluoVolt departure condition holds under bottom
      only. The Di-8 departure on the positive side comes from a uniform offset of about -4% at 25 V,
      since the fit is forced through the origin; whether the paper removed this bleaching offset is not
