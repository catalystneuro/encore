- claim: fig6a-more-packets-more-uptake
  outcome: reproduced
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig6a-more-packets-more-uptake
  notes: Under the primary reading (both diagonals averaged, raw counts, the two central ROIs, the
    mean of the two ends, the mean of the two side minima) the means for 4, 20 and 40 packets are
    544, 3240 and 9712 counts at the periphery, 674, 2631 and 5172 at the center and 479, 1148 and
    1880 at the least affected area; 40 exceeds 4 at each place by a two-sided Student's t-test (3
    dishes each, p = 0.016, 0.00076 and 0.00079). The order holds in all 108 combinations of the
    claims file's readings; all three tests pass in 48 and at least one in the other 60. Only the
    periphery test fails, in the 36 combinations on diagonal A alone and the 24 that take the
    periphery from one end (p up to 0.128). With the ROI extent taken from the footprints the
    primary reading gives p = 0.035, 0.0008 and 0.0008.
  deviations:
  - The paper's ROIs (MetaMorph) are not deposited; ROIs are placed by code along the diagonals of
    the detected electrode footprints, over +/- 1.65 mm from the array center with 92 ROIs, the
    small-array values of Methods 2.4 ("92 or 224 regions of interest (ROI), placed along one or
    both diagonals, and covering a distance of +/- 1.65 mm or +/- 3.65 mm"). The array is taken
    as the small one from the images, as the claims file asks.
  - The files give no pixel size. 0.65 um per pixel (the ORCA-Flash4 camera's 6.5 um pixel through
    the 10x objective, both named in the file's device description and Methods 2.4) is assumed;
    with it the small array's ROI extent fits between the footprints, and the large array's does
    not. A variant that ends the ROIs 5% of the diagonal short of the footprints, using no pixel
    size, gives the same outcome.
  - 3 dishes per treatment, where the Fig. 6 legend gives n = 3 to 4.
  - The ROI layout, background, center, periphery and least-affected-area readings of the claims
    file header are all run; with an even number of ROIs two are equally near the center, and
    their mean is taken for reading c1, a standard choice.
- claim: fig6b-peak-relative-to-periphery
  outcome: partially_reproduced
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig6b-peak-relative-to-periphery
  measured:
  - 124.0
  - 86.7
  - 58.7
  notes: Measured values are the primary reading (both diagonals, raw counts, the two central ROIs,
    mean of the two ends, each dish normalized); per dish 107.2 to 151.6% for 1Px4, 73.2 to
    106.2% for 5Px4 and 34.5 to 77.4% for 10Px4. No combination of the 72 readings puts all three
    values within tolerance. 1Px4 is within 180 to 220% and above both others in 7 combinations,
    all with the footprint background subtracted (b2), which meets the claims file's rule for a
    partial reproduction; 1Px4 is above both others in 66 of 72. 10Px4 is within 90 to 110% in 9
    of 72 and is below its periphery under the primary reading. With the ROI extent from the
    footprints 3 of 72 combinations are partial and none reproduced (primary 116.1, 105.1 and
    68.0%). The ranking holds; "almost twofold" for 1Px4 holds only with a background
    subtracted; the 40-packet center is mostly well below the periphery, not about the same.
  deviations:
  - ROIs placed by code, pixel size assumed and 3 dishes per treatment, as for
    fig6a-more-packets-more-uptake.
  - The paper does not fix the layout, background, center, periphery or normalization order; the
    claims file names readings for each and a claim holds under any combination. The partial
    outcome rests on the background reading b2 (minus the median inside the electrode
    footprints, the only cell-free area of the array), which the Methods do not name.
- claim: fig6-trough-half-of-center
  outcome: partially_reproduced
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig6-trough-half-of-center
  notes: Center over least affected area under the primary reading is 1.40 for 1Px4, 2.16 for
    5Px4 and 2.80 for 10Px4 (no single measured value is given, as the expected value is one
    number for all three treatments). Over 144 combinations it is 1.32 to 8.28 for 1Px4 (within
    1.8 to 2.2 in 27), 1.86 to 5.30 for 5Px4 (in 14) and 2.66 to 12.06 for 10Px4 (in none). No
    combination puts all three within tolerance; 41 put one or two within it with all above 1.
    The central peak is discernible for all treatments (ratio above 1 in all 144). The ratio
    grows with packet number, so the 2-fold for all treatments does not hold at 40 packets. The
    ROI extent from the footprints gives the same counts.
  deviations:
  - ROIs placed by code, pixel size assumed and 3 dishes per treatment, as for
    fig6a-more-packets-more-uptake; all readings of the claims file are run.
- claim: fig6-peak-narrower
  outcome: reproduced
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig6-peak-narrower
  notes: On the primary reading (both diagonals, raw counts, each dish normalized to the mean of
    its two ends) the width at half height above the least affected area (w1) is 1.051, 0.545 and
    0.488 mm for 4, 20 and 40 packets, and with LOESS spans 0.25 and 0.5 it is 0.800, 0.654, 0.560
    and 0.992, 0.863, 0.817 mm. w1 decreases in 121 of 144 combinations, 40 is narrower than 4
    with 20 out of order in 17, and 6 unsmoothed combinations are out of order. The distance
    between the side minima (w2) decreases with LOESS 0.5 (2.367, 1.650, 1.435 mm) and in 104 of
    144 combinations; unsmoothed it is 1.363, 1.722 and 1.148 mm. Per dish, w2 on LOESS 0.5 is
    1.722 to 2.367 mm for 1Px4, 1.435 to 1.650 for 5Px4 and 1.363 to 1.578 for 10Px4. With the ROI
    extent from the footprints w1 keeps the order under all three smoothings.
  deviations:
  - ROIs placed by code, pixel size assumed and 3 dishes per treatment, as for
    fig6a-more-packets-more-uptake. Widths in mm rest on the assumed pixel size; their order does
    not.
  - LOESS is fitted with statsmodels lowess without robustness iterations, a standard choice; the
    paper names LOESS (Methods 2.4) without a span or implementation, and the claims file names
    spans 0.25 and 0.5.
