findings:
- kind: data_missing
  statement: The dandiset holds only the experiment of Fig. 6 (nine dishes, 1Px4, 5Px4 and 10Px4 at
    3.2 kV, three each, against n = 3 to 4 in the legend). The single-cell time-lapse of Fig. 4
    and the monolayer experiments of Figs. 5, 7, 8 and 9 are not in it, so 13 of the paper's 17
    claims cannot be tested.
- kind: metadata_insufficient
  statement: The files give no pixel size or field of view, no electrode positions, no ROIs or
    measured profiles, and do not say which of the two arrays was used. At the camera scale (0.65
    um per pixel) the geometry fits the small array; the dark electrode footprints are then 1.66
    to 2.09 mm across, wider than the 1.5 mm needles of Methods 2.3.
- kind: metadata_error
  statement: The subject species is NCBITaxon 9913 (Bos taurus, cattle) in every file and in the
    archive's summary, while the strain field and the paper say CHO cells (Chinese hamster). The
    age is "P1D", which has no meaning for a cell line, and the archive's summary counts 18
    subjects for 9 files and 9 subject ids.
- kind: metadata_error
  statement: Two pairs of dishes share a session start time to the second (dishes 20 and 22 of
    5Px4; dish 09 of 5Px4 and dish 25 of 1Px4). The images differ (no two identical, array
    position different in each), so the start times are not per-dish acquisition times.
- kind: metadata_insufficient
  statement: The ImageSeries has unit "n.a." and a rate of 2 Hz for a single frame, and the "200ms"
    in every file and session name is not explained; the description says packets were given at
    1 Hz.
- kind: methods_unavailable
  statement: Question for the paper's authors. Methods 2.4 says the ROIs were "placed along one or
    both diagonals" but not which for Fig. 6, nor the ROI size, whether a background was
    subtracted, which ROI is the center, or whether dishes were normalized before averaging. The
    Fig. 6B normalized center depends on these (1Px4 is 122 to 487% over the readings, near 200%
    only with a background subtracted). Which layout, ROI size and background were used for Fig. 6?
