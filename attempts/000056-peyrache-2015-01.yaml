findings:
- kind: metadata_insufficient
  statement: The units tables hold only spike times. No unit has an electrode, shank, brain region,
    waveform or quality measure, and every electrode's location is "unknown". Units cannot be
    assigned to the antero-dorsal thalamus or the post-subiculum, which blocks 12 of the paper's 20
    claims. The electrode groups and ripple annotations are consistent with Mouse24, Mouse25 and
    Mouse28 being the three dual-site mice, but the files do not say so.
- kind: selection_undocumented
  statement: The files hold 1959 unit rows (103 with no spikes) in 40 sessions, against the paper's
    1077 recorded cells in 42 sessions. Mouse12-120809 alone has 292 units. Nothing marks which units
    or sessions the paper analysed (its Methods discard some sessions).
- kind: metadata_insufficient
  statement: The open-field exploration (the paper's waking epoch) is not marked. The "Awake" state
    also covers waking in the home cage, and some sessions hold a second exploration or a larger
    second environment. The epoch had to be found from position.
- kind: format_error
  statement: In 36 of 40 files one unit's spike times are not sorted. Each such unit holds two
    sorted runs, each spanning the session, joined at an index of the form k x 65536 - 1; the second
    run rarely repeats a time of the first. This suggests an error in the conversion.
- kind: other
  statement: In Mouse12-120808 the position and the spikes do not share a clock. Head-direction
    tuning is best with position shifted by -1.5 s at the start of the exploration and -3.4 s at
    its end, and no unit passes the HD criteria as deposited. In all other sessions the best shift
    is -0.2 to 0 s.
- kind: metadata_error
  statement: The raw LED positions in `acquisition` are stated in meters with a conversion of NaN
    but hold camera pixels (values in the hundreds).
- kind: data_missing
  statement: Mouse32-140820 has no sleep-state table and no processed position, and Mouse17-130201
    has no processed position; both have raw LED series only. In three Mouse20 sessions the
    position series ends 11 to 109 minutes before the recording.
- kind: metadata_insufficient
  statement: The annotation series `dow`, `hdD` and `rip` (labels such as "DOWN ON 5", "HD UP ON",
    "Ripple peak 1") have no description.
- kind: metadata_error
  statement: The dandiset's related resource for the paper gives its name and identifier as
    "nternally organized mechanisms of the head direction sense" (first letter missing, and the
    title in place of a DOI); the URL is correct.
- kind: methods_unavailable
  statement: Neither the paper nor the dandiset links analysis code, so the von Mises fit, the
    Rayleigh test, the scaling in the cross-correlogram estimate of angular velocity and the
    coherence measure had to be chosen or could not be repeated.
