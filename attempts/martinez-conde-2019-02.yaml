- claim: s3-latency-peak
  outcome: blocked
  blocked_by: data_missing
  notes: Needs spike times and eye positions to re-register spikes at latencies of 1 to 2400 ms. The data set holds
    only maps made at the paper's latency. One file also stores an eye time map, but no time series.
findings:
- kind: data_missing
  statement: 'The data set holds 53 neurons, against the 58 the paper analysed: 22 for Square and Edge (paper 25),
    27 with the Star stimulus (paper 30) and 26 for Corners (paper 28). Its sheet V1_Vasarely_data_SMC.xlsx lists
    58 cells, of which 5 (050800J1, 062000J1, 072100_C, 062600A2, 09250A1) have no condition marked and no files.'
- kind: metadata_error
  statement: The data description says the map field `image` holds raw spike counts. Its nonzero values are mostly
    1/n, and for the one file that also stores eye time (ABC050900J1A) image times eyetime gives integer counts,
    so `image` is spikes per 1 ms eye sample (spikes per ms). Rates in spikes/s are image x 1000.
- kind: data_missing
  statement: No spike times, eye positions, spike count maps or eye time maps are in the data set, except an eye
    time map in one file of 75 (ABC050900J1A). So the spike counts per condition and the latency analysis (S3 Fig)
    cannot be checked, and nothing can be re-registered.
- kind: metadata_error
  statement: Two files in the Star folder, ABS042700J2 and ABS051000J3, hold a Corners-type stimulus (a single notched
    corner, stimulus type CORNERS) and not the twelve-pointed Star. They have no aligned frame, and ABS051000J3_SpikeRateMap.mat
    is a MATLAB 7.3 file, unlike the others. The sheet marks both neurons under Star, which they also have Corners
    files for.
- kind: metadata_insufficient
  statement: '15 of the 27 Star files (ABD070300J1, ABD071000J3, ABD071200J1, ABD071400J1, ABD071400J3, ABD071700J1,
    ABD071700J2, ABD071900J3, ABD072000J1, ABD072100J1, ABD07260J1C, ABD07310J1B, ABD08080J4D, ABD08100J1D, ABD09060J1D)
    have no aligned (Standard) frame. Their screen-frame maps are in gaze coordinates: for the 12 Star files that
    have both, the midpoint measured at the stimulus polygons in the screen frame is unrelated to the aligned one
    (Pearson r = -0.11). The receptive-field offset and the aligned diagonal are not stored. The star is drawn with
    the same screen orientation in every file, so the aligned diagonal cannot be read from the stimulus either.
    These 15 neurons cannot be registered to the stimulus.'
- kind: metadata_insufficient
  statement: Fields of the map files are undocumented. The aligned frame `Standard` holds the ROI maps rotated with
    the fold vertical and the luminance polygons in that frame (MATLAB 1-based pixel coordinates). It also holds
    `BaseActivity` (in 38 of 60 aligned files, 0 for ABC051000J3 and ABC063000J1), `smoothed_image_norm`, a top-level
    `eyetime` (one file) and `norm`. BaseActivity does not match the mean of the map in the 0% squares the paper
    describes. smoothed_image_norm equals (map - BaseActivity)/(max - BaseActivity) in 21 of 38 files. The Corners
    aligned frames come in two sizes (273 x 209 in 20 files, 257 x 193 in 6).
