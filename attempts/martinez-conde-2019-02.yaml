- claim: fig7a-rms-contrast-fit
  outcome: not_reproduced
  notebook: reproduce_martinez_conde_2019.ipynb
  output: claim:fig7a-rms-contrast-fit
  measured:
  - 0.75
  - 1.93
  - -1787.3
  - 0.0
  - 1788.1
  - -0.08
  notes: Computed on each of the 22 Edge stimuli warped into the ROI frame, 16 x 16 DU square on the Edge,
    0 to 100% in 1.5% steps, median over stimuli. Reading (a), SD over mean, is about 2 at 0% (1.69 to
    2.33), 0.75 at 50% and 1.08 to 1.43 at 100%, not monotonic; the exponential fit degenerates (R2 =
    -0.08). Reading (b), SD of luminance on a 0 to 1 scale, rises from 0.013 to 0.451 and fits well (R2
    = 0.9994) with a = -87.3, b = 0.0001, c = 87.3, far from the paper's range 0.61 to 0.943 and parameters.
    Measured values are those of reading (a), the first the criterion lists; neither reading matches.
  deviations:
  - The definition of RMS contrast is the paper's reference 21, not in the text read; the two readings
    of the claims file were run. The fit minimises the sum of absolute residuals from a least-squares
    start, standing in for MATLAB's Levenberg-Marquardt with LAR.
