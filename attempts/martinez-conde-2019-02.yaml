findings:
- kind: data_missing
  statement: The data set holds 53 neurons, against the 58 the paper analysed; by stimulus 22 Square and
    Edge, 27 Star and 26 Corners, against 25, 30 and 28. Neither the data set nor its descriptor says
    which of the paper's neurons are missing or why.
- kind: metadata_error
  statement: The descriptor says the image field of each SpikeRateMap holds raw spike counts per pixel.
    It holds spikes per ms (count divided by eye time in ms); its maximum is 1 and it is not integer in
    all 75 version 5 files, and in the one file with an eyetime field image times eyetime is integer.
    smoothed_image is its smoothed version, also in spikes per ms.
- kind: data_missing
  statement: Spike times, eye positions and eye time maps are not in the data set (one neuron, ABC050900J1A,
    has an eyetime field). Spike counts per neuron, maps at other latencies and any re-registration cannot
    be computed.
- kind: metadata_error
  statement: The two files named ABS042700J2 and ABS051000J3 in the Star folder hold Corners stimuli (their
    type field reads CORNERS) and maps separate from the Corners files of the same neurons. The data set
    holds no Star recording for these two neurons, though the spreadsheet marks both as tested with the
    Star.
- kind: metadata_insufficient
  statement: The Standard struct of the map files (maps registered to the stimulus and rotated to the
    aligned fold, the stimulus polygons in that frame, smoothed_image_norm and BaseActivity) is not described.
    BaseActivity, present for 38 neurons, matches no fixed placement of 16 x 16 DU squares tried, and
    smoothed_image_norm is normalised differently between files.
- kind: metadata_insufficient
  statement: 15 of the 27 Star neurons have no Standard map. The screen maps are in gaze coordinates and
    the Star stimulus is stored at one orientation for every neuron, so without each neuron's receptive
    field offset and preferred orientation (not given) these neurons cannot be placed on the stimulus.
    For neurons with a Standard map the registration shows offsets of up to about 370 DU and Star rotations
    from -75 to 75 degrees.
- kind: other
  about: data
  statement: Six Corners Standard maps are 257 x 193 DU, against 273 x 209 for the other twenty; their
    stimulus polygons show the same geometry cropped by 8 DU on each side.
- kind: metadata_insufficient
  statement: The spreadsheet V1_Vasarely_data_SMC.xlsx lists 58 rows, 5 of them (050800J1, 062000J1, 072100_C,
    062600A2, 09250A1) with no condition marked and no files; nothing says what they are.
- kind: methods_unavailable
  statement: The placement of the baseline squares is given only in Fig 2. For the Square and Edge and
    the Star, are the 16 x 16 DU squares centred on the corners of the circumscribing square or inside
    them, and for Corners, where are the two squares? This attempt took the placement closest to the files'
    BaseActivity (centred for Square and Edge, inside for the Star, the ROI corners on the 0% side for
    Corners); the baseline test, Table 1 and Fig 7C change with the placement.
- kind: methods_unavailable
  statement: How was the local RMS contrast of Fig 7A computed? On the stimulus image, the SD over the
    mean of a 16 x 16 DU square on the Edge falls from about 2 to 0.75 and back to 1.1 to 1.4, and the
    SD of luminance on a 0 to 1 scale rises from 0.01 to 0.45; neither gives the paper's 0.61 to 0.943.
    The definition (reference 21) and the luminance scale used would settle it.
