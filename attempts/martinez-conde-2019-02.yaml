- claim: s4-baseline-no-difference
  outcome: not_reproduced
  notebook: reproduce_martinez_conde_2019.ipynb
  output: claim:s4-baseline-no-difference
  assumed: true
  notes: With the main placement all three readings find a difference. Square and Edge, median 7.68 spikes/s (n
    = 22), is higher than Star, 1.89 (n = 12; rank sum BH p = 0.016), and Corners, 2.45 (n = 26; BH p = 0.008).
    Star against Corners gives BH p = 0.66, Kruskal-Wallis p = 0.004, ANOVA p = 0.001. Squares centred on the corners
    give the same (Kruskal-Wallis p = 0.007). With the stored BaseActivity, on the 38 files that have it, no reading
    finds a difference (Kruskal-Wallis p = 0.114, ANOVA p = 0.166, smallest BH p = 0.109). Medians there are 5.64,
    2.68 and 1.32 spikes/s. The outcome rests on where the squares are, which the paper shows only in its figures.
  deviations:
  - Assumed baseline placement. The paper places the Corners baseline squares only in Fig 2C, not in the text read;
    they are taken at the two bottom corners of the aligned frame, in 0% luminance. The Square and Edge and Star
    squares are taken inside the corners of the circumscribing square (Methods, Visual stimuli), with squares centred
    on the corners as a variant. The stored BaseActivity (38 of 60 files) matches neither placement exactly (Spearman
    0.85 to 0.98 with the main placement), so the authors' placement is not known.
  - Star rests on the 12 Star neurons whose files carry the aligned frame, of 27 Star neurons in the data set and
    30 in the paper.
  - The paper does not name the test; the claims file's three readings were run.
