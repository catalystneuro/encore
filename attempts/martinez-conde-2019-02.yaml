findings:
- kind: data_missing
  statement: The data set holds 53 cells and 77 spike rate maps (22 Square and Edge, 29 Star, 26
    Corners), where the paper analysed 58 neurons and 83 maps (25, 30, 28). The spreadsheet
    V1_Vasarely_data_SMC.xlsx lists 58 cells, but five of them (050800J1, 062000J1, 072100_C,
    062600A2, 09250A1) have no experiment marked and no files.
- kind: metadata_insufficient
  statement: 17 of the 29 Star spike rate map files have no `Standard` struct, the map registered
    to the stimulus. The maps of the other files are in gaze coordinates, and registering them
    needs the receptive field position of the neuron, which no file stores. Each `Standard` map is
    the gaze-frame map rotated and shifted (r of at least 0.996 over 60 files), and the shift
    differs from file to file and, for one cell, by 11 to 58 DU between experiments. These 17 maps, two of them in an older layout (prefix ABS, one
    saved as MATLAB v7.3), cannot be placed on the stimulus.
- kind: metadata_insufficient
  statement: The data descriptor does not mention most of what the files hold. `Standard` (the
    registered, rotated and cropped map with the equal-luminance polygons of the stimulus in the
    same frame), `BaseActivity` (a baseline in spikes per ms, in 40 files, whose computation is not
    stated and does not match the baseline squares the paper describes), `norm`, `eyetime` (one
    file) and `original_image` (two files) are undocumented, as are the prefixes ABC, ABD, ABS and
    AEC, the letter after the cell number (A to E), and the units of the maps (spikes per 1 ms
    sample).
- kind: metadata_error
  statement: The data descriptor says `image` "contains the raw spikes counts for each pixel". It
    holds the count divided by the eye time in 1 ms samples, a rate; in the one file that also
    stores `eyetime`, image times eyetime is an integer count at every pixel, and the maximum of
    `image` is 1.0 in every file.
- kind: data_missing
  statement: The spike count maps, the eye time maps (except in one file), the spike times and the
    eye positions are not in the data set, so the number of spikes per condition and the maps at
    other latencies (S3 Fig) cannot be computed.
- kind: other
  about: data
  statement: The stored `smoothed_image` is not the Gaussian smoothing (16 DU, SD 7 DU) that the
    paper's Fig 3B legend describes. Smoothing `image` with that filter differs from it by 19% to
    27% of the peak in the three files tested; a 16 DU Gaussian with SD 5 DU comes within 5% to 7%.
- kind: other
  about: data
  statement: Two files, ABC051000J3 and ABC063000J1, have a `BaseActivity` of exactly 0 spikes/s.
- kind: methods_unavailable
  statement: Where were the two baseline squares of the Corners stimulus? The text says only "two
    1 x 1 DVA (16 x 16 DU) square regions in 0% luminance areas within the ROI" (Methods, Corners)
    and shows them in Fig 2C. This attempt took the two bottom corners of the ROI. For Square and
    Edge and for Star, were the four squares inside the corners of the circumscribing square, as
    assumed here (centred on the corners they leave the ROI)? The baseline decides whether the
    baselines differ across stimuli (S4 Fig) and which Table 1 values fall within the paper's SEM;
    the files' own `BaseActivity` gives different results.
- kind: methods_unavailable
  statement: How was the local RMS contrast along the Edge computed (reference [21])? Neither the
    SD of luminance over its mean nor the SD of luminance scaled to 0 to 1, in a 16 x 16 DU square
    centred on the Edge of the deposited stimulus images, gives the range 0.61 to 0.943 or the fit
    f(l) = -0.34 exp(-0.05 l) + 0.95.
- kind: methods_unavailable
  statement: Which test found no difference in absolute baseline across the stimuli (S4 Fig), and
    in Table 1 were the minimum, maximum, mean and median taken per neuron and then averaged, or
    from the population-average profile, and were the two half-diagonals of the Square and the Star
    averaged before or after the summaries? The attempt ran each reading the claims file lists.
