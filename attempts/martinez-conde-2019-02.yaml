- claim: s4-baseline-no-difference
  outcome: reproduced
  notebook: reproduce_martinez_conde_2019.ipynb
  output: claim:s4-baseline-no-difference
  assumed: true
  notes: 'With the adopted placement the readings disagree. Reading (a) finds no difference: Square and Edge, median
    7.23 spikes/s (n = 22), against Star, 1.89 (n = 12), BH p = 0.071, against Corners, 2.90 (n = 26), BH p = 0.071,
    and Star against Corners BH p = 0.925. Kruskal-Wallis (p = 0.042) and ANOVA (p = 0.007) find one. The criterion adopts
    reading (a) when the readings disagree, so the outcome rests on that rule and on the placement. With the squares
    inside the corners for both stimuli all three readings find a difference (Kruskal-Wallis p = 0.007, smallest BH p
    = 0.016), and so they do with the squares centred for both (Kruskal-Wallis p = 0.009, smallest BH p = 0.036). With
    the stored BaseActivity, on the 38 files that have it, no reading finds a difference (Kruskal-Wallis p = 0.114, ANOVA
    p = 0.166, smallest BH p = 0.109), and the adopted placement on the same files finds none either (Kruskal-Wallis
    p = 0.081, ANOVA p = 0.054, smallest BH p = 0.075). This suggests the smaller sample accounts for much of the gap
    to the stored values, but it compares them on one placement only and does not fully separate sample size from placement.'
  deviations:
  - 'Assumed baseline placement. The paper puts the Square and Edge and Star squares at the corners of the circumscribing
    square (Methods, Visual stimuli) without saying whether they sit inside the corners or are centred on them. The adopted
    placement is the one closer to the stored BaseActivity, the authors'' own baseline in 38 of the 60 analysed files:
    centred on the corners for Square and Edge (median absolute difference 0.67 spikes/s, against 1.51 inside, n = 9)
    and inside them for Star (0.32, against 1.28 centred, n = 10). The Corners squares are only drawn in Fig 2C; they
    are taken at the two bottom corners of the aligned frame, moved up to the lowest height where both are at 0% luminance
    in the 2 files where the next zigzag of the pattern enters the frame. Every claim also shows both placements.'
  - Star rests on the 12 Star neurons whose files carry the aligned frame, of 27 Star neurons in the data set and 30
    in the paper.
  - The paper does not name the test; the claims file's three readings were run, and its rule for readings that disagree
    (adopt reading (a)) decides the outcome.
