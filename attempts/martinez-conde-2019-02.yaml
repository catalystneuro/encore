  statement: Question for the paper's authors. Where are the baseline squares? The Corners squares appear only in
    Fig 2C. For Square and Edge and for Star, the text does not say whether the 16 x 16 DU squares sit inside the
    corners of the circumscribing square or are centred on them. The stored BaseActivity matches neither placement
    exactly. Whether baseline differs between stimuli (S4 Fig) depends on this here. With squares inside the corners,
    Square and Edge is higher than Star and Corners (Kruskal-Wallis p = 0.004). With the stored BaseActivity no
    difference is found (p = 0.114). Also open is where the 8 DU wide Edge blocks of Table 1 sit across the Edge
