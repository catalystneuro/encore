  notes: The files hold 53 distinct neurons (49 from monkey J, 4 from A) against 58 analysed. By folder, 22 Square
    and Edge, 29 Star and 26 Corners neurons (paper 25, 30, 28); 7 tested in three conditions, 10 in two, 36 in
    one (paper 7, 11, 40). Counting the two ABS files of the Star folder as Corners, as their stimuli are, gives
    27 Star and 7, 8 and 38. The spreadsheet lists the same 53 neurons plus 5 rows with no condition marked.
    Only the count tested in all three conditions matches. By folder the gap is 5 neurons
    and 6 neuron-conditions, which the 5 unmarked rows would close if one of them was tested in two conditions and
    four in one, so the data set looks incomplete and does not contradict the paper's counts. The recorded 118 (102
    and 16 per monkey) cannot be checked, as the discarded neurons are not in the data set.
  deviations:
  - Neurons identified by the file code without the experiment prefix and the trailing run letter, which matches
    the spreadsheet's codes.
- claim: spikes-per-condition
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_martinez_conde_2019.ipynb
  output: claim:spikes-per-condition
  notes: 'The spike count maps are not in the data set; dat.image is spikes per ms (count divided by eye time),
    and only 1 of 77 map files (Corners ABC050900J1A) carries its eye time map, from which its count is 15,644 spikes,
    above the 10,000 minimum. Spike times are not in the data set either, so neither reading of the criterion can
    be computed for the other neuron-conditions. The other fields hold no counts or eye time: norm is 0 in every
    file, and smoothed_image_norm is the map minus BaseActivity (in 5 of the 38 files with BaseActivity) or that
    divided by its maximum (21), or neither (12; one of these, Corners ABC051000J3, has NaN in 6,304 of its 57,057
    pixels, compared over the others). The one eye time map is stored only at the pixels with spikes.'
- claim: s4-baseline-no-difference
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_martinez_conde_2019.ipynb
  output: claim:s4-baseline-no-difference
  notes: Under the main baseline placements, medians are 7.09 (Square and Edge, n = 22), 1.99 (Star, n = 12) and
    2.45 spikes/s (Corners, n = 26). Reading (a), pairwise rank sum tests with Benjamini-Hochberg correction, finds
    Square and Edge above Corners (p = 0.044; Edge against Star p = 0.071, Star against Corners p = 0.68); reading
    (b), Kruskal-Wallis, p = 0.029; reading (c), ANOVA, p = 0.0056. All three readings find a difference. The result
    depends on the placement; with the files' BaseActivity (38 neurons) no test finds a difference (smallest p =
    0.11), nor with Corners readings (b) or (c) (smallest p 0.079 and 0.062); with squares inside the corners for
    Square and Edge, or centred for the Star, every reading finds a difference (p 0.001 to 0.022 for the significant
    comparisons). The Star squares lie partly where the maps are zero (38% of their pixels), which lowers the Star
    baseline; leaving out zero pixels, only the ANOVA finds a difference (p = 0.012), but the files' BaseActivity
    appears to keep them (Star r = 0.953 with them against 0.809 without; for Corners r is nearly the same, 0.859
    against 0.850). The Star has 12 of the paper's 30 neurons.
  deviations:
  - The paper places the baseline squares only in Fig 2 (at the corners of the 138 DU square around the Square and
    of the square around the Star; for Corners, two squares in 0% areas of the ROI). Assumed, for each stimulus,
    the placement closest neuron by neuron to the files' own Standard.BaseActivity (the authors' baseline for 38
    neurons, placement undocumented); squares centred on the box corners for Square and Edge (r = 0.995 with BaseActivity),
    inside the box corners for the Star (r = 0.953), and the ROI corners on the 0% side for Corners (median absolute
    difference 0.72 spikes/s, n = 19, the Corners neurons with BaseActivity). This choice was made after the results
    under every placement had been seen while preparing; all placements are shown in the notebook. Pixels where the
    smoothed map is zero are kept, as the files' BaseActivity appears to keep them; on the neurons with a baseline
    both ways it agrees better with Star baselines that keep them (r = 0.953 against 0.809, n = 10), and for Corners
    (n = 17 of the 19) the median difference is smaller with them (0.75 against 1.21 spikes/s) while r is nearly
    the same (0.859 against 0.850); leaving them out is a variant.
  - Star analysed on the 12 neurons with registered maps, against 30 in the paper; the other 15 Star neurons cannot
    be placed on the stimulus (no receptive field offset or aligned diagonal), and the two ABS files in the Star
    folder hold Corners recordings. The Star stimulus is stored at one orientation, modulo its 30 degree symmetry,
    for every neuron, at different positions. The screen maps of the 12 registered neurons do not differ detectably
    from those of the 15 others (peak, mean of nonzero pixels and coverage, rank sum p 0.41 to 0.63); the 12 include
    both monkey A Star neurons.
  - Uses the authors' registered, smoothed spike rate maps (Standard.smoothed_image, x 1000 for spikes/s), not maps
    rebuilt from spikes and eye positions, which the data set does not hold.
  - Squares and blocks weight each pixel by the fraction of its area inside, so that they cover the paper's 8 x
    8 and 16 x 16 DU (Results, Strength of neuronal responses, paragraph 1; Methods, Visual stimuli) wherever their
    centres fall. The first version took pixels whose centres lie strictly inside (7 x 7 at an integer centre),
    shown as a variant.
