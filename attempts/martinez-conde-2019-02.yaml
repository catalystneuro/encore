findings:
- kind: data_missing
  about: data
  statement: The data set holds 77 recordings of 53 neurons (22 Square and Edge, 29 Star, 26 Corners),
    against the 58 neurons and 25, 30 and 28 per condition the paper analysed. Its spreadsheet lists
    58 cell codes, but 5 (050800J1, 062000J1, 072100_C, 062600A2, 09250A1) have no condition and no
    files.
- kind: data_missing
  about: data
  statement: 17 of the 29 Star recordings cannot be placed on the stimulus. 15 (prefix ABD) lack the
    ROI-aligned Standard map. The other 2 (ABS042700J2, ABS051000J3) lack it too; their stimulus
    files are MATLAB 7.3 files of another layout whose polygons are closed outlines of 11 points (the
    paper's 12-point star has 24 vertices), and one of their map files is MATLAB 7.3 too.
    The full-screen maps are in gaze coordinates and the RF offset needed to align them is not
    stored. (A check made while preparing, not run in the notebook, found no rotation and shift
    that turns the full-screen maps into the aligned maps of the recordings that have both.)
- kind: data_missing
  about: data
  statement: No spike times, eye positions or spike count maps are deposited, and the eye time map is
    in one recording of 77 (ABC050900J1A). The number of spikes per condition and the latency
    analysis of S3 Fig cannot be computed, and the eye-signal correction and registration cannot be
    checked.
- kind: metadata_error
  about: data
  statement: The descriptor says `image` holds raw spike counts per pixel and `smoothed_image_norm` is
    the smoothed image normalised by the time spent at each pixel. `image` is spike count divided by
    eye time in ms (spikes per ms; image x eyetime is an integer in the one recording with eyetime).
    `smoothed_image_norm` is not normalised by time, and it is not computed the same way in every
    recording. Of the 38 aligned recordings that hold it, 21 store the smoothed map minus
    BaseActivity, divided by its maximum minus BaseActivity, 5 store the smoothed map minus
    BaseActivity unscaled, 11 match neither formula (values from -1 to 0.998; 10 of them Corners),
    and in 1 (ABC051000J3, BaseActivity 0) the map is partly NaN.
- kind: metadata_insufficient
  about: data
  statement: The fields the analysis needs are undocumented. The `Standard` struct (the ROI in
    stimulus coordinates, rotated to the preferred orientation, with its own image, smoothed_image
    and polygon vertices), the stimulus polygon vertices, `eyetime`, and `BaseActivity` (in 38 of
    the 60 aligned recordings) are not described. How BaseActivity was computed is not stated, and
    no placement of 16 DU squares on the aligned map reproduces it for Star or Corners (smallest
    maximum error 12.4% and 18.6% of the largest value). For Square and Edge, where the Methods
    describe four squares, the 9 stored values are matched within 3.9% by a single square at
    (15, 129) in the 151 x 337 DU frame, on grey level 0 beside the rectangle. The vertex order of the Star polygons differs between
    the map and stimulus files in 10 of 12 recordings, and Corners maps come in two frame sizes.
- kind: other
  about: data
  statement: The Methods describe the Corners baseline squares as lying in 0% luminance areas, but
    within the ROI of all 26 Corners recordings the stimulus has no grey level 0; its darkest level
    there is 1.01, while the Square and Edge and Star stimuli reach 0 in theirs.
- kind: methods_unavailable
  about: paper
  statement: How was the local RMS contrast along the Edge computed (Fig 7A)? On the stimulus in the
    files a 16 x 16 DU square centred on the Edge is half black background; the standard deviation
    over the mean gives 0.96 to 2.11, not rising with luminance, and the standard deviation of
    normalised luminance gives 0.014 to 0.476. Neither gives 0.61 to 0.943. Which luminance scale,
    background level and normalisation (reference 21) were used?
- kind: methods_unavailable
  about: paper
  statement: Which test found no difference in absolute baseline across the stimuli (S4 Fig), and how
    was the absolute baseline computed? The baseline squares of the Methods give Square and Edge a
    higher baseline than Star and Corners (Kruskal-Wallis p = 0.005), while the BaseActivity values
    stored in the files show no difference (p = 0.114). Where were the two Corners baseline squares
    placed? The text gives no position; this attempt used the ROI corners Fig 2C draws.
