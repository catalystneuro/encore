    `smoothed_image_norm` but not its normalisation; it is the smoothed map minus BaseActivity in 5
    of its 38 files, the index (map - BaseActivity) / (map + BaseActivity) in 12, and neither in
    21.
- kind: metadata_error
  statement: The data descriptor says `image` "contains the raw spikes counts for each pixel". It
    holds the count divided by the eye time in 1 ms samples, a rate; in the one file that also
    stores `eyetime`, image times eyetime is an integer count at every pixel, and the maximum of
    `image` is 1.0 in every file.
- kind: data_missing
  statement: The spike count maps, the eye time maps (except in one file), the spike times and the
    eye positions are not in the data set, so the number of spikes per condition and the maps at
