  notebook: reproduce_martinez_conde_2019.ipynb
  output: claim:fig7c-fold-edge-significance
  notes: Two-sample t-tests of fold midpoint differences against Edge responses at the RMS levels. P180
    is lower than the Edge at 0.943 (mean difference -15.9 spikes/s, p = 0.0007) and S40 higher than the
    Edge at 0.610 and 0.647 (17.3 and 16.8, p = 0.0008 and 0.0011). Both parts hold under each correction
    reading; Benjamini-Hochberg over 40 tests gives p = 0.011 for each of the three, Bonferroni over 40
    at most 0.045. Under Benjamini-Hochberg over 40 tests S40 is also above the Edge at 0.684 to 0.795
    (p 0.014 to 0.036), and P180 is below the Edge at every level from 0.647 up.
