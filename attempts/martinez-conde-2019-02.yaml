  statement: Question for the paper's authors. Which definition of local RMS contrast gives 0.61 to 0.943 along
    the Edge (Fig 7A, reference 21)? On the stimulus in the files, with background 0 and luminance in percent, SD
    over mean is near 1.06 to 1.13 along the Edge, and SD of luminance scaled to 0-1 rises from 0.02 to 0.47; neither
    fits f(l) = -0.34 exp(-0.05 l) + 0.95. Was contrast computed on display luminance in cd/m2, with a nonzero black
    level?
