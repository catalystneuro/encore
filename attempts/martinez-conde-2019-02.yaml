- claim: spikes-per-condition
  outcome: blocked
  blocked_by: data_missing
  notes: The number of spikes per neuron and condition needs the spike count map or the eye time
    map, under either reading of the criterion. The files hold rate maps (`image` is the count
    divided by eye time in 1 ms samples). One file of 77, ABC050900J1A, also stores `eyetime`; its
    count is 15,644 spikes, above the 10,000 minimum. Spike times are not in the data set either.
    The other fields were checked for eye time or counts. `norm` is the scalar 0 in all 74 files
    that have it. `smoothed_image_norm` (38 files) is the smoothed map normalised by the
    file's BaseActivity, as the difference (5 files) or the index (sm - b) / (sm + b) (12 files),
    and something else in 21, with values from -1.02 to 2.92, where eye time reaches 1504 samples
    at a pixel in the one file that stores it. Neither gives spike totals.
- claim: s4-baseline-no-difference
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_martinez_conde_2019.ipynb
  output: claim:s4-baseline-no-difference
  notes: With the 16 x 16 DU squares of the Methods, median baselines are 7.68 (Square and Edge,
    22 neurons), 1.84 (Star, 12) and 2.45 spikes/s (Corners, 26). All three readings find a
    difference; (a) rank sum with BH, Square and Edge against Star p = 0.0128 and against Corners
    p = 0.0076, Star against Corners p = 0.73; (b) Kruskal-Wallis H = 11.31, p = 0.0035; (c) ANOVA
    F = 7.81, p = 0.0010. With the squares centred on the corners of the circumscribing squares
    (variant), all three readings also find it (BH p = 0.0118 and 0.0174, Kruskal-Wallis
    p = 0.0055, ANOVA p = 0.0019). With the files' own undocumented BaseActivity (9, 10 and 19
    neurons; medians 5.64, 2.68, 1.32) no reading is significant (smallest BH p = 0.109,
    Kruskal-Wallis p = 0.114, ANOVA p = 0.166). On the same 38 files the squares still find a
    difference (Kruskal-Wallis p = 0.0245, centred 0.0341), so the two baselines differ in what
    they measure, not in which neurons they cover. The outcome rests on the baseline being the
    squares of the Methods, not BaseActivity, which the files use to normalise
    `smoothed_image_norm` and which may be the authors' own. It does not rest on where the squares
    are. Square and Edge against Star alone is significant, and the placement nearer BaseActivity
    per stimulus (reading nearest, see table1-edge) and the Corners squares at the quarter points
    of the ROI's bottom edge also find a difference (Kruskal-Wallis p = 0.0200 and 0.0328). The
    Star group has 12 of the paper's 30 neurons.
  deviations:
  - Absolute baseline from squares placed as the Methods describe for Square and Edge ("at the
    corners of the 8.84 x 8.84 DVA (138 x 138 DU) circumscribing square", Methods, Square and
    edge) and Star ("at the corners of the circumscribing square", Methods, Star). The wording
    allows squares inside the corners or centred on them; inside is the main reading and centred
    (the part outside the ROI, at most 19% of a Square and Edge square, dropped; the squares lie
    wholly on 0% luminance) is run throughout. For Square and Edge the centred squares are nearer
    the files' BaseActivity (7 of 9 files, signed rank p = 0.027), for Star the inside squares (8
    of 10, p = 0.020); the reading nearest takes the nearer one per stimulus. For Corners the paper
    gives no positions in the text ("two 1 x 1 DVA square regions in 0% luminance areas within the
    ROI", Methods, Corners; shown only in Fig 2C); the two bottom corners of the ROI are assumed,
    being nearer BaseActivity (median absolute difference 0.72 spikes/s) than squares at the
    quarter points of the bottom edge (2.88), which are run as a variant. The files' BaseActivity
    is also shown as a variant.
  - Star has 12 neurons, Square and Edge 22 and Corners 26 (paper 30, 25 and 28).
