- kind: other
  about: data
  statement: The stored `smoothed_image` is not the Gaussian smoothing (16 DU, SD 7 DU) that the
    paper's Fig 3B legend describes. Smoothing `image` with that filter differs from it by 19% to
    27% of the peak in the three files tested; a 16 DU Gaussian with SD 5 DU comes within 5% to 7%.
- kind: other
  about: data
  statement: Two files, ABC051000J3 and ABC063000J1, have a `BaseActivity` of exactly 0 spikes/s.
- kind: methods_unavailable
  statement: Where were the two baseline squares of the Corners stimulus? The text says only "two
    1 x 1 DVA (16 x 16 DU) square regions in 0% luminance areas within the ROI" (Methods, Corners)
    and shows them in Fig 2C. This attempt took the two bottom corners of the ROI. For Square and
    Edge and for Star, were the four squares inside the corners of the circumscribing square, as
    assumed here, or centred on them (for Square and Edge they then cross the ROI's border)? Was
    the baseline of the analysis these squares or the files' `BaseActivity`? Squares centred on the
    corners make table1-edge and table1-s90 partially reproduced where the inside squares do not;
