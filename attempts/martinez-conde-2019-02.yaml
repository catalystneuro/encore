- claim: spikes-per-condition
  outcome: blocked
  blocked_by: data_missing
  notes: The number of spikes per neuron and condition needs the spike count map or the eye time
    map, under either reading of the criterion. The files hold rate maps (`image` is the count
    divided by eye time in 1 ms samples). One file of 77, ABC050900J1A, also stores `eyetime`; its
    count is 15,644 spikes, above the 10,000 minimum. Spike times are not in the data set either.
- claim: s4-baseline-no-difference
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_martinez_conde_2019.ipynb
  output: claim:s4-baseline-no-difference
  notes: With the 16 x 16 DU squares of the Methods, median baselines are 7.68 (Square and Edge,
    22 neurons), 1.84 (Star, 12) and 2.45 spikes/s (Corners, 26). All three readings find a
    difference; (a) rank sum with BH, Square and Edge against Star p = 0.0128 and against Corners
    p = 0.0076, Star against Corners p = 0.73; (b) Kruskal-Wallis H = 11.31, p = 0.0035; (c) ANOVA
    F = 7.81, p = 0.0010. With the files' own undocumented BaseActivity (9, 10 and 19 neurons;
    medians 5.64, 2.68, 1.32) no reading is significant (smallest BH p = 0.109, Kruskal-Wallis
    p = 0.114, ANOVA p = 0.166). The outcome rests on the squares as placed here (see deviations),
    and the Star group has 12 of the paper's 30 neurons.
  deviations:
  - Absolute baseline from squares placed as the Methods describe for Square and Edge (inside the
    corners of the 138 x 138 DU square around the Square; centred on the corners they leave the
    ROI) and Star (inside the corners of the 300 x 300 DU square around the 0% star's
    circumscribed circle). For Corners the paper gives no positions in the text ("two 1 x 1 DVA
    square regions in 0% luminance areas within the ROI", Methods, Corners; shown only in Fig 2C);
    the two bottom corners of the ROI, the only 0% band inside it, are assumed. The files'
    BaseActivity is shown as a variant.
  - Star has 12 neurons, Square and Edge 22 and Corners 26 (paper 30, 25 and 28).
