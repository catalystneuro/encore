- claim: fig7c-fold-edge-significance
  outcome: reproduced
  notebook: reproduce_martinez_conde_2019.ipynb
  output: claim:fig7c-fold-edge-significance
  assumed: true
  notes: Two-sample t-tests at the ten RMS levels. P180 is lower than the Edge at 0.943 (mean difference -16.16 spikes/s,
