    session description) are the same image, value for value.
- kind: metadata_insufficient
  statement: The 000489 images give no pixel size (resolution -1), no electrode positions or
    polarity, and no ROI positions or values; the analysis has to locate the footprints and assume
    0.65 um per pixel, which the electrode spacing supports. The field of each ROI, from the paper's
    finite element model, is not deposited.
- kind: metadata_error
  statement: The series description of the 17 Fig. 2 files of 000489 names "Channel1" for both filter sets and for MemBrite;
