    trial of the same cell (75 frames for cell24); neither is documented.
- kind: metadata_error
  statement: 000448 counts 18 subjects, but each cell is two files (forward and reverse trial) with
    different subject ids (for example 001_F and 001_R for cell09), so it holds 9 cells.
- kind: other
  statement: In 000448 the darkest frame of 10 of the 18 files is the first. Frames below half the
    file's median frame mean (about 180 counts against medians of 300 to 500) occur in 5 files, at
    frame 0 in 4 and at other frames in 3, consistent with failed laser flashes.
- kind: methods_unavailable
  statement: Question for the authors. How were the ROI placed along bb' (number, spacing, and
    whether both sides of the centre were used), and was the t-test paired when ROI of the same
    dishes were compared? This attempt tiled contiguous 200 um ROI from the centre to 3 mm on both
    sides and used the unpaired test; the paired test changes fig2a-uptake-rises-with-field from 5 to
    3 of 5 amplitudes, and using one side of the centre changes fig2c-inhibition-flat-above-8-7 and
    fig2c-weaker-at-6-7.
- kind: methods_unavailable
  statement: Question for the authors. How were the cathode- and anode-facing pole regions drawn in
    the strobe images, and where was the cathode relative to the image? This attempt took the
    membrane within 45 degrees of the vertical axis and the brightening pole as cathodic. The
    charging amplitude found (23% against 31%) may depend on the regions; leaving out membrane that
    faces a neighbouring cell in the groups of touching cells does not change it. Were the poles of
    a group taken on the group's outline or on each cell?
