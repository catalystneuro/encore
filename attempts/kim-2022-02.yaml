findings:
- kind: data_missing
  statement: 000489 holds only the 17 dishes of Fig. 2 and one sample image (Fig. 1F); 000448 holds
    the strobe images of Fig. 7. The dishes of Figs. 3 to 6 and the thermometry of Fig. 1E are in
    neither. Three more dandisets of the same lab name the paper in their metadata and match Figs.
    3, 4 and 6 by title (000548, 000549, 000550); the registry's list of the paper's datasets and
    the 000489 title, which the claims file follows, do not point to them, so their 12 claims are
    blocked here and the thermometry claim is blocked as missing.
- kind: data_missing
  statement: 000448 holds 5 unipolar and 4 bipolar cells, where the paper reports 18 and 17. The
    dandiset does not say how the 9 were chosen.
- kind: metadata_error
  statement: The YO-PRO-1 channel (index 1) of sub-Fig2-0-03 (unipolar) and sub-Fig2-25-04 (25%
    bipolar) is the same image, value for value, while their MemBrite channels differ. One recording
    was deposited under two dishes of different conditions, and nothing says which dish it belongs
    to; with it left out the unipolar and 25% groups have 2 dishes each.
- kind: metadata_insufficient
  statement: The 000489 images give no pixel size (resolution -1), no electrode positions or
    polarity, and no ROI positions or values; the analysis has to locate the footprints and assume
    0.65 um per pixel, which the electrode spacing supports. The field of each ROI, from the paper's
    finite element model, is not deposited.
- kind: metadata_error
  statement: The 000489 image description names "Channel1" for both filter sets and for MemBrite;
    the data show index 0 is MemBrite and index 1 YO-PRO-1. It also describes 144 images (12 x 12)
    of a well of a six-well plate, where Methods 2.5 describes 216 images of 35 mm dishes. Three
    files name their series "Fig2_25" without the dish number.
- kind: metadata_insufficient
  statement: The 000448 files give no pole regions, no field direction relative to the image, and no
    delay of each frame or frame of the pulse onset. Reverse-trial files store frames in acquisition
    order (descending delay), and their response is offset by 74 frames (1.85 us) from the forward
    trial of the same cell; neither is documented.
- kind: metadata_error
  statement: 000448 counts 18 subjects, but each cell is two files (forward and reverse trial) with
    different subject ids (for example 001_F and 001_R for cell09), so it holds 9 cells.
- kind: other
  statement: The first frame of most 000448 files is dark (about 180 counts against 300 to 500), and
    a few files have a dark frame elsewhere, consistent with failed laser flashes.
- kind: methods_unavailable
  statement: Question for the authors. How were the ROI placed along bb' (number, spacing, and
    whether both sides of the centre were used), and was the t-test paired when ROI of the same
    dishes were compared? This attempt tiled contiguous 200 um ROI from the centre to 3 mm on both
    sides and used the unpaired test; the paired test changes fig2a-uptake-rises-with-field from 5 to
    3 of 5 amplitudes and the 50% part of fig2c-weaker-at-6-7.
- kind: methods_unavailable
  statement: Question for the authors. How were the cathode- and anode-facing pole regions drawn in
    the strobe images, and where was the cathode relative to the image? This attempt took the
    membrane within 45 degrees of the vertical axis and the brightening pole as cathodic. The
    charging amplitude found (23% against 31%) may depend on the regions.
