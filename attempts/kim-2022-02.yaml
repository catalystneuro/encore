- claim: fig2a-uptake-rises-with-field
  outcome: reproduced
  assumed: true
  notebook: reproduce_kim_2022.ipynb
  output: claim:fig2a-uptake-rises-with-field
  notes: With the two dishes that share one YP image left out (unipolar and 25% with 2 dishes, 50%
    with 5, 75% and 100% with 3), YP at the centre ROI (15.1 kV/cm) is higher than at the ROI 3 mm
    out (5.0 kV/cm) for all five amplitudes, unpaired p = 0.0001 to 0.044; Spearman rho of mean YP
    with field 0.96 to 0.99. The paired test passes for 3 of 5 (unipolar p = 0.12 and 25% p = 0.13,
    2 dishes each). The weakest ROI at 2.4 mm and one-sided ROI give the same counts. Assigning the
    shared image to the unipolar or the 25% group gives 4 of 5 by the unpaired test.
  deviations:
  - Fields from an exact two-dimensional two-cylinder solution for the geometry of Methods 2.3 (15.38
    kV/cm at the centre for 5.75 kV), scaled to the paper's 15.1 kV/cm there; the paper's finite
    element output is not deposited.
  - ROI are contiguous 200 um squares tiled from the midpoint along bb' to 3 mm on both sides, the
    claims file's reading (a), with the two ROI at the same distance averaged per dish; one side is
    shown as reading (b). The outer limit of 3 mm (5.0 kV/cm) is this attempt's choice, as the
    figure's field range is in the PDF only; 2.4 mm is shown as a variant.
  - YP0 and MB0 are means over a 0.2 mm disc at the centre of each footprint (Methods 2.5 says only
    within the electrodes' footprints); 0.1 and 0.3 mm discs are computed in the helper.
  - Pixel size 0.65 um, from the camera and objective named in Methods 2.5 (6.5 um pixels, 10x); the
    files give none. The measured electrode spacing (4.44 to 4.66 mm, Methods 4.5 mm) supports it.
  - Assumption. Methods 2.5 names a two-sided Student's t-test without saying whether it is paired.
    The unpaired test, the two-sample test the name denotes, is adopted; the paired result is shown.
    The readings differ here (5 against 3 of 5).
  - The dishes sub-Fig2-0-03 and sub-Fig2-25-04 share one YP image and are left out of the main
    analysis; both assignments are shown.
- claim: fig2a-vertical-scales
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_kim_2022.ipynb
  output: claim:fig2a-vertical-scales
  notes: The largest unipolar mean is 651 a.u. (mean plus s.e.m. 754, within 1200, and above 250).
    For 75% bipolar pulses the largest mean plus s.e.m. is 339 a.u. (311 to 372 over the readings),
    above the 250 a.u. axis; the largest 75% mean alone is 263 a.u. The unit-free ratio of the
    largest unipolar and 75% means is 2.47 (1.74 to 2.50 over the readings), against 4.8 for the
    paper's axes; axis limits only bound the data, so the ratio points the same way without deciding
    it.
  deviations:
  - The same ROI, field model and duplicate handling as fig2a-uptake-rises-with-field.
  - Assumption. The image values are taken as the paper's units (16-bit counts, conversion 1.0,
    footprint levels of 177 to 295 counts); the files are consistent with that but do not state it.
    If they were rescaled on export the criterion blocks the absolute values.
- claim: fig2b-exponential-same-slope
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_kim_2022.ipynb
  output: claim:fig2b-exponential-same-slope
  notes: Under the adopted reading (8 kV/cm cutoff, nonlinear least squares) an exponential fits the
    means with a lower residual sum of squares than a line for 3 of 5 amplitudes (unipolar and 50%
    are better fitted by a line; the criterion needs 4), and no bipolar slope from per-dish fits
    differs from the unipolar slopes (p = 0.12 to 0.80). The slope test has little power, as the
    unipolar group has 2 dishes (k = 0.205 and 0.41). Slopes of the fits to the means are 0.189 +-
    0.016 (50%) and 0.191 +- 0.014 (75%) against 0.263 +- 0.027 for unipolar, 0.72 times; 25% and
    100% give 0.88 and 1.07 times. The outcome changes with the reading. At 7 and 6 kV/cm with
    nonlinear fits the exponential is better for 4 and 5 of 5 and no slope differs (reproduced);
    with log-linear fits at 7 and 6 kV/cm all 4 bipolar slopes differ (p = 0.004 to 0.042, not
    reproduced) when the shared image is left out, and none when it is assigned to the unipolar
    group.
  deviations:
  - Fits by nonlinear least squares in scipy, not Grapher 16.
  - Assumption. The cutoff and the fitting method change the outcome. The criterion's main reading
    is adopted, 8 kV/cm (the top of the legend's "6-8 kV/cm", which leaves out the low-signal ROI
    of every amplitude) and nonlinear least squares on linear YP (the values the Fig. 2B legend
    plots); every variant is shown in the notebook.
  - The criterion does not say which outcome applies when the slopes agree but the exponential holds
    for fewer than four amplitudes; partially reproduced is used, as one of the two parts holds.
- claim: fig2c-max-inhibition-50-75
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_kim_2022.ipynb
  output: claim:fig2c-max-inhibition-50-75
  measured: 49.3
  notes: The ROI from 8.78 to 15.1 kV/cm (centre to 1.8 mm) are used. At all 10 the lower of the 50%
    and 75% values is below the 25% and 100% values. The best amplitude is 50%, at 49.3% of unipolar
    on average (reading a, recorded as measured) and 35.1% at its lowest (reading b), both outside 20
    +- 2%. The p < 0.01 test does not hold at every field. Test (ii), the better of 50 or 75%
    against both 25 and 100%, gives p < 0.01 at 7 of 10 fields; test (i), against unipolar with 2
    unipolar dishes, at 3 of 10; either at 7 of 10. No variant reaches every field (assigning the
    shared image, one side of the centre, footprint discs of 0.1 and 0.3 mm give 3 to 7 of 10 by
    either comparison). If holding at most fields sufficed, the outcome would be partially
    reproduced. Averaged over the 10 fields the 25% and 100% pulses give 110.0% and 118.1% of the
    unipolar value (64 to 168% at single fields), so on average they do not inhibit in these dishes;
    25% is below 100% at 7 of 10 fields. The 75% and 100% dishes were imaged on 2021-08-24 and the
    two unipolar dishes analysed on 2021-07-29, with footprint YP0 of 177 to 227 a.u. against 236
    and 292 a.u.
  deviations:
  - Assumption. The criterion runs the test at each field and does not say at how many fields it
    must hold. It is taken to hold, like the ordering, at every field in the range; round 1 had
    counted it as holding at most fields, a rule with no basis in the criterion or the paper.
- claim: fig2c-inhibition-flat-above-8-7
  outcome: reproduced
  assumed: true
  notebook: reproduce_kim_2022.ipynb
  output: claim:fig2c-inhibition-flat-above-8-7
  notes: Percent of the unipolar mean at 8.78 against 15.1 kV/cm, unpaired, ROI on both sides; 25%
    103.8 against 97.7 (p = 0.83), 50% 67.8 against 35.1 (p = 0.072), 75% 91.5 against 40.0 (p =
    0.15), 100% 121.3 against 114.6 (p = 0.78). The 50% and 75% differences are large (+32.7 and
    +51.5 points) with 5 and 3 dishes, so the absence rests on few dishes, not small effects. Paired
    p = 0.11 to 0.89. Assigning the shared image and footprint discs of 0.1 and 0.3 mm also give 0
    of 4. With one side of the centre only one amplitude differs, 100% under (b+) (p = 0.033) and
    50% under (b-) (p = 0.036), which would make it not reproduced. Over every pair of ROI in the
    range 19 of 180 comparisons differ at p < 0.05, against 9 expected by chance.
  deviations:
  - Assumption. The ROI placement changes the outcome. Reading (a), the ROI on both sides of the
    centre averaged per dish, is adopted, as bb' runs from b to b' through the centre (Fig. 1C) and
    the two halves have the same fields; one side only is shown.
- claim: fig2c-weaker-at-6-7
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_kim_2022.ipynb
  output: claim:fig2c-weaker-at-6-7
  notes: At the ROI closest to 6.7 kV/cm (2.4 mm, 6.63 kV/cm) 50% pulses give 198% of the unipolar
    mean, against 35 to 68% at 8.78 to 15.1 kV/cm, and 100% pulses 283% against 93 to 139%, so the
    percent is higher than at every higher field for both. Unpaired, 100% differs from each higher
    field with p <= 0.022 and from the per-dish pooled value with p = 0.011; 50% does not reach p <
    0.01 (p up to 0.082 against each field, 0.049 against the per-dish pooled value). Paired gives
    the same (50% pooled p = 0.070, 100% p <= 0.035). The criterion as written pools the dish
    values of all higher field ROI; taken literally, every dish and ROI value pooled, it gives 50% p
    = 1.5e-09 and 100% p = 2.6e-09, and the outcome would be reproduced, under every variant shown.
    That pooling counts each dish ten times, so the per-dish mean is used (a deviation from the
    criterion's letter) and the outcome is partially reproduced. With one side of the centre, (b+)
    gives the same outcome and (b-) passes neither amplitude (100% pooled p = 0.078). The
    percentages above 100% mean more uptake than after unipolar pulses, not weaker inhibition in the
    paper's sense; the unipolar mean at 2.4 mm is 19 a.u. (dishes 25 and 12), near background and
    smaller than the spread of background between dishes (raw YP far from the electrodes minus YP0,
    -7 to 127 a.u.). The 100% pass rests on this ratio to a near-background mean from 2 dishes; the
    criterion counts it, and it is counted here.
  deviations:
  - Assumption. The unpaired test is adopted, as for fig2a-uptake-rises-with-field; the paired
    result is shown.
  - Pooled reading (ii) is taken per dish, each dish's mean percent over the higher field ROI, so
    that the test counts dishes; round 1 pooled every dish and ROI value, which treats the ROI of a
    dish as independent. This departs from the criterion's wording ("the dish values of all higher
    field ROI pooled"), under which the outcome would be reproduced.
  - Assumption. ROI reading (a), both sides of the centre, as for
    fig2c-inhibition-flat-above-8-7; one side only is shown.
- claim: fig7-unipolar-pole-polarization
  outcome: reproduced
  assumed: true
  notebook: reproduce_kim_2022.ipynb
  output: claim:fig7-unipolar-pole-polarization
  notes: Over 5 unipolar cells, at 600 ns the cathode-facing pole is +22.1% (p = 0.0012) and the
    anode-facing pole -20.7% (p = 0.0026), ratio of magnitudes 0.94; the 500 to 600 ns mean gives
    +22.1 and -21.4%. Five variants of the pole regions give ratios 0.90 to 1.05, all p <= 0.013,
    among them regions that leave out membrane facing a neighbouring cell (+22.1 and -20.4%, ratio
    0.92). In all 9 cells the upper pole of the image rises and the lower falls during the first
    pulse.
  deviations:
  - 5 of the paper's 18 unipolar cells are in the dandiset.
  - Assumption. The paper does not say how the pole regions were drawn. They are the membrane
    pixels (frame-averaged image above its 85th percentile, largest connected group) where the
    outward normal of the smoothed cell outline is within 45 degrees of the image's vertical axis,
    the axis of the response in every file; 80th and 90th percentiles and 30 and 60 degrees are
    variants. Images are binned 2 x 2 on loading. The paper imaged individual cells or small groups
    (Methods 2.6); where the group is several touching cells, the regions include some membrane at
    cell contacts and notches that faces a neighbouring cell. A variant keeps only pole pixels with
    no other part of the group beyond them along the field axis (61 to 100% of the pole pixels per
    file).
  - Assumption. The files do not say where the electrodes were. The pole that brightens is taken as
    the cathode-facing one, as FluoVolt emission rises with depolarization and the cathode-facing
    pole depolarizes (Results 3.5). This makes the sign of the cathodic change a premise; the test
    is that the opposite pole changes the other way by a similar amount.
  - The pulse onset is not in the files; it is the first forward-trial frame where the mean unipolar
    upper-minus-lower signal exceeds its baseline by 5 SD (frame 43). The baseline is the 40 frames
    before it (Methods 2.6). Dark frames (failed flashes) are left out. Reverse trials are reversed
    and aligned to the forward trial by correlation (a lag of 74 frames in 8 cells and 75 in cell24)
    before the two are averaged (Methods 2.6).
- claim: fig7-charging-time-constant
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_kim_2022.ipynb
  output: claim:fig7-charging-time-constant
  measured:
  - 191
  - 23.2
  - 613
  - 22.7
  notes: Over 5 unipolar cells, pooled points (125 for the charging fit over 0 to 600 ns, 120 for
    the discharge over 600 to 1175 ns), the charging fit gives tau = 191 ns (within 200 +- 20) and A
    = 23.2% (expected 31 +- 3.1); the discharge fit tau = 613 ns (expected 520 +- 52) from 22.7%
    (expected 31.5 +- 3.15). r = 0.84 and 0.64, p < 1e-14; the mean trace gives the same parameters
    with r = 0.998 and 0.997 and residuals of at most 1.4 points. Discharge over charge is 3.2,
    against 2.5. The charging tau is not robust to the onset, which is known to a frame; moving it
    by one frame gives 149 to 249 ns, and placing t = 0 half a frame earlier 216 ns. The discharge
    tau (615 to 627 ns) and both amplitudes (21.9 to 24.7%) stay outside tolerance in every case.
    Per cell, A ranges from 14.4 to 31.3% and discharge tau from 351 to 833 ns, so the subset of 5
    cells of 18, and the assumed pole regions, may explain the difference. Leaving out the pole
    membrane that faces a neighbouring cell gives the same fit (A = 23.2 and 22.8%, tau = 191 and
    614 ns).
  deviations:
  - 5 of 18 cells, so 120 points per fit where the paper has 425.
  - Pole regions, cathode side and onset as in fig7-unipolar-pole-polarization (assumptions).
  - Fits by nonlinear least squares in scipy, not Grapher 16; r is the correlation of the points
    with the fit.
- claim: fig7-later-pulses-same-tau-difference
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_kim_2022.ipynb
  output: claim:fig7-later-pulses-same-tau-difference
  notes: With the criterion's A(1 - exp(-t/tau)) form, discharge over charge is 7.9, 10.5, 8.9 and
    9.1 for pulses 2 to 5, so the discharge constant is the larger for all four, but no ratio is
    within 2.25 to 2.75 or within 10% of the first pulse's 3.22 (2.90 to 3.54). That form cannot
    follow a pulse that starts from a charged membrane (charging tau 62 to 80 ns). With the
    free-start variant the ratios are 2.99, 3.62, 2.88 and 2.97, the discharge constant again the
    larger for all four; none is within 2.25 to 2.75 and pulses 2 and 5 are within 10% of the first
    pulse's ratio (pulse 4 just below). Both forms give partially reproduced.
  deviations:
  - The free-start charging fit, V0 + (A - V0)(1 - exp(-t/tau)), is a variant added here, as
    Results 3.5 says charging by later pulses "started with the partially charged membrane"; the
    criterion's form is the main one.
  - Pole regions, cathode side and onset as in fig7-unipolar-pole-polarization (assumptions).
- claim: fig7-bipolar-overshoot
  outcome: reproduced
  assumed: true
  notebook: reproduce_kim_2022.ipynb
  output: claim:fig7-bipolar-overshoot
  notes: (i) At 600 ns the cathodic pole is 21.5% for 4 bipolar and 22.1% for 5 unipolar cells,
    unpaired p = 0.855; the error-bar gap rule finds no difference. (ii) After the first phase the
    bipolar mean falls to half in 150 ns (unipolar 475 ns) and to zero in 325 ns (unipolar not
    within 600 ns). (iii) The bipolar mean reaches -8.1% at 1175 ns; cell values -6.7 to -9.9%,
    p = 0.0012. That time was chosen on the mean of the same cells; the last frame of the second
    phase, fixed in advance, is the same frame.
  deviations:
  - 4 of the paper's 17 bipolar cells and 5 of its 18 unipolar cells.
  - Pole regions, cathode side and onset as in fig7-unipolar-pole-polarization (assumptions).
- claim: fig7-bipolar-alternation
  outcome: reproduced
  assumed: true
  notebook: reproduce_kim_2022.ipynb
  output: claim:fig7-bipolar-alternation
  notes: For each of the five pulses, over 4 bipolar cells, the cathodic pole is positive at the end
    of the first phase (19.3 to 21.5%, p <= 0.0001) and negative at the second-phase minimum of the
    mean (-8.1 to -9.1%, at 1150 to 1175 ns, p <= 0.0013). The value at 1175 ns of each period, a
    time fixed in advance, gives -8.1 to -9.1% with p <= 0.0017.
  deviations:
  - 4 of 17 cells; pole regions, cathode side and onset as in fig7-unipolar-pole-polarization
    (assumptions).
- claim: fig7-summation-without-buildup
  outcome: reproduced
  assumed: true
  notebook: reproduce_kim_2022.ipynb
  output: claim:fig7-summation-without-buildup
  notes: Over 5 unipolar cells, the peaks at the end of pulses 2 to 5 (23.4 to 24.3%) do not differ
    from the first (22.1%) by the unpaired test (p = 0.61 to 0.75), and the trace before each of
    pulses 2 to 5 stays above rest (8.8 to 9.9%, p = 0.009 to 0.017). The paired variant finds
    pulses 2 to 4 1.7 to 2.2 points higher (p = 0.014 to 0.040), a build-up of 7.8 to 10.1% of the
    first peak within cells; pulse 5 is 1.4 points (6.1%) higher, p = 0.089. The maximum within each pulse gives the
    same picture (unpaired p = 0.72 to 0.78). With 5 cells the absence found by the unpaired test,
    the test the criterion names, is weak evidence.
  deviations:
  - 5 of 18 cells; pole regions, cathode side and onset as in fig7-unipolar-pole-polarization
    (assumptions).
