- claim: results-npx-units-per-session
  outcome: reproduced
  notebook: reproduce_shin_2025.ipynb
  output: claim:results-npx-units-per-session
  measured:
  - 150.3
  - 582.8
  notes: V1 holds 150.3 +/- 19.8 RS units per session (1,804 in all) and the five higher visual areas
    582.8 +/- 43.3 (mean +/- s.e.m., 12 sessions), within 150 +/- 20 and 597 +/- 46. Dropping the units
    labelled noise gives 131.4 and 509.9 (variant).
- claim: methods-npx-ic-encoder-count
  outcome: reproduced
  notebook: reproduce_shin_2025.ipynb
  output: claim:methods-npx-ic-encoder-count
  measured: 159
  notes: 159 of 1,804 V1 RS units are IC-encoders in at least one of ICwcfg1 and ICwcfg0 (reading a),
    the paper's number; the sum of the two blocks' counts (reading b) is 163, also within 159 +/- 15.9.
- claim: ed6b-npx-v1-group-counts
  outcome: reproduced
  notebook: reproduce_shin_2025.ipynb
  output: claim:ed6b-npx-v1-group-counts
  measured:
  - 87
  - 636
  assumed: true
  notes: Reading (b1), all V1 units in the files in ICwcfg1, gives 87 IC-encoders and 636 segment responders,
    the paper's numbers exactly. Dropping the units whose quality label is noise (b2) gives 79 and 566
    (566 outside 636 +/- 63.6). Reading (a) gives 79 and 526 (the Fig. 2d counts) and reading (c) 159
    and 684; neither puts both counts within tolerance. The layer proportions are shown (IC-encoders 35.6%
    in layer 2/3, segment responders 28.1%).
  deviations:
  - Assumption. Reading (b), "all units not classified as noise", is taken as every unit in the files,
    because the Methods say "all units not classified as noise were packaged into Neurodata Without Borders"
    files. The files also carry a quality column with 322 V1 units labelled noise; dropping them (b2)
    does not reproduce the segment responder count. The exact match of both counts under (b1) supports
    the assumption. Asked of the authors under findings (methods_unavailable).
- claim: ed6cd-npx-ic-encoders-all-areas
  outcome: reproduced
  notebook: reproduce_shin_2025.ipynb
  output: claim:ed6cd-npx-ic-encoders-all-areas
  notes: 'Neuropixels part. All six areas hold IC-encoders in ICwcfg1: 79 (V1), 48 (LM), 73 (RL), 64 (AL),
    59 (PM) and 49 (AM), in 8 to 12 sessions per area, 3.4% to 5.0% of RS units on average. The calcium
    imaging part of the statement is not in the dandiset and is not tested.'
- claim: fig1e-npx-exclusive-center
  outcome: not_reproduced
  notebook: reproduce_shin_2025.ipynb
  output: claim:fig1e-npx-exclusive-center
  measured:
  - 44
  - 1804
  notes: The V1 RS count is 1,804, as in the paper, but 44 units are exclusively center-responsive under
    reading (a) and 52 under reading (b), against 18 +/- 1.8. Before the exclusivity rule, 474 units have
    the center as best position; under (a), 383 of them have at least one position passing the code's
    Holm step and 44 have exactly one; under (b), 602 units have the center passing Holm with a mean above
    the spontaneous windows and 52 have no other position passing. Units in both readings 5; reading (a)
    without the units labelled noise 37. The analyzeRFCI.m code could not be compared line by line in
    this run, so a difference in the selection procedure is possible.
- claim: fig1f-npx-ic-ire-responsive
  outcome: not_reproduced
  notebook: reproduce_shin_2025.ipynb
  output: claim:fig1f-npx-ic-ire-responsive
  measured:
  - 50.0
  - 63.6
  notes: No combination of fig1e reading, test and block puts both fractions within tolerance. The IC-responsive
    fraction ranges from 38.5% to 56.8% (below 66.7 +/- 6.67 in every combination); the IRE-responsive
    fraction is within 77.8 +/- 7.78 only with both blocks under fig1e reading (a) (77.3% and 79.5%),
    where the IC fraction is 38.6% and 54.5%. Measured values are for fig1e reading (a), block ICwcfg1,
    test (a). The units are those of fig1e, which did not reproduce.
- claim: fig1g-npx-orientation-match
  outcome: not_reproduced
  notebook: reproduce_shin_2025.ipynb
  output: claim:fig1g-npx-orientation-match
  measured: 75.0
  notes: The criterion judges the match under the reading that reproduces fig1f, and none does. The match
    ranges from 60.0% to 93.3%; only fig1e reading (a) with block ICwcfg1 gives a value within 78.6 +/-
    7.86 (75.0%, 28 IRE-responsive units). Every reading is above its shuffle 95th percentile (37.1% to
    67.9%).
- claim: ed2b-npx-fixed-gaze
  outcome: reproduced
  notebook: reproduce_shin_2025.ipynb
  output: claim:ed2b-npx-fixed-gaze
  measured:
  - 10
  - 10
  - 9
  assumed: true
  notes: Ten sessions have eye tracking, as in the paper. Under rule (r), any fixed-gaze RF trial counts
    for the coverage of the 9 positions, 9 sessions are valid, the paper's number; under rule (s), standard
    trials only, 8 are (session 630506 has no fixed-gaze standard trial at one position). Under rule (r)
    and fig1e reading (a), 10 exclusively center-responsive V1 RS units remain (within 11 +/- 1.1, in
    two sessions), and the orientation match (71.4% to 100% across tests and blocks, 7 to 9 IRE-responsive
    units) is above the shuffle 95th percentile (50.0% to 77.8%) in every combination. Under fig1e reading
    (b), 41 units remain. The units under rule (s) are the same 10. The fixed-gaze selection rests on
    the fig1e selection, which gives 44 units with all trials against the paper's 18, so the match of
    the fixed-gaze count may be partly coincidental.
  deviations:
  - The 8 degree threshold of the Methods cannot be applied, as the files give pupil position in camera
    pixels with no conversion; the code's 20 pixels (criterion reading b) is used.
  - Assumption. The criterion and the Extended Data Fig. 2 legend require that fixed-gaze RF trials cover
    all 9 positions ("at least one trial in each position") without saying whether inverse trials count.
    Rule (r), any RF trial, is adopted, as neither text restricts the trials to standard patches; it gives
    the paper's 9 sessions, where standard trials only give 8. A valid session with no fixed-gaze standard
    trial at a position gets p = 1 there. Asked of the authors under findings (methods_unavailable).
  - The shuffle 95th percentile of 1,000 permutations is the criterion's standard choice for the null
    of the match.
- claim: ed2f-npx-rf-match
  outcome: reproduced
  notebook: reproduce_shin_2025.ipynb
  output: claim:ed2f-npx-rf-match
  measured:
  - 0.812
  - 414
  notes: On the 8 sessions of rule (s), reading (b) gives n = 414 with a match of 0.812 and reading (c)
    n = 374 with 0.832; on the 9 sessions of rule (r) of ed2b, (b) gives n = 434 with 0.804 and (c) n
    = 392 with 0.821. All are within 0.81 +/- 0.081 and 398 +/- 39.8. Reading (a) gives n = 602 (rule
    s) or 640 (rule r), outside tolerance.
- claim: ed2g-npx-pupil-area
  outcome: reproduced
  notebook: reproduce_shin_2025.ipynb
  output: claim:ed2g-npx-pupil-area
  notes: 'Friedman test across the 10 sessions with eye tracking: p = 0.356 for IC1, LC1, LC2 and IC2
    (reading a) and p = 0.898 for all 22 images (reading b), both >= 0.05 (paper p = 0.722). The range
    of image means is 0.011 and 0.045 s.d. The end and maximum variants give p from 0.063 to 0.948; trials
    whose eye frames are all NaN now give NaN for the maximum, not -inf.'
- claim: ed2a-npx-gaze-confined
  outcome: reproduced
  notebook: reproduce_shin_2025.ipynb
  output: claim:ed2a-npx-gaze-confined
  notes: 'Friedman test of the per-session image means of the pupil center: p = 0.472 for x and 0.374
    for y; the largest difference between image means in a session is 2.2 pixels. Per-session Kruskal-Wallis
    variant, p < 0.05 in 1 of 20 tests (smallest 0.026). Whether the gaze region fits within the illusory
    gap cannot be judged: the extent of the 0.01 density isoline is 24 to 124 camera pixels by session,
    and the files give no conversion to degrees.'
  deviations:
  - The paper names no test for the absence of systematic differences; the criterion's Friedman test is
    a reader's choice.
- claim: fig2d-npx-ccg-hva-input
  outcome: reproduced
  notebook: reproduce_shin_2025.ipynb
  output: claim:fig2d-npx-ccg-hva-input
  measured:
  - 79
  - 526
  notes: The groups hold 79 V1 IC-encoders and 526 V1 segment responders, the paper's numbers. In all
    8 combinations of smoothing (boxcar, Gaussian), flank (raw, corrected) and measure (fraction, number
    of connected HVA units), IC-encoders have the larger mean and P(IC-encoder > segment responder) from
    0.62 to 0.64, with a tie-corrected two-sided rank-sum p from 1.0e-05 to 3.9e-04 (paper 7.0e-06). The
    medians are higher for IC-encoders in 7 combinations; for the number of connections with boxcar smoothing
    and the raw flank they are equal (1 and 1).
  deviations:
  - The criterion asks for a higher median under every combination. For one combination the integer medians
    tie at 1, so the criterion cannot decide its direction there; the tie is broken by the direction of
    the rank-sum test, the paper's test (protocol, ties in a criterion), which favours IC-encoders (P
    = 0.63, p = 9.8e-05). The verifier judged the claim blocked on the literal rule.
  - The per-pair normalisation by the square root of the spike counts is left out; it does not change
    the comparison of a pair's peak with its own flank.
- claim: fig3a-npx-v1-decoding
  outcome: reproduced
  notebook: decoding_shin_2025.ipynb
  output: claim:fig3a-npx-v1-decoding
  notes: V1 accuracy 0.697 +/- 0.052 under reading (a) and 0.719 +/- 0.056 under reading (b), against
    the chance of 0.25, signed-rank p = 0.00049 under both, 12 of 12 sessions above 0.25 (range 0.268
    to 0.887 under reading a). The other areas range from 0.48 (AM) to 0.709 (LM) under reading (a).
- claim: fig3c-npx-v1-inference
  outcome: reproduced
  notebook: decoding_shin_2025.ipynb
  output: claim:fig3c-npx-v1-inference
  measured:
  - 0.518
  - 0.21
  notes: Under reading (b), P(TRE -> IC) = 0.518 and P(TRE -> LC) = 0.210, both within tolerance, IC above
    LC in 10 of 12 sessions, signed-rank p = 0.0024. Under reading (a), 0.516 and 0.197, the LC value
    0.0014 below the lower bound 0.198, same p. With two further cross-validation seeds (decoding_checks_shin_2025.ipynb),
    both values are within tolerance under both readings (IC 0.511 to 0.519, LC 0.198 to 0.215) with p
    from 0.0015 to 0.0068, so the outcome does not depend on the seed.
  deviations:
  - The decoder is scikit-learn's libsvm SVM, not MATLAB's fitcecoc; reading (b) searches C from 10^-3
    to 1 with one-vs-one coding in place of the code's Bayesian search. In V1, C above 1 never gave a
    higher inner accuracy, and the one-vs-all coding changed it by -0.012 to 0.024 (decoding_checks_shin_2025.ipynb).
- claim: fig3d-npx-areas-inference
  outcome: partially_reproduced
  notebook: decoding_shin_2025.ipynb
  output: claim:fig3d-npx-areas-inference
  assumed: true
  notes: 'The decoder readings differ. Under reading (b), adopted, four areas decode TRE as IC significantly
    more than as LC (V1 p = 0.0024, LM 0.0156, RL 0.0049, AL 0.0020; PM 0.077, AM 0.083), and LM, V1 and
    AL have the three largest mean scores (0.346, 0.308, 0.285): three or four areas significant gives
    a partial reproduction. Under reading (a), five areas are significant (V1, LM, RL, AL and AM; PM p
    = 0.092) and V1, LM and AL are the three largest, which meets the criterion; two further seeds give
    the same five areas. The statement names PM as significant and AM as not; under both readings PM is
    not significant, and AM is under reading (a) only. Sessions per area 12, 8, 11, 10, 12, 11, as in
    the paper.'
  deviations:
  - Assumption. The Methods do not say how the SVM hyperparameters were set; the paper's code chooses
    them with OptimizeHyperparameters. Reading (b), C chosen by an inner cross-validation, is adopted
    as the reading closer to the code. It searches C from 10^-3 to 1 with one-vs-one coding; C above 1
    never gave a higher inner accuracy in V1 and the one-vs-all coding changed it by at most 0.024 (decoding_checks_shin_2025.ipynb).
    Asked of the authors under findings (methods_unavailable).
  - The decoder is scikit-learn's libsvm SVM, not MATLAB's fitcecoc.
- claim: ed7b-npx-xre-inference
  outcome: reproduced
  notebook: decoding_shin_2025.ipynb
  output: claim:ed7b-npx-xre-inference
  notes: The XRE inference score is above 0.5 in all six areas under both readings, with signed-rank p
    from 0.0005 (V1) to 0.0137 (AM), equal or close to the paper's values (0.0005 to 0.0137). Mean scores
    0.576 (AM) to 0.718 (V1) under reading (a) and 0.585 to 0.762 under reading (b); the chance of the
    two-class decoder is 0.5.
- claim: ed7a-npx-no-area-above-v1
  outcome: reproduced
  notebook: decoding_shin_2025.ipynb
  output: claim:ed7a-npx-no-area-above-v1
  notes: 'No higher visual area has a significantly larger TRE or XRE inference score than V1 under either
    pairwise test (signed-rank, Tukey-Kramer) or either decoder reading; every significant difference
    has the HVA below V1 (PM and AM). The Kruskal-Wallis tests across the six areas are significant, as
    in the paper: reading (a) p = 0.0006, 0.0071, 0.0005 and 0.0077 for accuracy, inference score, XRE
    accuracy and XRE score (paper 0.0019, 0.0249, 0.0005, 0.0022); reading (b) 0.0017, 0.0156, 0.0002
    and 0.0015.'
  deviations:
  - Extended Data Fig. 7c pools Neuropixels and 2p areas; its Kruskal-Wallis values are compared on the
    six Neuropixels areas only (criterion).
- claim: ed6ef-npx-ic-not-greater
  outcome: reproduced
  notebook: reproduce_shin_2025.ipynb
  output: claim:ed6ef-npx-ic-not-greater
  notes: 'No area gives p < 0.05 in either panel: the one-tailed signed-rank p for IC > LC ranges from
    0.72 to 0.99 over all RS units (e) and from 0.65 to 0.99 over visually responsive units (f). Eleven
    of the 12 p-values equal the paper''s to four decimals; AM in panel (e) gives 0.8608 against 0.8398.
    The mean IC minus LC difference is between -0.078 and 0.005 spikes/s.'
- claim: supp3-decoder-types
  outcome: blocked
  blocked_by: too_large
  notebook: decoding_checks_shin_2025.ipynb
  output: claim:supp3-decoder-types
  notes: 'The quadratic and RBF SVMs were run (reading a, C = 1, one further seed): the TRE inference
    score is positive and significant in V1, LM and AL for both, as for the linear SVM on the same seed
    (p from 0.0015 to 0.0156 for the three kernels; mean scores 0.257 to 0.335). The network of the Methods
    (two hidden layers of 100 units, 50,000 full-batch epochs, tenfold) takes about 4.4 ms per epoch on
    89 units, about 3.6 minutes per fit and about 18 hours on one core for the 300 fits of V1, LM and
    AL, far beyond the notebook limit of 30 minutes. The criterion needs each decoder type, so the claim
    is not decided; the part that ran agrees with it.'
  deviations:
  - The quadratic kernel is (gamma <x, y> + 1)^2 and the RBF kernel uses scikit-learn's gamma "scale";
    the paper gives no kernel parameters (assumption, stated in the helper).
  - Supplementary Fig. 3 was not read; the test on the Neuropixels areas V1, LM and AL is the criterion's
    reading.
