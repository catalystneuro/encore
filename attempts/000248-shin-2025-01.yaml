findings:
- kind: data_missing
  statement: The dandiset holds the 12 Neuropixels sessions only. The 2p imaging (V1L2/3, V1L4, mesoscope)
    and 2p holographic optogenetics recordings behind Figures 1h to 1k, 2b, 2c, 3e and 4 to 6 and several
    Extended Data figures are not in it, and the paper names no public archive for them; 21 of the paper's
    findings cannot be tested.
- kind: metadata_error
  statement: The units tables hold units whose quality is labelled noise (539 of 3,026 units in sub-633229,
    322 of the V1 units across sessions), while the Methods state that all units not classified as noise
    were packaged into the NWB files.
- kind: paper_inconsistency
  statement: The Methods' Animals list 14 Neuropixels mice (Sst-IRES-Cre;Ai32 n = 10, PV-IRES-Cre;Ai32
    n = 4); the files hold 12 sessions from 12 mice (9 Sst, 3 Pvalb), as the Results and legends state.
- kind: metadata_error
  statement: The eye tracking pupil position (pupil_tracking/data) is stated in meters; its values (pupil
    center near 300 to 400, pupil half-width near 20) are camera pixels, and no conversion to visual degrees
    is given, so the Methods' 8 degree fixed-gaze criterion cannot be applied from the files.
- kind: paper_inconsistency
  statement: The Methods say eye video was acquired at 30 Hz; the eye tracking timestamps in the files
    are 16.7 ms apart (60 Hz), which is what the paper's code assumes.
- kind: metadata_insufficient
  statement: The IC block tables give each image only as a frame index (0 to 21) with no image names;
    the names come from the paper's code, and the image templates stored in the files allow them to be
    checked by eye.
- kind: other
  statement: The last eye tracking timestamp of each session with eye tracking is NaN.
- kind: methods_unavailable
  statement: For the authors. The Methods do not say how the SVM hyperparameters were set; the code calls
    fitcecoc with OptimizeHyperparameters auto. Which coding, box constraint and kernel scale were chosen
    per session and area? The significance of PM and AM in Fig. 3d depends on it here (four areas significant
    with C chosen by inner cross-validation, five with C = 1).
- kind: methods_unavailable
  statement: For the authors. Extended Data Fig. 2 counts sessions whose fixed-gaze RF trials left at
    least one trial in each position. Do inverse-patch trials count towards that coverage? Counting them
    gives the paper's 9 sessions; counting standard trials only gives 8.
- kind: methods_unavailable
  statement: For the authors. Extended Data Fig. 6b counts 87 V1 IC-encoders and 636 segment responders.
    Are these all units in the NWB files, including those whose quality column says noise? All units give
    exactly 87 and 636; dropping the units labelled noise gives 79 and 566.
