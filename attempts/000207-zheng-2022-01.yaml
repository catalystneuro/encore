findings:
- kind: metadata_error
  statement: In the most recent published version (0.230530.1822) the spike times of subjects 13,
    17 and 18 are shifted by 191.5, -16.8 and 9.3 s against the encoding trials, which did not
    move, so spikes and clips no longer line up. The version the paper cites (0.220216.0323)
    does not have this shift.
- kind: metadata_error
  statement: The spike times of subject 19 are near -7.02e12 s while its events run from 0 to
    2892 s, in both versions read. Its 16 units cannot be aligned to the task.
- kind: identifier_missing
  statement: Scene recognition and time discrimination trials with soft or hard boundaries cannot
    be linked to the clips they test. Their frame names are numbered differently from the clips
    (10 distinct numbers in recognition, 1 to 60 in time discrimination, against clips 1 to 30).
    The position of a tested frame within its clip is not given.
- kind: identifier_missing
  statement: The dandiset does not say which units the paper classified as boundary cells or
    event cells, so the paper's selection cannot be compared with a new one cell by cell.
- kind: data_missing
  statement: The dandiset has no local field potentials, no units outside the medial temporal
    lobe (the paper has 405), no similarity ratings and no stimuli, and it lacks the behaviour of
    one of the paper's 20 subjects.
- kind: selection_undocumented
  statement: The dandiset has 565 medial temporal lobe units where the paper analyses 580, with a
    different split by region (hippocampus 279 against 343, amygdala 233 against 169,
    parahippocampal gyrus 53 against 68). Nothing says how the two sets relate.
- kind: metadata_error
  statement: Several column descriptions do not match the values. stimCategory holds 0, 1, 2 and
    is described as 1, 2, 3. A missing second or third boundary is stored as the clip's start
    time and described as 0. The accuracy code 0 for "no response" is never used; trials without
    a response are coded incorrect, or, in 20 time discrimination trials, correct. resp_value is
    1 for those trials and described as -1. RT is measured from the disappearance of the frames,
    which its description does not say, and is negative in 151 time discrimination trials.
- kind: metadata_error
  statement: The events series holds 43 entries with a code 0 that its description does not list,
    with timestamps as low as -7.0e12 s. The spike times have no stated unit.
- kind: methods_unavailable
  statement: The paper's Methods do not specify the permutation test, which soft boundaries are
    used, or how trials are matched across subjects for the pseudopopulation. The definitions of
    boundary and event cells, read literally, give a chance level about seventy times lower than
    the paper reports.
- kind: methods_unavailable
  statement: The code the dandiset links to (github.com/rutishauserlab/cogboundary-zheng, commit
    60f7ece) is four scripts that plot rasters from the NWB files. It contains none of the
    paper's analyses, no cell selection, chance level, statistics, state-space or reinstatement
    analysis, and nothing that links a tested frame to its clip.
- kind: metadata_error
  statement: The authors' plotting code drops missing boundaries by testing for a stored time
    above 0. In version 0.220216.0323 a missing boundary is stored as the clip's start time, so
    the code would keep 150 soft-boundary rows where 75 exist and its fixed row ranges for the
    three conditions would be wrong. In version 0.230530.1822 missing boundaries are NaN and the
    code works, but that version has the shifted spike times.
- kind: other
  statement: Methods and published code disagree on the firing-rate traces. The Methods give a
    200 ms window moved in 2 ms steps; the code uses 10 ms bins smoothed with a Gaussian window
    of 20 bins. The code shows 0.5 s before and 1 s after a boundary. It also treats every soft
    boundary, including those inside hard-boundary clips, as a soft-boundary trial (75 per
    session), which the Methods do not state.
- kind: other
  statement: Four hard-boundary clips (HB_7, HB_11, HB_14, HB_15) drive strong population
    activity in the half second before the hard boundary; all contain a soft boundary between
    2.75 and 3.40 s. This raises the baseline of a before-against-after test of the hard
    boundary.
