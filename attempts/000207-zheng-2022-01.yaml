- claim: edfig2a-recognition-similar
  outcome: reproduced
  notebook: reproduce_zheng_2022.ipynb
  output: claim:edfig2a-recognition-similar
  notes: Scene recognition accuracy over targets and foils is 0.738, 0.739 and 0.718 for clips
    with no, a soft and a hard boundary (paper 0.76, 0.75, 0.75), with no difference in a one-way
    ANOVA (F(2, 54) = 0.38, p = 0.69). Accuracy for hard-boundary clips is the lowest in every
    variant, by 0.01 to 0.05, without reaching significance.
  deviations:
  - 19 of the paper's 20 subjects.
  - The paper does not say whether foils are counted. Targets and foils are; targets alone give
    0.737, 0.718 and 0.688 (p = 0.59).
- claim: fig2def-recognition-vs-boundary-distance
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The dandiset does not give the position of a tested frame within its clip, only whether
    it came from the first or the second half (frameA or frameB in its name). For clips with soft
    or hard boundaries the frame names also do not identify the clip.
- claim: fig3c-boundary-cells
  outcome: not_reproduced
  notebook: reproduce_zheng_2022.ipynb
  output: claim:fig3c-boundary-cells
  measured: 0.0018
  notes: 1 of 549 units (0.18%) meets the Methods' definition of a boundary cell, against 42 of
    580 (7.24%) in the paper. At least one cell appears in 42 of 300 label shuffles. The count is
    0 or 1 in 20 repeats of the permutation tests, 1 with either alternative set of soft
    boundaries, 2 at alpha = 0.10, and 10 to 15 under a looser reading that pools conditions. The
    chance level here is 0.03% against the paper's 2.11%, so the paper's procedure was probably
    looser than its Methods' wording. The authors' published code was read and contains no cell
    selection, so it could not settle this. The outcome is the same under every reading tried.
  deviations:
  - 549 units from 18 sessions against the paper's 580 from 19. Subject 19 is left out because
    its spike times are not on the clock of the trial tables, and the dandiset's units differ
    from the paper's in number and in their split by region.
  - The paper's "permutation t-test" is implemented as a sign-flip test for before against after
    and a one-sided label-permutation test between conditions, with 1000 permutations.
  - Soft-boundary trials are every soft boundary of a session, in SB clips and in HB clips (75
    per session). The Methods do not say; this follows the authors' published plotting code
    (B01_raster_psth_encoding_BAligned_BSep_NWB.m, lines 29 to 37). The first soft boundary of
    each SB clip, used before that code was read, is kept in the notebook as an alternative.
  - Each condition is tested on its own, five tests per class, which is the literal reading of
    the Methods. The authors' published code has no cell selection to check this against.
  - 300 label shuffles for the chance level instead of 1000.
- claim: fig3g-event-cells
  outcome: partially_reproduced
  notebook: reproduce_zheng_2022.ipynb
  output: claim:fig3g-event-cells
  measured: 0.0128
  notes: 7 of 549 units (1.28%) meet the Methods' definition of an event cell, more than in any of
    300 label shuffles (mean 1.22, maximum 6), but about a fifth of the paper's 36 of 580 (6.20%).
    The count is 5 to 8 over 20 repeats of the permutation tests. Whether it exceeds chance
    depends on the reading. With the first soft boundary of SB clips as the SB trials there are 5
    cells and 3 of 300 shuffles give as many; without the 13 HB clips that have a soft boundary
    before the hard one there are 2; at alpha = 0.10 there are 12. The proportion is far below
    the paper's under every reading.
  deviations:
  - The same as for fig3c-boundary-cells.
- claim: fig3-cell-regions
  outcome: not_reproduced
  notebook: reproduce_zheng_2022.ipynb
  output: claim:fig3-cell-regions
  notes: No boundary cell among 53 parahippocampal units (paper 18 of 68). Event cells are 2 of
