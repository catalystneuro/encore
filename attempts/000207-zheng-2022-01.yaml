outcomes:
- claim: fig2a-order-accuracy
  outcome: reproduced
  notebook: reproduce_zheng_2022.ipynb
  output: claim:fig2a-order-accuracy
  measured: 0.528
  notes: Time discrimination accuracy is 0.528 across a hard boundary, 0.728 with no boundary and
    0.720 with a soft boundary (paper 0.53, 0.73, 0.73). It is lower across a hard boundary in 18
    of 19 subjects (paired p < 1e-6 against both).
  deviations:
  - 19 of the paper's 20 subjects; the twentieth is not in the dandiset.
  - Trials without a response are kept as coded in the file; leaving them out moves no mean by
    more than 0.01.
  - Paired tests over subjects are added to the paper's one-way ANOVA.
- claim: fig2b-order-reaction-time
  outcome: reproduced
  notebook: reproduce_zheng_2022.ipynb
  output: claim:fig2b-order-reaction-time
  measured: 2.054
  notes: Mean reaction time is 2.05 s across a hard boundary, 1.62 s with no boundary and 1.54 s
    with a soft boundary (paper 2.10, 1.62, 1.59 s), longer across a hard boundary in 18 of 19
    subjects. The file's RT column is used, which runs from the disappearance of the frames.
  deviations:
  - 19 of the paper's 20 subjects.
  - Trials without a response have an RT of 0 in the file and are kept; leaving them out gives
    2.08, 1.64 and 1.56 s.
- claim: fig2c-order-confidence
  outcome: reproduced
  notebook: reproduce_zheng_2022.ipynb
  output: claim:fig2c-order-confidence
  measured: 1.975
  notes: Mean confidence is 1.98 across a hard boundary, 2.45 with no boundary and 2.51 with a
    soft boundary (paper 1.95, 2.52, 2.59), lower across a hard boundary in 18 of 19 subjects.
  deviations:
  - 19 of the paper's 20 subjects.
  - Trials without a response have a confidence of 0 in the file and are kept; leaving them out
