  deviations:
  - The same as for fig3c-boundary-cells.
- claim: fig3dh-no-onset-response
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The dandiset does not say which units the paper classified as boundary or event cells,
    and the Methods' definitions select 1 and 7 units here, fewer than the 10 of each that the
    claim's criterion requires. The authors' published code does not select or list the cells.
    The notebook reports that none of the 8 responds to clip onsets or offsets.
- claim: edfig5-clip-onset-cells
  outcome: reproduced
  notebook: reproduce_zheng_2022.ipynb
  output: claim:edfig5-clip-onset-cells
  measured: 0.179
  notes: 98 of 549 units (17.9%) fire more after clip onset, against 13.1% in the paper; the gap
    of 4.8 points is just inside the tolerance of 5, and 98 is more than a proportion of 13.1%
    would plausibly give (p = 9e-4). 26 units (4.7%) fire more after clip offset, the chance
    level, against 0.7% in the paper. Seven sessions hold 82 of the 98 onset-responsive units.
    None of the 8 boundary and event cells found responds to onsets or offsets, which is too few
    to judge that part of the claim.
  deviations:
  - 549 units from 18 sessions against the paper's 580 from 19.
  - The paper's one-tailed test does not state its direction; an increase is tested. A decrease
    is found in 3.1% of units at onset.
  - The permutation test is a sign-flip test with 1000 permutations.
