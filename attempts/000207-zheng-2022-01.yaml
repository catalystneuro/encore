outcomes:
- claim: fig2a-order-accuracy
  outcome: reproduced
  notebook: reproduce_zheng_2022.ipynb
  output: claim:fig2a-order-accuracy
  measured: 0.528
  notes: Time discrimination accuracy is 0.528 across a hard boundary, 0.728 with no boundary and
    0.720 with a soft boundary (paper 0.53, 0.73, 0.73). It is lower across a hard boundary in 18
    of 19 subjects (paired p < 1e-6 against both).
  deviations:
  - 19 of the paper's 20 subjects; the twentieth is not in the dandiset.
  - Trials without a response are kept as coded in the file; leaving them out moves no mean by
    more than 0.01.
  - Paired tests over subjects are added to the paper's one-way ANOVA.
- claim: fig2b-order-reaction-time
  outcome: reproduced
  notebook: reproduce_zheng_2022.ipynb
  output: claim:fig2b-order-reaction-time
  measured: 2.054
  notes: Mean reaction time is 2.05 s across a hard boundary, 1.62 s with no boundary and 1.54 s
    with a soft boundary (paper 2.10, 1.62, 1.59 s), longer across a hard boundary in 18 of 19
    subjects. The file's RT column is used, which runs from the disappearance of the frames.
  deviations:
  - 19 of the paper's 20 subjects.
  - Trials without a response have an RT of 0 in the file and are kept; leaving them out gives
    2.08, 1.64 and 1.56 s.
- claim: fig2c-order-confidence
  outcome: reproduced
  notebook: reproduce_zheng_2022.ipynb
  output: claim:fig2c-order-confidence
  measured: 1.975
  notes: Mean confidence is 1.98 across a hard boundary, 2.45 with no boundary and 2.51 with a
    soft boundary (paper 1.95, 2.52, 2.59), lower across a hard boundary in 18 of 19 subjects.
  deviations:
  - 19 of the paper's 20 subjects.
  - Trials without a response have a confidence of 0 in the file and are kept; leaving them out
    gives 2.00, 2.48 and 2.55.
- claim: edfig2a-recognition-similar
  outcome: reproduced
  notebook: reproduce_zheng_2022.ipynb
  output: claim:edfig2a-recognition-similar
  notes: Scene recognition accuracy over targets and foils is 0.738, 0.739 and 0.718 for clips
    with no, a soft and a hard boundary (paper 0.76, 0.75, 0.75), with no difference in a one-way
    ANOVA (F(2, 54) = 0.38, p = 0.69). Accuracy for hard-boundary clips is the lowest in every
    variant, by 0.01 to 0.05, without reaching significance.
  deviations:
  - 19 of the paper's 20 subjects.
  - The paper does not say whether foils are counted. Targets and foils are; targets alone give
    0.737, 0.718 and 0.688 (p = 0.59).
- claim: fig2def-recognition-vs-boundary-distance
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The dandiset does not give the position of a tested frame within its clip. Its name says
    frameA or frameB, which by the paper's Methods (one frame from each half) is probably the
    first or the second half; no column states it. For clips with soft
    or hard boundaries the frame names also do not identify the clip.
- claim: fig3c-boundary-cells
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_zheng_2022.ipynb
  output: claim:fig3c-boundary-cells
  measured: 0.0018
  notes: The analysis was run, but the procedure behind the paper's count could not be
    determined. 1 of 549 units (0.18%) meets the Methods' definition of a boundary cell, against
    42 of 580 (7.24%) in the paper. The paper's chance level is 2.11%; the literal definition
    gives 0.03% here, alpha = 0.10 gives 0.10% and a looser pooled reading 0.55%, and the
    verifier found in simulation that the five-test definition stays at or below about 1% for
    every response profile it tried. No reading tried here produces the paper's chance level, so the paper's
    count came from a different procedure. Under the pooled reading there are 15 boundary cells
    (2.73%), more than in any of 300 shuffles. The authors' published code contains no cell
    selection. Recorded as not_reproduced before verification.
  deviations:
  - 549 units from 18 sessions against the paper's 580 from 19. Subject 19 is left out because
    its spike times are not on the clock of the trial tables, and the dandiset's units differ
    from the paper's in number and in their split by region.
  - The paper's "permutation t-test" is implemented as a sign-flip test for before against after
    and a one-sided label-permutation test between conditions, with 1000 permutations.
  - Soft-boundary trials are every soft boundary of a session, in SB clips and in HB clips (75
    per session). The Methods do not say; this follows the authors' published plotting code
    (B01_raster_psth_encoding_BAligned_BSep_NWB.m, lines 29 to 37). The first soft boundary of
    each SB clip, used before that code was read, is kept in the notebook as an alternative.
  - Each condition is tested on its own, five tests per class, which is the literal reading of
    the Methods. The authors' published code has no cell selection to check this against.
  - 300 label shuffles for the chance level instead of 1000.
- claim: fig3g-event-cells
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_zheng_2022.ipynb
  output: claim:fig3g-event-cells
  measured: 0.0128
  notes: As fig3c-boundary-cells. 7 of 549 units (1.28%) meet the Methods' definition of an event
    cell, more than in any of 300 label shuffles (mean 1.22, maximum 6), but about a fifth of the
    paper's 36 of 580 (6.20%). At alpha = 0.10 there are 12 (2.19%, above all 300 shuffles) and
    under the pooled reading 10 (1.82%, 4 of 300 shuffles as many). The chance levels of these
    readings are 0.22%, 0.72% and 0.65%, against the paper's 2.26%. Recorded as
    partially_reproduced before verification.
  deviations:
  - The same as for fig3c-boundary-cells.
- claim: fig3-cell-regions
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_zheng_2022.ipynb
  output: claim:fig3-cell-regions
  notes: Depends on the cell selections of fig3c-boundary-cells and fig3g-event-cells, whose
    procedure could not be determined. With the literal definition there is no boundary cell
    among 53 parahippocampal units (paper 18 of 68), and event cells are 2 of 267 in the
    hippocampus, 3 of 229 in the amygdala and 2 of 53 in the parahippocampal gyrus. The
    dandiset's split of units by region also differs from the paper's. Recorded as
    not_reproduced before verification.
  deviations:
  - The same as for fig3c-boundary-cells.
- claim: fig3dh-no-onset-response
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The dandiset does not say which units the paper classified as boundary or event cells,
    and the Methods' definitions select 1 and 7 units here, fewer than the 10 of each that the
    claim's criterion requires. The authors' published code does not select or list the cells.
    The notebook reports that none of the 8 responds to clip onsets or offsets.
- claim: edfig5-clip-onset-cells
  outcome: reproduced
  notebook: reproduce_zheng_2022.ipynb
  output: claim:edfig5-clip-onset-cells
  measured: 0.179
  notes: 98 of 549 units (17.9%) fire more after clip onset, against 13.1% in the paper; the gap
    of 4.8 points is just inside the tolerance of 5, and 98 is more than a proportion of 13.1%
    would plausibly give (p = 9e-4). 26 units (4.7%) fire more after clip offset, the chance
    level, against 0.7% in the paper. Seven sessions hold 82 of the 98 onset-responsive units; the
    other eleven have 16 of 359 (4.5%), about chance, so the overall proportion averages over
    sessions that differ widely. The spike clock is shown to be aligned for ten of those eleven;
    for subject 3 (1 of 31 units responsive) it could not be established.
    None of the 8 boundary and event cells found responds to onsets or offsets, which is too few
    to judge that part of the claim.
  deviations:
  - 549 units from 18 sessions against the paper's 580 from 19.
  - The paper's one-tailed test does not state its direction; an increase is tested. A decrease
    is found in 3.1% of units at onset.
  - The permutation test is a sign-flip test with 1000 permutations.
- claim: fig3j-response-latency
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Needs the paper's boundary and event cells, which the dandiset does not label; 1 and 7
    are found here, fewer than the 10 of each that the claim's criterion requires.
- claim: fig3-outside-mtl
  outcome: blocked
  blocked_by: data_missing
  notes: All 565 units in the dandiset are in the hippocampus, amygdala or parahippocampal gyrus.
    The paper's 405 units from other areas are not included.
- claim: fig4c-boundary-cells-predict-recognition
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Scene recognition trials with soft or hard boundaries cannot be linked to the clip they
    test. Their frame names carry 10 distinct numbers, with up to 12 trials per number, where the
    clips are numbered 1 to 30. The authors' published code links nothing either; it groups test
    trials only by boundary type. The paper's boundary cells are not labelled.
- claim: fig4h-event-cells-phase-predicts-order
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds spike times only. There are no local field potentials from which to
    compute theta phase.
- claim: fig5d-state-shift
  outcome: partially_reproduced
  notebook: reproduce_zheng_2022.ipynb
  output: claim:fig5d-state-shift
  notes: After a hard boundary the distance from the state at the boundary is larger than in clips
    with no boundary (9.03 against 7.42, p = 0.0001) and larger than before the boundary (after
    minus before 0.84 against 0.04, p = 0.004); 12 of 18 subjects show it alone. After a soft
    boundary the distance is larger than without a boundary (8.15, p = 0.003) but equally large
    before the boundary (after minus before 0.00, p = 0.55). That the shift completes within
    300 ms was not shown.
  deviations:
  - 549 units from 18 sessions against the paper's 580 from 19.
  - Pseudo-trials are matched across subjects by clip name; the paper does not say how.
  - Principal components are fitted on the three condition averages from 1 s before to 1.5 s
    after the boundary, giving 22 components for 99% of the variance against the paper's 55. The
    averages are of the same trials that are then compared.
  - A trial is z-scored from 1 s before to 8 s after clip onset; the paper says "the entire
    trial".
  - Clips with soft boundaries are aligned to their first soft boundary, one pseudo-trial per
    clip. The authors' published code does not cover this analysis.
  - The comparison with the second before the boundary is this attempt's; the paper shows curves.
  - Two SB clips have their first soft boundary less than 1 s after onset. Leaving them out gives
    the same result (SB after minus before -0.03, p = 0.59; HB 0.84, p = 0.003).
- claim: fig5ij-state-shift-predicts-memory
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Needs the memory outcome of each clip with a soft or hard boundary. Test trials of those
