- claim: fig5db-recovery
  outcome: reproduced
  notebook: reproduce_kohus_2016.ipynb
  output: claim:fig5db-recovery
  notes: Under M4 a (6 PV+BC, 7 AAC, 9 CCK+BC pairs) the recovery ratio rises with the interval for PV+BC (Spearman
    rho 0.306, p 0.0484) and AAC (rho 0.527, p 9.85e-05), both medians 0.634 at 50 ms; the CCK+BC median rises
