- claim: fig5c-pv-rip-depression
  outcome: reproduced
  notebook: reproduce_kohus_2016.ipynb
  output: claim:fig5c-pv-rip-depression
  notes: Under M4 a (the authors' amplitudes) with the Mann-Whitney reading of the test, the PV+BC medians
    at the 3rd and 4th AP are 0.650 and 0.641 (p 0.00106, 7 pairs) and the AAC median at the 2nd AP 0.767
    (p 0.0204, 7 pairs). Under M4 b it holds with both tests (AAC 2nd AP 0.679, Wilcoxon p 0.0312). Under
    M4 a with the Wilcoxon test the AAC 2nd AP misses (p 0.109). The PV+BC 2nd AP is not depressed (1.15
    under M4 a, 0.969 under M4 b, p 0.172 or more). Leaving out the first three sweeps keeps the result
    under the Mann-Whitney reading.
  deviations:
  - The RIP bursts in the data are at 222 Hz (4.5 ms between APs), not the 160 Hz of the paper.
- claim: fig5c-cck-rip-facilitation
  outcome: reproduced
  notebook: reproduce_kohus_2016.ipynb
  output: claim:fig5c-cck-rip-facilitation
  notes: Under M4 a the CCK+BC to PC medians are above 1 at the 2nd to 4th AP (1.37, 1.46, 1.11; 12
    pairs), the medians of the 4 CCK+DTI pairs that transmit under RIP are above 1 at all three (1.01,
    1.35, 1.05), and 7 of 16 CCK+ pairs are below 1 at the 4th AP. Under M4 b the CCK+BC medians are above
    1 at only the 2nd AP (1.22), as local amplitudes at 222 Hz are measured on the decay of the previous
    IPSC.
  deviations:
  - 12 CCK+BC and 4 CCK+DTI pairs with RIP, against the paper's 14 and 4; RIP at 222 Hz in the data.
- claim: fig5db-recovery
  outcome: reproduced
  notebook: reproduce_kohus_2016.ipynb
  output: claim:fig5db-recovery
  notes: Under M4 a (6 PV+BC, 7 AAC, 9 CCK+BC pairs) the recovery ratio rises with the interval for PV+BC
    (Spearman rho 0.306, p 0.0484) and AAC (rho 0.527, p 9.85e-05), both medians 0.634 at 50 ms; the
    CCK+BC median rises from 0.776 at 50 ms to 1.052 at 500 ms and falls to 0.725 at 1200 ms. PV+BC and
    CCK+BC differ at 100 ms (p 0.012) and 200 ms (p 0.0496) uncorrected; with Bonferroni over 7 intervals
    no interval is significant (smallest 0.0839). M4 b gives the same pattern (PV+BC rho 0.385, p 0.00626;
    100 ms p 0.0115). The difference part rests on the uncorrected reading of the criterion.
  deviations:
  - The interval of each sweep is read from its AP times; the descriptor does not give the order of the
    intervals (1200 to 50 ms, descending) or which _EPA block holds which.
  - One PV+BC recovery recording (Pair04) has no _EPA table, so M4 a has 6 PV+BC pairs and M4 b 7.
- claim: fig6-pv-trains-depression
  outcome: not_reproduced
  notebook: reproduce_kohus_2016.ipynb
  output: claim:fig6-pv-trains-depression
  notes: The depression grows with frequency (Spearman rho -0.738 PV+BC, -0.788 AAC under M4 a; p 1.9e-07,
    1.1e-11), and at 5 to 320 Hz and under EPI every median relative amplitude of APs 2 to 10 is below 1.
