- claim: fig5c-pv-rip-depression
  outcome: reproduced
  assumed: true
  notebook: reproduce_kohus_2016.ipynb
  output: claim:fig5c-pv-rip-depression
  notes: Under M4 b with the Wilcoxon reading of the test the PV+BC medians at the 3rd and 4th AP are 0.372
    and 0.329 (p 0.0156, 7 pairs) and the AAC median at the 2nd AP 0.679 (p 0.0312, 7 pairs). Under M4 a it
    holds only with the Mann-Whitney reading (PV+BC 0.650 and 0.641, p 0.00106; AAC 0.767, p 0.0204); with
    the Wilcoxon test the AAC 2nd AP misses (p 0.109). The Mann-Whitney reading compares the values with a
    constant vector of ones and gives p 0.00106 whenever all 7 lie on one side of 1, so it is degenerate; this
    is asked of a reader, and the outcome does not rest on it. The PV+BC 2nd AP is not depressed (1.15 under
    M4 a, 0.969 under M4 b, p 0.172 or more).
  deviations:
