- claim: fig4b-in-pc-kruskal-wallis
  outcome: reproduced
  notebook: reproduce_kohus_2016.ipynb
  output: claim:fig4b-in-pc-kruskal-wallis
  notes: With the single AP 1.3 s before the RIP burst (M3 a), all five measures differ across PV+BC (7
    pairs), AAC (7) and CCK+BC (12) to PC pairs at p < 0.05, with the authors' failures (M2 a; rise
    0.0191, latency 0.00842, amplitude 0.00405, potency 0.00624, transmission probability 0.00951) and
    with detected failures (M2 b; 0.00653 to 0.0179). The 1 Hz train (M3 b; 4, 3 and 3 pairs) gives no
    difference and the pooled reading (M3 c) three or four. The decay time constant does not differ (p
    0.122). Medians (M3 a, M2 a) PV+BC, AAC, CCK+BC; rise 0.601, 0.547, 0.709 ms; latency 0.747, 0.664,
    0.999 ms; amplitude 113.1, 226.1, 40.3 pA; transmission probability 1.0, 1.0, 0.875.
  deviations:
  - The data set holds 7 PV+BC, 8 AAC (7 with a RIP recording) and 12 CCK+BC to PC pairs, against the
    paper's 8, 9 and 14 high KCl pairs.
  - The files do not say which pipette solution each pair was recorded with; all IN to PC pairs are
    treated as high KCl pairs, as no type has more pairs than the paper's high KCl count.
  - Rise, latency and peak are measured on averaged sweeps with a baseline 4 to 0.8 ms before the AP
    peak and a response window 0.3 to 8 ms after it, standard choices the paper does not give.
- claim: fig4b-in-pc-posthoc
  outcome: not_reproduced
  notebook: reproduce_kohus_2016.ipynb
  output: claim:fig4b-in-pc-posthoc
  notes: At most 4 of the 8 comparisons hold, under M3 a with either M2 reading; AAC against CCK+BC for
    rise time, latency, amplitude and potency (Bonferroni-corrected p 0.0293, 0.0157, 0.0112, 0.0157).
    PV+BC against CCK+BC goes the stated way for rise time, latency and amplitude but misses the corrected
    threshold (0.205, 0.0512, 0.0663; uncorrected 0.0683, 0.0171, 0.0221). AAC against CCK+BC
    transmission probability gives corrected p 0.159. The 1 Hz reading gives 0 of 8 and the pooled
    reading 2 of 8. The criterion's partial threshold is five comparisons.
  deviations:
  - Fewer pairs than the paper (7, 7 and 12 against 8, 9 and 14), which lowers the power of the post hoc
    tests; all pairs treated as high KCl pairs.
- claim: fig4c-cckdti-pc-silent-single-ap
  outcome: not_reproduced
  notebook: reproduce_kohus_2016.ipynb
  output: claim:fig4c-cckdti-pc-silent-single-ap
  measured: 3
  notes: The data set holds 7 CCK+DTI to PC pairs. Three have no RIP recording and are marked "No release"
    for RIP in Experiments_description.txt; they are counted as silent (3 of 7, 43%, against the 85% the
    criterion requires). The other four transmit to the single AP before RIP (success rates 0.55 to 0.85
    under M2 a; detection rates 0.50 to 0.95 against 0.20 to 0.50 with no AP under M2 b). All seven
    transmit to the single AP after an EPI train under M2 a, six under M2 b. The paper's own later
    statement that four of eight pairs respond at 1 to 40 Hz or to RIP agrees better with these data.
  deviations:
  - 7 pairs where the paper reports 8; pairs without a RIP recording are taken as silent from the
    authors' "No release" label.
- claim: fig7a-cscl-kinetics
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The pairs are not labelled by pipette solution, in the files, the headers, the descriptor or
