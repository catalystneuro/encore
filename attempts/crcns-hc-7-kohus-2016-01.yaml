- claim: fig6-cckbc-async-onset
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_kohus_2016.ipynb
  output: claim:fig6-cckbc-async-onset
  notes: Both onset readings of the criterion were run. Rule (a), immediate asynchronous charge above 2
    SD of the baseline charge for three APs, gives CCK+BC to PC EPI onsets at the 2nd to 4th AP (median
    2.0, 10 pairs), and the same in 6 of 7 PV+BC and 8 of 8 AAC to PC pairs, which the paper calls
    synchronous; it also fires in 160 and 320 Hz trains of every type (6 of 6 CCK+BC to PC at 160 Hz).
    Rule (b) gives the 1st AP in every pair of every type. Scaling the reconstruction to the authors'
    amplitudes changes little (CCK+BC median 3.5, PV+BC 2.5). As both rules mark release the paper calls
    synchronous, neither reproduces the paper's procedure, and the paper does not describe one, so the
    claim is blocked (protocol, Record the attempt, on a selection whose false-positive behaviour differs
    from the paper's). The _EPA tables carry an undocumented code AR from some AP on in every CCK+BC and
    CCK+DTI to PC EPI table and in no PV+BC or AAC table; read as the onset, it gives a CCK+BC median of 12
    (quartiles 10 to 12.8, range 8 to 19) against the paper's 11 (10 to 14, range 10 to 19), and no AR in
    any CCK+BC 10-AP train. This is shown and not used to decide. The question is for the paper's authors
    (findings).
  deviations:
  - Template from the average of the 11th IPSCs of the pair's trains; four CCK+BC pairs without trains use
    the single AP before EPI, and two CCK+BC pairs have no EPI recording.
  - 100 Hz low-pass as a fourth-order zero-phase Butterworth filter, the claims file's standard choice.
