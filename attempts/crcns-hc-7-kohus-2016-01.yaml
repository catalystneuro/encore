findings:
- kind: metadata_error
  statement: The stimulation timings in the data differ from the data descriptor and the paper. RIP bursts
    are four APs 4.5 ms apart (222 Hz), not 160 Hz; the EPI burst is 30 APs 6.7 ms apart (147 Hz) and four
    3.3 ms apart (303 Hz), not 160 and 320 Hz; the single AP precedes the RIP and EPI bursts by 1.3 s, not
    1 s. The 10-AP trains are at their nominal rates.
- kind: metadata_error
  statement: Experiments_description.txt mislabels two recordings (PV+BC to PV+BC pair 10 s130807-0205, listed
    as 5 Hz, and CCK+DTI to PC pair 5 s150222-0305, listed as 40 Hz, are 10 Hz trains), names eight files that
    are not in the zip (three misdated s1508.. for s1308..), lists one file for two protocols in two pairs,
    leaves 20 recordings of the zip unnamed, lists no PV+BC to AAC pairs, and numbers the IN to PC pairs differently
    from the PairNN folders.
- kind: data_missing
  statement: Three recordings have a header but no sweeps (CCK+BC to PC Pair07 s140616-0105 and -0106, CCK+DTI
    to PC Pair01 s150119-0104), three have sweeps but no _EPA table, and the RIP recording listed for PV+BC
    to PC pair 4 is absent. The data set holds 7 PV+BC, 8 AAC, 12 CCK+BC and 7 CCK+DTI to PC and 14 PV+BC to
    PV+BC pairs, fewer than the paper's 8, 9, 14, 8 and 16. The CCK+ to CCK+ pairs were recorded only with
    10, 40 and 160 Hz trains, with no RIP recording, 1 Hz train or 320 Hz train, so their single-AP uIPSCs
    (Fig. 8) and 320 Hz charges (Fig. 10B) cannot be measured.
- kind: data_missing
  statement: The current-step recordings (Fig. 2, Tables 1 and 2), the connectivity tests with unconnected
    pairs (Fig. 3, Table 3), the spontaneous IPSCs (Fig. 12) and the field potential and optogenetic recordings
    (Fig. 13A, C) are not in the data set, which is described as holding the paired recordings only.
- kind: metadata_insufficient
  statement: The _EPA tables use a code AR, not described in the descriptor, that cuts off the mean row of
    every CCK+BC and CCK+DTI to PC EPI table and four CCK+DTI to PC 160 Hz tables from some AP on; its position
    matches the onset of asynchronous release the paper reports. The block the descriptor calls Relative ampl.
    holds amplitudes in pA.
- kind: metadata_insufficient
  statement: The pairs are not labelled by pipette solution (high KCl, or low KCl with CsCl), which the paper's
    comparisons of Figure 7 need, and the order of the recovery intervals across sweeps, and which _EPA block
    holds which interval, are not documented (the AP times show 1200 down to 50 ms).
- kind: identifier_missing
  statement: The files carry no animal or slice identifiers; the recording day in the file name is the only
    grouping above the pair, so results cannot be broken down by animal.
- kind: format_error
  statement: Two _EPA tables (CCK+BC to PC s140619-0204 and s140619-0105) hold column labels in place of the
    mean values; several tables list fewer sweeps than the raw data without a note (for example PV+BC to PC
    s140603-0406, 14 of 20); some have blank amplitude cells; four AAC to PC tables have successes with amplitude
    0 or failures with an amplitude; a few mean rows differ from the mean of their own per-sweep values (up
    to 38 pA).
- kind: paper_inconsistency
  statement: The Results say seven of eight CCK+DTI to PC pairs did not transmit for a single AP or an AP after
    RIP, and also that four of eight responded at 1 to 40 Hz or to RIP. In the data set four of the seven CCK+DTI
    pairs have RIP recordings and transmit to the single AP before RIP.
- kind: methods_unavailable
  statement: Question for the authors. How was the onset of asynchronous release determined (Results, Transmission
    of CCK+ cells, onset between the 10th and 19th AP)? Both rules the claims file names, a charge threshold
    on the reconstructed asynchronous current and a failure to return to baseline, mark early asynchronous
    charge in PV+BC and AAC pairs that the paper calls synchronous, and in the 160 Hz trains of nearly every
    pair. Does the AR code in the _EPA tables mark the onset, and by what criterion?
- kind: methods_unavailable
  statement: Question for the authors. Which APs gave the single-AP uIPSCs of the CCK+ interneuron pairs (Fig.
    8)? The data set holds only 10, 40 and 160 Hz trains for these pairs; this attempt shows the first AP of
    each train at 40 Hz or slower and blocks the claims, as the claims file's readings need a RIP recording
    or a 1 Hz train. Which windows were used for the baseline, the peak and the single-exponential decay fit
    of the averaged uIPSCs?
- kind: methods_unavailable
  statement: Question for the authors. How was the recovery half-time of PV+BC to PC IPSCs (Fig. 13B) fitted;
    with the plateau fixed at full recovery or free, and is the value tau or tau ln 2? Only the free-plateau
    fits come near 495.8 ms here.
