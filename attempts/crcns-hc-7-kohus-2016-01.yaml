- claim: async-charge-epi-vs-160
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_kohus_2016.ipynb
  output: claim:async-charge-epi-vs-160
  notes: Window after the 10th AP of the 160 Hz train (the first run measured it after the isolated 11th AP,
    an error the verifier found). CCK+BC to PC pairs carry more charge in the 500 ms after the last EPI AP
    than after the 160 Hz train, but not significantly (reading a, delayed asynchronous charge, 4.44 against
    1.18 pC; reading b, area under the mean trace, 4.67 against 1.61 pC; Mann-Whitney p 0.0934 for both, 10
    EPI and 6 train recordings), so the CCK+BC part fails under both readings. The absence parts hold under
    reading b (PV+BC p 0.138, AAC p 0.130, CCK+DTI p 0.649); under reading a PV+BC (p 0.0513) and CCK+DTI (p
    1, 5 EPI and 3 train recordings) hold and AAC fails (p 0.0148).
  deviations:
  - Reading b measures the area from the pre-stimulation baseline; the sweeps end before an equal window at
    least 500 ms after the stimulation, the paper's reference for the total charge.
  - Two CCK+DTI to PC pairs (Pair04, Pair06) have a template fit at a bound; the reconstruction-based delayed
    charge (reading a) is dropped for them.
  - The files do not say which pipette solution each pair was recorded with. Assumed that every IN to PC pair
    is a high KCl pair, as no type has more pairs than the paper's high KCl count and the paper says most pairs
    were recorded with it (Methods, paired recordings). Checked per pair in the notebook (holding current,
    rise time and latency by recording day); no type splits into two groups (holding currents -376.0 to 23.4
