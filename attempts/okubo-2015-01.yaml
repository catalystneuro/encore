- claim: fig3g-bird1-shared-specific
  outcome: reproduced
  notebook: reproduce_okubo_2015.ipynb
  output: claim:fig3g-bird1-shared-specific
  measured:
  - 96
  - 37
  - 39
  - 20
  notes: Adjusted window, shift reading (b), bird 1 at 62-72 dph (126 neurons), 96 active, 37 beta-specific,
    39 gamma-specific, 20 shared, all within tolerance; shift reading (a) gives 97, 38, 40 and 19. Unadjusted,
    107 active and 32 shared (outside). Adding D to beta at 70-72 dph changes nothing.
  deviations:
  - The paper adjusted the shared/specific test interval by visual inspection where one burst would be
    detected for two adjacent syllables (Methods, Shared and specific neurons); this cannot be repeated.
    Assumed here, as the reading the Methods best support, a fixed rule (hvc.type_test, adjust=True) that
    searches the peak again within the syllable itself when it falls in the 30 ms before onset or the
    10 ms after offset. The unadjusted result is shown as the other reading.
  - The dataset's labels are Latin letters; a to e are read as alpha to epsilon and capitals as the adult
    syllables, following the Methods' labelling scheme (Syllable classification and labelling).
  - Beta is `b` before 70 dph and `B` from 70 dph, gamma `c` and `C`; the files switch to capitals at
    70 dph.
  assumed: true
