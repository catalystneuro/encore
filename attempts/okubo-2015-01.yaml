  output: claim:fig2b-protosequence
  measured: 55
  notes: Locked to protosyllable onsets, 29 neurons in bird 2 (57-64 dph), 14 in bird 1 (56-59) and 12 in bird 4
    (48-49), 55 in all (54 +/- 5.4). Latencies span -35 to 188 ms in bird 2 (mean protosyllable 132 ms), but only
