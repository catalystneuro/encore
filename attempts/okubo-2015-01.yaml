outcomes:
- claim: counts-neurons-birds
  outcome: reproduced
  notebook: reproduce_okubo_2015.ipynb
  output: claim:counts-neurons-birds
  measured:
  - 1148
  - 35
  - 210
  - 1116
  notes: Of 1,125 neuron files, 1,116 pass the Methods' 5 s singing rule (1,117 expected), in 32 juvenile
    birds; 210 are HVCp (211 expected under either reading). The totals 1,149 and 35 cannot be measured,
    as the adult neurons are not in the dataset; with the paper's 32 adult neurons the total would be
    1,148. Measured values for the two totals are given as 1,116 + 32 and 32 + 3.
  deviations:
  - The 32 adult neurons of 3 birds (ref. 20, Kozhevnikov and Fee 2007) are not in am-3 and were not found
    in CRCNS (am-1, am-2 and am-4 hold other data); the adult stage is left out.
  - The two totals add the paper's own adult counts to the juvenile counts measured here.
- claim: ed1a-stage-age
  outcome: reproduced
  notebook: reproduce_okubo_2015.ipynb
  output: claim:ed1a-stage-age
  measured:
  - 0.615
  - 48
  - 58
  - 62
  - 73
  notes: Reading (b), one value per neuron, gives Spearman rho 0.615 and median ages 48, 58, 62 and 73
    dph, all within tolerance. Reading (a), per bird and day, gives rho 0.710 with medians 47, 57, 60
    and 76; reading (c), per bird and stage, rho 0.756. The neuron list's 'young adult' stage is counted
    as motif; as a fifth stage, rho is 0.642.
  deviations:
  - The list's stage 'young adult' (66 neurons of bird 1, 90 to 112 dph), which the paper does not define,
    is counted as motif; with it the per-stage counts match the paper's (378 motif neurons).
- claim: fig1-subsong-locking
  outcome: not_reproduced
  notebook: reproduce_okubo_2015.ipynb
  output: claim:fig1-subsong-locking
  measured:
  - 39
  - 25
  notes: 39 subsong-stage neurons (12 birds), as in the paper. 25 are locked at P < 0.05 under shift reading
    (b) and 27 under reading (a), against 19 +/- 1.9. At P < 0.01 (not the paper's threshold) 21, at P
    < 0.001 20.
  deviations:
  - The Methods do not say whether shifted spikes wrap around the +/- 0.5 s window; both readings of the
    claims header are run (a, circular; b, spikes from +/- 1 s binned within +/- 0.5 s).
  - The smoothing is a centred 20-bin moving average, the plain reading of 'smoothed over 20 bins' (claims
    header).
- claim: fig1f-locking-increases
  outcome: partially_reproduced
  notebook: reproduce_okubo_2015.ipynb
  output: claim:fig1f-locking-increases
  measured: 0.196
  notes: Juvenile stages only. Fractions locked rise 0.641, 0.852, 0.863, 0.963 from subsong to motif;
    Pearson r with stage 0.196 (P = 3.8e-11) under reading (b), 0.174 (P = 4.8e-09) under (a), 0.248 with
    per-type locking (iii b), 0.240 with Bonferroni. The paper's r = 0.22 includes the adult stage, absent
    here. The chi-square across the four juvenile stages gives P = 6.4e-11.
  deviations:
  - The 32 adult neurons of 3 birds (ref. 20, Kozhevnikov and Fee 2007) are not in am-3 and were not found
    in CRCNS (am-1, am-2 and am-4 hold other data); the adult stage is left out.
  - The Methods do not say whether shifted spikes wrap around the +/- 0.5 s window; both readings of the
    claims header are run (a, circular; b, spikes from +/- 1 s binned within +/- 0.5 s).
- claim: fig1f-rhythmic-protosyllable
  outcome: partially_reproduced
  notebook: reproduce_okubo_2015.ipynb
  output: claim:fig1f-rhythmic-protosyllable
  measured:
  - 7
  - 87
  - 161.6
  notes: Rhythmic subsong neurons 7 (bins a) or 6 (bins b) of 39, against 3; protosyllable-stage 87 or
    88 of 135, against 70 +/- 7. Mean period 161.6 +/- 6.0 ms (bins a) and 174.9 +/- 9.9 ms (bins b);
    the latter is within 169 +/- 6.4 ms. Of the four measures, the IBI peak is significant for 100 of
    135 protosyllable-stage neurons and the cepstrum for 37; requiring 3 of 4 gives 59. The direction
    of the claim holds; the counts do not.
  deviations:
  - Burst surrogates are drawn uniformly over non-overlapping arrangements of the bout's bursts with more
    than 30 ms between them, an implementation of the paper's sequential placement with re-drawing.
  - The multitaper spectra use 1 ms bins and 2048-point FFTs with the Methods' NW = 3/2 and K = 2 (standard
    choices for the Chronux defaults the paper does not state); bouts shorter than 1.5 s give no window,
    so 38 neurons have no spectrum or cepstrum.
