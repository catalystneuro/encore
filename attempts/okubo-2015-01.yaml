    being detected twice (that is, being associated with an offset of one syllable and an onset of the next syllable)'
    (Methods, Shared and specific neurons); this cannot be repeated. Assumed here, as the rule closest to that passage
    (hvc.pair_table, adjust 'double'), when a type's peak falls in the 30 ms before onset or the 10 ms after offset,
    the neighbouring syllable on that side is tested too; the burst counts as detected twice when that syllable's
    peak is significant and within 25 ms of the same time (the Methods' 'similar latency' of the bout-related analysis).
    The burst is then left to the syllable whose window holds it furthest from an edge, and the other syllable's
    window leaves out 25 ms either side of it before its peak is tested again. The unadjusted result and the first
    version's broader rule (every peak outside the syllable searched again inside it, hvc.type_test adjust=True)
    are shown as the other readings.
