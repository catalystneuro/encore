  notes: Double-detection rule, offset-aligned, 22 shared and 19 specific (onset-aligned 22 and 21), within tolerance.
    Latency r = 0.842 (n = 22, P = 8.9e-07) onset-warped, 0.844 offset-aligned, 0.780 offset-aligned without warping,
