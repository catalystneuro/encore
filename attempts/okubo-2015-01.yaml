- claim: fig1f-rhythmic-protosyllable
  outcome: not_reproduced
  notebook: reproduce_okubo_2015.ipynb
  output: claim:fig1f-rhythmic-protosyllable
  measured:
  - 7
  - 87
  - 161.6
  notes: Rhythmic subsong neurons 7 (bins a) or 6 (bins b) of 39, against 3 (partially at 2 or 4); protosyllable-stage
    87 or 88 of 135, against 70 +/- 7. Mean period 161.6 +/- 6.0 ms (bins a) and 174.9 +/- 9.9 ms (bins b); the
    latter is within 169 +/- 6.4 ms. No reading has all three values within tolerance, and both counts are outside
    even the partial band. The direction of the claim holds (rhythm rare in subsong, common in the protosyllable
    stage). Of the four measures, the IBI peak is significant for 100 of 135 protosyllable-stage neurons and the
    cepstrum for 37; requiring 3 of 4 gives 59.
  deviations:
  - Burst surrogates are drawn uniformly over non-overlapping arrangements of the bout's bursts with more than 30
    ms between them, an implementation of the paper's sequential placement with re-drawing.
  - The multitaper spectra use 1 ms bins and 2048-point FFTs with the Methods' NW = 3/2 and K = 2 (standard choices
    for the Chronux defaults the paper does not state); bouts shorter than 1.5 s give no window, so 38 neurons have
    no spectrum or cepstrum.
