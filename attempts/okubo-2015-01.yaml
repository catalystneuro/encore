findings:
- kind: metadata_error
  statement: List_of_HVC_neurons.xls assigns 66 neurons of bird 1 (to3965, 90 to 112 dph) to a stage 'young adult',
    which the paper does not define; its four juvenile stages match the paper's counts only when these are counted
    as motif (378 motif neurons with the 5 s rule). The data descriptor lists only the four juvenile stages.
- kind: identifier_missing
  statement: Two rows of List_of_HVC_neurons.xls (HVCp tab) have the same bird, date and name, to3563_2013-02-25_HVCp-1,
    with different file ranges (40-50 and 137-150); Analysis_files holds one file under that name. The list has
    1,126 rows and the archive 1,125 neuron files; one of the two neurons is missing or merged.
- kind: metadata_insufficient
  statement: Bird 3 (to3017), the paper's motif-strategy bird, has syllable labels in only one of its 19 neurons
    (148 labelled syllables). The phase-segmented syllables A to E of Extended Data Fig. 8 are not marked, so its
    shared-neuron and phase analyses cannot be repeated.
- kind: metadata_insufficient
  statement: The data descriptor says SegmentTitles holds the 'syllable name if applicable' but not the naming,
    the files use Latin letters, lower case a to f for the juvenile syllables the paper calls alpha to epsilon and
    capitals for adult syllables. The mapping had to be inferred from the paper's labelling scheme. Bird 4's protosyllable-stage
    `a` syllables last about 140 ms, where the paper's bird-4 protosyllables are 70 ms phase segments; which segments
    are phase segments is not said.
- kind: metadata_insufficient
  statement: EventTimes and EventIsSelected hold two rows per file with nearly identical spike times (about 0.1
    ms apart) and slightly different selections; the descriptor does not say what the rows are or which one the
    paper used. Row 0 was used here.
- kind: data_missing
  statement: The 32 adult neurons of 3 birds that the paper includes (a reanalysis of ref. 20) are not in am-3,
    which the descriptor says holds juvenile birds only, and were not found elsewhere on CRCNS. Every comparison
    with the adult stage (Fig. 1f, g, Extended Data Fig. 1c, 2m-o) can be made only for the juvenile stages.
- kind: methods_unavailable
  statement: 'Question for the paper''s authors. Shared and specific neurons were found with a test window ''adjusted
    if necessary'' by visual inspection so that one burst is not counted for two adjacent syllables (Methods, Shared
    and specific neurons). Without an adjustment, bird 1 has 32 shared neurons early instead of 22 and the latency
    correlations vanish. This attempt replaced the inspection by a rule: the window is adjusted only when the neighbouring
    syllable''s test finds the same burst within 25 ms, and the burst is left to the syllable whose window holds
    it furthest from an edge; this gives 22 shared in bird 1 and 22 and 4 in bird 2. Was this how the windows were
    adjusted, and could the adjusted windows, or the list of neurons and their classes, be published?'
- kind: methods_unavailable
  statement: Question for the paper's authors. The 8 syllable pairs behind 185 shared and 496 specific neurons,
    the pairs of birds 5 and 6 ('data not shown'), the 20 syllables of the coverage analysis, and the early/late
    boundaries of bird 1's B/D pair and bird 4's b/d and c/d pairs are not given. This attempt used bird 5 a/b,
    every pair of bird 6, 19 syllables of birds 1, 2 and 4, and boundaries of 80 dph (bird 1) and the stage boundary
    (bird 4). Which were used?
- kind: methods_unavailable
  statement: Question for the paper's authors. In the shift test of syllable- and bout-aligned histograms, were
    spikes shifted past +/- 0.5 s wrapped around or taken from a wider window, and how were the 20-bin smoothing
    and the histogram bins of the IBI and autocorrelation measures set? With the readings tried here, more neurons
    are locked in subsong (25 against 19), rhythmic (87 against 70 in the protosyllable stage) and post-bout (218
    against 149) than the paper reports. Which peak of the syllable-onset histogram removes a pre-bout neuron as
