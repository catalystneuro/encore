- claim: fig2b-protosequence
  outcome: partially_reproduced
  notebook: reproduce_okubo_2015.ipynb
  output: claim:fig2b-protosequence
  measured: 55
  notes: Locked to protosyllable onsets, 29 neurons in bird 2 (57-64 dph), 14 in bird 1 (56-59) and 12
    in bird 4 (48-49), 55 in all (54 +/- 5.4). Latencies span -35 to 188 ms in bird 2 (mean protosyllable
    132 ms), but only -21 to 91 ms in bird 1 (mean 139 ms) and -36 to 95 ms in bird 4 (mean 143 ms). Coverage
    of the protosyllable is 99.4%, 92.7% and 97.8%. Bird 4's `a` syllables last about 140 ms, where the
    paper describes 70 ms protosyllables found by phase segmentation.
  deviations:
  - The dataset's labels are Latin letters; a to e are read as alpha to epsilon and capitals as the adult
    syllables, following the Methods' labelling scheme (Syllable classification and labelling).
  - Protosyllables of birds 1, 2 and 4 are the dataset's `a` labels (alpha, Methods, Syllable classification
    and labelling), not recomputed; bird 4's phase segmentation is not marked in the files.
- claim: ed2st-coverage
  outcome: partially_reproduced
  notebook: reproduce_okubo_2015.ipynb
  output: claim:ed2st-coverage
  measured:
  - 17
  - 79.8
  notes: 19 syllable types of birds 1, 2 and 4 have more than 10 neurons bursting (paper 20); 17 are covered
    above 90%, the lowest is 79.8% (bird 2 alpha, 73-84 dph); 18 of 19 lie within their 2.5 to 97.5% surrogate
    interval, the exception being bird 1's B at 81-112 dph (93.9%, interval 94.5 to 100%).
  deviations:
  - The 20 syllables are not listed in the paper; the list analysed here (every syllable type with a raster
    in the paper's figures for birds 1, 2 and 4, per period) is the author's choice, as the criterion
    allows.
  - Spikes are time-warped to the mean duration before the coverage analysis, as in the paper's population
    rasters; the coverage Methods do not say (assumption).
  assumed: true
