- claim: ed2st-coverage
  outcome: partially_reproduced
  notebook: reproduce_okubo_2015.ipynb
  output: claim:ed2st-coverage
  measured:
  - 17
  - 79.3
  notes: With one common warped window per syllable, 19 syllable types of birds 1, 2 and 4 have more than 10 neurons
    bursting (paper 20); 17 are covered above 90%, the lowest is 79.3% (bird 2 alpha, 73-84 dph); 18 of 19 lie within
    their 2.5 to 97.5% surrogate interval, the exception being bird 1's C at 81-112 dph (98.9%, interval 99.5 to
    100%). With each neuron warped to its own mean duration and the patches cut or padded (the first version), all
    19 lie within their intervals (17 above 90%, lowest 79.8%); in the first version's run, with another random
    stream for the surrogates, bird 1's B at 81-112 dph fell just below its interval (93.9% against 94.5%), so the
    interval test of syllables near 100% turns on fractions of a point.
  deviations:
  - The 20 syllables are not listed in the paper; the list analysed here (every syllable type with a raster in the
    paper's figures for birds 1, 2 and 4, per period) is the author's choice, as the criterion allows.
  - Every neuron's renditions of a syllable are warped to one duration, the median of the neurons' mean durations,
    so that all neurons share one window, as in the paper's population rasters ('syllable duration from each rendition
    was linearly time-warped to the mean duration of the syllable', Methods); the coverage Methods do not say (assumption).
    The per-neuron warping of the first version is shown as a variant.
  assumed: true
