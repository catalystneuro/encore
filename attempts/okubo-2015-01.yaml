- claim: fig3g-bird1-shared-specific
  outcome: reproduced
  notebook: reproduce_okubo_2015.ipynb
  output: claim:fig3g-bird1-shared-specific
  measured:
  - 107
  - 41
  - 44
  - 22
  notes: 'Window adjusted by the double-detection rule, shift reading (b), bird 1 at 62-72 dph (126 neurons): 107
    active, 41 beta-specific, 44 gamma-specific, 22 shared, all within tolerance; shift reading (a) gives 108, 42,
    45 and 21. The rule adjusted a window in 15 neurons, each with a burst in the gap between the syllables detected
    for both; 10 changed class. Unadjusted, 107 active and 32 shared (outside); with the first version''s margin
    rule 96, 37, 39 and 20. Adding D to beta at 70-72 dph changes nothing.'
  deviations:
  - The paper adjusted the shared/specific test interval by visual inspection 'if necessary to avoid the same burst
    being detected twice (that is, being associated with an offset of one syllable and an onset of the next syllable)'
    (Methods, Shared and specific neurons); this cannot be repeated. Assumed here, as the rule closest to that passage
    (hvc.pair_table, adjust 'double'), when a type's peak falls in the 30 ms before onset or the 10 ms after offset,
    the neighbouring syllable on that side is tested too; the burst counts as detected twice when that syllable's
    peak is significant and within 25 ms of the same time (the Methods' 'similar latency' of the bout-related analysis).
    The burst is then left to the syllable whose window holds it furthest from an edge, and the other syllable's
    window leaves out 25 ms either side of it before its peak is tested again. The unadjusted result and the first
    version's broader rule (every peak outside the syllable searched again inside it, hvc.type_test adjust=True)
    are shown as the other readings.
  - The dataset's labels are Latin letters; a to e are read as alpha to epsilon and capitals as the adult syllables,
    following the Methods' labelling scheme (Syllable classification and labelling).
  - Beta is `b` before 70 dph and `B` from 70 dph, gamma `c` and `C`; the files switch to capitals at 70 dph.
  assumed: true
