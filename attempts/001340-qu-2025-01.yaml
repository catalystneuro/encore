    readings.
- claim: figs2-parameter-recovery
  outcome: partially_reproduced
  notebook: reproduce_qu_2025.ipynb
  output: claim:figs2-parameter-recovery
  notes: RL_meta recovers poorly (alpha_nu r = -0.04, psi r = 0.01 in the code reading; its stickiness
    range fitted over the mice is 0 to 0.0004, so the code's 6 SD rule drops most values). BRLfwr does
    not recover well either. stickiness r = 0.85, but beta 0.64, q 0.46 and alpha 0.32 (Methods reading
    0.60, 0.42, 0.40). No model has every r >= 0.7. The parameter ranges fitted over the 5 mice are narrow
    for several parameters, which limits these correlations.
