findings:
- kind: data_missing
  statement: BSD017 has 13 sessions (days 153 to 164 and 167); the paper states 14 full-task sessions
    for each of the 5 mice. Days 165 and 166 are not in the dandiset.
- kind: selection_undocumented
  statement: The paper analyses dopamine from 34 sessions with valid recordings, chosen by visual inspection
    and an AUC rule. The files do not mark which sessions are valid, and neither the processed dLight
    signal nor the AUC values are deposited. 46 sessions have usable photometry; 38 of them show an outcome
    response.
- kind: other
  statement: 8 of BSD011's 14 photometry sessions (days 148, 149, 152, 153, 158, 159, 160, 161) show no
    difference between rewarded and unrewarded outcome responses at the recorded event times or at any
    clock offset up to 400 s. Days 148 and 149 are sampled at 30.5 Hz per channel, the others at 20.4
    Hz.
- kind: format_error
  statement: The photometry series of BSD016 days 118 and 119 hold 30 and 40 samples, at 49 s intervals
    and timestamps near 5e7 s, not on the session clock.
- kind: metadata_error
  statement: The fiber photometry table gives the same coordinates (AP 1.2, ML 1.2, DV 4.1 mm) for sessions
    recorded in the left and in the right NAc.
- kind: metadata_error
  statement: The indicator is described as a calcium indicator (it is dLight), the dichroic mirrors as
    for a red indicator, and the filter and mirror wavelengths are -1.
- kind: metadata_error
  statement: The trial table's stop_time equals the session end (tmax) on every trial, so it does not
    mark the end of the trial.
- kind: other
  statement: BSD011 has a photometry file in all 14 sessions, alternating left and right, where the Methods
    describe a left, right, no-recording cycle, which the other mice follow.
- kind: other
  statement: Each photometry series starts with one or a few isolated samples up to 140 s before the continuous
    recording.
- kind: other
  statement: related_publications names the bioRxiv preprint (10.1101/2023.11.10.566306, v2), not the
    published paper.
- kind: paper_inconsistency
  statement: The Results list the counts of two-trial histories as RR 23607, RU 5719, UR 9428. In the
    data the history with reward then omission, the one the RR against RU test compares, has 9297 trials
    and omission then reward 5649, so the printed RU and UR counts are swapped with respect to the test;
    the odds ratios and d values match the paper.
- kind: paper_inconsistency
  statement: The Results print the reward coefficient of the four-factor OLS as -1.6345 with the interval
    [1.613, 1.656].
- kind: code_mismatch
  statement: The Methods define RLFQ3p forgetting as zeta = (alpha+ + alpha-)/2; the code (RL_Forgetting3p)
    and Table 1 use 1 - (alpha+ + alpha-)/2. On the data the code's rule gives the paper's relative AIC
    (-645.17 against -646.45) and the Methods' rule does not (-460.66).
- kind: methods_unavailable
  statement: Question for the authors. Which 34 sessions were kept for the dopamine analyses, and how
    was the AUC-ROC computed? The AUC of 470 nm samples against rescaled 415 nm samples is 0.46 to 0.51
    in every session, so no session passes 0.9 under that reading. This attempt assumed the 38 sessions
    with an outcome response.
- kind: methods_unavailable
  statement: Question for the authors. Which trials does the four-factor OLS of Fig 4B and 4C use (cleaned
    or all), and which response (DA-PT or a mean)? The laterality p is 0.23 on all trials and 0.0003 on
    cleaned trials in the 38 sessions; this attempt assumed all trials.
- kind: methods_unavailable
  statement: Question for the authors. In S4 Fig, how is the trial-back choice of L0:R coded (left or
    right, or relative to the current choice), and is the current reward included? This attempt coded
    it relative to the current choice and included the reward at t.
- kind: methods_unavailable
  statement: Question for the authors. For the RPE-only regressions of Fig 4H (log-likelihoods near -986),
    which trials, RPE terms and cross-validation aggregate were used? On the Fig 4G trials RL4p fits best
    and on all cleaned trials BRLfwr does; neither gives values near -986.
