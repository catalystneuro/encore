- claim: fig2b-model-identifiability
  outcome: reproduced
  notebook: reproduce_qu_2025.ipynb
  output: claim:fig2b-model-identifiability
  notes: All four parts hold under both readings (code, 500 sessions of 500 trials, blocks of 8 to 15
    rewards; Methods, 1000 per model, blocks of 7 to 23). Code reading. BRLfwr sessions go to BIfp 0.456
    and BRLfwr 0.404; BIfp sessions to BRLfwr 0.106, above any non-Bayesian model. RL_meta sessions go
    to RLFQ3p 0.448 and RFLR 0.306 (diagonal 0.044). Own-family probability 0.69 to 0.91 in every row.
    RL4p diagonal 0.838, and no other row gives RL4p more than 0.054.
