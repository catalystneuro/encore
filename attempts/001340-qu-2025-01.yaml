- claim: figs8-brlwrp-no-difference
  outcome: not_reproduced
  notebook: reproduce_qu_2025.ipynb
  output: claim:figs8-brlwrp-no-difference
  notes: Behaviour. AIC(BRLwrp) - AIC(BRLfwr) per mouse -82.3, -114.8, -44.2, -160.3 and 0.04, mean -80.31,
    t = -2.899, p = 0.044. With the best of 10 starts (BRLwrp of BSD015 improves by 16.16) mean -83.38,
    p = 0.045, so the difference is not a poor single start, though p stays close to 0.05. Dopamine. llk_CV(BRLwrp)
    - llk_CV(BRLfwr) per animal 60.92, 95% CI 56.64 to 65.33 (trial splits), excluding 0 under all three
    readings; session bootstrap 63.06 [52.01, 74.76]. Across the 5 animals the differences are all positive
    (9.80 to 141.72) but the t-test gives p = 0.065. The variant BRLfw against BRLfwr gives behaviour
    p = 0.187 (0.212 with 10 starts), dopamine 29.01 (CI 25.48 to 32.43; session bootstrap 20.35 to 39.72)
    and across animals p = 0.20. The dopamine part rests on the session assumption of fig4f-bayesian-rpe-fit;
    S34, S46 and the Lasso preprocessing also give session-bootstrap CIs above 0.
  deviations:
  - Sessions. The paper's 34 sessions with valid dopamine cannot be identified. The claims file's reading
    of the AUC rule (470 nm samples against rescaled 415 nm samples, above 0.9) keeps no session, as every
    AUC is 0.46 to 0.51, near 0.5 by construction (asked of a reader in questions/001340.yaml), and visual
    inspection cannot be redone. Assumed. the 38 sessions in which outcome dopamine responds to reward
    at the true event times (t above 5 for rewarded against unrewarded trials), since the 8 others show
    no response at any clock offset up to 400 s and would fail a visual inspection. The t values fall
    in two groups (|t| at most 2.89 without a response, at least 7.01 with one), so any threshold between
    them gives the same set. The main readings are also run on the 34 sessions with the largest t, on
    all 46 usable sessions and with the Lasso preprocessing (notebook section Session-set and preprocessing
    variants).
  assumed: true
