  deviations:
  - RLFQ3p forgetting rule. The claims file follows the Methods (zeta = (alpha+ + alpha-)/2) and makes
    the rule of Table 1 and the code (zeta = 1 - (alpha+ + alpha-)/2) a variant; its readings rule makes
    the outcome the one both give. They differ (reproduced with the code's rule, partially reproduced
    with the Methods'). Assumed. the code's rule, because Table 1 and the linked code use it and it gives
    the paper's value (-645.17 against -646.45), which the Methods' rule (-460.66) cannot. Asked of a
    reader in questions/001340.yaml.
