inputs:
- what: The paper's cognitive model code (cogmodels). Its LR class is run as it is; its models are re-implemented
    in qu2025.py and checked against its own likelihood; its fitting, simulation and recovery settings
    are followed.
  source: https://github.com/Wilbrecht-Lab/cogmodels at commit 589555c49bd5ec3ea77b7d0979e644ab80716ae0
- what: airPLS parameters (lambda 5e4, order 1, 50 iterations) and the Lasso variant of the photometry
    procedure the paper cites (ref 70).
  source: doi:10.3791/60278
outcomes:
- claim: data-composition
  outcome: partially_reproduced
  notebook: reproduce_qu_2025.ipynb
  output: claim:data-composition
  measured:
  - 5
  - 13.8
  notes: The dataset holds 5 male mice and 69 sessions, 14 for four mice and 13 for BSD017 (days 153 to
    164 and 167; days 165 and 166 are absent). 48 of 69 sessions (0.696) have a photometry file, close
    to two of three, but BSD011 has one in all 14 sessions with no no-recording day, and two BSD016 files
    hold 30 and 40 samples. measured gives the mice and the mean sessions per mouse (13.8).
