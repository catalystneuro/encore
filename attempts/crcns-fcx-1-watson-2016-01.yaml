- claim: fig1e-up-state-dynamics
  outcome: not_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:fig1e-up-state-dynamics
  notes: Per normalized bin over 43230 UP states, pE rate 1.823, 1.359 ... 1.310, 1.619 Hz (last not below
    the first two; R = -0.293); pI 15.88 to 11.63 Hz (R = -0.983); synchrony 0.079 to 0.071 (last below
    first two, R = -0.447); E/(E+I) 0.373 to 0.396 (R = +0.470). Sigma power peaks in bin 0 and gamma
    in bin 3, the reverse of the statement. Two of four measures decrease and the spectral order fails.
  deviations:
  - The criterion's 50 ms bins for synchrony and E/(E+I) are taken as the 10 normalized UP-state bins
    (47 ms for a median UP state).
  - Gamma and sigma power come from an 8 ms band-power series (4th order Butterworth, mean of the squared
    signal) on goodeegchannel, log10 and z-scored per session; the paper's spectrogram method is not given.
  - Uses the deposited UP/DOWN detections (_UPDOWNINtervals.mat), reading (a) of updown-durations; a new
    detection was not run, since the LFP reduction kept has no power above 100 Hz.
