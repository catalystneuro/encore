findings:
- kind: metadata_error
  statement: The files hold 51 WAKE-SLEEP cycles (WakeSleepTimePairFormat over the 27 sessions), where
    the paper reports 54. All other counts (995 pE, 126 pI, 27 sessions, 11 rats, 43230 UP and 86839 DOWN
    states, 5203 spindles) match the paper exactly.
- kind: metadata_error
  statement: The paper reports 790 microarousals; 434 MA intervals lie inside SLEEP (2130 MA intervals
    in the files, most outside SLEEP). 345 WakeInterruption intervals inside SLEEP are shorter than the
    40 s minimum the data description gives for them; counted with the MAs they give 779 events. One nonREM
    packet (14 s) is shorter than the 20 s minimum of Table S1.
- kind: metadata_error
  statement: The data description says the motion signal in _Motion.mat is z-scored; it is non-negative
    in every session, with per-session means from 0.55 to 4076, and BWRat19_032513 holds NaN values.
- kind: metadata_error
  statement: RecordingFileIntervals in _BasicMetaData.mat ends at infinity in the three sessions of rat
    JennBuzsaki22, and the UP/DOWN file is named _UPDOWNINtervals.mat, where the description says _UPDOWNInts.mat
    and _UPDOWNIntervals.mat.
- kind: paper_inconsistency
  statement: The Results give spindle incidence as 1.94 +- 0.39 per minute; Table S1 gives 0.049 +- 0.008
    Hz (2.94 per minute). The deposited spindles give 2.85 per minute, matching Table S1.
- kind: metadata_insufficient
  statement: Scored WAKE exists only as the WAKE of a WAKE-SLEEP cycle, so the WAKE that follows a SLEEP
    is in most cycles absent or hours later (23 of 51 cycles have a later scored WAKE, 6 within 1 s).
    The 5 min post-sleep WAKE windows of the paper cannot be located for most cycles.
- kind: other
  statement: Each session is one tar.gz of 0.9 to 6 GB, and the order of members differs between files
    (the LFP .eeg comes before the spike and state files in some), so reading any one small file needs
    the whole archive streamed. Reading all 27 takes about 12 minutes from the bucket.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) The sampling unit of the correlations against normalized
    time (per packet, 10 s bins, or bins of normalized time averaged over periods) and whether SLEEP is
    normalized by its clock time or by its concatenated nonREM time; the readings give different outcomes
    for the CV, spindle and UP/DOWN trends over SLEEP. (2) Whether the burst index is the proportion of
    ISIs <= 15 ms (Supplemental Experimental Procedures) or the fraction of spikes with such an ISI (Results);
    the latter gives the reported nonREM median. (3) The model and fit range of the autocorrelogram decay
    exponent. (4) How triplets are formed (adjacency of scored intervals, which WAKE counts between packets,
    giving the 24 nonREM-WAKE-nonREM triplets) and whether REM-packet-REM triplets allow interruptions.
    (5) Whether the motion signal was z-scored before the movement correlation.
