- claim: ma-statistics
  outcome: not_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:ma-statistics
  notes: 434 MA intervals lie inside SLEEP (2130 in the files). Median duration 11.0 s over all MAs (11.5
    s over session medians), per-session median incidence 0.184 per minute (mean 0.185 +- 0.112), per-session
    median 3.70% of SLEEP (mean 4.71 +- 3.18), against 790, 15.9 s, 0.32 and 9.1%. The MA fraction falls
    over normalized episodes (20 bins, bin means R = -0.956, p = 4.5e-11; 10 bins R = -0.970, p = 3.3e-06).
    Over SLEEP the bin means are not significant (p = 0.15, 0.098) while pooled period-bins are (p = 0.0057,
    0.00061). Variant, not the criterion, MA plus WakeInterruption intervals shorter than 40 s gives 779
    events, median 13.0 s, 0.318 per minute, 7.85% of SLEEP.
  measured:
  - 434
  - 11.0
  - 0.184
  - 3.7
  deviations:
  - The episode correlation uses the MA fraction in 10 or 20 normalized bins, both as bin means over episodes
    and as pooled episode-bins, as the criterion allows; episodes include MA and packet seconds.
