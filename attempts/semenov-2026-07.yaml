    Under every background and F0 reading the both-pole mean is 26.9 to 28.1% and no set with p < 0.05 has a reduction
    within 18 to 22%. At single poles the drop is at the cathodic pole for 150 V/cm (49.5 and 43.1%, p = 0.017 and
    0.026) and at the anodic pole for 230 V/cm (32.4 and 33.3%, p = 0.051 and 0.109). The only per-pole mean within
    18 to 22% is the anodic pole with F0 from images 2 to 40 and the annulus (18.7%), an average of set reductions
    of 2.3 to 30.4% that comes with a pre-exposure set at p = 0.029, so it does not meet the reproduced clause,
    and the partial clause (size outside the tolerance under every reading) is not literally met there either;
    partial is the closer description, as every both-pole set size is outside the tolerance with the session pole
    angle; the round-1
    pass of this kind (annulus, anodic, 18.0%) is gone with c4 re-traced (17.4%). The criterion's condition that
    no pre-exposure set differs fails under the adopted reading (p = 0.031) and holds without subtraction. The reduction
    is significant under every reading and larger than about 20%, the partial case the criterion names. Without
    c3 and c4 the criterion is met under the background recording, annulus and no-subtraction readings; among the
    165 choices of 8 cells it is met in 2 (background recording), and in 16 more the size is met with a pre-exposure
    set that differs, which meets neither clause; without all four protocol-breaking cells (n =
