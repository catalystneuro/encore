  notes: Measured is the larger of the two pole maxima. Annulus background (the session has no background recordings),
    maximum mean |dF| 34.9% at the cathodic pole (1200 V/cm) and 34.0% at the anodic pole (1630 V/cm); darkest-pixel
    floor 26.6 and 26.5%; without subtraction 15.0% and 16.7%; all outside 49 to 57%. Per cell, the maxima span
    18.8 to 52.4% (cathodic) and 24.1 to 49.9% (anodic); three of 8 cells reach 49.6 to 52.4% at the cathodic pole.
    The pattern part holds under every reading; |dF| falls at every step beyond the maximum, by 82% (cathodic) and
    49% (anodic) of the maximum at 3320 V/cm. Both poles' maxima are out of tolerance, so the outcome is not the
    partial case. The dataset holds 8 of the paper's 10 cells, so no choice of cells can be tested; the two missing
    cells would each need |dF| above 100% to bring the mean into range, so the outcome does not rest on the background
    reading or the choice of cells.
