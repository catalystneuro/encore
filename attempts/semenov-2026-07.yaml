- claim: fig2cd-nonelectroporating-stable
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_semenov_2026.ipynb
  output: claim:fig2cd-nonelectroporating-stable
  notes: 'Paired t-tests of each pre-exposure 150 or 230 V/cm set against the first set of its field, per pole,
    n = 11 cells (10 for the fourth 230 V/cm set). With each cell''s background recording subtracted (adopted),
    1 of 12 comparisons has p < 0.05, the third 150 V/cm set at the cathodic pole, 10.8% against 17.6% (p = 0.031).
    The annulus and darkest-pixel readings also give 1 of 12 (p = 0.045 and 0.038); without subtraction none (smallest
    p 0.055), which would reproduce the claim. F0 from images 2 to 40 gives 3 of 12 with the background recording.
    At the cathodic pole every later pre-exposure 150 V/cm set is 27 to 39% below the first, the 230 V/cm sets -11.9
    to 4.7%. Within sets, the first and last 10 PEF images differ by at most 1.15% (p 0.39 or more). The outcome
    rests on the cells: without c3 and c4, the two whose pre-exposure sets depart from the described order, no comparison
    differs under any reading (smallest p 0.067, background recording), and among the 165 choices of 8 of the 11
    cells none differs in 76 (background recording), 80 (annulus), 83 (floor) and 100 (none). With per-cell pole
    angles 2 of 12 differ. Whether the right cells were picked is open: c4, c8 and c10 have first 150 V/cm cathodic
    sets of 3.4 to 3.8%, against 5.0 to 15.3% for their later pre-exposure 150 V/cm sets, and c4 has the weakest cosine
    amplitude of the session (4.28). The result is weak, one uncorrected test of 12. The criterion is binary (not
    reproduced when any set differs); the background reading and the choice of cells are put to the paper''s authors (findings).'
  deviations:
  - Background subtraction is an assumption. Section 2.3 describes dF = 100 (F - F0)/F0 with no background step,
    section 2.4 subtracts the background fluorescence of a cell-free region for Fluo-4, and the claims file names
    both readings. The adopted reading subtracts, for 2025-05-01, the mean of the cell-free background recording
    made with each cell (the files call it a recording in the background region without cells, so the experimenters
    recorded it with every cell of that session), point by point along the trace; for 2025-05-06, which has no background
    recordings, the per-image median of a cell-free annulus 2 to 3 radii from the cell, whose level the background
    recordings of the first session match within 0.97 to 1.08 times. Cell-free background is 52 to 54% of the trace
    intensity, and 65 to 66 counts above the darkest pixels (no dark frame or camera offset is given), and the paper's
    own values at 1000 V/cm (40 and 26.6%) are on the scale of the subtracted readings and about 3 times the unsubtracted
    ones (40/13.3 = 3.0 and 26.6/8.5 = 3.1 under window (b)). The notebook shows every reading (background recording,
    annulus, darkest-pixel floor, none). Round 1 adopted the annulus for both sessions; the background recording
    was adopted in the revision after round 1, after the results under both readings had been seen, and in that
    revision the annulus reading stopped meeting fig2c-1000-within-set while the background recording met it. The
    choice is to be read as made after the results.
  - The analysed cell is the one nearest the image centre of the cell's sham recording (an assumption; the files
    do not say which of the one to eight cells found in each field was analysed, and section 2.2 centres the field
    of view between the electrodes). The notebook draws every traced membrane on its baseline image.
  - The 6-pixel-wide perimeter trace is found automatically as the outer ridge of the membrane staining in the sham
    recording's baseline image and moved by the measured drift (at most 2 pixels), where the paper draws it by hand
    in MetaMorph (section 2.3); the 360 points are spaced by 1 degree of angle, not by equal arc length. For 2025-05-01
    c4 the default rule (steepest outward fall) put the trace on internal staining (median radius 21.2 px), so that
    cell is traced with the outermost strong fall (34.1 px); the other cells keep the default rule, which the overlays
    show on the membrane (c3's trace cuts inside the cell on one side, away from the poles).
  - The cathodic pole angle is the median over the session's cells of the phase of a cosine fitted to the polarization
    profile at non-electroporating fields (83.0 degrees for 1 us, 82.1 degrees for 0.3 us, close to straight up,
    as in Fig. 1); the paper places the poles by the field direction. Per-cell phases (73.1 to 93.6 degrees) are
    shown as a variant.
  - Field strengths are the paper's labels (Fig. 2C; the Fig. 4D axis labels 357, 760, 1000, 1200, 1420, 1630, 2050,
    2473 and 3320 V/cm, read from the figure on page 6 of the PDF) matched by order to the pulse amplitudes in volts
    that the files give; the labels are not proportional to the volts.
  - 11 cells are used where the paper reports n = 8; the dataset does not say which 8. Four cells depart from the
    described order of sets (c3 and c4 before the 1000 V/cm exposure, c1 and c11 after); sets are matched by their
    rank at each field. The notebook applies the criteria without c4, without c3 and c4, without all four, and to
    every choice of 8 of the 11 cells.
  - The fifth pre-exposure 150 V/cm set exists in one cell only and is not tested.
- claim: fig2c-1000-within-set
