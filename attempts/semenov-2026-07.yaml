    as measured. Readings (a) 40.7 to 22.4% (p = 0.008) and (c) 35.4 to 23.4% (p = 0.006) have values within tolerance
    but p below 0.05. Annulus, reading (b), 33.5 to 21.5% with p = 0.035, so no window meets the criterion under
    the annulus; without subtraction (13.3 and 8.5%) and with the darkest-pixel floor (24.0 and 15.7%) the start
    is outside the tolerance. With F0 from images 2 to 40 the start under (b) is 28.5%, just outside. Among the
    165 choices of 8 of the 11 cells the criterion is met in 91 (background recording), 100 (annulus) and none without
    subtraction or with the floor. With per-cell pole angles it is met under the background recording (p = 0.080),
    not under the annulus (p = 0.028). In round 1 (annulus, c4 traced on internal staining) the match was 31.9 to
    21.0% with p = 0.051. The match rests on the background reading, and the background recording was adopted
    after the annulus reading had stopped meeting this claim, so it rests on a choice made after the results.
    If the darkest pixels are the camera offset (floor reading), the claim is not met.
