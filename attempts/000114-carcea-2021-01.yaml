inputs:
- what: Names of the behaviour labels ("Mom agressing" for shepherding, "Virgin in rest" for nest
    entry, "Mom retrieval" for dam retrieval, from behStrings in shepNestPup_xCorr_ForNature.m) and
    the parameters of the modulation index and shuffle test (calc_spike_freq_behavior_significance.m),
    including the 0.5 s gap before the baseline and the unit-removal threshold of 1,048,500 spikes.
  source: https://github.com/ic283/Carcea-et-al.-2021 at commit 2db2a753cd653f96b7742061da5d64de8606bd4f
- what: The paper's Source Data spreadsheets for Figures 2 to 4 and Extended Data Figures 7 and 8,
    read for reported numbers and test details (the one-sided Fisher test against zero, the per-unit
    and per-animal values of Figs. 2e, 2i, 2j, 3c and 4i). No values from them enter the analysis.
  source: doi:10.1038/s41586-021-03814-7 (Source Data files 41586_2021_3814_MOESM16 to MOESM18,
    MOESM22, MOESM23)
outcomes:
- claim: label-link
  outcome: reproduced
  notebook: reproduce_carcea_2021.ipynb
  output: claim:label-link
  measured: 73.3
  notes: In V116 03122018, the one file with both naming schemes, all 7 "Mom agressing" intervals
    coincide with "Shepherding" intervals and both "Mom retrieval" intervals with "Self gen
    retrieval" intervals, and all 13 "Virgin in rest" intervals lie inside "Virgin in nest"
    intervals. Pooled over files, 366 of 499 "Virgin in rest" intervals (73.3%) last 40 s or less,
    within 70.5% +/- 7.05. By mouse the fraction is 72.2% in V110 and 89.2% in V111, but 9.9% in
    V116 and 0 of 3 in V118, where the label marks dwells with medians of 1103.7 to 2492.7 s.
    Adding V85's "Virgin in nest" gives 77.3% of 639.
  deviations:
  - The names come from the paper's code, not from the dandiset; "Mom aggressing" in V85 is taken as
    the same label as "Mom agressing".
- claim: ed7a-nest-entry-fraction
  outcome: partially_reproduced
  notebook: reproduce_carcea_2021.ipynb
  output: claim:ed7a-nest-entry-fraction
  measured: 21.6
  notes: 42 of 194 units (21.6%) are activated during nest entry, outside the tolerance of both
    readings (pooled 23.9 to 29.2%, PVN only 23.6 to 28.8%); the Fisher test against zero gives
    p = 1.9e-14, and 7 units are suppressed. By mouse, V116 has 37 of 70 (52.9%), V110 1 of 31 and
    V111 4 of 93. Without the 40 s cap, as in the code, 2 of 194 (1.0%, p = 0.25). Without the 20
    units above 1,048,500 spikes, 42 of 174 (24.1%). With q = 0.01 and 0.1, 14.4% and 28.4%. The
    paper's statement separates OT-PVN (6 of 21) and PVN (33 of 126) units; the OT-PVN part cannot
    be tested. The clock shared by spikes and annotations could not be established in any session.
  deviations:
  - Units from 4 virgins and 7 sessions (194 units), against the paper's 147 units from more animals;
    which sessions the paper used is not stated.
  - OT-PVN and PVN units are pooled and the false discovery rate is applied over each session's units,
    as OT identity is not in the dandiset; the Methods apply it over OT-PVN or PVN units of a day.
  - The baseline ends 0.5 s before the episode, from the code; the Methods do not give it.
  - V111's three sessions probably hold the same clusters (spike counts correlated 0.93 to 0.97) and
    are counted as separate units, as the paper counts units per day.
- claim: ed7a-shepherding-fraction
  outcome: not_reproduced
  notebook: reproduce_carcea_2021.ipynb
  output: claim:ed7a-shepherding-fraction
  measured: 1.5
  notes: With the Methods' 10 s baseline, 3 of 194 units (1.5%) are activated during shepherding,
    Fisher p = 0.12, against 11.9% (pooled) or 9.3% (PVN only); 10 units are suppressed and 15 have no
    value. With the code's equal-duration baseline, 9 of 194 (4.6%, p = 0.0018). V116 alone, 2 of 70
    (p = 0.25). Sessions hold 1 to 22 shepherding episodes, so most units are tested on few events.
  deviations:
  - Units from 4 virgins and 7 sessions, OT-PVN and PVN pooled, as for nest entry.
  - The Methods' 10 s baseline is used; the code's equal-duration baseline is shown as a variant.
- claim: ed7a-dam-retrieval-fraction
  outcome: partially_reproduced
  notebook: reproduce_carcea_2021.ipynb
  output: claim:ed7a-dam-retrieval-fraction
  measured: 9.8
  notes: 13 of 132 units (9.8%) are activated during dam retrieval, Fisher p = 9e-05, outside the
    tolerance of both readings (pooled 15.7 to 19.1%, PVN only 13.1 to 16.0%). 9 of the 13 are from
    V111 03032018, which has one retrieval episode; over sessions with at least 2 episodes, 4 of 101
    (p = 0.061). More units are suppressed (20) than activated, and the median change is -22.4. With
    the code's baseline, 16 of 132 (12.1%). The OT-PVN part (5 of 17) cannot be tested.
  deviations:
  - Units from 2 virgins and 5 sessions with 1 to 11 retrieval episodes each; OT-PVN and PVN pooled.
  - The Methods' 10 s baseline is used; the code's equal-duration baseline is shown as a variant.
- claim: fig2j-shepherded-entry
  outcome: not_reproduced
  notebook: reproduce_carcea_2021.ipynb
  output: claim:fig2j-shepherded-entry
  notes: Over 128 units in 5 sessions, the change is higher for shepherded than voluntary entries in
    70, median difference 3.9, Wilcoxon p = 0.182. Sessions disagree; V110 03032018 (one shepherded
    entry) has 30 of 31 units higher (p = 4.66e-09) and V116 03102018 has 6 of 26 (p = 0.00669). With
    windows of 5 and 30 s, p = 0.37 and 0.166; over the 36 units activated during nest entry, median
    difference -7.3, p = 0.148; V116 alone, -6.0, p = 0.0732.
  deviations:
  - The paper does not say how a nest entry was classed as shepherded or which 18 units were used;
    the rule (entry starting from the start of a shepherding episode to 10 s after its end) and the
    unit set were fixed before the analysis.
- claim: fig1j-shepherding-rate
  outcome: partially_reproduced
  notebook: reproduce_carcea_2021.ipynb
  output: claim:fig1j-shepherding-rate
  measured: 0.65
  notes: Over 10 sessions from 5 mice the mean rate is 0.65 shepherding events per hour (s.e.m.
    0.17), above 0.2 (t = 2.59, two-sided p = 0.0292), and far below 3.5 +/- 0.9. Averaged per mouse
    first, 0.63 per hour, p = 0.193 against 0.2. Session rates run from 0 (V118 03222018) to 1.58
    (V85).
  deviations:
  - Sessions are recordings of 2.5 to 15.8 h, not the paper's days of co-housing per dyad, and the
    dandiset does not say whether each session was annotated in full.
  - The comparison of 3.5 per hour comes from Extended Data Fig. 3b (N = 4 dyads); its dyads are not
    identified.
- claim: ed8a-dam-retrieval-rate
  outcome: not_reproduced
  notebook: reproduce_carcea_2021.ipynb
  output: claim:ed8a-dam-retrieval-rate
  measured: 0.21
  notes: Dams retrieve 23 times in 108.4 h, 0.21 per hour (session mean 0.21, range 0 to 0.70),
    below 0.31 to 0.66 and close to the 0.17 per hour the paper gives for singly housed dams. Two of
    10 sessions are inside the range (V116 03082018 at 0.33, V118 03222018 at 0.40). The rate depends
    on every retrieval being annotated, which the dandiset does not state.
  deviations:
  - Rates from 5 cages over 10 sessions, against the paper's 14 dams over 4 days.
- claim: ot-pvn-units
  outcome: blocked
  blocked_by: data_missing
  notes: OT-PVN units were identified by optical tagging at the end of each day; the tagging
    recordings (laser pulse times) are not in the dandiset, the units table has no label, and the
    paper's code reads the identities from a spreadsheet ("Identified OXT neurons.xlsx") that is not
    public. The Zenodo record 5039601 holds Blackrock .nev files of the same co-housing sessions, not
    the identities. The pooled PVN part of these responses is tested in the three ed7a claims.
