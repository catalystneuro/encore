findings:
- kind: metadata_insufficient
  statement: The behaviour labels ("Mom agressing", "Virgin in rest", "Mom retrieval", "Virgin
    Agressing", "Mother in nest" and others) have no description; the table's description, "events
    and states of pups", the same in every file, fits none of them. Shepherding, nest entry and dam
    retrieval can be named only from the paper's code, and "Virgin Agressing" not at all. One file
    (V116 03122018) carries both the code's labels and the paper's names.
- kind: data_missing
  statement: The optical tagging recordings and the identity of the 21 OT-PVN units are not in the
    dandiset, so no oxytocin-specific result can be tested. The behavioural cohorts of Figures 1 to 4,
    the unit recordings during observation, and the auditory cortex photometry and units are also
    missing. Units are present for 4 of the paper's 17 recorded virgins.
- kind: other
  statement: Units in V110 and V111 have a median 7.0 to 9.2% of inter-spike intervals under 2 ms,
    and 79 to 90% of their spikes lie within 0.1 ms of a spike of another unit. The Methods say spikes
    violating a 2 to 3 ms refractory period and spikes recorded at once on 10 or more channels were
    removed. These units look like multi-unit clusters or one neuron split over several wires.
- kind: metadata_error
  statement: Session start times disagree with the dates in the session ids; V116 03082018 and
    03102018 start in May 2018, V116 03092018 on 11 March, and V118 03182018 on 23 March, after
    V118 03192018.
- kind: format_error
  statement: In V116 03102018 the raw voltage lasts 4.46 h, but spike times and annotations run to
    13.4 h; in V118 03222018 annotations run to 2.52 h against 2.27 h of voltage. The spikes and
    events of these files cannot all come from the recording they are stored with.
- kind: metadata_insufficient
  statement: The units table holds spike times and a name only, with no channel, waveform, quality
    or cell type, and every electrode location is "unknown". V111's three sessions hold 31 units each
    with spike counts correlated 0.93 to 0.97 across days, and nothing says whether they are the same
    units.
- kind: metadata_error
  statement: Every subject is described as "Virgin female co-housed with dam and pups", including the
    six photometry animals of the observation experiment. Photometry fibre location, fluorophore,
    wavelengths and gain are "unknown" or NaN; the trace is stated in watts with values near 1000;
    the commanded_voltage series, described as the LED command, varies from 0.07 to 482 within
    sessions and is not a command signal.
- kind: metadata_insufficient
  statement: Which photometry animals learned to retrieve is in the dandiset for 2 of 6 (ROV40 and
    ROV41, from their retrieval-test files), so the learner and non-learner groups of Fig. 4i cannot
    be formed.
- kind: other
  statement: No test here established that spikes and annotations share a clock; the firing change
    at annotation onsets was not larger at the stated times than at shifts of up to 2 minutes in any
    session.
- kind: code_mismatch
  statement: The Methods cut nest entry episodes at 40 s and use the 10 s before shepherding and dam
    retrieval as baseline; the paper's significance code has the cap commented out and uses an
    equal-duration baseline for every behaviour. On this data the cap changes the fraction of units
    activated during nest entry from 1.0% to 21.6%.
- kind: selection_undocumented
  statement: The dandiset holds units from 4 virgins (228 units in 8 sessions), no units for V85,
    V116 03122018 and three V118 sessions, and annotations limited to "Mother in nest" in two V118 files,
    against 17 recorded virgins and 541 units in the paper. It does not say which recordings were
    deposited or why.
