outcomes:
- claim: edf3a-ap-dredge-slow-trend
  outcome: reproduced
  assumed: true
  notebook: reproduce_windolf_2025.ipynb
  output: claim:edf3a-ap-dredge-slow-trend
  measured:
  - 0.3023
  - 0.3319
  - 0.3338
  notes: 363,735 spikes were detected over 599.5 s (606.7 per s). The mean template correlation is 0.3023
    unregistered, 0.3319 after nonrigid registration (reading a) and 0.3338 after rigid registration (reading
    b), higher in 70.8% and 67.5% of the 1 s bins. The measured values are given in that order. The rigid
    estimate ranges from -84.1 to 131.5 um (s.d. 40.8), the nonrigid from -104.2 to 122.9 um (s.d. 33.7).
    Between 1 s bins it changes by a median 7.6 um (rigid) and 3.3 um (nonrigid), 99th percentiles 51.0
    and 41.0 um. Its 60 s means run from -33.7 to 38.2 um while its s.d. within each 60 s is 21.1 to 45.4
    um, so most of what it follows is motion on the scale of seconds, over a slow trend of about 70 um.
    The criterion's measure holds under both registration readings. Whether the 1 s estimate follows true
    tissue motion or partly noise cannot be told from these outputs.
  deviations:
  - Spikes were detected and localized under reading (ii) of pipeline step 1 only (SpikeInterface bandpass
    300 to 6,000 Hz, global median reference, locally exclusive detection at 6 times the noise, monopolar
    triangulation within 75 um, as in notebook/ap_registration.ipynb of github.com/evarol/dredge at commit
    ed236113). The criterion asks for readings (i) and (ii). Reading (i), IBL preprocessing then DARTsort,
    was tried outside the notebook (DARTsort at commit 459cf656 on 4 CPU cores) and did not finish its
    subtraction step on a 31 s segment in 13.5 minutes, so the 600 s recording would take over 4 hours;
    it is not_runnable here. The outcome assumes that reading (ii) stands for step 1. It is the detection
    of the code the paper links for DREDge, and the Methods say detection and localization were chosen
    to suit each data source (Methods, Preprocessing of AP band data, paragraph 1) without naming the
    choice for this recording.
  - The claims file reads dredge_ap.register's smoothing default (None) as no smoothing and names it a
    variant. In motion_util.spike_raster at commit ed236113 None is replaced by the bin size, 1 um and
    1 s, so the default equals the Methods' smoothing; the notebook shows the displacement is identical
    (largest difference 0.0 um).
- claim: edf3b-hdbscan-clusters
  outcome: reproduced
  assumed: true
  notebook: reproduce_windolf_2025.ipynb
  output: claim:edf3b-hdbscan-clusters
  notes: All 16 combinations (registration a or b, top 10% or 25% amplitudes, features x, y and amplitude
    or y and amplitude, min_cluster_size 25 or 100) return 6 to 41 clusters other than noise; 2.4% to
    25.0% of the selected spikes are labelled noise. The clusters are broad. With the top 10% cut and
    min_cluster_size 100 the within-cluster s.d. of registered depth is 21.6 to 134.8 um, and a cluster
    of about 16,000 spikes appears in every combination, so they are groups of units, not single units.
    The legend's colored clusters look like single units; the criterion asks only for two or more clusters.
  deviations:
  - Spikes were detected and localized under reading (ii) of pipeline step 1 only (SpikeInterface bandpass
    300 to 6,000 Hz, global median reference, locally exclusive detection at 6 times the noise, monopolar
    triangulation within 75 um, as in notebook/ap_registration.ipynb of github.com/evarol/dredge at commit
    ed236113). The criterion asks for readings (i) and (ii). Reading (i), IBL preprocessing then DARTsort,
    was tried outside the notebook (DARTsort at commit 459cf656 on 4 CPU cores) and did not finish its
    subtraction step on a 31 s segment in 13.5 minutes, so the 600 s recording would take over 4 hours;
    it is not_runnable here. The outcome assumes that reading (ii) stands for step 1. It is the detection
    of the code the paper links for DREDge, and the Methods say detection and localization were chosen
    to suit each data source (Methods, Preprocessing of AP band data, paragraph 1) without naming the
    choice for this recording.
  - Features were z-scored and HDBSCAN is scikit-learn's (version in the lock file); the claims file names
    z-scoring as its standard choice. The paper gives neither.
- claim: edf3c-spline-subsecond
  outcome: reproduced
  assumed: true
  notebook: reproduce_windolf_2025.ipynb
  output: claim:edf3c-spline-subsecond
  notes: In all 32 combinations (the 16 above, each with a least-squares and a penalized cubic spline,
    knots every 0.4 s) the pooled within-cluster s.d. after spline correction is below the 5th percentile
    of 100 scrambled controls (for example 44.30 against 64.66 um, median 65.73, with nonrigid registration,
    top 10%, three features, min_cluster_size 100, penalized). The comparison is partly circular, since
    the spline is fit to the spikes it is evaluated on. The penalized spline's trace runs from -208.0
    to 350.7 um over the combinations, s.d. 31.0 to 45.3 um, with 29.4% to 50.4% of its power above 0.5
    Hz; the GCV penalty is 0.01 to 1 (16 values from 1e-3 to 1e5 tried). The least-squares spline reaches
    thousands of um (down to -14518.3) in stretches without clustered spikes (27 of the 0.4 s bins have
    none in one combination) but not at the spikes it is fit to.
  deviations:
  - Spikes were detected and localized under reading (ii) of pipeline step 1 only (SpikeInterface bandpass
    300 to 6,000 Hz, global median reference, locally exclusive detection at 6 times the noise, monopolar
    triangulation within 75 um, as in notebook/ap_registration.ipynb of github.com/evarol/dredge at commit
    ed236113). The criterion asks for readings (i) and (ii). Reading (i), IBL preprocessing then DARTsort,
    was tried outside the notebook (DARTsort at commit 459cf656 on 4 CPU cores) and did not finish its
    subtraction step on a 31 s segment in 13.5 minutes, so the 600 s recording would take over 4 hours;
    it is not_runnable here. The outcome assumes that reading (ii) stands for step 1. It is the detection
    of the code the paper links for DREDge, and the Methods say detection and localization were chosen
    to suit each data source (Methods, Preprocessing of AP band data, paragraph 1) without naming the
    choice for this recording.
  - Outliers (more than 5 s.d. from the cluster mean) were removed on depth, the coordinate the spline
    models; the Methods do not say on which coordinates.
  - The least-squares spline is solved as a minimum-norm least-squares problem (rcond 1e-8), so knot intervals
    with no clustered spikes take values from the neighbouring data in place of arbitrary ones; a numerical
    choice.
  - The penalized spline is a P-spline (cubic B-splines on the same knots, second-difference penalty)
    with the penalty chosen by generalized cross-validation over 17 values from 1e-3 to 1e5, the claims
    file's reading made concrete.
