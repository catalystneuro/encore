findings:
- kind: methods_unavailable
  statement: For the macaque recording of Extended Data Fig. 3 the paper does not say how spikes were
    detected and localized (the Methods say these steps were chosen to suit each data source), what amplitude
    cut defines high-amplitude spikes, which coordinates and what min_cluster_size entered HDBSCAN, how
    features were scaled, or whether the spline was penalized, and no code for the spline method is linked.
    Questions for the authors. Which detection and localization were used for this recording, and do the
    "registered positions" given to HDBSCAN include the lateral coordinate? With lateral position, depth
    and amplitude the spline improves the template correlation in all 16 combinations tried here; with
    depth and amplitude only, in 6 of 16.
- kind: paper_inconsistency
  statement: The Results and the Fig. 2b legend place the spline-based fast-motion method in a human recording,
    while the Methods (Tracking fast motion from spikes) and the Data availability place Extended Data
    Fig. 3 in the macaque recording of this dandiset.
- kind: metadata_error
  statement: The dandiset description says the recording is studied in "Supp. Fig. 3" of the paper; the
    published paper shows it in Extended Data Fig. 3 (the description uses the preprint's numbering).
- kind: metadata_insufficient
  statement: The probe is described as "A Neuropixel probe of unknown subtype" and every electrode's location
    is "unknown", while the session description says primary visual cortex. The channel layout (4 columns
    at x 0, 16, 32 and 48 um, 20 um rows) and the gain (2.34375 uV per bit) are those of Neuropixels 1.0.
- kind: metadata_insufficient
  statement: The file has no stimulus, trial or unit tables. The session description names static gratings
    at 8 orientations, where the paper's Methods say most stimuli in these experiments were binary or
    ternary noise at 40 Hz; nothing in the file says which was shown or when.
- kind: identifier_missing
  statement: The asset is named sub-L11104_ses-None_ecephys.nwb; the session has no identifier.
- kind: other
  statement: Only raw AP and LF voltages are deposited. No spike times, localizations or motion estimates
    behind Extended Data Fig. 3 are included, so checking the figure means re-running detection on the
    7.4 GB file (about 16 minutes on 4 CPU cores here, and over 4 hours for DARTsort on CPU).
