findings:
- kind: other
  about: data
  statement: Dataset KI is split across two dandisets. 001260 holds 74 recordings, 41 mice and 20,374 units; the
    other 25 recordings (25 mice, 9,408 units) are in 000473, whose title and metadata name a different paper (Esr1+
    hypothalamic-habenula neurons). Neither dandiset says it holds part of dataset KI.
- kind: selection_undocumented
  about: data
  statement: The two dandisets hold 29,782 units, the paper's count before its unit quality control, and no field
    marks the 24,248 units the paper kept. The paper's quality flags are only in its Zenodo metrics files.
- kind: metadata_insufficient
  statement: The units table's two-column `quality` is described only as "ISI violation, false positive rate". Column
    0 runs from 0 to 1.15e5 (median 2), so it is not the ISI violation ratio of the Methods' threshold of 0.1, and
    its definition is not given.
- kind: metadata_insufficient
  statement: The behavioral setting of a recording is not a field; it can be read only from the session description
    and keywords. The flatmap position of each unit and the paper's ww/nw labels are not in the files and come from
    the paper's Zenodo record.
- kind: metadata_error
  statement: In Detection and Context files the trials columns `lick` and `valve` are described as "sound amplitude";
    in Detection files `Block` holds the trial outcome (miss, hit, correct rejection, false alarm), not a block.
    In a Context file `sound` is False for all 524 trials though 524 tones were played. Every electrodes column
    is described as "my description".
- kind: metadata_error
  statement: For 283 of 20,374 units the location label in the files differs from the paper's Zenodo metrics files
    (207 of them in PL064_20200422-probe0), and the ww/nw label from the paper's differs for 3.0% of units when
    the Methods' thresholds are applied to the files' Peak_to_Trough.
- kind: code_mismatch
  statement: The Methods detect sleep-like troughs below 0.2 of the geometric mean for longer than 5 ms; the code
    requires off periods of more than 50 ms and at most 0.6 s, pads only groups of at least 3 off periods by 1 s,
    fills free gaps of 1.5 s or less, and uses only PFC units with at least 75 of them. Both give more sleep-like
    time here (median 9.9% per session-pooled detection, 8.7% for the code's) than the paper's 6%.
- kind: other
  about: paper
  statement: Following the Methods, sleep-like periods take a median 9.9% of each recording of 001260 (6% in the
    paper; per-probe detection gives 20.0%). The paper's own detection files on Zenodo give a median 5.3% over 73
    recordings and mark 19 recordings as not using the detection (off_used = no), a selection step the Methods do
    not describe; where the paper used it, the Methods detector marks a median 15.9% of the time here.
- kind: paper_inconsistency
  statement: The Methods require "≥4 ISIs in at least 12 separate 3-s epochs" for unit quality and compute burstiness
    and memory in epochs "with at least six spikes (corresponding to at least four ISIs)", though six spikes give
    five ISIs. The Methods also say 99 probes were lowered and 24 recordings excluded, while Data availability gives
    99 recorded sessions, the number the two dandisets hold.
- kind: methods_unavailable
  statement: Question for the authors. The paper numbers its spontaneous categories by its own Ward clusters (code,
    a memory ranking and a fixed permutation) and describes them in words; it gives no rule that carries the numbering
    to a retrained SOM. Under the code's rule and under a match to the text's descriptions the outcomes of 8 enrichment
    and hierarchy claims differ, and they are blocked. Projected on the paper's own trained SOM (Zenodo SOMs.zip),
    the units take categories that match the text, and 4 of the 8 claims hold. Should a reanalysis project units
    on the trained SOM, or which rule should it use?
- kind: methods_unavailable
  statement: Question for the authors. Which test supports "firing metric distributions were not significantly different
    across behavioral settings"? A mixed model with setting as a fixed effect finds differences here (for example
    Aversion against Passive in B, p = 0.0021).
- kind: methods_unavailable
  statement: Question for the authors. Which recordings had an inherent block structure for the stability analysis,
    and how is it stored in the files? The Block column holds block numbers in some settings and the trial outcome
    in Detection.
- kind: methods_unavailable
  statement: Question for the authors. The Methods say all sleep-like periods were reviewed visually; the paper's
    detection files (Zenodo quiet_active_detection.zip) mark 19 of 73 recordings off_used = no. What decided that
    a recording's detection was not used, and should a reanalysis repeat it from the EMG and LFP in the files?
