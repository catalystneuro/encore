inputs:
- what: Dandiset 000473, the 25 aversion recordings of dataset KI that 001260 lacks (the paper's Data availability
    names both dandisets), read for the unit and recording counts of dataset-ki-counts and fig1h-waveform-classes,
    the dataROI count of fig4b-dataroi-parcellation, and a variant of fig4e-activity-modules.
  source: doi:10.48324/dandi.000473/0.230417.1502
- what: The paper's per-unit metrics files (metrics_files.zip, for each unit's flatmap position, the paper's quality
    flags and ww/nw labels), the flatmap polygons of the PFC subregions, the paper's 42 dataROIs and the 60 GaoROIs
    (flatmaps.zip), the Harris et al. 2019 hierarchy table (hierarchy_summary_CreConf.xlsx), the Gao et al. ROI
    hierarchy index (ROI_Gao_hierarchy_index.csv), and for variants only the paper's own sleep-like detection (quiet_active_detection.zip)
    and trained SOMs (SOMs.zip).
  source: doi:10.5281/zenodo.14205018
- what: Method details read from the paper's code (stimulus series per setting, the probes the code does not check
    for sleep-like periods, SOM shape and training, Ward clustering and the cluster relabelling of relabel_clusters.py,
    Harris table columns, tessellation size rule), as cited in the helper module.
  source: https://github.com/hejDMC/pfcmap at commit 9ae52eddc47fbb590ef4e1b1949507334707a0f1
outcomes:
- claim: dataset-ki-counts
  outcome: reproduced
  notebook: reproduce_le_merre_2026.ipynb
  output: claim:dataset-ki-counts
  measured:
  - 24898
  - 52.4
  - 99
  - 13040
  notes: On 001260 + 000473 (the paper's 99 recordings), reading (b) with at least 6 spikes in at least 12 spontaneous
    epochs gives 24,898 units (24,248 ± 2,425), 52.4% in the PFC (52 ± 5.2) and 13,040 PFC units (12,674 ± 1,267).
    Every other epoch rule under reading (b) is within tolerance too (25,929, 23,168 and 22,091 units; 13,559, 12,026
    and 11,509 PFC units); with the paper's Zenodo quality flags 24,270 units remain. Reading (a) of the files'
    undescribed quality columns gives 6,561 or 16,545 units. 001260 alone holds 74 recordings and 17,205 units,
    47.3% PFC.
  deviations:
  - The counts use dandiset 000473 as well, as the criterion allows; 001260 alone holds 74 of the 99 recordings.
  - Assumption. The files carry no quality label; reading (b), all units, is the main one, as the paper's own flags
    on Zenodo pass 97% of units. The epoch rule is the Methods' unit quality control ("≥4 ISIs in at least 12 separate
    3-s epochs", not restricted to active epochs) with the Methods' "at least six spikes (corresponding to at least
    four ISIs)"; 5 spikes, and active epochs only, are variants, and all give counts within tolerance.
  - Assumption. Sleep-like periods are detected per recording session from the pooled 10-ms counts of the cortical
    units of all its probes (Methods, Detection of sleep-like periods, "detected per recording session ... across
    all cortical spikes"), and not at all in a session where the detector marks 1% of the time or more in a Poisson
    population of the same pooled rate (10 sessions of 001260, among them the four probes the code marks "ignore"),
    a rule of this attempt and not of the paper; the Methods say detection "was only performed for the dataset KI, as sessions of this dataset consistently featured a sufficient number of cortical units to detect collective off periods", which describes no skipped session, and the rule was chosen because the paper's own detection files mark 19 recordings off_used = no. The per-probe detection of round 1, the code's detector, the main detector
    without detection in the sessions the paper's files mark off_used = no, and the paper's own sleep-like periods
    (Zenodo) are variants.
  assumed: true
