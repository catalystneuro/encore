- claim: fig1s1c-prereward-dwell-matched
  outcome: partially_reproduced
  notebook: reproduce_gillespie_2024.ipynb
  output: claim:fig1s1c-prereward-dwell-matched
  assumed: true
  notes: Under the adopted plateau reading the median NF and delay pre-reward durations differ by
    -1.1% (gus), 10.2% (bernard) and 7.9% (fievel), so two of three rats are inside the criterion's
    10%; bernard and fievel differ significantly (corrected p = 0.0035 and 0.0014), as the paper's
    tests found for rats 3 and 4 (p = 0.005 and 0.002). Under the final 7 days all three rats are
    within 10% (4.8%, 8.4%, 4.1%); under the final 10 days one is (8.2%, 10.2%, 11.1%). Both trial
    types are longer than control trials (mixed models +3.84 s, p = 2.0e-06; +3.12 s, p = 0.00071).
    Rat 1 (remy) cannot be tested.
  deviations:
  - Rats 2 to 4 only, plateau readings as in fig2e-postreward-dwell.
findings:
- kind: metadata_insufficient
  about: data
  severity: major
  statement: DANDI:000115 holds, per session, the raw 30 kHz signal of 128 channels, head position,
    port events and statescript logs, with no LFP, SWR detections, sorted units or decodes, and the
    electrode table gives location None for every channel. The CA1 cell layer tetrodes on which the
    paper detects SWRs cannot be identified, so no SWR or replay analysis of the paper can be
    repeated from the files as they are, besides the size of the raw data (9.1 TB).
  notebook: reproduce_gillespie_2024.ipynb
  output: finding-no-lfp-no-ca1-labels
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: DANDI:000115 does not mark the epoch flags the paper's code selects on (forage assist,
    online SWR threshold, decode quality). All 116 run epochs give trial counts within 3% of the
    paper's center port analyses, but jaq has 27 run epochs where the paper's replay and behaviour
    analyses use 24, and the files do not say which three were left out.
  notebook: reproduce_gillespie_2024.ipynb
  output: claim:control-decode-counts
- kind: format_error
  about: data
  severity: minor
  statement: In DANDI:000115 the position timestamps of 110 of 116 run epochs include NaN values
    (1 to 4 per epoch); they are dropped here.
  notebook: reproduce_gillespie_2024.ipynb
  output: finding-position-nan-timestamps
- kind: format_error
  about: data
  severity: major
  statement: In DANDI:000629 the port DIO events of rat remy on day 7 (one epoch) and days 14 to 34,
    and of gus on days 16 and 17, hold thousands of onsets per epoch on every pump and beam channel,
    sleep epochs included (remy day 33, run epoch 2, 20743 home pump onsets in 91 min; bernard's
    run epochs have about 150). Remy's
    plateau sessions cannot be used from the DIO, which removes rat 1 from every analysis here.
    The statescript logs in the same files may hold the true events.
  notebook: reproduce_gillespie_2024.ipynb
  output: finding-nf-dio-corrupt
- kind: metadata_error
  about: data
  severity: minor
  statement: In DANDI:000629 every position series has a conversion factor of 0 (meters), so the
    pixel coordinates cannot be converted from the metadata; the scale of DANDI:000115 (0.2 cm per
    pixel) gives the same maze size. All 29 sessions of remy have session_start_time 1970-01-01.
  notebook: reproduce_gillespie_2024.ipynb
  output: finding-nf-metadata
- kind: metadata_insufficient
  about: data
  severity: major
  statement: DANDI:000629 does not mark the neurofeedback phase, the detection threshold, the
    plateau (stable) period that every manipulation analysis of the paper uses, or which center
    port is the neurofeedback port; every run task is described as pretraining. The port was
    identified here from the yoked delays, and the plateau from the paper's trial counts.
  notebook: reproduce_gillespie_2024.ipynb
  output: finding-nf-metadata
- kind: methods_unavailable
  about: paper
  statement: The plateau days of each neurofeedback rat are not stated in the text. The final
    whole days whose trial counts match the Figure 2C legend within 1% are days 26 to 30 for gus,
    19 to 28 for bernard and 18 to 29 for fievel, that is 5, 10 and 12 days, where the Methods say
    the maximum threshold was kept for 7 to 10 days. Question for the authors, which days (and
    which epochs, for the decode analyses) form each rat's plateau?
- kind: methods_unavailable
  about: paper
  statement: The trial parser and label_trial_interval.m are not in the paper's repository, and
    the text does not define when the rat leaves the center port after reward or which search
    trials count as redundant. The outcome of fig2s1h-control-dwell-increases depends on the first
    (the last beam-off before the next port visit gives 4 of 4 rats, the first exit longer than
    200 ms gives 3 of 4), and fig5a and fig5b depend in part on the second. Question for the
    authors, how is leaveRW defined, and is a redundant search a revisit of any arm searched since
    the goal changed, including the old goal?
