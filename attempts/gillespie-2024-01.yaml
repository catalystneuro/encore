- claim: fig3a-speed-below-immobility
  outcome: partially_reproduced
  notebook: reproduce_gillespie_2024.ipynb
  output: claim:fig3a-speed-below-immobility
  assumed: true
  notes: Holds in all three rats that can be tested. Every rat and trial type is below 4 cm/s (the
    largest median 3.02 cm/s, a control rat at 0.1 s smoothing; neurofeedback medians at most 2.17
    cm/s). NF trials are slower than delay trials in gus, bernard and fievel (corrected p at most
    0.0004 under every smoothing and plateau reading), and slower than control trials (mixed model
    -1.17 cm/s at 0.1 s smoothing, p below 1e-5; -0.56 cm/s at 0.5 s, p = 0.00027). Rat 1 (remy)
    cannot be tested, so the claim is shown for three of four rats.
  deviations:
  - The position series of DANDI:000629 have a conversion factor of 0 (finding 5); the 0.2 cm per
    pixel of DANDI:000115's run camera is used, on the paper's statement that the maze is the same
    as in Gillespie et al. 2021 (Methods, Behavioral training). With it, the head positions span
    105.8 to 158.7 cm in x, as against 107.6 to 119.2 cm in 000115. This is an assumption.
  - Speed smoothing is not given by the paper (done upstream of its code); Gaussian sd 0.1, 0.25
    and 0.5 s are run, with the same outcome.
  - Rats 2 to 4 only, and the plateau readings of fig2e-postreward-dwell.
- claim: fig3a-control-speed
  outcome: reproduced
  notebook: reproduce_gillespie_2024.ipynb
  output: claim:fig3a-control-speed
  assumed: true
  notes: Under every smoothing and both summaries the pre-reward mean head speed is below 4 cm/s in
    all four control rats (medians 2.27 to 3.02 cm/s at 0.1 s smoothing, 0.88 to 1.36 at 0.5 s;
    means 2.32 to 3.01 and 1.05 to 1.59). The dandiset provides no speed, so reading (i) of the
    criterion could not be run; reading (ii) was run with three smoothings. Between 0.0% and 5.1% of
    a rat's trials exceed 4 cm/s.
  deviations:
  - Head position is the mean of the two LEDs; speed is the derivative of position smoothed with a
    Gaussian of sd 0.1, 0.25 or 0.5 s (a choice the paper does not make; all give the same outcome).
  - The pre-reward windows come from the trial parser written here (assumption, see
    control-cohort-trial-counts).
