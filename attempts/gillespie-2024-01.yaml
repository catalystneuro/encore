- claim: control-cohort-trial-counts
  outcome: reproduced
  notebook: reproduce_gillespie_2024.ipynb
  output: claim:control-cohort-trial-counts
  measured:
  - 2557
  - 2663
  - 2042
  - 3081
  assumed: true
  notes: Trials with a pre-reward period over all 116 run epochs are 2557, 2663, 2042 and 3081 for
    jaq, roquefort, despereaux and montague (paper 2490, 2629, 2027 and 3021; all within 10%, the
    largest difference +2.7%). Every run epoch is the goal_delay task and none is marked forage
    assist, so readings (a) and (b) are the same set. The match supports the trial parser written
    here.
  deviations:
  - The Frank lab trial parser is not public (the claims file header says so); trials are parsed
    from the port DIO events by rules stated in the helper's docstring (a trial starts at a home
    reward; the pre-reward period runs from the first beam break at the rewarded center port to
    its pump onset; a center reward with no arm visit before the next home reward is a lockout
    after center success). This is an assumption.
  - The ripthresh, forageassist and environment flags of the code's epoch filter are not in the
    files; all run epochs are used.
- claim: control-decode-counts
  outcome: partially_reproduced
  notebook: reproduce_gillespie_2024.ipynb
  output: claim:control-decode-counts
  measured:
  - 27
  - 32
  - 24
  - 33
  - 2366
  - 2611
  - 2018
  - 2974
  - 1617
  - 1601
  - 1530
  - 2246
  assumed: true
  notes: The dandiset holds 27, 32, 24 and 33 run epochs (paper 24, 32, 23, 33); gooddecode is not
    marked, so by the criterion the epoch counts are not comparable. Figure 4E trials (with a task
    phase) are 2366, 2611, 2018 and 2974 (paper 2058, 2509, 1879, 2795) and Figure 4G trials (from
