- claim: fig2e-postreward-dwell
  outcome: partially_reproduced
  notebook: reproduce_gillespie_2024.ipynb
  output: claim:fig2e-postreward-dwell
  measured: 0.376
  assumed: true
  notes: On rats 2 to 4 (gus, bernard, fievel), post-reward dwell is shorter on NF than on delay
    trials (medians 3.88 vs 4.63, 4.61 vs 4.79 and 2.76 vs 4.87 s; corrected ranksum p at most
    0.002 under every reading), and both mixed models find control trials longer (coefficients
    -6.26 and -5.09 s, p below 1e-10). The delay over control ratio of the inset means (mean over
    rats of each rat's median) is 0.48 to 0.50, inside 0.4 to 0.6; the NF over control ratio is 0.36
    to 0.39 under every plateau and leaving reading (0.37 to 0.40 as a ratio of means), just below
    the tolerance. The measured value is the NF over control inset ratio under the adopted
    readings; the delay over control ratio is 0.477. Rat 1 (remy) cannot be tested and would enter
    both the ranksums and the inset mean.
  deviations:
  - Rats 2 to 4 only; the port events of rat 1 (remy) are corrupted from day 14 on (finding 4), and
    the mixed models are fit on three manipulation rats.
  - The plateau epochs are not marked in DANDI:000629. Adopted reading (assumption) is the final
    whole days whose NF and delay trial counts are closest to the Figure 2C legend counts (gus days
    26 to 30, 688/643 trials against 684/640; bernard 19 to 28, 1161/1205 against 1157/1201; fievel
    18 to 29, 1609/1557 against 1602/1552). The final 7 and 10 days (Methods, "maintained at the
    maximum threshold for 7-10 days") are run as other readings and give the same outcome.
  - The NF port is the R port, shown by the yoked delays (90% of W-port waits within 0.1 s of one
    of the 8 previous R-port waits, 7.9% the other way); the files do not say which port is which.
  - Leaving the port is not defined by the paper; the last beam-off before the next port visit is
    adopted (assumption, see fig2s1h-control-dwell-increases), and the first exit longer than 200 ms
    is run as a variant, with the same outcome.
- claim: fig2s1h-control-dwell-increases
  outcome: reproduced
  notebook: reproduce_gillespie_2024.ipynb
  output: claim:fig2s1h-control-dwell-increases
  assumed: true
  notes: With leaving read as the last beam-off at the port before the first beam break at any
    other port, the per-epoch mean post-reward duration correlates positively with epoch order in
    all four rats (r = 0.495, 0.319, 0.648, 0.516; p = 0.0087, 0.076, 0.0006, 0.0021). With leaving
    read as the first beam-off lasting more than 200 ms, roquefort's r is -0.129 (p = 0.48) and the
    other three are positive (0.605, 0.669, 0.511), which would be partially reproduced. The
    question is recorded for the paper's authors (finding 8).
  deviations:
  - Leaving the port (leaveRW) is set by the unpublished trial parser. Adopted reading
    (assumption) is the last beam-off before the next port visit, because the paper describes the
    post-reward period as lasting until the rat leaves the port ("from initial center port
    nosepoke to exit from the center port", Methods, Timewise SWR rate quantification), and a nose
    withdrawn and put back into the same port before any other port is visited has not left it.
    The first exit longer than the statescript's 200 ms allowance (proxTime) is the other reading.
  - All run epochs are used (the epoch flags are not in the files).
- claim: fig2s1g-no-refractory
  outcome: blocked
