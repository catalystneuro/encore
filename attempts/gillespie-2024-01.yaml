  - 32
  - 24
  - 33
  - 2366
  - 2611
  - 2018
  - 2974
  - 1617
  - 1601
  - 1530
  - 2246
  assumed: true
  notes: The dandiset holds 27, 32, 24 and 33 run epochs (paper 24, 32, 23, 33); gooddecode is not
    marked, so by the criterion the epoch counts are not comparable. Figure 4E trials (with a task
    phase) are 2366, 2611, 2018 and 2974 (paper 2058, 2509, 1879, 2795) and Figure 4G trials (from
    the second goal block of the epoch on) 1617, 1601, 1530 and 2246 (paper 1458, 1636, 1464,
    2181). Both sets are within 10% for roquefort, despereaux and montague and miss for jaq (+15.0%
    and +10.9%), the rat with three epochs more than the paper's decode set; without jaq's first
    three epochs its Figure 4E count is 2076. The dependent claims (fig5) use all run epochs.
  deviations:
  - The task phase of each trial follows the rules of label_trial_interval.m as the claims file
    header describes them, implemented here; a block's goal changes right after its last reward
    (Methods, Behavioral training), and the second goal block is counted within each epoch.
- claim: fig2s1c-control-prereward-swr-counts
  outcome: blocked
  blocked_by: too_large
  notebook: reproduce_gillespie_2024.ipynb
  output: too-large-estimate
  notes: The dandiset holds no LFP and no SWR detections, only the raw 30 kHz signal of 128
    channels (9.1 TB for the 57 files). The consensus detection of the Methods needs the ripple
    band of every CA1 cell layer tetrode over each whole epoch; one channel of each of 30 tetrodes
    over the 166.9 h of control run epochs is 1082 GB, which at the measured 2 to 3 MB/s per stream
    would take about 7 h with 16 parallel streams, and h5py reads below 2 MB/s together in one
    process whatever the number of threads (cell too-large-estimate). The electrode table gives
    location None for every channel; in the file of cell finding-no-lfp-no-ca1-labels the electrode
    groups give ca1 for 23 of 32 tetrodes, bad_ca1 for 4, an empty location for 3, can1ref for 1 and
    lost for 1, which does not say which tetrodes are in the cell layer, so the tetrode set would
    also be an assumption.
