  deviations:
  - Rats 2 to 4 only; epochs as in fig5a-search-efficiency.
- claim: fig5d-repeat-errors-balanced
  outcome: partially_reproduced
  notebook: reproduce_gillespie_2024.ipynb
  output: claim:fig5d-repeat-errors-balanced
  assumed: true
  notes: Holds in all three rats that can be tested. Under the adopted reading one rat, fievel (rat
    4), has p below 0.05 (median fraction 0.556, p = 0.015), as in the paper (rat 4, p = 0.0227);
