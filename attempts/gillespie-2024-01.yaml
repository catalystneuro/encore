- claim: fig5a-search-efficiency
  outcome: not_reproduced
  notebook: reproduce_gillespie_2024.ipynb
  output: claim:fig5a-search-efficiency
  assumed: true
  notes: On rats 2 to 4, no NF against delay ranksum is significant (corrected p at least 0.25)
    and the NF against control model is not significant, as the claim says, but the delay against
    control model does not find the improvement (adopted readings, mean search efficiency 0.732
    control, 0.719 NF, 0.745 delay; coefficient +0.012, p = 0.65; 0.60 to 0.80 over the plateau
    readings). Under reading (b) of a redundant search the delay coefficient is +0.048 to +0.050
    with p = 0.062 to 0.14; no reading gives p below 0.05. The control epochs are all run epochs and the plateau epochs are not the paper's
    gooddecode epochs (20, 20 and 26 epochs here against 14, 18 and 26), and rat 1 is missing,
    any of which may move a small effect.
  deviations:
  - Rats 2 to 4 only, plateau readings as in fig2e-postreward-dwell.
  - A redundant search trial is not defined in the text; label_trial_interval.m is not public.
    Adopted reading (a), a revisit of an arm already searched in the block; reading (b) also counts
    the arm of the trial that closed the previous block.
  - Epochs are all plateau and all control run epochs; gooddecode is not marked.
- claim: fig5s1-control-search-efficiency-increases
  outcome: reproduced
  notebook: reproduce_gillespie_2024.ipynb
  output: claim:fig5s1-control-search-efficiency-increases
  assumed: true
  notes: The per-epoch fraction of non-redundant search trials correlates positively with epoch
    order in all four rats under both readings of a redundant search (r = 0.143, 0.333, 0.266,
    0.301 under reading a; 0.156, 0.295, 0.224, 0.334 under reading b). No single correlation has
    p below 0.05 (smallest 0.058); the paper reports no statistic and calls the increase subtle.
    An epoch's first goal is the previous epoch's last goal in 8 of the 59 epochs that follow
    another run epoch of the same day; they hold 39 of the 3201 search trials. Without these 8
    epochs r stays positive in all four rats (0.116, 0.357, 0.301, 0.302 under reading a; 0.119,
    0.338, 0.248, 0.323 under reading b).
  deviations:
  - All run epochs (the criterion's variant), as gooddecode is not marked.
  - Task phases from the rules written here (see control-decode-counts and fig5a-search-efficiency).
- claim: fig5b-redundant-search-balanced
  outcome: not_reproduced
  notebook: reproduce_gillespie_2024.ipynb
  output: claim:fig5b-redundant-search-balanced
  assumed: true
  notes: Under the adopted plateau reading, gus's redundant search trials lean to NF (median
