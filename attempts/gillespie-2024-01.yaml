    2181). Both sets are within 10% for roquefort, despereaux and montague and miss for jaq (+15.0%
    and +10.9%), the rat with three epochs more than the paper's decode set; without jaq's first
    three epochs its Figure 4E count is 2076. The dependent claims (fig5) use all run epochs.
  deviations:
  - The task phase of each trial follows the rules of label_trial_interval.m as the claims file
    header describes them, implemented here; a block's goal changes right after its last reward
    (Methods, Behavioral training), and the second goal block is counted within each epoch.
- claim: fig2s1c-control-prereward-swr-counts
  outcome: blocked
  blocked_by: too_large
  notebook: reproduce_gillespie_2024.ipynb
  output: too-large-estimate
  notes: The dandiset holds no LFP and no SWR detections, only the raw 30 kHz signal of 128
    channels (9.1 TB for the 57 files). The consensus detection of the Methods needs the ripple
    band of every CA1 cell layer tetrode over each whole epoch; one channel of each of 30 tetrodes
