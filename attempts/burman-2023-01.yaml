findings:
- kind: code_mismatch
  statement: The paper's analysis code computes the evoked firing rate used for the exclusion (below 0.1
    Hz or above 200 Hz) as the sum of the spikes' latencies in ms (np.sum of spike_times) over trials
    times 10 ms, where the Methods describe an average evoked firing rate. With this rate the dataset
    gives the paper's sample exactly (662 kept, 203 excluded, median 34 per recording, 1 to 93) and its
    Figure 4D means (synchrony 0.325 and 0.393, entropy 1.347 and 1.111); with the spike-count rate it
    gives 721 kept and 144 excluded. The 200 Hz bound thus acted on spike-count rates near 45 Hz.
- kind: selection_undocumented
  statement: Version 0.230317.0039 holds 18 files with units and electrical stimulation awake and under
    isoflurane; the paper uses 17. sub-599017_ses-20220210 (943 units, SSp stimulation, 718 awake and
    720 isoflurane valid trials) is not in the paper's code list, and the paper does not say why. Six
    further files hold EEG only, with no units.
- kind: data_missing
  statement: The paper's gramicidin perforated patch recordings (Figures 1 to 3, S1 to S5), which carry
    most of its findings, are not in DANDI:000458 nor in any other dandiset found; the paper offers them
    on request. 24 of its claims cannot be tested.
- kind: code_mismatch
  statement: The Methods select regular spiking units with a waveform duration of 0.4 ms or more, the
    code more than 0.4 ms, and the Methods name the areas SSp-ll, SSp-tr and MOs where the code takes
    every unit whose location begins with the stimulated region. Neither difference changes the units
    selected in this dataset.
