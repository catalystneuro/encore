  measured:
  - 0.3188
  - 0.3862
  notes: Under A1F1 (721 units) synchrony is 0.3188 +- 0.0046 awake against 0.3862 +- 0.0067 under isoflurane,
    paired t = -12.49, p = 1.45e-32. Direction and test hold; the awake mean is just below 0.325 +- 0.005
    and the isoflurane mean is inside its tolerance. Awake is lower in 489 of 721 units and in 15 of 17
    recordings. Under the gist's rate (A1F2, A2F2, 662 units) the means are 0.3253 and 0.3928, the paper's
    (p = 3.12e-29). With the population restricted to kept units, A1F1 gives 0.3225 against 0.3876 and
    A1F2 gives 0.3686 against 0.4333, further from the paper, which supports the gist's population of
    all selected units (N6). Timed from start_time, 0.3073 against 0.3720. The gist itself, run unmodified,
    gives 0.3253 and 0.3928 for its 662 kept units. Whether the claim should be judged under the gist's
    rate is asked of a reader (questions/burman-2023.yaml).
  deviations:
