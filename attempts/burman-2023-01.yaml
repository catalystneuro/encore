- claim: fig4f-model-hyperpolarizing-less-activity
  outcome: reproduced
  notebook: network_model.ipynb
  output: claim:fig4f-model-hyperpolarizing-less-activity
  notes: Over the 16,000 excitatory neurons of 20 runs, the peri-stimulus rate is 8.785 +- 0.020 Hz with
    hyperpolarizing E_GABA against 19.468 +- 0.026 Hz with shunting E_GABA, paired t = 446.42 (p underflows
    to 0); lower in all 20 runs. No neuron is without a spike. The spike-time parts of the statement are
    judged in fig4h-model-synchrony and fig4h-model-entropy, where the direction holds.
  deviations: &id001
  - Seeds are fixed (1 to 20, one per run) where the gist sets none, so the runs are other draws of the
    paper's model; this cannot change the model, only the sample.
  - The stimulus is held as one periodic 2,500 ms set instead of the gist's 4 GB whole-run array, to fit
    in memory; a small run with both gives identical spike trains (data check).
