- claim: dataset-sessions
  outcome: reproduced
  notebook: signals.ipynb
  output: claim:dataset-sessions
  measured:
  - 312
  - 303
  - 1242
  - 9
  - 375
  notes: 312 session files on 303 dates, 2020-01-27 to 2023-06-22, a span of 1242 days. On 9 dates there are two
    files, each a CO and an RD session. Every session has 375 trials. The days after implant (349 to 1591) were
    not compared, as the criterion asks only when the dataset gives the implant date; it gives the date of birth
    (2012-05-26) and no implant date.
- claim: dataset-contents
  outcome: partially_reproduced
  notebook: signals.ipynb
  output: claim:dataset-contents
  notes: All 312 files hold 96-channel SpikingBandPower and ThresholdCrossings and the four kinematic series on
    one timestamp vector, the trials columns of Appendix B.3, and electrodes with array, bank, row and column. 81
    files have no imp column (14 in 2020, 2 in 2021, 49 in 2022, 16 in 2023). Appendix A.2 says no impedances are
    reported for a session without a measurement within three weeks, so this may be the documented behaviour, but
    the criterion asks for the column in every file. Within runs the timestamps step 0.019 to 0.021 s; 29 sessions
    have 72 pauses of 1.05 to 472.9 s. Velocity at bin t equals position at t+1 minus position at t in every bin
    except the 72 bins before a pause, a forward difference.
  deviations:
  - The criterion's velocity check, against the difference of consecutive binned positions, is shown both ways;
    the data match the forward difference, not the backward one.
- claim: figs2-throughput-improves
  outcome: reproduced
  notebook: signals.ipynb
  output: claim:figs2-throughput-improves
  notes: Daily mean throughput rises under all three readings, (a) 0.238 bits/s per year (r = 0.31, p = 5.8e-08),
    (b) 0.068 (p = 7.7e-37), (c) 0.455 (p = 2.8e-20), over 303 days. Under (a) the yearly means are 3.66, 3.96,
    4.33 and 3.85 for 2020 to 2023. 998 trials whose length is at most the 750 ms hold get no throughput under (a)
    and (c).
  deviations:
  - Throughput's formula is cited to Nason et al. 2021 and not given in the paper or its code; the three readings
    of the criterion are run and agree.
  - The first trial of each session, whose starting targets are not in the file, has no throughput.
  - The p < 0.05 threshold is the criterion's standard choice; the paper gives no test.
- claim: fig2a-sbp-decline
  outcome: reproduced
  notebook: signals.ipynb
  output: claim:fig2a-sbp-decline
  measured: -0.0338
  notes: With the stored values (microvolts by their conversion factor), the fit to 29,088 channel-day means gives
    -1.110e-03 per day, -0.0338 per month, inside -0.033 +- 0.0033. Reading (a), the stored values times 0.25, gives
    -0.0084 per month. The code's converter divides the stored SBP by 0.25 and its analysis multiplies by 0.25,
    so the code's path is reading (b).
  deviations:
  - The unit of SBP was open between two readings named in the criterion; reading (b) matches and (a) does not.
- claim: fig2a-irregular-shifts
  outcome: reproduced
  notebook: decoding.ipynb
  output: claim:fig2a-irregular-shifts
  notes: Under the criterion's rule 38 of 42 days in July to November 2022 have at least five channels shifting
    on the same day (up to 66), so the shift part holds; but the rule flags 237 of the 243 other days that have
    a 30-day baseline, so it does not single out that period (0.974 of window days and 0.975 of other days have
    five or more; median 17 shifting channels a day in the window against 20 outside; with the 30 preceding
    recording days as baseline, 0.952 against 0.903). RR's median same-day R2 in the window is 0.321 (45
    sessions), inside its 10th to 90th percentile range of 0.220 to 0.360. In decoding.ipynb the LSTM's median
    over the 3 window sessions among the every-16th is 0.652, just above its 90th percentile of 0.651 over 20
    sessions; adding the 3 window sessions among the 12 highest-RR sessions, a selection biased towards high R2,
    gives 0.659. window.ipynb trains the LSTM on 24 of the 42 other window sessions and refits the 20 every-16th
    sessions, whose 10th to 90th percentile range is the same as in decoding.ipynb (0.529 to 0.651; single
    session values are not printed side by side). The median over the 27 window sessions with an LSTM is 0.641,
    inside that range, so the LSTM part holds and with it both parts of the criterion. The pass is narrow
    (0.010 below the 90th percentile, 18 window sessions unfitted). In the window, 11 of the 27 sessions are
    above the 90th percentile and 1 below the 10th; against the 17 every-16th sessions outside the window
    (0.524 to 0.616) the median would be above the range, in the direction of better decoding, and with the
    percentiles over all 44 sessions fitted (0.541 to 0.665) it is inside. The LSTM's margin over RR is the
    same in the window as elsewhere (median 0.303 against 0.301). The outcome was partially_reproduced after
    round 2 and changed to reproduced after round 3 of the verification agreed.
  deviations:
  - The LSTM is trained on 20 of the 312 sessions (every 16th in date order, chosen before any result), for time;
    one fit takes 77 to 223 s with four at once, depending on the run (77 s in round 1, 207 to 223 s in round 2;
    decoding.ipynb prints this run's), so all 312 would take 1.7 to 4.8 hours of fitting, over the 60-minute limit
    of a notebook.
  - A day's 30-day baseline needs at least 3 earlier days; days with fewer have no shift count. This is a standard
    choice the criterion does not fix.
  - In window.ipynb the LSTM is trained on 24 of the 42 window sessions outside the every-16th, spread evenly in
    date order and chosen before any result, for time (44 fits with the 20 reference sessions, 11 rounds of four).
