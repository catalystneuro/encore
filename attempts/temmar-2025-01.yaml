findings:
- kind: metadata_error
  statement: ThresholdCrossings is stored with unit volts and conversion 1.0, but it holds integer counts of threshold
    crossings per 20 ms bin.
- kind: data_missing
  statement: The files and the dandiset metadata give the subject's date of birth but not the implant date, so the
    paper's days after implant (349 to 1591) cannot be recovered from the dataset.
- kind: format_error
  statement: In 81 of 312 files the electrodes table has no imp column at all, in place of empty values; Appendix
    A.2 says such sessions have no impedance within three weeks, but a column that comes and goes breaks code that
    reads every file the same way.
- kind: metadata_insufficient
  statement: The velocity series are described only as velocity of flexion. In the data, velocity at bin t is position
    at t+1 minus position at t (a forward difference), except at the bin before a pause, so velocity leads position
    by one bin; the direction of the difference is not stated in the files or the paper.
- kind: metadata_insufficient
  statement: 29 sessions have 72 pauses of 1.05 to 472.9 s between runs of 20 ms bins, which the paper's '(mostly)
    contiguous' allows but the files do not mark; 998 trials have a length (stop minus start) of at most the 750
    ms hold.
- kind: paper_inconsistency
  statement: The supplement gives the inactive channels' SBP slope as +0.54e-3 while Section 4.1 says all categories
    decreased; the data give -0.536e-3, the same size with the main text's sign.
- kind: paper_inconsistency
  statement: On these data the paper's statements about the two arrays cannot both hold. With the files' array labels,
    which agree with Figure S1's example (channel 47 medial, row 5, column 5), the lateral bank has the lowest SBP
    and the shallowest slope, as Appendix C.2 and Figure S4 say, but medial channels are tuned to extension of both
    fingers and lateral channels to flexion, the reverse of Section 4.2. With the labels swapped the tuning would
    match and the SBP result would not. Either the tuning description names the arrays the other way round, or its
    angles use another sign.
- kind: code_mismatch
  statement: In bci_decoding/nn_utils.py, train_model calls add_training_noise(inputs, noise_neural_std, noise_bias_std),
    whose parameters are (x, bias_neural_std, noise_neural_std), so the code adds a bias of SD 0.1 and white noise
