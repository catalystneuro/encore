- claim: supp1cd-licking-declines
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_porniece_2025.ipynb
  output: claim:supp1cd-licking-declines
  notes: The criterion's readings disagree. With the pre-tone rate subtracted, late is below early with
    p < 0.05 in both diets under both AUC windows and both tests (p 0.0001 to 0.031). With division by
    the pre-tone rate, late is above early in both diets (p 0.31 to 0.78), as the pre-tone lick rate itself
    falls late in the meal (0.04 to 0.34 licks/s late against 0.13 to 1.05 early). The criterion blocks
    the claim when the readings disagree. The question of how the AUC was normalized is put to the paper's
    authors (methods_unavailable finding). The unnormalized cue lick rate falls from early to late in
    both diets (NCD 3.49 to 3.10, HFD 4.10 to 2.73 licks/s, mouse means).
  deviations:
  - Lick-rate curves in 1-s bins over triggered trials, early and late per recording, averaged per mouse
    before normalization (a standard choice).
