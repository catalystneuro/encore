findings:
- kind: other
  statement: Four files are byte-identical copies of other files of the same subject, deposited under
    ses-None names (MPK118 2024-02-13, MPK133 2024-02-07, MPK134 2024-02-12, MPK172 2024-07-25, by identifier).
    Two other ses-None files (MPK122 2024-02-06, MPK143 2024-03-14) are unique sessions whose file names
    lack the session date.
- kind: data_missing
  statement: Cohort 2 holds 6 HFD mice (50 90-trial recordings, 47 with at least 30 triggered trials)
    where the paper has 7 (54); the missing mouse is a male, by the Supp. Fig. 2k counts. Cohort 1 has
    38 and 32 qualifying recordings against 39 and 33, cohort 2 NCD 57 against 59, and the diet-switch
    first phase 46, 49 and 30 against 47, 52 and 35 for NCD->HFD6w, HFD->NCD and HFD->HFD.
- kind: data_missing
  statement: The 405 nm control trace, the training sessions (Supp. Fig. 2q, r) and the home-cage food
    intake (Fig. 1d) are not in the dataset.
- kind: format_error
  statement: In 32 files the deposited Z-score matrix does not match the raw 465 nm trace of the same
    file at any offset (median correlation over trials below 0.5), while in the other 285 it does (median
    0.95). In 27 files the Z-score (or another series) has more trial columns than the Ensure, lick and
    running matrices (60 against 59, 90 against 89, and 90 against 60 and 46 in two files).
- kind: metadata_error
  statement: The starting_time rate of the series is 1 Hz in about half the files (188 of 349 for the
    Ensure matrix) and 50 Hz in the others; the data are at 50 Hz.
- kind: metadata_error
  statement: The sex of MPK173 is M in its cohort files and F in its diet-switch files, and that of MPK182
    F and M; the cohort-file labels reproduce the paper's female HFD count. The age is P12W/ in every
    file, for recordings that span a year. One diet-switch file of MPK191 is dated 2024-01-02, before
    the mouse's cohort recordings of October 2024.
- kind: metadata_insufficient
  statement: The notes give ensure, bw, ad lib bw and before ad lib bw without units or definitions; which
    body weight ad lib bw and before ad lib bw are (A and B of Supp. Fig. 3k) has to be guessed. The running
    signal is signed, with no description of the sign. The session descriptions name a norm_dff series
    that no file holds. There is no trial table and no tone time stamp; trial onsets in the raw trace
    have to be inferred.
- kind: other
  statement: In two MPK120 recordings (2024-01-25, 2024-01-29) the raw signal falls to near zero in 12
    trials, which makes dF/F0 undefined there.
- kind: methods_unavailable
  statement: Question for the paper's authors. How was the Z-score computed? Which recordings were concatenated
    per animal (all, or one diet phase), was it applied to F or to dF/F0, and was each trial's pre-cue
    baseline subtracted? Under the claims file's two readings (Z1, Z2) the NCD early-meal responses are
    higher than reported and the Fig. 1k LME does not find HFD early above NCD early (p 0.09 to 0.35),
    while the depositors' Z-score gives p < 0.001; the deposited Z-score is not a linear transform of
    the deposited raw trace.
- kind: methods_unavailable
  statement: Question for the paper's authors. Supp. Fig. 1d, was the post-cue lick-rate AUC normalized
    by subtracting or by dividing by the pre-tone lick rate, over which window, and with a paired or unpaired
    test (the legend and the Methods disagree)? With subtraction licking declines in both diets (p < 0.05);
    with division it does not.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which recordings enter Supp. Fig. 3l-q (at least 30 or
    at least 15 triggered trials), and what are A and B of Supp. Fig. 3k in the files' notes? The weight-gain
    correlations of Supp. Fig. 3m are within tolerance only with at least 15 triggered trials.
- kind: paper_inconsistency
  statement: Supp. Fig. 2h, the text calls the NCD correlation positive and the HFD one negative and prints
    r = -0.34 and 0.26; the data give the signs of the words (NCD 0.13 to 0.22, HFD -0.003 to -0.33),
    without significance in both.
- kind: other
  statement: The Fig. 3 legend describes recordings with at least 30 of 90 triggered trials, but the diet-switch
    recordings in the dataset include the 60-trial sessions of the cohort-1 mice in both phases; with
    them the second-phase counts match the legend for three of the four groups.
