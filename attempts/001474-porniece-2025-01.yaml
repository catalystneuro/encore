- claim: fig1k-early-late-recordings
  outcome: partially_reproduced
  notebook: reproduce_porniece_2025.ipynb
  output: claim:fig1k-early-late-recordings
  measured:
  - 0.391
  - 1.129
  - 0.72
  - 0.732
  notes: No combination of window (0-10, 1-10, 1-9 s) and Z reading puts all four means within tolerance;
    Z2 and Z2p put two in. Under Z2 at 0-10 s NCD early is 0.39 against 0.12 +- 0.11, NCD late 1.13 against
    0.86 +- 0.09, HFD early 0.72 and HFD late 0.73 against 0.72 and 0.79. NCD late is above NCD early
    and HFD early above NCD early under every combination. Z1 values are about a third of Z2 (NCD early
    0.10 to 0.13, late 0.38 to 0.43). Under Z0 NCD early is -0.17 to -0.23. Cohort 1 holds 38 NCD and
    32 HFD recordings with at least 30 triggered trials (6 and 5 mice), against 39 and 33 in the paper.
    Without the 58 modal-offset recordings at most 2 of 4 means are in tolerance and the partial condition
    holds in 12 of 12 combinations.
  deviations:
  - Z readings Z1 and Z2 (claims file) are computed from the deposited raw 465 nm trace, with trial onsets
    found from the deposited Z-score; the Methods' "a single Z-score per animal" (Methods, Analysis of
    head-fixed feeding assays) does not say which recordings are concatenated, so both readings are run,
    the SD over all the mouse's recordings (Z1, Z2) and over its recordings of one diet phase (Z1p, Z2p).
  - The depositors' Z-score (Z0) is shown as a variant and does not decide the outcome.
  - 12 trials of two MPK120 recordings in which the raw signal falls to near zero are left out of the
    raw measures (a standard choice).
  - 58 recordings (32 whose deposited Z-score does not match the raw trace, 26 without one) use the modal
    trial offset of the matched files. A check on the tone-evoked rise of the raw signal places their
    trials as in the correlation-aligned files, and every raw-measure analysis is also run without them
    (notebook, alignment check and the section before the summary).
- claim: fig1k-lme
  outcome: not_reproduced
  notebook: reproduce_porniece_2025.ipynb
  output: claim:fig1k-lme
  notes: Under every Z1, Z2, Z1p and Z2p combination the diet by meal-phase interaction is negative with
    p 8e-07 to 1.2e-05, but the HFD coefficient (HFD against NCD, early meal) is positive with p 0.09
    to 0.35, so neither condition of the criterion holds. With the depositors' Z-score (Z0, a variant)
    the HFD coefficient is 0.80 to 0.88 with p 1.3e-06 to 4.7e-06 and the interaction -0.58 to -0.64 with
    p 4e-05 to 6e-05, as the paper reports. The outcome turns on how the Z-score is computed, which the
    paper does not fix (see the methods_unavailable finding). Without the 58 modal-offset recordings the
    HFD coefficient has p 0.077 to 0.41 and the interaction p 1.6e-06 to 8e-06.
  deviations:
  - Z readings Z1 and Z2 (claims file) are computed from the deposited raw 465 nm trace, with trial onsets
    found from the deposited Z-score; the Methods' "a single Z-score per animal" (Methods, Analysis of
    head-fixed feeding assays) does not say which recordings are concatenated, so both readings are run,
    the SD over all the mouse's recordings (Z1, Z2) and over its recordings of one diet phase (Z1p, Z2p).
  - The depositors' Z-score (Z0) is shown as a variant and does not decide the outcome.
  - The model is fit with statsmodels mixedlm, REML, two rows per recording, as the criterion says.
  - 58 recordings (32 whose deposited Z-score does not match the raw trace, 26 without one) use the modal
    trial offset of the matched files. A check on the tone-evoked rise of the raw signal places their
    trials as in the correlation-aligned files, and every raw-measure analysis is also run without them
    (notebook, alignment check and the section before the summary).
