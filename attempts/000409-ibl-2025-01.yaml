findings:
- kind: metadata_error
  statement: In 64 sessions, all with the protocol name _iblrig_tasks_ephysChoiceWorld without a version
    (hausserlab 48, churchlandlab_ucla 13, mainenlab 2, cortexlab 1, recorded 2022-01-31 to 2023-10-19),
    probability_left alternates between 0.2 and 0.8 on every trial after the first 90, so block_index
    and block_type change on every trial. In these sessions the stimulus falls on the stated block's likely
    side in 47.5% to 57% of biased trials, against 75.9% to 82.8% in the other 395 sessions, so the column
    does not describe the blocks the mice experienced. Analyses of the block prior cannot use these sessions.
- kind: data_missing
  statement: No session holds the receptive-field mapping phase or its stimulus sequence; passive phases
    list only spontaneous activity and task replay, and the stimulus groups are empty. The paper ran the
    mapping in 504 of 699 insertions (Supplementary Fig. 5).
- kind: paper_inconsistency
  statement: The Methods give a noise cutoff below 20 uV for a well-isolated unit, but the quality score
    in the files, and the paper's count of 75,708 well-isolated units, follow a noise cutoff below 5 for
    every unit (20 would give 95,430). The files describe the noise cutoff in standard deviations, not
    uV.
- kind: metadata_error
  statement: wheel_movement_onset_time is described as the first wheel movement after the go cue, but
    in 11.97% of trials it precedes the go cue (11.93% precede the stimulus onset).
- kind: other
  statement: reward_volume_uL is 1.5 on every one of the 242,628 rewarded trials, while the Methods state
    a 3 uL reward.
- kind: metadata_error
  statement: The units table's description refers to a 'label' column that the files do not have (the
    column is ibl_quality_score) and describes all units as from Neuropixels 1.0 probes, though four insertions
    used NP2010 probes.
- kind: metadata_insufficient
  statement: Subject weight is one value per mouse, identical in all its sessions, and is not described
    as a reference weight; the Methods give weights on the day of recording.
- kind: code_mismatch
  statement: The Methods give age and weight on the day of recording (13 to 178 weeks), but meta/mice_info.py
    and print_age_weight in the paper's code take age_weeks and reference_weight from the IBL database.
    From the files the ages at recording are 13.1 to 65.9 weeks. print_age_weight also prints the median
    weight under the label mean and the mean under the label median.
- kind: paper_inconsistency
  statement: The Results give 81.4 +/- 0.4% correct as mean +/- s.d.; across mice the s.d. here is 5.12
    and the s.e.m. 0.43, so the 0.4 is an s.e.m.
- kind: other
  statement: The single-cell test's false-positive rate, which the paper sets to 0.001 x 0.05 = 5e-5 in
    its binomial test of regional fractions, is about 2.5e-3 to 2.7e-3 when the test is run with null
    sessions here, and 5.7e-4 to 7.7e-4 with the labels shuffled over the tested trials, where the product
    of the two tests' single rates is 3.3e-5 to 4.7e-5. The two tests are not independent, so the stated
    rate understates false positives.
- kind: code_mismatch
  statement: region_info.csv marks 210 regions as canonical; the paper's canonical set, and the code's
    inclusion table, have 201 (the 9 others have fewer than 20 neurons).
- kind: paper_inconsistency
  statement: The Results give visual trajectory latencies of 34, 42, 42, 57 and 78 ms for LGd, VISp, LP,
    VISpm and VISam; the paper's own results table (meta/Results/stim.pkl) gives 34.0, 44.7, 46.8, 59.6
    and 66.0 ms.
- kind: code_mismatch
  statement: For the stimulus trajectories the Methods permute stimulus sides among trials of the same
    block and choice and call a region significant at P < 0.01 with Benjamini-Hochberg at q = 0.01, while
    state_space_bwm.py merges the unbiased block with the 0.2 blocks and applies Benjamini-Yekutieli at
    0.05. Here neither choice brings the count of significant regions near the paper's 104 (46 to 53).
- kind: other
  statement: The files hold IBL spike sorting revision 2025-05-06, while the paper's code loads revision
    2024-05-06; the unit and inclusion counts are identical.
