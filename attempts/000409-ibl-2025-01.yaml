- claim: dec-stim-restricted
  outcome: reproduced
  notebook: reproduce_ibl_2025.ipynb
  output: claim:dec-stim-restricted
  notes: 4 of 10 tested regions are significant for stimulus (CL, GRN, IRN, VISp), against 5 for choice
    and 7 for feedback. VISp is significant (35 sessions, Fisher p = 1.3e-08, effect 0.039, paper table
    0.02). Significance agrees with region_info.csv in 10 of 10 regions and the effects correlate with
    the paper's (Spearman 0.91, p = 0.00025). With BH at q = 0.05 the counts are 4, 7 and 9. The paper
    reports 40 of 201 regions for stimulus.
  deviations:
  - The tested regions are VISp, GRN, IRN and seven drawn at random (ACAv, CL, HATA, LDT, PA, PVT, TR),
    each with all its canonical sessions, not all 201 regions; the Benjamini-Hochberg correction runs
    over these 10 regions.
  - One run of nested cross-validation (paper 10) and 100 null sessions (paper 200); each null reuses
    the C chosen for the real labels in each outer fold. On three example sessions the full nested null
    is wider (95th percentiles 0.555 to 0.622 against 0.531 to 0.598), so per-session p-values here can
    be smaller than the paper's procedure would give.
  - The trial mask follows the Methods and the code's truncation, without the saturation intervals of
    the IBL aggregate trials table, which are not in the dandiset.
