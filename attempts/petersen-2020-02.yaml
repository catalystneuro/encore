  - 39
  notes: 51 sessions, mean 142.4 trials (within 135 to 165), range 37 to 204; MS10-170307 has 37 trials, outside 72 to 220.
    Median pre trials 39 (36 to 44); median cooling and post trials 45 and 46 (lab labels), 49 and 50 (12 min), 41 and 58
    (10 min), all inside 18 to 66 and 18 to 88. The criterion's partial rule (mean holds, one part fails) applies.
  deviations:
  - The paper reports 53 sessions; the dandiset holds 51.
  - States are the dataset's trial labels (Pre, Cooling, Post), with the claims file's 12 and 10 min readings as variants;
    cooling onset is the time stamp of the dataset's cooling table.
- claim: cooling-time-course
  outcome: partially_reproduced
  notebook: reproduce_petersen_2020.ipynb
  output: claim:cooling-time-course
  measured:
  - 109.7
  - 32
  notes: Over 31 measured sessions the median time from onset to the minimum (within 5 min) is 109.7 s, outside 40.5 to 66
    s (by rat 38 to 124 s). Duration reading (a), time until the temperature is again within 1 C of the pre median, has a
    median of 11.7 min (within 9 to 13.2); reading (b), the lab's cooling interval, 8.1 min. The median number of trials in
    the lab's first cooling interval is 32, inside the Results' 18 to 66 but not 45 to 55; 47.5 trials fall within duration
    (a). Two of the three parts hold. Without the two flat 2018-07-19 sessions the medians are 109.7 s and 11.8 min.
  deviations:
  - Temperature analyses use the 31 sessions with a measured MS temperature; the other 20 hold the lab's modelled curve, described
    in the files as not a measurement. Values outside 5 to 45 C are set to NaN (standard choice); no remaining sample within
    the trials is below 15 C, so the rail values near 5 and 10 C do not enter any trial value.
  - The minimum is searched within 5 min of the dataset's onset time stamp, as the criterion says; 13 sessions have a second
    cooling epoch and only the first is used.
