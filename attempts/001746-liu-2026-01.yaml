    between 0.0055 and 0.082 over 39. Against each group (reading b) neither group differs from
    all others. The direction is higher input resistance for both.
  deviations:
  - Assumption on the FDR family, as in fig2d-l23it-small-tau. The 39-feature bounds do not decide
    for IT RORB; under the 20-feature family it is not significant, so one of the two groups holds.
  - Input resistance as the Methods define it ("the slope of the differences between the RMP and the
    steady-state membrane potentials, relative to the injected stepped currents", steady state the
    last 100 ms), over the sweeps below the rheobase sweep without APs, which the Methods do not
    list; the code's sweeps and window are a variant.
