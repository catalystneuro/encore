findings:
- kind: metadata_insufficient
  statement: The files carry no cell type, VEN subtype or transcriptomic type, although the
    dandiset's description says the recordings are annotated with transcriptomic cell types. These
    labels exist only in the paper's code repository (metaInfo_ephysio_patchSeq.csv), matched by
    file name.
- kind: metadata_error
  statement: Five pairs of files hold identical voltage data in every sweep under different cell
    IDs, four of them under different subjects (s640 and n5, B722 and B726, s653 and n29, s485 and
    s676, B289 and n175). In the pair B289 and n175 the cell table gives the two cells different
    transcriptomic clusters (16 and 8). The dandiset holds 457 distinct recordings in 462 files.
- kind: code_mismatch
  statement: The cell table metaInfo_ephysio_patchSeq.csv names the file of cell n172 (subject
    Mfa220428) on two rows, the second with subject Mfa180730, and names no row for the file of cell
    s172 (subject Mfa180730), which is in the dandiset.
- kind: data_missing
  statement: The dandiset holds 10 subjects, where the paper says the Patch-seq experiments used 12
    animals, and it holds only the Patch-seq cells. The additional whole-cell recordings without RNA
    (281 VENs and 306 L5 PCs of Fig. 4a-c, 85 VEN-L and 41 VEN-S of Extended Data Fig. 9c,d and
    Supplementary Table 8) are not in it, and the paper does not say where they are.
- kind: metadata_error
  statement: Every file has the same session start time (2018-01-01 01:00 +08:00), a placeholder.
    Two session IDs carry the date of another subject (sess_180920d2 under Mfa181204, sess_220419d1HS
    under Mfa220428).
- kind: metadata_error
  statement: The stimulus series are stated in amperes but hold pA (values -200 to 1,480 in steps of
    20), and their starting time is NaN. Four files whose device is AXON recording system are sampled
    at 25 kHz like the HEKA files, and one HEKA file at 50 kHz.
- kind: identifier_missing
  statement: The 62 AIS distances and peak indices of Fig. 4i (NeuronPeakIdx_summary.mat in the
    paper's code) carry no cell IDs, and their values match none of the per-cell tables that have
    IDs, so they cannot be linked to the recordings.
- kind: code_mismatch
  statement: The paper's feature table holds the first-sweep tau of createFeatures.m, where the
    Methods average tau over all hyperpolarizing sweeps; the Methods' tau computed from the files is
    26% longer (median ratio). The Fig. 2 groups formed by the code from its tables hold 30, 22, 122,
    29, 17 and 13 cells where the legend gives 30, 17, 119, 22, 16 and 13.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which measure does "a deeper sag in L5 ET neurons"
    use? The Methods define sag value (RMP minus steady state at the largest hyperpolarizing step),
    sag ratio, sag time and sag area, and the feature table holds Sag_Ratio. On the deposited
    recordings L5 ET has the largest sag ratio and the smallest sag value of the six groups, so the
    claim holds under one and fails under the other.
- kind: methods_unavailable
  statement: Question for the paper's authors. How are 19 of the 39 features of Ins_patchseq_ephs.xlsx
    computed (for example ISI_phaseT_ratio, firstSpikePhaseArea, FR_slope, amp_FanoFactor,
    AHP_latency)? They are defined neither in the Methods nor in PatchAnaLab 1.0, and they enter the
    Benjamini-Hochberg family of every comparison of Supplementary Table 2, so the FDR values cannot
    be recomputed from the data.
- kind: methods_unavailable
  statement: Question for the paper's authors. The phase peak indices were read by clicking two
    points on the overlaid phase plots of the maximal-rate sweep (calPhaseHeightIdx.m). Which APs
    were read, and how was the AIS peak placed when there was no separate maximum? An automatic
    reading (first AP, or median over APs) gives different outcomes for Fig. 3e and agrees with the
    hand-read values only loosely (Spearman 0.55).
