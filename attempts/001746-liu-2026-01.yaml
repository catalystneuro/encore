- claim: supp11-l5et-deep-sag
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_liu_2026.ipynb
  output: claim:supp11-l5et-deep-sag
  notes: The criterion blocks the claim when the two measure readings disagree, and they do. By sag ratio
    L5 ET neurons have the deepest sag (median 1.36 against 1.13 for the other five pooled, p = 3e-6,
    FDR 0.0001 over 39 features, as against L2/3 IT HPCAL1, L5 IT FEZF2 and VEN). By sag value (RMP minus
    the steady state at the largest hyperpolarizing step, as the Methods define it) L5 ET has the smallest
    value of the six groups (19.6 against 27.7 mV, p = 0.0055), which follows its low input resistance.
    On the files whose largest step is -200 pA only, the same holds (sag ratio p = 5e-7, sag value 20.6
    against 29.2 mV, p = 0.011). Open for the paper's authors, which measure "deeper sag" refers to (Results,
    paragraph 3; the Methods define sag value, sag ratio, sag time and sag area; the code's feature table
    holds only Sag_Ratio). Sag ratio would give reproduced, sag value not reproduced. The question is
    recorded under findings.
  deviations:
  - Sag is measured at each file's largest hyperpolarizing step (the Methods' "largest hyperpolarizing
    step"), -200 pA in most files and -60 to -120 pA in 28 of the 237 grouped cells; the files at -200
    pA only are a variant.
