- claim: supp11-rm-itrorb-l6pc
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_liu_2026.ipynb
  output: claim:supp11-rm-itrorb-l6pc
  notes: L6 PC neurons have a higher input resistance than the other five pooled (median 354
    against 166 MOhm, p = 0.00014, FDR 0.003 over 20 features, at most 0.006 over 39; the same with
