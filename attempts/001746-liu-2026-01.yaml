- claim: fig2d-l23it-small-tau
  outcome: reproduced
  assumed: true
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig2d-l23it-small-tau
  notes: L2/3 IT HPCAL1 has the lowest median tau of the six groups with the Methods' tau (32.7 ms,
    next IT RORB 41.0 ms) and with the code's first-sweep tau (24.2 ms). Against the other five
    pooled (reading a), p = 0.011, FDR 0.023 over the 20 Methods features; over the 39-feature
    family the FDR lies between 0.011 and 0.051. With the code's tau, p = 0.0003 and the FDR is at
    most 0.0052 over any 39-feature family. Reading (b) fails for the Methods' tau (VEN p = 0.057,
    L5 ET 0.46, L6 PC 0.099). In 4 of the 6 subjects with L2/3 IT HPCAL1 cells their median tau is
    lower than that of the other groups.
  deviations:
  - Assumption. The claims file sets the FDR family to the 39 features of Ins_patchseq_ephs.xlsx,
    but 19 of them (phase areas and perimeters, ISI phase ratios, FR, first-ISI and adaptation
    slopes, amplitude CV and Fano factor, AHP latency and others) are defined neither in the
    Methods nor in PatchAnaLab, so they cannot be computed from the data. The FDR over 39 features
    is bounded for the 20 features that can be computed; where the bounds do not decide, the
    family of the 20 features the Methods name (the claims file's variant) decides. Here the
    bounds (0.011 to 0.051) do not decide, and the outcome rests on the 20-feature family.
  - Tau follows the Methods (exponential fit from step onset to the trough, averaged over all
    hyperpolarizing sweeps; "the τ values across all hyperpolarization traces were averaged"), with
    the fit segment of createFeatures.m (the first third of the step, 5-sample smoothing). The
    Methods' tau is 26% longer than the feature table's (median ratio 1.26), which holds the code's
    first-sweep tau.
- claim: fig2f-l23it-narrow-ap
  outcome: partially_reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig2f-l23it-narrow-ap
