- claim: fig4i-peak-index-ais-distance-real
  outcome: not_reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig4i-peak-index-ais-distance-real
  notes: 'The 62 AIS distances of the paper''s code (NeuronPeakIdx_summary.mat) carry no cell IDs, and
    none of their peak indices or nonzero distances is in a per-cell table, so the criterion''s reading
    is used: the Patch-seq cells with a reconstructed axon origin, those with an AIS distance (axonDist)
