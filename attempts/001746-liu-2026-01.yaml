- claim: patchseq-cell-table-link
  outcome: partially_reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:patchseq-cell-table-link
  measured: [462, 461, 0.895, 0.902, 0.989]
  notes: All 462 rows of the cell table name a file of the dandiset (100%), and every row's cell ID
    is its file's cell ID. One dandiset file (cell s172, subject Mfa180730) is named by no row; the
    row of subject Mfa180730 instead names cell n172 and the file of n172 (subject Mfa220428),
    which its own row also names, so 461 of 462 rows agree on the subject. The files carry no cell
    type or transcriptomic type to compare. For the 276 cells of Ins_patchseq_ephs.xlsx, computed AP
    half-width is within 10% of the table for 89.5% of cells, AP amplitude for 90.2% and maximal
    firing rate for 98.9% (criterion 80%); rheobase (98.9%), latency (98.9%), threshold (90.4%)
    and the code's first-sweep tau (98.5%) agree as well. The six Fig. 2 groups formed by the
    code's lists hold 30, 21, 125, 29, 18 and 14 files (the xlsx labels give 30, 22, 122, 29, 17
    and 13) against the legend's 30, 17, 119, 22, 16 and 13; two cells change group between the
    xlsx and the cell table. measured gives rows found, rows whose subject agrees, and the three
    fractions.
  deviations:
  - The criterion fails the link when a label disagrees. One row's subject disagrees, and that row
    is a second row for a file that has its own row, with no type or cluster, used by no analysis;
    the outcome is set to partially reproduced, the link holding for 461 of 462 rows. Under the
    letter of the criterion it would be not reproduced.
  - AP features are computed on traces low-pass filtered at 1 kHz with the spike detection of
    PatchAnaLab (createFeatures.m, anaAP.m), as the Methods give no filter or detection rule; the
    threshold window is the Methods' 20 ms before the peak ("the 20-ms potential trace preceding
    the AP peak was used to calculate the third derivative", Extraction of electrophysiological
    features). The code's window (from halfway between onset and peak) is shown and agrees.
