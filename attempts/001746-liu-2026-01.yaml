- claim: fig3e-phase-peak-index
  outcome: partially_reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig3e-phase-peak-index
  notes: The AP readings and the corrections agree. On the first AP of the maximal-rate sweep, the VEN
    median index is the lowest (0.037; next L2/3 IT HPCAL1 0.083), Kruskal-Wallis p = 0.0016, and Dunn's
    test separates VENs from L5 ET (Bonferroni p = 0.003, Sidak 0.003) and from no other group (L6 PC
    0.062, IT RORB 0.29). On the median over the sweep's APs, the VEN median is again the lowest (0.081;
    next L5 IT FEZF2 0.111), Kruskal-Wallis p = 0.0015, and Dunn's test separates VENs from L5 ET only
    (p = 0.009 under both). The median is lowest and some groups are separated, under both readings and
    both corrections. Leaving out the APs whose AIS phase is not resolved (at most 3% of a group's APs)
    keeps the VEN medians lowest and separates VENs from IT RORB, L5 ET and L6 PC on the first AP. With
    the prominence guard at 0.02 or 0.10 of the maximal dV/dt (variants) the VEN median is the lowest
    in three of the four readings (not for the median index at 0.02), and Dunn's test separates VENs from
    none to two groups (L5 ET, IT RORB). The code's hand-read values (PeakIdx_Fig5e.xlsx, 233 cells) give
    the paper's result, VEN median 0.117 the lowest and Dunn p of 0.001 or less against every PC group
    under both corrections; the automatic index agrees with them only loosely (Spearman 0.39 first AP,
    0.20 median). The index depends on the sampling rate (40 Axon files brought to 25 kHz, median 0.088
    to 0.168), 17 of the 29 VENs are Axon files, and within one device VENs are not significantly lower
    than the other groups pooled (Axon p = 0.08, HEKA p = 0.10).
  deviations:
  - The paper read the AIS and SD peaks by hand (calPhaseHeightIdx.m asks for two clicks on the overlaid
    phase plots), so the criterion's automatic reading is used, and its outcome differs from the one the
    code's per-cell values give (partially reproduced against reproduced), which the criterion reports
    as a deviation. Details it does not fix are standard choices made against noise, stated in the helper;
    the rising phase starts where dV/dt first exceeds 10% of its maximum, local maxima need a prominence
    of 5% of the maximum, and with one maximum the AIS value is taken at the lowest local minimum of d2V/dt2
    before it (the shoulder of the rise). With neither a second maximum nor a shoulder, the AIS value
    is the lowest dV/dt of the rising phase (Methods, "If there was no clear phase peak, the point with
    the lowest derivative value was defined as the phase peak"), which makes such an AP the least saddle-like;
    the criterion leaves this case open, and leaving such APs out does not change the outcome.
  - AP threshold, the maximal third derivative in the 20 ms before the peak (Methods, "the 20-ms potential
    trace preceding the AP peak was used to calculate the third derivative"), with the derivative chain
    of PatchAnaLab computed on the window padded by 2 ms and searched up to the point of maximal dV/dt,
    so that the filters' edge transients at the peak are not taken for the threshold. Without this, 28
    of the 208 HEKA files had their threshold placed at the peak. The threshold starts the rising phase
    of the phase index.
  - The Dunn correction in the code's own statistics sheet of PeakIdx_Fig5e.xlsx is Bonferroni; both of
    the criterion's corrections are run.
