- claim: supp11-l5et-deep-sag
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_liu_2026.ipynb
  output: claim:supp11-l5et-deep-sag
  notes: The criterion blocks the claim when the two measure readings disagree, and they do. By sag
    ratio L5 ET neurons have the deepest sag (median 1.36 against 1.13 for the other five pooled, p =
    3e-6, FDR below 0.05 under any 39-feature family, as against L2/3 IT HPCAL1, L5 IT FEZF2 and
    VEN). By sag value (RMP minus the steady state at the largest hyperpolarizing step,
    as the Methods define it) L5 ET has the smallest value of the six groups (19.6 against 27.7 mV,
    p = 0.0055), which follows its low input resistance. Open for the paper's authors, which
    measure "deeper sag" refers to (Results, paragraph 3; the Methods define sag value, sag ratio,
    sag time and sag area; the code's feature table holds only Sag_Ratio). Sag ratio would give
    reproduced, sag value not reproduced. The question is recorded under findings.
- claim: ven-firing-rate-variability
  outcome: not_reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:ven-firing-rate-variability
  notes: VENs have the lowest median maximal firing rate (10.0 Hz, against 13.3 Hz for the five PC
    groups pooled), but not significantly (p = 0.092, FDR 0.43 over 20 features), nor against the
    layer 5 PCs pooled (11.7 Hz, p = 0.38); against each PC group it is significant only for L2/3
    IT HPCAL1 and L5 ET (FDR 0.029 and 0.028). The ISI CV (0.33 against 0.31, p = 0.56) and Fano
    factor (9.6 against 7.5, p = 0.17) are higher in VENs without significance under any comparison
    reading. The two variability measures agree, so the claim is not blocked.
  deviations:
  - The ISI Fano factor is taken as the variance over the mean of the ISIs (ms) of the maximal-rate
    sweep. PatchAnaLab does not compute it; the code table's values fit this definition (Fano equal
    to CV squared times the mean ISI) and the computed values are within 10% of them for 86.6% of
    cells. ISI CV and Fano are not among the 20 Methods features, so their variant FDR is over those
    20 and the two ISI measures.
- claim: l5et-vs-l5it-sag-rm-rate
  outcome: reproduced
  assumed: true
  notebook: reproduce_liu_2026.ipynb
  output: claim:l5et-vs-l5it-sag-rm-rate
  notes: Against L5 IT FEZF2, L5 ET neurons have a larger sag ratio (1.36 against 1.13, p = 1.6e-6,
    significant under any 39-feature family), a lower input resistance (116 against 160 MOhm, p =
    0.014, FDR 0.026 over 20 features and between 0.014 and 0.054 over 39; the code's measure 117
    against 174 MOhm, FDR at most 0.030 over 39) and a higher maximal firing rate (15.8 against 11.7
    Hz, p = 0.0063, FDR at most 0.033 over 39). By sag value L5 ET is lower (19.6 against 27.1 mV, p
    = 0.015), the reverse of deeper; under that reading two of three hold (partially reproduced).
  deviations:
  - Assumption on the sag measure. The criterion takes the sag readings of supp11-l5et-deep-sag
    (sag ratio and sag value) but gives no rule for their disagreement. Sag ratio is adopted, as
    the measure of sag depth in the paper's own feature table (Sag_Ratio, the only sag measure
    there) and the usual measure of sag; sag value, as the Methods define it, is the steady-state
    deflection. The same question for the authors as in supp11-l5et-deep-sag.
  - Assumption on the FDR family for the Methods' input resistance, as in fig2d-l23it-small-tau.
- claim: fig3e-phase-peak-index
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig3e-phase-peak-index
  notes: The criterion blocks the claim when the AP readings disagree, and they do. On the first AP
    of the maximal-rate sweep, the VEN median index is the lowest (0.011; next L2/3 IT HPCAL1
    0.021), Kruskal-Wallis p = 0.0007, and Dunn's test separates VENs from IT RORB and L6 PC under
    Bonferroni (p = 0.020 and 0.023) and Sidak, but not from L2/3 IT HPCAL1, L5 IT FEZF2 (p = 0.072)
    or L5 ET; partially reproduced. On the median over the sweep's APs, the VEN median (0.026) is
    not the lowest (L2/3 IT HPCAL1 and IT RORB 0.0) and Dunn's test separates no group; not
    reproduced. The two corrections agree under each reading. The code's hand-read values
    (PeakIdx_Fig5e.xlsx, 233 cells) give the paper's result, VEN median 0.117 the lowest and Dunn p
    of 0.001 or less against every PC group under both corrections. The automatic first-AP reading
    agrees with the hand-read values only loosely (Spearman 0.55, median absolute difference 0.13;
    the median reading 0.09), so the difference rests on how the peaks are read. With the
    prominence guard at 0.02 or 0.10 of the maximal dV/dt the first-AP reading separates no group
    under either correction.
  deviations:
  - The paper read the AIS and SD peaks by hand (calPhaseHeightIdx.m asks for two clicks on the
    overlaid phase plots), so the criterion's automatic reading is used. Details it does not fix are
    standard choices made against noise, stated in the helper; the rising phase starts where dV/dt
    first exceeds 10% of its maximum, local maxima need a prominence of 5% of the maximum, and with
    one maximum the AIS value is taken at the lowest local minimum of d2V/dt2 before it (the shoulder
    of the rise), or the index is 0 when there is none.
  - The Dunn correction in the code's own statistics sheet of PeakIdx_Fig5e.xlsx is Bonferroni; both
    of the criterion's corrections are run.
