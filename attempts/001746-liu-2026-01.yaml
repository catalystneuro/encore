- claim: fig2d-l23it-small-tau
  outcome: reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig2d-l23it-small-tau
  notes: L2/3 IT HPCAL1 has the lowest median tau of the six groups with the Methods' tau (32.7 ms, next
    IT RORB 41.0 ms) and with the code's first-sweep tau (24.2 ms). Against the other five pooled (reading
    a), p = 0.011, FDR 0.034 over the 39-feature family and 0.023 over the 20 Methods features. With the
    code's tau p = 0.0003 (FDR 0.003); with the median over sweeps in place of the mean p = 0.004 (FDR
    0.017). Reading (b) fails for the Methods' tau (IT RORB p = 0.019, VEN 0.057, L5 ET 0.46, L6 PC 0.099).
    In 4 of the 6 subjects with L2/3 IT HPCAL1 cells their median tau is lower than that of the other
    groups. Within the files of one device the difference is not significant (Axon, 6 against 125 cells,
    p = 0.47; HEKA, 24 against 82, p = 0.13); tau is longer in the Axon files in every group, in the computed
    values and in the code's table, and 24 of the 30 L2/3 IT HPCAL1 cells are HEKA files (findings).
  deviations:
  - Assumption on the FDR family. The claims file sets it to the 39 features of Ins_patchseq_ephs.xlsx,
    those the Methods define computed as defined there and the others as createFeatures.m computes them.
    Nineteen of them (phase areas and perimeters, ISI phase ratios, FR, first-ISI and adaptation slopes,
    amplitude CV and Fano factor, AHP latency and others) are defined neither in the Methods nor in PatchAnaLab,
    so their values are taken from the code's table by cell ID (234 of the 237 grouped cells are in it)
    and the FDR is computed over all 39. The 20 features the Methods name are the variant family. Over
    the 20 Methods features the result is the same, so the outcome does not rest on this choice.
  - Tau follows the Methods (exponential fit from step onset to the trough, averaged over all hyperpolarizing
    sweeps; "the τ values across all hyperpolarization traces were averaged"), with the fit segment of
    createFeatures.m (the first third of the step, 5-sample smoothing). A median of 10 sweeps is fitted
    per cell (at least 4); the largest over smallest sweep tau has a median of 1.81, and three cells have
    a mean above 150 ms. The Methods' tau is 26% longer than the feature table's (median ratio 1.26),
    which holds the code's first-sweep tau.
