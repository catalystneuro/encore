findings:
- kind: metadata_error
  statement: In "VAA_party_positions coded.xlsx" the "Statement no." column disagrees with the statement's wording
    in 99 of 429 rows. For every party, the rows worded as statements 16 to 24 (Supplementary Table 1 and the data
    dictionary) are numbered 22, 23, 24, 16, 17, 18, 19, 20, 21, so the environment, multilevel governance and form
    of government statements are mislabelled. The recoded CSV and the paper's Figures 2 and 3 follow the wording.
    A user who joins positions to the user responses by "Statement no." gets the wrong statements.
- kind: selection_undocumented
  statement: The deposited R code removes 330 responses that give the same answer to all 39 statements (204 of them
    all "no opinion") before removing incomplete ones; the paper's Data cleaning does not mention this step. With
    it, Table 2 and the S4 and S5 counts are reproduced exactly; without it they differ by up to 2.5%.
- kind: metadata_error
  statement: The paper says the responses were gathered during the 26 days up to and including election day, but
    432 rows (0.32%) are timestamped 1 to 9 October 2023, after the election. Table 1's sample entry (2023-10-09
    08:57:38) is one of them. The R code has an optional filter that drops rows after 2023-09-30 22:42:30, but the
    deposited file includes them and the paper does not say so.
- kind: metadata_error
  statement: The paper's Data cleaning says "no opinion" answers are empty strings; in data_without_email.csv they
    are the string "NA" (183,459 values in S1 to S39). The README calls each row "a unique respondent", while EMAIL_ID
    repeats (30,775 distinct ids over 32,009 rows with an id), as the paper says it may.
- kind: metadata_insufficient
  statement: The data dictionary lists no categories for GENDER, AGE and EDUCATION (they appear only in the R code's
    validation rules), does not give the time zone of TIME.STAMP, and lists a "Self-placement source" column that
    is empty in all 429 rows.
- kind: other
  statement: Figure 3 places PS at 54.5 on the economic axis, right of centre, while the deposited final positions
    give 47.7 by the same calculation that reproduces every other party's placement in Figures 2 and 3 to within
    0.8. The figure and the deposited positions disagree for this one party.
- kind: methods_unavailable
  statement: Question for the paper's authors. The weighted Cohen's kappa of 0.84 (Methods, Party selection and
    coding, paragraph 3) does not state the weights or how "No opinion" codes enter. Quadratic weights with pairs
    involving "No opinion" left out give 0.842; linear weights give 0.734, and scoring "No opinion" as neutral gives
    0.620 (linear) or 0.745 (quadratic). This attempt assumed quadratic weights with "No opinion" left out; please
    confirm or correct.
- kind: methods_unavailable
  statement: Question for the paper's authors. The structural validation reports 40 respondents under 18 and 400
    aged 18-20 with university-level education (Technical Validation, Structural validation, paragraph 3). The deposited
    data give 27 and 378 (cleaned rows, university only), 27 and 382 (raw), or 34 and 505 with applied higher education.
    Which rows and categories were counted, and were the counts made on an earlier state of the data? The R code
    does not contain this check.
