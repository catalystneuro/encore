  measured: 134699
  notes: The raw file has 134,699 rows and every column of Table 1 and the data dictionary (69 columns). 81.0% of
    rows give demographics, 67.6% at least one salient statement, 73.2% a party considered and 76.9% a party never
    considered. 133,473 rows remain after removing those with -1, 133,143 after the R code's cleaning.
- claim: collection-window
  outcome: partially_reproduced
  notebook: reproduce_mintal_2024.ipynb
  output: claim:collection-window
  notes: The first response is 2023-09-05 11:26:31 and responses cover all 26 days to 30 September, but 432 of 134,699
    rows (0.32%) are dated 1 to 9 October 2023 as given, and 494 (0.37%) when TIME.STAMP is read as UTC and converted
    to Slovak time. The criterion requires every timestamp inside the window under one reading, and it fails under
    both; 99.7% of rows are inside it, so the claim holds in part. The sample entry of Table 1 (2023-10-09 08:57:38)
    is the first row of the file and the latest timestamp. The R code has an optional filter ending at 2023-09-30
    22:42:30, which drops 461 rows; its comment puts the end of the moratorium at 22:45 on 30 September, so the
    code reads TIME.STAMP as local time (reading a) and reading (b) is unlikely.
