- claim: efa-eleven-factors
  outcome: reproduced
  notebook: reproduce_mintal_2024.ipynb
  output: claim:efa-eleven-factors
  measured:
  - 11
  - 11
  notes: On the cleaned rows with No opinion as 50 (reading a), parallel analysis with psych's defaults
    (minres, 20 iterations) gives 11 factors for both the polychoric and the Pearson matrix. The 11th
    Pearson factor value is 0.030 against a reference of 0.013 and the 12th 0.004 against 0.012; the 95th
    percentile of the reference gives the same counts. Reading (b), No opinion missing, gives 12 (Pearson)
    and 11 (polychoric) with the defaults. With the R code's settings (ML extraction, 1000 iterations for
    Pearson and 100 for polychoric) every row reading gives 11 and 11, including the code's unique-email
    rows (29,493). 18 of 2,074 uniqueness fits did not report convergence. While preparing, a looser
    optimiser tolerance gave 12 for reading (a) Pearson with the defaults (not run here), so the 12th value
    is close to its reference under minres; the notebook uses the tighter tolerance.
  deviations:
  - The parallel analysis is a reimplementation of psych's fa.parallel in Python (factor values of the
    correlation matrix with one-factor communalities on the diagonal, compared with the mean over simulated
    normal data), not psych itself, which cannot be installed in the entry's Python environment.
  - The R code's settings (fm "ml", n.iter 1000 and 100, unique-email rows) are shown as variants, taken
    from Volebny_Kompas_code.R (section "CORRELATION AND FACTOR ANALYSIS"); the criterion names psych's
    defaults.
  - Polychoric correlations use thresholds from each statement's margins without psych's correction for
    empty cells.
