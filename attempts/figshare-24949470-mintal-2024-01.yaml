- claim: coder-agreement-kappa
  outcome: reproduced
  assumed: true
  notebook: reproduce_mintal_2024.ipynb
  output: claim:coder-agreement-kappa
  measured: 0.842
  notes: The workbook holds each coder's positions. With quadratic weights and pairs where either coder chose "No
    opinion" left out (266 of 429), kappa is 0.842. Linear weights give 0.734 (No opinion left out) and 0.620 (No
    opinion as Neutral); quadratic weights with No opinion as Neutral give 0.745. Only the first reading is within
    0.84 +- 0.084. The paper names neither the weights nor the handling of No opinion; this is asked of the authors
    (findings).
  deviations:
  - Assumed quadratic weights with "No opinion" pairs left out, the one reading of the four the criterion names
    that gives the reported value; the paper says only "Weighted Cohen's Kappa" (Methods, Party selection and coding,
    paragraph 3). Quadratic weights are the common choice for ordinal scales, and No opinion has no place on the
    ordered scale, so this reading is the best supported; all four are shown.
- claim: uni-and-landscape-placements
  outcome: partially_reproduced
  notebook: reproduce_mintal_2024.ipynb
  output: claim:uni-and-landscape-placements
  notes: Supplementary Table 1, which is in the dataset, assigns 18 statements to the five uni-dimensions and 16
    to the landscape (11 economic, 6 cultural, statement 10 on both). With No opinion as 50 (reading ii), every
    party's score on each of the five uni-dimensions is within 0.8 of Fig. 2, which places parties at whole percentages,
    and its cultural score is within 0.3 of Fig. 3. On the economic axis 10 of 11 parties are within 0.2 of Fig.
    3, but PS scores 47.7 where Fig. 3 places it at 54.5, 38 pixels right of the centre line, so PS and DEMOKRATI
    (52.3, figure 52.2) are ordered differently. No reading of the economic statements tried while preparing (leaving
    out statement 10 or 21) explains it, and those variants are not in the notebook. With No opinion left out (reading
    i) four of the five uni-dimensions differ from Fig. 2. The order matches on six of the seven axes, so the claim
    holds in part. The figure values were read blind to the computed scores, by pixel position (round 1 of verification
    asked for this). The paper's statement that the placements conform to anticipated placements is a judgement
    the data cannot test; the criterion tests agreement with the figures. The dimension assignments come from the
    dataset's own Supplementary Table 1, so no outside labels and no link claim are needed.
  deviations:
  - The expected placements were read from the published Figures 2 and 3 by a separate agent that had not seen the
    computed scores, from each logo's centre in pixels interpolated between the axis ends (Fig. 2 to about 0.3,
    Fig. 3 to about 0.3 to 1). A party matches within 1 point, and a pair is ordered differently only when the figure
    and the scores order it opposite ways by more than 1 point each.
  - Readings (a) and (b) of the criterion give the same number for a mean of polarity-adjusted positions, so only
    one is computed.
  - Statements are numbered by their wording, not by the workbook's "Statement no.", which is wrong for statements
    16 to 24.
- claim: party-clustering
  outcome: reproduced
  notebook: reproduce_mintal_2024.ipynb
  output: claim:party-clustering
  notes: With the recoded positions (No opinion as 50, reading a), Manhattan distances and average linkage, all
    9 non-trivial clusters of Fig. 7 are found and no other, at heights within 1 of those read from the figure (root
    1774.0, figure 1774). The figure was read blind to the computed tree, by pixel position against its axis ticks.
    Reading (b), No opinion left out of each distance, finds 7 of 9 clusters; the variants on coder I's and coder
    II's positions find 2 and 7 of 9. The deposited R code clusters the recoded CSV, as reading (a) does.
