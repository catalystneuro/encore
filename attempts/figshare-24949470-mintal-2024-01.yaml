- claim: efa-eleven-factors
  outcome: reproduced
  notebook: reproduce_mintal_2024.ipynb
  output: claim:efa-eleven-factors
  measured:
  - 11
  - 11
  notes: On the cleaned rows with No opinion as 50 (reading a), parallel analysis with psych's defaults (minres,
    20 iterations) gives 11 factors for both the polychoric and the Pearson matrix. The 11th Pearson factor value
    is 0.030 against a reference of 0.013 and the 12th 0.004 against 0.012. The 12th polychoric value, 0.0103, is
    close to the normal-data reference (0.0117), but psych's own reference for cor poly, polychoric correlations
    of resampled data, gives 0.0143 (s.d. 0.0009 over 20 iterations) and again 11. The 95th percentile of each reference
    gives the same counts. Reading (b), No opinion missing, gives 12 (Pearson) and 11 (polychoric, against either
    reference) with the defaults, so with the defaults the claim holds under reading (a) only. With the R code's
    settings (ML extraction, 1000 iterations for Pearson and 100 for polychoric, on a correlation matrix, for which
    psych simulates normal data) every row reading gives 11 and 11, including the code's unique-email rows (29,493).
    18 of 2,040 uniqueness fits on simulated reference matrices did not report convergence; every fit on an observed
    matrix (12) and on resampled data (40) converged. While preparing, a looser optimiser tolerance gave 12 for
    reading (a) Pearson with the defaults (not run here), so the 12th value is close to its reference under minres;
    the notebook uses the tighter tolerance.
  deviations:
  - The parallel analysis is a reimplementation of psych's fa.parallel in Python (factor values of the correlation
    matrix with one-factor communalities on the diagonal, compared with the mean over simulated normal data, and
    for the polychoric matrix under the defaults also over resampled data with polychoric correlations, as psych
    does for cor poly on raw data), not psych itself, which cannot be installed in the entry's Python environment.
  - The R code's settings (fm "ml", n.iter 1000 and 100, unique-email rows) are shown as variants, taken from Volebny_Kompas_code.R
    (section "CORRELATION AND FACTOR ANALYSIS"); the criterion names psych's defaults.
  - Polychoric correlations use thresholds from each statement's margins without psych's correction for empty cells.
- claim: efa-loadings-consistent
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_mintal_2024.ipynb
  output: claim:efa-loadings-consistent
  notes: On the Pearson matrix of the cleaned rows (reading a), S1 has a largest loading of 0.523 (ML) and 0.502
    (PA) and S3 0.598 and 0.603, and 35 of 39 statements load most on matched factors (lowest Tucker congruence
    0.892), so the claim holds there at both thresholds; reading (b) gives S1 0.553 and 0.539, S3 0.598 and 0.603,
    35 of 39. On the polychoric matrices S1 and S3 load above 0.5 but only 32 of 39 statements match (lowest congruence
    0.355 and 0.358), so the solutions are not consistent there. The criterion takes the matrices of efa-eleven-factors,
    Pearson and polychoric, so the claim holds on one of the two, in part. The R code runs ML and PA with promax
    only on the Pearson matrix; on its unique-email rows the Pearson PA loading of S1 is 0.379 and 33 of 39 match.
  deviations:
  - The thresholds for "strong" (0.4 or 0.5) and "consistent" (35 of 39) are the claims file's own; the paper gives
    none, so the outcome rests on them.
  - ML, principal axis and promax are reimplemented in Python after psych and stats::promax.
