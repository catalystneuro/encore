verifications:
- date: '2026-11-10'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebooks)
  reviewed: Round 1. The handover of the author run (executed notebooks reproduce and hfb with the conclusion
    cells and the summary removed), the helper module bmovie.py and the claims file, with the paper. The
    verifier tested observed_selection, perm_null_counts (shared against per-cell resamples, on synthetic
    data), heatmap, session_auc, confidence_accuracy and scenecuts on synthetic inputs. Report in transcripts/keles-2024/verifier-1-report.md.
    It disagrees with the record on scanner-questions, and gives a different blocked_by for the three
    fMRI claims.
  results:
  - claim: cohort-emu-sessions
    agrees: true
    outcome: reproduced
