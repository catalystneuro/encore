- claim: nwb-contents
  outcome: reproduced
  notebook: hfb_keles_2024.ipynb
  output: claim:nwb-contents
  notes: All 29 files have units with spike times, electrode ids and the four metrics, LFP_micro and LFP_macro
    at 1000 Hz, the trials table, electrode locations, pairwise distances, gaze and 11971 frame times,
    and the movie starts at 0 s. All 58 LFP series store a starting time at the movie start; read as the
    Usage Notes say (timepoints start 10 s before starting_time) the LFP begins 10 s before the movie
    and runs past the last trial in every file. With that 10-s offset 650 of 2192 micro and 683 of 2240
    macro channels respond to recognition images, without it 18 and 20. Offsets of 9.9 to 10.25 s keep
    the count high (590 to 695 micro, 617 to 724 macro), and with the 10-s offset the HFB response reaches
    half its peak 200 ms (macro) and 350 ms (micro) after the image, against 300 ms for the spikes, which
    are on the trials' clock, with at most 9% of the peak before onset.
  deviations:
  - The 10-s offset of the LFP is applied as the Usage Notes say and the code does (prep_filterLFP.py,
    LFP_PAD_us).
