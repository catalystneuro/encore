- claim: memory-cells-significant
  outcome: reproduced
  notebook: reproduce_keles_2024.ipynb
  output: claim:memory-cells-significant
  measured:
  - 32
  - 436
  - 22
  - 186
  - 14
  - 150
  notes: Amygdala 32/436 (permutation p = 0.0065), ACC 22/186 (p = 0.0005) and vmPFC 14/150 (p = 0.0140),
    each below 0.05, with the paper's counts and denominators. 99 of 1266 cells are selective, 35 with
    novel above familiar.
  deviations:
  - The permutation test is seeded with seed 0 in every test, as open detail 8 of the claims file says
    ("Seed 0 is used as a standard choice"), and within each shuffle one set of bootstrap resamples is
    drawn per session (per design) and applied to all its cells or channels, where the code draws one
    per cell, unseeded; each cell's null decision has the code's distribution (bmovie.py docstring). The
    permutation of trials is per cell, as in the code.
  - The observed test of each cell uses the code's spike rates (count divided by 1.5 s) and its resamples,
    and gives the same p as a literal port of ms_test for all 1266 cells; the permutation null runs on
    spike counts, which have the sign of the rates and exact ties.
