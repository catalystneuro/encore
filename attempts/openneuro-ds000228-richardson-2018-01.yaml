    out of tolerance and above the paper's bound p < 1e-26. Under the rc-events reading (O5a,
    O6b) 10 adult face events (108 s) and 6 3yo events (32 s); no reading gives 7 adult events
    (8 to 10, 72 to 108 s). No face-event magnitude changes with age at .0071 (smallest p =
    .010). The correlations do not both hold, so neither the reproduced nor the partial outcome of
    the criterion applies.
  deviations:
  - The fusiform ROIs are the deposited rFFA (1019 voxels) and lFFA (531), the sizes of
    Supplementary Table 2.
  - Face-event peaks are the found adult events' peaks, as the paper gives no face peak TRs.
- claim: face-overlap
  outcome: reproduced
  notebook: reproduce_richardson_2018.ipynb
  output: claim:face-overlap
  notes: Face events overlap ToM events by 7 TRs (p = .052 for fewer than chance) and pain events
    by 25 TRs (p = .983) under the rc-events reading; .098 to .166 and .94 to .96 under the
    others. Neither is below .05. The overlaps differ from the paper's 4 and 15 TRs.
- claim: replication-sample
  outcome: blocked
  blocked_by: other
  notes: The independent sample of 20 adults is not in the snapshot, and neither the paper nor the
    dataset's README names an archive that holds it. The claims file marks the claim `elsewhere`
    with no archive; as the data are public nowhere, data_missing would apply, which the checker
    does not allow for an `elsewhere` claim.
- claim: hand-coded-events
  outcome: blocked
  blocked_by: other
  notes: The hand-coded events of Jacoby et al. 2016 are not in the snapshot (its README lists
    only reverse-correlation events) or the paper. The Saxe lab web page
    (https://saxelab.mit.edu/theory-mind-and-pain-matrix-localizer-movie-viewing-experiment)
    offers the experiment script movloc.zip (version of 29 March 2019) whose mov_localizer.m holds
    them, but with no DOI or repository commit, so it cannot be pinned as the protocol requires
    for an outside input.
findings:
- kind: other
  statement: With the paper's own deposited preprocessed images, artifact and CompCor regressors
    and ROI masks, and the pipeline of the Methods, the inter-region correlations differ from the
    paper's, higher within networks and less negative across them (adults .604, .398 and -.051
    against .48, .35 and -.17; 3yo within-ToM .326 against .21). Several downstream results
    (within-ToM difference between false-belief passers and failers, age effects at event peaks,
    the T04 effect of ToM score) do not come out as reported. Either the deposited data or the
    described pipeline differs from what produced the paper's numbers.
- kind: methods_unavailable
  statement: For the authors, which timepoints entered the inter-region correlations (all 168 TRs,
    or TRs 11 to 168 as in the reverse correlation), and whether the artifact timepoints were
    regressed with one indicator each? irc-tom-behavior-age, irc-fb-across and maturity-within
    change outcome with this choice; this attempt assumed all 168 TRs and one indicator each, as
    in the deposited regressor files.
- kind: methods_unavailable
  statement: For the authors, over which timepoints was each ROI timecourse z-normalized before
    the reverse correlation, and were child event magnitudes taken from the z-normalized
    timecourse? rc-3yo-events depends on the first (all 168 TRs assumed) and rc-fb-no-difference
    on the second (z-normalized assumed). The alpha of the reverse-correlation t-tests is also not
    stated; p < .05 uncorrected matches Supplementary Table 3 best.
- kind: methods_unavailable
  statement: The analysis code is available only on request, and the high-pass filter
    implementation (SPM discrete cosine assumed) is not stated.
- kind: metadata_error
  statement: participants.tsv lists 2 seven-year-olds and 21 8-12-year-olds with 3.13 mm voxels and
    no slice gap, where the Methods say 3 and 20. The voxel-size column name is misspelled ("Voxel slize"), and
    the no-gap level is stored as an empty value where participants.json defines the level
    "None".
- kind: other
  statement: 19 participants (14 aged 8-12, 2 adults, one each 4, 5 and 7 years) have face-ROI
    voxels without data at some timepoint, where Supplementary Fig. 4 counts 17 with incomplete
    ventral coverage (12 aged 8-12, 2 adults, one each 3, 4 and 7 years); the minimum of 101 voxels
    with data agrees with its "at least 100 voxels". The coverage criterion may differ.
- kind: other
  statement: The independent sample of 20 adults that defined the ToM and pain ROIs and replicated
    the events is not deposited anywhere; the ROIs it produced are in the dataset.
