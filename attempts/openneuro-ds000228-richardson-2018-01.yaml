- claim: irc-williams
  outcome: partially_reproduced
  notebook: reproduce_richardson_2018.ipynb
  output: claim:irc-williams
  notes: Williams' T2 (and Steiger's Z, which agrees) on the age correlations of
    irc-control-networks. Under both readings (partial with motion, or plain Spearman) and every
    pipeline reading, the six differences the paper finds significant are significant in the same
    direction (main reading, reading a, t = 2.51 to 5.03 for Face and V1 against ToM and Pain;
    -2.95 and -4.0 for across ToM-Pain against Face-Scene and M1-V1). ToM against Scene (t = .75)
    and ToM against M1 (t = 1.32) are not significant, as in the paper, but Pain against Scene (t
    = 2.62, p = .0098) and Pain against M1 (t = 2.92, p = .0043) are, so the within-Pain age
    effect is stronger than Scene and M1, unlike the paper. 8 of 10 comparisons follow the paper.
    The criterion states only the reproduced outcome; the partial outcome is the protocol's
    "holds only in part".
  deviations:
  - The paper reports z for Williams' test; Williams' T2 is a t on n - 3 df. Both T2 and
    Steiger's Z are shown; they give the same conclusions.
