- claim: irc-adult
  outcome: partially_reproduced
  notebook: reproduce_richardson_2018.ipynb
  output: claim:irc-adult
  measured: [0.604, 0.398, -0.051, 19.1, 21.8]
  notes: Main reading (O1 all voxels of the deposited masks, O2a, O3a). Adult means within-ToM
    .604, within-Pain .398, across -.051; paired t within-ToM against across 19.1 and within-Pain
    against across 21.8, both p < 1e-18. The two t values are in tolerance under three of the
    four O2 and O3 readings; the three means are out of tolerance under all. O1 with only voxels
    with data gives identical values. Variants outside the paper's method (no high-pass, 50 s
    high-pass, no CompCor) give adult means from .556 to .645 within-ToM and -.051 to .059
    across, none near the paper's. Further diagnostic variants, adults (within-ToM, within-Pain,
    across), are mean r in place of z .519, .354, -.049; the high-pass basis in the nuisance
    regression .593, .393, -.086; left and right M1 as two regressors .599, .390, -.037; and the
    mean ToM and Pain signal as an added regressor .286, .258, -.382. Only the last, which is not
    the paper's method, moves the across value past the paper's, so the offset is in the direction
    of a shared signal removed in the paper's processing and not here, which no step of the
    Methods accounts for. The ROI masks are in MNI mm (9 mm sphere centroids within 3.7 mm of the
    stated centers, every voxel within 8.9 mm), and the images are int16 with no scaling. Fig. 2
    shows the mean matrices only as colours, so the offset cannot be traced pair by pair; the
    adult and 3yo mean matrices are printed in the notebook.
  deviations:
  - The 100 s high-pass filter is SPM's discrete cosine basis (spm_filter); the Methods say SPM8
    and "a cutoff of 100 s" without naming the filter. A standard choice.
  - The cleaning is applied to the ROI mean timecourse, which equals cleaning each voxel and
    averaging, as every step of Methods paragraph 4 is linear and the same for each voxel.
