- claim: irc-control-networks
  outcome: partially_reproduced
  notebook: reproduce_richardson_2018.ipynb
  output: claim:irc-control-networks
  measured: [0.367, 0.525, 0.288, 0.227, -0.247]
  notes: No M1 regression, main reading. Age partial rs, within-ToM .367 (p = 3.5e-05), within-Pain
    .525 (p = 6.4e-10), within-Scene .288 (p = .0014), within-M1 .227 (p = .012), across ToM-Pain
    -.247 (p = .0064); within-ToM and across are in tolerance, within-Pain, Scene and M1 are not.
    Within-Face .106 (p = .25), within-V1 -.069 (p = .45) and across Face-Scene .065 (p = .48)
    are not significant, as in the paper; across M1-V1 is, .200 (p = .028; .017 to .034 under the
    other readings), where the paper has p = .05 and the criterion counts it as no change. The
    ToM and Pain results hold and one control result differs, the criterion's partial outcome.
  deviations:
  - The face and scene parcels are the ones deposited in derivatives/ROIs of the snapshot
    (rSTS_masked, lSTS, rOFA, lOFA, rFFA, lFFA; rRSC, lRSC, rTOS, lTOS, rPPA, lPPA), which the
    dataset's README names as the Julian et al. 2012 parcels; the claims file treats them as an
