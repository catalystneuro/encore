- claim: beh-fb-tom
  outcome: reproduced
  notebook: reproduce_richardson_2018.ipynb
  output: claim:beh-fb-tom
  measured: [0.546, 0.572, 0.753, 22.95]
  notes: Reading (a), the 18 non-false-belief items deposited as ToM Booklet-Matched-NOFB, gives
    means .546, .572, .753 and Kruskal-Wallis H = 22.95, p = 1e-05. Tukey on z-scored scores
    (O9a), Pass-Fail diff 1.24, p = 3.8e-05; Pass-Inc 1.08, p = 7.8e-05; Inc-Fail .16, p = .85,
    the paper's diffs. Reading (b), the full ToM score, gives means .451, .571, .792 (failers and
    passers out of tolerance), H = 41.5, and a significant Inc-Fail difference (p = .0073), so
    the claim holds under reading (a) only.
  deviations:
  - The paper does not define "remaining ToM items"; the criterion's two readings were run and
    reading (a) matches. participants.json describes ToM Booklet-Matched-NOFB as the 18 items
    without the six false-belief questions.
