- claim: snrnaseq-single-cluster
  outcome: blocked
  blocked_by: methods_underspecified
  notes: 'The criterion asks that the mean silhouette score be highest at K = 1, as the Methods (Cluster quality
    analysis) say it was. The silhouette score is undefined for a single cluster (it compares each point''s distance
    to its own cluster with the nearest other cluster), and the paper does not say what value it gave K = 1, so
    no computation of the criterion can be defended; this is asked of the authors (see findings). The NeMO collection
    the claims file names, col-p9d5w39, holds no files itself; it has five child collections (notebook, Blocked
    claims): Patch-seq FASTQ (col-s96tk9a), 10x snRNA-seq FASTQ (col-0p3tt32) and processed counts (col-qocsrc5:
    16 per-library h5ad files of 1.7 to 3.9 GB, each 1.6 to 2.7 million unfiltered barcodes by 33,767 genes, 37.7
    million barcodes in all, a cell table and R matrices of 1.9 to 3.5 GB), and retro-seq SMART-seq v4 FASTQ (col-3qj1ect,
    1,383 libraries) and STAR counts (col-afgz110). None of these files marks which nuclei are the paper''s 4,743
    LC-NE nuclei. The nuclei count would also need the paper''s selection of LC-NE nuclei, an R pipeline (Seurat
    and Harmony, capsule 10, LCNE_10x_preprocessing_R) that the entry''s Python environment cannot run, and MMIDAS
    for the second clustering method; neither was run.'
