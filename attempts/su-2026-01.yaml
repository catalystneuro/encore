- what: Soft-masked genomic sequence of eight gene bodies (Dbh, Th, Slc6a2, Slc18a2, Snap25, Slc32a1, Tph2, Alb)
    at Ensembl release 116 coordinates, for counting marker reads.
  source: UCSC Genome Browser API, assembly mm39 (GRCm39), coordinates in entries/su-2026-001893/rna.py
- what: FASTQ files (R1 and R2) of 60 retro-seq nuclei, drawn with a fixed seed among the 1,307 that STAR QC kept,
    each checked against the MD5 sum in the collection's manifest, and the STAR 2.7 CPM matrix and sample table
    of the 1,383 retro-seq nuclei; used only to check the k-mer marker counting of patchseq-ne-identity against
    an aligner.
  source: NeMO Archive collections nemo:col-3qj1ect (FASTQ, manifest col-3qj1ect_cohen_lcne1_RetroSeq_manifest.txt)
    and nemo:col-afgz110 (NeMO_LC_260513_request_mouse_star2.7_cpm_sparse.Rdata and _samp.dat.Rdata), children of
    col-p9d5w39
outcomes:
- claim: patchseq-sample
  outcome: reproduced
  notebook: reproduce_su_2026.ipynb
  output: claim:patchseq-sample
  measured:
  - 96
  - 28
  - 27
  - 8
  - 15
  - 7
  - 54
  - 13
  notes: 96 NWB files, one per ephys_roi_id, from 28 donors; cortex 27 cells from 8 mice, cerebellum 15 from 7,
    spinal cord 54 from 13, from participants.tsv injection_target_region; every count equals the paper's. No recording
    is deposited twice (no repeated session start time or rheobase sweep). mapping.tsv and participants.tsv agree
    on donor_local_id for all 96 cells. By IPFX's test-pulse measures 80 cells have a seal above 1 GOhm, 92 an initial
    access resistance below 20 MOhm, 93 below 15% of the break-in input resistance, and 78 pass all three; 2 cells
    have no break-in sweep. IPFX's seal is the mean over the six test pulses, and in 2 cells one pulse makes it
    negative (-1.82 and -1.84 GOhm, medians over the pulses 1.14 and 1.69 GOhm); with the median, 81 cells pass
    the seal and 79 all three. These are reported and not used to exclude cells. 8 of the 54 spinal cord cells,
    from 2 of the 13 mice, are wild-type C57BL6J by their NWB genotype and sample names (see findings).
  deviations:
  - The cell inclusion values are measured here with IPFX's qc_features functions on the last cell-attached and
    break-in sweeps, as IPFX's qc_feature_extractor does; the paper's own values are not in the files.
- claim: patchseq-transcriptome-link
  outcome: reproduced
  notebook: reproduce_su_2026.ipynb
  output: claim:patchseq-transcriptome-link
  notes: 64 of the 96 cells have a library identifier in mapping.tsv (16 of 27 cortex, 12 of 15 cerebellum, 36 of
    54 spinal cord). All 64 resolve at the NeMO API to a library of the same name with two FASTQ files, R1 and R2,
    whose MD5 sums match NeMO's; all are SMART-seq libraries of nuclei, with 175,250 to 1,110,791 read pairs of
    51 bases. All 128 files are listed, by library and file name and with the same MD5, in the manifest of nemo:col-s96tk9a,
    the collection the claim names, and lie under its manifest folder; the manifest lists no other library. The
    NeMO API lists the file it was asked about under a snapshot collection (nemo:col-nuo6q49), not under col-s96tk9a.
    The other 32 cells have no transcriptome in the deposit.
  deviations:
  - The MD5 sums are checked against those the NeMO API gives at run time, not against a stored list.
- claim: patchseq-ne-identity
  outcome: partially_reproduced
  notebook: reproduce_su_2026.ipynb
  output: claim:patchseq-ne-identity
  measured: 0.938
  notes: 'Of the 64 cells with a transcriptome, Dbh is detected (CPM above 0) in 60 (93.8%, reading a) and all four
    of Dbh, Th, Slc6a2 and Slc18a2 in 58 (90.6%, reading b); both pass the criterion''s 90% and neither reaches
    every cell. At CPM above 10 the readings give 58 and 55 of 64. One cell (1409801288) has no read of any marker
    and 1,007 Snap25 read pairs; three more have no Dbh read. Marker levels are high (median Dbh 192 CPM, Th 710
    CPM); the controls are low (Tph2 at most 28 CPM, Alb at most 2.6 CPM, Slc32a1 at most 83 CPM), though at CPM
    above 0 Slc32a1 is detected in 46 of 64 cells. The counting was checked against STAR on 60 retro-seq nuclei
    of the same paper, which have both FASTQ files and STAR CPM at NeMO (the Patch-seq libraries have no aligned
    counts there): Spearman r 0.98 to 0.995 for the four markers and Snap25, the same four-marker call for all 60
    nuclei, k-mer CPM 0.69 to 0.75 of STAR''s, and Slc32a1 detected by neither method, so its reads in the Patch-seq
    libraries are reads those libraries hold. The statement is about every recorded cell, and 32 of the 96 cells,
    among them all 8 wild-type cells, have no transcriptome to check. Reading (c), MapMyCells, was not run.'
  deviations:
  - Read pairs are counted by exact 31-mer matches (every 4 bases) to the repeat-masked gene bodies on mm39, in
    place of the paper's STAR alignment to mm10 with duplicates removed and unique reads only (Methods, cDNA and
    sequencing). On 60 retro-seq nuclei with STAR counts the two agree closely (see notes).
  - Reading (c) of the criterion, MapMyCells against the LC-NE type, was not run; it needs whole-transcriptome counts
    and the reference taxonomy.
- claim: tau-table-link
  outcome: reproduced
  notebook: reproduce_su_2026.ipynb
  output: claim:tau-table-link
  notes: All 96 rows of the frozen table match an NWB file by ephys_roi_id. Of the 82 cells with a value on both
    sides, IPFX's (2.1.2) time constant computed here from all subthreshold long squares is within 10% of the table's
    for 77 (94%), 24 of them to 0.01 ms; Pearson r = 0.992. The largest differences are 41% (1426070420, 22.2 against
    31.4 ms; 1410668927, 8.8 against 12.4 ms), each from all 4 of the cell's subthreshold sweeps, then 15% to 19%.
    The table has no value for 14 cells, 13 of which have one here, and has values for 16 of the 18 cells with no
    long square within +-100 pA of applied bias.
- claim: patchseq-ap-waveform-spinal-vs-cortex
  outcome: reproduced
  notebook: reproduce_su_2026.ipynb
  output: claim:patchseq-ap-waveform-spinal-vs-cortex
  measured: 0.000105
  notes: Main reading (the Methods' sweep rule before choosing the rheobase sweep) keeps 69 of 96 cells; spinal
    cord against cortex PC1 means -0.455 and 0.557, Welch t = -4.18, df = 56.0, p = 0.00011 (36 and 24 cells). The
    code's variant on all 96 cells gives t = -2.66, df = 69.4, p = 0.0097 (54 and 27). Taking Rin from all subthreshold
    sweeps gives p = 0.00019, and the rule without its bias part p = 0.0038. The main reading picks the code's rheobase
    sweep in 68 of 69 cells, and one 10 pA higher in the other. Over mouse means p = 0.017 (12 and 7 mice). Without
    the 8 cells of the two wild-type spinal cord donors the main reading gives p = 0.0056 (0.0067 with the PCA refitted),
    and the code's variant p = 0.14 (0.13 refitted), so the paper's own computation of this result rests on those
    cells.
  deviations:
  - The Methods' sweep rule needs the input resistance for its 15% bridge-balance part, and the paper does not say
    from which sweeps; IPFX's input resistance over the subthreshold long squares passing the rule's other parts
    is used, and Rin from all of them is shown; the outcome is the same.
  - Where the noise windows sit is not in the Methods; IPFX's are used (1.5 ms opening the experiment epoch, 500
    ms before the stimulus), as the Methods say the features were computed with IPFX.
  - 'The bias part of the rule is applied to the current the amplifier applied, read from the MIES lab notebook
    in each file: the NWB bias_current where I-Clamp holding is on (where it equals the notebook''s holding level
    in all 2,433 such long squares), 0 pA in the 17 long squares with holding off, which carry no NWB value. The
    round-1 record treated those 17 as failing.'
- claim: patchseq-ap-waveform-spinal-vs-cerebellum
  outcome: reproduced
  notebook: reproduce_su_2026.ipynb
  output: claim:patchseq-ap-waveform-spinal-vs-cerebellum
  measured: 0.0295
  notes: Main reading, spinal cord against cerebellum PC1 means -0.455 and 0.334, Welch t = -2.41, df = 14.9, p
    = 0.029 (36 and 9 cells). The code's variant gives p = 0.031 (54 and 15), Rin from all sweeps p = 0.042, the
    rule without its bias part p = 0.033. The main reading keeps 9 of 15 cerebellum cells. Over mouse means p =
    0.060 (12 and 5 mice), and without the 8 cells of the two wild-type donors p = 0.19 (main) and 0.20 (code),
    0.20 and 0.16 with the PCA refitted, so the result is weak and rests on those cells, none of which has a transcriptome.
  deviations:
  - As for patchseq-ap-waveform-spinal-vs-cortex (input resistance for the bridge rule, IPFX's noise windows, applied
    bias from the lab notebook).
- claim: patchseq-tau-cortex-vs-spinal
  outcome: partially_reproduced
  notebook: reproduce_su_2026.ipynb
  output: claim:patchseq-tau-cortex-vs-spinal
  measured: 0.00771
  notes: 'Main reading (IPFX on the subthreshold long squares passing the Methods'' sweep rule) gives cortex 55.4
    ms and spinal cord 43.1 ms, Welch t = 2.80, df = 42.7, p = 0.0077 (24 and 36 cells), below 0.05 and not below
    0.001. The code''s variant, the frozen table, gives 51.8 and 34.4 ms, p = 4.0e-05 (22 and 46), and IPFX on all
    sweeps p = 1.3e-04 (27 and 54), both below 0.001. The rule drops 18 of the 54 spinal cord cells, 16 by its bias
    part alone, and these have shorter time constants (21.8 ms on all sweeps, against 43.0 ms for the cells kept);
    without the bias part p = 0.00055. The bias values are the current applied: in every long square of the 18 cells
    with no sweep within +-100 pA, the lab notebook has I-Clamp holding and autobias on, and the baseline before
    the pulse lies within 1.5 mV of the autobias target (-70 to -41 mV). One spinal cord cell (1392357828) is kept
    only through five X1PS_SubThresh sweeps recorded with holding off, at a baseline of -22.7 mV. Rin from all sweeps
    and the X1PS_SubThresh sweeps alone give the main result unchanged. Over mouse means p = 0.0094 (7 and 12 mice).
    The frozen table holds values for 16 of the 18 cells with no sweep within +-100 pA of applied bias, so the paper''s
    value was not computed under that rule (see findings).'
  deviations:
  - The time constant is IPFX's own subthreshold functions at their defaults, run on the four 1 s step sets (X1PS_SubThresh,
    X3LP_Rheo, X4PS_SupraThresh, X5LP_Rheo); which sets the upstream pipeline treated as long squares is not stated,
    and X1PS_SubThresh alone gives the same result.
  - As for the waveform claims, the input resistance for the bridge rule, IPFX's noise windows and the applied bias
    from the lab notebook.
- claim: patchseq-tau-cortex-vs-cerebellum
  outcome: partially_reproduced
  notebook: reproduce_su_2026.ipynb
  output: claim:patchseq-tau-cortex-vs-cerebellum
  measured: 0.0025
  notes: Main reading, cortex 55.4 ms and cerebellum 37.1 ms, Welch t = 3.38, df = 23.7, p = 0.0025 (24 and 10 cells),
    below 0.05 and not below 0.001. The frozen table gives p = 3.1e-04 (22 and 14), IPFX on all sweeps p = 2.0e-04
