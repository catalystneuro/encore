findings:
- kind: other
  statement: Eight of the 54 spinal cord cells, all those of donors sub-1435396971 (3 cells) and sub-1435397039
    (5 cells), carry the genotype wt/wt in their NWB files and C57BL6J in their sample names, where the Methods
    (Patch-seq, Transgenic mice and labelling projection neurons) describe Dbh-Cre;Ai65 mice labelled with AAVrg-DIO-FLPo.
    Either the metadata or the paper's description is wrong, or these cells were labelled another way. The waveform
    results depend on them (spinal cord against cortex in the code's computation, p = 0.0097 with them and 0.14
    without). None of the 8 cells has a transcriptome in the deposit, so their identity cannot be checked.
- kind: code_mismatch
  statement: The Methods give a sweep inclusion rule (bridge balance, bias current within +-100 pA, noise) that
    the paper's code (LCNE-patchseq-figures at 79fa20a) does not apply. 18 of the 96 cells have no long square within
    +-100 pA of applied bias (the lab notebook confirms the bias was applied, by autobias, to hold them at -70 to
    -41 mV), yet the paper's frozen time-constant table has values for 16 of them. Under the rule as written the
    time-constant comparisons reach p = 0.0077 and 0.0025, not the p < 0.001 the paper reports.
- kind: data_missing
  statement: 32 of the 96 cells have no library identifier in mapping.tsv and no transcriptome in the deposit, though
    the paper says it confirmed the identity of each recorded cell from its RNA.
- kind: identifier_missing
  statement: The NeMO collection the paper's Data availability names (col-p9d5w39), and which the dandiset lists
    as a related resource, holds no files itself; its five child collections hold the Patch-seq, snRNA-seq and retro-seq
    data, without saying which nuclei of the 10x data are the paper's 4,743 LC-NE nuclei. The NeMO API lists a Patch-seq
    file under a snapshot collection (nemo:col-nuo6q49), not under col-s96tk9a, whose manifest lists it.
- kind: selection_undocumented
  statement: The paper's frozen time-constant table lacks a value for 14 of the 96 cells without saying why; IPFX
    gives a value for 13 of them from the dandiset's sweeps.
- kind: metadata_insufficient
  statement: The filtering field of all 96 NWB files reads PLACEHOLDER; the Methods give a 10 kHz Bessel filter.
- kind: metadata_error
  statement: participants.tsv gives no sex, age or donor NHash identifier for sub-1435396971; its NWB files give
    female, P62.
- kind: metadata_error
  statement: datasets.tsv gives dandiset 001858 the URL of dandiset 001748.
- kind: methods_unavailable
  statement: The Methods (Cluster quality analysis) report silhouette scores for K = 1 to 15 and say they were highest
    at K = 1, but the silhouette score is undefined for one cluster. How was the K = 1 score computed (Extended
    Data Fig. 6e)?
- kind: metadata_insufficient
  statement: For 17 long-square sweeps (5 cells) recorded with I-Clamp holding off, the NWB files carry no bias_current
    value; only the MIES lab notebook in the file says that no bias was applied.
verifications:
- date: '2026-11-04'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: 'Round 1. The first executed notebook with the conclusion cells and the summary removed, the helper
    modules and the claims file, with the paper. The verifier queried the DANDI and NeMO APIs and tested the waveform
    helpers on synthetic inputs. Its outcome agrees with the record''s for every claim; for the four sequencing
    claims it gave blocked but found the stated reason (col-p9d5w39 lists no files) inaccurate. Its other points:
    the meaning of the bias field (problem 1), the Rin used for the bridge rule (2), the 8 wild-type cells (3),
    the k-mer counting (4), negative seal values (6), the donor_local_id check (7) and the collection membership
    of the libraries (8). In reply the lab notebook is read, the bias rule uses the applied current, the wild-type,
    seal, donor, collection, rheobase-sweep and tau-difference checks were added, the counting is checked against
    STAR, and the sequencing claims'' reasons are corrected; no outcome changed.'
  results:
  - claim: patchseq-sample
    agrees: true
    outcome: reproduced
    reason: 'Cell 10: 96 cells and 28 mice in total, Cortex 27/8, Cerebellum 15/7, Spinal cord 54/13; all counts
      match. There are no duplicates. The inclusion rule is reported: 78 of 96 cells pass it. Problem 6: the seal
      measurement gives negative values (minimum -1.84 GOhm), which suggests IPFX''s measure_seal misbehaves on
      some cell-attached sweeps; it is only reported. Problem 7: the donor_local_id check falls back to a count
      of non-missing values if the merged column is absent, so 96 of 96 may not be a real comparison.'
    response: 'The seal is now also given as the median over the six test pulses: one pulse makes IPFX''s mean negative
      in 2 cells (medians 1.14 and 1.69 GOhm); with the median 81 cells pass the seal and 79 all three. The donor
      check now asserts both columns and compares them (96 of 96, none missing), and the mapping''s file URLs are
      checked against the asset ids (96 of 96).'
  - claim: patchseq-transcriptome-link
    agrees: true
    outcome: reproduced
    reason: 'Cells 22-23: 64 of 96 cells have a library identifier; all 64 resolve, each has R1 and R2 files, the
      NeMO name and the MD5 sums match, all SMARTSeqSC nuclei. Problem 8: cell 22 does not verify that the 64 libraries
      belong to nemo:col-s96tk9a, the collection the claim names.'
    response: 'Added: all 128 files are in the manifest of nemo:col-s96tk9a with the same MD5 and under its manifest
      folder, and the manifest lists no other library. The NeMO API lists the file checked under a snapshot collection
      (nemo:col-nuo6q49), recorded in the notes and the identifier_missing finding.'
  - claim: patchseq-ne-identity
    agrees: true
    outcome: partially_reproduced
    reason: 'Cell 25: reading (a) Dbh detected in 60/64 (93.8%); reading (b) all four markers in 58/64 (90.6%);
      both at least 90% but neither 100%; reading (c) not run. Problem 4: reads were counted by an exact 31-mer
      method in place of STAR alignment; Slc32a1 is detected in 46 of 64 cells, which suggests off-target hits at
      CPM > 0; reading (b) sits one cell above the 90% line and falls to 55/64 at CPM > 10; reading (a) stays at
      90% or more up to 10, so the outcome holds; no cross-check against an aligned count was made. It also asked
      for the marker CPMs of the 8 wt/wt cells.'
    response: NeMO has no aligned counts for the Patch-seq libraries, so the k-mer counts were compared with STAR's
      on 60 retro-seq nuclei of the same paper (Spearman r 0.98 to 0.995, the same four-marker call in all 60, no
      k-mer detection STAR lacks except Snap25 in 2 nuclei, Slc32a1 found by neither). The 8 wt/wt cells have no
      transcriptome. Outcome unchanged.
  - claim: tau-table-link
    agrees: true
    outcome: reproduced
    reason: 'Cell 17: all 96 table rows match a file; of the 82 cells with a value on both sides, 77 (94%) are within
      10%; r = 0.992. It asked for the five largest disagreements per cell with sweep counts, and the IPFX version.'
    response: 'Added: the five largest differences with frozen and computed tau and sweep counts (41%, 41%, then
      15% to 19%, each from all of the cell''s 4 or 5 subthreshold sweeps) and IPFX 2.1.2. With the applied bias,
      18 cells (not 19) have no sweep within +-100 pA, and the table has values for 16 of them.'
  - claim: patchseq-ap-waveform-spinal-vs-cortex
    agrees: true
    outcome: reproduced
    reason: 'Cell 14: main reading n = 35 and 24, t = -3.98, p = 2.0e-4; code variant n = 54 and 27, p = 0.0097;
      both below 0.01. Problem 3: the 8 spinal cord wt/wt cells from two donors have the most extreme PC1 means;
      without them the code-variant p is 0.14; the PCA was not refitted after leaving them out. It asked for the
      rheobase sweep chosen per cell under both readings.'
    response: 'Re-run with the applied bias: main reading n = 36 and 24, p = 0.00011. Added the PCA refitted without
      the 8 cells (main p = 0.0067, code 0.13) and the rheobase sweep per cell under both readings (same sweep in
      68 of 69 cells, one 10 pA higher). Outcome unchanged.'
  - claim: patchseq-ap-waveform-spinal-vs-cerebellum
    agrees: true
    outcome: reproduced
    reason: 'Cell 14: main reading n = 35 and 9, t = -2.25, p = 0.041; code variant p = 0.031; both below 0.05.
      Fragile: the result rests on 8 wt/wt cells from two donors, without them p = 0.19; at the mouse level p =
      0.063.'
    response: 'Re-run with the applied bias: main n = 36 and 9, p = 0.029; mouse means p = 0.060; without the 8
      cells p = 0.19, and 0.20 with the PCA refitted. The notes and summary call the result weak. Outcome unchanged.'
  - claim: patchseq-tau-cortex-vs-spinal
    agrees: true
    outcome: partially_reproduced
    reason: 'Cell 19, main reading: 55.4 vs 42.9 ms, n = 24 and 35, p = 0.0071, below 0.05 but not 0.001; the frozen
      table gives p = 4.0e-5. Problem 1: both tau outcomes hinge on the bias part of the sweep rule (without it
      p = 5.5e-4), the dropped cells have much shorter tau, and lcne.extract_cell reads bias_current as the applied
      holding current without checking that holding was switched on (MIES I-Clamp Holding Enable) or that the value
      matches the baseline. Applying the rule follows the criterion, so the partial outcome stands, but it rests
      on this unverified reading of the field. Problem 2: the sweeps Rin comes from are an assumption; the rin_all
      reading leaves tau unchanged.'
    response: The lab notebook is now read for every sweep. In all 2,433 long squares with holding on, the NWB value
      equals the notebook's holding level; in every long square of the 18 cells with no sweep within +-100 pA, holding
      and autobias are on and the baseline is within 1.5 mV of the autobias target, so the bias was applied. The
      17 sweeps with holding off carry no NWB value and were treated as failing; they now count as 0 pA, which adds
      one spinal cord cell. Main reading now p = 0.0077 (24 and 36). Outcome unchanged.
  - claim: patchseq-tau-cortex-vs-cerebellum
    agrees: true
    outcome: partially_reproduced
    reason: 'Cell 19, main reading: 55.4 vs 37.1 ms, n = 24 and 10, p = 0.0025; the frozen table gives p = 3.1e-4,
