inputs:
- what: Patch-seq FASTQ files (R1 and R2) of the 64 cells that have a library identifier in the dandiset's mapping.tsv,
    streamed into memory and checked against the MD5 sums the NeMO API gives, for patchseq-transcriptome-link and
