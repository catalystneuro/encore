- claim: fig8-hand-speed-similar
  outcome: reproduced
  notebook: reproduce_chowdhury_2020.ipynb
  output: claim:fig8-hand-speed-similar
  notes: The speed traces of active and passive trials overlap in the 120 ms window and separate
    afterwards. Passive movements are 13% faster on average (0.207 against 0.183 m/s), half a
    standard deviation, which is statistically clear; the paper's "similar" is qualitative.
  deviations:
  - One session from one monkey; the paper has four sessions from two.
- claim: fig8-arm-kinematics-separable
  outcome: reproduced
  notebook: reproduce_chowdhury_2020.ipynb
  output: claim:fig8-arm-kinematics-separable
  measured: 0.90
  notes: A linear discriminant tells active from passive trials 90% of the time from joint
    angles and velocities, against 58% from hand kinematics and 53% by chance. The paper reports
    89% averaged over four sessions.
  deviations:
  - One session from one monkey; the paper has four sessions from two.
  - Joint angles and velocities stand in for the hand and elbow marker kinematics, which are not
    in the dandiset.
- claim: fig8-neurons-separable
  outcome: reproduced
  notebook: reproduce_chowdhury_2020.ipynb
  output: claim:fig8-neurons-separable
  notes: 20 of 50 neurons have a separability index above chance at p < 0.05, with a median of
    0.56 and a highest value of 0.80.
  deviations:
  - One session from one monkey; the paper has four sessions from two.
  - Neurons firing below 1 Hz in the window (15 of 65) are left out; the paper states no criterion.
- claim: fig9-whole-arm-fits-better
  outcome: reproduced
  notebook: reproduce_chowdhury_2020.ipynb
  output: claim:fig9-whole-arm-fits-better
  notes: The whole-arm stand-in is significantly better than the hand-only model for 15 of 50
    neurons and worse for none; 35 (70%) show no significant difference, against 17% in the
    paper's two-workspace experiment. That comparison uses the paper's number.
  deviations:
  - One session from one monkey; the paper has four sessions from two.
  - The whole-arm model is hand plus joint kinematics; the marker positions the paper's model
    uses are not in the dandiset.
  - The hand-only model is two-dimensional, the fits carry a small ridge penalty, neurons below
    1 Hz are left out, and no Bonferroni correction is applied.
- claim: fig10-inconsistent-across-conditions
  outcome: partially_reproduced
  notebook: reproduce_chowdhury_2020.ipynb
  output: claim:fig10-inconsistent-across-conditions
  notes: 19 of 50 neurons scored on active trials and 23 of 50 on passive trials have negative
    pseudo-R2 for the model trained on both conditions, but about as many (17 and 25) are
    negative when trained within one condition. Only 5 and 3 neurons are positive within a
    condition and negative across both. Training on both costs a little on active trials and
    nothing on passive trials.
  deviations:
  - One session from one monkey; the paper has four sessions from two.
  - The whole-arm model is hand plus joint kinematics, as for fig9-whole-arm-fits-better.
  - Pseudo-R2 for one trial type is computed on a repeat's pooled held-out predictions, against
    that type's own mean firing; the paper does not say which mean it used.
- claim: fig11-separability-vs-consistency
  outcome: partially_reproduced
  notebook: reproduce_chowdhury_2020.ipynb
  output: claim:fig11-separability-vs-consistency
  notes: Scored on active trials, model consistency correlates negatively with separability
    (Spearman -0.38, 95% interval -0.60 to -0.11). Scored on passive trials the correlation is
    -0.13 and on all trials together 0.14; neither can be told apart from zero.
  deviations:
  - One session from one monkey; the paper has four sessions from two.
  - The whole-arm model is hand plus joint kinematics, as for fig9-whole-arm-fits-better.
findings:
- kind: data_missing
  statement: The dandiset holds one of the twelve sessions analysed in the paper, and none from
    the two-workspace experiment, so four of the paper's main findings cannot be tested from it.
- kind: data_missing
  statement: The positions of the arm markers, which the paper's whole-arm model is built on,
    are not included. Joint angles and muscle lengths derived from them are.
- kind: metadata_error
  statement: The text descriptions of hand position and hand velocity give centimetres while the
    stated unit is metres. The stated unit, with the file's conversion factor, is correct.
- kind: selection_undocumented
  statement: The dandiset's metadata names the paper without saying which part of it the data
    covers. It was packaged for the Neural Latents Benchmark, not as the paper's data release.
