- claim: fig1c-cells-per-protocol
  outcome: partially_reproduced
  notebook: reproduce_yang_2026.ipynb
  output: claim:fig1c-cells-per-protocol
  measured:
  - 3276
  - 3275
  - 2166
  notes: Cells in the paper's lines with at least one quality-controlled sweep. Ramp 3275 (expected 3220
    +/- 322) and brief pulse 2166 (2154 +/- 215) are within tolerance. Long pulse is 3276 with every long
    square step, 1957 with the suprathreshold family (X4PS_SupraThresh, C1LSCOARSE) and 1881 with the
    steps named LP (X2LP, X3LP); none is within 2270 +/- 227. Counted over all cells, whatever their line,
    the counts are 4433, 2677, 2596, 4431 and 2595, none within. Two of the three counts match under one
    reading, so the claim holds in part. Every cell of the 9 lines has long-pulse sweeps; the cells with
    a passing long-pulse sweep (3276) and a passing ramp sweep (3275) are the same cells but one, 1395
    with only the older stimulus set (C1) and 1882 with the newer (X). Incomplete traces fall mostly on
    X3LP_Rheo (1791 sweeps) and X4PS_SupraThresh (1201) but remove few cells, so no sweep-level criterion
    here gives 2270.
  deviations:
  - Quality control uses this attempt's thresholds (complete trace, baseline -100 to -40 mV, baseline
    SD below 1 mV, ramp R^2 above 0.99); Methods 2 lists the criteria without thresholds. Counts change
    by at most 2 cells without the baseline criteria.
  - The paper does not say whether the counts are taken before or after restricting to the shown driver
    lines; both are shown, and only the restricted counts match for ramp and brief pulse (assumption).
  - The LP-named long-pulse reading is added from the stimulus names (X2LP, X3LP), as Methods 1 assigns
    sweeps by stimulus description.
  assumed: true
- claim: fig1d-driver-line-coverage
  outcome: reproduced
  notebook: reproduce_yang_2026.ipynb
  output: claim:fig1d-driver-line-coverage
  measured:
  - 9
  - 9
  - 11
  - 8
  notes: All 9 long-pulse and ramp lines and all 11 brief-pulse lines the figures name are in the data.
    With every long square step, and for the ramp, they are exactly the 9 largest lines (9th Oxtr 156
    cells, 10th Chrna2 146); for the brief pulse they are the 11 largest (11th Htr3a 91, 12th Nos1 79).
    8 lines are shared by all three sets (Slc32a1 is not in the brief set), within 7 +/- 1. No single
    minimum count selects the named lines in both the ramp (threshold between 147 and 156) and the brief
    pulse (between 80 and 91). With the suprathreshold or LP long-pulse readings Slc32a1 has 60 or 48
    cells and is not among the 9 largest. Taken from the data alone, the 9 largest long-pulse and ramp
    lines and the 11 largest brief-pulse lines share 8 lines, the same 8 as the paper's lists. A minimum
    of 147 to 156 cells keeps 9, 9 and 4 lines; a minimum of 80 to 91 keeps 14, 14 and 11.
  deviations:
  - Driver line is the marker gene of the first driver allele in the genotype (Cre, or FlpO where there
    is no Cre, which gives Sncg); Methods 1 says Cre-line labels were used. The lines analysed are the
    9 (long pulse, ramp) and 11 (brief pulse) the figures name.
  - Assumption, the inclusion rule is read as the largest lines of each protocol; the paper gives no rule.
  assumed: true
