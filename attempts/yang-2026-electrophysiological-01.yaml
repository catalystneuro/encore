findings:
- kind: other
  about: data
  severity: critical
  statement: One recording is deposited twice under two subjects and two genotypes. Sessions 680563483
    (sub-673135474, Vip-IRES-Cre;Ai14) and 680897463 (sub-673135516, Ndnf-IRES2-dgCre;Slc32a1-IRES2-FlpO;Ai65)
    hold identical sweeps (same stimuli, amplitudes and responses to four decimals, and the same first
    sweep). At most one genotype can be right, and nothing in the files says which; this attempt leaves
    both out of the line analyses.
- kind: metadata_insufficient
  severity: minor
  statement: The driver line is not a field of the files; it must be parsed from the genotype string,
    where 994 cells carry both a Cre and a Flp allele, and 213 Sncg cells, 62 Th cells and 9 others carry
    a Flp allele only. Which allele names the cell's group is not described.
- kind: other
  about: data
  severity: minor
  statement: 'Many sweeps stop before the end of their series and are filled with exact zeros, not NaN,
    so the voltage reads 0 mV after the recording ends: 13% of long square sweeps and 16% of ramp sweeps
    fail a complete-trace check. The zeros are evident from the values.'
- kind: other
  about: data
  severity: none
  statement: 'Checks passed. Units (volts with a conversion to mV), the 50 kHz sampling rate (127 sweeps
    at 200 kHz), the ramp slope of 25 pA/s, and the clock shared by command and voltage are consistent
    with the data: the voltage moves with the command sign 5 to 25 ms after onset (mean -9.31 mV for negative
    and +17.98 mV for positive steps, 0.00 mV before onset), and recruitment current divided by latency
    gives 25.01 pA/s.'
- kind: other
  about: data
  severity: none
  statement: Two stimulus sets are in the dandiset. 2597 cells have sweeps of the newer one (names beginning
    X) and 1837 only the older one (names beginning C1). X5SP_Search_DA_0, the paper's brief pulse, exists
    only in the newer set, so the brief-pulse geometry can cover at most 2597 cells, consistent with the
    paper's 2154.
- kind: methods_unavailable
  statement: 'Which sweeps form the long-pulse geometry, and which cells are counted? No reading of the
    stimulus families gives about 2270 long-pulse cells (every long square step 3276 in the 9 lines, the
    suprathreshold family 1957, the LP-named steps 1881), while the ramp (3275) and brief pulse (2166)
    match once restricted to the named lines. The variance explained by long-pulse PCs (PC2 above 18.7%
    in every reading against 15%) may differ for the same reason. Question for the authors: which stimulus
    descriptions, quality-control thresholds and line restriction define the long-pulse cells?'
- kind: methods_unavailable
  statement: 'Spike detection, response windows and feature definitions are not given. Results that depend
    on them here: ramp PC2 loadings (fig3d) and ramp variance (fig3a) hold with a dV/dt criterion of 20
    V/s but not with a 0 mV crossing; the brief-pulse variance (fig4a) holds with a 50 ms response window
    but not with 10 ms; the fast-response window (1, 2 or 5 ms) changes no outcome. Question for the authors:
    which spike criterion, which brief-pulse response and fast-response windows, and which exact feature
    lists make up the sustained-response, recruitment-focused, response-focused, gain-focused and base
    sets?'
- kind: methods_unavailable
  statement: 'Balanced resampling and the null are not specified. The number of cells drawn per line,
    the exclusion rule, which lines are shared, the number of PCs, and whether labels are shuffled in
    one geometry or both change the results here: over 42 settings of these and of the long-pulse and
    ramp readings medians range from 0.005 to 0.911, and brief response against gain is 0.795 over the
    11 lines the two share and 0.700 over the 8 shared by all three protocols; long pulse against gain
    passes the shuffle test at p 0.038 with both geometries shuffled and fails at p 0.051 with one. Question
    for the authors: what are these settings, how is the empirical p formed, and what do the stars of
    Figure 5C mean?'
- kind: methods_unavailable
  statement: 'The driver-line inclusion rule is not stated. The lines shown are exactly the 9 largest
    (long pulse and ramp) and 11 largest (brief pulse) groups by first driver allele, but no single minimum
    cell count selects both sets. Question for the authors: how were lines chosen, and is the driver line
    the Cre allele or the first driver allele (Sncg has only a Flp allele)?'
- kind: paper_inconsistency
  statement: Figure 1D prints 7 lines shared by all three geometries, while the lines named in Figures
    2 to 4 give 8 (the 9 long-pulse and ramp lines less Slc32a1), as the data do; Figure 1D labels the
    ramp circle Short pulse, and the Figure 4B legend lists 9 lines while Figures 4D and 4F show 11.
