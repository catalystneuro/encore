    more than 50% missing dropped (claims file).
  - Assumption, spikes detected where dV/dt rises through 20 V/s with a peak above -20 mV within 2 ms,
    the criterion of the Allen pipeline the paper cites for standardized phenotyping (ref. 2, Gouwens
    et al. 2019); the 0 mV crossing named by the claims file is shown as the other reading.
  - Command bins 0-50, 50-100, 100-200, 200-400 and 400 pA or more (standard choice); strong depolarization
    is a peak of 20 mV or more and high spiking a rate of 20 Hz or more (standard choices).
