- claim: fig4a-single-pulse-follows-field
  outcome: reproduced
  assumed: true
  notebook: reproduce_kim_2023.ipynb
  output: claim:fig4a-single-pulse-follows-field
  notes: Over 2627 ROIs of 200 um within 6 mm of the image centre, with E1 taken as the right-hand
    base electrode (base_a), background-subtracted YP and the computed field have Spearman rho =
    0.666 (p printed as 0, below floating-point range), and the order of the three electrode neighbourhoods (0 to 500 um from the
    footprint edge) is the same by YP (base_a 649.8, base_b 262.6, apex 82.2) and by field (12.88,
    7.38, 5.31 kV/cm). Across grid radii of 5 and 6 mm, margins of 150 and 400 um and
    neighbourhoods of 500 and 1000 um, rho is 0.640 to 0.746 and the order always matches. With E1
    taken as the other base electrode, rho is 0.424 to 0.510 (all p below 1e-95) and the order never
    matches, so the criterion's two readings would disagree. What holds without the assumption is a
    positive rank correlation under either assignment and a match of the order for one of the two.
    The question of which electrode was E1 is put to the paper's authors (findings).
  deviations:
  - The field map is computed here by a two-dimensional finite-difference solve (40 um grid,
    electrodes as 1.5 mm discs of fixed potential, insulating wall of a 35 mm dish), in place of
    the paper's Sim4Life model (Methods 4.3, "1.6 S/m solution to a depth of 3.5 mm", field "in the
    plane 1 um above the glass"). The needles span the solution from the glass up (Methods 4.2,
    "lowered ... until the tips touched the glass bottom"), so the field does not vary with height.
    Electrode positions are measured in the image, and the scale is set from the 1.5 mm needle
    diameter (Methods 4.2); it gives 0.654 um per pixel, the camera's 0.65.
  - Assumed that E1, the electrode pulsed in Figure 4A, is the right-hand base electrode of the
    file's image (base_a). The file does not record it, and the figure, which labels it, was not
    readable here. The assumption is taken from the uptake pattern itself, so the test is partly
    circular; the notebook shows both assignments.
  - The ROI grid (within 6 mm of the image centre, leaving out ROIs within 150 um of a footprint
    edge) and the neighbourhood (0 to 500 um from the footprint edge) are choices the claims file
    does not fix; the notebook shows 5 and 6 mm, 150 and 400 um, and 500 and 1000 um, and the outcome
    is the same under all of them.
  - The amplitude is taken as 4 kV (Section 2.3); the file's description says 2 kV. A rank
    correlation and an order do not depend on the amplitude.
- claim: fig4bc-paired-pulse-focal-apex
  outcome: reproduced
  notebook: reproduce_kim_2023.ipynb
  output: claim:fig4bc-paired-pulse-focal-apex
  notes: In the paired-pulse image, background-subtracted YP in the ROI 100 um outside the footprint
    edge is 843.9 at the apex against 255.3 and 104.1 at the base electrodes (apex/base 3.31 and
    8.11), and 500 um outside it is 725.7 against 269.6 and 119.0 (2.69 and 6.10). In the
    single-pulse image the apex/base ratios are 0.051 and 0.096 at 100 um and 0.156 and 0.200 at 500
    um, so the ratio is higher in the paired-pulse image under both readings. Without background
    subtraction the order is the same (apex 1035.8 against 447.2 and 296.0 at 100 um). The computed
    field near each base electrode during its own pulse (19.6 and 20.0 kV/cm at 100 um, at 4 kV) is
    more than twice that near the apex (8.4 to 9.0), which is the "despite the strong field there"
    of the statement.
  deviations:
  - The array centre, toward which the ROIs are placed, is taken as the centroid of the three
    electrode centres; the claims file says "toward the array center" without defining it.
  - The footprint edge is placed 750 um from the fitted footprint centre (the needle radius,
    Methods 4.2) in both images; the single-image footprints have less sharp edges and fit to a
    mean diameter of 1.22 mm.
- claim: fig4-comet-shape
  outcome: reproduced
  assumed: true
  notebook: reproduce_kim_2023.ipynb
  output: claim:fig4-comet-shape
  notes: With the maximum taken as the 99.5th percentile of the 200 um mean (730), the region above
    half the maximum touches the apex footprint and reaches 2935 um toward the base against 1608 um
    across the line (1235 um away from the base); above a quarter, 4136 against 2270 um (1538 away).
    With the maximum of a 200 um median filter (632) the same holds (half, 2603 against 1248 um;
    quarter, 4002 against 2064 um). The region touches neither base footprint. With the literal
    maximum of the 200 um mean (3999, on one bright object 2468 um from the apex centre whose binned
    YP reaches 26996, against a 99.9th percentile of 2953 in the dish), the half-maximum region is
    empty and the quarter-maximum region is 0.01 mm2 on the far side of the apex footprint, so that
    reading gives no region to judge.
  deviations:
  - Assumed that the maximum of the criterion is a maximum robust to isolated bright objects (the
    99.5th percentile of the 200 um mean, or the maximum of a 200 um median filter). The literal
    maximum lies on one object about nine times brighter than the dish's 99.9th percentile, likely
    debris or a dead cell, and makes the region vanish. The paper gives no measure for this finding.
  - The criterion's further toward the base than across is measured from the apex centre, as the reach along the
    bisecting line toward the base against the largest distance across it; the extents along and
    across the line are shown too, and agree.
