findings:
- kind: data_missing
  statement: The dandiset holds only the two whole-dish images of Figure 4. The ROI measurements of
    Figure 2 (n = 3 at 1 Hz and at 833 kHz), the square-array experiments of Figure 3 (n = 6 per
    group) and the strobe imaging of Figure 5, on which the paper's quantitative findings rest, are
    not deposited, nor is the field simulation of Methods 4.3 that gives each ROI its angle. Nine of
    the twelve claims cannot be tested.
- kind: format_error
  statement: Each image is stored as an ImageSeries with data of shape (22323, 22323, 2) and a rate
    of 2 Hz. NWB reads the first axis of an ImageSeries as time, so a standard reader sees 22323
    frames of 22323 x 2 pixels; the data are one stitched image of 22323 x 22323 pixels in two
    channels.
- kind: metadata_insufficient
  statement: No pixel size, channel names or intensity unit (unit "n.a.") are stored. The channel
    order comes only from the free-text description, and the scale only from the needle diameter
    in the paper (0.654 um per pixel, which matches the camera and objective named in the
    description). The file does not say which base electrode was pulsed in the single-pulse image
    (E1 in Figure 4A).
- kind: metadata_error
  statement: The session description of Single-pulse_trains describes another experiment ("4
    co-directional paired-pulse (600 + 600 ns) trains ... 770 kHz, amplitude 10 kV/cm"), the
    settings of Figure 3, while its image shows a triangular array with the single-pulse pattern of
    Figure 4A.
- kind: metadata_error
  statement: The session description of Paired-pulse_trains gives an amplitude of 2 kV; the paper
    gives 4 kV for both Figure 4 images (Section 2.3). With the array measured in the image, a field
    model gives 4.2 to 9.7 kV/cm on the bisecting line at 4 kV, close to the 5 to 10 kV/cm of
    Section 2.1, and half that at 2 kV.
- kind: metadata_error
  statement: The image description says the tiles came from a six-well plate, where the paper used
    35 mm glass-bottom dishes; the subject age is P1D for a cell line, and each subject is a
    condition (Single-pulse_trains, Paired-pulse_trains), not an animal or culture.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) Which base electrode of the deposited
    single-pulse image is E1, the one pulsed in Figure 4A, and is that file the image of Figure 4A
    despite its session description? This attempt took the lower-right one (base_a), as Figure 4A
    labels it with the apex at the top, assuming the deposited image is not mirrored. (2) How was the agreement of uptake with the field map
    (Figure 4A) and the comet-shaped region (Figure 4B,C) judged? The paper gives no measure; this
    attempt used rank correlation, the order of electrode neighbourhoods, and thresholds of half
    and a quarter of a maximum taken after leaving out one bright object, likely debris.
- kind: other
  statement: The brightest YP in the paired-pulse image lies on one object about 105 um across,
    2.5 mm from the apex electrode, bright in both channels (median 14577 in YO-PRO-1 and 5266 in
    MemBrite, against about 305 and 255 in the monolayer around it) and out of focus, likely debris
    above the monolayer. A maximum taken over the image without leaving it out is about four times
    the brightest uptake of the monolayer.
