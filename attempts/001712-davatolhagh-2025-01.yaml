- claim: fig4c-full-cvr2
  outcome: partially_reproduced
  notebook: reproduce_davatolhagh_2025.ipynb
  output: claim:fig4c-full-cvr2
  measured: 0.4709
  notes: Full-model cvR2 is 0.471 pooled in pixel space (reading a), 0.422 as the mean over pixels
    (b) and 0.126 as the mean over components (c); minus the intercept-only model (the time-point
    columns alone), 0.123, 0.133 and 0.078. None is within 0.486 to 0.660; reading (a) is above 0.3,
    which the criterion counts as partial. Without the body camera's video components the pooled
    cvR2 is 0.414. Variants that do not decide the outcome are as follows. With the video components
    of the left and right cameras added, as in the paper (encoding_all_cameras.ipynb), cvR2 is 0.574
    (a) and 0.525 (b), within the range, and 0.208 (c). With folds that keep each trial's frames
    together and each frame once per trial, it is 0.422, 0.363 and 0.047 with the body camera only,
    and 0.472, 0.405 and 0.046 with all three cameras, below the range. Over the masked pixels of the fig3b variant (pixels brighter than the median of
    the mean image and 20 or more from the edge) reading (b) is 0.434. The paper's Results give 0.60
    and 0.54 as the full model's cvR2 and say it accounts for more than half of the variance, while
    its Figure 4C legend says the full model is shown with the trial time regressor subtracted out.
    Under that reading the values here are 0.123 and 0.133 (a, b) with the body camera and 0.226 and
    0.236 with all three cameras, far below the range.
  deviations:
  - One session of one mouse of unknown genotype; the expected range spans the WT and KO means.
  - No video components from the left and right cameras in the design that decides the outcome
    (left out for runtime; the body camera's are included; a second notebook adds them as a variant), paw speeds from Lightning Pose where the paper uses DeepLabCut, ROI motion
    energies assumed to be the whisker pads and body.
  - The subjective prior is an action-kernel model fitted here; trial windows, the penalty selection
    (generalized cross-validation) and the readings of cvR2 were chosen here, as the paper's
    widefield model code is not public.
- claim: fig4cd-movement-dominates
  outcome: partially_reproduced
  notebook: reproduce_davatolhagh_2025.ipynb
  output: claim:fig4cd-movement-dominates
  measured: 0.1038
  notes: Shuffling movement predictors lowers cvR2 by 0.104 (a), 0.119 (b) and 0.067 (c); shuffling
    task predictors by 0.017, 0.015 and 0.013. Movement dominates under every reading and in every
    fold (smallest movement drop 0.065, largest task drop 0.019), but the movement drop is below
    0.297 to 0.440 under every reading. Without the body camera's video components the movement drop
    is 0.042 against 0.021 for task pooled, and 0.010 against 0.015 over components. Variants that do
    not decide the outcome are as follows. With folds by trial and each frame once per trial, the
    movement drop is 0.049, 0.060 and -0.005 against 0.017, 0.016 and 0.012 for task, so over
    components task exceeds movement, which the criterion would count as not reproduced. With all
    three cameras the movement drop is 0.216, 0.232 and 0.161 against 0.008, 0.008 and 0.007 for
    task, still below the range; with folds by trial, 0.109, 0.115 and 0.008 against 0.008, 0.008
    and 0.000.
  deviations:
  - As for fig4c-full-cvr2; the missing side-camera video components likely lower the movement
    contribution.
