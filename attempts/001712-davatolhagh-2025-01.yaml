outcomes:
- claim: fig1c-psychometric
  outcome: reproduced
  notebook: reproduce_davatolhagh_2025.ipynb
  output: claim:fig1c-psychometric
  notes: P(right) rises at every step of signed contrast, from 0.112 at -100% to 1.000 at +100%
    (Spearman rho 1.000 over nine levels, span 0.887). The lapse-and-erf fit gives sigma 17.04%
    contrast (bootstrap 95% interval 13.98 to 20.47), bias -6.77% and left lapse 0.116. The claim
    covers both genotypes; this is one mouse of unknown genotype.
  deviations:
  - One session of one mouse, where the paper pools 10 sessions from each of 19 mice.
  - The criterion (Spearman rho and span) was set here; the paper shows the curves without a test.
- claim: fig1d-psychometric-params-genotype
  outcome: blocked
  blocked_by: data_missing
  notes: Needs mice of both genotypes. The dandiset holds one mouse (FD-28), and its genotype is not
    in the files, the dandiset metadata, or the public IBL database (openalyx subject FD_28 has an
    empty genotype list). Openalyx holds other sessions of the cohort's FD and MFD mice, but is a
    live database without a pinned version and also has no genotypes.
- claim: fig1e-rt-contrast
  outcome: not_reproduced
  notebook: reproduce_davatolhagh_2025.ipynb
  output: claim:fig1e-rt-contrast
  notes: Over 750 trials with a movement onset after the stimulus, the Spearman correlation of
    absolute contrast with reaction time is -0.053 (p = 0.15); the median at 0% (0.089 s) exceeds that
    at 100% (0.081 s), the second part of the criterion. Medians are 0.081 to 0.095 s at every
    contrast, and 161 trials have no movement onset after the stimulus (151 of 899 onsets precede the
    go cue). With reaction times above 0.15 s only (226 trials) the correlation is -0.226 (p =
    0.00062), so the relation appears among slower responses.
  deviations:
  - One session of one mouse.
  - Trials with a movement onset at or before the stimulus onset are left out; the paper does not
    say how it treats them.
- claim: fig1f-rt-genotype
  outcome: blocked
  blocked_by: data_missing
  notes: Needs mice of both genotypes; see fig1d-psychometric-params-genotype.
- claim: fig1g-learning-genotype
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the training sessions of both genotypes; the dandiset holds one biased-task session.
- claim: fig2bc-prior-shift
  outcome: reproduced
  notebook: reproduce_davatolhagh_2025.ipynb
  output: claim:fig2bc-prior-shift
  notes: At 0% contrast P(right) is 0.831 (74 of 89) in right-likely blocks and 0.507 (37 of 73) in
    left-likely blocks, difference 0.325, one-sided Fisher p = 9.2e-06. The difference is 0.182 to
    0.458 at every signed contrast except +100% (0.000), and the psychometric bias moves by 19.41%
    contrast between blocks. Whether the shift is smaller in KO than in WT is not testable here.
  deviations:
  - One session of one mouse; the test (Fisher exact at 0% contrast) was chosen here.
- claim: fig2bd-ko-smaller-shift
  outcome: blocked
  blocked_by: data_missing
  notes: Needs mice of both genotypes; see fig1d-psychometric-params-genotype.
- claim: fig2ef-block-adaptation
  outcome: reproduced
  notebook: reproduce_davatolhagh_2025.ipynb
  output: claim:fig2ef-block-adaptation
  notes: Over 14 switches between biased blocks, choices toward the new block side are 0.543 in
    trials 0 to 4 and 0.827 in trials 20 to 39 (one-sided Fisher p = 2.7e-06). The fit gives A =
    0.480, B = 1.000 (at its bound) and tau = 25.12 trials (SE 16.14), so tau is poorly determined.
    At contrasts of 12.5% or less, 0.452 against 0.820, tau 21.57.
  deviations:
  - The paper's parametric curve is not given; B - (B - A) exp(-t / tau) over trials 0 to 39, all
    contrasts, was chosen here.
- claim: fig2g-ko-slower-adaptation
  outcome: blocked
  blocked_by: data_missing
  notes: Needs mice of both genotypes; see fig1d-psychometric-params-genotype.
- claim: fig3b-contralateral-visual
  outcome: not_reproduced
  notebook: reproduce_davatolhagh_2025.ipynb
  output: claim:fig3b-contralateral-visual
  notes: Under the criterion, the right-minus-left and left-minus-right peaks both fall at the left
    edge of the frame (columns 0 and 2, rows 0 and 539), on the same side of the estimated midline
    (column 316), with trial tests at p = 0.053 and 0.14. These corner pixels are darker in the mean
    image (534 and 926) than 95% of the frame (5th percentile 1538), outside the imaged brain; the
    spatial components cover the whole frame with no mask. In a variant
    restricted to bright pixels 20 or more from the edge, the right-minus-left peak lies left of the
    midline (column 199) and the left-minus-right peak right of it (column 481), p = 8.1e-15 and
    1.6e-17, which points to lateralized responses; the variant does not decide the outcome. Neither
    VISp nor the hemispheres can be named without an atlas registration.
  deviations:
  - Tested in image coordinates, with a midline estimated from the mean image, as the dandiset has no
    atlas registration.
  - The peak search of the criterion did not exclude pixels outside the brain; the masked search is a
    variant.
