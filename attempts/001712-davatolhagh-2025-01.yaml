outcomes:
- claim: fig1c-psychometric
  outcome: reproduced
  notebook: reproduce_davatolhagh_2025.ipynb
  output: claim:fig1c-psychometric
  notes: P(right) rises at every step of signed contrast, from 0.112 at -100% to 1.000 at +100%
    (Spearman rho 1.000 over nine levels, span 0.887). The lapse-and-erf fit gives sigma 17.04%
    contrast (bootstrap 95% interval 13.98 to 20.47), bias -6.77% and left lapse 0.116. The claim
    covers both genotypes; this is one mouse of unknown genotype.
  deviations:
  - One session of one mouse, where the paper pools 10 sessions from each of 19 mice.
  - The criterion (Spearman rho and span) was set here; the paper shows the curves without a test.
- claim: fig1d-psychometric-params-genotype
  outcome: blocked
  blocked_by: data_missing
  notes: Needs mice of both genotypes. The dandiset holds one mouse (FD-28), and its genotype is not
    in the files or the dandiset metadata, nor in the public IBL database (openalyx subject FD_28 has an
    empty genotype list, from a query made by hand during the attempt and not part of the notebook). Openalyx holds other sessions of the cohort's FD and MFD mice, but is a
    live database without a pinned version and also has no genotypes.
- claim: fig1e-rt-contrast
  outcome: not_reproduced
  notebook: reproduce_davatolhagh_2025.ipynb
  output: claim:fig1e-rt-contrast
  notes: Over 750 trials with a movement onset after the stimulus, the Spearman correlation of
    absolute contrast with reaction time is -0.053 (p = 0.15); the median at 0% (0.089 s) exceeds that
    at 100% (0.081 s), the second part of the criterion. Medians are 0.081 to 0.095 s at every
    contrast, and 161 trials have no movement onset after the stimulus (149 with an onset at or before
    it and 12 with no onset). With reaction times above 0.15 s only (226 trials) the correlation is -0.226 (p =
    0.00062), so the relation appears among slower responses. Of the 899 onsets, 149 fall at or
    before the stimulus and 346 within 0.08 s after it, so many may mark movements begun before the
    stimulus could guide them. The response time (choice registration minus stimulus onset) is
    shorter at higher contrast over all 911 choice trials (rho -0.134, p = 5.2e-05; medians 0.326 s
    at 0% and 0.281 s at 100%), a variant that does not decide the outcome. The paper's text calls reaction time the time to
    first movement and does not say how that movement is detected or how earlier movements are
    treated.
  deviations:
  - One session of one mouse.
  - Trials with a movement onset at or before the stimulus onset are left out; the paper does not
    say how it treats them.
