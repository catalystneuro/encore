- claim: fig4c-full-cvr2
  outcome: partially_reproduced
  notebook: reproduce_davatolhagh_2025.ipynb
  output: claim:fig4c-full-cvr2
  measured: 0.4709
  notes: Full-model cvR2 is 0.471 pooled in pixel space (reading a), 0.422 as the mean over pixels
    (b) and 0.126 as the mean over components (c); minus the intercept-only model, 0.131, 0.142 and
    0.087. None is within 0.486 to 0.660; reading (a) is above 0.3, which the criterion counts as
    partial. Without the body camera's video components the pooled cvR2 is 0.414.
  deviations:
  - One session of one mouse of unknown genotype; the expected range spans the WT and KO means.
  - No video components from the left and right cameras (left out for runtime; the body camera's
    are included), paw speeds from Lightning Pose where the paper uses DeepLabCut, ROI motion
    energies assumed to be the whisker pads and body.
  - The subjective prior is an action-kernel model fitted here; trial windows, the penalty selection
    (generalized cross-validation) and the readings of cvR2 were chosen here, as the paper's
    widefield model code is not public.
- claim: fig4cd-movement-dominates
  outcome: partially_reproduced
  notebook: reproduce_davatolhagh_2025.ipynb
  output: claim:fig4cd-movement-dominates
  measured: 0.1038
  notes: Shuffling movement predictors lowers cvR2 by 0.104 (a), 0.119 (b) and 0.067 (c); shuffling
    task predictors by 0.017, 0.015 and 0.013. Movement dominates under every reading and in every
    fold (smallest movement drop 0.065, largest task drop 0.019), but the movement drop is below
    0.297 to 0.440 under every reading. Without the body camera's video components the movement drop
    is 0.042 against 0.021 for task pooled, and 0.010 against 0.015 over components.
  deviations:
  - As for fig4c-full-cvr2; the missing side-camera video components likely lower the movement
    contribution.
