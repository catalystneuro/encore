findings:
- kind: data_missing
  statement: The dandiset holds one session of one mouse (sub-FD-28). The paper analyses 10 sessions
    from each of 11 wild-type and 8 Nrxn1a knockout mice. Eleven of the paper's findings, all comparisons between genotypes, cannot
    be tested.
- kind: metadata_insufficient
  statement: The genotype of the mouse is not given in the NWB files, the dandiset metadata, or the
    public IBL database (subject FD_28 has an empty genotype list, from a query made by hand during
    the attempt). The subject description is the
    paper's general description of the cross. A comment in the conversion script lists the session
    under knockout sessions, but next to a note that the list is a placeholder.
- kind: data_missing
  statement: Neither NWB file holds the cortical landmarks or the registration to the Allen atlas
    that the conversion code's documentation describes for the processed file (lab_meta_data
    localization and atlas_registration), so no pixel can be assigned to a cortical area.
- kind: metadata_error
  statement: Both imaging planes give the indicator as GCaMP6f; the paper's Methods and the file's
    keywords give GCaMP6s (CamKII-tTA x TRE-GCaMP6s).
- kind: metadata_error
  statement: The raw file's imaging planes state an imaging rate of 15 Hz; the timestamps give 31.2 Hz
    per channel (32.03 ms intervals), and the Methods give 30 Hz.
- kind: metadata_error
  statement: The dandiset's keywords and description name "CNTNALP2", which is neither the gene of the paper and the
    files (Nrxn1a) nor a correct spelling of Cntnap2.
- kind: metadata_error
  statement: The wheel series state that counter-clockwise is positive, but trials whose choice is
    labelled counter_clockwise turn the wheel with negative velocity (95.5% of them 0.1 to 0.3 s
    after movement onset). The choice labels agree with the rewards, so the sign convention of the
    wheel or of the labels is misdescribed.
- kind: metadata_error
  statement: The wheel movement onset is described as the first movement after the go cue, but 151 of
    899 onsets precede the go cue (by up to 0.18 s).
- kind: metadata_insufficient
  statement: The ROI motion energy series give the ROI position in pixels but not the body part it
    covers; the paper's model uses whisker-pad and body motion energy.
- kind: metadata_insufficient
  statement: The SVD spatial components cover the whole 540 x 640 frame with no brain mask, and the
    corners of the frame carry large values in stimulus-evoked maps.
- kind: other
  statement: The dandiset has no published version; only the draft exists, so no version can be
    cited or pinned.
- kind: methods_unavailable
  statement: The paper's analysis code is to be made public on publication. The encoding code it links
    (churchlandlab/chiCa) implements the model for single-cell data in another task, not the widefield
    analysis.
- kind: paper_inconsistency
  statement: In the Figure 3 legend the correlation panel is labelled (E) twice and (D) is missing, the
    correlation panel's legend says the KO minus WT matrix shows reduced inter-regional correlations
    while the Results say correlations are increased, and the legend of panel C describes variance
    difference maps, as does panel E.
