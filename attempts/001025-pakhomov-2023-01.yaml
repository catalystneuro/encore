findings:
- kind: data_missing
  statement: The dandiset holds only the 21 monolayer images of Figure 7. The images of Figures 5,
    6, 8 and 9 are in four other dandisets that cite the same paper (000686, 000875, 001027 and
    001028), which the dandiset does not mention, and the single-cell time-lapse data of Figure 4
    are in no dandiset that cites the paper.
- kind: metadata_insufficient
  statement: No pixel size is given (the ImageSeries resolution attribute is 96 or 1, not a pixel
    size), the array (small or large) is not stated, and the electrode positions, the electrode
    labels e1 to e4 and the paper's ROI measurements are not included. The array can be inferred
    from the electrode spacing, and it matches the protocol in every file.
- kind: metadata_insufficient
  statement: 7 of the 21 files name no detector, objective or channel, and the 5 large-array files
    hold a second channel labelled DAPI that the paper does not describe.
- kind: metadata_error
  statement: Subject ids do not identify dishes. sub-15 and sub-25 each hold two dishes imaged on
    different days under different protocols (2.4 kV 1Px4 and 4.8 kV 10Px4; 5.6 kV and 3.2 kV
    1Px4), so the archive counts 19 subjects for 21 dishes, while each dish was used in one
    experiment (Section 2.1).
- kind: selection_undocumented
  statement: Figure 7 states n = 3 for every voltage. The dandiset has 4 dishes at 2.4 kV, 3 at
    3.2, 4.0, 4.8 and 5.6 kV on the small array, and for the large array only 4.8 kV (2 dishes) and
    6.4 kV (3 dishes). Which 2.4 kV dish the paper left out, and the other large-array voltages, are
    not documented.
- kind: methods_unavailable
  statement: Question for the paper's authors. Was a background (camera offset or the intensity of
    unlabelled regions) subtracted from the ROI values before the fold changes of Section 3.3 and the
    normalisations of Figure 7? The images have a dark floor of 33 to 81 a.u. that varies between
    dishes and sessions. Without subtraction the 5.6 over 2.4 kV ratios here are 5.7 to 7.3, against
    15.5 to 16.8 in the paper; with the median of the electrode footprints subtracted they are 13.4
    to 15.9.
- kind: methods_unavailable
  statement: Question for the paper's authors. How were the 92 and 224 ROIs laid out (per diagonal
    or over both, their width, which diagonals for Figure 7), what is the pixel size of the stitched
    images, and is the 8.4 mm diagonal of the large array measured between electrode centres? Under
    the readings these allow, the voltage comparisons of Figure 7B and 7D find a significant pair in
    50 of 72 and 10 of 72 readings, so the outcomes of fig7b and fig7cd rest on the reading assumed.
