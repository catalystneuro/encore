- claim: fig7a-amplitude-scales-uptake
  outcome: not_reproduced
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig7a-amplitude-scales-uptake
  measured:
  - 5.99
  - 5.65
  - 7.25
  notes: Without background subtraction, as the criterion fixes, the 5.6 over 2.4 kV ratios of dish
    means under the main reading are 5.99 at the most peripheral ROI, 5.65 half-way and 7.25 at the
    centre (4 dishes at 2.4 kV, 3 at 5.6 kV). Over all 36 readings they range from 5.11 to 10.91,
    5.31 to 6.15 and 5.88 to 7.71, and none is within tolerance. Leaving out any one 2.4 kV dish
    changes them by at most 0.59. With the median inside the electrode footprints subtracted (150.7
    a.u. on average at 2.4 kV, 375.9 at 5.6 kV), a variant the criterion excludes, the main reading
    gives 13.37, 15.87 and 15.16 (two of three within tolerance) and 2 of 36 readings put all three
    within tolerance. The outcome turns on whether an offset was removed, which the paper does not
    say.
  deviations:
  - The paper measured the ROIs in MetaMorph with the electrode positions known; the dandiset holds
    no ROIs or electrode positions, so the electrodes are found by fitting four dark disks to each
    image and the ROIs are placed from their centre (overlays in the notebook).
  - The pixel size is not in the dataset. Main reading 0.65 um, from the ORCA-Flash4.0 camera and
    10x objective the files name; variant 0.591 um, the scale at which the large array's mean
    diagonal is 8.4 mm (Section 3.5). All 36 readings give the same outcome.
  - ROI width across the diagonal is not given (Section 2.4); square ROIs are used, a choice that
    changes only how many pixels are averaged.
  - The dandiset has 4 dishes at 2.4 kV where Figure 7 states n = 3; all four are used and each
    leave-one-out is shown.
- claim: fig7b-targeting-independent-of-amplitude
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig7b-targeting-independent-of-amplitude
  notes: Under the main reading 1 of 20 voltage pairs differs at p < 0.05, the normalised centre at
    2.4 kV (108.6%) against 4.8 kV (136.9%), p = 0.0037; no half-way pair differs (smallest p =
    0.12). The readings disagree, 22 of 72 (36 layouts by 2 normalisations) give no significant
    pair and 50 give one to five. With 20 uncorrected tests and no effect, at least one p below
    0.05 is expected with probability 0.64, so this is weak evidence against the absence; the
    normalised centre means lie between 108.6% and 136.9% across the five voltages. With the
    footprint background subtracted (a variant) the main reading finds no pair (smallest p = 0.18),
    and 59 of 72 readings find none. Over all ROIs of the folded profile, 23 of 220 tests are below
    0.05.
  deviations:
  - Assumed the main reading of the ROI layout (camera pixel size, 92 ROIs over both diagonals,
    both diagonals averaged, one ROI centred on the array centre, raw ROI means, normalisation to
    the mean of the end ROIs). The paper leaves each of these open (Section 2.4; claims file,
    opening comment); the reasons are given in the notebook (the Fig. 5B legend averages both
    diagonals for rotated packets, the Methods give one ROI count, the paper reports measured
    values, and with the camera scale the ROI span ends outside the electrode footprints). The
    outcome rests on it, as 22 of 72 readings find no difference.
  - Electrode detection, pixel size and ROI width as for fig7a-amplitude-scales-uptake.
  - The voltages (2.4, 3.2, 4.0, 4.8 and 5.6 kV) are taken from the dataset, as the criterion says;
    2.4 kV has 4 dishes where the paper states n = 3.
- claim: fig7cd-holds-for-large-array
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig7cd-holds-for-large-array
  notes: The dandiset holds two voltages for the large array with 10Px4, 4.8 kV (2 dishes) and 6.4
    kV (3 dishes). Under the main reading the normalised centre is 232.6% against 126.0%, p =
    0.0494, and the half-way values do not differ (94.8% against 46.8%, p = 0.16). 62 of 72 readings
    find no difference, so the outcome rests on the main reading and a two-dish group. The a.u.
    values rise from 4.8 to 6.4 kV at all three positions (ratios 3.53 at the periphery, 1.89
    half-way, 2.00 at the centre).
  deviations:
  - Only two voltages, one with 2 dishes, where the paper shows Figure 7C and 7D with n = 3 and
    voltages marked in the figure; the others are not in the dandiset.
  - Assumed the main reading of the ROI layout, as for fig7b-targeting-independent-of-amplitude;
    the outcome rests on it.
