findings:
- kind: data_missing
  statement: The dandiset holds 7 two-photon mice (M70, M168, M174, M179, M18R, M79RL, M99RL) where the paper reports
    9 for observation (Fig. 1) and 8 for x1 group activation; 8 s ISI sessions exist for 6 mice (x1) and 4 (x2)
    where the paper reports 7.
- kind: data_missing
  statement: 'Not in the dandiset: the unitary (single-neuron) stimulation sessions behind Fig. 3, Fig. 4a, Fig.
    5 and Extended Data Figs 10 and 12; the 1 mW, random-neuron and x1-then-x2 stimulation sessions; cell positions
    or ROI masks; the face video or motion SVDs; the photostimulation calibration recordings. 25 of the 54 claims
    are blocked as data missing, ed1m for a missing annotation and two through a blocked claim they depend on.'
- kind: metadata_insufficient
  statement: No rSLDS model is stored for the miniscope sessions and only the factor weights are stored for the
    two-photon sessions (no dynamics matrices, so no time constants); the miniscope files mark no x1 or x2 neurons.
    The paper's time constants, line attractor scores and miniscope x1 neurons can only be approached by new fits,
    which differ from seed to seed.
- kind: metadata_error
  statement: In sub-M70_ses-20230323_behavior.nwb the five neurons listed in ActivatedNeurons for activation_integration_neurons
    do not respond at the stimulation onsets (-0.01 z, against 0.27 to 0.80 z in the other six mice) and rank 33rd
    to 55th of 65 by the stored x1 weight (the other mice's targets rank mostly in the top 10), so the M70 target
    indices, or its weights, do not match the cells of the activity matrix.
- kind: other
  statement: sub-M70/sub-M70_ses-None_behavior.nwb is the same recording as the observation session in sub-M70/sub-M70_ses-20230323_behavior.nwb
    (per-cell correlation median 0.965 over the first 3000 frames) with different factor weights; the later file
    stops the session at 300 s, during the second BALB/c visit, which the earlier file follows to 350 s (4426 frames).
- kind: metadata_insufficient
  statement: The miniscope sessions start 56 to 152 s before the first annotation and hold no 5 min solitary baseline,
    which the Methods say was recorded at the start of every session; the files do not say how they were cropped.
- kind: metadata_insufficient
  statement: Sniffing of the SW mouse during observation is annotated only for M30L; the other miniscope files keep
    three of the original behaviour rows (Balb/c, SW, Watch_attack), so Extended Data Fig. 1m (4 mice) cannot be
    tested. Only M70 among the two-photon mice has BALB/c presence intervals for its observation session; the others
    hold one entry marker.
- kind: metadata_insufficient
  statement: That the cells of the engaging and observation sessions of a miniscope mouse are the same cells is
    not stated in the files, though the paper compares single-cell weights across the two (Extended Data Fig. 4).
- kind: methods_unavailable
  statement: 'Question for the authors (methods-cvr2): how is the cross-validated R2 of 84.7% and 67.2% computed?
    Activity predicted from the inferred two-dimensional latents of held-out contiguous blocks explains -81% and
    -75% of the variance about each block''s mean and 12.5% and 19.8% about the session mean; which quantity, folds
    (contiguous or random frames) and baseline give the reported values?'
- kind: paper_inconsistency
  statement: 'The excitatory network of the Methods (W_ij ~ U(0, 1/N), subnetwork W_ij ~ U(0, 1/N_p), N = 1000,
    N_p = 200) has a largest eigenvalue of 0.48 to 0.52 at every subnetwork density from 0 to 20%, so it is never
    unstable and gives tau_n of about 40 s at tau_s = 20 s, while Fig. 4c shows unstable networks and tau_n of 50
    to 200 s at 8 to 12%. Question for the authors: how were the weights scaled (a gain, a density-dependent normalization)?'
- kind: methods_unavailable
  statement: 'Questions for the authors on choices the paper leaves open, each adopted here as an assumption: the
    test behind Fig. 1m (paired or unpaired over mice; the paired test was adopted), the ISI window of Extended
    Data Fig. 8b (end of pulse to next onset was adopted), and the seed or model selection of the rSLDS fits (seed
    0 was adopted; the decoding results of Extended Data Fig. 3g,h depend on it). Also open: how transient amplitude
    is measured in Extended Data Fig. 4h (0.58 z is below the 1.5 SD detection threshold), and how the trials are
    balanced for the decoder.'
- kind: code_mismatch
  statement: The sample code's rslds() function ignores its num_iters argument and always runs 150 Laplace-EM iterations,
    while its miniscope notebooks pass 100; the fits here use 100 for the miniscope, as the notebooks state.
