- claim: methods-cvr2
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: cross_validation.ipynb
  output: claim:methods-cvr2
  notes: Every reading was run, with the code's 3-state miniscope model and five contiguous folds. Activity predicted
    from the held-out block's inferred latents explains -81.1% (engaging) and -74.5% (observing) of the variance
    about the block's own mean, and 12.5% and 19.8% about the session mean (expected 84.7 +/- 3 and 67.2 +/- 2);
    the code's latent R2 on held-out blocks is negative in most mice; no mouse reaches 70%. A two-dimensional model
    cannot explain 85% of the variance of 42 to 158 neurons, so the paper's cvR2 is taken on a quantity it does
    not name, and no reading has a defensible basis to match it. The random-frame folds were not run, as ssm's initialization
    fails with masked frames. Question for the authors, under findings.
  deviations:
  - Contiguous folds only; the held-out latents are inferred with the trained parameters fixed (ssm approximate_posterior,
    Laplace-EM, 50 iterations).
