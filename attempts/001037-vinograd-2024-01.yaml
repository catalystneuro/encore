- claim: ed1n-engaging-x1-slower
  outcome: not_reproduced
  notebook: rslds_fits.ipynb
  output: claim:ed1n-engaging-x1-slower
  notes: With seed 0, x1 is slower than x2 in 3 of 5 engaging sessions (x1 95 to 740 s, x2 7 to 39 s); in M36L and
    M38R the slowest state has a complex pair of eigenvalues, so x1 and x2 share one time constant (156 and 191
    s, line attractor score 0). Mann-Whitney p = 0.093 (paper 0.0079). Scores 3.70, 4.23, 0, 3.61, 0. With the code's
    seeds x1 is slower in 2 of 5 (p = 0.75). With the number of states chosen by cross-validation, 3 of 5 (p = 0.14).
    The sample code's R2 of each fit is printed in rslds_fits.ipynb; the held-out cvR2 is in cross_validation.ipynb
    (no fit reaches 70%, and no mouse was excluded, as the criterion says).
  deviations:
  - The paper's models are not in the dandiset (only the two-photon factor weights), so the models are new fits
    with the sample code's settings (3 states for miniscope, 2 for two-photon; penalties, alpha and iterations as
    the code) and seed 0; the code's four seeds, kept by its own R2, are a variant. The Methods choose the number
    of states by fivefold cross-validation; that reading is in cross_validation.ipynb.
