- claim: ed3g-decode-observed-attack
  outcome: reproduced
  notebook: rslds_fits.ipynb
  output: claim:ed3g-decode-observed-attack
  assumed: true
  notes: 'Seed 0: accuracy 0.66 to 0.83 against 0.49 to 0.51 for the shuffled decoders (1,000 shuffles per mouse)
    in every mouse, Mann-Whitney p = 0.0079 under all three splits (train on one trial and test on the others, leave
    one trial out, fivefold over trials, which is leave-one-out with 4 or 5 trials). With the code''s seeds the
    leave-one-out and fivefold splits give p = 0.0079 and training on one trial p = 0.15 (M35R at 0.48). The outcome
    rests on the assumption stated under deviations; the open choice, the readings and what was assumed are put
    to the paper''s authors under findings (methods_unavailable).'
  deviations:
  - The paper's models are not in the dandiset (only the two-photon factor weights), so the models are new fits
    with the sample code's settings (3 states for miniscope, 2 for two-photon; penalties, alpha and iterations as
    the code) and seed 0; the code's four seeds, kept by its own R2, are a variant. The Methods choose the number
    of states by fivefold cross-validation; that reading is in cross_validation.ipynb.
  - x1 and x2 neurons of the miniscope fits are the five with the largest absolute weight, the weight being the
    emission matrix C mapped onto the slow and the other eigenvector of the slowest state, or C's columns when that
    state's eigenvalues are a complex pair (Methods, Dynamical system models, 'we then used the columns of the emission
    matrix C').
  - 'Assumed: the seed-0 fits. Seed 0 is the default of the sample code''s rslds function and the seed of its two-photon
    notebook; the code''s choice among four seeds by its own R2 changes the outcome for one split, shown as a variant.'
  - Balancing (Methods, 'balancing the data') is done by drawing as many non-attack frames at random as each trial
