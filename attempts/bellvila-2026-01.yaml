- claim: efield-1min-medians
  outcome: blocked
  blocked_by: data_missing
  notes: The 1-minute files hold one channel per trial, the stimulation command (a sinusoid whose peak is the current
    in uA, zero outside stimulation). No recording channel is stored, so there is no stimulation artifact to measure.
    The trial parameters (185 trials, printed in the data check) are known from the command. Science Data Bank (doi
    10.57760/sciencedb.32375), which the paper names for its data, answers PERMISSION NO ACCESS without a login.
  notebook: reproduce_bellvila_2026.ipynb
  output: sanity
- claim: efield-20min-median
  outcome: reproduced
  assumed: true
  measured: 1.83
  notebook: reproduce_bellvila_2026.ipynb
  output: claim:efield-20min-median
  notes: Average peak per 40 Hz cycle per channel over the 20 minutes of stimulation of each of the 13 rats, neighbour
    differences over 0.5 mm, vector addition. With the channels laid out row by row and reading (i) taken per 2
    x 2 cell, the median over rats of each rat's mean field (a) is 1.834 mV/mm and the median of all 117 estimates
    (b) is 1.525, both within 1.65 +/- 0.21. Per electrode on the 9 electrodes with a right and a lower neighbour,
    (b) gives 1.648 (within) and (a) 1.890 (outside); per electrode on all 16, using all 24 neighbour pairs, (a)
    gives 1.748 and (b) 1.650, both within. Reading (ii), the largest pair per axis, gives 3.698 (outside). Grubbs'
    test over the pooled cell estimates removes none. A serpentine layout gives 1.848 and 1.589 per cell. The criterion
    takes the claim as reproduced under one reading; (b) matches under every pairing and both layouts tested. The
    outcome depends on the layout. Over 2000 random layouts, (a) per cell is within tolerance in 18% and (b) in
    43%, and over the smoothest 5% of them in 29% and 65%; that 5% is still much rougher than any layout in rows
    (summed roughness at least 22.4, against 13 for row by row and 13.8 for serpentine). A bootstrap over the 117 cell estimates gives a 95% interval
    of 1.310 to 1.777 for (b), half-width 0.234, close to the paper's 0.21; resampling rats gives half-widths of
    0.313 for (b) and 0.522 for (a). The spread between rats is wider than the paper's 0.21, with rat means 0.810
    to 3.052 mV/mm (SD 0.730). In 4 rats 14 of the 208 channels change their artifact by more than half between
    the two halves of the stimulation (the whole first row in two rats); dropping the cells that touch them gives
    1.834 (a) and 1.695 (b). The detected onsets and offsets fall where the 40 Hz line ratio crosses from at most
    310 to at least 2406 (and back to at most 810). The measured value is reading (a), (i) per cell, the first the
    criterion lists. The claims file's opening comment says a claim whose readings give different outcomes is blocked
    as methods_underspecified, while this criterion takes one matching reading; the criterion is followed, and whether
    reading (ii) is the paper's is asked of a reader (questions/001678.yaml).
  deviations:
  - The 4 x 4 layout of channels aw_1 to aw_16 is assumed to be row by row; the files have no electrode positions
    and the paper gives no map. The paper names the maker (Microprobes); its arrays are built to order, and neither
    its catalogue nor TDT's ZIF-Clip and channel-mapping manuals give the map of such an array (searched 2026-11-03).
    The artifact varies smoothly across the grid under this layout (at most 1.35% of 2000 random layouts are as
    smooth in any rat), which supports rows of four; the serpentine order gives the same outcome. Choosing a layout
    for its smoothness tends to lower the neighbour differences, so the random-layout results are shown with the
    outcome. This is the assumption the outcome rests on.
  - Methods 2.8 do not say how a difference along one axis is paired with one along the other for the vector addition.
    Three pairings are run, per 2 x 2 cell, per electrode on the 9 electrodes with a right and a lower neighbour,
    and per electrode on all 16 (the left or upper neighbour at the last column or row); under reading (b) all three
    match, under reading (a) the per-cell and the all-16 pairing.
  - Methods 2.8 do not say over which set Grubbs' test is applied; it is run over all estimates pooled, within each
    rat, and not at all, with the same outcome.
  - The band-pass filter is not named by the paper; a zero-phase order-2 Butterworth of 39 to 41 Hz after decimation
    to 1.2 kHz (Methods 2.5, LFP decimated to 1.2 kHz) is used, the criterion's standard choice. A band of 38 to
    42 Hz changes the peaks by under 1% in the rat checked.
  - The stimulation period is found from the 40 Hz artifact to 1 s, as the files have no epochs; 1 s is dropped
    at each end.
  - The stored values are read as volts, not scaled by the files' conversion factor of 1e-6, which would give fields
    near 1.8e-6 mV/mm.
  - The field is computed from the stored 16-channel stream, which is not low-passed at 300 Hz and in 8 of 13 rats
    not notch-filtered at 60 Hz (Methods 2.3 describe the LFP stream as both); at 40 Hz this makes no difference
    to the artifact.
- claim: fem-depth-falloff
  outcome: blocked
  blocked_by: data_missing
  notes: The finite element model is out of reach. Sim4Life is commercial software, the ViZOO Big Male Rat model
    is licensed by the IT'IS Foundation and is not public, the paper publishes no exported field volume, and the
    linked code holds no FEM script, so the outside input the claim needs is not public. The claim is a ratio of
    fields at two depths, which a linear model keeps under any scaling, so it does not depend on the missing 1-minute
    fields; the model alone blocks it.
