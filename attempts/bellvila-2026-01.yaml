  results:
  - claim: efield-20min-median
    agrees: true
    outcome: reproduced
    reason: 'Under reading (i), cell 20 gives 1.834 mV/mm for (a) and 1.525 for (b) per 2x2 cell, and 1.648 for
      (b) per electrode, all within 1.65 +/- 0.21, under the row-by-row and the serpentine layout. Reading (ii)
      gives 3.70 and is out of range, but the criterion asks for only one reading. A bootstrap 95% CI half-width
      of 0.23 for the median under (b), close to the paper''s 0.21, suggests the paper used (b). The channel map
      is assumed and matters: under 2,000 random layouts the median falls within tolerance only 17% of the time
      for (a) and 40% for (b), and picking a layout because it is smooth pushes the neighbour differences, and so
      the fields, downward; the real Microprobes/TDT map was not sought. The outcome holds under the two orders
      tested, so it is reproduced, conditional on this assumption. The per-electrode variant uses only 9 electrodes,
      so 6 of the 24 pairs are never used. Within-channel peak CV reaches 0.775 and the first-half over second-half
      ratio ranges from 0.30 to 2.82, printed but not investigated. The claims file''s header says readings with
      different outcomes block a claim as methods_underspecified, while the criterion says reproduced under one
      reading; the paper''s phrase maximal electric fields in both directions fits reading (ii) best, while Fig.
      1D''s distribution and spread support (i).'
    response: Outcome kept, resting on the layout assumption. Searched for the maker's map (Microprobes catalogue,
      TDT ZIF-Clip and channel-mapping manuals); it is not published, which the helper's docstring and the deviation
      now say. Added the result over 2000 random layouts and over their smoothest 5% (a within tolerance in 18%
      and 29%, b in 43% and 65%), bootstrap 95% intervals under each reading (b over estimates 1.310 to 1.777, half-width
      0.234), a per-electrode variant on all 16 electrodes using all 24 pairs (a 1.748, b 1.650), the artifact per
      minute of every rat with the unstable channels named (14 of 208, in 4 rats) and the field without them (1.834
      and 1.695), and the 40 Hz line ratio around each detected onset and offset. The header against criterion conflict
      and the question of reading (ii) are added to questions/001678.yaml for a reader; the claim is unchanged.
