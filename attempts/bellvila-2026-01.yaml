findings:
- kind: data_missing
  statement: The 9 files of the 1-minute paradigm hold only the stimulation command channel ('S1r 1', the TDT stream
    uS1r), one series per trial. The multi-unit recordings, the LFP and the stimulation monitor that the paper analysed
    are not in them, so none of the paper's 1-minute findings (the parameter exploration, Tables 1 to 3, Figures
    3 to 10) can be tested.
- kind: data_missing
  statement: No file holds sorted units, although the paper's results rest on SpyKING CIRCUS output. For the 20-minute
    paradigm the recordings could be sorted again, but at about 6.5 minutes per rat in this run, about 85 minutes for the
    13 (68 to 85 in the runs so far); the published spike times would make the 20-minute findings testable.
- kind: data_missing
  statement: The sham recording (one F344 nTg female rat, 80 minutes under propofol) is not in the dandiset.
- kind: metadata_error
  statement: Every series is labelled in volts with a conversion of 1e-6. In the 1-minute files the values are the
    stimulation current in uA (peaks of 49.98 to 399.87 for 50 to 400 uA); in the 20-minute files they are already
    in volts (median magnitude about 0.1 mV, spike troughs about 100 uV), so the conversion would make them a million
    times too small.
- kind: metadata_insufficient
  statement: The 20-minute stream (channels 'aw_ 1' to 'aw_ 16', 12207 Hz) matches neither stream of Methods 2.3.
    It has the LFP's rate but is not low-passed at 300 Hz, and it carries spikes. In 8 of 13 rats the 60 Hz line
    stands 10 to 1099 times above its neighbours, so these are not notch-filtered; in the other five the ratio is
    1.0 to 9.6 (no line at all in sub-2023-05-04 and sub-2023-05-05), so a notch cannot be ruled out there.
    The files and the dandiset description do not say which TDT stream it is or how it was filtered; the description
    gives 24 kHz for all data.
- kind: metadata_insufficient
  statement: The electrodes table has no positions (location 'unknown'), so the 4 x 4 layout of the array, which
    the paper's field estimate needs, is not documented. The 20-minute files have no epochs or stimulation times;
    the stimulation is found only from its artifact. Session descriptions are empty.
- kind: selection_undocumented
  about: data
  statement: The paper gives 20 trials per 1-minute rat; the files hold 15 to 23 (185 in all), with repeats of some
    combinations, three rats missing some of the 16 analysed combinations (one lacks all four at 400 uA), and one
    trial at 100 Hz and 20 uA outside the paper's design. Which trials the paper analysed is not documented.
- kind: other
  about: data
  statement: The 20-minute subjects are 6 male and 7 female in the files; Methods 2.1 say 7 male and 6 female. The
    1-minute subjects (4 male, 5 female) agree with the paper.
- kind: methods_unavailable
  statement: Questions for the paper's authors on the electric field estimate (Methods 2.8). What is the 4 x 4 layout
    of channels 1 to 16 (assumed here row by row)? How are the differences along the two axes paired for the vector
    addition (per 2 x 2 cell or per electrode)? Over which set is Grubbs' test applied? Is the reported median (1.65
    +/- 0.21 mV/mm for the 20-minute experiments) taken over rats or over all channel-pair estimates, and what is
    the +/-? Under the row-by-row layout the readings give 1.53 to 1.89 mV/mm per pair and 3.70 for the largest
    pair per axis; over random layouts the per-cell median of all estimates is within 1.65 +/- 0.21 in 43% of them.
