- claim: fig3e-ghost-fields
  outcome: partially_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig3e-ghost-fields
  notes: For 70 field directions of light-responsive place cells the light peak follows the control peak
    (Pearson r = 0.806, p = 3.9e-17). For 14 light field directions of 7 non-place cells r = 0.321 (p = 0.26).
    In the shuffle variant, 35.7% of unmasked peaks lie within 4.4 cm of the control peak against 14.6% for
    shuffled pairings (p = 0.014), which is closer to the paper's test against shuffles. 8 of the 14 unmasked
    field directions come from sess9.
  deviations:
  - Pearson correlation of peak positions in place of the paper's chi-squared test against 500 shuffles, whose
    details are in the unavailable Methods; a shuffle test is shown as a variant.
- claim: fig3f-light-stability
  outcome: not_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig3f-light-stability
  notes: Light maps are not more stable than control maps between laps 11-60 and 71-120 (place fields 0.664
    against 0.714, light higher in 28 of 70, p = 0.058; unmasked fields 0.187 against 0.527, 6 of 14, p = 0.39).
    Against control maps from as many 20 ms control windows as light windows, place fields 0.664 against 0.602
    (p = 0.68) and unmasked fields 0.187 against 0.293 (p = 0.67). Control maps from stimulated laps only give
    the same medians (p = 0.059 and 0.39), as they must, since dark windows lie only next to deposited pulses. The two-way ANOVA finds an effect of condition (p = 0.046), with light the less stable
    by the medians.
  deviations:
  - Control maps use the windows dark under the stated protocol (19% to 20% of lap time); the paper's control
    epochs were random 20 ms intervals between pulses, shown as a time-matched variant.
  - Wilcoxon tests in place of the paper's two-way ANOVA, which is shown as a variant.
- claim: fig3g-spatial-information
  outcome: partially_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig3g-spatial-information
  notes: Control and light spatial information are correlated for place fields (rho = 0.655, p = 7.6e-10) and
    for unmasked fields (rho = 0.574, p = 0.032). The increase is larger for unmasked fields (median 0.03 against
    -0.03 bits/spike, Kruskal-Wallis p = 0.039), far from the paper's P < 1e-15. Against time-matched control
    maps both correlations hold (place rho = 0.501, p = 1e-05; unmasked rho = 0.609, p = 0.021), but the increase
    is negative in both groups (place -0.10, unmasked -0.17) and does not differ (p = 0.3); as a ratio it does
    not differ either (p = 0.14). The paper's control epochs are random 20 ms intervals between the light pulses,
    which the time-matched variant follows most closely, and the dark-window control maps are themselves a
    revision of the criterion's control (all time with no uLED on). Part 1 holds and part 2 does not. Unmasked
    fields are chosen for a light field and no control field, which favours a larger increase by construction;
    the paper defines its groups the same way. Changed from reproduced after verification round 3 agreed.
  deviations:
  - Control maps use the windows dark under the stated protocol; time-matched control windows are a variant,
    under which the larger increase in unmasked fields does not hold.
- claim: fig4c-swr-cofiring-place-pairs
  outcome: reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig4c-swr-cofiring-place-pairs
  notes: Over 1264 place cell pairs, ripple cofiring is correlated with spatial overlap (rho = 0.060, p = 0.032),
    so part 1 holds, weakly and in sess9 only (0.119, p = 0.0015; sess12 0.019, p = 0.66). Over 698 place and
    non-place pairs the paper's test finds no correlation (rho = 0.062, p = 0.1), so part 2 holds, but the
    coefficient is as large as for place cell pairs. Correlation of participation per ripple gives 0.054 (p
    = 0.056) and 0.072 (p = 0.058).
  deviations:
  - Two sessions of one mouse.
  - Cofiring as the Pearson correlation of spike counts per deposited ripple, a choice made here; the paper's
    measure is in its unavailable Methods.
- claim: fig4d-light-unmasked-cofiring
  outcome: not_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig4d-light-unmasked-cofiring
  notes: Over 231 pairs of light-responsive place and non-place cells, cofiring is not significantly correlated
    with the overlap of light maps (rho = 0.075, p = 0.25; sess9 0.108, p = 0.16; sess12 -0.062, p = 0.65).
    With control maps the same pairs give rho = 0.110 (p = 0.094).
  deviations:
  - Two sessions of one mouse.
- claim: fig1j-light-intensity
  outcome: blocked
  blocked_by: data_missing
  notes: The pulse series hold one value per uLED in each of the two sessions with pulses (19 in sess9, 62623
    to 63599 in sess12, stated as watts), so no pulse has an intensity level, and the other 26 sessions have
