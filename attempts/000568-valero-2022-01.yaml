- claim: fig3c-unmasked-fields
  outcome: not_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig3c-unmasked-fields
  measured: 77.8
  notes: Under reading (a), 7 of 9 light-responsive non-place cells (77.8%, 95% interval 40.0 to 97.2%) have
    a light field, 1.6 points above the tolerance of 69.3 plus or minus 6.9; under reading (b), 6 of 19 non-place
