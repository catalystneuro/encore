- claim: figs9-excitatory-vs-inhibitory-swr
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The units carry no cell type, and the no-raw-data files hold no waveforms. A rate threshold separates
    cells by the very quantity the claim compares, so it was not used for this claim. Waveforms could be taken
    from the raw signal, but the full files are 17 to 54 GB each and six of them have no raw signal. As a proxy
    shown in the notebook, units at or above 5 Hz raise their rate inside ripples less than putative pyramidal
    cells (median log2 ratio 0.75 against 1.19, p = 0.00065); since the ripple gain falls with baseline rate
    within putative pyramidal cells alone (figs10), this split would show the same without interneurons, so
    it does not test the claim.
- claim: fig3h-position-decoding
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The decoder, its spatial bins, time windows and cross-validation are described in the supplement,
    which could not be obtained; the main text and legend do not fix them. The data for it (two sessions with
    laps and pulses) are in the dandiset.
- claim: fig4ef-assemblies
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The ICA assembly detection (bin size, significance of components) and the chance level for spatial
    correlation are in the unavailable supplement. The legend gives only the member threshold of 2 SD. The
    data are in the dandiset for two sessions.
- claim: fig4gh-replay
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The Bayesian decoding of ripples, the template construction and the shuffle are in the unavailable
