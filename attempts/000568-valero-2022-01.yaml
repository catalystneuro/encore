- claim: fig1c-pulse-protocol
  outcome: partially_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig1c-pulse-protocol
  measured: 19.75
  notes: Pulses last 19.87 ms (sess9) and 19.63 ms (sess12). The median interval between pulses of one uLED
    is 0.281 to 0.383 s for the four uLEDs with at least 1000 pulses, within 0.27 to 0.66 s. The median offset
    from the end of one pulse to the start of the next is 60.4 and 80.0 ms, outside 18 to 44 ms; 31.8% and
    30.2% of offsets fall within 20 to 40 ms, and the 95th percentiles are 241 and 328 ms. Most pulses are
    not in the files (5.76 and 7.50 deposited pulses per s in PreStim against about 17 to 25 implied by the
    protocol; in sess9 the offsets fall only near multiples of 20 ms), so the longer offsets span missing pulses
    and the protocol's offsets cannot be measured from the files.
  deviations:
  - Two sessions of 28, the only ones with pulse times.
  - The files hold only part of the pulses, so the offsets between pulses are measured on the deposited ones.
- claim: fig1e-responsive-fraction
  outcome: reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig1e-responsive-fraction
  measured: 72.5
  notes: Under reading (b), all stimulation epochs, 66 of 91 putative pyramidal cells (72.5%, 95% interval
    62.2 to 81.4%) respond to at least one uLED. Under reading (a), the PreStim epoch, 57 of 91 (62.6%, 51.9
    to 72.6%), outside tolerance. Of 364 unit and uLED tests in PreStim, 68 pass all three parts of the test;
    on sham onsets (jittered by up to 200 ms, or moved into BaselinePre) none of 364 passes. For reading (b), with the onsets
    of all stimulation epochs jittered by up to 200 ms, none of 364 tests passes either. No putative pyramidal
    cell on shank Group3 responds (0 of 17), and that shank's uLEDs are likely among those whose pulses are
    not in the files. Without Group3, 57 of 74 (77.0%) under (a), within tolerance, and 66 of 74 (89.2%) under
    (b), above it. The criterion lists (a) first but only (b) matches, so the measured value is that of (b).
  deviations:
  - Two sessions of one mouse (91 putative pyramidal cells), not 822 cells.
  - The response test is the one in the first author's later code (HippoCookBook getuLEDResponse.m), with 500
    bootstrap sets drawn on a 1 ms grid and shared across units, and a minimum of 1000 pulses per uLED in place
    of 2000; the paper's own test is in its unavailable Methods.
  - Which pulses the paper tested is not stated; two readings are shown and the claim matches under reading
    (b) only.
  - Cells near uLEDs whose pulses are not in the files cannot be tested for a response to them.
- claim: fig1i-swr-decrease
  outcome: reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig1i-swr-decrease
  notes: In 57 light-responsive putative pyramidal cells, light minus control rate is 0.30 Hz (median) in windows
    overlapping ripples and 2.68 Hz outside, lower inside in 49 of 57 (Wilcoxon p = 6.8e-09), and in each session
    (p = 7.8e-06 and 9.5e-07). As a ratio, 1.25 inside and 2.89 outside (53 of 56, p = 8.6e-10). The paper's
    n of 485 and P < 1e-55 cannot be reached with two sessions. The control windows, the 20 ms before each
    onset, are dark under the stated protocol, so the missing pulses do not enter them.
  deviations:
  - Two sessions of one mouse.
  - Ripples are the deposited ripple intervals; a window counts as inside a ripple when it overlaps one.
  - Control windows are the 20 ms before each pulse with no uLED on.
- claim: figs10-swr-gain-vs-baseline-rate
  outcome: partially_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:figs10-swr-gain-vs-baseline-rate
  measured: -0.437
  notes: Over 1166 putative pyramidal cells of 24 sessions, the log2 ratio of the rate inside ripples to outside
    is negatively correlated with the baseline rate (rho = -0.437, p = 1.8e-55). It is negative in every subject
    (-0.37 to -0.71) and every session, and significant in all sessions but three (fCamk1 sess13 p = 0.12,
    fCamk3 sess13 p = 0.29, fCamk5 sess14 p = 0.81). This is stronger than -0.19 and outside the tolerance
    of 0.068. The difference reading gives rho = -0.002 (p = 0.95). Without the two sessions in the analysis
    whose ripples fail the clock check (the third has under 50 first-epoch ripples), n = 1055 and rho = -0.468; in the 22 sessions whose first epoch is labelled BaselinePre, -0.450; against the rate outside
    ripples, -0.466.
  deviations:
  - The paper's measure of rate change is in the unavailable supplement; two readings were fixed before the
    analysis and they disagree.
  - The tolerance is the sampling half-width at n = 822, not 10% of the value.
- claim: fig2b-theta-trough-gain
  outcome: not_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig2b-theta-trough-gain
  notes: In 57 light-responsive putative pyramidal cells during laps, the gain is 2.04 Hz in the trough half
    of theta and 2.07 Hz in the peak half (medians), higher at the trough in 22 of 57 cells (Wilcoxon p = 0.14)
    and significant in neither session. In 60-degree bins the gain is largest 30 degrees after the peak (2.13
    Hz). The stored LFP rate is 1250 Hz from 0 s and the LFP ends with the last epoch; ripple-band power at
    44 and 27 deposited ripple peaks inside the Maze epoch is 113 and 78 times its mean; spikes of putative
    pyramidal cells in control windows have a circular mean phase of 128 and 130 degrees, in the trough half;
    the theta-band LFP averaged around onsets deviates by at most 27.1 and 8.5 against a theta-band SD of 406
    and 770.
  deviations:
  - Two sessions of one mouse.
  - The LFP channel (largest ripple power), the theta band (6 to 10 Hz) and the half-cycle split are choices
    made here; the paper's are in its unavailable Methods.
- claim: figs11-place-cell-fraction
  outcome: partially_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:figs11-place-cell-fraction
  measured:
  - 84.2
  - 70.6
  notes: 48 of 57 light-responsive (84.2%, 95% interval 72.1 to 92.5%) and 24 of 34 non-responsive (70.6%,
    52.5 to 84.9%) putative pyramidal cells are place cells; the paper's chi-squared test finds no difference
    (p = 0.20), as in the paper. The non-responsive fraction is within tolerance, the responsive one above
    it. Per session 83% against 56% (sess9) and 86% against 83% (sess12). Over all putative pyramidal cells
    79.1% are place cells. With all time without a deposited pulse as control time and the earlier field rule
    (the round-1 analysis) the fractions are 78.9% and 52.9% with p = 0.018; the control time alone changes
    5 cells, the field rule alone 1, both 11. Some non-responsive cells may respond to uLEDs whose pulses are
    not in the files.
  deviations:
  - Two sessions of one mouse.
  - Place fields follow a port of buzcode's bz_findPlaceFields1D with its defaults, on control maps from the
    windows dark under the stated protocol (the 20 ms before each deposited onset and after each offset), since
    most pulses are not in the files; the paper's standard definition is in its unavailable Methods. The files
    do not follow the protocol exactly (3.2% and 3.8% of deposited offsets in PreStim are under 20 ms), so
    missing pulses may fall in some of these windows.
- claim: fig2e-infield-gain
  outcome: reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig2e-infield-gain
  notes: Over 80 control place fields of 48 light-responsive putative pyramidal cells, gain is 3.95 Hz in the
    field and 1.37 Hz outside (medians), higher in the field for 61 of 80 (Wilcoxon p = 1e-08) and in each
    session (p = 9.5e-07 and 0.0018). As a ratio of light to control the in-field value is lower (2.19 against
    2.77, p = 4.3e-05), so the increase is larger in hertz but not relative to the control rate.
  deviations:
  - Two sessions of one mouse; 80 fields against 553.
  - Control rates come from the windows dark under the stated protocol.
