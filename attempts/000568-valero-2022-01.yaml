- claim: fig3e-ghost-fields
  outcome: partially_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig3e-ghost-fields
  notes: For 61 place fields the light peak follows the control peak (Pearson r = 0.857, p = 1.3e-18).
    For 19 unmasked fields r = 0.310 (p = 0.2). In the shuffle variant, 57.9% of unmasked peaks lie
    within 4.4 cm of the control peak against 14.0% for shuffled pairings (p = 0.002), which is closer
    to the paper's test against shuffles. 15 of the 19 unmasked fields come from one session.
  deviations:
  - Pearson correlation of peak positions in place of the paper's chi-squared test against 500
    shuffles, whose details are in the unavailable Methods; a shuffle test is shown as a variant.
- claim: fig3f-light-stability
  outcome: not_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig3f-light-stability
  notes: Light maps are less stable than control maps between laps 11-60 and 71-120 (place fields 0.675
    against 0.797, light higher in 15 of 61, p = 6.2e-05; unmasked fields 0.278 against 0.610, 7 of 19, p
    = 0.087). Against control maps from as many 20 ms control windows as light windows, the gaps shrink
    and are not significant (0.675 against 0.732, p = 0.95; 0.278 against 0.449, p = 0.71), and light is
    still not more stable.
  deviations:
  - Control maps use all time without light (88% to 90% of lap time); the paper's control epochs were
    20 ms intervals between pulses, shown as a variant.
  - Wilcoxon tests in place of the paper's two-way ANOVA, which is shown as a variant.
- claim: fig3g-spatial-information
  outcome: partially_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig3g-spatial-information
  notes: Control and light spatial information are correlated for place fields (rho = 0.566, p = 2e-06)
    but not significantly for unmasked fields (rho = 0.396, p = 0.093). The increase is larger for
    unmasked fields (median 0.12 against -0.01 bits/spike, Kruskal-Wallis p = 0.0019). Against
    time-matched control maps the increase is negative in both groups (-0.13 and -0.11) and does not
    differ (p = 0.64).
  deviations:
  - Control maps use all time without light; time-matched control windows are a variant, and the
    increase in unmasked fields depends on this choice.
- claim: fig4c-swr-cofiring-place-pairs
  outcome: not_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig4c-swr-cofiring-place-pairs
  notes: Over 961 place cell pairs, ripple cofiring is not correlated with spatial overlap (rho = 0.041,
    p = 0.21), so part 1 fails. Over 887 place and non-place pairs the paper's test finds a correlation
    (rho = 0.112, p = 0.00081), so part 2, a claim of absence, also fails. Correlation of participation
    per ripple gives the same (0.032, p = 0.32; 0.116, p = 0.00051).
  deviations:
  - Two sessions of one mouse.
  - Cofiring as the Pearson correlation of spike counts per deposited ripple, a choice made here; the
    paper's measure is in its unavailable Methods.
- claim: fig4d-light-unmasked-cofiring
  outcome: reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig4d-light-unmasked-cofiring
  notes: Over 290 pairs of light-responsive place and non-place cells, cofiring correlates with the
    overlap of light maps (rho = 0.124, p = 0.035), carried by sess9 (rho = 0.167, p = 0.008; sess12
    -0.132, p = 0.42). The statement implies the relationship appears only with light; with control maps
    the same pairs give rho = 0.191 (p = 0.0011), so that part does not hold.
  deviations:
  - Two sessions of one mouse.
