- claim: fig1km-intracellular
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds extracellular recordings of four mice only; the intracellular recordings in rats
    and head-fixed mice are not in it. The lab's data page lists this dandiset for the paper and otherwise
