outcomes:
- claim: cohort-counts
  outcome: partially_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:cohort-counts
  measured:
  - 4
  - 1351
  - 48.2
  notes: Under reading (a), all 28 sessions, 4 mice and 48.2 putative pyramidal cells per session (SD
    12.18) match, but the total is 1351 against 822. Under reading (b), the 22 sessions naming the uLED
    protocol, 3 mice, 1047 cells and 47.6 per session. 822 cells at 43.3 per session would be about 19
    sessions. With thresholds of 2.5 and 10 Hz the total is 1205 or 1441.
  deviations:
  - Pyramidal cells are units with a baseline rate below 5 Hz, as the files carry no cell type; the
    paper classified cells by other features.
  - The paper does not say which sessions it used; two readings are shown.
- claim: fig1c-pulse-protocol
  outcome: partially_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig1c-pulse-protocol
  measured: 19.75
  notes: Pulses last 19.87 ms (sess9) and 19.63 ms (sess12). The median interval between pulses of one
    uLED is 0.281 to 0.383 s for the four uLEDs with at least 1000 pulses, within 0.27 to 0.66 s. The
    median offset from the end of one pulse to the start of the next is 60.4 and 80.0 ms, outside 18 to
    44 ms; 31.8% and 30.2% of offsets fall within 20 to 40 ms, and the 95th percentiles are 241 and 328
    ms. The same fractions fall within 40 to 60 ms measured onset to onset, the range of the file's
    description. The files hold series for 6 of the probe's 12 uLEDs, which may explain the longer
    gaps; this is not shown.
  deviations:
  - Two sessions of 28, the only ones with pulse times.
- claim: fig1e-responsive-fraction
  outcome: reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig1e-responsive-fraction
  measured: 72.5
  notes: Under reading (b), all stimulation epochs, 66 of 91 putative pyramidal cells (72.5%) respond to
    at least one uLED. Under reading (a), the PreStim epoch, 57 of 91 (62.6%), outside tolerance. Of 364
    unit and uLED tests in PreStim, 68 pass all three parts of the test. The criterion lists (a) first
    but only (b) matches, so the measured value is that of (b).
  deviations:
  - Two sessions of one mouse (91 putative pyramidal cells), not 822 cells.
  - The response test is the one in the first author's later code (HippoCookBook getuLEDResponse.m),
    with 100 bootstrap sets in place of 500 and a minimum of 1000 pulses per uLED in place of 2000; the
    paper's own test is in its unavailable Methods.
  - Which pulses the paper tested is not stated; two readings are shown and the claim matches under
    reading (b) only.
- claim: fig1i-swr-decrease
  outcome: reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig1i-swr-decrease
  notes: In 57 light-responsive putative pyramidal cells, light minus control rate is 0.30 Hz (median)
    in windows overlapping ripples and 2.68 Hz outside, lower inside in 49 of 57 (Wilcoxon p = 6.8e-09),
    and in each session (p = 7.8e-06 and 9.5e-07). As a ratio, 1.25 inside and 2.89 outside (53 of 56,
    p = 8.6e-10). The paper's n of 485 and P < 1e-55 cannot be reached with two sessions.
  deviations:
  - Two sessions of one mouse.
  - Ripples are the deposited ripple intervals; a window counts as inside a ripple when it overlaps one.
  - Control windows are the 20 ms before each pulse with no uLED on.
- claim: figs10-swr-gain-vs-baseline-rate
  outcome: partially_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:figs10-swr-gain-vs-baseline-rate
  measured: -0.437
  notes: Over 1166 putative pyramidal cells of 24 sessions, the log2 ratio of the rate inside ripples to
    outside is negatively correlated with the baseline rate (rho = -0.437, p = 1.8e-55), in every subject
    (-0.37 to -0.71) and every session. This is stronger than -0.19 and outside the tolerance of 0.068.
    The difference reading gives rho = -0.002 (p = 0.95). Without the three sessions whose ripples fail
    the clock check, rho = -0.468.
  deviations:
  - The paper's measure of rate change is in the unavailable supplement; two readings were fixed
    before the analysis and they disagree.
  - The tolerance is the sampling half-width at n = 822, not 10% of the value.
- claim: fig2b-theta-trough-gain
  outcome: not_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig2b-theta-trough-gain
  notes: In 57 light-responsive putative pyramidal cells during laps, the gain is 2.04 Hz in the trough
    half of theta and 2.07 Hz in the peak half (medians), higher at the trough in 22 of 57 cells
    (Wilcoxon p = 0.14) and significant in neither session. In 60-degree bins the gain is largest 30
    degrees after the peak (2.13 Hz).
  deviations:
  - Two sessions of one mouse.
  - The LFP channel (largest ripple power), the theta band (6 to 10 Hz) and the half-cycle split are
    choices made here; the paper's are in its unavailable Methods.
- claim: figs11-place-cell-fraction
  outcome: not_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:figs11-place-cell-fraction
  measured:
  - 78.9
  - 52.9
  notes: 45 of 57 light-responsive (78.9%) and 18 of 34 non-responsive (52.9%) putative pyramidal cells
    are place cells; the paper's chi-squared test finds a difference (p = 0.018) where the paper reports
    P = 0.90. Both sessions show it (71% against 44%, 91% against 61%), as do field peak thresholds of 1
    and 3 Hz. Over all putative pyramidal cells 69.2% are place cells, so the statement that more than
    half are place cells holds.
  deviations:
  - Two sessions of one mouse.
  - Place fields follow buzcode's defaults on control maps of the laps; the paper's standard
    definition is in its unavailable Methods.
- claim: fig2e-infield-gain
  outcome: reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig2e-infield-gain
  notes: Over 64 control place fields of 45 light-responsive putative pyramidal cells, gain is 4.23 Hz
    in the field and 1.01 Hz outside (medians), higher in the field for 51 of 64 (Wilcoxon p = 9.1e-08)
    and in each session (p = 3.8e-07 and 0.0032). As a ratio of light to control the in-field value is
    lower (2.16 against 2.89, p = 0.00038).
  deviations:
  - Two sessions of one mouse; 64 fields against 553.
- claim: figs12-gain-rate-correlations
  outcome: not_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:figs12-gain-rate-correlations
  measured:
  - 0.051
  - -0.065
  notes: Over 64 fields, rho is 0.051 (p = 0.69) for the out-of-field rate and -0.065 (p = 0.61) for the
    home-cage rate, both outside tolerance. With one field per cell, rho is 0.207 for the out-of-field
    rate (within tolerance) and -0.005 for the home-cage rate.
  deviations:
  - Two sessions of one mouse; 64 fields against 553.
- claim: fig3a-place-cells-more-excitable
  outcome: reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig3a-place-cells-more-excitable
  notes: The PreStim light response (best uLED) has a median of 2.07 Hz in 63 place cells and 0.94 Hz in
    28 non-place cells (Kruskal-Wallis p = 0.0041; z-scored p = 0.0021), and holds in both sessions. The
    statement that firing rate does not explain it is not supported here. Among cells below the median
    baseline rate the difference is 1.83 against 1.33 Hz (p = 0.32), and among the faster half 3.08
    against 0.58 Hz (p = 0.0021).
  deviations:
  - Two sessions of one mouse.
- claim: fig3c-unmasked-fields
  outcome: not_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:fig3c-unmasked-fields
  measured: 83.3
  notes: Under reading (a), 10 of 12 light-responsive non-place cells (83.3%) have a light field, above
    the tolerance of 69.3 plus or minus 6.9; under reading (b), 12 of 28 non-place cells (42.9%), below
