findings:
- kind: data_missing
  statement: Light pulse times are deposited for 2 of 28 sessions (fCamk1 sess9 and sess12). Twenty other
    sessions name uLED stimulation in their epochs but hold no pulse series, so their light responses
    cannot be computed. Laps are also in these two sessions only.
- kind: metadata_error
  statement: The OptogeneticSeries are stated in watts but hold one value per uLED, 19 in sess9 and
    62623 to 63599 in sess12, not a light power (the paper gives 0.02 to 0.1 uW). No light intensity per
    pulse is stored, so the paper's three intensities cannot be recovered.
- kind: data_missing
  statement: The files hold pulse series for 6 of the probe's 12 uLEDs (Site3 to Site8), two of them with
    only 120 to 221 pulses.
- kind: other
  statement: Every session is deposited twice, as a full file and a no-raw-data file; in all 28 sessions
    the two hold the same units, spike times, ripples and position. The full file of fCamk3 sess20 is
    named sub-fCamk3_behavior+ecephys+image.nwb, without its session.
- kind: data_missing
  statement: The full file of fCamk3 sess17 is 28 MB and holds 378 s of raw signal and 6850 s of LFP of a
    34621 s session. The six full files of fCamk1 sess13 to sess19 hold the LFP but no raw signal.
- kind: metadata_insufficient
  statement: Units carry no cell type and the no-raw-data files no waveforms, so pyramidal cells and
    interneurons cannot be told apart as in the paper.
- kind: metadata_error
  statement: session_start_time is 2016-03-15 in every file, while the session ids date the recordings
    to 2020 and 2021.
- kind: metadata_error
  statement: The linearized position holds values from 0 to 110 cm (the track length) but has a
    conversion factor of 100, which would put it at 0 to 110 m.
- kind: metadata_insufficient
  statement: Six sessions (fCamk2 sess1 to sess4, fCamk3 sess13, fCamk5 sess10) name their epochs only by
    a time stamp, without behavioral paradigm or manipulation. fCamk2 sessions have no position and 0
    to 1110 ripples.
- kind: selection_undocumented
  statement: The dandiset holds 28 sessions and 1351 units with a baseline rate below 5 Hz, where the
    paper reports 822 pyramidal neurons at 43.3 per session (about 19 sessions). It does not say which
    sessions the paper used. 14 sessions include CNO or DMSO epochs, which the paper does not describe.
- kind: other
  statement: In fCamk3 sess13, fCamk3 sess17 and fCamk5 sess10 the deposited ripple intervals mark
    population bursts weakly (population rate 1.2 to 1.98 times that 1 s later, against at least twice in
    the other 22 sessions with ripples). fCamk5 sess10 has 217 events with a median length of 109 ms.
- kind: paper_inconsistency
  statement: The paper gives randomly variable 20 to 40 ms offsets between pulses, the files' description
    40 to 60 ms. Measured onset to onset, 30% to 32% of intervals fall in 40 to 60 ms; measured end to
    start, the median offset is 60 and 80 ms in the two sessions.
- kind: methods_unavailable
  statement: The paper's Materials and Methods are in its supplement. This attempt could not obtain the
    supplement from PMC or the publisher, and the analysis code the paper names (buzcode) is a general
    toolbox without scripts for its figures.
