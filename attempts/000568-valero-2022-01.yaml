- claim: cohort-counts
  outcome: partially_reproduced
  notebook: reproduce_valero_2022.ipynb
  output: claim:cohort-counts
  measured:
  - 4
  - 1351
  - 48.2
  notes: Under reading (a), all 28 sessions, 4 mice and 48.2 putative pyramidal cells per session (SD 12.18)
    match, but the total is 1351 against 822. Under reading (b), the 22 sessions naming the uLED protocol,
    3 mice, 1047 cells and 47.6 per session. 822 cells at 43.3 per session would be about 19 sessions. With
    thresholds of 2.5 and 10 Hz the total is 1205 or 1441.
  deviations:
