findings:
- kind: data_missing
  statement: Light pulse times are deposited for 2 of 28 sessions (fCamk1 sess9 and sess12). Twenty other sessions
    name uLED stimulation in their epochs but hold no pulse series, so their light responses cannot be computed.
    Laps are also in these two sessions only.
- kind: metadata_error
  statement: The OptogeneticSeries are stated in watts but hold one value per uLED, 19 in sess9 and 62623 to
    63599 in sess12, not a light power (the paper gives 0.02 to 0.1 uW). No light intensity per pulse is stored,
    so the paper's three intensities cannot be recovered.
- kind: data_missing
  statement: The files hold pulse series for 6 of the probe's 12 uLEDs (Site3 to Site8), two of them with only
    120 to 221 pulses, and most pulses of the protocol are missing. In PreStim the deposited pulses come at
    5.76 and 7.50 per s, where the stated protocol implies about 17 to 25; in fCamk1 sess9 the offsets between
    deposited pulses fall only near multiples of 20 ms, the gaps left by missing pulses. No putative pyramidal
    cell on shank Group3 responds to any deposited uLED. Time without a deposited pulse therefore cannot be
    taken as dark.
- kind: other
  statement: Every session is deposited twice, as a full file and a no-raw-data file; in all 28 sessions the
    two hold the same units, spike times, ripples and position. The full file of fCamk3 sess20 is named sub-fCamk3_behavior+ecephys+image.nwb,
    without its session.
- kind: data_missing
  statement: The full file of fCamk3 sess17 is 28 MB and holds 378 s of raw signal and 6850 s of LFP of a 34621
    s session. The six full files of fCamk1 sess13 to sess19 hold the LFP but no raw signal.
- kind: metadata_insufficient
  statement: Units carry no cell type and the no-raw-data files no waveforms, so pyramidal cells and interneurons
    cannot be told apart as in the paper.
- kind: metadata_error
  statement: session_start_time is 2016-03-15 in every file, while the session ids date the recordings to 2020
    and 2021.
- kind: metadata_error
  statement: The linearized position holds values from 0 to 110 cm (the track length) but has a conversion
    factor of 100, which would put it at 0 to 110 m.
- kind: metadata_insufficient
  statement: Six sessions (fCamk2 sess1 to sess4, fCamk3 sess13, fCamk5 sess10) name their epochs only by a
    time stamp, without behavioral paradigm or manipulation. fCamk2 sessions have no position and 0 to 1110
    ripples.
- kind: selection_undocumented
  statement: The dandiset holds 28 sessions and 1351 units with a baseline rate below 5 Hz, where the paper
    reports 822 pyramidal neurons at 43.3 per session (about 19 sessions). It does not say which sessions the
    paper used. 14 sessions include CNO or DMSO epochs, which the paper does not describe.
- kind: other
  statement: In fCamk3 sess13, fCamk3 sess17 and fCamk5 sess10 the deposited ripple intervals mark population
    bursts weakly (population rate 1.2 to 1.98 times that 1 s later, against at least twice in the other 22
    sessions with ripples). fCamk5 sess10 has 217 events with a median length of 109 ms.
- kind: paper_inconsistency
  statement: The paper gives randomly variable 20 to 40 ms offsets between pulses, the files' description 40
    to 60 ms. Measured onset to onset, 30% to 32% of the deposited intervals fall in 40 to 60 ms; measured
    end to start, 30% to 32% fall in 20 to 40 ms, and most others span missing pulses.
- kind: methods_unavailable
  statement: The paper's Materials and Methods are in its supplement. This attempt could not obtain the supplement
    from PMC or the publisher, and the analysis code the paper names (buzcode) is a general toolbox without
    scripts for its figures.
- kind: paper_inconsistency
  statement: The paper reports 822 pyramidal neurons of which 73% of light-responsive and 71% of non-responsive
    neurons were place cells, which leaves about 230 non-place cells, but gives the unmasked fraction as 289
    of 417 non-place cells.
- kind: metadata_insufficient
  statement: The units table of some files lacks the shank column (group_id); columns are spike_times, unit_name,
    clu_id and, in the others, group_id.
verifications:
- date: '2026-10-17'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The first executed notebook with the conclusion cells and the summary removed, the helper
    module and the claims file, with the paper (PMC author manuscript). The verifier did not open NWB files;
    it tested find_fields and a simulated pulse protocol on synthetic inputs and read the archive's asset list.
    Its report had no attempt record and gave its own outcome for each claim; all 22 agree with the record
    as it then stood. The revision changed five outcomes, which round 2 reviews.
  results:
  - claim: cohort-counts
    agrees: true
    outcome: partially_reproduced
    reason: Reading (a), cell 15, 4 mice and a mean of 48.2 per session (within 43.3 ± 8.37), but 1351 pyramidal
      cells against 822 ± 82. Reading (b) has only 3 mice.
    response: No change needed.
  - claim: fig1c-pulse-protocol
    agrees: true
    outcome: partially_reproduced
    reason: Median duration 19.75 ms and per-uLED median intervals of 0.281 to 0.383 s pass. The end-to-start
      gap medians of 60.4 and 80.0 ms fail the 18 to 44 ms band. The likely cause is uLEDs whose pulses were
      not deposited (problem 1).
    response: Added the device and series descriptions, the deposited pulse rate in PreStim (5.76 and 7.50
      per s) and the offsets in 5 and 10 ms bins, which in sess9 fall only near multiples of 20 ms. The conclusion
      now says the longer offsets span missing pulses. Outcome kept.
  - claim: fig1e-responsive-fraction
    agrees: true
    outcome: reproduced
    reason: Reading (b) gives 66/91 = 72.5%, within 74.3 ± 7.4. Reading (a) gives 62.6%, outside. Only 91 cells
      from one mouse. No chance level for the responsiveness test, and N_BOOT is 100 where the source code
      uses 500 (problem 5).
    response: N_BOOT is now 500 (counts unchanged). Added the test on onsets jittered by up to 200 ms and on
      onsets moved into BaselinePre (0 of 364 tests pass), 95% intervals, and responses by shank (none on Group3)
      with the fraction without Group3. Outcome kept.
  - claim: fig1i-swr-decrease
    agrees: true
    outcome: reproduced
    reason: n = 57. Reading (a) has a median paired difference of -2.13 Hz, lower inside ripples in 49/57,
      p = 6.8e-9. Reading (b) also holds, and so does each session. The 20 ms pre-onset control windows stay
      dark under the stated protocol and are unaffected by problem 1.
    response: Stated in the conclusion that the control windows are dark under the protocol. No other change.
  - claim: figs10-swr-gain-vs-baseline-rate
    agrees: true
    outcome: partially_reproduced
    reason: Reading (a) gives rho = -0.437 (p = 1.8e-55), outside -0.19 ± 0.068. Reading (b) gives rho = -0.002.
      Negative and significant, but not within tolerance. The first epoch is used even when unlabelled (problem
      9).
    response: Added the variant restricted to the 22 sessions whose first epoch is labelled BaselinePre (rho
      = -0.450). Outcome kept.
  - claim: fig2b-theta-trough-gain
    agrees: true
    outcome: not_reproduced
    reason: Trough minus peak gain has a median of -0.09 Hz and p = 0.14; in the 6-bin variant the largest
      gain is at +30°. The phase assumes an LFP rate of 1250 Hz and a start at 0 s not read from the file,
      the clock is checked hours before the Maze epoch, and the trough convention and light artifacts are not
      checked (problem 4).
    response: read_lfp now reads and checks the stored rate (1250 Hz) and starting time (0 s); the notebook
      prints them with the raw signal's duration. Added the ripple-power check inside the Maze epoch (113 and
      78 times the mean), the phase of control-window spikes (circular mean 128 and 130 degrees, in the trough
      half) and the theta-band LFP averaged around onsets (at most 27.1 and 8.5 against an SD of 406 and 770).
      Outcome kept.
  - claim: figs11-place-cell-fraction
