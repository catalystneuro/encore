inputs:
- what: Human anti-claudin-1 IHC traces (PeriInnerMask, PeriExtMask, NerveMask, ScaleMask, ScaleLength)
    of the 18 samples, the code's output file CadaverVNMorphology_OutputMetrics.mat (sample list and check
    values), subjects and samples sheets, and the Sunderland and Bradley (1952) table Sunderland1984.mat.
    SPARC:65, 'Quantified morphology of the human vagus nerve with anti-claudin-1', version 6, the version
    the paper's supplement cites as Pelot et al. (2020a); it lists the paper as IsDescribedBy.
  source: doi:10.26275/nluu-1ews
- what: Pig Masson's trichrome per-sample nerve diameters and per-fascicle diameters (files/code/PigVNMorphology_OutputMetrics.mat)
    and the subjects sheet. SPARC:64, 'Quantified morphology of the pig vagus nerve', version 4; the paper's
    Pelot et al. (2020f) by its title.
  source: doi:10.26275/maq2-eii4
- what: Pig anti-fibronectin IF non-peanut fascicle diameters, perineurium thicknesses and tissue proportions
    (files/code/PigIFMorphology.mat), the IF traces for trace counts, SegmentationAnalysis_v2.m and the
    samples sheet. SPARC:89, 'Quantified morphology of the pig vagus nerve with anti-fibronectin', version
    1, the version the paper's supplement cites as Pelot et al. (2020b).
  source: doi:10.26275/8pc2-rhu2
- what: Supplement 4 of the paper, 'Vagus nerve morphology, summary statistics and literature review'
    (Data_Sheet_2.xlsx, SHA-256 2e8f9c6428c14df171dd97a2e378561848060beb0a0a7e3b347288495ef3a6a2), the
    literature values for the two literature claims, from the supplementary files of the version of record
    in Europe PMC (PMC7672126). The supplementary PDF (Data_Sheet_1.pdf) from the same files is read in
    the notebook for Supplement 6 (the age plots) and the legend of Supplementary Figure 16, and was read
    for the references to the SPARC datasets.
  source: doi:10.3389/fnins.2020.601479
outcomes:
- claim: rat-sample-set
  outcome: reproduced
  notebook: reproduce_pelot_2020.ipynb
  output: claim:rat-sample-set
  notes: Nine cervical and nine subdiaphragmatic samples, 4F and 5M at each level, from 10 Sprague-Dawley
    rats (5M, 5F), aged 75 to 268 days, body mass 381.1 +/- 118.4 g (SD, n = 10), as the Methods give.
    Cervical samples are all left. The subdiaphragmatic samples are described in samples.xlsx without
    the side, which only the readme gives as anterior. R18 has only a cervical sample (R18-1) and R26
    only a subdiaphragmatic one, as the Methods describe. No right cervical or posterior samples are deposited
    (the code's lists for them are empty). The 18 PeriMask arrays are all distinct. The readme gives ages
    65 to 268 days, subjects.xlsx 75 to 268.
- claim: nerve-diameter-anova
  outcome: reproduced
  notebook: reproduce_pelot_2020.ipynb
  output: claim:nerve-diameter-anova
  notes: Unbounded REML (subject variance -0.052, residual 0.127) with Kenward-Roger tests on the observed
    information gives species F = 577.0 (p < 0.0001), level F = 11.01 (p = 0.0030) and interaction F
    = 2.4455 (p = 0.1085), against the paper's 577.1, 11.01 (p = 0.0030) and 2.445 (p = 0.1085). On the
    expected information F = 587.3, 11.03 and 2.450 (interaction p = 0.103). The Wald F values are 599.6,
    11.05 and 2.455; with Satterthwaite, residual or subject-based degrees of freedom the interaction p
    is 0.108, 0.097 or 0.104. With the subject variance bounded at zero (statsmodels REML) the interaction is significant
    (F = 3.71, p = 0.024), which would make the claim partially reproduced; an ordinary ANOVA gives p
    = 0.035. The human data are measured here from the traces of SPARC:65 (version
    6) with the paper's method, and match its code's output file exactly; the pig MT values come from
    the per-fascicle output file of SPARC:64 (version 4, files/code/PigVNMorphology_OutputMetrics.mat),
    not from its traces.
  deviations:
  - The Methods fit the mixed models in JMP Pro 14.3.0 and do not give its settings. The fit here is REML
    with unbounded variance components, JMP's default, which statsmodels does not offer, and effects and
    Tukey contrasts are tested with Kenward-Roger F tests and degrees of freedom computed on the observed
    REML information (the Hessian of the REML log-likelihood), written in vagus.py and checked on a balanced
    split-plot design. This is an assumption about the paper's settings, adopted after round 2 because
    it gives the paper's F and p for all nine effects the paper reports (F within 0.4%, p to the digits
    printed, degrees of freedom within 1 of those the paper's F and p imply; nerve diameter 577.0, 11.01
    and 2.4455 against 577.1, 11.01 and 2.445). Kenward-Roger on the expected information (the main test
    in round 2), Satterthwaite, residual and subject-based degrees of freedom and a bounded fit are variants.
  - Human from SPARC:65 and pig from SPARC:64, the paper's Pelot et al. (2020a and f) by their titles;
    the claims file gives no identifiers.
  assumed: true
