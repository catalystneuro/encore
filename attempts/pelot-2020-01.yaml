- claim: peanut-fascicle-counts
  outcome: partially_reproduced
  notebook: reproduce_pelot_2020.ipynb
  output: claim:peanut-fascicle-counts
  measured:
  - 60
  - 44
  - 210
  - 179
  notes: Human traces (SPARC:65) give 60 cervical inner traces with 27 bundles in 10 peanut fascicles
    and 44 subdiaphragmatic with 4 in 2, as the legend says. Pig IF traces (SPARC:89), counted as its
    SegmentationAnalysis_v2.m counts them (hole boundaries included), give 210 cervical with 57 bundles
    in 24 peanut fascicles, where the legend says 25, and 179 subdiaphragmatic with 48 in 19. 11 of 12
    counts match. Counting objects only, the subdiaphragmatic pig traces give 178 (one inner mask has
    a hole). Non-peanut sums 73 and 284, the fits' counts.
  deviations:
  - The pig counts follow SPARC:89's code, which counts hole boundaries of the masks as traces.
- claim: no-age-trend
  outcome: not_reproduced
  notebook: reproduce_pelot_2020.ipynb
  output: claim:no-age-trend
  notes: Of 26 per-species, per-level correlations with age, three have Pearson p < 0.05 (reading a),
    all in pigs; cervical endoneurium proportion r = -0.72 (p = 0.029), subdiaphragmatic nerve diameter
    r = 0.75 (p = 0.019), subdiaphragmatic mean fascicle diameter r = 0.69 (p = 0.039). Spearman (reading
    b) finds one, human subdiaphragmatic mean fascicle diameter (rho = -0.69, p = 0.041). 1.3 would be
    expected by chance; the tests are uncorrected and the pig ages take four values (10.5 to 15 weeks).
    The rat part shows no trend.
  deviations:
  - Supplement 6 (Europe PMC supplementary PDF) is a figure with no test, so the paper's judgement is
    visual; the tests are the claims file's.
  - Human ages '90+ years' entered as 99, as DataExtraction_v3.m does.
  assumed: true
