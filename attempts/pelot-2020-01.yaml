- claim: fascicle-diameter-anova
  outcome: reproduced
  notebook: reproduce_pelot_2020.ipynb
  output: claim:fascicle-diameter-anova
  notes: log10 of 60 + 44 human, 422 + 344 pig and 9 + 9 rat fascicle diameters. Species F = 9.74 (p =
    0.0011), level F = 48.0 (p < 0.0001), interaction F = 5.46 (p = 0.0085); paper 8.989 (p = 0.0015),
    51.88, 5.273 (p = 0.0121). With the code's rat values F = 9.13 (p = 0.0015), 53.6 and 5.79 (p = 0.0069).
    The bounded fit agrees.
  deviations:
  - The Methods fit the mixed models in JMP Pro 14.3.0 and do not give its settings. The fit here is REML
    with unbounded variance components, JMP's default, which statsmodels does not offer, written in vagus.py;
    effects are tested by Wald F with Satterthwaite denominator degrees of freedom in place of JMP's Kenward-Roger.
    This is an assumption about the paper's settings.
  - The rat largest fascicle is the largest by endoneurial area, as the Methods say (Imaging and Image
    Analysis, paragraph 2). The paper's code (DataPlotting_v4.m) takes the first inner trace in its order,
    which differs in R22-1 and R23-1; the code's values, which Supplement 4's summaries show the paper
    used, are run as a variant.
