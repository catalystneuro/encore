- claim: perineurium-no-level-difference
  outcome: not_reproduced
  notebook: reproduce_pelot_2020.ipynb
  output: claim:perineurium-no-level-difference
  notes: Reading (a) the 95% bounds of the level-wise fits do not overlap for the human slope (0.0318
    [0.0248, 0.0388] cervical against 0.0558 [0.0494, 0.0622] subdiaphragmatic) nor for the pig intercept
    (5.26 [4.14, 6.39] against 3.16 [2.67, 3.65] um); both rat coefficients overlap. Reading (b) agrees,
    human p = 2.4e-07, pig p = 3.1e-09, rat p = 0.87. The rat part, testable on the dataset alone, holds.
  deviations:
  - The paper names no test for 'did not suggest a difference'; the tests are the claims file's.
  assumed: true
