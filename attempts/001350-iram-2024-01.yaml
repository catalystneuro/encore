- claim: fig2c-cc-percent-myelinated
  outcome: blocked
  blocked_by: other
  notebook: reproduce_iram_2024.ipynb
  output: claim:fig2c-cc-percent-myelinated
  notes: The claim's test is an unpaired t test on per-mouse values of 5 SRF-Flox and 5 SRF-cKO mice (Figure
    2C to 2E legends; Methods, Data Analysis and Statistics). The raw images of all 10 mice are in the
    dandiset (1779 to 4535 um2 per mouse), but the paper's hand scoring is not, and the masks cover one
    SRF-Flox mouse, so the test cannot be run as the claim states; Welch's test is undefined and Student's
    test would borrow the cKO variance for the Flox group. The values the masks give are shown in the
    notebook and below; they do not decide the outcome. sub-370 (Flox) has 26.3% of its 3,842 counted
    axons myelinated (26.3% to 28.2% over readings O2 and O4), below the expected 37 +/- 3.7%. The cKO
    mean over four mice is 14.3% (14.3% to 18.9%), below the expected 22 +/- 2.2%, and lower than the
    Flox mouse under all 8 combinations; Student p for one Flox mouse against the cKO mice is 0.13 to
    0.20. With images as units (2 Flox, 8 cKO) Student p is 0.014 and 0.036, Welch p 0.12 and 0.19.
  deviations: &id001
  - The paper scored and measured axons by hand in Fiji; the dataset's segmentation masks (AxonDeepSeg
    pseudo-labels corrected by hand, made after the paper) stand in for that scoring (reading O1 of the
    claims file).
  - The masks cover 9 full images and 2 small regions, from one SRF-Flox mouse (sub-370) and four SRF-cKO
    mice (sub-372, sub-373C, sub-374, sub-375), where the paper used 5 mice per genotype; sub-373C has
    15 um2.
