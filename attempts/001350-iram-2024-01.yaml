findings:
- kind: data_missing
  statement: The paper's hand scoring of the corpus callosum TEM (axons counted, diameters and myelin thickness)
    is not deposited. The dandiset holds the raw images of all 10 mice and segmentation masks made later for a segmentation
    project, which cover 8 full images and 2 small regions from 5 mice, only one of them SRF-Flox. The paper's per-mouse
    comparisons of Figure 2C to 2E and Fig. S3C and S3D cannot be repeated from the dandiset.
- kind: data_missing
  statement: Only the adult corpus callosum TEM of the paper is in the dandiset. The optic nerve TEM (Fig. S2),
    immunostaining, RNAscope, RT-PCR and culture imaging are not, and the paper names no other deposit for them;
    14 of its findings cannot be tested.
- kind: metadata_error
  statement: The archive's summary gives 16 samples, where samples.tsv lists 86 (one per image, including two crops),
    and lists no species; participants.tsv gives the species as 'mus muculus'.
- kind: selection_undocumented
  statement: The dataset does not say which images were segmented or why, nor how its images relate to the paper's
    stitched 8 x 8 montages; image sizes differ by mouse (1482 to 5712 pixels a side). The two regions of sub-373C
    are exact crops of its sample-0001 at the README's coordinates, read as (column, row).
- kind: format_error
  statement: The axon-and-myelin mask of sub-373C chunk-01 is stored as grey with alpha and codes axon as 254 and
    255, where the other masks are single-channel with axon 255. In the cKO images up to 51,098 pixels (0.23% of
    an image) are in both the myelinated and the unmyelinated axon masks; in the Flox images none are.
- kind: paper_inconsistency
  statement: The Results say SRF regulates actin assembly genes and not genes that regulate actin disassembly, citing
    Fig. S4E and S4F, without naming an exception; Fig. S4F shows Cfl1, a main disassembly gene, lower in SRF-KO
    oligodendrocytes (p 0.007), and GEO's counts agree (log2FC -0.78, padj 0.024).
- kind: methods_unavailable
  statement: 'Question for the authors: how were the 329 high-confidence SRF peaks selected? ''Consistently across
    replicates'' gives 204 peaks when read as all replicates of a group, 312 as a majority and 404 as at least two
    (each without an IgG peak); a majority without the IgG filter gives 329. Dataset S1 lists 800 peaks by group,
    not the 329.'
- kind: methods_unavailable
  statement: 'Question for the authors: which genes were kept before the DESeq2 tests of the bulk RNA-seq? The paper''s
    normalized counts show tximport''s length offsets, and its tables list 13481 and 14851 genes where 21688 and 27261
    have counts. With the offsets, the DESeq2 vignette''s pre-filter gives 156 and 263 differentially expressed genes
    and no filter 133 and 266.'
- kind: methods_unavailable
  statement: 'Question for the authors: which motif and threshold defined the CArG-containing target genes of Figure
    3D, and which peaks (per cell type consensus or high-confidence)? FIMO with the JASPAR SRF matrix on each cell
    type''s peaks gives 43 shared genes, against 60 in the paper; other readings give 7 to 133.'
- kind: methods_unavailable
  statement: 'Question for the authors: what is the unit of Figure 2D, and which genes are the ''myelin genes''
    found not to be SRF targets? The dataset''s masks give 0.82 to 1.09 myelinated axons per um2 in the mice with
    whole images, about half of the values the claims file reads from the figure in that unit.'
- kind: paper_inconsistency
  statement: The Results give 157 and 264 differentially expressed genes (padj < 0.05) in OPCs and oligodendrocytes;
    the paper's own DESeq2 tables (Datasets S2 and S3) hold 154 and 261.
