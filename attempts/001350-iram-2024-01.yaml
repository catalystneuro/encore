- claim: fig3a-chip-peaks
  outcome: partially_reproduced
  notebook: geo_sequencing_claims.ipynb
  output: claim:fig3a-chip-peaks
  measured: 848
  notes: GEO's SRF consensus peak file (GSE241559) holds 848 peaks, the paper's number; this is a count of the deposited
    file, not a re-analysis of the reads. No reading of the high-confidence set is adopted, so measured holds only
    the 848. The high-confidence count depends on the reading of 'consistently across
    replicates within the same group and not in the IgG control'. With IgG peaks left out, peaks in all replicates
    of a group (OPC 4 of 4 or OLG 3 of 3) number 204 or 206, in a majority (3 of 4, 2 of 3) 312 or 316, inside 329
    +/- 32.9, and in at least two 404 or 409. A majority without the IgG filter gives 329, but the paper excludes
    peaks in the IgG control. The paper's Dataset S1 lists 800 peaks in three sheets (OPC high 389, Common 351,
    OL high 60); 799 of them are peaks present in at least one replicate of the group and in no IgG control, so
    it holds no set of 329 that would settle the reading. The 848 holds; the 329 holds under one of three replicate
    rules, and the most literal reading of 'consistently', all replicates, gives 204. Changed from reproduced (resting
    on the majority reading) after verification round 1. The question is asked of the authors (finding).
  deviations:
  - The paper does not say how many replicates make 'consistently', nor which IgG peaks are excluded. Every reading
    is shown; none is adopted, as the paper's text does not single one out and the paper's peak lists (Dataset S1)
    do not hold the 329 peaks.
  - Read from GEO's processed nf-core outputs, not re-derived from the reads; GEO files are not versioned, and the
    SHA-256 of each file is printed in the notebook.
- claim: fig3bc-chip-tss-carg
  outcome: reproduced
  assumed: true
  notebook: geo_sequencing_claims.ipynb
  output: claim:fig3bc-chip-tss-carg
  notes: 545 of 848 peaks (64.3%) are within 2 kb of a TSS by HOMER's annotation (the paper's tool), and 76.0% of
    the high-confidence peaks. In the -250 to +250 window around each peak centre, FIMO matches of the JASPAR SRF
    matrix MA0083.3 (p < 1e-4) are in 10.7% of peaks, against 5.2% of flank windows 3 kb away (odds 2.2, Fisher
    p < 0.0001) and 3.7% of shuffled peaks (p < 0.0001); in OPC peaks 8.9% against 5.2% (p = 0.0007), in OLG peaks
    14.4% against 4.3%. The strict consensus CC(A/T)6GG gives 9.8% against 3.0% and 2.4%. The consensus with one
    mismatch is not enriched over all peaks (38.9% against 36.7%, p = 0.28) or OPC peaks (p = 1.0), only in OLG
    peaks (p = 0.014). Peak windows are GC-richer than flank windows (0.546 against 0.449); within GC quintiles
    the enrichment over flanks stays (Mantel-Haenszel odds ratio 2.14 for FIMO, 2.75 for the strict consensus),
    and the shuffled background keeps each peak's composition.
  deviations:
  - 'The paper found its motif with MEME-ChIP, whose motif discovery is not run; FIMO is run with the JASPAR SRF
    matrix in place of the motif MEME-ChIP reported. Assumed: the paper''s ''SRF CArG consensus'' is the SRF matrix
    or the strict CC(A/T)6GG box, both of which are enriched; the one-mismatch variant is this attempt''s own looser
    reading, not one the paper names, and is not enriched over all peaks.'
  - '''Most'' is read as more than half.'
- claim: fig3d-shared-carg-targets
  outcome: partially_reproduced
  assumed: true
  notebook: geo_sequencing_claims.ipynb
  output: claim:fig3d-shared-carg-targets
  measured: 43
  notes: 'With FIMO matches of the SRF matrix and each cell type''s peaks as the Methods define them (present in
    at least one replicate), 43 CArG target genes are shared between OPC and OLG, 49.4% of the 87 genes of either
    group, so ''roughly half'' holds and the count is outside 60 +/- 6. Egr1, Egr2, Egr3, Fos, Junb, Srf, Actb,
    Actg1 and Vcl, named in the paper, are all shared; Arc has no OPC peak. With the paper''s own peak lists by
    group (Dataset S1) FIMO gives 42 shared of 85. Over twelve readings (three motif readings, four peak sets) the
    shared count is 7 to 133, and one reading gives a count inside the tolerance (56): the consensus with one mismatch,
    a reading of this attempt''s own, on the majority high-confidence peaks, which drops Fos, Junb, Srf and Vcl
    from the shared genes.'
  deviations:
  - 'The paper used FIMO matches of the motifs MEME-ChIP found and does not say which motif or threshold; FIMO is
    run here with the JASPAR SRF matrix at its default p < 1e-4. Assumed: the Methods'' per cell type consensus
    (''peaks present in at least one replicate of the respective cell type'') is the peak set of Figure 3D, and
    FIMO''s default threshold.'
  - Genes are HOMER's nearest genes of the peaks, as annotated in GEO's file.
- claim: fig4ab-rnaseq-degs
  outcome: reproduced
  assumed: true
  notebook: geo_sequencing_claims.ipynb
  output: claim:fig4ab-rnaseq-degs
  measured:
  - 156
  - 263
  notes: DESeq2 (pydeseq2, default settings) on the RSEM gene results of GSE241560, KO against Flox per stage. The
    paper's normalized counts (Datasets S2 and S3, one stage each) are the expected counts divided by DESeq2's normalization
    factors from tximport's average-length offsets, computed per stage; with those factors the normalized counts here
    equal the paper's in every sample (spread of the log ratio over genes 0.0 to four decimals, median ratio 1.0001
    and 1.0023), where size factors alone leave a spread of 0.09 to 0.21. So the paper used offsets (reading d).
    With the offsets and the DESeq2 vignette's pre-filter (at least 10 counts over a stage's samples), 156 genes
    have padj < 0.05 in OPCs (82 up, 74 down) and 263 in oligodendrocytes (92 up, 171 down), inside 157 +/- 15.7
    and 264 +/- 26.4. They share 145 and 238 genes with the paper's tables, which hold 154 and 261 (Jaccard 0.88
    and 0.83); p-values rank alike (Spearman 0.9996 and 0.998) and baseMean ratios are 1.000. Without a filter
    the offsets give 133 (outside the tolerance) and 266. Other readings, in this run, give 160 and 264 (b, length-scaled
    counts), 118 and 293 (a, rounded expected counts) and 130 and 418 (c, one model of all 15 samples). The round-2
    run gave 117 and 294 for (a) and 130 and 423 for (c) with the same code and packages; a fit repeated on one machine
    is identical, and 15 to 44 genes per reading have padj between 0.045 and 0.055, so the difference most likely
    comes from the processor.
  deviations:
  - pydeseq2, the Python port of DESeq2, is used, as R is not available here. pydeseq2 takes only per-sample size
    factors; srf_geo.deseq_offsets puts DESeq2's gene-by-sample normalization factors where DESeq2 uses them (normalized
    counts, per-gene fits, Wald test). Given pydeseq2's own size factors it reproduces plain pydeseq2 exactly (printed).
  - 'The paper''s tables list 13481 and 14851 genes, against 21688 and 27261 with any count here, so genes were filtered
    before testing by a rule the paper does not state. Assumed: the DESeq2 vignette''s pre-filter (sum of counts at
    least 10). The outcome rests on it: without a filter the OPC count, 133, is outside the tolerance.'
