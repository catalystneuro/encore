findings:
- kind: data_missing
  statement: The paper's hand scoring of the corpus callosum TEM (axons counted, diameters and myelin
    thickness) is not deposited. The dandiset holds the raw images of all 10 mice and segmentation masks
    made later for a segmentation project, which cover 9 full images and 2 small regions from 5 mice,
    only one of them SRF-Flox. The paper's per-mouse comparisons of Figure 2C to 2E and Fig. S3C and S3D
    cannot be repeated from the dandiset.
- kind: data_missing
  statement: Only the adult corpus callosum TEM of the paper is in the dandiset. The optic nerve TEM (Fig.
    S2), immunostaining, RNAscope, RT-PCR and culture imaging are not, and the paper names no other deposit
    for them; 14 of its findings cannot be tested.
- kind: metadata_error
  statement: The archive's summary gives 16 samples, where samples.tsv lists 86 (one per image, including
    two crops), and lists no species; participants.tsv gives the species as 'mus muculus'.
- kind: selection_undocumented
  statement: The dataset does not say which images were segmented or why, nor how its images relate to
    the paper's stitched 8 x 8 montages; image sizes differ by mouse (1482 to 5712 pixels a side). The
    two regions of sub-373C are exact crops of its sample-0001 at the README's coordinates, read as (column,
    row).
- kind: format_error
  statement: The axon-and-myelin mask of sub-373C chunk-01 is stored as grey with alpha and codes axon
    as 254 and 255, where the other masks are single-channel with axon 255. In the cKO images up to 51,098
    pixels (0.23% of an image) are in both the myelinated and the unmyelinated axon masks; in the Flox
    images none are.
- kind: paper_inconsistency
  statement: The Results say SRF regulates actin assembly genes and not actin disassembly genes, citing
    Fig. S4E and S4F; Fig. S4F shows Cfl1, the main disassembly gene, lower in SRF-KO oligodendrocytes
    (p 0.007), and GEO's counts agree (log2FC -0.78, padj 0.024).
- kind: methods_unavailable
  statement: 'Question for the authors: how were the 329 high-confidence SRF peaks selected? ''Consistently
    across replicates'' gives 204 peaks when read as all replicates of a group, 312 as a majority and
    404 as at least two (each without an IgG peak); a majority without the IgG filter gives 329. This
    attempt assumed the majority reading.'
- kind: methods_unavailable
