- claim: fig3a-chip-peaks
  outcome: reproduced
  assumed: true
  notebook: geo_sequencing_claims.ipynb
  output: claim:fig3a-chip-peaks
  measured:
  - 848
  - 312
  notes: GEO's SRF consensus peak file (GSE241559) holds 848 peaks, the paper's number. The high-confidence
    count depends on the reading of 'consistently across replicates within the same group and not in the
    IgG control'. Peaks in all replicates of a group (OPC 4 of 4 or OLG 3 of 3) without an IgG peak number
    204 (206 with each group's own IgG); in a majority (3 of 4, 2 of 3) 312 or 316, inside 329 +/- 32.9;
    in at least two 404 or 409. Without the IgG filter the majority reading gives 329 exactly. The majority
    reading is adopted. The question is asked of the authors (finding).
  deviations:
  - 'The paper does not say how many replicates make ''consistently'', nor which IgG peaks are excluded.
    Assumed: a majority of the group''s replicates, and no overlap with the IgG consensus peaks. Requiring
    all replicates ties the OLG set to its weakest replicate (OLG R2 has 47 peaks against 436 and 172),
    and ''consistently'' asks for more than two of four; the majority is the middle reading. The other
    readings give 204 to 206 and 404 to 409, outside the tolerance, so the outcome rests on this choice.'
  - Read from GEO's processed nf-core outputs, not re-derived from the reads; GEO files are not versioned,
    and the SHA-256 of each file is printed in the notebook.
- claim: fig3bc-chip-tss-carg
  outcome: reproduced
  assumed: true
  notebook: geo_sequencing_claims.ipynb
  output: claim:fig3bc-chip-tss-carg
  notes: 545 of 848 peaks (64.3%) are within 2 kb of a TSS by HOMER's annotation (the paper's tool), and
    76.0% of the high-confidence peaks. In the -250 to +250 window around each peak centre, FIMO matches
    of the JASPAR SRF matrix MA0083.3 (p < 1e-4) are in 10.7% of peaks, against 5.2% of flank windows
    3 kb away (odds 2.2, Fisher p < 0.0001) and 3.7% of shuffled peaks (p < 0.0001); in OPC peaks 8.9%
    against 5.2% (p = 0.0007), in OLG peaks 14.4% against 4.3%. The strict consensus CC(A/T)6GG gives
    9.8% against 3.0% and 2.4%. The consensus with one mismatch is not enriched over all peaks (38.9%
    against 36.7%, p = 0.28) or OPC peaks (p = 1.0), only in OLG peaks (p = 0.014).
  deviations:
  - 'The paper found its motif with MEME-ChIP, whose motif discovery is not run; FIMO is run with the
    JASPAR SRF matrix in place of the motif MEME-ChIP reported. Assumed: the paper''s ''SRF CArG consensus''
    is the SRF matrix or the strict CC(A/T)6GG box, both of which are enriched; the one-mismatch variant,
    a looser CArG-like box, is not enriched over all peaks.'
  - '''Most'' is read as more than half.'
- claim: fig3d-shared-carg-targets
  outcome: partially_reproduced
  assumed: true
  notebook: geo_sequencing_claims.ipynb
  output: claim:fig3d-shared-carg-targets
  measured: 43
  notes: 'With FIMO matches of the SRF matrix and each cell type''s peaks as the Methods define them (present
    in at least one replicate), 43 CArG target genes are shared between OPC and OLG, 49.4% of the 87 genes
    of either group, so ''roughly half'' holds and the count is outside 60 +/- 6. Egr1, Egr2, Egr3, Fos,
    Junb, Srf, Actb, Actg1 and Vcl, named in the paper, are all shared; Arc has no OPC peak. Over nine
    readings (three motif readings, three peak sets) the shared count is 7 to 133, and one reading gives
    a count inside the tolerance (56: the consensus with one mismatch on the majority high-confidence
    peaks).'
  deviations:
  - 'The paper used FIMO matches of the motifs MEME-ChIP found and does not say which motif or threshold;
    FIMO is run here with the JASPAR SRF matrix at its default p < 1e-4. Assumed: the Methods'' per cell
    type consensus (''peaks present in at least one replicate of the respective cell type'') is the peak
    set of Figure 3D, and FIMO''s default threshold.'
  - Genes are HOMER's nearest genes of the peaks, as annotated in GEO's file.
- claim: fig4ab-rnaseq-degs
  outcome: reproduced
  assumed: true
  notebook: geo_sequencing_claims.ipynb
  output: claim:fig4ab-rnaseq-degs
  measured:
  - 160
  - 264
  notes: DESeq2 (pydeseq2, default settings) on the RSEM gene results of GSE241560, KO against Flox per
    stage. With length-scaled counts (tximport's lengthScaledTPM, reading b) 160 genes have padj < 0.05
    in OPCs (85 up, 75 down) and 264 in oligodendrocytes (99 up, 165 down), inside 157 +/- 15.7 and 264
    +/- 26.4. Rounded expected counts (reading a) give 118 and 293; one model of all 15 samples (reading
    c) gives 130 and 418; both outside the tolerance.
  deviations:
  - 'The Methods say DESeq2 performed ''normalization for transcript length and sequencing depth'' with
    standard settings, without saying how lengths entered. Assumed: the length correction is built into
    the counts (reading b); tximport''s offsets are not available in pydeseq2. The outcome rests on this
    choice, as readings (a) and (c) fall outside the tolerance.'
  - pydeseq2, the Python port of DESeq2, is used, as R is not available here.
- claim: fig4cd-rnaseq-srf-actb-down
  outcome: reproduced
  assumed: true
  notebook: geo_sequencing_claims.ipynb
  output: claim:fig4cd-rnaseq-srf-actb-down
  notes: Under readings (a) and (b) Srf and Actb are lower in KO with padj < 0.05 in OPCs and oligodendrocytes
    (reading b, log2FC Srf -4.82 and -1.48, Actb -0.41 and -1.43). Under the joint model (c), Actb in
