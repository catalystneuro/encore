- claim: fig2a-threshold-decrease
  outcome: reproduced
  notebook: reproduce_kim_2026.ipynb
  output: claim:fig2a-threshold-decrease
  measured:
  - 5.39
  - 3.88
  - 46
  - 89
  notes: psignifit thresholds at the default grid (the current at 50% of the fitted function, mean of block thresholds
    per channel and session, weeks 0 to 4, six mice) have medians of 5.39 uA early (n = 46) and 3.88 uA late (n = 89),
    both within tolerance (late 3.78 to 4.62), and late is lower (two-sided Mann-Whitney p = 5.32e-06, r = 0.39; paper
    p = 7.68e-6, r = 0.40). The early n is within 43 +- 4; the late n of 89 is one above 80 +- 8, an expected value the
    criterion does not judge. psignifit's unscaled threshold gives 5.41 and 3.84 uA. The bounded maximum likelihood variant,
    not the criterion's fit, gives late medians of 3.71 (mu) and 3.70 uA (x50), below the tolerance, with p = 4.9e-07
    and 5.15e-06. Without Mouse 6, 5.17 and 3.91 uA (p = 7.61e-05). Every mouse is lower late.
  deviations:
  - Thresholds are refitted with psignifit 4.3 (Python), sigmoid norm, yes/no, at psignifit's default grid. The threshold
    is the current at which the fitted (scaled) function reaches 0.5, as the criterion says and as the paper's code takes
    it (processing/dataloader.py, get_block_detection_threshold, ps.getThreshold(result, 0.5), XieLuanLab/icms-activation-plasticity
    at d1922d1). The paper's code calls an older psignifit. The dataset stores no thresholds.
  - Blocks are the 100-trial groups of the volumetric trials; the planar fifth block is left out as the Methods count
    four blocks (Methods, Analysis of behavioral data). 38 channel-sessions have two blocks and 4 have one or three.
  - Mouse 6 (ICMS83) has no catch trials in its files, so its fits have no 0 uA point.
