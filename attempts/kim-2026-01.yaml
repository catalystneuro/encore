  assumed: true
- claim: figs1e-response-times-decrease
  outcome: reproduced
  notebook: reproduce_kim_2026.ipynb
  output: claim:figs1e-response-times-decrease
  notes: Median over mice of the per-mouse median hit response time at 4 to 6 uA is 274.9 ms in week 0, 199.2 in week
    1 and 193.9 over the late phase; 93% of the fall (75.7 of 81.0 ms) is between weeks 0 and 1. From the train onset,
    265.4 and 186.8 ms (93%). Variant, hit trials early against late, 190.1 against 173.8 ms, p = 7.19e-17, r = -0.14.
  deviations:
  - The dataset's response_time is from trial start, which precedes the train onset by 5.5 to 37 ms in most sessions,
    0 in Mouse 6 and 56 to 85 ms in ICMS101 2023-10-27; the time from train onset is shown as a variant and gives the
    same result.
  - Currents 4 to 6 uA, as the common method of the claims file fixes.
- claim: figs5c-wheel-onset-decrease
  outcome: reproduced
  notebook: reproduce_kim_2026.ipynb
  output: claim:figs5c-wheel-onset-decrease
  notes: Per-animal thresholds (11.8 to 14.5 a.u.) give median onsets of 119.0 ms in Mouse 1, 133.0 ms over all hit trials
    and 128.0 ms in the late phase, all within tolerance; early 144.0 ms (n = 1307) against late 128.0 ms (n = 2897),
    p = 6.09e-32, r = -0.23 (paper n 1305 and 2922, r = -0.22). The pooled threshold gives 118.0, 134.0 and 129.0 ms
    and p = 1.94e-29. The 568 of 4772 hit trials with no onset are the 568 with no stored wheel trace; every hit trial
    with a trace has an onset.
  deviations:
  - The paper takes the response threshold from hit and miss trials; the dataset's miss trials have no response time
    except 98, so the threshold is taken from hit trials, with those 98 added as a variant (same thresholds).
  - The stored wheel_position_processed is already low-passed at 20 Hz forward and backward (its description), so no
    filter is applied again.
  - Onset is measured from the train onset of the electrical_stimulation table.
