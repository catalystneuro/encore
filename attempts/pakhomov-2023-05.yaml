- claim: fig5a-trains-stronger
  outcome: partially_reproduced
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig5a-trains-stronger
  notes: Along the e1 to e3 diagonal (4 packet and 4 train dishes, 000686), trains exceed packets
    at the e1 end (3.03 times, p = 0.0093) and in the centre (2.02 times, p = 0.0034), and the
    train profile falls from the e1 end to the centre (18094 against 7086 a.u., unpaired
    p = 0.0015, paired p = 0.0076), in all 16 readings. At the e3 end the trains are 0.75 times
    the packets (p = 0.40) in the main reading and not stronger in any reading, so the uptake is
    not stronger throughout the array. The full train profile is shown.
  deviations:
  - The files do not say which needle is e1. e1 is taken as the needle whose outer quarter of
    the half-diagonal is brightest in the train dishes (only e1 is energized with trains); it is
    the upper right needle in all four train dishes and in all four packet dishes, and is used
    for both groups.
  - ROIs rebuilt from Methods 2.4 on electrode squares found in the images, at an assumed pixel
    size of 0.65 um (10x objective, ORCA-Flash4 camera, Methods 2.4); the files give none.
- claim: fig5a-packet-center-enhanced
  outcome: partially_reproduced
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig5a-packet-center-enhanced
  notes: Reading (a) of the enhancement holds in all 16 readings, the packet centre being above
    the trough on the e1 side (3512 against 1326 a.u. at 1.03 mm; p = 0.016 paired, 0.017
    unpaired). Reading (b) does not hold (centre over e1 end 0.89 for packets against 0.40 for
    trains, p = 0.10). The second part fails in every reading, the e1 end being above the centre
    without significance (5968 against 3512 a.u., p = 0.39 unpaired, 0.47 paired); in 2 of the 4
    dishes the centre is the brighter.
  deviations:
  - e1 as in fig5a-trains-stronger; ROIs rebuilt from Methods 2.4 at an assumed 0.65 um pixel.
- claim: fig5b-rotation-center-peak
  outcome: reproduced
  assumed: true
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig5b-rotation-center-peak
  notes: The 1P x 40 centre is above its trough in all 48 readings (2526 against 1050 a.u. at
    2.13 mm; p = 0.0028 unpaired, 0.016 paired; 5 dishes per group). The 1T x 40 void, read as
    the centre below the most peripheral ROI (5376 against 11473 a.u.), holds by the unpaired
    test in all readings (main p = 0.019) and by the paired test in 71% (main p = 0.055). The
    centre ROI is the lowest point of the 1T x 40 profile in 8% of readings (main reading lowest
    at 0.21 mm). With the paired test the claim holds in 79% of readings.
  deviations:
  - Assumed that comparisons inside the same dishes are unpaired (O8 b), because Methods 2.4
    judges every comparison in the figures by the gap between the error bars of the compared
    groups, which treats them as independent groups. The paired reading is shown.
  - ROIs rebuilt from Methods 2.4 at an assumed 0.65 um pixel.
- claim: fig5c-normalized-contrast
  outcome: reproduced
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig5c-normalized-contrast
  notes: Normalized centre 213% for 1P x 40 against 57% for 1T x 40 (Student p = 0.0088, Welch
    p = 0.018). Significant in all 32 readings; the 1P x 40 centre is above 100% in all of them.
  deviations:
  - ROIs rebuilt from Methods 2.4 at an assumed 0.65 um pixel.
- claim: fig6a-more-packets-more-uptake
  outcome: partially_reproduced
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig6a-more-packets-more-uptake
  notes: 000875 holds 3 dishes per treatment, all at 3.2 kV in the small array (O11). Uptake
    rises from 4 to 20 to 40 packets at the most peripheral ROI (558, 3515, 9472 a.u.), the
    trough (458, 1189, 1567) and the centre (726, 2366, 5800), and 40 exceed 4 at each place
    (p = 0.0027, 0.0014, 0.00015), in all 48 readings. The centre is significantly above the
    trough for 10Px4 (unpaired p = 0.00029) but not for 1Px4 (p = 0.16, significant in 10% of
    unpaired readings) or 5Px4 (p = 0.14, 4%). The criterion's partial outcome names only a rise
    at one or two places; here the rise holds at all three and the peak test fails for two
    treatments, which is read as partial.
  deviations:
  - ROIs rebuilt from Methods 2.4 at an assumed 0.65 um pixel.
