- claim: fig5a-trains-stronger
  outcome: not_reproduced
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig5a-trains-stronger
  notes: Along the e1 to e3 diagonal (4 packet and 4 train dishes, 000686), trains exceed packets at the
    e1 end (3.03 times, p = 0.0093) and in the centre (2.02 times, p = 0.0034), and the train profile
    falls from the e1 end to the centre (18094 against 7086 a.u., paired p = 0.0076, unpaired p = 0.0015),
    in all 16 readings. At the e3 end the trains are 0.75 times the packets (p = 0.40) in the main reading
    and not stronger in any reading. The criterion requires all three places and names no partial outcome,
    so the claim is not reproduced. The e3 end ROIs lie inside the image and are 2.0 to 4.2 times the
    dish's cell-free level in the train dishes (2.2 to 5.0 in the packet dishes), with no pixel at or
    below it; YO-PRO-1 cannot tell unaffected cells from bare glass.
  deviations:
  - The files do not say which needle is e1. e1 is taken as the needle whose outer quarter of the half-diagonal
    is brightest in the train dishes (only e1 is energized with trains); it is the upper right needle
    in all four train dishes and in all four packet dishes, and is used for both groups.
  - ROIs rebuilt from Methods 2.4 on electrode squares found in the images, at an assumed pixel size of
    0.65 um (10x objective, ORCA-Flash4 camera, Methods 2.4); the files give none.
- claim: fig5a-packet-center-enhanced
  outcome: partially_reproduced
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig5a-packet-center-enhanced
  notes: Reading (a) of the enhancement holds by the paired test (O8) in all 16 readings, the packet centre
    being above the trough on the e1 side (3512 against 1326 a.u. at 1.03 mm; p = 0.016 paired, 0.017
    unpaired). Reading (b) does not hold (centre over e1 end 0.89 for packets against 0.40 for trains,
    p = 0.10). The second part fails in every reading, the e1 end being above the centre without significance
    (5968 against 3512 a.u., p = 0.47 paired, 0.39 unpaired); in 2 of the 4 dishes the centre is the brighter.
  deviations:
  - e1 as in fig5a-trains-stronger; ROIs rebuilt from Methods 2.4 at an assumed 0.65 um pixel.
