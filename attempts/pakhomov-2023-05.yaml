findings:
- kind: data_missing
  statement: None of the five dandisets holds the single-cell time-lapse images of Fig. 4 (Methods
    2.2) or the electric field simulations of Fig. 3, so six of the paper's claims cannot be
    tested.
- kind: metadata_insufficient
  statement: The files give no pixel size (ImageSeries resolution is -1 in 000686 and 000875 and
    1 or 96 in the other three, with no field of view), no electrode positions, no ROIs, no array size
    and no position of electrode e1. All have to be inferred from the images. An assumed 0.65 um
    pixel gives a large-array diagonal of 8.25 mm between needle edges (paper 8.4 mm).
- kind: metadata_insufficient
  statement: 17 files of 001025 and 001028 hold a second frame (described as Channels FITC, DAPI)
    that no description explains. It shows dark marks at the upper needles.
- kind: metadata_error
  statement: The subject species of 000686 and 000875 is NCBITaxon 9913 (Bos taurus) for CHO
    cells, which are Chinese hamster (NCBITaxon 10029, as given in the other three dandisets).
- kind: metadata_error
  statement: In 001027 the dishes labelled Protocol 3 (Packet 3) give the highest normalized centre
    of the three packets in every reading, the targeting the paper reports for Packet 2. With the
    Protocol 2 and Protocol 3 labels exchanged, Packet 2 is highest and the paper's 183, 83 and
    74% are matched within 10% under 15 readings. The labels of these two packets may be
    exchanged; this is a possibility the images support, not a proof.
- kind: other
  statement: Six dishes are deposited twice with identical pixel data, in two dandisets each
    (000875 dishes 23, 24, 25 as 001025 sub-23, sub-24, sub-25 obj-1of0oop; 001025 sub-04, 07, 11
    as 001028 sub-04, 07, 11), consistent with their use in two figures. No dandiset holds a
    duplicate inside itself.
- kind: selection_undocumented
  statement: 001025 holds 4 small-array dishes at 2.4 kV and 2 large-array dishes at 4.8 kV, where
    the paper gives n = 3 for Fig. 7; which dishes the paper used is not stated.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) How were the 92 or 224 ROIs laid out (per
    diagonal or split over both diagonals), and how wide were they? (2) How was the geometric
    centre located, especially with electrodes lifted 2 and 3 mm, where no footprint shows? (3)
    Was a background subtracted from the monolayer images, and are the a.u. values of the text
    (215 to 235 a.u. in the Fig. 8 centre) raw pixel values of the deposited images? (4) Were
    comparisons within the same dishes (centre against periphery or trough) paired or unpaired?
    (5) Which needle in the images is e1? (6) Were values in the text read from ROI means or from
    the LOESS fits, and with what span? The attempt ran every reading the claims file lists and
    took the first of each as the main reading.
