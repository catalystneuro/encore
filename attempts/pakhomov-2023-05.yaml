- claim: fig6a-more-packets-more-uptake
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig6a-more-packets-more-uptake
  notes: 000875 holds 3 dishes per treatment, all at 3.2 kV in the small array (O11). Uptake rises from
    4 to 20 to 40 packets at the most peripheral ROI (558, 3515, 9472 a.u.), the trough (458, 1189, 1567)
    and the centre (726, 2366, 5800), and 40 exceed 4 at each place (p = 0.0027, 0.0014, 0.00015), in
    all 48 readings. By the paired test the centre is above the trough for 10Px4 in 83% of readings (main
    p = 0.0024) but for 1Px4 in none (main p = 0.20) and for 5Px4 in 8% (p = 0.13); for every treatment
    in none, paired or unpaired. The criterion's partial outcome names only a rise at one or two places;
    here the rise holds at all three and the peak test fails for two treatments, which is read as partial.
    This gap is asked of a reader (questions/pakhomov-2023.yaml). With the diagonals (O2) varied the peak
    test still fails for every treatment in all 6 supported readings.
  deviations:
  - The criterion gives no outcome for a rise at all three places with the peak test failing for some
    treatments. It is read as partially reproduced, an assumption, since the rise holds and part of the
    claim's statement does not.
  - ROIs rebuilt from Methods 2.4 at an assumed 0.65 um pixel.
  - Where the readings of a test disagree, the outcome is the one all the supported readings give (ROI
    width w1, a standard choice; the ROI on the centre; per-dish normalization; raw intensity; per-dish
