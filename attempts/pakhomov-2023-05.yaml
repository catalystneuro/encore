- claim: fig7b-targeting-independent-of-amplitude
  outcome: reproduced
  assumed: true
  notebook: reproduce_pakhomov_2023.ipynb
  output: claim:fig7b-targeting-independent-of-amplitude
  notes: Voltages 2.4, 3.2, 4.0, 4.8 and 5.6 kV (4, 3, 3, 3, 3 dishes). In the main reading no
    pair of voltages differs at the centre or half-way (20 tests, smallest p = 0.052, 2.4 against
    4.8 kV at the centre). Over 96 readings no pair differs in 26%, in 2% without background
    subtraction and 50% with it; the others find one to six pairs. The normalized centre at 4.8 kV
    is 229% (dishes 136, 232, 318%) against 117 to 129% at the other voltages. Both variants find
    a difference, a two-way ANOVA over all ROIs (voltage F = 27.85) and the error-bar rule (3 of
    20 pairs). The outcome is fragile.
  deviations:
  - The readings disagree. The outcome rests on the main reading (92 or 224 ROIs per diagonal,
    square ROIs, both diagonals, the ROI on the centre, the mean of the end ROIs, per-dish
    normalization, raw intensity), each the first reading of the claims file and the one closest
    to the text of Methods 2.4, which mentions no background for the monolayers.
