findings:
- kind: other
  about: data
  statement: In the deconvolved attention files each attentive condition (human, vehicle) is z-scored
    per voxel within the condition, while the passive TRs are not. With the attention state coded
    -1, 0, +1 in states.hdf, its regression weight is the difference of the two attentive means,
    which is zero (1e-14 in all five subjects), so the attention dimension of the paper's state
    space cannot be recovered from the deposited files; the third axis is set by rounding and the
    CSIs move by up to 0.1 with it.
- kind: metadata_insufficient
  statement: The data description does not say how the third column of states.hdf codes the
    attention condition; the files use -1 for attend-humans, 0 for passive and +1 for
    attend-vehicles.
- kind: metadata_error
  statement: The S1 video game data hold 1950 TRs (65 min at the 2.0045 s TR), where the data
    description and the paper say one subject played for 90 minutes (six 15-min runs). S7's 1320
    TRs (44 min) match the stated 45 minutes.
- kind: data_missing
  statement: No mapper matches the S1 video game data, which have 73,594 voxels; the S1 mapper has
    51,608 voxels, the voxel set of S1's attention data. S1's game weights cannot be placed on
    fsaverage or the flatmap with the files given.
- kind: data_missing
  statement: The functional ROIs, and the localizer and retinotopic mapping data the paper used to
    define them, are not in the data set, so the cortical claims of Figures 2 and 4 cannot be
    tested by region.
- kind: other
  about: data
  statement: The S7 video game BOLD (float32) is not z-scored per voxel over the session (voxel SDs
    0.094 to 1.009, means -0.059 to 0.025), unlike S1's, which is exactly z-scored; the paper says
    responses were normalized to zero mean and unit variance.
- kind: methods_unavailable
  statement: Question for the paper's authors. The attention variable has zero weight in the
    deposited deconvolved data (attentive conditions z-scored per condition), so the third axis
    of the attention state space, and with it the CSIs, depends on rounding. Was the paper's
    analysis run on these files, and how was the attention dimension defined? This attempt adopted
    the axis the published code gives and showed the plane and random third axes as readings.
- kind: methods_unavailable
  statement: Question for the paper's authors. For the video game state space, in what order were
    the nine variables entered into the QR decomposition? The safe-explore position of engage-close
    TRs in S7 is negative and significant with the data set's column order and near zero with the
    order of Table 1. This attempt adopted the column order.
- kind: methods_unavailable
  statement: Question for the paper's authors. For the passive-against-attentive test (p < 1e-5 in
    five of six subjects), what was compared (each attentive condition or their mean) and how
    were labels permuted? In S1 and S6 the attend-humans CSI is below the passive one, in the
    paper's figures and here.
