outcomes:
- claim: fig1-csi-s2
  outcome: reproduced
  assumed: true
  notebook: reproduce_zhang_2021.ipynb
  output: claim:fig1-csi-s2
  measured:
  - 0.740
  - 0.718
  - 0.676
  notes: With the paper's code run on the full voxel data (R3), S2's CSIs are 0.740 (attend-humans),
    0.718 (attend-vehicles) and 0.676 (passive), each within tolerance and above every one of 1000
    null values under both permutation readings (p <= 0.001, the bound reached; the paper reports
    p < 1e-5). The median over random third axes (R2) gives 0.723, 0.718 and 0.657, also within
    tolerance. In the human-vehicle plane alone (R1) attend-humans is 0.664, outside tolerance.
    Over random third axes the attend-humans CSI ranges from 0.683 to 0.784 (5 to 95%).
  deviations:
  - Assumed that the third axis of the attention state space is the one the paper's code gives. In
    the deposited deconvolved data the attentive conditions are z-scored per voxel within each
    condition, so the attention variable (-1, 0, +1) has an OLS weight of 1e-14, and the third QR
    direction is set by rounding. The code is the paper's method and the paper's values were
    presumably computed the same way; three readings are shown (code, random third axes, plane),
    and the outcome holds under the first two.
  - Permutations 1000 per reading of the claims file, so p reaches 0.001 and not 1e-5.
  - The state space is computed exactly in the space of the 24 PCs (helper docstring); the code
    itself is run for the observed values, and the human and vehicle axes of both agree to
    |r| = 1.0000.
- claim: att-csi-group
  outcome: reproduced
  assumed: true
  notebook: reproduce_zhang_2021.ipynb
  output: claim:att-csi-group
  measured:
  - 0.665
  - 0.729
  - 0.525
  notes: Over the five released subjects (R3) the mean CSIs are 0.665 +/- 0.103, 0.729 +/- 0.022 and
    0.525 +/- 0.260 for attend-humans, attend-vehicles and passive, within the paper's spreads.
    Under group reading (b) each mean exceeds the maximum of 1000 mean null CSIs (at most 0.110).
    Under reading (a) every subject is significant at the bound in the attentive conditions but
    S3's passive CSI (0.061) does not exceed every null value. R2 gives 0.658, 0.728 and 0.523; R1
    gives 0.602, 0.675 (outside tolerance) and 0.492. The means of the paper's own per-subject
    values over these subjects are 0.644, 0.728 and 0.512.
  deviations:
  - Five of the paper's six subjects; S4 is not released.
  - Same assumption about the third axis as fig1-csi-s2.
