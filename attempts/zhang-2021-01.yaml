- claim: game-weights-two-groups
  outcome: blocked
  blocked_by: data_missing
  notes: The criterion needs region definitions (TPJ, precuneus, prefrontal, motor, premotor and
    supplementary motor cortex, IPS, FEF, SEF) from the paper's ROIs, which are not deposited
