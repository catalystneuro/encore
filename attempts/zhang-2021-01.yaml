- claim: att-passive-lower
  outcome: not_reproduced
  notebook: reproduce_zhang_2021.ipynb
  output: claim:att-passive-lower
  measured: 2
  notes: At the threshold 1000 permutations allow (the difference above every null value, p <=
    0.001), the passive CSI is significantly lower in 2 of 5 subjects under reading (a) with the
    code's positions (S3, S5), and 2 or 3 under reading (b), for every null (refitted or not) and
    both permutation schemes; the criterion needs 4 of 5. At p < 0.05 the counts are at most 3
    (R3) and at most 4 (R1, reading b, matched, refitted). In S1 and S6 attend-humans is below
    passive (0.518 against 0.622; 0.603 against 0.652), as in the paper's own figure values for
    these subjects, and the mean attentive CSI is within 0.006 of passive. S2's differences are
    0.065 and 0.043 (p 0.002 to 0.075). Measured is the count under reading (a), null (i), matched
    permutation.
  deviations:
  - Five of six subjects; S4 is not released.
  - How condition labels are permuted is not fixed by the paper; two schemes were run (matched by
    movie frame, and global), and the outcome is the same under both.
  - Permutations 1000, so the bound reached is 0.001 and not the paper's 1e-5.
- claim: att-classification
  outcome: reproduced
  notebook: reproduce_zhang_2021.ipynb
  output: claim:att-classification
  measured: 44.4
  notes: Mean accuracy over the five subjects is 44.4% (contiguous folds, Euclidean), 53.4%
    (contiguous, density), 46.6% (random, Euclidean) and 56.3% (random, density), against 48.4 +/-
