  - Held-out positions are z-scored with the training statistics, a standard choice the claims
    file names.
- claim: att-weights-cortex
  outcome: blocked
  blocked_by: data_missing
  notes: The criterion compares mean weights in the subjects' functional ROIs (FFA, OFA, EBA, RSC,
    PPA, OPA and others), which the paper drew from functional localizer and retinotopic mapping
    data (Methods, Preprocessing and Visualization, paragraph 2). The data set's 39 files hold no
    ROI, localizer or retinotopy data, and the paper's code repository (gallantlab/state-space at
    6ffb3c3) holds none. A group atlas on fsaverage would substitute for the paper's per-subject
    ROIs, which is not an input the paper relies on, so none was used. The mappers to fsaverage
    are present for S1 to S7.
