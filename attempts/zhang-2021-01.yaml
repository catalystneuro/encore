outcomes:
- claim: fig1-csi-s2
  outcome: reproduced
  assumed: true
  notebook: reproduce_zhang_2021.ipynb
  output: claim:fig1-csi-s2
  measured:
  - 0.743
  - 0.721
  - 0.675
  notes: With the paper's code run on the full voxel data (R3), S2's CSIs are 0.743 (attend-humans), 0.721 (attend-vehicles)
    and 0.675 (passive), each within tolerance and above every one of 1000 null values under both permutation readings
    (p <= 0.001, the bound reached; the paper reports p < 1e-5). The median over random third axes (R2) gives 0.723,
    0.718 and 0.657, also within tolerance, and over random third axes the attend-humans CSI ranges from 0.683 to
    0.784 (5 to 95%), within tolerance throughout. In the human-vehicle plane alone (R1) attend-humans is 0.664,
    outside tolerance. The code's own attention coefficients are about 1e-13 in norm (human and vehicle about 1e2),
    so its third axis is set by rounding and the R3 values move slightly between runs (0.740, 0.718, 0.676 in the
    first run).
  deviations:
  - Assumed that the third axis of the attention state space is the one the paper's code gives. In the deposited
    deconvolved data the attentive conditions are z-scored per voxel within each condition, so the attention variable
    (-1, 0, +1) has an OLS weight of 1e-14, and the third QR direction is set by rounding. The code is the paper's
    method and the paper's values were presumably computed the same way; three readings are shown (code, random
    third axes, plane), and the outcome holds under the first two.
  - Permutations 1000 per reading of the claims file, so p reaches 0.001 and not 1e-5.
  - The state space is computed exactly in the space of the 24 PCs (helper docstring); the code itself is run for
    the observed values, and the human and vehicle axes of both agree to |r| = 1.0000.
