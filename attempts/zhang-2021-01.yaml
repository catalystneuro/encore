- claim: fig3b-state-relations
  outcome: reproduced
  notebook: reproduce_zhang_2021.ipynb
  output: claim:fig3b-state-relations
  notes: Under every sign, order, Bonferroni and null-centre reading, S1 has 44 to 48 and S7 20 to 33 significant
