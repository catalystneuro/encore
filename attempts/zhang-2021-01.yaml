- claim: att-passive-lower
  outcome: not_reproduced
  notebook: reproduce_zhang_2021.ipynb
  output: claim:att-passive-lower
  measured: 2
  notes: At the threshold 1000 permutations allow (the difference above every null value, p <= 0.001), the passive
    CSI is significantly lower in 2 of 5 subjects under reading (a) with the code's positions (S3, S5), and 2 or
    3 under reading (b), for every null (refitted or not) and both permutation schemes; the criterion needs 4 of
    5. At p < 0.05 the counts are at most 3 (R3) and at most 4 (R1, reading b, matched, refitted). In S1 and S6
    attend-humans is below passive (0.515 against 0.620; 0.605 against 0.651), as in the paper's own figure values
    for these subjects, and the mean attentive CSI is within 0.010 of passive (p 0.30 to 0.51). S2's mean difference,
    0.057, lies above its null's 99th percentile (0.042 to 0.055) and below or near its maximum (0.052 to 0.084),
    p 0.001 to 0.010. Null (ii), computed as the observed values are, gives the same counts as the refitted null
    (i). Measured is the count under reading (a), null (i), matched permutation.
  deviations:
  - Five of six subjects; S4 is not released.
  - How condition labels are permuted is not fixed by the paper; two schemes were run (matched by movie frame, and
    global), and the outcome is the same under both.
  - Permutations 1000, so the bound reached is 0.001 and not the paper's 1e-5.
- claim: att-classification
  outcome: reproduced
  notebook: reproduce_zhang_2021.ipynb
  output: claim:att-classification
  measured: 43.7
  notes: Mean accuracy over the five subjects is 43.7% (contiguous folds, Euclidean), 53.8% (contiguous, density),
    46.6% (random, Euclidean) and 56.3% (random, density), against 48.4 +/- 7.6%; three readings are within tolerance
    and all exceed every one of 1000 mean null accuracies (maxima 9.7 to 12.5%). Chance under this procedure (null
    mean) is 7.8 to 9.1%, close to the paper's 8.3%. Per subject 39.9 to 60.6%. The first run gave 44.4% and 53.4%
    for the contiguous readings with the same code and seeds; the cause was not traced, the likeliest being rounding
    in the third axis of each fold's state space.
  deviations:
  - Five of six subjects; S4 is not released.
  - Held-out positions are z-scored with the training statistics, a standard choice the claims file names.
- claim: att-weights-cortex
  outcome: reproduced
  assumed: true
  notebook: reproduce_zhang_2021.ipynb
  output: claim:att-weights-cortex
  measured: 4
  notes: With the encoding-model threshold (ii), the human-presence weight is positive and above the vehicle-presence
    weight in FFA, OFA and EBA, and the reverse holds in RSC, PPA and OPA, in 4 of 5 subjects under each weight
    reading (OLS B, denoised B_L, Q_S); S2 fails in EBA (human 0.335, vehicle 0.416 with B, no threshold). Without
    a threshold (i) the pattern holds in 3 of 5 under each reading, EBA failing in S2 and S3 (B, B_L) or S1 and
    S2 (Q_S). FFA, OFA, RSC, PPA and OPA hold in all five subjects under every reading, so the outcome rests on
    EBA and on the threshold; LOS-bodies alone holds in 5 of 5 under (ii). Of the other named regions, MT+ (4 of
    5) and LO (4 or 5) follow the human-presence dimension and IPS (5 of 5) the vehicle-presence dimension; SEF
    (2), FEF (2 or 3), FO (1 to 3) and IFS (2 or 3) are mixed. Measured is the count under threshold (ii) with the
    OLS weights, the first reading that matches.
  deviations:
  - Assumed that group-atlas regions on fsaverage can stand in for the paper's per-subject localizer ROIs, which
    are not public; the claims file leaves this to the author and names an fsaverage atlas through the data set's
    mappers. FFA (mFus and pFus faces), OFA (IOG-faces), EBA (LOS, ITG and MTG bodies), PPA (CoS-places), OPA (TOS-places,
    right hemisphere only) and MT+ (hMT) from visfAtlas (Rosenke et al. 2021), whose authors relate the fusiform
    face areas to the FFA, the lateral body areas to the EBA and CoS-places to the PPA; RSC, LO, FO, IFS, IPS, FEF
    and SEF from HCP-MMP1.0 areas of the same names. Other definitions of the body, face and place areas are shown
    as variants.
  - 'The WordNet model of threshold (ii) follows the paper''s deconvolution model (Methods, Deconvolution of the
    Hemodynamic Response in the Attention Task: WordNet labels, FIR delays 1 to 4 TRs, ridge with 10-fold cross-validation),
    fitted on the non-deconvolved BOLD of the three conditions for the voxels the regions reach. The ridge parameter
    is one per subject, the one with the highest mean prediction correlation (an assumption; the paper does not
    say), and a voxel passes when the correlation of its held-out prediction has one-sided p < 0.05 by the t distribution
    (the claims file leaves the test open).'
  - Five of the paper's six subjects; S4 is not released.
- claim: game-csi
  outcome: reproduced
  notebook: reproduce_zhang_2021.ipynb
  output: claim:game-csi
  measured:
  - 0.702
  - 0.581
  notes: With one cluster per state from TRs with exactly one state (reading b), the CSI is 0.702 (S1) and 0.581
    (S7), within tolerance of 0.72 and 0.62 and above every one of 1000 null values (maxima 0.270 and 0.258). With
    multi-membership clusters (reading a) S1 is 0.694 and S7 0.549, just below tolerance (0.558); with the three
    groups of Figure 3A (reading c) 0.513 and 0.388. All are above their nulls. Clusters with no more TRs than dimensions
    are left out (S1 flash under a and b, S1 kill and S7 run away and kill under b). With the labels one TR later,
    where the CSI peaks in both subjects, readings (a) and (b) are within tolerance in both subjects (S1 0.728 and
    0.760, S7 0.566 and 0.583) and reading (c) is not; the paper does not say whether the game labels were shifted.
  deviations:
  - S7 has no flash TRs, so its state space has 8 dimensions.
  - The S1 video game data hold 65 min, where the paper reports 90 min for one subject.
