- claim: game-weights-two-groups
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_zhang_2021.ipynb
  output: claim:game-weights-two-groups
  notes: 'Only S7 can be tested by region: S1''s video game data (73,594 voxels) match no mapper in the data set,
    current or superseded, so S1 and the consistency between subjects could not be tested. In S7, three to five
    of the eight dimensions fail the grouping under every reading, where one may fail: dead, safe explore and unsafe
    explore under every reading, and engage far, run away, round start or engage close under some (4 fail with OLS
    or denoised weights and no threshold, 3 with the Bonferroni threshold, 5 with Q_S under either order). Safe
    explore has negative OLS weights in all nine regions (-0.008 to -0.240). Since the criterion asks for the pattern
    in both subjects, failing in S7 decides the outcome. In the variant not taken from the paper, the correlation
    of S1''s denoised weight maps across voxels splits the nine dimensions into exactly the paper''s two groups,
    while S7''s split into safe and unsafe explore against the rest.'
  deviations:
  - Assumed HCP-MMP1.0 areas on fsaverage for the regions the paper names (TPJ as TPOJ1-3, PGi and PGs; precuneus
    as 7m, PCV, POS2, 31pd and 31pv; prefrontal as the dorsolateral, inferior frontal, orbital and polar and medial
    prefrontal areas of Glasser et al. 2016; motor 4; premotor 6a, 6d, 6v, 6r, 55b and PEF; supplementary motor
    6ma and 6mp; IPS as IPS1, IP0-2, LIPv, LIPd, VIP, MIP and AIP; FEF; SEF as SCEF), in place of the paper's ROIs,
    which are not public.
  - Threshold (ii) uses the nine-state OLS model, 10 contiguous folds, one-sided t test of the prediction correlation,
    Bonferroni over all of the subject's voxels, as the claims file names it. A dimension counts when its mean weight
    is positive in each of its group's regions and the mean over them is above the mean over the other group's regions;
    a stricter variant is shown.
  - S1 could not be placed on the cortex; S7 has no flash dimension.
findings:
- kind: other
  about: data
  statement: In the deconvolved attention files each attentive condition (human, vehicle) is z-scored per voxel
    within the condition, while the passive TRs are not. With the attention state coded -1, 0, +1 in states.hdf,
    its regression weight is the difference of the two attentive means, which is zero (1e-14 in all five subjects),
    so the attention dimension of the paper's state space cannot be recovered from the deposited files; the third
    axis is set by rounding and the CSIs move by up to 0.1 with it.
- kind: metadata_insufficient
  statement: The data description does not say how the third column of states.hdf codes the attention condition;
    the files use -1 for attend-humans, 0 for passive and +1 for attend-vehicles.
- kind: metadata_error
  statement: The S1 video game data hold 1950 TRs (65 min at the 2.0045 s TR), where the data description and the
    paper say one subject played for 90 minutes in six 15-min runs. The correlation of consecutive TRs drops to
    -0.44 to -0.48 exactly at TRs 325, 650, 975, 1300 and 1625, so the data are six blocks of 325 TRs (10.9 min
    each), the 325-volume run length the paper gives for its acquisitions. S7's 1320 TRs (44 min) match the stated
    45 minutes.
- kind: data_missing
  statement: No mapper matches the S1 video game data, which have 73,594 voxels; the S1 mapper has 51,608 voxels,
    the voxel set of S1's attention data, and the superseded mappers in Mappers/old have 81,137 (S1), 84,038 (S5)
    and 86,842 (S6). S1's game weights cannot be placed on fsaverage or the flatmap with the files given.
- kind: data_missing
  statement: The functional ROIs, and the localizer and retinotopic mapping data the paper used to define them,
    are not in the data set, so the cortical claims of Figures 2 and 4 cannot be tested on the paper's regions;
    this attempt used public fsaverage atlases through the data set's mappers.
- kind: other
  about: data
  statement: The S7 video game BOLD (float32) is not z-scored per voxel over the session (voxel SDs 0.094 to 1.009,
    means -0.059 to 0.025), unlike S1's, which is exactly z-scored; the paper says responses were normalized to
    zero mean and unit variance.
- kind: methods_unavailable
  statement: Question for the paper's authors. The attention variable has zero weight in the deposited deconvolved
    data (attentive conditions z-scored per condition), so the third axis of the attention state space, and with
    it the CSIs, depends on rounding. Was the paper's analysis run on these files, and how was the attention dimension
    defined? This attempt adopted the axis the published code gives and showed the plane and random third axes as
    readings.
- kind: methods_unavailable
  statement: Question for the paper's authors. For the video game state space, in what order were the nine variables
    entered into the QR decomposition? The safe-explore position of engage-close TRs in S7 is negative and significant
    with the data set's column order and near zero with the order of Table 1. This attempt adopted the column order.
- kind: methods_unavailable
  statement: Question for the paper's authors. For the passive-against-attentive test (p < 1e-5 in five of six subjects),
    what was compared (each attentive condition or their mean) and how were labels permuted? In S1 and S6 the attend-humans
    CSI is below the passive one, in the paper's figures and here.
- kind: methods_unavailable
  statement: Question for the paper's authors. Were the video game state labels shifted in time against the BOLD,
    which is not deconvolved? The CSI peaks with the labels one TR later in both subjects (S1 0.729 against 0.691
    at lag 0). This attempt used the labels as stored.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which encoding models and tests set the voxel thresholds of Figures
    2 and 4, and how was the ridge parameter of the WordNet deconvolution model chosen? The attention cortical claim
    holds in 4 of 5 subjects with a WordNet-model threshold and in 3 of 5 without one. This attempt chose one ridge
    parameter per subject by mean prediction correlation and a one-sided t test of the correlation.
