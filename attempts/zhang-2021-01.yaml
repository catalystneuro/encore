- claim: game-classification
  outcome: partially_reproduced
  notebook: reproduce_zhang_2021.ipynb
  output: claim:game-classification
  measured:
  - 46.5
  - 33.8
  notes: Every reading is above its null (p = 0.001; chance under this procedure 10.8 to 16.4%, against the paper's
    11%). S7 is within 30.4 +/- 4.2% with contiguous folds (26.4 to 33.8%) and above it with random folds (36.8
    to 46.5%). S1 is above 32.8 +/- 3.8% under every reading (42.8 to 54.6%), so no reading puts both within tolerance;
    with the labels one TR later the same holds (S1 45.7 to 60.5%, S7 28.4 to 50.9%). Random folds put autocorrelated
    neighbouring TRs in training and test sets and give higher values; the outcome does not depend on the fold scheme.
    The S1 data are six whole runs of 325 TRs (65 min) where the paper reports 90 min, so they may not be the data
    the paper analysed, which could account for S1 being above the paper's value. Measured is the first reading
    (contiguous folds, Euclidean, single-state TRs).
  deviations:
  - Classes with fewer than 2 x (dimensions + 1) TRs are left out of the density rule (listed in the notebook);
    kill has no single-state TRs in S1.
  - Under single-state labels a class with too few TRs in a training fold is left out of that fold and the fold's
    balanced accuracy is taken over the classes it could predict; in the first run such a class was scored with
