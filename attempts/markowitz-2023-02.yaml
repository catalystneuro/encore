findings:
- kind: data_missing
  about: data
  statement: The food-reward photometry experiments (Methods, 6 mice), the open-loop dLight calibration experiments
    (2 dLight+ChrimsonR mice) and the dLight+ChrimsonR closed-loop sessions with 2-s and 3-s stimulation are not
    in the dandiset; only two 2-s excitation sessions of the dLight+ChrimsonR mice are. The release notes of 0.261113.1911
    state the first and last are missing.
- kind: other
  about: data
  statement: The dandiset holds 10 DMS mice where the paper reports 8; dms-dlight-7 and dms-dlight-9 have no photometry.
    Of the photometry session files, 92 of 167 DMS and 22 of 97 dLight-only DLS files, and 10 of 236 dLight+ChrimsonR
    files, have behaviour but no photometry series, without a note saying why. dls-dlight-6 and dls-dlight-8 have
    no photometry, consistent with the two mice the paper excluded.
- kind: other
  about: data
  statement: The DLS photometry experiments without stimulation number 145 (dLight-only mice and the dLight+ChrimsonR
    mice's sessions -1 and 0) or 204 with the post-stimulation days, against 216 in Fig. 1b and 378 baseline experiments
    in the Methods; the DMS experiments with photometry number 75 against 64. Which files form the paper's sets
    is not recorded.
- kind: metadata_error
  about: data
  statement: The OptogeneticSeries description says onsets are recorded as 1 and offsets as 0, but the onset values
    are the power, 0.01 W.
- kind: other
  about: data
  statement: The release notes say the stimulated target detections equal the stimulation onsets of each file, but
    in 60 of 516 stimulation files the median time from a light onset to the nearest stimulated detection is not
    0 (up to 1.48 s). Over these files 70.7% of detections are stimulated, where the Methods give 75%.
- kind: other
  about: data
  statement: One dLight+ChrimsonR session of dlight-chrimson-6 has a dF/F of up to 10,804% and a dLight-reference
    correlation of 0.998, and is not marked excluded in its TargetSessions table; it fails the Methods' quality
    control.
- kind: metadata_insufficient
  about: data
  statement: The keypoint files give the keypoint reference frame as 'TBD', hold raw fluorescence without timestamps
    linking it to the keypoints other than equal lengths at 30 Hz, and their sessions last 25 min.
- kind: metadata_insufficient
  about: data
  statement: The velocity-modulation files do not record whether stimulation targeted the fastest or the slowest
    quartile of the target's velocity, except in the session descriptions of mice 5891 to 5894 ('Stim session -up',
    '-down'); the five dls-ai32jr mice's 50 files and the remaining 24 files of the other four mice do not say.
    The dandiset has 9 mice with such files, the paper 5.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. Movement initiations (Methods, Movement initiation analyses) are peaks of
    the cubed derivative of the smoothed z-scored speed with height 1. Taking the derivative per frame gives no
    peak above 1 in these data; per second gives about 770 per 30-min experiment. Which units were used, and is
    the score rescaled before find_peaks? This attempt used per second.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. For Fig. 1f, what quantity is compared between syllable onsets and movement
    initiations? The peak of the shuffle-normalised average from 0 to 0.3 s favours syllables in 14 of 14 mice,
    while the mean absolute z of 1-Hz high-passed snippets from -1 to +1 s, as the fig_1f notebook computes, favours
    movement initiations (P = 0.011).
