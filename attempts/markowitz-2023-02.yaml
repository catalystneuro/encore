- claim: fig1j-weak-kinematic-correlation
  outcome: reproduced
  notebook: photometry.ipynb
  output: claim:fig1j-weak-kinematic-correlation
  notes: 28,000 instances (2,000 per mouse). Held-out r under reading (a) 0.074 (velocity) and 0.018 (angular velocity);
    under reading (b) 0.060 and 0.006. The raw Pearson correlations are negative (-0.075, -0.022, -0.062, -0.009);
    shuffle P 0.001 except (b) angular velocity, 0.139. All |r| are below the claims file's assumed bound of 0.3.
  deviations:
  - The DLS baseline set is the code's reading (the dLight+ChrimsonR mice's post days 3 and 4 dropped), 145 experiments
    of 14 mice; the paper counts 216 experiments in Fig. 1b.
  - Five repeats of fivefold cross-validation in place of 100 (the spread over repeats is in the third decimal),
    and the shuffle P from 1,000 permutations of the plain Pearson r in place of refitting the Huber model, which
    took 26 minutes for 200 shuffles in preparation.
  - Angular velocity is taken as its absolute value.
  assumed: true
