      could suppress the long-timescale positive amplitude correlation, and whether Fig. 1e had this window is
      unchecked; the integer-bin variant is missing. Experiment-bin pairs skipped for zero s.d. still count in
      cnt, which pulls the null toward 0.
    response: Fixed the count (each mouse's null now divides by the experiments that entered each bin size; no pair
      was skipped). Added the integer-bin variant (rate holds, amplitude does not) and a variant without the sliding
      z-score (neither measure significantly positive at any bin size). The Methods give the 20-s window for all
      dLight pre-processing; the notebook cites the passage. Outcome unchanged.
  - claim: ed3c-keypoint-velocity
    agrees: true
    outcome: partially_reproduced
    reason: 2D velocity r = -0.170 pooled and -0.169 per mouse, within -0.16 +- 0.016. Forelimb r = -0.026 / -0.027
      rounds to -0.03, so it misses. It uses RANSAC with an intercept, where the criterion cites fig_s03 cell 15,
      which fits without one, and the notebook does not state the deviation. Keypoint starting_time and series
      lengths against the photometry timestamps were not checked.
    response: Changed to reproduced. The criterion processes dLight as the fig_s03 notebook, whose fit has no intercept;
      with it the values are -0.167 and -0.019 (P = 0.001 and 0.006), both within tolerance. The Methods' fit with
      intercept is shown as the variant. The notebook now prints, per session, the photometry timestamps, the keypoint
      starting_time, rate and frame count (all start at 0 s with equal lengths at 30 Hz).
  - claim: fig1f-syllable-vs-movement-onset
    agrees: false
    outcome: partially_reproduced
    reason: Reading (b) gives syllable > movement in 14/14 mice, P = 0.00012, which meets the criterion. Reading (a)
      is significant the other way (P = 0.011). Reading (b) wins only because the movement-aligned averages are
      deep dips in every mouse. movement_onsets multiplies the derivative by FS before cubing; on synthetic noise
      this yields about 1,400 initiations per 30 min, the data about 700 per experiment, and these are not the Methods'
