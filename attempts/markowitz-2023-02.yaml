- kind: data_missing
  about: data
  statement: The food-reward photometry experiments (Methods, 6 mice), the open-loop dLight calibration experiments
    (2 dLight+ChrimsonR mice) and the dLight+ChrimsonR closed-loop sessions with 2-s and 3-s stimulation are not
    in the dandiset; only two 2-s excitation sessions of the dLight+ChrimsonR mice are. The release notes of 0.261113.1911
    state the first and last are missing.
- kind: other
  about: data
  statement: The dandiset holds 10 DMS mice where the paper reports 8; dms-dlight-7 and dms-dlight-9 have no photometry.
    Of the photometry session files, 92 of 167 DMS and 22 of 97 dLight-only DLS files, and 10 of 236 dLight+ChrimsonR
    files, have behaviour but no photometry series, without a note saying why. dls-dlight-6 and dls-dlight-8 have
    no photometry, consistent with the two mice the paper excluded.
- kind: selection_undocumented
  about: data
  statement: The DLS photometry experiments without stimulation number 164 (dLight-only mice and the dLight+ChrimsonR
    files that are a baseline day of some target) or 206 with the pure post-stimulation days, against 216 in Fig.
    1b and 378 baseline experiments in the Methods. The DMS experiments with photometry number 75 under the Methods'
    quality control and 64 under the code's rule, which matches the paper. Which files form the paper's DLS sets
    is not recorded. 38 dLight+ChrimsonR files are the baseline day of one target and the post day of another (two
    rows of their TargetSessions table).
