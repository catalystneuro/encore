- claim: ed2a-syllable-repertoire
  outcome: reproduced
  notebook: photometry.ipynb
  output: claim:ed2a-syllable-repertoire
  measured:
  - 36
  - 400
  - 561
  notes: Reading (a), the DLS photometry experiments of the 16 dLight mice (233 experiments, 671,828 durations),
    gives 36 syllables above 1% mean usage, median 400 ms, mean 561 ms and s.d. 627 ms, all within tolerance. Over
    the 14 photometry mice alone 37 syllables pass 1%; with usage as a share of frames 35. Reading (b) was computed
    only on the 1,340 Opto-DA experiments' offline labels (optoda.ipynb), median 467 ms, mean 651 ms, 35 syllables;
    it was not pooled with the photometry experiments.
  deviations:
  - Reading (b) was run on the Opto-DA experiments only, not on every open-field experiment of the dandiset pooled.
  - Usage is the share of a mouse's run-length instances, averaged over mice (all_behavior_00 as the claims file
    cites it).
- claim: fig1e-velocity-timescales
  outcome: partially_reproduced
  notebook: photometry.ipynb
  output: claim:fig1e-velocity-timescales
  notes: 'Transient rate (upward crossings of 1.96) holds under both readings of significance: significantly negative
    at all 20 bin sizes below 10 s and significantly positive at 66 (legend''s per-bin test) or 5 (code''s Holm
    test with runs of 5) of 100 bin sizes of 10 s or more; sign change near 16 s. Binned amplitude is negative at
    every bin size (-0.120 at 0.25 s, -0.212 at 5.25 s, -0.053 at 59.75 s) and never significantly positive; the
    1-s.d. rate does not turn positive either. Holds for one measure of two. Seed range not computed.'
  deviations:
  - The DLS baseline set is the code's reading (the dLight+ChrimsonR mice's post days 3 and 4 dropped), 145 experiments
    of 14 mice; the paper counts 216 experiments in Fig. 1b.
  - The code's two-sided test is computed from the z of the observed mean r against the 1,000 shuffles (normal approximation),
    as an empirical P from 1,000 shuffles cannot pass Holm over 120 bin sizes.
  - The code's integer cast of bin sizes was not run.
  - The five-seed range was not computed, for time.
