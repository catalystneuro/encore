  measured:
  - -0.17
  - -0.026
  notes: Five keypoint mice, 25-min sessions, 400-ms bins. 2D velocity and dLight r = -0.170 pooled (per-mouse mean
    -0.169, mice -0.128 to -0.220; one-sided shuffle P = 0.001), within -0.16 +- 0.016. Forelimb velocity and partialled
