- kind: methods_unavailable
  about: paper
  statement: Question for the authors. Movement initiations (Methods, Movement initiation analyses) are peaks of
    the cubed derivative of the smoothed z-scored speed with height 1. Taking the derivative per frame gives no
    peak above 1 in these data; per second gives 25 to 30 a minute, mostly during movement. Which units were used,
    and were the events restricted to starts from stillness, as the Methods' description says? This attempt used
    per second and kept detections preceded by speed below the experiment's 25th percentile.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. For Fig. 1f, what quantity is compared between syllable onsets and movement
    initiations? The mean absolute z of 1-Hz high-passed snippets from -1 to +1 s, as the fig_1f notebook computes,
    favours syllable onsets over initiations from stillness in 13 of 14 mice, while the peak of the shuffle-normalised
    average from 0 to 0.3 s does not (9 of 14); with all detections the two reverse.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. For Fig. 3i, is the post-onset transition entropy computed per trial or pooled
    over a condition's trials, and are stimulation and catch trials matched in number? Stimulation trials are about
    three times as many as catch trials; pooled, the Opto-DA effect is significant, and with stimulation trials drawn
