    caudal spine keypoints.
  - Keypoints and photometry are taken as sample-aligned (equal lengths at 30 Hz), as the files give no other alignment.
- claim: fig1f-syllable-vs-movement-onset
  outcome: reproduced
  notebook: photometry.ipynb
  output: claim:fig1f-syllable-vs-movement-onset
  notes: Under reading (b), the per-mouse peak of the shuffle-normalised average from 0 to 0.3 s, syllable onsets
    exceed movement initiations in 14 of 14 mice (medians 2.54 against -5.03; Wilcoxon W = 0, P = 0.00012; the same
    with the first 100 shuffles). Under reading (a), mean absolute z of 1-Hz high-passed snippets from -1 to +1
    s, movement initiations are higher (4 of 14 mice favour syllables; medians 2.08 against 2.54; P = 0.011). The
    criterion is met under one reading; the two readings point in opposite directions. Movement initiations per
    mouse 4,020 to 10,593; syllable onsets 16,369 to 43,107. Seed range not computed.
  deviations:
  - The DLS baseline set is the code's reading (the dLight+ChrimsonR mice's post days 3 and 4 dropped), 145 experiments
    of 14 mice; the paper counts 216 experiments in Fig. 1b.
  - Movement initiations use the derivative of the smoothed z-scored speed per second. With the derivative per frame,
    as the Methods can be read, the cubed score never reaches the find_peaks height of 1 and no initiation is found
    (assumption).
  - Reading (a) uses 100 shuffles (the legend's number) and a second-order Butterworth high-pass, a standard choice;
    reading (b) 1,000 and 100.
  - The five-seed range was not computed, for time.
  assumed: true
