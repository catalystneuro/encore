- claim: fig3i-optoda-entropy
  outcome: not_reproduced
  notebook: optoda.ipynb
  output: claim:fig3i-optoda-entropy
  notes: '377 250-ms stimulation experiments with both trial types (236 Opto-DA, 141 control). With all trials, Opto-DA
    entropy change after stimulation is above catch trials in every five-syllable bin (first bin median difference
    0.07 bits, f = 0.57, Holm P = 0.017) and no control bin is significant (smallest Holm P 0.22). Stimulation trials
    outnumber catch trials (median 58 against 20 per experiment) and the pooled plug-in entropy depends on the number
    of trials. With stimulation trials drawn down to the catch count in each experiment, the Opto-DA first bin has
    f = 0.46, Holm P = 0.86 (f 0.46 to 0.50, Holm P 0.97 to 1.0 under seeds +1000 to +4000); one later bin reaches
    Holm P = 0.011 under one seed of five; no control bin is significant.'
  deviations:
  - Each online detection is aligned to the instance it falls in; entropy is the conditional entropy of transitions
    pooled over a condition's trials in an experiment, Perks prior 1/K, minus the same over the 5 syllables before
    onset.
  - Catch-trial z-scoring uses catch values over experiments within each arm.
  - The comparison with stimulation trials drawn down to the catch count decides the outcome (assumption). The paper
    does not say whether entropy is pooled over trials; pooled over unequal trial counts the estimate is biased
    toward the larger set, which the verifier raised and the matched comparison removes.
  assumed: true
  seed_sensitive: false
