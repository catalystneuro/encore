- claim: fig1e-velocity-timescales
  outcome: partially_reproduced
  notebook: photometry.ipynb
  output: claim:fig1e-velocity-timescales
  notes: Transient rate (upward crossings of 1.96) holds under both readings of significance, significantly negative
    at all 20 bin sizes below 10 s and significantly positive at 73 (legend's per-bin test) or 27 (code's Holm test
    with runs of 5) of 100 bin sizes of 10 s or more, sign change near 16 s; with integer bin sizes 38 or 36 of
    50. Binned amplitude is negative at every bin size (-0.119 at 0.25 s, -0.205 at 5.25 s, -0.051 at 59.75 s)
    and never significantly positive; the 1-s.d. rate is never significantly positive either. Without the 20-s
    sliding z-score neither measure is significantly positive at any bin size (amplitude -0.274, rate -0.166 at
    59.75 s). Holds for one measure of two. Seed range not computed.
  deviations:
  - The DLS baseline set is the code's reading (the dLight+ChrimsonR mice's pure post days dropped), 164 experiments
    of 14 mice; the paper counts 216 experiments in Fig. 1b.
  - The code's two-sided test is computed from the z of the observed mean r against the 1,000 shuffles (normal approximation),
    as an empirical P from 1,000 shuffles cannot pass Holm over 120 bin sizes.
  - The 20-s sliding z-score is the Methods' pre-processing for all dLight (Photometry pre-processing); a variant
    without it is shown.
  - The five-seed range was not computed, for time.
