  notes: '55 Experiment 1 pyramidal neurons from 4 mice have a significantly lower rate in the last than
    in the first 400 ms of the delay (paper 27 from 6 mice). The RMS windows start after photoinhibition
    has ended and the end point is the control rate in the last 400 ms of the delay. For the 47 tested,
