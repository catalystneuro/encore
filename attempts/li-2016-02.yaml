- claim: ed2e-no-rebound
  outcome: not_reproduced
  notebook: reproduce_li_2016.ipynb
  output: claim:ed2e-no-rebound
  notes: 'Experiment 2, lick right trials, ipsilateral photoinhibition, 306 pyramidal neurons above 1
    spike/s. 0 to 400 ms after offset, photoinhibition minus control -0.14 spikes/s (paired t = -0.58,
    p = 0.565); 400 to 800 ms +0.10 (p = 0.617): no rebound on average. In the first window 24 neurons
    are significantly excited and 9 suppressed (p < 0.01), the opposite of the balance the criterion requires;
    without the rate exclusion (408 neurons) 30 and 9; at p < 0.05, 36 and 21. By the sign of the change
    125 neurons are higher and 177 lower than control (median -0.28 spikes/s), which fits the paper''s
    "low level of sustained inhibition in a larger proportion". The criterion''s second condition fails
    and it has no partial rule. Whether the count at p < 0.01 reads the paper correctly is asked of a
    reader (questions/crcns-alm-3.yaml).'
  deviations:
  - The population test (paired t-test over neurons) is the criterion's standard choice.
