- claim: fig1g-selectivity-recovery
  outcome: partially_reproduced
  notebook: reproduce_li_2016.ipynb
  output: claim:fig1g-selectivity-recovery
  measured:
  - 347
  - 420
  - 236
  - 72
  notes: 'Every reading of M4 and of the selection is run (96): selection rule (the scripts'' sample or
    delay epoch with |preference| > 1, or M3''s any epoch), screening trials (the code''s 5 per type,
    10 per type, 10 in total), preference window (whole count or most selective epoch), trials of the
    selectivity test, more than 2 or 3 trials per condition, 200 ms windows stamped at their centre or
    400 ms at their end. Code reading: 347 ms (sample), 420 ms (early delay), 236 ms (middle delay), within
    373 +- 260, 510 +- 218 and 327 +- 112 ms, at least 99% of resamples recovering in each condition. In all 96 readings every condition
    recovers in at least 96% of resamples, and 34 put all three times within tolerance. No reading gives
    the paper''s 55 neurons: 66 to 160 (72 under the code''s reading). Of 292 Experiment 1 pyramidal neurons,
    99 are selective in the sample or delay epoch and 72 remain after the preference and trial filters;
    selection by any epoch leaves 135 to 137. The times match, on a different neuron set, so the neuron
    count, an expected value, fails.'
  deviations:
  - 'Screening, selection and the bootstrap recovery rule from the deposited script (analysis_compile_all_data_unilateral.m,
    Fig. 1g section): 5 control trials of each type set the preference (the Methods'' subset of 10 trials),
    the recovery time is searched from offset to 1 s after the cue. The authors'' MATLAB scripts deposited
    in the data set (alm-3/live/analyses_scripts/), which the data description says reproduce the paper''s
    figures, are used as the paper''s analysis code for details the claims file and the Methods leave
    open; the paper itself links no code.'
  - Every reading of M4 (screening 10 trials per type or in total; preference from the whole count or
    the most selective epoch) and the selection of M3 (any epoch) are run alongside the code's; the most
    selective epoch is the one where the screening trials differ most by mean difference over pooled standard
    deviation, a standard choice.
  - A recovery time counts as within tolerance only when at least half the bootstrap resamples recover
    (the paper does not say how resamples that never recover were counted; see the methods_unavailable
    finding).
  - PSTHs are evaluated every 10 ms (the script uses 1 ms), so recovery times are resolved to 10 ms.
