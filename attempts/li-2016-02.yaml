  - Bilateral silencing of the attractor is also run to 4 s, not only to the criterion's 2 s, so that every
    run settles at a fixed point; the wrong-fixed-point fractions at 4 s are used.
  assumed: true
findings:
- kind: metadata_error
  statement: The cell-type labels do not match the paper's classes. In the 58 non-callosotomy sessions
    89 units are labelled FS and 33 have no label, where the paper reports 72 FS and 50 excluded units
    of intermediate width (0.35 to 0.45 ms); 890 pyramidal agree. 15 units labelled FS have a trough-to-peak
    width of 0.358 ms in their deposited mean waveform, and 24 unlabelled units are narrower than 0.35
    ms.
- kind: metadata_error
  statement: The data description lists a depth field for each unit; the files have none (fields timeUnit,
    eventTimes, eventTrials, waveforms, channel, cellType), and the waveform field is named waveforms.
- kind: metadata_error
  statement: Photostimulation type 9 is still described in the files and the data description as "Right
    ALM (ipsilateral)"; the data set's FAQ says it is contralateral.
- kind: data_missing
  statement: The lick trace shows detectable licks in only 42 of 90 sessions with performing trials, and
    in none of the 26 Experiment 2 sessions, where it is flat (range about 0.002 against 0.05 elsewhere).
    The files hold no lick event times, so reaction times cannot be measured for the paper's population
    analyses.
- kind: data_missing
  statement: The behaviour-only sessions (Fig. 1d, Fig. 2b, ED Fig. 3), the photoactivation recordings
    (ED Fig. 5), the recordings in untrained mice (ED Fig. 2d), sessions before callosotomy (Fig. 5b)
    and the simulations named in the data set's title are not in the data set. The FAQ says the photoactivation
    data would be added.
- kind: other
  about: data
  statement: In four sessions (ANM257636_20150404, ANM264411_20141224, ANM273657_20150325, ANM298738_20150727)
    photoinhibition of the left ALM does not reduce pyramidal activity (rate after laser onset 0.71 to
    2.18 times the rate before), where every other session drops to a median of 0.03. That spikes, laser
    trace and trial table share a clock could not be shown for these sessions.
- kind: metadata_insufficient
  statement: Nothing in the files says which experiment a session belongs to. Six sessions from three
    mice hold types 4, 5 and 7 (ipsilateral 1 spot, contralateral 1 spot, bilateral 1 spot), a combination
    the Methods do not describe for either bilateral experiment, and the deposited scripts analyse neither
    these nor the Experiment 3 sessions.
- kind: code_mismatch
  statement: The deposited analysis scripts differ from the Methods. The coding direction is a Fisher
    discriminant averaged over time (func_discriminant.m), where the Methods define it as the mean difference
    of the response vectors. The selectivity test uses correct and error trials although its comment says
    correct trials; the paper's ED Fig. 1 counts (634, 176, 337, 493) are matched by correct trials (633,
    176, 336, 493) and not by the script's trials (571, 152, 287, 404). The unilateral script screens
    5 trials per type for the preference, the bilateral ones 10, where the Methods say 10 trials. The
    population session rule of the scripts keeps groups of 5 trials, which gives the paper's 16 sessions,
    where the Methods say more than 5 trials per condition (12 sessions).
- kind: other
  about: data
  statement: Session ANM270340_20150618 has no performing trials (GoodTrials is 0 for all 322 trials).
- kind: methods_unavailable
  statement: 'Questions for the authors. (1) Fig. 6b: is the noise variance of 0.01 per integration step,
    and what step was used? Per unit time the attractor does not hold its choice. (2) Fig. 6c: with the
    printed matrix the recovery neuron restores only right-preferring activity, so lick left trials do
    not recover; is the matrix complete? (3) ED Fig. 4: the 27 neurons come from 6 mice, but Experiment
    1 has 4 mice in the data set; which sessions and photoinhibition conditions were used? (4) Fig. 2e:
    how were bootstrap resamples that never reach 80% before the cue counted in the recovery time? In
    this data set most ipsilateral resamples do not.'
- kind: paper_inconsistency
  statement: ED Fig. 2b, ED Fig. 4 and the Results give 6 mice for Experiment 1, but the 20 unilateral
    sessions, the paper's count, come from 4 mice in the data set. The ED Fig. 2b neuron counts (117,
    110, 109; 300, 294, 301; 52, 52, 102) differ from those here (180; 319 to 323; 56), and its 102 for
    the Experiment 3 bilateral condition suggests that other bilateral 1-spot sessions were pooled.
