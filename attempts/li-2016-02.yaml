    7 mice): p = 0.92 and 0.43. Neurons with increasing rates: time-matched smaller when pooled (p = 0.041
    and 0.049), not after early delay alone (p = 0.086 and 0.28). The round-1 result (time-matched larger,
    p = 0.019) used windows that overlapped photoinhibition and a different end point; the two changed together,
    so the effect of the window alone was not isolated.'
  deviations:
  - 'The start and end of the delay are read as its first and last 400 ms (criterion). RMS windows: 200
    ms stamped at their centre from 0.1 s after offset to 0.1 s before the cue, or 400 ms stamped at their
