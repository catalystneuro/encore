  outcome: reproduced
  notebook: reproduce_li_2016.ipynb
  output: claim:ed1-selective-fraction
  measured:
  - 633
  - 176
  - 336
  - 493
  notes: 'Correct control trials, lick-early trials excluded, 1.3 s response epoch (reading a of M3 and
    M1, the code''s response window): 633 of 890 pyramidal neurons selective in some epoch, 176 in the
    sample, 336 in the delay and 493 in the response epoch (paper 634, 176, 337, 493). The 1.5 s response
    epoch also matches (635 and 490). With correct and error trials, the trials the deposited script selects,
    the counts are 571, 152, 287 and 404; with lick-early trials included 596, 161, 315 and 433. The first
