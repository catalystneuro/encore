- claim: units-and-sessions
  outcome: not_reproduced
  notebook: reproduce_li_2016.ipynb
  output: claim:units-and-sessions
  measured:
  - 1012
  - 20
  - 38
  - 890
  - 89
  - 12
  notes: The 58 non-callosotomy sessions (20 unilateral, 38 bilateral) from 12 mice hold 1012 single units,
    890 labelled pyramidal, all as the paper reports. 89 units are labelled FS and 33 carry no cell-type
    label, against 72 FS and 50 intermediate in the paper. By the trough-to-peak width of the deposited
    mean waveform (29 samples at 19.53 kHz, steps of 0.051 ms) there are 890 pyramidal, 98 FS and 24 intermediate
    units, and 889, 104 and 19 after tenfold spline upsampling. 15 units labelled FS have a width of 0.358
    ms, inside the excluded range. Five of six counts match exactly; the FS count is 24% above the paper's,
    so neither the criterion's full nor its partial rule holds.
  deviations:
  - Cell classes are read from the data set's cellType labels, with the width of the deposited mean waveform
    as a second reading; the paper's width measurement (interpolation, filtering) is not described beyond
    trough to peak.
