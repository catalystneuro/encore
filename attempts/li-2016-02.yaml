    deposited in the data set (alm-3/live/analyses_scripts/), which the data description says reproduce
    the paper's figures, are used as the paper's analysis code for details the claims file and the Methods
    leave open; the paper itself links no code.
- claim: fig1d-late-delay-ipsilateral-bias
  outcome: blocked
  blocked_by: data_missing
  notes: The recording sessions hold photoinhibition in the sample, early delay and middle delay windows
    (types 1 to 3, ending 1.6, 0.8 and 0.3 s before the cue by the laser trace); none ends at the go cue.
    The behaviour-only sessions of Fig. 1d are not in the data set; its FAQ says the published data cover
    only the electrophysiology sessions. No other public copy was found.
- claim: fig1d-earlier-photoinhibition-minimal
  outcome: reproduced
  notebook: reproduce_li_2016.ipynb
  output: claim:fig1d-earlier-photoinhibition-minimal
  notes: 'Recording sessions of Experiment 1, 4 mice (paper 5, behaviour sessions). Performance pooled
    per mouse: control 79.5%, early delay 74.5% (drop 5.0 points, paired t-test p = 0.23), middle delay
    74.9% (drop 4.6, p = 0.22). Unpaired tests and per-session means give p from 0.18 to 0.41. No condition
    reaches p < 0.05, and all p-values are above the paper''s 0.1. Sample photoinhibition +0.6 points
    (p = 0.81). With four mice the test has little power; the drops are about five points.'
  deviations:
  - Tested on the recording sessions of Experiment 1 (4 mice, 0.5 s photoinhibition with 100 ms ramp),
    as the behaviour-only sessions of Fig. 1d are not in the data set; the three sessions with the no-ramp
    types -1 to -3 are left out, as the data set says not to analyse them.
  - Performance is hits over hits and errors on performing trials, no-lick and lick-early trials excluded,
    as the data set's Demo_get_performance.m computes it.
- claim: ed3-recovery-interval
  outcome: blocked
  blocked_by: data_missing
  notes: Behaviour-only experiments (ED Fig. 3); the data set's FAQ says they are not included, and only
    types 1 to 3 of ED Fig. 3a are in the recording sessions (see fig1d-earlier-photoinhibition-minimal).
    The 1.3 s whole-delay photoinhibition and the other recovery intervals are absent. The part on 0.5
    s photoinhibition ending 0.8 s and 1.6 s before the cue is tested on the recording sessions under
    fig1d-earlier-photoinhibition-minimal (p = 0.23 and 0.81, no significant effect); the 1.3 s photoinhibition
    and the condition ending at the cue are missing, so the claim stays blocked.
