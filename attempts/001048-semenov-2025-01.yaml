findings:
- kind: metadata_error
  statement: DANDI:001048 names this paper as related (IsPublishedIn) but holds TIRF recordings of HEK
    cells under patch clamp from another study, with species human. The paper's data are in 001030
    to 001035 and 001271 to 001274, of which only 001271 to 001274 name the paper.
- kind: other
  statement: 001034 is a copy of 001032. All 178 recordings are identical pixel for pixel, under other
    subject names (sub-N-3 for sub-N-1).
- kind: metadata_error
  statement: 001030 gives its neurons as mouse (Mus musculus, C57BL/6); the paper used only rat
    hippocampal neurons. 001035 describes its neurons as "C57BL/6 rat". 001030 makes each session a
    separate subject (sub-c7-1-45V), so the four neurons appear as 17 subjects.
- kind: metadata_insufficient
  statement: The stimulus voltages in 001030 to 001035, 001271 and 001272 are generator settings. The
    files say the delivered amplitude is "somewhat smaller", with frequency-dependent calibration
    factors "reported separately", which are in none of the dandisets; 001032 to 001035 label the
    voltage peak to peak and give 36 V/cm per volt without saying of which. Thresholds in V/cm and
    the ratio of 20-kHz to 2-kHz thresholds cannot be computed as the paper did.
- kind: data_missing
  statement: The low-conductivity (sodium gluconate) sessions with 250-ms waves of Figures 3A and 3B
    are in none of the dandisets, and 001272 holds 3 of the 8 Di-8-ANEPPS neurons of Figure S1.
- kind: metadata_insufficient
  statement: 001271 labels TTX sessions but not when the vehicle was applied to vehicle neurons, so the
    before and after sessions can only be inferred from pauses between sessions.
- kind: metadata_error
  statement: The TTX session descriptions of 001271 say TTX "abolished the action potentials and caused
    sustained depolarization", while the dandiset's description and the paper say it prevented the
    sustained depolarization; the data show no depolarization under TTX. The Di-8-ANEPPS sessions of
    001272 are described as "vehicle control" for TTX, copied from 001271.
- kind: metadata_insufficient
  statement: The strobe dandisets (001273, 001274) hold no ROIs, no debris ROI, no cell shape or
    orientation, no stimulus waveform and no mark of which groups are the paper's 19 Figure 4
    experiments or the cells C1 to C9 of Figure 6. The Figure 5 cell's 12 sine sessions match no cell.
- kind: other
  statement: The dandisets hold stimuli the paper does not describe - sine waves of 20 Hz to 10 kHz in
    001032, 001033 and 001035 (a 20-Hz session in most neurons), 100-kHz bipolar pulses in 001031,
    and TTX strobe sessions in 001274.
- kind: format_error
  statement: Frame 0 of every time-lapse file is a bright artefact (at least 1.51 times frame 1, median 3.15). 59
    sessions of 001032 have 900 frames and end at 291 ms, before the 250-ms stimulus that starts at
    50 ms ends. The stimulus onset is not stored in the files of 001032 to 001035, 001271 and 001272
    beyond the text of the description; the APs are consistent with it.
- kind: methods_unavailable
  statement: Questions for the authors on the optical AP analysis - how the soma ROI was drawn (the
    deposited 16 x 16 crop is used here), how APs were identified and their duration measured (the
    half width here is about 4.5 ms against the paper's 8 ms), how the maximum firing rate was
    measured at fields where APs merge, and the calibration that converts the deposited voltages to
    the V/cm of Figure 2D.
- kind: methods_unavailable
  statement: Questions for the authors on the strobe analysis - the size of the ROIs, which groups of
    001273 are the 19 experiments of Figure 4 and which cells are elongated, which cells of 001274 are
    C1 to C9, the phase of the modulated waves at the first frame, and the field values used for each
    cell.
- kind: methods_unavailable
  statement: Question for the authors - which field (peak or RMS) and volumetric heat capacity give the
    adiabatic rise of 2.5 C at 63 V/cm in a 16.4 mS/cm solution; with water's heat capacity the peak
    field gives 3.89 C and the RMS field 1.95 C.
