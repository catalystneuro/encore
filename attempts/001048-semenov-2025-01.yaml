- claim: fig2-modulated-locks-to-beats
  outcome: reproduced
  assumed: true
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig2-modulated-locks-to-beats
  notes: No modulated session has more than 10 APs (one of 84 has 10). In the 19 sessions with at
    least 5 APs (ROI c), 95.1 % of APs fall within 12.5 ms of beat peaks 25 ms into each beat
    (envelope reading a) and 4.9 % under reading b; the APs lock to 26.5 ms of the 50-ms beat (vector
