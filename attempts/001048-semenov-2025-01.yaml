  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig2d-modulated-thresholds-higher
  measured: 75.6
  notes: Modulated thresholds are higher than unmodulated ones in every comparison and reading. Under
    the crop ROI the unpaired tests give p = 0.0205 (20 kHz, 1 AP) and 0.0305 (20 kHz, 5 APs), with
