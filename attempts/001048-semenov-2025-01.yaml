    the paper's "emission intensity over the entire cell soma" (Methods, Recording of the optical
    APs) because the crop is the dataset's own soma region and the claims file says ROIs are taken
    from the dataset when it holds them (O1). The claims file's Otsu readings (a, b) give masks of a
    median 35 and 10 pixels, some of 1 to 3, with about twice the noise; they are shown.
  - APs are detected by the claims file's rule (O3); the paper identified them by eye.
- claim: fig1-pure-sine-excites-all
  outcome: partially_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig1-pure-sine-excites-all
  measured: 88.2
  notes: Unmodulated waves excited 27 of 28 neurons at 2 kHz (96.4 %) and 15 of 17 at 20 kHz (88.2 %
    under ROI c with O3 a, given as measured; 94.1 % with O3 b), and the first-AP latency fell with
    voltage in 40 of 40 neuron-frequencies (Spearman rho below 0). Under every reading the median
    latency at threshold is 66.0 to 94.5 ms, below 90 to 220 ms except under ROI b with O3 b (92.4
    to 94.5 ms, where 2-kHz excitation drops to 67.9 %), and the median highest maximum firing rate
    is 28.3 to 44.1 Hz, with 9.7 to 37.9 % of neurons in 54 to 99 Hz, so neither ceiling reading
    holds. Per frequency (ROI c) the median latency at threshold is 54 ms at 2 kHz and 124 ms at
    20 kHz. Below each neuron's highest rate the rate rises with voltage (slope positive in 24 of 24
    neurons, median 11.8 Hz per V; not deciding).
  deviations:
  - Fields are the labelled generator voltages (see fig2d-modulated-thresholds-higher); the claim
    uses only their order.
  - The 20-kHz excitation is below 90 % under ROI c with O3 a by one neuron of 17.
- claim: fig1-excitation-block
  outcome: not_reproduced
  notebook: reproduce_semenov_2025.ipynb
  output: claim:fig1-excitation-block
  notes: Of the 10 or 11 neuron-frequencies tested above the voltage of their highest firing rate
    (ROI c), none shows sustained depolarization (O4, either level) at its highest voltage; under
    the Otsu ROIs 1 of 12 to 20 (ROI a) and 0 to 2 of 11 to 31 (ROI b). Most neurons still fire in
    the last 100 ms at their highest voltage. Two sessions at any voltage meet O4 a (001032/12_1 at
    15 V, 001033/3_2 at 9 V), and the mean dF in the last 100 ms rises with voltage (rho median 0.93,
    positive in 42 of 45), so a depolarization builds up under firing, but the block is rare.
    001032/12_1 at 15 V stays depolarized after the stimulus (7.87 % over 50 ms), against the claim's
    immediate reversal. 38 sessions of 900 frames end at 291 ms, before the stimulus.
- claim: fig1-20khz-needs-twice-the-field
