  output: claim:ap-selection
  measured:
  - 10.58
  - 4.53
  notes: Over 39 neurons of 001032, 001033 and 001035 (ROI c, F0 a, O3 a, every AP, width at half
    height), the mean AP peak is 10.58 +- 0.37 % dF and the duration 4.53 +- 0.20 ms. Under the crop
    ROI the peak is within 11.3 +- 0.9 in 14 of 16 readings (10.30 to 11.61 %); the duration is in
    range under none (half width 4.19 to 4.53 ms, rise to return 17.21 to 23.47 ms). Under the Otsu
    ROIs the peak is 11.53 to 16.23 %, and only ROI b with O3 b gives a rise-to-return duration in
    range (7.64 to 8.37 ms), with a peak of 15.5 to 16.2 %. The peak holds, the duration does not.
    The paper does not say which 22 neurons were measured; 39 are deposited.
  deviations:
