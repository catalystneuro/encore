- claim: fig4-strf-performance-low
  outcome: partially_reproduced
  assumed: true
  notebook: strf_asari_2009.ipynb
  output: claim:fig4-strf-performance-low
  measured: 0.153
  notes: Over 16 Wehr cells (10-ms Hann window, contiguous folds), the mean validation performance
    is 0.131 to 0.153 for the STRF and 0.078 to 0.112 for the LN model across the nine windows,
    below 0.22 at every window; the training estimates are 0.203 to 0.247 and 0.222 to 0.278. The
    one-sided Wilcoxon test of 4052 against 180 ms finds an improvement for both models, median
    +0.016 for the STRF (12 of 16 cells improve, p = 0.0031) and +0.023 for the LN model (13 of 16,
    p = 0.025); with a 20-ms window p = 0.0031 and 0.037, with folds by stimulus p = 0.033 and
    0.017. The Friedman test over the nine windows gives p = 0.0083 (STRF) and 0.0081 (LN). The LN
    model is worse than the STRF on validation data (mean -0.047) and better on training data
    (+0.029). Low performance holds; the absence of an improvement and the small LN gain do not. A
    model fitted after shifting the response by half the stimulus gives -0.000, against 0.178 with
    the true alignment. After verification round 1 the ridge grid was widened from 1e2 to 1e4 times
    the mean eigenvalue; the chosen value is now at an end of the grid in 1 of 208 fits (36 fits
    chose 1e2 or more, the top of the first grid), and the outcome is unchanged. Every stimulus
    file stores param.sf = 97656 Hz, the rate used.
  deviations:
  - The paper's 20 cells are not listed. The data set holds 25 Wehr cells; the 16 with at least two
    natural sound stimuli of at least two trials, which Eq. 52 needs, are used.
  - The test of no improvement is the claims file's assumption (paired one-sided Wilcoxon,
    validation, 4052 against 180 ms).
  - Response sampled in 4-ms bins of the 10-ms median-filtered membrane potential; spectrogram
    bands from 0.40 to 20.3 kHz at 3 per octave (17 bands); the paper gives 0.40 to 22 kHz.
  - The static nonlinearity is a lowess fit on the training set (5% span, 5 robust iterations)
    applied to the validation set by interpolation; how the paper applied it to new data is not
    stated.
