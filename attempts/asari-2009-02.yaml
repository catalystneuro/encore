- claim: fig2-example-long-context
  outcome: reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig2-example-long-context
  notes: The answer to the question on this claim (questions/asari-2009.yaml) amended the criterion in
    two ways. The example is now matched by the Figure 2A legend values, and the end of the quiet interval
    takes the default 10% tolerance on "after about 4 s", so the interval tested is 2 to 3.6 s, with 2
    to 4 s reported as the strict reading. Before the answer the claim was partially reproduced, on the
    same probe, because a significant period started 30 ms before 4 s. Of 24 current-clamp cells with
    seven natural fragments, only 20051222-ha1-001 has a mean reliability within 0.61 +/- 0.07 (0.611;
    the next highest is 0.401). In it only probe 4 (contexts silence and fragments 2 and 3, six repeats)
    matches the probe value, at 0.737. Context dependence in that probe is significant in short periods
    from 0.026 to 1.601 s and from 3.970 to 4.596 s, with nothing significant from 1.601 to 3.970 s. So
    there are significant periods before 2 s and after 3.6 s and none between 2 and 3.6 s, and the amended
    criterion is met. Under the strict reading the period at 3.970 to 4.008 s overlaps 2 to 4 s by 30
    ms. Without silence among the contexts, the probe has two short significant periods (0.04 s and 4.43
    s). 17 of 305 natural probes have a significant period later than 4 s.
- claim: fig3a-proportion-significant
  outcome: reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig3a-proportion-significant
  measured:
  - 186
  - 0.61
  - 0.252
  notes: With silence counted among the contexts and the proportion over all 305 probes, 186 probes (61.0%)
    have a significant period, the late fraction is 0.252 and the cumulative curve peaks at 4.78 s (paper
    4.72 s); all three are within tolerance. The noise floor of that reading averages 2.2 x 10^-3 over
    0 to 6 s, outside the paper's 2.8 x 10^-3 +/- 10%; over the probes still running it is 2.8 x 10^-3,
    but the late fraction there is 0.267, outside tolerance, so the count and the chance level are matched
    by different readings. Without silence, 166 probes (54.4%) are significant and the late fraction is
    0.17 to 0.18, outside tolerance. The fraction of significant probes per animal has a median of 0.66
    over 34 animals (range 0 to 1). Tied values occur at a median of 31% of a probe's time points (range
    4% to 100%).
  deviations:
  - The Kruskal-Wallis test ranks tied values by their average rank, the standard test of the Methods
    (Eq. 10). CxtDep.m ranks ties by trial order, which favours the first contexts on the quantised traces.
  - Noise floor from 1,000 shuffles of trials across contexts per probe (Methods, Significance measure).
    A significant period is at least 50 consecutive 0.1-ms points with P < 0.01 (Methods); CxtDep.m requires
    a span of 50 samples, one point more.
