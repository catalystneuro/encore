- claim: figs1-silence-probe
  outcome: reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:figs1-silence-probe
  notes: The silence probe is the first 2.39 s of each intersequence silence (CxtDep.m takes 2.5 s,
    cut to the shortest silence), with the last fragments of the sequences as contexts; 44 such
    probes in 38 cells have at least 4 trials per context. 27 have a significant period, and 19
