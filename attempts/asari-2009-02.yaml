- claim: fig4-strf-performance-low
  outcome: partially_reproduced
  assumed: true
  notebook: strf_asari_2009.ipynb
  output: claim:fig4-strf-performance-low
  measured: 0.152
  notes: Over 16 Wehr cells (10-ms Hann window, contiguous folds), the mean validation performance
    is 0.130 to 0.152 for the STRF and 0.084 to 0.121 for the LN model across the nine windows,
    below 0.22 at every window; the training estimates are 0.205 to 0.249 and 0.234 to 0.289. The
    one-sided Wilcoxon test of 4052 against 180 ms finds an improvement for both models, median
    +0.016 for the STRF (11 of 16 cells improve, p = 0.0038) and +0.023 for the LN model (14 of 16,
    p = 0.017); with a 20-ms window p = 0.0038 and 0.022, with folds by stimulus p = 0.033 and
    0.022. The Friedman test over the nine windows gives p = 0.057 (STRF) and 0.0001 (LN). The LN
    model is worse than the STRF on validation data (mean -0.038) and better on training data
    (+0.040). Low performance holds; the absence of an improvement and the small LN gain do not. A
    model fitted after shifting the response by half the stimulus gives -0.002, against 0.178 with
    the true alignment. The ridge value was chosen at the top of the grid in 36 of 208 fits.
  deviations:
  - The paper's 20 cells are not listed. The data set holds 25 Wehr cells; the 16 with at least two
    natural sound stimuli of at least two trials, which Eq. 52 needs, are used.
  - The test of no improvement is the claims file's assumption (paired one-sided Wilcoxon,
    validation, 4052 against 180 ms).
  - Response sampled in 4-ms bins of the 10-ms median-filtered membrane potential; spectrogram
    bands from 0.40 to 20.3 kHz at 3 per octave (17 bands); the paper gives 0.40 to 22 kHz.
  - The static nonlinearity is a lowess fit on the training set (5% span, 5 robust iterations)
    applied to the validation set by interpolation; how the paper applied it to new data is not
    stated.
