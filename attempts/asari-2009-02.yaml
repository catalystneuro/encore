findings:
- kind: data_missing
  about: data
  statement: The data set holds no voltage-clamp recording. The paper recorded 42 cells in voltage
    clamp and analysed 14 (29 probes, Figures 5 and 6); every file in ac-1 is a current-clamp or
    cell-attached recording in mV.
- kind: data_missing
  about: data
  statement: The data set holds 145 of the 194 A1 current-clamp cells and 14 of the 16 MGB cells the
    paper recorded. The cells of the natural sound analysis (305 probes in 39 cells) and of the MGB
    analysis (93 probes in 14 cells) are all there.
- kind: metadata_insufficient
  about: data
  statement: For the synthetic recordings, the files do not say which conditioning stimuli form the
    amplitude, frequency, AM, FM and higher-order sets of the paper's Table 1 and Figure 8. Only 6
    of 105 recordings name the sets in their notes; the others give stimulus parameters (for
    example AM and FM ranges of modulated harmonic tones in 4 by 4 designs) without the grouping,
    and the MHT probes of Table 1 cannot be found among the designs.
- kind: data_missing
  about: data
  statement: No recording has the design of Figure 7 (a natural sound probe after DMR contexts in
    0.625-2.5, 2.5-10 and 10-40 kHz). The DMR frequency variants in the data set use the bands 0.25-1
    to 8-32 kHz.
- kind: other
  about: data
  statement: Summary.mat lists two cells (20060314-ha1-001 and 20060320-ha3-003), with the same
    tuning-curve file, in both the natural sound and the synthetic group, so counting cells per
    group gives 147 A1 cells where the data set holds 145. This agrees with the paper, whose
    ensemble counts sum to 125 for 123 cells, but it is not documented.
- kind: other
  about: data
  statement: Four MGB cells (20071012-ha1-001 to -004) come from an animal whose age is stored as 29
    days, outside the 20 to 28 days of the paper's Methods, and one cell (20061229-ha2-004) has no
    age.
- kind: other
  about: data
  statement: In some recordings the sequence numbers in the trigger descriptions differ from those
    in the notes (for example "Sequence 2, 4, 6, 8" in the triggers of 20051107-ha1-001-003 against
    "Seq.1 to 4" in its notes); the fragment lists agree, so the analysis uses the lists.
- kind: other
  about: data
  statement: The data set includes the authors' MATLAB analysis code (asari/Tools/CxtDep.m and
    others), which the paper does not mention. It fixes how probes, contexts, the silence context
    (last 4 s of the interval) and the silence probe (first 2.5 s) are formed, and it reproduces the
    paper's sample sizes exactly (305 natural sound probes, 93 MGB probes).
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. How were A1 spikes detected for the firing rates (the code
    says by hand), and which periods count as spontaneous and evoked, and which recordings? With an
    automatic detector the A1 means match (0.49 and 0.54 Hz) but the MGB evoked rate is 5.0 Hz over
    the sequence recordings against 11.4 Hz, and 11.7 Hz over the tuning-curve recordings.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. Over what time range were Eq. 44 fitted to the population
    curves, and how were probes of different lengths (2 to 6 s) combined at times after the shorter
    ones end? The time constants of Q(t) (Fig. 3B) and of Eq. 43 (Fig. 4) depend on it, 0.73 to
    1.78 s and 0.93 to 2.98 s here against 1.04 s, and only fits restricted to the first 2 s come
    near 1.04 s.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. Which 20 of the 25 Wehr cells in the data set were used for
    the encoding models, and how was the static nonlinearity applied to validation data? Only 16
    cells have the repeated trials that Eq. 52 needs.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. Is the trial-to-trial reliability of Figure 2 (0.74 and
    0.61) and of the population (0.31) the mean correlation over pairs of trials, or the
    correlation of each trial with the mean of the others? Pairs give 0.310 for the population and
    0.611 for the one cell whose values match the example; the other reading gives 0.436 and 0.725,
    and matches no cell.
- kind: paper_inconsistency
  about: paper
  statement: The Results give 73 of 110 probes for frequency changes as 64.6%; 73/110 is 66.4%. 64.6%
    is the value given for AM (62/96).
