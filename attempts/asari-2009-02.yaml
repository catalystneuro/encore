- claim: methods-recording-counts
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:methods-recording-counts
  notes: The natural sound current-clamp set gives 305 probes in 39 cells (34 animals) with at least 4
    trials in each of at least two contexts, whether or not silence counts as a conditioning stimulus.
    MGB gives 93 probes in 14 cells with at least 10 trials per context, under both readings. These four
    counts match the paper exactly. 132 A1 current-clamp cells meet the criterion (39 natural, 95 of 96
    synthetic, 2 in both), against 123; leaving out the 5 cells of "naturalistic" sounds and the 3 cells
    of a natural probe after natural and pink noise contexts gives 124, and 132 cells have a probe that
    enters a Table 1 column. With each probe tested on the variants of one property, the Table 1 column
    totals for amplitude (95 probes) and frequency (110) equal the paper's, the DMR rows (8 and 20 probes
    in 2 and 5 cells), the natural AM and FM entries (25 probes each, 24 cells) and the TORC cell counts
    (9 and 9) match, and the TORC probes are 42 and 44 against 39 and 40. The data hold no modulated harmonic
    tone probes for amplitude, frequency or FM and 14 for AM against 71, so the AM, FM and higher-order
    totals are 39, 25 and 131 against 96, 82 and 137; the natural amplitude and frequency entries have
    45 and 46 probes against 23 and 25. By the synthetic ensemble used there are 14 TORC cells (paper
    14), 15 DMR (6), 26 MHT (39) and 26 MCN (27). The voltage-clamp counts (29 probes, 14 cells) cannot
    be tested, as the data set holds no voltage-clamp recordings. 333 synthetic probes have at least 4
    trials per context, with or without silence counted.
  deviations:
  - Probe sets follow the authors' CxtDep.m in the data set (asari/Tools), which the paper does not link.
    A probe is each fragment; its contexts are the fragments before it in the stimulus table and silence;
    trials are the first "Effective repeats" presentations of each sequence (param.notes), pooled over
    a context's occurrences and cut to the smallest count over contexts.
  - Triggers are assigned to table rows by their fragment lists, since in 20051107-ha1-001 the trigger
    labels are numbered 2, 4, 6, 8 while the table rows are numbered 1 to 4.
  - The Table 1 rows and columns are formed with the map from stimulus parameters to sound properties
    of fig8a-proportion-by-property.
- claim: a1-mgb-firing-rates
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_asari_2009.ipynb
  output: claim:a1-mgb-firing-rates
  measured:
  - 0.606
  - 0.625
  - 0.813
  - 8.98
  notes: No reading puts all four means within 10%. In A1 (39 cells, spontaneous over the intersequence
    silences), the means are 0.72 and 0.75 Hz at a 5 mV spike threshold, 0.61 and 0.63 Hz at 10 mV (evoked
    within tolerance), and 0.38 and 0.41 Hz at 20 mV; with a 1 s pre-stimulus baseline, the spontaneous
    means are 0.80, 0.67 and 0.43 Hz (the last within tolerance). Over all 133 A1 current-clamp cells
    with context files (natural and synthetic), the means are 0.62 and 0.70, 0.53 and 0.61 (evoked within
    tolerance), and 0.41 and 0.46 Hz. The A1 detectors give at most 0.6% of interspike intervals under
    1.5 ms in a file, and their mean waveform is a spike of 30 to 39 mV. In MGB (14 cells), the code's
    automatic threshold gives 0.55 and 4.99 Hz (0.72 Hz spontaneous with the baseline, within tolerance),
    20 robust SDs give 0.97 and 12.91 Hz, and 40 SDs give 0.81 (within tolerance) and 8.98 Hz. The 20
    SD threshold splits spikes (a median of 23% of intervals under 1.5 ms per file) and so do some files
    at 40 SD (up to 80%); with a 1.5-ms dead time after each spike, 20 SDs give 0.81 and 9.62 Hz and 40
    SDs 0.78 and 8.60 Hz (spontaneous within tolerance in both), and the automatic threshold 0.54 and
    4.97 Hz. A1 means are below 1 Hz in every reading, and the MGB evoked mean is above 5 Hz with the
    20 and 40 SD thresholds, with or without the dead time, which meets the partial rule; with the automatic
    threshold it is just below 5 Hz. Measured gives A1 at 10 mV over the 39 natural sound cells and MGB
    at 40 SDs, spontaneous over the silences. The SDs over cells (A1 0.84 and 0.92 Hz at 10 mV; MGB 1.31
    and 13.05 Hz at 40 SDs) are within 10% of the paper's SDs (0.61, 0.77, 1.25, 16.9 Hz) for one of the
    four, the MGB spontaneous SD. The data set holds 133 A1 current-clamp cells with context files and
    14 MGB cells, not the paper's 194 and 16. The automatic threshold of GetSpikes.m (2/3 of the largest
    filtered value, median 3.78 mV over files against 0.41 and 0.81 mV for 20 and 40 SDs) gives the lowest
    MGB rates of the three.
  deviations:
  - Assumption. The paper does not say how A1 spikes were detected, and GetSpikes.m sets them by hand
    for whole-cell data. Spikes are taken as excursions of the raw trace above its 10-ms median-clipped
    trace by more than 5, 10 or 20 mV, one per excursion. The code's high-pass filter, designed for 4
    kHz sampling, attenuates whole-cell spikes at 10 kHz and was not used for A1.
  - Assumption. MGB spikes use the high-pass filter and peak rule of GetSpikes.m (Methods, Analysis, paragraph
    3, "high-pass filter and thresholding ... peaks of suprathreshold segments"), with three thresholds,
    as the paper gives none.
  - Rates are per cell over its context files (tuning-curve files left out), over 39 and 14 cells.
  - Assumption. The 1.5-ms dead time is a standard refractory rule, shown as a check of the robust-SD
    thresholds; the paper gives none.
