- claim: a1-mgb-firing-rates
  outcome: not_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:a1-mgb-firing-rates
  measured:
  - 0.392
  - 0.439
  - 0.549
  - 4.992
  assumed: true
  notes: 'Main reading (A1 spikes at -20 mV, MGB spikes by the authors'' GetSpikes.m automatic detector;
    spontaneous over the whole intersequence silence; evoked over all sound periods). A1, 133 cells (39
    natural, 96 synthetic, 2 in both): spontaneous 0.392 +/- 0.614 Hz, evoked 0.439 +/- 0.689 Hz (paper
    0.47 +/- 0.61, 0.57 +/- 0.77, 194 cells). MGB, 14 cells: spontaneous 0.549 +/- 1.236 Hz, evoked 4.99
    +/- 11.45 Hz (paper 0.78 +/- 1.25, 11.4 +/- 16.9, 16 cells). The last 1 s before each sequence gives
    0.415 (A1) and 0.709 Hz (MGB, within 10%). No reading has all four means within 10%; the partial rule
    fails because the MGB evoked mean is 4.99 Hz, under 5 Hz. Variants: A1 at -10 mV gives 0.228 and 0.248
    Hz, at -30 mV 0.601 and 0.669 Hz; MGB with a robust 8-SD threshold gives 0.975 and 10.38 Hz (evoked
    within tolerance), with 5 SD 1.66 and 13.57 Hz. The outcome rests on the detectors. Question for the
    authors: how were A1 spikes detected and with what threshold, and which periods were taken as spontaneous
    and evoked?'
  deviations:
  - A1 spikes are upward crossings of -20 mV on the raw membrane potential with a 2-ms dead time (assumed;
    the paper does not say how A1 spikes were found, and GetSpikes.m extracts them by hand in whole-cell
    mode). -10 and -30 mV are shown.
  - MGB spikes use the authors' GetSpikes.m automatic mode (FIR high-pass forward and backward, threshold
    at 2/3 of the largest filtered value, spike at the peak), which matches the Methods' "high-pass filter
    and thresholding" and is adopted as the best-supported detector (assumed). Robust thresholds of 5
    and 8 SD are variants.
  - The data set holds 133 of the 194 A1 cells and 14 of the 16 MGB cells the paper averages over.
