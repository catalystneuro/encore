- claim: fig4-predictability-upper-bound
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig4-predictability-upper-bound
  measured:
  - 0.430
  - 2.317
  notes: Measured values are the main reading (smoothed denominator, silence counted, 0 to 4 s). The
