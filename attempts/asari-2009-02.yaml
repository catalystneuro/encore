- claim: fig9-mgb-fast-decay
  outcome: reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig9-mgb-fast-decay
  measured:
  - 5.58
  - 0.08
  - 0.813
  notes: Over the 93 probes in 14 MGB cells, the mean SD of PSTHs over contexts decays with a time
    constant of 0.080 s (code's automatic spike threshold) or 0.083 s (20 or 40 robust SDs) when
