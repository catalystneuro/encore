- claim: fig4-strf-performance-low
  outcome: blocked
  blocked_by: other
  notes: 'Not tested in this attempt. The data set holds the Wehr recordings (wehr/, 25 cells, of which
    the paper reanalysed 20 without naming them; 16 have stimuli presented at least twice, as the predictable
    power needs), their stimuli, and the authors'' STRFanalysis.m, ridgesvd1.m and logspectrogram.m, which
    fix contiguous cross-validation folds and the performance measure; the pseudo-logarithmic time bins
    are in the Methods. A first implementation (nine windows, ten folds, ridge and lowess fits) ran on
    three cells late in the run: one cell gave validation performance above 1 (up to 7.1, a near-zero
    predictable power in some folds) and another a negative LN validation performance (about -2.9), and
    these were not resolved before the time limit, so no result is reported. It was not kept in the entry.
    Nothing in the data set stops a later attempt from testing the claim.'
