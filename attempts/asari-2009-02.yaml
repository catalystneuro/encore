- claim: figs1-silence-probe
  outcome: reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:figs1-silence-probe
  notes: Of 44 silence probes in 38 cells, 26 have a significant period, and 22 in 19 cells have one
