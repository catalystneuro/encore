findings:
- kind: data_missing
  statement: The data set holds no voltage-clamp recording. The paper recorded 42 A1 cells in voltage
    clamp and analysed 14 (29 probes, Figures 5 and 6); every A1 file is a current-clamp whole-cell recording
    and Summary.mat lists no voltage-clamp experiment, so the conductance findings cannot be tested.
- kind: metadata_error
  statement: 'In two cells the fragment lists (param.stimulus) of the cell''s two recordings are swapped:
    20051108-ha1-001-002 and -003 (A1) and 20071010-ha2-005-002 and -003 (MGB). The stored fragment durations
    of each file add up to the other file''s sequence trigger durations to within 0.2 ms and miss its
    own by up to 1.8 s (A1) and 2.3 s (MGB). Cut with the stored lists, the probes of these files start
    at the wrong times; the fit of Figure 3B changes from 0.46 and 1.7 s to 0.49 and 1.0 s when they are
    corrected.'
- kind: metadata_error
  statement: In 20061201-ha2-001-002 every sequence trigger is 308 ms longer than the sum of its seven
    stored fragment durations (4200 ms each), and no other file of the cell fits. The true fragment boundaries
    are unknown; the stored durations were used, as the authors' CxtDep.m would use them.
- kind: other
  about: data
  statement: 20061231-ha2-001-002 states 4 effective repeats, but one of its sequences is presented 3
    times.
- kind: metadata_insufficient
  statement: Five TORC recordings described as bandwidth variants (20060313-ha1-001, 20060313-ha1-002,
    20060314-ha1-001, 20060315-ha1-001, 20060315-ha1-002) store no frequency band for their fragments,
    and their stimulus parameters are identical, so the variants can be told apart only by their description.
- kind: selection_undocumented
  about: data
  statement: The data set does not say which cells the paper used. The A1 synthetic-sound group holds
    96 cells, of which 95 meet the paper's inclusion rule, so with the 39 natural-sound cells 132 A1 cells
    meet it against the paper's 123, and the cells per stimulus family (TORC 14, DMR 15, MHT 26, MCN 26,
    natural-sound variants 14) do not map onto the paper's (14, 6, 39, 27). The 25 cells of Wehr's data
    include the 20 the paper reanalysed, which are not named.
- kind: data_missing
  statement: The recording of Figure 7 (a natural probe after DMR contexts in the bands 0.625-2.5, 2.5-10
    and 10-40 kHz) is not in the data set; no DMR recording stores those bands.
- kind: methods_unavailable
  statement: 'The paper does not say how A1 spikes were detected or which periods count as spontaneous
    and evoked for the firing rates (Methods, Analysis, paragraph 2); the authors'' GetSpikes.m extracts
    whole-cell spikes by hand. This attempt used a -20 mV threshold. Question for the authors: what detector
    and threshold, and which windows, give 0.47 and 0.57 Hz?'
- kind: methods_unavailable
  statement: 'The exponential fits (Eq. 44) give no bounds, start values or fit range. On these data an
    unbounded two-exponential fit of the Figure 3A curve takes a negative fast size for the rise in the
    first 50 ms; with sizes bounded at zero it gives slow constants of 0.90 to 0.97 s. Question for the
    authors: were the sizes bounded at zero, and over which times were the curves fitted?'
- kind: methods_unavailable
  statement: 'Table 1 and Figure 8 do not say which conditioning stimuli form each property''s ensemble,
    nor whether a probe tested with several ensembles of one property (for example AM variants at four
    FM settings) counts once or once per ensemble. The stored parameters reproduce the denominators for
    amplitude and frequency only when probes are counted and for AM and FM only when ensembles are counted.
    Question for the authors: how were the ensembles formed and counted?'
- kind: methods_unavailable
  statement: 'The Methods do not say whether silence counts among the contexts of Figures 3 and 4. The
    authors'' CxtDep.m, shipped with the data, includes the preceding intersequence silence as a context;
    the Figure 3B fit is reproduced with it (1.01 to 1.05 s) and not without it (0.55 s). Question for
    the authors: was silence a context in Figures 3 and 4, as the script does?'
- kind: paper_inconsistency
  statement: The Results give 73/110 frequency probes as 64.6%; 73/110 is 66.4%, and 64.6% is the AM figure
    (62/96).
