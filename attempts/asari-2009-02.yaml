- claim: fig8a-proportion-by-property
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig8a-proportion-by-property
  measured:
  - 57
  - 63
  - 18
  - 10
  - 45
  notes: Each synthetic probe was tested with the variants of one property as its only contexts. The probes
    number 95 for amplitude (30 cells) and 110 for frequency (34 cells), the paper's totals, but 39 for
    AM and 25 for FM against 96 and 82, as the modulated harmonic tone probes are missing from the data
    (methods-recording-counts), and 131 for higher-order against 137. 57, 63, 18, 10 and 45 are significant,
    against 77, 73, 62, 47 and 59; none is within 10%. The fractions are 0.600, 0.573, 0.462, 0.400 and
    0.344, so amplitude > frequency and AM > FM > higher-order, which meets the partial rule. All are
    below the paper's fractions (0.811, 0.664, 0.646, 0.573, 0.431), as the natural sound fraction is
    (0.61 against 0.669). Without the 5 files of naturalistic sounds, amplitude and frequency give 40/65
    and 50/80. The fraction per animal has a median of 0.83, 0.65, 0.33, 0.33 and 0.33 over 25, 24, 21,
    19 and 17 animals. 6 higher-order sets with fewer than 4 trials in a context were not counted.
  deviations:
  - Assumption. The property between two stimuli is read from their parameters. The notes of the files
    of a natural probe after modulated harmonic tones say which parameters make amplitude (AMmean), frequency
    (f0), AM (AMrange, or AMstd with AMmean) and FM (FMrange, FMstd) variants; TORC and DMR descriptions
    say amplitude (attenuation) or bandwidth and frequency (ff) variants; transformed natural sounds vary
    attenuation or a frequency shift (df); a natural sound against the pink noise made from it is a higher-order
    variant (Table 1 legend). Reversed and syllable-shuffled sounds and the n/dx/dt/Npeak/Npower transform
    have no Table 1 column and are left out as contexts.
  - Assumption. A probe tested with several sets of variants of one property (the 4 x 4 grids of AM and
    FM rates, forward and reversed sounds) is counted once, with the largest set and, among equal sets,
    the one with the lowest stimulus numbers; the paper does not say how such probes were counted.
  - The files of naturalistic sounds (natural sound, its amplitude and frequency variants) are counted
    under amplitude and frequency, with natural probes; the result without them is shown.
