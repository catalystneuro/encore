- claim: methods-recording-counts
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:methods-recording-counts
  notes: 'Natural-sound A1 probes 305 in 39 cells (paper 305, 39) under both readings of silence, as every
    probe has at least two non-silent contexts. MGB probes 93 in 14 cells (paper 93, 14); the data set
    holds 14 MGB cells, the paper recorded 16. A1 current-clamp cells meeting the criterion 132 (39 natural,
    95 synthetic, 2 in both) against 123; one synthetic-sound cell (20061231-ha2-001) has no eligible probe.
    By the families of their recordings the 132 cells are 37 natural only, 26 MHT, 26 MCN, 14 DMR, 14
    natural-sound variants, 13 TORC, one natural and TORC and one natural and DMR (the notebook lists
    them); by stimulus family the cells with an eligible ensemble are TORC 14 (paper 14), DMR 15 (6), MHT
    26 (39), MCN 26 (27) and natural-sound variants 14, so the families do not map onto the paper''s and
    the 9 cells that make the difference cannot be named. The voltage-clamp counts (29 probes, 14 cells)
    cannot be tested: the data set holds no voltage-clamp recording. No measured values are recorded,
    as the record needs one number for each of the seven expected values and two were not measured;
    the five measured counts are 132, 39, 305, 93 and 14. The TORC, DMR, MHT and MCN probe counts by
    property are reported under fig8a-proportion-by-property.'
  deviations:
  - 'Details the Methods leave open are taken from the authors'' scripts shipped in the data set (asari/Tools/CxtDep.m,
    ViewResp.m, GetEvoked.m), which the paper does not link: probes are the fragments'' stated durations,
    a fragment at the start of a sequence has silence (the preceding 4 s) as context, trials of one context
    are pooled and every context is cut to the smallest trial count, the Kruskal-Wallis test uses ordinal
    ranks without a tie correction, and each trial is centred on its mean over the probe window for the
    power measures.'
  - In 20051108-ha1-001 (A1) and 20071010-ha2-005 (MGB) the stored fragment lists of the cell's two files
