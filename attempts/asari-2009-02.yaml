- claim: fig4-strf-performance-low
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig4-strf-performance-low
  measured: 0.207
  notes: Wehr's data (crcns-ac1.zip, wehr/) hold 25 cells, 10 with a fixed set of natural sounds repeated
    over 6 to 25 trials and 15 with many sounds presented once or twice; 16 have a natural sound presented
    on at least two trials, which Eq. 52 needs, so the test is over 16 cells, not 20. With the 10-ms window
    and folds averaged as in the Methods, the mean validation (lower) performance of the STRF is 0.167
    at 180 ms and 0.207 at 4052 ms, and its largest value over the nine windows is 0.207, at most 0.22;
    with the 20-ms window it is 0.157 to 0.198. Pooled over folds it reaches 0.244 (10 ms) and 0.229 (20
    ms), above 0.22. The training (upper) estimate reaches 0.286. The LN validation mean is 0.05 to 0.14
    averaged over folds, below the STRF's, and 0.18 to 0.24 pooled; its training estimate is 0.02 to 0.04
    above the STRF's. The one-sided paired Wilcoxon test of validation performance at 4052 against 180
    ms finds an improvement in every reading, for the STRF (13 to 16 of 16 cells improve, p 0.0005 or
    less) and for LN (p 0.0065 or less); the Friedman test over the nine windows gives p 0.003 or less
    for the STRF. So the performance is low, as stated, but the longer window improves it, which the criterion's
    test counts against the claim. Most of the gain is reached by 0.5 to 0.9 s. Measured gives the largest
    mean validation STRF performance over windows (10-ms window, folds averaged). The traces are sampled
    at 4 kHz and were recorded with QX-314 in the pipette (file notes).
  deviations:
  - Assumption, fixed by the criterion. "Did not improve significantly" is judged by a one-sided paired
    Wilcoxon test over cells at 0.05; the paper names no test.
  - 16 of the 25 cells of Wehr's data are used, those with a natural sound presented on at least two trials
    (Eq. 52 needs m >= 2); the paper used 20 cells and does not list them. Files noted "Not included in
    the published results" are left out.
  - Assumption. The response is the 10-ms median-filtered membrane potential averaged in 4-ms bins (the
    finest lag bin of the Methods); the 10-kHz reading of the criterion does not apply, as these traces
    are sampled at 4 kHz.
  - Assumption. The spectrogram uses the first 17 of the 18 frequencies that Wehr's logspectrogram.m gives
    for 0.4 to 22.1 kHz at 3 per octave, to match the 17 bins and 765 parameters of the Methods.
  - Assumption. Lags before the sound onset see a zero (centred) spectrogram, so that every window length
    is fitted on the same response bins; STRFanalysis.m drops the first window of each stimulus instead.
  - The ridge value is chosen per fold on the validation fold (Methods), from 1e-10 to 1e2 times the largest
    eigenvalue of the training X'X (standard choice); 45 and 116 of 2880 folds chose the low and high
    ends of the grid. Folds are 10 contiguous blocks, sized as in STRFanalysis.m; the by-stimulus reading
    was not run.
  - The static nonlinearity is a robust local-linear lowess (5% span, five robust iterations; Methods)
    fitted on the training folds and interpolated onto the validation fold.
  - Eq. 53 is averaged over folds as in the Methods and STRFanalysis.m; the ratio of the means over folds
    is shown as a variant, as single folds with almost no predictable power give unstable ratios (single-fold
    values from -0.01 to 1.43).
