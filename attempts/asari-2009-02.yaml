- claim: methods-recording-counts
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:methods-recording-counts
  notes: The natural sound sample is exact, 305 probes in 39 cells, under both readings of silence,
    and so is the MGB sample, 93 probes in 14 cells with at least 10 trials. Of the 145 distinct A1
    whole-cell cells in the data set, 132 have at least one probe that meets the rule, against 123;
    restricted to the five ensembles the paper names, 118 distinct cells. By ensemble, natural
    sounds 39 (paper 39), TORC 14 (14), MCN 26 (27), DMR 15 (6) and MHT 26 (39); the DMR and MHT
    counts depend on how designs with a natural sound probe after DMR or MHT variants are assigned,
    which the files do not say. All 132 cells are in the natural and synthetic groups of
    Summary.mat; 14 of them meet the rule only through designs outside the five ensembles (9
    recordings of one natural sound at several attenuations or band shifts, 5 of naturalistic
    variants), and without them 118 remain. Which of these the paper counted cannot be told from
    the files. Two cells are listed in both the natural and the synthetic group of
    Summary.mat, which agrees with the paper's ensemble counts summing to 125 for 123 cells. The
    voltage-clamp counts (29 probes in 14 cells) cannot be tested, as no voltage-clamp recording is
    in the data set. The natural sound probe count (305) and the MGB counts (93, 14) are within their
    zero tolerance; the A1 total (132) is not.
  deviations:
  - The voltage-clamp part of the claim is not tested (no data).
  - Ensembles are assigned from the stimulus descriptions in each file (TORC, DMR, Modulated
    Harmonic Tone, pink noise); the paper gives no file-level assignment.
- claim: a1-mgb-firing-rates
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_asari_2009.ipynb
  output: claim:a1-mgb-firing-rates
  measured:
  - 0.363
  - 0.533
  - 0.618
  - 5.072
  notes: No reading puts all four means within tolerance. Measured values are the first reading
    (all silences, all stimulus periods, all recordings, 15-mV A1 detector). A1 over 145 cells, 15-mV
    detector, sequence recordings only, gives 0.488 Hz spontaneous and 0.541 Hz evoked (SD 0.608
    and 0.677), both within tolerance; over all recordings the spontaneous mean falls to 0.363 Hz
    (evoked 0.533). The 10-mV and 20-mV detectors give evoked means of 0.586 and 0.447 Hz over all
    recordings. MGB over 14 cells and all recordings gives 0.618 Hz spontaneous over all silences,
    0.817 Hz in the second before each stimulus, and 5.07 Hz evoked (SD 11.46); the tuning-curve
    recordings alone give 0.868 and 11.66 Hz, and the sequence recordings alone 0.551 and 4.99 Hz.
    The A1 means are below 1 Hz and the MGB evoked mean is above 5 Hz under the all-recordings
    reading, the claim's rule for partial. The MGB evoked rate is dominated by a few cells (one at
    43.1 Hz, most below 2 Hz on the sequence recordings). The automatic threshold is set once per
    file, as ViewResp.m passes the whole recording to GetSpikes.m; it lies at 76 to 235 robust SDs
    of the filtered trace, and over all files 219802 local maxima lie above it and 59180 between
    half of it and it, so in some files it leaves out large deflections. At half the threshold the
    MGB means are 0.822 Hz spontaneous and 7.15 Hz evoked over all recordings (1.03 and 13.37 Hz on
    the tuning-curve recordings, 7.07 Hz evoked on the sequence recordings), so the evoked mean
    stays outside tolerance and the partial rule still holds. The question for the paper's authors
    is under findings.
  deviations:
  - A1 spikes were detected by hand in the paper (GetSpikes.m, manual mode). Here a spike is a peak
    at least 10, 15 or 20 mV above the 10-ms median-filtered trace, an assumption; 15 mV is the main
    reading. MGB spikes use the automatic detector of GetSpikes.m (high-pass FIR, two thirds of the
    largest deflection), as ViewResp.m does for cell-attached data; a second detector at half that
    threshold is run as a reading.
  - 145 A1 cells and 14 MGB cells are in the data set, against 194 and 16 in the paper.
  - The 0.5 s after each test current pulse is left out of the silences.
- claim: fig2-example-reliability
  outcome: reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig2-example-reliability
  measured: 0.310
  notes: Mean pairwise correlation between the trials of one context over the probe period, 0.310
    +/- 0.098 over 39 cells (range 0.18 to 0.60) and 0.319 +/- 0.129 over 305 probes; the
    leave-one-out reading gives 0.436 +/- 0.104 over cells. Of 10 recordings with seven natural
    fragments and at least six trials, one (20051222-ha1-001) has a cell mean of 0.603, within 0.61
    +/- 0.07, and 15 probe-context values between 0.66 and 0.82 (0.74 +/- 0.08), so the example
    values are consistent with that cell. Measured gives the population value only. After the
    reader's answer on fig2-example-long-context the shown probe is identified as probe 4 of that
    recording (0.737 over its three contexts, 0.611 +/- 0.081 for the cell over its seven
    fragments); this claim's criterion and outcome are unchanged.
- claim: fig2-example-long-context
  outcome: reproduced
  assumed: true
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig2-example-long-context
  notes: Re-run after the reader's answer of 2026-11-15, which amended the criterion. The example is
    now identified by its reliability (cell mean 0.61 within 0.061 over seven fragments, probe 0.74
    within 0.074) besides its design, and the renewed divergence is tested after 3.6 s (4 s less
    10%) with no significant period between 2 and 3.6 s. Before the answer the criterion accepted
    any of the 40 probes with the design and asked for a gap from 2 to 4 s; two probes of other
    cells (20060105-ha1-001 probe 4, 20060225-ha1-001 probe 5) met it, with cell means of 0.310
    and 0.358, and the claim was recorded as reproduced on them. Now, with pairwise reliability,
    one of the 10 seven-fragment cells is in range (20051222-ha1-001, 0.611 +/- 0.081 over its
    seven fragments, 0.603 over its probe-context pairs) and one of its probes matches (probe 4,
    contexts silence, 2 and 3, six trials each, reliability 0.737). Its significant periods run up
    to 1.601 s, none from 1.601 to 3.971 s, and again from 3.971 to 4.597 s, so the amended
    criterion holds; at 0.1-ms resolution the gap is 1.6004 to 3.9696 s. The same probe is matched
    with the silence context left out of the reliability (0.716). Under the earlier 2 to 4 s gap
    it would fail, as its renewed run starts 29 ms before 4 s. With leave-one-out reliability no
    cell is in range (0.296 to 0.732, the example cell 0.725) and the claim would not be testable.
    Over all 305 probes, 18 have a significant period later than 4 s, and 10 are significant before
    2 s, not from 2 to 3.6 s and again after 3.6 s.
  deviations:
  - The significance measure runs at 1 kHz with runs of at least 5 ms, where the paper used 0.1 ms
    and 50 points; for the matched probe the two give the same gap (1.6004 to 3.9696 s at 0.1 ms).
  - The cell value is the mean over the seven fragments, each the mean over its contexts, from the
    Results ("0.61 +- 0.07 (mean +- SD) for the seven natural sound fragments tested in this cell")
    and the Figure 2 legend ("across all natural sound stimuli examined in this cell"); the mean
    over probe-context pairs (0.603) is shown and matches the same probe.
  - Assumed that reliability is the mean correlation over pairs of trials of one context, the
    first reading of fig2-example-reliability. The claims file leaves pairs and leave-one-out
    open, and the two give different outcomes here (reproduced, and not testable). The pairwise
    reading is adopted as it gives the paper's population mean (0.310 against 0.31 +/- 0.09),
    where leave-one-out gives 0.436, and the paper speaks of the "correlation coefficient of the
    response traces across trials" (Results, Context dependence, paragraph 2).
- claim: fig3a-proportion-significant
  outcome: reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig3a-proportion-significant
  measured:
  - 187
  - 0.613
  - 0.251
  notes: With silence counted as a context and the proportion over all 305 probes, 187 probes
    (61.3%) are significant and the late fraction is 0.251 (peak of the cumulative curve at 4.78 s,
    paper 4.72 s), all within tolerance. Over the running probes the late fraction is 0.267, outside.
