findings:
- kind: data_missing
  about: data
  statement: The data set holds no voltage-clamp recordings. All 346 result files are current-clamp
    or cell-attached traces in mV, and Summary.mat lists no voltage-clamp experiment, so the 42
    voltage-clamped cells of the paper (Figures 5 and 6, 29 probes in 14 cells analysed) cannot
    be studied.
- kind: data_missing
  about: data
  statement: The data set holds the cells the paper analysed, not all it recorded. Summary.mat lists
    39 A1 cells with natural sounds, 96 with synthetic ensembles (2 of them also in the natural
    set) and 12 unpublished whole-cell cells, and 14 MGB cells, where the paper reports 194 current-clamp cells and 16 MGB cells for its firing
    rates.
- kind: metadata_error
  about: data
  statement: In 20051107-ha1-001-003 the trigger descriptions are numbered
    "Sequence 2", "Sequence 4", "Sequence 6" and "Sequence 8", while the stimulus table in
    param.notes numbers the same sequences Seq.1 to Seq.4. The fragment lists agree, so triggers
    can be matched to the table by their content.
- kind: metadata_insufficient
  about: data
  statement: For the synthetic ensembles, the sound property varied among the conditioning
    stimuli is not recorded in one place. Some files state it in param.notes ("2-5,8 amplitude
    variants"), others in the stimulus descriptions ("TORCs amplitude variants"). 19 files of
    modulated harmonic tones and 9 files of transformed natural sounds (16 stimuli each, labelled
    only "Modulated Harmonic Tone k" or "natural sound (forward)" and "(backward)") do not
    state it, so the probes of Table 1 and Figure 8 cannot be formed from the labels.
- kind: code_mismatch
  about: paper
  statement: The Kruskal-Wallis test in the authors' CxtDep.m ranks the trials at each time point
    with a double sort, which gives tied values distinct ranks in trial order. The traces are
    int16 values times a scale factor, so ties can occur, and tied values in the first contexts
    get the lower ranks.
    The Methods (Eq. 10) describe the standard test.
- kind: code_mismatch
  about: paper
  statement: The high-pass filter in GetSpikes.m is an equiripple design for 4 kHz sampling (its
    comment, Fs=4000, Fpass=500) applied to traces sampled at 10 kHz. Its automatic threshold,
    2/3 of the largest filtered value, is a median of 3.78 mV over the MGB files, against 0.41 and
    0.81 mV for 20 and 40 robust SDs of the filtered trace, and gives an evoked MGB rate of 5.0 Hz
    against 12.9 and 9.0 Hz.
- kind: selection_undocumented
  about: paper
  statement: The paper reports 123 A1 current-clamp cells meeting its analysis criterion; the data
    set has 132 that meet it (39 natural sound cells and 95 synthetic ensemble cells, 2 in both),
    or 124 without the two synthetic designs that have no column in Table 1. Which cells make up
    the 123 is not stated.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. How were A1 spikes detected for the firing rates (0.47 and
    0.57 Hz over 194 cells), and over which periods were the spontaneous and evoked rates taken?
    GetSpikes.m sets whole-cell thresholds by hand. This attempt took excursions above the
    median-clipped trace (5, 10 or 20 mV); the 10 mV reading gives 0.61 and 0.63 Hz over 39
    cells. For MGB, which threshold was used? The code's automatic rule gives an evoked mean of
    5.0 Hz, and thresholds of 20 and 40 robust SDs give 12.9 and 9.0 Hz, against 11.4 Hz.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. In the two-exponential fit of Figure 3A, were the sizes
    bounded at zero, over which time range was the curve fitted, and was the proportion at time t
    taken over all probes or over the probes still running? With sizes free, the fit uses one
    exponential for the rise after probe onset (slow constant 0.44 s); with sizes bounded at zero
    it gives 0.15 and 0.25 s, and 0.08 and 1.00 s, against 0.17 and 0.20 s, and 0.09 and 0.90 s.
    This attempt assumed bounded sizes.
- kind: other
  about: paper
  statement: The authors' analysis code ships with the data set (asari/Tools/CxtDep.m, GetEvoked.m,
    GetSpikes.m and others in crcns-ac1.zip), though the paper does not mention it. It settles
    several details the Methods leave open, such as which presentations form the trials, the
    silence context and probe, and the per-trial centring of the power measure.
