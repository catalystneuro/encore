- kind: other
  about: data
  statement: Four MGB cells (20071012-ha1-001 to -004) come from an animal whose age is stored as 29
    days, outside the 20 to 28 days of the paper's Methods, and one cell (20061229-ha2-004) has no
    age.
- kind: other
  about: data
  statement: In some recordings the sequence numbers in the trigger descriptions differ from those
    in the notes (for example "Sequence 2, 4, 6, 8" in the triggers of 20051107-ha1-001-003 against
    "Seq.1 to 4" in its notes); the fragment lists agree, so the analysis uses the lists.
- kind: other
  about: data
  statement: The data set includes the authors' MATLAB analysis code (asari/Tools/CxtDep.m and
    others), which the paper does not mention. It fixes how probes, contexts, the silence context
    (last 4 s of the interval) and the silence probe (first 2.5 s) are formed, and it reproduces the
    paper's sample sizes exactly (305 natural sound probes, 93 MGB probes).
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. How were A1 spikes detected for the firing rates (the code
    says by hand), and which periods count as spontaneous and evoked, and which recordings? With an
    automatic detector the A1 means match (0.49 and 0.54 Hz) but the MGB evoked rate is 5.0 Hz over
    the sequence recordings against 11.4 Hz, and 11.7 Hz over the tuning-curve recordings.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. Over what time range were Eq. 44 fitted to the population
    curves, and how were probes of different lengths (2 to 6 s) combined at times after the shorter
    ones end? The time constants of Q(t) (Fig. 3B) and of Eq. 43 (Fig. 4) depend on it, 0.73 to
