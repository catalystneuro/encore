outcomes:
- claim: methods-recording-counts
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:methods-recording-counts
  notes: The natural sound current-clamp set gives 305 probes in 39 cells (34 animals) with at
    least 4 trials in each of at least two contexts, whether or not silence counts as a
    conditioning stimulus. MGB gives 93 probes in 14 cells with at least 10 trials per context,
    under both readings. These four counts match the paper exactly. 132 A1 current-clamp cells
    meet the criterion (39 natural, 95 of 96 synthetic, 2 in both), against 123; leaving out the
    5 cells of "naturalistic" sounds and the 3 cells of a natural probe after natural and pink
    noise contexts, which have no column in Table 1, gives 124. The voltage-clamp counts (29
    probes, 14 cells) cannot be tested, as the data set holds no voltage-clamp recordings. The
    per-ensemble counts of Table 1 were not formed, as the synthetic files were not mapped to
    the property varied (see the fig8 claims).
  deviations:
  - Probe sets follow the authors' CxtDep.m in the data set (asari/Tools), which the paper does
    not link. A probe is each fragment; its contexts are the fragments before it in the stimulus
    table and silence; trials are the first "Effective repeats" presentations of each sequence
    (param.notes), pooled over a context's occurrences and cut to the smallest count over
    contexts.
  - Triggers are assigned to table rows by their fragment lists, since in 20051107-ha1-001 the
    trigger labels are numbered 2, 4, 6, 8 while the table rows are numbered 1 to 4.
- claim: a1-mgb-firing-rates
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_asari_2009.ipynb
  output: claim:a1-mgb-firing-rates
  measured:
  - 0.606
  - 0.625
  - 0.813
  - 8.98
  notes: No reading puts all four means within 10%. In A1 (39 cells, spontaneous over the
    intersequence silences), the means are 0.72 and 0.75 Hz at a 5 mV spike threshold, 0.61
    and 0.63 Hz at 10 mV (evoked within tolerance), and 0.38 and 0.41 Hz at 20 mV; with a 1 s
    pre-stimulus baseline, the spontaneous means are 0.80, 0.67 and 0.43 Hz (the last within
    tolerance). In MGB (14 cells), the code's automatic threshold gives 0.55 and 4.99 Hz (0.72
    Hz spontaneous with the baseline, within tolerance), 20 robust SDs give 0.97 and 12.91 Hz,
    and 40 SDs give 0.81 (within tolerance) and 8.98 Hz. A1 means are below 1 Hz in every
    reading, and the MGB evoked mean is above 5 Hz with the 20 and 40 SD thresholds, which
    meets the partial rule. Measured gives A1 at 10 mV and MGB at 40 SDs, spontaneous over the
    silences. The SDs over cells (A1 0.84 and 0.92 Hz at 10 mV; MGB 1.31 and 13.05 Hz at 40
    SDs) are within 10% of the paper's SDs (0.61, 0.77, 1.25, 16.9 Hz) for one of the four, the
    MGB spontaneous SD. The data set
    holds 39 A1 cells with natural sound files and 14 MGB cells, not the paper's 194 and 16. The
    automatic threshold of GetSpikes.m (2/3 of the largest filtered value, median 3.78 mV over
    files against 0.41 and 0.81 mV for 20 and 40 SDs) gives the lowest MGB rates of the three.
  deviations:
  - Assumption. The paper does not say how A1 spikes were detected, and GetSpikes.m sets them
    by hand for whole-cell data. Spikes are taken as excursions of the raw trace above its 10-ms
    median-clipped trace by more than 5, 10 or 20 mV, one per excursion. The code's high-pass
    filter, designed for 4 kHz sampling, attenuates whole-cell spikes at 10 kHz and was not used
    for A1.
  - Assumption. MGB spikes use the high-pass filter and peak rule of GetSpikes.m (Methods,
    Analysis, paragraph 3, "high-pass filter and thresholding ... peaks of suprathreshold
    segments"), with three thresholds, as the paper gives none.
  - Rates are per cell over its context files (tuning-curve files left out), over 39 and 14 cells.
- claim: fig2-example-reliability
  outcome: reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig2-example-reliability
  measured:
  - 0.31
  - 0.611
  - 0.737
  notes: Under reading (a), the mean correlation over pairs of trials within a context, the
    population mean is 0.310 (SD 0.092) over 39 cells and 0.319 (SD 0.129) over 305 probes. Under
    reading (b), each trial against the mean of the others, it is 0.437 over cells and 0.448
    over probes, outside the tolerance. Among the five cells with seven natural fragments and six
    repeats, 20051222-ha1-001 has a mean of 0.611 (SD 0.081) over its seven probes. Its probe 4,
    preceded by silence and fragments 2 and 3, has 0.737. These are the paper's 0.61 +/- 0.07 and
    0.74, so this is taken as the Figure 2 cell. The other four cells have 0.24 to 0.31.
  deviations:
  - Correlations are over the median-filtered probe period within each context, then averaged
    over contexts (Results, Context dependence, paragraph 2, "correlation coefficient of the
    response traces across trials in a given context").
- claim: fig2-example-long-context
  outcome: partially_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig2-example-long-context
  notes: The matched probe is probe 4 of 20051222-ha1-001, identified by its reliability values
    (fig2-example-reliability); its contexts are silence and fragments 2 and 3, over six trials
    each, and it lasts 5.80 s. Context dependence is significant in short periods from 0.026 to
    1.601 s and from 3.970 to 4.596 s, with nothing significant from 1.601 to 3.970 s. The
    criterion asks for no significant period between 2 and 4 s; the period at 3.970 to 4.008 s
    overlaps that interval by 30 ms, so the criterion is not strictly met, while the statement's
    "after about 4 s" is. The other three probes of the cell overlap 2 to 4 s by 24 to 150 ms.
    Without silence among the contexts, the probe has two short significant periods (0.04 s and
    4.43 s). 17 of 305 natural probes have a significant period later than 4 s.
  deviations:
  - The cell is identified through the reliability values of the Figure 2A legend, which the
    claims file does not use to match the example.
- claim: fig3a-proportion-significant
  outcome: reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig3a-proportion-significant
  measured:
  - 186
  - 0.61
  - 0.252
  notes: With silence counted among the contexts and the proportion over all 305 probes, 186
    probes (61.0%) have a significant period, the late fraction is 0.252 and the cumulative curve
    peaks at 4.78 s (paper 4.72 s); all three are within tolerance. Over the probes still running,
    the late fraction is 0.267, outside tolerance. Without silence, 166 probes (54.4%) are
    significant and the late fraction is 0.17 to 0.18, outside tolerance. The fraction of
    significant probes per animal has a median of 0.66 over 34 animals (range 0 to 1).
  deviations:
  - The Kruskal-Wallis test ranks tied values by their average rank, the standard test of the
    Methods (Eq. 10). CxtDep.m ranks ties by trial order, which favours the first contexts on
    the quantised traces.
  - Noise floor from 1,000 shuffles of trials across contexts per probe (Methods, Significance
    measure). A significant period is at least 50 consecutive 0.1-ms points with P < 0.01
    (Methods); CxtDep.m requires a span of 50 samples, one point more.
- claim: fig3a-significance-decay
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig3a-significance-decay
  measured:
  - 0.151
  - 0.253
  - 0.0775
  - 0.996
  - 0.0022
  notes: With sizes bounded at zero and silence counted, two exponentials are selected in all
    four readings (all or running probes, fit to 4.72 or 6 s). The slow constant is 0.97 to 1.08
    s (within tolerance only for all probes fitted to 6 s, 0.971 s), the fast constant 0.25 to
    0.27 s and the slow size 0.068 to 0.080 (outside tolerance), the fast size 0.149 to 0.160
    (within tolerance over running probes). Two exponentials with the slow constant between 0.5
    and 2 s meet the partial rule. With free signs, the fit uses one exponential with a negative
    size and a 15 ms constant for the rise after probe onset, and its slow constant is 0.44 s,
    which meets neither rule. Without silence, one exponential is selected. The mean noise floor
    over 0 to 6 s is 2.2 x 10^-3 over all probes and 2.8 x 10^-3 over running probes (the latter
    within tolerance). Measured gives all probes, fit to 4.72 s, sizes bounded at zero.
  deviations:
  - Assumption. The paper does not give bounds or start values for the fit. Sizes are bounded at
    zero, as the Methods call them decay sizes and the legend reports positive ones; with free
    signs the outcome would be not reproduced. Start values come from a grid, best fit kept.
- claim: fig3b-fractional-power-decay
  outcome: not_reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:fig3b-fractional-power-decay
  measured:
  - 0.467
  - 1.769
  notes: The fitted size of Q(t) is 0.445 to 0.468 in the eight readings (silence counted or not,
    all or running probes, fit to 4 or 6 s), within tolerance. The time constant is 1.74 to 1.78 s
    with silence counted and 1.29 to 1.33 s without, outside tolerance in every reading. Q is
    1.04 at onset, 0.19 at 1 s, and lies between -0.06 and 1.04 over 0 to 6 s. Measured gives
    silence counted, all probes, fit to 4 s.
  deviations:
  - Each trial is centred over the probe period before the power terms are formed, as FracPow in
    CxtDep.m does (Methods, Analysis, "centered the subthreshold responses to have zero mean").
  - Power terms are stored as 1-ms means and fitted at 1 ms, a standard choice.
- claim: timescale-longer-than-membrane
  outcome: reproduced
  notebook: reproduce_asari_2009.ipynb
  output: claim:timescale-longer-than-membrane
  notes: The mean noise autocorrelation over 305 probes falls below 1/e at 0.071 s and below 0.1
    at 0.114 s. The autocorrelation of the intersequence silences (46 files) does so at 0.075
    and 0.120 s, and without their first 1 s at 0.073 and 0.116 s. Per file, the noise 1/e lag
    ranges from 0.045 to 0.133 s. All lags are under 150 ms and the 1/e lags are below a third of
    1.04 s.
  deviations:
  - Spontaneous segments are the first 5 s of each silence longer than 2 s, median filtered as
    the responses are.
