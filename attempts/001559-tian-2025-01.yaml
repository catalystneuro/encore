findings:
- kind: data_missing
  statement: The dandiset holds one mouse (sub-582364L); the Methods report six mice for the
    cortical recordings ("C57BL/6J mice (n = 6)"). The one mouse is taken to be the
    representative mouse of Figure 4D.
- kind: data_missing
  statement: The description says the dandiset includes "the python scripts used for analysis
    and for figure generation" of Figure 4; the published version holds only the 35 NWB files.
- kind: metadata_insufficient
  statement: The PMT recordings of 2025-05-31 have no stimulus table or events. The stimulus times
    are recorded only as image channel 1 (a TwoPhotonSeries described as "Imaging data acquired
    using ScanImage for Channel 1"), whose 5 s pulses match the stimulation trains; nothing says
    so. No file records which of the two electrodes or which current (2 or 4 mA) each session
    used, so the four conditions of Figure 4D cannot be identified.
- kind: metadata_insufficient
  statement: The channels are not described. No file says which detector or filter each of the
    four ScanImage channels is; every imaging plane has indicator and location "unknown" and no
    emission wavelength, and every session description is empty. From the images, channel 2 is
    green (FITC-dextran), channels 3 and 4 red, and channel 4 the one without green, consistent
    with the 645/65 filter of the Methods.
- kind: metadata_error
  statement: The three 2025-04-07 movies are stored as TwoPhotonSeries described as "Imaging data
    from two-photon excitation microscopy", but they are 40 Hz camera movies whose frames cycle
    through four exposure levels and whose contrast maps show the vessel tree, consistent with
    multi-exposure laser speckle imaging (Figure 4C). They carry no stimulus times.
- kind: metadata_error
  statement: The stated pixel size of the ScanImage series (grid_spacing 0.028125 um for 512 pixels
    and 0.0140625 um for 1024 pixels) gives a field of 14.4 um, about one neuron, while the
    stack of cells shows on the order of a hundred cell bodies and the wide field a whole vessel
    tree; the stated size is likely a unit or scale error.
- kind: metadata_insufficient
  statement: The dates of surgery and virus injection are not recorded (only the date of birth,
    2024-10-29), so the paper's "three months after surgery" for the expression images cannot be
    checked; the stacks were taken 63 days after the first recording through the window.
- kind: other
  statement: Two of the six PMT recordings of 2025-05-31 (14:42 and 14:46) have no stimulus pulses;
    the paper does not mention unstimulated recordings and the files do not say what they are.
    The bioluminescence level rises within them and over the day (channel 4 from about 352 to
    about 402).
- kind: methods_unavailable
  statement: Question for the paper's authors. For Figure 4D, which response window, baseline and
    test establish the "clear increases"? With the 5 s before onset as baseline, the 15:04
    session's increase is significant with a 0-5 s window by a one-sample t-test (p = 0.046) but
    not by a Wilcoxon test (p = 0.116), nor with a 0-10 s window (p 0.21 and 0.25), so whether
    all four conditions show an increase depends on the choice.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which of the four stimulated sessions of 2025-05-31
    is which electrode (region 1 or 2) and which current, and which ScanImage channel is the
    645/65 PMT? This attempt assumed one condition per session, the two sessions with the larger
    responses (14:55 and 14:59) as 4 mA, and channel 4.
- kind: methods_unavailable
  statement: Question for the paper's authors. When was the whisker pad stimulated during the
    three speckle movies of 2025-04-07, and how was the speckle response of Figure 4C measured?
    The files record no stimulus times.
