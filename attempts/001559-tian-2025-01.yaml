outcomes:
- claim: fig4b-expression-healthy
  outcome: reproduced
  notebook: reproduce_tian_2025.ipynb
  output: claim:fig4b-expression-healthy
  notes: The channel 4 mean projection of the 2025-06-09 stack of cells holds 184 bright compact
    cell-sized objects at a Laplacian-of-Gaussian scale of 4 px and 91 at 6 px (centres a median
    1.70 and 2.03 times the local median), in labelled tissue whose median is 3.55 times the
    darkest 5% of the field. The wide-field stack shows a bounded bright red region (95th
    percentile 519 units against a median of 17) with the vessels dark, and the vessels bright
    in the green channel. Somata are labelled; processes are not resolved one by one and appear
    as labelling between the somata. No surgery date is in the files; the stacks were taken 63
    days after the first recording through the window (2025-04-07), so at least two months after
    surgery, consistent with but not showing three months. Health is not judged, as the
    criterion says.
  deviations:
  - The criterion is qualitative; the count of compact bright objects (a Laplacian of Gaussian
    with a threshold of 5 robust s.d., at two scales) is a standard choice made here to put
    numbers to the image, not the paper's.
  - The channel identities (channel 2 green, channels 3 and 4 red, channel 4 the 645/65
    channel) are inferred from the images; the files do not state them.
  - Stacks are subsampled by 2 in each spatial dimension and averaged over all frames; the
    paper's inset is an average projection over 30 um in z, and the z step is not in the files.
- claim: fig4c-speckle-responsive-region
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_tian_2025.ipynb
  notes: The three 2025-04-07 movies (40 Hz, 1000 by 920 pixels, 108 to 147 s) are present; their
    frames cycle through four exposure levels and their contrast maps show the vessel tree,
    consistent with multi-exposure laser speckle imaging. They carry no stimulus marker,
    stimulus times or description, so the comparison of stimulation with the time before it
    cannot be formed. While preparing (not in the notebook), the spectrum of the whole-field
    flow index 1/K^2 of all frames of the three movies showed no peak at a stimulation period;
    finding stimulation periods from the flow itself would assume the response the claim
    tests. The registration of the speckle field to the eBRIC region is also not recorded.
- claim: fig4d-steady-baseline
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_tian_2025.ipynb
  output: claim:fig4d-steady-baseline
  notes: Channel 4, change of the 5 s pre-onset baseline from the first to the last trial, by
    recording, 18.34 (14:50), 6.64 (14:55), 1.84 (14:59) and 0.79 (15:04) units, against a mean
    4 mA response of 17.44 (window a) and 14.13 (window b). Three of four recordings meet the
    criterion in both channels and both windows; the 14:50 recording does not (channel 3, 17.53
    against 16.61 and 13.60). The channel 4 level also rises by 6.39 and 11.02 units within the
    two unstimulated recordings before it, and from about 352 to about 402 over the six
    recordings of the day. With the 4 mA reference taken from the two weak sessions (2.49 or
    2.02), the 14:55 recording fails as well; with any pairing that includes one strong
    session, the same three recordings pass.
  deviations:
  - The criterion compares the drift with the 4 mA response in the same recording, but each
    recording here holds one condition. The comparison is with the mean 4 mA response of the
    same channel over the two assumed 4 mA recordings; the recording's own response is shown as
    a variant, and with it the same 14:50 recording fails.
  - Assumed, as the dataset does not record the current of each session, that the four
    stimulated sessions are the four conditions of Figure 4D and that the two with the larger
    mean responses are the 4 mA ones. The paper says the 4 mA condition gives the response
    strong enough to detect single events (Results, In Vivo BLI, paragraph 1), which supports
    the larger responses being 4 mA. Every pairing is shown.
  - Assumed that channel 4 is the PMT with the 645/65 filter (Methods, Surgery Preparation and
    Bioluminescence Recording), from the 2025-06-09 images where channel 4 shows the red
    expression without the FITC-dextran vessels and channel 3 shows both. Channel 3 is shown and
    gives the same outcome.
  - The PMT signal is the mean of the pixels of each scan line, in bins of 128 lines (59 ms), a
    standard choice; the paper does not give the time base of its traces.
  - Stimulus times come from image channel 1, read as a marker of the 5 s trains (Methods,
    "Electrical stimulation (5 Hz, 5 s, 2 mA and 4 mA)"); its pulses last 4.985 to 4.992 s.
- claim: fig4d-evoked-increase
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_tian_2025.ipynb
  output: claim:fig4d-evoked-increase
  notes: Per session, channel 4, window a (0 to 5 s), mean response 2.65 (14:50), 15.93 (14:55),
    18.95 (14:59) and 2.33 (15:04) units; Wilcoxon p 0.0078, 0.0039, 0.0078, 0.116; t-test p
    0.013, below 0.0001, below 0.0001, 0.046. Window b (0 to 10 s), 15:04 mean 1.00, Wilcoxon p
    0.246 and t-test p 0.211; the other three sessions are significant under both tests. So all
    four conditions show an increase under window a with the t-test and three of four under the
    other three readings; channel 3 gives four of four under the same reading and two or three
    of four under the others (the 14:50 session also fails the Wilcoxon test in window a,
    p = 0.125). The criterion makes the claim methods_underspecified when the readings disagree.
    The result does not depend on which session is which condition, since every condition must
    show an increase. One mouse is in the dandiset, so the two readings of which mice coincide.
    In the 15:04 session two of ten trials have baselines that start within 10 s of the previous
    onset. The question of which window and test the paper used is for the paper's authors.
  deviations:
  - Assumed that the four stimulated sessions are the four conditions (two electrodes by two
    currents); the dataset does not label them.
  - Channel 4 is taken as the 645/65 PMT and channel 3 shown; both give the same disagreement
    among readings.
  - One mouse of the paper's six is in the dandiset; it is taken to be the representative mouse
    of Figure 4D.
- claim: fig4d-4ma-single-trials
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_tian_2025.ipynb
  output: claim:fig4d-4ma-single-trials
  notes: Blocked because it depends on fig4d-evoked-increase, which is blocked (protocol, a claim
    that depends on a blocked claim is blocked for the same reason). The test ran. Under the
    assumed current, all 15 trials of the two 4 mA sessions exceed 3 times the s.d. of their
    smoothed baseline, in both windows, both thresholds and both channels. With one weak session
    in the 4 mA pair the pooled fraction is 0.53 to 0.75, and with the two weak sessions 0.28 to
    0.50. The 2 mA fractions are 0.20 to 0.50 (channel 4). The single-pulse variant does not show
    responses to individual pulses; the folded modulation at the 0.2 s period during
    stimulation is 0.31 and 0.47 against 0.27 and 0.37 in the 5 s before (channel 4, the two
    4 mA sessions), per-trial p 0.11 to 0.13.
  deviations:
  - Rests on the same assumed current assignment and channel as fig4d-steady-baseline.
  - The single-pulse variant uses the line signal (0.46 ms per line), with each stimulation
    period detrended and folded in 20 phase bins of the 0.2 s period, with the first pulse
    assumed at the marker onset; the paper gives no pulse times.
- claim: fig4d-electrode-timing
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_tian_2025.ipynb
  output: claim:fig4d-electrode-timing
  notes: Blocked because it depends on fig4d-evoked-increase, which is blocked. The test ran. At
    the assumed 2 mA the 14:50 session has both the later peak and the later rise (channel 4,
    peak 4.42 against 3.60 s, rise 2.54 against 0.005 s; channel 3 likewise), in 0.89 and 0.98
    of bootstrap resamples of the trials; the 15:04 average is small (peak 2.54) and crosses
    half its peak at onset. At the assumed 4 mA neither session has both later times (channel 4
    peaks both at 3.71 s, rises 1.42 and 1.01 s; channel 3 peaks 3.24 and 3.95 s with rises 1.18
    and 0.89 s). So the criterion's condition holds at one current, the weaker, under the
    assumed pairing. The dataset does not label the electrodes, so no session can be named
    region 1.
  deviations:
  - Rests on the same assumed current assignment and channel as fig4d-steady-baseline; under the
    other pairings of sessions into currents, some session also has both later times at one
    current (printed in the notebook).
  - The electrodes are not labelled, so the claim is tested as one electrode having both later
    times, as the criterion says for that case.
