- claim: cue-responsive-units
  outcome: reproduced
  notebook: reproduce_moaddab_2021.ipynb
  output: claim:cue-responsive-units
  measured:
  - 423
  - 190
  - 11
  notes: The screen as the code runs it (floored integer rates, a NaN test counted as not significant)
    gives 423 units from 190 sessions, and the per-rat counts equal Figure S1 exactly (fewest 11, rb11).
    With unfloored rates from the spike times the same tests select 461 units, 409 of them in common.
  deviations:
  - The rates are floored to integer Hz as in cubeScriptPR25.m and rrfAnalysis.m (lines 5 to 60); the
    Methods do not mention flooring. The unfloored variant is shown.
- claim: behavior-discrimination
  outcome: reproduced
  notebook: reproduce_moaddab_2021.ipynb
  output: claim:behavior-discrimination
  measured:
  - 0.422
  - 0.398
  - 0.821
  notes: Per rat over the 190 sessions with a cue-responsive unit, cue effect F(2, 20) = 103.57, p = 2.8e-11
    (the paper's F and p). Means D 0.871, U 0.449, S 0.051. Differences D-U 0.422 [0.264, 0.516], U-S
    0.398 [0.261, 0.748], D-S 0.821 [0.704, 0.891], all excluding zero and within tolerance. Pooling trials
    per rat gives the same means and CIs that also exclude zero.
  deviations:
  - CIs are studentized bootstrap intervals with 1,000 resamples and standard errors s / sqrt(n); MATLAB's
    bootci, called as in rrfAnalysis.m 1744 with no StdErr, estimates them from 100 nested bootstrap samples
    (NBootStd). Each CI is judged by the sign it gives in most of 20 draws, a convention of this attempt
    that the claims file does not set (notebook, bootstrap section);
    the nested standard errors give the same majority sign for every CI.
- claim: kmeans-elbow
  outcome: reproduced
  notebook: reproduce_moaddab_2021.ipynb
  output: claim:kmeans-elbow
  notes: Under the claims file's reading z-b with scikit-learn's k-means, the criterion is met in all
    4 combinations of outcome start (12 or 12.5 s) and runs (best of 10, mean of 10); the outcome rests
    on these. The other readings of the claims file are mixed, z-b with 10 runs of the MATLAB stream
    3 of 4 and z-a 3 of 4 with scikit-learn and 0 of 4 with the MATLAB stream; over the 45 readings
    in the notebook (three normalizations, three outcome starts, five ways to run k-means) 30 meet it.
    The code's own runs (rng(1) before each k) meet it with the measure the code plots, mean(sumd) (8224
    at k = 1; drops after 8 clusters at most 78.9 against 128.2 from 7 to 8), but that measure is a sum
    at k = 2, and its drop from 2 to 3 (4848) is larger than from 1 to 2 (1216). With the Methods' measure
    (mean squared distance per unit) the same runs rise once, from 12 to 13 clusters (by 0.151).
  deviations:
  - "The k-means matrix is the code's: outcome epochs from 13 s after cue onset (rrfAnalysis.m), not 12\
    \ or 12.5 s (the claims file's readings e-a, run as variants). The code runs k-means once per k, not\
    \ 10 times as the Methods say; the claims file's readings e-b (best of 10, mean of 10 runs) are run\
    \ as variants, with 10 runs continuing the MATLAB stream after rng(1) (an assumption about how MATLAB\
    \ draws replicates) and with scikit-learn."
  - The outcome rests on reading z-b with scikit-learn's k-means++ standing for the Methods' 10 runs (an
    assumption; with 10 runs of the MATLAB stream z-b meets the criterion in 3 of 4 combinations). The
    code plots mean(sumd) as a bar plot on a 0 to 9000 axis (rrfAnalysis.m 952 to 986, printed), not
    the Methods' mean squared distance per unit; mean(sumd) is shown as a variant.
  - "Normalized firing is the code's (cubeScriptPR25.m): single-trial differential rates, floored to integer\
    \ Hz, z-scored over all 16 trials and all bins of a unit, then averaged by trial type. The Methods\
    \ (Z-score normalization) describe z-scoring the trial-type means across trial types. The claims file\
    \ left this open (readings z-a and z-b) and asked an author who finds the code to follow it; z-a and\
    \ z-b are run as variants. Assumed that the code is what the paper did; the exact recovery of the\
    \ paper's cluster sizes, F values and correlations under it supports this."
  assumed: true
