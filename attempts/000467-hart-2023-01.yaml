findings:
- kind: metadata_error
  statement: The planes' starting_time values step by 0.0335 s, so a 33-plane volume takes 1.105 s,
    while each file's imaging_rate is 0.83 volumes/s (1.205 s per volume) and the paper states 27.5
    frames/s and a volume every 1.2 s. The data do not show which is right; the analysis times volumes
    by the imaging rate.
- kind: metadata_insufficient
  statement: The odor, concentration and trial are given only in the file and session names and the stimulus
    timing (onset 3 s, 5 s pulse) only in free-text descriptions; the files hold no stimulus or trial
    table. The bilateral files do not say which antennal lobe is the left one.
- kind: other
  statement: Each file holds one plane of one trial as uncompressed float64, although the values are
    13-bit integers (0 to 8191), so the dandiset is 14,685 files and 1.26 TB. A whole-lobe analysis of
    the alarm experiment must open about 11,600 files; this attempt read about half a terabyte through
    range requests.
- kind: selection_undocumented
  statement: The general odorant files hold the five odorants the paper analyses and the vehicle; the paper
    says 7 to 9 odorants were presented, and the dandiset does not say that the others were left out.
- kind: methods_unavailable
  statement: Questions for the paper's authors. How were the ROIs drawn on the max projections (any
    size or shape rule, how adjacent glomeruli were separated), was an ROI's value its mean or its
    maximum, and was "responding" judged on the trial-mean value (Methods) or per trial and averaged
    (Figure S5 legend)? This attempt adopted glomerulus-sized ROIs, the mean, and the trial-mean rule;
    the counts of responding glomeruli, the vehicle responses and the identification of PGb, 6G and
    PGa depend on these choices.
- kind: methods_unavailable
  statement: Questions for the paper's authors. Which trials were excluded for motion artifacts, and by
    what rule? How was the centre plane of a glomerulus chosen, and what ROI was measured on the
    three-plane projection? What distance makes two glomeruli adjacent when identifying 6G and PGa?
- kind: other
  statement: No file or trial is deposited twice. All 14,685 assets have distinct content, and no two
    trials of an ant have identical baseline volumes in the maps computed.
