- claim: fig3f-general-odorants-unique
  outcome: not_reproduced
  notebook: general_odorants.ipynb
  output: claim:fig3f-general-odorants-unique
  notes: Across ants, 11 of 28 ant and odorant cases have their centroid closer to the same odorant in the
    other ants than to any other odorant (3-hexanone in all 6 ants, ethanol in 4 of 6, ethylpyrazine in
    1 of 6, isopropanol and propionic acid in none); the criterion needs more than half, under every M2
    reading, and the centroid test does not depend on the M2 reading. Within ants, no odorant pair has
    the same responding ROIs under the four readings a; under the readings b there are 4 to 36 identical
    pairs summed over the 6 ants (bix 4).
  deviations:
  - Stabilization by whole-pixel phase correlation in place of Fiji's Image Stabilizer; ROIs drawn by
    rule inside an AL mask (log-Otsu on baseline fluorescence), not by eye.
  - "\"Closer\" was read as a smaller mean distance to the same odorant's centroids in the other ants
    than to each other odorant's centroids; the claims file does not fix the distance rule."
