- claim: figs5a-sparse-median-6
  outcome: reproduced
  assumed: true
  notebook: alarm_pheromones.ipynb
  output: claim:figs5a-sparse-median-6
  measured: 3
  notes: Under bix the medians over ants are 1 (heptanone), 1 (heptanol), 3 (hexanol) and 0.5 or 1 (6MHO)
    at 48% (8 ants) and at each ant's higher concentration (13 ants); the largest is 3. All four readings
    b give at most 4. The readings a give largest medians of 33.5 to 48.3, because they keep every
    thresholded region, down to single 1.2 um bins, as an ROI. Leaving out the 4 trials where most of
    the AL is at least 0.2 changes nothing.
  deviations:
  - The paper drew ROIs by eye. Of the claims file's readings, the outcome rests on bix, adopted as an
    assumption because the Results define glomeruli as 10 to 20 um across (reading b keeps ROIs of
    that size), ImageJ measures an ROI by its mean (value i), and the Methods state the rule of the
    trial-mean value (counting x). The readings disagree (b meet the criterion, a do not); all are shown.
  - Stabilization by whole-pixel phase correlation; ROIs drawn by rule inside an AL mask.
  - Overlapping ROIs of two odors were taken as one glomerulus when at least half of the smaller
    overlaps the larger and their depths are within 2 planes (10 um); the Methods say only "the same
    z-depth".
