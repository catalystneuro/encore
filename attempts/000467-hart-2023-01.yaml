- claim: fig4-no-decreases
  outcome: not_reproduced
  notebook: alarm_pheromones.ipynb
  output: claim:fig4-no-decreases
  notes: '594 regions at least 10 um across reach -0.2 or below in at least two trials of one odor at
    the higher concentration, in the same plane, without doing so in the vehicle trial (540 of them 10
    to 20 um), in all 13 ants; the most negative has a mean of -0.452 (ant4-m4-d26-y2022, hexanol, plane
    3). 168 more are negative in the vehicle trial too. Their placement points to motion, which the paper
    names as the source of small non-specific decreases: 487 of the 594 touch the AL border (within one
    1.2 um bin) and 564 lie within 5 um of it, against 83% expected for a 10 um region placed at random
    in the AL; 384 overlap a negative region of another odor in the same plane (302 by half or more).
    The criterion counts them all, so the outcome follows the reader''s rule; the vehicle comparison rests
    on one trial per ant.'
  deviations:
  - Only each ant's higher concentration was mapped for this claim.
  - Stabilization by whole-pixel phase correlation, not Image Stabilizer; residual motion could produce
    some of the negative regions, and the vehicle comparison removes only those it shares.
  - A region "doing so in the vehicle trial" was read as at least half of its bins at -0.2 or below in
    the vehicle map of the same plane; the claims file does not say how a region is matched.
