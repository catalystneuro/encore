- claim: fig3f-general-odorants-unique
  outcome: not_reproduced
  notebook: general_odorants.ipynb
  output: claim:fig3f-general-odorants-unique
  notes: Across ants, 10 of 27 ant and odorant cases have their centroid closer to the same odorant in
    the other ants than to any other odorant (3-hexanone in 5 of its 6 ants; ethanol has no pixel of at
    least 0.2 in one ant, so 27 cases); the criterion needs more than half, and the centroid test does
    not depend on the M2 reading. Within ants, identical odorant pairs occur under every M2 reading (1
    to 9 summed over the 6 ants; bix 7).
  deviations:
  - Stabilization by whole-pixel phase correlation in place of Fiji's Image Stabilizer; ROIs drawn by
    rule inside an AL mask (log-Otsu on baseline fluorescence), not by eye.
  - 'ROIs are the regions of at least 0.2 in a trial''s map that recur in another trial of the odor (claims
    file, drawing a), a recurrence read as an overlap of at least half the smaller region, an assumption:
    the claims file does not say how much overlap makes a recurrence. In round 1 the pixels of at least
    0.2 in two trials were taken instead, which broke the maps into fragments.'
  - The Minimum filter uses ImageJ's radius-2 kernel (21 pixels, RankFilters); round 1 used a 13-pixel
    disc.
  - '"Closer" was read as a smaller mean distance to the same odorant''s centroids in the other ants than
    to each other odorant''s centroids; the claims file does not fix the distance rule.'
