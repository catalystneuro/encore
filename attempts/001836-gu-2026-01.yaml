findings:
- kind: data_missing
  statement: The decoder output behind Figures 3 to 5 and S3 to S11 (the posterior per 2 ms bin, the
    continuous and fragmented state probabilities, the detected remote and local extended events) is
    not deposited, nor are the spike marks or MUA times. Only the 30 kHz voltage is, from which these
    would have to be recomputed over 12.7 TB.
- kind: metadata_insufficient
  statement: None of the 2415 Spyglass analysis files (`obj-*.nwb`) says what it holds; the file
    names carry only an object id, and their tables have empty descriptions. By content they are
    head position, velocity and orientation (750), linearized position at about 23 Hz and at 500 Hz
    (446), and decodes triggered on events (1219). The triggered tables do not say which events
    trigger them, what the two integers of `triggered_trial_info` are, or what the `baseoff` and
    `abs` variants of the decodes mean. The track graph of the linearization is not deposited; which
    track segment is which arm had to be read from the head's position at each well's pokes.
- kind: data_missing
  statement: The dandiset holds fewer trials than the paper reports for three rats. Built from the
    poke and pump events, it holds 2083, 3519, 4578, 2959 and 1816 trials for rats M, E, J, K and L,
    against 2370, 3554, 4628, 3779 and 2087 in the Figure 1E inset (0.88, 0.99, 0.99, 0.78 and 0.87
    of them). Rat M has 5 days against the 6 the paper says were collected; rat J has 12 days against
    about 11 in Figure 1C.
- kind: other
  statement: Rat M's 500 Hz linearizations are each deposited twice, in 26 pairs of files with
    identical values, one pair per run epoch. They are counted once.
- kind: metadata_error
  statement: Rat M's Statescript logs are named "syayescript Seq2Session1" and so on, a misspelling
    of "statescript", and hold no trial or reward counts, unlike the other rats' logs. Rat M's days
    also have 4 LFP files for 5 days.
- kind: paper_inconsistency
  statement: The reward log gives the cycle 3-4-2-1-3 for rats M, E and J and 1-2-4-3-1 for rats K
    and L. This fits the Results (1-2-4-3-1 in 2 rats, 3-4-2-1-3 in 3) and the Figure 1B legend (rat
    E, 3-4-2-1-3), while Figure S1E labels Seq2 (1-2-4-3-1) for M, E and J. The files name the
    epochs of K and L "Rev2" and those of M, E and J "Seq2".
- kind: metadata_error
  statement: The head orientation series (`scratch/CompassDirection/head_orientation`) gives its unit
    as meters.
