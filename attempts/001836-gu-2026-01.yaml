- claim: figs7b-no-swr
  outcome: reproduced
  assumed: true
  notebook: reproduce_gu_2026.ipynb
  output: claim:figs7b-no-swr
  measured:
  - -0.224
  - 0.15
  - 0.074
  notes: 'Measured values are window a, reading (ii), the first matching reading the criterion lists, without the
    reference subtraction. SWRs detected on the 1 kHz LFP of 39 days (rat M''s fifth day has no LFP file; 64 of
    2706 windows dropped). Per rat, as many unrewarded and rewarded trial ends as COM trials (120, 196, 124, 223,
    239). Under reading (iii), the pseudo-inverse fit with a constant, all rat indicators and the three conditions,
    the COM coefficient is negative and both end coefficients positive with p < 0.05 in both windows and both reference
    readings (window a, no subtraction, -0.043, 0.049 and 0.030 events/s, p = 6e-12, 3e-15 and 1e-6). Reading (ii),
    z-scored within rat, holds without the subtraction in both windows (window a -0.22, 0.15 and 0.07; the rewarded
    value is outside 0.30 plus or minus 0.16) and not with it; reading (i), the three conditions without a constant,
    holds in none. The mean COM rate is below both end rates in 5 of 5 rats in window a without the subtraction
    and in 4 of 5 otherwise. Ripples are rare: 0.13 to 0.34 per second of immobility in the baseline windows and
    at most 0.22 per second at trial ends. The LFP shares the behavioral clock: theta amplitude correlates with
    head speed at no shift (median Spearman 0.68 over 13 days) and not at shifts of 5 or 30 s (-0.20 to -0.02),
    weakly in rat K.'
  deviations:
  - Ripple band, consensus trace, thresholds and speed limits from the Methods (SWR detection; Electrophysiology).
    The filter is an equiripple FIR with the Methods' band edges, not ghostipy's design, a standard choice.
  - 'Assumed: every tetrode with more than one channel in the LFP file is used, as the electrode table gives no
    locations and the Methods include "all electrodes with visible SWRs"; the first good channel of each.'
  - 'Assumed: the corpus callosum reference of the Methods is the channel named by `ref_elect_id` where it is in
    the file (all days of M, E, J and L, no day of K); the result is shown with and without the subtraction and
    the outcome is the same.'
  - 'Assumed: the session baseline (mean and SD at speed above 4 cm/s) is estimated per run epoch from 20 windows
    of 4 s spread over the epoch, to keep streaming small.'
  - Windows (a) 2 s around COM time and the 2 s after the outer poke, (b) from COM time (stopping) to leaving the
    arm and from the outer poke to the last beam release at that well before a poke elsewhere; the first COM event
    of each COM trial; sessions with at least 20 trials; rate as SWR onsets per second of window.
