- claim: fig1g-com-matches-run-through
  outcome: reproduced
  notebook: reproduce_gu_2026.ipynb
  output: claim:fig1g-com-matches-run-through
  notes: Sessions with at least 20 trials. Over 100 draws of nearby non-COM trials, each rat's median rank-sum p
    is 0.60, 0.57, 0.22, 0.17 and 0.75 for M, E, J, K and L at 10 cm (0.68, 0.52, 0.20, 0.16 and 0.75 at 9.6 cm);
    the share of draws with p < 0.05 is at most 0.22 (rat K). The median differences of daily reward rate, COM minus
    nearby, are -0.03, -0.08, 0.12, 0.05 and 0.00. Every COM trial had an eligible nearby trial. Each rat has 5
    to 12 daily values, so the test has little power and the result is an absence of evidence.
  deviations:
  - Nearby trials are drawn within the same session; the Methods (Identification of nearby trials) say only within
