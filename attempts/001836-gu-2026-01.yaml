  - Sessions with fewer than 20 trials are left out (claims file, opening comment, point 2).
- claim: fig1h-final-choice-less-switching
  outcome: not_reproduced
  notebook: reproduce_gu_2026.ipynb
  output: claim:fig1h-final-choice-less-switching
  notes: Sessions with at least 20 trials. The mean daily initial ratio exceeds the final in all five rats (medians
    3.00 to 3.63 against 0.93 to 1.41), but the paired t-test reaches p < 0.01 only in rats J and K (p = 0.0023
    and 0.0045 at 10 cm); E and L have p = 0.013 and 0.014 and M p = 0.42. The 9.6 cm threshold gives the same count
    (J 0.0022, K 0.0001, E 0.017, L 0.018). The criterion asks for four rats at p < 0.01, or three for a partial
    reproduction, so the outcome is not reproduced; at p < 0.05 four rats (E, J, K, L) would hold, which is the
    pattern the legend reports with p < 0.01. The sign tests hold as the legend says at 10 cm, the initial ratio
    above 2 and the final below 2 with p < 0.05 in E, J, K and L and not in M. Days with no same-side transition
    are dropped, as the criterion says (1 day of E and 2 of J for the initial ratio). In a variant asked for by
    the verifier, adding one to both counts so that no day is dropped, J, K and L reach p < 0.01 and E has p = 0.010;
    that would be a partial reproduction, but the criterion's rule decides.
  deviations:
  - The previous trial is the one before in the same session, and transitions from the previous arm to the same
    arm are left out as neither switch-side nor same-side; the claims file does not say.
  - Sessions with fewer than 20 trials are left out (claims file, opening comment, point 2).
