- claim: fig3b-extended-before-stopping
  outcome: partially_reproduced
  notebook: reproduce_gu_2026.ipynb
  output: claim:fig3b-extended-before-stopping
  notes: 'COM rows are the 908 rows of the 160 COM-triggered, arm-restricted tables from arm entry to stopping (in
    a median 90% of rows per file the trigger lies within 20 ms of one of this entry''s COM times, at a median distance
    of 2 ms); 896 have a distance. Controls are the 975 rows of the 177 tables triggered at the outer poke, 2 s
    before it (outbound runs), restricted to the arm; 737 have a distance over a head range drawn from the same
    day''s COM rows. Largest |head - decode| at 4 cm/s or more, COM against matched control: medians 13.8 against
    10.0 cm (M), 12.7 against 12.5 (E), 15.8 against 13.6 (J), 19.3 against 13.1 (K) and 16.4 against 13.0 (L);
    one-sided rank-sum p < 1e-4, 0.053, 0.0072, < 1e-4 and < 1e-4. So COM is greater at p < 0.01 in 4 of 5 rats
    (not E). Only reading (b)(i) can be run: the arm-restricted tables set moments with 0.2 or less of the posterior
    in the arm to NaN, and the control tables hold only the 2 s before the poke, not 5 s. Without matching the arm
    range the controls have larger distances (p = 0.85 to 1.0).'
  deviations:
  - The `scratch/triggered` tables carry no description. They are read with the paper's code, which wrote them (Gu2026
    at commit 0f0c9a7, changeOfMind_triggered_position.save_triggered_position_decode_day, changeOfMind_triggered.find_triggered_session
    and turnaround_triggered_decode), and each file is identified by aligning its trigger times with this entry's
    COM times (10 cm and 9.6 cm) and outer pokes, by its window, and by whether its positions are relative to the
    trigger (restricted to the COM arm). The decodes are the MAP (their values lie on the decoder's 2 cm position
    grid), from the causal posterior as the code reads it. The arm regions are the code's (changeOfMind_remote_interval.loc1d_to_baseoff)
    and match the arm bases of the deposited linearization.
  - The control rows are the outbound tables the paper's code wrote (2 s before the outer poke), not trials drawn
    here; the arm range of each is drawn from the same day's COM rows with a fixed seed (figure4c.return_distance_day).
