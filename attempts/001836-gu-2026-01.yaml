  notes: Values are reading a-i (10 cm, all trials), the first the criterion lists. Trials are 2083, 3519, 4578,
    2959 and 1816 for M, E, J, K and L against 2370, 3554, 4628, 3779 and 2087; COM trials are 120, 196, 126, 226
    and 240 against 107, 225, 138, 315 and 309. Within tolerance are 3 of 10 counts under readings a-i and a-ii,
    and 4 of 10 under b-i and b-ii (0.1 of the 96 cm arm, 9.6 cm; COM 120, 206, 128, 231 and 242), against the 8
    the criterion asks for (5 for a partial reproduction). Every rat has at least 120 COM trials under every reading,
    so the "hundreds of COM trials per subject" part holds in the sense of the criterion. The dandiset holds 0.88,
    0.99, 0.99, 0.78 and 0.87 of the paper's trials; the COM share of trials is 0.058, 0.056, 0.028, 0.076 and 0.132
    against the paper's 0.045, 0.063, 0.030, 0.083 and 0.148, so for rats K and L most of the shortfall in COM trials
    follows the shortfall in trials. Per day, rat M has 5 days of 400 to 480 trials against the 6 days the paper
    reports, which would account for its shortfall; rats K and L have the 8 and 6 days of Figure 1C (319 to 456
    trials a day), and no epoch is tagged other than "Session" or "Sleep", so where their missing trials are cannot
    be told from the files.
  deviations:
  - COM detection on the deposited 500 Hz linearization (Methods, Change of mind time detection), whose outer arms
    are 85.3 to 87.2 cm long in its units, against the 96 cm of the Methods; the 0.1-of-arm reading uses 0.1 of
    96 cm (Methods, Behavioral apparatus, "The distance from the beginning of the arm to the end of the reward station
    is 96 cm"). The binary closing of the reversal mask uses scipy's default structure, as the Methods name the
    function without parameters.
  - The claims file's code reading that requires 0.8 s of position in the second before the reversal is applied;
    the 500 Hz linearization has at most 8% NaN samples in any epoch.
- claim: fig1d-initial-switch-bias
  outcome: reproduced
  notebook: reproduce_gu_2026.ipynb
  output: claim:fig1d-initial-switch-bias
  notes: On the first analysed day P(switch-side)/P(same-side) is 5.53, 4.23, 3.76, 2.31 and 2.25 for rats M, E,
    J, K and L; the mean of the first two days is 5.59, 3.54, 4.00, 2.66 and 2.30. Both readings put all five above
    2 (one-sided binomial p = 0.031). Transitions to the same arm (52 of 14708) are neither switch-side nor same-side
    and are left out.
