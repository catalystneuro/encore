- claim: fig2g-dd-gamma-csd-feedforward
  outcome: reproduced
  assumed: true
  notebook: v1_laminar.ipynb
  output: claim:fig2g-dd-gamma-csd-feedforward
  measured: 117
  notes: S7's first-sink times tie at the first sample of the window in both readings, as every
    layer group holds a displayed sink there (the display threshold, 2 SD over the number of
    windows, passes 89% of points). With the tie-break (sink onset of each group's mean CSD) the L4
    sink starts before the L2/3 and L5/6 sinks under both bands (L4 -6.4, L2/3 -2.4, L5/6 2.4 ms in
    reading a; -12.8, -4.8 and 6.4 ms in reading b). 117 windows (reading a) and 108 (reading b)
    against 125.
  deviations:
  - Tie-break of S7's first-sink rule, chosen here (protocol, reader step 3, "unable to decide"),
    the first lag at which the mean CSD over a layer group's rows turns from source to sink. The
    paper reads the patterns by eye.
  - The band-pass FIR (Syncopy firws in the code) is not specified; a zero-phase windowed-sinc FIR
    of at most 249 taps is assumed, as the 600 ms segments do not allow longer filters.
  - The CSD repeats the edge rows (Elephant StandardCSD's default Vaknin electrodes), computed here
    without Elephant.
