  - 1351
  notes: Counted from the stimulus tables of the 14 mice, as the claims file defines the conditions.
    The habituation count matches (700); the others differ by -3 (XXXY), +5 (xxxX), -4 (xxxx), +3
    (xxxY) and -1 (yyyy) trials, at most 0.6%, inside the criterion's 5% bound for a partial
    result. The paper's code reads its conditions from passiveglo_task_data.mat, which is not in
    the dandiset, so the selection cannot be matched trial by trial. A likely cause is the handling
    of the 0 to 2 main-block sequences per mouse that match neither the habituated pattern nor its
    global oddball, which are left out here. Sub-621890 has a different schedule (807 main-block
    and 100 sequence-control sequences) and is counted as it is.
  deviations:
  - Conditions rebuilt from the grating orientations and blocks of init_grating_presentations; the
    dandiset has no condition labels and the paper's condition file is not public.
- claim: three-contrasts-gamma-increase
  outcome: reproduced
  notebook: v1_laminar.ipynb
  output: claim:three-contrasts-gamma-increase
  notes: Masked points with a positive contrast between 30 and 60 Hz in V1, DD 2424, GO 1539 and
    SSA 2064 under S3 reading (a); 1820, 444 and 1743 under reading (b). Largest values 6.18, 1.39
    and 2.80 dB (reading a). The same under all five seeds.
  deviations:
  - LFP at 1250 Hz (the files' rate), so the 200 ms Hann window is 250 samples padded to 256.
  - Each trial is de-meaned before the spectrogram, assumed to follow Syncopy's default
    (polyremoval 0); the paper and the claims file do not say.
