findings:
- kind: format_error
  about: data
  severity: major
  statement: In version 0.240503.0152, the version the paper cites, the LFP timestamps of every probe
    file of 7 of the 14 mice (sub-642507, sub-645322, sub-645324, sub-645495, sub-647836, sub-649323,
    sub-649324) run 0, 24, 48, ... with no relation to seconds, so their LFP cannot be put on the clock
    of the stimulus tables. Version 0.240923.1441 replaced these 42 files with timestamps in seconds.
- kind: other
  about: data
  severity: critical
  statement: In version 0.240503.0152 the LFP of sub-645495 is nearly identical to that of sub-645322
    (correlation 0.999 to 1.0 on all six probes) and the LFP of sub-645324 nearly identical to that of
    sub-647836 (0.9985 to 1.0), while their stimulus tables differ; one recording of each pair is deposited
    under the wrong subject. In version 0.240923.1441 no two probe files of different mice correlate above
    0.85 on the same sample.
- kind: data_missing
  about: data
  severity: major
  statement: In version 0.240503.0152 the probe files of sub-649323 hold 86 to 88 LFP channels, one in
    four, where the other mice hold 255 to 384; version 0.240923.1441 holds 344 to 353.
- kind: metadata_insufficient
  severity: major
  statement: The stimulus table init_grating_presentations has no block, sequence or condition labels;
    the habituation, main, random and sequence-control blocks and the conditions the paper analyses can
    be told only from the grating orientations. The paper's code reads them from a file (passiveglo_task_data.mat)
    that is not in the dandiset. Rebuilt from the orientations, the counts differ from the paper's by
    1 to 5 trials in 5 of 6 conditions.
- kind: metadata_error
  severity: minor
  statement: The LFP is stored at 1250 Hz, where the paper's Methods state an LFP band at 2.5 kHz.
- kind: metadata_error
  severity: major
  statement: The electrode area labels leave three mice without a probe labelled AL (sub-621890 and sub-632485
    have two probes labelled LM, sub-637908 two labelled RL), and probe 3 of sub-632487 has no visual-cortex
    label, so LM has 13 mice and AL 11, where the paper says each mouse had a probe in each of the six
    areas.
- kind: other
  about: data
  severity: minor
  statement: The habituation cohorts are 8 mice ("bbba") and 6 ("aaab"), where the paper describes two
    cohorts of 7; one mouse (sub-647836) is 88 days old, below the paper's 95 to 128 days; the dandiset
    has 4 male and 10 female mice. Five sessions have no eye tracking.
- kind: other
  about: data
  severity: none
  statement: In version 0.240923.1441 every LFP file has a linear clock in seconds (residuals below 1e-8
    s) and, in every session, the evoked V1 difference between the two P4 orientations of the main block
    grows only after P4 onset, so the LFP and the stimulus table share a clock as far as this contrast
    shows.
- kind: methods_unavailable
  statement: 'Question for the paper''s authors. The FOOOF fitting range for the spectrogram correction
    is not stated: the Methods give 2 to 90 Hz with a 2 Hz resolution, which fits the per-mouse spectra,
    and the code fits the whole 5-150 Hz spectrogram grid. Three V1 laminar claims (fig2e, fig3d, fig4def)
    change outcome between the two. Which range was used for the figures? This attempt adopted the code''s
    range.'
- kind: methods_unavailable
  statement: Question for the paper's authors. The CSD laminar patterns are judged by eye; the claims
    file's rule (order of the first displayed sinks) ties at the window start because the display threshold
    (2 SD over the number of windows) passes about 90% of points. How were the onsets read, and with which
    band-pass filter (Syncopy firws order) and bands (the Methods' 2-10, 10-30 and 30-90 Hz or the code's
    4-8, 12-24 and 30-50 Hz)? This attempt used each group's mean sink onset, counted for a displayed
    sink lasting at least 1/8 of a cycle, and adopted the Methods' bands; fig2h, fig3i and fig4h change
    outcome with the bands.
- kind: methods_unavailable
  statement: Question for the paper's authors. Supplementary Figure 4 names no test for the pupil comparison
    and the code at cee2e6f has none. Which test, window and z-scoring were used? The cluster test of
    the claims file finds a difference.
