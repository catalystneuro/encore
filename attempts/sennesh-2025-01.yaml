- claim: three-contrasts-gamma-increase
  outcome: reproduced
  notebook: v1_laminar.ipynb
  output: claim:three-contrasts-gamma-increase
  notes: Masked points with a positive contrast between 30 and 60 Hz in V1, DD 2277, GO 1554 and SSA 2060
    under S3 reading (a); 1832, 460 and 1748 under reading (b). Largest values 5.59, 1.37 and 2.82 dB
    (reading a). The same under all five seeds.
  deviations:
  - LFP at 1250 Hz (the files' rate), so the 200 ms Hann window is 250 samples padded to 256.
  - Each trial is de-meaned before the spectrogram, assumed to follow Syncopy's default (polyremoval 0);
    the paper and the claims file do not say.
  - 'Kept rows taken from the paper''s code (epych cee2e6f, statistics/alignment.py ChannelAlignment and
    signal.py downsample): channels ordered from the tip up, the L4 centre at round(median) of the L4
    positions, the crop range(centre - down, centre + up), which leaves out the topmost common row, and
    every fourth row from the deepest. The round-1 analysis started at the top row.'
