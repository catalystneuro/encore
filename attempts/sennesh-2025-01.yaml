    without the median filter, to fit the time limit; the per-mouse spectra average over those rows. v1_laminar.ipynb
    repeats the V1 tests with and without the filter (Figure 5 V1 values move by at most 0.09 dB).
  - LM has 13 mice and AL 11, as the probe labels allow (see findings).
