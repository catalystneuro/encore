- claim: dd-aperiodic-no-difference
  outcome: reproduced
  notebook: areas.ipynb
  output: claim:dd-aperiodic-no-difference
  notes: Per mouse, area and condition, one FOOOF fit to the trial- and row-mean spectrum; Welch permutation
    tests of offset and exponent, XXXY against xxxy. None of the 24 tests (6 areas, 2 parameters, the
    text's and the code's windows and ranges) has p < 0.05; the smallest p over the five seeds is 0.53.
    Differences of means are at most 0.074 in offset and 0.058 in exponent. 14 mice per area, 13 in LM
    and 11 in AL.
