findings:
- kind: data_missing
  statement: The dandiset holds one NWB file from one of the paper's 22 mice, with the spike times of
    1013 sorted units and their labels. The four signals the Methods say were recorded besides the spikes
    (the nasal airflow, the odor signal of the photo-ionization detector, the odor-trial TTL and the inhalation-onset
    TTL), the artificial airflow pulses, the unit waveforms and the brain area of each unit are not in
    it, and neither are the other 21 mice. All 37 claims need some of these, so none can be tested. The
    paper says its processed data are available from the lead contact on request, and its code deposit
    (Zenodo 10.5281/zenodo.10381293) loads preprocessed files it does not hold.
- kind: metadata_insufficient
  statement: The file gives no brain area for its units and has no electrodes table. Phy-good units lie
    along the whole probe (depth 80 to 3840), so they include structures above the piriform cortex, and
    the paper's selection of PCx layer 2 and 3 units cannot be repeated. The experiment the mouse belongs
    to is given only by the keyword "Concentration Series", and the odors given are not stated.
- kind: metadata_error
  statement: KSLabel is "good" for all 1013 units and ContamPct is 100 for all of them. Kilosort labels
    a cluster good when its estimated contamination is low, so the two columns contradict each other and
    say nothing about the units. The Phy curation (quality) is good for 359 units, mua for 10 and missing
    for 644.
- kind: metadata_insufficient
  statement: Of the unit table's columns only quality, spike_times and unit_name have a description. The
    others (KSLabel, sh, ch, depth, Amplitude, amp, ContamPct, fr, n_spikes, original_cluster_id) say
    "No description.", and depth, Amplitude and amp have no unit. The session description is the converter's
    default.
- kind: other
  statement: The file's related_publications names the bioRxiv preprint (10.1101/2023.04.04.535405), not
    the published paper, and the two 2024 versions of the dandiset (0.240305.0939 and 0.240305.0945) do
    not name the paper; version 0.261011.1559 and the draft do. All versions hold the same asset.
- kind: other
  statement: What could be checked is consistent with the paper. The Phy-good units have ISI violation
    rates (median 0.0066, Q1 0, Q3 0.029, by the Hill et al. formula at 1.5 ms) and presence ratios (1
    in every quartile) in the ranges the Methods report, all fire above the 0.5 Hz threshold, no unit
    is duplicated, and the summed activity of the good units nearest the probe tip (by the standard Neuropixels
    1.0 channel map, which depth follows; the file names no probe) peaks at 2.78 Hz, within the range of
    mouse breathing, and this peak is not a harmonic.
verifications:
- date: '2026-11-02'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The first executed notebook with the conclusion cells and the summary removed, the helper module and the claims file, with the paper. The verifier queried the archive API and tested helper functions on synthetic inputs. It gave its own outcome for each claim; all 37 agree with the record. Its points that concern no single claim were answered as follows. B3, the claims file path is outside the bundle - the cell now prints the 37 claim ids of mechano.CLAIM_NEEDS and runs the comparison only where the claims file is present. B4, the spectral argmax can report a harmonic - mechano.spectral_peak now moves the peak to its subharmonic when the power there is at least half the peak, shown on synthetic 3 Hz trains (largest power 6.01 Hz, checked peak 2.98 Hz); the 0 to 1000 band stays at 2.78 Hz, and the 2000 to 3000 band moves from 2.93 to 1.51 Hz. The depth convention is now checked against the data - depth lies within 20 of 20 + 20 floor(ch / 2), the standard Neuropixels 1.0 map with channel 0 at the tip, and the notebook says the probe type is assumed, as the file names none.
