  - claim: fig4-unipolar-pattern
    outcome: reproduced
    assumed: true
    notebook: reproduce_kim_2023.ipynb
    output: claim:fig4-unipolar-pattern
    notes: In each of the three 833 kHz paired dishes, uptake next to the apex exceeds uptake next to
      both base electrodes under all eight readings (ROI touching the footprint or 200 um farther out,
      on the line to the centroid or around the electrode, background a or b); the smallest per-dish ratio
      of apex to the larger base is 1.86 to 3.68 across readings. In each of the three single-pulse dishes
      the base taken as energised exceeds the apex (smallest per-dish ratio 1.40 to 2.18), and the other
      base also exceeds the apex on average (1.25 to 2.31). Spearman correlation of uptake with field
      strength over about 1070 ROIs per dish is 0.50 to 0.96 in the single-pulse dishes and -0.10 to -0.26
      in the paired dishes.
    deviations:
      - The files give no pixel size. 0.65 um per pixel is assumed, from the ORCA-Flash4 camera and the
        10x objective of Methods 4.4 (6.5 um camera pixels). It is consistent with the needle footprints
        (median dark radius 0.72 mm; the needles are 1.5 mm in outside diameter, Methods 4.2), with 32
        ROIs of 200 um spanning base to apex (6.4 mm against 6.12 mm from the base midpoint to the apex
        centre, Methods 4.4), and with the field of 5 to 10 kV/cm along the bisector (Results 2.1; 4.6
        to 12.7 kV/cm here).
      - The electrode positions are found in each image from the dark footprints (the ImageSeries description,
        "dark circles indicate electrode footprints") by fitting a rigid triangle; the paper placed its
        ROIs in MetaMorph (Methods 4.4) and the files hold no ROIs.
      - Which side of an electrode the adjacent ROI is on is not given; the ROI on the line to the triangle's
        centroid and the mean of eight ROIs around the electrode are both run, and agree.
      - The files do not say which base electrode was energised in the single-pulse dishes; the base with
        the larger adjacent uptake is taken as energised.
      - The field map is computed with the claims file's models B and C over a grid of 200 um ROIs within
        4 mm of the triangle's centroid; the paper's map is a Sim4Life simulation (Methods 4.3).
      - Background reading (b) subtracts the mean YP within 0.5 mm of the three electrode centres of the
        same dish (Methods 4.4, footprint measurements made "to account for 'spontaneous' YP uptake");
        the radius is a standard choice inside the dark footprint.
