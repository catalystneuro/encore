findings:
  - kind: metadata_error
    statement: 'BPAE-03 and BPAE-18 of 7-31-21 (1 Hz, single-pulse trains) are the same recording deposited
      twice as two subjects: every compressed image chunk is identical and both have session start time
      2021-07-31T20:19:49-04:00.'
  - kind: metadata_error
    statement: The file of subject 600ns_4kV_0,8MHz_BP_8-24-21_BPAE_13, filed with the 833 kHz paired-pulse
      dishes, has the session id BPAE_5xBipolar_0,83MHz and the description of another experiment (bipolar
      pulses between two parallel cylinders 3 mm apart); its image shows the three footprints of the triangular
      array and the paired-pulse uptake pattern of the other two 833 kHz paired dishes.
  - kind: metadata_insufficient
    statement: The images carry no pixel size (resolution -1, unit n.a.), and the files hold no electrode
      positions, ROIs, angles of field direction change or measured values, so the paper's Figure 2 values
      cannot be recomputed without placing ROIs and modelling the field anew. The channel order is stated
      only in the ImageSeries description text, and which base electrode was energised in the single-pulse
      dishes is not stated.
  - kind: metadata_error
    statement: The ImageSeries description of every file says "144 images captured in a 12x12 grid from
      a six-well plate" and "216 additional images"; the paper's dishes are 35 mm glass-bottom dishes
      imaged as 216 stitched images (Methods 4.1 and 4.4).
  - kind: data_missing
    statement: The square-array experiment of Figure 3 and the FluoVolt strobe imaging of Figure 5 are
      not in the dandiset; the paper says its data are available on request.
  - kind: selection_undocumented
    statement: The dandiset has five unique 1 Hz control dishes from two days (7-31-21 and 8-9-21) and
      three 833 kHz controls imaged six weeks after the paired dishes; the paper gives n = 3 for Figure
      2 and does not say which control dishes were used or how they were matched. With all of them the
      1 Hz crossover angle is 145.3 to 149.6 degrees; with the two of 8-9-21 only it is 130.5 to 161.4.
  - kind: methods_unavailable
    statement: Questions for the paper's authors. (1) Where were the 32 ROIs of Figure 2 placed along
      the dashed line of Figure 7B; contiguous from the apex footprint back past the base midpoint (assumed
      here), or between the base midpoint and the apex? The two layouts give different outcomes for the
      60-fold ratio. (2) How was the angle of each ROI obtained? (3) How were the footprint measurements
      used to account for spontaneous uptake; subtracted from each ROI (assumed here)? Without it no ratio
      approaches 20- or 60-fold. (4) Which control dishes formed the 100% of Figure 2, and were ratios
      taken per dish? (5) What is the pixel size of the stitched images (0.65 um assumed)?
