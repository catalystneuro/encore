outcomes:
  - claim: fig2-180-cancellation
    outcome: partially_reproduced
    assumed: true
    notebook: reproduce_kim_2023.ipynb
    output: claim:fig2-180-cancellation
    measured:
      - 2.42
      - 11.77
    notes: Measured values are on layout L2, angle model B, background (b), normalisation (i), at the
      ROI of largest angle. Cancellation is present at both frequencies under every reading and is stronger
      at 833 kHz, but the two fold values are never both within tolerance. With background (b), L2 gives
      2.42 to 2.51 fold at 1 Hz (expected 2 +- 0.2) and 11.77 to 21.98 at 833 kHz, the ROI of lowest value
      giving 18.52 to 21.98 (within 20 +- 2); L1 gives 1.92 to 2.48 at 1 Hz (1.92 and 2.19 within tolerance)
      and 11.22 to 11.48 at 833 kHz. The same pattern holds when the background is the lumen alone, the
      wall ring alone or a 0.6 mm disk (L2, 1 Hz 2.40 to 2.54, 833 kHz at the lowest ROI 16.44 to 22.80).
      The 833 kHz match on L2 rests on the lowest of 32 ROIs, which is biased toward a larger fold; the
      lowest ROI and its two neighbours give 16.42 to 18.77 fold, the mean of all ROIs above 160 degrees
      13.10 to 13.93, and the lowest ROI with the bootstrap bias removed 16.22 to 20.14. Per paired dish
      at 833 kHz, ROIs 0 to 7 are 3.5 to 10.0% of the mean control, so no one dish sets the value. Without
      subtraction (a) the values are 1.26 to 1.55 and 2.66 to 3.38 fold, a variant that decides nothing.
      With the 1 Hz controls of 8-9-21 only, 1 Hz gives 2.26 to 2.27 fold under (b). What the reader's
      answer changed (questions/000631.yaml) is that reading (a), no correction for spontaneous uptake,
      is not one the paper allows. The criterion is now judged under background (b) alone, with (a) as
      a variant. The outcome is unchanged (partially reproduced before and after), as (a) and (b) both
      failed the criterion.
    deviations: &id001
      - The files give no pixel size. 0.65 um per pixel is assumed, from the ORCA-Flash4 camera and the
        10x objective of Methods 4.4 (6.5 um camera pixels). It is consistent with the needle footprints
        (median dark radius 0.72 mm; the needles are 1.5 mm in outside diameter, Methods 4.2), with 32
        ROIs of 200 um spanning base to apex (6.4 mm against 6.12 mm from the base midpoint to the apex
        centre, Methods 4.4), and with the field of 5 to 10 kV/cm along the bisector (Results 2.1; 4.6
        to 12.7 kV/cm here).
      - The electrode positions are found in each image from the dark footprints (the ImageSeries description,
        "dark circles indicate electrode footprints") by fitting a rigid triangle; the paper placed its
        ROIs in MetaMorph (Methods 4.4) and the files hold no ROIs.
      - ROI layout, left open by the paper (claims file, opening comment). The claims file's standard
        choice, 32 contiguous ROIs from the base midpoint toward the apex outside the footprints, does
        not fit (5.37 mm from the base midpoint to the apex footprint against 6.4 mm for 32 ROIs of 200
        um), so this is a deviation from the claims file. Two layouts were run. L1 has 32 ROIs evenly
        spaced from the base midpoint to the apex footprint, overlapping by about 15%; L2 has 32 contiguous
        ROIs from the apex footprint back along the bisector past the base midpoint. L2 decides and L1
        is a variant, as an assumption. L2 keeps the ROIs 200 um and side by side (Methods 4.4) and outside
        the footprints, and its first ROI lies at the point where the angle is 180 degrees (0.84 to 1.03
        mm beyond the base midpoint, against 0.85 to 1.00 mm for that ROI), so its angles run from 180
        degrees at the base to near 0 at the apex, as Results 2.1 says ("the electric field vector angle
        gradually changed from 180° at the base to nearly 0° at the apex electrode"). L1 starts at the
        base midpoint, where the angle is 168 to 170 degrees, and never reaches 180.
      - The angle of each ROI is computed with the claims file's readings B (2D conduction on a 0.1 mm
        grid, equipotential disks of 1.5 mm, insulating wall of 17.5 mm radius centred on the image) and
        C (line sources at the electrode centres), as the paper does not say how the angles were obtained.
        Both give the same outcome.
      - Controls are the five unique 1 Hz single-pulse dishes (three of 7-31-21, two of 8-9-21) and the
        three 833 kHz ones (10-5-21). The paper does not give the number of control dishes or how they
        were matched with the paired dishes (Results 2.1, "The values measured in control samples at 1
        Hz and 833 kHz were taken as 100%"); normalisation (i) averages the ratio over every pairing of
        a paired and a control dish. Control subsets are shown as variants.
      - Background reading (b) subtracts the mean YP within 0.5 mm of the three electrode centres of the
        same dish (Methods 4.4, footprint measurements made "to account for 'spontaneous' YP uptake").
        The radius is a choice; the disk covers the needle lumen (0.25 mm radius, Methods 4.2) and the
        inner wall, where the YP profile is flat (to about 0.55 mm, apart from bright material in the
        lumen of the three 833 kHz controls). The lumen alone, the wall ring (0.25 to 0.5 mm) alone and
        a 0.6 mm disk are run as sensitivity checks.
      - BPAE-18 of 7-31-21 is left out as the same recording as BPAE-03; BPAE-13 of 8-24-21, whose session
        description is of another experiment, is used as a paired dish from its image, and the values
        without it are shown as a variant.
