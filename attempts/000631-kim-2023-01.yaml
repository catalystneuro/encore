      - 147.8
    notes: Measured values are on layout L2, model B, background (b), normalisation (i), level reading
      (1); the angle is that of 1 Hz (833 kHz, 94.6 degrees). Facilitation below the crossover is present
      at both frequencies; the three-fold plateau from 90 to 100 degrees holds only at 833 kHz. At 833
      kHz with background (b) the level at 90 to 100 degrees is 2.29 to 2.78 fold and the mean from 100
      degrees down 2.80 to 2.96; on L2 it is reached at 94.6 to 96.1 degrees and the slope over 0 to 90
      degrees has a 95% CI that includes zero (P1). At 1 Hz the value keeps rising as the angle falls
      (slope -1.35 to -3.41 % per degree, CI excluding zero under every reading); the level at 90 to 100
      degrees is 1.15 to 1.36 fold and the mean from 100 degrees down 2.07 to 2.36. Without background
      subtraction no level is within 2.7 to 3.3 (1.08 to 1.74). P2 has no ROI below 10 degrees under model
      C. The criterion is not met under either plateau reading or background reading, so the blocking
      rule does not apply. The statement's "as efficient as co-directional pulses" holds at 833 kHz with
      background (b) and not at 1 Hz.
