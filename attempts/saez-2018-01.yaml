findings:
- kind: metadata_error
  about: data
  statement: The data description says 192 electrodes are in the data set; the files hold 199. In s03,
    electrodes 52 to 58 are exact copies of electrodes 45 to 51 in both the 1-kHz and the window arrays
    (deposited twice). Without them the per-patient counts match Table S2.
- kind: format_error
  about: data
  statement: In s03, electrode 42's 1-kHz arrays are copies of electrode 34's, and its window arrays are
    copies of electrode 41's, so its window averages do not come from its own 1-kHz data and neither
    array holds data of its own. Every other electrode's windows equal the mean of samples 50k to
    50k+200 of its 1-kHz data.
- kind: metadata_error
  about: data
  statement: The buttonpress epochs are described as centred on the button press. Per subject they are
    centred a fixed 470 to 600 ms after the csv's buttonpress.time (measured from choice.time), and the
    gamble outcome is encoded from about 200 ms after their time 0 and not in the game epoch. This fits
    epochs locked to the outcome reveal, as the paper's Figure 3C labels them; it is consistent with the
    data, not shown, as the true event times are not in the files.
- kind: metadata_error
  about: data
  statement: The csv column reveal.time is 31 to 47 ms after buttonpress.time in most rounds, where the
    description and the paper put the outcome reveal 550 ms after the button press.
- kind: identifier_missing
  about: data
  statement: The HFA trials carry no round number. They are fewer than the non-timeout rounds in 8 of 10
    subjects (1,753 against 1,839). They can be matched to rounds only through the regressor values in
    sXX_behav_globals.mat, which match every trial here.
- kind: selection_undocumented
  about: data
  statement: 86 non-timeout rounds (2 to 19 per subject, none in s08 and s09) have no HFA trial; the
    description does not say why (the paper mentions excluding epochs with aberrant activity).
- kind: metadata_error
  about: data
  statement: The description says each patient played 200 rounds with a 2-s limit and that timeouts were
    9.98% of trials. s10 has 138 rounds, no timeouts and reaction times with a median of 4.4 s and a
    maximum of 80.5 s; s06 to s09 have 102 reaction times above 2 s (up to 2.5 s); timeouts are 99 of 1,938
    rounds (5.1%).
- kind: metadata_insufficient
  about: data
  statement: The csv column choice.time is not described (it is 0.66 to 0.97 s after trial start, read
    here as game presentation). The units of the HFA values are not stated, nor that the game epochs are
    baseline-corrected (their first 200-ms window is constant across trials in every electrode).
- kind: other
  about: data
  statement: In s07 to s10 the chosen side agrees with gamble_choices.csv's Risky.Side in only 87 to
    97.5% of rounds (in every round for s01 to s06), although the outcomes agree with the csv's shown and
    hidden numbers in every round. The gamble prizes in gamble_choices.csv are $15 to $30, where the
    description says $10 to $30.
- kind: data_missing
  about: data
  statement: The data set holds no broadband signal, no electrode coordinates or Brodmann labels, and no
    data from the 10 healthy participants. Six of the paper's findings cannot be tested.
- kind: methods_unavailable
  about: paper
  statement: The encoding rule as the Methods give it (p < 0.05 in 5 or more consecutive 200-ms windows
    stepped by 50 ms, anywhere in either 3-s epoch) classifies 18.2% of electrodes as encoding when the
    labels are shuffled, more than Table S2 reports for chosen value and past risk. How do the 1,000
    shuffles enter the selection? Requiring each electrode to beat its own shuffled null gives counts
    mostly below Table S2; the plain rule gives counts above it. Were the windows limited to part of the
    epochs, or the p-values taken from the shuffles?
- kind: methods_unavailable
  about: paper
  statement: For the stepwise regression, is the longest significant stretch taken within each epoch or
    across both, and on which HFA (which window or average) are the nested models compared by ANOVA? With
    a Bonferroni correction over 192 electrodes and 10,000 shuffles, 16 of 191 electrodes keep any
    regressor here.
- kind: methods_unavailable
  about: paper
  statement: For the nested mixed-effects models, what is the dependent variable in time (each window or
    an average), are the regressors entered alone or together, are random slopes included, and over what
    is the Bonferroni correction made? With fixed slopes over electrodes that encode in opposite
    directions, the result depends strongly on these choices here (2 to 14 of 16 regressors at p < 10^-4).
