- claim: fig3-present-encoding
  outcome: not_reproduced
  notebook: reproduce_saez_2018.ipynb
  output: claim:fig3-present-encoding
  measured: [84, 71, 61, 41, 59, 54, 52, 64]
  notes: Encoding electrodes (p < 0.05 in 5 or more consecutive windows of either epoch) over 191
    electrodes are 84 risk, 71 gamble, 61 offer value, 41 chosen value, 59 win, 54 loss, 52 RPE and 64
    regret, none within 10% of Table S2 (50, 34, 31, 26, 45, 33, 28, 35). The 95th percentile of the
    shuffled counts is 48 to 50; chosen value (41) does not exceed it, the other seven do. The timing
    holds; the mean %EV of the choice regressors peaks 750 ms after game presentation, that of the
    outcome regressors 800 ms after time 0 of the buttonpress epoch (250 ms after a reveal at +550 ms,
    the claims file's timing), and the per-window share of electrodes at p < 0.05 peaks at 850 ms for
    both under reading (b) (850 and 650 ms under reading (a)). The selection classifies 18.2% of
    electrodes as encoding under shuffled labels, on average about 35, more than Table S2 reports for
    chosen value, which suggests the paper's selection differs in a detail it does not state (finding).
    A variant that also requires an electrode's longest run to exceed the 95th percentile of its own
    shuffled runs gives 41, 31, 21, 12, 24, 15, 15 and 17, mostly below Table S2. Per patient most
    encoding electrodes are in s03 and s05, as in Table S2.
  deviations:
  - The HFA is used as deposited, already baseline-corrected in the game epoch; the claims file's
    baseline readings are not applied.
  - The analysis uses 191 electrodes (the paper 192); s03 electrode 42 holds no data of its own.
  - The buttonpress epoch's time 0 is read as the outcome reveal, as the data indicate; the claims
    file's timing (reveal 550 ms after time 0) is shown alongside, and the timing condition holds under
    both.
- claim: fig3-latency-duration-similar
  outcome: reproduced
  assumed: true
  notebook: reproduce_saez_2018.ipynb
  output: claim:fig3-latency-duration-similar
  measured: [800, 650, 687.5, 1000]
  notes: With the outcome reveal at time 0 of the buttonpress epoch, the choice and outcome delays do
    not differ under reading (a) (peak of the mean %EV, 800 plus or minus 74 against 650 plus or minus
    87 ms, p = 0.235) or reading (b) (first window above the shuffled share, 512.5 plus or minus 101
    against 325 plus or minus 132 ms, p = 0.301), and the durations do not differ (687.5 plus or minus
    155 against 1,000 plus or minus 158 ms, p = 0.207). Under reading (b) both delays are within the
    paper's values, the choice duration is within 612.15 plus or minus 132.9 ms and the outcome duration
    is not. With the reveal 550 ms after time 0 (the claims file's description of the epoch) the delays
    differ (p < 0.001 under (a), 0.006 under (b)). Under the per-electrode reading (c), less supported
    by the claims file, the delays differ (p = 0.026) and the durations do not (p = 0.462).
  deviations:
  - The outcome rests on the reading of the buttonpress epoch as locked to the outcome reveal. The data
    description says the epoch is centred on the button press; the data show it is centred 470 to 600
    ms after the csv's button press and that the gamble outcome is encoded from about 200 ms after its
    time 0, which fits a reveal-locked epoch, and the paper's Figure 3C labels the epoch "time locked to
    gamble outcome (t = 0)". The true event times are not in the files.
  - Delay and duration are measured on windows that start at or after the event; the chance profile is
    the mean %EV of the electrodes selected under the 1,000 shuffles, and the chance share for reading
    (b) the 95th percentile of the shuffled share per window. Standard choices, as the paper does not
    define them.
