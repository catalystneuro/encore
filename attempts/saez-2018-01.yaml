- claim: methods-electrode-trial-counts
  outcome: partially_reproduced
  notebook: reproduce_saez_2018.ipynb
  output: claim:methods-electrode-trial-counts
  measured: [192, 10, 5.11]
  notes: The data set holds 10 patients. It holds 199 electrode columns; seven in s03 (52 to 58) are exact
    copies of electrodes 45 to 51 in both the 1-kHz and the window arrays, and without them the per-patient
    counts are 5, 6, 52, 5, 61, 7, 11, 10, 19 and 16, those of Table S2, 192 in all. One of these, s03
    electrode 42, holds no data of its own (its 1-kHz trace copies electrode 34 and its windows copy electrode
    41), so 191 unique recordings are analysed. Timeouts are 99 of 1,938 rounds, 5.11% (4.95% of 2,000),
    outside 9.98 plus or minus 0.998, and s10 has 138 rounds, not 200. The share of rounds that have no
    HFA trial (timeouts and other exclusions), 185 of 1,938 or 9.55%, would fall inside the tolerance;
    it is shown as a variant, as the claims file defines the percentage on timeout trials. The HFA trials
    are matched to rounds in order; matching them in reverse gives the same rounds except one s02 trial,
    where only the forward match agrees with the authors' t-1 values, so the match is unique and no matched
    round is a timeout.
  deviations: ['The electrode count of 192 is the deposited count with the seven copied electrodes of
      s03 removed; the analysis itself uses 191, counting each recording once.']
- {claim: behavior-risk-neutral, outcome: reproduced, notebook: reproduce_saez_2018.ipynb, output: 'claim:behavior-risk-neutral',
  measured: 54.9, notes: 'The gamble was chosen on 54.9% of non-timeout rounds averaged over patients
    (SD 8.6, reading (a)) and 55.1% pooled (reading (b)), both within 55.9 plus or minus 8.5. Per patient
    the share runs from 46.8 to 73.5%. A risk-neutral chooser (gamble when win probability times prize
    exceeds $10, ties split) would gamble on 53.0%, so patients gamble slightly more often, as the statement
    says.'}
- claim: fig1c-choice-win-probability
  outcome: reproduced
  notebook: reproduce_saez_2018.ipynb
  output: claim:fig1c-choice-win-probability
  notes: Random-effects logit of gamble choice on win probability over 1,839 non-timeout rounds. Slope
    4.79 (SE 0.24, p = 1.5e-86) with a random intercept, 5.75 (SE 0.33, p = 6.0e-70) with a random intercept
    and slope. The share of gamble choices rises from 15 to 17% at win probabilities 0 to 0.1 to 76 to
    82% at 0.6 to 1. Per patient the slope is significant and positive in 8 of 10; s04 and s10 show no
    significant effect.
  deviations: ['The random-effects logit is fitted by maximum likelihood with Gauss-Hermite quadrature
      (20 points, or 12 by 12 with a random slope) in the helper, with Wald tests from a numerical Hessian;
      the paper used R and does not name the routine. A standard choice.']
- {claim: figs2a-choice-gamble-ev, outcome: reproduced, notebook: reproduce_saez_2018.ipynb, output: 'claim:figs2a-choice-gamble-ev',
  notes: Gamble choices rise from 16.9% at an expected value of $0 to 68 to 87% above $15. The logit slope
    on expected value is 0.163 per $ (p = 2e-69) with a random intercept and 0.161 (p = 4e-45) with a
    random slope as well.}
- {claim: fig1c-patients-like-controls, outcome: blocked, blocked_by: data_missing, notes: 'The data set
