- claim: figs6b-stepwise-similar
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_saez_2018.ipynb
  output: claim:figs6b-stepwise-similar
  notes: After the permutation step (10,000 shuffles, Bonferroni over 191 electrodes) and forward
    selection, 16 of 191 electrodes keep any regressor; the stepwise proportions are 0 to 2.1% against
    20.9 to 49.7% for the 5-window selection. The two are ranked alike (Spearman rho 0.77, p < 0.001,
    reading (a) holds) but differ by up to 48.2 points (reading (b) fails). The permutation step alone
    gives 0 to 2.6% (rho 0.65, p = 0.006). On a synthetic electrode the procedure gives p = 0.0005, the
    smallest possible with 2,000 shuffles.
  deviations:
  - Assumed, as STAR Methods do not say, that the longest significant stretch is taken in each epoch
    and the larger sum of F used, and that the model comparison (ANOVA) is made on the HFA of the
    window where the base regressor has its peak %EV. Other readings (a stretch across both epochs,
    comparisons at each regressor's own peak) were not run; the permutation step, which leaves only
    16 electrodes, does not depend on the second choice.
  - The Bonferroni correction uses the 191 electrodes analysed; the paper says 192.
