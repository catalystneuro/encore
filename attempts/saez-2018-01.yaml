- claim: mixed-effects-robust
  outcome: not_reproduced
  notebook: reproduce_saez_2018.ipynb
  output: claim:mixed-effects-robust
  notes: Under time-point reading (a) (one model per window, 114 windows, Bonferroni over 16 regressors
    and 114 windows) 14 of 16 regressors reach corrected p < 10^-4; past chosen value (6.2e-03) and past
    risk (3.0e-03) do not. Under reading (b) (HFA averaged over windows that start after the event, both
