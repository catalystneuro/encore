  notebook: reproduce_saez_2018.ipynb
  output: claim:fig3-latency-duration-similar
  measured: [800, 650, 687.5, 1000]
  notes: With the outcome reveal at time 0 of the buttonpress epoch, the choice and outcome delays do
    not differ under reading (a) (peak of the mean %EV, 800 plus or minus 74 against 650 plus or minus
    87 ms, p = 0.235) or reading (b) (first window above the shuffled share, 512.5 plus or minus 101 against
    325 plus or minus 132 ms, p = 0.301), and the durations do not differ (687.5 plus or minus 155 against
    1,000 plus or minus 158 ms, p = 0.207). Under reading (b) both delays are within the paper's values,
    the choice duration is within 612.15 plus or minus 132.9 ms and the outcome duration is not. With
    the reveal 550 ms after time 0 (the claims file's description of the epoch) the delays differ (p <
    0.001 under (a), 0.006 under (b)). Under the per-electrode reading (c), less supported by the claims
    file, the delays differ (p = 0.026) and the durations do not (p = 0.462). Under the claims file's
    baseline readings (a) and (b), reading (a) of the delays gives p = 0.224 and 0.200 and the durations
    p = 0.118 and 1.000; reading (b) of the delays gives p = 0.034 under baseline (a) and 0.052 under
    baseline (b). The outcome holds under all three baselines, as reading (a) holds under each and one
    reading suffices.
  deviations: ['The outcome rests on the reading of the buttonpress epoch as locked to the outcome reveal.
      The data description says the epoch is centred on the button press; the data show it is centred
      470 to 600 ms after the csv''s button press and that the gamble outcome is encoded from about 200
      ms after its time 0, which fits a reveal-locked epoch, and the paper''s Figure 3C labels the epoch
      "time locked to gamble outcome (t = 0)". The true event times are not in the files.', 'Delay and
      duration are measured on windows that start at or after the event; the chance profile is the mean
      %EV of the electrodes selected under the 1,000 shuffles, and the chance share for reading (b) the
      95th percentile of the shuffled share per window. Standard choices, as the paper does not define
      them.', 'The HFA is used as deposited; the claims file''s baseline readings, shown in the notebook,
