- claim: fig3-present-encoding
  outcome: not_reproduced
  notebook: reproduce_saez_2018.ipynb
  output: claim:fig3-present-encoding
  measured: [84, 71, 61, 41, 59, 54, 52, 64]
  notes: Encoding electrodes (p < 0.05 in 5 or more consecutive windows of either epoch) over 191 electrodes
    are 84 risk, 71 gamble, 61 offer value, 41 chosen value, 59 win, 54 loss, 52 RPE and 64 regret, none
    within 10% of Table S2 (50, 34, 31, 26, 45, 33, 28, 35). The 95th percentile of the shuffled counts
    is 48 to 50; chosen value (41) does not exceed it, the other seven do. The timing holds; the mean
    %EV of the choice regressors peaks 750 ms after game presentation, that of the outcome regressors
    800 ms after time 0 of the buttonpress epoch (250 ms after a reveal at +550 ms, the claims file's
    timing), and the per-window share of electrodes at p < 0.05 peaks at 850 ms for both under reading
    (b) (850 and 650 ms under reading (a)). The selection classifies 18.2% of electrodes as encoding under
    shuffled labels, on average about 35, more than Table S2 reports for chosen value, which suggests
    the paper's selection differs in a detail it does not state (finding). A variant that also requires
    an electrode's longest run to exceed the 95th percentile of its own shuffled runs gives 41, 31, 21,
    12, 24, 15, 15 and 17, all below Table S2. Per patient most encoding electrodes are in s03 and
    s05, as in Table S2. Under the claims file's baseline readings (a) and (b) the counts are 75, 82,
    54, 51, 74, 51, 64, 63 and 66, 74, 56, 37, 68, 41, 50, 45, none within 10%, and chosen value stays
    below the 95th percentile of its shuffles (51 against 55, 37 against 47), so the outcome is the same
    under all three.
  deviations: ['The HFA is used as deposited, as the authors'' own baseline correction (an assumption):
      the game epoch is corrected over [-1000, -800] ms (its first window is the same in every trial)
      and the buttonpress epoch carries a per-trial offset close to it. STAR Methods say only that epochs
      were made "using a 200-ms baseline to remove any pre-stimulus differences in baseline amplitude",
      and the data description that "activity for both epochs is temporally aligned". The claims file''s
      readings, (a) the 200 ms before each epoch''s event and (b) the 200 ms before game presentation
      for both epochs (the buttonpress epoch first put on the game epoch''s level with its per-trial, per-electrode
      offset, measured where the epochs overlap), are applied on top of it in the notebook''s section Baseline
      readings.', The analysis
      uses 191 electrodes (the paper 192); s03 electrode 42 holds no data of its own., 'The buttonpress
      epoch''s time 0 is read as the outcome reveal, as the data indicate; the claims file''s timing (reveal
      550 ms after time 0) is shown alongside, and the timing condition holds under both.']
- claim: fig3-latency-duration-similar
