- claim: figs2b-rt-conflict
  outcome: not_reproduced
  notebook: reproduce_saez_2018.ipynb
  output: claim:figs2b-rt-conflict
  notes: RT is buttonpress.time minus choice.time (game presentation). High-conflict RTs are longer on
    average (1.691 against 1.476 s over pooled trials, Cohen's d 0.07; 179 ms per patient, d_z 0.57),
    but p = 0.165 for the pooled two-sample test (reading (a)) and p = 0.104 for the paired test over
    10 patients (reading (b)), neither below 0.001. s10's reaction times are not bounded by the 2-s
    limit (median 4.4 s, up to 80.5 s) and dominate the pooled test; without s10 the pooled test gives
    p = 2.2e-06 and the paired test p = 0.147 (variant). Per patient the difference runs from -200 to
    932 ms. The healthy subjects' part and the comparison of effect sizes cannot be tested (no data).
  deviations:
  - Game presentation is taken as the csv column choice.time, which the data description does not
    list; it is 0.66 to 0.97 s after trial start, near the paper's 750 ms.
