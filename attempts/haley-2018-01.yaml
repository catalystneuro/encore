- claim: fig4a-ptx-example
  outcome: reproduced
  notebook: reproduce_haley_2018.ipynb
  output: claim:fig4a-ptx-example
  notes: '903_052 meets every part. Its PD slow-wave amplitude at 6.7 is 0.41 of control, and at 5.5 PD is silent
    and depolarized by 16.4 mV. At 10.4 it fires 1.0 spikes per slow wave, and LP fires tonically at all six steps
    from 6.7 to 10.4 and is silent at 5.5. All 9 PTX preparations have a silent, depolarized PD at 5.5. The other
    parts hold in 2 to 7 of the 9. The PD label of 903_052 holds: in 7 of its 9 files with PD spikes, 0.61 to 1.0
    of them are followed by a pdn spike 34 to 38 ms later, against 0.015 to 0.037 by chance; LP spikes are followed
    at about chance (0.02 to 0.07). The outcome rests on this one preparation.'
  deviations:
  - The PTX folders have no README; the pH of each file is taken from its recorded bath pH (crabph.assign_ptx_conditions),
    and a preparation missing a step is left out of that protocol's tests (8 complete of 9); assumed.
  - The waveform parameters are the code's starting values (maxBurstFreq 2 and 10 Hz, minSpikeHeight 10 and 3 mV;
    intracellularAnalysis.m), which the authors adjusted by hand; assumed.
  - One spike per PD burst is read as a ratio of PD spikes to slow-wave peaks above 0 and at most 1.5; LP firing
    without slow-wave bursts as an interspike-interval coefficient of variation below 1. These readings of the words
    are this attempt's; assumed.
  - The PD label check of the PTX files takes the modal lag (up to 60 ms) from intracellular PD spikes to pdn spikes
    and counts the spikes followed within 2 ms of it (crabph.pdn_check), as the PD axons reach the pdn after a conduction
    delay; a standard choice.
  assumed: true
