findings:
- kind: data_missing
  about: data
  severity: major
  statement: Two experiments that the paper's code analyses are not in the project. STG 877_127 is one
    of the 15 STG preparations (pHCumulative.m), and CG 887_017 (unit CG3L) one of the 15 CG units. The
    STG and CG analyses can use 14 of 15 each.
  notebook: reproduce_haley_2018.ipynb
  output: finding-missing-experiments
- kind: data_missing
  about: data
  severity: minor
  statement: Seven experiments have no file for one pH step. 877_093 and 887_069 lack 5.5; 887_005, 887_011
    and 887_149 lack 10.4 (their READMEs list 11 files). Among the PTX folders, 903_046 lacks 6.1 and
    903_060 lacks 10.4. The paper's code handles a missing condition, so the steps may never have been
    recorded, but the READMEs do not say so.
  notebook: reproduce_haley_2018.ipynb
  output: finding-missing-steps
- kind: metadata_error
  about: data
  severity: minor
  statement: Several READMEs disagree with their folders. 887_145's README lists its files under the names
    887_149_0001.abf to 887_149_0014.abf. 877_149's lists 877_149_00010.abf for 877_149_0010.abf. 887_011_0001.abf
    and 887_049_0026.abf are in the folders but not in the READMEs. 887_061's README names an IN 15 channel
    that the files do not have (they have IN 14), and 877_149's IN 9 and 897_041's IN 10 are in only some
    files.
  notebook: reproduce_haley_2018.ipynb
  output: finding-readme-mismatch
- kind: metadata_insufficient
  about: data
  severity: major
  statement: The nine PTX folders (903_046 to 903_064) have no README. Nothing names the pH of each file,
    the protocol order or the nerves beyond the channel names. Here the pH was inferred from the bath
    pH signal recorded in each file, which separates the steps cleanly.
  notebook: reproduce_haley_2018.ipynb
  output: finding-ptx-order
- kind: other
  about: data
  severity: minor
  statement: In 903_058 and 903_060 the recorded bath pH shows the file after 8.3 at the 9.3 level and
    the next file at the 8.8 level (903_058_0014 and 0015, 903_060_0003 and 0004), so these solutions
    were applied out of their nominal order. An analysis that assumes the file order is the protocol order
    swaps these two steps.
  notebook: reproduce_haley_2018.ipynb
  output: finding-ptx-order
- kind: metadata_error
  about: data
  severity: major
  statement: In 903_046_0002 the intracellular channels are named the other way round from the other ten
    files of the experiment. The input the others call PD3 is LP3 there, and LP4 is PD4. Its spikes coincide
    with the pdn spikes (0.62 of them within 5 ms) as in the other files, so the labels of 903_046_0002
    are swapped. An analysis by channel name exchanges PD and LP in that control file.
  notebook: reproduce_haley_2018.ipynb
  output: finding-ptx-label-swap
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: 877_101, one of the paper's 15 STG preparations, has no pdn, and its intracellular channel
    ME1_Vx is not named in the README. The PD unit can only be taken from the lvn, where it shares the
    nerve with LP and PY, so this attempt left it out of the PD measures.
  notebook: reproduce_haley_2018.ipynb
  output: finding-no-pdn
- kind: data_missing
  about: data
  severity: major
  statement: The project holds only the raw .abf files and the READMEs. The manual state annotations (stateData_STG.xlsx,
    stateData_CG.xlsx), the Spike2 spike and burst output, and the gastric-rhythm annotation behind Figures
    3, 5, 7 and 8 are not deposited. The state transition analyses and the gastric counts cannot be repeated,
    and every burst measure depends on thresholds that have to be set again.
  notebook: reproduce_haley_2018.ipynb
  output: finding-no-annotations
- kind: other
  about: data
  severity: minor
  statement: The project links a GitHub storage add-on that the OSF API does not list for an anonymous
    reader (HTTP 403), and the registry's target list names OSF Storage only. The files read here are
    all in OSF Storage, and the live listing matches the pinned 408 files.
- kind: code_mismatch
  about: paper
  statement: pHCumulative.m compares a file length in seconds with sampleFreq*480 in samples, so its window
    is the 480 s after the first burst of each file, where the Methods say the last 8 min. With the code's
    window the acid ANOVA on PD frequency gives p = 0.061, matching the Results' relatively invariant
    frequency in acid. With the last 8 min it gives p = 1.6e-07. The paper's statistics may rest on the
    start of each step.
- kind: methods_unavailable
  about: paper
  statement: Questions for the authors. (1) The Spike2 thresholds and burst parameters per file, which
    the code sets by hand and does not record. This attempt set thresholds automatically and used a 1.0
    s, one-spike burst rule for the LC. (2) How a missing pH step entered the statistics; the code gives
    it 0 (silent), and this attempt shows that and leaving it out. (3) Which PTX file is which pH, and
    whether 903_058 and 903_060 received 9.3 before 8.8. (4) Which file stands for a condition where a
    README lists two controls in a row (887_141, 897_005) or repeated acid steps (887_061). (5) Whether
    877_101's PD was measured on the lvn. (6) The criteria for a gastric-like rhythm, identified by eye
    in the paper.
- kind: selection_undocumented
  about: paper
  statement: The paper reports 15 CG preparations, while its code lists 15 Large Cell units from 10 experiments
    (877_149, 887_149 and 897_041 contribute two or three units each). The statistics treat units of one
    ganglion as independent preparations, which the paper does not say.
