  outcome: not_reproduced
  notebook: reproduce_haley_2018.ipynb
  output: claim:fig8a-ganglion-difference
  notes: With sum-to-zero contrasts all six ANOVA effects are significant under both univariate and multivariate
    tests (pH p = 5.9e-10 acid and 2.8e-12 base, ganglion 0.034 and 0.015, interaction 5.7e-04 and 0.0040).
    With treatment contrasts the acid pH effect is not (p = 0.15). The STG is less rhythmic than the CG
