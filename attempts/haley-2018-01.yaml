    at 10.4, with frequency 0.14 to 0.29 Hz below control. The two
    examples are not named in the paper or the code.'
- claim: fig3c-stg-rhythmic-fraction
  outcome: not_reproduced
  notebook: reproduce_haley_2018.ipynb
  output: claim:fig3c-stg-rhythmic-fraction
  measured: 13
  notes: Both ANOVAs on the fraction rhythmic are significant (acid F(4,48) = 15.30, p = 3.9e-08; base F(5,60) =
    2.88, p = 0.021). At 5.5 the fraction is 0.375 against 1.0 (corrected p = 9.0e-04). At 10.4 it is 0.771, not
    significant (p = 0.31; 0.22 to 0.61 across gap factors, lvn spike counts, PD bursting alone and missing steps
    left out). The criterion needs both t-tests and has no partial condition, and the expected 15 preparations are
    13 here (tolerance 0).
  deviations:
  - 'The manual state annotation is not in the dataset, and [STATE] asks for states annotated from its definitions.
    They are read from the spikes (crabph.rhythmic_seconds, triphasic_seconds): the pacemaker unit (PD, or LC) bursts
    with onsets at most 3 control periods apart, runs under 10 s merged (Methods paragraph 3); for the STG each
    PD cycle must also hold at least 2 lvn spikes between the PD bursts (LP and PY firing, which states 1 and 2
    require), so state 3 is not counted. LP and PY are not told apart, nor states 1 and 2. Gap factors 2 and 5,
    1 and 4 lvn spikes, and PD bursting alone are shown; assumed.'
  - Spike thresholds are automatic (crabph.unit_threshold), where the authors set them by hand in Spike2 (spikenburst.s2s);
    assumed.
  - 13 STG preparations of 15 (877_127 is not in the project; 877_101 has no pdn).
  - 'A missing pH step counts as 0, as the paper''s code gives it: extracellularAnalysis.m gives a condition marked
    NaN no Spike2 events (includeSpike2 = []), pHCumulative.m sets a bin with no event to 0 (if isempty(include)
    ... = 0), and a state of NaN counts towards no state, so the fraction rhythmic is 0 (thisPrep = sum(thisState)/window).
    Leaving it out is shown as a variant.'
  assumed: true
