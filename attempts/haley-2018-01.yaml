- claim: gastric-like-rhythm-counts
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The paper identified gastric-like rhythms by eye and coded them as 8.x in its manual STG annotation (pHCumulative.m),
    which is not in the dataset. The criterion's fallback, rhythmic LG bursting alternating with DG bursting, has
    no period, burst or alternation thresholds in the paper or its code. The files name nerves (lgn, dgn), not units,
    so any detector would rest on thresholds of this attempt alone. The question is for the paper's authors (finding
    11). The README electrode lists (printed in the notebook) show an lgn and a dgn in 8 of the 15 STG experiments
    and an ion in 4, so in the others LG would have to be sorted from the lvn, which it shares with PD, LP and PY.
