outcomes:
- claim: fig2a-stg1-traces
  outcome: reproduced
  notebook: reproduce_haley_2018.ipynb
  output: claim:fig2a-stg1-traces
  notes: 897_037 is rhythmic by the proxy over the whole of every step from 7.2 to 6.1 and 8.3 to 10.4,
    both recoveries, and also 5.5 (reading a), under gap factors 2, 3 and 5. At 10.4 PD spikes per burst
    are 12.43 against 13.10 at the control before base, and the PD slow-wave amplitude (VM1_2, last minute)
    17.65 against 18.03 mV. Both decreases are small. The proxy cannot tell normal from weak triphasic,
    so the triphasic part rests on PD bursting.
  deviations:
  - The manual state annotation is not in the dataset. Rhythmic activity is a proxy from the pacemaker
    unit (PD, or LC) bursting with onsets at most 3 control periods apart, runs under 10 s merged (Methods
    paragraph 3); gap factors 2 and 5 are shown. For the STG it counts state 3 as rhythmic; assumed.
  - Spike thresholds are automatic (crabph.unit_threshold), where the authors set them by hand in Spike2
    (spikenburst.s2s); assumed.
  - The waveform parameters are the code's starting values (maxBurstFreq 2 and 10 Hz, minSpikeHeight 10
    and 3 mV; intracellularAnalysis.m), which the authors adjusted by hand; assumed.
  assumed: true
- claim: fig2bcd-stg1-measures
  outcome: reproduced
  notebook: reproduce_haley_2018.ipynb
  output: claim:fig2bcd-stg1-measures
  notes: In 897_037 frequency at 5.5 is 0.118 Hz above its control and at 10.4 0.266 Hz below (Spearman
    rho with pH -0.80 in acid, -1.00 in base). PD spikes per burst at 5.5 are 5.40 below control, and
    the duty cycle at 10.4 is 0.048 below control (rho -0.94). Both readings hold, and the frequency and
    spike parts hold in the code's window.
  deviations:
  - Spike thresholds are automatic (crabph.unit_threshold), where the authors set them by hand in Spike2
    (spikenburst.s2s); assumed.
  - The window is the last 8 min of each file (Methods, Data acquisition and analysis, paragraph 2); the
    code's window (480 s from the first burst, pHCumulative.m) is shown as a variant.
  assumed: true
- claim: fig3a-stg-variability-examples
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The criterion needs STG states 1 and 2 apart at 10.4, and states 2 to 4 at 5.5. The manual annotation
    is not in the dataset (no xlsx or annotation file in the project), and the proxy, built on PD bursting
    alone, cannot tell normal, weak and intermittent triphasic apart. The two examples are not named in
    the paper or the code.
- claim: fig3c-stg-rhythmic-fraction
  outcome: partially_reproduced
  notebook: reproduce_haley_2018.ipynb
  output: claim:fig3c-stg-rhythmic-fraction
  measured: 13
  notes: Both ANOVAs on the proxy fraction are significant (acid F(4,48) = 14.18, p = 1.0e-07; base F(5,60)
    = 2.88, p = 0.021). At 5.5 the fraction is 0.393 against 1.0 (corrected p = 0.0013). At 10.4 it is
    0.771, not significant (p = 0.31; 0.22 to 0.61 across variants). The expected 15 preparations are
    13 here. The proxy counts intermittent triphasic as rhythmic, which can only raise the fraction in
    base.
  deviations:
  - The manual state annotation is not in the dataset. Rhythmic activity is a proxy from the pacemaker
    unit (PD, or LC) bursting with onsets at most 3 control periods apart, runs under 10 s merged (Methods
    paragraph 3); gap factors 2 and 5 are shown. For the STG it counts state 3 as rhythmic; assumed.
  - Spike thresholds are automatic (crabph.unit_threshold), where the authors set them by hand in Spike2
    (spikenburst.s2s); assumed.
  - 13 STG preparations of 15 (877_127 is not in the project; 877_101 has no pdn).
  - A missing pH step counts as 0 (pHCumulative.m sets empty bins to 0 and a missing condition has no
    bursts); leaving it out is shown as a variant.
  assumed: true
- claim: stg-state-transitions
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Counting transitions among the four STG states over whole recordings needs the manual annotation,
    which is not in the dataset; the proxy has two states.
