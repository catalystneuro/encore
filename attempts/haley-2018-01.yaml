outcomes:
- claim: fig2a-stg1-traces
  outcome: reproduced
  notebook: reproduce_haley_2018.ipynb
  output: claim:fig2a-stg1-traces
  notes: 897_037 is rhythmic over the whole of every step from 7.2 to 6.1 and 8.3 to 10.4, both recoveries, and
    also 5.5 (reading a), with PD bursting and lvn firing between the PD bursts in every cycle; the same under gap
    factors 2 and 5, 1 or 4 lvn spikes per cycle and PD bursting alone. At 10.4 PD spikes per burst are 12.43 against
    13.10 at the control before base, and the PD slow-wave amplitude (VM1_2, last minute) 17.65 against 18.03 mV.
    Both decreases are small. The reading cannot tell normal from weak triphasic.
  deviations:
  - 'The manual state annotation is not in the dataset, and [STATE] asks for states annotated from its definitions.
    They are read from the spikes (crabph.rhythmic_seconds, triphasic_seconds): the pacemaker unit (PD, or LC) bursts
    with onsets at most 3 control periods apart, runs under 10 s merged (Methods paragraph 3); for the STG each
    PD cycle must also hold at least 2 lvn spikes between the PD bursts (LP and PY firing, which states 1 and 2
    require), so state 3 is not counted. LP and PY are not told apart, nor states 1 and 2. Gap factors 2 and 5,
    1 and 4 lvn spikes, and PD bursting alone are shown; assumed.'
  - Spike thresholds are automatic (crabph.unit_threshold), where the authors set them by hand in Spike2 (spikenburst.s2s);
    assumed.
  - The waveform parameters are the code's starting values (maxBurstFreq 2 and 10 Hz, minSpikeHeight 10 and 3 mV;
    intracellularAnalysis.m), which the authors adjusted by hand; assumed.
  assumed: true
- claim: fig2bcd-stg1-measures
  outcome: reproduced
  notebook: reproduce_haley_2018.ipynb
  output: claim:fig2bcd-stg1-measures
  notes: In 897_037 frequency at 5.5 is 0.118 Hz above its control and at 10.4 0.266 Hz below (Spearman rho with
    pH -0.80 in acid, -1.00 in base). PD spikes per burst at 5.5 are 5.40 below control, and the duty cycle at 10.4
    is 0.048 below control (rho -0.94). Both readings hold, and the frequency and spike parts hold in the code's
    window.
  deviations:
  - Spike thresholds are automatic (crabph.unit_threshold), where the authors set them by hand in Spike2 (spikenburst.s2s);
    assumed.
  - The window is the last 8 min of each file (Methods, Data acquisition and analysis, paragraph 2); the code's
    window (480 s from the first burst, pHCumulative.m) is shown as a variant.
  assumed: true
- claim: fig3a-stg-variability-examples
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: 'The criterion needs STG states 1 and 2 apart at 10.4, and states 2 to 4 at 5.5. The manual annotation
    is not in the dataset (no xlsx or annotation file in the project), and the states read from the pdn and lvn
    cannot separate state 1 from state 2, as LP and PY are not told apart. The parts that can be read are shown:
    besides 897_037, 887_005, 887_097, 887_105 and 887_145 are rhythmic for most of 6.1 to 9.8 and not at 5.5; at
    10.4, 887_005 has fraction 0 and the other three 1.0, with frequency 0.14 to 0.29 Hz below control. The two
    examples are not named in the paper or the code.'
- claim: fig3c-stg-rhythmic-fraction
  outcome: not_reproduced
  notebook: reproduce_haley_2018.ipynb
  output: claim:fig3c-stg-rhythmic-fraction
  measured: 13
  notes: Both ANOVAs on the fraction rhythmic are significant (acid F(4,48) = 15.30, p = 3.9e-08; base F(5,60) =
    2.88, p = 0.021). At 5.5 the fraction is 0.375 against 1.0 (corrected p = 9.0e-04). At 10.4 it is 0.771, not
    significant (p = 0.31; 0.22 to 0.61 across gap factors, lvn spike counts, PD bursting alone and missing steps
    left out). The criterion needs both t-tests and has no partial condition, and the expected 15 preparations are
    13 here (tolerance 0).
  deviations:
  - 'The manual state annotation is not in the dataset, and [STATE] asks for states annotated from its definitions.
    They are read from the spikes (crabph.rhythmic_seconds, triphasic_seconds): the pacemaker unit (PD, or LC) bursts
    with onsets at most 3 control periods apart, runs under 10 s merged (Methods paragraph 3); for the STG each
    PD cycle must also hold at least 2 lvn spikes between the PD bursts (LP and PY firing, which states 1 and 2
    require), so state 3 is not counted. LP and PY are not told apart, nor states 1 and 2. Gap factors 2 and 5,
    1 and 4 lvn spikes, and PD bursting alone are shown; assumed.'
  - Spike thresholds are automatic (crabph.unit_threshold), where the authors set them by hand in Spike2 (spikenburst.s2s);
    assumed.
  - 13 STG preparations of 15 (877_127 is not in the project; 877_101 has no pdn).
  - 'A missing pH step counts as 0, as the paper''s code gives it: extracellularAnalysis.m gives a condition marked
    NaN no Spike2 events (includeSpike2 = []), pHCumulative.m sets a bin with no event to 0 (if isempty(include)
    ... = 0), and a state of NaN counts towards no state, so the fraction rhythmic is 0 (thisPrep = sum(thisState)/window).
    Leaving it out is shown as a variant.'
  assumed: true
