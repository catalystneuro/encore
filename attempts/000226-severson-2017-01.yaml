- claim: fig2c-baseline-rate
  outcome: reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:fig2c-baseline-rate
  measured: 0.03
  notes: Median non-whisking rate 0.03 Hz, IQR 0.20 Hz, over the 33 touch afferents (paper 0.0 and
    0.2). Range 0.00 to 34.39 Hz; 221B fires at 34.4 Hz without whisking.
- claim: fig2c-touch-rate
  outcome: reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:fig2c-touch-rate
  measured: 47.9
  notes: Median contact rate 47.9 Hz, IQR 94.8 Hz (paper 48.0 and 96.3), range 3.6 to 239.2 Hz.
    All 33 afferents are touch-sensitive by the Glossary rule, with bootstrap CIs over trials and
    with Poisson CIs. The median is also within 10% of the paper's value, so the outcome does not
    rest on the wide tolerance.
  deviations:
  - The Methods do not say what the bootstrap resamples; trials were resampled (1,000 times).
- claim: fig2c-wt-star
  outcome: reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:fig2c-wt-star
  measured:
  - 13
  - 19.0
  notes: Under reading (b), spikes during whisking in air, 13 afferents are WT*, the same set as
    Table S1's (5 Merkel, 7 other SA, 1 RA), with a median whisking-in-air rate of 19.0 Hz and IQR
    57.4 Hz (paper 19.1 and 58.2). Classes agree with Table S1 for 31 of 33; 223B and 243B are WT
    in Table S1 and T here (whisking-in-air rates 0.23 and 0.38 Hz, CIs overlapping the
    non-whisking rate). Under reading (a), all spikes, 15 are WT* (median 7.1 Hz) and 29 of 33
    agree; 227A and 145B (1.05 and 1.26 Hz) have more than 1,000 spikes in all but 393 and 233
    during whisking in air. With Poisson CIs, 15 are WT* and 29 of 33 agree.
  deviations:
  - The Glossary's "at least 1,000 spikes" can be read as spikes in the recording (a) or during
    whisking in air (b); only (b) matches the paper's count and Table S1's classes.
- claim: fig3a-direction-selective
  outcome: partially_reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:fig3a-direction-selective
  notes: 17 of 26 Merkel and SA afferents (65%) have a direction index of 0.5 or more (criterion
    80%); 21 of 26 have 0.33 or more and 11 of 26 have 0.67 or more. Median index 0.65 over Merkel
    and SA, 0.59 over the 14 Merkel afferents, 0.23 over the 7 RA afferents, none of which reaches
    0.5. 18 of 26 prefer protraction contacts. Contacts are classified by the sign of their mean
    M0; in 77% to 93% of contacts per recording that sign matches the whisker velocity at onset.
  deviations:
  - The paper shows direction selectivity in examples and tuning surfaces without a measure or
    threshold; the index and the 0.5 threshold were chosen before the analysis.
- claim: fig3d-gam-full
  outcome: reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:fig3d-gam-full
  measured: 0.708
  notes: Mean r 0.708, SD 0.141 (paper 0.71 and 0.16), median 0.726, range 0.363 to 0.919, 33
    afferents. With lambda 100 the mean is 0.687. All 1,617 spline fits converged. Fits used a
    median of 60,000 frames per recording (at least 47,342) of a median 288,418 clean contact
    frames.
  deviations:
  - Penalized cubic B-splines (10 per variable, lambda 1) fitted as a binomial model with two
    trials per 2 ms frame replace mgcv GAMs on 1 ms bins with UBRE smoothing.
  - At most 60,000 randomly chosen contact frames per recording.
- claim: fig3d-gam-single
  outcome: reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:fig3d-gam-single
  measured:
  - 0.441
  - 0.415
  notes: M0 alone mean r 0.441 (SD 0.178; paper 0.45), M0' alone 0.415 (SD 0.217; paper 0.42).
    With lambda 100, 0.415 and 0.398.
  deviations:
  - Spline models in place of mgcv GAMs, as for fig3d-gam-full.
- claim: fig3d-gam-best-pair
  outcome: partially_reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:fig3d-gam-best-pair
  measured:
  - 0.622
  - 0.475
  notes: M0 and M0' mean r 0.622 (paper 0.63); M0, Fax and Flat 0.475 (paper 0.48), lower than M0
    and M0' in 31 of 33 (Wilcoxon p = 4.8e-08). Of the 45 pairs, M0 and omega (velocity) has the
    highest mean r, 0.633, and M0 and M0' is second; per afferent M0 and M0' is higher than M0 and
    omega in 19 of 33 (median difference 0.003). Flat and omega (0.620), Flat and M0' (0.606) and
    M0 and Flat' (0.605) follow. The values are within tolerance, but M0 and M0' is not the single
    best pair.
  deviations:
  - Spline models in place of mgcv GAMs; the ranking of close pairs may depend on the smoothing
    method.
- claim: fig4c-viscoelastic
  outcome: reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:fig4c-viscoelastic
  notes: Over 25 Merkel and SA afferents (Table S1's fitted set), mean r 0.657 for the viscoelastic
    model against 0.686 for the spline model of M0 and M0' on the same frames, difference -0.029
    (95% bootstrap CI -0.051 to -0.008); viscoelastic higher in 9 of 25; Merkel afferents alone
    -0.029. The optimizer reported success for all 25, but eps_lim is at a bound in 6 fits and one
    (221C) ends at k = -97.9, C = 19.8, so some fits may be local optima, which would only lower
    the viscoelastic r.
  deviations:
  - Fitted with L-BFGS-B from 8 starts, with the rate of change of moment scaled by its 80th
    percentile inside the fit; the Methods used fmincon. During development an unscaled version
    found worse optima for the same model, so the result depends on the optimizer.
  - Fitted and evaluated on the same at most 60,000 contact frames as the spline models, which
    also exclude frames that are outliers on the other nine variables.
- claim: fig5-phase-modulation
  outcome: reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:fig5-phase-modulation
  measured:
  - 2.43
  - 51.1
  notes: Over the 15 WT* afferents, non-preferred phase median 2.43 Hz, IQR 3.16 (paper 2.1 and
    3.4); preferred phase median 51.1 Hz, IQR 96.6 (paper 51.2 and 105.7). All 15 fire at least
    9.5 times more at the preferred than the non-preferred phase. The non-preferred median is 16%
    above the paper's, outside a 10% band; the preferred median is within it.
- claim: fig5e-phase-span
  outcome: partially_reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:fig5e-phase-span
  notes: Preferred phases occupy all four quarter cycles (7, 4, 1 and 3 of 15), but the Rayleigh
    test finds a preferred direction (R = 0.448, p = 0.047, just below 0.05). At the preferred
    phase the whisker is retracting for 11 of 15, which fits the paper's remark of a slight
    abundance in retraction (Figure 7G, on 28 afferents).
  deviations:
  - The paper gives no test for spanning the whisk cycle; the quarter-cycle and Rayleigh criterion
    was chosen before the analysis.
- claim: figs3-phase-invariance
  outcome: reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:figs3-phase-invariance
  notes: Median absolute circular difference between the preferred phases of the two halves 0.37
    rad (amplitude), 0.59 (frequency), 0.48 (setpoint), against pi/4 = 0.785. 4, 6 and 5 of 15
    afferents differ by more than pi/4.
  deviations:
  - The paper shows invariance with tuning surfaces only; the median split and the pi/4 threshold
    were chosen before the analysis.
- claim: figs6-kinematic-gam
  outcome: reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:figs6-kinematic-gam
  measured: 0.975
  notes: On the 15 WT* afferents, the full model's mean r between predicted and observed phase
