inputs:
- what: Table S1 of the paper's Supplemental Information (mmc1.pdf), which lists every recording
    with its mouse, sex, line, date, afferent type (RA or SA), Merkel identification, whisking
    and touch class, viscoelastic fit and the experiment it belongs to. Transcribed in merkel.py
    as TABLE_S1. The group membership is used as labels for the dandiset's recordings; the type
    and Merkel identification as outside data (merkel-minutes, fig3a-direction-selective,
    fig4c-viscoelastic).
  source: doi:10.1016/j.neuron.2017.03.045 (Supplemental Information, Table S1)
outcomes:
- claim: table-s1-link
  outcome: reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:table-s1-link
  notes: All 60 files match a distinct Table S1 recording, 58 by recording id (the NWB identifier
    without "KS" and leading zeros) and 2 (KS0125_ and KS0128_, matched to 125B and 128D) by
    number and mouse. All 60 agree on mouse, sex, mouse line and date. Groups - 33 touch, 13
    progressive cutting, 5 cut-whisker, 4 EMG, 3 excluded touch, 2 whisking-only. No Table S1
    recording lacks a file.
  deviations:
  - The criterion's rule of removing "KS0" was applied as removing "KS" and leading zeros, so that
    the EMG files KS0007A to KS0011A match 7A to 11A.
- claim: video-frames
  outcome: reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:video-frames
  measured:
  - 54660000
  - 65710000
