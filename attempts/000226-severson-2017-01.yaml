    analysed afferents hold 65,710,000 frames, 2,190 min (paper 65,257,500 and 2,175 min, 181
    trials more). The other readings are also within 10% - 68,455,000 (53 afferents and EMG),
    68,005,000 (56 afferents), 70,750,000 (all files).
- claim: merkel-minutes
  outcome: reproduced
  notebook: reproduce_severson_2017.ipynb
  output: claim:merkel-minutes
  measured:
  - 823.8
  - 998.2
  - 846.4
  notes: Merkel touch recordings 823.8 min (paper 823), unidentified touch recordings 998.2 min
