findings:
- kind: metadata_insufficient
  statement: The files do not say which experiment each recording belongs to (touch, progressive
    cutting, cut-whisker, whisking-only, EMG), the afferent type (RA or SA), which afferents were
    identified as Merkel afferents by optogenetic tagging, or the whisking and touch class. All of
    these are in the paper's Table S1, whose recording ids match the NWB identifiers.
- kind: selection_undocumented
  statement: The paper excludes three touch recordings (227C, 214A, 271A) from all analyses except
    Figure S1. The dandiset holds them without saying so.
- kind: metadata_error
  statement: In the 13 progressive cutting recordings every trial has cuttingGroup "intact" and the
    trial table's MOI has one value per file, although the whisking-in-air rate falls over most
    of these sessions (last fifth below half the first in 10 of 13). The cutting conditions
    (intact, sham, cut 1 to 3) and the moment of inertia after each cut are missing, which blocks
    Figure 6 and parts of Figure 7.
- kind: data_missing
  statement: The EMG files of the intrinsic protractor recordings (7A, 8A, 9A) hold the whisker
    video series but no EMG signal; the nasolabialis file (11A) holds spike times but not the
    EMG. The optogenetic tagging data, the histology, the whisker geometry and the manually
    curated contact frames are not in the dandiset.
- kind: metadata_error
  statement: Velocity, acceleration and jerk are stated in degree/s, degree/s^2 and degree/s^3, and
    dM0, dFaxial and dFlateral in N*m/s and N/s, but the values are per millisecond; each is close
    to half the change of its variable per 2 ms frame (median ratios 0.467 to 0.502 over files).
- kind: metadata_insufficient
  statement: The stored whisk phase runs backwards in time; its sine is anticorrelated (median
    -0.9999 over files) with that of the Hilbert phase of the band-passed whisker position, so
    phases from -pi to 0 are retraction, the reverse of the convention the paper cites. Neither
    the files nor the paper describe the convention.
- kind: metadata_insufficient
  statement: Every series has the description "no description". distanceToPoleCenter has unit
    "unknown"; its median in frames with contact = 1 is between -0.08 and 0.09 in every file but one (209A, a
    cut-whisker recording with almost no contact), which fits the Methods'
    distance from whisker to pole in mm, not a distance to the pole's centre. Series not used here
    (Mi, dMi, Fnorm, thetaAtContact, follicleCoordsX and Y) are not explained.
- kind: metadata_error
  statement: Trial stop_time is 6.998 s after start_time in every trial of every file, while each
    trial's series hold 2,500 frames at 500 Hz (5 s), as the Methods describe.
- kind: format_error
  statement: The spike times of file sub-KSm31 (KS0277A) are not sorted.
- kind: metadata_error
  statement: Two identifiers, KS0125_ and KS0128_, lack the unit letter of their Table S1
    recordings (125B and 128D). All session start times are 12:00, so only the dates carry
    information.
- kind: other
  statement: Some series hold extreme values, likely tracking errors, such as whisker position from
    -985 to 596 degrees, whisk frequency from -250 to 250 Hz and M0 down to -0.52 N m. The
    Glossary's percentile outlier removal excludes them, but they are not flagged in the files.
- kind: methods_unavailable
  statement: The paper's MATLAB and R analysis code is available only on request; no public
    repository was found, so the GAM and viscoelastic fits had to be reimplemented.
