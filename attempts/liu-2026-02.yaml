outcomes:
- claim: na-cell-table-link
  outcome: partially_reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:na-cell-table-link
  notes: All 35 files match the 35 rows of the code table by file name, and every table cell ID
    agrees with the file's electrode cell_id in session and cell number (35 of 35). The dataset
    carries no cell type, so none can disagree with the table (14 VEN, 21 PC). Under the
    criterion's eight readings at most 2 of 35 computed maxima are within 10% of the table, short
    of the 28 required. The as-recorded readings (a1) are a median 4.15 to 4.61 times the table,
    because the traces keep holding currents of tens of pA. The baseline-subtracted readings (a2)
    are a median 1.32 to 1.40 times the table, Spearman 0.47 to 0.68, and a2b1c1 agrees best.
    Under a2b1c1, 11 maxima (6 VEN, 5 PC) lie later than 3 ms after the onset or at steps below
    -55 mV, and in 10 cells (6 VEN, 4 PC) the maximum is a brief biphasic transient 0.07 to 0.16 ms
    wide (every other maximum is 0.33 ms or wider), an artefact; their ratio to the table is a
    median 1.94 against 1.28 for the other cells. Noise SD (median 6.9 pA in VENs, 9.6 pA in PCs,
    p = 0.34) and repetition count (2.5 against 3, p = 0.89) do not differ by type. Bessel filters
    at 2.9, 5 and 10 kHz (4-pole, run once forward) and a 0 to 3 ms window bring at most 3 of 35
    within 10%. A moving average before the peak gives 19 of 35 at 0.5 ms and at most 26 of 35 at
    0.75 ms (median ratio 1.006, Spearman 0.982), below the criterion's 28, and that width was
    chosen as the best fit to the table. No measure tried matches the table to the criterion's
    tolerance; the smoothed peak comes closest. None of these variants is a reading of the paper,
    and none decides.
  deviations:
  - The link's value comparison used the eight readings of fig4d-sodium-current-lower, as the
    criterion says. The smoothing variant is the attempt's own and decides nothing.
- claim: fig4d-sodium-current-lower
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig4d-sodium-current-lower
  notes: The counts are 14 VEN and 21 PC, as stated. The VEN median is lower under all eight
    readings, but significance differs between them. Rank-sum p is 0.045 (a1b1c1) and 0.025
    (a1b1c2), and 0.077 to 0.29 under the six others, so by the criterion the claim is blocked.
    Both significant readings keep each patch's holding current in the measure, but the other two
    a1 readings, over all steps, do not find the effect (a1b2c1 p = 0.27, a1b2c2 p = 0.18). Under the code's
    example reading (a2 b1 c1), VEN 30.4 against PC 38.1 pA, p = 0.10. By session under that
    reading, VEN is lower in HS (15.9 against 40.3 pA, 7 and 11 cells, p = 0.0028) and not in AS
    (40.7 against 36.2 pA, 7 and 10 cells, p = 0.60). In the code table's values VENs are lower in
    both sessions (HS 12.4 against 31.5 pA, p = 0.0028; AS 17.5 against 29.1 pA, ratio 0.60,
    p = 0.11), so only the significance rests on HS. The AS reversal under a2 b1 c1 is mostly the
    artefact, not a session effect. Under that reading, the only one for which widths were
    computed, the maximum is a brief transient in 10 cells (6 of 14 VENs, 4 of 21 PCs), and 9 of
    them are in AS (5 of its 7 VENs, 4 of its 10 PCs; the one in HS is HS1c18). Three AS VEN
    transients are 3 to 5 times the table's value (AS4c14 70.7 against 15.5 pA, AS3c11 87.7
    against 17.5, AS1c1 42.1 against 13.8). Without the transient cells AS keeps 2 VENs and 6 PCs
    (37.2 against 34.3 pA, p = 0.86), too few to tell, and HS keeps its difference (15.6 against
    40.3 pA, p = 0.0019). In variants that are not readings of the paper and decide nothing, a
    4-pole Bessel low-pass run once forward as an amplifier's filter acts (2.9, 5 or 10 kHz,
    cut-offs fixed in advance) and a 0 to 3 ms window, 13 of the 24 baseline-subtracted variants
    give p < 0.05, every a2 reading at 2.9 kHz, every one with the short window, and a2b1c2 at
    5 kHz. The paper's code table gives 14.9 against 29.3 pA, p = 0.001, and the
    smoothed variant 16.0 against 29.9 pA, p = 0.0008, but that variant was fitted to the table.
    The t-test variant gives p = 0.013 to 0.96 over the readings. Whether the criterion should
    include a filtered reading is asked of a reader (questions/001750.yaml). Current density cannot be computed,
    as no capacitance is stored. Question for the paper's authors (finding methods_unavailable)
    is how the maximal current was measured from the traces. It asks which baseline was used,
    whether the traces were filtered or the peak fitted, and over which steps and window. Two of
    the four readings that subtract no baseline find the effect (a1b1c1, a1b1c2), and none with
    the code's own baseline subtraction does, unless the trace is filtered, smoothed or the window
    cut short.
  deviations:
  - Cell types come from the paper's code table through na-cell-table-link, as the files carry
    none.
  - Repetitions were averaged before the peak was taken (criterion). The baseline window of
    reading a2 is 18.0 to 19.0 ms, the first 100 samples of a cut starting 2 ms before the onset
    at 100 kHz, as in Fig4d_plotNaCurrent.m.
- claim: model-na-ratio
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_liu_2026.ipynb
  output: claim:model-na-ratio
  notes: Depends on fig4d-sodium-current-lower, which is blocked. The ratios were computed for
    every reading of the measure. They are 0.68 to 0.99, and in tolerance (0.619 to 0.756) under
    some summary only for the four as-recorded readings (a1), whose values include each patch's
