- claim: task-rules
  outcome: reproduced
  notebook: reproduce_rodgers_2022.ipynb
  output: claim:task-rules
  notes: The task assigned by the rule matches the experiment description in all 115 sessions (30
    detection, 85 discrimination). Over trials to analyse with Table 6 stimuli, 21,752 of 21,752
