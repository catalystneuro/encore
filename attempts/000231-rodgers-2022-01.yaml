- claim: neural-hours
  outcome: reproduced
  notebook: reproduce_rodgers_2022.ipynb
  output: claim:neural-hours
  measured: 33.78
  notes: Reading (b), the main Open Ephys recordings under sourcedata, gives 33.770 h over 44
    sessions, within 0.05 h of 33.8; each session has 64 channel files of equal length. The record
    headers of CH1 show a second, shorter segment in 7 sessions (0.48 to 0.51 s at the start of 6
    files, and in KF134 2018-02-10 a separate recording, number 0, of 39.73 s before the main one,
    number 1); these 42.8 s are left out. Nothing printed shows they are the test recordings the
    paper mentions, which it says were a few seconds long, while six of the seven are 14 or 15
    records under the main segment's recording number; leaving them out is a choice of this
    attempt. The whole files give 33.782 h, also within, so the outcome does not depend on it. Reading (a), the span of the NWB recordings, gives 33.656 h (-0.42%). The NWB files hold
    56 to 64 channels.
  deviations:
  - The samples of each Open Ephys file are computed from its size (1024-byte header, 2070-byte
    records of 1024 samples). To leave out segments apart from the main recording, such as the test
    recordings the Data Records mention ("In some cases the Open Ephys file includes test
    recordings that were just a few seconds long"), segments are found from the first and last
    record headers and a bisection on the record timestamps of channel CH1, which
    splits each file where the timestamps break; the longest contiguous segment is taken as the
    main recording.
