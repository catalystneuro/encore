- claim: response-window-timing
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_rodgers_2022.ipynb
  notes: No motor start or stop time is in the files; the trials table's only servo column is
    servo_position. For information, the window opens a median 3.023 s after start_time (5th to
    95th percentile 3.020 to 3.443 s), the same for each position.
- claim: choice-time-first-lick
  outcome: not_reproduced
  notebook: reproduce_rodgers_2022.ipynb
  output: claim:choice-time-first-lick
  notes: On 32,085 non-spoiled trials, the first lick at or after the window opening is within 5 ms
    of choice_time on 77.6% (78.0% allowing a lick 5 ms early), below 99% in every session (lowest
    52.5%); its side matches choice on 99.1%. On the 7,185 trials that do not match, choice_time is
    0 to 5 ms after the window opening on all of them, a lick in the 100 ms before the opening
    precedes it on 84.8%, and a lick lies within 5 ms of choice_time on only 5.7%. This suggests
    that a lick already under way when the window opens is taken as the choice at the opening, which
    the definition does not say. On all 265 spoiled trials choice_time is NaN, not 45 s after the
    window.
- claim: outcome-consistency
  outcome: reproduced
  notebook: reproduce_rodgers_2022.ipynb
  output: claim:outcome-consistency
  notes: On all 32,350 trials outcome is correct exactly when choice equals rewarded_side, error
    when it is the other side, and spoil exactly when choice is nogo; the 46 direct-delivery trials
    are consistent too.
- claim: reward-and-timeout
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_rodgers_2022.ipynb
  output: claim:reward-and-timeout
  notes: The criterion's two readings of the timeout disagree, and it blocks the claim in that case.
    Over trials to analyse, the median of stop_time minus choice_time is 12.21 s on error trials
    (reading a, outside 9 +- 0.9 s) and 3.88 s on correct trials, so the difference is 8.34 s
    (reading b, within); per session the difference is 7.04 to 8.54 s. The reward part holds on the
    left (reward on 100% of 8,917 correct trials and on none of 2,497 error trials) but not on the
    right, where the reward series is identical to the right lick series in every file and a
    "reward" falls on 16.6% of error trials. Which interval the paper calls the timeout is a
    question for the paper's authors (findings).
