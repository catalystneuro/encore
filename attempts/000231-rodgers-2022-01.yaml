findings:
- kind: data_missing
  statement: The analog input that carries the trial synchronization pulse in the neural stream is
    not deposited. Each session's Continuous_Data.openephys lists 100_ADC1 to 100_ADC8 and
    100_AUX1 to 100_AUX6, but sourcedata holds only the 64 100_CH files, and all_channels.events
    holds no events, so the neural to video alignment cannot be checked from the raw data.
- kind: data_missing
  statement: The behavioral (Arduino) timebase is not in the dataset, and neither are the curated
    whisker training sets and held-out predictions behind the tracking accuracy figures, which the
    abstract offers to users. The paper does not say where they are; the README of the original
    release (Zenodo doi:10.5281/zenodo.4743837) lists a trainset/ folder and per-session behavioral
    log files, which the paper does not mention.
- kind: metadata_error
  statement: The keywords of all 30 detection sessions include "shape discrimination", contrary to
    their experiment description ("whisker-based shape detection").
- kind: metadata_error
  statement: In every file the right reward series (described as the times of reward deliveries to
    the right) is identical to the right lick series, 315,782 times in all against 12,447 correct
    right-rewarded trials, so right reward times are not available.
- kind: metadata_insufficient
  statement: 1,533 trials have stimulus "flatter convex" or "flatter concave", values
    that Table 6 does not list or describe.
- kind: metadata_error
  statement: choice_time is NaN on all 265 spoiled trials, where Table 6 says it is 45 s after the
    window opens. On 22% of the other trials it falls 0 to 5 ms after the window opening with no
    lick within 5 ms on 94% of them, so it is not the first lick after the window as Table 6
    defines it.
- kind: metadata_error
  statement: 160 spoiled trials have ignore_trial False, where Table 6 says spoiled trials have it
    True; in the files ignore_trial equals "non-random or optogenetic" on every trial.
- kind: paper_inconsistency
  statement: The Data Records sections name processing groups behavioral_events,
    raw_whisker_position, processed_whisker_position and identified_whisker_contacts, with
    interfaces whisker_C2; the files, Table 1 and the paper's UsageNotes.ipynb use one module
    behavior with raw_position_whisker_C2, processed_position_whisker_C2 and
    contacts_by_whisker_C2. The access code printed in the Data Records fails on these files.
- kind: metadata_error
  statement: The neural recording has no timestamps array, which Table 2 and the paper's access
    code (.timestamps[:]) describe; its times are stored as a starting time and a rate.
- kind: other
  statement: 29 files hold three contacts tables, not the four the Data Records describe (no C0
    table in 21, no C3 table in 8), without a note on whether the whisker made no contact.
- kind: other
  statement: The dataset does not meet the paper's inclusion criteria as the files allow them to be
    checked. In 27 sessions more than 2% of a whisker's contacts hold an interpolated or absent
    frame (16 sessions for C1 to C3, up to 7.7%), C0 is labeled in fewer than 95% of frames in 3 to
    7 sessions, and one session (228CR, 2019-07-15) has 84 trials with ignore_trial False.
- kind: other
  statement: The paper's 18,514 trials cannot be recovered from the files, which hold 32,350 trials,
    22,905 with ignore_trial False; no other combination of the trial flags tried gives it. The
    video frame total (63,979,800) and the 44 neural sessions match exactly.
- kind: methods_unavailable
  statement: "Question for the paper's authors: how is the typical 9 s timeout measured? After an
    error, stop_time minus choice_time is a median 12.21 s, and 8.34 s longer than after a correct
    trial; only the second is near 9 s."
- kind: methods_unavailable
  statement: "Question for the paper's authors: which trials count as \"trials to analyze\" in the
    rule that excludes sessions with fewer than 90? With ignore_trial False one included session
    has 84; with random, non-spoiled trials every session has at least 90."
