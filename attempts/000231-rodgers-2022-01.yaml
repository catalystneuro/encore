- claim: choice-time-first-lick
  outcome: not_reproduced
  notebook: reproduce_rodgers_2022.ipynb
  output: claim:choice-time-first-lick
  notes: On 32,085 non-spoiled trials, the first lick at or after the window opening is within 5 ms
    of choice_time on 77.6% (78.0% allowing a lick 5 ms early), below 99% in every session (lowest
    52.5%); its side matches choice on 99.1%. On the 7,185 trials that do not match, choice_time is
