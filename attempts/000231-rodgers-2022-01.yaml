  notebook: reproduce_rodgers_2022.ipynb
  output: claim:dataset-size
  measured:
  - 15
  - 115
  - 32350
  - 63979800
  - 88.86
  notes: Mice (15 subject folders) and sessions (115 NWB files) match. The video frames match
    exactly under reading (a), 63,979,800 frames or 88.86 h; reading (b), the longest raw pose
    series of each session, gives 63,082,162 (-1.40%). The trials match under neither reading,
    32,350 rows (+74.7%) under (a) and 22,905 with ignore_trial False (+23.7%) under (b), both
