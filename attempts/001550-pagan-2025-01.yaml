- claim: ed1e-switch-four-trials
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:ed1e-switch-four-trials
  notes: Across 26 rats, at position 4 of a new block the relevant relative weight is 0.91 of its
    plateau when switching to location and 0.963 when switching to frequency (Methods selection),
    and 0.914 and 0.961 with the code's 0.65 selection. At position 1 it is 0.502 and 0.560,
    against plateaus of 0.854 and 0.789. All 26 rats have a fit at positions 1 to 5 (103 to 6,096
    trials), so the 30-trial minimum drops nothing. Bootstrapping rats, the position 4 value for
    the switch to location has a 95% interval of 0.874 to 0.946 and reaches 0.9 in 0.678 of
    resamples; at position 5, which the criterion also allows, the values are 0.956 and 0.977 and
    reach 0.9 in 0.998 and 1.000 of resamples.
  deviations:
  - The paper's code uses a 0.65 selection for this analysis; the Methods selection is the main
    result and the code's is a variant.
- claim: ed2g-learning-2-5-months
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:ed2g-learning-2-5-months
  measured: 17
  notes: From each rat's first session to its first session with an index of at least 0.7, 17 of
    26 rats took 1.8 to 5.5 months (times 0.85 to 8.18 months). With the full selection 19 of 26;
    counted from the first TaskSwitch session 13 (exactly half) and 17. Within the unwidened 2 to
    5 months the counts are 12, 16, 10 and 13. 24 rats start with ProAnti3Marino sessions.
  deviations:
  - The paper does not define the start of training or when a rat counts as trained; four
    pairings of readings are shown, three match.
- claim: fig4-converging
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:fig4-converging
  notes: All 36 slope indices of the 18 Figure 4 rats are negative (median -0.432, range -0.774 to
    -0.097). With the code's fixed penalty of 200 all 36 are negative (median -0.491), and they
    agree with the indices from the paper's saved weights to at most 0.0177 (r = 0.99973).
  deviations:
  - The Methods' ridge penalty is read as the code's penalty on neighbouring weight differences,
    with its weight chosen by 3-fold cross-validation over 20, 200 and 2000 (chosen weights 20 to
    2000); the code fixes it at 200.
  - The differential kernel is divided by its largest absolute value before the line fit, as the
    code does; the Methods do not say.
- claim: fig4-loc-frq-uncorrelated
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:fig4-loc-frq-uncorrelated
  notes: Across 18 rats r = 0.180 (95% CI -0.313 to 0.597), p = 0.475; with the fixed penalty
    r = 0.092, p = 0.717; from the paper's saved weights r = 0.094, p = 0.71.
  deviations:
  - The paper gives no test; a two-sided Pearson correlation was chosen before the analysis.
- claim: ed3g-halfsplit
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:ed3g-halfsplit
  measured: 0.552
  notes: Over 24 rats and 48 values r = 0.552 (95% CI 0.318 to 0.723), p = 4.7e-05, within 0.522
    to 0.638. With the fixed penalty r = 0.577, p = 1.8e-05. Location alone r = 0.470, frequency
    alone r = 0.736.
  deviations:
  - The halves use the penalty weight chosen on all of that rat's trials in that context.
- claim: ed4-bilateral-fof-impairs
  outcome: partially_reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:ed4-bilateral-fof-impairs
  notes: Four rats have opto sessions (P116 47, P124 74, P127 4 and P131 88 with at least 100
    valid trials). With bilateral full-trial epochs accuracy is lower than on control trials in
    the same sessions with p < 0.05 in 2 of the 3 rats with most sessions, P116 (0.639 against
    0.733, 873 trials, p below 1e-4) and P131 (0.686 against 0.727, 1,988 trials, p = 0.0001).
    P124 is higher (0.712 against 0.687, p = 0.17) and P127 lower but not significantly (0.603
    against 0.634, p = 0.55). Any bilateral epoch gives 2 of 3 and 2 of 4 as well. Every trial with an epoch has
    the laser connected; with laser-connected trials only the accuracies and p values are the
    same.
  deviations:
  - The paper does not say which three rats were analysed, which sessions, or its test; the
    readings and the Fisher test were chosen before the analysis.
- claim: neural-link
  outcome: not_reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:neural-link
  measured: 110
  notes: All 7 rats are in the dandiset and every cell file names one of them. Under the
    criterion's rule (the cell's trials equal a contiguous run of one session's valid trials)
    2,371 of 3,495 cells (0.678) match one session and none matches more than one; they come from
    110 sessions against 199. With gaps allowed (a variant) 3,269 cells (0.935) match exactly one
    session, from 112 sessions; 226 cells match none, 189 of them P100's. The neural files leave
    out some trials of a session, so the contiguous rule is stricter than needed, but neither rule
    finds 199 sessions. Searching every TaskSwitch protocol (adding P100's 13 TaskSwitch4repeat
    sessions) gives 2,425 contiguous matches (0.694) from 113 sessions and 3,349 with gaps (0.958)
    from 115; the 146 cells left share a median 0.43 of their 8-trial windows with their best
    session, and 61 of those 64 best sessions are already matched.
  deviations:
  - The neural files carry no session identifier; cells are matched by their trial sequence.
- claim: units-per-rat
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:units-per-rat
  measured:
  - 3495
  - 3285
  - 210
  notes: The cell files hold 3,495 units, FOF 2,047 (P100), 832 (P059), 258 (P055), 94 (P095) and
    54 (P049), mPFC 112 (P101) and 98 (P102), and rat_for_each_neuron.mat agrees with every file.
