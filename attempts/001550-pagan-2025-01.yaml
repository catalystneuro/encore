  notes: In all 20 rats both relative weights exceed 0.5; location in the location context 0.770
    to 0.860, frequency in the frequency context 0.724 to 0.870.
  deviations:
  - Tested by the Methods' logistic regression on generative strengths, not by the four-parameter
