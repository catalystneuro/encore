- claim: fig3a-trained-rnn-svm
  outcome: blocked
  blocked_by: not_runnable
  notes: Needs 1,000 RNNs trained by backpropagation through time (train_model.py in
    flexible_decision_making_rnn at commit 13cd245) and their linearisation; the repository holds
    three trained models. Training them is far beyond the 30-minute limit.
- claim: fig5c-engineered-rnn
  outcome: blocked
  blocked_by: not_runnable
  notes: The engineered RNNs and their pulse and behavioural kernels are built by MATLAB scripts
    (handcraft_model.m and others in flexible_decision_making_rnn at commit 13cd245), which cannot
    run in the entry's environment and were not ported.
findings:
- kind: data_missing
  statement: The dandiset holds only the behaviour. The electrophysiology behind Figures 1d to 1f,
    3h and 5d (3,495 units from 7 rats) is not in it; it is public only in the paper's GitHub
    repository, as one MATLAB file per unit with binned spike counts, without raw data or spike
    sorting output.
- kind: identifier_missing
  statement: Nothing links the paper's units to dandiset sessions. Matched by trial sequence, 3,269
    of 3,495 units fall in exactly one dandiset session when gaps are allowed (2,371 without
    gaps), from 112 sessions, where the paper reports 199; 226 units match no session. Searching
    every TaskSwitch protocol gives 3,349 units from 115 sessions, and 146 unmatched.
- kind: metadata_error
  statement: Every optogenetic epoch gives a wavelength of 473 nm; Extended Data Figure 4 says
    450 nm, and the conversion's documentation says the value was corrected to 450.
- kind: metadata_insufficient
  statement: Optogenetic epochs are present for four rats (P116, P124, P127, P131), where the paper
    reports three; nothing in the dandiset or the paper says which three were analysed.
- kind: metadata_error
  statement: The dates of birth give ages of 3.0 to 39.1 months at the sessions the paper's
    selection keeps (18 rats younger than 5.4 months at some), where the Methods state 6 to 24
    months. Either the dates of birth or the stated ages are wrong. The dates of birth put 25 rats
    at 1.6 to 2.7 months at their first session; P189's (2018-02-21) puts it at 14.1 months on the
    day P187, born 2019-02-21, starts, and may be a year early.
- kind: format_error
  statement: Thirteen task sessions (1 to 3 trials each) lack HistorySection_result_history or a
    pulse column, and 95 of the other 15,400 lack HistorySection_hit_history. Where both outcome
    columns exist they agree on every trial.
- kind: data_missing
  statement: One session of the paper's tables with 27 valid trials, P189 TaskSwitch6-210516a, is
    not in the dandiset; the conversion's notes list it among aborted sessions left out.
- kind: other
  statement: Six task sessions of P187 and P189 (TaskSwitch6, 2021) are in the dandiset but not in
    the paper's tables; five of them pass the Methods selection, adding 1,442 and 609 trials to
    those rats.
- kind: other
  statement: HistorySection_gammafreq_history, a signed strength, is stored as uint8 or int16 in
    570 files; in all of them its values equal the float gamma_freq, so nothing was lost.
- kind: selection_undocumented
  statement: The paper's code also requires a per-session `good` flag that the Methods do not
    describe and the dandiset does not hold, and caps relative weights at 1; neither changes the
    selection except for one P059 session.
- kind: code_mismatch
  statement: The Methods describe ridge regression with the regulariser chosen by cross-validation;
    the code adds a fixed penalty of 200 on squared differences of neighbouring weights. The code
    also uses looser selections (0.65 correct and 0.6 index) for the recorded rats in Figure 5d
    and for Extended Data Figure 1e than the Methods' 0.7.
- kind: code_mismatch
  statement: The paper's own code (ExtDataFigure5ag.m), applied to its own fitted per-context
    kernels, gives angles of 1.1 to 8.0 degrees between the context choice axes (mean 4.7), not
    the reported average of 1.6 degrees. The permutation test of each angle against 0 that the
    Methods describe is not in the code.
- kind: paper_inconsistency
  statement: The Methods say 3,495 units were recorded from 5 rats in FOF and list FOF counts that
    sum to 3,285; the 3,495 include the 210 mPFC units. The main text calls a converging
    differential behavioural kernel a slope index above 0, while the Methods and the code give
    converging kernels negative indices, as the data have.
verifications:
- date: '2026-10-19'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: The first executed notebook with the conclusion cells and the summary removed, the helper module
    and the claims file, with the paper's full text. The verifier recomputed the choice-axis angles from
    combined_kernels_per_context.mat, read ExtDataFigure5ag.m and get_neural_slope.m, listed the
    version's assets, and tested bin_pulses, relative_weights, slope_index, fit_logistic and opto_trials
    on synthetic inputs.
  results:
  - claim: session-link
    agrees: true
    outcome: reproduced
    reason: 0.9999 of the paper's sessions with valid trials are in the dandiset (one missing, P189
      TaskSwitch6-210516a). Valid-trial count and fraction correct are equal in all 15,277 matched sessions;
      in the 20-session sample the per-trial fields and position in block agree on 100% of trials and the 10
      ms pulse bins on 99.996%. Per-rat counts match numsessions_all_rats for 23 of 26 rats, the differences
      explained by 6 extra dandiset sessions and 1 session where the selection differs. The relative weights
      agree with the paper's bdir and bfreq in only 89.8% of sessions and the notebook does not explain this;
      the P059 row suggests the paper clips relative weights at 1. The per-trial fields were compared only in
      the 20-session sample.
    response: Added the breakdown of the 1,553 sessions whose relative weights differ (861 agree once capped at
      1, 632 have a missing value on one side, 3 of the rest are in the paper's selection) and a comparison
      of every matched session (627 have an empty per-trial record in the paper's tables; in the other 14,650
      all 7,447,692 valid trials agree on every field and position in block, and 0.99996 of 50 ms pulse bins
      agree). Outcome unchanged.
  - claim: subjects
    agrees: true
    outcome: partially_reproduced
    reason: 26 subjects, all male, all Long Evans; only 0.913 of selected sessions fall in 5.4 to 26.4 months
      (minimum 3.0, maximum 39.1). 18 rats have selected sessions below 5.4 months, and the date_of_birth
      metadata is never checked for plausibility, for example against the age at the first session.
    response: Added each rat's date of birth and its age at the first session in the dandiset, the first
      TaskSwitch session and the first selected session. 25 rats are 1.6 to 2.7 months old at their first
      session, which supports the young ages; P189 is 14.1 months old at its first session, which falls on
      P187's first day, and its date of birth may be a year early. Conclusion, notes and the finding updated.
      Outcome unchanged.
  - claim: trials-per-session
    agrees: true
    outcome: reproduced
    reason: Valid trials per selected session average 551.8, and per task session 494.2, both inside 487.8 to
      596.2. Readings c and d leave out the 13 unreadable sessions, a negligible effect.
    response: Added readings c and d with the 13 unreadable sessions included (749.1 and 493.8). Outcome
      unchanged.
  - claim: blocks-per-session
    agrees: true
    outcome: reproduced
    reason: Blocks over all task sessions average 13.90, and switches over selected sessions 15.98, both inside
      13.14 to 16.06.
    response: No change.
  - claim: session-duration
