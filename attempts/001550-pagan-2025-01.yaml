- claim: fig3h-neural-uncorrelated
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:fig3h-neural-uncorrelated
  notes: Neural slope indices range from -0.221 to 1.728 (location) and 0.465 to 1.500
