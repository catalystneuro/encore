  deviations:
  - The per-neuron kernels are the paper's fitted ones from its repository; the GLM was not
    refitted from spikes.
  - The paper gives no test; a two-sided Pearson correlation was chosen before the analysis.
- claim: choice-axes-parallel
  outcome: not_reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:choice-axes-parallel
  measured: 4.73
  notes: By ExtDataFigure5ag.m on the paper's per-context kernels, the angle the code plots (the
    two context choice axes projected on the first 3 principal components of both contexts'
    choice kernels, folded to at most 90 degrees) is 5.53, 7.91, 4.49, 1.82, 1.12, 4.25 and 8.00
    degrees (P049, P055, P059, P095, P100, P101, P102), mean 4.73, against the reported 1.6
    (tolerance 1.44 to 1.76); no rat is in the tolerance. The 3 components explain 0.85 to 0.94
    of the variance. The full-space angle, which the code computes first and overwrites, averages
    40.34 (29.43 folded). All units of each rat have fits in both contexts. The reported test
    against 0 (not different from 0 in 6 of 7 rats) is a permutation test the Methods describe,
    shuffling the trials' context labels and recomputing both axes; it is not in the repository's
    code and needs the per-neuron kernels refitted for every shuffle, so it was not run.
  deviations:
  - The criterion was corrected after the first verification round to follow the angle the code
    plots; it first described only the full-space angle, now a variant. Both are outside the
    tolerance.
- claim: fig5d-behaviour-neural
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:fig5d-behaviour-neural
  measured:
  - -0.697
  - -0.675
  - -0.772
  notes: Behavioural slope indices from the dandiset (Methods selection, bins 14 to 26) against
    neural indices from the paper's kernels give r = -0.697 over 14 values (95% CI -0.896 to
    -0.264), p = 0.0056, within -0.803 to -0.657. Location alone r = -0.675 (p = 0.096), frequency
    alone r = -0.772 (p = 0.042); the paper reports -0.71 for each with P < 0.1, and both hold at
    that level. With the code's 0.65 and 0.6 selection and penalty 200, r = -0.765 (p = 0.0014),
    and the paper's saved behavioural indices give -0.768. The match of neurons to rats, which
    this claim needs, holds for every cell; the session-level link that fails in neural-link is
    not used here.
  deviations:
  - The Methods selection keeps 23,014 and 25,847 trials of P049 and P059 against 135,001 and
    162,317 under the code's selection, and their location indices change sign (0.131 against
    -0.432, 1.292 against -0.613).
  - Neural kernels are the paper's fitted ones, not refitted from spikes.
  - The result is close to the tolerance and depends on P049 and P059. With those two rats from the
    code's selection r = -0.834, and with the code's selection and cross-validated penalty
    r = -0.830, both beyond the tolerance on the negative side; leaving out one rat at a time
    gives -0.655 to -0.895, inside the tolerance for 4 of 7. All five 14-point correlations
    shown are negative with p < 0.01.
- claim: fig1e-choice-axis
  outcome: blocked
  blocked_by: methods_underspecified
  notes: Figure1e.m projects the per-context choice kernels on principal components but computes
    neither 81.3% nor 73.3%, and the text does not say which kernels, time window or
    normalisation the percentages refer to. The data (combined_kernels_per_context.mat, and the
    mTDR fits in data/Arrays_Pagan) are public in the paper's repository.
- claim: fig1f-irrelevant-encoded
  outcome: blocked
  blocked_by: not_runnable
  notes: Needs the mTDR fits of the MATLAB toolbox in the repository's mbtdr folder (with minFunc)
    on data/Arrays_Pagan. MATLAB cannot be installed in the entry's locked Python environment and
