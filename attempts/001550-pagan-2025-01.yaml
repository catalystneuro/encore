- claim: fig1c-20-rats
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:fig1c-20-rats
  measured: 20
  notes: Twenty rats have more than 120,000 valid trials in selected sessions (the twentieth,
