- claim: fig5d-behaviour-neural
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:fig5d-behaviour-neural
  measured:
  - -0.697
  - -0.675
  - -0.772
  notes: Behavioural slope indices from the dandiset (Methods selection, bins 14 to 26) against
    neural indices from the paper's kernels give r = -0.697 over 14 values (95% CI -0.896 to
    -0.264), p = 0.0056, within -0.803 to -0.657. Location alone r = -0.675 (p = 0.096), frequency
    alone r = -0.772 (p = 0.042); the paper reports -0.71 for each with P < 0.1, and both hold at
