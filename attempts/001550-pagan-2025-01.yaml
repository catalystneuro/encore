  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:units-per-rat
  measured:
  - 3495
  - 3285
  - 210
  notes: The cell files hold 3,495 units, FOF 2,047 (P100), 832 (P059), 258 (P055), 94 (P095) and
