inputs:
- what: The paper's per-session behavioural tables (data/Sessions_trials, for the link to the
    dandiset), its per-rat trial counts (data/numsessions_all_rats.mat) and saved behavioural
    regression weights and slope indices (data/logistic_regression_results,
    data/logistic_regression_results_ephys_rats.mat), used as reference values.
  source: https://github.com/Brody-Lab/flexible_decision_making_rats at commit
    0ea8fdb7c56d755d99155171cc314dbbc24393ac
- what: The paper's neural data, one MATLAB file per unit with its rat, region and trials
    (data/neural_data), the rat of each unit (data/rat_for_each_neuron.mat), and its fitted
    per-neuron pulse and choice kernels (data/combined_kernels.mat,
    data/combined_kernels_per_context.mat), for the neural claims.
  source: https://github.com/Brody-Lab/flexible_decision_making_rats at commit
    0ea8fdb7c56d755d99155171cc314dbbc24393ac
- what: The paper's analysis code, read for the method choices (compute_logistic_regression.m,
    costFunction.m, compute_slope.m, plot_logistic_regression.m, Figure4.m, Figure5d.m,
    get_neural_slope.m, ExtDataFigure3g.m, ExtDataFigure5ag.m, compute_taskswitch.m and others).
  source: https://github.com/Brody-Lab/flexible_decision_making_rats at commit
    0ea8fdb7c56d755d99155171cc314dbbc24393ac
outcomes:
- claim: session-link
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:session-link
  notes: Sessions are matched by rat and session name taken from the source file names in the
    paper's tables. Of 15,278 paper sessions with valid trials, 15,277 (0.9999) are in the
    dandiset; the missing one, P189 TaskSwitch6-210516a, has 27 valid trials. In all 15,277 the
    number of valid trials and the fraction correct are equal, and both relative weights agree to
    1e-6 in 0.898. In 20 seeded sessions every valid trial agrees on context, correct side,
    strengths, choice, outcome and position in block, and 0.99996 of 10 ms pulse bins agree.
    The dandiset's Methods selection keeps all 8,843 sessions of the paper's selection plus 6
    (5 P187 and P189 sessions not in the paper's tables, and P059 TaskSwitch4-170331a, whose
    relative weight of 1.112 the paper's table caps at 1.0). Per-rat selected trial counts
    equal the paper's numhits for 23 of 26 rats and exceed them by 213 (P059), 1,442 (P187) and
    609 (P189).
  deviations:
  - The paper's `good` flag is not in the dandiset and is not applied; it removes no session
    that passes the other criteria.
- claim: subjects
  outcome: partially_reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:subjects
  measured:
  - 26
  notes: 26 subjects, all male Long Evans, one date of birth each. Ages at the 8,849 selected
    sessions are 3.0 to 39.1 months (median 15.4); 0.913 lie within 5.4 to 26.4 months and 0.844
    within 6 to 24. Eighteen rats have selected sessions before 5.4 months and eight after 26.4.
- claim: trials-per-session
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:trials-per-session
  measured: 551.8
  notes: Mean valid trials per session 551.8 over the 8,849 selected sessions (reading b) and
    494.2 over all 15,400 task sessions (reading d), both within 487.8 to 596.2. All trials
    average 817.9 and 749.7 (readings a and c), outside.
  deviations:
  - The Methods do not say which sessions or trials are counted; four readings are shown and two
    match.
- claim: blocks-per-session
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:blocks-per-session
  measured: 13.9
  notes: Blocks per session average 16.98 over selected sessions and 13.90 over all task
    sessions; switches average 15.98 and 12.90. Blocks over all sessions (13.90) and switches over
    selected sessions (15.98) are within 13.14 to 16.06; the first is recorded as measured.
  deviations:
  - Whether blocks or switches are counted, and over which sessions, is not stated; two of four
    readings match.
- claim: session-duration
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:session-duration
  notes: Median duration 2.50 h over selected sessions and 2.57 h over all task sessions. Only
    0.559 and 0.556 of sessions last 2 to 4 h (0.65 within 1.8 to 4.4); 5% to 95% of selected
    sessions span 1.26 to 4.41 h, and the range is 0.26 to 7.74 h.
  deviations:
  - Duration is taken from the first trial start to the last trial stop; the files hold no
    session end time.
- claim: block-min-30
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:block-min-30
  notes: All 141,359 non-final blocks of selected sessions have at least 30 trials counted over
    all trials (1st percentile 30, median 44); counted over valid trials 0.817 do. Over the last
    30 valid trials before a switch the median fraction correct is 0.828 and 0.601 of blocks
    reach 0.8, so the 80% part is not shown on that window; the task's local estimate is not
    described.
- claim: fig1c-20-rats
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:fig1c-20-rats
  measured: 20
  notes: Twenty rats have more than 120,000 valid trials in selected sessions (the twentieth,
    P189, has 128,309; the next, P124, 115,123). The same 20 pass at 120,000 or more.
- claim: fig1c-context-selection
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:fig1c-context-selection
  notes: In all 20 rats both relative weights exceed 0.5; location in the location context 0.770
    to 0.860, frequency in the frequency context 0.724 to 0.870.
  deviations:
  - Tested by the Methods' logistic regression on generative strengths, not by the four-parameter
    psychometric fits that the figure shows.
- claim: ed1e-switch-four-trials
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:ed1e-switch-four-trials
  notes: Across 26 rats, at position 4 of a new block the relevant relative weight is 0.91 of its
    plateau when switching to location and 0.963 when switching to frequency (Methods selection),
    and 0.914 and 0.961 with the code's 0.65 selection. At position 1 it is 0.502 and 0.560,
    against plateaus of 0.854 and 0.789.
  deviations:
  - The paper's code uses a 0.65 selection for this analysis; the Methods selection is the main
    result and the code's is a variant.
- claim: ed2g-learning-2-5-months
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:ed2g-learning-2-5-months
  measured: 17
  notes: From each rat's first session to its first session with an index of at least 0.7, 17 of
    26 rats took 1.8 to 5.5 months (times 0.85 to 8.18 months). With the full selection 19 of 26;
    counted from the first TaskSwitch session 13 (exactly half) and 17. Within the unwidened 2 to
    5 months the counts are 12, 16, 10 and 13. 24 rats start with ProAnti3Marino sessions.
  deviations:
  - The paper does not define the start of training or when a rat counts as trained; four
    pairings of readings are shown, three match.
- claim: fig4-converging
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:fig4-converging
  notes: All 36 slope indices of the 18 Figure 4 rats are negative (median -0.432, range -0.774 to
    -0.097). With the code's fixed penalty of 200 all 36 are negative (median -0.491), and they
    agree with the indices from the paper's saved weights to at most 0.0177 (r = 0.99973).
  deviations:
  - The Methods' ridge penalty is read as the code's penalty on neighbouring weight differences,
    with its weight chosen by 3-fold cross-validation over 20, 200 and 2000 (chosen weights 20 to
    2000); the code fixes it at 200.
  - The differential kernel is divided by its largest absolute value before the line fit, as the
    code does; the Methods do not say.
- claim: fig4-loc-frq-uncorrelated
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:fig4-loc-frq-uncorrelated
  notes: Across 18 rats r = 0.180 (95% CI -0.313 to 0.597), p = 0.475; with the fixed penalty
    r = 0.092, p = 0.717; from the paper's saved weights r = 0.094, p = 0.71.
  deviations:
  - The paper gives no test; a two-sided Pearson correlation was chosen before the analysis.
- claim: ed3g-halfsplit
  outcome: reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:ed3g-halfsplit
  measured: 0.552
  notes: Over 24 rats and 48 values r = 0.552 (95% CI 0.318 to 0.723), p = 4.7e-05, within 0.522
    to 0.638. With the fixed penalty r = 0.577, p = 1.8e-05. Location alone r = 0.470, frequency
    alone r = 0.736.
  deviations:
  - The halves use the penalty weight chosen on all of that rat's trials in that context.
- claim: ed4-bilateral-fof-impairs
  outcome: partially_reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:ed4-bilateral-fof-impairs
  notes: Four rats have opto sessions (P116 47, P124 74, P127 4 and P131 88 with at least 100
    valid trials). With bilateral full-trial epochs accuracy is lower than on control trials in
    the same sessions with p < 0.05 in 2 of the 3 rats with most sessions, P116 (0.639 against
    0.733, 873 trials, p below 1e-4) and P131 (0.686 against 0.727, 1,988 trials, p = 0.0001).
    P124 is higher (0.712 against 0.687, p = 0.17) and P127 not lower (0.603 against 0.634,
    p = 0.55). Any bilateral epoch gives 2 of 3 and 2 of 4 as well.
  deviations:
  - The paper does not say which three rats were analysed, which sessions, or its test; the
    readings and the Fisher test were chosen before the analysis.
- claim: neural-link
  outcome: not_reproduced
  notebook: reproduce_pagan_2025.ipynb
  output: claim:neural-link
  measured: 110
  notes: All 7 rats are in the dandiset and every cell file names one of them. Under the
    criterion's rule (the cell's trials equal a contiguous run of one session's valid trials)
    2,371 of 3,495 cells (0.678) match one session and none matches more than one; they come from
    110 sessions against 199. With gaps allowed (a variant) 3,269 cells (0.935) match exactly one
    session, from 112 sessions; 226 cells match none, 189 of them P100's. The neural files leave
    out some trials of a session, so the contiguous rule is stricter than needed, but neither rule
    finds 199 sessions.
  deviations:
  - The neural files carry no session identifier; cells are matched by their trial sequence.
