- claim: fig5c-engineered-rnn
  outcome: blocked
  blocked_by: not_runnable
  notes: The engineered RNNs and their pulse and behavioural kernels are built by MATLAB scripts
    (handcraft_model.m and others in flexible_decision_making_rnn at commit 13cd245), which cannot
    run in the entry's environment and were not ported.
findings:
- kind: data_missing
  statement: The dandiset holds only the behaviour. The electrophysiology behind Figures 1d to 1f,
    3h and 5d (3,495 units from 7 rats) is not in it; it is public only in the paper's GitHub
    repository, as one MATLAB file per unit with binned spike counts, without raw data or spike
    sorting output.
- kind: identifier_missing
  statement: Nothing links the paper's units to dandiset sessions. Matched by trial sequence, 3,269
    of 3,495 units fall in exactly one dandiset session when gaps are allowed (2,371 without
    gaps), from 112 sessions, where the paper reports 199; 226 units match no session.
- kind: metadata_error
  statement: Every optogenetic epoch gives a wavelength of 473 nm; Extended Data Figure 4 says
    450 nm, and the conversion's documentation says the value was corrected to 450.
- kind: metadata_insufficient
  statement: Optogenetic epochs are present for four rats (P116, P124, P127, P131), where the paper
    reports three; nothing in the dandiset or the paper says which three were analysed.
- kind: metadata_error
  statement: The dates of birth give ages of 3.0 to 39.1 months at the sessions the paper's
    selection keeps (18 rats younger than 5.4 months at some), where the Methods state 6 to 24
    months. Either the dates of birth or the stated ages are wrong.
- kind: format_error
  statement: Thirteen task sessions (1 to 3 trials each) lack HistorySection_result_history or a
    pulse column, and 95 of the other 15,400 lack HistorySection_hit_history. Where both outcome
    columns exist they agree on every trial.
- kind: data_missing
  statement: One session of the paper's tables with 27 valid trials, P189 TaskSwitch6-210516a, is
    not in the dandiset; the conversion's notes list it among aborted sessions left out.
- kind: other
  statement: Six task sessions of P187 and P189 (TaskSwitch6, 2021) are in the dandiset but not in
    the paper's tables; five of them pass the Methods selection, adding 1,442 and 609 trials to
    those rats.
- kind: other
  statement: HistorySection_gammafreq_history, a signed strength, is stored as uint8 or int16 in
    570 files; in all of them its values equal the float gamma_freq, so nothing was lost.
- kind: selection_undocumented
  statement: The paper's code also requires a per-session `good` flag that the Methods do not
    describe and the dandiset does not hold, and caps relative weights at 1; neither changes the
    selection except for one P059 session.
- kind: code_mismatch
  statement: The Methods describe ridge regression with the regulariser chosen by cross-validation;
    the code adds a fixed penalty of 200 on squared differences of neighbouring weights. The code
    also uses looser selections (0.65 correct and 0.6 index) for the recorded rats in Figure 5d
    and for Extended Data Figure 1e than the Methods' 0.7.
- kind: code_mismatch
  statement: The paper's own code (ExtDataFigure5ag.m), applied to its own fitted per-context
    kernels, gives angles of 13 to 128 degrees between the context choice axes (mean 40), not the
    reported average of 1.6 degrees.
- kind: paper_inconsistency
  statement: The Methods say 3,495 units were recorded from 5 rats in FOF and list FOF counts that
    sum to 3,285; the 3,495 include the 210 mPFC units. The main text calls a converging
    differential behavioural kernel a slope index above 0, while the Methods and the code give
    converging kernels negative indices, as the data have.
