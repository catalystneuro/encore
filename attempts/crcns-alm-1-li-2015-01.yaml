- claim: antidromic-latency-jitter
  outcome: reproduced
  assumed: true
  notebook: reproduce_li_2015.ipynb
  output: claim:antidromic-latency-jitter
  notes: First pulses, spikes within +/-0.5 ms of each neuron's modal latency. PT 2.675 ms and
    0.113 ms jitter (45 neurons); IT 5.00 ms and 0.198 ms (21 neurons with type 2 trials), or
    4.58 ms and 0.177 ms with types 2 to 5 (27 neurons); tagged mean jitter 0.140 (0.137). All
    within tolerance; PT shorter than IT. With +/-1 ms the PT values hold (2.672, 0.126) but the
    IT jitter is 0.27 to 0.31 ms and the tagged mean 0.18 ms, outside tolerance. The four
    activated-neuron values cannot be computed, as those neurons are not labelled, so no measured
    list is given.
  deviations:
  - The paper does not say how antidromic spikes are told from spontaneous ones. Assumed - the
    first spike within 10 ms of a pulse, kept when within +/-0.5 ms of the neuron's modal
    latency (0.2 ms bins); +/-1 ms is shown and changes the IT jitter. The narrower window is
    adopted because the paper's jitter values (0.1 to 0.2 ms) describe spikes locked to the
    pulse, and a wider window admits spontaneous spikes.
  - Pulse onsets are read from the AOM input trace at 10 kHz, so they are quantised to 0.1 ms,
    and any delay between the AOM input and the light is not known.
  - IT tagging trials are type 2; types 3 to 5, undocumented, are included as a variant.
