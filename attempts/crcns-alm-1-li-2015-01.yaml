- claim: unit-counts
  outcome: partially_reproduced
  notebook: reproduce_li_2015.ipynb
  output: claim:unit-counts
  measured:
  - 1408
  - 1245
  - 158
  - 5
  notes: 1,408 units, 19 mice, 99 sessions. The trough-to-peak widths of the deposited mean
    waveforms (the criterion's measure) give 1,245 units above 0.45 ms, 158 below 0.35 ms and 5
    in between, so the FS and intermediate counts are outside tolerance; 34 of the 39 units
