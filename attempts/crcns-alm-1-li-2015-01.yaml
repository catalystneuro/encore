    labels put the FS boundary between 5 and 6 samples, not at 0.35 ms. The paper's
    classification is in the labels but its stated thresholds do not give it from the deposited
    waveforms.
  deviations:
  - Waveforms are the deposited 29-sample snippets at 19531.25 Hz, so widths come in steps of
    0.0512 ms; the paper does not say whether its widths were interpolated.
