- claim: antidromic-latency-jitter
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_li_2015.ipynb
  output: claim:antidromic-latency-jitter
  notes: First pulses, spikes within +/-1 ms of each neuron's modal latency. PT 2.672 ms and
    0.126 ms jitter (45 neurons), within tolerance; IT 4.98 ms (21 neurons with type 2 trials) or
    4.56 ms (27 neurons, types 2 to 5), within tolerance and longer than PT. IT jitter 0.310 ms
    (0.265 with types 2 to 5) and the tagged mean 0.184 ms (0.178) are outside tolerance. The
    order and the PT values hold, the IT jitter and the tagged mean do not; the four
    activated-neuron values cannot be computed, as those neurons are not labelled, so no measured
    list is given. Readings without a window agree with +/-1 ms - a per-neuron fit of a Gaussian
    peak plus a uniform background gives IT jitter 0.341 ms and a tagged mean of 0.185 ms, the
    same fit with a broad component added 0.282 and 0.166 ms, and the +/-1 ms window without the
    four IT neurons with broad humps 0.289 and 0.170 ms. A robust s.d. (1.4826 times the median
    absolute deviation within +/-1 ms) gives 0.289 and 0.166 ms. Only the +/-0.5 ms window gives
    values within tolerance (IT 0.198 ms, 0.177 with types 2 to 5; tagged mean 0.140 ms). PT
    jitter is 0.112 to 0.126 ms under every reading. This claim and reaction-time each turn on a
    detection rule the paper does not give, but they differ. Here the PT values, the latencies
    and their order hold under every window, and five of the six jitter readings agree on the IT
    jitter. For reaction-time the single value falls inside or outside tolerance with the rule,
    and the data give no reason to prefer any rule.
  deviations:
  - The paper does not say how antidromic spikes are told from spontaneous ones. Assumed - the
    first spike within 10 ms of a pulse, kept when within +/-1 ms of the neuron's modal latency
    (0.2 ms bins). Between 0.5 and 1 ms from the mode the IT neurons have 783 spikes where the
    spontaneous background (latencies more than 2 ms from the mode) predicts 69.7. This shows the
    spikes are locked to the pulse, not that they are antidromic - several IT neurons show humps
    several ms wide, and the four broadest hold 316 of the 783 spikes. The window rests instead on
    the readings that need none (fits of a narrow peak plus background, with and without a broad
    component), which give IT jitter near the +/-1 ms value. The +/-0.5 ms window, adopted before
    verification, is shown as a variant.
  - Pulse onsets are read from the AOM input trace at 10 kHz, so they are quantised to 0.1 ms,
    and any delay between the AOM input and the light is not known.
  - IT tagging trials are type 2; types 3 to 5, undocumented, are included as a variant.
