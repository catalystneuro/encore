- claim: reaction-time
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_li_2015.ipynb
  output: claim:reaction-time
  measured: 81.66
  notes: Mean over 19 mice of per-mouse mean reaction times, correct trials, onset at 5% of the
    trial's peak excursion of the lick trace, 81.7 ms (s.d. 56.9); 99.9 to 176.8 ms at 10% to
    50%; 100.7 to 188.5 ms on all responses. None within 61.1 +/- 10.5. The variant of per-mouse
    medians gives 68.2 ms at 5%, within tolerance, and 84.5 to 142.8 ms at higher fractions. The
    spread across mice (s.d. 51 to 65 ms) is five to six times the paper's, and per-mouse means
    at 10% range from 22.1 to 287.6 ms, which points to session-to-session differences in the
    lick trace.
  deviations:
  - The paper does not say how the first movement is found in the photodiode trace, and the
    trace's baseline (0.07 to 4.83 V), scale and sign differ between sessions. Assumed - onset
    when the trace has moved from its pre-cue median by a fraction (5%, 10%, 25% or 50%) of its
    largest excursion in the 1 s after the cue. Every fraction gives the same outcome on the
    per-mouse means the criterion names.
  - Measured on the 19 electrophysiology mice; the paper's mice for this number are not stated.
