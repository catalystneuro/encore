findings:
- kind: data_missing
  statement: The data set holds only the electrophysiology of Figures 2 and 3 and Extended Data
    Figures 1, 2 and 5. The photoinhibition and photoactivation behaviour (Fig. 1, Fig. 5, ED
    Figs 3 and 6), the calcium imaging (Fig. 4), the anatomy (ED Fig. 3) and the recordings with
    somatic PT photoactivation (ED Fig. 7) are not in it, and the paper names no other deposit.
    Eleven of the paper's findings cannot be tested.
- kind: metadata_insufficient
  statement: PhotostimulationType takes the values 3, 4 and 5 in 495 trials, all in the two
    Tlx_PL56-Cre x Ai32 mice ANM218453 and ANM218457 (eight 1 ms pulses at about 23 mW starting
    1.8, 2.3 or 2.8 s into the trial), but the data description lists only 0, 1, 2 and NaN. The data set's own compile
    script treats 1 to 5 as tagging trials.
- kind: metadata_insufficient
  statement: The NaN-type trials ("photostimulation configurations for testing purposes") carry
    light in 3,756 trials of all 19 mice, in configurations the description does not give. In
    three Sim1_KJ18-Cre mice (ANM210861 to ANM210863) they are 50 ms pulses at about 47 mW starting
    0.70 to 4.98 s into the trial (session medians 1.9 to 3.2 s). In the other mice without Ai32
    they fall mostly outside performing trials, as 50 ms pulses mostly at about 23 mW (session
    median onset 0.70 s) or 1 ms pulses at about 47 mW (session median onset 0.97 s). In the three
    Ai32 mice they are eight 1 ms pulses at about 23 mW starting 0.49 to 2.8 s into the trial, 135
    of them in the sample epoch of the Sim1 x Ai32 mouse. Which of these, if any, are the ED Fig. 7 PT
    photostimulation sessions cannot be told.
- kind: metadata_error
  statement: In session ANM210862_20130627, 43 trials have PhotostimulationType 0 ("non-stimulation
    trials") but their AOM and laser power traces carry 8 to 22 light pulses of 50 ms at 47.1 mW,
    starting 1.9 to 4.35 s into the trial (median 3.2 s).
- kind: metadata_insufficient
  statement: Only neurons that passed the collision test are labelled (45 PT, 27 IT). The 22
    pyramidal-tract-activated and 106 intratelencephalic-activated neurons and the 7 untestable
    ones are not identified, so their counts, latencies and jitter cannot be checked.
- kind: other
  statement: The trough-to-peak widths of the deposited mean waveforms put 34 of the 39
    unlabelled units below 0.35 ms (158 in all), where the paper and the data description call
    all 39 intermediate (0.35 to 0.45 ms). The labels split the deposited widths cleanly (FS 0.154
    to 0.256 ms, unlabelled 0.307 or 0.410 ms, pyramidal 0.461 to 0.666 ms), so the FS boundary
    the labels use lies between 0.256 and 0.307 ms, not at the stated 0.35 ms. The cellType
    labels match the paper's counts; the stated thresholds do not reproduce them from the
    deposited waveforms.
- kind: format_error
  statement: 10 units have spike times out of order (7 in session ANM214429_20130806, and
    ANM219030_20130829 unit 12, ANM219030_20130831 unit 5, ANM219247_20130920 unit 5).
- kind: metadata_insufficient
  statement: The lick trace is described only as "licking movement from photodiode"; its baseline
    (0.07 to 4.83 V per session), scale and sign of excursion differ between sessions, and no
    detection rule or calibration is given, so the paper's reaction time cannot be recomputed
    reliably.
- kind: methods_unavailable
  statement: Question for the paper's authors. How was the reaction time (61.1 +/- 10.5 ms) found
    from the photodiode trace, with what threshold, which trials and which mice? On correct trials
    of the 19 electrophysiology mice, detecting the first departure from the pre-cue baseline by
    3, 5 or 10 times the baseline noise gives a mean of per-mouse means of 65 to 104 ms (s.d.
    across mice 21 to 36 ms), and 5% to 50% of each trial's peak excursion gives 82 to 177 ms.
- kind: methods_unavailable
  statement: Question for the paper's authors. How were antidromic spikes told from spontaneous
    spikes when measuring latency and jitter, and were spikes locked to the pulse over several
    milliseconds counted? Taking spikes within 1 ms of each neuron's modal latency gives PT 2.7 ms
    and 0.13 ms and IT 4.6 to 5.0 ms and 0.27 to 0.31 ms, and per-neuron fits of a narrow peak
    plus background give IT 0.28 to 0.34 ms; only a 0.5 ms window gives the paper's IT jitter of
    0.2 ms (0.18 to 0.20 ms).
- kind: methods_unavailable
  statement: Question for the paper's authors. Do the PT and IT bootstraps of Fig. 3f, j use all
    tagged neurons or only the selective ones, and which neurons and window give the P = 0.13 for
    all task-selective neurons in the late contralateral selectivity? With selective neurons PT
    is significant (P = 0.033) and IT gives P = 0.74 as printed; with all tagged neurons PT gives
    P = 0.089. Over the 570 ms before the cue all 912 selective neurons give 9.2% modulation with
