- claim: task-performance
  outcome: reproduced
  notebook: reproduce_li_2015.ipynb
  output: claim:task-performance
  measured: 76.84
  notes: Control trials, mean over sessions (reading a), 76.84% correct and 10.88% lick early
    trials; over mice 76.37% and 14.06%; pooled 77.28% and 12.59%. With all trials 75.81% to
    76.58% correct. Every reading puts the per cent correct within 78.4 +/- 7.84; the lick early
    fraction is below 14.3% under every reading but the mean over mice with all trials (14.71%).
    Per mouse 60.4% to 87.0% correct.
  deviations:
  - Measured on the 19 electrophysiology mice in the data set; the paper's figure is over 42
    mice, and the behaviour-only mice are not deposited.
  - No-lick trials are left out of the denominator, as the data set's Demo_get_performance.m
    does; the Methods say only that lick early trials are excluded.
- claim: unit-counts
  outcome: partially_reproduced
  notebook: reproduce_li_2015.ipynb
  output: claim:unit-counts
  measured:
  - 1408
  - 1245
  - 158
  - 5
  notes: 1,408 units, 19 mice, 99 sessions. The trough-to-peak widths of the deposited mean
    waveforms (the criterion's measure) give 1,245 units above 0.45 ms, 158 below 0.35 ms and 5
    in between, so the FS and intermediate counts are outside tolerance; 34 of the 39 units
    without a label have widths below 0.35 ms. A spline-interpolated variant gives 1,241, 158
