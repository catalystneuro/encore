  - claim: fig4c-photoidentification
    agrees: true
    outcome: blocked
    reason: No file gives the projection (NAc or CeA) per mouse, so the per-projection counts of 39 and
      32 cannot be checked; genotype is "Wild type" for every subject and there is no group or projection
      field in the asset metadata. The total of 71 could have been compared. Problem 1, the fake-session
      test was never applied; the light events split into two blocks, the Methods put the fake session
      first, so in H01 to H29 the fake block can be identified, and in H31 to H42 both orders could be
      run as readings. The pulses of both blocks were pooled, which also halves any real response, so
      the 1355 tagged units are not a valid result of the Methods' rule.
    response: Applied the fake-session test with block 1 as the fake one, block 2 as the fake one, and
      either order in H31 to H42, for both pulse readings and with and without the 0.3 Hz exclusion. The
      total tagged count is 91 to 256 under every reading (146 and 133 with the Methods' order), above
      the 78.1 that both projection counts within 10% would allow, so the outcome is changed to not_reproduced
      whatever the projections. Added a cell listing every text field, units and electrodes column, and
      the archive subject metadata, which hold no group or projection label.
