- claim: fig4c-photoidentification
  outcome: not_reproduced
  notebook: reproduce_li_2022.ipynb
  output: claim:fig4c-photoidentification
  measured: 146
  notes: No file gives the projection of each mouse, so the BLA-NAc and BLA-CeA counts cannot be
    split, but both are within 10% of 39 and 32 only if their total is within 63.9 to 78.1. With the
    Methods' rule and the fake-session test, block 1 taken as the fake session as the Methods order
    them, the total is 146 under reading (a) (all 5 and 10 ms pulses and the onsets of the 100 ms
    light events) and 133 under reading (b) (isolated 1 Hz pulses). With block 2 as the fake one it
    is 256 and 233; letting H31 to H42, where one block precedes the task, take either order gives
    at least 104 and 102; with a baseline rate of at least 0.3 Hz the lowest is 91. Every reading is
    above 78.1, so the counts cannot both match whatever the projections. But the fake-session
    test does not work as the Methods describe it. Without it, block 1 evokes a short-latency
    response in 1353 of 1902 units and block 2 in 1243 (reading a; 1474 and 1374 under reading b),
    and 88% of the units responsive to block 2 also respond to block 1. A session with the patch
    cord disconnected should evoke none, so either neither block is that fake session or the
    responses are light artefacts on units that are not sorted single units (finding). The 91 to
    256 tagged units are then units that cross the threshold in one block and not the other, and
    their count does not test the claim. The outcome is kept as reviewed in round 2, and blocked
    (metadata_insufficient) is proposed (see proposed).
  proposed:
    outcome: blocked
    blocked_by: metadata_insufficient
    reason: The rule needs a fake session that evokes no light response, and neither block is one.
      Block 1, the fake one in the Methods' order, evokes a short-latency response in 1353 of 1902
      units, block 2 in 1243, and 88% of block-2 responders also respond to block 1 (notebook,
      claim:fig4c-photoidentification). The files do not label the fake and real blocks, nor the
      projection of each mouse, so the count the rule gives (91 to 256 over every reading) measures
      differences between two similar blocks and does not test the claim, as the round-2 verifier
      says. Every block order was run, so no other choice of the fake block is left to try.
  deviations:
  - Which light block is the fake session is not labelled. Block 1 is taken as the fake one (Methods,
    In vivo electrophysiology, "a phototagging session was conducted after a 'fake' phototagging
    session"); the reverse, and either order in H31 to H42, are run as readings and agree.
  - The files hold light events of 5, 10 and 100 ms and none of 1 s; the 100 ms events stand in for
    the long light in reading (a). Reading (b) does not use them and gives the same outcome.
  - The count is compared as a total, since the projection labels are missing.
