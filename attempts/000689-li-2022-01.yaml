  - claim: fig3k-nt-sensor-sucrose-increase
    agrees: true
    outcome: not_reproduced
    reason: The US comparison is p >= 0.05 in all 8 readings (cell 22, "0 of 8"). With the per-trial z-score
      the direction matches (late minus early AUC +3.0, 4 of 5 mice up, p = 0.08). With the session z-score
      the effect is about zero. The criterion needs p < 0.05 under every reading. Problem 4, the regression
      coefficients are never printed, and on synthetic data with a nearly flat averaged baseline the fit
      returned a slope of -0.07 where the true slope was 2. Problem 5, the session z-score is a reading
      the claims file does not list.
    response: Printed the slope, intercept and correlation of every session. They showed that Mouse6 late
      sucrose had a slope of -0.02 and a correlation of -0.30, and the cause is that the LED labels move
      by one frame after a 2.3 ms interval while the data keep their order, so the 470 nm channel was
      read from the constant third frame type. Channels are now taken from the frame order (helper and
      data check). With that corrected the per-trial all-trials readings give AUC +3.53, t(4) = 5.74,
      p = 0.0046, 5 of 5 mice up; the first-16 readings give p = 0.093. Outcome changed to partially_reproduced,
      with the per-trial z-score adopted as an assumption and the session one kept as a shown variant.
      Added a regression fitted on the pooled baseline bins of every trial as a variant (p >= 0.44). Fixed
      the text that had the regression direction reversed.
  - claim: fig3l-nt-sensor-airpuff-decrease
    agrees: true
    outcome: not_reproduced
    reason: 0 of 8 readings have p < 0.05 (cell 25). With the per-trial z-score the direction matches
      (AUC -5.5 and -4.7, p = 0.07 to 0.09). With the session z-score, first 16 trials, it is near zero
      (p = 0.76). Cell 24 gives the paper's airpuff US effect as -3.52; the paper's statistics say -3.657.
      Cell 16 says cues are "at least 29 s apart", but the M-0 airpuff early session has a 4.7 s gap,
      which may be a spurious cue.
    response: Outcome kept; the airpuff sessions are not affected by the channel correction and the numbers
      are unchanged. Corrected the paper's effect to -3.657 and the cue spacing text, which now describes
      the last three cues of the M-0 early airpuff session (4.7 and 7.4 s apart, one a 4.7 s bout) and
      notes that the first-16 readings do not reach them. Added the pooled-fit variant (p >= 0.23).
  - claim: fig3-nt-sensor-early-dip
    agrees: true
    outcome: not_reproduced
    reason: 0 of 8 readings have both early US means below zero (cell 27). Sucrose is negative in the
      per-trial z-score readings, but airpuff is positive there (+0.11 to +0.19). It reports as a possible
      misreading of the claims file that a "transient" decrease is judged by the mean over 2 to 7 s, where
      a brief dip could be averaged away; the plotted early-airpuff trace reaches -0.63 even though the
      window mean is positive.
    response: Outcome kept, judged on the criterion as written. Added the lowest point of the early trace
      in 2 to 7 s as a variant (sucrose -1.09, airpuff -0.63, per-trial z-score, first 16 trials) and
      asked a reader whether the window mean tests a transient decrease (questions/000689.yaml).
