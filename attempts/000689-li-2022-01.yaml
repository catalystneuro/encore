      3, clusters are dominated by single sessions (cluster 2 is all 38 units of H27). Problem 8, the
      CS-onset alignment check fails or is ambiguous in H17, H22, H27, H34 and H39, and four of these
      are used in the clustering. It could not check the window MATLAB smoothdata chooses for SmoothingFactor
      0.85.
    response: Outcome kept. Added the largest share of one mouse in each cluster (at 220 ms one cluster
      is 93% H27) and the cluster counts without H22, H27, H34 and H39 (seven under (a) at 420 ms and
      under (b) at 1020 ms and 2 s), which keep the count window-dependent. MATLAB is not available in
      the locked environment, so the window smoothdata chooses could not be printed; it stays a question
