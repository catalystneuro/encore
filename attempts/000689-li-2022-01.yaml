  - claim: fig5dh-behavior-clusters
    agrees: true
    outcome: blocked
    reason: The pose has no timestamps, and the best pose-to-trial lag drifts within sessions (cell 13).
      It accepts the block only provisionally. Only fixed lags were scanned; a linear clock fit (offset
      plus frame rate) to the port entries was not tried, yet the lag drift looks like a constant frame-rate
      error that such a fit would remove. Many sessions have dist_ratio near 0.9 to 1.0. The video files'
      own frame counts and durations were not checked. Calling the pose "cannot be aligned" goes further
      than the evidence shows.
    response: Fitted a linear clock (offset and rate factor) to the port entries in every session (nb.fit_pose_clock).
      It holds in 21 of 29 sessions, 20 of them with a factor between 0.9874 and 0.9885, and leaves no
      lag above 1 s in any third. Printed the frame count, rate and duration of every video from its container
      header. Ran the claim on the 21 aligned sessions (tsfresh, PCA, t-SNE, density peaks, 5 seeds, both
      feature scalings and both t-SNE default sets). Outcome changed to partially_reproduced under the
      reading adopted (sucrose 7 clusters in 3 of 5 seeds, shock 5 in 1 of 5); the literal reading gives
      7 and 5 for all seeds.
