findings:
- kind: metadata_insufficient
  statement: No file says which recorded mouse is in the CRISPR group and which in the control
    group, nor whether its Cav2-Cre was injected in the NAc or the CeA; every subject's genotype is
    "Wild type". The paper's electrophysiology findings compare the groups and the tagged
    projectors, so 13 of its claims cannot be tested, and the phototagging count can be checked
    only as a total. Neither the units table (spike times and a unit name), the electrodes table
    (location "unknown"), any other text field of the files, nor the archive's subject metadata
    (age, sex, species, genotype) holds such a label.
- kind: format_error
  statement: The units are not sorted single units, as the Methods describe (Offline Sorter). 21 of
    31 sessions hold exactly 64 units on 32 channels, 1902 units in all against the paper's 685;
    in 1061 units more than 5% of inter-spike intervals are below 1 ms, and in each session 6 to
    65% of spike samples recur in another unit. Both light blocks evoke a short-latency response in
    most of them (1353 and 1243 of 1902), so the light rule of the Methods with the fake-session test
    (91 to 256 tagged units, against 71 tagged neurons in the paper) cannot single out tagged
    neurons.
- kind: format_error
  statement: In H17 the spike times of all 64 units fall within the first 249 s of a 12118 s
    recording, while its trial events cover the whole session, so its spikes cannot be aligned
    with its trials.
- kind: metadata_insufficient
  statement: The DeepLabCut pose has no timestamps, only a start time of 0 s and a nominal rate of
    15 frames per second, and the mp4 videos give a constant 15 frames per second. Against the trial
    clock, port entries match the head's approach to the port at lags a median of 80 s and up to
    192 s from zero that drift within 28 of 29 sessions. A linear map fitted to the port entries
    removes the drift in 21 sessions, with a rate factor of about 0.988 in 20 of them, as if the
    true frame rate were about 1.2% below 15; in 8 sessions no such map holds (lags of 2.8 to 19.2 s
    are left in some third). The videos of H07, H09 and H10 run 818 to 1528 s longer than their pose
    series, and that of H11 426 s longer; the others are within 10 s. Video timestamps, or the frame
    times of the original .asf files, would settle the alignment.
- kind: metadata_insufficient
  statement: 27 of the 31 ecephys files (all but H01, H02, H07 and H08) hold a stack of 8 to 42
    confocal images (COFAImages) whose description names an Olympus FLUOVIEW file of the PVT. The
    images are named only by depth, with no channel, probe, stain or group label, so what they show
    cannot be read from the files.
- kind: metadata_insufficient
  statement: Each session holds about 854 light events in two blocks of about 427, which fits the
    paper's "fake" phototagging session and the real one, but no label says which is which. In 12
    sessions (H31 to H42) one block comes before the task, where the Methods put both after it. The
    two blocks evoke much the same short-latency responses (1353 and 1243 of 1902 units respond to
    the first and the second, and 88% of the units responsive to the second block also respond to
    the first), so neither behaves like a session with the patch cord disconnected. The files hold light events of 5, 10 and 100 ms and
    none of the 1 s light the Methods describe.
- kind: metadata_error
  statement: Six sessions (H09 to H14) hold 75 sucrose and 45 shock CSs and no neutral CS, while
    their session description says sucrose, shock and neutral CSs at 2 to 1 to 1.
- kind: other
  statement: The dandiset has recordings from 31 mice where the paper reports 30. For H28 and H32
    the recorded session (Disc3, Disc5) is earlier than another discrimination day for which only
    pose is deposited (Disc4, Disc6), while the paper analyses only the last day.
- kind: metadata_insufficient
  statement: The photometry files store one RoiResponseSeries at 60 Hz that interleaves the 415 nm
    frames, the 470 nm frames and a third, undescribed frame type; the channels can be told apart
    only from the LED event labels, and in one session (Mouse6, late sucrose) the labels move by one
    frame after a 2.3 ms frame interval while the data keep their order, so after it they mark the
    constant third frame type as 470 nm. In Mouse1's early airpuff session the last three cues come
    4.7 and 7.4 s apart, one lasting 4.7 s. The cue events last 2 s where the Methods give a 4 s CS, and no
    event marks the US or says whether a cue was paired. In two airpuff sessions the lick label is
    on for most of the session.
- kind: data_missing
  statement: Only the in vivo recordings of Figures 4 and 5 and the NT sensor photometry of Figure
    3j-l are deposited. The behavior cohorts of Figures 1 and 2 and Extended Data Figure 10, the
    axon-terminal and somatic photometry with its head-fixed behavior (Figure 3b-f, Extended Data
    Figure 6), the anatomy and in situ data, the slice physiology and the sensor validation are not,
    so 19 of the paper's 39 findings in the claims file cannot be tested.
- kind: methods_unavailable
  statement: Question for the paper's authors. The functional clustering smooths each PSTH with
    MATLAB smoothdata and a smoothing factor of 0.85 (Methods, Functional hierarchical clustering).
    What window did that produce, and was the smoothing applied to each CS trace or to the
    concatenated trace? On the dandiset's units the number of clusters under the paper's cut-off
    ranges from 6 to 12 over windows of 20 ms to 2 s, not monotonically (9 at 20 ms, 12 at 60 ms,
    6 at 620 ms, 8 at 2 s), with seven only at 820 ms.
- kind: methods_unavailable
  statement: Question for the paper's authors. The NT sensor residuals were "z-transformed using
    data a baseline window of -5 s to 0 s" (Methods, Fiber photometry, Data analysis). Was each
    trial z-scored against its own baseline, or against the session's baseline pooled over trials?
    The sucrose effect of Figure 3k reaches p = 0.0046 with each trial's baseline and all trials,
    and p >= 0.16 with the pooled baseline.
- kind: methods_unavailable
  statement: Question for the paper's authors. For the behavior clustering (Methods, Unsupervised
    trial-based classification of behaviors), were the tsfresh features scaled before PCA, and which
    scikit-learn release and t-SNE settings (perplexity, initialisation, learning rate) were used?
    On the dandiset's pose the sucrose and shock cluster counts range from 5 to 8 and 3 to 7 across
    these choices, the PCA solver and the seeds, and no reading gives 7 and 5 together. On unscaled
    features 10 features carry all the variance, and the counts change with the PCA solver and with
    changes of 1e-9 in the features, and between two runs of the same code on different runners.
