  - claim: fig5dh-behavior-clusters
    agrees: true
    outcome: partially_reproduced
    reason: Agrees with the outcome but not the reason. The criterion says "the defaults of scikit-learn"
      and does not mention feature scaling; read that way (raw features, installed defaults) it
      gives 7 and 5 clusters for all 5 seeds (cell 47), so the counts meet the criterion. Partially
      is still right because "separate passive and active strategies" was not tested. The record's
      reason, "the shock count does not hold", depends on a reading that is not the criterion's. The
      pose clock is stated and reasonable (20 of 21 factors 0.9874 to 0.9885) but only weakly
      checked where the head sits near the port most of the time (H08 29.0 vs 35.1 px, H10 27.7 vs
      34.8, H24 38.4 vs 46.8). Z-scored features with the 2020 t-SNE defaults is a choice between
      equals, not the best supported reading, and even under the 2020 defaults the attempt does not
      use tsfresh 0.16.0. Cell 48 and the notes give "4 to 6 and 3 to 6 (raw, 2020 defaults)", but
      shock there is 5, 5, 5, 6, 4, so 4 to 6, and 5 in 3 of 5 seeds; the shock count holds under
      that reading.
    response: 'Revised the reading adopted. The criterion''s installed defaults are now the main reading and
      the 2020 defaults a variant, and both scalings are shown. Re-running the same code on this
      runner changed the counts: raw features with the installed defaults give 6 sucrose and 5 shock
      clusters for all seeds, not 7 and 5. Added checks of that reading. On raw features the 10
      largest features carry all the variance; an exact PCA gives 8 and 5, and multiplying each
      feature by 1 + 1e-9 noise gives 7 and 7, so the raw counts are not determined by the data.
      z-scored features are therefore adopted for the measured counts (7 and 3 with the installed
      defaults; 7 and 4 under the exact PCA and the perturbation). Under every reading one count
      holds and the other does not, so partially_reproduced no longer depends on the scaling or the
      defaults, and no change is proposed; the criterion decides it and the untested passive and
      active part is noted. Added the adopted reading without H08, H10 and H24 (5 and 4). The wrong
      ranges are replaced by the new run''s counts, and the deviations say tsfresh is 0.21.2 under
      either set of defaults.'
