    reason: Seven clusters appear only with reading (a) at a 41-bin smoothing window. The other 12 windows
      give 6 to 12 clusters, and reading (b) never gives 7 (cell 31). The window that "smoothing factor
      0.85" implies cannot be recovered from the paper, and the count also moves with the cut fraction
