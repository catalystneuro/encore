findings:
- kind: data_missing
  statement: The dandiset holds 2 of the paper's 9 analysed wild type rats (14 or 15 of its 15
    Grin2b+/-), so genotype comparisons rest on two WT, one of which has no SWDs. The
    pharmacology and intrathalamic infusion recordings (Figures 6, 7, S11, S12), western blots
    (Figures 1, S2, S3), development measures (Figure S4) and the visual scoring used to validate
    the scorer (Table S1) are not in it. The paper says raw data are available on request.
- kind: metadata_insufficient
  statement: GRIN2B-132 has no genotype and sex U, so it cannot be placed in either group. The
    conversion repository marks both as still to be confirmed by the lab.
- kind: selection_undocumented
  statement: The paper analysed 15 Grin2b+/- and 9 WT rats and excluded 4 and 9 descendants of one
    founder. The dandiset does not say which of its rats the paper analysed, and holds a Grin2b+/-
    rat (GRIN2B-228) with 1 SWD per day, unlike the paper's statement that all Grin2b+/- rats had
    SWDs at wake-NREM transitions.
- kind: metadata_error
  statement: The sleep_states description gives code 4 for SWD epochs, but no file holds code 4;
    the stored scores are the scorer's output before SWD epochs are set, so SWD epochs are scored
    as wake, NREM or REM.
- kind: metadata_error
  statement: swd_epoch_counts is described as the number of SWD events per 5-s epoch but holds the
    scorer's flags (6 for an SWD epoch, 4 otherwise). The flagged epochs cover a median of 51% (0
    to 73%) of the epochs SWD events overlap, mostly the last epoch of each SWD, and only about a
    tenth of SWD onsets fall in a flagged epoch.
- kind: metadata_error
  statement: In seizure_totals_by_zt the per-hour SWD counts are in spike_wave_discharge, while
    number_of_seizure_events and Day hold the day's total in the first row and 0 elsewhere; the
    description itself marks the columns as unconfirmed.
- kind: metadata_error
  statement: sleep_state_power_spectra is described as a baseline-corrected PSD normalized to the
    average over states, with units to be confirmed. The lab's scorer writes the mean log10
    multitaper amplitude referenced to each frequency's 5th percentile over the day, which is what
    the values (0 to about 1.6) fit; the paper's Welch spectra are not in the dandiset.
- kind: format_error
  statement: The raw EEG and EMG are stored as unsigned 12-bit codes with offset 0, so every channel
    reads about +8 mV of DC in volts. Signal loss is written as 32767 on all channels at once, and
    some files hold other values outside 0 to 4095; neither is described. In the windows read, 21
    to 73% of 5-s epochs per rat contain such samples (73% for GRIN2B-238).
- kind: metadata_error
  statement: The dandiset's assets summary counts 16 files and 16 subjects, while the draft holds 17
    NWB files of 17 rats.
- kind: code_mismatch
  statement: The Methods exclude SWD times from the sleep states, while the lab's scorer replaces
    only the flagged epochs, which cover about half of the epochs SWD events overlap. The paper's
    wake results depend on this; with the stored scores (SWD epochs as wake) the wake bout
    differences reverse and the correlation of SWD time with wake time disappears.
- kind: paper_inconsistency
  statement: In the Figure 5 legend, NREM time gives T = -1.47 with R = -0.13 and df = 13, which
    implies T = -0.47; REM bouts give T = 0.704 with R = -0.19, of opposite sign; and REM bout
    duration and wake bouts have identical statistics (T = 0.61, R = 0.17, p = 0.55). The Figure 5A
    ANOVA gives genotype F = 1 with p = 0.98, which do not match for df = 1.
- kind: paper_inconsistency
  statement: The Figure 3 legend says no net differences between genotypes were observed for wake,
    while reporting a genotype effect on hourly wake time of F = 7.14, p = 0.014, and the Results
    say Grin2b+/- rats spent less time awake.
- kind: methods_unavailable
  statement: The paper does not give its frequency band limits, Welch segment length, bout
    definition or the rule for wake-NREM transitions, and neither linked repository holds the
    statistics or figure code.
