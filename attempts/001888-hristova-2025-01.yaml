    agrees: true
    outcome: reproduced
    reason: W = 1, p = .047 (normal approximation because two Het tie at 816), Het higher.
    response: Added the runs without GRIN2B-228 (p = 0.034) and GRIN2B-238 (one WT, p = 0.20).
      Outcome kept.
