- claim: ma-statistics
  outcome: partially_reproduced
  notebook: reproduce_watson_2016.ipynb
  output: claim:ma-statistics
  notes: 434 MA intervals lie inside SLEEP (2130 in the files). Median duration 11.0 s over all MAs (11.5 s
    over session medians), per-session median incidence 0.184 per minute, per-session median 3.70% of SLEEP,
    against 790, 15.9 s, 0.32 and 9.1%; none within tolerance. The MA fraction falls over normalized episodes
    (20 bins, bin means R = -0.956, p = 4.5e-11; 10 bins R = -0.970, p = 3.3e-06), and over SLEEP the bin means
    are not significant (p = 0.15, 0.098; pooled period-bins p = 0.0057, 0.00061). The criterion names no partial
    outcome; partial is given because the trends hold and the four values do not. The 345 WakeInterruptions
    shorter than 40 s are not MAs by the paper's definition, since none lies between two packets (123 between
    two REM intervals, 80 between REM and a packet). Variant, MA reading (b), counting them as MAs, 779 events,
    0.318 per minute (within tolerance), median 13.0 s, 7.85% of SLEEP, episodes R = -0.960 (p = 1.9e-11),
    SLEEP p = 0.93. With the Dino ACC sessions left out, episodes R = -0.949 (p = 1.7e-10), SLEEP p = 0.089.
  measured:
  - 434
  - 11.0
  - 0.184
  - 3.7
  deviations:
  - The episode correlation uses the MA fraction in 10 or 20 normalized bins, both as bin means over episodes
    and as pooled episode-bins, as the criterion allows; episodes include MA and packet seconds.
