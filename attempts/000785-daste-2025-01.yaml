  outcome: not_reproduced
  notebook: reproduce_daste_2025_passive.ipynb
  output: claim:fig2d-population-sparseness
  notes: 'All three pairs differ, not only OB-p against untagged: OB-p against mPFC-p corrected p = 8.7e-06
