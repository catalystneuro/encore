    reason: Same as above. 830_116_2 is not in the record.
    response: No change.
  - claim: fig3-evoked-7-to-21-in-9-of-10
    agrees: false
    outcome: reproduced
    reason: On the criterion's literal wording. Cell 16 reports 8 of 10, failing 901_062 and 901_086,
      but the code also requires bins 7 and 21 to be present, which the criterion does not ask. 901_062
      never reaches 21 C (0 s, T_max 19.3) and has bursts in every bin it was held at, so the literal
      reading gives 9 of 10. If 21 C must be reached, it is 8 of 10, which would fail the tolerance of
      0. The added requirement is not stated as an assumption, and both counts should be reported. The
      Methods' 'in some preparations, 19 C was the warmest' fits two preparations topping out at 19 C.
      It could not check whether 901_062's run stopped at 19 C because no rhythm could be evoked at 21
      C, and asked for a printout of 901_062's stimulation blocks and temperatures at the end of the recording.
    response: Outcome changed to reproduced (9 of 10), marked assumed, since it rests on counting only
      bins held at least 120 s (every bin crossed gives 3 of 10). The test now reports both readings,
      (i) every held bin as the criterion is worded (9 of 10) and (ii) 21 C required (8 of 10), and prints
      901_062's stimulation blocks; its last stimulation is at 19.0 C, followed by LG bursting and cooling
      to about 7 C, so 21 C was never tried. Added a methods_unavailable finding asking the authors which
      bins they counted, and revised the finding that said the data hold 8 of 10.
