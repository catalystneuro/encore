- claim: fig3-evoked-7-to-21-in-9-of-10
  outcome: not_reproduced
  notebook: reproduce_powell_2021.ipynb
  output: claim:fig3-evoked-7-to-21-in-9-of-10
  measured:
  - 8
  - 10
  notes: Under reading (a) (at least one LG burst period in a bin), 8 of 10 preparations have an LG
    rhythm at every held bin from 7 to 21 C, under both burst rules; under reading (b) (at least 30
    significands) 2 of 10. 901_062 never reaches 21 C (warmest LG burst start 19.1 C). 901_086 spent
    330 s in the 21 C bin, with 70 s of stimulation there, and has no LG spike in it; its warmest LG
    burst start is at 19.1 C. All ten preparations are in the record (10 of 10 evoked). Counting
    every bin the temperature passed through gives 3 (reading a) and 1 (reading b) of 10.
  deviations:
  - The claims file leaves open which bins a preparation "was held at". A bin counts as held when the
    recording spends at least 120 s in it, the 2-minute minimum step of the Methods ("a given
    temperature step was held for at least 2 minutes") and the code's (BurstPeriodsVsTime.m, "temperature
    held for less than 2 minutes"); every bin with any time in it is shown as well, and gives fewer
    preparations, so the outcome does not depend on the choice.
- claim: fig3s1-spontaneous-and-evoked-similar
  outcome: blocked
  blocked_by: data_missing
  notes: The four preparations of fig_within_prep_spont_evoked_comparison.m are 941_006, 901_086,
    901_080 and 901_062. The record holds 941_006 only as raw ABF files (941_006.zip), without spike
    annotations, and its spontaneous and evoked LG spikes would have to be sorted anew with the
