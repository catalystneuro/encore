- claim: fig2-spontaneous-11-to-30
  outcome: blocked
  blocked_by: data_missing
  notes: The nine preparations with spontaneous rhythms (crabs of July 2013, recordings of Haddad and
    Marder 2018) are not in the record. Its only spike annotations, evoked_data.mat, are the ten evoked
    preparations of getEvokedData.m, and its zips hold raw files of nine of those ten and of 941_003 and
    941_006, recorded in June 2019. The paper's data statement names only this record. A search of Zenodo
    (queries on Haddad, Marder, Powell, stomatogastric, temperature) and DANDI (stomatogastric) found
    no deposit of them; Zenodo record 5139650 (Haddad and Marder) holds six ABF files of notebooks 845
    and 857 recorded in the decentralized condition, with no spike annotations and not the example preparation
    830_116.
