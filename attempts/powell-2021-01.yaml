- claim: fig4c-q10-about-2
  outcome: not_reproduced
  notebook: reproduce_powell_2021.ipynb
  output: claim:fig4c-q10-about-2
  measured: 1
  notes: Under the Methods' Q10 over every bin, 1 of 10 preparations has both Q10s within 1.8 to 2.2 and
    2 of 10 within 1.5 to 2.5; over the held steps only, 1 and 3 of 10. Per-preparation LG Q10s reach
    16.6 and 39.0 when every bin is used, from bins at 9 and 13 C crossed during ramps (per-bin LG Q10s
    up to 98.7 and 180.8). The code's per-burst Q10 (variant) gives 3 of 10 within 1.8 to 2.2 and 8 of
    10 within 1.5 to 2.5 (Methods burst rule; 1 and 8 with the code's), so the paper's count matches the
    code's computation under the wider reading of "~2". With T and T_11 the mean measured temperatures
    of the bursts in each bin in place of the bin centres (the verifier's point), the counts are the same
    (1 and 2 of 10 over every bin, 1 and 3 over the held steps), and the pass-through bins give still
    larger LG Q10s (up to 705 in 901_052), as they were crossed near 10 C. Whether the code's Q10, which
    the paper's own t-test matches exactly, should be the main analysis is asked of a reader (questions/powell-2021.yaml).
  deviations:
  - The claims file does not say which temperatures enter the Methods' Q10. Two readings were run, every
    bin with bursts and only the bins held at least 120 s (the temperature steps of the Methods, "Spontaneous
    and evoked gastric mill rhythm temperature ranges"); both give the same outcome. T is the bin centre,
    f_T the mean of 1/period over bursts starting in the bin.
  - PD periods above 5 s and LG periods above 50 s are removed before the Q10, as fig_burst_period.m does
    (the outlier filter the claims file cites for fig4b-periods-decrease-all-preps).
