findings:
- kind: data_missing
  about: data
  severity: major
  statement: The record holds spike annotations and raw data only for the evoked preparations. The nine
    preparations with spontaneous gastric mill rhythms (Figure 2 and its supplement) and the nine with
    the pyloric pacemaker hyperpolarized (Figure 4, figure supplement 2) are not in it, although the paper's
    data statement names only this record for its raw data and spike annotations. Four of the paper's
    findings cannot be tested.
- kind: data_missing
  about: data
  severity: major
  statement: 941_003.zip and 941_006.zip hold raw ABF recordings of two preparations recorded on 11 and
    12 June 2019 (ABF header dates), with no spike annotations and no description. Neither is among the
    ten evoked preparations of evoked_data.mat, and they belong to none of the three sets the Methods
    describe (2013, 2017, 2020). 941_006 is one of the four preparations of Figure 3, figure supplement
    1, so that claim can be tested only on the other three.
- kind: data_missing
  about: data
  severity: minor
  statement: There is no zip of raw recordings for 901_005, one of the ten evoked preparations; its spike
    times, temperature and mask are in evoked_data.mat.
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: The record has no README and its description is the paper's abstract. The fields of evoked_data.mat
    are not described; the mask (0 in runs of about 7 s, stimulation by the paper's code) and the 1 kHz
    sampling of temperature and mask are evident only from the values and the code. The preparation and
    file names are MATLAB categorical objects, readable outside MATLAB only by decoding the file's MCOS
    subsystem, and the fields T and time_offset are empty in every preparation. Zenodo types the record
    as a journal article, not a dataset.
- kind: other
  about: data
  severity: minor
  statement: 932_151, one of the ten evoked preparations, was recorded on 2 May 2019 by the header of
    932_151_0000.abf, while the Methods say the evoked preparations came from crabs caught in 2017. 901_046
    and 901_098 carry 2017 dates as described.
- kind: other
  about: data
  severity: minor
  statement: Seven zips hold raw recordings as crabsort .crab files and four as ABF files. The .crab zip
    of 901_062 holds 101 files, while evoked_data.mat stacks 58 files of that preparation; the other zips
    hold as many files as are stacked.
- kind: other
  about: data
  severity: none
  statement: In the data, 9 of the 10 evoked preparations have an LG rhythm at every temperature step
    from 7 to 21 C at which they were held, as the paper says, when 901_062, whose last step was 19 C,
    is counted; 901_086 was held and stimulated at 21 C for 330 s with no LG spike. The record does not
    say why 901_062 stopped at 19 C.
- kind: other
  about: data
  severity: none
  statement: evoked_data.mat matches the paper's analysis. Its ten preparations are those of getEvokedData.m,
    no recording is deposited twice, the stimulation mask and LG spikes and the temperature and PD spikes
    share their clocks, and with the code's burst rule and computations the paper's reported numbers are
    obtained exactly (Q10 paired t-test t = 1.27, p = 0.235; 3799 cycles and Spearman p = 0.88 in Figure
    5f; LG phase trend rho = -0.31, p = 0.46; 3816 LG burst starts).
- kind: code_mismatch
  statement: The Methods keep bursts of at least n spikes (5 for LG and DG, 2 for PD), but the paper's
    burst detection, crabsort.computePeriods, compares n with the number of inter-spike intervals in a
    burst, keeping bursts of at least n + 1 spikes. The paper's reported numbers follow the code's rule
    (for example 3799 cycles in Figure 5f, against 3850 under the Methods' rule, and 3228 DG burst starts,
    which the Methods' rule exceeds by more than 10%).
- kind: code_mismatch
  statement: The Methods test the first 40 LG and DG burst starts of each preparation and temperature
    for non-uniformity, but the reported ranges (LG p < 4e-4, 7.5 < z < 45; DG z up to 13) are those of
    the first 50, the sample of the later code (marderlab/gastric commit 7a82b1f). The archived commit
    the paper cites (fa07d36) pools all starts of a temperature over preparations, which gives z of 67
    to 577. With 40 starts z cannot exceed 40.
- kind: code_mismatch
  statement: The Methods compute the Q10 from the mean burst frequency at each temperature against 11
    C, but fig_burst_period.m computes a Q10 for every burst at its own temperature, against the bursts
    within 0.1 C of 11 C, removes Q10s above 10 and averages per preparation. The reported count of 8
    of 10 preparations near 2 and the paired t-test (t = 1.27, p = 0.235) follow the code; the Methods'
    formula gives 1 to 3 of 10 and LG Q10s up to 39 from temperatures crossed during ramps.
- kind: paper_inconsistency
  statement: Figure 3, figure supplement 1 says that 4 of the 10 evoked preparations had spontaneous rhythms,
    but one of the four preparations its script uses (941_006) is not among the ten evoked preparations
    and was recorded in June 2019, not 2017. In evoked_data.mat, 3 of the 10 evoked preparations (901_062,
    901_080, 901_086) have LG bursting before their first stimulation at 11 C, which with 941_006 makes
    the four of the script.
- kind: methods_unavailable
  statement: The paper says rhythms were evoked 'across a temperature range of 7 to 21 C in 9 of 10 preparations',
    with steps of 2 or 4 C 'until a gastric mill rhythm could no longer be evoked'. It does not say whether
    a preparation whose warmest step was 19 C (901_062, never brought to 21 C) counts among the nine,
    nor whether temperatures crossed only between steps (9, 13 and 17 C for most preparations) count.
    The attempt assumed that only bins held at least 2 minutes count and that a preparation passes with
    a rhythm at every step it had, which gives the paper's 9; requiring 21 C gives 8, and counting every
    bin crossed gives 3. Which did the authors count?
verifications:
- date: '2026-11-25'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: The first executed notebook with the conclusion cells and the summary removed, the helper
    module and the claims file, with the paper's full text (PMC7889077). The verifier checked the Zenodo
    record's file list and the preview of 941_006.zip, and tested the helpers on synthetic inputs (bursts,
    rayleigh, ks_2samp_asymp, measure_phase, integer_coupling, integerness, q10_methods, q10_code). It
    had no attempt record and took the claims from the claims file.
  results:
  - claim: fig2-spontaneous-11-to-30
    agrees: true
    outcome: blocked
    reason: The spontaneous set (Haddad and Marder 2018) is not in the record. Its 12 files are evoked_data.mat,
      the evoked-prep zips, and 941_003/941_006 (June 2019).
    response: No change.
  - claim: fig2a-less-regular-at-high-temperature
