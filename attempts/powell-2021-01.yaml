- claim: fig5d-lg-pd-integer-coupled
  outcome: reproduced
  notebook: reproduce_powell_2021.ipynb
  output: claim:fig5d-lg-pd-integer-coupled
  notes: With the code's shuffle (100 draws, reading a) every bin from 7 to 21 C has median p below 0.05/9
    (1.5e-8 to 4.9e-4) and median D above 0.216 (0.223 at 21 C to 0.351), Methods burst rule. D at 21
    C under the five seeds is 0.2233, 0.2239, 0.2207, 0.2221 and 0.2214, all above the bound, so the outcome
    does not depend on the seed. The reported p < 1e-5 is not met at 17 and 21 C with the code's draws
    (median p 2.6e-5 and 4.9e-4). With the permutation shuffle (reading b) every bin from 7 to 21 C has
    p below 1e-5 but D at 21 C is 0.199. 23 C is not significant (D 0.162, p 0.31). The code's burst rule
    gives the same results within 0.01 in D. The criterion's reproduced clause (p < 0.05/9, D > 0.216)
    is applied; whether the reported p < 1e-5 should decide instead, under which no reading meets both
    bounds, is asked of a reader (questions/powell-2021.yaml).
  deviations:
  - The paper used one shuffle draw per temperature; here the median D and p over 1000 draws are reported,
