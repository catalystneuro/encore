    outcome: blocked
    reason: Partly testable. 941_006.zip holds only raw ABF files and crabsort classifier files (network/dgn,
      lgn, lvn, pdn), with no spike times. The other three preparations (901_062, 901_080, 901_086) are
      in evoked_data.mat; their spontaneous (before first stimulation, 11 C) and evoked LG periods, means
      +- SD, could be tested, and so could the count of evoked preparations with pre-stimulation LG bursting
      at 11 C. It asked for per-preparation LG burst counts and periods before the first stimulation at
      11 C, for all ten.
    response: Tested on the three preparations, with the stretches the script selects (file 0000 and files
      0032, 0012, 0020), and the pre-stimulation table for all ten added. Under the Methods burst rule
      only 901_080 is similar, so at most two of the four can be, whatever 941_006 shows; outcome changed
      from blocked to not_reproduced. Among the ten, 3 have LG bursting before the first stimulation at
      11 C.
