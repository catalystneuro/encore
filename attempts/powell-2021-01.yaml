- claim: fig3-evoked-7-to-21-in-9-of-10
  outcome: reproduced
  notebook: reproduce_powell_2021.ipynb
  output: claim:fig3-evoked-7-to-21-in-9-of-10
  measured:
  - 9
  - 10
  notes: 'Under reading (a) (at least one LG burst period in a bin), 9 of 10 preparations have an LG rhythm
    at every bin from 7 to 21 C they were held at, under both burst rules, as the criterion is worded
    (every bin the preparation was held at). The one that fails is 901_086, which spent 330 s in the 21
    C bin, with 70 s of stimulation there, and has no LG spike in it; its warmest LG burst start is at
    19.1 C. 901_062 never reaches 21 C: its last stimulation is at 19.0 C, followed by 113 LG bursts and
    cooling back to about 7 C, so 21 C was never tried; it passes because it has a rhythm at every step
    it had (7, 11, 15 and 19 C), which fits the Methods'' ''in some preparations, 19 C was the warmest
    temperature that a gastric mill rhythm could be evoked''. If 21 C must also be reached, 8 of 10 pass,
    which would not be reproduced. Under reading (b) (at least 30 significands) 2 of 10. All ten preparations
    are in the record (10 of 10 evoked). Counting every bin the temperature passed through gives 3 (reading
    a) and 1 (reading b) of 10, because the 9, 13 and 17 C bins crossed on ramps (20 to 270 s) have few
    or no LG bursts, so the outcome rests on the 120 s reading of held.'
  deviations:
  - 'The claims file leaves open which bins a preparation ''was held at''. A bin counts as held when the
    recording spends at least 120 s in it, the 2-minute minimum step of the Methods (''a given temperature
    step was held for at least 2 minutes'') and the code''s (BurstPeriodsVsTime.m, ''temperature held
    for less than 2 minutes''). Counting every bin with any time in it gives 3 of 10, so the outcome rests
    on this choice, which is an assumption (assumed: true); the question is put to the paper''s authors
    as a methods_unavailable finding.'
  - A preparation whose warmest held bin is 19 C (901_062) passes when it has a rhythm at every bin it
    was held at, as the criterion is worded; the count requiring 21 C as well (8 of 10) is shown beside
    it.
  assumed: true
- claim: fig3s1-spontaneous-and-evoked-similar
  outcome: not_reproduced
  notebook: reproduce_powell_2021.ipynb
  output: claim:fig3s1-spontaneous-and-evoked-similar
  measured:
  - 3
  - 1
  notes: Tested on three of the four preparations of fig_within_prep_spont_evoked_comparison.m; 941_006
    has no spike times in the record (941_006.zip holds raw ABF files and crabsort classifier files only).
    Spontaneous stretch file 0000, evoked files 0032, 0012 and 0020 as the script selects. Methods burst
    rule, LG period mean plus or minus SD; 901_086 24.0 +- 0.7 s (two periods) against 11.2 +- 2.9 s,
    901_080 16.1 +- 6.9 s against 15.6 +- 2.9 s, 901_062 16.6 +- 5.7 s against 7.5 +- 0.8 s. Only 901_080
    is similar under either reading, so the four can give at most two similar whatever 941_006 shows,
    and the criterion (three of four) fails. The code's burst rule gives the same. The script's own call
    (computePeriods with its default of 1 ISI, bursts of at least 2 spikes) gives 901_062 9.9 +- 3.5 s,
    similar under reading (b), which would leave three of four possible; that is a variant. Among the
    ten evoked preparations, 3 (901_062, 901_080, 901_086) have LG burst periods before their first stimulation
    in the 11 C bin (13 to 43 periods), not 4; 932_151 has 16 before stimulation, near 9.9 C; the paper's
    fourth preparation is 941_006, which is not one of the ten. The first measured value is that count,
    the second the similar preparations of the three tested. Taking every pre-stimulation LG period at
    11 C as the spontaneous stretch gives 21.7 +- 5.3, 17.5 +- 7.8 and 16.2 +- 4.9 s, the same picture.
    The ISIs are shown and not judged, as the criterion sets.
  deviations:
  - 941_006 has no spike times in the record, so three of the four preparations are tested; the outcome
    does not depend on it under the Methods burst rule, since one similar of three allows at most two
    of four.
  - The spike times of a raw file are those within its samples in evoked_data.mat (the filename categorical),
    the stacked form of the same crabsort annotations the script reads per file.
- claim: fig4b-periods-decrease-all-preps
  outcome: reproduced
  notebook: reproduce_powell_2021.ipynb
  output: claim:fig4b-periods-decrease-all-preps
  measured: 10
  notes: In all 10 preparations the mean PD and LG periods in the warmest bin are below those in the coldest
    (PD 0.77 to 2.00 s at 7 C against 0.28 to 0.56 s at the warmest; LG 12.5 to 40.2 s against 5.0 to
    12.6 s), and the Spearman correlation of bin means with temperature is negative for both (PD -0.976
