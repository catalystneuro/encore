- claim: fig4b-periods-decrease-all-preps
  outcome: reproduced
  notebook: reproduce_powell_2021.ipynb
  output: claim:fig4b-periods-decrease-all-preps
  measured: 10
  notes: In all 10 preparations the mean PD and LG periods in the warmest bin are below those in the
    coldest (PD 0.77 to 2.00 s at 7 C against 0.28 to 0.56 s at the warmest; LG 12.5 to 40.2 s
    against 5.0 to 12.6 s), and the Spearman correlation of bin means with temperature is negative
    for both (PD -0.976 to -1, LG -0.643 to -1). The same holds under the code's burst rule.
- claim: fig4c-q10-about-2
  outcome: not_reproduced
  notebook: reproduce_powell_2021.ipynb
  output: claim:fig4c-q10-about-2
  measured: 1
  notes: Under the Methods' Q10 over every bin, 1 of 10 preparations has both Q10s within 1.8 to 2.2
    and 2 of 10 within 1.5 to 2.5; over the held steps only, 1 and 3 of 10. Per-preparation LG Q10s
    reach 16.6 and 39.0 when every bin is used, from bins at 9 and 13 C crossed during ramps (per-bin
    LG Q10s up to 98.7 and 180.8). The code's per-burst Q10 (variant) gives 3 of 10 within 1.8 to 2.2
    and 8 of 10 within 1.5 to 2.5 (Methods burst rule; 1 and 8 with the code's), so the paper's count
    matches the code's computation under the wider reading of "~2".
  deviations:
  - The claims file does not say which temperatures enter the Methods' Q10. Two readings were run,
    every bin with bursts and only the bins held at least 120 s (the temperature steps of the
    Methods, "Spontaneous and evoked gastric mill rhythm temperature ranges"); both give the same
    outcome. T is the bin centre, f_T the mean of 1/period over bursts starting in the bin.
  - PD periods above 5 s and LG periods above 50 s are removed before the Q10, as fig_burst_period.m
    does (the outlier filter the claims file cites for fig4b-periods-decrease-all-preps).
- claim: fig4c-q10-pd-lg-not-different
  outcome: reproduced
  notebook: reproduce_powell_2021.ipynb
  output: claim:fig4c-q10-pd-lg-not-different
  notes: Paired t-test on the Methods' Q10s (every bin), t = -1.418, p = 0.190, n = 10, mean PD minus
    LG -5.35 (driven by the two large LG Q10s); held steps only, t = -0.739, p = 0.479. The code's
    per-burst Q10 gives t = 1.204, p = 0.259 with the Methods burst rule and t = 1.272, p = 0.235 with
    the code's, the paper's values. No version reaches p < 0.05.
- claim: fig4s1-slowdown-after-stimulation
  outcome: reproduced
  notebook: reproduce_powell_2021.ipynb
  output: claim:fig4s1-slowdown-after-stimulation
  notes: 64 stretches from 10 preparations. The slope of the mean LG period on time is positive at 8 of
    9 temperatures under both burst rules (code's 7 ISIs and the Methods' 5 spikes), negative only at
    13 C (-0.0006 s per s, two stretches). At 7, 11, 15, 19 and 21 C (8 to 17 stretches) the slopes
    are 0.0055 to 0.0171 s per s, r 0.63 to 0.87, and the mean period rises from 6.7 to 15.4 s in the
    first minute to 10.1 to 19.6 s at 9 to 10 minutes.
  deviations:
  - A stimulation block is taken as running to the end of the recording when no stimulation follows,
    as MATLAB's temperature(stim:[]) is empty in BurstPeriodsVsTime.m; the mask's meaning
    (stimulation where 0) is taken from the code (findStimulationTimes.m, BurstPeriodsVsTime.m), as the
    record does not describe it.
