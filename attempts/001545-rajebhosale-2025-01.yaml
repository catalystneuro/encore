  notes: Over 100 random stratified five-fold splits, WT pooled out-of-fold accuracy median 55.0% (35.0
    to 75.0) and kappa 0.12 (-0.33 to 0.49); the mean over folds also 55.0%. Always predicting GC would
    give 60%. V321L with its own scaling 41.7% (kappa -0.11, confusion GC 6 right 4 wrong, SGC 4 right
    10 wrong), with the WT scaling 45.8% (kappa -0.01). Neither the four values nor the two accuracies
    are within tolerance under any reading, and WT accuracy exceeds V321L accuracy by 13.3 or 9.2 points,
    under the criterion's 15.
  deviations:
