- claim: figs9c-embryonic-sgc-genes
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_rajebhosale_2025.ipynb
  output: claim:figs9c-embryonic-sgc-genes
  notes: Tested after verification (it was blocked as other, not attempted). The Allen Developing Mouse
    Brain Atlas holds one E18.5 ISH series per gene, all sagittal (Penk 100055886, Scg2 100083699, Nrg1
    100057764, Cit 100077439). The criterion is a reading of the images by eye. Penk labels a band of
    cells along the dorsal (outer) edge of the dentate crescent in all three sections shown (45, 52, 59),
    and Nrg1 a dense band along the same edge (26, 33, 47). Scg2 (29, 43) and Cit (27, 41, 48) show only
    a faint signal along that edge with few distinct labelled cells; the atlas's expression mask covers
    0.0008 and 0.0007 of the full-resolution dentate crop, against 0.0123 for Penk and 0.0072 for Nrg1.
    Scg2 labels other regions strongly (whole-brain expression density 0.043). Two of the four genes
    clearly show what the claim describes and two only faintly, so the outcome is partial. The outcome
    rests on locating the dentate gyrus by eye, as the atlas does not annotate it at E18.5, and on a
    judgement by eye. Which images Fig S9C shows is asked of the paper's authors (methods_unavailable
    finding).
  deviations:
  - The Allen data are identified by their section data set ids and read through the Allen API; they
    have no DOI or versioned release to pin.
  - Assumed. The dentate gyrus is located by eye on Penk section 52 (image 101094568, pixel 3200, 2080),
    mapped to the E18.5 reference with the atlas's image_to_reference service and from there to each
    series with reference_to_image; the E18.5 annotation draws only the medial pallium, so no annotated
    location exists. The overviews in the notebook show where each crop lies.
  - Three sections per gene are shown, those nearest the dentate point and 150 um to either side, at
    2 um per pixel, and the middle one at full resolution with the atlas's expression mask (display
    choices).
findings:
- kind: data_missing
  statement: The dandiset holds only the current clamp recordings. The soma positions and the morphology
    from the biocytin fills (splay angle, branch points, dendritic length, 15 parameters), on which Fig
    1F to I, Fig 2C to H, Fig S1 and the multiple regression rest, are not in it, and neither are the
    Golgi and RNAScope data; 23 of the paper's 56 claims cannot be tested for this reason.
- kind: selection_undocumented
  statement: The files hold 13 WT GCs and 9 WT SGCs, where the paper's electrophysiology has 14 and 9,
    and 12 V321L GCs and 14 V321L SGCs, where the paper has 10 and 15. Nothing in the files says which
    WT GC is missing or why the V321L cell types differ, so the paper's cell sets cannot be rebuilt.
- kind: metadata_error
  statement: Every CurrentClampStimulusSeries stores the current in picoamperes (values -60 to 300) under
    the unit amperes with conversion 1.
- kind: metadata_error
  statement: The electrode cell_id is VP neuron in all 48 files, though the cells are dentate granule
    cells.
- kind: metadata_error
  statement: The general stimulus field says neurons were kept near -65 mV with a constant current and
    stepped from -60 to 200 pA. The voltage before the steps is -68 to -89 mV in every cell, 14 cells
    were stepped to 250 or 300 pA, and the bias_current attribute is 10 pA in every sweep, so whether
    a holding current was applied, and how much, cannot be told. Every sweep of every file also stores
    the same bridge balance (20 MOhm) and capacitance compensation (1 pF), which look like defaults.
- kind: metadata_insufficient
  statement: The genotype is coded only as VV or LL in the subject ids; the surgery field says VV is wild
    type and LL the valine-to-leucine mutant, and GEO agrees, but the cell type is given only as the end
    of the session description (semilunar or not semilunar), with no column or field of its own.
- kind: methods_unavailable
  statement: Question for the paper's authors. Was the four-class LDA of Fig 2M and Fig S2C fitted on
    the z-scored features or on principal components, as the classifier of Fig S2G is? The Methods' LDA
    section describes only the classifier. On this dandiset the two give different groups apart on LD1
    (WT GC on the features, WT SGC on 9 PCs).
- kind: methods_unavailable
  statement: Question for the paper's authors. Which twenty features were extracted, and how were cells
    with a missing feature handled in the LDA, k-means and PCA? The Methods cite Kim et al (2024), Fig
    S2C lists eighteen, and the linked code returns twenty-one. Here 4 cells lack the code's AHP width
    and were dropped, which fits the 21 WT and 23 V321L cells of the Fig S2G matrices.
- kind: methods_unavailable
  statement: Question for the paper's authors. Which Allen Developing Mouse Brain ISH series and sections
    does Fig S9C show for Penk, Scg2, Nrg1 and Cit at E18.5? The atlas holds one sagittal E18.5 series
    per gene; in those, Penk and Nrg1 label cells along the dorsal edge of the dentate crescent clearly,
    and Scg2 and Cit only faintly.
- kind: data_missing
  statement: GEO GSE280167, where the paper deposited the snMultiome data, holds the raw feature-barcode
    matrix of every barcode per mouse (genes and peaks) and a smoothed ATAC cut-site track per sample. The nuclei kept after
    filtering and doublet removal, the cluster labels the paper's snRNA-Seq figures rest on, and the per-nucleus
    ATAC fragments are not deposited.
