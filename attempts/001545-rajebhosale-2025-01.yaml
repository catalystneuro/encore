- claim: fig2m-ephys-lda-wt-gc-apart
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_rajebhosale_2025.ipynb
  output: claim:fig2m-ephys-lda-wt-gc-apart
  notes: The criterion's two readings disagree, and it says to block in that case. On the 18 z-scored
    features (a) the WT GC mean LD1 is 1.97 and the other groups -1.43 to -0.33, and spike width has the
    largest LD1 coefficient (3.01, then downstroke -2.88), as the paper says. On the top 9 PCs (b) WT
    SGC is the group apart (1.67, the others -0.74 to -0.26) and the largest coefficients mapped back
    to the features are spike amplitude, AHP amplitude and sag (-0.48 to -0.43). Question for the paper's
    authors (recorded as a methods_unavailable finding). Was the four-class LDA of Fig 2M fitted on the
    z-scored features or on PCs, as the classifier of Fig S2G is? The Methods' LDA section describes only
    the classifier (scale, prcomp, top 9 PCs, caret lda).
  deviations:
  - The dandiset holds 12 V321L GCs and 14 V321L SGCs where the paper has 10 and 15; nothing in the files
    says which cells differ.
  - The dandiset holds 13 WT GCs and 9 WT SGCs where the paper has 14 and 9; which WT GC is missing is
    not known.
  - Cells with a missing feature are left out (the rule of the fig2m criterion, used here for the other
    multivariate claims, whose criteria do not say); 4 cells lack the AHP width, leaving 20 WT and 24
    V321L cells (the paper's Fig S2G matrices count 21 and 23).
  - Where only one crossing of the AHP half level exists, the code measures the AHP width to stopLoc,
    an absolute sample index; here it runs to the end of the segment (a standard choice).
  - Features reimplemented in Python from the claims file's definitions and the paper's MATLAB code (patch_clamp_analysis
    at 5d756c2); scipy find_peaks stands in for MATLAB findpeaks and scipy.ndimage.median_filter for medfilt1.
  - LDA is scikit-learn's (SVD solver, priors from the class sizes) in place of MASS lda; LD1 coefficients
    are its scalings, mapped through the PCA loadings for reading (b).
