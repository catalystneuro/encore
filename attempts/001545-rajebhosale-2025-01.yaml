- claim: fig1j-sgc-hyperpolarized-rmp
  outcome: not_reproduced
  notebook: reproduce_rajebhosale_2025.ipynb
  output: claim:fig1j-sgc-hyperpolarized-rmp
  notes: Median RMP WT GC -75.3 mV (13 cells), WT SGC -83.8 mV (9 cells), in the paper's direction; two-tailed
    Mann-Whitney U = 32, p = 0.083 (paper U = 26, P = 0.02). Welch's t test gives p = 0.044. Leaving out
    one WT GC at a time gives p from 0.043 to 0.127, so the missing 14th GC could move the test either
    side of 0.05. Per mouse, the two mice with both types and more than one SGC (VV317, VV326) have SGC
    medians 1.6 and 2.1 mV below their GC medians; VV256 gave 7 GCs and no SGC, VV318 2 SGCs and no GC.
  deviations:
  - The dandiset holds 13 WT GCs and 9 WT SGCs where the paper has 14 and 9; which WT GC is missing is
    not known.
  - Features reimplemented in Python from the claims file's definitions and the paper's MATLAB code (patch_clamp_analysis
    at 5d756c2); scipy find_peaks stands in for MATLAB findpeaks and scipy.ndimage.median_filter for medfilt1.
  - RMP is the mean voltage 10 to 1 ms before step onset over all sweeps, as the claims file and the code
    define it. The file's stimulus field says cells were held near -65 mV with a constant current, but
    the baselines are -68 to -89 mV and the bias_current attribute is 10 pA in every sweep, so whether
    a holding current was applied cannot be told from the files.
- claim: fig1k-sgc-narrower-spike
  outcome: not_reproduced
  notebook: reproduce_rajebhosale_2025.ipynb
  output: claim:fig1k-sgc-narrower-spike
  notes: Median spike width WT GC 1.29 ms, WT SGC 1.18 ms, in the paper's direction; U = 32, p = 0.082
    (paper U = 24, P = 0.012). With the code's 10 mV/ms threshold U = 34, p = 0.109. The 4 GCs of mouse
    VV253 have widths of 2.1 to 2.7 ms (median 2.24) and its SGC 3.06 ms; without that mouse the medians
    are 1.23 and 1.17 ms, p = 0.112.
  deviations:
  - The dandiset holds 13 WT GCs and 9 WT SGCs where the paper has 14 and 9; which WT GC is missing is
    not known.
  - Features reimplemented in Python from the claims file's definitions and the paper's MATLAB code (patch_clamp_analysis
    at 5d756c2); scipy find_peaks stands in for MATLAB findpeaks and scipy.ndimage.median_filter for medfilt1.
  - Threshold found on the ten-fold interpolated trace from 3 ms before the first peak, as spikeproperties.m
    does, with the 20 mV/ms of Kim et al that the criterion names.
