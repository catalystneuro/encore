- claim: connection-counts
  outcome: not_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:connection-counts
  measured:
  - 40240
  - 1.32
  - 0.97
  - 0.39
  - 0.199
  notes: 40,240 directed pairs (three of four rats). Under G-b, 0.94 to 1.32% of pairs are connected, 0.84 to 0.97%
    excitatory and 0.11 to 0.39% inhibitory over the four B and W combinations; under G-a 1.07 to 1.50%, 0.94 to
    1.09% and 0.14 to 0.47%; no combination puts the three directed values within tolerance. Reciprocal pairs are
    0.045 to 0.199% of directed pairs under G-b; 0.179% of unordered pairs under G-a B-b W-a is the only reciprocal
    value within tolerance. G-b B-a W-a finds 41 of the authors' 43 pairs_all connections for EE188, G-a B-a W-a all 43
    (W-b 42), B-b 34.
    With every EE188 train shifted in time the detector flags 0.12 to 0.15% of pairs as excitatory and 0.04 to 0.07%
    as inhibitory (G-b B-a W-a), against 0.70% and 0.26% unshifted.
  deviations:
  - 'The global band of the jitter test follows the Methods'' stepping procedure (G-b): it is stepped inwards, excluding
    the k largest surrogate maxima and the k smallest minima, for as long as at least 99% of the surrogates lie
    entirely within both sides. The Methods build the band from the maximum and minimum of each surrogate (Identifying
    monosynaptic interactions), define a band''s global acceptance level as the proportion of data sets lying completely
    within it, and take the global band as the minimal band with that level (Multiple hypothesis testing and global
    bands). The band holds a median 99.4% of surrogates (5th percentile 99.0%). The first version''s 1% on each
    side (G-a) is shown for every claim as a variant.'
  - The data set holds three of the four rats; its rats EE, FF and GG are taken to be the paper's E, F and G of
    Supplementary Figure 1 (E and G layer 2/3, F layer 5), as the names match and EE.188, the Figure 2a and 3d session
    by the data description, is layer 2/3.
  - 1,000 jitter surrogates per session; lags are rounded to the nearest bin centre.
