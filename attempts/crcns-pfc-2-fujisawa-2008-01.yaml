- claim: connection-counts
  outcome: not_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:connection-counts
  measured:
  - 40240
  - 1.5
  - 1.09
  - 0.47
  - 0.226
  notes: 40,240 directed pairs (three of four rats). Under G-a, 1.07 to 1.50% of pairs are connected,
    0.94 to 1.09% excitatory and 0.14 to 0.47% inhibitory over the four B and W combinations; under G-b
    0.83 to 1.20%, 0.73 to 0.86% and 0.11 to 0.38%; no combination puts the three directed values within
    tolerance. Reciprocal pairs are 0.06 to 0.23% of directed pairs; 0.179% of unordered pairs under G-a
    B-b W-a is the only reciprocal value within tolerance. The test finds all 43 of the authors' pairs_all
    connections for EE188 (G-a B-a W-a).
  deviations:
  - The global band of the jitter test is the 99th percentile of the surrogates' maxima and the 1st percentile
    of their minima (G-a); the Methods give the level (99%) and that the band comes from each surrogate's
    maximum and minimum, not how the level is split between the two sides. Splitting it (0.5% per side,
    G-b) is shown for connection-counts and cell-type-fractions and does not change their outcome. Every
    claim that uses the connections rests on G-a.
  - The data set holds three of the four rats; its rats EE, FF and GG are taken to be the paper's E, F
    and G of Supplementary Figure 1 (E and G layer 2/3, F layer 5), as the names match and EE.188, the
    Figure 2a and 3d session by the data description, is layer 2/3.
  - 1,000 jitter surrogates per session; lags are rounded to the nearest bin centre.
