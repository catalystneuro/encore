- claim: trajectory-divergence
  outcome: not_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:trajectory-divergence
  measured:
  - 0.47
  - 0.01
  notes: In EE188 (42 trials) the first globally significant left-right difference (level 0.01) is at
    0.47 for the x coordinate (reading a) and 0.43 for the distance to the mean path (reading b), and
    at 0.01 for head direction, against 0.30 and 0.24. With smoothing 0.41 and 0.40 for the path and 0.01
    for head direction. Other sessions give 0.01 to 0.53 for the path; head direction is available only
    in EE152 (0.17) and EE165 (0.26), as the second LED is not tracked in the other ten.
  deviations:
  - Per trial, the mean of each variable in 100 bins of normalised position, gaps filled by linear interpolation;
    the binning and the absence of smoothing are standard choices, the smoothed version (kernel 0.05)
    is shown.
  - Head direction is the angle from LED 1 to LED 2, compared by the circular difference of the condition
    means; the paper does not say how it was computed.
