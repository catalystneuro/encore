- claim: odor-selective-fraction
  outcome: not_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:odor-selective-fraction
  measured: 30.8
  notes: In EE188, with the rate over the sensor-detected pokes, 36 of 117 cells (30.8%, Student) or 34 (29.1%,
    Welch) differ between left and right trials, against 26 +- 2.6. With the trial table's window from the first
    poke to the end of the last, which includes the pauses between pokes (median 4.59 s against 2.43 s of poking),
    45.3% and 42.7%, and 32.4% over all sessions.
  deviations:
  - The window is the sensor-detected pokes, from channels 97 and 98 of the session's .eeg file, as Supplementary
    Figure 6A defines it (duration of nose-poking, detected by a photoelectric sensor); the rate is the spikes during
    the pokes over their summed duration. The trial table's window (first poke to end of the last) is a variant,
    and the only window for the other sessions.
  - Left and right trials are taken as the two odors, as the claims file says.
- claim: odor-unrelated-to-stem
  outcome: not_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:odor-unrelated-to-stem
  notes: With the odor preference from the sensor-detected pokes, the Spearman correlation of the nose-poke difference
    with the side-arm difference is 0.237 (p = 0.010), an association with the same sign. The Fisher tests give
    odds 1.31 (p = 0.549) in the stem and 1.87 (p = 0.161) in the side arms; the stem Spearman correlation is -0.155
    (p = 0.095). With Pearson the side-arm correlation is -0.007 (p = 0.94) and the claim would be reproduced as
    the criterion is written, so the outcome rests on the coefficient. The stem shows an opposite-sign association
    (Pearson -0.278, p = 0.0024). With the trial table's window (variant) no same-sign association is found (Fisher
    p 0.191 and 0.267, Spearman -0.184 and 0.134), and the stem Pearson correlation is -0.411. Whether opposite-sign
    associations count against the claim is asked of a reader (questions/crcns-pfc-2.yaml).
  deviations:
  - Assumed that the correlation of reading b is Spearman's, as the rate differences are heavy tailed and a rank
    correlation is not driven by a few high-rate cells; the claims file does not name the coefficient. Pearson is
    shown and gives the other outcome.
  - The odor preference is from the sensor-detected pokes (odor-selective-fraction); the trial table's window is
    a variant.
  assumed: true
