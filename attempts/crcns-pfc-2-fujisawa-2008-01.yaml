outcomes:
- claim: unit-count
  outcome: partially_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:unit-count
  measured: 627
  notes: 627 cells over the 13 working memory sessions (EE 446, FF 146, GG 35), within 10% of 633, but over three
    of the paper's four rats; 615 with EE188 counted as the 105 cells of EE188_Behavior_PFC.mat. The files list
    1,495 clusters (spikeph). By the largest rate over the tenths of the maze, 0 to 10 cells per session are below
    1 Hz (10 of 117 in EE188), and 5 of the 12 EE188 cells that EE188_Behavior_PFC.mat leaves out are below 1 Hz,
    consistent with the data description's 1 Hz rule for Cells without showing it. The match in number does not
    show that the same units are counted, so the claim holds only in part.
  deviations:
  - The data set holds three of the four rats; its rats EE, FF and GG are taken to be the paper's E, F and G of
    Supplementary Figure 1 (E and G layer 2/3, F layer 5), as the names match and EE.188, the Figure 2a and 3d session
    by the data description, is layer 2/3. The count is over three rats, the paper's over four.
  - Each session's cells are those of its CellsInfo, a selection of the sorted clusters that the data description
    describes only as cells firing above 1 Hz in the trials; for EE188 the 117 cells of EE188_example.mat.
  - Each cell's largest trial rate is its spikes over time spent in each tenth of the maze on left and right trials,
    a standard measure used only to compare the files' cells with the data description's 1 Hz rule.
- claim: task-performance
  outcome: partially_reproduced
  notes: The trial tables list correct trials only, but the session tar of EE188 holds the .eeg file with the two
    nose-poke sensor channels (97 right, 98 left), and the position file covers the whole session. A trial is the
    run of pokes since the last arm-end visit and its choice the arm end reached next. EE188 has 46 trials, 45 correct
    and 1 error (97.8%, within 91.9 +- 9.19); with a 40 pixel radius the same, with 80 pixels 46 of 48 (95.8%).
    41 of the table's 42 correct trials are found as correct trials of the same side; the remaining one (first poke
    1133.5 s) lies within a detected correct trial of the same side whose first poke is 3.5 s earlier. The table
    leaves out 1 detected error and 3 detected correct trials; one of these (2245.1 s) reaches the arm 25.9 s after
    its first poke, within the 9.0 to 36.1 s of the table's trials, and the other two (822.9 and 2370.7 s) 199.8
    and 259.9 s after it, longer than any table trial. Without these two, 43 of 44 (97.7%). The other 12 sessions'
    sensor channels are in their own tars and were not read, so the claim is tested on one session of 13.
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:task-performance
  measured: 97.8
  deviations:
  - One session of 13 (EE188), whose tar is already streamed for EE188_example.mat; each other session's tar is
    about 2 GB and would have to be streamed for its sensor channels.
  - Pokes are the intervals when a sensor channel is below -15,000 (the channels sit near 0 and drop to about -30,000),
    a standard threshold; the first and last poke of each table trial match the table to within 1.6 ms.
  - An arm end is reached within 60 pixels of the median end position of the table's correct trials of that side,
    a standard choice; 40 and 80 pixels are shown.
