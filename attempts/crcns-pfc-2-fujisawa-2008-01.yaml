- claim: trajectory-divergence
  outcome: partially_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:trajectory-divergence
  measured:
  - 0.28
  - 0.01
  notes: In EE188 (42 trials) the lateral coordinate first differs significantly between left and right trials (global
    level 0.01) at 0.28 (reading a), within 0.30 +- 0.03; the distance to the mean path (reading b) at 0.43, the
    x coordinate at 0.48. Head direction differs from 0.01 under every reading, against 0.24, although left and
    right trials start 2 pixels apart. The head direction difference lies at the start of the maze (31 to 45 degrees
    at 0.005 to 0.025, 11 at 0.055, 0 to 8 from 0.105 on), so the rat leaves the nose-poke with its head turned
    differently on the two trial types. Smoothed, 0.28 for the lateral path. Other sessions give 0.01 to 0.43 for
    the lateral path; head direction is available only in EE152 (0.17) and EE165 (0.26).
  deviations:
  - Per trial, the mean of each variable in 100 bins of normalised position, gaps filled by linear interpolation;
    the binning and the absence of smoothing are standard choices, the smoothed version (kernel 0.05) is shown.
  - Head direction is the angle from LED 1 to LED 2, compared by the circular difference of the condition means;
    the paper does not say how it was computed.
  - The claims file names the lateral coordinate x. In this position file the stem runs along x (over positions
    0 to 0.3 the mean path runs from x 554 to 308 at y 248 to 264) and the arms end at y 134 and 384, so reading
    a uses y, and x is shown as a variant.
