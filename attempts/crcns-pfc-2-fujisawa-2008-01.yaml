- claim: unit-count
  outcome: reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:unit-count
  measured: 627
  notes: 627 cells over the 13 working memory sessions (EE 446, FF 146, GG 35), within 10% of 633; 615
    with EE188 counted as the 105 cells of EE188_Behavior_PFC.mat. The files list 1,495 clusters in all
    (spikeph).
  deviations:
  - The data set holds three of the four rats; its rats EE, FF and GG are taken to be the paper's E, F
    and G of Supplementary Figure 1 (E and G layer 2/3, F layer 5), as the names match and EE.188, the
    Figure 2a and 3d session by the data description, is layer 2/3. The count is over three rats, the
    paper's over four.
  - Each session's cells are those of its CellsInfo, a selection of the sorted clusters that the data
    description describes only as cells firing above 1 Hz in the trials; for EE188 the 117 cells of EE188_example.mat.
- claim: task-performance
  outcome: blocked
  blocked_by: data_missing
  notes: The trial table lists correct trials only (data description, page 2), and the position file numbers
    the same trials, so error trials and the performance are not in the data set.
- claim: fig2c-synchrony-by-layer
  outcome: partially_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:fig2c-synchrony-by-layer
  measured:
  - 12.6
  - 20.3
  notes: Reading b (all sessions of each layer) gives 12.6% for layer 2/3 (outside 10 +- 1) and 20.3%
    for layer 5 (within 20 +- 2); reading a gives 11.8% for EE188, the only Figure 2a session in the data
    set. Every tenth of the maze is within 50% of the mean (layer 2/3 11.2 to 14.5%, layer 5 19.0 to 20.8%).
    Per session 7.6 to 21.9%.
  deviations:
  - The layer 5 session of Figure 2a and Supplementary Figure 11 (142 cells) is not in the data set; no
    FF session has more than 64 cells.
  - The data set holds three of the four rats; its rats EE, FF and GG are taken to be the paper's E, F
    and G of Supplementary Figure 1 (E and G layer 2/3, F layer 5), as the names match and EE.188, the
    Figure 2a and 3d session by the data description, is layer 2/3.
  - Windows of 100 ms tile each trial from its start to its end; a window's position is the position file's
    at its centre (4.7% of layer 2/3 windows have none).
- claim: fig2-population-uniform
  outcome: not_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:fig2-population-uniform
  notes: In EE188 the peak positions per tenth are 17, 0, 2, 2, 16, 7, 7, 5, 0, 61 of 117 (chi-square
    against uniform p < 0.001), and the population mean rate per tenth is 0.57 to 2.33 times its mean.
    The layer 5 sessions of FF show the same pattern (variant). The PSTHs are spike counts per unit of
    normalised length per trial, as the Methods define them, so they are higher where the rat moves slowly
    (start and reward ends).
  deviations:
  - The layer 5 session of Figure 2a and Supplementary Figure 11 (142 cells) is not in the data set; no
    FF session has more than 64 cells.
  - The peak position of a cell is that of the larger of its left and right PSTH peaks; the claims file
    gives Figure 2a's ordering without saying which condition.
  - 1,000 permutations (the claims file's standard choice). Spikes are placed on the maze between the
    end of the nose-poke and the start of reward consumption, the trial start and end the data description
    defines (page 2, SessionNP); the files' own spike labels also cover the nose-poke.
