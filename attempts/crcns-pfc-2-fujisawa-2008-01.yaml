- claim: fig2-population-uniform
  outcome: not_reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:fig2-population-uniform
  notes: In EE188 the peak positions per tenth are 17, 0, 2, 2, 16, 7, 7, 5, 0, 61 of 117 (chi-square against uniform
    p < 0.001), and the population mean rate per tenth is 0.57 to 2.33 times its mean. The layer 5 sessions of FF
    show the same pattern (variant). The PSTHs are spike counts per unit of normalised length per trial, as the
    Methods define them, so they are higher where the rat spends more time; in EE188 it spends 0.86 s per trial
    in the first tenth and 2.89 s in the last, against 0.47 to 0.71 s in the others (median speed 81 and 22 pixels/s,
    against 138 to 198).
  deviations:
  - The layer 5 session of Figure 2a and Supplementary Figure 11 (142 cells) is not in the data set; no FF session
    has more than 64 cells.
  - The peak position of a cell is that of the larger of its left and right PSTH peaks; the claims file gives Figure
    2a's ordering without saying which condition.
  - 1,000 permutations (the claims file's standard choice). Spikes are placed on the maze between the end of the
    nose-poke and the start of reward consumption, the trial start and end the data description defines (page 2,
    SessionNP); the files' own spike labels also cover the nose-poke.
