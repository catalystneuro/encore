findings:
- kind: data_missing
  statement: The data set holds three of the paper's four rats (EE, FF, GG; the paper's rat H is absent). Its trial
    tables list correct trials only; error trials can be found only from the nose-poke sensor channels in each session's
    raw .eeg file (read here for EE188). The layer 5 session of Figure 2a and Supplementary Figure 11 (142 cells)
    is not in it; the FF sessions hold 40 to 64 cells.
- kind: metadata_error
  statement: The data description names EE188_example.mat as a file of folder EE0708; it is a member of EE0708/EE.188.tar.gz,
    about 2 GB into the gzip stream, and the folder holds EE188_Behavior.mat, EE188_Behavior_PFC.mat and EE188_Behavior_CA1.mat
    instead.
- kind: metadata_insufficient
  statement: The CellsInfo type column is described as pyramidal (1), interneuron (2) or unknown (3). In the 12
    sessions of behaviors.zip and in EE188_Behavior_PFC.mat no cell is unknown (87 pyramidal and 18 interneurons
    in EE188), while EE188_example.mat of the same session has 33, 15 and 69. How either classification was made
    is not documented.
- kind: selection_undocumented
  statement: Each session's files keep a selection of the sorted clusters (627 cells of 1,495 clusters listed in
    spikeph); the description says only that Cells are neurons whose maximum rate in the trials exceeds 1 Hz. EE188_Behavior_PFC.mat
    holds 105 of the 117 cells of EE188_example.mat.
- kind: metadata_insufficient
  statement: The layer of each rat's probe is not given in the data set; it can be taken only from the paper's Supplementary
    Figure 1, by assuming that rats EE, FF and GG are the paper's E, F and G.
- kind: metadata_error
  statement: The spikes' trial labels (spikeLtr, spikeRtr) and positions (spikeX) start at the first nose-poke of
    each trial, while the description defines the trial start as the end of the last nose-poke (SessionNP column
    2). Spikes during the nose-poke, which lasts up to 315 s, are placed near position 0.
- kind: metadata_insufficient
  statement: The pairs_all list of EE188_example.mat (43 connections) is described as the cell pairs with monosynaptic
    connections, but it holds fewer connections than the paper reports for that session (48 and 30 in Figure 3b)
    and its largest component is the 39-cell circuit of Figure 3d; which selection it is, is not said.
- kind: other
  statement: In 10 of the 13 sessions the second LED is not tracked (zeros in the position file), so head direction
    can be computed only in EE152, EE165 and EE188.
- kind: methods_unavailable
  statement: Question for the paper's authors. Was the 99% global band of the jitter test the minimal band holding
    99% of the surrogates entirely within its upper and lower sides, as the Methods' stepping procedure defines
    it (used here, G-b), or 1% on each side? With the stepping procedure this attempt finds 0.94 to 1.32% of directed
    pairs connected, with 1% on each side 1.07 to 1.50%, against 0.79%. It also asks which bin width the cross-correlograms
    used (1 ms or 0.5 ms) and how Figure 3d's subset of connections (pairs_all) was chosen.
- kind: methods_unavailable
  statement: Question for the paper's authors. For the population vector correlations of Supplementary Figure 2A,
    were each cell's rates normalised (by the peak, or z-scored) before the correlation? With raw rates the correlations
    stay above 0.5 along the whole maze; with normalised rates the widths match the reported 0.18 and 0.27. This
    attempt assumed normalisation by the peak.
- kind: selection_undocumented
  statement: The trial table of EE188 (SessionNP) leaves out 3 trials that the nose-poke sensor channels and the
    position file show as correct (first pokes at 822.9, 2245.1 and 2370.7 s), and 1 error trial (2687.2 s). In
    two of the three (822.9 and 2370.7 s) the rat reaches the arm 193.4 and 176.9 s after its last poke, longer
    than any table trial, so they may be left out for that reason; why any are left out is not said.
- kind: metadata_insufficient
  statement: The data description defines Cells as the units whose maximum rate in the trials exceeds 1 Hz, but
    the files hold no Cells variable. By the largest rate over the tenths of the maze, 0 to 10 cells per session
    of CellsInfo are below 1 Hz, so which selection CellsInfo is cannot be confirmed.
