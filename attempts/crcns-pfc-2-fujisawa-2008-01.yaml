- claim: population-vector-width
  outcome: reproduced
  notebook: reproduce_fujisawa_2008.ipynb
  output: claim:population-vector-width
  measured:
  - 0.239
  - 0.3
  assumed: true
  notes: With each cell's PSTH divided by its peak (the assumption), reading a gives 0.239 +- 0.060 for
    EE188 (layer 2/3) and 0.300 +- 0.078 for the pooled layer 5 sessions, within tolerance; reading b
    0.265 and 0.338, also within; the pooled layer 2/3 sessions give 0.243 (a) and 0.268 (b, just outside).
    With z-scored PSTHs all values match (0.179 to 0.216). With raw rates the correlation stays above
    0.5 almost everywhere and the width is 0.96 to 1.00, so the claim fails.
  deviations:
  - Assumed that each cell's PSTH is normalised before the correlation, by its peak as Figure 2a displays
    the rates. The paper does not say; with raw rates the high-rate cells dominate and the correlation
    never falls to the 0.35 of the Supplementary Figure 2A colour scale. z-scoring is shown and gives
    the same outcome.
  - The layer 5 session of Figure 2a and Supplementary Figure 11 (142 cells) is not in the data set; no
    FF session has more than 64 cells. The layer 5 value comes from the pooled FF sessions.
  - The width at a position is the contiguous length around the diagonal over which the correlation stays
    above 0.5, as the claims file reads it.
findings:
- kind: data_missing
  statement: The data set holds three of the paper's four rats (EE, FF, GG; the paper's rat H is absent)
    and correct trials only, so the performance cannot be computed. The layer 5 session of Figure 2a and
    Supplementary Figure 11 (142 cells) is not in it; the FF sessions hold 40 to 64 cells.
- kind: metadata_error
  statement: The data description names EE188_example.mat as a file of folder EE0708; it is a member of
    EE0708/EE.188.tar.gz, about 2 GB into the gzip stream, and the folder holds EE188_Behavior.mat, EE188_Behavior_PFC.mat
    and EE188_Behavior_CA1.mat instead.
- kind: metadata_insufficient
  statement: The CellsInfo type column is described as pyramidal (1), interneuron (2) or unknown (3).
    In the 12 sessions of behaviors.zip and in EE188_Behavior_PFC.mat no cell is unknown (87 pyramidal
    and 18 interneurons in EE188), while EE188_example.mat of the same session has 33, 15 and 69. How
    either classification was made is not documented.
- kind: selection_undocumented
  statement: Each session's files keep a selection of the sorted clusters (627 cells of 1,495 clusters
    listed in spikeph); the description says only that Cells are neurons whose maximum rate in the trials
    exceeds 1 Hz. EE188_Behavior_PFC.mat holds 105 of the 117 cells of EE188_example.mat.
- kind: metadata_insufficient
  statement: The layer of each rat's probe is not given in the data set; it can be taken only from the
    paper's Supplementary Figure 1, by assuming that rats EE, FF and GG are the paper's E, F and G.
- kind: metadata_error
  statement: The spikes' trial labels (spikeLtr, spikeRtr) and positions (spikeX) start at the first nose-poke
    of each trial, while the description defines the trial start as the end of the last nose-poke (SessionNP
    column 2). Spikes during the nose-poke, which lasts up to 315 s, are placed near position 0.
- kind: metadata_insufficient
  statement: The pairs_all list of EE188_example.mat (43 connections) is described as the cell pairs with
    monosynaptic connections, but it holds fewer connections than the paper reports for that session (48
    and 30 in Figure 3b) and its largest component is the 39-cell circuit of Figure 3d; which selection
    it is, is not said.
- kind: other
  statement: In 10 of the 13 sessions the second LED is not tracked (zeros in the position file), so head
    direction can be computed only in EE152, EE165 and EE188.
- kind: methods_unavailable
  statement: Question for the paper's authors. The jitter test's global band at 99% is built from the
    maximum and minimum of each surrogate (Methods); is 1% left above the maxima and 1% below the minima,
    or 0.5% on each side? This attempt used 1% on each side and found 1.1 to 1.5% of directed pairs connected
    against 0.79%; 0.5% per side gives 0.83 to 1.20%. It also asks which bin width the cross-correlograms
    used (1 ms or 0.5 ms) and how Figure 3d's subset of connections (pairs_all) was chosen.
- kind: methods_unavailable
  statement: Question for the paper's authors. For the population vector correlations of Supplementary
    Figure 2A, were each cell's rates normalised (by the peak, or z-scored) before the correlation? With
    raw rates the correlations stay above 0.5 along the whole maze; with normalised rates the widths match
    the reported 0.18 and 0.27. This attempt assumed normalisation by the peak.
