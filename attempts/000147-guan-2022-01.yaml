outcomes:
- claim: recording-counts
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:recording-counts
  measured: 95.8
  notes: The ten files hold 95.8 units per session (SD 6.7) and 408.0 trials per session (SD 40.8),
    4080 trials in all, as reported.
- claim: fig1b-online-accuracy
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig1b-online-accuracy
  measured: 0.8596
  notes: The recorded decoder outputs match the cued finger on 85.96% of the 4016 scored trials,
    with a trial-weighted SD across sessions of 3.6%. Shuffling the outputs gives 16.9%, the
    paper's chance level of 17%.
- claim: fig1b-errors-middle-ring-pinky
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig1b-errors-middle-ring-pinky
  measured: 0.6966
  notes: Of the 379 online errors between two fingers, 69.7% confuse middle with ring or ring with
    pinky. Counting errors that involve No-Go, the fraction is 46.8% of 564 errors, or 59.2% of the
    446 errors on finger trials.
  deviations:
  - The paper does not say which errors form the denominator. Only errors between two fingers,
    leaving out No-Go, give the paper's 70%.
- claim: fig1s4a-offline-accuracy
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig1s4a-offline-accuracy
  measured: 0.9336
  notes: Diagonal LDA with leave-one-out cross-validation within sessions gives 93.4% (weighted SD
    1.6%) over 4080 trials. The classifier and eight stratified folds of the authors' code give
    92.4% (SD 1.7%).
  deviations:
  - The paper's methods say leave-one-out; the authors' code uses eight folds, a mean-count cutoff
    of 0.5, z-scoring and LDA with identity covariance. Both are reported, and the measured value
    is the leave-one-out one.
- claim: fig1s4b-calibration-accuracy
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds only the main finger task. The calibration task, recorded at the start
    of each day, is not in any of the ten files.
- claim: fig1s5-tuned-fraction
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig1s5-tuned-fraction
  measured: 0.8789
  notes: With FDR correction over all units and fingers pooled, 87.9% of 958 units are tuned to at
    least one finger. FDR within each session gives 87.5%, within each unit 83.9%, and no
    correction 91.7%. No unit fell below the 0.1 Hz cutoff, whether the rate is taken in the
    window over all trials (lowest 0.113 Hz) or over the whole recording (lowest 0.147 Hz).
  deviations:
  - The FDR family is not stated in the paper; the measured value pools all units and fingers.
  - Student's t-test with equal variances; the paper does not say which form of the t-test.
- claim: fig1s6a-gaze-regression
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig1s6a-gaze-regression
  notes: The trials table gives the cue location as an index from 1 to 12 on the grid of three rows
    and four columns, described only as a screen location index, with no map to the grid or to
    screen coordinates. As a check, the coordinates were regressed on spike counts under the two
    plain orders of the index. Ordinary least squares gives a cross-validated r2 below 0 for both
    coordinates in all ten sessions under both orders. Ridge regression gives r2 up to 0.097 for x
    and 0.104 for y, with both coordinates at or below 0.05 in 5 (row order) or 6 (column order)
    of the ten sessions. The result depends on the regression as well as on the unknown layout.
  deviations:
  - The check assumes the index runs along the rows or down the columns; neither is documented.
  - The paper does not say whether its regression was regularised, so both ordinary least squares
    and ridge regression are shown, each with eight unshuffled folds per session.
- claim: fig1s6b-gaze-classification
  outcome: not_reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig1s6b-gaze-classification
  notes: Diagonal LDA classifies the 12 cue locations at 11.5% against a chance level of 8.3%
    (binomial p = 1e-12), above all 500 label shuffles across trials (highest 10.0%) and all 500
    shuffles within finger (highest 10.2%). The authors' classifier gives 11.2%, and removing each
    finger's mean activity first gives 11.7%. Five of the ten sessions are above chance at
    p < 0.05. With folds that never split a screen the accuracy is 11.1%, above all 200 shuffles of
    location within screens (highest 9.8%), and with folds that never split a run it is 11.3%.
    Every screen cues each location once; location and position within the screen are weakly
    associated over all trials (chi-square p = 0.037). The cued finger is classified at 93.4% from
    the same features.
  deviations:
  - Eight stratified folds within each session; the paper does not say how this classifier was
    cross-validated, and the authors' code uses eight folds for its classifiers.
  - The paper shows a confusion matrix without an accuracy or a test, so the comparison is with
    its statement that the location could not be classified.
- claim: fig1s6c-control-task
  outcome: blocked
  blocked_by: data_missing
  notes: The no-movement control task is not in the dandiset; every file is described as the main
    task and contains only its trials.
- claim: fig2d-rdm-structure
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig2d-rdm-structure
  notes: In the session-averaged RDM, max-scaled, the distances among middle, ring and pinky are
    0.21 to 0.48 and every distance involving the thumb is 0.64 or more. This holds in 9 of the 10
    sessions on their own.
  deviations:
  - The noise covariance uses OAS shrinkage, as in the authors' code; the paper names Ledoit-Wolf.
- claim: fig2f-able-bodied-over-unstructured
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig2f-able-bodied-over-unstructured
  notes: Mean WUC is 0.881 with the able-bodied PC-IP model and 0.781 with the unstructured model.
    The PC-IP model is higher in all 10 sessions; the bootstrap 95% interval of the difference is
    0.074 to 0.127, and the bootstrap t-test gives p = 4.4e-5 (paper 5.7e-5).
  deviations:
  - The model RDMs are read from the authors' code repository at the commit archived with the
    paper, not from the dandiset.
  - The p-value comes from 1000 resamples of the sessions (mean difference over its bootstrap SD,
    nine degrees of freedom); the paper used rsatoolbox's bootstrap t-test.
- claim: fig2s5-mc-over-pcip
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig2s5-mc-over-pcip
  notes: Mean WUC with the MC model is 0.969, higher than with the PC-IP model in all 10 sessions
    (difference 0.088, bootstrap 95% interval 0.060 to 0.112, p = 7.9e-5; paper 1.9e-6). It is
    0.015 below the lower noise ceiling of 0.984, and at or above its own session's ceiling in 1 of
    10 sessions.
  deviations:
  - The model RDMs are read from the authors' code repository, as for
    fig2f-able-bodied-over-unstructured.
  - The criterion's margin of 0.05 below the noise ceiling is a choice; the paper says only
    "close to".
- claim: fig2-typical-among-individuals
  outcome: blocked
  blocked_by: data_missing
  notes: The test needs the RDMs of the 36 individual able-bodied fMRI participants. Neither the
    dandiset nor the authors' code repository holds them; the repository has only the group means.
- claim: rdm-consistency
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:rdm-consistency
  measured: 0.9282
  notes: The 45 pairs of session RDMs correlate at a mean Pearson r of 0.928 (SD 0.041, min 0.817,
    max 0.990), against 0.90 (SD 0.04, min 0.83, max 0.99). The mean is 0.028 above the paper's,
    inside the tolerance of 0.03.
- claim: fig3a-no-trend-to-unstructured
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig3a-no-trend-to-unstructured
  notes: The session by model interaction is t(16) = 1.47, one-tailed p = 0.080 toward the
    unstructured model (paper t(6) = 0.50, p = 0.32). The WUC with the PC-IP model alone declines
    across sessions (slope -0.009 per session, p = 0.038); the slopes for the unstructured and MC
    models are not significant (p = 0.20 and 0.23). In other specifications the trend is also not
    significant. The same t read with 6 degrees of freedom gives p = 0.096; the difference between
    the unstructured and PC-IP fits regressed on session gives t(8) = 1.30, p = 0.116; with the MC
    model in place of PC-IP the slope is negative (p = 0.84).
  deviations:
  - Ordinary least squares on the twenty session-by-model WUC values, with sixteen residual degrees
    of freedom. The paper's t(6) implies a different model or degrees of freedom, which it does
    not describe, and its code for this test is not in the repository.
  - Three specifications are shown, since the paper's t(6) is not explained.
  - No Bayes factor is computed.
- claim: fig3b-confused-pairs-no-increase
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig3b-confused-pairs-no-increase
  notes: For the middle-ring and ring-pinky distances of 85 per-run RDMs, the session term is
    t(8) = -3.56 (paper -4.5) and the run term t(83) = -1.05 (paper -0.45). In all six estimates the
    coefficients are negative and the one-tailed p for an increase is 0.73 or more.
  deviations:
  - The paper's code for this regression is not in its repository. The regression follows the
    methods' formula on per-run RDMs, with degrees of freedom of sessions minus two for the session
    term and runs minus two for the run term, as the paper's t(8) and t(82) suggest.
  - The dandiset has 85 runs; the paper's t(82) implies 84.
  - Per-run RDMs use five folds of eight trials each, so a fold's noise covariance rests on one or
    two trials per finger and inflates the distances (mean 5.06 against 0.68 for session RDMs). A
    variant with the session's noise covariance (mean 0.76) is reported.
  - No Bayes factors are computed.
- claim: fig3s1-all-pairs-small-decrease
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig3s1-all-pairs-small-decrease
  notes: Over all ten pairs the session and run coefficients are negative in all six estimates, and
    Cohen's f2 is 0.006 for session and 0.012 for run in the main regression, and 0.017 and 0.013
    with the session's noise covariance (paper 0.008 and 0.005). In the main
    regression the session decrease is t(8) = -2.28, p = 0.052, and the run decrease t(83) = -3.12,
    p = 0.0025. With the session's noise covariance they are t(8) = -3.76, p = 0.0055, and
    t(83) = -3.29, p = 0.0015, against the paper's t(8) = -4.0, p = 0.004, and t(82) = -2.4,
    p = 0.019.
  deviations:
  - The same regression and choices as fig3b-confused-pairs-no-increase.
  - The session decrease is significant at 0.05 only in the variant with the session's noise
    covariance; the pre-registered criterion asks for negative coefficients and small effect
    sizes, not significance. The per-run fold covariance inflates the distances of the main
    regression, so the variant with the session's covariance is the better estimate of the
    session term.
- claim: fig4e-muscle-before-somatotopy
  outcome: blocked
  blocked_by: data_missing
  notes: The decomposition needs the muscle and somatotopy model RDMs of Ejaz et al. (2015). They
    are not in the dandiset, and the authors' code repository loads them from a models folder that
    holds only the two fMRI models and the unstructured model at the archived commit.
- claim: fig4s1-model-selection
  outcome: blocked
  blocked_by: data_missing
  notes: The hand-usage, muscle and somatotopy model RDMs are not in the dandiset or the authors'
    code repository.
- claim: fig4s4-well-isolated-units
  outcome: blocked
  blocked_by: data_missing
  notes: The units table has spike times, observation intervals, electrodes and electrode groups
    only, the same in every file. There are no
    waveforms, features or L-ratio values from which to select well-isolated units, and the
    representational dynamics part also needs the missing component models.
findings:
- kind: data_missing
  statement: The dandiset holds only the main finger task. The calibration task (nine sessions)
    and the no-movement control task (six sessions) analysed in the paper are not included.
- kind: data_missing
  statement: The model RDMs that the paper's main comparisons rest on are not in the dandiset. The
    two able-bodied fMRI group RDMs and the unstructured model are in the authors' code repository;
    the muscle, hand-usage and somatotopy models and the individual fMRI participants' RDMs are in
    neither.
- kind: data_missing
  statement: The units have no waveforms or sorting quality metrics, so the paper's selection of
    well-isolated units by L-ratio cannot be repeated.
- kind: other
  statement: Spike times are not in ascending order within units. In nearly every unit the spikes
    of the first seconds of each run are stored before the rest of the previous run (590 to 1016
    backward jumps per file). No trial's analysed range meets an affected span, so sorted spike
    times give the same counts, but tools that assume ascending spike times could be misled near
    run boundaries.
- kind: other
  statement: The cue location is an index from 1 to 12, described as the screen location index of
    the cue, with no map to the grid of three rows and four columns or to screen coordinates. The
    trials table's Run and TrialNumber columns read "no description", and the start time has only
    the NWB default description, though the data show that it is the cue onset.
- kind: other
  statement: Electrode coordinates and impedances are missing (NaN), and the participant is
    identified as P1 in the files and as NS in the paper.
- kind: other
  statement: The paper says the first session had 84 No-Go trials. The file has 64, and the paper's
    own total of 4016 scored trials (4080 minus the first session's No-Go trials) implies 64.
- kind: selection_undocumented
  statement: The two published versions hold the same ten files. The earlier version, which the
    authors' download script pins, names the bioRxiv preprint; the later one names the eLife paper.
    Neither says which of the paper's tasks the data cover.
verifications:
- date: 2026-10-13
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: The first executed notebook with the conclusion cells and the summary removed, the
    helper module, the claims file and the paper's full text (PMC9555862). For the blocked claims
    the verifier checked the archive's asset list and metadata and the authors' repository.
  results:
  - claim: recording-counts
    agrees: true
    outcome: reproduced
    reason: 95.8 (SD 6.7) units and 408.0 (SD 40.8) trials per session, 4080 trials in total.
  - claim: fig1b-online-accuracy
    agrees: true
    outcome: reproduced
    reason: 0.8596 over 4016 trials, trial-weighted SD 0.036. The shuffle null has mean 0.169,
      agreeing with the paper's chance level of 17%. Session 1 has 64 No-Go trials, not the 84 in
      the Methods, and 4080 minus 64 matches the paper's own total.
  - claim: fig1b-errors-middle-ring-pinky
    agrees: true
    outcome: reproduced
    reason: Reproduced under one reading. 264/379 = 0.697 when the denominator is errors between two
      fingers; 0.468 with all errors and 0.592 with errors on finger trials. The paper does not
      name the denominator, but only the first reading gives "the majority (70%)". Listed as a
      problem affecting a conclusion, since the outcome depends on an assumed definition.
    response: No change. The dependence on the denominator was already recorded as a deviation and
      all three fractions are printed. The outcome is kept because only one reading gives the
      paper's figure.
  - claim: fig1s4a-offline-accuracy
    agrees: true
    outcome: reproduced
    reason: Diagonal LDA with leave-one-out gives 0.934 (SD 0.016) over 4080 trials, within 0.02
      of 0.92. The authors' 8-fold pipeline gives 0.924.
  - claim: fig1s4b-calibration-accuracy
    agrees: true
    outcome: blocked
    reason: The archive has 10 assets, all with the session description "individual-finger press,
      main task", and the trial counts (4080) match the main task only.
  - claim: fig1s5-tuned-fraction
    agrees: true
    outcome: reproduced
    reason: 0.879 with FDR over all units pooled (0.875 with FDR per session), against 0.89 plus or
      minus 0.05. No units fell below 0.1 Hz. The 0.1 Hz exclusion uses the in-window rate, while
      the paper may mean the session-wide rate (does not affect a conclusion).
    response: Added the rate over the whole recording. Its lowest value is 0.147 Hz, so no unit is
      excluded by either definition.
  - claim: fig1s6a-gaze-regression
    agrees: true
    outcome: blocked
    reason: Blocked (metadata_insufficient), partly testable. cue_location is a 1 to 12 index with
      no map to screen coordinates, and the authors' repo config also lists only 1 to 12. The
      regression could have been run under row-major and column-major 3 by 4 layouts. Given 1s6b,
      it is not safe to assume r2 is about 0.
    response: Added the regression under both layouts, with ordinary least squares and with ridge
      regression. OLS gives r2 below 0 in all sessions; ridge gives up to 0.104, with both
      coordinates at or below 0.05 in 5 or 6 of ten sessions. The outcome stays blocked, since the
      layout is unknown and the result depends on the regression.
  - claim: fig1s6b-gaze-classification
    agrees: true
    outcome: not_reproduced
    reason: Pooled cue-location accuracy is 0.1154, above the shuffle null's 95% range of 0.0755 to
      0.0944, with 0 of 500 shuffles reaching it; the within-finger null and finger-mean removal
      give the same picture, and 5 of 10 sessions have binomial p < 0.05. The effect is small (11.5%
      against 8.3%), but the criterion fails. Screen- or run-level location counts and location
      accuracy with folds split by screen were not shown, which would rule out a temporal-structure
      artefact, though the design makes one unlikely.
    response: Added the screen structure (all 340 screens cue each location once), a test of
      location against position within the screen (p = 0.037), and accuracy with folds that never
      split a screen (11.1%, above all 200 within-screen shuffles, highest 9.8%) or a run (11.3%).
      The outcome is unchanged.
  - claim: fig1s6c-control-task
    agrees: true
    outcome: blocked
    reason: The control task is not in any of the 10 assets.
  - claim: fig2d-rdm-structure
    agrees: true
    outcome: reproduced
    reason: The largest of the middle, ring and pinky distances is 0.482 and the smallest thumb
      distance 0.641 (max-scaled). The criterion holds in 9 of 10 individual sessions.
  - claim: fig2f-able-bodied-over-unstructured
    agrees: true
    outcome: reproduced
    reason: The WUC difference is 0.0998, bootstrap 95% CI 0.074 to 0.127, higher in 10 of 10
      sessions. The bootstrap t-test is a reconstruction, but the criteria use CIs, so outcomes are
      unaffected. The condition-order assert in load_model_rdm runs only if
      pattern_descriptors/condition exists, and the notebook never prints whether it did (does not
      affect a conclusion).
    response: load_model_rdm now reads the condition order from either descriptor the files use
      (condition or finger), fails if neither is present, and the data check prints it. It is T, I,
      M, R, P in all three model files. The bootstrap test is unchanged.
  - claim: fig2s5-mc-over-pcip
    agrees: true
    outcome: reproduced
    reason: MC minus PC-IP CI is 0.060 to 0.112. Mean WUC with MC is 0.969 against a lower noise
      ceiling of 0.984 (margin -0.015, within the criterion's -0.05). It reaches the lower ceiling
      in only 1 of 10 sessions. The p-value is 7.9e-5 against the paper's 1.9e-6.
  - claim: fig2-typical-among-individuals
    agrees: true
    outcome: blocked
    reason: Individual-participant fMRI RDMs are in neither the dandiset nor the authors' archived
      repo, whose models folder holds only the MC, PC-IP and unstructured files.
  - claim: rdm-consistency
    agrees: true
    outcome: reproduced
    reason: Borderline. Mean r = 0.928 (SD 0.041, min 0.817, max 0.990) against 0.90 plus or minus
      0.03.
  - claim: fig3a-no-trend-to-unstructured
    agrees: true
    outcome: reproduced
    reason: Reproduced, weakly. The interaction t(16) = 1.47, one-tailed p = 0.080, meets the
      criterion, but the statistic is three times the paper's t(6) = 0.50, the p-value is near the
      threshold, and WUC with PC-IP itself falls over sessions (p = 0.038). The df and the model
      specification may differ from the authors', and a slightly different specification could
      cross 0.05.
    response: Added two other specifications and the main t read with 6 df. The one-tailed p is
      0.096 with 6 df, 0.116 for the difference between the unstructured and PC-IP fits regressed
      on session, and 0.84 with the MC model. None crosses 0.05, so the outcome is kept. The
      authors' exact specification could not be checked; their code for this test is not in the
      repository.
  - claim: fig3b-confused-pairs-no-increase
    agrees: true
    outcome: reproduced
    reason: The session coefficient is negative (t = -3.56, one-tailed p = 0.996) and so is the run
      coefficient (t = -1.05, p = 0.85); the same holds in all variants. The run-term df is 83
      against the paper's 82, and the paper also reports t(74) for the same test (does not affect
      a conclusion).
    response: No change to the df; the dandiset has 85 runs, as already recorded.
  - claim: fig3s1-all-pairs-small-decrease
    agrees: true
    outcome: reproduced
    reason: Reproduced on the criterion; significance only partly. Both coefficients are negative
      and f2 is 0.0064 and 0.0119. The paper's significant session decrease appears only with the
      session noise covariance (p = 0.0055); in the main variant p = 0.052. Per-run RDMs use fold
      covariances from about 8 trials, of rank about 3 across about 95 units, so OAS shrinks toward
      a tiny identity and the distances inflate (5.06 against 0.68); directions are unchanged, but
      the significance of the session term depends on the variant.
    response: Added f2 for the session-covariance variant (0.017 and 0.013, still below 0.02). The
      conclusion now says that the per-run fold covariance inflates the distances and that the
      session-covariance variant is the better estimate of the session term. The main regression
      is kept as it was pre-registered; the outcome is unchanged.
  - claim: fig4e-muscle-before-somatotopy
    agrees: true
    outcome: blocked
    reason: The Muscle, Somatomorphic and Usage RDMs are named in the repo's configs, but the .hdf5
      files are gitignored and not in the archived commit or the dandiset.
  - claim: fig4s1-model-selection
    agrees: true
    outcome: blocked
    reason: Same component models missing.
  - claim: fig4s4-well-isolated-units
    agrees: true
    outcome: blocked
    reason: The asset metadata lists only Units and ElectrodeGroup as measured variables; no
      waveforms or L-ratio are described. Printing the units table's columns would have confirmed
      the block directly.
    response: The data check now prints the units table's columns, the same in every file
      (spike_times, obs_intervals, electrodes, electrode_group).
