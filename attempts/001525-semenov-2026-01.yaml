findings:
- kind: data_missing
  statement: The dandiset holds only the two-pulse Di-8-ANEPPS experiment of Fig. 7A and the bottom
    panel of Fig. 7B. The FluoVolt, single-pulse escalation, 0.3-us, Gd3+ and Fluo-4 calcium
    experiments behind Figs. 1 to 6 and the top panel of Fig. 7B are not in it; 22 of the paper's 27
    claims cannot be tested here, and one only in part.
- kind: metadata_insufficient
  statement: Pulses are given in generator volts (50 to 350 V), not in the field strengths (V/cm) the
    paper reports and computes with Sim4Life, and no mapping is given. The mapping to the Fig. 7A
    labels (150, 360, 570, 760, 1000, 1200, 1400 V/cm) can only be inferred by rank.
- kind: metadata_error
  statement: Every file gives the distance between electrodes as 1.00 mm; the paper (Methods 2.2)
    gives a spacing of 1.6 mm.
- kind: metadata_error
  statement: The general description shared by every file lists field strengths of 0.15, 0.52, 0.9,
    1.27 and 1.57 kV/cm, single pulses at each, and inter-pulse intervals of 1, 5, 25 and 125 us.
    The files hold single pulses only at 50 V, six conditioning amplitudes (100 to 350 V) and
    intervals of 1 and 5 us only.
- kind: other
  statement: The paper's benchmark for Fig. 7 is a 150 V/cm test pulse after an identical 150 V/cm
    conditioning pulse (Results 3.7); the files hold no 50 V plus 50 V pair, only a single 50 V pulse,
    which is the only candidate for the benchmark. Three cells (c4, c5, c6) have two single-pulse files.
- kind: selection_undocumented
  statement: Six cells (c5 to c10) have the paper's 5-us interval where Fig. 7 reports n = 5, and
    nothing says which five were used. Four more cells (c1 to c4) have a 1-us interval, which the
    paper does not report.
- kind: metadata_error
  statement: The image series description says exposures began 1 us after the start of recording;
    the images show the pulse from image 40 (6.7 s at 6 Hz), after 40 baseline images, as Methods 2.3
    describe (best split at image 40 in 43 of 73 files, at 39 to 41 in 56).
- kind: other
  statement: 70 of 73 files have a dark first image (field mean about 209 counts against 276), and 22
    more dark images fall elsewhere in the sets; these are images with no laser flash. Nothing in the files marks them.
    Keeping or dropping them shifts the profile mean dF at the control by 2.17 percentage points
    under the main, background-subtracted reading (-2.09% kept, -4.26% dropped) and by 1.33 without a
    background, and the cosine amplitude by 0.0 to 0.3 points; the no-flash level (about 209 counts) shows a camera floor under every image that a dF without
    background subtraction includes.
- kind: metadata_insufficient
  statement: The files give no pixel size, no direction of the electric field in image coordinates,
    and no position of the analysed cell, while each field holds several cells. The field direction
    can be recovered from the polarization (per-file phases within 6.8 degrees sd).
- kind: methods_unavailable
  statement: For the paper's authors, whether a background was subtracted from the potentiometric
    images and whether images without a laser flash were kept when the 40 baseline and 60 pulse
    images were collapsed. Background removal doubles the dF scale here (5.6% to 12.6% at 150/150),
    and only the background-subtracted scale matches the paper's.
- kind: other
  statement: The images fade through each set of 100. Over the 40 baseline images the membrane trace
    intensity (background removed) falls by about 0.10% per image in 43 of 44 files of the 5-us
    cells, which would predict a uniform dF of -5.16% over the 60 pulse images; the profiles' mean
    dF is -3.67% over these files and -4.3% at the control, and the two correlate weakly over files
    (r 0.18). The sign is that of the Di-8-ANEPPS bleaching the paper reports (Results 3.2), the size
    does not match, and the offset's source is not established; nothing in the files corrects or
    marks it.
verifications:
- date: '2026-11-02'
  kind: agent
  by: Independent agent run by CatalystNeuro (verifier-1, run 41544331111; same harness, separate
    context, did not write the notebook)
  reviewed: The handover of the author-answers run (commit 67659bd9), the executed notebook with the
    conclusions and summary removed, the helper module and the claims file. The verifier also
    checked the archive's asset list for the blocked claims, tested the helpers on synthetic images
    and read the paper.
  results:
  - claim: fig7a-test-pulse-cosine-up-to-1000
    agrees: true
    outcome: partially_reproduced
    reason: The cosine part holds under reading (b); with the unpaired test, no strength up to 1000
      V/cm differs from control. At 1400 V/cm charging is lower than control at every pole (p =
      0.018, 0.016, 0.006); at 1200 V/cm it is not significantly lower (p = 0.19 / 0.15 / 0.067).
      The whole claim holds in only 1 of 18 variants. Also reported, not affecting a conclusion - the
      control profile has a mean dF of -4.6% whose source is never identified, so reading (a) fails
      even for the control and cannot discriminate between strengths; the strengths in the file
      metadata and the 1.00 mm gap contradict the rank mapping and are never discussed; the control
      is the single 50 V pulse, stated only in a helper comment; the field direction is estimated
      from the same profiles that are tested; reading (a) is shown only combined with "hindered".
      It could not check whether the analysed cell and trace are right (no overlay; c5's cathodic dF
      is negative at every strength, including the control, which suggests a trace or angle
      problem), nor when each control was recorded.
    response: Outcome changed to reproduced, for round 2 to review. The data check now shows each
      subject's cell with its trace overlaid and the distance of the trace inside the cell's outer
      edge; the first round's trace (plain intensity peak) lay a median 11.7 and 8.9 px inside the
      edge in c5 and c9, on bright dye inside the cell. The trace is now the intensity peak within 8
      px inside the outer edge (2.5 to 4.8 px inside it in every cell; c5's control cathodic dF is now
      +11.8%), and the old trace is kept as a variant. With it the 1200 V/cm hindrance is significant
      at the cathodic pole (p 0.022) and for the mean of poles (p 0.0013), and the claim holds in 19
      of 22 variants, failing in the 3 with the old trace. Also added - the baseline trend per file
      and the profile mean per strength (the images fade by about 0.10% per frame, predicting about
      -5% uniform dF, in sign and size the offset); reading (a) per variant and, as a diagnostic, the
      same band with an offset term (within the s.e. up to 1000 V/cm, not at 1200 or 1400); the
      metadata strengths and gap against the rank mapping, discussed in the notebook; the
