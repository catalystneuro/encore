- claim: fig5a-signaling-rich-club
  outcome: partially_reproduced
  notebook: reproduce_dvali_2025.ipynb
  output: claim:fig5a-signaling-rich-club
  measured:
  - 16
  - 5
  notes: Under reading (a), degree > 25 and > 40, the tiers hold 16 and 5 neurons, and the first tier is
    exactly the code's list. The normalized coefficient has local maxima at k = 3, 23, 25, 29, 42 and
    48 (1000 rewired networks; the same with 500, and with 100 also k = 1), so at 25 and within two
    of 40. The
    coefficient exceeds the null mean by more than one null SD at 47 of the 48 values of k from 3 on,
