findings:
- kind: metadata_insufficient
  severity: major
  versions:
  - 0.240920.1434
  fixed_in: 0.240930.1859
  statement: The cited version (0.240920.1434) does not say which neuron each stimulation targeted;
    the stimulation table gives only the target's pixel position and depth. Version 0.240930.1859 adds
    target_pumpprobe_id. Without it no analysis of who was stimulated (stimulation counts, the
    network) can be made on the version the paper cites.
- kind: metadata_error
  severity: major
  statement: In the cited version the green and red signals (GreenSignal, RedSignal), described as
    fluorescence extracted from the imaging, hold interpolated values for the frames that were not
    measured, 17% to 68% of frames and ROIs per file (mean 42%), with nothing in the files to mark
    them. The later version keeps them apart (BaseGreenSignal with NaN, InterpolatedGreenSignal); its
    measured values equal the cited ones.
- kind: data_missing
  severity: major
  statement: The control recordings without stimulation that Randi et al.'s q-values are computed
    against (pumpprobe Funatlas.get_ctrl_distributions) are not in the dandiset; all 110 recordings
    have stimulations. The signaling network the paper uses, and its threshold controls, cannot be
    computed from the dandiset.
- kind: data_missing
  severity: major
  versions:
  - 0.240930.1859
  statement: In version 0.240930.1859, 2815 of the 5614 stimulations have a targeted ROI id, 2090 of
    those ROIs have a label and 1813 a head neuron name. 23 of the atlas's 188 neurons never appear as
    a labeled stimulation target although the atlas gives them 46 out-edges, and 134 of its 1154
    edges (12%) have no occurrence in the dandiset. The released atlas rests on stimulation
    identities the dandiset does not hold.
- kind: data_missing
  severity: minor
  statement: Three recordings have raw imaging files but no segmentation file (sub-20 ses-20210917-132736,
    sub-23 ses-20211008-115929, sub-33 ses-20220330-110253), so their signals, labels and
    stimulations cannot be used without segmenting the raw data.
- kind: metadata_insufficient
  severity: minor
  statement: Of the labels of activity ROIs, 487 name a bilateral class without its side (RIG, RMDD,
    IL1V), 35 are numbers and 272 are other text (target, AMso, AWCOFF, AWCON, SMB) with no
    description of what they mean.
- kind: metadata_error
  severity: minor
  statement: Two subjects (sub-24 and sub-25) give the strain "none" where the other 108 give AML462,
    though all give the genotype WT.
- kind: other
  about: data
  severity: minor
  statement: pynwb 4.2.0 cannot build the segmentation files with the extension specifications cached
    in them (ConstructError for PatternedOptogeneticStimulusSite, spatial_light_modulator got a list
    where a Device is expected). The files read with h5py.
- kind: other
  about: data
  severity: none
  statement: The stimulation times share the clock of the signals (the targeted ROI's median dF/F is
    0.204 after the true onset and -0.092 15 s later, in 108 of 108 recordings with target ids), the
    red and green signals share their timestamps, and no recording is deposited twice.
- kind: methods_unavailable
  statement: The paper names DANDI:001075 version 0.240920.1434 as the data of the signaling network
    but does not say how the q-values were obtained. They cannot be computed from that version (no
    stimulated-neuron identities, no control recordings), and the released atlas has 1154 edges at
    q < 0.05 where the paper reports 1151. Question for the authors. Which q-value matrix or atlas
    file did the analysis use, and can the q-values be published so that the q < 0.01 and q <= 0.18
    controls can be built?
- kind: methods_unavailable
  statement: The paper does not name its four EM datasets ("three adults and one L4") or how gap
    junctions are given a direction. With the four sources of Randi et al.'s code (White 1986 whole
    adult and L4, Witvliet 2021 datasets 7 and 8) and gap junctions in both directions all reported
    values match; with the White 1986 N2U adult, or with gap junctions in one direction, several do
    not (edges 2893, clustering 0.233, sigma 2.93 or 2.21, r = 0.169, AIB as the most connected
    class). Question for the authors. Which datasets and which direction did the analysis use?
- kind: paper_inconsistency
  statement: The Results describe the signaling rich club as "16 neurons of degree 25 or higher" and
    "five neurons of degree 40 or higher". In the network 22 and 7 neurons have degree 25 or higher
    and 40 or higher; 16 and 5 have degree above 25 and above 40, as the Figure 5 legend and
    richclub.py define them.
- kind: methods_unavailable
  statement: The paper reads the rich club thresholds off local maxima of the normalized coefficient by eye
    (richclub.py) and does not give the thresholds of the control networks' rich clubs (Extended Data Figures 11b,
    12a and 13a). For the 1.25-contact anatomical network the attempt takes the local maximum with the largest
    normalized coefficient among those leaving at least 10 neurons (k = 28, 13 neurons), a rule that gives back
    25 and 62 on the original networks; the legend's 9 of 15 kept and 4 new is close to the 8 of 14 and 5 new found.
    Question for the authors. Which degree thresholds define the rich clubs of the control networks?
