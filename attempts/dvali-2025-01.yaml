    each, so the outcome is the same under all five. Reading (b), 25 or more and 40 or more, gives
    22 and 7 neurons, outside tolerance.
  deviations:
  - graph-tool random_rewire(g, "configuration") is replaced by a rewiring written in the helper
    (one sweep of target swaps over all edges, no self-loops or parallel edges, in- and out-degrees
    kept), as graph-tool cannot be installed.
