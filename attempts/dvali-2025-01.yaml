outcomes:
- claim: atlas-dataset-link
  outcome: partially_reproduced
  notebook: reproduce_dvali_2025.ipynb
  output: claim:atlas-dataset-link
  notes: The amplitude tests hold. Over the 1020 atlas edges the dandiset measured, the atlas amplitude
    and the recordings' mean dF/F (0 to 30 s against the 10 s before) correlate with Spearman rho
    0.524 (p = 3.7e-73), and atlas edges respond more than the 21738 measured non-edges (median
    absolute dF/F 0.074 against 0.042, one-sided Mann-Whitney p = 1.7e-45). The coverage tests fail.
    184 of the 188 atlas neurons are among the activity ROIs' labels, and 1020 of the 1154 atlas
    edges (0.884) have at least one occurrence, below the 95% asked. The later version gives a
    targeted ROI for 2815 of 5614 stimulations, 1813 with a head neuron label; 23 neurons never
    appear as a labeled target, yet the atlas gives them 46 out-edges. On 697 asymmetric atlas edges
    measured in both directions, the response in the atlas direction is the larger in 0.626, which
    supports the stimulated-to-responding orientation; degree correlations barely separate the two
    orientations (out-degree with stimulations 0.634, in-degree 0.608). The atlas is thus consistent
    with the recordings where they overlap, but rests on stimulation identities and recordings the
    dandiset does not hold in full. All claims on the signaling network use the atlas.
  deviations:
  - A link claim added by the author, as protocol step 1.4 asks for outside data matched to the
    dataset. Responses are a simple mean dF/F over fixed windows (standard choices for a summary
    check), not the paper's q-value framework.
- claim: signaling-network-size
  outcome: reproduced
  notebook: reproduce_dvali_2025.ipynb
  output: claim:signaling-network-size
  measured:
  - 1154
  - 0.0328
  notes: Under reading (b), the released atlas, the network has 1154 edges among the 188 head neurons
    and a density of 0.0328, both within tolerance (paper 1151 and 0.033). Reading (a) was not run,
    see the deviations. The link to the dandiset holds in part (atlas-dataset-link).
  deviations:
  - Reading (a), recomputing the q-values from the dandiset, cannot be run. Randi et al.'s code
    (pumpprobe Funatlas.get_kolmogorov_smirnov_p and get_ctrl_distributions) tests each pair's
    responses with Kolmogorov-Smirnov tests against a null distribution from control recordings
    without stimulation (its list No_stim_list.txt); all 110 recordings of the dandiset have
    stimulations, and the cited version does not identify the stimulated ROI.
  - The claim is marked data dataset in the claims file, but under reading (b) the network comes from
    the atlas, an outside input; the dandiset enters only through the link claim.
- claim: signaling-clustering-small-world
  outcome: reproduced
  notebook: reproduce_dvali_2025.ipynb
  output: claim:signaling-clustering-small-world
  measured:
  - 0.1347
  - 4.624
  notes: Average clustering 0.1347 and sigma 4.624 (C_ER 0.0334, L 2.648, L_ER 3.037), sigma above 1
    and both within tolerance. Sigma over the five seeds 4.624 to 4.715; the outcome is the same under
    all five.
  deviations:
  - The network is the released atlas (reading b of signaling-network-size), 1154 edges where the
    paper has 1151.
- claim: anatomy-network-properties
  outcome: reproduced
  assumed: true
  notebook: reproduce_dvali_2025.ipynb
  output: claim:anatomy-network-properties
  measured:
  - 3223
  - 0.0917
  - 0.3063
  - 2.515
  notes: With the four sources of Randi et al.'s code, 3223 edges, density 0.0917, clustering 0.3063
    and sigma 2.515 (2.509 to 2.530 over five seeds), all within tolerance. Under the other readings
    the outcome changes. With the White 1986 N2U adult in place of the whole-animal White adult, 2893
    edges, density 0.0823 (below the lower bound 0.0828), clustering 0.233 and sigma 2.93, all four
    outside tolerance; with gap
    junctions in the listed direction only, 2960 edges, density 0.0842, clustering 0.277 and sigma
    2.21 (outside). The question is put to the paper's authors (findings).
  deviations:
  - Assumption. The paper names "three adults and one L4" EM datasets (Methods, The Networks;
    references 11 and 36) without saying which, nor how gap junctions are directed. The four sources
    of Randi et al.'s code (pumpprobe Funatlas.aconn_sources, the senior author's lab) are used, with
    gap junctions in both directions as in pumpprobe _get_aconnectome_witvliet. This choice also
    gives the paper's control densities (0.0330 for an average of 1.25 synapses against 0.033;
    0.0288 for three contacts of one type in one source against 0.028).
- claim: triad-distribution
  outcome: reproduced
  notebook: reproduce_dvali_2025.ipynb
  output: claim:triad-distribution
  notes: The proportions of the 13 connected triad types differ between the networks (chi2 = 6008.6,
    12 degrees of freedom, p printed as 0), also with the two anatomical variants (chi2 5846.0 and
    2194.0). The signaling counts are 021D 3058, 021U 2671, 021C 3990, 111D 1384, 111U 1652, 030T
    508, 030C 60, 201 234, 120D 157, 120U 159, 120C 150, 210 173, 300 49. The test uses no random
    draws; the Erdos-Renyi means are shown only for reference.
  deviations:
