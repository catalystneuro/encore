- claim: figs2c-8way-decoding
  outcome: reproduced
  assumed: true
  notebook: reproduce_schuck_2016.ipynb
  output: claim:figs2c-8way-decoding
  measured:
  - 15.89
  - 55.36
  - 49.09
  - 54.48
  notes: With maps z-scored by voxel, 8-way accuracy 15.89% (within tolerance; one-sided p = 0.006),
    previous category 55.36% (p = 0.0024) and current category 54.48% (p = 0.0036) above 50%; previous
    age 49.09% (p = 0.67), which matches neither the main text (above baseline) nor the supplement's
    p = .09. With maps z-scored by map, 14.79% (outside tolerance, p = 0.025) and no component above
    50% (p >= 0.19), so the outcome rests on the z-scoring.
  deviations:
  - Beta maps z-scored per voxel across the state maps of each run, assumed as the operation of the
    Princeton MVPA toolbox's zscore_runs, which the Methods name; the Methods say only that the maps
    were z-scored within each run (O2). The per-map reading is shown and does not reproduce.
  - The 8-state regressors are the sums of the data set's two state columns that differ in current
    age, which equals modelling them as one event type (Figure S2C legend).
- claim: figs2a-permutation-control
  outcome: partially_reproduced
  notebook: reproduce_schuck_2016.ipynb
  output: claim:figs2a-permutation-control
  measured:
  - 7.09
  - 51.69
  - 52.09
  - 51.84
  - 52.0
  notes: Permuted classifiers average 5.98% (not above 6.25%), and real 16-way accuracy exceeds them
    (paired one-sided p = 0.001; by map 0.0003). No component meets p < 0.025; previous category comes
    closest (p = 0.033 and 0.031). The 95th percentiles over participants' averaged permutation
    accuracies (reading a) are all within tolerance of the paper's; over pooled values (reading b)
    they are 10.0% and about 57.5%.
- claim: synthetic-data-control
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The simulation places a spherical activation at each participant's peak of decoding and
    smooths the data to the real data's smoothness, all in whole-brain space. The data set's time
    series are OFC voxels with no coordinates, so no sphere, searchlight peak or smoothness estimate can
    be built, and the whole-brain data are not in the data set. neuRosim is an R package and was not
    tried.
- claim: fig2c-enter-cluster
  outcome: reproduced
  notebook: reproduce_schuck_2016.ipynb
  output: claim:fig2c-enter-cluster
