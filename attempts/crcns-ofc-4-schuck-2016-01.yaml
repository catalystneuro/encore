- claim: fig4b-decline-before-errors
  outcome: not_reproduced
  notebook: reproduce_schuck_2016.ipynb
  output: claim:fig4b-decline-before-errors
  notes: With maps z-scored by voxel, the error slope over trials -5 to 0 is negative but not
    significant in any reading (smallest p = 0.32), nor is the interaction. With maps z-scored by map
    and the nearest volume, slope and interaction are significant but positive (span reading, matched
    courses a, 1.47 percentage points per trial, p = 0.039, interaction p = 0.030), the opposite of the
    claim.
  deviations:
  - Most random-slope fits did not converge in statsmodels; the random-intercept model is reported in
    their place, as the notebook marks; one singular random-intercept fit is left out.
  - As fig4b-error-trial-drop for smoothing and error states.
- claim: fig4b-error-vs-matched
  outcome: reproduced
  assumed: true
  notebook: reproduce_schuck_2016.ipynb
  output: claim:fig4b-error-vs-matched
  notes: With maps z-scored by voxel and matched courses (a), error trials decode worse than position 0
    of the matched courses (1.59% against 9.21%, t20 = -4.07, one-sided p = 0.0003; strict reading
    2.08% against 8.93%, p = 0.005). With one matched course per error (b) p = 0.086, and with maps
    z-scored by map the error trial is not lower (p >= 0.70). Trial -1 is not lower (11.59% against
    8.81%, one-sided p = 0.70; paper p = 0.07). 21 participants, so t20 where the paper gives t24.
  deviations:
  - Voxel z-scoring assumed (see figs2c-8way-decoding); the outcome rests on it.
  - As fig4b-error-trial-drop for smoothing and error states.
- claim: fig5-similarity-predicts-errors
  outcome: not_reproduced
  notebook: reproduce_schuck_2016.ipynb
  output: claim:fig5-similarity-predicts-errors
  notes: No reading gives a negative regression of error rate on pattern correlation at p < 0.05. Over
    the eight transition types the slope is negative but not significant (p = 0.08 to 0.37); over
    ordinal positions it is positive where significant (strict errors, p = 0.049 raw and 0.039 voxel
    z-scored). Within-participant correlations average -0.010 to 0.157 (one-sided p >= 0.46); the
    mixed model gives p >= 0.24 (paper 0.08).
  deviations:
  - Transition error rates use only the Enter errors whose state is reconstructed (98 span, 39
    strict); 83 Enter errors whose current age is unknown are left out.
  - NaN correlations (negative ones) rank lowest in the ordinal reading, a choice the paper does not
    state.
- claim: figs5-euclidean-distance
  outcome: reproduced
  assumed: true
  notebook: reproduce_schuck_2016.ipynb
  output: claim:figs5-euclidean-distance
  notes: With the span reading of error states, error rate rises with Euclidean distance over ordinal
    positions (raw maps t = 6.17, p = 0.0008; voxel z-scored t = 4.10, p = 0.0064) and within-
    participant correlations are above 0 (mean r 0.260, p = 0.003; 0.313, p = 0.0003). With the strict
    reading (37 errors) the raw-map result is not significant (p = 0.17 and 0.105), and with maps
    z-scored by map the relation is absent or reversed. The regression over transition types is not
    significant in any reading (p >= 0.33). The same analysis with correlations does not reproduce
    (fig5-similarity-predicts-errors), where the paper reports the same result for both.
  deviations:
  - Rests on the span reading of error states, an assumption about the content of the error blocks.
  - As fig5-similarity-predicts-errors for the error rates.
- claim: fig5-synthetic-control
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: Depends on synthetic-data-control, which is blocked for lack of voxel coordinates and
    whole-brain data.
- claim: supp-motor-action-not-in-ofc
  outcome: blocked
  blocked_by: data_missing
  notes: The motor-response state space needs each trial's correct response side, which needs the
    trial's response mapping; neither is in the event files or the run files, and the whole-brain part
    needs data the data set does not hold.
findings:
- kind: metadata_insufficient
  statement: The 'err' events are blocks that start at an error trial and run over its repetitions
    and often the trials after it (spans 6.8 to 41 s), and the data descriptor does not say so. The
    number of errors, time-outs, error reaction times and the state of most error trials cannot be
    read from the files; the class is known for 181 of 228 blocks and the full state for 39 to 98.
- kind: metadata_error
  statement: The 'err' column of the design matrices does not follow the error blocks' RT or stimulus
    durations (r 0.30 to 0.76) but a short event at each block onset (r 0.83 to 0.98); the descriptor
    says the design matrices are boxcars from stimulus onset to button press.
- kind: metadata_insufficient
  statement: The OFC time series carry no voxel coordinates or mask, so spatial smoothing, searchlights
    and any spatial analysis cannot be done, and voxels can be taken to be the same across runs only
    from their equal counts.
- kind: data_missing
  statement: The data set holds 24 of the paper's 27 participants and the OFC only. The training
    session, whole-brain data, the hippocampus, DLPFC and PPA/FFA regions, the cardiac regressors and
    each trial's response mapping and response side are not in it; five of the paper's claims are
    blocked for missing data.
- kind: other
  statement: Enter errors (after an Exit trial) are 181 of 225 error blocks after a run's first trial,
    an Enter error rate of 4.79% against at most 1.2% for the other two classes together, where the
    paper reports 3.4%, 2.3% and 1.4%.
- kind: format_error
  statement: In Subj-01 run 4 a 'HoHy' trial follows a 'HoHy' trial, which the task rules do not
    allow; every other pair of adjacent labelled trials chains.
- kind: metadata_insufficient
  statement: Three runs (Subj-11 run 3, Subj-18 runs 4 and 5) have no 'first' event or column, as their
    first trial was an error; the descriptor mentions only runs without an 'err' column.
- kind: paper_inconsistency
  statement: The Figure 1B legend says errors on Internal and Exit trials led to a repetition of the
    preceding trial, while the Methods (Task) say Internal and Enter trials were repeated and only
    Exit errors led to the preceding trial. The data show long blocks after Internal and Exit errors,
    consistent with the legend, but cannot settle it.
- kind: methods_unavailable
  statement: Question for the authors. How were the beta maps z-scored within each run (each voxel
    across the state maps, or each map across voxels) and with what kernel were they smoothed? The
    decoding results here change with the z-scoring (8-way decoding, the correlation with error rate
    and the error-trial comparison hold only with voxel-wise z-scoring), and the assumption made was
    the voxel-wise z-scoring of the Princeton MVPA toolbox's zscore_runs.
- kind: methods_unavailable
  statement: Question for the authors. How were errors counted, and how was the state of an error
    trial labelled, given that the shared event files merge each error with its repetitions? The
    attempt reconstructed the state of Enter errors from the neighbouring trials and counted one error
    per block.
