- claim: fig2a-16way-decoding
  outcome: partially_reproduced
  notebook: reproduce_schuck_2016.ipynb
  output: claim:fig2a-16way-decoding
  measured: 8.93
  notes: 16-way accuracy 8.93% with maps z-scored by voxel (t23 = 3.18, one-sided p = 0.0021,
    two-sided p = 0.0041) and 8.92% by map (one-sided p = 0.00037), above chance but outside the
    10.98 to 13.42% of the tolerance. With state regressors rebuilt from the event files, 9.57% and
    9.19%. Above chance in 15 and 16 of 24 participants.
  deviations:
  - No spatial smoothing of the beta maps (O1); the files hold no voxel coordinates.
  - The data set's GLM nuisance set (four drift terms, six motion parameters) without the paper's 26
    cardiac regressors (O5), and the data set's AFNI design matrices in place of SPM8's.
  - Post-error trials (O3) are inside the data set's 'err' regressor, as its error blocks run over the
    repeated trials; reading (a) cannot be built without the times of the trials inside a block.
  - 24 of the 27 participants.
- claim: fig2-two-back-state-space
  outcome: not_reproduced
  notebook: reproduce_schuck_2016.ipynb
  output: claim:fig2-two-back-state-space
  measured: 5.96
  notes: With maps z-scored by voxel, the two-back space decodes worse than the hypothesized space
    (5.96% against 8.93%, t23 = -3.75, p = 0.001; reading b 5.81%, p = 0.0006), but below the 7.29 to
    8.91% of the tolerance. With maps z-scored by map, 7.88% and 7.98%, within tolerance, but not
    significantly lower (p = 0.13 and 0.19). No reading meets both parts of the criterion. 334 (a) and
    295 (b) of 11071 labelled trials were left out as nuisance.
  deviations:
  - Two-back regressors are rebuilt from the RT event files with SPM's canonical HRF, shifted by -0.6
    s, at which rebuilt state columns match the data set's (r 0.983 to 1.0).
  - Same unsmoothed maps and nuisance set as fig2a-16way-decoding.
