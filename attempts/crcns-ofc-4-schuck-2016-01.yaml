- claim: supp-training-rt-unchanged
  outcome: blocked
  blocked_by: data_missing
  notes: No training session in the data set, as for supp-training-errors-higher.
- claim: supp-rt-stable-over-blocks
  outcome: reproduced
  notebook: reproduce_schuck_2016.ipynb
  output: claim:supp-rt-stable-over-blocks
  notes: Per participant and run, median RT of correct trials; slope -8.6 ms per run, chi2(1) = 1.74,
    p = 0.19 (paper chi2(1) = 1.7, p = .18).
  deviations:
  - The reading "all responded trials" cannot be run, as error trials have no RT in the files (an
    error block's duration is its span); correct trials only.
  - RTs are given to 0.1 s in the event files.
