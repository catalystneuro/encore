findings:
- kind: metadata_error
  statement: Every photometry series states a sampling rate of 9 Hz (starting_time rate 8.999 to
    9.0). Each series has as many samples as the behavior series, which steps at 55.6 ms (18 Hz), and
    the Methods and code use 18 Hz; at the stated rate the recordings would last twice as long as
    their timestamps.
- kind: metadata_insufficient
  statement: No field in the files states which experiment (spontaneous, unpredicted reward,
    Pavlovian learning or extinction, control, stimulation) a session belongs to, or which Pavlovian
    phase. Cohorts can be told only from subject names and indicators, and phases only by counting
    rewarded light cues (1.0, 0.8 or 0.2). The paper's Zenodo record has a table of this mapping
    outside the dandiset.
- kind: data_missing
  statement: The Pavlovian files have light cue events but no tone cue events, although each session
    has 30 tone cues (the 68 rewards of a learning session are 30 light, 30 tone and 8 uncued). Tone
    trials cannot be analysed.
- kind: data_missing
  statement: Session sub-UG27_ses-240313r lacks the high-pass, artifact-removed green series that all
    other UG sessions hold, so it cannot enter the analyses that use it.
- kind: metadata_error
  statement: The device description of ExcitationSource470 describes 470 nm and 405 nm (isosbestic)
    light alternated at 100 Hz, and that of ExcitationSource570 reads "405 nm"; the Methods alternate
    470 and 570 nm at 36 Hz. The mutant sensor is named ACh4.3mut in the files where the Methods and
    Key Resources Table name ACh3.0-mut. The session description gives 9 uL rewards at 5 to 30 s,
    where the Methods give 5 uL at 10 to 30 s, and stores the micro sign mis-encoded.
- kind: metadata_insufficient
  statement: The code keeps only sites with signal in both channels (a `sig` flag per site) for the
    transient analyses; the flags are not in the files. All 174 included sites gave the paper's
    count, so this did not change the result here.
- kind: code_mismatch
  statement: In fig4_pav.m (commit 833fa3d) the loop over a phase's last three sessions loads
    exp_dirs{d} in place of task_dirs{d}, so it reads the mouse's first three recordings for every
    phase, and the extinction correlation is called with polarity 1 (the DA peak) although the
    legend and Methods describe the DA trough. The notebook follows the evident intent and the
    Methods.
- kind: code_mismatch
  statement: The code departs from the Methods in several parameters; triggered-average significance
    uses the 0.5th and 99.5th percentiles (Methods 2.5th and 97.5th), the minimum locomotion bout is
    2.2 s (Methods 2.27 s), paired-transient magnitude correlations are Pearson r over all pairs
    (Methods a 100-pair bootstrap), and the stimulation cohort's exclusion of reward and stimulation
    periods combines the three conditions with AND, so a sample is dropped only when all three hold.
    hotspot_comparison.m places the second hotspot's random volumes with the first grid's dimensions.
- kind: paper_inconsistency
  statement: For extinction, the Results give 41 of 74 sites and the Figure 4g legend 48 sites in 5
    mice, while the Methods give 3 Pavlovian mice and the files hold 75 sites in 3 mice. For learned
    cues the Results give 39 of 75 negative and 26 of 75 positive sites, which sum to 65.
- kind: paper_inconsistency
  statement: In the Figure 8 source data, the Figure 8b DLS group holds 6 slice labels from 4 mouse
    labels (slice_B_4 holds only stimulus 5) where the legend states 5 slices from 5 mice, and the
    stimulus F values computed from the source data for Figures 8e and 8f (47.68 and 45.04) differ
    from the legends (36.37 and 34.46), while all other F values match.
- kind: other
  statement: The ex vivo slice data of Figure 8 are not in the dandiset; their source data are in the
    paper's Zenodo record (doi:10.5281/zenodo.18202873).
