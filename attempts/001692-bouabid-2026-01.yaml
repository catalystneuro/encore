- claim: fig1e-dominant-polarity
  outcome: reproduced
  notebook: reproduce_bouabid_2026.ipynb
  output: claim:fig1e-dominant-polarity
  measured:
  - 133
  - 128
  - 41
  - 32
  notes: Of 174 sites, 133 have a dominant negative correlation (128 with DA leading) and 41 a
    dominant positive one (32 with ACh leading); 6 have their extreme at lag 0. All four counts are
    within 10% of the paper's. Every mouse has more negative than positive sites. Correlation over
    concatenated sessions gives 133, 128, 41 and 30.
  deviations:
