- claim: fig1f-adls-hotspot
  outcome: partially_reproduced
  notebook: reproduce_bouabid_2026.ipynb
  output: claim:fig1f-adls-hotspot
  notes: The hotspot procedure finds a significant hotspot of 1.01 mm3 with mean smoothed r -0.368
    (hull mean -0.185). Its centroid (AP 0.63, ML 2.02, DV -3.14 mm) is anterior and dorsal of the
    median site (0.10, 2.04, -3.21 mm) but 0.02 mm medial of it, which fails the lateral part of the
    criterion fixed beforehand. With the 99th percentile of the null the hotspot has 518 voxels and
    its centroid is at ML 2.09 mm, lateral of the median. 28 sites from all five mice are inside.
    The location test against the median site is a coarse stand-in for the paper's maps, in which
    the hotspot lies in aDLS; the shortfall is small.
  deviations:
  - The hotspot procedure is simplified from the paper's code (linear in place of natural-neighbor
    interpolation, 100 um voxels in place of 50 um, the convex hull of the sites in place of the
    Allen striatum mask, 200 in place of 10000 shuffles).
  - The paper does not define the aDLS location in numbers; the criterion compares the centroid
    with the median site coordinates.
