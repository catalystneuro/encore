- claim: fig3c-vla-decr-lead-gpi-incr
  outcome: not_reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:fig3c-vla-decr-lead-gpi-incr
  measured:
  - -19
  - -69
  notes: VLa decreases begin at a median of -19 ms (244) and GPi increases at -69 ms (377); VLa does
    not lead (rank sum p = 0.17). In Gaia VLa decreases come later (12.5 against -75 ms, p = 0.0028).
    With the paper's records VLa leads by 13 ms without significance (-86 against -73 ms, p = 0.2).
    The paper itself gives -62 ms for GPi increases here and -76 ms in Table 1. With one record per
    presumed neuron VLa decreases come later (-8 against -92 ms, p = 0.0082), and with one value per
    presumed neuron too (20.5 against -45 ms, p = 0.021). With random alignment the detector finds a
    decrease in 33.7% of VLa unit-directions (44.2% in the data), with a median onset of -8 ms, so
    many VLa decreases here may be chance detections, which would pull their median late. At alpha
    0.0001 the medians are -21.5 (VLa) and -57.5 ms (GPi), p = 0.3, and chance still gives a decrease
    in 30.8% of VLa unit-directions (42.0% in the data), so the stricter threshold does not remove
    the chance decreases.
  deviations:
  - The ISI-based detection finds more decreases than the paper's on the same units (330 against 286
    on the linked units), which weighs on this comparison.
