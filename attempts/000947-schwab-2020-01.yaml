- claim: hold-period-ramps
  outcome: partially_reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:hold-period-ramps
  measured:
  - 98.5
  - 98.6
  notes: 98.5% of GPi and 98.6% of VLa units have a significant control-period slope (97.0% and 97.5%
    at alpha 0.01), and 49.9% of significant slopes are positive. GPi and VLa slopes differ (mean
    -0.598 against 0.233 spikes/s2, rank sum p = 0.042), where the paper finds no difference (p =
    0.29); they also differ with one record per presumed neuron (p = 0.013) and with one mean slope
    per presumed neuron (p = 0.033). With the paper's records the fractions are 99.5% and 98.8% and
    the slopes do not differ (p = 0.187), which would meet the criterion, so the outcome depends on
    the selection of units. With every trial aligned to a random time, the same slope test finds a
    significant slope in 98.4% of GPi and 99.0% of VLa units, so the fractions do not show ramps
    beyond what noise in a smoothed function gives; the paper's code uses the same test.
  deviations:
  - The criterion did not define a partial outcome; the outcome is partial because the first part
    (ramps are common) holds and the second (no difference between areas) does not.
- claim: mvt-responsive-fraction
  outcome: reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:mvt-responsive-fraction
  measured:
  - 98.5
  - 97.5
  notes: 264 of 268 GPi (98.5%) and 272 of 279 VLa units (97.5%) respond in at least one direction.
    VLa matches the text's 94% but not Table 1's 88.1%; the criterion accepts either reading. With
    alpha 0.0001 the fractions with an increase alone are 81.0% and 77.4%. With every trial aligned
    to a random time 62.3% of GPi and 70.8% of VLa units are responsive, so the data are well above
    chance; with one record per presumed neuron the fractions are 100.0% and 98.4%.
  deviations:
  - The paper gives 88.1% (Table 1) and 94% (text) for VLa; both readings were listed and only the
    text's matches.
