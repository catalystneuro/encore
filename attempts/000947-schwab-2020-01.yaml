- claim: fig4-ccf-rare
  outcome: not_reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:fig4-ccf-rare
  notes: By the KS permutation test the peak CCFs exceed those of jittered controls over whole
    recordings (338 pairs, p = 0.003) and during movement (306 pairs, p = 0.045), not at rest (298
    pairs, p = 0.705). Significant pairs are 5.6%, 3.4% and 6.5%, none above 5% by a binomial test,
    and mostly positive (15 of 19 whole, 15 of 20 movement). The shift is small (median peak 0.042
    against a control median of 0.038). The part of the statement that correlations are rare holds;
    the part that peaks are not larger than controls does not. Keeping only pairs with an
    approximate c0 of at most 0.3 leaves 332, 121 and 172 pairs (paper 427, 183 and 172) with KS p =
    0.003, 0.333 and 0.025; one file per pair of presumed neurons gives 0.003, 0.627 and 0.037. The
    significant peaks fall at lags spread over 0 to 10 ms, and GPi and VLa spikes share a sample as
    often as independent trains would (11,376 against 11,435 expected), so shared artefacts do not
    explain the excess. Spike times are at the sample resolution (24414.0625 Hz) in every file. With
    the paper's records, paired when a GPi and a VLa record share a file (329, 298 and 301 pairs),
    the peaks exceed the controls over whole recordings (p = 0.005) and at rest (p = 0.033), not
    during movement (p = 0.203), so the outcome would be the same. Neither pair set matches the
    paper's 427 whole-recording pairs (338 on the dandiset rule, 329 on the paper's records); this
    attempt did not find out how the paper counted its pairs.
  deviations:
  - The paper's exclusion of pairs with a minimum detectable correlation c0 above 0.3 is not applied
    in the main test, which the criterion fixed before the analysis; the paper's simulation is not in
    its deposit. It is shown as a variant, with c0 approximated by a simulation on the CCF counts
    (independent Poisson counts at the pair's expected count, plus an injected peak).
  - Only VLa spikes are jittered; the Methods do not say which train.
- claim: fig4-noise-corr-rare
  outcome: not_reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:fig4-noise-corr-rare
  notes: Absolute noise correlations exceed trial-shuffled controls at rest and during movement (KS
    permutation p < 0.001 in both). 10.1% and 10.8% of pair-targets (17.5% and 18.6% of pairs) are
    significant against 5.4% and 7.2% in the paper. Signs are balanced (38 and 29 at rest, p = 0.33;
    39 and 33 during movement, p = 0.56), as the paper reports. Spike counts drift with trial time
    in many units (VLa 36.1% and 38.3% of pair-targets, Spearman p < 0.05), but with counts linearly
    detrended the excess remains (9.3% and 9.7% significant, KS p < 0.001), and so it does against
    each pair-target's own shuffles (10.8% and 14.2%), with one file per pair of presumed neurons
    (KS p < 0.001) and with the paper's records (9.1% and 7.4% significant, KS p < 0.001 in both).
  deviations:
  - The paper's test statistic for noise correlations is not printed in its code; the KS permutation
    test on absolute correlations was fixed in the criterion before the analysis.
  - Significance uses the 2.5 to 97.5 percentiles of the shuffles pooled over pairs, as the paper's
    code does per time point.
- claim: fig5-vla-decrease-after-gpi-bursts
  outcome: not_reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:fig5-vla-decrease-after-gpi-bursts
  notes: The population VLa rate does not fall below the control band within 300 ms of GPi burst onsets
    (150 pairs, lowest point 2.5% below baseline), burst offsets (150, 1.9%) or pause onsets (110,
    1.9%). Bursts here last 67.1 ms on average and pauses 145.3 ms, against 24 and 195 ms in the
    paper, and 50.7% of pairs show a change after burst onsets against 11.6% in the paper. The same
    per-pair test on the shifted controls gives 47.5%, 47.8% and 47.0%, so the test as the Methods
    describe it is at chance here, and the paper's per-pair test must differ. Computed as Fig5_S14.m
    does (each pair in percent of its baseline, band shifted over 0 to 800 ms), the population rate
    does not fall below the band either (lowest 98.1%, 98.4% and 96.9%). The Methods' rule on noisy
    baselines leaves out more than half of the pairs with at least 5 events (157 of 307 for burst
    onsets and offsets, 143 of 253 for pause onsets). With the paper's records (131, 132 and 86 pairs
    kept) the rate does not fall below the band either. Because the burst detector and the per-pair
    test differ from the paper's, this outcome says little about the paper's finding.
  deviations:
  - Burst and pause detection is a reimplementation of the Legendy and Salcman surprise method; the
    paper's implementation is not in its deposit (Fig5_S14.m plots stored averages and builds the
    control band; it holds no burst detector and no per-pair test).
  - A first run used log10 in the surprise and gave bursts far longer than the paper's; the natural
    log, as in the Methods' formula in the paper's MATLAB, was then used. The notebook shows the
    durations with log10 (bursts 254.0 ms, pauses 237.0 ms) as a variant.
  - The control shifts all events of a pair by one random offset of 2 to 20 s and uses VLa rate in rest
    samples only; the paper does not describe its control for Fig 5.
- claim: behavior-rt-mt
  outcome: reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:behavior-rt-mt
  notes: In the 165 files that hold the units analysed, reaction times differ neither between the
    animals (F = 0.02, p = 0.89) nor between directions (F = 0.69, p = 0.41), and movement durations
    are longer to the right target (Gaia 0.273 against 0.216 s, Isis 0.195 against 0.174 s; p =
    5.8e-38) and longer in Gaia (p = 7.3e-56). Over all 250 pre-MPTP files with trials reaction times
    differ between the animals (F = 15.19, p = 0.00011); over the files of the paper's records they do
    not (F = 3.79, p = 0.053). The paper also reports a significant animal by direction interaction
    for reaction times (p = 0.002), which is not part of the claim; here p = 0.12.
  deviations:
  - The first version used all 250 pre-MPTP files with trials, including files with motor cortex,
    SMA or VLp units only, and gave a reaction-time difference between the animals. After round 1 the
    test was restricted to the 165 files with units of the dandiset rule, the files of the paper's
    data as the dandiset identifies them; the outcome changed from partially reproduced to
    reproduced. All files and the files of the paper's records are shown as variants.
  - Movement durations exist for 20 of the 91 Gaia files used.
  - The observations are file and direction medians (330 for RT); the paper's ANOVA has 452 error
    degrees of freedom and does not say what its observations are. No file set here gives 452 (326
    on the files with units, 496 on all files, 320 on the files of the paper's records), and the
    reaction-time animal effect depends on the files used.
- claim: figs3-emg-onset
  outcome: blocked
  blocked_by: methods_underspecified
  notes: The EMG is not in the dandiset; it is in the paper's Dryad deposit (S3_EMGdata files). The
    Methods do not say how the onset of the EMG change was determined, and FigS3.m only plots the
    trial-averaged EMG with reaction times, so the onsets cannot be recomputed by the paper's method.
- claim: fig1-vla-localization
  outcome: blocked
  blocked_by: data_missing
  notes: The stimulation mapping (responses to GPi, SCP and motor cortex stimulation along electrode
    tracks) is not in the dandiset, which holds task recordings only, nor in the Dryad deposit. The
    files give electrode coordinates and location labels, which do not test the claim. As a proxy
    the notebook compares electrodes labelled VLa and VLp. VLa electrodes lie anterior of VLp ones in
    both animals (p = 6.4e-10 and 5.5e-58) and, by the coordinates as described (ventral positive),
    ventral of them (p = 1.8e-11 and 2e-27), where the claim places VLa dorsal. The files do not say
    how the labels were assigned.
- claim: fig6-simulation
  outcome: blocked
  blocked_by: other
  notes: A simulation that uses no recorded data. The Dryad deposit holds its output (Data_Fig6.mat)
    and a plotting script, but not the model thalamocortical cell or the generator of correlated GPi
    spike trains; reimplementing the model of the paper's reference 103 in XPPAUT was not attempted.
findings:
- kind: selection_undocumented
  statement: The dandiset holds more GPi and VLa units than the paper analysed (268 GPi and 279 VLa
    units under its own labels and the Methods' rate criteria, against 209 and 185) and does not say
    which units the paper kept. The paper's unit list is only in its Dryad deposit.
- kind: identifier_missing
  statement: No identifier links a neuron recorded over consecutive files. 97 of the paper's 394
    units span 2 to 5 files, and the dandiset stores them as separate units.
- kind: metadata_error
  statement: Location labels are inconsistent. GPi and VLa are written GPI and VLA in some files, 54
    Gaia thalamic units are labelled only "Thalamus" (25 of them are VLa units in the paper), and 33
    Isis units have an empty location and no channel id.
- kind: data_missing
  statement: 30 of the 394 units the paper analysed are not among the curated units. 21 of 254
    pre-MPTP files have no curated units. 13 of them hold sorted clusters in processing/ecephys/units
    (124 in all, 16 in G-140813-2), whose only columns are spike times, unit name and location, so
    there is no channel or sort letter to match them; 8 have no such table.
- kind: metadata_error
  statement: In all 254 pre-MPTP files the session_start_time is two days after the date in the
    session_id.
- kind: metadata_insufficient
  statement: Sort labels are letters in some files and numbers in others, and the unit quality column
    is missing from some files and holds free text (for example "B -> C") in others, without a
    description of its values.
- kind: other
  statement: Error trials are flagged only in files with an error_onset_time column (127 of 253 files
    with trials), and movement ends are missing from 87 files, all of them Gaia (32 of 119 Gaia files have them), so
    the Methods' trial exclusion can be applied only in part.
- kind: format_error
  statement: One pre-MPTP file (I-160616-4) has no trials table, though it has 5 curated units and raw
    data, and one spike train is stored twice in I-170518-2, as two M1-S units on channels 40 and 43.
- kind: other
  statement: The pre-MPTP NWB files name the paper only by its bioRxiv preprint (doi:10.1101/546598);
    the dandiset metadata names the published paper.
- kind: data_missing
  statement: The EMG of S3 Fig and the stimulation mapping of Fig 1 are not in the dandiset; the EMG is
    in the paper's Dryad deposit and the mapping is not public.
- kind: metadata_insufficient
  statement: The electrode table's coordinates relative to the anterior commissure (acx_y, acx_z) put
    the electrodes labelled VLa ventral of those labelled VLp, if z is ventral positive as the column
    description says, where the paper places VLa dorsal of VLp. The files do not say how the VLa and
    VLp labels were assigned, so it cannot be told whether the description of the z axis or the
    labels differ from the paper.
- kind: paper_inconsistency
  statement: The Results give 218 VLa units and 94% responsive VLa units where Table 1 gives 185 and
    88.1%; the text gives median onsets of -62 ms for GPi increases and -108 ms for VLa decreases
    (Fig 3C) where Table 1 gives -76 and -95.5 ms.
verifications:
- date: '2026-10-18'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The first executed notebook with the conclusion cells and the summary removed, the
    helper module and the claims file, with the paper. The verifier queried the archive metadata and the
    Zenodo deposit and tested helper functions on synthetic inputs. Its report had no attempt record and
    gave its own outcome for each claim; all 21 agree with the record as reviewed. Cell numbers in the
    reasons are those of the round-1 notebook.
  results:
  - claim: unit-link
    agrees: true
    outcome: reproduced
    reason: 364 of 394 records found (92.4%). SDF r > 0.9 for 94.6% of 724 unit-directions (cell 17).
      Trial counts are equal for only 62.6%, and 25 of the matched paper-VLa units are labelled "Thalamus".
      (Problem 10, not affecting a conclusion) errors cannot be excluded in the files without error_onset_time,
      about half of them.
    response: No change to the outcome. The trial counts and labels were already reported. Problem 10
