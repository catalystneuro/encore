inputs:
- what: The paper's per-unit result files Gaia_Analy.mat and Isis_Analy.mat, which name each analysed
    unit by recording file, channel and sort letter and store its peri-movement SDF, trials and
    detected onsets. Used for the link claim unit-link and for variants with the paper's own unit
    list; no outcome on the paper's findings rests on them. The analysis code read for the method
    (PeriEventChange_SDF_pctchng.m, Fig2_3_S8_S9.m, Fig4_S10to13.m, Fig5_S14.m, FigS2.m, FigS3.m) is
    from the same deposit.
  source: Dryad doi:10.5061/dryad.0cfxpnvxm (version of 2020-08-24), read from its Zenodo mirror,
    record 4000719 (https://zenodo.org/records/4000719), as the Dryad download API requires a token
outcomes:
- claim: unit-link
  outcome: reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:unit-link
  notes: Records are matched by file, channel id and sort letter. 364 of the 394 records the paper's
    code keeps (92.4%) are found in every file they span (Isis GPi 104 of 104, Gaia GPi 95 of 105,
    Gaia VLa 60 of 66, Isis VLa 105 of 119). For 724 matched unit-directions the SDF from the
    dandiset correlates with the stored SDF at a median r of 0.9992, above 0.9 for 94.6%. Valid trial
    counts equal the paper's for 62.6%. Detection agrees on the presence of an increase for 90.9% and
    of a decrease for 80.7% of unit-directions. 25 matched units the paper calls VLa are labelled
    "Thalamus" in the dandiset, and 97 records span 2 to 5 files. On the side of the outside data,
    the paper's list gives 209 GPi and 185 VLa units, as Table 1 does.
  deviations:
  - Trial exclusion follows the Methods (6 median absolute differences from the mean); the paper's
    stored trial counts differ for 37% of unit-directions, by a median of 0.
- claim: table1-unit-counts
  outcome: not_reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:table1-unit-counts
  measured:
  - 268
  - 279
  notes: The dandiset rule gives 268 GPi units (Gaia 137, Isis 131) and 279 VLa units (78 and 201),
    against 209 and 185 (218 in the text). Counting the same channel and sort letter on one day once
    gives 132 and 186; the paper's records found in the dandiset are 199 and 165. That merge joins
    some units the paper kept apart (47 of the 117 merged units spanning several files hold more
    than one of the paper's records). 518 of the 547 units are in files the paper used. Taking the
    rate over the length of the raw recording instead of the span of the spike train would leave out
    2 more GPi units. The dandiset holds more units than the paper analysed and
    does not say which were kept or which units in consecutive files are one neuron.
  deviations:
  - Units are selected by the dandiset's location labels and the Methods' rate and trial criteria;
    the paper's anatomical criteria (within 0.5 mm of an M1-responsive site, the VLa border) cannot
    be applied from the files.
  - Each file's unit is counted once; the paper pools a neuron recorded over consecutive files.
