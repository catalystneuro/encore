inputs:
- what: The paper's per-unit result files Gaia_Analy.mat and Isis_Analy.mat, which name each analysed
    unit by recording file, channel and sort letter and store its peri-movement SDF, trials and
    detected onsets. Used for the link claim unit-link and for variants with the paper's own unit
    list; no outcome on the paper's findings rests on them. The analysis code read for the method
    (PeriEventChange_SDF_pctchng.m, Fig2_3_S8_S9.m, Fig4_S10to13.m, Fig5_S14.m, FigS2.m, FigS3.m) is
    from the same deposit.
  source: Dryad doi:10.5061/dryad.0cfxpnvxm (version of 2020-08-24), read from its Zenodo mirror,
    record 4000719 (https://zenodo.org/records/4000719), as the Dryad download API requires a token
outcomes:
- claim: unit-link
  outcome: reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:unit-link
  notes: Records are matched by file, channel id and sort letter. 364 of the 394 records the paper's
    code keeps (92.4%) are found in every file they span (Isis GPi 104 of 104, Gaia GPi 95 of 105,
    Gaia VLa 60 of 66, Isis VLa 105 of 119). For 724 matched unit-directions the SDF from the
    dandiset correlates with the stored SDF at a median r of 0.9992, above 0.9 for 94.6%. Valid trial
    counts equal the paper's for 62.6%. Detection agrees on the presence of an increase for 90.9% and
    of a decrease for 80.7% of unit-directions. 25 matched units the paper calls VLa are labelled
    "Thalamus" in the dandiset, and 97 records span 2 to 5 files. On the side of the outside data,
    the paper's list gives 209 GPi and 185 VLa units, as Table 1 does.
  deviations:
  - Trial exclusion follows the Methods (6 median absolute differences from the mean); the paper's
    stored trial counts differ for 37% of unit-directions, by a median of 0.
- claim: table1-unit-counts
  outcome: not_reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:table1-unit-counts
  measured:
  - 268
  - 279
  notes: The dandiset rule gives 268 GPi units (Gaia 137, Isis 131) and 279 VLa units (78 and 201),
    against 209 and 185 (218 in the text). Counting the same channel and sort letter on one day once
    gives 132 and 186; the paper's records found in the dandiset are 199 and 165. 518 of the 547
    units are in files the paper used. The dandiset holds more units than the paper analysed and
    does not say which were kept or which units in consecutive files are one neuron.
  deviations:
  - Units are selected by the dandiset's location labels and the Methods' rate and trial criteria;
    the paper's anatomical criteria (within 0.5 mm of an M1-responsive site, the VLa border) cannot
    be applied from the files.
  - Each file's unit is counted once; the paper pools a neuron recorded over consecutive files.
- claim: table1-rest-rate
  outcome: reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:table1-rest-rate
  measured:
  - 75.65
  - 12.78
  notes: Mean rest rate over unit-directions 75.65 spikes/s in GPi (531) and 12.78 in VLa (552), GPi
    higher with rank sum p = 1.2e-171. The animals differ slightly in GPi (73.17 and 78.25, p =
    0.041), where the paper reports no difference; not in VLa (p = 0.53). With the paper's records
    64.26 and 13.53.
  deviations:
  - Unit selection by the dandiset rule (see table1-unit-counts).
- claim: table1-ap-width
  outcome: reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:table1-ap-width
  measured:
  - 0.247
  - 0.509
  notes: Mean trough-to-peak width 0.247 ms in GPi and 0.509 ms in VLa, 532 of 547 units measured,
    rank sum p = 2.9e-37.
  deviations:
  - Widths come from the dandiset's 200 Hz high-pass filtered traces (the paper filtered at 300 Hz)
    and from the spikes in one stored chunk (about 3.2 s, median 273 spikes) per file and series.
- claim: hold-period-ramps
  outcome: partially_reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:hold-period-ramps
  measured:
  - 98.5
  - 98.6
  notes: 98.5% of GPi and 98.6% of VLa units have a significant control-period slope (97.0% and 97.5%
    at alpha 0.01), and 49.9% of significant slopes are positive. GPi and VLa slopes differ (mean
    -0.598 against 0.233 spikes/s2, rank sum p = 0.042), where the paper finds no difference (p =
    0.29); with the paper's records they do not (p = 0.19).
  deviations:
  - The criterion did not define a partial outcome; the outcome is partial because the first part
    (ramps are common) holds and the second (no difference between areas) does not.
- claim: mvt-responsive-fraction
  outcome: reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:mvt-responsive-fraction
  measured:
  - 98.5
  - 97.5
  notes: 264 of 268 GPi (98.5%) and 272 of 279 VLa units (97.5%) respond in at least one direction.
    VLa matches the text's 94% but not Table 1's 88.1%; the criterion accepts either reading. With
    alpha 0.0001 the fractions with an increase alone are 81.0% and 77.4%.
  deviations:
  - The paper gives 88.1% (Table 1) and 94% (text) for VLa; both readings were listed and only the
    text's matches.
- claim: increases-most-common
  outcome: partially_reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:increases-most-common
  measured:
  - 46.9
  - 50.9
  - 58.8
  - 60.2
  notes: Monophasic increase is the most common form in GPi (46.9%) and VLa (50.9%), and increases
    are 58.8% and 60.2% of changes (746 of 1254 overall, binomial p = 1.9e-11). The GPi values are
    within tolerance; the VLa values are below 65.3% and 68.8% by more than 10%, also with the paper's
    records (54.1% and 61.4%).
  deviations:
  - Detrending of the control period and the ISI function are implemented here from the Methods;
    the paper's own implementation of these steps is not in its deposit.
- claim: monophasic-more-in-vla
  outcome: not_reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:monophasic-more-in-vla
  measured:
  - 71.0
  - 76.7
  notes: Monophasic responses are 71.0% in GPi and 76.7% in VLa, chi-squared p = 0.051, and VLa is
    outside tolerance. With the paper's records 69.0% and 81.2% (p = 0.00036), both within tolerance,
    so the outcome depends on the selection of units.
  deviations:
  - Unit selection by the dandiset rule (see table1-unit-counts).
- claim: integrated-change-positive
  outcome: partially_reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:integrated-change-positive
  measured:
  - 3.07
  - 1.50
  notes: The mean integrated change is positive in GPi (3.07 spikes, signed rank p = 1.1e-10) and VLa
    (1.50 spikes, p = 3.7e-18), both more than 10% below 3.89 and 1.75. With the paper's records 3.42
    and 1.97.
  deviations:
