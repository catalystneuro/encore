- claim: fig3a-vla-leads-gpi
  outcome: not_reproduced
  notebook: reproduce_schwab_2020.ipynb
  output: claim:fig3a-vla-leads-gpi
  measured:
  - -48
  - -67
  notes: Median onsets of all changes are -48 ms in GPi (641) and -67 ms in VLa (613); GPi is later by
    19 ms without significance (rank sum p = 0.079), and the VLa median is outside tolerance. In
