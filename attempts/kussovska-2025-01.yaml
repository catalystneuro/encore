- claim: fig1e-load-modulated-neurons
  outcome: reproduced
  notebook: reproduce_kussovska_2025.ipynb
  output: claim:fig1e-load-modulated-neurons
  measured:
  - 20.4
  - 18.75
  - 10.53
  notes: Reading (a) with the code's shared permutation gives preSMA 20.40% (p = 0.000), vmPFC 18.75%
    (p = 0.009), dACC 10.53% (p = 0.025), all within tolerance; the within-participant permutation gives
    19.20%, 18.75%, 9.94% (p 0.000 to 0.018). With all trials (reading b) 22.80%, 21.88% and 12.87%, all
    significant. AMY and HPC are not significant under any reading.
  deviations:
  - The GLM is fitted by Newton's method in place of sklearn's PoissonRegressor; the largest slope difference
    over 21 checked neurons is 1.1e-04.
  - The code's p is the fraction of null counts at or above the observed count without + 1, so p = 0.000
    is printed where the paper gives 0.001.
- claim: fig1f-rt-modulation-not-significant
  outcome: not_reproduced
  notebook: reproduce_kussovska_2025.ipynb
  output: claim:fig1f-rt-modulation-not-significant
  measured:
  - 8.88
  - 17.2
  - 6.25
  notes: With each trial's own RT (the criterion's main analysis) the BH-corrected count test is significant
    for preSMA (p_BH 0.000), AMY (0.048) and dACC (0.048) under reading (a) with the shared permutation,
    and for four regions with all trials; percentages AMY 8.88%, preSMA 17.20%, vmPFC 6.25%. The code's
    predictor, subject 1's RT vector applied to every neuron, gives AMY 5.79%, preSMA 8.00% and vmPFC
    6.25%, the paper's three values exactly, and no region significant after correction (smallest p_BH
    0.40), so the paper's numbers come from that predictor.
