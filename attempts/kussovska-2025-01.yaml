findings:
- kind: code_mismatch
  statement: The paper's GLM code (01_task/main_1e,f.py:9 and 113) uses subject 1's reaction times as
    the predictor for every neuron of every participant. The RT-modulation percentages of Fig. 1f (AMY
    5.79%, preSMA 8.00%, vmPFC 6.25%) are reproduced exactly only with that predictor; with each trial's
    own reaction time preSMA, AMY and dACC have significant proportions of RT-modulated neurons after
    correction.
- kind: selection_undocumented
  statement: The matched trial sets of the Methods (96 load-matched and 75 identity-matched trials per
    participant) exist only as the code's tables data/new_trial_info.xlsx and data/new_trial_final.xlsx;
    no script builds them and the paper does not say how they were chosen. Pseudo-population decoding
    accuracies depend on which trials enter (random draws of six trials per image give 56.7 to 86.7% at
    1000 ms against 76.67% with the code's table).
- kind: other
  statement: The paper states that sixteen participants completed 135 trials and five completed 108; the
    dandiset has fifteen sessions of 135 trials and six of 108 (subjects 6, 7, 8, 9, 16 and 19).
- kind: metadata_error
  statement: In sub-9's Sternberg file one trial (row 29) has timestamps_Maintenance equal to timestamps_Probe,
    a maintenance of 0 s, against 2.53 to 2.84 s in every other trial.
- kind: other
  statement: The duration of the first encoding image differs by session, 1.0, 1.2, 1.5 or 2.5 s (from
    timestamps_Encoding1 to timestamps_Encoding1_end), which the paper does not state; its analyses use
    a 1 s encoding window. Fixation lasts about 0.91 to 1.2 s in most sessions, with single longer fixations
    up to 14.07 s, where the paper gives 0.9 to 1.0 s.
- kind: code_mismatch
  statement: The code's epoch burst analysis (04_bursting/main_4f-k,6c,d.py:216-219) assigns maintenance
    bursts to M1, M2 and M3 by thirds of the whole concatenated train, that is by thirds of the trials,
    while the Methods define three consecutive 1 s windows from maintenance onset. The burst counts per
    window differ between the two.
- kind: code_mismatch
  statement: The column the code reports as CV2 for Fig. 5h (02_trial_info.py:42-46) is the plain coefficient
    of variation of the interspike intervals, not Holt's local CV2 that the Methods cite; the paper's
    values (PY 1.673, IN 1.319) match the plain CV.
- kind: methods_unavailable
  statement: 'Question for the authors: which peak rule detects population bursts, a smoothed value above
    the 90th percentile (Methods) or a prominence at or above it (Results and code), and what are the
    threshold of the surrogates and the minimum spacing (140 ms in the Methods, 70 ms in the Results)?
    Fig. 4c is reproduced under the Methods'' height rule with the Methods'' groups, and fails narrowly
    under the code''s prominence rule, where concept cells also differ from the null.'
- kind: methods_unavailable
  statement: 'Question for the authors: what is the ''label-shuffled null'' of Fig. 6a,b, whose legend
    names rate-matched Poisson surrogates? Under the Poisson null interneurons exceed the null in encoding,
    and under a shuffle of cell-type labels within participant they fall below it.'
- kind: methods_unavailable
  statement: 'Question for the authors: which decay time constants are compared between preferred and
    nonpreferred trials in Extended Data Fig. 5g,h? The code reads them from a shipped table (decay_constant_change.xlsx)
    that no script computes; ACG tau_decay per trial type shows no effect here.'
- kind: methods_unavailable
  statement: 'Question for the authors: how is the ''temporal extent'' of a cross-temporal cluster measured
    for the 1,000-shuffle cluster-duration null, and is the binomial test one- or two-sided (Methods,
    Population decoding, says two-sided; Statistical analyses and the code, one-sided)? Here the shuffled
    maps had no cluster, so the choice did not matter.'
- kind: other
  statement: The ACG features of the code's shipped Cell_metrics.xlsx (firing rate, normalised mean ACG,
    burst index, ISI CV) are recomputed from the dandiset's spike times to within 1% for 99% of units,
    using every spike of the unit; the fitted R2 and time constants come from MATLAB's optimizer and differ
    for part of the units in a scipy port, which gives 316 well-fit units in place of 294 (317 in an earlier
    run of the same code, so one unit lies at the threshold).
- kind: code_mismatch
  statement: The code's maintenance burst test (04_bursting/main_4c,d,6a,b.py, TRIAL_WIN = 2.8 at line
    13, surrogate times uniform on [0, TRIAL_WIN] at lines 288-289) concatenates maintenance trials with
