- claim: fig4c-encoding-bursts-vs-poisson
  outcome: reproduced
  notebook: reproduce_kussovska_2025.ipynb
  output: claim:fig4c-encoding-bursts-vs-poisson
  assumed: true
  notes: Under the Methods' groups with the height rule, the real threshold and a spacing of 1 bin, all
    neurons (W = 14, BH p 0.0054) and low ACG (W = 7, 0.0483) differ from the Poisson null and the other
    four groups do not (BH p 0.36 to 0.89); with a spacing of 2 bins low ACG has BH p 0.060. Under the
    code's groups with the prominence rule all neurons and low ACG differ but concept cells do too (BH
    p 0.045); with the Methods' groups and prominence every group but concept cells differs; with the
    code's groups and the height rule low ACG does not differ. The outcome rests on one named reading,
    the height rule, under which low ACG neurons burst less than high ACG neurons (fig4-acg-group-differences),
    so no single peak rule supports Fig. 4 as a whole.
  deviations:
  - Cell types and ACG groups downstream use reading (a) of acg-fit-yield (every spike of the unit), assumed
    because the code's shipped Cell_metrics.xlsx equals it in firing rate and ISI CV and agrees within
    1% in normalised mean ACG and burst index for 99% of neurons; the ACG fit is a scipy port of the MATLAB
    fit, so the types (102 PY, 214 IN) differ from the paper's 92 and 202. Each claim on cell types is
    also run with the types of reading (b) (100 PY, 198 IN, within tolerance).
  - Concept cells are the code's bootstrap (reading b of concept-cells-count) with seed 0, a standard
    choice since the code sets no seed; 57 of its 58 cells are in the code's shipped list.
  - Wilcoxon tests against the Poisson null use the code's settings (zero_method pratt, asymptotic; main_4c,d,6a,b.py:440);
    epoch comparisons the code's defaults (zero_method wilcox).
  - Surrogates use stable per-group seeds; the code's 100 surrogates are kept.
