- claim: fig4abc-tuning-correlation-single-electrode
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds only array recordings from one session of monkey J. The
    single-electrode recordings of monkeys A, B and J (64, 74 and 172 units) are not in it, and
    no other dandiset or public deposit of them is named by the paper or the archive.
- claim: fig4d-tuning-correlation-j-array
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig4d-tuning-correlation-j-array
  measured:
  - 0.195
  - 0.212
  notes: Under the main reading 20 of 162 units pass the inclusion criterion (more than 5
    spikes/s of preparatory tuning, as a range) and the 1.5 times peri-movement criterion. Mean
    Pearson r 0.195 and mean Spearman r 0.212, both above tolerance (0.13 +/- 0.013 and 0.11 +/-
    0.011); the mean r is above zero by all three tests (t-test p = 0.023, on Fisher z p = 0.023,
    Wilcoxon p = 0.024), which the criterion calls a partial reproduction. Over the eight
    trial-selection and onset readings with a result, mean r is 0.105 to 0.195 (within tolerance
    in five), mean Spearman r 0.146 to 0.212 (within tolerance in none), and the mean r is above
    zero at p < 0.05 in two; in the other six the smallest p of the three tests is 0.074 to 0.169,
    so those readings give not reproduced. With tuning as the SD across conditions no unit
    passes. With a ratio of 1.0 in place of 1.5, 52 units give mean r 0.137 (p = 0.0041). The
    correlation is positive and small, as the paper says; its size and significance at 27
    conditions depend on the readings.
  deviations:
  - The dandiset holds 27 of the 108 conditions and 500 trials (11 to 18 per condition after
    selection) where the paper's J-array dataset had a mean 2166 trials per neuron; it has 162
    units where the paper reports 146.
  - Assumed main reading, as the readings give different outcomes. Trials are those whose
    concatenated horizontal and vertical velocity profile (movement onset -150 to +800 ms)
    correlates with the condition's mean profile at r > 0.9 (Supplemental Experimental
    Procedures, Task design; the window and how the two axes combine are not stated). Requiring
    each axis to pass keeps 81% of trials and leaves 2 or 3 trials in some conditions, as one
    velocity component of nearly vertical or horizontal reaches is mostly noise; the
    concatenated test keeps 96%, and the paper reports "typically ~90%" with outliers only
    occasional. Movement onset is the trial table's `move_onset_time`; the paper refers to
    Churchland et al. 2006c, not available here, and the speed-threshold reading (10% of peak
    speed, a median 14 ms later) is also run.
  - Tuning in spikes/s is taken as the range of condition means. The SD reading leaves 6 or 7 of
    162 units above 5 spikes/s, which does not fit a criterion the paper describes as lower than
    for single electrodes to suit array data (Methods, Neural recordings and datasets).
  - The test of the mean against zero is not named; the three readings of the claims file are
    run and agree under the main reading.
- claim: fig4e-correlation-time-course
  outcome: not_reproduced
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig4e-correlation-time-course
  measured: 0.218
  notes: Mean correlation over the 20 Figure 4D units is 0.773 at -400 ms, 0.764 at -300 ms,
    0.713 at -250 ms, 0.572 at -200 ms and 0.218 at movement onset; it falls below 0.1 only
    between +150 and +200 ms (0.110, 0.064). The decline starts about 250 ms before onset and
    the value at onset is below half of that at -250 ms, as the criterion asks, but it is not
    below 0.1 at onset. All eight readings give 0.129 to 0.218 at onset and meet the other two
    parts. The measured value is the correlation at movement onset under the main reading.
  deviations:
  - The rate at each time point comes from the movement-locked average, the part of the paper's
    spliced trace locked to movement onset (Supplemental Experimental Procedures, Computing the
    mean firing rate versus time); the paper chose the splice points to minimise
    discontinuities and does not give them. The go-locked curve is shown alongside.
  - 27 of 108 conditions and 20 units, as for fig4d-tuning-correlation-j-array.
- claim: results-ap-location-no-effect
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:results-ap-location-no-effect
  notes: Only the J-array dataset can be tested. Regressing the per-unit correlation of Figure 4D
    on array (prefix 1 coded anterior) gives r = 0.047, p = 0.844 under the main reading (12
    anterior and 8 posterior units, mean r 0.209 and 0.176), and p from 0.432 to 0.844 over the
    eight readings, so no reading finds an effect at p < 0.05. The paper reports r = 0.20,
    p = 0.27 for J-array. The other three datasets are not in the dandiset.
  deviations:
  - Electrode coordinates are NaN, so reading (a), the AP coordinate on the array, cannot be
    run. Reading (b), array membership, is used.
  - Assumed array of each unit. Every unit references an electrode of the PMd group, but the
    unit ids carry a prefix (1 for 83 units, 2 for 79) and a channel, and the referenced
    electrode is the channel minus one for both prefixes. The prefix is taken as the array, and
    prefix 1 as PMd, the group the references name. Prefix 1 units also have more preparatory
    tuning (median range 6.71 against 4.79 spikes/s), consistent with the paper's remark that
    preparatory activity is more prevalent at anterior sites. Swapping the arrays would only flip
    the sign of r.
  - Monkeys A, B and J (single-electrode) are not tested.
- claim: supp-preparatory-dimensionality
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:supp-preparatory-dimensionality
  measured: 11
  notes: Under the main reading 11 components capture 90% of the variance of the 27 x 162
    matrix of preparatory condition means, inside the widened range 6.3 to 11, and 10 with the
    92 included units. Under the per-axis trial selection the counts are 12 (outside) and 11;
