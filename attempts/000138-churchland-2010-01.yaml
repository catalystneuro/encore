- claim: fig7a-shuffled-space-poor
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig7a-shuffled-space-poor
  notes: Under the main reading, over 20 draws, the shuffled space's best mean performance is
    0.014 (k = 3), below the peri-movement space at every k and below the kinematic space's best
