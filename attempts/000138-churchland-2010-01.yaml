- claim: fig6-peri-movement-space-best
  outcome: reproduced
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig6-peri-movement-space-best
  notes: Under the main reading, over 92 included units, the peri-movement space's best mean
    performance is 0.351 (k = 10), above the kinematic space (0.103, k = 4) and every task space
    (best, kitchen sink, 0.250). Over the 2048 combinations of readings it is best in 1468; the
    criterion asks for one combination. It is best in 95% of combinations with tuning as a range
    and 49% with the SD (6 or 7 units), and in 94% with all units in the T-matrix against 50%
    with included units only. Best k is 7 or more in 1776 of 2048 combinations. EMG was not
    recorded for J-array.
  deviations:
  - Only J-array, on 27 of 108 conditions; the claim says "for every dataset" and the other
    three are not in the dandiset.
  - Task spaces are measured on each condition's mean hand trajectory from movement onset to the
    reach end (standard choice; the paper speaks of the "average endpoint and peak velocity for
    each condition"). Acceleration for the kinematic space is the derivative of the mean velocity
    (standard choice). Replicating the six kinematic variables to the number of units gives the
    same PD fits, so they are used once.
  - Movement onset, trial selection and tuning as in fig4d-tuning-correlation-j-array; every
    reading is run.
- claim: fig6-each-dimensionality
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig6-each-dimensionality
  notes: Under the main reading the peri-movement space wins 20 of 22 comparisons (0.909, at
    least 0.8 needed) and beats endpoints + max speed at k = 3 (0.126 against 0.0003). Over all
    combinations the criterion is met in 1074 of 2048 (share won from 0 to 1, median 0.85). It is
    met in 69% of combinations with the concatenated trial selection and 36% with the per-axis
    one, 75% and 30% for tuning as range or SD, 67% and 38% for all or included units in the
    T-matrix, and 37% and 68% with the space computed once or refit. The kinematic space at
    k = 1 and k = 14 is the one it loses to under the main reading (by 0.005 and 0.004).
  deviations:
  - Assumed main reading, as the readings give different outcomes. Besides the readings of
    fig4d-tuning-correlation-j-array, the PCA space is computed once from all conditions, and
    only the PD fit leaves a condition out. The Methods say "One condition was left out and we
    found the PD that best captured tuning for the remaining conditions", the Results say "we
    computed the PD based on all but one condition", and both describe leaving out a condition
    only for the PD; Figure 5 plots the left-out conditions in the same space. All units enter
    the T-matrix ("neurons with weak peri-movement activity were included", Methods, PCA-based
    spaces). Performance is averaged over units ("Performance (averaged across neurons)",
    Results, PD performance in a variety of spaces).
  - Only J-array, on 27 of 108 conditions.
- claim: fig6-dimensionality-trend
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig6-dimensionality-trend
