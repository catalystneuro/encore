- claim: fig7c-anterior-posterior
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig7c-anterior-posterior
  notes: Under the main reading, with the upper limit from the preparatory PCA space of the other
    units in each subset at k = 6, normalized performance is 0.785 for the anterior array (55
    included units) and 0.814 for the posterior array (37), against 0.961 for random halves, ratios
    of 0.817 and 0.847, both outside the 10% bound. None of the 8 counted combinations of readings
    (upper limit at k = 6 or best k, space once or refit, trial selection, T-matrix units) meets
    the criterion. The 2 rows that do both put the unit's own rate in its upper-limit space, which
    is shown but not counted. Under the main reading anterior is below posterior (0.785 against
    0.814), where the paper reports anterior slightly better. The 40 random halves spread widely
    (SD 0.190, 5th to 95th percentile 0.746 to 1.252, under the main reading), and both arrays lie
    inside that spread, so the 10% bound is narrower than the sampling noise of a random half at
    these unit counts. Under the per-axis selection at k = 6 the random-half mean is -0.826 with
    SD 10.8, as an upper limit near zero in some half makes the ratio unstable.
  deviations:
  - Assumed array of each unit from the id prefix, as for results-ap-location-no-effect; with a
    binary location, the median split gives the two arrays.
  - The upper-limit space is "derived from the preparatory activity of all neurons" on "the
    assumption that this must approximate the right space (whatever one neuron is tuned for, it
    ought to be shared with at least some of the other neurons)" (Supplemental Experimental
    Procedures, Estimating the upper limit). The justification compares a neuron with the others,
    so the unit being fit is left out of the space, as for the peri-movement space. With the
    unit's own rate in the space the PD is fit to a space that contains the rate itself; those rows
    are shown and not counted. Whether the space is taken at k = 6 or its best k is open in the
    claims file; both are run.
  - Random halves are 20 random splits of all units, 40 halves; the paper does not say how many.
  - Judged on J-array alone, where Figure 7C averages the datasets.
- claim: fig7d-pd-consistency
  outcome: reproduced
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig7d-pd-consistency
  notes: Under the main reading, over 92 units and 100 draws each, the peri-movement space has the
    higher mean consistency in all three comparisons, 0.756 against 0.610 (endpoints + max speed,
    k = 3), 0.684 against 0.570 (segment directions, k = 6) and 0.748 against 0.666 (kinematic,
    k = 4, its best k). It is higher in every comparison under all eight variants of the readings
    and with the axes as they are or scaled to unit SD, so the outcome does not rest on these
    choices. EMG was not recorded for J-array.
  deviations:
  - Only J-array; the claim covers four datasets.
  - The spaces are computed once from all 27 conditions; whether axes are scaled before the PD is
    fitted is not stated, and both are run.
  - With 27 conditions, a draw of 25 with replacement holds a mean 16.5 distinct conditions and
    two draws share a mean 10.1, so the two PDs are fitted to overlapping data more than with the
    paper's 108 conditions, which raises consistency in both kinds of space.
- claim: fig8-oscillator-model
  outcome: reproduced
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig8-oscillator-model
  measured: 0.012
  notes: A simulation with no recorded data. Over 1000 draws of 25 initial states, the
    correlation between unit 1's held state and its mean released activity has a median of
    -0.019 to 0.012 and a central 95% of about -0.41 to 0.40 under each reading (uniform or
    Gaussian initial states, a full or half cycle), which contains 0.08. A PD in the 2-D PCA space
    of the released activity of both units captures unit 1's initial state with leave-one-out
    performance 1.0 in every draw. The measured value is the median r under the first reading.
  deviations:
  - The paper's 0.08 comes from one draw; the criterion judges it against the distribution over
    draws.
  - The hold lasts 50 steps (it cannot change the result, as the held state is constant).
findings:
- kind: data_missing
  statement: The dandiset holds one session of monkey J's array recordings on the maze task, cut
    to 500 trials over 27 conditions for the Neural Latents Benchmark. The paper's J-array
    dataset had 108 conditions and a mean 2166 trials per neuron, and its single-electrode
    datasets of monkeys A, B and J and all EMG recordings are not in the dandiset, so two of the
    paper's main findings cannot be tested and the rest only on J-array.
- kind: metadata_error
  statement: Every unit's electrode reference points into the PMd group of the electrodes table.
    The unit ids encode a prefix (1 for 83 units, 2 for 79) and a channel, and the referenced
    electrode is the channel minus one for both prefixes, so the 79 units of one array reference
    electrodes of the other. The heldout units split 20 and 20 between the prefixes.
- kind: metadata_insufficient
  statement: Which id prefix is the PMd array and which the M1 array is not stated, and all
    electrode coordinates (x, y, z) are NaN, so neither array membership nor position on the
    array can be read from the files. Anterior-posterior analyses here rest on an assumption.
- kind: identifier_missing
  statement: Nothing in the dandiset or the paper says whether the 2009-10-06 session is the one
    behind the paper's J-array dataset. The file has 162 units where the paper reports 146
    isolations, and 27 of its 108 conditions.
- kind: other
  statement: Hand, cursor and eye position are at 1 kHz and only within trials, where the paper
    tracked the hand at 60 Hz and the eye at 240 Hz; the resampling is not described. Hand
    velocity agrees with the derivative of hand position (slope 1.000).
- kind: other
  statement: Eight trials have a delay of 0 ms or less (down to -2 ms), where the `delay` field is
    described as the delay between target presentation and go cue.
- kind: paper_inconsistency
  statement: The mean trials per neuron of the J-array dataset is 2166 in the Results and 2155 in
    the Methods.
- kind: methods_unavailable
  statement: Question for the paper's authors. Is the PCA space (peri-movement and kinematic)
    computed once from all conditions, with only the PD regression leaving a condition out, or
    recomputed without the left-out condition? Computed once, performance peaks at k = 10 and
    falls beyond (as the paper reports); recomputed, it keeps rising to k = 14, and the outcomes of
    fig6-each-dimensionality, fig6-dimensionality-trend, fig7a and fig7c change. This attempt
    assumed the space is computed once.
- kind: methods_unavailable
  statement: Question for the paper's authors. How was the maze proto-trial defined, over which
    window, and did the horizontal and vertical profiles each need r > 0.9 or the two together?
    Requiring each keeps 81% of trials here and leaves 2 or 3 trials in some conditions; the
    concatenated profile keeps 96%; the paper says about 90%. The fig4d result moves between mean
    r 0.105 and 0.195 across these readings and the movement onset method. This attempt assumed
    the condition's mean profile, the concatenated test and the window -150 to +800 ms.
- kind: methods_unavailable
  statement: Question for the paper's authors. What does "spikes/s of preparatory tuning" measure
    (the range of condition means, their SD, or another quantity), and how was movement onset
    detected? With the range, 92 of 162 units pass the 5 spikes/s criterion; with the SD, 6. This
    attempt assumed the range and used the dataset's movement onset times.
- kind: methods_unavailable
  statement: Question for the paper's authors. For Figure 7C, did the upper-limit space of a
    subset include the neuron being fit, and at which dimensionality was it taken? The
    normalized posterior performance relative to random halves is 0.85 without the neuron at
    k = 6 and 0.62 with it; this attempt assumed it left out, as the stated justification compares
    a neuron with the others.
