    paired t-tests, and its commented permutationTest.m is unpaired), and which encoding periods
    form the encoding rate. The passages are Methods, "Cell selection, probe cells" and the
    code's NWB_calcSelective_SB.m. The question is put to the paper's authors (findings).
findings:
- kind: paper_inconsistency
  statement: The text gives 449 MTL units for the screening task. The screening files hold 421 MTL
    units (159 hippocampus, 262 amygdala), which agrees with the paper's own screening percentages
    (138 is 32.78% of 421); 449 is the Sternberg MTL count.
- kind: paper_inconsistency
  statement: The persistent activity values in the text (4.76 plus or minus 4.71 against 2.67 plus
    or minus 3.66 Hz, preferred against non-preferred trials "during the maintenance period") are
    reproduced exactly by the rates 200 to 1000 ms after Encoding 1 onset of all 119 concept cells
    of the code's parametric test, split by whether the Encoding 1 image is the preferred one. In
    the maintenance window the same cells fire at 3.05 against 2.70 Hz. The released code computes
    these Encoding 1 rates under the names hzPref and hzNonPref, with a mask that, as written,
    selects every trial as preferred (per the claims file's reading of NWB_calcSelective_SB.m).
- kind: methods_unavailable
  statement: Question for the authors. The Methods name permutation tests for the concept,
    maintenance and probe cells, while the released code runs parametric tests (anovan, paired
    t-tests) and keeps the permutation versions in comments; the parametric tests reproduce every
    published count exactly here (138, 26, 94, 144, 122). Were the published counts computed with
    the parametric tests? If permutation tests were used, how many permutations, and were the
    probe and maintenance comparisons paired by trial (sign flipping) or unpaired (label
    shuffling)? For the probe cells the choice decides whether the count matches (118 or 111
    paired, 109 or 104 unpaired, against 122), and the encoding rate (all encoding periods shown,
    or Encoding 1 only) is also not stated.
- kind: selection_undocumented
  statement: The reported ISI violation spread (0.41 plus or minus 0.50%) is matched only after
    leaving out units with 4% or more violations, as NWB_QA_graphs.m does (one unit, at 11.74%);
    over all units it is 0.43 plus or minus 0.63%. The reaction time ANOVA uses correct trials only,
    as the code does; neither filter is stated in the paper.
- kind: format_error
  statement: Four units have spike times out of order, each with one backward step. Screening
    files of subject 11 (units 26 and 32, steps of 9.8 and 12.4 ms) and subject 5 (unit 18, 0.9
    ms), and the Sternberg file of subject 2 (unit 22, 0.3 ms). NWB expects spike times in
    ascending order.
- kind: metadata_error
  statement: Column descriptions in the units and trials tables are wrong. `waveforms_mean_proj_dist`
    is described as "Cluster Isolation distance, computed using all waveforms in the cluster"
    (the description of `waveforms_isolation_distance`), and `loadsEnc3_PicIDs` as "Picture ID
    for Enc1 loads". Every column of the electrodes table but `id` is described as "my description".
- kind: metadata_insufficient
  statement: Subjects 13 and 14 have the native IDs P39CS and P39CS_2, the same age (26), sex and
    recording year, and Table 1 gives the same diagnosis. Neither the files nor the paper say
    whether they are the same patient, so the count of 21 patients may be 20.
- kind: other
  statement: Two Sternberg trials have implausible timestamps. In one trial of subject 9 (load 1)
    Encoding 1 lasts 2.5 s and the maintenance and probe onsets fall at the same time (529.288 s),
    so it has no maintenance period. In another trial of subject 9 (load 3) the fixation cross and
    Encoding 1 onsets are 0.03 ms apart (1189.469 s), so the baseline window falls on the image. In
    one trial of subject 21 the fixation cross lasts 14.07 s, against the 0.9 to 1 s the paper
    describes (the 1st and 99th percentiles over trials are 0.93 and 1.20 s). All three are
    included in the analysis, as the code includes them; leaving them out does not change the persistent activity result.
