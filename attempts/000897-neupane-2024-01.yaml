- claim: ed2c-pi-error-below-correct
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_neupane_2024.ipynb
  output: claim:ed2c-pi-error-below-correct
  notes: With the Methods' error trials (first attempt of two-attempt trials) and the code's neuron
    selection (PI at 650 ms above the surrogate threshold), correct-trial PI exceeds error-trial PI
    at p < 0.0001 in 3 of 4 groups (A -1 t = 5.24, n = 21; A 1 t = 5.21, n = 26; M 1 t = 4.67,
    n = 35); M -1 has p = 0.012 (n = 26). With the Results' selection (periodicity in 0.60 to 0.70
    s) 1 of 4 groups reaches p < 0.0001, all four in the same direction (p 5.7e-07 to 0.0095). With
    the code's error trials all four groups meet it under the code's selection.
  deviations:
  - The neuron readings give different outcomes (3 of 4 groups under the code's, 1 of 4 under the
    Results'). The code's selection is adopted, as it tests periodicity at 0.65 s, which is what the
    claim names.
  - Periodic units are those of fig2-periodic-proportion's main reading, which rests on an
    assumption.
  - Error productions longer than 5 s are left out so that every trial fits the ACG's FFT; the
    longest correct vector is 3.25 s.
  - Groups have 21 to 39 neurons against the paper's 66 to 104, as the dandiset holds about half of
    the sessions.
