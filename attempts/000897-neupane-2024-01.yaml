- claim: fig2-periodic-proportion
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_neupane_2024.ipynb
  output: claim:fig2-periodic-proportion
  measured:
  - 88
  - 124
  - 34.7
  notes: Under the main reading (code's score against the surrogate scores, null with the session's
    own trial durations, Methods lags) 88 of 364 units in monkey A (24.2%) and 124 of 729 in monkey M
    (17.0%) are periodic, against the paper's 37.6% and 36.0%; the highest session proportion is
    34.7%. Across all twelve readings no monkey's proportion is within 10% of the paper's; a2
    readings give 9.1 to 24.2% (A) and 8.2 to 17.0% (M), a1 at most 4.9% and 0.8%, and b (PI above
    the surrogate at any lag) 78.0 to 81.3% and 58.0 to 60.6%, with session maxima of 87.5 to 95.3%.
    Under a1 and a2 the session range holds, so at most one of the three conditions holds under any
    reading. Without units labelled noise, 28.0% of monkey A units are periodic under the main
    reading.
  deviations:
  - The dandiset holds 6 of 17 monkey A sessions and 9 of 15 monkey M sessions, so the counts are
    compared as proportions of the units it holds (231/614 and 311/864, 10% relative tolerance);
    the raw counts are recorded as measured.
  - The Methods pass a zero-mean Gaussian process through a Poisson process without saying how it
    becomes a rate. It is assumed here that rate = r exp(g - 1/2), with r the median unit rate of
    the monkey in the navigation window (1.65 and 0.51 spikes/s), so that the mean rate is r. The
    null is built by averaging single-trial surrogate ACGs from a bank of 3,564 (A) and 2,175 (M)
    surrogate trials, matched to the trial durations, which gives the same null as generating each
    surrogate afresh.
  - The claims file's rule (a), "the maximum over lags of (mean + 2 SD) of the surrogate scores",
    is run two ways, a1 (the maximum over lags of the surrogate PI mean + 2 SD) and a2 (the mean + 2
    SD of the surrogate scores). The outcome is the same under every reading.
  - The trial rate threshold of 0.05 (code line 3756) is read as spikes/s, as the claims file gives
    no unit.
  - All units in the files are counted, including the 103 monkey A units labelled noise.
- claim: fig2d-periodicity-at-065
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_neupane_2024.ipynb
  output: claim:fig2d-periodicity-at-065
  measured: 0.65
  notes: Under the main reading the median periodicity of periodic units is 0.630 s (A, direction
    1), 0.590 (A, -1), 0.660 (M, 1) and 0.695 (M, -1), within 0.60 to 0.70 s in 3 of 4 groups;
    measured is the median over all periodic unit-directions. Under the other a2 readings 2 to 4 of
    4 groups are within; under a1, which selects 1 to 15 units per group, 0 or 1; under b, which
    selects most units, none (0.72 to 0.95 s, close to the 0.73 to 0.91 s of all units).
  deviations:
  - The readings of the classification rule give different outcomes. Reading a2 (the code's score,
    max PI minus mean PI from the first positive lag, against the mean + 2 SD of the same score in
    the surrogates) is adopted, as it compares a measure with its own null distribution; a1
    compares the score with a threshold on the raw PI, and b, the Methods' wording, classifies 58
    to 81% of units as periodic. The question is for the paper's authors (findings).
- claim: ed3-no-eye-hand-periodicity
  outcome: reproduced
  notebook: reproduce_neupane_2024.ipynb
  output: claim:ed3-no-eye-hand-periodicity
  measured:
  - 0.148
  - 0.136
  - -0.4
  notes: In the five monkey A sessions whose eye and joystick timestamps share the trial clock
    (1,785 PI trials), the PI at 650 ms is below chance for all three signals under both bootstrap
    and both chance readings (one-tailed t-test, p 2.7e-38 to 1.1e-161; t(99) -20.8 to -406.8), and
    no signal is above chance (one-tailed p = 1.0). The mean PIs, 0.148 (horizontal eye), 0.136
    (vertical eye) and -0.400 (joystick), are outside the tolerance of the paper's -0.25, -0.44 and
    -0.53, against chance values of 0.204 to 0.282. The joystick trace deviates from rest by 1.95
    to 2.49 V after the recorded onsets, 0.43 to 0.70 V before them and 1.08 to 1.32 V at times 7 s
    later, which supports the shared clock in these sessions.
  deviations:
  - Monkey A only. In A 08152019 and all monkey M sessions the eye and joystick timestamps are on
    another clock than the trial table, so those sessions are not used.
  - The surrogate for continuous signals is the Gaussian process smoothed as the signals, without
    the Poisson step of the spike null; the paper's code for this figure is not in its repository.
  - Eye and joystick traces are interpolated to 1 ms and smoothed with the rate kernel (claims, the
    paper gives no smoothing for these signals).
- claim: ed2b-pi-navigation-above-iti
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_neupane_2024.ipynb
  notes: The trial table marks no ITI or fixation event; each row ends where the next begins. The
