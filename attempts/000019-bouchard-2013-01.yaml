inputs:
- what: The articulator state matrix (Supplementary Figure 1d) and the phonetic feature matrix
    (Supplementary Figure 12), transcribed from the figures of the paper's supplement. They define
    the paper's variables for each syllable; they hold no measurements.
  source: doi:10.1038/nature11911 (supplement, NIHMS436351-supplement-1.pdf, pages 2 and 15)
outcomes:
- claim: data-composition
  outcome: partially_reproduced
  notebook: reproduce_bouchard_2013.ipynb
  output: claim:data-composition
  measured:
  - 3
  - 169
  - 3051.76
  notes: The dandiset holds four subjects (EC2, EC9, GP31, GP33); EC2, GP31 and GP33 are taken to be
    the paper's EC2, EC31 and EC33, and EC9 is not in the paper. The rate is 3051.76 Hz. The three
    subjects have 57, 55 and 57 CVs (169, paper 168), each with 19 consonants, and 2 to 107
    renditions per CV (EC2 /thi/ 10, GP31 /thi/ 2, 33 GP31 CVs above 100); leaving out CVs below 15
    renditions gives 56 + 54 + 57 = 167. The audio was removed. EC2 and GP31 have negative x
    coordinates (left hemisphere if x is the usual axis); GP33 has no coordinates, so the right
    hemisphere of EC33 cannot be checked. The answer of 2026-10-22 on CVs with fewer than 15
    renditions leaves this claim as it was; the paper's 168 CVs fit neither reading, and the outcome
    is unchanged.
  deviations:
  - The correspondence of GP31 and GP33 to the paper's EC31 and EC33 is an assumption; no metadata
    links them.
- claim: active-electrodes
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_bouchard_2013.ipynb
  output: claim:active-electrodes
  measured: 24.33
  notes: Mean active vSMC electrodes per subject. With every CV, 24.3 with the pre-utterance
    baseline (EC2 15, GP31 49, GP33 9), 21.3 with the whole block and 34.0 with the rest period;
    none is within 27 to 33, so this CV reading gives not reproduced. With only CVs of 15 or more
    renditions, 10.7, 7.0 and 27.0 (rest; EC2 29, GP31 31, GP33 21), so one baseline is within
    tolerance, at its lower edge, and this reading gives partially reproduced. Both readings of the
    change give the same counts. The count depends strongly on the threshold (41.7 at 1.5, 11.7 at
    2.5, pre baseline, every CV). What the answers changed. The rest period, a variant in the first
    run, is now baseline reading (c) of the claims file, and the CV set is now a reading of the
    claims file whose two readings give different outcomes. The first run recorded not reproduced;
    the outcome is now blocked as methods_underspecified. Measured is the first reading (pre, every
    CV).
  deviations:
  - High gamma computed from the raw ECoG with a filter bank whose widths the paper does not give
    (standard choice); bad channels from the dataset's flags.
  - vSMC taken as the electrodes labelled precentral or postcentral, good in every block (268 over
    the three subjects, paper 266); no label marks the guenon.
- claim: fig1c-e-articulator-electrodes
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_bouchard_2013.ipynb
  output: claim:fig1c-e-articulator-electrodes
  notes: No subject, numbering from 1 or from 0, puts all six named electrodes on vSMC (at most 4 of
    6); some are labelled middle or superior temporal or pars opercularis. The criterion blocks the
    claim in that case. The dataset does not say how the paper numbered electrodes, and gives no
    distance from the Sylvian fissure for the order part. For information, in EC2 counted from 1,
    five of the six named electrodes prefer their syllable under both measures and all three
    baselines. The answer of 2026-10-22 to the question on positions says the paper measures them on
    each subject's MRI reconstruction and gives no way to derive them from grid geometry, unlabelled
    coordinates or atlas labels, so the block stands.
- claim: fig1f-h-phonetic-contrasts
  outcome: not_reproduced
  notebook: reproduce_bouchard_2013.ipynb
  output: claim:fig1f-h-phonetic-contrasts
  notes: Under all 96 readings (3 baselines, 2 CV sets, 8 timing readings for T_A, 2 p-value
    readings) no GLM electrode with a positive lips weight has z above 2 for /ju/ at +250 ms and
    below 2 for /ja/ and /ji/ in any subject. With the rest baseline some lips-positive electrodes
    exceed 2 for /ju/ (13 of 96 readings, largest 3.54), but at each of them /ja/ or /ji/ is above 2
    as well; under the pre and whole baselines the largest /ju/ value is below 2. The fricative and
    manner contrasts are not judged, as the claims file says. What the answers changed. The rest
    baseline and the CV set are now readings of the claims file; the 32 rest readings added give the
    same outcome, not reproduced, as in the first run.
  deviations:
  - The lips weights come from the GLM of fig2a-lips-dorsal, which is blocked for its spatial
    judgement only; the weights and electrode selection need no positions and are computed, so this
    claim is tested.
