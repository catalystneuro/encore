- claim: suppfig9-pc-articulator-weights
  outcome: not_reproduced
  notebook: reproduce_bouchard_2013.ipynb
  output: claim:suppfig9-pc-articulator-weights
  measured: 268
  notes: Under all 288 readings the condition fails in all three PCs; tongue weights are not larger
    than lips weights. In the reading printed in full (268 vSMC electrodes, pre, every CV) lips
    minus tongue has a median paired difference of +0.03 in log10 (corrected p = 1), and jaw and
    larynx differ (corrected p = 5e-11). By Methods Eq. 6 the PC term cancels in paired comparisons
