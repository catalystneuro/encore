findings:
- kind: metadata_insufficient
  statement: No electrode has a position relative to the central sulcus or the Sylvian fissure, the
    frame of the paper's spatial analyses. EC2 and GP31 have x, y, z coordinates with no unit or
    coordinate frame described; GP33 and EC9 have none. No electrode is labelled as on the guenon.
    Seven spatial findings of the paper cannot be tested.
- kind: data_missing
  statement: The microphone recordings were removed (dandiset description), so the acoustic onset,
    peak and offset of each syllable used by the paper cannot be computed; only hand-marked start,
    C-V transition and stop times are given.
- kind: identifier_missing
  statement: Subjects GP31 and GP33 do not carry the paper's names (EC31, EC33), and nothing links
    them. GP31's coordinates fit a left hemisphere, as the paper's EC31; GP33 has no coordinates, so
    the right hemisphere of EC33 cannot be checked.
- kind: other
  statement: The dandiset holds a fourth subject, EC9 (7 blocks, 1653 trials), that is not in the
    paper. It has extra syllables (/ch/, /dh/, /j/, /sk/), labels on 79 of 256 electrodes and no
    coordinates.
- kind: selection_undocumented
  statement: Renditions per syllable range from 2 to 107 (GP31 /thi/ 2, EC2 /thi/ 10, GP31 up to 107)
    against the paper's 15 to 100, and GP31 lacks /tha/ and /thu/. The three subjects have 169
    distinct syllables against the paper's 168 (57 + 57 + 54). The dandiset does not say which
    trials or syllables the paper used.
- kind: metadata_error
  statement: The raw ElectricalSeries gives unit volt with a conversion factor of 0.001, but the
    stored values have an SD of a few 1e-5, which is a usual ECoG amplitude if read as volts and tens
    of nanovolts with the factor; the data are consistent with values already in volts.
- kind: metadata_error
  statement: Two syllable labels are misspelt (`she` for `shee` in EC2 and EC9, `ha` for `haa` in
    GP33 and EC9). Electrode ids start at 0 in EC2 and GP31 and at 1 in GP33 and EC9.
- kind: other
  statement: The archive summary counts four subjects and 31 files; bad-channel flags differ between
    blocks of one subject (EC2 has none in two blocks and up to 10 in others), and 177 of 9370
    analysed trials overlap intervals marked as ECoG artefacts.
