- claim: fig3d-timing-sequence
  outcome: not_reproduced
  notebook: reproduce_bouchard_2013.ipynb
  output: claim:fig3d-timing-sequence
  measured:
  - 175
  - 270
  notes: Under all 96 readings (3 baselines, 2 CV sets, threshold per subject or pooled and over all
    articulators or per articulator, onset at threshold or half peak, ANOVA on onset or peak) none
    of the three order conditions holds. Mean lips onsets are -270 to -54 ms, but tongue onsets are
    -26 to +290 ms, so lips and tongue both precede the substitute acoustic onset (-110 ms, CV range
    -257 to -11 ms) in no reading; jaw onsets are -270 to -116 ms, as early as the lips; high-tongue
    peaks are 276 to 325 ms. Against t = 0, shown beside it as the criterion now asks, lips and
    tongue both begin before 0 ms in 2 of 96 readings and the outcome is the same. The ANOVA has F =
    9.4 to 39.2 with p below 1e-10 in 76 of 96 readings. Electrodes 162 to 226 (paper 211). Measured
    values are from the first reading (175 electrodes; mean of back and high tongue peaks, 235 and
    305 ms). What the answers changed. The criterion now allows the hand-marked syllable start as
    the acoustic onset, as a deviation, which the first run had used while asking; the rest baseline
    and the CV set are now readings. The outcome is not reproduced, as in the first run.
  deviations:
  - The acoustic onset is the hand-marked syllable start of the trial table, averaged per CV, as the
    audio is not in the dandiset; the criterion allows this substitute since the answer of
    2026-10-22. The outcome against t = 0 is the same.
