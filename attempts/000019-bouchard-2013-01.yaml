- claim: suppfig6-mixed-tuning
  outcome: reproduced
  notebook: reproduce_bouchard_2013.ipynb
  output: claim:suppfig6-mixed-tuning
  notes: Under all 96 readings, each group of GLM electrodes (grouped by largest weight) has its
    preferred articulator with the largest mean share of positive weight (lips 63 to 79%, tongue 48
    to 96%, larynx 49 to 84%, jaw 69 to 84%) and non-zero shares of the others; in one reading no
    electrode prefers the tongue. The GLM electrodes number 49 to 117 over the three subjects. In
