  assumed: true
  notes: Substitute NREM. 24 qualifying sessions, 18 with EV > REV in the first window (paper 19). Mean EV - REV
    2.71 +- 0.65, 1.10 +- 0.39 and 0.72 +- 0.43% (paper 2.89, 1.72, 1.31); the second is outside the paper's s.e.m.
