  - Rates per state are the deposited StatesFR values, as the state intervals are not deposited. StatesFR columns
    are undocumented. Column 7 is wake (the only column that can hold the track spikes), column 6 NREM (it matches
    immobility-period rates), and column 5 is taken as REM (hippocampal interneurons fire more there than in NREM,
    as in REM; column 8 does not show this). Column 8 as REM is shown as a variant.
