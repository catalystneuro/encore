  notes: BLA label (B1), SpikeParameters column 10 as the monosynaptic code; 675 pyramidal cells, 175 interneurons,
    1,188 others, the paper's numbers. NREM/wake median 0.264 (70.5% positive), REM/wake median 0.364 (73.0%), both
