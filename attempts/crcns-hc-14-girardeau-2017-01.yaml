  notes: 61 sessions in sessionindexing.mat (65 in the bucket). The raw clu files give 7,415 units (2,469, 1,294, 1,138, 2,514
    per rat); the summary tables list 7,390 with the paper's split by rat and differ from the raw files only in Rat08-20130722.
    With the BLA label (B1), 2,038 units in BLA (the paper's number; B2 gives 2,697), 783 in the central nuclei (paper 782),
    1,575 in piriform cortex (paper 1,560) and 1,260 on the hippocampal shanks (paper 1,210), all within tolerance. Counting
    the mixed labels VEn/Pir and BLV/Pir as piriform gives 1,609.
  deviations:
  - Rat08's structures other than BLA are read from the text labels of the All sheet of Rat08-Info/StructureMapping.ods; CeC
    and CeM are counted as the central nuclei and PIr as Pir. Rat08's BLA shanks come from Structures.batch, which agrees
    with the ods except for one shank-day the ods adds.
  - Hippocampal shanks are taken as the shanks of the hippocampal cells of the deposited pair table (1-4 in Rat08, 17-20 in
    Rat10 and Rat11); only Rat10 has an Hpc list.
- claim: fig1b-dz-speed-anova
  outcome: partially_reproduced
  notebook: reproduce_girardeau_2017.ipynb
  output: claim:fig1b-dz-speed-anova
  assumed: true
  notes: With all samples in the zone (the claims file's reading), 50 sessions, epoch F = 60.5 (p < 0.0001), zone F = 2.70
    (p = 0.11), interaction F = 16.4 (p < 0.0001). With the samples moving in the air puff direction, zone p = 0.059. With
    the corrected location, zone p = 0.49 (all samples) and 0.35 (direction-filtered), interaction p = 0.0009 and p < 0.0001;
    the outcome is the same under every reading.
  deviations:
  - The air puff location of each session is the median head position at the run's air puffs (those within 40 cm of the median),
    and the direction the sign of the velocity over the second before them; only 6 sessions have an airpuffloc file, and there
    the estimate lies -3 to 18 cm (median 7.3 cm) past the file's location in the direction of travel. The estimate is the
    assumption; a corrected location (the file where there is one, elsewhere the estimate moved back by 7.3 cm) is a variant.
  - Laps are track crossings between the ends of a central 150-cm segment, following the claims file's description of ClassifyLaps.m,
    not the script itself.
  - '50 sessions have all six speeds (paper 55): each rat''s first session and Rat09-20140329 have no previous zone, Rat09-20140328
    has no tracked position at its air puffs, and Rat09-20140407 and Rat11-20150402 have no run air puffs.'
