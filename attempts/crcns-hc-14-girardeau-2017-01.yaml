- claim: fig1b-dz-speed-anova
  outcome: partially_reproduced
  notebook: reproduce_girardeau_2017.ipynb
  output: claim:fig1b-dz-speed-anova
  assumed: true
  notes: With all samples in the zone (the claims file's reading), 51 sessions, epoch F = 63.9 (p < 0.0001), zone
    F = 3.16 (p = 0.081), interaction F = 17.1 (p < 0.0001). With the samples moving in the air puff direction,
    zone F = 4.32 (p = 0.043) and all three effects are significant.
  deviations: &id001
  - The air puff location of each session is the median head position at the run's air puffs (those within 40 cm
    of the median), and the direction the sign of the velocity over the second before them; only 6 sessions have
    an airpuffloc file, which differs from this estimate by 0.3 to 18 cm. This is a standard choice (assumption)
    not stated by the paper.
  - Laps are track crossings between the ends of a central 150-cm segment, following the claims file's description
    of ClassifyLaps.m, not the script itself.
  - 51 sessions have all six speeds (paper 55); Rat09-20140328 has no tracked position at its air puffs, and each
    rat's first behaviour session has no previous zone.
