- claim: fig3c-hpc-bla-ev-nrem
  outcome: reproduced
  notebook: reproduce_girardeau_2017.ipynb
  output: claim:fig3c-hpc-bla-ev-nrem
  notes: 25 sessions (9, 9, 7 per rat; the paper's 25); EV > REV in 22; mean EV - REV 3.14 +- 0.73% (paper 3.13 +- 0.73%);
    signed-rank p = 4.5e-5. With at least 4 or 8 cells, p = 3.5e-5 and 2.1e-5.
