- claim: fig3c-decay
  outcome: reproduced
  notebook: reproduce_girardeau_2017.ipynb
  output: claim:fig3c-decay
  measured:
  - 3.04
  - 1.78
  - 1.69
  - 17
  assumed: true
  notes: 'Decoded NREM. 24 qualifying sessions, 17 with EV > REV in the first window (paper 19, tolerance 1.9, so the count
    is just outside). Mean EV - REV 3.04 +- 0.55, 1.78 +- 0.53 and 1.69 +- 0.88% (paper 2.89, 1.72, 1.31), all within tolerance;
    signed-rank p = 1.5e-5, 0.00021, 0.035; Kruskal-Wallis p = 0.024. Variants give other outcomes: with the table''s pre-NREM
    (20 sessions; 2.51, 1.52, 1.30%; Kruskal-Wallis p = 0.021) the third window gives p = 0.067 (partial); with 30-s smoothing
    the first mean is 3.44% (partial); with the first revision''s immobility substitute the decay test gives p = 0.074 (not
    reproduced).'
  deviations:
  - 'Sleep states are not deposited. They are decoded from the authors'' StatesFR table (hc14.decode_states, an assumption):
    each 5-s epoch takes the state of columns 5 to 8 under which the spike counts of all the session''s units are most likely
    at the table''s rates, with log likelihoods summed over 60 s; NREM is column 6 and REM column 5, in immobile epochs (head
    speed from positions smoothed over 1 s below 4 cm/s; the paper associates NREM with immobility, Online Methods, Preprocessing)
    of pre-sleep and post-sleep. The decoded NREM gives hippocampus-BLA pair correlations that follow the table''s NREM columns
    (r = 0.88 pre, 0.90 post) and per-session EV - REV with mean 3.13% against the table''s 3.21% (Spearman 0.92); the decoded
    REM follows the table''s REM columns (r = 0.78, 0.81). Decoded minutes match those implied by StatesFR (median ratio 0.95
    for NREM, 1.05 for REM; Spearman 0.92 and 0.94 over 54 sessions). The decoder with 30-s smoothing and the first revision''s
    immobility substitute are variants.'
  - Pre-NREM is the decoded pre-NREM, the run whole, and the windows cumulative decoded post-NREM time.
