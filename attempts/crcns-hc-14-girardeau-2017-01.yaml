    REV (Spearman 0.86) but with smaller values (1.96 against 3.21%), and it cannot separate REM. Results at 2 cm/s
    are shown.
  - Pre-NREM is the substitute pre-NREM, the run whole, and the windows cumulative substitute post-NREM time.
