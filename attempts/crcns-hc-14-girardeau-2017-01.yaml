- claim: fig2c-bla-pyr-higher-in-sleep
  outcome: reproduced
  notebook: reproduce_girardeau_2017.ipynb
  output: claim:fig2c-bla-pyr-higher-in-sleep
  measured:
  - 675
  - 175
  - 1188
  assumed: true
  notes: BLA label (B1), SpikeParameters column 10 as the monosynaptic code; 675 pyramidal cells, 175 interneurons, 1,188
    others, the paper's numbers. NREM/wake median 0.264 (70.5% positive), REM/wake median 0.364 (73.0%), both p < 1e-15. Per
    rat the REM ratio is the larger in rats 8, 9 and 11, and equal in rat 10 (0.437 against 0.442). With column 8 as REM,
    REM/wake median 0.085, smaller than NREM/wake (the claim would be partially reproduced). Epochs decoded as column 5 give
    hippocampus-BLA pair correlations that follow the table's REM columns (r = 0.78, 0.81) and not its NREM columns (r = 0.09),
    which supports column 5 as REM.
  deviations:
  - Rates per state are the deposited StatesFR values, as the state intervals are not deposited. StatesFR columns are undocumented.
    Column 7 is wake (the only column that can hold the track spikes), column 6 NREM (it matches immobility-period rates),
    and column 5 is taken as REM (hippocampal interneurons fire more there than in NREM, as in REM; column 8 does not show
    this). Column 8 as REM is shown as a variant.
