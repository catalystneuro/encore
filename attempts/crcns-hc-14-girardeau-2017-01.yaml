findings:
- kind: data_missing
  statement: The hand-scored sleep states (NREM, REM, wake intervals) are not deposited, nor the run intervals and
    lap classifications the analyses used. NREM and REM can only be recovered for what the summary tables already
    hold (hippocampus-BLA pair correlations, per-cell state rates); rescoring from the LFP would mean streaming
    about 430 GB of tar.gz archives.
- kind: metadata_insufficient
  statement: The summary tables in AllRats-Variables.tar.gz (FinalType, StatesFR, SpikeParameters, PoissonRippleMod,
    EVcontribs, AllRippleCCGs) are undocumented, as the data description says. Their columns could be identified
    against the raw spikes, except which StatesFR column is REM (column 5 or 8).
- kind: metadata_insufficient
  statement: The structure of each shank and day comes in four formats, one per rat (Structures/*.mat for Rat09
    and Rat10, Structures.txt for Rat11, Batch-Files/Structures.batch and a colour-coded StructureMapping.ods for
    Rat08). Rat08's CeN and piriform shanks are coded only by cell colour, Rat08 sessions 10 to 13 list no BLA shanks,
    and the hippocampal shanks are listed only for Rat10.
- kind: metadata_error
  statement: Rat08-20130722 has 152 sorted units in its clu files and 127 in the summary tables (28 only in the
    clu files, 3 only in the tables); the other 60 sessions agree unit for unit.
- kind: selection_undocumented
  statement: The bucket holds 65 sessions; the paper's 61 are listed only in sessionindexing.mat. Rat11-20150309,
    -0318, -0319 and -0324 are left out without a stated reason.
- kind: metadata_insufficient
  statement: Only 6 of the 55 behaviour sessions carry an airpuffloc file with the air puff location and direction;
    for the others they must be inferred from the head position at the air puffs, which differs from the files by
    0.3 to 18 cm where both exist.
- kind: other
  statement: The pair table's run correlations match correlations recomputed over the run subsession in 17 of 29
    sessions (r > 0.999) and less well in 12 (r = 0.58 to 0.98), so the run interval the authors used is not the
    run subsession in those sessions and is not deposited.
- kind: methods_unavailable
  statement: Question for the authors. Which StatesFR column is REM? This attempt took column 5 (hippocampal interneurons
    fire more there than in NREM) over column 8; with column 8 the REM/wake ratios of BLA cells would be smaller
    than the NREM/wake ratios, against Figure 2c.
- kind: methods_unavailable
  statement: Question for the authors. Was the air puff location of BehavioralMeasures.m taken from the airpuffloc
    files, from the puff events, or from elsewhere, and where is it for the 49 sessions without an airpuffloc file?
    This attempt used the median head position at the air puffs, and the location-bias test (airpuff-location-no-bias)
    depends on it.
- kind: other
  statement: The session archives are tar.gz files without an index, and each clu archive (1 to 2.5 GB) is mostly
    RawKK, .fet and .klg files; reading the sorted spikes of one session means decompressing the whole archive (99
    GB over 65 sessions), and the LFP archives are 3 to 9 GB each.
