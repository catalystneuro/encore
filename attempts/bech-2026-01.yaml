  output: claim:session-list-link
  notes: Of the 1497 sessions named by the 19 lists, 1467 (98.0%) are in the dandiset under the same identifier. Every session
    of every list a claim selects from is present with a readable trial table, and those lists' counts agree with the claims
    file (expert 41 mice and 201 sessions, opto 7 and 56, control 4 and 39, Context Off 7 and 21, jRGECO1a 6 and 25, GCaMP6f
    8 and 33, tdTomato 4 and 15, GFP 6 and 24, wf-opto 4 and 40, photoactivation 2 and 6, model 21 and 60). The pool list
    sessions_Context_sessions, used for the expert rule's pool variant, does not match in full. It has 1451 entries for the
    stated 1449; 30 are written with a processing-date suffix (for example PB165_20231115_144956_2023_12_01) and are not dandiset
    identifiers, although all 30 sessions are in the dandiset under the plain identifier and none is also listed plainly;
    and 3 of its sessions (PB185_20240801_095038, PB186_20240801_110359, PB189_20240902_155436) have no readable trial table.
    So 1418 of the 1451 entries match with a trial table, which is partially reproduced under the criterion (at least 90%).
    The session types in the files agree with each list's purpose.
- claim: expert-sessions
  outcome: not_reproduced
  notebook: reproduce_bech_2026.ipynb
  output: claim:expert-sessions
  measured:
  - 49
  - 318
  - 24.73
  notes: The Methods' rule (lower bound of the 95% bootstrap interval of the mean block contrast above 0.375), applied to
    the 1434 behavioural sessions described whisker_context, selects 318 sessions in 49 mice with 24.7 blocks per session,
    outside 201 ± 20.1 and 41 ± 4.1 (blocks within 23 ± 2.3). With 20-trial blocks (the code's variant) 316 sessions in 48
    mice. Restricted to the code's pool list, 293 sessions in 42 mice. The tested sessions are of every type (888 behaviour-only,
    364 widefield, 80 wf-opto, 74 opto, 28 pharmacology). Variants, the rule also run on the 60 sessions described context_...
    (6 mice, RD003 to RD032, 51 of them in the pool list) gives 322 sessions in 52 mice, and on behaviour-only sessions 112
    sessions in 42 mice (23.8 blocks); neither has all three counts within tolerance. The rule keeps 189 of the 201 sessions
    of the code's expert list; 12 list sessions have a lower bound below 0.375 (lowest 0.299). The code's list itself has
    41 mice, 201 sessions and 23.9 blocks per session, as the paper says, so the paper's set is not the rule applied to all
    sessions.
  deviations:
  - Blocks are the context runs of the trial table, which equal the context epochs in 99.6% of sessions; three files have
    no epochs and are left out.
