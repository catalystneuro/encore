  statement: The files do not record the mouse lines. The subject genotype is "WT" for every mouse but one ("Ai148"), and
    strain is C57BL/6 for all, so no file says which mice carry VGAT-ChR2, jRGECO1a, GCaMP6f, tdTomato or GFP, or which received
    no opsin. The optogenetic, control and widefield groups can only be formed from the session lists of the paper's code.
- kind: metadata_insufficient
  statement: Session groups are not recorded in a usable form. Muscimol and Ringer days, the injected area, baseline and injection
    days, and Context Off days have no field; the pharmacology, surgery and virus fields are "na" in every file, and most
    muscimol and Ringer sessions are typed behaviour_only_session. The Context Off trials still name pink and brown noise
    in context_background.
- kind: metadata_error
  statement: The DeepLabCut series (processing/behavior/BehavioralTimeSeries) carry the unit "seconds" and a conversion of
    1/28 (side camera) or 1/24 (top camera) for every series, likelihoods and angles included. The positions are in pixels,
    the whisker_angle series is in degrees (it reproduces the paper's 97.3 and 98.6 degrees unconverted), and pupil_area is
    in square pixels, for which the conversion would have to be 1/28 squared.
- kind: metadata_insufficient
  statement: No trial table column has a description (all "None"), and the perf codes 0 to 6 are not explained in the files;
    they were read from their cross-tabulation with trial type and lick (6 is an early lick).
- kind: other
  about: data
  statement: lick_time minus the stimulus time is about 100 ms longer than the paper's spout-contact times (470 against 370
    ms for auditory W+), while the context differences and the tests match; lick_time minus response_window_start_time, which
    is 100 ms after the stimulus, gives the paper's 370, 400, 392 and 418 ms. What lick_time is measured from is not described.
- kind: format_error
  statement: Three files (PB185_20240801_095038, PB186_20240801_110359, PB189_20240902_155436) have no BehavioralEpochs. In
    76 of the 97 face-video sessions the DLC timestamps and data differ in length (printed in the DLC data cell), mostly by
    a few frames; in PB192_20241121_122848 the jaw series has 311,339 data points for 1,116,888 timestamps, and in PB177_20240529_121819
    953,445 (jaw) and 948,779 (whisker) for 955,705.
- kind: selection_undocumented
  about: paper
  statement: The Methods' expert rule (block contrasts significantly above 0.375) applied to the dandiset selects 318 sessions
    in 49 mice; the paper's 201 sessions in 41 mice are the code's fixed list, which includes 12 sessions the rule rejects.
    How the list was chosen is not stated.
- kind: methods_unavailable
  statement: Question for the authors on Figure 2C-F. The Methods build the opto-map null by shuffling block labels; the legends
    and the code shuffle all trials. The block-label shuffle keeps the laser effect inside the null, and under it no named
    site reaches d' 0.8 (at most 0.57); the trial shuffle gives the published map. Which null was used, and at what d' is
    a site counted as affected (the colour scale starts at 0.5)? Seven claims are blocked on this.
- kind: methods_unavailable
  statement: Question for the authors on Figure 3C. Which trials are pooled for the jaw-opening onset of 108 ± 24 ms? The
    correct whisker trials of Figure 3B (W+ hits and W- misses) give 90 ms, W+ whisker hits 76 ms, the code's auditory and
    whisker hits 77 ms; the attempt assumed the Figure 3B set.
- kind: data_missing
  statement: The light-sheet images of RSC axons (Figure 3, figure supplement 1C) are not in the dandiset and no other deposit
    is named.
- kind: methods_unavailable
  statement: Question for the authors on Figure 3H. Which pre-stimulus baseline is subtracted before the d' maps? The paper
    gives two, the 250 ms of the Methods' Computation of ΔF/F0 for Figures 3 and 4 and the 50 ms of the Methods for Figures
    3E&F, whose d' Figure 3H uses; the code uses 100 ms. With 50 or 100 ms RSC is first in the pixel and ROI versions; with
    250 ms it ties with wM1 in the pixel version, so the claim is blocked as methods_underspecified.
- kind: other
  about: data
  statement: In 46 of the 46 widefield-with-optogenetics and photoactivation sessions, 910 of the trials (833 wf-opto, 77
    photoactivation) have their first imaging frame after the stimulus more than one frame late, up to 81 s, so the imaging
    has gaps that the trial table does not mark.
