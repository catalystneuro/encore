- claim: figs2-rigid-plastic-along-track
  outcome: reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:figs2-rigid-plastic-along-track
  assumed: true
  notes: 121 rigid and 121 plastic units. (a) Kolmogorov-Smirnov test of peak position, D = 0.116, p = 0.39. (b)
    Rank-sum test of distance to the nearer end, medians 0.131 and 0.106 of track length, p = 0.22. Fractions of
