- claim: place-cell-count
  outcome: partially_reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:place-cell-count
  measured:
  - 565
  - 562
  - 62.1
  assumed: true
  notes: The data set holds 562 pyramidal cells, as expected. With the kernel as an SD, 565 place units
    (cell and running direction) have a field, 62.1% of 910 pyramidal cells times directions (reading
    a; the paper's 491 is 54% of 910), and 100.5% of 562 (reading b). The count and the percentage are
    above tolerance (491 +- 49.1, 54 +- 5.4). With the kernel as a full width at half maximum, 504 units
    and 55.4% are within tolerance. 410 distinct cells have a field in either direction. Question for
    the paper's authors (methods_unavailable finding) on the kernel width.
  deviations:
  - The 5 cm Gaussian kernel is read as its SD (claims opening comment); the FWHM reading is shown for
    the place-cell count.
  - Spikes are assigned to the nearest position sample; running is along-track speed of at least 5 cm/s,
    from the linearised position smoothed with a 0.5 s Gaussian (a standard choice).
  - The linearised position of the data set is used as it is; on linear mazes it spans the 1.6 or 2 m
    stem, and on the circular maze 2.84 to 2.90 m of the 3.14 m circumference, consistent with the reward
    areas being left out.
- claim: fig1c-sequence-content
  outcome: reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig1c-sequence-content
  assumed: true
  notes: Under all 12 combinations of yoking (Y-a, Y-b, Y-c), direction (D-a, D-b) and maze offline reading,
    mean rZ is above zero in PRE (0.173 to 0.208), MAZE (0.506 to 0.561) and POST (0.283 to 0.304), sign-rank
    p < 1e-30, and Kruskal-Wallis with Tukey-Kramer comparisons of mean ranks gives MAZE > POST > PRE
    (largest p 7.0e-12). Events, Y-a and D-a, 35,665 PRE, 7,806 MAZE and 41,888 POST (event and template
    pairs). By animal POST exceeds PRE in all four (rank-sum p 7.3e-08 to 0.020) and MAZE is highest in
    three; in Buddy POST (0.504) exceeds MAZE (0.484). The paper's Figure S6 has MAZE highest in all four
    and POST above PRE in three (not B). Gatsby_08282013 has negative mean rZ in PRE and POST.
  deviations:
  - Ripple events are the paper's population synchrony events without the condition that each holds the
    peak of an LFP-detected ripple (Materials and Methods, Ripple Event Detection); the LFP is only in
    tar.gz archives of 70 GB in all, measured to stream at about 23 MB/s (about 55 minutes), and the detector's
    channel and threshold are not given.
  - Assumed that the off-line states (quiet waking and NREM) are the data set's NREM, Drowsy (drowsy wake,
    low movement) and Intermediate (a sub-type of NREM per the data descriptor) epochs, the lab's own
    scoring (reading S-a); reading S-b needs the LFP and was not run.
  - Assumed that offline time on the maze, where the state epochs mark only Wake, is time not running
    on the track (along-track speed under 5 cm/s or off the track); the 2D head speed under 5 cm/s is
    shown as a variant for Figure 1C and gives the same outcome.
  - The time-bin-shuffle rZ of Figure S22B, which the criterion asks for as a variant, was not computed.
  - Rate maps get 0.001 Hz added before the logarithm in the decoder (a standard choice). Each event is
    cut into whole 20 ms bins from its start, the remainder dropped (a standard choice).
- claim: figs5b-abs-r-above-null
  outcome: reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:figs5b-abs-r-above-null
  assumed: true
  notes: Against one null |r| per event (from the first random template), observed |r| exceeds the null
    in all three epochs under all six Y and D readings (largest p 4.4e-31); Y-a, D-a means 0.179 against
    0.158 (PRE), 0.206 against 0.151 (MAZE), 0.188 against 0.157 (POST). The POST - PRE change of mean
    |r| is 0.0084 observed and -0.0010 null; the bootstrap 95% interval of their difference is 0.0076
    to 0.0113 and is above zero under every reading. Against each event's mean null |r|, the PRE rank-sum
    test gives p = 1 under every reading (means have less spread than single values), so that reading
    does not reproduce PRE. Which comparison the legend means is open; the one that compares like with
    like is adopted. Question for the paper's authors.
  deviations:
  - Ripple events are the paper's population synchrony events without the condition that each holds the
    peak of an LFP-detected ripple (Materials and Methods, Ripple Event Detection); the LFP is only in
    tar.gz archives of 70 GB in all, measured to stream at about 23 MB/s (about 55 minutes), and the detector's
    channel and threshold are not given.
  - Assumed that the off-line states (quiet waking and NREM) are the data set's NREM, Drowsy (drowsy wake,
    low movement) and Intermediate (a sub-type of NREM per the data descriptor) epochs, the lab's own
    scoring (reading S-a); reading S-b needs the LFP and was not run.
  - Assumed that the rank-sum test compares observed |r| with single null values, one per event, and not
    with each event's mean null |r| (shown as a variant).
