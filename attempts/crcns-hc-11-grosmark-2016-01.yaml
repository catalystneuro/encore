  outcome: reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig2d-high-dpcc-shuffle-abolishes-replay
  measured: 10
  assumed: true
  notes: Units ranked by dPCC within each session. Shuffling from the highest dPCC, pooled POST - PRE
    rZ is 0.096 at 0%, 0.045 at 5% and first reaches zero or below at 10% (-0.003, interval -0.017 to
    0.011), inside 9 to 22%; -0.020 at 15% and -0.038 at 30%. With 1,000 templates the 15% step gives
    -0.020 (interval -0.033 to -0.007). Shuffling from the lowest dPCC it stays above zero to 75% (0.070,
    interval 0.063 to 0.077).
  deviations:
  - Ripple events are the paper's population synchrony events without the condition that each holds the
    peak of an LFP-detected ripple (Materials and Methods, Ripple Event Detection); the LFP is only in
    tar.gz archives of 70 GB in all, measured to stream at about 23 MB/s (about 55 minutes), and the detector's
