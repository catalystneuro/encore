- claim: fig2d-high-dpcc-shuffle-abolishes-replay
  outcome: reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig2d-high-dpcc-shuffle-abolishes-replay
  measured: 10
  assumed: true
  notes: Units ranked by dPCC within each session. Shuffling from the highest dPCC, pooled POST - PRE rZ is 0.096
    at 0%, 0.045 at 5% and first reaches zero or below at 10% (-0.003, interval -0.017 to 0.011), inside 9 to 22%;
    -0.020 at 15% and -0.038 at 30%. With 1,000 templates the 15% step gives -0.020 (interval -0.033 to -0.007).
    Shuffling from the lowest dPCC it stays above zero to 75% (0.070, interval 0.063 to 0.077). With the same templates
    pooled under every Y and D reading, shuffling from the highest dPCC first reaches zero or below at 10% (four
    readings) or 15% (Y-b D-a, Y-c D-b), and from the lowest stays above zero to 75% (smallest lower bound 0.063).
    The cells are ranked under Y-a, D-a in every reading.
  deviations:
  - Ripple events are the paper's population synchrony events without the condition that each holds the peak of
    an LFP-detected ripple (Materials and Methods, Ripple Event Detection); the LFP is only in tar.gz archives of
    70 GB in all, measured to stream at about 23 MB/s (about 55 minutes), and the detector's channel and threshold
    are not given.
  - Assumed that the off-line states (quiet waking and NREM) are the data set's NREM, Drowsy (drowsy wake, low movement)
    and Intermediate (a sub-type of NREM per the data descriptor) epochs, the lab's own scoring (reading S-a); reading
    S-b needs the LFP and was not run.
  - 100 partially shuffled templates per step in place of the paper's 1,000 (the step at 15% from the highest, rerun
    with 1,000, gives the same value to 0.001); 5% steps (a standard choice, criterion); steps from the highest
    dPCC run to 30% and from the lowest to 75%, the ranges the criterion judges.
  - Cells are ranked by dPCC under Y-a, D-a only; the change is pooled under all six Y and D readings.
  - Each template's rZ uses the null mean and SD of the unshuffled analysis, as the null does not depend on which
    cells are shuffled in the template.
