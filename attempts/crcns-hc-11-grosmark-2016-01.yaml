findings:
- kind: metadata_error
  statement: In Gatsby_08022013 the sessInfo file has spike times up to 32,002.4 s, 1,588.7 s past sessDuration
    (30,413.6 s), which is also the end of the POST epoch; no other session has spikes past its end. The
    epochs and the descriptor do not say what the extra recording is.
- kind: metadata_insufficient
  statement: The state epochs mark only Wake (and in two sessions 2 to 81 s of Drowsy) during the MAZE
    epoch, so the quiet waking on the maze, in which the paper detects MAZE ripple events, is not given.
    The descriptor does not say which state is the paper's quiet waking; Drowsy (drowsy wake, low movement)
    was taken for it.
- kind: selection_undocumented
  statement: The data set holds no list of the paper's 491 place cells, of its ripple events, or of its
    216 strongly contributing and 105 rigid and 105 plastic cells, so the selections cannot be compared
    cell by cell. Repeating the place-field method gives 565 place units by running direction (504 with
    a narrower kernel).
- kind: other
  statement: The LFP is only in one tar.gz archive per session (5.1 to 9.0 GB compressed, 70 GB in all),
    and the spike features in others (0.8 to 2.3 GB). A tar.gz cannot be read in part, so reading one
    LFP channel means streaming and decompressing the whole archive, measured at about 23 MB/s from the
    bucket (about 55 minutes for the eight sessions).
- kind: other
  statement: Position is sampled every 25.6 ms (39.06 Hz); the paper states 39.69 Hz and the descriptor
    about 39 Hz. The 2D head position is noisy in some sessions; in Gatsby_08022013 the smoothed head
    speed is above 13 cm/s in 95% of samples, and under 5 cm/s for 0.1 min of the 38.9 min maze epoch.
- kind: paper_inconsistency
  statement: The Materials and Methods (Rigid and Plastic Cell Classification) name a one-tailed Wilcoxon
    rank-sum test over each cell's per-event PCC scores for strongly contributing cells; the Figure S19B
    legend names a one-tailed signed-rank test. With the signed-rank test 222 to 252 units are strongly
    contributing; with a rank-sum test of observed against cell-shuffled rZ only 22 to 39.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) Is the 5 cm Gaussian kernel of the place-field analysis
    its SD or its width? As an SD 565 place units are found, as a full width at half maximum 504 (paper
    491). (2) On the linear mazes, is each ripple event scored with both direction templates, or assigned
    to one direction first by equation 6? Both give the replay results, but the rigid and plastic groups
    have 121 units each with both templates and 108 to 113 with one. (3) Which test marks a strongly contributing
    cell (see the paper_inconsistency finding)? (4) Which part of the longer of PRE and POST is kept when
    the epochs are yoked? (5) Which LFP channel and threshold detect the sharp wave-ripples? (6) In Figure
    S5B, is observed |r| compared with single shuffled values or with each event's expected null |r|?
    Only the first gives PRE above the null. (7) In Figure 4B and C, are cells ranked by firing rate within
    each session or pooled? Within session the low-rate half's coactivity increase exceeds the high-rate
    half's (p = 0.019), pooled it does not (p = 0.64). (8) How is quiet waking on the maze identified?
