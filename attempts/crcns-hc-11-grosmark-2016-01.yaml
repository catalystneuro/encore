- claim: figs2-rigid-plastic-along-track
  outcome: reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:figs2-rigid-plastic-along-track
  assumed: true
  notes: 121 rigid and 121 plastic units. (a) Kolmogorov-Smirnov test of peak position, D = 0.116, p =
    0.39. (b) Rank-sum test of distance to the nearer end, medians 0.131 and 0.106 of track length, p
    = 0.22. Fractions of peaks in the outer fifths 0.64 (rigid) and 0.71 (plastic), against 0.40 for a
    uniform spread and 0.50 for all place units.
  deviations:
  - The rigid and plastic groups use readings Y-a (last T of PRE, first T of POST), D-a (each event scored
    with both direction templates, as the Figure S20 legend 'we independently compared the results of
    each running direction to its null distribution' suggests) and P-a (one-tailed signed-rank test of
    per-event PCC against zero, the Figure S19B legend), an assumption; under D-b the group sizes are
    108 to 113.
  - Peak position is measured from the start of the run, the coordinate flipped where runs go toward lower
    values.
- claim: fig3a-plastic-more-specific
  outcome: partially_reproduced
  notebook: reproduce_grosmark_2016.ipynb
