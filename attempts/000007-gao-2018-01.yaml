findings:
- kind: metadata_insufficient
  statement: The trial column photo_stim_id (codes 0 to 6) has no description in the files or the
    dandiset metadata. The codes can be named only from the data description of the paper's Zenodo
    records (1 and 2 fastigial, 3 and 4 dentate photo-activation in the sample and delay, 5 and 6 CN
    photo-inhibition for 0.5 and 1.3 s), and the ALM responses agree with those names.
- kind: metadata_error
  statement: The descriptions of pole_in_time, pole_out_time and cue_time say they are relative to the
    trial start; the values are session times on the clock of the spike times (pole in follows
    start_time by 0.57 s).
- kind: metadata_error
  statement: For three of the four L7-cre mice the sides disagree with Supplemental Table 1 (BAYLORCD12
    and CD13 have a left fastigial site where the table has right CN; BAYLORCD14 has left ALM where
    the table has right ALM), and in all three the files put ALM and the stimulation site on the same
    side, against the Methods' statement that ALM recordings were always contralateral.
- kind: metadata_error
  statement: The L7-cre files describe the photostimulation site as the fastigial nucleus at 2.4 mm
    depth, while the Methods photostimulate Purkinje cells through a cranial window at the surface of
    the cerebellar cortex.
- kind: selection_undocumented
  statement: The dandiset holds more units than the paper analysed (1112 pyramidal neurons in the 9
    photo-activation mice against 912, 737 units in the 4 L7-cre mice against 490) and 20 L7-cre
    sessions against 19, with no mark of which units or sessions the paper used. The paper's
    selection is not described; with the scripts' rule of 30 correct trials of each type the
    selectivity fractions come close to the paper's.
- kind: format_error
  statement: In the 40 sessions of the 2017 and 2018 mice (BAYLOR ids) the pole and cue times lie on a
    10 ms grid, while the 2015 files give them to a microsecond. The photostimulus times are known
    only through these, so the millisecond latencies of the paper cannot be measured in those files.
- kind: data_missing
  statement: The dandiset holds only the ALM recordings. The CN recordings are on Zenodo
    (doi:10.5281/zenodo.6647629), with 185 sessions and 1212 units against the paper's 169 and 878.
    The lick times are not in the dandiset (for the ALM sessions they are on CRCNS alm-4, behind a
    login), and the lesion and behaviour-only sessions and the anatomy are not deposited anywhere
    found. Nine claims cannot be tested.
- kind: metadata_insufficient
  statement: The trial table has no column marking periods when the mouse was not performing (the
    GoodTrials of the paper's scripts), so that selection cannot be repeated.
- kind: identifier_missing
  statement: The 2015 mice are named anm00314746 to anm00314760, while Supplemental Table 1 names them
    AN105 to AN109; only two (the one with a left fastigial site, and the one dentate mouse) can be
    matched.
- kind: metadata_insufficient
  statement: The genotype of the 9 wild-type mice is given as unknown (the Methods say C57Bl/6), and
    the electrode table has no positions (NaN) or impedances (-1), so unit depths are not available.
- kind: other
  statement: Every unit's waveform is stated as sampled at 20 kHz, including the NeuroNexus recordings
    that the Methods say were sampled at 25 kHz; the widths agree with the cell type labels at either
    rate, so the data do not settle which is right.
- kind: other
  statement: Two pairs of units in two sessions (BAYLORCD6 2017-06-11 units 48 and 57, anm00314760
    2015-10-21 units 5 and 37) share 96% and 83% of the smaller unit's spikes within 0.5 ms, likely one
    neuron sorted twice.
- kind: paper_inconsistency
  statement: The Methods say ALM was recorded on the left in 10 mice and on the right in 2, while
    Supplemental Table 1 lists 13 ALM-recording mice (11 left, 2 right), besides the excluded mouse.
