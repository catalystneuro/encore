findings:
- kind: other
  about: data
  severity: none
  statement: The pinned version holds what the paper describes. 168 of 174 files have photostimulation
    trials, 112 late-delay bilateral sessions come from 19 mice, and the mice and sessions per region
    equal Table 1 of the paper under its stated rules. No recording is deposited twice (spike counts,
    trial counts and trial timing all differ). Every photostimulation trial has one onset event inside
    it. Spikes and trials share a clock (the ALM laser-control difference 20 to 120 ms after onset exceeds
    that before onset in all 99 sessions with ALM units), and licks and video share one (the tongue is
    detected in 97% of frames in the 50 ms after a lick against 40% at times shifted by -0.5 s, in all
    112 sessions).
- kind: format_error
  severity: minor
  statement: Four units in the late-delay sessions have spike times that are not in ascending order. Analyses
    that assume sorted spike times (binary search for counts) must sort them first.
- kind: metadata_insufficient
  severity: minor
  statement: The brain region of a unit is given two ways, as the probe's target in the electrode location
    (`brain_regions`, e.g. "left ALM", "right Thalamus") and as a CCF annotation per unit (`anno_name`),
    and neither is described as the region used for analysis. The probe targets reproduce the paper's
    per-region counts exactly.
- kind: metadata_insufficient
  severity: minor
  statement: The video keypoint series (jaw, nose, tongue) hold x, y and a likelihood per frame, with
    no detection flag or recommended likelihood cut. The tongue has likelihood of at least 0.9 in about
    10% of frames and in no frame of the choice window on 82% of trials, so how missing keypoints are
    handled changes any analysis that regresses out tongue position.
- kind: other
  about: data
  severity: minor
  statement: In two of the 112 late-delay sessions the side-camera video does not span the trials to within
    5 s, so some trials of those sessions have no keypoints.
- kind: methods_unavailable
  statement: Question for the author. Was the matched distance in the early window (12.6 in ALM, Figure
    3-1C) computed in two 50 ms bins with the per-bin distances averaged, as for the pre-lick window,
    or over the single 20 to 120 ms window? The two give 12.59 and 18.36 here; the attempt assumes the
    binned reading (Methods, Matched distance and Time courses).
- kind: methods_unavailable
  statement: Question for the author. Several details are not in the Methods and the code is private;
    the attempt chose, where the data allowed, the reading that matches the paper's counts. (1) Laser
    trials with an early lick were dropped (the counts of Table 1 match only then). (2) Each laser trial
    took the control trial with the closest reaction time within the caliper (a random match gives a median
    difference of 43 ms, not 1.3 ms). (3) A video keypoint was taken as detected at likelihood 0.9 and
    trials without a detection took the control mean; dropping them from the fit gives other fractions
    and cosines. Please confirm or correct these, and say how the control-split correction of Figure 1-1B,
    the displayed-plane fraction of Figure 3B (25%, against 70% to 97% here) and the energy per neuron
    before onset (0.09, Figure 2-1A) were computed.
