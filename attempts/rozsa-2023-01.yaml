findings:
- kind: metadata_error
  statement: Every membrane potential series gives a conversion of 1e-12 with unit volts, but the
    stored values are already in volts (medians near -0.065). Read with the stated conversion they
    are picovolts.
- kind: metadata_error
  statement: The stimulus series of the bleb recordings (731 sweeps) and some sweeps of other
    folders (52 active human, 11 ZD7288, 3 rat oscillation, and in 21 induction files) are stored
    in pA although their unit is amperes, giving values near 1e14 when read as stated.
- kind: metadata_insufficient
  statement: No file carries AP labels (AIS-AP or RA-AP), RAF status, or the induction protocol's
    sweeps, so the classes and epochs the paper analyses must be rebuilt from the traces. The
    human and rat induction files carry no morphological cell class (NGFC, non-NGFC, rosehip),
    which only the bleb files record.
- kind: data_missing
  statement: The local KCl application experiments (Figure 2I to 2L) are not identifiable in the
    dandiset, and only 2 of the 90 rat recordings without carbachol and SCH23390 (Figure S3) are
    in it. The induction folders hold 313 human and 132 rat files against the 385 and 259 cells
    the paper tested.
- kind: selection_undocumented
  about: data
  statement: The induction folders are named Human_persistent_RAF and Rat_persistent_RAF, and
    nearly all their cells fire APs without current after induction, but the paper reports RAF in
    a quarter to a third of tested cells. The dandiset does not say how its cells were selected
    from those the paper tested.
- kind: other
  about: data
  statement: Sampling rates vary within and across files (5 to 200 kHz, mostly 16.7, 25, 50 and
    100 kHz) against the 50 kHz of the Methods; the long gap-free sweeps of the induction files are
    often at 5 kHz, which limits the threshold and slope measures. One bleb file
    (sub-20220317) has no bleb sweeps.
- kind: methods_unavailable
  statement: How AIS-APs and RA-APs were separated (a threshold and pre-AP slope boundary, per
    preparation or per cell), how a recording was cut into RAF epochs, and the sag fraction formula
    are not given. Could the authors give the boundary or the per-AP labels used, and the epoch
    definition? A two-component mixture on threshold and slope does not separate the classes
    cleanly in these data.
