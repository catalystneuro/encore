- claim: fig1ab-raf-patterns
  outcome: not_reproduced
  notebook: reproduce_rozsa_2023_induction.ipynb
  output: claim:fig1ab-raf-patterns
  measured:
  - 752.5
  - 10.42
  - 55.27
  - 1020.0
  - 0.014
  - 7375
  - 166
  - 0.552
  notes: '307 human files with induction sweeps. Under no reading or subset are more than two of the eight
    values within tolerance; the measured values are those of the first reading (continuous-recording
    RA-APs, one epoch per cell, all cells), with none within tolerance. The best rows have two of eight
    (cells quiet before induction, RA-APs with the interstimulus intervals, one epoch per induction run:
    maximum duration 2616 s and sporadic median frequency 0.294 Hz). Both patterns occur under every reading
    (24 persistent and 119 sporadic epochs under the first). The reading (b) mixture fails its check (RA
    component slope 6.95 against 1.86 mV/ms; its size is 86085 to 2453230 APs over the five seeds), so
    its rows are not a reading of the paper''s classes. SDs are printed beside the medians.'
  deviations:
  - RA-APs by reading (c) for the main result; the dandiset carries no AP labels, and the reading (b)
    mixture does not recover the paper's classes in these recordings.
  - Induction sweeps are found from the stimulus (a sweep shorter than 1 s with one positive step of 50
    to 300 ms), since the files do not mark the protocol. Some recordings use 350 ms sweeps with a 250
    ms step, not the 100 ms pulses of the Methods.
  - Rebound APs within 0.3 s of the end of a hyperpolarizing step are left out of the RA-APs (a standard
    choice).
  - The Methods count RA-APs "during continuous recording"; the main reading uses the sweeps with no stimulus
    step, and the interstimulus intervals are added as a variant.
  - Threshold where dV/dt, taken over 50 us of the trace smoothed with a 50 us boxcar, first reaches 5
    mV/ms (approximating the Methods' 10 kHz filter, so that the threshold does not depend on the sampling
    rate); APs with a threshold outside -80 to -10 mV or a peak above 100 mV are left out as artefacts
    (standard choices, added after verification round 1).
  - 'RA-APs need at most 5 pA at threshold both relative to the holding level and in absolute terms, so
    that APs driven by a depolarizing holding current are not RA-APs (the paper, Results: steady current
    was needed in some cells to reach AIS-AP threshold, and RA-APs were absent during these periods).'
  - Each reading is also shown on the drug-free files and on the cells without spontaneous APs before
    induction (verifier, round 1).
- claim: fig1c-ra-lower-threshold-slope
  outcome: reproduced
  notebook: reproduce_rozsa_2023_induction.ipynb
  output: claim:fig1c-ra-lower-threshold-slope
  notes: 'Human, reading (c). Persistent cells (24): AIS-AP threshold median -44.1 mV against RA-AP -59.6
    mV, slope 1.79 against 0.77 mV/ms; sporadic cells (119): -44.8 against -61.4 mV, 2.18 against 0.74
    mV/ms. The paper''s rule picks the Mann-Whitney U test, P printed as 0 in all four (pooled APs, 93525
    to 1136274 per group). Per-cell medians agree (P = 0.0006 and 1.4e-05 in persistent cells, 1.4e-16
    and 1.5e-12 in sporadic cells; RA-AP median lower in 21 to 107 of the cells). Within each human sampling
    rate that has both classes (10, 16.7, 25, 50 and 100 kHz) the RA-APs have the lower threshold and
    slope, so the difference is not a sampling-rate effect. Rat gives the same direction. Reading (a)
    cannot be run (no labels).'
  deviations:
  - The pattern of a cell is that of its single epoch of continuous-recording RA-APs (fig1ab reading (i)).
  - Threshold where dV/dt, taken over 50 us of the trace smoothed with a 50 us boxcar, first reaches 5
    mV/ms (approximating the Methods' 10 kHz filter, so that the threshold does not depend on the sampling
    rate); APs with a threshold outside -80 to -10 mV or a peak above 100 mV are left out as artefacts
    (standard choices, added after verification round 1).
  - 'RA-APs need at most 5 pA at threshold both relative to the holding level and in absolute terms, so
    that APs driven by a depolarizing holding current are not RA-APs (the paper, Results: steady current
    was needed in some cells to reach AIS-AP threshold, and RA-APs were absent during these periods).'
