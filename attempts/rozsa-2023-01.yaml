  notes: 313 human files, 307 with induction sweeps. Under no reading are six of the eight values
    within tolerance. The measured values are those of the first reading (continuous-recording
    RA-APs, one epoch per cell), with none of eight within tolerance; RA-APs of several induction
    runs are joined, so durations reach 7375 s. One epoch per induction run gives one of eight
    (persistent mean duration 65.9 s), and with the interstimulus intervals two of eight (persistent
    mean duration 74.8 s, sporadic median frequency 0.316 Hz). Both patterns occur under every
    reading (26 persistent and 126 sporadic epochs under the first). SDs are printed beside the
    medians. The seed range of the mixture reading was not computed (see deviations).
  deviations:
  - RA-APs by reading (c) (APs without positive current after the first induction sweep) for the
    main result, with the mixture of reading (b) as a variant; the dandiset carries no AP labels.
  - Induction sweeps are found from the stimulus (a sweep shorter than 1 s with one positive step
    of 50 to 300 ms), since the files do not mark the protocol. Some recordings use 350 ms sweeps
    with a 250 ms step, not the 100 ms pulses of the Methods.
  - Rebound APs within 0.3 s of the end of a hyperpolarizing step are left out of the RA-APs (a
    standard choice).
  - The Methods count RA-APs "during continuous recording"; the main reading uses the sweeps with
    no stimulus step, and the interstimulus intervals are added as a variant.
  - The mixture of reading (b) uses five random starts under the claim's seed; the seed plus 1000
    to 4000 was not run, for lack of time.
