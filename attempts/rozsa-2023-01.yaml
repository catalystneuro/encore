findings:
- kind: metadata_error
  statement: Every membrane potential series gives a conversion of 1e-12 with unit volts, but the stored
    values are already in volts (medians near -0.065). Read with the stated conversion they are picovolts.
- kind: metadata_error
  statement: The stimulus series of the bleb recordings (731 sweeps) and some sweeps of other folders
    (52 active human, 11 ZD7288, 3 rat oscillation, and in 21 induction files) are stored in pA although
    their unit is amperes, giving values near 1e14 when read as stated.
- kind: metadata_insufficient
  statement: No file carries AP labels (AIS-AP or RA-AP), RAF status, or the induction protocol's sweeps,
    so the classes and epochs the paper analyses must be rebuilt from the traces. The human and rat induction
    files carry no morphological cell class (NGFC, non-NGFC, rosehip), which only the bleb files record.
- kind: data_missing
  statement: The local KCl application experiments (Figure 2I to 2L) are not identifiable in the dandiset,
    and only 2 of the 90 rat recordings without carbachol and SCH23390 (Figure S3) are in it. The in vivo
    folder records no anesthesia condition for any cell (Figure S5). The induction folders hold 313 human
    and 132 rat files against the 385 and 259 cells the paper tested.
- kind: selection_undocumented
  about: data
  statement: The induction folders are named Human_persistent_RAF and Rat_persistent_RAF, and nearly all
    their cells fire APs without current after induction, but the paper reports RAF in a quarter to a
    third of tested cells. 124 of 307 human and 33 of 118 rat cells already fire spontaneous APs before
    induction, and 58 human and 94 rat files list drugs (including carbachol, SCH23390 and calcium changes)
    that the induction experiments of the paper do not mention. The dandiset does not say how its cells
    were selected from those the paper tested.
- kind: other
  about: data
  statement: Sampling rates vary within and across files (5 to 200 kHz, mostly 16.7, 25, 50 and 100 kHz)
    against the 50 kHz of the Methods; the long gap-free sweeps of the induction files are often at 5
    kHz. One bleb file (sub-20220317) has no bleb sweeps.
- kind: methods_unavailable
  statement: How AIS-APs and RA-APs were separated (a threshold and pre-AP slope boundary, per preparation
    or per cell), how a recording was cut into RAF epochs, and the sag fraction formula are not given.
    A two-component mixture on threshold and slope gives a lower-threshold component with the steeper
    slope in the human active slices, the in vivo recordings and the induction recordings, the opposite
    of the paper's RA-APs, so the claims on spontaneous human and in vivo activity cannot be tested. Could
    the authors give the per-AP labels or the boundary used, and the epoch definition?
- kind: other
  about: data
  statement: 18 session identifiers name both an induction file and an active-slice file (2 human, 16
    rat, for example ses-1611161tm-3-1-4 in Rat_persistent_RAF and in In_vitro_oscillation_Rat); the active-slice
    files are larger and carry an LFP. Whether these are the same recordings deposited twice is not documented,
    and 16 of the 18 induction files list drugs.
- kind: other
  about: data
  statement: In the soma and bleb recordings the somatic AP thresholds lie at -30 to -11 mV with and without
    current, the voltage jump at the onset of depolarizing steps implies 26 to 57 MOhm of uncompensated
    resistance, and hyperpolarizing steps of -700 to -950 pA drive the recorded potential below -150 mV
    (sweep minima down to -434 mV). Bridge balance is not recorded.
- kind: metadata_insufficient
  statement: The in vivo files give the genotype only inside subject/description (five values, including
    both 'mouse' and 'mouse-black6') and do not record the anesthesia condition; the folder holds 259
    files from 149 mice against the paper's 242 cells, and some files also hold camera images ('Moovie').
verifications:
- date: '2026-11-21'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebooks)
  reviewed: The first executed notebooks (slices and induction) with the conclusion cells and the summary
    removed, the helper module raf.py and the claims file, with the paper's full text. The verifier read
    the archive's file list and asset metadata through the DANDI API and tested helper functions on synthetic
    inputs (the threshold walk and the mixture). It had no attempt record.
  results:
  - claim: fig1ab-raf-patterns
    agrees: true
    outcome: not_reproduced
    reason: 'The best reading matches 2 of 8 values (RA-APs including interstimulus intervals, epoch reading
      ii). The continuous-only reading, which the criterion names, gets 0 or 1 of 8. Both RAF patterns
      occur. The RA-AP set is suspect (problems 1 to 3): RA-APs are judged relative to the holding current,
      spontaneous firing before induction is never measured, drug-treated files are kept, and the reading
      (b) mixture is taken over by artefact APs.'
    response: The threshold is now found on a 50 us smoothed dV/dt, artefact APs are removed, and RA-APs
      need no positive current in absolute terms (problems 1, 3 and 5). Holding currents and pre-induction
      firing are now printed per file, and every reading is shown on all cells, on drug-free files and
      on cells quiet before induction. The mixture, refitted on clean robustly scaled features, still
      gives an RA component with the steeper slope and a seed-dependent size, so its rows are marked as
      not a reading of the paper's classes. At most 2 of 8 values match under any reading or subset; outcome
      unchanged.
  - claim: fig1c-ra-lower-threshold-slope
    agrees: true
    outcome: reproduced
    reason: 'Under reading (c), human RA-APs have lower median threshold (-59.8 vs -44.2 mV persistent,
      -61.2 vs -44.5 sporadic) and lower slope, with P near 0, and the per-cell variant agrees. This depends
      on problem 5: the threshold walk stops early on noise at high sampling rates, and sampling rate
      is never compared between AIS-AP and RA-AP sweeps.'
    response: The threshold is now found on a 50 us smoothed dV/dt, artefact APs are removed, and RA-APs
      need no positive current in absolute terms (problems 1, 3 and 5). A synthetic test in the data check
      shows the threshold within about 1 mV of the true value from 5 to 200 kHz, and the comparison is
      shown within each sampling rate; RA-APs have the lower threshold and slope at every human rate with
      both classes. Outcome unchanged.
  - claim: fig1d-human-raf-proportion
