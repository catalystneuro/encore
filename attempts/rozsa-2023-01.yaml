- claim: fig1hk-bleb-initiation-order
  outcome: not_reproduced
  notebook: reproduce_rozsa_2023_slices.ipynb
  output: claim:fig1hk-bleb-initiation-order
  notes: The two human NGFC dual recordings are found by their celltype field (220504 and 220505 recording
    2). The mixture's classes agree with the paper's description (RA component threshold -64.5 against
    -21.9 mV, slope 0.14 against 1.15 mV/ms; the same 74 RA-APs under all five seeds). In 220504, AIS-APs
    (n = 340) have a median soma-to-bleb latency of -0.20 ms at threshold and -0.14 ms at peak, so the
    bleb leads; RA-APs (n = 41) -0.18 ms and +0.20 ms. In 220505-2 all 62 somatic APs fall in the AIS
    class (+0.16 ms at threshold, +0.12 ms at peak) and there are no RA-APs. Neither cell shows AIS-APs
    positive and RA-APs negative. Split by the sign of the latency, which is not a reading of the criterion,
    the bleb-first APs of 220504 (n = 141) have the lower threshold (-27.5 against -18.3 mV) and slope
    (0.25 against 1.55 mV/ms). Soma and bleb sweeps of the same number start at the same time in every
    file. Somatic thresholds lie at -30 to -11 mV in every file, with or without current, and the voltage
    jump at step onset implies 26 to 57 MOhm of uncompensated resistance, so the somatic thresholds of
    these files are doubtful (verifier, round 1).
  deviations:
  - The bleb signal is small (peaks mostly below 0 mV), so bleb APs are not detected on their own; the
    bleb peak is the maximum within 3 ms of the somatic peak in the bleb sweep of the same number, and
    its threshold the start of the run with dV/dt at least 5 mV/ms before it (standard choices), with
    the smoothed dV/dt of the somatic APs.
  - The mixture of reading (b) is fitted to the somatic APs of the five human bleb recordings pooled.
  - Threshold where dV/dt, taken over 50 us of the trace smoothed with a 50 us boxcar, first reaches 5
    mV/ms (approximating the Methods' 10 kHz filter, so that the threshold does not depend on the sampling
    rate); APs with a threshold outside -80 to -10 mV or a peak above 100 mV are left out as artefacts
    (standard choices, added after verification round 1).
