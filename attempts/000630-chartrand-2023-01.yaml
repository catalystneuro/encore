- claim: dandiset-cell-link
  outcome: reproduced
  notebook: reproduce_chartrand_2023.ipynb
  output: claim:dandiset-cell-link
  notes: All 210 files match one row each of the paper's cell table through the LIMS number (session_id
    equals the Ephys_Roi_Result number in the table's nwb_path); 204 files carry the table's cell name
    and 6 carry a time stamp in its place. Sex agrees for 209 of 210 cells (one file says unknown, the
    table M) and age in whole years for 207 of 208 with a known age (largest difference 1 year). The features
    computed here agree with the paper's table within 1% for 71 to 98% of cells per feature (Spearman
    0.92 to 1.00), except the adaptation ratios (4 to 53%). The dandiset holds exactly the paper's primary
    set P (210 Seattle cells of the strict L1 set with long square features); the 62 Amsterdam and Szeged
    cells of the strict set are not in it.
  deviations:
  - The match uses the LIMS number, as no file names its t-type or the table's specimen id.
