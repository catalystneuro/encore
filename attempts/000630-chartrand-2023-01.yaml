- claim: figs3a-sag-adaptation
  outcome: not_reproduced
  notebook: reproduce_chartrand_2023.ipynb
  output: claim:figs3a-sag-adaptation
  measured: 0.334
  notes: OLS of the upstroke adaptation ratio (third over first spike, the order that matches the paper's
    table) on sag with HC3 errors over 192 cells gives R2 = 0.334 (p = 1.3e-12) on the features computed
    here and R2 = 0.359 (p = 3.3e-14) on the paper's values, against 0.74 +/- 0.074. With the order first
    over third R2 is 0.149. The slope is negative (-0.61), so cells with more sag change their upstroke
    more from the first to the third spike, the opposite of the direction the criterion states. On the
    medians of the ten t-types R2 is 0.28 to 0.31. The paper's own per-cell values with the code's regression
    do not give 0.74 either.
  deviations:
