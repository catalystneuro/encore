  notebook: mouse_comparison.ipynb
  output: claim:fig4d-mouse-no-rosehip-ephys
  notes: 235 mouse VIS cells passing QC. MC4R median sag 0.141 to 0.147 is above LAMP5's 0.041 to 0.042
    (Dunn FDR p about 1e-9). 4 of 18 MC4R cells have an irregularity ratio above 0.4, so reading (a),
    none, fails and reading (b), a minority, holds. Of the 30 cells above 0.4, 15 are LAMP5, 11 L1 VIP
    and 4 MC4R (not mostly LAMP5), and the largest t-type among them is Lamp5 Plch2 Dock5 (8) before Lamp5
    Ntn1 Npy2r (6). The moderate sag holds; the restriction of irregular firing to LAMP5 cells does not.
  deviations:
  - ir_late_mean is the paper's value (custom code not released).
  - Features follow the claims file's O1. Reading (a) uses the features computed here with IPFX 2.1.2
    from the long square sweeps where they agree with the paper's aibs_features_E.csv within 1% for at
    least half of the cells (39 features), and the paper's values for the other 55 (custom features the
    paper did not release, ramp, short square and chirp features, and the adaptation ratios, which agree
    within 1% for only 4 to 53% of cells). Reading (b) uses the paper's values throughout.
  - 22 of the paper's strict mouse L1 cells (20 in VISp layer 1) have no file in DANDI 000020.
  - Cell labels (t-type, subclass, layer, region, donor) come from the paper's cell table through the
    link claim dandiset-cell-link.
