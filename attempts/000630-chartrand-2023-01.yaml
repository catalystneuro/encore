findings:
- kind: metadata_insufficient
  statement: The files carry no t-type, subclass, cortical layer, brain region or donor medical condition,
    and no specimen id of the paper's cell table. They can be linked to the paper's table only through
    the LIMS number in session_id, which equals the Ephys_Roi_Result number inside the table's internal
    nwb_path column; the dandiset's description points to the code repository but does not say how to
    link.
- kind: identifier_missing
  statement: Six files (five of donor 1122692698, one of 1154304730) carry a time stamp such as 2021_08_17_112853
    in general/source_script file_name, where the other 204 carry the cell name (for example H21.03.315.11.11.01.01).
- kind: format_error
  statement: In 145 of 210 files, 2586 long square sweeps that stopped early hold zeros for the samples
    that were not acquired, where NWB readers such as IPFX expect missing values. IPFX's integrity check
    passes them and reads the step to 0 mV as a spike, which changes rheobase and spike features unless
    the sweeps are left out.
- kind: format_error
  statement: bias_current is stored in pA, with a unit attribute of pA, where the NWB schema fixes the
    unit of bias_current as amperes; a reader that follows the schema gets values 10^12 times too large.
- kind: metadata_error
  statement: The two files of donor 922967568 state an age of P0.0D where the paper's table gives the
    age as unknown, and one file (session 977186103) states sex unknown where the table gives M. The species
    is written as Homo Sapiens in 192 files and Homo sapiens in 18.
- kind: data_missing
  statement: The dandiset holds only the 210 Seattle cells of the paper's primary set. The Amsterdam and
    Szeged recordings (62 cells of the strict L1 set, 136 in the paper's table), which the paper uses
    as held-out validation (Fig. S8B) and in its LAMP5 t-type analysis, are not in it, and the paper names
    no other deposit of them.
- kind: selection_undocumented
  statement: The dandiset holds exactly the paper's primary set P, the Seattle cells of the strict L1
    set (soma in L1 or within 40 um of the L1/L2 border) whose long square features were extracted. The
    12 Seattle cells of the strict set that failed feature extraction and the other Seattle cells of the
    paper's table are not deposited, and the dandiset's description does not say how the cells were selected.
- kind: metadata_insufficient
  statement: The donor medical condition is given in the public cell table for only 86 of the 194 cells
    of P in L1 t-types and 20 of the 78 reconstructed strict-set cells; the paper's code read it from
    the Allen Institute's donor database. The claims on medical condition cannot be repeated on the paper's
    cells.
- kind: methods_unavailable
  statement: Several features the claims rest on (irregularity ratio, depolarizing sag, ADP slope and
    voltage, sag time to peak and time constant, the ramp, short square and chirp features) come from
    code the Methods say will be released in a future IPFX version; it is not in IPFX 2.1.2 nor in the
    code repository. The adaptation ratios computed here from the Methods' definition (third over first
    spike on the lowest step with at least 4 spikes) agree with the paper's values within 1% for only
    4 to 53% of cells. The authors are asked whether the feature code can be released.
- kind: methods_unavailable
  statement: The authors are asked what d' counts as high in Fig. 6A, where LAMP5 NMBR against LCP2 is
    said to be the only within-subclass pair with high d'. With the 2.2 grouping threshold it holds here;
    with the median between-subclass d' (2.40 to 2.62) no within-subclass pair is high.
- kind: methods_unavailable
  statement: The authors are asked whether the two-way ANOVA of Fig. 3D was run on ranks with Type II
    sums of squares and heteroskedasticity-corrected tests (legend and Data S4), or on raw values with
    Type I sums of squares, as the code calls anova_lm without its robust option. The AP height species
    effect is FDR p = 2.6e-38 under the first and 1.4e-43 under the second, on either side of the legend's
    1e-38.
- kind: code_mismatch
  statement: The Fig. S3A legend gives R2 = 0.74 for the upstroke adaptation ratio against sag. The code's
    regression (run_regressions, OLS with HC3) on the paper's own per-cell values over the cells of P
    in L1 t-types gives R2 = 0.36 (192 cells), and 0.31 on t-type medians.
- kind: other
  statement: For the mouse comparison (DANDI 000020 version 0.210913.1639, an outside input), 22 of the
    paper's 272 strict mouse L1 cells, 20 of them in VISp layer 1 and one of them a Lamp5 Krt73 cell,
    have no file in that version, and none of the paper's 15 mouse TEa cells does.
