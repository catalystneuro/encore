- claim: dandiset-cell-link
  outcome: partially_reproduced
  notebook: reproduce_chartrand_2023.ipynb
  output: claim:dandiset-cell-link
  notes: 'All 210 files match one row each of the paper''s cell table through the LIMS number (session_id
    equals the Ephys_Roi_Result number in the table''s nwb_path); 204 files carry the table''s cell name
    and 6 carry a time stamp in its place. Age agrees for all 208 cells with a known age: the files state
    ages as whole years times 365 days, and the one mismatch of the first run came from dividing by 365.25.
    The records do not all agree, so the partial level applies (at least 90% of files match and agree).
    One file (H19.03.321.12.04.01.04) states sex unknown where the table gives M, and the two files of
    donor 922967568 state an age of P0.0D where the table has none. Of the 44 features computed here,
    the 39 used in reading (a) agree with the paper''s table within 1% for 53 to 98% of cells (Spearman
    0.886 to 0.997); the five adaptation ratios not used agree for 4 to 37%. Where a feature at rheobase
    + 40 pA differs, the sweep chosen here is often another one than the paper''s. For the initial firing
    rate at rheobase + 40 pA, 31 cells differ by more than 1% or have a value on one side only: 10 take
    another repeat of the same amplitude here, 6 another amplitude, 13 have no sweep here that gives the
    paper''s value (5 of all cells have a different rheobase), and 2 have a value on one side only. In
    16 cells no sweep passing QC lies 39 to 61 pA above rheobase and IPFX falls back to the spiking sweep
    closest to rheobase + 39 pA; 7 of them agree with the paper''s value, and in 7 of the 9 that do not,
    the paper''s value comes from a sweep in range that fails here only the Methods'' 500 ms rms noise
    criterion. Without that criterion the 39 features agree with the paper''s values for more cells in
    38 of them (median share 0.933 against 0.895). The dandiset holds exactly the paper''s primary set
    P (210 Seattle cells of the strict L1 set with long square features); the other 62 cells of the strict
    set, 50 Amsterdam and Szeged cells and 12 Seattle cells that failed feature extraction, are not in
    it.'
  deviations:
  - The match uses the LIMS number, as no file names its t-type or the table's specimen id.
