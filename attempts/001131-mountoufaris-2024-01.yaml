- claim: figs4a-unilateral-no-behavior-deficit
  outcome: reproduced
  assumed: true
  notebook: reproduce_mountoufaris_2024.ipynb
  output: claim:figs4a-unilateral-no-behavior-deficit
  notes: No measure with a defined summary differs between groups at p < 0.05 (Mann-Whitney per mouse); the smallest
    p over the six is 0.114 (sniff time as a percentage of the interaction). Total sniff time 89.1 s control, 93.1
    s experimental (p = 0.61); sniff bout duration 10.2 and 2.5 s (p = 0.17, the control mean raised by mouse 511's
    two long bouts); total attack time 54.1 and 91.5 s (p = 0.25); attack bout duration 3.3 and 2.4 s (p = 0.25);
    latency 261 and 91 s (p = 0.25); interval between attacks 30.9 and 11.7 s (p = 0.39). Attack probability, four
    readings. (a) attack-triggered probability of attacking over 0 to 10 s, mean 0.45 and 0.36 (p = 0.25), the adopted
    reading; (b) its decay to 1/e, 4.7 and 3.0 s (p = 0.25); (c) share of the interaction attacking, 4.3 and 10.7%
    (p = 0.14); (d) attack bouts per minute, 0.80 and 2.79 (p = 0.036, the smallest p 3 and 5 mice allow), the experimental
    mice attacking more often. Under reading (d) the criterion would fail, on a difference towards more aggression,
    not a deficit.
  deviations:
  - The dandiset holds 4 control and 6 experimental mice, against 5 and 7 in the paper. Mice 510 and 500 have no
    attack annotation, so attack measures use 3 control and 5 experimental mice.
  - The intruder's entry is not marked; the interaction is taken to start at the first annotated behaviour (an assumption),
    which sets the latency to the first attack and the duration used for percentages.
  - Assumption. The attack probability of panel S4A(vii) is plotted against time (0 to 10 s) with no per-mouse summary;
    it is read as the attack-triggered probability of attacking over the 10 s after an attack onset, averaged over
    onsets, as the S3C legend lists "the number and the time-varying probability (iv-v) of attack bouts" as two
    measures and S2C and S3C give a decay constant ("tau attack probability"), so a bout rate is the number of bouts
    per time, not the probability. Its decay, the share of time attacking and the bout rate are shown as the other
    readings; the bout rate differs between groups.
  - The interval between attacks is taken from the end of one bout to the start of the next; onset to onset is also
    shown, with the same outcome.
