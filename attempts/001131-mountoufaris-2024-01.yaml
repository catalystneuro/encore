- claim: figs5e-behavior-decoding-intact
  outcome: not_reproduced
  notebook: reproduce_mountoufaris_2024.ipynb
  output: claim:figs5e-behavior-decoding-intact
  notes: 'With the paper''s frame-wise stratified five-fold split, every control mouse decodes attack
    against sniffing better than every experimental mouse (C = 1: 0.993 against 0.934; C = 0.1 and 10
    alike), and the Mann-Whitney test across mice finds the difference at p = 0.036, the smallest p that
    3 and 5 mice allow. The difference is small (0.06 to 0.07). The frame-wise split leaves frames of
    the same bout in training and test sets: decoders trained on shuffled bout labels score 0.988 and
    0.922, and real against shuffled does not differ (p = 0.40 and 1.0). With whole bouts held out (a
    variant), accuracy is 0.78 and 0.53 and the groups do not differ (p = 0.25).'
  deviations:
  - The dandiset holds 4 control and 6 experimental mice, against 5 and 7 in the paper. Mice 510 and 500
    have no attack annotation; 3 control and 5 experimental mice are used.
  - The cross-validation scheme is the stratified five-fold split the claims file takes from the sex decoder;
    the SVM's C is not given, and C = 0.1, 1 and 10 all give the same outcome.
  - Shuffled decoders are repeated 20 times per mouse, not 1,000; they do not decide the outcome.
- claim: fig6-rslds-fit-quality
  outcome: not_reproduced
  notebook: rslds_seeds_0_1.ipynb
  output: claim:fig6-rslds-fit-quality
  measured: 59.4
  notes: Under all four seeds the emissions reconstruction explains 59.4% of the variance in control and
    58.6 to 58.7% in experimental mice (range 49.6 to 66.4% over mice), against 85 +/- 8.5%. The forward-prediction
    R2 does not differ between groups (p = 0.114 at 1 s and 5 s for every seed). Attack frames fall mostly
    in one state in 6, 7, 8 and 8 of the 8 mice with attack annotations (seeds 0 to 3), and at least 90%
    in one state in 4, 3, 2 and 1. The fits of mice 510 and 500 do not recover the authors' deposited
    latent factor 1 weights (|Spearman r| at most 0.47 for any dimension). Seeds 0 and 1 are in rslds_seeds_0_1.ipynb
    and seeds 2 and 3 in rslds_seeds_2_3.ipynb, with the same cells and tags.
  deviations: &id001
  - The files hold only the male-intruder part of each session, so the claims file's two readings of the
    frames fit (male-intruder part, whole session) are the same, the whole file.
  - Fits use the z-scored traces only; the sigma-normalized reading is not fit, as it needs the unmarked
    baseline and differs from the z-scored trace only by a per-unit scale and offset.
  - Performance is the R2 of 1-s and 5-s forward predictions of the latents on the fit data; the paper's
    score uses held-out cross-validation folds (STAR Methods, Dynamical system models), which would need
    five more fits per mouse and seed and was not run.
  - Mice 510 and 500 have no attack annotation; for reading (a) their state is the one holding most sniffing
    frames.
  - Seeds 0 to 3 are split over two notebooks to stay under the 60-min limit per notebook.
  - ssm (commit eb6c8aa) cannot be built in the locked environment's isolated build (its setup.py imports
    numpy and Cython without declaring them), so the notebooks install it at that commit without build
    isolation, against the locked numpy, Cython and setuptools (vmh.ensure_ssm).
