- claim: figs5e-behavior-decoding-intact
  outcome: not_reproduced
  notebook: reproduce_mountoufaris_2024.ipynb
  output: claim:figs5e-behavior-decoding-intact
  notes: With the paper's frame-wise stratified five-fold split, every control mouse decodes attack against sniffing
    better than every experimental mouse (C = 1, 0.994 against 0.934; C = 0.1 and 10 alike), and the Mann-Whitney
    test across mice finds the difference at p = 0.036, the smallest p that 3 and 5 mice allow. With 31 units drawn
    per mouse in each repeat the difference is larger (0.12 to 0.13) and still at p = 0.036 for every C, so unit
    counts do not explain it. The measure is weak. The frame-wise split leaves frames of the same bout in training
    and test sets, so decoders trained on shuffled bout labels score 0.981 to 0.988 (control) and 0.904 to 0.925
    (experimental) over C, far above the paper's 50% chance, and real and shuffled accuracy do not differ in either
    group at any C or unit count (p from 0.10 to 1.0). With whole bouts held out (a variant), accuracy is 0.79 and
    0.53 against shuffled 0.53 and 0.50, and the groups differ at p = 0.036.
  deviations:
  - The dandiset holds 4 control and 6 experimental mice, against 5 and 7 in the paper. Mice 510 and 500 have no
    attack annotation; 3 control and 5 experimental mice are used.
  - The cross-validation scheme is the stratified five-fold split the claims file takes from the sex decoder; the
    SVM's C is not given, and C = 0.1, 1 and 10 all give the same outcome.
  - Shuffled decoders are repeated 20 times per mouse, not 1,000; they do not decide the outcome.
  - Units are not subsampled in the paper's method; a variant with 31 units per mouse (the smallest count among
    these mice) is shown and gives the same outcome.
- claim: fig6-rslds-fit-quality
  outcome: not_reproduced
  notebook: rslds_seeds_0_1.ipynb
  output: claim:fig6-rslds-fit-quality
  measured: 59.4
  notes: Under all four seeds the emissions reconstruction explains 59.4% of the variance in control and 58.4 to
    58.7% in experimental mice (range 49.5 to 66.4% over mice), against 85 +/- 8.5%. The forward-prediction R2 does
    not differ between groups (p = 0.114 at 1 s and 5 s for every seed). Attack frames fall mostly in one state
    in 7, 8, 8 and 8 of the 8 mice with attack annotations (seeds 0 to 3), and at least 90% in one state in 3, 2,
    3 and 5. Checks for seed 0 (rslds_checks.ipynb). Sigma-normalized fits explain 69.0% (control) and 63.6% (experimental),
    and their forward R2 differs between groups (p = 0.016). On held-out frames the reconstruction explains 47.9%
    and 41.0%, and forward predictions of the activity do not differ over 1 s (p = 0.26) but do over 5 s (0.371
    against 0.198, p = 0.010). The 85% may be a measure other than the emissions R2; that is asked of a reader (questions/001131.yaml).
    The fits of mice 510 and 500 do not recover the authors' latent factor 1 (|Spearman r| at most 0.47 for dimension
    1, 0.70 for any dimension). Seeds 0 and 1 are in rslds_seeds_0_1.ipynb and seeds 2 and 3 in rslds_seeds_2_3.ipynb,
    with the same cells and tags; rslds_checks.ipynb holds the seed-0 sigma-normalized fits and a held-out score.
  deviations: &id001
  - The files appear to hold only the male-intruder part of each session (no description, keyword or series name
    mentions a female interaction), so the claims file's two readings of the frames fit (male-intruder part, whole
    session) are taken as the same, the whole file.
  - The fits use the z-scored traces; the sigma-normalized reading is fit for seed 0 only (rslds_checks.ipynb, 9
    mice with a baseline), and does not change any outcome.
  - Performance is the R2 of 1-s and 5-s forward predictions of the latents on the fit data. The paper's score uses
    held-out folds it does not describe (STAR Methods, Dynamical system models); a one-fold held-out score of the
    activity, for seed 0, is in rslds_checks.ipynb.
  - Mice 510 and 500 have no attack annotation; for reading (a) their state is the one holding most sniffing frames.
  - The fit call uses alpha = 0.0, as in the fit call of the ssm notebook the claims file names (notebooks/4-Recurrent-SLDS.ipynb
    at eb6c8aa); the first run used ssm's default, 0.5.
  - Seeds 0 to 3 are split over two notebooks to stay under the 60-min limit per notebook.
  - ssm (commit eb6c8aa) cannot be built in the locked environment's isolated build (its setup.py imports numpy
    and Cython without declaring them), so the notebooks install it at that commit without build isolation, against
    the locked numpy, Cython and setuptools (vmh.ensure_ssm).
