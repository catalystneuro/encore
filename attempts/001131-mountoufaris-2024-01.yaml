- claim: figs4e-active-units-unchanged
  outcome: reproduced
  assumed: true
  notebook: reproduce_mountoufaris_2024.ipynb
  output: claim:figs4e-active-units-unchanged
  notes: With the baseline of all frames before the first annotated behaviour, neither reading of "nested" finds
    a difference (pooled p = 0.09 at 1 min and 0.76 at 2 min; per-mouse means p = 0.56 and 0.90; 3.90 against 3.42
    sigma on per-mouse means at 1 min); the gap10 variant agrees (0.06, 0.27, 0.29, 0.56). With the 7-s baseline
    the per-mouse test finds none (p = 0.19) but the pooled test finds control higher at p < 0.001 (12.8 against
    8.5 sigma at 1 min), so under the pooled reading the outcome depends on the baseline.
  deviations:
  - The files mark neither the pre-intruder baseline nor the intruder's entry. The baseline is taken as the frames
    before the first annotated behaviour (readings all of them, or the last 7 s), and the interaction as starting
    at that behaviour; this is an assumption (STAR Methods, Micro-endoscopic data extraction, baseline "during 7sec
    or more" before the first trial; Behavior annotations, a 5-min baseline starts every session). Mouse 488 has
    6.2 s before its first annotation and is left out.
  - The dandiset holds 4 control and 6 experimental mice, against 5 and 7 in the paper.
  - Assumption. The baseline is all frames before the first annotated behaviour, not the last 7 s of them. The Methods'
    baseline is a 5-min period alone in the home cage (Behavior annotations), of which those frames are the nearest
    stand-in; the last 7 s is only the Methods' minimum ("during 7sec or more", Micro-endoscopic data extraction)
    and gives a narrow baseline that inflates sigma (nearly twice as many control and 2.5 times as many experimental
    units pass 2 sigma). With this baseline both readings of "nested" agree. The first run instead assumed "nested"
    to be a test across mice; the same all baseline with pooled units also reproduces fig4ef-male-activity-slightly-lower.
