- claim: figs4a-unilateral-no-behavior-deficit
  outcome: reproduced
  assumed: true
  notebook: reproduce_mountoufaris_2024.ipynb
  output: claim:figs4a-unilateral-no-behavior-deficit
  notes: No measure differs between groups at p < 0.05 (Mann-Whitney per mouse); the smallest p over the
    listed measures is 0.11 (sniff time as a percentage of the interaction). Total sniff time 89.1 s control,
    93.1 s experimental (p = 0.61); sniff bout duration 10.2 and 2.5 s (p = 0.17, the control mean raised
    by mouse 511's two long bouts); total attack time 54.1 and 91.5 s (p = 0.25); attack bout duration
    3.3 and 2.4 s (p = 0.25); latency 261 and 91 s (p = 0.25); interval between attacks 30.9 and 11.7
    s (p = 0.39). Attack measures use 3 control and 5 experimental mice, for which the smallest attainable
    p is 0.036. The experimental mice attack more than the controls (42 against 15.7 bouts, p = 0.036,
    a measure the claim does not list). The attack probability of S4A(vii) was not tested.
  deviations:
  - The dandiset holds 4 control and 6 experimental mice, against 5 and 7 in the paper. Mice 510 and 500
    have no attack annotation, so attack measures use 3 control and 5 experimental mice.
  - The intruder's entry is not marked; the interaction is taken to start at the first annotated behaviour
    (an assumption), which sets the latency to the first attack and the duration used for percentages.
  - The attack probability of panel S4A(vii) is a time course whose summary the paper does not define;
    it is not computed, so six of the seven measures are tested.
  - The interval between attacks is taken from the end of one bout to the start of the next; onset to
    onset is also shown, with the same outcome.
