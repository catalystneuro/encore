- claim: fig4ef-male-activity-slightly-lower
  outcome: reproduced
  assumed: true
  notebook: reproduce_mountoufaris_2024.ipynb
  output: claim:fig4ef-male-activity-slightly-lower
  notes: 'Under the pooled reading of "nested", experimental activity in sigma is lower than control by
    both the Mann-Whitney and the KS test at p < 0.05 under every baseline reading and both windows (baseline
    all, 1 min: 0.53 against 0.95 sigma, Mann-Whitney p = 0.002, KS p < 0.001, 587 control and 474 experimental
    units). On per-mouse means or medians (4 and 5 mice) no comparison reaches p < 0.05 (p from 0.06 to
    0.73). The experimental mean is about half the control mean, more than "slightly". Z-scored activity
    is also lower when pooled (KS p = 0.009 at 1 min, 0.0005 at 2 min), but its Mann-Whitney test is not
    significant (p = 0.24 and 0.12).'
  deviations:
  - The files mark neither the pre-intruder baseline nor the intruder's entry. The baseline is taken as
    the frames before the first annotated behaviour (readings all of them, or the last 7 s), and the interaction
    as starting at that behaviour; this is an assumption (STAR Methods, Micro-endoscopic data extraction,
    baseline "during 7sec or more" before the first trial; Behavior annotations, a 5-min baseline starts
    every session). Mouse 488 has 6.2 s before its first annotation and is left out.
  - '"Nested" tests are not defined; both readings of the claims file are run, units pooled and per-mouse
    means (or medians for KS claims).'
  - The dandiset holds 4 control and 6 experimental mice, against 5 and 7 in the paper.
  - The claim's outcome rests on the pooled reading of "nested"; the per-mouse reading does not reproduce
    it.
