findings:
- kind: data_missing
  statement: The dandiset holds the miniscope data of 4 control and 6 experimental mice, where the paper reports
    5 and 7 (STAR Methods, Micro-endoscopic data extraction). The female-intruder part of every imaging session
    is absent, as are the behaviour cohorts of Figures 2 and 3, the fiber photometry and the slice imaging, although
    the paper's data statement says the source data will be deposited at DANDI. 20 of the 36 claims cannot be tested
    for these reasons.
- kind: metadata_insufficient
  statement: The files mark neither the 5-min pre-intruder baseline, nor the intruder's entry and removal. The paper's
    activity measures are in units of sigma relative to that baseline, and Figure 6E uses the post-intruder period;
    here the baseline had to be assumed from the first annotated behaviour, and the post-intruder claim could not
    be tested. Only z-scored traces are given, not dF/F.
- kind: metadata_error
  statement: The files of mice 510 and 500 describe their trace as "DF/F" with "GCaMP6m". The values are z-scores
    (every unit of mouse 510 has mean 0 and SD 1), and the paper says the imaged mice carried "an AAV vector that
    encodes both the gRNAs and a Cre-dependent GCaMP8s" (Results, Single cell CRISPRoscopy imaging).
- kind: data_missing
  statement: 'The files of mice 510 and 500 hold only sniffing annotations (series named "Ch1: sniffing"), with
    no attack or mounting, although the paper''s exemplar mice attack. Mouse 510''s sniffing bouts all fall between
    179 and 279 s of a 1200-s recording.'
- kind: other
  statement: 'The unit counts per group differ from the STAR Methods in the other direction from the mouse counts:
    587 control units in 4 mice and 554 experimental units in 6 mice, against 585 in 5 and 546 in 7.'
- kind: other
  statement: The two files of the earlier version 0.240826.1647 (subjects ControlMouse and MutantMouse) are the
    same recordings as mice 510 and 500 of version 0.260601.1203, with identical traces, sniffing bouts and rSLDS
    weights under different subject ids.
- kind: metadata_insufficient
  statement: The group of each mouse is given only by the prefix of its subject id (ctrl, mut) and, in eight files,
    a keyword; there is no genotype or description of the gRNA. Nine sessions carry the same start date (2023-02-01),
    apparently a placeholder.
- kind: other
  statement: The trace of mouse 500 is not z-scored over its file (unit SDs 0.65 to 1.05, means up to 0.23 away
    from 0), unlike the other nine, so it was z-scored over a longer recording and then cut.
- kind: other
  statement: 'The rSLDS weights deposited for mice 510 and 500 ("latent factor 1") are not recovered by fits with
    the settings of the claims file: their |Spearman r| with the weights of any fitted dimension is at most 0.47
    over four seeds. The fits'' time constants are hundreds of seconds and their variance explained 59%, against
    85% in the paper.'
- kind: methods_unavailable
  statement: 'Questions for the authors. (1) Where does the pre-intruder baseline lie in each file, and when did
    each intruder enter and leave? (2) What are the "nested" Mann-Whitney and KS tests: GraphPad nested tests across
    mice, or tests on pooled units? The outcomes of fig4ef and figs4e depend on this. (3) For the rSLDS, which frames
    were fit, with which seeds and restarts, how were the cross-validation folds and horizon of the performance
    score formed, which state''s dynamics matrix gives the time constants, and how are complex eigenvalue pairs
    (two equal time constants) treated in the line attractor score? (4) How is ACHW computed (which estimator of
    the autocorrelation, whether the window''s mean is removed, over which window)? (5) How is the attack probability
    of Figure S4A(vii) computed and summarized per mouse? (6) Mouse 511 has two sniffing bouts of 22 and 40 s; is
    that annotation complete?'
- kind: paper_inconsistency
  statement: The Results give n=4 control mice for Figure 4E-F, while the Figure 4 and S4 legends and the STAR Methods
    give 5. The dandiset holds 4 control mice.
