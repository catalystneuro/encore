outcomes:
- claim: sessions-and-tracks
  outcome: reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:sessions-and-tracks
  notes: 4 subjects and 8 sessions, each with PRE, MAZE and POST epochs in that order (8 of 8), on
    a 1.6 m linear track (4 sessions), a 2 m linear track (1) and a circular track (3). PRE lasts
    2.98 to 5.37 h, MAZE 34.5 to 92.7 min and POST 2.22 to 4.51 h. The rooms the paper names are not
    in the files.
- claim: place-cell-count
  outcome: not_reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:place-cell-count
  measured: 417
  notes: 417 of the 562 pyramidal units have a smoothed rate-map peak of 1 Hz or more on running,
    below 491 by more than the tolerance of 49. At 0.5 Hz the count is 480 (within tolerance), at
    2 Hz 352. By subject, Achilles 181, Buddy 30, Cicero 127, Gatsby 79.
  deviations:
  - The place-cell definition is a common choice (peak of 1 Hz or more on running above 5 cm/s, 2
    cm bins, 4 cm smoothing); the paper's definition is in the supplementary Methods, which were
    not available.
- claim: fig1c-post-gt-pre
  outcome: not_reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig1c-post-gt-pre
  notes: Pooled over sessions, as the criterion fixes the test, POST does not exceed PRE (mean rZ
    0.763 against 0.770, Tukey on ranks after Kruskal-Wallis p = 0.412). Within sessions it does;
    POST is higher in 8 of 8 sessions (sign test p = 0.0039; one-sided rank-sum p < 0.05 in 6), and
    with each session's PRE mean subtracted POST is higher by 0.106 (p = 2.3e-14). The pooled test
    is dominated by the three circular-track sessions, which score lower in every epoch (PRE 0.161
    and POST 0.260 against 1.112 and 1.207 on the linear tracks, where the event takes the better
    of two templates) and supply 11161 of 23801 POST events but 5912 of 16448 PRE events. By
    subject, POST minus PRE is +0.089 (Achilles), +0.185 (Buddy), +0.021 (Cicero) and -0.173
    (Gatsby) when pooled within subject.
  deviations:
  - Candidate events are population bursts of all units holding a ripple (150 to 250 Hz envelope
    above 3 SD on one LFP channel per session), outside REM in PRE and POST and below 5 cm/s in
    MAZE; the paper's detection is in the unavailable Methods.
  - The rZ null is 200 column-cycle shuffles of the posterior; the paper's shuffle is not stated in
    the main text.
  - On the linear tracks each event takes the better of the two direction templates, which raises
    their scores over those of the single-template circular track.
- claim: fig1c-maze-gt-pre
  outcome: reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig1c-maze-gt-pre
  notes: MAZE events score higher than PRE events (mean rZ 1.270 against 0.770, n = 2460 and 16448;
    Tukey on ranks p printed as 0), and MAZE is higher in all 8 sessions (one-sided rank-sum p from
    below 0.0001 to 0.0405).
  deviations:
  - Events and scores as for fig1c-post-gt-pre.
- claim: fig2b-strong-contributors
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig2b-strong-contributors
  notes: The test fixed in the criterion (one-sided signed-rank test of a cell's contributions over
    its events, p < 0.05) finds 307 strongly contributing cells (73.6% of 417 place cells), against
    216. With every rate map shifted it calls 57.6% of cells significant (0.853 and 0.905 on the
    linear tracks, 0.164 on the circular track), so about 240 would be expected by chance. The
    paper calls these PCC scores significant, which implies a 5% false-positive rate; this test is
    far from it, so it is not the paper's procedure. A cell-level shift test (the cell's mean
    contribution against each of its 20 shifted maps) finds 223 cells, within the tolerance, but
    its false-positive rate is 0.297. The PCC definition and its test are in the unavailable
    Methods.
  deviations:
  - The PCC and its significance test are choices made here, as the Methods were not available.
- claim: fig2-pre-post-overlap
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig2-pre-post-overlap
  notes: Blocked as it depends on fig2b-strong-contributors. Of 245 PRE strongly contributing
    cells, 229 (93.5%) also contribute in POST, against a chance level of 69.8%. With the shift-test
    variant 141 of 173 (81.5%) against 45.8%.
- claim: fig2d-shuffle-high-dpcc
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig2d-shuffle-high-dpcc
  notes: Blocked as dPCC comes from the procedure of fig2b-strong-contributors. On the pooled test
    of the criterion there is no replay before shuffling (POST minus PRE -0.008, p = 0.916), and
    none after shuffling the bottom 75% (+0.010, p = 0.351) or the top 10% (-0.089). In the
    within-session variant replay is present before shuffling (+0.107, p < 0.0001), falls to +0.021
    (p = 0.20) after shuffling the top 10% and -0.006 (p = 0.83) after the top 20%, and remains after
    the bottom 75% (+0.095, p < 0.0001), the paper's pattern.
  deviations:
  - Variant decodes use 50 column-cycle shuffles per event in place of 200.
- claim: fig2e-remove-plastic
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig2e-remove-plastic
  notes: Blocked as it depends on fig2b-strong-contributors. On the pooled test, removing plastic
    cells gives POST minus PRE -0.157 (p = 1.0) and removing rigid cells +0.036 (p = 0.020). In the
    within-session variant, -0.032 (p = 0.998) and +0.151 (p < 0.0001); with the shift-test classes
    -0.005 and +0.134. Plastic cells are those with the higher dPCC, so the result follows partly
    from how they are chosen.
- claim: figs2-track-distribution
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:figs2-track-distribution
  notes: Blocked as it depends on fig2b-strong-contributors. Rate-map peaks of rigid and plastic
    cells differ by the KS test (medians 0.419 and 0.501 of the track, D = 0.160, p = 0.034); with
    the split over all place cells p = 0.051, with the shift-test classes p = 0.12.
- claim: fig3a-plastic-specificity
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig3a-plastic-specificity
  notes: Blocked as it depends on fig2b-strong-contributors. Plastic cells carry more spatial
    information (median 0.887 against 0.592 bits per spike, p = 0.00028; shift-test classes p =
    0.0019), but the number of fields does not differ (means 1.578 and 1.651, p = 0.52).
- claim: fig3b-plastic-improve
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig3b-plastic-improve
  notes: Blocked as it depends on fig2b-strong-contributors. Both groups raise their in-field
    ratio over the session (change of log10 ratio, plastic median 0.146, p = 0.015; rigid 0.125, p =
    0.032; between groups p = 0.61). With the shift-test classes plastic p = 0.17 and rigid p =
    0.021.
- claim: fig4a-rigid-faster
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig4a-rigid-faster
  notes: Blocked as it depends on fig2b-strong-contributors. Rigid cells fire somewhat faster
    (median 0.710 against 0.597 Hz) without significance (p = 0.059; split over all place cells p =
    0.15; shift-test classes p = 0.39).
- claim: fig4a-plastic-ripple-burst-coactivation
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig4a-plastic-ripple-burst-coactivation
  notes: Blocked as it depends on fig2b-strong-contributors. Ripple gain is higher in plastic
    cells (4.412 against 3.927, p = 0.037); bursting (0.177 against 0.149, p = 0.20) and
    coactivation (0.028 against 0.027, p = 0.79) are not. With the shift-test classes none reaches
    p < 0.05 (gain p = 0.068).
- claim: fig4c-pre-fast-coactivation
  outcome: reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig4c-pre-fast-coactivation
  notes: PRE coactivation rises with firing rate, from 0.0208 in the slowest window to 0.0486 in
    the fastest; Spearman correlation 0.861 on the averaged curve, positive in 6 of 8 sessions. The
    POST minus PRE change of the fastest window does not differ from 0 over sessions (sign-rank p =
    0.383), which fits the statement that these correlations remain into POST.
  deviations:
  - Coactivation over whole epochs, all states; the paper's restriction, if any, is not stated in
    the main text.
- claim: fig4c-slow-coactivation-increase
  outcome: not_reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig4c-slow-coactivation-increase
  notes: The POST minus PRE change does not fall with firing rate; Spearman correlation -0.068 on
    the averaged curve (p = 0.55), negative in 5 of 8 sessions. The averaged change is 0.0019 in
    the slowest window and -0.0007 in the fastest, with a maximum of 0.0090.
  deviations:
  - Coactivation over whole epochs, all states.
- claim: fig4c-slow-replay
  outcome: not_reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig4c-slow-replay
  notes: The partial correlation of MAZE running and POST coactivation given PRE is 0.186 in the
    slowest window and 0.115 in the fastest, but the Spearman correlation over windows is 0.095
    and negative in only 4 of 8 sessions. By subject it is -0.588 (Achilles), -0.646 (Buddy),
    -0.070 (Cicero) and 0.671 (Gatsby).
  deviations:
  - MAZE coactivation is taken over running bins (above 5 cm/s on the track).
- claim: rate-split-medians
  outcome: partially_reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:rate-split-medians
  measured:
  - 0.435
  - 1.091
  notes: Split by non-REM sleep rate, the low-rate median is 0.435 Hz under both readings, just
    outside 0.39 +/- 0.039, and the high-rate median 1.091 Hz (a, within sessions) or 1.092 (b,
    pooled), within 1.12 +/- 0.112. With the rate over all of PRE and POST (a variant) both are
    within tolerance (0.395 and 1.041 under reading a). The split is of 417 place cells, not 491.
  deviations:
  - The paper does not say whether the split is within sessions or pooled; both readings are shown
    and give the same medians.
  - Off-line sleep rate is taken as the non-REM rate in PRE and POST; the rate over all of PRE and
    POST is a variant.
- claim: figs16-low-rate-info-gain
  outcome: partially_reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:figs16-low-rate-info-gain
  notes: Under reading (a), which the criterion selects as neither reading of rate-split-medians
    matched, low-rate cells carry more spatial information (median 0.975 against 0.622 bits per
    spike, p = 4.1e-08), but their ripple-gain change from PRE to POST is not larger (0.251 against
    0.155, p = 0.948). Reading (b) gives the same.
  deviations:
  - Ripple gain is the rate within candidate events over the epoch rate; the paper's definition is
    in fig. S16, which was not available.
- claim: fig4d-slow-sequences
  outcome: not_reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig4d-slow-sequences
  notes: On the pooled test neither half shows replay (low-rate POST minus PRE -0.024, p = 0.964;
    high-rate -0.049, p = 0.9999), as for all cells (-0.008, p = 0.916). In the within-session
    variant both halves show replay, larger for low-rate cells (+0.116 against +0.058, p below
    0.0001 for each), which would be the criterion's partial pattern.
  deviations:
  - Variant decodes use 50 column-cycle shuffles per event in place of 200.
- claim: fig4e-gain-sequences
  outcome: not_reproduced
  notebook: reproduce_grosmark_2016.ipynb
  output: claim:fig4e-gain-sequences
  notes: On the pooled test neither half shows replay (high-gain -0.001, p = 0.71; low-gain -0.111,
    p = 1.0). In the within-session variant high-gain cells show replay (+0.111, p < 0.0001) and
    low-gain cells do not (+0.016, p = 0.14), the paper's pattern.
  deviations:
  - Gain is the rate within PRE and POST candidate events over the PRE and POST rate, split at the
    session median.
  - Variant decodes use 50 column-cycle shuffles per event in place of 200.
findings:
- kind: metadata_error
  statement: In versions 0.210812.1516 and 0.250624.0426 every position series stores its sampling
    period (0.0256 s) as its rate, so the positions span about 880 to 2360 hours in place of the
    MAZE epoch. Version 0.261005.2101 stores 39.06 Hz, which matches the epoch lengths.
- kind: metadata_error
  statement: In Gatsby_08022013 the POST epoch ends at 30413.6 s, while the LFP, the spikes and the
    sleep states run to about 32000 s.
- kind: data_missing
  statement: The dandiset description lists neck EMG and head-mounted accelerometer signals, and
    the files hold neither; they also hold no wide-band data (acquisition is empty), only the LFP at
    1250 Hz.
- kind: data_missing
  statement: The paper's derived data are not deposited. There are no candidate or ripple events,
    no place-cell list, no sequence scores and no PCC values or rigid and plastic labels, so the
    paper's selections cannot be checked against the dandiset and every one must be rebuilt.
- kind: methods_unavailable
  statement: Neither the paper nor the dandiset links analysis code, and the supplementary
    Materials and Methods, which define the candidate events, place cells, the PCC and its test,
    are not openly available (PMC and Science serve them only behind a browser check).
- kind: metadata_insufficient
  statement: Every electrode's location is "unknown" and no depth or layer is given, so the
    channel for ripple detection has to be chosen from the signals. Units carry only the
    hemisphere (lCA1 or rCA1). Subject age is "/".
- kind: metadata_insufficient
  statement: On the circular track the animals ran toward decreasing linearized position (47 to 63%
    of samples against 7 to 16% the other way). The series description says the position increases
    clockwise but not which way the animals ran.
