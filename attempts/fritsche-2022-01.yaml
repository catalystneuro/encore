- claim: fig2-v1-tuning-main-effect
  outcome: reproduced
  notebook: reproduce_fritsche_2022.ipynb
  output: claim:fig2-v1-tuning-main-effect
  notes: Mixed ANOVA on log ratios with the 45 degree trials pooled, relative orientation F(2, 998) =
    19.97, p = 3.1e-09 (paper 4e-11); the other three readings give p from 9.4e-14 to 2.6e-10. Ratios
    0.799 at 0 degrees, 0.875 at 45, 0.927 at 90. 78 of 580 V1 units (96 with averaged 45) are left
    out for a cell with a zero rate. Every other cortical area also has a significant main effect
    (p from 5e-11 to 0.027).
  deviations:
  - Tertiles are formed on all responsive units of the region before units with a zero-rate cell
    are left out, so the tertiles are not equal in the ANOVA (194, 192, 116 in V1); the paper does
    not say how such units were handled.
  - The mixed ANOVA is computed with the standard split-plot sums of squares and no sphericity
    correction; the paper names no correction.
