- claim: fig3b-thalamus-short-term
  outcome: reproduced
  assumed: true
  notebook: reproduce_fritsche_2022.ipynb
  output: claim:fig3b-thalamus-short-term
  notes: Counting significant adaptation (corrected p < 0.05 with the ratio below 1), the reading
