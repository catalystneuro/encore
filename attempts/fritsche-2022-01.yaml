findings:
- kind: metadata_insufficient
  statement: The units table holds every sorted unit (74658), with a `quality` column marking 20182
    as `noise` and the AllenSDK quality metric columns (isi_violations, amplitude_cutoff,
    presence_ratio and others), none of which has a description in the files. The paper's unit
    counts are matched when the `noise` units are left out, as the AllenSDK's units table does;
    nothing in the files says that they should be, and keeping them changes the thalamic decay
    results.
  about: data
  severity: minor
- kind: other
  about: data
  statement: Three sessions (715093703, 719161530, 721123822) hold 598 drifting gratings in place
    of the 600 the paper and the stimulus design give; one or two direction and frequency
    conditions there have 14 presentations.
  severity: minor
- kind: other
  about: data
  statement: Thirteen sessions list invalid intervals tagged with a probe, totalling 12 to 2931 s,
    and several overlap the drifting or static grating epochs. Their meaning is not described in
    the files; the paper does not mention them, and they are not applied here.
  severity: minor
- kind: metadata_insufficient
  about: data
  statement: 3723 of the units that pass the quality metrics sit on channels whose area is `grey`
    and 686 on `VIS`, labels that name no structure; they reach 50 responsive units, the paper's
    rule for a region, and are left out here.
  severity: minor
- kind: other
  about: data
  statement: Checks that passed. 32 mice, one session each, with the genotypes the paper gives;
    stimulus parameters, durations and spacing as the Methods describe; no recording or unit
    deposited twice; the V1 orientation tuning is locked to the stimulus tables in every session
    (true labels against labels shifted by whole presentations).
  severity: none
- kind: other
  about: data
  statement: Static blank sweeps number 189 to 197 of 6000 presentations per session, about one in
    31, where the Methods say roughly one in 25.
  severity: minor
- kind: methods_unavailable
  statement: For Figure 3B, do the borders marking significance (p < 0.05, FDR per area) include
    n-back ratios significantly above 1? Here LP is significant at 3-back with a ratio of 1.03, and
    the outcome of fig3b-thalamus-short-term depends on whether that counts; adaptation below 1 was
    assumed.
- kind: methods_unavailable
  statement: For the simulated neuron of Figure 8, what rate and noise model were used, and was the
    95% interval across the 32 sequences a t interval or a bootstrap? With Poisson noise at about 10
    Hz single n-back intervals exclude 1 at chance-like rates, and the claim's outcome depends on
    the seed.
- kind: methods_unavailable
  statement: Were units the Allen files label `noise` left out (the AllenSDK units table omits them)?
    The paper's counts are matched with that filter, and the thalamic decay fits change without it.
    The analysis code at doi:10.34973/kpt9-y956 is restricted and could not be read.
