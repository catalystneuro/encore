- claim: fig2-v1-adaptation-at-all-orientations
  outcome: reproduced
  notebook: reproduce_fritsche_2022.ipynb
  output: claim:fig2-v1-adaptation-at-all-orientations
  notes: Pooled 45 degrees, Benjamini-Hochberg over the nine V1 cells, all eight other cells below
    1 at corrected p < 0.05 (largest 0.012, medium OSI at 90); high OSI at 90 has ratio 0.993, p =
    0.92 (paper 0.88). The same with the family of 72 cells. With Bonferroni 7 of 8 (V1 family) or
    6 of 8 (all cells); with averaged 45, 7 of 8 under Benjamini-Hochberg. The 78 units left out
    are 77 of the 193 high OSI units (a zero rate at 45 or 90 degrees) and 1 medium. With tertiles
