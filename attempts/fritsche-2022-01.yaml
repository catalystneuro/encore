- claim: fig8-no-spurious-long-term
  outcome: not_reproduced
  seed_sensitive: true
  notebook: reproduce_fritsche_2022.ipynb
  output: claim:fig8-no-spurious-long-term
  notes: The recovered 1-back interval contains the ground truth (drifting 0.821, static 0.897) in
    each of the six named runs (five Poisson seeds and no noise), and in 192 (drifting) and 189
    (static) of the 200 further Poisson seeds. Claim seed, Poisson noise at the V1 median rate (9.97 Hz drifting, 9.04 Hz static),
    drifting has no n in 2 to 10 whose interval excludes 1, but static 5- and 6-back do (0.986,
    0.987). No noise, static passes and drifting 2- and 6-back exclude 1 (0.996, 1.003). No reading
    meets the criterion or its partial rule under the claim's seed. Of the four other seeds, one
    (+1000) meets reading (a, c); the others fail, and the partial rule holds under +1000 and +4000.
    Over 200 further Poisson seeds, reading (a, c) is met in 38.0% and the partial rule in 41.5%,
    reading (a, d) in none. The n whose interval excludes 1 number 0.36 (drifting) and 0.47
    (static) per seed over 2 to 10, and 2.57 and 2.46 over 2 to 50, close to the 0.45 and 2.45
    expected by chance from 95% intervals, so the failures under (a) are what noise alone gives
    under a criterion that asks every interval to contain 1; whether the criterion reads the paper
    rightly is asked of a reader (questions/fritsche-2022.yaml). Without noise the spurious ratios
    stay within 0.0037 of 1 (drifting) and 0.0007 (static) over n = 2 to 10, against V1 drifting
    ratios of 0.918 to 0.984 at 2- to 8-back; the drifting exclusions there come from the
    sequences, not from noise.
  deviations:
  - The paper does not give the simulated neuron's rate or noise; Poisson counts at the V1 median
    orthogonal 1-back rate, and no noise, were run. A question for the authors (finding).
