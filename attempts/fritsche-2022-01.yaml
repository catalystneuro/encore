- claim: fig5-repeat-suppression
  outcome: not_reproduced
  notebook: reproduce_fritsche_2022.ipynb
  output: claim:fig5-repeat-suppression
  measured:
  - 0.757
  - 0.922
  notes: 2189 cortical units. 1-back repeat over blank 0.757 and orthogonal over blank 0.922, both
    below 1. Repeat suppression lasts longer, significant by t tests with FDR at 1 to 4 and 7, by the
    bootstrap interval at 1 to 5, 7 and 9; orthogonal at 1 and 2 (and 4 by the interval). The
    criterion fails on two parts, under the claim's seed and the four others; orthogonal is still
    below 1 at 2-back (0.972), and repeat is not significant at 8-back (0.999). Averaged over 100
    subsampling draws, repeat is significant to 8-back and orthogonal still at 2-back (0.978).
    Resampling sessions in place of units (units of a session share one trial subsample), the
    orthogonal 2-back interval is 0.949 to 0.994 (claim's draw) and 0.961 to 0.996 (100 draws), and
    repeat 8-back is not below 1 in either (0.960 to 1.002 with 100 draws). The criterion has no
    partial rule, and the part that fails under every reading and seed is the claim's central
    contrast, that orthogonal suppression is limited to the 1-back trial. 24 to 30 blank trials per
    session serve as the 1-back baseline.
  deviations:
  - Repeat and orthogonal trials are subsampled per session and per n to the number of n-back blank
    trials (Methods); the paper does not say whether it drew per session or per n.
