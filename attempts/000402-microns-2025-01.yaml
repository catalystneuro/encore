  - 2
  - 1
  - 420
  notes: Of the 14 scans, 11 are at 6.30 Hz with 4 depths and 8 fields, 2 at 8.61 Hz with 3 depths and
    6 fields, and 1 at 9.62 Hz with 2 depths and 4 fields, two fields per depth in every scan. The depth
    spans of the 11 scans are 280 to 420 um, all within 270 to 440 um (reading a); their median is 420
