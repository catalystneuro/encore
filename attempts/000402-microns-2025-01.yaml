- claim: manual-coreg-19181
  outcome: blocked
  blocked_by: other
  notes: The match table is the CAVE table coregistration_manual_v4. CAVE serves its tables only to users
    with an account token (the materialization API redirects to an authorization page), and this run has
    none. The BossDB bucket holds only a 2021 match release (func_unit_em_match_release.csv, 14 kB), not
