- claim: em-sections
  outcome: blocked
  blocked_by: too_large
  notebook: em_volume_counts.ipynb
  output: claim:em-sections
  notes: The verified outcome is kept. The imagery is public on BossDB in sharded precomputed format, and
    em_volume_counts.ipynb now reads it. The metadata give bounds in whole chunks of 64 sections, 7,904
    to 14,847 for subvolume 35 and 14,816 to 27,903 for subvolume 65, 20,000 sections with a share of
    34.56% before subvolume 65. Sampling the chunk layers at each end on a grid of 2,288 chunks at 64 nm
    per pixel, the imagery holds data from section 7,931 to 14,847 in subvolume 35 and from 14,825 to
    27,882 in subvolume 65; a sparser grid and 16 chunks at 16 nm give the same last section. The region
    with data is 19,952 sections against the expected 19,974 (tolerance 0); the share of subvolume 35 is
    34.55% to 34.67%, within 35 +- 3.5%. The metadata give no count of sections cut or imaged.
  proposed:
    outcome: partially_reproduced
    reason: The first rounds judged whole sections too large to read; sampled on a grid of chunks, the
      imagery is read in 2 minutes (em_volume_counts.ipynb). The first section, 7,931, and the share of
      subvolume 35, 34.55% to 34.67% (34.56% from the metadata alone), match the paper. The region with
      data ends at 27,882, not 27,904, so it holds 19,952 sections, not 19,974, and the count fails its
      tolerance of 0.
