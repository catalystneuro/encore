- claim: spontaneous-periods
  outcome: partially_reproduced
  notebook: reproduce_microns_2025.ipynb
  output: claim:spontaneous-periods
  measured:
  - 0.145
  - 4.841
  - 8.93
  - 21.19
  notes: Over the 14 scans the time from the first frame to the first stimulus is 0.145 to 4.841 min and
    from the last stimulus to the last frame 8.93 to 21.19 min, so every scan lies within the widened
    ranges, the criterion's test. The bounds of the range over the 14 scans do not all match the expected
    values; the longest period before the stimulus, 4.841 min, is outside 5.5 +- 0.55 min, while 0.145,
    8.93 and 21.19 min are within tolerance of 0.15, 8.3 and 21.2. Over all 19 files the four bounds are
    0.145, 5.539, 8.255 and 21.193 min, all within tolerance, so the paper's range was probably taken
    over all 19 recordings. The dataset does not say whether the monitor was on or off in these periods.
- claim: monet2-directions
  outcome: reproduced
  notebook: reproduce_microns_2025.ipynb
  output: claim:monet2-directions
  measured:
  - 16
  - 937.1
  notes: Every Monet2 trial has num_directions 16 and duration 15 s in the table. From the video, the
    period fitted to the direction changes is 929.6 to 945.4 ms (median 937.1) in all 560 trials, within
    tolerance. With the direction of each period from the global optical flow, all 560 trials have 16
    distinct directions, both at least 10 degrees apart and after snapping to the 22.5 degree grid. The
    8,960 measured directions lie within 7.9 degrees of the grid (99% within 5.0 degrees; 36 more than
    6.25 degrees off). Both showings of every seed give the same 16 directions. The phase correlation
    estimate of the first round gave 15 directions in 4 trials (10 degree rule) or 6 (grid), with deviations
    up to 11.0 degrees, in 8 trials (both showings of seeds 7637 in scan 5-6, 5145 and 2618 in scan 6-7
    and 6154 in scan 9-6); in all 8 the optical flow hits all 16 grid directions, and the period the
    phase correlation put at 124.9 degrees in seed 7637 measures 111.3.
    The spacing is the 22.5 degree grid. The speed is not in the dataset and is not tested.
  deviations:
  - The table gives no direction or onset per period, so both were measured from the stimulus video in
    each file; a method of this attempt, not the paper's. Boundaries come from phase correlation between
    successive frames, and each period's direction from the global optical flow over the period (gradient
    method of Lucas and Kanade, frames smoothed by a 1 pixel Gaussian). The boundary detection, the 10
    degree tolerance for distinct directions, the smoothing and the 0.1 s left out at each end of a period
    are standard choices, stated in the helper.
- claim: fig3f-oracle-reliability
  outcome: reproduced
  notebook: reproduce_microns_2025.ipynb
  output: claim:fig3f-oracle-reliability
  notes: The score is computed for all 115,372 somatic masks of the 14 scans under both readings. The
    units at the 34th, 79th and 99th percentiles score 0.208, 0.396 and 0.702 under reading (a) and 0.151,
    0.275 and 0.465 under reading (b), increasing, with the 99th above 0. In the variant, the mean pairwise
    correlation between single repeats of the 100 units nearest each percentile is 0.084, 0.203 and 0.524
    (a) and 0.096, 0.205 and 0.394 (b). Median scores by scan range from 0.208 to 0.348. The criterion
    is met by any score whose 99th percentile is above 0, so it tests little. The 10,041 artifact masks
    score 0.235, 0.402 and 0.650 at the three percentiles, as high as the somatic masks, and the mean
    trace of a field scores 0.499 (median of 104 fields, range 0.161 to 0.780). With each mask's fit on
    its field's mean trace removed, the somatic scores are 0.200, 0.380 and 0.665 and the artifact scores
    0.229, 0.380 and 0.613, barely changed, so a signal shared across the field does not drive them. What
    makes the artifact masks score as high is not shown (a local neuropil signal or real neurites could
    account for it), and the score on fluorescence cannot separate the reliability of a neuron from that
    of what else its mask holds.
  deviations:
  - Fluorescence traces replace the deconvolved traces of the paper, which are not in the dataset.
  - Frames are taken from each field's time stamps from the onset of each repeat; the per-unit delay within
    a frame that the paper's code adds is not in the dataset and is not applied. All fields of a scan
    share one array of time stamps in the files.
- claim: fig3g-direction-tuning
  outcome: reproduced
  notebook: reproduce_microns_2025.ipynb
  output: claim:fig3g-direction-tuning
  notes: Every direction is preferred by at least 5,205 somatic masks under reading (a) and 5,084 under
    reading (b), and by at least 4,698 with the windows shifted by +0.47 s, where the split-half reliability
    of the tuning peaks in all 104 fields. The count tests little with this many units; the argmax of
    the difference between the two halves of the trials, which holds no shared tuning, puts 6,153 to 8,217
    units on each direction. The split-half variant gives the evidence of tuning. Over all somatic masks
    the response at the first-half preferred direction exceeds the mean of the other 15 in the second half
    for 62.9% (0.5 without tuning), and for 63.7% of 80 units chosen on the first half alone. The 80 units
    shown are chosen on all 40 trials, so their 91.2% is raised by the selection. The test does not separate
    neural tuning from a stimulus-locked signal that masks share. The artifact masks pass it as often
    (65.9% of 10,041), and the most common first-half preferred direction of a field holds a median 11.3%
    of its somatic masks (8.6% to 17.7% over 104 fields), against 6.25% if spread evenly.
  deviations:
  - Fluorescence replaces the deconvolved traces, which are not in the dataset.
  - The direction of each period comes from the video (see monet2-directions), snapped to the 22.5 degree
    grid.
  - The 80 units shown are ranked by the preferred response minus the mean over directions, divided by
    the standard deviation over directions, in place of the claims file's ratio, which is not defined
    for fluorescence with its arbitrary offset. This choice only picks the units shown.
- claim: behaviour-recorded
  outcome: partially_reproduced
  notebook: reproduce_microns_2025.ipynb
  output: claim:behaviour-recorded
  measured:
  - 57.0
  - 100.2
  - 20.0
  notes: All 14 scans hold treadmill velocity (57.0 to 100.2 Hz) and pupil position and major and minor
    radii (19.96 to 20.01 Hz). The treadmill covers the imaging period in all 14 scans; the eye tracking
    covers it in 13, and in scan 4-7 it ends 968 s before the last imaging frame (85% coverage). File
    4-7 holds one eye position series and two pupil radius series, all ending at 5,392.9 s, so no other
    series covers the rest of the scan. A pupil is fitted in 84.9% to 99.9% of eye frames. By the same 1
    s rule, the eye tracking misses the imaging period in all 5 files outside the paper's 14. It ends 3,264
    to 4,582 s early in 4-10, 5-3 and 8-7, and 3.9 and 6.2 s early in 4-9 and 8-9 (in 4-9 it also starts
    1.77 s late).
