outcomes:
- claim: scans-14-p75-p81
  outcome: reproduced
  notebook: reproduce_microns_2025.ipynb
  output: claim:scans-14-p75-p81
  measured: 14
  notes: The 14 scans of Extended Data Table 1 are all in the dataset, recorded on 6 days (4 to 9 March
    2018), which are P75 to P80 against the birth date of 19 December 2017. The dataset holds 19 scans,
    the 19 completed scans of the Methods. Each scan's fields tile 1,200 x 1,100 um (1,200 x 1,000 um in
    scan 9-6) at depths of 80 to 570 um; the files give no common frame for the scans, so the extent of
    the whole volume is not measured.
  deviations:
  - Which 14 of the 19 files are the paper's scans was taken from Extended Data Table 1 (Methods, 2P
    functional imaging, "Of 19 completed scans over 6 days of imaging, 14 are described here (Extended
    Data Table 1)"). The text the claims file was read from holds only the table's caption; its cells were
    read from the table's image in PMC11981939 (41586_2025_8790_Tab1_ESM.jpg). They are 4-7, 5-6, 5-7,
    6-2, 6-4, 6-6, 6-7, 7-3, 7-4, 7-5, 8-5, 9-3, 9-4 and 9-6.
- claim: scan-configurations
  outcome: reproduced
  notebook: reproduce_microns_2025.ipynb
  output: claim:scan-configurations
  measured:
  - 11
  - 2
  - 1
  - 420
  notes: Of the 14 scans, 11 are at 6.30 Hz with 4 depths and 8 fields, 2 at 8.61 Hz with 3 depths and 6
    fields, and 1 at 9.62 Hz with 2 depths and 4 fields, two fields per depth in every scan. The depth
    spans of the 11 scans are 280 to 420 um, all within 270 to 440 um (reading a); their median is 420 um
