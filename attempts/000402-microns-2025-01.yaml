    holds. Only 52 of the 104 fields of the 14 scans have EM columns (one of the two fields at each depth),
    holding 8,863 ROIs with a root id (8,326 distinct values, among them 0 in 2 ROIs; 395 non-zero root
    ids occur in more than one scan), so they are not comparable with the paper's 19,181 and 15,439.
- claim: ed4-matched-higher-signal-correlation
  outcome: blocked
  blocked_by: other
  notes: Depends on manual-coreg-19181, whose CAVE table needs an account token. As a variant that decides
    nothing, the notebook runs the criterion's test under reading (b) (nearest somatic mask in the same
    field, by the 2D centroid of the image masks) on the matches the dataset holds, masks of different
    scans with the same pt_root_id; reading (a) needs stack coordinates, which the dataset lacks. Over
    538 pairs of scans (395 root ids) the matched signal correlation on fluorescence (median 0.585) exceeds
    both controls (medians 0.239 and 0.233) in 71.9% of pairs, and the median differences, 0.273 and 0.273
    over all pairs, are 0.303 and 0.353 when both masks score above 0.2 (77.7% of 399 pairs above both
    controls). Two-sided Wilcoxon p is below 1e-43 in every case. In 50 pairs the EM cell body points
    of the two masks lie more than 10 um apart; without them the shares are 75.2% (488 pairs) and 80.4%
    (368). On the dataset's own matches the test would pass, but these matches cover one field per depth
    and are not the paper's table.
