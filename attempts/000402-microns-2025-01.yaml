      directions in 556 of 560 trials by the 10 degree rule, or 554 of 560 after snapping to the 22.5
      degree grid. The criterion requires every trial. The 10 degree merge rule is too tight for the measurement
      error (deviations from the grid up to 11 degrees); in a synthetic test, uniform noise of +-7 degrees
      gave a false 15 in 9.5% of trials. The two measures disagree on which trials have 15 directions,
      and the 16 directions of seed 7637 in scan 5-6 are never printed, so the outcome rests on an unvalidated
      proxy.'
    response: Outcome kept as reproduced, with the disagreement recorded. The direction of each period
      is now measured by global optical flow (Lucas and Kanade), which is not pulled towards whole-pixel
      shifts as the phase correlation peak is. All 560 trials then have 16 distinct directions under both
      measures, the 8,960 directions lie within 7.9 degrees of the grid (99% within 5.0), and the notebook
      prints both measures for seed 7637 in scan 5-6 and seed 6154 in scan 9-6; under the optical flow
      both hit all 16 grid directions. The phase correlation results are kept beside them (556 and 554
      of 560).
