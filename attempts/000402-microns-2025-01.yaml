- claim: cell-classification
  outcome: reproduced
  notebook: reproduce_microns_2025.ipynb
  output: claim:cell-classification
  measured:
  - 89056
  - 69957
  - 95.5
  - 99.6
  notes: Of the 144,120 nuclei of subvolume 65, 144,117 are in the SVM table and 89,056 are called neurons,
    within the tolerance of the paper's 82,247 (8.3% higher). The excitatory and inhibitory table holds
    69,957 neurons, the paper's count of well-segmented neurons, all among the SVM neurons. Against the
    manual labels of the 100 um column (2,029 cells labelled neuron or non-neuron, matched by position
    at 0 um), the SVM has precision 95.5% and recall 99.6%. The multilayer perceptron's accuracy was measured
    by the paper on 350 further cells that are not released, so it is not tested; on the column cells,
    its training and validation data, the calls agree with the labels for 98.2%. The paper's 82,247 equals
    69,957 plus 12,290, while the released SVM table calls 89,056 neurons, so the count passes on the
    tolerance only.
  deviations:
  - The tables are the 2021 releases on BossDB, not the CAVE tables the claims file names; the paper gives
    no version.
  - The SVM table holds 27,698 rows that are not nuclei of nucleus_detection_v0 (27,692 called non-neurons);
    the count is restricted to subvolume 65's nuclei, as the paper's is.
