findings:
- kind: selection_undocumented
  statement: The dandiset holds all 19 completed scans, while the paper describes 14 (Extended Data Table
    1). Nothing in the files or the metadata marks which 14, so its counts (for example 125,413 masks)
    can be matched only after reading the table's image. The five other files are 4-9, 4-10, 5-3, 8-7
    and 8-9.
- kind: data_missing
  statement: The files hold fluorescence traces only. The deconvolved traces that the paper's analyses
    use, and that the paper says can be read from the NWB files, are not in them; nor are the oracle scores.
- kind: data_missing
  statement: The structural stack, the registration of each field into it, and the stack coordinates of
    the masks are not in the dataset, so masks imaged in more than one scan cannot be grouped and the
    z drift cannot be measured.
- kind: metadata_insufficient
  statement: No mask or field has a visual area; every imaging plane's location is the same list of four
    areas. The area masks the Methods transform into the stack are not in the dataset.
- kind: identifier_missing
  statement: The EM columns (cave_ids, pt_root_id, pt_supervoxel_id and positions) exist only in one of
    the two fields at each depth (52 of the 104 fields of the paper's 14 scans) and in none of the fields
    of files 4-9, 4-10, 8-7 and 8-9.
- kind: metadata_insufficient
  statement: The Monet2 table gives num_directions but not the direction or onset of each period, which
    Fig. 3g needs. The directions can be measured from the stimulus video in the files, as this attempt
    did.
- kind: metadata_error
  statement: The imaging_rate of every imaging plane is NaN (the rate is only in the field description),
    and the subject age is the range P75D/P81D in every file, though each scan was recorded on one day.
- kind: other
  statement: In scan 4-7, one of the paper's 14, the eye tracking ends 968 s before the last imaging frame;
    in files 4-10, 5-3 and 8-7 it ends 54 to 76 minutes early. Several files have missing (NaN) time stamps
    in the treadmill and eye series (up to 190).
- kind: other
  statement: Trippy seed 6831 is shown in both scans 6-4 and 7-5, while the Methods say the 10 seeds that
    are not conserved are unique to each scan.
- kind: other
  statement: All fields of a scan share one array of frame time stamps, though the fields are imaged one
    after another within each frame; the per-field offset is not recorded.
- kind: format_error
  statement: pt_root_id and pt_supervoxel_id are stored as 64-bit floats, which hold integers exactly
    only up to 2**53; root ids near 8.65e17 are spaced by 128 in float64, so ids that differ in their
    last digits can collide. Of 538 pairs of masks in different scans that share a root id, 50 have EM
    cell body points more than 10 um apart.
