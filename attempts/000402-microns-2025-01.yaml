- claim: monet2-directions
  outcome: reproduced
  notebook: reproduce_microns_2025.ipynb
  output: claim:monet2-directions
  measured:
  - 16
  - 937.1
  notes: Every Monet2 trial has num_directions 16 and duration 15 s in the table. From the video, the
    period fitted to the direction changes is 929.6 to 945.4 ms (median 937.1) in all 560 trials, within
    tolerance. 556 trials have 16 directions at least 10 degrees apart; in 4 (two seeds, each shown
    twice) two periods measure 7 to 10 degrees apart, within the measurement's error (measured
    directions lie up to 11.0 degrees from the nearest multiple of 22.5), so these 4 are not settled
    either way. Both showings of every seed give the same 16 directions. The spacing is near 22.5
    degrees. The speed is not in the dataset and is not tested.
  deviations:
  - The table gives no direction or onset per period, so both were measured from the stimulus video in
    each file, by phase correlation between successive frames; a method of this attempt, not the
    paper's. Boundaries, the 10 degree tolerance for distinct directions and the 0.1 s left out at each
    end of a period are standard choices, stated in the helper.
- claim: fig3f-oracle-reliability
  outcome: reproduced
  notebook: reproduce_microns_2025.ipynb
  output: claim:fig3f-oracle-reliability
  notes: The score is computed for all 115,372 somatic masks of the 14 scans under both readings. The
    units at the 34th, 79th and 99th percentiles score 0.208, 0.396 and 0.702 under reading (a) and
    0.151, 0.275 and 0.465 under reading (b), increasing, with the 99th above 0. In the variant, the mean
    pairwise correlation between single repeats of the 100 units nearest each percentile is 0.084, 0.203
    and 0.524 (a) and 0.096, 0.205 and 0.394 (b). Median scores by scan range from 0.208 to 0.348.
  deviations:
  - Fluorescence traces replace the deconvolved traces of the paper, which are not in the dataset.
  - Frames are taken from each field's time stamps from the onset of each repeat; the per-unit delay
    within a frame that the paper's code adds is not in the dataset and is not applied. All fields of a
    scan share one array of time stamps in the files.
- claim: fig3g-direction-tuning
  outcome: reproduced
  notebook: reproduce_microns_2025.ipynb
  output: claim:fig3g-direction-tuning
  notes: Every direction is preferred by at least 5,203 somatic masks under reading (a) and 5,113 under
    reading (b), and by at least 4,705 with the windows shifted by +0.47 s, where the split-half
    reliability of the tuning peaks with fluorescence. In the split-half variant the 80 units shown
    respond more at their first-half preferred direction than at the mean of the other 15 in the second
    half in 91.2% of cases; over all somatic masks the share is 62.9% (0.5 without tuning).
  deviations:
  - Fluorescence replaces the deconvolved traces, which are not in the dataset.
  - The direction of each period comes from the video (see monet2-directions), snapped to the 22.5 degree
    grid.
  - The 80 units shown are ranked by the preferred response minus the mean over directions, divided by
    the standard deviation over directions, in place of the claims file's ratio, which is not defined for
    fluorescence with its arbitrary offset. This choice only picks the units shown.
