- claim: unique-neurons-75909
  outcome: blocked
  blocked_by: data_missing
  notes: The method groups masks by their 3D centroids in the structural stack. The dataset holds neither
    the stack nor the registration of the fields into it nor any stack coordinate of a mask; each file
    gives its field origins on its own axes only. The EM root ids of the dataset cover half the fields
    and cannot stand in for the grouping. The BossDB open data bucket serves a structural stack of this
    mouse (functional_data/two_photon_structural_stacks/two_photon_stack_17797_9_19_v1.tiff), and the
    paper lists the 2P structural images among its public resources (Fig. 1 legend). The claims file limits
    this claim to the dandiset, so the stack was not used, and a reader is asked whether the claim should
    be data elsewhere (questions/000402.yaml).
