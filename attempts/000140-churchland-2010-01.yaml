- claim: ap-location-no-effect-j-array
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:ap-location-no-effect-j-array
  notes: In all 17 readings with units on both arrays the tuning correlation does not differ by array
    (p 0.538 to 1.000). Main reading r = 0.105, p = 0.668, 10 PMd and 9 M1 units (mean r -0.060 and
    -0.099). With 19 units and two locations the test has little power; the paper's r = 0.20 would
    not be detected here either.
  deviations:
  - The electrodes have no positions, so AP location is the array, PMd anterior and M1 posterior
    (Supplemental Figure 3 legend). Regression on a 0/1 location, the two-group comparison the
    criterion names as the variant for array identity.
  - Assumed the array of a unit is the first digit of its id, 1 for PMd and 2 for M1, as units with
    prefix 1 map onto the PMd electrodes of the table; every unit's electrodes entry points to the PMd
    group. Swapping the arrays changes only the sign of r.
