- claim: fig4d-mean-correlation-j-array
  outcome: not_reproduced
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig4d-mean-correlation-j-array
  measured:
  - -0.079
  - -0.020
  notes: Under none of the 18 readings with units (O1 x O2 x O3 x O4) is the mean correlation within
    0.13 +/- 0.013 or positive at p < 0.05. Mean Pearson r ranges from -0.148 to 0.095 and mean
    Spearman r from -0.061 to 0.061; the one reading with p < 0.05 (O3a, O4b, O1 range, O2 i, 13
    units, r = -0.148) is negative. The main reading (O1 range, O2 i, O3a, O4a) gives 19 units over
    27 conditions, mean r -0.079 (t-test p = 0.086) and Spearman -0.020; with O2 ii 88 units and mean
    r 0.011 (p = 0.662). Under O1 SD no unit passes with O2 i and 3 to 5 with O2 ii. The condition
    means rest on 1 to 4 trials (66 to 78 trials kept), and the split-half reliability of preparatory
    tuning has a median of 0.20 over units, so a mean correlation of 0.13 could not be resolved here;
    the outcome describes these 100 trials, not the paper's 2166 trials per neuron.
  deviations:
  - 27 conditions with 1 to 4 trials each after the delay rule, against 108 conditions and about 20
    trials each in the paper's J-array dataset.
  - Spike trains smoothed with a Gaussian of SD 20 ms before averaging (Supplemental Experimental
    Procedures, Computing the mean firing rate versus time; the width is read as the SD, a standard
    choice).
- claim: fig4abc-mean-correlation-other-datasets
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds one subject (Jenkins) recorded with two Utah arrays. The single-electrode
    datasets of monkeys A, B and J are not in it, and no other dandiset of these recordings was named
    by the paper or the dandiset.
- claim: fig4-broad-near-zero
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig4-broad-near-zero
  notes: Under O1 range (12 readings) the median r is near zero (-0.098 to 0.016), 92% to 100% of
    units have |r| < 0.5, at most 1.2% are above 0.8 and none below -0.8, but the interquartile range
    is 0.173 to 0.286, below the 0.3 the criterion requires; no O1 range reading passes in full. Under
    O1 SD (3 to 5 units) all 6 readings pass. The criterion has no partial rule; the outcome is partial
    because four of its five conditions hold. A distribution centred near zero is also what the noise
    of 1 to 4 trials per condition would give.
  deviations:
  - Assumed O1 is the range of the preparatory rate across conditions, as the Methods describe the
    inclusion rule as a rate difference ("Firing rate modulation was typically lower ... >5 spikes/s
    of preparatory tuning"); under the SD reading the claim is reproduced, on 3 to 5 units.
- claim: fig4e-correlation-time-course
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig4e-correlation-time-course
  notes: Under all 18 O1 range readings the mean correlation at movement onset is below 0.1 and below
    half its value at -200 ms, and the largest 50 ms drop starts 270 to 210 ms before onset. Main
    reading (fig4 units, 19) 0.295 at -200 ms and -0.078 at onset; all units with preparatory tuning
    (93) 0.62 at -400 ms, 0.39 at -200 ms, 0.12 at -100 ms and -0.00 at onset. Under O1 SD (3 to 8
    units) the value at onset is 0.091 to 0.244, partially reproduced in 10 of 12 readings.
  deviations:
  - Assumed O1 is the range across conditions (see fig4-broad-near-zero).
  - The time axis uses go-locked means from -200 to +200 ms and movement-locked means from -400 to
    +400 ms, in 10 ms steps (Supplemental Experimental Procedures, the spliced trace); the judgement
    uses the movement-locked part.
- claim: suppfig1-population-averages-lose-tuning
  outcome: reproduced
  notebook: reproduce_churchland_2010.ipynb
  output: claim:suppfig1-population-averages-lose-tuning
  notes: In all 36 readings, normalised and not, the spread between the strongest and weakest
    preparatory conditions at movement onset is below half the preparatory spread (ratio 0.186 in the
    main normalised reading; -0.175 to 0.295 over readings), with the strongest trace on top at -150
    ms. The conditions are ranked by the same noisy preparatory means that make the preparatory spread,
    so part of that spread is selected noise, which the spread at onset does not share; with 1 to 4
    trials per condition this criterion would be met by noise alone.
  deviations:
  - Each unit is normalised by its maximum condition-mean rate over the go-locked and movement-locked
    spans stored (-300 to +200 ms and -400 to +900 ms); the legend says "normalizing each neuron's
    activity by its maximum rate".
- claim: fig6d-perimovement-best-j-array
  outcome: reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig6d-perimovement-best-j-array
  notes: Main reading (O1 range, O3a, O4a; 93 units) best peri-movement performance -0.044 at k = 2,
    best kinematic -0.053, best task space (initial velocity) -0.048. Of 96 readings 64 meet the
    criterion and 32 are partial (initial velocity at or above the peri-movement space), the partial
    ones under O1 range with O3a and O4b, O3b and O4a, or O3b and O4b, and under O1 SD with O3b and
    O4b. Under O1 range all
    spaces perform below zero, worse than predicting the mean rate, and 47 of 93 units have a positive
    peri-movement performance at their best k up to 14. Under O1 SD (8 units) the peri-movement space
    is best with positive performance, 0.209 against 0.136 kinematic and 0.133 task. Repeating the
    kinematic variables (reading a) leaves performance unchanged (largest difference 8e-15).
  deviations:
  - Assumed O1 range, O3a (the dataset's movement onset, computed by the data's authors) and O4a (the
    proto-trial is the trial of the condition best correlated with its mean, as the supplement calls
    it a "proto-trial"); with O4b, or O3b with a filter, the outcome is partially reproduced.
  - The upper limit uses the preparatory matrix of all units except the fitted one, as the
    peri-movement space does (Methods, PCA-based spaces); the supplement says "all neurons".
  - Task spaces follow the Methods' list (Task spaces). Details they leave open, set here and stated
    in maze_prep.py, are the end of the reach (last time within 800 ms of onset with speed at least
    10% of peak), the peak velocity components (the signed value of largest magnitude), and the
    segments (equal path length, with equal duration as a variant, which gives the same outcome).
  - Acceleration for the kinematic space is the derivative of the dataset's hand velocity after a
    20 ms Gaussian, a standard choice.
