findings:
- kind: metadata_error
  statement: Every unit's `electrodes` entry in the train and test files points to an electrode of the
    PMd group (indices 0 to 94), though the unit ids carry two array prefixes (72 units with 1, 70 with
    2) and the dandiset describes recordings from M1 and PMd. The electrode index equals the channel
    number in the id minus one for both prefixes, so the units of one array point to the wrong group
    and no unit points to an M1 electrode. Which prefix is PMd is not stated.
- kind: metadata_insufficient
  statement: The electrodes table has no positions or impedances (x, y, z and imp are NaN for all 192
    electrodes), so no unit has an anterior-posterior location, which the paper's comparison of
    anterior and posterior sites uses.
- kind: data_missing
  statement: The dandiset holds 100 trials of 27 of the 108 maze conditions from the arrays of monkey
    J (1 to 4 trials per condition after the paper's delay rule), where the paper's J-array dataset has
    about 2166 trials per neuron. The single-electrode datasets of monkeys A, B and J and all EMG are
    not in it. Four claims cannot be tested, and the claims that were tested rest on condition means
    whose split-half reliability has a median of 0.20. With condition labels shuffled across trials,
    82 to 96 of the 142 units pass the paper's > 5 spikes/s inclusion rule (read as the range), against
    93 with the true labels; the paper justified that threshold by its high trial count.
- kind: selection_undocumented
  statement: The dandiset says the data are "limited to 100 train trials and 100 test trials" but not
    how the 27 conditions and 100 trials were chosen, whether this session is the paper's J-array
    dataset, or whether the trials were filtered by the paper's velocity-profile rule. 22 of the 100
    train trials have delays of 400 ms or less, which the paper excludes.
- kind: other
  statement: The test file's 100 segments (0.7 s, movement onset at 0.25 s) have no condition, go cue,
    target or behaviour, and hold only the 107 held-in units, so they cannot enter condition-wise
    analyses. None duplicates a train trial (smallest summed difference in spike counts 117).
- kind: methods_unavailable
  statement: Question for the paper's authors. The inclusion rule ">5 spikes/s of preparatory tuning"
    (10 spikes/s for single electrodes) does not define tuning. Read as the range across conditions
    it keeps 93 of 142 units here, as the SD 8; outcomes of fig4-broad-near-zero, fig4e,
    fig6-maze-endpoint-speed-space-poor and fig6-dimensionality-trend differ between the two. Was it the
    range, the SD, or another measure, and was the same measure used for the 1.5 times peri-movement
    rule?
- kind: methods_unavailable
  statement: Question for the paper's authors. How was the maze-task "proto-trial" chosen (a trial best
    matching the condition mean, or the mean itself), over what window were velocity profiles
    correlated, and how was movement onset detected (Churchland et al. 2006c is cited)? With the
    condition mean as proto-trial or a speed-threshold onset the fig6d result is partially reproduced
    here, with a proto-trial and the dataset's onset reproduced.
- kind: methods_unavailable
  statement: Question for the paper's authors. For the task spaces, how was the end of the reach set
    for the endpoints, were the three segments of equal length or duration, was "peak horizontal and
    vertical velocity" signed, and were task-space axes scaled before the PD consistency analysis of
    Figure 7D? Did the upper-limit space of the supplement include the fitted neuron, and did the
    peri-movement T matrix use all recorded neurons or only those passing the inclusion rule? Under
    the SD reading of tuning the fig6d result here depends on it.
