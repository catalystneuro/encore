  outcome: not_reproduced
  assumed: true
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig7c-anterior-posterior-performance
  notes: The upper-limit performance is at or below zero for every subset (-0.019 to -0.097), so the
    normalisation the criterion needs is undefined. Without it, the 6-D peri-movement space does not
    capture preparatory tuning at either array, with performance -1.535 (PMd, 44 units) and -1.087
