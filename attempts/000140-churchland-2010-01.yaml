- claim: fig8-linear-dynamics-simulation
  outcome: reproduced
  notebook: reproduce_churchland_2010.ipynb
  output: claim:fig8-linear-dynamics-simulation
  measured: 0.0044
  notes: Over 1000 simulations the median correlation between unit 1's initial rate and its mean over
    the 360-step released interval is 0.0044 (initial states uniform in the unit disk) and 0.0115 (in
    a square), within 0.08 +/- 0.3; the median |r| is 0.111 and 0.147, below 0.3; the PD in the 2-D
