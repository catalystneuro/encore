- claim: fig2-ls-phase-vs-shuffle
  outcome: not_reproduced
  notebook: reproduce_tingley_2018.ipynb
  output: claim:fig2-ls-phase-vs-shuffle
  measured: 0.405
  assumed: true
  notes: 'With undefined phase set to 0, 336 of 829 active LS neurons (0.405, aa1) have phase MSE below the permuted
    chance at p < 0.01 in at least one condition; ba1 0.499, ab1 0.394, bb1 0.485, all outside 0.89 +/- 0.089. Phases
    shifted within trials pass in 0.352 to 0.472 of neurons (aa1 0.380, ba1 0.472, ab1 0.352, bb1 0.454), so the
    test mostly detects where the cell fires: the chance permutes positions as well as phases. The left-out variant
    ba0 gives 0.882, within tolerance, but its shifted-phase null gives 0.847. Per animal under aa1 0.341 to 0.875
    (DT7, 16 neurons). The decoder is weak on these files: the median hippocampal rate MSE is 6,329 bins squared
    under aa1 against 6,733 for uniform guessing, and rate decoding with recorded positions beats positions 1 s
    later in only 30 of 47 sessions (data check). This outcome shows what this decoder does on these files, not
    what the paper''s data contain.'
  deviations:
  - Assumption. The paper does not say how a position bin enters phase decoding when no spike falls in its 20-bin
    smoothing window, so that its phase is undefined (STAR Methods, position prediction analysis, says only that
    firing phases are estimated for each bin and box-smoothed). Such bins are set to phase 0, as a zero-initialised
    phase map would give. Leaving them out (round 1's choice) is run as the variant aa0 and ba0; it fails the decoder
    calibration (synthetic place cells with random phases beat rate in 200 of 200 cases, and real cells with phases
    shifted within trials beat rate in 0.207 to 0.535 of conditions). About 67% of LS and 74% of hippocampal trial-by-bin
    samples are undefined.
  - Assumption. Ties between equally near template bins (many bins of a rate template are exactly 0 Hz) are broken
    at random. Sending them to the lowest bin, as a first-index rule does, is shown for reading aa1; it raised the
    hippocampal rate MSE above uniform guessing (median 7,537 against 6,733).
  - The split (whole trials or pooled trial-by-bin samples) and the bin count (201 template points or 1.5 cm) are
    the claims file's readings; all four are run with undefined phase set to 0. Under the 1.5 cm readings the DT2
    pixel sessions keep 201 bins. The samples split puts neighbouring smoothed samples of one trial into both training
    and test sets.
  - Spike phase is taken from the flagged CA1 channel (6 to 9 Hz, 3rd-order Butterworth, filtfilt, Hilbert). Six
    sessions flag no CA1 channel (five DT9 sessions with only a CA3 probe, one DT7 session); there the hippocampal
    probe's theta channel is used (assumption; the paper refers all phases to CA1 theta).
