  notes: Precession against speed is significant in 12/2,879 LS conditions (0.004, slope) or 26/2,877 (0.009, circular-linear
    r); 1,483 conditions had fewer than five trials with five or more spikes. With speed first permuted over trials
    the same test passes 0.0024 and 0.0049 of conditions, below its nominal 1%. Rate is modulated by speed in 251/4,362
