- claim: fig2-ls-phase-vs-shuffle
  outcome: reproduced
  notebook: reproduce_tingley_2018.ipynb
  output: claim:fig2-ls-phase-vs-shuffle
  measured: 0.89
  assumed: true
  notes: Under ba0 (samples split, 201 bins) 738 of 829 active LS neurons (0.890) have phase MSE below
    the permuted chance at p < 0.01 in at least one condition. aa0 (trials split) gives 0.643, ab0 0.608,
    bb0 0.830. With undefined phase set to 0 the fractions are 0.578 (aa1) and 0.462 (ba1), outside tolerance.
    Per animal under aa0 0.617 to 0.812. The outcome depends on the split and on the assumption.
  deviations:
  - Assumption. The paper does not say how a position bin enters phase decoding when no spike falls in
    its 20-bin smoothing window, so that its phase is undefined (STAR Methods, position prediction analysis,
    says only that firing phases are estimated for each bin and box-smoothed). Such samples are left out
    of the template and the test, the literal reading of a phase that exists only where spikes occur.
    The alternative, phase set to 0 as a zero-initialized map would give, is run as readings aa1 and ba1.
    About 67% of LS and 73% of hippocampal trial-by-bin samples are undefined.
  - The split (whole trials or pooled trial-by-bin samples) and the bin count (201 template points or
    1.5 cm) are the claims file's readings; all four are shown.
  - Spike phase is taken from the flagged CA1 channel (6 to 9 Hz, 3rd-order Butterworth, filtfilt, Hilbert).
    Six sessions flag no CA1 channel (five DT9 sessions with only a CA3 probe, one DT7 session); there
    the hippocampal probe's theta channel is used (assumption; the paper refers all phases to CA1 theta).
