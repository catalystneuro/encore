- claim: speed-independent
  outcome: partially_reproduced
  notebook: reproduce_tingley_2018.ipynb
  output: claim:speed-independent
  notes: Precession against speed is significant in 15/2,879 LS conditions (0.005, slope) or 23/2,877
    (0.008, circular-linear r); 1,483 conditions had fewer than five trials with five or more spikes.
    Rate is modulated by speed in 223/4,362 (0.051, per spike) or 331/4,362 (0.076, 100 ms bins). All
    are below 20% and below the paper's values.
  deviations:
  - Running speed from x and y head position smoothed over 0.25 s, and the circular-linear slope by maximizing
    the mean resultant length over -2 to 2 cycles per track; both standard choices the paper does not
    state.
- claim: fig5-assemblies
  outcome: blocked
  blocked_by: too_large
  notebook: reproduce_tingley_2018.ipynb
  output: claim:fig5-assemblies
  notes: Not run. The notebook times one least-squares GLM fit on the median pair's 82,008 1 ms samples
    at about 8 ms, so one pair (150 windows x 11 fits) takes about 13 s. The 104,845 simultaneously recorded
    unit pairs would take roughly 400 CPU hours, and the 619,934 pairs by condition over 2,000. The paper's
    11,264 pairs alone would take about 40 hours, far beyond the 60-minute notebook limit. The data the
    method needs (spike times, trials, CA1 LFP, position) are in the dataset.
