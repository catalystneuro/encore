- claim: fig4e-onset-mediolateral
  outcome: partially_reproduced
  notebook: reproduce_tingley_2018.ipynb
  output: claim:fig4e-onset-mediolateral
  assumed: true
  notes: 'With undefined phase set to 0, Kruskal-Wallis finds the animals'' onsets different only under bb1 with
    the onset from the phase map (p = 0.040); elsewhere p = 0.13 to 0.68. Watson-Williams gives p < 1e-5 under every
    reading, but its assumption of concentrated samples fails (pooled resultant length 0.14 to 0.22, below 0.45),
    so it is not relied on. circ_corrcl of the animal means with the medial-lateral coordinate is 0.074 to 0.740,
    below 0.8 everywhere (aa1 0.38 and 0.44). Under the left-out variant ba0 the full rule holds (Kruskal-Wallis
    p = 0.040 and 0.0032, r up to 0.827), but that variant fails the decoder calibration. The decoder is weak on
    these files: the median hippocampal rate MSE is 6,329 bins squared under aa1 against 6,733 for uniform guessing,
    and rate decoding with recorded positions beats positions 1 s later in only 30 of 47 sessions (data check).
