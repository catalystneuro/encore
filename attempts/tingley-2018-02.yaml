findings:
- kind: metadata_error
  about: data
  statement: 'In 31 sessions of DT7, DT8 and DT9 the head position and the trial-condition templates are labelled
    meters but hold millimetres: the template paths are 1,329 to 2,934 units long, against 0.97 to 3.13 in the sessions
    in metres. Speeds and any metric distance read from these files are 1,000 times too large.'
- kind: data_missing
  about: data
  statement: Session sub-DT7_ses-20170324-576um-144um-170324-123932 has no units table, so its spikes cannot be
    used.
- kind: other
  about: data
  statement: No CA1 channel is flagged in five DT9 sessions (20170518 to 20170525, CA3 probe only) and in DT7 20170317.
    The paper refers all LS spike phases to dorsal CA1 theta, so for these sessions the reference is not in the
    files; this attempt used the hippocampal probe's theta channel.
- kind: metadata_insufficient
  about: data
  statement: No file marks the maze rotations of Figure S6 or the maze orientation of a condition. The trial conditions
    name only the maze type, so the reference-frame analysis cannot be done.
- kind: other
  about: data
  statement: The files hold 3,260 hippocampal units (2,636 labelled hpc, 624 ca3) and 1,696 LS units, against the
    paper's 2,951 and 1,647. As the hpc label is the probe and not a subfield, the paper's 2,297 CA1 and 654 CA3
    units cannot be recovered from the labels under either reading tried.
- kind: metadata_insufficient
  about: data
  statement: 'Some files lack columns the others have: trials.trial_type (the task is then only in the session description),
    trial_conditions.condition_type, and in one session units.max_waveform_channel. Some trial conditions have 151
    template points where the rest have 201.'
- kind: methods_unavailable
  about: paper
  statement: 'Question for the authors. In the single-cell phase decoder, how does a trial''s position bin enter
    when no spike falls in its 20-bin smoothing window, so that its phase is undefined? About 70% of trial-by-bin
    samples are affected, and STAR Methods, position prediction analysis, does not say. Left out, the decoder reads
    where the cell fires: phases shifted within trials beat rate in 0.21 to 0.54 of conditions, and LS phase then
    beats rate as reported. Set to phase 0, the shifted-phase check is near its nominal rate, LS phase no longer
    beats rate, and hippocampal phase is slightly worse than rate. Under both, the comparison with permuted chance
    passes shifted phases nearly as often as real ones.'
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. How is the Olypher peak information converted to bits/cm (Results, paragraph
    4, 0.4 against 1.7 bits/cm), and are the 7 levels of equal width or equal count? Neither reading tried gives
    both averages.
- kind: selection_undocumented
  about: paper
  statement: The 1,425 hippocampal neurons of the place-field definition (STAR Methods) are not identified. Units
    with at least one included condition number 1,420 in the files, which may be the set meant.
- kind: paper_inconsistency
  about: paper
  statement: Results, paragraph 1 gives 1,587 CA1 and 224 CA3 place fields (1,811 in all), while Figures 1 and 2
    use 1,820 place fields.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. In the single-cell decoder, which bin is predicted when several template
    bins are equally near the test value (many bins of a rate template are 0 Hz)? A first-index rule sends all of
    them to the lowest bin and puts the hippocampal rate MSE above uniform guessing (median 7,537 against 6,733
    bins squared); random choice gives 6,329.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. In peer prediction, is the GLM fitted per trial or over the condition's concatenated
    trials, and how are trials of different lengths paired in the trial-order shuffles? Which pairs make up the
    11,264 examined? This attempt finds 81,393 pairs with both units included in the condition.
- kind: data_missing
  about: data
  statement: DT8's 17 sessions have hippocampal channels, with a flagged CA1 channel, but no hippocampal units,
    although the paper recorded CA1 units in every rat. Sessions with LS and CA1 units number 25 or 33 in the files,
    against the paper's 63.
- kind: metadata_insufficient
  about: data
  statement: Which probe each of the two depths in a session name belongs to, and the order of sites along a shank,
    are not stored (session descriptions; electrodes table). The depth analysis of Figure 4 needs both; the direction
    of the depth gradient depends on them.
