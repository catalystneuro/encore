- claim: fig1i-hpc-rate-phase-equivalent
  outcome: not_reproduced
  notebook: reproduce_tingley_2018.ipynb
  output: claim:fig1i-hpc-rate-phase-equivalent
  assumed: true
  notes: 'A claim of absence judged on the KS test at 0.05, under the adopted reading aa1. Rate and phase MSE differ
    over place fields (rate map a, 1,640 fields, p = 4.8e-05, D = 0.080; rate map b, 1,924 fields, p = 0.0065, D
    = 0.055) and over sessions (p = 0.042 over 44 and 0.0064 over 45); phase MSE is higher by 271 and 197. The 1.5
    cm reading ab1 with rate map b gives p = 0.066 and 0.82, and ties sent to the lowest bin give p = 0.18 and 0.82
    for rate map b; with rate map a both still give p < 0.01. Under the left-out variant p < 1e-100. Of the eight
    readings with undefined phase 0 and ties at random, only ab1 with rate map b has neither test at p < 0.05 (notebook,
    line under the table). Reproduced was proposed on that reading; the third verification round did not agree,
    as the criterion has no "under one reading" clause, so the outcome stays on the adopted reading aa1 and the
    proposal stands with the disagreement. 7 of the 8 readings find a difference. The decoder is weak on these files: the median
    hippocampal rate MSE is 6,329 bins squared under aa1 against 6,733 for uniform guessing, and rate decoding with
    recorded positions beats positions 1 s later in only 30 of 47 sessions (data check). This outcome shows what
    this decoder does on these files, not what the paper''s data contain.'
  deviations: *id001
  proposed:
    outcome: reproduced
    reason: 'The verifier found readings chosen inconsistently: fig4d was judged on whichever decoder reading passes,
      fig1i on the adopted aa1 alone. One rule now decides every claim, the one the claims file uses throughout
      (a criterion is met under one reading): with undefined phase 0 and ties at random, the 1.5 cm reading ab1
      with rate map (b) gives KS p = 0.066 over 1,924 place fields and 0.82 over 45 sessions, neither below 0.05
      (notebook, fig1i cell, line under the table). Under the other 7 readings at least one test gives p < 0.05,
      so the reproduction is fragile. The verifier did not agree in round 3 and gives not_reproduced: the criterion
      has no "under one reading" clause and says "Reproduced when neither test gives p < 0.05; not reproduced when
      either does"; for a claim of absence a pass under any of 8 readings grows easier with each reading added;
      the rule was chosen after the per-reading results were known; ab1 is only partly a 1.5 cm reading, as 2,822
      of its 5,723 hippocampal conditions keep 201 bins and take the aa1 result; and each criterion should be applied
      as written. The outcome is kept.'
