- claim: fig1e-phase-info-smaller-scale
  outcome: partially_reproduced
  notebook: reproduce_tingley_2018.ipynb
  output: claim:fig1e-phase-info-smaller-scale
  measured:
  - 15.0
  - 21.0
  assumed: true
  notes: 'With undefined phase set to 0, phase peaks at smaller smoothing than rate under all four readings (p =
    1.4e-25 to 3.9e-58); 1,426 to 1,783 fields are kept, the others peak at 49 bins or more. Box-map fields with
    equal-width levels give medians 15 (phase, within 15 +/- 1.5) and 21 (rate, outside 29 +/- 2.9); equal-count
    levels give 22 and 26 or 27 (rate within only for box maps). No reading has both within. Phases shifted within
    trials give phase medians of 12.5 to 21, close to the real ones, so the smaller phase scale does not depend
    on the phases. Under the left-out variant the phase median is 2 (equal widths) or 19. With undefined phase 0,
    the fill and not the phases sets this smaller phase scale: shifted phases give the same medians.'
  deviations: &id002
  - Phase information sets an undefined smoothed phase to 0, as the decoder does (assumption); leaving such bins
    out is a variant. Left out, P(k|x) at fine smoothing comes from the few trials with a spike near the bin, and
    shifted phases score as high as real ones.
  - The best smoothing is the argmax of the information curve smoothed as MATLAB smooth(y, 5), whose span shrinks
    at the ends (standard choice; round 1's zero-padded convolution kept every field).
- claim: fig1g-phase-more-info-fine-scale
  outcome: reproduced
  notebook: reproduce_tingley_2018.ipynb
  output: claim:fig1g-phase-more-info-fine-scale
  assumed: true
  notes: 'With undefined phase set to 0, Gaussian-map fields, equal-count levels and the KS test (reading b), phase
    exceeds rate at 2 and 3 bins (0.684 and 0.708 bits, p below 1e-250) and rate exceeds phase significantly at
    37 of 44 smoothings from 7 to 50 bins (0.841, at least 0.8). The t test reading gives 35 of 44 (0.795), box
    maps 33 and 35 of 44, and equal-width levels put rate above phase at every smoothing including 2 and 3 bins.
    Phases shifted within trials give the same fine-scale excess (0.695 bits at 2 bins against 0.684 real), so the
    match does not show that phase carries more information at fine scale. The phase-0 fill causes the match: at
    2 and 3 bins most bins of a trial have no spike within the window, so their phase is 0 and their cosine 1, and
    the information measures whether a spike is near, not its phase. On the fields with the null, real phases carry
    0.032 to 0.058 bits more than shifted phases at 2 and 3 bins under every field and level reading (paired t p
    = 0.013 to 7.7e-05), a small part of the 0.684 to 0.720 bit excess over rate. The match holds under 1 of the
    4 field and level readings (with the KS test). Under the left-out variant phase exceeds rate at every smoothing.'
  deviations: *id002
