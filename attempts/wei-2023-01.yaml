outcomes:
- claim: source-data-units-link
  outcome: partially_reproduced
  notebook: reproduce_wei_2023.ipynb
  output: claim:source-data-units-link
  notes: The dandiset holds 13 of the 25 sessions; all 566 Source Data units of those sessions are VISp
    units of quality good there, with the per-session counts of sheet Fig 1d, and none of the 638 units
    of the other 12 sessions is in the dandiset. On the matched units TPW and REP are equal to the Source
    Data values for 85.0% of units and 1/V below and above for 71.7% and 68.0%. The other claims are judged
    on the 13 sessions. Unit ids are matched directly; the ids of the 12 missing sessions are in none
    of the held sessions' units tables.
  deviations:
  - Only 13 of the 25 sessions are in the dandiset, so every claim on the dataset is judged on that subset.
- claim: fig1d-unit-count
  outcome: not_reproduced
  notebook: reproduce_wei_2023.ipynb
  output: claim:fig1d-unit-count
  measured:
  - 741
  - 57.0
  notes: On the 13 held sessions, reading (a) gives 741 units after the code's exclusions, 57.0 per mouse,
    and reading (b) 1604, 123.4 per mouse, against 48 +- 4.8; the Source Data put 566 units (43.5 per
    mouse) in the same sessions. Starting from the code's own unit tables gives 494 units, 38.0 per mouse.
    The total of 1204 cannot be reached with 13 of 25 sessions. Per session, reading (a) gives 16 to 94
    units, the Source Data 16 to 71.
  deviations:
  - 13 of 25 sessions; the total cannot be compared and the mean per mouse is the measure.
  - The code's 3 SD exclusions are taken over the values present (nanmean, nanstd); taken literally, NaN
    in 1/V above and W above (14 and 8 units) turns them off, giving 752 and 1610 units (assumption, see
    the helper's code_exclusions).
  - The waveform window is the 40 channels from the peak minus 20 to plus 19, as the code's array layout
    implies (NP_EAP_FeatureAnalysis.ipynb cells 3 and 7); every unit's window fits on the probe.
- claim: fig2-one-channel-two-clusters
  outcome: reproduced
  notebook: reproduce_wei_2023.ipynb
  output: claim:fig2-one-channel-two-clusters
  notes: Under both readings the elbow and the minimum of f(K) select K = 2 (also under the four other
    seeds, reading a), and the cluster of lower median TPW (0.261 ms, reading a) also has the lower median
    REP (0.251 against 0.302 ms).
  deviations:
  - K-means random states are the claim's seed, where the code uses 10 and 11400; with 1000 initialisations
    the five seeds give the same K and labels.
  - The dandiset holds 13 of the paper's 25 wild-type sessions; the result is on those.
