findings:
- kind: data_missing
  about: data
  severity: major
  statement: The dandiset holds 13 of the 25 wild-type sessions the paper analysed (the Brain Observatory
    1.1 sessions); the other 12 (766640955, 767871931, 768515987, 771160300, 771990200, 774875821, 778240327,
    778998620, 779839471, 781842082, 793224716, 847657808), with 638 of the paper's 1204 units, belong
    to the Functional Connectivity set, which the paper's Data availability statement does not name. It
    also holds 5 of the 8 Pvalb and 6 of the 12 Sst opto-tagging mice.
- kind: other
  about: data
  severity: none
  statement: Every one of the 566 Source Data units of the 13 held sessions is a VISp unit of quality
    good in the units tables, with the per-session counts of Source Data sheet Fig 1d; recomputed from
    the files' mean waveforms, TPW and REP equal the Source Data values for 85% of them, and the drifting-grating
    metrics and the code's firing-rate columns are reproduced exactly.
- kind: metadata_insufficient
  severity: minor
  statement: The files do not say which units the paper analysed or give its cluster labels (FS/RS and
    FS1 to RS3); these come only from the paper's Source Data, which names units by the same ids as the
    units tables.
- kind: metadata_error
  severity: minor
  statement: The units table's waveform_mean is labelled volts, but its values (amplitudes of about 5
    to 500) are microvolts.
- kind: selection_undocumented
  about: paper
  statement: The isolation criteria behind the paper's "well-isolated" units and the code's good flag
    are not stated. The code's unit tables hold 618 units of the held sessions, of which 15 fail the AllenSDK
    default filter, while that filter passes 900; neither reading reproduces the paper's counts.
- kind: methods_unavailable
  statement: Question for the authors. How were units selected as well-isolated (the good flag of the
    code's unit tables), how was the layer 4 centre placed from the CSD (the code starts from precomputed
    depths, which the CSD computed here does not reproduce), and over which period are the Fig 3a rate,
    CV and LV taken (neither the presentations nor the whole blocks reproduce the Source Data values)?
    Which baseline window was used for opto-tagging?
- kind: methods_unavailable
  statement: Question for the authors. The phase-locking analysis leaves open the LFP channel, the spikes
    kept under the 10,000 cap, and what kappa is (the Methods say it ranges from 0 to 1, which a von Mises
    concentration does not). With the Rayleigh test at p < 0.001 on up to 10,000 spikes, 75% of RS units
    are phase-locked to theta during the gray screen here, against 4.7% in Fig S7; which spikes and which
    period were used there?
- kind: code_mismatch
  statement: The code's 3 SD exclusion (ecp_func.outlier_index) uses np.mean and np.std, so a single NaN
    feature turns the exclusion off for that feature. On this dataset 1/V above is NaN for 14 units of
    reading (a), and run literally the exclusion keeps a unit at 93.6 ms/mm, which then forms one of the
    three RS clusters on its own.
- kind: other
  about: paper
  statement: The model parameters (conductances) of the 33 models are not public beyond the few columns
    of the Source Data; the model repository holds one example model. The in vitro features of the Source
    Data equal those of the Allen Cell Types Database API.
