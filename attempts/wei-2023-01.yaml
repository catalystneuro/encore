outcomes:
- claim: source-data-units-link
  outcome: partially_reproduced
  notebook: reproduce_wei_2023.ipynb
  output: claim:source-data-units-link
  notes: The dandiset holds 13 of the 25 sessions; all 566 Source Data units of those sessions are VISp
    units of quality good there, with the per-session counts of sheet Fig 1d, and none of the 638 units
    of the other 12 sessions is in any of the dandiset's 32 session files, which do not include those
    sessions. On the matched units TPW and REP are equal to the Source
    Data values for 85.0% of units and 1/V below and above for 71.7% and 68.0%. The 85 units whose TPW
    or REP differ also differ in 1/V below, and the per-session table shows where they lie; where they
    differ, TPW differs by a median of 0.004 ms (IQR -0.017 to 0.024 ms), so the waveforms are close but
    not identical. Every one of the 566 units has at least 100 spikes in the first 5-min gray screen,
    and 270 of the 297 reading (a) units outside the code's tables have fewer. The other claims are judged
    on the 13 sessions.
  deviations:
  - Only 13 of the 25 sessions are in the dandiset, so every claim on the dataset is judged on that subset.
- claim: fig1d-unit-count
  outcome: not_reproduced
  notebook: reproduce_wei_2023.ipynb
  output: claim:fig1d-unit-count
  measured:
  - 741
  - 57.0
  notes: On the 13 held sessions, reading (a) gives 741 units after the code's exclusions, 57.0 per mouse,
    and reading (b) 1820, 140.0 per mouse, against 48 +- 4.8; the Source Data put 566 units (43.5 per
    mouse) in the same sessions. Reading (c), not a reading of the criterion, gives 516 units, 39.7 per
    mouse, and keeps 487 of the 566 Source Data units with 29 others, where reading (a) keeps 493 with
    248 others. Starting from the code's own unit tables gives 494 units, 38.0 per mouse. The total of
    1204 cannot be reached with 13 of 25 sessions.
  deviations:
  - 13 of 25 sessions; the total cannot be compared and the mean per mouse is the measure.
  - The code's 3 SD exclusions are taken over the values present (nanmean, nanstd); taken literally, NaN
    in 1/V above and W above (14 and 8 units) turns them off, giving 752 and 1845 units (readings a and
    b) (assumption, see the helper's code_exclusions).
  - The waveform window is the 40 channels from the peak minus 20 to plus 19, as the code's array layout
    implies (NP_EAP_FeatureAnalysis.ipynb cells 3 and 7); every unit's window fits on the probe.
  - Reading (b) holds every VISp unit of the units table, quality good or noise, as the criterion words
    it; reading (c), reading (a) with at least 100 spikes in the first 5-min gray screen, is shown as
    a variant and is not used for this claim's outcome.
