    per-unit values for checks, and the per-model and per-cell values of the in vitro and model claims.'
  source: doi:10.1038/s41467-023-37844-8
- what: In vitro electrophysiology features (EphysFeature) of the 33 cells of Table S1, read from the
    Allen Cell Types Database API by specimen id.
