- claim: figs5-depth-distribution
  outcome: not_reproduced
  notebook: reproduce_wei_2023.ipynb
  output: claim:figs5-depth-distribution
  notes: With the CSD layer 4 centre computed here, the method the criterion names, the six clusters
    differ in depth (Kruskal-Wallis p = 0.044, reading c; 0.011, reading a; 2.0e-08, reading b), which
    meets the criterion, but on the Source Data labels the same depth gives p = 0.36. With the layer 4
    centre of the code's unit tables the test gives p = 0.25 (reading c), 0.29 (reading a), 2.8e-05 (reading
    b) and 0.34 on the Source Data labels. That centre is 2740 um on 8 of the 13 probes, 2460 on 4 and
    2380 on 1, so it may be a fixed offset and not a placement from each probe's CSD; the recorded outcome
    took it as the paper's CSD placement, which the outputs do not support. The two centres differ by
    -420 to +340 um per probe, and neither is validated here. The outcome stays as verified in round
    1 and reviewed in round 2; a change to partially reproduced is proposed.
  deviations:
  - FS is clustered with K forced to 3, as f(K) selects 2 under reading (a); the FS1 to FS3 clusters rest
    on that choice.
  - Isolation is open. Reading (c), reading (a) with at least 100 spikes in the first 5-min gray screen,
    is used for the claims that follow the clustering, an assumption taken from the Results (well-isolated
    units during spontaneous activity, paragraph 1 of EAP recordings from in vivo experiments) and the
    Methods' 100-spike rule (Single unit firing properties); it keeps all 603 reading (a) units of the
    code's unit tables and adds 27, where reading (a) adds 297. Readings (a) and (b) and the Source Data
    labels are shown beside it.
  - Depth from the CSD layer 4 centre computed here (second spatial derivative of the flash-averaged
    LFP, the first VISp channel whose CSD reaches half its minimum within 0 to 150 ms), the method the
    criterion of figs5-depth-distribution names. The layer 4 centre of the code's unit tables (their
    depth is the probe position minus one value per probe, 2740 um on 8 of the 13 probes) is shown as
    a variant; the round-2 verifier found it weakly supported as the paper's CSD placement. The two
    differ by -420 to +340 um per probe and neither is validated here, so the claims judged on depth
    rest on this choice (an assumption).
  assumed: true
  proposed:
    outcome: partially_reproduced
    reason: The not reproduced outcome rested on the code's layer 4 centre taken as the paper's CSD placement,
      and the round-2 verifier showed, from the per-probe table, that this centre is one value on 8 of the
      13 probes (2740 um), so it is weakly supported as a CSD placement and is not the method the criterion
      names. With the CSD centre computed here, the criterion's method, the six clusters found here differ
      in depth (p = 0.044, reading c; 0.011, reading a; 2.0e-08, reading b), which meets the criterion,
      while the paper's own labels on the same depth give p = 0.36; the centre here is not validated (it
      differs from the code's by -420 to +340 um per probe). The difference is present for the clusters
