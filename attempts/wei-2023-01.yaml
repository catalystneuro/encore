- what: 'The paper''s Source Data workbook (41467_2023_37844_MOESM3_ESM.xlsx): unit ids and cluster labels,
    per-unit values for checks, and the per-model and per-cell values of the in vitro and model claims.'
  source: doi:10.1038/s41467-023-37844-8
- what: In vitro electrophysiology features (EphysFeature) of the 33 cells of Table S1, read from the
    Allen Cell Types Database API by specimen id.
  source: https://api.brain-map.org/api/v2/data/query.json (model::EphysFeature, Allen Cell Types Database),
    read 2026-11-21
- what: Definitions of f1/f0, modulation index and lifetime sparseness, ported to the helper.
