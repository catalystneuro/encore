inputs:
- what: The paper's Source data 1 (elife-28132-data1-v2.mat, MD5 3ca8f91c5371e88c12f5eb32b3b209c6), streamed from https://cdn.elifesciences.org/articles/28132/elife-28132-data1-v2.mat.
    Only its recording depth (Depth) is used, by firing-rate-depth, fig4s1-cs-peak-suppression-not-different, fig5ej-cs-pause-cells-shallower
    and fig6g-us-response-depth; its trial counts, CR @ US ms, Baseline Hz and Cell are read by source-data-1-link to
    check the match.
  source: doi:10.7554/eLife.28132
outcomes:
- claim: source-data-1-link
  outcome: reproduced
  notebook: reproduce_brinke_2017.ipynb
  output: claim:source-data-1-link
  notes: Added after the reader's answer (questions/brinke-2017.yaml), which made four claims take recording depth from
    Source data 1. Matched by order, all 372 cells agree on the number of trials, the per-trial eyelid closure at US
    onset ('CR @ US ms' equals crAmplitude) and the per-trial baseline rate ('Baseline Hz' equals the spike count over
    500 ms, or 200 ms in the second dataset), and Source data 1's 'Cell' is each cell's position; shifted by one cell,
    9 of 371 agree on the trial count and none on the other two. Source data 1 gives one depth per cell for the 270 first-dataset
    cells (1500 to 3000 um) and none for the 102 second-dataset cells.
- claim: firing-rate-depth
  outcome: reproduced
  notebook: reproduce_brinke_2017.ipynb
  output: claim:firing-rate-depth
  measured: 68.3
  notes: The reader's answer (questions/brinke-2017.yaml) made the claim data with_inputs, with recording depth from
    the paper's Source data 1; the earlier run blocked it as data_missing. Under reading (a), the 500 ms baseline, the
    270 first-dataset cells fire at 68.3 +/- 26.4 Hz (within 67 +/- 6.7) and the rate does not correlate with depth (Pearson
    r = 0.086, p = 0.16; the paper's r = 0.085, p = 0.16). Under reading (b), the whole trial, the mean is 70.6 +/- 27.4
    Hz and the correlation is significant (r = 0.146, p = 0.0167), so the claim holds under reading (a) only. Within
    the 11 mice with at least 10 cells no reading (a) correlation is significant (p >= 0.14). The data set's per-trial
    baseline rates equal Source data 1's 'Baseline Hz' in every cell (source-data-1-link), so the rate side matches the
    paper's own values.
- claim: fig1ijk-modulation-classes
  outcome: not_reproduced
  notebook: reproduce_brinke_2017.ipynb
  output: claim:fig1ijk-modulation-classes
  measured:
  - 80
  - 23
  - 167
  notes: 'No reading puts all three counts within tolerance. Under the claims file''s readings, (a) gives 80 facilitation,
    23 suppression and 167 unmodulated cells (only suppression within tolerance) and (b) gives 88 (89 with facilitation
    first), 31 (30) and 151 (none within tolerance). This attempt''s variant (a+) gives 62, 13 and 195 (facilitation
    and unmodulated within tolerance). The authors'' own per-cell facilitation and suppression in Source data 1 (''Mean Facil Hz'' follows reading (b) closely here, Pearson r = 0.998 with a median difference of -0.16 Hz, though reading (b) classes 88 cells as facilitating) give 84 and 34 cells at 5 Hz or more, so the paper''s 60 and 23 rest
    on a criterion that neither the paper nor the claims file names. Measured values are reading (a), larger-change tie
    rule. Changed from partially_reproduced after the first verification round: the criterion needs all three counts
    under one reading, and under the claims file''s readings at most one holds.'
  deviations:
  - Cell classes are run under the claims file's baseline-correction readings (a) and (b), and under a variant of this
    attempt's own, (a+), in which the 'mean above-baseline activity within the baseline itself' (Materials and methods,
    Spike modulation in the last 200 ms of the CS-US interval) is averaged over the above-baseline bins only, which the
    wording also allows; no outcome rests on (a+) alone. Reading (b) on each cell's average trace closely follows the authors' per-cell facilitation in Source data 1 ('Mean Facil Hz', Pearson r = 0.998, median difference -0.16 Hz; reading (b) classes 88 cells as facilitating where those values give 84), and on single trials over 0-212 ms the
    data set's own per-trial facilitation in the second dataset.
- claim: modulation-absolute-not-rate-dependent
  outcome: not_reproduced
  notebook: reproduce_brinke_2017.ipynb
  output: claim:modulation-absolute-not-rate-dependent
  notes: The criterion needs the facilitation correlation absent and the other three significant with the printed signs
    under one reading; at most two of the four hold. Absolute facilitation does not depend on firing frequency (Spearman
    r = -0.037 to -0.029, p = 0.55 to 0.63) and relative suppression does (reading a, r = -0.207 signed negative, p =
    0.00063, the paper's -0.211). Absolute suppression shows no relation under any reading (|r| <= 0.008, p >= 0.89;
    paper r = -0.131, p = 0.03), and relative facilitation is significant only under reading (b) (r = -0.123, p = 0.044;
    paper r = -0.378). Changed from partially_reproduced after the first verification round.
  deviations:
  - Cell classes are run under the claims file's baseline-correction readings (a) and (b), and under a variant of this
    attempt's own, (a+), in which the 'mean above-baseline activity within the baseline itself' (Materials and methods,
    Spike modulation in the last 200 ms of the CS-US interval) is averaged over the above-baseline bins only, which the
    wording also allows; no outcome rests on (a+) alone. Reading (b) on each cell's average trace closely follows the authors' per-cell facilitation in Source data 1 ('Mean Facil Hz', Pearson r = 0.998, median difference -0.16 Hz; reading (b) classes 88 cells as facilitating where those values give 84), and on single trials over 0-212 ms the
    data set's own per-trial facilitation in the second dataset.
- claim: fig1l-cells-with-behavior
  outcome: reproduced
  notebook: reproduce_brinke_2017.ipynb
  output: claim:fig1l-cells-with-behavior
  measured: 111
  notes: 111 of 270 recordings (41.1%) have CRs in at least 20% of trials. The two eyelid-baseline readings are the same
    samples in the first dataset. The count is 129 at 15% and 94 at 25%, and 132 to 101 for CR thresholds of 4% to 6%
    closure. Source data 1's own per-trial CR flags ('CR Yes/no?') agree with this attempt's on 97.4% of trials (mean
    per recording) and give 103 recordings, the paper's number; 102 recordings are in both sets.
  deviations:
  - 'The Methods'' trial exclusions (Grubbs test on baseline SDs, eye at least half open; Materials and methods, Eyeblink
    conditioning) are not applied again: Source data 1''s ''# Valid Trials'' has the deposited trial count in all 372
    cells (source-data-1-link), so the deposited trials are the trials the paper analysed. 282 deposited trials have
    a baseline eyelid at or past half closure.'
