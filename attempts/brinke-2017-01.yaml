findings:
- kind: data_missing
  statement: The data set holds no recording depth, which the paper uses in four of its findings (Figures 4-figure supplement
    1E, 5E, 5J and 6G, and the depth correlation of firing rate). The paper's Source data 1 on the eLife site gives it
    for the 270 first-dataset cells, which match the data set's cells in order, and for none of the 102 second-dataset
    cells.
- kind: other
  about: paper
  statement: The paper's Source data 1 gives Depth as NaN for all 102 second-dataset cells, although Figure 5J reports
    their depths (2350 +/- 140 against 2450 +/- 211 um), so the second-dataset depths are not public.
- kind: data_missing
  statement: The US-only trials interspersed in 25 second-dataset recordings (Figure 7 and its supplement 1) and the
    optogenetic sessions of three L7cre-Ai27 mice (Figure 3) are not in the data set; nothing in it marks a trial's type.
- kind: metadata_error
  statement: 'The per-trial crAmplitude is described as the eyelid closure at US onset, but it equals the eyelid position
    13 ms before the stated US onset (usOnset): exactly in the second dataset (largest difference per recording at most
    0.11% closure), and with a median per-recording largest difference of 1.1% closure in the first. At the stated US
    onset the differences are 5.3 and 13.5% (medians). The second-dataset mean of crAmplitude is the paper''s 43.5 +/-
    17%.'
- kind: metadata_insufficient
  statement: The per-trial facilitation variable is described only as facilitation during the CS-US interval after subtracting
    spontaneous facilitation in the baseline. In the second dataset it equals the mean of the positive part of the trial's
    spike density above the trial's own baseline mean over the whole CS-US interval (0-212 ms), minus the same quantity
    over the 200 ms baseline. In the first dataset neither the last 200 ms nor the whole interval reproduces it exactly
    (median per-recording largest difference 4.5 and 8.9 Hz), so its definition there is not documented.
- kind: metadata_error
  statement: The stored ephysMean is not the mean of the stored ephys trials in 26 recordings (median absolute difference
    above 1 Hz; largest single difference 158 Hz), while eyelidMean equals the mean of the eyelid trials everywhere.
- kind: selection_undocumented
  about: data
  statement: 282 of the 13027 deposited trials have a baseline eyelid at or past half closure, and a Grubbs test on baseline
    SDs flags 402, while the Methods say such trials were removed. Source data 1 lists exactly the deposited trials as
    each cell's valid trials, so the trials the paper analysed include them; neither the data set nor the paper says
    how the exclusions were applied.
- kind: other
  about: data
  statement: The first dataset has 18 mouse IDs (1 to 19 without 10), where the paper's Results say 19 mice and its Methods
    22. The second dataset has 6, as the Methods say.
- kind: other
  about: data
  statement: The second dataset's CS-US interval is 212 ms in the data set (usOnset 0.212 s) and its description, but
    200 ms in the paper's Results.
- kind: methods_unavailable
  statement: 'Questions for the paper''s authors, as no analysis code is linked. (1) How is the ''mean above-baseline
    activity within the baseline itself'' formed for the CS-US modulation classes: the mean of max(baseline - mean, 0)
    over all baseline bins, the mean over the above-baseline bins only, or the positive parts in both window and baseline
    (the data set''s facilitation variable)? None of these gives 60, 23 and 187 cells here (80/23/167, 62/13/195, 88/31/151),
    and the authors'' own per-cell values in Source data 1 give 84 and 34 cells at 5 Hz; what further criterion selects
    the 60 and 23? (2) For the CS pause, is 4.5 SDs measured from the baseline mean or as the size of the drop, is the
    2 SD rebound measured from the trough or from the baseline, and must the rebound fall within 50-125 ms? (3) How were
    the 500 random datasets of the bootstrap made? (4) Which normality test decides between Pearson and Spearman? (5)
    Over which segment and lag range, and with which estimator, were the spike-eyelid cross-correlations taken? With
    a Pearson r recomputed at each lag many lags sit at the edge of a +/-100 ms range; with the cross-covariance of the two traces at most one does. (6) How is spike rate velocity computed? The first difference of the 1 ms spike density gives
    two to four times the paper''s values. The paper''s Source data 1 holds per-cell values that would let these be checked.'
- kind: paper_inconsistency
  statement: The paper gives 19 mice for the first dataset in the Results and n = 25 in all, with 22 for the first and
    6 for the second dataset, in the Methods; these do not add up.
- kind: paper_inconsistency
  statement: The paper's Source data 1 gives each first-dataset cell's mean facilitation and suppression ('Mean Facil
    Hz', 'Mean Supp Hz'), and 84 and 34 cells reach the stated 5 Hz threshold, where the Results give 60 facilitation
    and 23 suppression cells. Its undocumented 'Mean US-Cluster' code, read as neither (0), peak only (1, 4), both (2,
    3) and pause only (6), gives the Figure 6B counts exactly (31, 134, 77, 28).
