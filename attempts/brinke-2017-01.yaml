- claim: fig2d-facilitation-leads-eyelid-ds1
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_brinke_2017.ipynb
  output: claim:fig2d-facilitation-leads-eyelid-ds1
  measured: 48.2
  notes: Spikes lead the eyelid under every reading and both estimators (Wilcoxon p = 5e-08 to 0.0024), but no mean lag
    is within 25 +/- 2.5 ms. With the adopted cross-covariance the mean lag is 47.4 to 50.4 ms (48.2 for class a, last
    200 ms), no cell's best lag is at the +/-100 ms edge and none is flat at its best lag; the re-cut Pearson variant
    gives 31.8 to 49.3 ms, with 16 to 22 cells at the edge. Both give this outcome.
  deviations:
  - Cell classes are run under the claims file's baseline-correction readings (a) and (b), and under a variant of this
    attempt's own, (a+), in which the 'mean above-baseline activity within the baseline itself' (Materials and methods,
    Spike modulation in the last 200 ms of the CS-US interval) is averaged over the above-baseline bins only, which the
    wording also allows; no outcome rests on (a+) alone. Reading (b) on each cell's average trace closely follows the authors' per-cell facilitation in Source data 1 ('Mean Facil Hz', Pearson r = 0.998, median difference -0.16 Hz; reading (b) classes 88 cells as facilitating where those values give 84), and on single trials over 0-212 ms the
    data set's own per-trial facilitation in the second dataset.
  - 'The cross-correlation estimator is not given in the paper (''temporal cross-correlations between average spike and
    eyelid traces'', Results, IpN facilitation but not suppression can drive conditioned eyelid behavior, paragraph 1).
    Assumed: the cross-covariance of the two mean-subtracted average traces over the segment, normalized by their norms
    (MATLAB''s xcov with ''coeff''), the standard estimator for two traces. The first round used the Pearson r of the
    spike segment with the eyelid trace re-cut at each lag, which the verifier found nearly flat across lags on ramp-shaped
    traces; it is shown as a variant and gives the same outcomes.'
