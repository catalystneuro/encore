    wording also allows; no outcome rests on (a+) alone. Reading (b) on each cell's average trace closely follows the authors' per-cell facilitation in Source data 1 ('Mean Facil Hz', Pearson r = 0.998, median difference -0.16 Hz; reading (b) classes 88 cells as facilitating where those values give 84), and on single trials over 0-212 ms the
