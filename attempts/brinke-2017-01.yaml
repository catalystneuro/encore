inputs:
- what: The paper's Source data 1 (elife-28132-data1-v2.mat, MD5 3ca8f91c5371e88c12f5eb32b3b209c6), streamed from
    https://cdn.elifesciences.org/articles/28132/elife-28132-data1-v2.mat. Only its recording depth (Depth) is used,
    by firing-rate-depth, fig4s1-cs-peak-suppression-not-different, fig5ej-cs-pause-cells-shallower and
    fig6g-us-response-depth; its trial counts, CR @ US ms, Baseline Hz and Cell are read by source-data-1-link to
    check the match.
  source: doi:10.7554/eLife.28132
outcomes:
- claim: source-data-1-link
  outcome: reproduced
  notebook: reproduce_brinke_2017.ipynb
  output: claim:source-data-1-link
  notes: Added after the reader's answer (questions/brinke-2017.yaml), which made four claims take recording depth
    from Source data 1. Matched by order, all 372 cells agree on the number of trials, the per-trial eyelid closure
    at US onset ('CR @ US ms' equals crAmplitude) and the per-trial baseline rate ('Baseline Hz' equals the spike
    count over 500 ms, or 200 ms in the second dataset), and Source data 1's 'Cell' is each cell's position; shifted
    by one cell, 9 of 371 agree on the trial count and none on the other two. Source data 1 gives one depth per cell
    for the 270 first-dataset cells (1500 to 3000 um) and none for the 102 second-dataset cells.
- claim: firing-rate-depth
  outcome: reproduced
  notebook: reproduce_brinke_2017.ipynb
  output: claim:firing-rate-depth
  measured: 68.3
  notes: The reader's answer (questions/brinke-2017.yaml) made the claim data with_inputs, with recording depth from the paper's Source data 1; the earlier run blocked it as data_missing. Under reading (a), the 500 ms baseline, the 270 first-dataset cells fire at 68.3 +/- 26.4 Hz
    (within 67 +/- 6.7) and the rate does not correlate with depth (Pearson r = 0.086, p = 0.16; the paper's r =
    0.085, p = 0.16). Under reading (b), the whole trial, the mean is 70.6 +/- 27.4 Hz and the correlation is
    significant (r = 0.146, p = 0.0167), so the claim holds under reading (a) only. Within the 11 mice with at least
    10 cells no reading (a) correlation is significant (p >= 0.14). The data set's per-trial baseline rates equal
    Source data 1's 'Baseline Hz' in every cell (source-data-1-link), so the rate side matches the paper's own values.
- claim: fig1ijk-modulation-classes
  outcome: partially_reproduced
  notebook: reproduce_brinke_2017.ipynb
  output: claim:fig1ijk-modulation-classes
  measured:
  - 80
  - 23
  - 167
  notes: No reading puts all three counts within tolerance. Reading (a) gives 80 facilitation, 23 suppression and
    167 unmodulated cells (suppression within tolerance); reading (a+) gives 62, 13 and 195 (facilitation and unmodulated
    within tolerance); reading (b) gives 88 (89 with facilitation first), 31 (30) and 151. Measured values are reading
    (a), larger-change tie rule.
  deviations:
  - Cell classes are run under the claims file's baseline-correction readings (a) and (b) and a third, (a+), in
    which the 'mean above-baseline activity within the baseline itself' (Materials and methods, Spike modulation
    in the last 200 ms of the CS-US interval) is averaged over the above-baseline bins only, which the wording also
    allows. The data set's own per-trial facilitation follows reading (b).
- claim: modulation-absolute-not-rate-dependent
  outcome: partially_reproduced
  notebook: reproduce_brinke_2017.ipynb
  output: claim:modulation-absolute-not-rate-dependent
  notes: Absolute facilitation does not depend on firing frequency (Spearman r = -0.036 to -0.029, p = 0.55 to 0.63)
    and relative suppression does (reading a, r = -0.207 signed negative, p = 0.00063, the paper's -0.211). Absolute
    suppression shows no relation under any reading (|r| <= 0.008, p >= 0.89; paper r = -0.131, p = 0.03), and relative
    facilitation is significant only under reading (b) (r = -0.123, p = 0.044; paper r = -0.378). No reading has
    all three significant tests.
  deviations:
  - Cell classes are run under the claims file's baseline-correction readings (a) and (b) and a third, (a+), in
    which the 'mean above-baseline activity within the baseline itself' (Materials and methods, Spike modulation
    in the last 200 ms of the CS-US interval) is averaged over the above-baseline bins only, which the wording also
    allows. The data set's own per-trial facilitation follows reading (b).
- claim: fig1l-cells-with-behavior
  outcome: reproduced
  notebook: reproduce_brinke_2017.ipynb
  output: claim:fig1l-cells-with-behavior
  measured: 111
  notes: 111 of 270 recordings (41.1%) have CRs in at least 20% of trials. The two eyelid-baseline readings are
    the same samples in the first dataset. The count is 129 at 15% and 94 at 25%, and 132 to 101 for CR thresholds
    of 4% to 6% closure.
  deviations:
  - The Methods' trial exclusions (Grubbs test on baseline SDs, eye at least half open; Materials and methods, Eyeblink
    conditioning) are not applied; the deposited trials are taken as the valid trials, since the data set's per-trial
    variables cover all of them and the smallest recording has 10 trials, the paper's minimum of valid trials. 282
    deposited trials have a baseline eyelid at or past half closure.
- claim: fig1m-modulation-grows-with-training
  outcome: reproduced
  notebook: reproduce_brinke_2017.ipynb
  output: claim:fig1m-modulation-grows-with-training
  measured:
  - 0.244
  - 0.228
  notes: With the day codes as given and class reading (a), facilitation magnitude rises with training day (Spearman
    r = 0.244, p = 0.029, n = 80) and suppression has a positive r (0.228, p = 0.30, n = 23), which is what the
    criterion asks. Both r values are below the paper's 0.413 and 0.354 and outside their tolerance; readings (a+)
    and (b) give facilitation r = 0.369 and 0.272 (both p < 0.05). With days 7 to 10 left out, no facilitation correlation
    is significant (p = 0.11 to 0.33).
  deviations:
  - Cell classes are run under the claims file's baseline-correction readings (a) and (b) and a third, (a+), in
    which the 'mean above-baseline activity within the baseline itself' (Materials and methods, Spike modulation
    in the last 200 ms of the CS-US interval) is averaged over the above-baseline bins only, which the wording also
    allows. The data set's own per-trial facilitation follows reading (b).
- claim: fig1no-modulation-more-with-behavior
  outcome: reproduced
  notebook: reproduce_brinke_2017.ipynb
  output: claim:fig1no-modulation-more-with-behavior
  measured:
  - 42
  - 38
  - 16
  - 7
  notes: Under reading (a), facilitation 42/111 with behavior against 38/159 without (chi-square p = 0.014, Yates
    0.020) and suppression 16/111 against 7/159 (p = 0.0037, Yates 0.0074). The suppression counts equal the paper's
    16 and 7; the facilitation counts are outside the tolerance of 30 and 30. Readings (a+) and (b) give the same
    direction; (b) loses significance for facilitation with Yates' correction (p = 0.053).
  deviations:
  - Cell classes are run under the claims file's baseline-correction readings (a) and (b) and a third, (a+), in
    which the 'mean above-baseline activity within the baseline itself' (Materials and methods, Spike modulation
    in the last 200 ms of the CS-US interval) is averaged over the above-baseline bins only, which the wording also
    allows. The data set's own per-trial facilitation follows reading (b).
  - With behavior is 111 recordings here, against the paper's 103.
