findings:
- kind: metadata_insufficient
  statement: The files hold the movie frame times but no scene cuts or cut types; the 93 cuts (80 continuity
    cuts, 13 scene changes) used by the event analyses come from the annotation file of the paper code
    repository (also on Figshare), linked by frame number.
- kind: metadata_error
  statement: Every LFP_micro and LFP_macro ElectricalSeries stores a starting time near 0 s on the trials
    clock, but its samples begin 10 s before the movie (the Usage Notes; the paper code subtracts 10 s).
    On the stored clock 18 of 2192 micro and 20 of 2240 macro channels respond to recognition images;
    with the 10-s correction 650 and 683 do.
- kind: metadata_error
  statement: The units column isibelow is described as the proportion of inter-spike intervals below 3
    ms, but its values are percentages (median 0.24, up to 10.35), as the paper reports them.
- kind: other
  statement: 448 of the 1450 units of the paper (455 of the 1457 in the files) have no isolation distance
    (NaN), and one has 3.4e27; the paper code removes both before the median.
- kind: other
  statement: The electrodes column pairwise_distances holds 1242 distances in all, where the units on
    each wire imply 1266 pairs; 24 pairs have no entry.
- kind: selection_undocumented
  statement: The files hold 1457 units; the paper 1450 are those with at least one spike during the movie,
    a rule found only in the code. The 7 others are in P47CS, P48CS, P51CS, P54CS and P55CS.
- kind: code_mismatch
  statement: The text excludes runs by a behavioral AUC criterion and by fewer than 10 correct trials
    per condition; the code applies only the trial count. Here both remove the same five runs (P44CS run
    1 is removed with AUC 0.726, for having no correct novel trial).
- kind: paper_inconsistency
  statement: The paper gives 449 vmPFC macro channels for the event analysis; the data give 448, the count
    of every other area.
- kind: other
  statement: P53CS run 2 has 34 recognition trials (17 novel, 17 familiar), where the Methods describe
    40.
- kind: other
  statement: The dandiset holds the EMU data only. The fMRI data are on OpenNeuro ds004798 as raw BIDS,
    without the fMRIPrep derivatives the paper fMRI checks use, and the demographics of the four fMRI-only
    participants are only in the paper Table 1 and its code.
