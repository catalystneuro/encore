    lower at the end of the delay than at its start in every reading (0.59 against 0.23 spikes/s for
    all neurons and control trials). The criterion is met in ALM and not in VM/VAL.
  deviations:
  - Preference from total spike counts over the three epochs (convention S) in a random half of the
    trials; windows of 200 ms stepped by 100 ms; only trials with a 1.3 s delay; correct control
    trials and all correct trials both shown (question asked).
- claim: alm-gabaergic-no-thalamic-projection
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds no histology.
findings:
- kind: data_missing
  statement: The dandiset holds 966 of the paper's 1214 ALM units (47 of 57 sessions), 789 of 790
    thalamic units (72 of 73 sessions) and 181 of 227 SNr units (18 of 23 sessions; apparently only
    the putative GABAergic units). Behaviour-only sessions, the muscimol experiments, the weak (0.5 mW)
    thalamus photoinhibition of Fig. 5, non-behaving whole-cell recordings with current injection,
    M1 whole-cell recordings, Olig3-cre recordings and the histology are not deposited.
- kind: data_missing
  statement: Spikes are stored only from each trial's start to about 5 s after pole onset, although
    trials last about 9 s, and not between trials; spike rates over whole trials or sessions cannot
    be computed.
- kind: metadata_insufficient
  statement: Most units hold spikes over only part of their session (median 70% of its trials; 1358
    of 1936 units below 90%), and the Units table gives no observation interval, so the trials in
    which a unit was recorded must be inferred from its first and last spikes.
- kind: format_error
  statement: The mean waveforms are cut short (29 to 38 samples at 25 kHz, trough at sample 15 to 19),
    so trough-to-peak widths above about 0.5 ms cannot be measured; in 78% of ALM units labelled
    'Wide width spiking' the peak is the last sample.
- kind: selection_undocumented
  statement: The Units `cell_type` labels ('Wide width spiking', 'Narrow width spiking', 'Cannot be
    determined') have no stated rule; they cannot be derived from the deposited waveforms but give
    class sizes close to the paper's.
- kind: metadata_insufficient
  statement: The whole-cell trial tables leave every photostimulus column empty and the files hold no
    laser time; `stim_present` marks the photostimulus trials without description. Thalamus
    photoinhibition hyperpolarizes ALM neurons from about 1.49 s after pole onset, 0.19 s after the
    delay onset the trial times imply (1.3 s), so the photostimulus onset cannot be placed.
- kind: metadata_error
  statement: In the whole-cell file of cell_21_1 (anm300476) the trial start and stop times are
    shifted by one row against the pole and cue times (85 rows), and the table is not in time order.
- kind: metadata_error
  statement: The whole-cell Vm series state unit 'mV' with conversion 0.001, but the values are already
    in mV; applying the conversion gives values a thousand times too small.
- kind: metadata_error
  statement: Every electrode group, in thalamus and SNr as well as ALM, carries the ALM coordinates
    (AP 2.5, ML -1.5, DV 0); the SNr units of anm00261336 are placed at AP -1.56 mm, outside SNr;
    photostimulus sites give ML negative for the left hemisphere while units give it positive.
- kind: metadata_insufficient
  statement: Thalamic units have no nucleus label (brain_subregion 'N/A'), so VM/VAL units can be
    selected only by distance from a centre the paper does not give in coordinates.
- kind: metadata_error
  statement: The 9 Gad2 thalamic sessions give the genotype 'Ai35D x GAD2_Cre' (an Arch line), where
    the paper used Gad2-IRES-Cre with ChR2 injected in TRN, and mark no photostimulus trial, though
    their 84 units match the optrode units of Extended Data Fig. 2c.
- kind: metadata_error
  statement: The VGAT-ChR2-EYFP thalamic sessions give the photostimulus power as 2.23 mW where the
    paper gives 10 mW (Extended Data Fig. 2d); the thalamic fibre site is one nominal coordinate in
    every session.
- kind: metadata_insufficient
  statement: Photostimulation at galvo position (0.5, 0.5) mm in mouse anm00264943, interleaved with
    ALM photoinhibition, is not named; trials labelled 'delay' with power 0 are not explained; the
    trial columns photo_stim_period, photo_stim_type and is_good have no description.
- kind: other
  statement: The dandiset holds data the paper does not describe, 21 ALM sessions of PV-Cre x Ai32
    mice with thalamic photostimulation at 10, 22.5 and 45 mW and 12 thalamic sessions of C57BL6 mice
    without photostimulation.
