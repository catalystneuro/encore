- claim: alm-unit-classes
  outcome: partially_reproduced
  notebook: reproduce_guo_2017.ipynb
  output: claim:alm-unit-classes
  proposed:
    outcome: not_reproduced
    reason: The criterion says only 'Reproduced when the three counts are within tolerance under one
      reading' and has no partial clause. Under P1 and P2 no count is within tolerance (0 of 2
      readings; Proposed changes of outcome in the notebook). The
      matching class fractions under P2 are not an outcome the criterion defines.
  measured:
  - 966
  - 577
  - 127
  notes: The dandiset holds 966 ALM units in 47 sessions (paper 1214 in 57). By computed width (P1)
    577 units exceed 0.6 ms and 127 are below 0.4 ms; by file label (P2) 810 are 'Wide width
    spiking' and 121 'Narrow width spiking'. The fractions under P2, 0.839 and 0.125, are close to
    the paper's 0.829 and 0.137; no count is within tolerance under either reading. 514 of the 577
    units above 0.6 ms have their waveform peak at the last sample, so their widths are lower
    bounds. The width histogram has two modes (0.28 ms and 0.68 to 0.72 ms) with a trough at 0.36 ms
    (4 units). The answer of 2026-10-20 makes P1 the Methods' rule and keeps P2 as a reading; no count
    is within tolerance under either, so the outcome is unchanged, the fractions under P2 matching.
  deviations:
  - The deposited mean waveforms are too short to measure the widths the Methods use; both the
    computed widths (P1) and the files' labels (P2) are shown, as convention C says.
