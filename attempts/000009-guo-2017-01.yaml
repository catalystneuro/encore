- claim: vgat-thalamus-reduction
  outcome: reproduced
  notebook: reproduce_guo_2017.ipynb
  output: claim:vgat-thalamus-reduction
  measured: 18.4
  notes: Over the whole photostimulus (reading W1), putative thalamic units 0.5 to 1.1 mm from the
    fibre site fall to 17.0 to 20.3% of control (Q1) or 16.5 to 19.3% (Q3), within 15.9 +/- 9.3%;
    Q2 gives 37.5 to 51.2%. In the 20 to 120 ms window (W2) they fall to 1.2 to 1.5% (Q1). 63 to 79
    units qualify (paper 114), grouped 23 to 24, 21 to 24 and 31 to 42 near 0.6, 0.8 and 1.0 mm
    (paper 34, 42, 38). Every trial of the VGAT thalamic sessions has a 1.3 s delay, so W1 ends with
    the delay epoch and holds no time after the photostimulus (W1 on 1.3 s delays only gives the same
    values). In 100 ms bins the ratio is 21.6% in the bin from 1.4 s after pole onset, falls to 9 to
    11% by the end of the delay and returns to 100% in the response epoch.
  deviations:
  - Distance is measured from the files' photostimulus site (AP -1.5, ML 0.9, DV -4.1 mm), the same
    nominal coordinate in every session, not from the fibre tip as placed in each mouse.
  - The files give the photostimulus power as 2.23 mW; the paper gives 10 mW.
  - Unit classes under readings P1 (computed width) and P2 (file label) of convention C.
