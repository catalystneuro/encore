- claim: alm-unit-classes
  outcome: partially_reproduced
  notebook: reproduce_guo_2017.ipynb
  output: claim:alm-unit-classes
  measured:
  - 966
  - 577
  - 127
  notes: The dandiset holds 966 ALM units in 47 sessions (paper 1214 in 57). By computed width (P1)
    577 units exceed 0.6 ms and 127 are below 0.4 ms; by file label (P2) 810 are 'Wide width
    spiking' and 121 'Narrow width spiking'. The fractions under P2, 0.839 and 0.125, are close to
