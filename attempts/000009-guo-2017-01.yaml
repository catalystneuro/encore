- claim: task-performance
  outcome: not_reproduced
  notebook: reproduce_guo_2017.ipynb
  output: claim:task-performance
  measured:
  - 70.66
  - 18.18
  - 0.78
  notes: Over all 173 behavioural recordings percent correct is 70.66% (reading a, pooled) to 75.46%
    (reading c, mean over sessions), within 77.6 +/- 7.76%. Lick-early trials are 14.66 to 18.18%
    against 10.3 +/- 1.03%, and no-response trials 0.73 to 0.98% against 1.1 +/- 0.11%. No reading
    puts all three within tolerance. The 36 whole-cell recordings alone give 77.42 to 83.47% correct,
    7.93 to 9.65% lick early and 0.96 to 1.55% no response, at most two values within tolerance. Per
    mouse, lick-early rates range from 3.6 to 37.2%. Partially reproduced before the first
    verification; changed to not reproduced because the criterion asks all three values under one
    reading and two of the three are out under every reading of the full set of recordings.
  deviations:
  - The dandiset holds recording sessions only; the paper's averages may come from behaviour
    sessions that are not deposited.
  - Rows with no outcome and no pole times (5369 extracellular rows, type 'non-performing') are not
    counted as trials.
- claim: fig1c-alm-photoinhibition-bias
  outcome: reproduced
  notebook: reproduce_guo_2017.ipynb
  output: claim:fig1c-alm-photoinhibition-bias
  notes: In 66 recording sessions of 11 PV-Cre x Ai32 mice, ALM photoinhibition at 1.5 mW in the
    delay epoch lowers contra performance from 0.774 to 0.368 (paired t = -16.67, p = 3.6e-25; no
    session increases) and raises ipsi performance from 0.673 to 0.744 (t = 3.99, p = 0.00017; 46 of
    66 sessions increase). With all photoinhibition powers pooled, p = 4.7e-25 and 0.00054. Contra
    performance falls in every mouse. The answer of 2026-10-20 (convention P) puts the 0.75 and 0.79
    mW trials outside the condition, as the main test already did; the outcome is unchanged.
  deviations:
  - Tested on the behavioural trials of the 66 recording sessions (ALM, thalamic and SNr
    recordings), not on the paper's 84 behaviour sessions, which are not in the dandiset.
  - Photoinhibition trials at 1.5 mW (the Methods' power, convention P); trials at 0.75 or 0.79 mW are
    pooled in a variant only.
