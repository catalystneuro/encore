- claim: fig4d-sodium-current
  outcome: reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig4d-sodium-current
  assumed: true
  notes: '35 files of DANDI:001750 (0.260825.0222, 100 kHz, step at 20 ms), types from the code''s metadata_outSideOutSodiumCurrentRec.csv
    matched by file name (14 VEN, 21 PC). Largest inward current of the step-averaged traces, low-passed at 1 kHz,
    baseline over the 2 ms before the step, steps up to 0 mV, 0.2 to 3 ms after the step: VEN median -17.3 against
    PC -31.5 pA, rank-sum p = 0.0010; it agrees with the code''s max_Na_current (r = 0.99, median difference 1.28
    pA), whose own p is 0.0010 (VEN -14.9, PC -29.3 pA); with steps up to +85 mV, r is 0.77 to 0.94. VENs are lower under all 40 readings run. Low-passed at
    500 Hz to 2 kHz, p is 0.0006 to 0.0040 under every window (to 3, 5 or 10 ms) and step range (to 0 or +85 mV).
    Unfiltered, p is 0.0067 to 0.0956 depending on the window, r with the code 0.40 to 0.90, and 6 of 35 peaks fall
    later than 3 ms (up to 9.99 ms), where the low-passed peaks fall at 0.59 to 1.42 ms. Question for the paper''s
    authors in findings.'
  deviations:
  - Assumed. The Methods give the steps (-80 to 0 mV, 25 ms, leak subtracted online, 100 kHz) but neither a filter
    nor the window in which the peak is taken; unfiltered, the outcome changes between windows ending at 3 ms and
    at 5 or 10 ms. A 1 kHz low-pass (2nd-order Butterworth, forward and backward, the form of PatchAnaLab's filters;
    the paper's code applies filter_1000Lowpass to first-AP traces in extFig9ad_plotVENsubtypeAP_Cmp.m, line 35,
    and Fig4d_plotNaCurrent.m calls no filter, both printed in the notebook) is adopted because the peaks
    it gives reproduce the code's per-patch max_Na_current (r = 0.99); with it the window does not change the result.
  - Steps up to 0 mV and the baseline over the 2 ms before the step follow Fig4d_plotNaCurrent.m (nTraces = 17,
    test pulses from -80 to 0 mV; base over the first 2 ms of a snippet starting 2 ms before the step).
