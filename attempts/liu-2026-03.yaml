findings:
- kind: metadata_insufficient
  statement: The files carry no cell type, no connection label and no soma position for any cell, and the stimulated
    cell of a file is not named correctly (below), so none of the Fig. 5 counts can be made from the dandiset alone.
    Types and connections exist only in the paper's code table metadata_multiPatch.xlsx, which links to the files
    by name.
- kind: metadata_error
  statement: Every response series states a rate of 1 Hz; the data are sampled at 25 kHz (the stimulus series' rate,
    the code's 25 kHz, and the 50-sample pulse that is the Methods' 2 ms pulse). The stimulus series gives its rate
    of 25,000 with the unit millisecond.
- kind: metadata_error
  statement: The stimulus amplitude is stored as 2 (2.5 or 3 in 14 files) with the unit amperes; the Methods inject
    2 nA.
- kind: metadata_error
  statement: The stimulus series of every file names electrode Elec_8 as the stimulated one, while the cell that
    fires on the pulse is on channel 8 in only 35 of 301 files; in 286 of the 288 files the code's table names, the firing channel
    is the table's presynaptic channel.
- kind: metadata_error
  statement: All 301 files have the session start time 2018-01-01T01:00+08:00, while the slices are named for dates
    in 2019 and 2024, and every subject has the same age, P4Y/P6Y, and sex M.
- kind: code_mismatch
  statement: The code's table metadata_multiPatch.xlsx disagrees with the paper's counts. It lists 298 cells, 1,416
    ordered pairs (1,403 in files of the dandiset) and 26 connections, where the paper reports 377 neurons, 1,292
    pairs and 31 connections; PC-to-PC 18 of 743 against 24 of 503, one VEN-to-PC connection (190315s2, channel
    4 to 6, Excellent, with a 1 mV response in the data) where the paper reports none, and pair counts per class
    that differ from the paper's by more than 10% in 6 of 8 classes (all but VEN-to-IN and IN-to-VEN).
- kind: code_mismatch
  statement: The code's table is inconsistent with itself and with the files. Ten of its presynaptic blocks name
    no NWB file (8 match a file of the dandiset by the firing channel; 190315s2 channel 7 and 20241014HS2 channel
    8, 13 rows, match none), it gives 5 cells two types, labels 2 connections with a projection that names another
    postsynaptic channel (20240912HS5 4 to 1 labelled 4 to 3, 20241105HS16 6 to 3 labelled 8 to 5), and its Nr_Conn
    disagrees with its annotations in 4 of 53 slices. Six of its pairs name channels that read 0 mV in their file
    (slice 190314s1, channels 6 and 7). Eight of its Inh connections come from a PC, and 6 of its 12 Inh connections
    have a positive averaged response.
- kind: other
  statement: 5 files of the dandiset, all of slice 20240912HS2 (23 to 28 sweeps), are not in the code's table, so
    it is not known whether the paper counted them.
- kind: other
  statement: The Methods average responses over more than 20 sweeps; 119 of 301 files hold more than 20 sweeps (median
    20, range 1 to 30).
- kind: methods_unavailable
  statement: Question for the paper's authors. The paper and its code give no rule for calling a connection (amplitude,
    latency, noise or test), so the counts rest on the annotations of metadata_multiPatch.xlsx. Was the connection
    call made by eye on averaged traces, and with which criteria for Excellent, Good and OK quality? Do the 31 connections
    of the paper include the table's OK connections, and which of the table's pairs and cells make up the 1,292
    pairs and 377 neurons?
- kind: code_mismatch
  statement: sumData_StimWM.xlsx holds 23 VEN-PC pairs for Fig. 4j where the paper states 26, and AIScmp_PCvsVEN_Fig5c.xlsx
    holds 120 VENs and 500 PCs for Fig. 3c where the paper states 108 and 430; the AIS table has no slice or animal
    per cell, needed for the two-way ANOVA of the legend.
- kind: methods_unavailable
  statement: 'Question for the paper''s authors. For the somatic Na+ currents of Fig. 4d, how was max_Na_current
    measured: which filter, and in which window after the step? Unfiltered peaks separate VENs from PCs when taken
    up to 3 ms after the step (p = 0.0074) and not up to 5 or 10 ms (p = 0.077 and 0.067); after a 1 kHz low-pass
    the peaks match the code''s values (r = 0.99) and p = 0.0010 in every window. The attempt adopted the 1 kHz
    low-pass.'
- kind: code_mismatch
  statement: The code's processed tables for claims on other data differ in size from the paper. The Patch-seq mapping
    results hold 14 VEN-L and 15 VEN-S where the paper reports 10 and 11 mapped to L5 ET and L5/6 CT, and map the
    273 excitatory neurons to 17 clusters where the paper states 18; the inhibitory Patch-seq mapping is not saved.
    PeakIdx_Fig5e.xlsx holds more cells per type than the Fig. 3e legend (VEN 32 against 22).
- kind: other
  statement: The paper quantifies 581 metabolites (Fig. 8a), while the MetaboLights deposit MTBLS13927 (revision
    MTBLS13927_01) holds 558 identified metabolites, the same as the code's Metabolic_data.xlsx; with them the AIC-V1
    differential count is 175 to 195 under four readings, against the paper's 228.
- kind: other
  statement: 'The MetaboLights deposit MTBLS13927 and the code''s Metabolic_data.xlsx disagree on which of two V1
    samples is which: the intensities of V1-4-Q in the deposit are those of V1_4_S in the code''s table, and the
    reverse. The deposit names the first AIC sample A1C-1-Q and stores the run mode (rppos, rpneg, hilicneg) in
    its charge column.'
