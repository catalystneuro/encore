outcomes:
- claim: flight-spatial-code
  outcome: not_reproduced
  notebook: reproduce_knierim_2000.ipynb
  output: claim:flight-spatial-code
  notes: The third verification round agreed with the change from partially_reproduced to
    not_reproduced. On flight day 9, 12 of 25 Rat1 units (0.48) have spatial information above the 95th
    percentile of 500 circular-shift shuffles on the Escher staircase (binomial p = 6.9e-10 against
    0.05), and 3 of 28 Rat2 units (0.107, p = 0.16). By the criterion Rat1 is above chance but below
    0.5 and Rat2 is not above chance, so neither the reproduced nor the partially reproduced rule is
    met. With spikes at the lost position given a neighbouring position, as in the first version,
    Rat1 had 13 of 25 (0.52), which gave partially_reproduced. Rat1 FD9 is close to the bound. 6 units have p between 0.01 and 0.1, repeats with 2000
    shuffles and five other seeds give 11 or 12 of 25 (0.44 to 0.48), and the run of 200 shuffles in
    the data check, with the same lookup, gives 13 of 25 (0.52); across these seven runs the count
    is 11 to 13 of 25, on both sides of 0.5, so the outcome for Rat1 is not robust. The outcome follows the
    pre-specified run of 500 shuffles, with which the five repeats of 2000 shuffles agree. Rat2 FD9 gives 2 or 3 of 28 in
    every repeat. Shifted spikes are dropped for lack of a position more often in Rat2's ES epochs
    (median 0.307 on FD9) than in Rat1's (0.074), but a count-matched variant gives the same counts
    for Rat2. Rat2's units are not selective with the shared position trace in any window, and
    Rat1's units are selective in Rat2's FD4 ES epoch (6 of 15), so the trace in Rat2's epochs may
    not be Rat2's position; the files do not name the animal tracked. On flight day 4, 10 of 20 Rat1
    units, 0 of 16 Rat2 units, and 10 of 16 and 1 of 19 Rat3 units in its two ES epochs are
    significant. In MC epochs 0 to 2 units per session are significant. The "three orthogonal
    surfaces" part of the abstract is tested apart, and blocked.
  deviations:
  - The paper's Methods were not available; the selection (50 spikes at a known position), the
    32 x 32 binning, the shuffle and the thresholds are common choices fixed in the claims file.
  - Occupancy is the original analysis's occupancy map for the epoch, and shuffled spikes take the
    nearest position sample within 0.25 s, as the dandiset gives position only at spike times. A
    spike whose nearest sample is the lost position is dropped.
  - Robust is read as at least half of the units significant in each flight day 9 session.
  - Rat2's flight day 9 session is judged although whose position the trace holds in it could not
    be established.
- claim: three-orthogonal-surfaces
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The dandiset holds one two-dimensional pixel position per time from one camera. Nothing in
    the files or the dandiset metadata describes the camera's view or the track layout, and the
    conversion code describes the ES track only as a three-dimensional track with 90 degree yaw and
    pitch turns and the position as video tracker pixel coordinates (its lines are printed in the
    notebook), so pixels cannot be assigned to the three surfaces. The NASA record of the study
    (OSD-968) says position was recorded with two synchronised cameras (printed in the notebook); a
    second view is not in the dandiset.
- claim: fig3-stability-across-sessions
  outcome: reproduced
  notebook: reproduce_knierim_2000.ipynb
  output: claim:fig3-stability-across-sessions
  notes: In Rat3's two flight day 4 ES epochs, the 15 units with 50 or more spikes in each have a
    median rate-map correlation of 0.537 (range -0.107 to 0.849), above the 95th percentile of 1000
    re-paired medians (0.102, p = 0.001) and above 0.5; 8 of 15 exceed 0.5. With smoothing of 0.5
    to 2 bins and 50 or 100 spikes the median is 0.315 to 0.707, always above its null (p = 0.001);
    at 0.5 bins it is below 0.5. Mean rates are related across the epochs (Spearman rho 0.598,
    re-paired 95th percentile 0.339), consistent with the same neurons but not showing it. The
    dandiset's rate maps paired by their ~N names give a median of 0.157, as the names do not
    identify cells. In the second epoch 1 of 19 units is significant against 10 of 16 in the first,
    with similar occupancy and shuffle drops and more spikes per tested unit in the second (median
    455 against 301); this is not explained. The original spike files in OSD-968 hold waveform
    amplitudes for each spike, according to the conversion notes, and could test the identity
    assumption; they were not used.
  deviations:
  - Only the title of Figure 3 was available; which sessions it compares is unknown. The test uses
    the only pair of same-track sessions with position on one day.
  - Assumes that a tetrode and cluster id names the same neuron in both epochs; the dandiset does
    not say so and holds no waveforms to check it.
findings:
- kind: metadata_error
  statement: The Rat1 and Rat2 files of each flight day hold the same position trace (98.6 to 98.8%
    of samples at common timestamps within 2 pixels), presented as each rat's position. Rat1's
    units are spatially selective with it, Rat2's are not in any window, and Rat1's units are also
    selective in Rat2's flight day 4 ES epoch. Each file samples the trace at its own units' spike
    times, and the files do not name the animal the tracker followed. Whose position the trace is during Rat2's task epochs
    is not stated and could not be established.
- kind: data_missing
  statement: Position is given only at spike times (taken from the spike files), so occupancy
    cannot be computed from the files' position, and the preflight files have no position at all.
- kind: metadata_error
  statement: The dandiset description says the preflight recordings were made on a flat rectangular
    track, but the preflight files label their epochs ES (Escher staircase) and MC (Magic Carpet)
    and hold ES and MC rate maps, as the flight files do. Which apparatus the preflight epochs were
    recorded on is not stated in the files.
- kind: identifier_missing
  statement: The rate-map `source_file` names are Windows 8.3 short names (ESCELL~1 to ~4, then
    hashed names such as ES2BC0~1), so `cell_number`, read from the ~N suffix, is not a cell number.
    It equals the cluster id of the best-matching unit in 84 of 211 unit-epochs, and the rate maps
    cannot be linked to units as the table's description says. The long names are in the NASA
    archive (OSD-968), whose description names files like BL2.cell5.
- kind: metadata_insufficient
  statement: The rate maps are smoothed (in the median well-matched map, 91% of the bins with a
    positive rate hold no spike of the unit), and the kernel is not stated.
- kind: metadata_insufficient
  statement: Rate maps use -999 for unvisited bins, which the column description (rate in Hz) does
    not state. The tracker's lost position (0, 255), 5 to 12% of position samples, is counted in the
    original occupancy maps (bin [63, 0], up to 19% of an occupancy map in flight).
- kind: other
  statement: Eight rate maps are identical copies of another map in the same file, some stored under
    a different tetrode (for example Rat1 FD4 TT1 and TT11 ESCELL~1, and four maps of Rat2 FD4 under
    TT13, TT19 and TT22).
- kind: metadata_insufficient
  statement: Units merge per-epoch spike files that share a tetrode and cluster id; nothing states
    that a cluster id names the same neuron in different epochs. The unit table lacks the
    `session_type` and `source_file` columns the conversion's README lists, so a unit's spikes
    cannot be traced to their spike file.
- kind: data_missing
  statement: The dandiset's description reports normal theta and sharp waves and ripples in the
    hippocampal EEG, but no EEG is in the dandiset.
- kind: other
  statement: Spike times are given to 10 ms in five files and to 1 ms or finer in three; 2 to 15% of
    within-unit intervals are zero, in every epoch type and not mainly in overlapping epochs; their
    cause is not resolved. In the Rat1 flight day 4 file two baseline epochs overlap
    (2525 to 3390 s and 2720 to 3390 s).
- kind: metadata_insufficient
  statement: The age is "/" for every subject, and the position's pixel scale and camera view are
    not described.
