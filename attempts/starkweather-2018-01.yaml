outcomes:
- claim: fig2-kord-suppresses-mpfc
  outcome: blocked
  blocked_by: data_missing
  notes: >-
    The mPFC units of the two mPFC-implanted mice are not in vta-1, whose 172 files are all
    light-identified VTA dopamine neurons of the four KORD groups (data description, and the file list
    in the notebook). Looked in the vta-1 bucket listing (live/data.zip and docs only) and the paper's
    Data Availability, which names only vta-1; found no other public deposit.
