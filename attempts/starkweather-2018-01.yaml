  deviations:
  - The model is the Python port; see fig7cd-model-intact.
findings:
- kind: data_missing
  statement: >-
    The licks, recorded with an infrared beam (Methods), are not in vta-1; the three claims on behavior
    (Figure 3G, Figure S3) cannot be tested.
- kind: data_missing
  statement: >-
    Free water deliveries, and so the free water responses that normalize the responses of Figures S5B
    and S5C and enter two ANOVAs, are not in vta-1; every reward onset in the files belongs to an odor
    A to C trial.
- kind: data_missing
  statement: >-
    The mPFC recordings (Figure 2, Figures S1 and S6A to S6E), the unidentified VTA neurons clustered in
    Figure S4, and the 26 neurons of the no-KORD SalB controls (Figure S6F to S6H) are not in vta-1,
    which holds only the 172 identified dopamine neurons of the four KORD groups. data.zip has 173
    members, the 172 neuron files and the directory entry data/.
- kind: identifier_missing
  statement: >-
    No file names its mouse or recording session. Sessions can be recovered as files with identical
    odor onset arrays (77 sessions), but mice cannot, so the per-mouse analysis of the Figure 5 inset
    cannot be repeated and results cannot be broken down by animal.
- kind: other
  statement: >-
    Three pairs of task 1 SalB files share most of their spikes within 0.5 ms (SalB_Task1_9 and
    SalB_Task1_10, 99.7% of the spikes of the first; SalB_Task1_17 and SalB_Task1_18, 90%;
    SalB_Task1_36 and SalB_Task1_39, 81%), against at most 1.5% at chance. Each pair is very likely one
    neuron sorted twice, so task 1 SalB holds 39 distinct neurons, not 42. The paper's statistics
    include all 42; counting each once changes no outcome.
- kind: metadata_insufficient
  statement: >-
    21 file trials (9 session trials in 8 sessions) are rewarded but have a missing (NaN) trial_type,
    at delays off the 0.2 s grid (1471 to 2421 ms). The data description does not mention them. They
    are 5, 1, 1 and 14 neuron trials in task 1 saline, task 1 SalB, task 2 saline and task 2 SalB; kept
    as odor A trials at the nearest grid ISI, they change no result.
- kind: metadata_insufficient
  statement: >-
    The files give no recording onset or injection time, so the paper's window of the 40 minutes
    following recording onset cannot be applied exactly. The trials of each session span 23.8 to 38.3
    min, consistent with files already cut to that window.
- kind: paper_inconsistency
  statement: >-
    The Figure 4A legend gives a pre-reward window of 0 to 200 ms and F(8, 328) = 15 with p = 3.5e-11
    for task 1 saline; the Methods give 0 to 400 ms, and the data give F = 9.00, p = 3.6e-11 with the
    400 ms window, as the Results print (F > 9.0). The legend's F does not fit its p.
- kind: paper_inconsistency
  statement: >-
    Figure 5F prints 9 significant negative slopes in task 2 under SalB, with Fisher p = 0.041; those
    counts give p = 0.037. The data give 8, and p = 0.0405.
- kind: methods_unavailable
  statement: >-
    Question for the paper's authors. For the slopes of single neurons (Figure 5), is the baseline (0 to
    1 s before odor onset) subtracted trial by trial, or as the neuron's mean? The two readings give
    slightly different slopes and p-values. Trial by trial reproduces every printed count and the Fisher
    p-values; the neuron's mean gives 3 significant negative task 2 saline slopes (paper 1) and a
    non-significant Fisher test (p = 0.24). This attempt assumes trial by trial.
verifications:
- date: '2026-11-11'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: >-
    The first executed notebook with the conclusion cells and the summary removed, the helper modules
    vta.py and belief_td.py and the claims file, with the paper's full text. The verifier read the
    archive's S3 listing, tested _count, auroc, isi_anova and slopes on synthetic inputs, and compared
    belief_td.py with the MATLAB code at d667730. It had no attempt record.
  results:
  - claim: fig2-kord-suppresses-mpfc
    agrees: true
    outcome: blocked
    reason: >-
      The archive holds only data.zip, docs, filelist.txt and checksums.md5 (S3 listing). The files are
      172 dopamine-neuron files with four variables. There are no mPFC units. It could not check whether
      data.zip holds members other than the neuron files, as the notebook never printed its member list.
    response: >-
      The data check now prints the zip's member list. data.zip has 173 members, the 172 neuron files
      and the directory entry data/, so no mPFC file is skipped. No change of outcome.
  - claim: figs1e-kord-abolishes-late-activity
    agrees: true
    outcome: blocked
    reason: Same reason, no mPFC units.
    response: No change; the zip's member list is now printed (see fig2-kord-suppresses-mpfc).
  - claim: figs6ce-kord-task1-animal
    agrees: true
    outcome: blocked
    reason: Same reason, no mPFC units.
    response: No change; the zip's member list is now printed (see fig2-kord-suppresses-mpfc).
  - claim: fig3g-anticipatory-licking
    agrees: true
    outcome: blocked
    reason: No lick variable in any file. The data description lists none.
    response: No change; the zip's member list, now printed, holds no lick file.
  - claim: figs3-task1-licks-more-sooner
    agrees: true
    outcome: blocked
    reason: No licks.
    response: No change; the zip's member list, now printed, holds no lick file.
  - claim: figs3-salb-spares-licking
    agrees: true
    outcome: blocked
    reason: No licks.
    response: No change; the zip's member list, now printed, holds no lick file.
  - claim: figs4-cell-types-unchanged
    agrees: true
    outcome: blocked
    reason: Only the 172 identified dopamine neurons are present, not the 761 VTA neurons.
    response: No change; the zip's member list, now printed, holds only those 172 files.
  - claim: figs5b-task2-salb-below-free-water
    agrees: true
    outcome: blocked
    reason: >-
