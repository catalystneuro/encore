- claim: fig5e-task1-significant-slopes-unchanged
  outcome: reproduced
  assumed: true
  notebook: reproduce_starkweather_2018.ipynb
  output: claim:fig5e-task1-significant-slopes-unchanged
  measured:
  - 16
  - 0
  - 16
  - 2
  notes: >-
    Trial-by-trial baseline, significant slopes saline 16 negative 0 positive, SalB 16 negative 2
    positive, Fisher two-sided p = 0.487 (paper 0.49). With the neuron's mean baseline or none, saline
    16 and 1, SalB 18 and 2, p = 1; the SalB negative count of 18 is outside the tolerance of 1.6, so the
    count part holds only under trial-by-trial subtraction, while the absence part holds under every
    reading. Counting each doubly deposited unit once, SalB 16 and 1, p = 1. Asked of the paper's
    authors (findings) whether baseline is subtracted trial by trial.
  deviations:
  - >-
    Assumed that baseline is subtracted trial by trial. The paper says only that "both pre- and
    post-reward responses were baseline-subtracted, with baseline taken 0-1 s prior to odor onset"
    (Methods, Data analysis), and the claims file names three readings. Trial by trial is adopted
    because it is the reading under which the paper's own slope counts are recovered exactly (29, 12
    and 24 in task 2; 16, 0, 16 and 2 here) and Fisher p matches the paper's to two digits.
