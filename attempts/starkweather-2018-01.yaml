- claim: fig4a-task1-saline-post-decrease
  outcome: reproduced
  notebook: reproduce_starkweather_2018.ipynb
  output: claim:fig4a-task1-saline-post-decrease
  measured: 42
  notes: >-
    42 task 1 saline neurons; ISI effect on post-reward responses F(8, 328) = 12.61, p = 8.4e-16
    (paper 12.6, 9.1e-16), neuron-averaged slope -2.21 spikes/s per s. With trials cut at 40 min after
    the session's first spike, F = 12.44, p = 1.4e-15. Per session, 16 of 20 slopes are negative.
  deviations:
  - >-
    The files hold no recording onset, so "the 40 minutes following recording onset" (Methods, Data
    analysis) is read two ways, every trial in the file and odor onsets within 40 min of the session's
    first spike; both give the same outcome.
- claim: fig4b-task2-saline-post-increase
  outcome: reproduced
  notebook: reproduce_starkweather_2018.ipynb
  output: claim:fig4b-task2-saline-post-increase
  measured: 41
  notes: >-
    41 task 2 saline neurons; F(8, 320) = 3.70, p = 0.00038 (paper 3.7, 3.8e-4), slope +1.30 spikes/s
    per s, the same under both 40-minute readings. Per session, 15 of 21 slopes are positive.
  deviations:
  - The 40-minute window is read two ways, as in fig4a-task1-saline-post-decrease; both agree.
- claim: fig4b-odorc-below-latest-odora
  outcome: reproduced
  notebook: reproduce_starkweather_2018.ipynb
