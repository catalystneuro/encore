- claim: mua-ppx-park-vs-ctrl
  outcome: partially_reproduced
  notebook: reproduce_zhuang_2025.ipynb
  output: claim:mua-ppx-park-vs-ctrl
  notes: Under reading (a), all PPX sessions pooled (16 animals, 41 sessions, 1032 channels), 82.2% of
    parkinsonian channels change against 77.0% of control channels (Freeman-Halton p = 0.0007), but
    the increase type makes up only 5.9% of parkinsonian channels (decrease 76.4%), under the 10% the
    criterion asks for both directions. Under readings (b) first session per animal and (c) day-1
    sessions, the changed share is not higher in parkinsonian mice (88.6% against 89.7%; 88.5% against
    96.0%). Per animal the shares do not differ (increase median 0.016 against 0.010, Mann-Whitney p
    = 0.561). Most channels decrease in both groups, and in the one saline session that covers the
    windows 11 of 16 channels also decrease, so a slow decline of multi-unit rate over these long
    sessions dominates. Multi-unit activity mixes dMSNs, iMSNs and interneurons, so opposite changes
    in the two pathways would partly cancel. In the units tables of E0 day 4 (parkinsonian) 6 of 41
    units increase and 26 decrease; in P4 day 1 (control) 2 of 29 increase and 12 decrease.
  deviations:
  - Multi-unit threshold crossings per channel in place of manually sorted putative MSNs.
  - The injection time is inferred from the recording segments and the subject description; it is
    not in the files. E5 day 4 is left out because its acute drop comes at 80 min, not at the
    inferred 30 min; C3-2 day 1 and E5 day 2 are left out because their event timestamps lie outside
    the recording, and C9 day 1 because its events stop at 42 min.
  - Channels with a baseline rate under 0.5 Hz are left out (a choice made here); 0 Hz and 2 Hz give
    the same picture.
  - Which sessions Supplementary Figure 5D pools is not stated; three readings are shown.
  - Fisher's exact test on three types is run as a Monte Carlo Freeman-Halton test, and channels are
    treated as independent samples, as the paper treats cells.
- claim: mua-saline-no-change
  outcome: blocked
  blocked_by: other
  notes: Only 1 of the 4 saline sessions (H1-3) is recorded until 300 min after the inferred
    injection; the criterion needs three. The others end 251 (E0), 271 (H4-3) and 281 (D0) min after
    it, assuming the injection at 30 min as the subject description says. In H1-3, 4 of 16 channels
    (25.0%) show no change. As a variant over the last 60 recorded minutes of each saline session,
    48.2% of 83 channels show no change, against 17.8% in PPX sessions of parkinsonian mice.
- claim: mua-response-shift-first-fourth
  outcome: partially_reproduced
  notebook: reproduce_zhuang_2025.ipynb
  output: claim:mua-response-shift-first-fourth
  notes: In parkinsonian mice the types shift from day 1 to day 4 as described, increase 0.9% to 18.0%
    and decrease 87.6% to 59.4% (Freeman-Halton p < 0.0001; 9 animals on day 1, 5 on day 4). Control
    mice also shift (decrease 96.0% to 57.4%, no change 4.0% to 42.6%, p < 0.0001), where the paper
    finds no shift; no control channel increases on either day. With animals that have both sessions
    the result is the same (parkinsonian p = 0.0002, control p = 0.0004). The day-4 increases come
    mostly from J0 (61% of its channels) and K1 (17%). The rate ratio of increase-type channels is not
    higher on day 4 (median 2.30, n = 2, against 1.63, n = 24, p = 0.258).
  deviations:
  - Multi-unit threshold crossings in place of sorted putative MSNs; the same exclusions as in
    mua-ppx-park-vs-ctrl. Day 4 has 5 parkinsonian animals here (E0 day 4 has no threshold crossings,
    N4 day 4 ends 181 min after the injection) where Figure 6G has 8.
- claim: fig1b-th-depletion
  outcome: reproduced
  notebook: reproduce_zhuang_2025.ipynb
  output: claim:fig1b-th-depletion
  measured:
  - 0.465
  - 0.507
  notes: Under reading (b), the "blank" rows as background, the median residual TH of 45 parkinsonian
    animals is 0.465 in the DLS and 0.507 in the DMS, and 0.677 in the VS; VS is higher than DMS
    (Dunn's p = 0.00025) and DLS (p = 1.9e-08), and DMS does not differ from DLS (p = 0.18). With the
    "background" rows (reading a) the ordering holds but DLS is 0.343 and DMS 0.418, outside
    tolerance; with all eight rows 0.402 and 0.474.
  deviations:
  - The Methods name four background areas; the sheets hold four "blank" and four "background" rows
    per slice. The claim matches under the blank rows only.
  - 45 parkinsonian animals where the paper gives n = 44; which one the paper left out is not
    stated.
