- claim: fig1ijk-ppx-a-k-auc
  outcome: partially_reproduced
  notebook: reproduce_zhuang_2025.ipynb
  output: claim:fig1ijk-ppx-a-k-auc
  notes: Four PPX sessions, 30 mice, no failed fit. A falls (median 0.891 to 0.785, Dunn p = 1.9e-06),
    AUC falls (3.95 to 2.91, p = 2.7e-08), K rises (0.258 to 0.321) without significance (Dunn p = 0.19;
    Friedman over the three conditions p = 0.032, which is the paper's printed p = 0.03). With the first
    PPX session, A and AUC fall (p = 0.012, 5.3e-05) and K does not change (p = 1). The same procedure
    reproduces the paper's A77636 values exactly (Dunn K p = 0.0053, AUC p = 0.0008), so the method matches
    the paper's; the paper's K result for PPX may come from the Friedman test (asked of the authors).
    The Dunn p for K depends on which OFF sessions enter the ranks; over the four pairs of ON (four, first)
    and OFF (every, first) readings it is 0.19, 0.23, 0.49 and 1, never significant. The repeated measures
    ANOVA of Table 1 gives K an omnibus p = 0.028 and baseline against PPX p = 0.15 (paired) or 0.19 (pooled
    error), so the printed p = 0.03 also matches that omnibus test.
  deviations:
  - Choices, omissions and latencies are recounted from the raw operant logs, as the paper's per-mouse
    spreadsheets are not deposited, with the event and block names of the paper's code (UCSF-Nelson-Lab/ICD-Cognitive-Analysis
    at 5528e222, delay_discounting_task.py, processCsv_1; free choice blocks B3, B6, B9, B12).
  - The two-way 'repeated measures' ANOVA treats each mouse and delay pair as the repeated unit with delay
    between units, the layout implied by the degrees of freedom the paper prints (F(1, 60) for 16 control
    mice, F(1, 120) for 31 parkinsonian mice; Figure 1 legend and Table 1); per-delay Bonferroni comparisons
    use the pooled within-unit error, with paired t tests as a variant.
  - The six control mice of the 2020 cohort ran delays of 0, 6, 12 and 18 s (their block labels and the
    measured reward delays agree), and 30 of their sessions have no fourth block; their blocks are counted
    as the other mice's, as the paper's code does.
  - Dunn's comparisons are those against baseline, corrected for two comparisons ('between baseline and
    PPX ON or OFF conditions', Supplementary methods, Behavior).
  - PPX OFF is every washout session of the mouse (the claims file gives no reading; Summary_Cognitive.m
    averages a mouse's sessions within a condition), with the first OFF session as a variant; all four
    ON and OFF pairs are run.
