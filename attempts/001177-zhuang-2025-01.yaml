- claim: fig2bc-a77636-locomotion
  outcome: reproduced
  notebook: reproduce_zhuang_2025.ipynb
  output: claim:fig2bc-a77636-locomotion
  assumed: true
  notes: 26 files. The 10 control mice are not faster 30 to 100 min after A77636 (median 3.19 to 2.90
    cm/s, Wilcoxon p = 0.065; paper p = 0.16); the other 16 are (3.14 to 3.69 cm/s, 13 of 16 faster, p
