  outcome: reproduced
  notebook: reproduce_zhuang_2025.ipynb
  output: claim:fig1c-rotarod
  notes: Medians control 91.3 s (n = 40), parkinsonian before PPX 47.3 s (n = 45), on PPX 66.7 s, second
