- claim: figs2ijk-ppx-washout
  outcome: reproduced
  notebook: reproduce_zhuang_2025.ipynb
  output: claim:figs2ijk-ppx-washout
  assumed: true
  notes: Four PPX sessions and every washout session, 30 mice. Reading (a), Friedman with Dunn's; A after
    washout 0.879 against 0.891 at baseline (p = 0.73), K 0.419 against 0.258 (p = 0.020), AUC 3.38 against
    3.95 (p = 0.078). Reading (b), repeated measures ANOVA with Bonferroni comparisons by paired t tests;
    A p = 1, K p = 0.063, AUC p = 0.039; ON against OFF A p = 3e-05, K p = 1, AUC p = 0.0011 (Table 1 gives
    < 0.0001, > 0.99, 0.0019). With the Bonferroni comparisons on the ANOVA's pooled error, all three parts
    hold (A p = 1, K p = 0.028, AUC p = 0.0072; ON against OFF A p = 5e-06, K p = 1, AUC p = 0.0051). The
    outcome rests on the pooled comparisons. Under the paired ones A recovers and both K and AUC stay on the PPX side of baseline but
    no test makes both significant (partially reproduced in rounds 1 and 2). Against the paper's six printed p-values (Figure S2I-K legend, Table 1), the pooled comparisons
    match its significance at 0.05 in all six and the paired ones in five, missing K (paper 0.01, paired 0.063, pooled 0.028); for
    AUC the paper gives p < 0.01, which pooled meets (0.0072) and paired does not (0.039); paired is closer only for ON against OFF
    AUC (paper 0.0019, paired 0.0011, pooled 0.0051). Changed to reproduced in round 3. With the first OFF or the first ON
    session, no test gives both K and AUC.
  deviations:
  - Choices, omissions and latencies are recounted from the raw operant logs, as the paper's per-mouse
    spreadsheets are not deposited, with the event and block names of the paper's code (UCSF-Nelson-Lab/ICD-Cognitive-Analysis
    at 5528e222, delay_discounting_task.py, processCsv_1; free choice blocks B3, B6, B9, B12).
  - The two-way 'repeated measures' ANOVA treats each mouse and delay pair as the repeated unit with delay
    between units, the layout implied by the degrees of freedom the paper prints (F(1, 60) for 16 control
    mice, F(1, 120) for 31 parkinsonian mice; Figure 1 legend and Table 1); per-delay Bonferroni comparisons
    use the pooled within-unit error, with paired t tests as a variant.
  - The six control mice of the 2020 cohort ran delays of 0, 6, 12 and 18 s (their block labels and the
    measured reward delays agree), and 30 of their sessions have no fourth block; their blocks are counted
    as the other mice's, as the paper's code does.
  - PPX OFF is every washout session of the mouse; with the first ON and first OFF session none of the
    three differs from baseline (A p = 1, K p = 0.59, AUC p = 0.38). All four ON and OFF pairs are run.
  - Reading (b) does not say how the Bonferroni comparisons are made. GraphPad Prism 10, which the paper
    used ('Statistical tests were performed using GraphPad Prism 10', Methods, Statistical analysis),
    makes them on the pooled error when sphericity is assumed and by paired comparisons when
    it is not, and its guide recommends not assuming sphericity for repeated measurements over time. The
    outcome takes the pooled-error comparisons as the assumption, since they match the paper's printed p-values better; with
    paired comparisons the claim is partially reproduced. Asked of the authors.
