- claim: fig4bc-baseline-rates-similar
  outcome: blocked
  blocked_by: data_missing
  notes: Needs optogenetically identified dMSNs and iMSNs. The dandiset has sorted units in 2 of 56
    files only (columns id, spike_times, unit_name), with no electrode, cell type or optogenetic
    label, and no file records laser pulse times (stimulus groups are empty, no intervals). The
    other 54 files hold unsorted threshold crossings and raw voltage; the paper's manual sorting in
