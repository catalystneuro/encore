findings:
- kind: data_missing
  statement: The dandiset holds raw voltage, LFP and unsorted threshold crossings, but sorted units
    only in 2 of 56 files, and those without electrode, cell type or putative-MSN classification. No
    file holds the optogenetic identification of dMSNs and iMSNs or the laser pulse times needed to
    redo it. The paper's Figures 4, 6F-K and S5 cannot be recomputed from the dandiset.
- kind: metadata_insufficient
  statement: No file records the time of the PPX or saline injection (no intervals, no events, empty
    stimulus groups). It can be inferred from the recording segments and the subject description,
    and the acute drop in firing supports it in all but one usable PPX session (E5 day 4, where the
    drop comes about 80 min into a single-segment recording, not at 30 min).
- kind: format_error
  statement: In C3-2 day 1 and E5 day 2 the threshold-crossing timestamps are offset by about 30 h
    (1815 to 2217 min and -1813 to -1404 min) from recordings that last 404 and 408 min. In C9 day 1
    they stop at 42 min of a 414-min recording.
- kind: metadata_error
  statement: Three sessions have start times in 2025 (H0-2 day 3 and day 4, H4-3 day 3), after the
    paper was first submitted in April 2024, and H0-2 day 4 starts before day 3. These are likely
    conversion dates.
- kind: metadata_insufficient
  statement: Electrode locations are "unknown" in every file. The units tables have no electrode or
    quality columns, and their units alternate between about 10^5 to 10^6 spikes and about 10^3 to
    10^4 spikes, which suggests unsorted and sorted clusters mixed without a label.
- kind: other
  statement: Genotype is spelled three ways (A2aCre, Drd1aCre, Drd1a-Cre) and subject descriptions
    contain mis-encoded characters (for example "1.5â€¯microliters").
- kind: paper_inconsistency
  statement: The dandiset's subjects match the paper's animal counts for Supplementary Figure 5 (7
    control, 11 parkinsonian) and Figure 6F (7 and 3 control mice on days 1 and 4), but it has 2
    control A2a-Cre mice where Figure 4C reports iMSNs from 4 control animals, and 7 parkinsonian mice
    with a day-4 session where Figure 6G reports 8.
- kind: other
  statement: Three of the four saline recordings end 251 to 281 min after the injection time the
    description gives, before the 240-300 min window the paper compares; P2's two sessions (152 and
    159 min) and N4 day 4 (241 min) are also too short for it.
- kind: selection_undocumented
  statement: The Zenodo deposit does not say which session files the paper averaged as baseline, drug
    and washout; conditions must be read from file names, two of which lack a full date.
- kind: paper_inconsistency
  statement: The six control mice P1-P7 in the PPX experiment ran sessions whose block labels give
    delays of 0, 6, 12 and 18 s, and 30 of their 41 sessions have only three free-choice blocks, where
    the paper and the task code describe four blocks at 0, 3, 6 and 9 s. The paper counts them among
    its 16 control mice.
- kind: paper_inconsistency
  statement: The rotarod sheet on Zenodo holds 40 control mice where Figure 1C reports 31; the
    histology sheets hold 45 parkinsonian animals where Figure 1B reports 44, and 6 of the 30 PPX
    parkinsonian mice with behaviour have no histology under the same ID, where Figure 3 reports 28.
- kind: metadata_insufficient
  statement: The histology sheets hold four "blank" and four "background" rows per slice without
    saying which is the background of the Methods; in 61 rows (5 slices) RawIntDen differs from Area
    x Mean, by median factors of 0.77 to 1.86 in four slices and about 300 in blank rows of a fifth.
- kind: metadata_insufficient
  statement: The open-field speed files on Zenodo for Figures 2B-C and 5C-F do not mark the injection
    time, and the DREADD group list does not give each mouse's Cre line.
