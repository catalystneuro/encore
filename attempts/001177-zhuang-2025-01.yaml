  outcome: reproduced
  notebook: reproduce_zhuang_2025.ipynb
  output: claim:figs1d-snc-cells
  notes: TH+ cells over the four sections and both sides divided by the area counted. 29 of 32 mice could
    be given a group (9 control, 20 parkinsonian; paper 9 and 21); median density 316.0 against 186.6
    cells per mm2, Mann-Whitney p = 0.0003. The three unlinked mice (C0.1, C2.1, D5.2) do not change the
    result in either group (p = 0.0001 and 0.0019).
  deviations:
  - The workbook has no group column. Groups are taken from the histology workbook of the same deposit,
    the README's PPX lists and the DANDI subjects' lesion, in that order.
  - Two rows (D3 and N4 at -3.51 mm) have shifted count and area columns and are left out.
