outcomes:
- claim: fig1b-th-loss
  outcome: partially_reproduced
  notebook: reproduce_zhuang_2025.ipynb
  output: claim:fig1b-th-loss
  measured: 60.6
  notes: Corrected total fluorescence per ROI, normalized to the control mice of the same staining cohort,
    in 45 parkinsonian mice (Table 1 gives N = 44). Mean losses are DLS 64.3%, DMS 56.8% and VS 35.3%
    (medians 66.3, 58.4, 39.7%), so DLS and DMS are outside 50 +/- 5%. Kruskal-Wallis p = 3.4e-08; Dunn
    DLS against DMS p = 0.38, DLS against VS p < 0.0001, DMS against VS p = 0.0001, so the pattern holds.
    Normalized to all controls, DLS 60.5% and DMS 52.4% (DMS inside the tolerance), and DMS against VS
    p = 0.052. The measured value is the mean of the DLS and DMS losses.
  deviations:
  - Normalization reference not given beyond 'normalized TH fluorescence levels' (Supplementary methods,
    Histology); the control mice of the same staining cohort are used, as the deposit README says each
    cohort includes healthy and parkinsonian samples 'to control for inter-batch staining variability',
    and all controls pooled is run as a variant. Both readings give a partial outcome.
  - VS is the mean of the VLS and VMS ROIs of both sides ('VLS and VMS were then combined into ventral
    striatum (VS)', Supplementary methods); background is the mean of the four background ROIs of each
    section (same passage).
- claim: figs1d-snc-cells
  outcome: reproduced
  notebook: reproduce_zhuang_2025.ipynb
  output: claim:figs1d-snc-cells
  notes: TH+ cells over the four sections and both sides divided by the area counted. 29 of 32 mice could
    be given a group (9 control, 20 parkinsonian; paper 9 and 21); median density 316.0 against 186.6
    cells per mm2, Mann-Whitney p = 0.0003. The three unlinked mice (C0.1, C2.1, D5.2) do not change the
    result in either group (p = 0.0001 and 0.0019).
  deviations:
  - The workbook has no group column. Groups are taken from the histology workbook of the same deposit,
    the README's PPX lists and the DANDI subjects' lesion, in that order.
  - Two rows (D3 and N4 at -3.51 mm) have shifted count and area columns and are left out.
- claim: fig1c-rotarod
  outcome: reproduced
  notebook: reproduce_zhuang_2025.ipynb
  output: claim:fig1c-rotarod
  notes: Medians control 91.3 s (n = 40), parkinsonian before PPX 47.3 s (n = 45), on PPX 66.7 s, second
    cohort before saline 51.0 s and on saline 62.3 s (n = 27). Kruskal-Wallis over the five columns p
    = 6.7e-15; Dunn control against parkinsonian p = 1.1e-15, before against PPX p = 1.8e-05, before against
    saline p = 0.83. Variant (Supplementary methods) Mann-Whitney p = 5e-13, Wilcoxon p = 3e-08 (PPX)
    and 0.074 (saline).
  deviations:
  - The deposited columns are labelled Park_cohort1_baseline and Park_cohort1_PPX, Park_cohort2_baseline
    and Park_cohort2_Saline; the pre-drug sessions are the baseline columns, as the claim's criterion
    asks the author to read from the file.
  - Dunn's comparisons are corrected for the three comparisons the criterion names; the workbook has 40
    controls where Table 1 gives 31.
- claim: figs1ef-ppx-locomotion
  outcome: blocked
  blocked_by: other
  notes: The Zenodo deposit holds open field velocity for the A77636 and CNO experiments only; no file
