    PPX session, A and AUC fall (p = 0.012, 5.3e-05) and K does not change (p = 1). The same procedure
    reproduces the paper's A77636 values exactly (Dunn K p = 0.0053, AUC p = 0.0008), so the method matches
    the paper's; the paper's K result for PPX may come from the Friedman test (asked of the authors).
  deviations:
