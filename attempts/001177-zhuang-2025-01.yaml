- kind: methods_unavailable
  statement: Questions for the authors. (1) When was the drug injected in each open field file (A77636
    and CNO)? This attempt assumed 20 min after the start, where most files lose tracking briefly. (2)
    Was striatal TH normalized to the control mice of each staining cohort or to all controls? The DMS
    loss is 56.8% one way and 52.4% the other. (3) Which test gives p = 0.03 for the PPX effect on K in
    Figure 1J? Dunn's comparison of baseline against PPX ON gives p = 0.19 here, the Friedman test over
    three conditions p = 0.032, while the same procedure reproduces the A77636 Dunn's p-values exactly.
    (4) Were the Bonferroni comparisons after the repeated measures one-way ANOVA of Figure S2I-K made
    on the pooled error (sphericity assumed) or by paired comparisons? With the pooled error, K and AUC
    differ from baseline after washout (p = 0.028 and 0.0072); with paired comparisons K does not (p =
    0.063).
