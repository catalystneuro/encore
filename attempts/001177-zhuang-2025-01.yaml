- claim: figs1-instrumental-learning
  outcome: partially_reproduced
  notebook: reproduce_zhuang_2025.ipynb
  output: claim:figs1-instrumental-learning
  notes: From the workbook's Figure S1H-I and S1K-L sheets (32 control and 81 parkinsonian mice; paper
    34 and 81). In blocked learning, parkinsonian success lower in sessions 1, 3 and 4 (Bonferroni p =
    0.007, 0.0055, 0.0035), latency longer in sessions 3 to 6 (p = 0.0005 to 0.012). In random learning,
    success is similar in sessions 2 to 6 but different in session 1 (65.9 against 86.9%, p = 0.003),
    and initiation latency similar in all sessions (p >= 0.13). The criterion's last part, no random session
    differing, fails on session 1.
  deviations:
  - The S1K-L sheet has a second 'Session1_Park' header at row 118, between session 1 and session 2 parkinsonian
    blocks, with 30 rows; it is read as session 2 control. Without it, random session 2 has no control
    data.
- claim: fig1fg-baseline-similar
  outcome: reproduced
  notebook: reproduce_zhuang_2025.ipynb
  output: claim:fig1fg-baseline-similar
  notes: Reading (a), every deposited baseline session (16 control, 31 parkinsonian mice); group F(1,
    178) = 0.007, p = 0.93 (paper F(1, 180) = 0.003, p = 0.96); every per-delay Bonferroni p = 1. Reading
    (b), the stable-run rule, keeps 12 mice; group p = 0.11, per-delay p >= 0.45. Both readings find no
    difference.
  deviations:
  - Choices, omissions and latencies are recounted from the raw operant logs, as the paper's per-mouse
    spreadsheets are not deposited, with the event and block names of the paper's code (UCSF-Nelson-Lab/ICD-Cognitive-Analysis
    at 5528e222, delay_discounting_task.py, processCsv_1; free choice blocks B3, B6, B9, B12).
  - The two-way 'repeated measures' ANOVA treats each mouse and delay pair as the repeated unit with delay
    between units, the layout implied by the degrees of freedom the paper prints (F(1, 60) for 16 control
    mice, F(1, 120) for 31 parkinsonian mice; Figure 1 legend and Table 1); per-delay Bonferroni comparisons
    use the pooled within-unit error, with paired t tests as a variant.
  - The six control mice of the 2020 cohort ran delays of 0, 6, 12 and 18 s (their block labels and the
    measured reward delays agree), and 30 of their sessions have no fourth block; their blocks are counted
    as the other mice's, as the paper's code does.
  - Two control mice of the 2020 cohort have no 9 s block, so error df is 178.
