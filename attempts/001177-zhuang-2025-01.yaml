findings:
- kind: data_missing
  statement: DANDI:001177 holds, for 18 mice and 56 sessions, the 30 kHz voltage, the 1 kHz LFP and per-electrode
    threshold crossings with their waveforms, which are the input to the paper's manual spike sorting.
    It holds none of what the paper's electrophysiology analysis used; sorted single units (54 files have
    none), their putative MSN class, their optical identification, the laser pulse times and the PPX injection
    time. None of the 14 electrophysiology findings (Figures 4, 6F-I, S5, S8) can be tested.
- kind: metadata_insufficient
  statement: Two files (sub-E0 PPX day 4, sub-P4 PPX day 1) have a units table with spike times and unit
    names only. Even-numbered and odd-numbered units differ by about two orders of magnitude in spike
    count in E0, consistent with an unsorted and a sorted cluster per channel, but no column gives the
    channel, the sorted status, the MSN class or an optical label.
- kind: metadata_error
  statement: Three sessions have start times in 2025 (sub-H0-2 days 3 and 4, 2025-07-31 and 2025-07-30,
    out of day order; sub-H4-3 day 3, 2025-05-23) while the same mice's other days are from 2023, likely
    the conversion date.
- kind: metadata_error
  statement: The subject descriptions are mis-encoded ('1.5â€¯microliters', a UTF-8 narrow space decoded
    twice), and the genotype is written 'Drd1a-Cre' in sub-E0's PPX sessions and 'Drd1aCre' elsewhere.
- kind: data_missing
  statement: In the paper's Zenodo deposit (doi:10.5281/zenodo.15258978), the PPX open field data of Figure
    S1E-F are absent; parkinsonian mouse E6 has baseline but no PPX or washout delay discounting sessions;
    and mCherry mouse R5.5, listed in the README, has no delay discounting file.
- kind: metadata_insufficient
  statement: In the Zenodo deposit, no file gives each mouse's sex (Figure S2A-C cannot be tested); the
    open field files carry no injection time (25 of 26 A77636 files show a tracking gap at 20 min, taken
    as the injection); six A77636 and four CNO open field mice are in no group list of the README; and
    the SNc cell count workbook has no group column, so three of its 32 mice cannot be placed.
- kind: selection_undocumented
  statement: The deposit holds 2 to 5 baseline sessions per mouse (1 to 5 before the first drug session), and the Methods' stability rule (CV
    < 20% in 3 blocks over three sessions or in all blocks over two) finds a stable run in only 12 of
    47 PPX mice among them. Which baseline sessions entered the figures is not stated; using all deposited
    baselines gives the paper's statistics closely (delay F = 38.15 against 38.53).
- kind: other
  statement: Not all sessions follow the Methods' task. The 2020 cohort of six control PPX mice (P1 to
    P7) ran delays of 0, 6, 12 and 18 s, as both its block labels and the measured reward delays show,
    and 30 of its sessions have no fourth block; the 2021 cohort (C mice) ran 30 free choice trials per
    block, the Methods 20. The paper's code counts them with the others.
- kind: other
  statement: 233 operant logs are byte-identical between the PPX and DREADD folders of the cognitive assay
    zip, and 75 between the A77636 and DREADD folders; they are the training logs and baseline sessions
    of mice used in two experiments, deposited twice. No drug or washout session is shared.
- kind: metadata_error
  statement: In the Zenodo workbook Data_ICD_FigS1_SNcTH_CellCounting_RawImages.xlsx, the Figure S1K&L
    sheet labels two blocks 'Session1_Park' (rows 35 and 118), the second presumably session 2 control,
    and two rows of the Figure S1D sheet (D3 and N4 at -3.51 mm) have their count and area columns shifted.
    The rotarod workbook has 40 control mice where Table 1 gives 31.
- kind: paper_inconsistency
  statement: The Figure S6C legend and Table 1 give p < 0.01 for the CNO reduction of oIPSC amplitude by Wilcoxon
    signed-rank test in 6 cells, but a two-sided exact signed-rank test on 6 pairs cannot give less than
    p = 0.031, which is what the deposited values give.
- kind: other
