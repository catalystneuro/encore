    the mouse being lifted for the injection and with a 20 min baseline (-20 to 0 min, the window stated
    for CNO); a -30 to 0 min baseline does not exist in these files, so the criterion's reading (b) cannot
    be run.
  - Mice not in the README's A77636 control list are taken as parkinsonian, because the control list is
    complete in the files (10 of 10) and 16 mice remain, the paper's N.
