- claim: fig1c-total-suppression
  outcome: reproduced
  notebook: reproduce_wright_2019.ipynb
  output: claim:fig1c-total-suppression
  measured:
  - 0.768
  - 0.502
  - -0.002
  notes: >-
    Over 88 sessions all eight readings of the amended claims file (total fear over 10 s or 20
    s, each 0/0 rule, both session values) put the three means within tolerance, and their tests
    hold. Under the first reading the criterion lists (10 s, 0/0 set to 0, mean of the per-trial
    ratios), given as measured, danger is 0.768, uncertainty 0.502 and safety -0.002. With the
    20 s baseline and 0/0 set to 1, the reading the Methods regression table fixes, they are
    0.799, 0.531 and 0.030; the repeated-measures ANOVA of cue gives F(2,174) = 595, p =
    1.6e-78, danger against uncertainty t(87) = 12.3, p = 9.1e-21, and uncertainty against
    safety t = 21.0, p = 7.8e-36 (paper F = 592.00, t = 12.36, t = 20.85). Danger is within
    tolerance of the legend's 0.83 under every reading (0.768 to 0.799). By rat, danger ranges
    from 0.29 (rf08, 3 sessions) to 0.94 (rf03). The answer to this attempt's question
    (questions/wright-2019.yaml) amended details 1 and 2 of the claims file: total fear now has
    its own window, 10 s or 20 s, and 0/0 may be 1. The 2 s total fear readings, which put
    danger at 0.35 to 0.75, are no longer readings, so the outcome no longer depends on the
    window. The earlier run gave the measured values under the 20 s reading, as a deviation
    outside the claims file's readings; they are now under the first reading listed, and the
    deviation is withdrawn.
