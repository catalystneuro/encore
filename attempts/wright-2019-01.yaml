  - 245
  - 197
  - 48
  notes: >-
    With the mean rate in the 2 s before onset and raw features (reading a, a), k-means gives 197
    LFR and 48 HFR neurons. The baseline rate differs by cluster (F(1,243) = 835, p = 1.4e-80;
    paper 829), and half duration (p = 0.97) and amplitude ratio (p = 0.51) do not. Z-scored
    features give 198 and 47 (also within tolerance). The session rate gives 194 and 51, with HFR
    outside tolerance. The files hold spikes only from 20 s before each onset to 31 to 34 s after
