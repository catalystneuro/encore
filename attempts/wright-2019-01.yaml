- claim: fig1c-total-suppression
  outcome: reproduced
  notebook: reproduce_wright_2019.ipynb
  output: claim:fig1c-total-suppression
  measured:
  - 0.799
  - 0.531
  - 0.030
  notes: >-
    Over 88 sessions, with the poke baseline of the 20 s before onset, 0/0 set to 1 and the mean of
    the per-trial ratios, danger is 0.799, uncertainty 0.531 and safety 0.030. The repeated-measures
    ANOVA of cue gives F(2,174) = 595, p = 1.6e-78. Danger against uncertainty gives t(87) = 12.3,
    p = 9.1e-21, and uncertainty against safety t = 21.0, p = 7.8e-36 (paper F = 592.00, t = 12.36,
    t = 20.85). Every 10 s and 20 s reading puts the three means within tolerance. The first one the
    criterion lists (10 s, 0/0 set to 0, trial mean) gives 0.768, 0.502 and -0.002. The 2 s
    readings do not (danger 0.35 to 0.75), though all their tests hold. The legend's 0.83 is matched
    as well. By rat, danger ranges from 0.29 (rf08, 3 sessions) to 0.94 (rf03).
  deviations:
  - >-
    The 20 s baseline and the 0/0 rule are not among the claims file's readings. They are the ones
    the Methods regression table fixes (Methods, Single-unit, linear regression; one unit of the
    data set reproduces the table only with them; data check of the notebook). The measured values
    are under that reading. The claims file's readings are all shown, and a question is in
    questions/wright-2019.yaml.
- claim: fig1c-nonlinear-scaling
  outcome: reproduced
  notebook: reproduce_wright_2019.ipynb
  output: claim:fig1c-nonlinear-scaling
  notes: >-
