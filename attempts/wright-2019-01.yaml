findings:
- kind: metadata_error
  statement: >-
    The data description says the cube's poke.base is the nose poke rate 2 s before the cue. The
    data set's cubeScript.m computes it over the 20 s before onset, and uses it for every
    suppression ratio in the cube, including the 1 s and 500 ms intervals.
- kind: methods_unavailable
  statement: >-
    Neither the paper nor the data description states the nose poke baselines of the suppression
    ratios or how a 0/0 ratio is handled. The paper's printed regression input is reproduced by one
    unit only with a 2 s baseline for interval fear, a 20 s baseline for total fear and 0/0 set
    to 1. Other choices change the outcomes of fig1d-interval-suppression and fig1s1a-nose-poke-rates.
    Question for the authors: are these the windows and the rule used throughout, and which
    baseline does Figure 1, figure supplement 1A plot?
- kind: code_mismatch
  statement: >-
    The data set's cubeScript.m computes the total and the interval suppression ratios over the
    20 s baseline (poke.base, used in cer.cue and cer.s1.interval), while
    the paper's interval fear (its regression table, and the Figure 1D statistics) uses the 2 s
    baseline. The script also rounds the 2 s baseline firing rate down to an integer; the paper's
    table uses the unrounded rate, and the rounded one would change the Onset screen to 31 neurons.
- kind: metadata_error
  statement: >-
    The paper and the description give a mean ITI of 3.5 min, but cue onsets are 132 to 195 s apart
    (mean about 2.7 min) in all 88 sessions, so no interval between cues reaches 3.5 min.
- kind: other
  about: data
  statement: >-
    Five pairs of units recorded in the same session share 66 to 90% of the spikes of one unit
    within 0.5 ms (dr01092016 SPK10a and SPK14a; dr02092716 SPK04a and SPK15b; rf02091816 SPK01a and
    SPK04a; rf02110216 SPK08a and SPK13a; rf03110916 SPK04a and SPK14a). They may be one neuron
    sorted twice. The paper counts all 245 units, and one of these (dr02092716 SPK04a) is an Onset
    neuron.
- kind: selection_undocumented
  about: paper
  statement: >-
    The paper reports four Onset-Ramping pairs in four sessions. With the populations that match
    the paper's counts (29 and 14), only three pairs share a session, in two sessions. The paper's
    lists of Onset and Ramping units (Figure 1, figure supplements 4 and 6) are in figures only,
    and the data set does not mark which units the paper placed in each population.
- kind: metadata_insufficient
  statement: >-
    The spike trains in the data set's files hold spikes only from 20 s before each cue onset to 31
    to 34 s after it (34 of 12,261,110 spikes fall outside), with gaps of about 141 s between
    trials. The data description does not say so. A rate over the span of a unit's spike train is
    therefore about a third of its firing rate, and the files cannot give a whole-session rate.
- kind: other
  about: paper
  statement: >-
    Interval Z firing (Methods, Z-score normalization) has mean zero over each neuron's 32 trials,
    so its cue means satisfy 6 D + 16 U + 10 S = 0. Cross-neuron correlations of the cue means, as
    in Figure 4A, 4B, 4E and 4F, are then negative even with the trial labels shuffled (median r
    -0.49 to -0.70), and the observed correlations (-0.45 to -0.55) lie within the shuffled range.
- kind: methods_unavailable
  statement: >-
    The shuffle behind the chance levels of Figure 4D and 4H is not defined beyond "each neurons
    firing pattern was shuffled". Permuting within neurons reproduces the claims, and permuting each
    cue across neurons does not. Question for the authors: which shuffle was used?
- kind: methods_unavailable
  statement: >-
    The sliding-window departure times of Figure 2E depend on the firing measure and on whether a
    window is timed by its start or end, which the paper does not state. No reading gives all
    four times. By window start the Bonferroni danger time is 4.5 to 4.7 s against 5.8 s; by window
    end it is 5.5 to 5.7 s, but the danger time at p < 0.05 is then 3.7 s against 2.8 s. Question for the authors: which
    measure and time point were used?
