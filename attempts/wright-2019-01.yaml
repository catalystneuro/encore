- claim: fig1d-interval-suppression
  outcome: reproduced
  assumed: true
  notebook: reproduce_wright_2019.ipynb
  output: claim:fig1d-interval-suppression
  notes: >-
    With interval fear over the 2 s baseline (readings a and b of detail 1), 0/0 set to 1
    (reading c of detail 2) and trial means, the cue effect is F(2,174) = 493 and the cue x
    interval interaction F(18,1566) = 6.15, p = 9.5e-15 (paper 489.40 and 6.21). Danger exceeds
    uncertainty and uncertainty exceeds safety at p < 0.005 in all ten intervals (smallest t
    3.03 and 6.2; paper all t > 3.00 and > 7.00). Of the eight readings of the amended claims
    file (interval fear over 2 s or 10 s), the four with 0/0 set to 1 give 10 of 10 in both
    comparisons. The four with 0/0 set to 0 or left out give 8 or 9 of 10 danger-uncertainty
    intervals, which would be partially reproduced. All eight give 10 of 10 uncertainty-safety
    intervals and both ANOVA effects. The answer to this attempt's question
    (questions/wright-2019.yaml) amended details 1 and 2 of the claims file: interval fear is
    now over 2 s or 10 s (20 s is no longer a reading for it), and 0/0 set to 1 is now reading c
    of detail 2. The outcome and the assumption stand, now on a reading the claims file lists;
    the readings that differ are those of the 0/0 rule, not of the window (earlier 5 of 12
    readings gave 10 of 10, now 4 of 8).
  deviations:
  - >-
    The readings differ in outcome. The one adopted, 0/0 set to 1 (reading c of detail 2), is
    the rule of the Methods regression table, where trials with no poke in baseline or interval
    are 1.00, and of Figure 1, figure supplement 2 ("A suppression ratio of 1.0 is found ...
    when no poke occurs in an interval"). The question is for the paper's authors (findings).
- claim: fig1s1a-nose-poke-rates
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_wright_2019.ipynb
  output: claim:fig1s1a-nose-poke-rates
  notes: >-
    The amended claims file says the supplement uses the total fear window: 10 s under reading a
    of detail 1, 20 s under readings b and c. Under every window shown (2, 10 and 20 s), poking
    falls from baseline to cue for danger and both uncertainty types (t(87) from 10.6 to 17.6,
    all p < 1e-16) and not for safety (p 0.24 to 0.60). Baseline rates across the four trial
    types do not differ with the 10 s window (F(3,261) = 2.43, p = 0.066), where the claim is
    reproduced. They do differ with the 20 s window adopted here (F = 3.47, p = 0.017), where
    the means are 39.6, 37.0, 39.1 and 37.8 pokes/min. The former 2 s window gives F = 2.20, p =
    0.088. The answer to this attempt's question (questions/wright-2019.yaml) amended details 1
    and 2 of the claims file: the baseline is now the total fear window, 10 s or 20 s. The 20 s
    window adopted earlier as an assumption outside the claims file's readings is now readings b
    and c, and the 2 s window is no longer a reading. The outcome and the assumption are
    unchanged.
  deviations:
  - >-
    The readings differ in outcome. The 20 s window (readings b and c of detail 1) is adopted as
    an assumption because it is the total fear baseline of the Methods regression table, and the
    one the data set's cubeScript.m stores as poke.base. The 10 s result is shown. The question
    is for the paper's authors (findings).
