    mean is above the midpoint of the danger and safety means; primary reading 0.531 against 0.415.
- claim: fig1d-interval-suppression
  outcome: reproduced
  assumed: true
  notebook: reproduce_wright_2019.ipynb
  output: claim:fig1d-interval-suppression
  notes: >-
    With interval fear over the 2 s baseline, 0/0 set to 1 and trial means, the cue effect is
    F(2,174) = 493 and the cue x interval interaction F(18,1566) = 6.15, p = 9.5e-15 (paper 489.40
    and 6.21). Danger exceeds uncertainty and uncertainty exceeds safety at p < 0.005 in all ten
    intervals (smallest t 3.03 and 6.2; paper all t > 3.00 and > 7.00). Five of the twelve readings
    give 10 of 10 in both comparisons. The other seven give 8 or 9 of 10 danger-uncertainty
    intervals, which would be partially reproduced. All readings give 10 of 10 uncertainty-safety
    intervals and both ANOVA effects.
  deviations:
  - >-
    The readings differ in outcome. The one adopted (2 s baseline for interval fear, 0/0 = 1) is
    the reading the Methods regression table fixes for interval fear. The 2 s window is reading
    (a) of detail 1, and 0/0 = 1 is not among the claims file's readings. Asked in
    questions/wright-2019.yaml.
- claim: fig1s1a-nose-poke-rates
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_wright_2019.ipynb
  output: claim:fig1s1a-nose-poke-rates
  notes: >-
    Under every window, poking falls from baseline to cue for danger and both uncertainty types
    (t(87) from 10.6 to 17.6, all p < 1e-16) and not for safety (p 0.24 to 0.60). Baseline rates
    across the four trial types do not differ with the 2 s window (F(3,261) = 2.20, p = 0.088) or
    the 10 s window (F = 2.43, p = 0.066). They do differ with the 20 s window adopted here
    (F = 3.47, p = 0.017), where the means are 39.6, 37.0, 39.1 and 37.8 pokes/min. Under the claims
    file's two readings the claim is reproduced.
  deviations:
  - >-
    The supplement does not say which baseline it plots. The 20 s window is adopted as an
    assumption because it is the baseline of total fear in the Methods regression table, and the
    one the data set's cubeScript.m stores as poke.base. The 2 s and 10 s results are shown. The
    question is for the paper's authors (findings).
- claim: fig1s1b-sr-poke-correlation
  outcome: reproduced
  notebook: reproduce_wright_2019.ipynb
  output: claim:fig1s1b-sr-poke-correlation
  notes: >-
    Under every reading the suppression ratio and the cue poke rate correlate negatively over the
    88 sessions for danger (r -0.40 to -0.73) and uncertainty (r -0.36 to -0.75), all p < 0.001, and
    over all 264 points (r -0.52 to -0.79). Under the primary reading the safety correlation is
    r = -0.35, p = 0.001.
- claim: fig1e-two-clusters
  outcome: reproduced
  notebook: reproduce_wright_2019.ipynb
  output: claim:fig1e-two-clusters
  measured:
  - 245
  - 197
  - 48
  notes: >-
    With the mean rate in the 2 s before onset and raw features (reading a, a), k-means gives 197
    LFR and 48 HFR neurons. The baseline rate differs by cluster (F(1,243) = 835, p = 1.4e-80;
    paper 829), and half duration (p = 0.97) and amplitude ratio (p = 0.51) do not. Z-scored
    features give 198 and 47 (also within tolerance). The session-mean rate gives 194 and 51, with
    HFR outside tolerance.
  deviations:
  - >-
    The Methods define the waveform features in words. The peaks are picked as described in pag.py
    (largest deflection, the opposite extreme before and after it); the waveform has no unit. The
    k-means initialisation (k-means++ starts, 20 replicates, seed 0) is a standard choice.
