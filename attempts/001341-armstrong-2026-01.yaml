findings:
- kind: metadata_insufficient
  statement: The spike times are not on the clock of the trials table and the behaviour, and the files hold no
    synchronisation signal or offset (processing, analysis and stimulus are empty), though the SI says LabVIEW TTL
    signals were used to synchronise the recordings with the behaviour. At the stored turn onsets neither session
    shows a trial-locked population response, and turn type cannot be decoded from the units' spike counts, while
    the animal's lateral position decodes it at 0.92 to 0.95. In 503 the lag of the best correlation between spike
    rate and running speed grows smoothly from 12.9 to 19.75 s over the first 5200 s; a line through it (11.86 s
    plus 1.37 ms per s, residual SD 0.56 s) recovers trial-locked, turn-specific responses, so the spike times of
    503 appear to be about 12 s later than the trial times of the same events, with a gap growing by about 1.4 ms
    per s. That clock is fitted to running speed, and 503 runs in 1.7% of OL_L and 31.8% of OL_R rows, so the
    turn-specific responses on it may in part reflect running. In 489 the onset-triggered best lags rise from 4.36
    to 12.23 s over the first seven windows, which suggests a similar drifting offset, but no window's lag is
    separated from chance and the speed correlations are weak, so no clock can be fitted. The spikes of 489 end at 6255 s and its behaviour at 6218 s. None of the paper's
    findings on spike timing can be tested.
- kind: data_missing
  statement: The dataset holds 2 of the paper's 19 animals (489 and 503), with units, trials and ball tracking.
    The other 11 ephys sessions, the 6 behaviour-only sessions, and the wall positions, whisker tracking, touch
    times and gait of any session are not in it, though the SI says the spikes of all filtered units are packaged
    with the behavioural data in one NWB file per animal. Twelve claims are blocked for these data.
- kind: format_error
  statement: In session 489 the trials table rows 1000 to 1610 (611 rows) all have start 3681.414 s, stop 3683.414
    s and label OL_L_1.dat. The `trial` sample series gives them their own times (3683 to 6218 s), and they
    alternate between 305 two-second turns and 306 straight runs of 100 cm; 256 of the 305 turns go to the right.
- kind: format_error
  statement: In both sessions a run of OL rows (62 in 489, rows 173 to 757; 63 in 503, rows 251 to 777) has a stop
    time earlier than its start time. The samples of these rows carry timestamps that restart at the preceding
    straight row's start, so the sample timestamps go back in time (891 times in 489, 557 in 503); `ts_local` and the
    next row's start show that each lasted 2.0 s from its stated start.
- kind: metadata_error
  statement: The units tables hold 61 units for 489 and 43 for 503, where Table S1 gives 65 and 48. For 489,
    Fig. 5B gives 10 L2/3 and 13 L6 units, 43 FS and 22 RS; the file has 7, 12, 30 and 31. 503 has three units in a
    layer labelled WM, which the paper does not use.
- kind: other
  statement: Unit 101 of 489, which the paper calls 489101 and describes as RS (layer 5A in Fig. 4F and S10, 5B in
    Fig. S5E), is labelled Inhibitory in layer 5A with a 0.2 ms waveform, FS by the paper's 0.4 ms rule. It is the
    session's highest-rate unit, as the paper says of 489101.
- kind: other
  statement: The population rate of 489 averaged over its 61 units is 6.65 to 7.80 Hz in the second before the turn
    at any alignment of the spikes from -20 to 60 s, and 7.09 Hz over the whole recording, where the paper gives
    2 ± 0.1 Hz for the same quantity (Fig. 1N).
- kind: metadata_error
  statement: The file of 489 gives the age as P63D, but its date of birth (2022-05-01) and session date
    (2022-07-08) are 68 days apart, the P68 of Table S1. Both files give a weight of 0.02 kg.
- kind: selection_undocumented
  statement: The paper's trial selections cannot be identified in the files. 489 has 249 and 251 labelled OL_L and
    OL_R trials where Fig. 1J-K uses 266 and 265 and Fig. S6A 520 OL_L; 503 has 230 and 283 where Fig. S4A uses 305
    and 304 and Fig. 2A 414 in all. In 503 only 27.7% of trials are run above 10 cm/s (Table S1 52.8%; 37.0% of CL,
    1.7% of OL_L and 31.8% of OL_R rows) and the mean running speed is 13.1 cm/s (16.1); all 513 OL trials give a
    success rate of 0.68, and the 94 run above 10 cm/s give 0.98 to 1.00, so the paper's figures may rest on a
    selection of running trials, or the deposited session of 503 may differ from the one analysed.
- kind: metadata_insufficient
  statement: Several variables are not described. `distance_lat` and `distance_for` restart at 0 at each trial, and
    the sign of lateral distance (positive to the left) is not stated; `trial` has unit "n" and `ts_local` is the
    time since the trial started, neither described; the trial types are stimulus file names (`OL_L_1.dat`,
    `Straight 100cm A.dat`); `unit_type` (Excitatory, Inhibitory) is the waveform-duration classification, not a
    cell-type identification.
