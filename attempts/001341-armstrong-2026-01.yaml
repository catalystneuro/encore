- claim: fig4-ddm-fit
  outcome: partially_reproduced
  notebook: reproduce_armstrong_2026.ipynb
  output: claim:fig4-ddm-fit
  measured:
  - 0.000
  - 0.464
  - 0.163
  - 0.25
  - 47.6
  - -196.7
  - 2.813
  notes: The GDDM fits better than the DDM in all 4 readings where both were fitted (BIC -201.6 to -76.8 against
    42.7 to 82.8), but the DDM nondecision time is 0.000 to 0.005 s in all 16 readings, against 0.12 s, so the two
    never hold together and only one holds. Measured is the reading run angle derivative, 0 to 1 s, clearance in the
    turn direction, sigma 0.25, with K/B from the GDDM. Other values are far from the paper's; DDM BIC 42.7 to
    205.9 (-664), GDDM BIC -201.6 to -76.8 (-705), B 0.150 to 1.214 (0.59, none within tolerance), K/B 2.50 to
    3.80 (11.12). K is within tolerance in 6 of 16 fits, all with sigma free, where K, B and sigma are identified
    only up to a common scale. The GDDM leak is at the -10 edge of its range in all four fits. The near-zero NDT
    follows from the RTs, which in 489 OL_L trials have means of 0.297 to 0.352 s and a minimum of 0.007 s.
  deviations:
  - The 249 labelled OL_L trials of 489 are used; the paper's 266 (Fig. 4B) or 520 (Fig. S7C-D) cannot be
    identified among the dataset's trials.
  - RT maxima at the edge of the search window are not peaks and those trials are dropped (2 to 5 of 249), a
    standard choice.
  - The GDDM was fitted only under sigma 0.25 and the 0 to 1 s window (4 of 16 readings), for time.
  - The GDDM leak, collapse and fitting ranges, the time step and the loss (PyDDM's BIC) are standard choices; the
    paper names the components but not their parameterisation (Results, Ramping neural activity, paragraph 1).
