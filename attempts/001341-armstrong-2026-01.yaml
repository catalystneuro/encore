  output: claim:fig2b-lateral-spread
  measured:
  - 0.20
  - 0.84
  - 7.20
  - 3.54
  notes: The stored lateral distance restarts at 0 at each trial, so under reading (a) it is 0.00 ± 0.00 cm at
    t = 0 by construction. Integrated from the start of the straight section (reading b, given as measured with
    reading c), 503 is at 0.20 ± 0.84 cm at t = 0; the mean is within tolerance, the SD (0.84 against 0.55 ± 0.055)
    is not. The distribution widens under (b) (503 SD 0.84, 2.90 and 7.20 cm at 0, 1 and 3 s), but no reading
    gives the 2 s and 3 s SDs of 1.49 and 2.30 (503 6.64 and 7.20, 489 3.54 and 5.40 under b; 503 0.76 at 3 s and
    489 3.85 at 2 s under a). Per turn direction the 503 SDs at 3 s are 4.58 (OL_L) and 3.10 (OL_R) under (b).
