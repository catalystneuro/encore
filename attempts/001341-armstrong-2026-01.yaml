outcomes:
- claim: table-s1-recordings
  outcome: not_reproduced
  notebook: reproduce_armstrong_2026.ipynb
  output: claim:table-s1-recordings
  notes: The dataset holds 2 of the 19 animals of Table S1 (489 and 503, 2 of 13 ephys sessions), so 17 trial
    counts and 11 unit counts cannot be compared. Neither unit count present matches (489 61 against 65, 503 43
    against 48), nor either OL count (489 249 OL_L and 251 OL_R in its labelled rows against 266 and 265; 503 230
    and 283 against 305 and 304). The total trial counts match (503 1027 rows against 1027; 489 1000 labelled rows
    against 1000, though its table has 1611 rows, of which rows 1000 to 1610 repeat one row). For 489 the layer
    counts differ from Fig. 5B in L2/3 (7 against 10) and L6 (12 against 13), and the FS and RS counts by the 0.4 ms
    rule are 30 and 31 against 43 and 22. The header's inconsistencies of the paper (634 against 668 units, the
    trial counts of 489 and 503 in different figures) cannot be settled from two animals.
  deviations:
  - Only animals 489 and 503 are in the dataset.
  - For 489 the trials are counted on the first 1000 rows, whose labels and times are usable; the 611 rows after
    them repeat one row of the table.
- claim: fig1lm-staged-modulation
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The spike times are not on the clock of the trials table and the files hold no synchronisation signal.
    At the stored onsets the population rate of 489 shows no trial-locked response (5.8 to 8.7 Hz over -1 to 2 s,
    suppression-window minimum at least 86% of baseline), and trial type cannot be decoded from per-unit spike
    counts (0.46 to 0.52 against a shuffled 95th percentile of 0.52 to 0.55), while lateral position decodes it at
    0.96. The lag that best aligns spikes with onsets grows within the session (4.4 to 12.2 s over the first seven
    windows of 489) and the running-speed correlation gives other lags. An alignment fitted to the neural response
    would set the timings the claim tests, so none was adopted.
