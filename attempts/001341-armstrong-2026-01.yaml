- claim: figs1-running-speed
  outcome: not_reproduced
  notebook: reproduce_armstrong_2026.ipynb
  output: claim:figs1-running-speed
  measured: 5.93
  notes: Animal 503 runs at a mean of 5.93 cm/s over all samples (reading a) and 12.95 cm/s over the samples of
