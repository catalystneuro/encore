  - claim: fig4-ddm-fit
    agrees: true
    outcome: partially_reproduced
    reason: Agree, with low confidence. NDT is out of tolerance under all three early-RT handlings. GDDM BIC is below
      DDM BIC with all RTs kept and with the 0.1 s cutoff, but in 0 of 4 fits with the mixture. The assumption is stated
      and reasonable. The record should say plainly that the GDDM condition, and with it the partial outcome, fails under
      the mixture handling. The mixture weight is at its limit only in the limit-0.1 fits, not in the limit-0.3 fits
      (0.158 to 0.243), which is well above the 4 to 5% of RTs below 0.1 s and suggests the plain DDM misfits the RT
      shape more broadly. The BIC difference of 4.4 at NDT 0.12 s is a deviance difference that puts 0.12 s just outside
      a 95% profile-likelihood interval (p about 0.04), so "narrowly excluded" fits better than "not excluded". Only
      two of four cutoff fits have the leak near the +10 edge.
    response: Outcome kept. The notes now say that the partial outcome rests on the early-RT assumption and that under
      the mixture handling the GDDM condition fails too, so the claim would be not reproduced, and that confidence is
      low. The result and notes now give the mixture weight at its limit of 0.1 in the DDM fits and 0.158 to 0.243 below
      a limit of 0.3, with the verifier's reading that the DDM misfits the RT shape; call 0.12 s narrowly excluded by
      the profile (p about 0.04); and give the cutoff leaks as 6.04 to 9.99, two of four near the edge.
