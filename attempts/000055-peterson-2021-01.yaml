- claim: subjects-days-hemispheres
  outcome: reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:subjects-days-hemispheres
  measured:
  - 12
  - 5
  notes: 12 subjects with 3 to 5 files each, all on days 3 to 7 (subject 01 days 3, 4, 5 and 7;
    subjects 02 and 03 days 3 to 6; subject 05 days 3, 4 and 7; the others days 3 to 7). Five
    subjects (02, 04, 05, 07, 08) have electrodes in the right hemisphere by the sign of the mean x
