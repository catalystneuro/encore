findings:
- kind: metadata_error
  statement: In three files (sub-01 ses-7, sub-04 ses-3, sub-06 ses-3) the ECoG ElectricalSeries has
    starting_time 0 but starts at session_start_time, 8.1 to 8.5 h after the start of the day, while
    the reaches table, the epochs and the pose count from the start of the day. Event-locked ECoG with
    the stored reach times shows no movement response in sub-01 ses-7 and sub-06 ses-3; with the
    offset subtracted it shows the usual one. The ReachEvents timestamps of these files are on the
    ECoG clock, so the two event series of a file disagree by the offset.
- kind: metadata_error
  statement: The full-day files give session_start_time as 19:00 at UTC-05:00, but the sleep labels
    peak in the first six hours of each file and events are fewest 2 to 5 h in, which places the
    start at local midnight. Consistent with the data, not shown.
- kind: selection_undocumented
  statement: The reaches tables hold 211 to 996 events per subject (median 770.5) where the paper
    analysed 151 to 947 (median 640). Many days hold exactly the cap of 200 events, which the Methods
    apply before removing 17.8 +/- 9.9% of events as false positives by visual inspection. The
    dandiset does not say that it holds the events before that removal, nor mark the false
    positives, so the paper's event set cannot be recovered.
- kind: data_missing
  statement: The subjects' sex and age are not in the files or the dandiset metadata.
- kind: metadata_error
  statement: Bimanual_overlap is described as a fraction of the contralateral movement duration, but
    its values (up to 3.83, never above the duration) are in seconds.
- kind: metadata_insufficient
  statement: The reach angle's convention is not described; the values are the angle of the largest
    wrist displacement in image coordinates with y pointing down, so positive angles are downward
    reaches, the reverse of the paper's Figure 2.
- kind: metadata_error
  statement: The pose SpatialSeries are stated in meters with a conversion of NaN, but hold image
    pixels. The ECGL and ECGR series of sub-01 carry the description of the EOG series
    ("Electrooculography for tracking saccades").
- kind: metadata_insufficient
  statement: Electrode location is "unknown" and impedance missing for every electrode, so regions
    can be assigned only with the paper's projection matrices on Figshare. The stored low_freq_R2 and
    high_freq_R2 columns do not say how they were computed (they agree with a recomputation of the
    paper's regression, r = 0.78 to 0.87).
- kind: other
  statement: Electrode groups described as depth occur in seven subjects, where the paper reports
    five; sub-03's 16 depth electrodes have no coordinates and are all flagged bad. In sub-12 the
    electrodes with zero projection weight in the paper's matrices (rows 72 to 79) have coordinates,
    and the electrodes without stored R2 are others (rows 116 to 123).
- kind: other
  statement: In sub-08 ses-4 one reach has a start_time of 86440.3 s, past the end of its 24 h file,
    where its ReachEvents timestamp is 40.3 s. 328 reaches last less than the 0.5 s the Methods keep.
- kind: other
  statement: The ECoG is stored in chunks of one channel, 84375 samples long (54412, 55031 and 55820
    in the three files that start later in the day),
    and its chunk B-tree is spread through each file. Streamed with h5py, looking up the chunks of one
    window costs about 0.4 s per chunk row over the network; the entry reads the chunk index directly.
- kind: code_mismatch
  statement: The paper's regression code splits 80/20 where the Methods say 90/10, scores Delta R2 on
    shuffled test events where the Methods say unshuffled, and runs forward selection on all events,
    including the test events. Here the choices make no difference to the outcomes.
