- claim: regression-r2-max
  outcome: reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:regression-r2-max
  measured: 0.141
  notes: The largest mean test R2 over 40 splits on the 92 tested electrodes is 0.141 (subject 03,
    LFB); 0.137 with the code's 80/20 split. The R2 values stored in the dandiset reach 0.149 (LFB)
    and 0.255 (HFB, subject 04) over all electrodes; on the tested electrodes they correlate with
    the recomputed ones (r = 0.865 for LFB and 0.776 for HFB). All 101200 Huber fits converged.
  deviations:
  - Up to eight electrodes per subject (the good electrodes with the largest precentral weight, 92
    in all), not every electrode, for runtime.
  - 40 random day-balanced splits with 90% training (the Methods) in place of 200; the code's 80%
    split with 10 splits is shown as a variant.
  - Forward selection on all events, as in the code; the Methods do not say whether it used the
    training events only.
