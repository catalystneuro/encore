findings:
- kind: metadata_error
  statement: In three files (sub-01 ses-7, sub-04 ses-3, sub-06 ses-3) the ECoG holds 15.5 to 15.9 h
    and its starting_time is 0, while the reaches table and the pose run on a clock from midnight.
    The ECoG starts 29241 to 30682 s after midnight, the time missing from 24 h; ReachEvents and the
    session start time agree, and the movement response appears only with this shift (S06 day 3,
    precentral HFB +1.98 dB with it, -0.07 dB without). Read with starting_time as given, the event
    times point at the wrong ECoG or past its end.
- kind: other
  statement: The files hold 8088 wrist movement events (211 to 996 per subject), where the data
    descriptor states 6931 verified events and the paper reports 151 to 947 per subject (median 640).
    No event is marked as a false positive or as removed, so the events the paper analysed cannot be
    selected.
- kind: metadata_insufficient
  statement: Reach_angle_degrees is described only as "Reach angle in degrees". It holds the angle of
    the reach in image coordinates (y down, -180 to 180), so upward reaches are negative, while the
    paper's feature is the negated angle folded to -90 to 90.
- kind: metadata_error
  statement: Pose positions are labelled meters but hold pixels (the data descriptor gives pixels; the
    values span hundreds).
- kind: metadata_error
  statement: Bimanual_overlap is described as a fraction of the contralateral movement duration, but
    1708 of 8088 values exceed 1 (up to 3.83); it behaves as seconds.
- kind: metadata_error
  statement: session_start_time is 19:00 at UTC-5 for files that start at local midnight (midnight UTC
    written in another zone), and 03:07 to 03:31 at UTC-5 for the three files whose ECoG starts later.
- kind: other
  statement: 124 of the event segments contain missing (NaN) ECoG samples on every electrode, in 30 of
    55 files.
- kind: data_missing
  statement: The subjects' sex and age, which the paper reports, are not in the files or the archive's
    metadata.
- kind: paper_inconsistency
  statement: Seven subjects have electrode groups described as depth in the files (S01, S02, S03, S09,
    S10, S11, S12), where the paper says five subjects had depth electrodes.
- kind: metadata_insufficient
  statement: The electrode `good` flags differ between a subject's files, and nothing says which list
    the paper used; the paper's code takes the list of each subject's first file.
- kind: methods_unavailable
  statement: The paper's rule for bad ECoG segments ("power <0 dB or with abnormally high power at
    115-125 Hz (>3 SDs) compared with all segments") does not say how a segment's power is
    summarised, in which unit, or whether the SD is over a subject's or all segments, and the
    preprocessing code is not published. Question for the authors. Was the 0 dB test applied to the
    log of the mean power density over frequencies and electrodes in microvolts squared, as assumed
    here? The mean of the log density is below 0 dB for nearly every segment.
- kind: methods_unavailable
  statement: The paper does not say how it judged low-frequency decreases "more spatially widespread"
    than high-frequency increases (Results, Intracortical spectral power, paragraph 2). Question for
    the authors. Was it the number of regions with significant changes or the extent of significant
    bins? The two give different answers here.
