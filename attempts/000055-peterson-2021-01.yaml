findings:
- kind: data_missing
  statement: The dataset holds 8088 wrist movement events without marking the 1157 the paper's Figshare
    epoch files flag as false positives (14.3%, 49 to 186 per subject). The data descriptor says the events
    were visually inspected and false positives removed (6931 events), but the files hold all 8088, so
    the per-subject counts are 211 to 996 against the paper's 151 to 947.
- kind: metadata_error
  statement: In sub-01 ses-7, sub-04 ses-3 and sub-06 ses-3 the ECoG series is 15.5 to 15.9 h long and
    starts at the session start, while the pose and the event times count from midnight; the ECoG's starting_time
    is stored as 0. On the stored clock 237 events lie beyond the end of the ECoG and no movement response
    is seen; shifted by the session start (30682, 30048 and 29241 s) every event falls inside the ECoG
    and the precentral LFB decrease appears (for example -1.69 against +0.39 dB in sub-06 ses-3).
- kind: metadata_error
  statement: Session start times are stored at offset -05:00 (19:00 the day before, or 03:xx), but the
    Sleep/rest labels fall at night (00:00 to 06:00) only when the stored times are read on the UTC clock,
    which makes them midnight. Read with the stated offset, the sleep peak falls at 18:00 to 24:00.
- kind: metadata_error
  statement: The pose series are labelled in meters but hold image pixels (values up to several hundred,
    and the reaches table states pixels).
- kind: metadata_error
  statement: Bimanual_overlap is described as a fraction of the contralateral movement duration, but it
    holds seconds; it equals the Figshare overlap in frames divided by 30, and reaches 3.83.
- kind: metadata_insufficient
  statement: The electrode table's low_freq_R2 and high_freq_R2 columns are described only as R^2 for
    each band, without the model, events or splits behind them; they correlate 0.74 and 0.71 with the
    regression R2 of this attempt.
- kind: metadata_insufficient
  statement: The subjects' sex and age, given in the paper, are not in the files, and the electrode locations
    are all 'unknown'; whether an electrode is a depth electrode can only be read from the group descriptions,
    which give 7 subjects with depth electrodes where the paper reports 5.
- kind: other
  statement: Some ECoG segments around events are zeroed (the preprocessing zeroes high-amplitude artifacts),
    without a mark in the files; 42 of the events kept by a whole-segment PSD rejection have zeroed precentral
    ECoG in the 0 to 0.5 s window, with band power near -300 dB, enough to change means over events.
- kind: other
