- claim: angle-bimodal
  outcome: not_reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:angle-bimodal
  notes: Over all events the folded angle has its two most populated 15-degree bins at 60 to 75 and
    75 to 90 degrees (1304 and 1605 of 8088 events). The downward outer bin holds 514, more than its
