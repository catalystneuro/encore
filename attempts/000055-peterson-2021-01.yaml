- claim: group-pattern-rois
  outcome: reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:group-pattern-rois
  notes: Mean over subjects of the subject medians, 0 to 0.5 s. LFB and HFB change by -0.549 and
    0.487 dB in the precentral, -0.793 and 0.596 dB in the postcentral and -0.879 and 0.280 dB in
    the inferior parietal region; the summed absolute change in these (1.036 to 1.389 dB) exceeds
    every temporal region (at most 0.337 dB). LFB is below 0 in 12, 10 and 12 of the 12 subjects in
    these regions. The paper's statistical masking was not applied. The projection matrices match
    the electrodes (projection-link), so the regional values rest on the dandiset's ECoG.
  deviations:
  - Five events per file (seeded subsample, 15 to 25 per subject after rejection) in place of all
    events, for runtime.
  - Electrodes carrying 99% of every region's weight; the rest of the weight is left out and the
    weights renormalised.
  - No bootstrap masking of non-significant bins; the criterion uses signs and magnitudes.
  - Spectral power from 4 s windows of the continuous ECoG with the code's Morlet parameters, not
    MNE on the paper's 10 s segments.
