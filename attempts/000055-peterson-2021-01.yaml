  outcome: reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:regression-r2-sensorimotor
  notes: On the stored R2 projected onto the regions and averaged over subjects, the highest region
    is the precentral for LFB and the postcentral for HFB, and the frontoparietal mean exceeds the
    temporal mean in both bands (LFB -0.0061 against -0.0182; HFB -0.0084 against -0.0171). The
    projected values are all near or below 0, as only 24 (LFB) and 25 (HFB) electrodes have a stored
    R2 above 0.05. Of the 20 good electrodes with the largest stored R2, 19 (LFB) and 16 (HFB) have
    their largest projection weight in a frontoparietal region, closer to the paper's statement
    than the regional means; the LFB ones come from five subjects, 9 from subject 01.
  deviations:
  - Judged on the R2 values stored in the dandiset, whose computation the files do not describe, not
    on a recomputation; the recomputation covers precentral electrodes only and agrees with the
    stored values there (regression-r2-max).
  - The paper shows electrodes on a brain; here the stored R2 is projected onto the eight regions.
