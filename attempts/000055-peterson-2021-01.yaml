- claim: group-pattern-rois
  outcome: reproduced
  notebook: reproduce_peterson_2021.ipynb
  output: claim:group-pattern-rois
  notes: Mean over subjects of the subject medians, 0 to 0.5 s. LFB and HFB change by -0.549 and
    0.487 dB in the precentral, -0.793 and 0.596 dB in the postcentral and -0.879 and 0.280 dB in
