inputs:
- what: The paper's projection matrices from electrodes to AAL regions (aal_<subject>_elecs2ROI.csv)
    and the regions' left-hemisphere centroids (aal_<subject>_ROIcentroids_Lside.csv), Figshare item
    "ROI projection matrices and labels", version 1. Used for every regional measure and for the
    choice of electrodes in the regression.
  source: doi:10.6084/m9.figshare.12114408.v1
- what: The paper's analysis code, read for the method choices the Methods leave open (Morlet
    parameters, baseline, band medians, projection, folding of the reach angle, regression design,
    forward selection, splits and Delta R2). The Kruskal-Wallis p-values printed by
    Plot_banded_power_Fig5.ipynb are shown as reference only.
  source: https://github.com/BruntonUWBio/naturalistic_arm_movements_ecog at commit
    04c6faf2f219586fa834d10c614ef48a694cec55
