findings:
- kind: metadata_insufficient
  statement: The files give no days in vitro and no plating date (each says that days in vitro are unknown
    and that the subject age is the donor's E18), only recording dates. No result can be placed on the
    paper's DIV axis, which blocks the claims whose result is a DIV (onset at 2 to 3 DIV, power law at
    about 15 DIV, the shift near 10 DIV). The avalanche claim (about 15 DIV) fails whatever the DIV of the
    first recording, so it is not reproduced, not blocked. The DIV of each dish's first recording
    would settle it.
- kind: metadata_insufficient
  statement: Spike times are given from the first detected spike, not from the recording start, whose
    frame is not stored. Time bins can only be aligned to the first spike.
- kind: selection_undocumented
  about: data
  statement: The dataset holds 129 recordings, 17 of them with a mean rate at or below 0.03 Hz, the paper's
    exclusion rate, and does not mark which recordings the paper analysed. Near-silent recordings occur
    within series (23317 on days 3 and 4, 23312 on day 22, 23302 on days 7 and 8) and at the ends of 23282
    and 23302.
- kind: other
  about: data
  statement: Six recordings of dish 23311 (days 8 to 13) hold 338 to 702 electrodes and one of 23280 (day
    6) holds 525, where the other recordings hold 956 to 1012; the dataset does not say why.
- kind: methods_unavailable
  statement: Question for the authors. How is the exponential decay rate b of the variance spectrum computed
    (the fitted formula, what x is, which ranks are fitted, and whether the error is on log or raw values)?
    With f(x) = a x^-c exp(-b x), x the PC rank and all positive eigenvalues, b has a median of 0.0055 (S1,
    error on log values) and reaches 0.1 only in two near-silent recordings; with the error on raw values
    76 to 79% of the values sit at the bound 0 and two active recordings reach 0.1 (0.46 and 0.32). So the 0.1 boundary between the Power-law and Exponential groups puts nearly every
    recording in the Power-law group; fits to the top 30 or 100 ranks, or with x as rank over the number
