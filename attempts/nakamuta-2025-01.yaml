    S2, p < 0.0001); the largest fraction of electrodes active in one bin also rises (0.301, p 0.0007;
    0.253, p 0.0072); under O2 and O3, against each dish's DIV, 0.462 and 0.269 (S1) and 0.373 and 0.232
