- claim: figs5f-nonlinear-no-better
  outcome: blocked
  blocked_by: not_runnable
  notes: The rsLDS package the paper's code uses, ssm (github.com/lindermanlab/ssm at commit eb6c8aa33e5311d3564075807dec340759dd8081,
    or its only PyPI release, 0.0.1), cannot be installed in the entry's locked environment. Its setup.py imports
    numpy and Cython but declares no build dependencies, so `uv pip install`, which the registry uses to build the
    environment, fails with build isolation ('No module named Cython'). Outside the entry, with build isolation
    off, it installs. A timing run there, not part of the notebook, gave about 3 h of single-core compute for the
    criterion's design on the 4 Monkey J sessions (5 folds, K = 1 to 5, 10 Laplace-EM iterations). It gave about
    35 h for Monkey G, most of it sessions 2 and 4 (110 to 115 units above 0.5 Hz). Monkey J alone would fit in
    two notebooks of about 20 minutes each on 4 cores if the package could be installed.
