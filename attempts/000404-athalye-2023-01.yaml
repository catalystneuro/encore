  notes: 'Under both nulls (1000 draws), the Full Dynamics Model''s distances exceed the null (LME z = 25.4 to 26.0
    for G, 15.5 to 15.7 for J; Mann-Whitney p < 0.05 in 9 of 9 and 4 of 4 sessions). Both No Dynamics models show
    no difference (LME p 0.83 to 0.999; no session significant). Decoder-null dynamics show none for Monkey G (p
    = 0.18) or in any session, but Monkey J''s LME finds one (effect 0.016, z = 2.30 to 2.33, p = 0.020 to 0.021,
    mean normalized distance 1.09), so that absence is not reproduced. The LME here codes the simulation as 1 and
    the null as 0, so its z has the opposite sign to the paper''s. With Monkey J''s velocity gain fixed to the summed
    5 ms gain, the result is the same: the decoder-null LME finds a difference (p = 0.0059 and 0.0051) and the other
