- claim: fig6c-dynamics-reduce-input
  outcome: reproduced
  assumed: true
  notebook: ofc_simulations.ipynb
  output: claim:fig6c-dynamics-reduce-input
  notes: The Full Dynamics Model needs less input than the No Dynamics Model in every session (ratio 0.44 to 0.91;
    Wilcoxon p < 0.05 in 9 of 9 and 4 of 4 sessions); LME z = -11.27 (p = 1.87e-29, N = 432) for G and -14.94 (p
    = 1.87e-50, N = 192) for J. Every simulated trial ends within 0.365 cm of its target. With Monkey J's velocity
    gain fixed to the summed 5 ms gain (sensitivity reading), the effect holds (LME z = -16.61, Wilcoxon p < 0.05
    in 4 of 4 sessions).
  deviations:
  - Assumption for Monkey J. The paper builds Monkey J's 100 ms decoder from the PPF's parameters, not in the files;
    here its 100 ms cursor update is the least-squares update of the decoder state over each 100 ms bin (variance
    accounted for above 99%). Monkey G's is recovered exactly. The notebook also shows Monkey J with the velocity
    gain fixed to the summed 5 ms gain and the velocity rows of the cursor dynamics refitted.
  - The terminal weight 100 is the code's (behavior_co_obs.py); the dynamics are in-sample ridge fits on counts
    per bin.
- claim: fig6d-decoder-null-dynamics-no-saving
  outcome: reproduced
  assumed: true
  notebook: ofc_simulations.ipynb
  output: claim:fig6d-decoder-null-dynamics-no-saving
  notes: Claim of absence, judged on the paper's tests. The LME finds no difference (G z = -0.00, p = 0.998; J z
    = 0.02, p = 0.988) and no session's Wilcoxon test does (smallest p 0.069); the input ratios are 0.998 to 1.003.
    With Monkey J's velocity gain fixed to the summed 5 ms gain (sensitivity reading), the LME still finds no difference
    (p = 0.995) but Monkey J session 1's Wilcoxon test does (p = 0.0016), so under that reading the absence holds
    only in part; the fitted 100 ms update, which accounts for more of the 100 ms velocity (0.995 to 0.998 against
    0.984 to 0.994), stays the adopted reading.
  deviations:
  - As fig6c-dynamics-reduce-input.
