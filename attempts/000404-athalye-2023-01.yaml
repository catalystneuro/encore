- claim: fig4c-dynamics-predict-activity-given-command
  outcome: reproduced
  notebook: reproduce_athalye_2023.ipynb
  output: claim:fig4c-dynamics-predict-activity-given-command
  measured:
  - 0.1655
  - 0.2492
  - 0.1624
  - 0.2418
  - 0.1631
  - 0.2391
  notes: Scored as the code scores it, R2 is 0.1655 and 0.2492 (full), 0.1624 and 0.2418 (command left out), 0.1631
    and 0.2391 (condition left out), all within 10%, each beating the shuffle scored on the same pairs with p <
    0.001 in 9 of 9 and 4 of 4 sessions and pooled. The shuffle's pooled 95th percentiles, 0.1282 and 0.1963, match
    Table S1's 0.130 and 0.196. On pairs whose command at t is analysed the tests are the same and the values within
    tolerance (full 0.1705 and 0.2574). On all pairs the tests are the same, the command left-out model beating
    the shuffle in 9 of 9 and 4 of 4 sessions, but the full and condition left-out R2 (0.1942 and 0.2913, 0.1916
    and 0.2808) are outside tolerance. Reading (a) of the shuffle ridge parameter (chosen on one shuffled dataset,
    200 shuffles) leaves every full-model test significant.
  deviations:
  - 'The scored pairs are taken from the code: each model''s test pairs whose commands at t and t-1 are both below
    the 95th percentile of magnitude (generalization_plots.check_ix_lo, lines 588-593, "Remove mag command 4"),
    with the full model and every shuffle model scored on exactly those pairs (generalization_plots.plot_loo_r2_overall,
    lines 2785-2867). The readings on pairs whose command at t (or t-1) is analysed and on all test pairs are shown,
    each with the shuffle on the same pairs.'
  - Commands, the decoder-null space and the conditioning on the command use the recovered decoder gain (see figs1b-conditions-per-command).
  - The left-out command model leaves out pairs whose first or second bin issues the command (Figure S4A legend)
    and is tested on pairs whose second bin issues it.
  - Folds are random over pairs of bins, stratified by task, with a fixed seed; the shuffle models use the real
    data's ridge parameter (reading b) with 1000 shuffles, reading (a) is shown with 200. As in the code (generalization_plots.predict_shuffles_v2_with_cond,
    one session-wide shuffle index per shuffle passed with the fold test indices), each shuffle permutes the whole
    session before the folds are split.
