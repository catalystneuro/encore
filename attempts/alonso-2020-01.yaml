outcomes:
- claim: deposit-models
  outcome: not_reproduced
  notebook: reproduce_alonso_2020.ipynb
  output: claim:deposit-models
  measured:
  - 1.246
  - 0.192
  - 0.239
  notes: The deposit holds the Java model, the Python scripts, one initial-condition file and 38
    parameter sets (the paper and the Dryad description say 36). Of the 21 model names in the
    Methods, 13 are found as printed, 2 with the letter O read as the digit 0 (OSHNMD is 0SHNMD,
    B7SDOL is B7SD0L), 1 at the character the text cannot render (4X6W66), 1 with two characters
    swapped (KNMLBC is KMNLBC), and 4 are absent (Q8FBN1, G81PUL, G7EOZ8, SAXT8Y). Every Q10 is
    within [1, 2] for conductances (largest 1.4985 intrinsic, 1.499 synaptic) and [1, 4] for
    time scales (largest 3.973 and 3.997). At 10 C (20 s, first 10 s dropped) all 38 networks are
    triphasic, but only 3 of 38 models have every value within tolerance; 10 of 38 are within
    1 +- 0.1 Hz in every cell, 17 within 0.2 +- 0.02 for PD duty cycle, 14 within 0.25 +- 0.025
    for LP and PY. The measured values are the means over models and cells of burst frequency
    (1.246 Hz, range 0.987 to 1.627), PD duty cycle and LP and PY duty cycle. With the 0.20 LP and
    PY target of the variant, 0 of 38. 3 is below the criterion's 18.
  deviations:
  - The 38 deposited models are used; the files do not say which 36 the paper means.
  - The model is simulated with a numba port of the deposited Java, which matches the Java's
    voltages to 3e-9 mV over 3 s (4X6W66 at 18 C; the notebook compiles and runs the Java when a
    compiler is present).
  - Burst frequency and duty cycle are per-cycle means, with spikes as upward crossings of -20
    mV and bursts formed with the Methods' 200 ms threshold; the paper gives no spike threshold.
- claim: fig1c-frequency-q10-phase-constant
  outcome: partially_reproduced
  notebook: reproduce_alonso_2020.ipynb
  output: claim:fig1c-frequency-q10-phase-constant
  measured:
  - 1.927
  notes: Model 4X6W66, 16 temperatures, 40 s each with the first 10 s dropped and 30 s averaged.
    Frequency Q10 is 1.927 (fit), 1.982 (end points) and 1.937 (f20 over f10), within 2 +- 0.2
    under every reading; the three cells' frequencies differ by at most 0.8% at any temperature.
    Constancy fails under both readings because of the LP duty cycle, which spans 0.11 of a cycle
    (bound 0.1) and changes by up to 34% from its 10 C value (bound 20%); PY duty cycle changes by
    up to 21%. All other duty cycles and phases stay within 0.1 of a cycle (PD offset range 0.05,
    LP onset 0.038, LP offset 0.08, PY onset 0.023, PY offset 0.047). The network is triphasic at
    all 16 temperatures.
  deviations:
  - Simulations of 40 s with the first 10 s dropped (the Methods drop 10 s when scoring and the
    Figure 1 legend averages over 30 s; the length of the run is not stated).
- claim: fig1s1-three-models
  outcome: not_reproduced
  notebook: reproduce_alonso_2020.ipynb
  output: claim:fig1s1-three-models
  notes: In WWZ3CN, FGFKQS and 71G6LA the frequency rises from 10 to 25 C in every cell (Q10 by the
    fit 2.05, 1.99, 1.71) and the network is triphasic at all 16 temperatures, but none meets
    either reading of constancy. Largest ranges over temperature 0.171 (WWZ3CN, LP offset), 0.121
    (FGFKQS, LP duty cycle), 0.102 (71G6LA, PY offset) of a cycle; largest changes from 10 C 34%,
    43% and 24%. 71G6LA misses reading (i) by 0.002. FGFKQS has the same maximal conductances as
    4X6W66, with different Q10 values, so the statement's "different maximal conductances" holds
    for two of the three.
  deviations:
  - The same 40 s simulations as fig1c-frequency-q10-phase-constant, at its 16 temperatures (the
    supplement's legend was not read).
- claim: all-models-compensated
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_alonso_2020.ipynb
  output: claim:all-models-compensated
  measured: 36
  notes: 36 of the 38 deposited models are triphasic at all 16 temperatures. ED50XO fails at 19
    and 21 C (all cells irregular bursting) and MAXTTP at 10 and 14 C (LP irregular bursting).
    With the order required in every cycle (variant), 35 of 38. The deposit holds more than one Q10
    set for 9 of its 27 distinct sets of maximal conductances (20 models), and all 20 are
    compensated; the other 18 sets have one Q10 set each, so "multiple sets for every G" can be
    shown only for those 9. The count 36 of 38 meets the partial bound of 34; whether the paper's
    36 are these 36 cannot be told from the files. The question of how the firing order is tested
    is for the paper's authors (finding 6).
  deviations:
  - Triphasic is read as the three cells' mean burst frequencies within 5% and the median LP
    burst onset phase before the median PY onset phase, both within the PD cycle; the Methods say
    "fired in the right order" without saying how it is tested. Assumed as the plainest reading;
    the every-cycle variant gives 35 in place of 36.
