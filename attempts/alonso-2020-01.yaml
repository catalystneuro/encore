- claim: fig8-up-down-ramps
  outcome: blocked
  blocked_by: too_large
  notebook: ramps.ipynb
  output: claim:fig8-up-down-ramps
  notes: The criterion is met when either ramp reading gives a count within 34 +- 3. The first
    reading (10 to 35 C and back over 60 min) was run, and 22 of 38 models are similar on the two
    legs over 10 to 25 C (9 at a 5% bound, 28 at 20%). Six models diverge numerically on this ramp
    (G7P2WE, INPO74, J9U8SQ, NJP4RT, R00977, SJR46Y), MAXTTP fires no spike on the down leg below
