  assumed: true
  notebook: reproduce_alonso_2020.ipynb
  output: claim:fig6-crash-different-mechanisms
  notes: FGFKQS and 71G6LA are triphasic at 10 and 25 C. At 30 C (40 s, last 30 s), 71G6LA's PD is
