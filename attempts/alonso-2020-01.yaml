findings:
- kind: data_missing
  severity: major
  notebook: reproduce_alonso_2020.ipynb
  output: finding-model-names
  statement: Four models the Methods name are not in the deposit, Q8FBN1 (Figure 6, figure
    supplement 1) and G81PUL, G7EOZ8 and SAXT8Y (Figure 7). Three of the five models of Figure 7
    and one of the eight of its supplement cannot be simulated.
- kind: metadata_error
  severity: minor
  notebook: reproduce_alonso_2020.ipynb
  output: finding-model-names
  statement: Four models are filed under names that differ from the Methods. OSHNMD and B7SDOL are
    0SHNMD and B7SD0L (digit 0 for the letter O), KNMLBC is KMNLBC (two letters swapped), and the
    Figure 1 model, printed with a symbol in its second place, is 4X6W66. Each is the only close
    match among the 38 files.
- kind: other
  about: data
  severity: minor
  notebook: reproduce_alonso_2020.ipynb
  output: finding-shared-conductances
  statement: The deposit holds 38 parameter sets, where the paper and the Dryad description say 36,
    and nothing in the files marks which 36 the paper studied. The 38 share 27 distinct sets of
    maximal conductances; 9 of them carry two or three Q10 sets.
- kind: other
  about: data
  severity: minor
  notebook: reproduce_alonso_2020.ipynb
  output: finding-frequency-at-10C
  statement: At 10 C the deposited models burst at 1.25 Hz on average (0.99 to 1.63 Hz), and 10 of
    38 are within 10% of the 1 Hz target the Methods give for the control rhythm; all 38 are
    triphasic.
- kind: other
  about: data
  severity: minor
  notebook: reproduce_alonso_2020.ipynb
  output: finding-diverges-at-high-temperature
  statement: The deposited integrator (RK4, dt = 0.05 ms, the deposited initial conditions)
    returns NaN for 6 of the 38 models at some temperatures from 26 to 35 C (29 of 380 runs), and
    for the same 6 on the 10 to 35 C ramp. The deposited Java does the same (G7P2WE at 35 C gives
    NaN after 0.1 s). Results at those temperatures cannot be computed at the paper's time step.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) What voltage threshold detects a spike? This
    attempt uses upward crossings of -20 mV. (2) How is "fired in the right order" tested for the
    triphasic class? This attempt compares the median LP and PY burst onset phases within the PD
    cycle; requiring the order in every cycle changes the compensated count from 36 to 35 of 38.
    (3) How is the lag d between spike onset and the -50 mV crossing formed? This attempt takes the
    median over spikes of the time from the last upward crossing. (4) How were the temperature
    ramps run, and were high-temperature states (Figures 6 and 7) reached from a ramp or from the
    initial conditions? (5) Which 36 of the 38 deposited models are the paper's? These choices
    enter every classification-based outcome marked as assumed.
