- claim: all-models-compensated
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_alonso_2020.ipynb
  output: claim:all-models-compensated
  measured: 36
  notes: 36 of the 38 deposited models are triphasic at all 16 temperatures. ED50XO fails at 19 and 21 C (all cells
    irregular bursting) and MAXTTP at 10 and 14 C (LP irregular bursting). With the order required in every cycle
    (variant), 35 of 38. The deposit holds more than one Q10 set for 9 of its 27 distinct sets of maximal conductances
    (20 models), and all 20 are compensated; the other 18 sets have one Q10 set each, so "multiple sets for every
    G" can be shown only for those 9. The count 36 of 38 meets the partial bound of 34; whether the paper's 36 are
    these 36 cannot be told from the files. The question of how the firing order is tested is for the paper's authors
    (finding 6). MAXTTP, one of the two that fail, is a model the paper shows (Figure 2, figure supplement 1), so
    not every model the paper uses passes.
  deviations:
  - Triphasic is read as the three cells' mean burst frequencies within 5% and the median LP burst onset phase before
    the median PY onset phase, both within the PD cycle; the Methods say "fired in the right order" without saying
    how it is tested. Assumed as the plainest reading; the every-cycle variant gives 35 in place of 36.
