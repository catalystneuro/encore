- claim: fig2-lp-spike-amplitude-threshold
  outcome: reproduced
  notebook: voltage_distributions.ipynb
  output: claim:fig2-lp-spike-amplitude-threshold
  notes: G7P2WE, LP, 26 temperatures from 10 to 25 C, 30 s at dt = 0.001 ms with the last 10 s kept (5 x 10^5 samples,
    as the Methods say). The amplitude falls under both readings (peak minus trough 56.9 to 26.2 mV; upper envelope
    16.7 to -1.8 mV; Spearman -1.000 each). The threshold under reading (a) stays near -28 mV (-27.8 to -27.5 mV,
    with a dip to -28.6 mV between; Spearman -0.197). Under reading (b), located as the upper edge of the densely
    occupied part of the distribution below -20 mV, the threshold rises from -36.1 to -26.5 mV at 5% of the largest
    occupancy (Spearman 0.997), from -38.2 to -29.1 mV at 10% (0.996) and from -33.0 to -20.0 mV at 2% (0.996, at
    the search limit at 2 of 26 temperatures). Amplitude (a) and threshold (b) meet the criterion. Where the spike
    region begins is assumed; the question is for the paper's authors (finding 6). The outcome rests on this rule.
    LP fires 114 spikes in the analysed 10 s at 10 C and 433 at 25 C; more spikes put more occupancy just above
    the densely occupied part, which could raise the edge with no change in the per-spike threshold, which reading
    (a) finds flat; at 10 C reading (b) lies 8.4 mV below reading (a), at 25 C 1.0 mV above it.
  deviations:
  - 26 of the Methods' 101 temperatures (steps of 0.6 C), as 101 at dt = 0.001 ms would take about 40 min.
  - 'Threshold reading (b) is located by an assumed rule (pyloric.spike_region_start): the highest voltage below
    the -20 mV spike detection level whose occupancy, smoothed over 1 mV, is at least 5% of the largest occupancy;
    above it the cell passes only during spikes. Neither the paper nor the claims file says how the point is found.
    The fractions 2% and 10% give the same outcome.'
  assumed: true
