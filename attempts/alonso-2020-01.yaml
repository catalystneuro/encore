- claim: fig4-currentscapes-reorganize
  outcome: not_reproduced
  notebook: reproduce_alonso_2020.ipynb
  output: claim:fig4-currentscapes-reorganize
  notes: WWZ3CN, 3 s at 10 and 25 C (3 and 9 bursts per cell). The PD leak current has no inward
    share inside the bursts at either temperature (0.0000 at start and end; all leak reversal
    potentials are -50 mV, and V stays above them between the first and last spike), so its part
    cannot hold. The PD A share at the start over the end of the burst is 1.278 at 10 C, outside
    0.8 to 1.25, and 1.348 (thirds) or 1.385 (20%) at 25 C. The KCa share at the end of the burst
    rises in LP (+0.29, +0.34) and PY (+0.22, +0.25) but falls in PD (-0.21, -0.20). No part of the
    criterion holds under either reading.
  deviations:
  - A burst runs from its first to its last spike; with the leak inward only below -50 mV, a burst
    that includes the slow wave around it would be another reading, not named in the criterion
    and not run.
- claim: currentscapes-dominant-currents
  outcome: reproduced
  notebook: reproduce_alonso_2020.ipynb
  output: claim:currentscapes-dominant-currents
  measured: 0.993
  notes: 38 models, 3 cells, 10, 15, 20 and 25 C, 26,868 spikes. Na has the largest inward share in
