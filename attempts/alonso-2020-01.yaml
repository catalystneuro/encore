- claim: deposit-models
  outcome: not_reproduced
  notebook: reproduce_alonso_2020.ipynb
  output: claim:deposit-models
  measured:
  - 1.246
  - 0.193
  - 0.234
  notes: The deposit holds the Java model, the Python scripts, one initial-condition file and 38 parameter sets
    (the paper and the Dryad description say 36). Of the 21 model names in the Methods, 13 are found as printed,
    2 with the letter O read as the digit 0 (OSHNMD is 0SHNMD, B7SDOL is B7SD0L), 1 at the character the text cannot
    render (4X6W66), 1 with two characters swapped (KNMLBC is KMNLBC), and 4 are absent (Q8FBN1, G81PUL, G7EOZ8,
    SAXT8Y). Every Q10 is within [1, 2] for conductances (largest 1.4985 intrinsic, 1.499 synaptic) and [1, 4] for
    time scales (largest 3.973 and 3.997). At 10 C (20 s, first 10 s dropped) all 38 networks are triphasic, but
    only 3 of 38 models have every value within tolerance; 10 of 38 are within 1 +- 0.1 Hz in every cell, 17 within
    0.2 +- 0.02 for PD duty cycle, 14 within 0.25 +- 0.025 for LP and PY. The measured values are the means over
    models and cells of burst frequency (1.246 Hz, range 0.987 to 1.627), PD duty cycle and LP and PY duty cycle.
    With the 0.20 LP and PY target of the variant, 0 of 38. 3 is below the criterion's 18.
  deviations:
  - The 38 deposited models are used; the files do not say which 36 the paper means.
  - The model is simulated with a numba port of the deposited Java, which matches the Java's voltages to 3e-9 mV
    over 3 s (4X6W66 at 18 C), to 0.06 mV over 3 s (J9U8SQ at 25 C), and gives NaN at the same step as the Java
    where the integration diverges (G7P2WE at 35 C, step 2041; J9U8SQ at 34 C, step 8273); the notebook compiles
    and runs the Java when a compiler is present.
  - Burst frequency and duty cycle are per-cycle means, with spikes as upward crossings of -20 mV and bursts formed
    with the Methods' 200 ms threshold; the paper gives no spike threshold.
