- claim: figs2-ramp-largest-isi
  outcome: reproduced
  notebook: ramps.ipynb
  output: claim:figs2-ramp-largest-isi
  notes: PLKTEM, 10 to 25 C over 60 min. The median per-cycle largest ISI falls in every 4 min (1
    degree) window with no increase in all three cells (PD 0.604 to 0.299 s, LP 0.613 to 0.301 s,
    PY 0.522 to 0.251 s; Spearman -1.000 each). In 1 min windows the Spearman correlations are
    -0.998, -0.998 and -0.994, with 7, 9 and 22 increases between successive windows.
  deviations:
  - The deposit has no ramp code; the temperature is changed linearly and the temperature factors
    updated every 1 ms, from the deposited initial conditions at 10 C.
- claim: figs3-duty-cycle-variable-across-models
  outcome: reproduced
  notebook: reproduce_alonso_2020.ipynb
  output: claim:figs3-duty-cycle-variable-across-models
  measured: 1.0
  notes: On the criterion's variant (per-burst LP duty cycles from the 16 fixed temperatures, 30 s
    each), all 703 pairs of the 38 models differ at p < 0.05 (two-sample Kolmogorov-Smirnov),
    including every pair that shares its maximal conductances (largest p 0.025, EF84RN against
    FGFKQS). The mean LP duty cycle falls with temperature in 23 models (Spearman below -0.5),
    rises in 3 and neither in 12. The main reading, the 60 min ramp of every model, was not run.
  deviations:
  - The ramp reading (38 models, 3600 s each) would add about 35 min to a notebook (measured on a
    subset at about 67 simulated seconds per second on 4 processes) and was not run; the outcome
    rests on the variant reading the criterion names.
  - 703 pairs of 38 models, where the criterion counts 630 pairs of 36.
- claim: fig2-lp-spike-amplitude-threshold
  outcome: partially_reproduced
  notebook: voltage_distributions.ipynb
  output: claim:fig2-lp-spike-amplitude-threshold
  notes: G7P2WE, LP, 26 temperatures from 10 to 25 C, 30 s at dt = 0.001 ms with the last 10 s
    kept (5 x 10^5 samples, as the Methods say). The amplitude falls under both readings (peak
    minus trough 56.9 to 26.2 mV; upper envelope 16.7 to -1.8 mV; Spearman -1.000 each). The
    threshold under reading (a) stays near -28 mV (-27.8 to -27.5 mV, with a dip to -28.6 mV
    between; Spearman -0.197), so it does not depolarize steadily. Reading (b), where the
    distribution's spike region begins, was not computed, as neither the paper nor the claims file
    says how that point is located; it could change the outcome to reproduced.
  deviations:
  - 26 of the Methods' 101 temperatures (steps of 0.6 C), as 101 at dt = 0.001 ms would take
    about 40 min.
  - Threshold reading (b) not computed.
