- claim: fig5-a-to-kca-tradeoff
  outcome: reproduced
  notebook: reproduce_alonso_2020.ipynb
  output: claim:fig5-a-to-kca-tradeoff
  notes: FGFKQS (the Methods' model), the 20 ms after the last spike of each PD burst, 16
