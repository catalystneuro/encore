- claim: fig8b-matching-closer
  outcome: reproduced
  assumed: true
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig8b-matching-closer
  measured:
  - 1.42
  - 3.06
  - 0.22
  notes: Under O4 (a), with each partition's precision scaled to that of the partition mean, the
    non-matching minus matching difference is 1.42 (BCa 95% CI 1.19 to 1.64) in N-PPC, 3.06 (1.73
    to 4.13) in J-MC and 0.22 (-0.10 to 0.67) in J-PPC for O1 (a) and O3 (a); over O1 and O3 the
    values are 1.42 to 1.71, 2.99 to 3.38 and 0.19 to 0.22, all within tolerance, with N-PPC and J-MC
    CIs above 0 and the J-PPC CI including 0 (also by the percentile CI, in all 18 readings). Under
    O4 (b), and the unscaled variant O4 (a1), the sign pattern is the same but the values are about
    a fifth as large (N-PPC 0.28 to 0.36, J-MC 0.51 to 0.68), outside tolerance, which would be
    partially reproduced. One N-PPC unit with zero residual variance in a partition is dropped.
  deviations:
  - Assumed that the per-partition noise passed to rsatoolbox is the precision of the partition
    mean, the single-trial precision times the 5 trials per condition in each partition. The
    Methods say the toolbox (ref 57) incorporates the noise covariances of both folds, which is its
    list-of-noises branch, and the toolbox's calc_rdm_crossnobis documents that this list must hold
    the precision of the mean of each fold. The paper does not say how it computed the noise, and
    the scaling changes the values about fivefold; the unscaled result is shown.
  - Units with zero residual variance in a partition make the noise covariance singular and are
    left out of that session's distance (one N-PPC unit); a standard choice.
- claim: fig8a-npcc-index-distinct
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig8a-npcc-index-distinct
  notes: In the N-PPC distances averaged over 10 sessions, under every reading of O1, O3 and O4, the
    index-middle and index-ring distances exceed the middle-ring distance in both hands (O1 a, O3 a,
    O4 a, right 2.16 and 2.96 against 0.62, left 1.30 and 2.23 against 0.57). In single sessions the
    pattern holds in both hands in 7 to 10 of 10 sessions. The outcome does not depend on the
    noise scaling assumed for fig8b-matching-closer, as all readings agree.
  deviations:
  - The MDS of the figure is drawn by classical MDS of the clipped squared distances and aligned by
    Generalized Procrustes with scaling; it is shown only and does not decide the outcome.
- claim: fig8e-hand-ccgp
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig8e-hand-ccgp
  notes: In N-PPC (943 neurons under O1 a), J-PPC (315) and J-MC (252), under every reading of O1, O6
    and O7, no one of 1001 shuffles reaches the hand CCGP (p = 1/1002). Hand CCGP is 0.970 to 0.990
    in N-PPC and J-PPC and 0.860 to 0.870 in J-MC, against shuffle means near 0.50, and at least
    0.913 of the hand accuracy on the same pseudo-population, so close by both O9 (a) and (b).
  deviations:
  - The shuffle permutes the ten condition labels across pseudo-trials and recomputes CCGP; the
    paper says only that labels were shuffled 1001 times. For O6 (b) each shuffle uses a new random
    matching of trials.
  - Standard accuracy is computed on the same pseudo-population (assumption, see
    jppc-finger-ccgp-low); the per-session variant does not change this outcome, as hand CCGP is
    above 0.9 of either.
- claim: fig8e-finger-ccgp
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:fig8e-finger-ccgp
  notes: In N-PPC and J-MC, under every reading, no shuffle reaches the finger-type CCGP (p =
    1/1002). N-PPC CCGP is 0.918 to 0.954, at least 0.925 of its standard accuracy. J-MC CCGP is
    0.735 to 0.790, 0.770 to 0.823 of the within-hand accuracy (O8 a) and 0.775 to 0.857 of the
    accuracy over both hands (O8 b). Closeness holds for both arrays under O9 (b), a ratio above
    0.55, and fails for J-MC under the 0.9 margin of O9 (a). The criterion asks for one reading, so
    the claim is reproduced; under O9 (a) it would be partially reproduced.
  deviations:
  - As for fig8e-hand-ccgp, the shuffle scheme and the population of the standard accuracy are
    choices the paper does not state.
- claim: jppc-finger-ccgp-low
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_guan_2022.ipynb
  output: claim:jppc-finger-ccgp-low
  measured:
  - 38.0
  - 85.0
  notes: J-PPC finger-type CCGP is 0.290 to 0.380 over the readings (shuffle mean 0.20), far below
    the within-hand accuracy on the pseudo-population (0.828 to 0.890). The permutation p is below
    0.001 in one of eight readings (O1 b, O6 a, linear SVM, p = 1/1002, CCGP 0.380, within-hand
    0.850) and 0.002 to 0.038 in the others, so the paper's p below 0.001 holds only in that
    reading. There the CCGP is within tolerance of 36% and the within-hand accuracy is outside the
    tolerance of 65%, with CCGP below 0.9 of it, which the criterion calls partially reproduced. In
    the per-session variant of standard accuracy J-PPC within-hand accuracy is 0.690 (LDA) and
    0.685 (SVM), within tolerance, and the same reading would be reproduced.
  deviations:
  - Assumed that the standard (within-hand) accuracy is computed on the same pseudo-population as
    CCGP, since the Methods (Compositionality of finger representations) call it an upper bound on
    CCGP, which holds only for the same neurons. The Methods' offline classification trains a
    separate classifier per session, and that reading, shown as a variant, gives values near the
    paper's 65% and would change the outcome to reproduced.
  - The shuffle scheme of the permutation test is not stated; condition labels are permuted across
    pseudo-trials. The J-PPC p-values lie near the 0.001 bound, so the scheme can matter.
