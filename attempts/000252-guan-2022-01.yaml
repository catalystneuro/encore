- claim: tenfinger-recording-counts
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:tenfinger-recording-counts
  measured:
  - 10
  - 2
  - 100
  - 111.4
  - 159.5
  - 129.5
  notes: The dandiset has 10 sessions of participant N and 2 of J, each of 100 trials (10 per
    condition). Before the 0.5 Hz exclusion N-PPC has 111.4 units per session (102 to 119), J-PPC
    159.5 (159 to 160) and J-MC 129.5 (120 to 139); the J-MC maximum of 139 is above the paper's
    130 but inside the 10% widening of that bound (143). After the exclusion the means are 94.3
    and 93.0 for N-PPC under O1 (a) and (b), outside tolerance, and 157.5 or 156.0 for J-PPC and
    126.0 or 125.0 for J-MC. The paper's counts are those before the exclusion.
  deviations:
  - The counts that match are those before the 0.5 Hz exclusion, which the Methods (Feature
    Extraction) say applies to all analyses; the criterion names this count among its readings.
- claim: tenfinger-pooled-npcc-neurons
  outcome: reproduced
  notebook: reproduce_guan_2022.ipynb
  output: claim:tenfinger-pooled-npcc-neurons
  measured: 1114
  notes: 1114 N-PPC units over the 10 sessions before the exclusion (paper 1111), 943 under O1 (a)
