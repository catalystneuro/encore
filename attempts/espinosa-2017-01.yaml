    units, 15 or 16 pinch-alone onsets per unit), while NE48 and NE69 have one TTL row, no LAN.RTa or LAN.RTb, and no
    other file that could hold pinch events (their file lists are printed). The legend gives four animals for panels
    C and D, so their counts here (pinch-inhibited 10 to 50 against 44, pinch-activated 6 to 62 against 149, over 24
    readings) cover two of the four animals and do not decide the outcome. Panel E, which the legend gives for two animals
    and the files allow, is outside tolerance under every reading: light-inhibited units tested with the pinch number
    25 to 47 against 18 (tolerance 1.8). As the criterion needs all three group sizes, it fails whatever panels C and
    D would give. Measured values are for the 2-s window, 500-ms bins, n1, r1. The data set''s own flags give 23 light-inhibited
    units among the units with pinch onsets (30 over all units); its pinch flags (column 19) over all units, including
    the 88 units of NE48 and NE69 whose files hold no pinch events, give 45 pinch-inhibited units (10, 7 and 28 excited,
    inhibited and unaffected by light) against the legend''s 44 (10, 7, 27), but 61 pinch-activated units against 149.'
  deviations:
  - Pulse bins are those whose centres fall in (0, 5] s (ten 500-ms or twenty 250-ms bins). The claims file says the
    bins of the 5-s pulse without fixing the bin that straddles the end; this is a standard choice of edge, noted in
    bf2.py.
  - The pinch window is read as 2 s (the files' pinch duration, 1.99 s, and the Methods' 'typically 1-2 s') and as 5
    s (legend), as the criterion says.
  - Pinch onsets are the per-unit 'RT somatic' lists (pinch alone). The second TTL row of NE52 holds hundreds of 50-ms
    pulses and is not used; LAN.RTb holds the pinch events there.
