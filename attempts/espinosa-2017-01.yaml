  - claim: fig1-bf-response-classes
    outcome: not_reproduced
    notebook: reproduce_espinosa_2017.ipynb
    output: claim:fig1-bf-response-classes
    measured:
      - 40
      - 76
      - 214
      - 33.7
      - 30.3
    notes: 330 units in 4 animals and 20 recordings, as the paper and descriptor state. Under none of the twelve
      readings (500-ms and 250-ms bins, n1 and n2, r1 to r3) are the three counts within tolerance; across them
      inhibited units number 36 to 70, excited 68 to 118 and unaffected 142 to 226, against 29, 56 and 245. The
      decrease of inhibited units is 16.2 to 39.7% (expected 49.2 +- 5.1) and the increase of excited units 21.3
      to 31.5% (expected 39.6 +- 7.9); no reading has both within tolerance. Measured values are for 500-ms bins,
      n1, r1. Counting every light pulse, including those given with the pinch, no reading brings the counts within
      tolerance either (inhibited 45 to 77, excited 76 to 123). The data set's own per-unit flags (column 17 of
      data_correlation.mat, '1sigpos -1signeg 0nosig laser/spk') give 56 excited, 30 inhibited and 244 unaffected
      units, within tolerance of the paper; the classes found here agree with those flags for 191 to 286 of the
      330 units. With the flags' classes, the increase measured here is 33.5 to 35.7% (within tolerance) and the
      decrease 43.1 to 46.4% (within tolerance under two of four readings). So the deposited classification matches
      the paper, and the method as the claims file reads it does not recover it. The question of how the flags were
      computed is put to the paper's authors (findings).
    deviations:
      - Pulse bins are those whose centres fall in (0, 5] s (ten 500-ms or twenty 250-ms bins). The claims file
        says the bins of the 5-s pulse without fixing the bin that straddles the end; this is a standard choice
        of edge, noted in bf2.py.
      - Light responses use the per-unit light-alone onsets of data_correlation.mat ('RT laser'). In NE52 and NE58
        the light pulses alternate with light given together with the pinch, which the paper does not mention (Methods,
        Optogenetic and Somatosensory Stimulation). Every light pulse of the TTL was run as a second reading.
      - Shuffles permute both the inter-spike and inter-pulse intervals, keeping the first event (Methods, Unit
        cross-correlation analysis, 'Both neural timestamps and start times of light pulses where shuffled by randomized
        exchange of the original inter-event intervals'); seeds fixed per unit, a standard choice.
  - claim: fig1d-excited-cells-fire-faster
    outcome: reproduced
    notebook: reproduce_espinosa_2017.ipynb
    output: claim:fig1d-excited-cells-fire-faster
    notes: Under all 24 combinations of class reading (12) and basal-rate reading (rate outside the light, rate
      in the 5 s before each pulse), the Kruskal-Wallis test gives p at most 4.1e-10 and excited units have a higher
      median rate than inhibited and unaffected units by rank-sum tests at p < 0.05. For 500-ms bins, n1, r1 and
      the rate outside the light, medians are 12.26 (excited), 5.15 (inhibited) and 3.23 Hz (unaffected), Kruskal-Wallis
      p = 6.8e-15, rank-sum excited against inhibited p = 0.00084, excited against unaffected p = 2e-15. Excited
      units fire faster in each animal (medians 5.69 to 20.89 Hz against 2.88 to 5.20 Hz for the others, 500-ms,
      n2, r1). With the data set's own classes the same holds (12.78 against 2.49 and 4.14 Hz, p = 3.2e-08).
    deviations:
      - The fig1-bf-response-classes classes do not match the paper's counts; the test is run on them as the criterion
        says.
  - claim: fig1d-discharge-by-class
    outcome: reproduced
    notebook: reproduce_espinosa_2017.ipynb
    output: claim:fig1d-discharge-by-class
    notes: 'Under all twelve readings the Kruskal-Wallis test (p at most 5.8e-38) and the three pairwise rank-sum
      tests give p < 0.05, with medians ordered excited above unaffected above inhibited (500-ms, n1, r1: 1.197,
      1.012, 0.805; Kruskal-Wallis p = 2.1e-40). As the claims file notes, this largely follows from the classification.'
    deviations:
      - The classes do not match the paper's counts (fig1-bf-response-classes).
  - claim: fig1e-excited-slower-kinetics
    outcome: not_reproduced
    notebook: reproduce_espinosa_2017.ipynb
    output: claim:fig1e-excited-slower-kinetics
    measured:
      - 9953
      - 9698
    notes: Under none of the 24 readings (two bin sizes, n1 and n2, r1 to r3, fit windows w1 and w2) does the rank-sum
      test find excited units slower than inhibited ones at p < 0.05 (p = 0.051 to 0.992), and under none are both
      mean time constants within tolerance. Measured values are the means for 250-ms bins, n1, r1, w1 (excited 9953
      ms, inhibited 9698 ms; medians 2927 and 4998 ms). Many fits reach the 20-s bound (for example 36 of 75 excited
      and 17 of 37 inhibited units in that reading), so the means are dominated by fits without a clear exponential;
      with w2 the medians are 316 to 680 ms and still do not separate the classes.
    deviations:
      - The time constant is bounded to 1 ms to 20 s and fits start from the bin centred on light onset; the paper
        gives neither (Figure 1E legend, 'exponential time constants from curve fittings to the early response').
        A standard choice; fits at the bound are counted.
      - The classes do not match the paper's counts (fig1-bf-response-classes).
  - claim: supp4-tail-pinch-response-patterns
    outcome: not_reproduced
    notebook: reproduce_espinosa_2017.ipynb
    output: claim:supp4-tail-pinch-response-patterns
    measured:
      - 16
      - 10
      - 26
    notes: 'Pinch onsets are in two animals (NE52 and NE58, 242 units, 15 or 16 pinch-alone onsets per unit), while
      the Supplementary Figure 4 legend gives four animals for panels C and D and two for E. Under none of the 24
      readings (pinch window 2 s or 5 s, bins, n1 and n2, r1 to r3) are the three group sizes within tolerance:
      pinch-inhibited 10 to 50 (expected 44), pinch-activated 6 to 62 (expected 149), light-inhibited units tested
      with the pinch 25 to 47 (expected 18, panel E, two animals). Measured values are for the 2-s window, 500-ms
      bins, n1, r1. The data set''s own pinch flags (column 19) over all units, including the 88 units of NE48 and
      NE69 whose files hold no pinch events, give 45 pinch-inhibited units (10, 7 and 28 excited, inhibited and
      unaffected by light) against the legend''s 44 (10, 7, 27), but 61 pinch-activated units against 149 and 30
      light-inhibited units against 18. Panels C and D rest in part on pinch timing that is not in the data set;
      panel E, which the files allow, is not matched under any reading.'
    deviations:
      - Pulse bins are those whose centres fall in (0, 5] s (ten 500-ms or twenty 250-ms bins). The claims file
        says the bins of the 5-s pulse without fixing the bin that straddles the end; this is a standard choice
        of edge, noted in bf2.py.
      - The pinch window is read as 2 s (the files' pinch duration, 1.99 s, and the Methods' 'typically 1-2 s')
        and as 5 s (legend), as the criterion says.
      - Pinch onsets are the per-unit 'RT somatic' lists (pinch alone). The second TTL row of NE52 holds hundreds
        of 50-ms pulses and is not used; LAN.RTb holds the pinch events there.
