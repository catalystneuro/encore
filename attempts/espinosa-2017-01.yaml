findings:
- kind: data_missing
  statement: The data set holds only the basal forebrain (ventral pallidum) recordings of Figure 1 and Supplementary
    Figure 4 and open-field videos. The prefrontal unit and LFP recordings behind the paper's main findings (Figures
    2 to 4, Supplementary Figures 6 to 11, Table 2), the in vitro and histology data (Supplementary Figures 1 to 3) and
    the light-blocked behavior sessions (Figure 5C) are not in it.
- kind: data_missing
  statement: Pinch timing is in the files of two animals (NE52, NE58). The 88 units of NE48 and NE69 carry pinch response
    flags (column 19 of data_correlation.mat; 24 activated, 16 inhibited, 20 unaffected, 28 empty) but their recordings
    hold no pinch events, and the Supplementary Figure 4 legend gives four animals for panels C and D.
- kind: metadata_error
  statement: The descriptor says each recording lasts 10 min and the light is 5 s on and 15 s off. The files last 900
    s in 16 of 20 recordings (600 s in NE69), and the light pulses come every 20, 25 or 30 s depending on the recording.
- kind: metadata_error
  statement: The descriptor gives the second row of LAN.ttl as the somatosensory stimulation. In NE52 that row holds
    700 to 1680 pulses of about 50 ms per recording, while LAN.RTb and the per-unit 'RT somatic' lists hold 29 to 31
    and 15 or 16 pinch events. In NE58 the row matches the events.
- kind: metadata_insufficient
  statement: Columns 6 to 8 and 15 to 20 of data_correlation.mat are not described ('Remaining columns are used by scripts').
    They hold the authors' cross-correlograms, the mean of 100 shuffles, and the per-unit light and pinch response flags
    that match the paper's counts. That 'RT laser' lists only the light-alone pulses in recordings where light alternates
    with light plus pinch, and 'RT somatic' only the pinch-alone ones, is also not described.
- kind: metadata_insufficient
  statement: The control open-field folders (9 mice) hold no laser train timing, no movement vector and no genotype,
    and two of the five VP mice (1190, 1337) have no train timing. result_rapidez_all.mat holds per-train traces for
    'halo_cre' and 'control' with no mouse or train identity; the script that reads it (openfield_analysis.m) does not
    say what the quantity is. The locomotion results of Figure 5 cannot be recomputed from them.
- kind: methods_unavailable
  statement: Question for the paper's authors. How were the per-unit light response flags (column 17 of data_correlation.mat,
    56 excited, 30 inhibited) computed? The stored cross-correlograms (column 6) show 250-ms bins, the light-alone pulses
    and counts summed over pulses; on those curves, the Methods' comparison 'bin to bin' with 100 shuffles at P < 0.01,
    read as the pulse mean outside all shuffles, any pulse bin outside all shuffles, or a rank-sum test, gives 40 to
    48 inhibited and 76 to 111 excited units, and with 500-ms bins or per-pulse normalization 36 to 70 and 68 to 118.
    Which statistic, bins and threshold turned the curves into classes, and how was the percent change of each class
    (49.2% and 39.6%) measured? The same question applies to the exponential fit of Figure 1E (bins and fit window).
- kind: paper_inconsistency
  statement: The Methods give 4 to 6 mW for the 100-um optrode used in the basal forebrain, the Supplementary Figure
    4 legends 15 to 25 mW, and the files 'Int. real' values of 15.8, 17.1 and 24.1 (normalized to a 200-um fiber, per
    the descriptor) with 'intensity' 10 for every unit.
- kind: metadata_insufficient
  statement: In NE52 and NE58 about half the light pulses are given together with the tail pinch (the pinch event within
    a few ms of the light onset), which neither the paper nor the descriptor mentions; the per-unit lists 'RT laser'
    and 'RT somatic' hold only the light-alone and pinch-alone events, and 'RT combinado' is not described.
