  - claim: fig5d-nphr-locomotion
    outcome: blocked
    blocked_by: metadata_insufficient
    notes: The VP open-field archive holds 5 mice (1189, 1190, 1191, 1337, 1556), matching the paper's 5 NpHR+ mice;
      the per-frame movement vector ('cambio') and train onsets ('ttl') are stored for 3 of them (1189, 1191, 1556;
      21, 12 and 21 trains). The Control archive holds 9 mice, each with a raw MPEG video and tracking output but
      no train onsets or movement vector, and nothing says which 5 are the paper's NpHR- mice or which genotype
      each is. The per-train traces of result_rapidez_all.mat (90 'halo_cre' and 91 control trains, 120 s each at
      29.97 Hz) carry no mouse or train identity and no description; they do not match the frame-difference estimator
      of the Methods. Detecting the trains from the videos would need a step neither the paper nor the descriptor
      describes. Outside the notebook, as a probe that decides nothing here, no pixel of mouse 1556's video followed
      its stored laser vector closely (best r = 0.59), the frame difference of that video correlated with its stored
      'cambio' at r = 0.39, and a control video decoded at about 790 frames per second.
