- claim: fig5d-nphr-locomotion
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The VP open-field archive holds 5 mice (1189, 1190, 1191, 1337, 1556), matching the paper's 5 NpHR+ mice; the
    per-frame movement vector ('cambio') and train onsets ('ttl') are stored for 3 of them (1189, 1191, 1556; 21, 12
    and 21 trains). The Control archive holds 9 mice, each with a raw MPEG video and tracking output but no train onsets
    or movement vector, and nothing says which 5 are the paper's NpHR- mice or which genotype each is. result_rapidez_all.mat
    holds per-train traces for 'halo_cre' (90 trains) and 'control' (91 trains), 3601 frames each, which the data set's
    openfield_analysis.m (a script the descriptor gives for a later paper) reads on an axis of 60 * ceil(frame_rate)
    frames either side of train onset, with a baseline from -20 to 0 s. The script does not say what the quantity is
    (the name suggests speed) and the traces carry no mouse identity, so the criterion's frame-difference estimator,
    z-scored per session, cannot be computed from them. As a substitute that decides nothing, the criterion's steps run
    on these traces (z-scored over each group's traces or over both groups') find 81 of 90 NpHR+ and 84 or 86 of 91 control
    trains quiescent (paper 60 and 49), latencies of 36.5 against 36.3 to 36.9 s (t-test p = 0.78 to 0.89; paper 8.3
    and 27.2 s) and no amplitude difference (p = 0.14 to 0.75); on the 9 and 5 or 7 moving trains neither rank-sum test
    gives p < 0.05 (p = 0.31 to 0.87). Detecting the trains from the videos would need a step neither the paper nor the
    descriptor describes.
