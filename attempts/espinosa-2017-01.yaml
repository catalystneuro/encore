- claim: fig1-bf-response-classes
  outcome: not_reproduced
  notebook: reproduce_espinosa_2017.ipynb
  output: claim:fig1-bf-response-classes
  measured:
  - 40
  - 76
  - 214
  - 33.7
  - 30.3
  notes: 330 units in 4 animals and 20 recordings, as the paper and descriptor state. Under none of the twelve readings
    (500-ms and 250-ms bins, n1 and n2, r1 to r3) are the three counts within tolerance; across them inhibited units
    number 36 to 70, excited 68 to 118 and unaffected 142 to 226, against 29, 56 and 245. The decrease of inhibited units
    is 16.2 to 39.7% (expected 49.2 +- 5.1) and the increase of excited units 21.3 to 31.5% (expected 39.6 +- 7.9). Measured
    values are for 500-ms bins, n1, r1. Counting every light pulse, including those given with the pinch, no reading
    brings the counts within tolerance either (inhibited 45 to 77, excited 76 to 123). The data set's own cross-correlograms
    (column 6 of data_correlation.mat) are reproduced exactly for all 330 units with 250-ms bins, the window cut at -15
    and +15 s (end bins half wide), spikes on an edge counted in the earlier bin, and the light-alone pulses ('RT laser');
    its shuffle means (column 18) sum to 1, as summed counts normalized afterwards (n2) give. Under that convention r1
    to r3 give 40 to 48 inhibited and 76 to 111 excited units, again outside tolerance. The data set's per-unit flags
    (column 17) give 56 excited, 30 inhibited and 244 unaffected units, within tolerance of the paper. Under r1 and r3,
    49 to 53 of the 56 flagged excited and 22 to 25 of the 30 flagged inhibited units fall in the same class here; the
    extra units are units the flags call unaffected. With the flags' classes the increase measured here is 33.5 to 35.7%
    (within tolerance) and the decrease 43.1 to 46.4% (within tolerance under two of four readings); measured against
    the 5 s before each pulse they are 39.1% and 51.9%, both within tolerance (a variant; the definition of the percent
    change is asked of a reader in questions/espinosa-2017.yaml). Sham onsets 10 s into the light-off period classify
    0 to 5 of the 205 to 226 light-unaffected units as responsive under r1 and r3, and 32 to 38 of 142 to 190 under r2;
    they also classify 34 to 44 units as inhibited under r1 and r3, most of them light-excited units (36 of 42 under
    the stored convention and r1), because the 30-s normalization window holds the neighbouring pulses. So the authors'
    bins, pulses and normalization are among the readings run, and the test that turned their curves into classes is
    not r1, r2 or r3. How the flags were computed is put to the paper's authors (findings).
  deviations:
  - Pulse bins are those whose centres fall in (0, 5] s (ten 500-ms or twenty 250-ms bins). The claims file says the
    bins of the 5-s pulse without fixing the bin that straddles the end; this is a standard choice of edge, noted in
    bf2.py.
  - Light responses use the per-unit light-alone onsets of data_correlation.mat ('RT laser'). In NE52 and NE58 the light
    pulses alternate with light given together with the pinch, which the paper does not mention (Methods, Optogenetic
    and Somatosensory Stimulation). Every light pulse of the TTL was run as a second reading.
  - Shuffles permute both the inter-spike and inter-pulse intervals, keeping the first event (Methods, Unit cross-correlation
    analysis, 'Both neural timestamps and start times of light pulses where shuffled by randomized exchange of the original
    inter-event intervals'); seeds fixed per unit, a standard choice.
  - The stored convention (250-ms bins, window cut at -15 and +15 s, spikes on an edge in the earlier bin) is taken from
    the data set's own cross-correlograms, which the notebook reconstructs exactly; it is run as a variant of the 250-ms
    reading, and the main readings keep full-width bins.
- claim: fig1d-excited-cells-fire-faster
  outcome: reproduced
  notebook: reproduce_espinosa_2017.ipynb
  output: claim:fig1d-excited-cells-fire-faster
  notes: Under all 36 combinations of class reading (12) and basal-rate reading (rate outside the light, rate in the
    5 s before each pulse, rate outside the light and the 5 s after each pinch event), the Kruskal-Wallis test gives
    p at most 4.1e-10 and excited units have a higher median rate than inhibited and unaffected units by rank-sum tests
    at p < 0.05. For 500-ms bins, n1, r1 and the rate outside the light, medians are 12.26 (excited), 5.15 (inhibited)
    and 3.23 Hz (unaffected), Kruskal-Wallis p = 6.8e-15, rank-sum excited against inhibited p = 0.00084, excited against
    unaffected p = 2e-15. Excited units fire faster in each animal (medians 5.69 to 20.89 Hz against 2.88 to 5.20 Hz
    for the others, 500-ms, n2, r1). With the data set's own classes the same holds (12.78 against 2.49 and 4.14 Hz,
    p = 3.2e-08).
  deviations:
  - The fig1-bf-response-classes classes do not match the paper's counts; the test is run on them as the criterion says.
  - The third basal-rate reading, which leaves out the 5 s after each pinch event (LAN.RTb) in NE52 and NE58, was added
    after the round-1 verification; the pinch window is the legend's 5 s.
- claim: fig1d-discharge-by-class
  outcome: reproduced
  notebook: reproduce_espinosa_2017.ipynb
  output: claim:fig1d-discharge-by-class
  notes: 'Under all twelve readings the Kruskal-Wallis test (p at most 5.8e-38) and the three pairwise rank-sum tests
    give p < 0.05, with medians ordered excited above unaffected above inhibited (500-ms, n1, r1: 1.197, 1.012, 0.805;
    Kruskal-Wallis p = 2.1e-40). As the claims file notes, this largely follows from the classification.'
  deviations:
  - The classes do not match the paper's counts (fig1-bf-response-classes).
- claim: fig1e-excited-slower-kinetics
  outcome: partially_reproduced
  notebook: reproduce_espinosa_2017.ipynb
  output: claim:fig1e-excited-slower-kinetics
  measured:
  - 15766
  - 7487
  notes: 'The criterion is met in part under one reading. With w1 (from light onset to the first extremum of the response),
    250-ms bins and n1, the rank-sum test finds excited units slower than inhibited ones under r1, r2 and r3 (p = 0.0008,
    0.0013 and 5.8e-05), while the mean time constants (excited 13709 to 15766 ms, inhibited 5669 to 8202 ms) are far
    outside tolerance. Measured values are for 250-ms bins, n1, r1, w1. Under the other 21 readings with w1 or w2 the
    test does not hold (p = 0.051 to 0.93), nor under any of the 12 with the round-1 window (w1max, up to the bin of
    largest deviation). The result is fragile: under the matching reading 37 to 51 excited units have fits at the 20-s
    bound, and 22 to 42 excited and 21 to 35 inhibited units are dropped because the first extremum falls in the first
    pulse bin, leaving fewer than three points. A synthetic check (40 Poisson units per condition) shows w1 does not
    recover the time constant (medians 619 to 20000 ms for true 260 and 600 ms) and finds no difference between excited
    and inhibited units with the same time constant (p = 0.13 to 0.77); w2 recovers 221 to 289 ms for 260 ms and 424
    to 542 ms for 600 ms. With the data set''s own classes, w2 finds excited units slower under all four bin and normalization
    readings (p = 0.0026 to 0.043; medians 531 to 728 ms against 212 to 310 ms, near the paper''s 602.5 and 263.1 ms),
    but the means are outside tolerance (2110 to 5392 ms), inflated by fits at the bound. The classes come from fig1-bf-response-classes,
    whose counts are not reproduced.'
  deviations:
  - The time constant is bounded to 1 ms to 20 s and fits start from the bin centred on light onset; the paper gives
    neither (Figure 1E legend, 'exponential time constants from curve fittings to the early response'). A standard choice;
    fits at the bound are counted, and the rank-sum test does not depend on the bound's value.
  - w1 is read as the first local extremum of the normalized discharge after onset, in the direction of the unit's pulse
    mean, as the criterion says; units whose first extremum is in the first pulse bin have fewer than three points and
    are dropped. In round 1 the window ended at the bin of largest deviation; that reading is kept as a variant (w1max).
  - The classes do not match the paper's counts (fig1-bf-response-classes).
