- claim: fig4d-ole-near-bayesian
  outcome: not_reproduced
  notebook: reproduce_peyrache_2015.ipynb
  output: claim:fig4d-ole-near-bayesian
  notes: Neither part holds in both structures. With the signal Q from the tuning curves throughout, the
    covariance OLE is better in all 25 ADn ensembles (median minimum error 12.98 against 45.97 degrees,
    Wilcoxon p = 6.0e-8) and in all 5 PoS ensembles (20.96 against 49.63), but the PoS test gives p = 0.0625,
    the lowest a two-sided signed-rank test on 5 pairs can give, so the first part fails in PoS for want
    of ensembles. The covariance OLE errors are 1.26 (ADn) and 1.42 (PoS) times the Bayesian decoder's,
    beyond the 25% margin. With the observed variances on the diagonal of the signal Q (variant), the
    two OLEs barely differ (13.22 against 12.98 degrees in ADn, p = 0.16; PoS p = 0.13). Both readings
    give this outcome, which rests on the estimator assumed here, as the paper defines none.
  deviations:
  - Assumed, as the paper does not define the OLE, weights D = Q^-1 L (Salinas and Abbott 1994), L the
    correlation of smoothed counts with (cos, sin) of head direction; Q from the counts (covariance OLE)
    or, for the signal OLE, from the tuning curves read at the head direction (tuning curve covariances,
    the paper's words). The earlier choice, the same with the observed variances on the diagonal, is
    shown as a variant. Windows 10, 20, 50, 100, 200, 300, 500 and 1000 ms.
  assumed: true
