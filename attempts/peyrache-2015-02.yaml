- claim: fig2f-sws-tenfold-faster
  outcome: partially_reproduced
  notebook: reproduce_peyrache_2015.ipynb
  output: claim:fig2f-sws-tenfold-faster
  measured: 12.3
  notes: The SWS speed exceeds the waking speed in most pairs (Wilcoxon p < 0.001 in every reading), but
    the median SWS to waking ratio is outside 9 to 11. It is 11.7 to 12.3 in ADn-ADn pairs, and 95.7%
    of ADn-ADn pairs are faster in SWS under hd-a and rate-a, and 5.6 to 6.1 in PoS-PoS pairs. It is above
    5 in both, the partial criterion. 387 pairs have a fitted speed at an end of the grid in some state.
  deviations:
  - Cross-correlograms from 10 ms bins concatenated across the intervals of a state (a standard choice);
    the coarse grid is 80 speeds from 5 to 5000 deg/s on a log scale (v-c).
  - Mouse25-140131 and Mouse25-140204 have no sleep scoring in the files; their open-field epoch is taken
    as wake and they enter the waking analyses only.
- claim: fig2e-decoded-speed
  outcome: partially_reproduced
  notebook: reproduce_peyrache_2015.ipynb
  output: claim:fig2e-decoded-speed
  measured: 6.0
  notes: Only the REM part holds, in PoS under one reading, and the SWS ratio is outside tolerance under
    every reading. With steps at the smoothing window (b) and decoded waking speed (w-a), the median decoded
    speed in ADn is 140 deg/s in SWS, 23 in waking and 13 in REM (SWS ratio 6.0, REM ratio 0.57). In PoS
    (4 ensembles) the SWS ratio is 2.7 and the REM ratio 1.0, inside the band. With the actual head speed
    in waking (w-b), the ratios are 4.3 and 0.41 in ADn. At 10 ms steps (a) the medians are 0 or 100 deg/s,
    as decoded angles move in 1 degree steps, so that reading cannot decide.
  deviations:
  - Decoded angles are the posterior maximum on the 1 degree grid, so 10 ms speeds are quantised to multiples
    of 100 deg/s; the medians at that step cannot decide.
  - Mouse25-140131 and Mouse25-140204 have no sleep scoring in the files; their open-field epoch is taken
    as wake and they enter the waking analyses only.
