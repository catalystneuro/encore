- claim: fig4d-ole-near-bayesian
  outcome: not_reproduced
  notebook: reproduce_peyrache_2015.ipynb
  output: claim:fig4d-ole-near-bayesian
  notes: Not reproduced under (hd-a), the verified outcome; partially reproduced under (hd-b), proposed.
    With the adopted signal OLE (observed variances on the diagonal of Q) and the 25 ADn and 5 PoS hd-a
    ensembles, the covariance OLE barely beats the signal OLE (median minimum error 12.98 against 13.22
    degrees in ADn, 14 of 25, Wilcoxon p = 0.16; PoS 20.96 against 20.96, p = 0.13), so the first part
    fails. With the 27 ADn and 11 PoS hd-b ensembles it holds in both structures (13.06 against 13.81
    degrees, 17 of 27, p = 0.019; 27.79 against 28.37, 9 of 11, p = 0.042). The covariance OLE errors
    are 1.26 (ADn) and 1.42 (PoS) times the Bayesian decoder's under hd-a and 1.24 and 1.76 under hd-b,
    so the second part fails in PoS under both. With the variant signal Q (tuning curves throughout),
    whose signal decoder errs by up to 103 degrees, beyond the 90 degrees of chance, the first part holds
    in ADn under both readings (p = 6.0e-8 and 1.5e-8) and in PoS under hd-b (p = 0.001) but not under
    hd-a (p = 0.0625, the floor for 5 pairs). Under (hd-b) the first part holds in both structures with
    either signal Q. The outcome rests on the estimator assumed here, as the paper defines none, and on
    the HD reading; whether the claims file's signal Q reads the paper rightly is asked in questions/peyrache-2015.yaml.
  deviations:
  - Assumed, as the paper does not define the OLE, weights D = Q^-1 L (Salinas and Abbott 1994), L the
    correlation of smoothed counts with (cos, sin) of head direction; Q from the counts (covariance OLE)
    or, for the signal OLE, from the tuning curves read at the head direction off the diagonal with the
    observed variances on it (independent neurons, the usual signal-only OLE, for the paper's "tuning
    curve covariances (i.e., signal correlation only)"). Q from the tuning curves throughout, adopted
    in round 1, is shown as a variant. Windows 10, 20, 50, 100, 200, 300, 500 and 1000 ms.
  - Ensembles are formed from HD cells under (hd-a) and, as asked in round 2, under (hd-b), waking decoding
    only for the latter; sessions with at least 6 HD cells in a structure.
  assumed: true
  proposed:
    outcome: partially_reproduced
    reason: Decoding the hd-b ensembles, which the round-2 verifier asked for, gives 27 ADn and 11 PoS
      ensembles, and the covariance OLE is then better than the signal OLE in both structures with p <
      0.05 (0.019 and 0.042 with the adopted signal Q; 1.5e-8 and 0.001 with the variant), while it stays
      beyond 25% of the Bayesian decoder in PoS (1.76). The criterion makes the claim partially reproduced
      when the first part holds, and the HD readings are taken under one reading in the other claims of
      this attempt. Under (hd-a) it is not reproduced with either signal Q. Shown in reproduce_peyrache_2015.ipynb,
      cell claim:fig4d-ole-near-bayesian.
