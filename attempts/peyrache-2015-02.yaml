    labels 24 sessions in 4 mice hold both structures, against the paper's 21 in 3.
- kind: selection_undocumented
  about: data
  statement: Supplementary Table 1 counts the ADn cells of Mouse24, 25 and 28 from 2, 3 and 3 sessions
    (22, 27 and 55 cells against 37, 75 and 126 in the files), following the Methods' rule of discarding
    sessions without a probe move. The files do not mark which sessions the paper kept, and the rule read
    from the probe depths does not give the table's counts.
- kind: format_error
  statement: In Mouse17-130130, spike times continue 1101 s past the end of the last sub-recording.
- kind: other
  about: data
  statement: The wake interval of Mouse12-120808 spans 130 by 97 cm of red LED positions, against 58 to
    88 by 55 to 83 cm in the other sessions and a 53 by 46 cm arena; its open_field epoch is split in
    three, interleaved with second_environment epochs, so the wake interval may include the second environment.
- kind: format_error
  statement: In Mouse17-130201 the head-direction series has one sample more than the LED position series.
- kind: methods_unavailable
  statement: 'The Results cite the Methods for the optimal linear estimator of Fig. 4d,e, but the Methods
    have no OLE section. Question for the authors: how were the signal (tuning curve) and covariance OLEs
    built (which Q and L, which windows, whether cross-validated)? With the standard estimator and the
    observed variances on the diagonal of the signal Q, the two OLEs barely differ (median error ratio
    0.99 in ADn); with Q from the tuning curves throughout, the covariance OLE error is a quarter of the
    signal OLE error (0.25), as that signal decoder errs near chance in some ensembles.'
- kind: methods_unavailable
  statement: 'Question for the authors: which sessions of Mouse24, 25 and 28 gave the ADn cells of Supplementary
    Table 1, and how was the rule of discarding sessions separated by less than three days without a probe
    move applied? The depth-based reading keeps 3, 6 and 3 sessions, against 2, 3 and 3, and drops one
    Mouse17 session the table counts.'
- kind: methods_unavailable
  statement: 'Question for the authors: how was the angular speed of the decoded HD computed (Fig. 2e)?
    With the decoder of the Methods (posterior maximum on 1 degree bins, 10 ms bins) the median speed
    at 10 ms steps is 0 or 100 deg/s; located below the grid it gives an ADn SWS to waking ratio of 5.1,
    and at the smoothing window 6, not 10. Mean speeds per ensemble give 5.3 to 14.8.'
