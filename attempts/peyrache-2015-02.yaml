- claim: fig2a-rates-preserved
  outcome: reproduced
  notebook: reproduce_peyrache_2015.ipynb
  output: claim:fig2a-rates-preserved
  measured:
  - 274
  - 69
  notes: Under the r of at least 0.5 reading, all four correlations pass with p < 0.05. In ADn the waking
    rates correlate with SWS rates at r = 0.80 and with REM rates at r = 0.86 (hd-a, 274 cells in sessions
    with both sleep stages). In PoS the values are 0.65 and 0.66 (69 cells). The PoS values are below
    0.7 under every cell reading except waking against SWS with rate-a cells (0.73). The cell counts are
    245 to 293 ADn and 38 to 100 PoS, against 215 and 62.
  deviations:
  - Pearson's r on linear rates; log rates are printed as a variant.
  - Mouse25-140131 and Mouse25-140204 have no sleep scoring in the files; their open-field epoch is taken
    as wake and they enter the waking analyses only.
