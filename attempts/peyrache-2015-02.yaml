- claim: fig3b-packet-coherence
  outcome: reproduced
  notebook: reproduce_peyrache_2015.ipynb
  output: claim:fig3b-packet-coherence
  notes: At the decoder's windows, the median over ensembles of the coherence exceeds 0.05 in both structures
    and all three states under every reading of distance, reference vectors and summary. The lowest is
    0.082 (ADn, SWS, decoded-HD references, correlation distance, median over bins). Every ensemble passes
    with the mean summary. Other windows were not run. A negative control, the same packets against the
    expected packet at decoded angles permuted across time bins, shows which readings can fail. With random
    references it still scores 0.25 to 0.61 and with actual-HD references and the mean summary 0.11 to
    0.24 (medians over ensembles), so those readings cannot fail at 0.05. With decoded-HD references and
    the median summary it is 0.000 in ADn and 0.000 to 0.122 in PoS, against 0.082 to 0.503 for the actual
    angles; the outcome rests on that reading.
  deviations:
  - Only the decoder's own windows (300 ms wake and REM, 50 ms SWS) are run; the other windows of reading
    (c-c) are not.
  - Coherence is computed on 3000 time bins drawn at random per state (seeded), a standard choice; the
    expected packet is the sum of normalised tuning curves weighted by the rates the tuning curves give
    at the decoded angle (Methods, Ensemble coherence).
