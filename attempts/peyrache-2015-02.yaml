- claim: fig3b-packet-coherence
  outcome: reproduced
  notebook: reproduce_peyrache_2015.ipynb
  output: claim:fig3b-packet-coherence
  notes: At the decoder's windows, the median over ensembles of the coherence exceeds 0.05 in both structures
    and all three states under every reading of distance, reference vectors and summary. The lowest is
    0.082 (ADn, SWS, decoded-HD references, correlation distance, median over bins). Every ensemble passes
