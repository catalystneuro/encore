  deviations:
  - Central nuclei are the cen label. Units 0 and 1 of files with a wrong spike index are left out.
- claim: intra-structure-reactivation
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The criterion needs four NREM tests, two on putative pyramidal pairs, so it cannot be
