findings:
- kind: metadata_insufficient
  statement: New in this attempt. The putative cell types the paper uses (pyramidal cell or
    interneuron for every unit, from monosynaptic connections and then k-means on the waveform) are
    not in the dandiset, and there are no spike waveforms. Five of the 33 files with units
    (Rat08-20130709 to 20130713) have a cell_type column with the values excitatory, inhibitory and
    unclassified, described only as "Type of cell this has been classified as."; it marks 152
    excitatory and 36 inhibitory BLA units and 9 excitatory hippocampal units, consistent with the
    paper's monosynaptic identification alone. A short-latency cross-correlogram check supports
    this reading of the column. At p < 1e-6, 99.3% of the excitatory BLA units excite and 94.4% of
    the inhibitory ones inhibit another loaded unit at 1 to 4 ms, against 44% and 7.9% of the
    unclassified ones. Most of the paper's reactivation analyses cannot be repeated (17 claims
    blocked for this alone). The earlier attempt did not read this column.
- kind: data_missing
  statement: New in this attempt. The dandiset holds 40 recording days with 4702 units, where the
    paper reports 61 sessions with 7,390 units; per rat it holds 2317, 515, 440 and 1430 units
    (Rat08 to Rat11) against 2,444, 1,294, 1,138 and 2,514. Which rat is which of the paper's rats
    1 to 4 is not stated.
- kind: metadata_error
  statement: New in this attempt. The archive's asset metadata (variableMeasured) is wrong for all
    40 files on two entries. It lists ElectricalSeries for the 24 files that hold no raw voltage
    and not for the 16 that hold it (acquisition/ElectricalSeries in Rat08-20130708 to 20130713
    and all Rat09 files), and ProcessingModule for the 16 files without a behavior module and not
    for the 24 with one. Its Units entries agree with the files.
- kind: metadata_error
  statement: Still present (found by 000061-girardeau-2017-01; the version and the files are
    unchanged, and the draft holds the same assets). The epochs table is stored in milliseconds
