- claim: direction-all-cell-pairs
  outcome: reproduced
  notebook: reproduce_girardeau_2017.ipynb
  output: claim:direction-all-cell-pairs
  notes: With all cells over 14 sessions (the paper had 27), the air puff template is more
    reactivated around post-NREM than pre-NREM ripples in 10 (one-tailed p = 0.01), the safe
    template in 12 (p = 0.0043), and the air puff change exceeds the safe change in 8 (one-tailed p =
    0.48), so both within-trajectory tests have p < 0.05 and the between-trajectory test has p >=
    0.05. By rat the air puff template rises in 7 of 8 Rat08, 2 of 3 Rat10 and 1 of 3 Rat11
    sessions, so its result rests mostly on Rat08. Reading c laps include the time on the starting
    platform and stops (median lap 22.6 s, but minutes long in early Rat08 sessions); leaving out
    Rat08-20130708, the only session with fewer than 3 laps in a template (one safe lap of 23 s),
    gives air puff p = 0.0052, safe p = 0.0052 and air puff greater than safe p = 0.37 (13
    sessions). Long laps are not limited to that session (median air puff laps of 660 s in
    Rat08-20130711, 192 s in Rat08-20130710 and 46 to 115 s in four other Rat08 sessions), so two
    further variants, with values of the author's that decide nothing, limit the platform time and
    stops. With laps of at most 30 s (11 sessions) the result is the same (air puff p = 0.034, safe
    p = 0.021, air puff greater than safe p = 0.71). With each lap cut to its last 10 s (14
    sessions) the air puff test holds (p = 0.034) but the safe test does not reach p < 0.05 (10 of
    14, p = 0.052), and air puff greater than safe has p = 0.36. The result under the criterion's
    laps thus depends in part on the time around the run that reading c laps hold; the criterion
    fixes reading c, so the outcome is unchanged. Before the answers to this attempt's questions (questions/000061.yaml) the claim was
    blocked as metadata_insufficient through aversive-direction-stronger; the answers removed that
    dependency, the claim using that claim's procedure but not its result, and confirmed that laps
    are judged on O1 reading c alone here. No outcome in the earlier attempt.
  deviations:
  - Laps are O1 reading c (between rewards at opposite ends); the dandiset has no lap intervals or
    position. The air puff direction of a day is the lap direction holding most puffs. These laps
    include the time on the starting platform after each reward and any stop, so the air puff and
    safe templates hold awake activity off the track that the M8 laps (position inside a 150-cm
    window) leave out.
  - BLA is the bla label (case ignored); units 0 and 1 of the files with a wrong spike index are
    left out.
