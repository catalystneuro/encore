- claim: habituation-over-days
  outcome: reproduced
  notebook: reproduce_girardeau_2017.ipynb
  output: claim:habituation-over-days
  notes: Under O1 reading c, over 40 sessions of four rats, the habituation index rises with
    training day for each lap count, pooled Spearman rho 0.383 (p = 0.015) for all laps, 0.331 (p =
    0.046, 37 sessions with a puff direction) for air puff laps and 0.397 (p = 0.011) for
    left-to-right laps. The correlation is positive in all four rats for each count, with p < 0.05
    in Rat08, Rat09 and Rat10 and not in Rat11 (rho 0.32 to 0.33). Both readings of "gradually
    diminished" hold for all three counts, so the outcome holds under every reading the dandiset
    allows. The answer to this attempt's question (questions/000061.yaml) confirmed that the claim
    is judged on O1 reading c alone when the dataset holds neither lap intervals nor position, and
    the criterion now says so; the outcome, reproduced before the answer, is unchanged. No outcome in
    the earlier attempt.
  deviations:
  - Laps are O1 reading c, the intervals between consecutive rewards at opposite ends with both
    rewards inside the run. Reading a has no lap intervals in the dandiset (its trials table is not
    laps) and reading b needs position, which it lacks. As answered, the claim is judged on reading
    c alone; the hand-picked 150-cm window of ClassifyLaps.m is not reproduced by any reading.
    A reading c lap runs from reward to reward, so it includes the time on the starting platform
    and any stop, which the M8 laps leave out; the count of laps is the same either way.
  - The air puff direction of a day is the lap direction holding most puffs (1153 of 1197 puffs
    fall in run laps of that direction); the dandiset gives no direction. Rat08-20130709 has no
    puff inside a run lap and has no air puff count.
  - Training day is the rank of the recording date within each rat, over the 40 files; the paper's
    55 behaviour sessions include days the dandiset does not hold.
- claim: bla-pyr-sleep-firing-increase
  outcome: reproduced
  notebook: reproduce_girardeau_2017.ipynb
  output: claim:bla-pyr-sleep-firing-increase
  notes: On the 152 identified excitatory BLA units of five Rat08 sessions, the REM/wake ratio has
    a median of 0.39 (positive in 120, p = 7.0e-15) and the NREM/wake ratio a median of 0.18
    (positive in 108, p = 7.2e-12); both are positive and the REM median exceeds the NREM median. By
    session the REM ratio reaches p < 0.05 in four of five sessions and the NREM ratio in three
    (Rat08-20130713, 22 cells, reaches neither). The paper had 675 cells from four rats; these 152
    come from one rat, a smaller sample. The answer to this attempt's question
    (questions/000061.yaml) confirmed that the claim is judged on O4 reading a alone, the identified
    cells of the Fig. 2c legend, and O4 now says so; the outcome, reproduced before the answer, is
    unchanged. No outcome in the earlier attempt.
  deviations:
  - Cells are the units the dandiset's cell_type column marks excitatory, read as the paper's
    monosynaptically identified pyramidal cells (O4 reading a). The column exists in five Rat08
    files only, so the test uses one rat and about a fifth of the paper's cells. Reading b (all
    putative pyramidal cells) cannot be formed; as answered, it is not needed for the outcome.
  - Units 0 and 1 of files with a wrong spike index are left out (Rat08-20130710 and 20130711).
- claim: bla-int-sleep-firing
  outcome: not_reproduced
  notebook: reproduce_girardeau_2017.ipynb
  output: claim:bla-int-sleep-firing
  notes: On the 36 identified inhibitory BLA units of five Rat08 sessions, the REM/wake ratio has a
    median of 0.029 (positive in 22) with two-sided Wilcoxon p = 0.020, so the paper's test finds a
    REM change the claim says is absent. The NREM/wake ratio has a negative median (-0.035, positive
    in 16) with p = 0.26, so the decrease is not significant. Neither part holds, which the criterion
    calls not reproduced. By session only Rat08-20130711 (12 cells) has a REM ratio with p < 0.05.
    The paper had 175 interneurons from four rats; the REM effect here is small (median 0.029) and
    rests on one rat. The answer to this attempt's question (questions/000061.yaml) confirmed that
    the claim is judged on O4 reading a alone; the outcome, not reproduced before the answer, is
    unchanged. As context (decides nothing), the REM effect size r is 0.39 against the paper's 0.09
    and the bootstrap 95% interval of the REM median is -0.015 to 0.109; the NREM r is -0.19 against
    the paper's -0.45, and with 36 cells a NREM shift of about 0.068 would be detected with 80%
    power. A short-latency cross-correlogram check finds an inhibitory partner at p < 1e-6 for 34
    of the 36 inhibitory units (94.4%), against 2.0% of excitatory and 7.9% of unclassified BLA
    units, consistent with the column marking identified interneurons. No outcome in the earlier
    attempt.
  deviations:
  - Cells are the units marked inhibitory in the five typed Rat08 files, read as the paper's
    identified interneurons (O4 reading a, which as answered decides alone); reading b cannot be
    formed.
