outcomes:
- claim: unit-counts
  outcome: not_reproduced
  notebook: reproduce_girardeau_2017.ipynb
  output: claim:unit-counts
  measured: [40, 4702, 2317, 515, 440, 1430, 1118, 482, 935, 829]
  notes: The dandiset holds 40 sessions (33 with a units table) and 4702 units, against 61 sessions
    and 7,390 units, both outside the 10% tolerance, so the criterion's totals fail. Only Rat08,
    taken as rat 1, is within tolerance (2317 against 2,444); Rat09, Rat10 and Rat11 hold 515, 440
    and 1430 against 1,294, 1,138 and 2,514. By label there are 1118 BLA (bla and BLA), 482 central
    nuclei, 935 piriform and 829 hippocampal units against 2,038, 782, 1,560 and 1,210; the wider
    amygdala labels (bla, blv, bmp, ladl) give 1977. The difference is in the data deposited, fewer
    days and units than the paper reports. No outcome in the earlier attempt, which had no such claim.
  deviations:
  - The dandiset does not say which of Rat08 to Rat11 are the paper's rats 1 to 4. Rat09, the rat
    without hippocampal units, is taken as rat 2 (whose hippocampal probe failed) and the others in
    order; this is an assumption.
  - Units are counted as stored, one per session, including units 0 and 1 of the ten files whose
    spike index is wrong; location counts use the dandiset's labels read as the paper's structures.
- claim: rats-learn-puff-location
  outcome: blocked
  blocked_by: too_large
  notes: The criterion needs the rat's speed in the 20 cm before the day's and the previous day's
    air puff location, so it needs position on the track and the puff locations. The dandiset holds
    neither, only puff times and the raw video frames (40 run videos, 1920573 frames, 1328 GB
    uncompressed); streaming 20 frames took 8.8 s in the final run, about 234 hours for the run
    frames alone, before any tracking, and the video timestamps are not on the session clock. Same
    outcome as the earlier attempt, which blocked it for the same reason.
- claim: each-rat-learns-puff-location
  outcome: blocked
  blocked_by: too_large
  notes: Depends on rats-learn-puff-location (speed ratios from position), which is blocked as too
    large. No outcome in the earlier attempt.
- claim: dz-speed-slower-post-run
  outcome: blocked
  blocked_by: too_large
  notes: Depends on rats-learn-puff-location (danger-zone speeds from position), which is blocked as
    too large. No outcome in the earlier attempt.
- claim: puff-location-no-speed-bias
  outcome: blocked
  blocked_by: too_large
  notes: Depends on rats-learn-puff-location and needs the puff location on the track, which the
