  statement: Still present (found by 000061-girardeau-2017-01). Video timestamps are stated in
    seconds but are in milliseconds and are not on the session clock; the first timestamp matches
    the start of the video's epoch in 1 of 114 videos, while the spans match the epoch durations in
    93 of 114.
- kind: format_error
  statement: Still present (found by 000061-girardeau-2017-01). In ten files the spike_times_index
    is wrong at the first units; unit 1's spike times fall back once, after 65536 times k spikes,
    and unit 0 stops where unit 1 starts, so the first part of unit 1 is the end of unit 0. Units 0
    and 1 of these files were left out of the analyses.
- kind: data_missing
  statement: Still present (found by 000061-girardeau-2017-01). Seven files have no units table,
    sixteen have no sleep states and fourteen have no ripple events; the Rat09 files have no
    hippocampal units and no ripples.
- kind: data_missing
  statement: Still present (found by 000061-girardeau-2017-01). There is no position tracking and no
    air puff location, only the puff times and the raw video frames, so behaviour on the track
    cannot be measured without tracking about 1.9 million frames; laps and the air puff direction
    can only be inferred from reward and puff times.
- kind: metadata_insufficient
  statement: Still present in the dandiset (found by 000061-girardeau-2017-01). Unit region labels
    are undescribed short codes (bla, blv, bmp, ladl, cen, den, ven, pir, plc01, PLCo1, cpu, hpc,
    HIP, no label), some in two cases, Rat09-20140328 has no location column, and the electrode
    table gives every channel as unknown. The paper's Supplementary Fig. 3 names the structures the
    codes match (BLA, BLV, LaDL, BMA, BMP, Pir, VEn, DEn), which lets this attempt read them; the
    dandiset still does not describe them.
- kind: metadata_insufficient
  statement: Still present (found by 000061-girardeau-2017-01). The trials table of the Rat08 and
    Rat09 files is described only as "experimental trials"; its intervals of 3 to 5 s fall partly
    outside the run and are not laps.
- kind: metadata_insufficient
  statement: Still present (found by 000061-girardeau-2017-01). The ripple annotations carry an
    undescribed number in each label (for example "Ripple peak 156"), one per file, presumably the
    detection channel; ripples, puffs and rewards are stored as annotation series under stimulus
    presentation.
- kind: methods_unavailable
  statement: Partly fixed (found by 000061-girardeau-2017-01, when the paper's text was not
