- claim: cen-no-reactivation
  outcome: reproduced
  notebook: reproduce_girardeau_2017.ipynb
  output: claim:cen-no-reactivation
  notes: Hippocampus-central nuclei EV does not differ from REV in NREM (9 sessions, median EV - REV
