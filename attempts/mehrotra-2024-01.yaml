- what: The paper's analysis code, read for the methods, and its DOWN and UP event files for the 16 PoSub
    sessions (Analysis/OutputFiles/*.evt.py.dow and *.evt.py.upp), which select the sessions and give
    the study's DOWN and UP states.
  source: https://github.com/PeyracheLab/MehrotraLevenstein_2023 at commit 4ee34f34793c147ac08bf5fffe44ff03d17f8e35
- what: The rat frontal cortex recordings of Watson et al. 2016 for fig5e-fc-pmr-onset. From each of the
    27 archives, streamed, only the members <session>_SStable.mat (spike times), <session>_CellIDs.mat
    (EX units, EAll) and <session>_UPDOWNINtervals.mat (UP, DOWN, ON and OFF intervals) are read.
  source: CRCNS fcx-1, unversioned, https://crcnsarchive.s3-us-west-2.amazonaws.com/fcx-1/live/ (MD5 sums
