- claim: fig5f-rsc-pmr-onset
  outcome: reproduced
  assumed: true
  notebook: reproduce_mehrotra_2024.ipynb
  output: claim:fig5f-rsc-pmr-onset
  measured:
  - -0.275
  - 570
  notes: Reading (a), all sorted units with the stored UP states, gives 570 entering units and Kendall
    tau = -0.2748 (p = 8.1e-21; paper -0.28, p = 6.76e-21), within the tolerance of 0.028. Re-detected
    UP states (detectDOWNs_RSC.py procedure, 95% to 99% of DOWN states matched within 10 ms) give -0.274
    with 568 units; UP states starting inside the sleep epochs give -0.281 with 574 units. Tau is negative
    with p < 0.05 in each of the 14 sessions (-0.567 to -0.323) and in each mouse (-0.417, -0.369, -0.334).
    Onset thresholds of 0.3 to 0.7 give -0.259 to -0.238. Reading (b) cannot be run as written because
    the files hold no waveforms; its rate half (wake rate below 10 Hz, with or without the 0.5 Hz floor)
    gives -0.342 to -0.329 (p below 1e-18), negative and significant but outside the tolerance. The statement's
    link to PoSub ("as in PoSub") is tested by fig5c-posub-pmr-onset.
  deviations:
  - Which units enter is open (criterion readings a and b). Reading (b), putative EX units by trough-to-peak
    above 0.35 ms and open field rate below 10 Hz, cannot be applied, as the units carry no waveform;
    only its rate half was run. The outcome rests on reading (a), all sorted units, as Figure5F.py does;
    the count of entering units (570) equals the n of the Figure 5F legend, which supports it.
  - pynapple 0.11.4 replaces the unpinned pynapple version of the paper's code (a standard choice the
    criterion allows); compute_eventcorrelogram takes the same arguments.
- claim: fig5c-posub-pmr-onset
  outcome: reproduced
  assumed: true
  notebook: posub_000939.ipynb
  output: claim:fig5c-posub-pmr-onset
  measured: -0.177
  notes: On DANDI:000939, the 16 sessions hold 1,657 units and 1,097 EX units, the paper's counts, and
    1,096 EX units enter, as in the Figure 5C legend. With the paper's event files, and the states of
    A3708-200317b re-detected, tau = -0.177 (p = 3.7e-17), within 0.019 of -0.19. Without A3708-200317b
    tau is -0.195 (1,049 units). With the event file of A3708-200317b as it is, tau is -0.126 (p = 2.0e-9),
    outside the tolerance; with all states re-detected (an approximation of detectDOWNs_PoSub.py without
    its accelerometer step), -0.077. Tau is negative in all 16 sessions, with p < 0.05 in 7. No unit with
    an onset of 75 ms or more (46 units) has a PMR above 1.5 (largest 1.32), against 39% of the 198 units
    with an onset below 25 ms, as the statement says. The DOWN starts re-detected from the spikes and
    those of the 15 other event files cross-correlate with a sharp peak at -2.5 to -17.5 ms (25 to 67
    times the flanks), so no event file is offset by tens of ms.
  deviations:
  - The DOWN and UP states are the paper's event files (Analysis/OutputFiles, commit 4ee34f3), which the
    criterion names. The event file of A3708-200317b does not share the clock of that session's NWB spikes
    (population rate inside its DOWN states 454.7 Hz, the same as for intervals shifted by 0.5 s; no shift
    from -6,000 to +6,000 s brings it below 309 Hz), so its states were re-detected from the spikes with
    the procedure of detectDOWNs_RSC.py on the file's NREM within the home cage epochs, UP states restricted
    to NREM as detectDOWNs_PoSub.py does. The outcome rests on this replacement; with the event file as
    it is, tau is outside the tolerance.
  - EX units are the file's is_excitatory flag; the code also requires a gd flag the files do not hold.
    The counts (1,097 EX, 1,096 entering) match the paper's.
  - NREM is the file's sleep_states NREM within the home cage epochs, as detectDOWNs_PoSub.py intersects
    the sleep scoring with the sleep epochs; it is used only for the re-detection of A3708-200317b.
