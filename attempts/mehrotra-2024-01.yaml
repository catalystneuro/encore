findings:
- kind: metadata_error
  statement: The dandiset description says the 14 recordings hold 570 isolated units, as the paper's Methods
    do, but the files hold 638 units (31 to 71 per session). 570 is the number of units whose DOWN-to-UP
    PETH crosses half the mean rate within 155 ms, the units entering the paper's Figure 5F.
- kind: data_missing
  statement: The dandiset description lists LFP in each file, but no file holds LFP or any other electrical
    series; only spike times, epochs, sleep scoring, DOWN and UP states and tracking.
- kind: metadata_insufficient
  statement: Units carry no waveform, cell type, channel or depth, and the electrode table gives x, y
    and z as 0 for every channel, so the putative excitatory rule of the Methods (trough-to-peak and rate)
    cannot be applied and units cannot be placed on the probe.
- kind: metadata_error
  statement: session_start_time is 2024-05-09 (the upload day) in every file, while the identifiers carry
    the recording dates (A7801-210225 and so on, 2021).
- kind: metadata_error
  statement: In 9 of 14 sessions part of the SWS (NREM) epochs lies outside the sleep epochs; in A7803-210730
    one SWS interval, 7,680 to 9,565 s, covers two whole wake (arena) epochs.
- kind: methods_unavailable
  statement: Question for the paper's authors on Figure 5F. Which units enter the RSC test? All 638 sorted
    units give the legend's n of 570 entering units and tau = -0.275; the Methods say only EX units were
    analysed, which the deposited files cannot reproduce (no waveforms). This attempt assumed all units.
- kind: code_mismatch
  statement: In the paper's code (commit 4ee34f3), the DOWN and UP event file of PoSub session A3708-200317b
    does not fit the spikes of that session in DANDI:000939 (version 0.261016.2310); the population rate
    inside its DOWN states (454.7 Hz) equals that of shifted intervals (455.8 Hz), and no shift within
    6,000 s fits. The other 15 event files fit (0.0 to 136.7 Hz inside DOWN states).
- kind: metadata_error
  statement: In DANDI:000939 (version 0.261016.2310) the NREM epochs of sleep_states lie partly outside
    the home cage epochs in the paper's sessions, and in A3711-200810b, A3717-201021 and A3723-201115
    they run 3,508 to 5,092 s past the last spike of the recording.
- kind: other
  statement: In DANDI:000939 the LFP of A3705-200306 covers 11,168 s and that of A3711-200810b 9,499 s,
    while their spikes run to 16,199 s and 12,177 s; both LFPs have starting_time 0 and rate 1,250 Hz.
    In these two sessions and A3708-200317b high gamma power does not rise after the DOWN-to-UP transitions
    of the spikes (by 0.02 or less over shifted times, against 0.053 to 0.357 elsewhere), which suggests
    that their LFP and spikes do not share a clock. In A3708-200317b the LFP fits neither the spikes nor
    the session's event file in the paper's code (power after / before the event file's UP starts 0.997,
    0.998 when shifted by 0.5 s); only 1,488 of the event file's 6,187 UP starts lie in the file's NREM
    within the home cage.
- kind: metadata_insufficient
  statement: In DANDI:000939 the electrode table gives x, y and z as NaN, and its rel_y column is described
    only as "xy coordinate in electrode group"; which way it runs is said only in the probe description
    ("Channels sorted top to bottom of shank", electrode 0 with the largest rel_y).
- kind: selection_undocumented
  statement: DANDI:000939 holds 31 mice; the paper used 16 sessions, and which ones is recorded only by
    the event files in the paper's code repository.
- kind: metadata_insufficient
  statement: DANDI:000056, which holds 8 of the 9 ADN sessions the paper's code names, gives no location,
    shank or electrode for its units, so ADN units cannot be selected.
- kind: methods_unavailable
  statement: Question for the paper's authors on Figure 1B. Is HD information in bits per spike or bits
    per second? The formula printed in the Methods gives bits per second, which correlates with depth
    here (tau = 0.082, p = 5.1e-5); bits per spike, the unit used for the Isomap cell selection, does
    not (p = 0.099). This attempt assumed bits per spike.
- kind: methods_unavailable
  statement: Question for the paper's authors on Figure S1I. How is a session halved (first and second
    half, or alternating DOWN states), and which correlation is used? Three of four readings find DU more
    stable than UD; first and second half with Pearson's R does not (p = 0.40).
- kind: methods_unavailable
  statement: Question for the paper's authors on Figure S1L. Were the predictors (DV position and NREM
    firing rate) standardized, and are the coefficients compared signed or in absolute value? Only standardized
    predictors with signed coefficients reproduce both tests.
- kind: methods_unavailable
  statement: Question for the paper's authors on Figure 2 and S2D. How is high gamma power taken from
    the filtered LFP, is the UP onset delay measured from DU or from the delta peak, in which window is
    the maximal slope searched, and how is the UD timing measured on the LFP? Aligned to DU the rise travels
    but the drop before the DOWN start does too; aligned to the delta peak neither does.
- kind: methods_unavailable
  statement: Question for the paper's authors on Figure S2E. Is the speed the slope of depth on delay
    or the inverse of the slope of delay on depth? The first gives the paper's unit speeds (6.97 against
    6.72 mm/s) and was assumed.
- kind: selection_undocumented
  statement: The paper's Figure 5E uses 25 sessions of CRCNS fcx-1, which holds 27; which 25 is recorded
    only in a list (dataset_DM.list) that the code repository does not hold.
- kind: code_mismatch
  statement: Figure5E.py (commit 4ee34f3) reads buzcode files of the frontal cortex data (SlowWaves events,
    CellClass and spikes cellinfo) that CRCNS fcx-1 does not hold; the data set gives spike times, cell
    classes and UP and DOWN states in other files (SStable, CellIDs, UPDOWNINtervals).
- kind: methods_unavailable
  statement: Question for the paper's authors on Figure 5E. Are the SlowWaves UP states of the code the
    UPInts of the data set's UPDOWNINtervals.mat, or the spike-based ON intervals, and which 25 sessions
    were used? UPInts give tau = -0.221 over 27 sessions, ON intervals -0.162. This attempt assumed UPInts.
- kind: methods_unavailable
  statement: Question for the paper's authors on Figure 1K. Are the time steps whose ring radius is below
    the threshold left out of the cumulative circular variance, and is the variance averaged over UP states
    before the slope is taken? Leaving them out gives no difference between the traveling and control
    intervals (p = 0.27 over 16 sessions, and 0.10 and 0.21 with the rings of two other random draws);
    keeping them gives p = 0.052, 0.025 and 0.044, near the paper's result. This attempt
    assumed they are left out.
- kind: other
  statement: In DANDI:000939 the Isomap ring of the HD cells (makeRing.py) does not follow head direction
    in wake in A3706-200313 and A3730-210323b (mean resultant length of ring angle against head direction
    0.114 and 0.328, against 0.627 to 0.936 in the other 14 sessions).
