    delta-peak readings do not (R = 0.412, p = 0.13; R = 0.462, p = 0.071). The criterion blocks the claim
    when the readings disagree on significance. The open LFP details are those of fig2f-gamma-travels.
  deviations:
  - The main reading leaves out the three sessions whose LFP is not shown to share the clock of the spikes,
    as for fig2f-gamma-travels; all 16 are run as a variant.
- claim: figs2e-speed-similar
  outcome: not_reproduced
  assumed: true
  notebook: posub_lfp_000939.ipynb
  output: claim:figs2e-speed-similar
  measured:
  - 6.97
  - 38.91
  notes: 13 sessions have a significant unit delay-depth correlation, as in the paper. With speed as the
    slope of depth on delay, units give 6.97 +/- 4.38 mm/s (paper 6.72 +/- 4.08). On the 13 sessions whose
    LFP clock is shown, the LFP gives 15.96 to 39.50 mm/s under the eight readings of fig2f-gamma-travels
