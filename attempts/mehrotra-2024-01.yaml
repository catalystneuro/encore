- claim: rsc-dataset
  outcome: not_reproduced
  notebook: reproduce_mehrotra_2024.ipynb
  output: claim:rsc-dataset
  measured:
  - 638
  - 14
  - 3
  notes: The dandiset holds 14 sessions from 3 mice (A7801 4 sessions, A7802 2, A7803 8), as stated, and
    638 sorted units, 68 more than 570 (1.119 times), outside the 10% band of 513 to 627, so the criterion's
    partial outcome does not apply either. No unit selection of the Methods gives 570 (606 units with
    at least 0.5 Hz in wake, 412 below 10 Hz, 380 both). Exactly 570 units cross half their mean rate
    within 155 ms of DU and enter the Figure 5F test (fig5f-rsc-pmr-onset), so the paper's "570 units
    were recorded", repeated in the dandiset description, appears to count those units. The count per
    session ranges from 31 to 71, as the description says. No session is deposited twice.
