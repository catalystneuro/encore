- claim: fig2f-gamma-travels
  outcome: not_reproduced
  notebook: posub_lfp_000939.ipynb
  output: claim:fig2f-gamma-travels
  notes: 'No reading gives both parts of the claim. Main reading, the 13 sessions whose LFP is shown to
    share the clock of the spikes: aligned to DU (the Methods), the time of maximal slope of high gamma
    power depends on channel position (median tau -0.742 to -0.659; one-sample Wilcoxon W = 7 to 9, p
    = 0.0046 to 0.0081; paper W = 21, p = 0.013), but so does the time of maximal negative slope before
    the DOWN start (median tau -0.810 to -0.749, W = 0, p = 2.4e-4; paper p = 1), so the drop is not synchronous
    by this measure. Aligned to the delta peak (Figure 2D legend), the rise does not depend on position
    (p = 0.27 to 1.0). With the UD window written in the criterion (0 to 150 ms after the DOWN start)
    the delays are constant in 12 of 13 sessions and the UD test cannot be run. On all 16 sessions the
    picture is the same (DU p = 0.0017 to 0.0034; UD p = 3.1e-5 to 1.2e-4; delta peak DU p = 0.39 to 0.60).
    The delta-peak readings rest on 0.37 to 4.76 peaks per minute of NREM, so they are noisy. In A3708-200317b
    high gamma power rises neither after the re-detected DU (1.045 against 1.048 shifted) nor after the
    UP starts of its event file (0.997 against 0.998), so its LFP fits neither stream.'
  deviations:
  - The paper has no code for Figure 2. The readings of the criterion were all run (power as the absolute
    Hilbert transform or the square; DU or delta-peak alignment; two windows). For the UD measure the
    mirror window, -150 to 0 ms, was added, because the window as written lies after the drop.
  - The delta channel is the middle channel of the probe (a standard choice; the Methods name none) and
    faulty channels are left out. The LFP is downsampled by taking every second sample; filters run forward
    and backward within each NREM interval.
  - 'A3705-200306, A3708-200317b and A3711-200810b are left out of the main reading: their high gamma
    power rises after DU by no more than after the same times shifted by 0.5 s (rise over the shifted
    control 0.02 or less, against 0.053 to 0.357 in the other sessions), so their LFP is not shown to
    share the clock of the spikes. All 16 sessions are run as a variant.'
  - The criterion blocks the claim when readings disagree; here every reading fails it, on different parts,
    so the outcome is not reproduced.
- claim: figs2d-lfp-spike-agree
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: posub_lfp_000939.ipynb
  output: claim:figs2d-lfp-spike-agree
  notes: On the 13 sessions whose LFP clock is shown, the per-session unit and LFP coefficients correlate
