- claim: fig1g-dv-sequence-du
  outcome: reproduced
  assumed: true
  notebook: posub_000939.ipynb
  output: claim:fig1g-dv-sequence-du
  notes: 'Per session, the Kendall tau of UP onset delay against position is negative in 15 of 16 sessions
    (median -0.309) and differs from 0 (one-sample Wilcoxon W = 1, p = 6.1e-5, the paper''s values); the
    UD tau does not (W = 38, p = 0.13, the paper''s values); DU and UD differ (Mann-Whitney U = 51, p
    = 0.0039; paper U = 52, p = 0.005). With the event file of A3708-200317b as it is (UD tau undefined
    there, 15 sessions) or without that session, the UD tau differs from 0 (W = 25, p = 0.048) and the
    claim would hold only in part; with all states re-detected it holds (UD p = 0.13, U p = 0.048). The
    result is fragile: the UD part rests on the re-detected states of the one session whose event file
    fails the clock check.'
  deviations:
  - The states of A3708-200317b are re-detected, as for fig5c-posub-pmr-onset; the UD part of the outcome
    rests on this.
  - Position is the rel_y of the unit's peak electrode (12.5 um steps), larger toward dorsal. The rel_y
    column is described only as "xy coordinate in electrode group"; the direction is from the probe description
    in the file ("Channels sorted top to bottom of shank"; electrode 0 has the largest rel_y in every
    session), and Figure1H.py also puts larger depth values dorsal.
  - The UD timing follows Figure1G.py (last bin above 0.5 between -150 and -5 ms of the PETH around DOWN
    starts, for units that also cross after +5 ms), with pynapple's correlogram in place of the code's
    crossCorr.
- claim: fig1h-ventral-down-longer
  outcome: reproduced
  notebook: posub_000939.ipynb
  output: claim:fig1h-ventral-down-longer
  notes: Ventral DOWN states are longer than dorsal ones with all units (median 107.5 against 97.5 ms,
    longer in 12 of 16 sessions, equal in 2; Wilcoxon W = 12, p = 0.011; paper W = 9, p = 0.01) and with
