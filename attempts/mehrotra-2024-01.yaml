- claim: fig1e-delay-range
  outcome: reproduced
  notebook: posub_000939.ipynb
  output: claim:fig1e-delay-range
  measured:
  - 5
  - 100
  notes: Under reading (b), the 1st and 99th percentiles of the 1,096 pooled UP onset delays are 5 and
