  source: https://github.com/AllenInstitute/patchseq_human_L23 at commit 3daf9f0803ea0c220a040ea523f23af5f93c56ac
outcomes:
- claim: features-and-labels-link
  outcome: reproduced
  notebook: reproduce_berg_2020.ipynb
  output: claim:features-and-labels-link
  notes: No file carries a SpecimenID, so the criterion's match is run under two readings (question
    in questions/000023.yaml). M1, a SpecimenID stored in the files, matches 0 files. M2, the
    SpecimenID recovered from the file as the next SpecimenID of the same donor above the file's
    session id (offsets 13 to 685, the next candidate at least 28 further), gives 318 distinct cells
    of the 385-cell table, including all 283 cells with features in the code. For the 282 matched
    cells with features on both sides, the median relative difference from the code's table is 0 for
    all 18 features; 145 cells agree on every shared feature and 275 on at least 80% of them. A match
    on the features alone, within donor, picks the M2 cell for 282 of 282 files. The donor table
    agrees on sex for 55 of 56 donors and on age within a year for 55 of 56. The files hold no t-type
    or depth, so every label comes from the code's table.
  deviations:
  - The SpecimenID of each file was recovered from its session id and donor, not read from the file;
    the code's per-cell features confirm the match.
  - Features computed with IPFX 2.1.2 (the paper gives no version), read from its output as the
    code's feature names imply (patchseq_l23.FEATURE_SOURCES); the code does not hold that step.
