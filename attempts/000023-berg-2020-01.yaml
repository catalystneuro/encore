findings:
- kind: identifier_missing
  statement: The files carry no SpecimenID, the identifier by which the paper's code and tables name
    cells. Each file can be linked only by its donor and its ephys session id, which lies 13 to 685
    below the cell's SpecimenID; the code's per-cell features confirm the link for every cell that
    has them.
- kind: metadata_insufficient
  statement: The files carry no t-type, soma depth, brain region or medical condition, on which every
    finding of the paper rests; they must be taken from the paper's code. session_description and the
    filtering field read PLACEHOLDER, and the archive summary gives the variable measured as
    ProcessingModule and the technique as "analytical technique".
- kind: selection_undocumented
  statement: The dandiset holds 318 of the 385 cells of the paper's table, including all 283 cells
    with electrophysiological features in the paper's code; the other 67 are absent. 25 of the 35
    cells without features in the code give features with IPFX here (5 of them fail cell QC), and
    which recordings were judged too incomplete, or why, is not said.
- kind: metadata_error
  statement: Donor H18.03.318 is female in the files and male in the paper's donor table and cell
    table; donor H18.06.005 is 56 years old in the files (P20440.0D) and 57 in both tables.
- kind: code_mismatch
  statement: The code's feature table measures adaptation as the mean over all spiking long squares,
    initial firing rate on the hero sweep (about 50 pA above rheobase) and tau from long squares,
    where the Methods describe adaptation at about 50 pA above rheobase, initial rate at rheobase and
    tau from short pulses. The features recomputed here match the code's table, not the Methods.
- kind: code_mismatch
  statement: The mouse NeuN section files in the paper's code repository do not give the values
    Code7_cortical_depth_code_mouse.r prints (mouse L2/3 thickness 32, 133 and 90 um against 281, 223
    and 257; density 350 against 165 thousand per mm3), and every mouse soma lies below the second
    boundary line; the human files reproduce Code6's printed values exactly.
- kind: code_mismatch
  statement: The code's gene-depth table (frem_genes_depth.csv) is from the revision (4417 genes at
    FDR below 0.05), not the preprint (790), and the Patch-seq transcriptomes behind either are not in
    the repository.
- kind: other
  statement: Spike times computed here with IPFX equal the spike times stored in each file's
    processing/spikes for the rheobase sweep of all 307 cells with features, and no spike occurs in
    the second before any long-square step, so the stored spikes, responses and stimuli share one
    clock.
