outcomes:
- claim: features-and-labels-link
  outcome: reproduced
  notebook: reproduce_berg_2020.ipynb
  output: claim:features-and-labels-link
  notes: No file carries a SpecimenID. The answer to the question (questions/000023.yaml) found that
    the paper names no identifier and allows both readings, and the criterion names them and asks
    for both to be run and reported; the outcome is under M2, and under M1 it would be not reproduced.
    M1, a SpecimenID stored in the files, matches 0 files. M2, the SpecimenID recovered from the file
    as the next SpecimenID of the same donor above the file's session id (offsets 13 to 685, the next
    candidate at least 28 further), gives 318 distinct cells of the 385-cell table, including all 283
    cells with features in the code. With the Methods' sweep QC, 261 of these have features on both
    sides; the median relative difference from the code's table is 0 for all 18 features, 128 cells
    agree on every shared feature and 248 on at least 80% of them, and a match on the features alone,
    within donor, picks the M2 cell for 261 of 261 files. With IPFX's sweep QC alone the agreement is
    closer (145 cells identical on every shared feature; 1 of the code's cells with no features here,
    against 22). The 35 cells with no features in the code cannot be checked by features; for all 35
    the date in the cell's sample_id equals the file's local recording date (279 of the 283 checked
    cells too, the other 4 started after midnight, the day after the sample's date), and in each of 71
    rig-days with two or more files (253 files, 27 of the 35) tube numbers rise with recording time
    without exception. These checks support the 35 links without proving them, as the date separates
    only cells recorded on different days. The donor table agrees on sex for 55 of 56 donors and on
    age within a year for 55 of 56. The files hold no t-type or depth, so every label comes from the
    code's table. Every claim that needs a label uses M2 and says so.
  deviations:
  - The SpecimenID of each file was recovered from its session id and donor, not read from the file;
    the code's per-cell features confirm the match for the 283 cells that have them, and the sample
    dates and tube order support it for the other 35.
  - Features computed with IPFX 2.1.2 (the paper gives no version), read from its output as the
    code's feature names imply (patchseq_l23.FEATURE_SOURCES); the code does not hold that step.
  - The sweep QC is the Methods'. IPFX 2.1.2 applies only the noise limits to sweeps, so the Methods'
    bias current (0 +/- 100 pA) and bridge balance (below 20 MOhm and 15% of input resistance) limits
    were added, with the input resistance of IPFX's cell QC for the 15% limit, which the Methods do not
    fix (asked in questions/000023.yaml). Long squares without a bias current value were kept.
