    the archive through the API and checked the helper functions by reading only (numpy, scipy and
    statsmodels were not installed for it). Its report gives its own outcome for 32 claims; it gives
    none for fig6-deep-morph-anova, which is left out below. Of the 32, its outcome matches the
    record's on 26; on six blocked claims it gives data_missing where the record gives other. It found
    the mouse section port faulty, which bears on fig1b-density, fig1c-soma-area and
    fig1c-soma-variation, and asked for checks of the 35 links the features cannot confirm and of the
    sweep QC.
  results:
  - claim: features-and-labels-link
    agrees: true
    outcome: reproduced
    reason: M1 links 0 files. Under M2, 318 files link to 318 distinct cells, and all 283 of the code's
      cells that have features have a file. The median relative difference is 0 for all 18 features
      over 282 cells, and a match on features alone picks the M2 cell 282 of 282 times. Problem 1,
      labels for 35 of the 318 files are unverified; M2 links each file to the next SpecimenID above
      its session id, which by construction links every file, so "files not matched to the table, 0"
      is circular, and the claims file's "other cells, counted apart" can never be found. Problem 3,
      cell QC is computed but not applied; the Methods require it, and the link criterion names only
      sweep QC, an omission in the claims file. It could not check whether sweep QC worked as the
      Methods say, and asked for the reasons sweeps failed QC, confirmation that the bias-current
      criterion was used, and the IPFX version.
    response: Outcome kept. Added the per-file table the verifier asked for (offset and gap to the next
      candidate, split by whether the code's table has features for the cell) and two checks of M2 that
      do not use the features; the date in the cell's sample_id equals the file's local recording date
