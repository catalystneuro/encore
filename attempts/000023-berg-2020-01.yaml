  outcome: not_reproduced
  notebook: reproduce_berg_2020.ipynb
  output: claim:cohort-cells
  measured:
  - 318
  - 307
  notes: 318 cells of the code's 385-cell table have a recording in the dandiset. Cells giving
    features are 307 under reading (a), 256 under (b) and 306 under (c), none 283. The code's own
    table has features for exactly 283 human cells, all with a file here; 25 more cells give features
    here but have none in the code (5 of them fail IPFX cell QC), and one of the 283
    (H18.03.322.11.11.01.02) gives none here (IPFX fails on its f-I fit).
  deviations:
  - The cells with features are those for which IPFX 2.1.2 gives features after sweep QC; the paper's
