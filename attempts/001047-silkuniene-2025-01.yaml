- claim: fig3a-centre-enhanced
  outcome: not_reproduced
  notebook: reproduce_silkuniene_2025.ipynb
  output: claim:fig3a-centre-enhanced
  assumed: true
  notes: No CANCAN profile peaks at x = 0 under every reading at either burst label shared by
    the two rates. At x1 the 0.2 MHz CANCAN wells are essentially unstained (centre -1.4 a.u.,
    profile maximum 32 a.u., n = 4) and the 1 Hz CANCAN profile peaks at 6.5 to 7 mm (n = 6). At
    x5 the 0.2 MHz profile peaks at -1, -0.4 or 1 mm depending on the reading (n = 6) and the 1 Hz
    profile off centre (n = 5). The pooled controls at x1 are lower at the centre (245 +/- 172
    a.u.) than at 6 mm (868 +/- 273) and 7 mm (618 +/- 197), O1 a, O2 a, but without a gap
    larger than the error bars; at x5 the control centre (1663) is above 7 mm (1517).
  deviations:
  - Only 1 Hz and 0.2 MHz are in the dandiset; the paper's other rates (1 kHz, 10 kHz and one
    more below 10 kHz) are not.
  - The paper's 2 bursts (x4) cannot be identified among the dandiset's burst labels (x1, x2, x3,
    x5; most files say "Unknown repetitions"). Assumed that the rate comparison at a fixed burst
    number is tested by comparing the rates at each label both share (x1 and x5), and that the
    claim is reproduced when it holds at both and partially when at one. The paper's controls
    are of unstated rate; the controls of both rates at the same label are pooled, and each rate
    is shown alone as a variant.
  - The array centre is found by matching the paper's electrode geometry (Methods 2.2) to the
    footprints in the YP image, or, where the match is weak, from the centroid of the stain (an
    assumption of four-fold symmetry); the paper placed ROIs by hand. One 0.2 MHz CANCAN x1
    area whose centre fell at the image edge is dropped.
  - Background is the mean over the four footprints of 3 ROIs each (Methods 2.5 says 3 ROIs in
    one footprint without saying which); the darkest footprint is shown as a variant for the
    ratio claim.
- claim: fig3bc-rate-suppresses-off-target
  outcome: not_reproduced
  notebook: reproduce_silkuniene_2025.ipynb
  output: claim:fig3bc-rate-suppresses-off-target
  assumed: true
  notes: At x1 YP at 0.2 MHz is below 1 Hz at 6 mm (9.1 +/- 3.8 against 152.5 +/- 76.2 a.u.,
    gap beyond the error bars, t test p = 0.17) and at 7 mm (4.9 +/- 2.9 against 174.0 +/- 130.9,
    gap not beyond the error bars, p = 0.33); at the perimeter the outermost parallel ROIs are
    lower at 0.2 MHz (0.6 against 18.8 a.u., O1 a), beyond the error bars under O1 a only, and
    the mean of parallel ROIs at 4 mm or more is not lower (6.8 against -10.1). At x5 YP at 0.2
    MHz is higher than at 1 Hz at 6 mm (1534 against 1173) and 7 mm (917 against 780), and lower
    at the perimeter without a gap (726 against 1253, p = 0.24). The direction near the
    electrodes matches the paper at x1 only, where the 0.2 MHz wells are unstained everywhere.
  deviations:
  - Burst labels x1 and x5, as for fig3a-centre-enhanced (assumption).
  - The parallel profile is measured on every area; the paper measured it in one set of
    experiments, which the dandiset does not identify.
- claim: fig3-lorentzian-profile
  outcome: not_reproduced
  notebook: reproduce_silkuniene_2025.ipynb
  output: claim:fig3-lorentzian-profile
  assumed: true
  measured: 0.361
  notes: Measured is R for 1 Hz CANCAN at x1, diagonal, O1 a, O2 a, the first reading listed.
    No rate meets R > 0.9 with p < 0.001 under every reading and profile at either label. The 1
    Hz CANCAN fits give R from -0.89 to 0.72 (x1 and x5); the x1 0.2 MHz profiles have no central
    peak (R negative, FWHM at the 100-mm bound). The x5 0.2 MHz profiles give R 0.80 to 0.96 and
    pass in 4 of 8 profile and reading combinations, with FWHM 7.0 to 8.9 mm. No fit failed.
  deviations:
  - Only 1 Hz and 0.2 MHz; burst labels x1 and x5 (assumption, as for fig3a-centre-enhanced).
- claim: fig3-tail-deviation-falls-with-rate
  outcome: partially_reproduced
  notebook: reproduce_silkuniene_2025.ipynb
  output: claim:fig3-tail-deviation-falls-with-rate
  assumed: true
  notes: At x1 the mean deviation of data from fit beyond 4 mm is larger at 1 Hz than at 0.2 MHz
    under every reading, in a.u. and in percent of the fitted peak (diagonal, O1 a, 145.0 against
    -3.7 a.u.), so the Spearman coefficient over the two rates is -1. The x1 0.2 MHz profile is
    near zero everywhere and its fit has no peak, so this shows less stain far out, not a better
    fit. At x5 the order is reversed under every reading (diagonal, O1 a, -207.5 against 429.9
    a.u.). With two rates the Spearman coefficient is +1 or -1 and has no test.
  deviations:
  - Only 1 Hz and 0.2 MHz, so a trend over rates reduces to one comparison; burst labels x1 and
    x5 (assumption, as for fig3a-centre-enhanced).
- claim: fig4b-centre-no-rate-effect
  outcome: reproduced
  notebook: reproduce_silkuniene_2025.ipynb
  output: claim:fig4b-centre-no-rate-effect
  assumed: true
  notes: Centre YP does not differ between rates at either label. x1, 1 Hz 1.0 +/- 21.8 against
    0.2 MHz -1.4 +/- 6.3 a.u., t = 0.09, p = 0.93 (n = 6 and 4). x5, 1576 +/- 465 against 2275
