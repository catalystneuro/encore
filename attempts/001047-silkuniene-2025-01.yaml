findings:
- kind: data_missing
  statement: The dandiset holds CT26 monolayers at two packet rates (1 Hz and 0.2 MHz) and CHO
    monolayers with one burst label. It has no images at 1 kHz or 10 kHz, no 300- or 900-ns
    pulses, no raised electrodes, no thermochromic film images and no CHO burst series, so 11 of
    the paper's 20 findings cannot be tested.
- kind: metadata_error
  statement: The dandiset description and every file's protocol text give a 3.8-mm electrode
    spacing, a 3.2-kV first pulse and 75, 50 and 25% steps. The paper used a 15.3-mm array, a
    7.2-kV first pulse and 16-pulse packets falling by 12.5% per phase, and the CT26 images show
    electrode footprints at the paper's spacing (best match 6.2 mm from the centre along each
    axis, against 6.4 mm from the paper's geometry, over 52 two-well areas).
- kind: metadata_insufficient
  statement: The number of bursts is given only in the subject label (x1, x2, x3, x5); most
    session descriptions say "Unknown repetitions", and the labels cannot be matched to the
    paper's "1 burst (x4)" to "6 bursts (x4)". The CT26 files state no pixel size (the
    `resolution` attribute of the image data is 96 in CT26 files and 0.1 in CHO files, neither a
    pixel size), and no file gives the electrode elevation.
- kind: other
  statement: The CT26 images are on two scales without saying so. Whole-well images (21870 x
    21289 pixels) fit the 35-mm well at 1.625 um per pixel, and two-well images fit the
    electrode spacing at 3.25 um per pixel. Whole-well images also have backgrounds several
    times those of the two-well images, so their arbitrary units differ.
- kind: other
  statement: The paper's 0.2 MHz CANCAN result, a sharp central spot with 40-fold suppression near
    the electrodes, is not seen in the dandiset. At the burst labels shared with 1 Hz, the 0.2
    MHz CANCAN wells are either unstained (x1) or broadly stained with a centre to
    near-electrode ratio of 1.4 to 2.5 (x5). The dandiset's images may be other experiments than
    those of the paper's figures.
- kind: selection_undocumented
  statement: The dandiset holds more wells per condition than the paper reports (for example 6
    CT26 1 Hz CANCAN wells at label x1 where the paper's S1 has n = 3 per rate), and a CHO set
    at 1 Hz that the paper does not report. Which wells the paper used is not stated. No well
    was found deposited twice (peak normalised cross-correlation at most 0.04 between areas of
    the same condition, against 0.70 for a shifted, noisy copy of one area).
- kind: metadata_error
  statement: The CHO files use session_start_time 2024-12-11, the conversion date, while their
    OME metadata give acquisition on 2024-08-14.
- kind: methods_unavailable
  statement: Questions for the paper's authors. Which burst number does each subject label (x1,
    x2, x3, x5) of the dandiset mean, and which of its wells make up the 2 bursts (x4) sets of
    Figures 3 to 5? Were the wells imaged for propidium on May 24 2024 exposed with the
    electrodes touching the monolayer? In which electrode footprint were the 3 background ROIs
    placed, and how was the array centre located for the ROIs? This attempt assumed that the
    rates can be compared at each label both share (x1, x5), that the propidium wells had the
    electrodes touching, used the mean of the four footprints for background, and located the
    centre from the footprints in the YP image.
