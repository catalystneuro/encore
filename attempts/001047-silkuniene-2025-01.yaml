- claim: fig3a-centre-enhanced
  outcome: not_reproduced
  notebook: reproduce_silkuniene_2025.ipynb
  output: claim:fig3a-centre-enhanced
  assumed: true
  notes: At x1 (2 bursts, adopted) no CANCAN profile peaks at the centre under any reading. The 1 Hz profile
    peaks 6.5 to 7 mm from it (n = 6) and the 0.2 MHz wells are essentially unstained (centre -1.4 a.u.,
    maximum 21 to 37 a.u., n = 4). Under the total reading the 1 Hz x2 profile (2 bursts, n = 2) peaks
    5 to 6 mm from the centre, so the CANCAN part fails under both readings of the labels. The pooled
    x1 control is lower at the centre (245 +/- 172 a.u.) than at 6 mm (868 +/- 273) and 7 mm (618 +/-
    197), O1 a, O2 a, without a gap beyond the error bars under any F8 reading. In the x5 variant no CANCAN
    profile peaks at 0. Without the flagged 1 Hz control area 013Control-x1_obj-6stwj8 W, whose centre
    sits on the stain, the control part holds under every reading (centre 74 +/- 23 a.u. against 990 +/-
    268 at 6 mm and 668 +/- 209 at 7 mm, n = 11, O1 a, O2 a), but the CANCAN part fails as before, so
    the outcome is the same.
  deviations:
  - Only 1 Hz and 0.2 MHz are in the dandiset; the paper's other rates (1 kHz, 10 kHz and one more below
    10 kHz) are not.
  - Burst labels read as repeats after the first burst, so that x1 is the paper's 2 bursts (x4) at both
    rates (assumption). The files' protocol text says the protocol "was either repeated 2, 3, or 5 times"
    upon completion, and under this reading x5 is 6 bursts (x4), the paper's largest number (Figure 7).
    Under the other reading (the label is the total) 2 bursts exists only at 1 Hz (x2); that reading is
    shown, with 1 Hz x2 against 0.2 MHz x1 and x3, which bracket 2 bursts. x5 is shown as a variant and
    decides nothing. The paper's controls are of unstated rate; the controls of both rates at the same
    label are pooled, and each rate is shown alone as a variant.
  - The error-bar rule (F8, Methods 2.5, "A gap exceeding the length of the error bars") is read as a
    gap beyond the longer s.e. arm, so that the gap exceeds each error bar (assumption); the mean-arm
    and shorter-arm readings are shown.
  - The array centre is found by matching the paper's electrode geometry (Methods 2.2) to the footprints
    in the YP image, or, where the match is weak, from the centroid of the stain (an assumption of four-fold
    symmetry); the paper placed ROIs by hand. Six areas whose centre is visibly misplaced are flagged
    and kept, and the claims they enter are also shown without them, with the same outcomes. Three areas
    whose centre fell near an image edge are dropped.
  - Background is the mean over the four footprints of 3 ROIs each (Methods 2.5 says 3 ROIs in one footprint
    without saying which); the darkest footprint is shown as a variant for the ratio claim.
