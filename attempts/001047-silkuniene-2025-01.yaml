findings:
- kind: data_missing
  statement: 'The dandiset holds CT26 monolayers at two packet rates (1 Hz and 0.2 MHz) and CHO monolayers
    with one burst label. It has no images at 1 kHz or 10 kHz, no 300- or 900-ns pulses, no thermochromic
    film images and no CHO burst series, so 9 of the paper''s 20 findings cannot be tested for missing
    data. Two more are blocked for missing metadata: no file gives the electrode elevation, so wells with
    raised electrodes, if any are in the dandiset, cannot be identified, and the burst labels cannot be
    matched to 1 burst with certainty.'
- kind: metadata_error
  statement: The dandiset description and every file's protocol text give a 3.8-mm electrode spacing,
    a 3.2-kV first pulse and 75, 50 and 25% steps. The paper used a 15.3-mm array, a 7.2-kV first pulse
    and 16-pulse packets falling by 12.5% per phase, and the CT26 images show electrode footprints at
    the paper's spacing (best match 6.1 mm from the centre along each axis, against 6.4 mm from the paper's
    geometry, over 52 two-well areas). The voltage cannot be checked from the images; if the CT26 wells
    were exposed at 3.2 kV, they are not the paper's 7.2-kV experiments.
- kind: metadata_insufficient
  statement: The number of bursts is given only in the subject label (x1, x2, x3, x5); all but one CT26
    subject say "Unknown repetitions", and the protocol text says only that the protocol "was either repeated
    2, 3, or 5 times", without saying whether the first application counts, so the labels cannot be matched
    to the paper's "1 burst (x4)" to "6 bursts (x4)" with certainty. The CT26 files state no pixel size
    (the `resolution` attribute of the image data is 96 in CT26 files and 0.1 in CHO files, neither a
    pixel size), and no file gives the electrode elevation.
- kind: other
  statement: The CT26 images are on two scales without saying so. Whole-well images (21870 x 21289 pixels)
    fit the 35-mm well at 1.625 um per pixel, and two-well images fit the electrode spacing at 3.25 um
    per pixel (best match 4% below the paper's geometry). At 1.625 um the whole-well images match the
    electrode spacing 9% above the paper's geometry (3 areas), which was not resolved. Whole-well images
    also have higher backgrounds (mean of the four footprints 1061 to 4560 a.u., mean 2628, 7 YP areas,
    against 180 to 1121, mean 332, 45 YP areas, in two-well images), so their arbitrary units differ.
- kind: other
  statement: The paper's 0.2 MHz CANCAN result, a sharp central spot with 40-fold suppression near the
    electrodes, is not seen in the dandiset. At x1, read here as the paper's 2 bursts (x4), the 0.2 MHz
    CANCAN wells are unstained everywhere (group-mean profile within 32 a.u. of background); at x3 and
    x5 they are broadly stained, with a centre to near-electrode ratio of 1.4 to 4.0. The dandiset's images
    may be other experiments than those of the paper's figures.
- kind: selection_undocumented
  statement: The dandiset holds more wells per condition than the paper reports (for example 6 CT26 1
    Hz CANCAN wells at label x1 where the paper's S1 has n = 3 per rate), and a CHO set at 1 Hz that the
    paper does not report. Which wells the paper used is not stated. No well was found deposited twice
    (peak normalised cross-correlation at most 0.039 over all 1654 pairs of areas in the same channel,
    whatever their condition and label, against 0.70 for a shifted, noisy copy of one area).
- kind: metadata_error
  statement: The CHO files use session_start_time 2024-12-11, the conversion date, while their OME metadata
    give acquisition on 2024-08-14.
- kind: methods_unavailable
