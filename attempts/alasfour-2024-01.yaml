  - 415.7
  - 313.4
  - 380.6
  - 517.6
  - 230.0
  - 285.8
  - 184.5
  - 37.9
  notes: Good electrodes per day are 01 [85, 91, 91, 91], 02 [85, 85, 81, 80], 04 [67, 80, 81, 82, 77],
    05 [104, 104, 100], 08 [83, 82, 87, 82, 85]; Table 1 (85, 80, 67, 104, 82) matches the minimum over
    days for 4 of 5, the first day for 3, the electrodes good on all days for 1. Minutes before rejection
    exceed Table 1 (01 talking 763.5 against 493, TV 1162.6 against 605); after rejection by rule (a)
    they fall below it (01 talking 171.6); at most 4 of the 15 values are within 10% under any reading
    (O4 a-i). Talking plus TV is at least 120 min for all five under every reading. Sex and age are not
    in the dataset. Measured gives the minimum good count over days and the minutes before rejection.
  deviations:
  - Minutes are summed epoch durations of single-label epochs inside the ECoG; epochs are not all 2 min
    long.
- claim: fig2-highest-accuracy
  outcome: reproduced
  notebook: reproduce_alasfour_2024.ipynb
  output: claim:fig2-highest-accuracy
  measured: 61.3
  notes: In 30 of 96 pipelines inferior temporal high gamma has the highest of the 40 accuracies and lies
    within 62.1 to 75.9% (0.695 to 0.730); all 30 use O6 (a) and O5 (a) or (b). Under the main reading
    it is 0.613, second after middle temporal high gamma (0.628). Measured is the main reading.
  deviations:
  - The paper links no code; every open detail is run under the readings the claims file names (O4 artifact
    rule and SD, O5 ROI assignment and density, O6 ROI feature, O7 buffer, O9 chance level), a grid of
    96 pipelines by 4 chance levels. The outcome follows the criterion, which accepts a match under one
    reading; the notes give how many readings match and the result under the main reading.
  - 'Main reading, an assumption of this attempt: O4 (a) with the day''s SD (the electrodes table''s standard_deviation
    column), O5 reading (c), O5 density (ii), O6 (a), O7 (a), and O9 alpha 0.05 with n all test samples
    of the participant (Figure 2 legend, one dashed finite chance line).'
  - O5 reading (c) is taken from Methods 2.1 ("The projection matrices were thresholded only to include
    electrodes close to any of the eight defined ROIs, and the ROI label was assigned by choosing the
    ROI closest to each electrode"); an electrode is kept when its largest Gaussian value over all left
    AAL regions is one of the eight. Electrodes are mirrored to the left hemisphere, as the matrices'
    left-side columns imply.
  - Analysed electrodes are those flagged good on every day of the participant (85, 79, 58, 99, 68), an
    assumption; Table 1's counts match no reading of the per-day flags.
  - Only epochs labelled with exactly one of Talk, TV or Computer/phone are used; epochs with two labels
    (for example Talk, TV) are left out, an assumption. 10-s bins with a missing value in an analysed
    electrode are dropped (312, 182, 871, 11 and 73 bins).
  - The Butterworth filters (order 4, zero phase, the claims file's standard choice O3) and the Hilbert
    envelope are computed in the frequency domain on each block with 5 s of padding each side; the notebook
    shows they agree with sosfiltfilt and scipy.signal.hilbert within 0.6%.
  - The epochs of sub-01 ses-7 and sub-04 ses-3 are shifted by the session start minus 19:00 (8.52 h and
    8.35 h) to the ECoG clock; the clock of sub-04 ses-3 is not established (its day decodes at 0.460).
  - Under the main artifact reading many blocks are dropped (participant 01 keeps 303 of 1180); the rule
    as read may differ from the paper's.
  assumed: true
