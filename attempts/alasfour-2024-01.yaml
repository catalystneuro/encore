findings:
- kind: metadata_error
  statement: In sub-01_ses-7 and sub-04_ses-3 the epochs table is timed from 19:00 while the ElectricalSeries
    starts at the session start, 03:31:22 and 03:20:48 (starting_time 0), so the epochs end at 24.0 h
    against 15.48 h and 15.65 h of ECoG; 223 and 77 of their Talk, TV and Computer/phone epochs lie past
    the end of the ECoG unless the 8.52 h and 8.35 h offset is applied. In the other 19 files of these
    participants both clocks start at 19:00.
- kind: other
  statement: With that offset applied, sub-01 ses-7 decodes talking against watching TV like the participant's
    other days (0.679 against 0.592 to 0.695, trained on the other days), but sub-04 ses-3 decodes below
    chance (0.460 against 0.714 to 0.816 on days 4 to 6), so the alignment of its annotations with its
    ECoG is not established.
- kind: metadata_insufficient
  statement: The files and the archive's metadata give no sex or age for the participants (the subject
    entries hold species and subject_id only), so Table 1's sex and age and the paper's 2 male and 3 female
    cannot be checked.
- kind: other
  statement: The electrodes table's good flag changes from day to day (participant 04 has 67 to 82 good
    electrodes on its five days; 58 are good on all days), and the paper's per-participant counts (Table
    1) match no single rule for combining the days.
- kind: other
  statement: Of the 3465 epochs with a single Talk, TV or Computer/phone label in these participants'
    files, 110 are not about 2 min long (0.1 to 482.4 s; 38 are shorter than 10 s), where the dataset's
    documentation and the paper describe 2-min blocks.
- kind: other
  statement: The ECoG holds missing values (NaN) inside some labelled blocks; 1449 10-s bins of the analysed
    electrodes were dropped for it (871 for participant 04).
- kind: other
  statement: The ROI projection matrices on Figshare (10.6084/m9.figshare.12114408.v1) agree only roughly
    with the dataset's electrode positions; their ROI and the nearest ROI by the dataset's position agree
    for 51 to 64% of electrodes, and participant 01's matrix has 98 rows for the dataset's 94 electrodes.
- kind: methods_unavailable
  statement: Questions for the paper's authors, each a detail that changes outcomes here. (1) Which finite
    chance level was used (alpha, and n per fold or per participant)? With n per fold and alpha 0.05 no
    feature is significant here. (2) How was the artifact rule applied (total or contiguous 2 s, and the
    SD over which span)? As read, rule (a) drops up to 74% of a participant's blocks. (3) Which electrodes
    count as close to the eight ROIs, and is an ROI's density the matrix's density row or a count of electrodes?
    (4) Is the feature of an ROI its electrodes or their mean? (5) Which folds form the one-fold buffer?
    (6) Which electrodes are a participant's good electrodes when the flag changes across days? (7) Were
    epochs with two labels (for example Talk, TV) used? (8) How was the validation set of Figure 7 formed,
    and what were the ANOVA's observations and sums of squares? (9) Which numbering do the figures use
    for participants (the Results name a Participant 3 not in Table 1)?
