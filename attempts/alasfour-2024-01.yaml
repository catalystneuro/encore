inputs:
- what: Electrode-to-ROI projection matrices (aal_<participant>_elecs2ROI.csv, with each region's density
    in the first row) and the AAL region centroids (aal_01_ROIcentroids_Lside.csv) of Peterson et al.
    (2021a); the matrices are checked against their Figshare MD5 sums.
  source: doi:10.6084/m9.figshare.12114408.v1
outcomes:
- claim: roi-projection-link
  outcome: partially_reproduced
  notebook: reproduce_alasfour_2024.ipynb
  output: claim:roi-projection-link
  notes: Four of five matrices have one row per electrode (86, 84, 106, 92); participant 01's has 98 rows
    for 94 electrodes, and an index match agrees best with no row shift (ROI agreement 0.628, against
    0.394 or less when shifted). The matrix's own ROI (largest Gaussian value over the left AAL regions)
    and the ROI nearest to the dataset's mirrored position agree for 0.628, 0.512, 0.560, 0.557 and 0.641
    of electrodes (0.641 to 0.774 among electrodes the matrix assigns to the eight ROIs); log weights
    correlate with minus the squared distance at 0.955 to 0.959. The matrices fit these positions only
    roughly, so ROIs from the matrices (O5 a, c) and from the positions (O5 b) are both run. The link
    criterion was written by the author after the survey of the matrices.
  deviations:
  - Link claim added by the author (protocol, author step 1.4); its thresholds (90% for reproduced, half
    for partial) are the author's.
- claim: cohort-selection
  outcome: reproduced
  notebook: reproduce_alasfour_2024.ipynb
  output: claim:cohort-selection
  measured: 5
  notes: Under O2 (a), at least 60 min of each of Talk and TV over the files (days 3 to 7), exactly subjects
    01, 02, 04, 05 and 08 qualify with single-label epochs (TV minutes of the others 0 to 177.6; subject
    03 has 838.3 min of talking and 41.9 of TV). Counting any epoch whose label includes the class adds
    03 and 06; under O2 (b) all twelve qualify. Counted before artifact rejection only, since the other
    participants' signals were not read. Sex is not in the dataset, so the 2 male and 3 female split cannot
    be checked.
  deviations:
  - Minutes counted before artifact rejection only.
- claim: table1-participants
  outcome: not_reproduced
  notebook: reproduce_alasfour_2024.ipynb
  output: claim:table1-participants
  measured:
  - 85
  - 80
  - 67
  - 100
  - 82
  - 763.5
  - 1162.6
  - 445.6
  - 445.9
  - 439.1
