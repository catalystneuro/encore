- claim: npy-gap-junction-no-difference
  outcome: not_reproduced
  notebook: qi2026_excitability_connectivity.ipynb
  output: claim:npy-gap-junction-no-difference
  notes: The paper's test finds a systematic subtype effect. NPY+ presynaptic cells have a higher
    gap-junction probability onto both target types (medians 0.45 vs 0.36, p = 9.1e-4; 0.42 vs 0.36,
    p = 0.030), and spikelet amplitudes differ in the same direction in both matched comparisons by
    presynaptic subtype (p = 5e-8, 1.7e-7) and by postsynaptic subtype (p = 0.0012, 7.3e-4). The
    effects are small.
