inputs:
- what: The paper's analysis code, read for method details the claims file cites or lacks (the
    figure_reproduction scripts for Figures 2 to 6 and tutorial 5, the mixed model). It was read, not
    run; its README's published numbers are quoted in the notebooks only as references.
