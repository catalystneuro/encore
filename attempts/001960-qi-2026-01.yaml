findings:
- kind: identifier_missing
  statement: Unit ids are per session and nothing links the cells of a mouse's three sessions. Cells with
    the same id lie a median 1.1 to 1.3 mm apart, and only 6 to 26 of 320 cells have a cell of the other
    session within 10 um, so either the sessions image different cells or their coordinates are in different
    frames; the files do not say which. The gfp_positive flags of a mouse also differ between sessions
    (156, 171 and 171 NPY+ cells in M-YQ0201-27; 135, 144 and 157 in M-YQ0201-29), so the paper's per-mouse
    counts (166 and 145 of 320) cannot be traced to a session.
- kind: data_missing
  statement: The tool-development experiments of Figure 1 and Supplementary Figures 1, 5, 6, 9 and 18
    (JF585 against JF608, wide-field against targeted images, the 76-cell stimulation, the lattice off-target
    test, the spinning-disk z-stack, the 7.5x recordings) are not in the dandiset, and the raw-movie excerpt
    holds only projections of the structural stacks.
- kind: selection_undocumented
  statement: The paper's connection and pair counts (802 of 7,280, 667 of 7,032, 3,553 and 2,199) are
    those of ordered pairs of passed_qc cells 60 to 400 um apart, and the passed_qc flag differs by session
    (the code documents its two rules); neither the band nor the rules are stated in the files.
- kind: metadata_insufficient
  statement: ipsp_decay_source_units and its standard error carry no unit (the file says so); the values
    are consistent with seconds (median 0.035, capped at 0.4). membrane_time_constant_ms is exactly 0
    for 7 cells of M-YQ0201-27, with no flag marking a failed fit. The x and y origin is undocumented.
    The x and y axes are not oriented on the brain (no anterior, posterior, medial or lateral direction
    is stored), so the directions of the wave analysis can be given only in the image frame.
- kind: code_mismatch
  statement: The code's Figure 3 loader says the pairwise table's presynaptic and postsynaptic id columns
    vary in the opposite order to its metric columns. In this version they agree (row k is presynaptic
    k mod 320, postsynaptic k // 320), as the stored presynaptic spike times per row confirm.
- kind: methods_unavailable
  statement: For the authors. Single-spike SNR; how is the spike height entering the SNR of 4.5 measured?
    The stored normalized voltage gives 3.3 (1 over 1.4826 x MAD of the 1-frame difference), and 3.0 to
    3.9 per session.
- kind: methods_unavailable
  statement: For the authors. Supplementary Movie 3 (interaction-kernel); how were the 2 ms pulse duration,
    the 30 ms peak, the 35 ms decay and the 160 um length constant measured? The population spikelet waveform
    has a 22.7 ms FWHM and probability times amplitude falls with 72 to 96 um.
- kind: methods_unavailable
  statement: For the authors. Spikes lost and gained (Figure 5E, 5G); over which window is the rate integrated
    ("the entire IPSP duration", "the entire spikelet duration"), and against which baseline? Readings
    give 2.9e-3 to 1.6e-2 spikes lost for the top quintile and ratios of the balance from -0.19 to 6.96.
- kind: methods_unavailable
  statement: For the authors. Wave propagation analysis; how were peaks of the derivative separated or
    merged, was the derivative smoothed, in what window were the flanking minimum and maximum sought,
    and is lag signed or absolute against separation? Spans between adjacent turning points give 4,446
    events and 10.1 mm/s, spans within 250 ms 3,775 events and 6.2 mm/s; lag regressed on distance gives
    hundreds of mm/s.
- kind: methods_unavailable
  statement: For the authors. Hadamard stimulation; are the "640 stimuli" per cell the 750 ms code steps
    with blue on? Counting steps gives 650, counting contiguous on blocks gives 360.
- kind: methods_unavailable
  statement: For the authors. P(spk|V) (Figure 4E, F); is V the sample at the spike frame (as the code
    computes) or the voltage in the 10 ms before the spike (Methods)? With the spike frame 52% of cells
    have a sigmoid fit with R^2 >= 0.9, with V 10 ms before 24%.
- kind: methods_unavailable
  statement: For the authors. Supplementary Figure 26A; is a cell's spike rate and voltage at oscillation
    peaks the value at the peak or a mean over a window? At the peak the voltages do not differ (p = 0.22),
    over +/-300 frames they do (p = 0.022).
- kind: methods_unavailable
  statement: For the authors. Detection limits and the lasso correction; which 100 pairs near the cutoff,
    how the 50% point was estimated, which per-trial response entered the lasso, and its penalty. The
    per-pair statistics and nulls are not stored. A rebuilt lasso (per-pulse voltage 20 to 60 ms after
    onset, cross-validated penalty) gives R = 0.94 with the raw matrix and 72% of pairs changed by more
    than 20%.
- kind: methods_unavailable
  statement: For the authors. IPSP durations (Supplementary Fig. 25C); were decay fits that end on the
    0.4 s bound left out? Left out, the means are 57.1 and 41.9 ms (paper 58 and 43); kept, 77.4 and 65.2
    ms.
