- claim: npy-intrinsic-differences
  outcome: reproduced
  notebook: qi2026_excitability_connectivity.ipynb
  output: claim:npy-intrinsic-differences
  notes: Over 543 sparseOpto QC cells (253 NPY-, 290 NPY+) all five differences hold in the stated
    direction at p <= 0.001 (V_adp 1.8e-34, rheobase 3.5e-16, adaptation 2.1e-8, maximum rate 2.0e-4,
    membrane time constant 2.6e-8). Per mouse, maximum rate (M-YQ0201-27) and membrane time constant
    (M-YQ0201-29) are not significant.
  deviations:
  - Reading (b), the behavior-session cells, cannot be formed, since unit ids do not refer to the same
    cells across sessions and the properties are stored only for the sparseOpto cells.
- claim: npy-classifier
  outcome: reproduced
  notebook: qi2026_excitability_connectivity.ipynb
  output: claim:npy-classifier
  measured:
  - 76.8
  - 50.0
  notes: Pooled z-scored features give 76.8% balanced accuracy (69.3 to 83.9% over 10,000 80/20
    splits) and 50.0% with shuffled labels; V_adp has the largest coefficient and the largest drop
    when left out. Raw features give 73.1%; each mouse alone 76.3 to 76.7%.
  deviations:
  - Stratified splits and scikit-learn's default L2 penalty are standard choices the Methods do not
    fix; the printed intervals are wider than the paper's.
