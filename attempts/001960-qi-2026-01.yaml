- claim: lasso-off-target-correction
  outcome: not_reproduced
  notebook: qi2026_excitability_connectivity.ipynb
  output: claim:lasso-off-target-correction
  assumed: true
  measured:
  - 0.937
  - 71.9
  notes: Rebuilt from the 14,400 pulses of each sparsePulseHad session (each cell targeted 243 to 480
    times, the paper's range). The rebuilt raw matrix correlates with the stored amplitudes at R = 0.64
    over the 1,755 stored synaptic flags (955 + 800, the paper's n) and 0.81 over those 60 to 400 um.
    Under reading (a) the corrected matrix correlates with the raw at R = 0.937 (0.912 for 60 to 400 um),
    above 0.82 +/- 0.082, and 71.9% of the pairs differ by more than 20% (18.9% set to zero), not under
    22%. Under reading (b) 99.9% of coefficients are zero (R = 0.05). Least squares without a penalty
    still moves 37% of pairs by more than 20% (R = 0.970).
  deviations:
  - The per-pulse response is the mean normalized voltage 20 to 60 ms after pulse onset minus the 25 ms
    before (assumed; the paper gives no per-trial measure, and its fitted IPSP model is not run per pulse).
  - Spikes of a targeted cell are its stored estimated_spikes_per_blue_pulse (Methods); spikes of a non-targeted
    cell are its detected evoked spikes when it lies within 100 um of a target and zero elsewhere (assumed,
    from the 25 um off-target firing length constant of the Results).
  - The lasso is fitted per postsynaptic cell over pulses not targeting it, with an intercept for the
    blue-flash response, with scikit-learn's LassoCV (10 folds, 40 penalties, unstandardized predictors);
    the paper's software and settings are not given.
  - The 1755 pairs are taken to be the stored synaptic flags of both mice (955 and 800), which number
    1755; the claims file says their choice is not given (questions).
