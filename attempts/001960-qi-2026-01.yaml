  blocked_by: methods_underspecified
  notebook: qi2026_excitability_connectivity.ipynb
  output: claim:inhibition-gap-balance
  notes: The ratio depends on the integration windows of spikes lost and gained, which the paper does
    not fix. Over 0 to 100 ms and frames -1 to 1 (reading (a)) it is 1.37, inside 0.5 to 2; the other
    readings give 6.96, -0.19 or no value. The inputs themselves do not match the paper under any
    reading (fig5e-inhibition-in-spontaneous-rate and fig5g-gap-junction-synchrony, both partially
    reproduced), so no reading has a defensible basis.
- claim: npy-fraction-and-similarity
  outcome: reproduced
  notebook: qi2026_spontaneous.ipynb
  output: claim:npy-fraction-and-similarity
  measured:
  - 156
  - 135
  notes: NPY+ counts are 156, 171, 171 (M-YQ0201-27) and 135, 144, 157 (M-YQ0201-29) over the behavior,
    sparseOpto and sparsePulseHad sessions, all within tolerance; measured values are the behavior
    sessions. Over 505 behavior QC cells (257 NPY-, 248 NPY+) SNR medians differ by 5.5% (p = 0.011)
