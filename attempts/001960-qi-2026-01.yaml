    exponential) for 10,000 null draws per tested pair takes about 1,950 hours at the 48 ms per fit measured
    in the notebook (14,576 tested pairs), and the 100 pairs per mouse near the cutoff cannot be picked
    without every pair's p-value. The claims file's readings of the 50% point were therefore not run.
