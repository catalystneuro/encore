- claim: npy-oscillation-peak-rates
  outcome: reproduced
  notebook: qi2026_spontaneous.ipynb
  output: claim:npy-oscillation-peak-rates
  assumed: true
  notes: At the peak frame (reading (b)) NPY- cells fire at 1.10 Hz and NPY+ at 0.74 Hz (medians,
    p = 7.5e-6) and the voltages do not differ (p = 0.22). Over +/-300 frames (reading (a)) the rate
    difference holds (p = 1.5e-4) but the voltages differ (p = 0.022). 4,279 and 5,886 peaks (code
    5,888 for M-YQ0201-29).
  deviations:
  - The readings give different outcomes. Assumed is reading (b), the value at the peak, since the
    claim and Supplementary Figure 26A compare the subtypes at the oscillation peaks; reading (a)
    averages over a window of more than a full cycle of the 1.5 to 10 Hz band. Asked of the authors
    (findings).
