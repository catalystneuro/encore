  notes: The periodic 76-cell stimulation session of Figure 1D is not in the dandiset.
- claim: off-target-length-constants
  outcome: blocked
  blocked_by: data_missing
  notes: The lattice off-target experiment (Supplementary Figure 9) is not in the dandiset.
- claim: l1-sampling-density
