outcomes:
- claim: jf608-brighter
  outcome: blocked
  blocked_by: data_missing
  notes: The dandiset holds no recordings of the same cells with JF585-HTL and then JF608-HTL; its
    seven assets are the three sessions of each mouse and one raw-movie excerpt. The paper names no
    other archive for these data.
- claim: targeting-signal-to-background
  outcome: blocked
  blocked_by: data_missing
  notes: No wide-field and targeted images of one field are deposited. The raw-movie excerpt holds a
    segmentation reference image and GFP and RFP maximum projections only, and its movie was taken
    under targeted illumination.
- claim: spike-snr-and-detection-errors
  outcome: not_reproduced
  notebook: qi2026_spontaneous.ipynb
  output: claim:spike-snr-and-detection-errors
  measured: 3.33
  notes: The stored voltage is normalized by each cell's spike height, so the SNR is 1 over the
    shot noise (1.4826 x MAD of the 1-frame difference). It is 3.33 over the 505 QC cells of the
    behavior sessions (3.18 over all 640) and 3.0 to 3.9 per mouse and session under every reading,
    below 4.5 +/- 0.7. With the spike heights found in the traces (median 0.88 to 0.96 SH) it is 2.8
    to 3.0. The false-discovery and false-negative rates were not computed, since no matched-filter
    output or fitted mixture is stored; the SNR alone decides the outcome under every reading.
  deviations:
  - SNR from the stored normalized voltage, not from the raw fluorescence; the noise is the median
    over 3 min chunks (behavior sessions) or over 25 s samples of every fourth chunk (other
    sessions).
  - The error rates of the mixture model were not tested.
- claim: snr-decay-one-hour
  outcome: reproduced
  notebook: qi2026_spontaneous.ipynb
  output: claim:snr-decay-one-hour
  measured: 72.9
  notes: The behavior sessions are 61 min of continuous imaging. The SNR of the 20th 3 min chunk is
    72.9 +/- 15.6% of the first (mean of per-cell ratios, 505 QC cells; ratio of means 69.8%), and
    77.3 +/- 17.7% over all 640 cells (73.4%), within 76 +/- 13%. The decline is in spike height
    (0.68 and 0.77) with the noise unchanged (0.96 and 1.02). The illumination intensity is not in
    the files.
  deviations:
  - Spike height per chunk is the normalized voltage at the spike frame minus the mean of frames -6
    to -3 (a standard choice); the paper's height is the mean of the fitted spike Gaussian.
  - Which session and which 520 cells the paper used is not given; the behavior sessions are the only
    sessions of an hour of continuous imaging, and QC cells and all cells are both shown.
