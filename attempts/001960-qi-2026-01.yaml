- claim: detection-limits
  outcome: blocked
  blocked_by: too_large
  notebook: qi2026_excitability_connectivity.ipynb
  output: claim:detection-limits
  notes: The pairwise table holds only the calls, amplitudes, decays, distances and Hadamard spike times
    (its full listing is in the notebook), no per-pair statistic, p-value or null distribution. Rebuilding
