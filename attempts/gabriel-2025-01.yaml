  notes: The responsive fraction rises from BL to D2 in both groups under every period, frame and tone reading (clock
    P1-F1, shocked 0.465 to 0.515, non-shocked 0.468 to 0.551). Similarity (chi-square with Yates, p >= 0.05 in
    all periods) holds only under clock P2-F2 (smallest p = 0.14); under clock P1-F1, P1-F2 and P2-F1 the D1 fractions
    differ, non-shocked higher by 5.0 to 7.0 points (p = 0.0015 to 0.025), and with the paper's tone bouts D1 differs
    under every reading (p = 0.0003 to 0.047). The claims file makes a claim whose period and frame readings give
    different outcomes methods_underspecified.
