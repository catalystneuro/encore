- claim: zenodo-dandiset-link
  outcome: partially_reproduced
  notebook: reproduce_gabriel_2025.ipynb
  output: claim:zenodo-dandiset-link
  notes: All 30 Zenodo sessions have a dandiset NWB file with the same mouse and day. 25 have a trial table that
    gives the Zenodo tone onsets (bout frame divided by 25) up to one offset per session (offsets -3.56 to 4.02
    s, spread under 0.1 s). The five that do not are F1 and F2 day 1 (no trial table; BehaviorDEPOT arrays equal
    to the Zenodo ones), F6 day 1 (video only), F3 day 2 (9 trials, the first at 0 s, against 10 BehaviorDEPOT tones)
    and F7 day 2 (converted from M7's day 2 timestamp file, with M7's trial table and 12 shock trials). No dandiset
    file lacks a Zenodo session.
findings:
- kind: data_missing
  statement: 'Dandiset 001887 holds no calcium imaging: none of its 30 NWB files holds traces, footprints or an
    imaging series, although its description says it holds the data collected for and analyzed in the paper. The
    traces are in the paper''s Zenodo record (doi:10.5281/zenodo.13381210).'
- kind: data_missing
  statement: Only 2 of the 30 NWB files (F1 and F2, day 1) hold the BehaviorDEPOT labels (platform, freezing, entries,
    exits); the other 28 hold a trial table, a video or both, so the behaviour results cannot be computed from the
    dandiset without re-tracking the videos.
- kind: metadata_error
  statement: 'sub-F7_ses-TD2NoShock.nwb was converted from M7''s day 2 timestamp file (v4M7_T2_2022-05-13_14-01-48.mat):
    its trial table equals that of sub-M7_ses-TD2Shock.nwb, with 12 shock trials for a non-shocked mouse, and its
    session start time is M7''s.'
- kind: metadata_error
  statement: sub-F3_ses-TD1NoShock.nwb (non-shocked mouse) lists 9 shock trials and shock intervals; sub-F3_ses-TD2NoShock.nwb
    lists 9 trials, the first at 0 s, where the Zenodo record has 10 tones.
- kind: metadata_error
  statement: sub-F1_ses-TD1Shock.nwb and sub-F2_ses-TD1Shock.nwb give 2026-08-25 as the session start time, which
    is the conversion date, and hold no trial table; sub-F6_ses-TD1NoShock.nwb holds only the video.
- kind: code_mismatch
  statement: The paper's behaviour code and its BehaviorDEPOT cue frames assume 25 frames/s (fps = 25 in batch_PMA_postanalysis_script_BDv15.m,
    vid_fps 25 in On Plat.mat, 751-frame tone bouts), while in six sessions (F5, M5 and F6 on both days) the camera
    timestamps give 28.2 to 29.8 frames/s. In those sessions the tone and shock windows drift from the real tones,
    and the code's success rule disagrees with the hand-scored outcomes on 15 of 60 trials, against 4 with windows
    placed by the timestamps.
- kind: selection_undocumented
  statement: The Zenodo record holds 9 shocked and 7 non-shocked mice on day 1 and 7 and 7 on day 2 (all imaged);
    the Figure 1 behaviour legend gives 11 and 9, and 8 and 8. The behaviour-only mice are in neither archive. The
    Figure 3 legend gives 7 shocked mice for decoding where 9 are imaged on day 1, and which two were left out is
    not said.
- kind: data_missing
  statement: 'No cell registration across days (the CellReg output behind the 463 and 322 registered cells of Figure
    1N and 1O) is in the Zenodo record or the dandiset, though the footprints (ta_rois) are. Jumping, rearing and
    escape labels (Figure S2) are in neither: Behavior.mat holds no such field and Params.mat holds the freezing
    classifier''s parameters only.'
- kind: methods_unavailable
  statement: 'Question for the authors: the ROC routine (run_caAnalyze from the caAnalyze repository), the alignment
    of calcium and behaviour frames, and the frames that make up the BL, D1 and D2 periods are not public. Which
    frames form a period (from the first tone of the period to the next tone, or from the end of the previous tone
    to the end of the last), and are D1 and D2 tones 9 to 12 (Results) or the last 3 tones (Methods)? The overall-encoding
    and tone-proportion claims change outcome between these readings.'
- kind: methods_unavailable
  statement: 'Question for the authors: how is a mixed cell counted for Figure 1K to 1M? With the code''s category
    rule (genFeatCellResponses.m) on the Zenodo traces, 24% to 31% of responsive day 2 cells of shocked mice are
    mixed, against 31% to 34% in non-shocked mice, not 51% against 25%. Did the pie charts use further feature vectors
    (for example platform stays or the tone and ITI splits) or a different denominator?'
- kind: methods_unavailable
  statement: 'Question for the authors: for decoding, which class is positive in the F1 score (the Methods code
    success as 1, calculatePerformance.m counts failure as positive), and is F1 min-max normalized (Methods) or
    z-scored (Zscore_Sz in the code)? Shocked mice decode better than non-shocked mice in the pre-shock and shock
    epochs only with success positive and min-max normalization. The ROC_IDs file that defines the modulated and
    non-modulated cell sets is not public either.'
- kind: methods_unavailable
  statement: 'Question for the authors: which Sidak family were the Figure 1E to 1H block comparisons corrected
    over, all pairs of blocks or each block against block 1? On the camera-clock tone windows the freezing rise
    passes only against block 1 (p = 0.047, smallest over all pairs 0.092) and the latency fall only over all pairs
    (block 2 against 4, p = 0.032).'
- kind: other
  statement: 'The event-call counts of the STAR Methods (Cells Analyzed for Figure 1) are not met for tone onsets
    and platform events with the Methods'' windows on the deposited traces: day 1 tone-onset 33 and 37 shocked cells
    against 61 and 52, day 2 platform-exit 77 and 40 against 104 and 74, while the freezing counts match within
    3%. Other windows, cleaned platform bouts and other shuffle seeds do not close the gap. The routine (run_caAnalyze)
    is not public.'
