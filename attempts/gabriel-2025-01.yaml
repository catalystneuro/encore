- claim: fig1kl-overall-encoding-similar
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_gabriel_2025.ipynb
  output: claim:fig1kl-overall-encoding-similar
  notes: The responsive fraction rises from BL to D2 in both groups under all four period and frame readings
    (P1-F1, shocked 0.465 to 0.515, non-shocked 0.468 to 0.551). Similarity (chi-square with Yates, p
    >= 0.05 in all periods) holds only under P2-F2 (smallest p = 0.14); under P1-F1, P1-F2 and P2-F1 the
    D1 fractions differ, non-shocked higher by 5.0 to 7.0 points (p = 0.0015 to 0.025). The claims file
    makes a claim whose period and frame readings give different outcomes methods_underspecified. With
    the paper's tone bouts D1 differs under every reading (p = 0.0003 to 0.047).
  deviations:
  - Tested on the Zenodo record of analyzed datasets (doi:10.5281/zenodo.13381210), as dandiset 001887
    holds no calcium imaging and behaviour labels for 2 of 30 sessions.
  - The ROC routine (run_caAnalyze, caAnalyze repository) is not public; the auROC, the 1000 circular
    shuffles and the 2.5% and 97.5% bounds follow the STAR Methods (ROC analysis), and the event windows
    follow the same passage (first and last 5 s of the tone, 1 s before to 4 s after platform entries
    and exits).
  - Calcium frames are placed by every second miniscope timestamp (2x temporal downsampling, STAR Methods,
    Miniscope data processing) and behaviour labels carried to them by nearest camera timestamp; the paper's
    alignment code is not public. This is a standard choice, stated as such.
  - Tone windows are the BehaviorDEPOT tone onsets divided by the 25 frames/s of the paper's cue conversion,
    placed on the camera clock (the `clock` reading of pma.tone_windows); in six sessions (F5, M5, F6
    on both days) the camera ran at 28 to 30 frames/s, so the paper's own bouts, taken as frames, drift
