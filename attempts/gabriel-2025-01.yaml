- claim: figs2-innate-behaviors
  outcome: blocked
  blocked_by: not_runnable
  notes: 'Neither the Zenodo record nor the dandiset holds jumping or rearing labels: the BehaviorDEPOT
    output (Behavior.mat) holds freezing, platform, platform entry and exit, tone and inter-platform-interval
    fields only. Making them would mean running BehaviorDEPOT''s jumping and rearing classifiers on the
    deposited DeepLabCut tracking; BehaviorDEPOT is MATLAB and cannot be installed in the entry''s locked
    Python environment. Escape could be derived from the platform labels, but the claim needs all three
    behaviours.'
