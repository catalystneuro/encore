  output: claim:data-neurons
  measured:
  - 1394
  - 9
  - 847
  - 7
  - 1031
  - 967
  notes: Counts of rows of `ta_dff` (the traces genFeatCellResponses.m reads) in the Zenodo minian files.
    Day 1, 1394 cells from 9 shocked mice and 847 from 7 non-shocked mice; day 2, 1031 and 967. All match
    the paper exactly. The dandiset holds no cells.
- claim: data-registered-cells
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_gabriel_2025.ipynb
  output: claim:data-registered-cells
  notes: No cell registration across days is in the Zenodo record (its file names list no CellReg or registration
    output) or in the dandiset (no ophys data at all), so the registered cells cannot be counted. Redoing
    the registration needs CellReg, a MATLAB package, and the Minian footprints; the criterion says the
    claim cannot be tested without redoing it.
- claim: fig1e-platform-time
  outcome: reproduced
  notebook: reproduce_gabriel_2025.ipynb
  output: claim:fig1e-platform-time
  notes: Clock reading. Day 1 shocked block means 0.379, 0.463, 0.630, 0.777; block 1 against 4 Sidak
    p = 0.0047 (6 pairs) and 0.0024 (against block 1). Shocked against non-shocked, day 1 block 4 p =
    0.048 and day 2 blocks 2 to 4 p = 0.0046 to 0.017 (Sidak over 4). Mixed ANOVA day 1 block F = 12.48
    (GG p = 1.3e-05). With the paper's tone bouts the day 1 rise is 0.377 to 0.743 (p = 0.0079 and 0.004)
    and day 2 blocks 2 to 4 differ (p = 0.0023 to 0.026). Both Sidak families and both tone readings meet
    the criterion.
  deviations:
  - Tested on the Zenodo record of analyzed datasets (doi:10.5281/zenodo.13381210), as dandiset 001887
    holds no calcium imaging and behaviour labels for 2 of 30 sessions.
  - The Zenodo record holds 9 shocked and 7 non-shocked mice on day 1 and 7 and 7 on day 2; the Figure
    1 legend gives 11 and 9 on day 1 and 8 and 8 on day 2.
  - Tone windows are the BehaviorDEPOT tone onsets divided by the 25 frames/s of the paper's cue conversion,
    placed on the camera clock (the `clock` reading of pma.tone_windows); in six sessions (F5, M5, F6
    on both days) the camera ran at 28 to 30 frames/s, so the paper's own bouts, taken as frames, drift
    from the tones (data check). The paper's bouts are run as a variant.
  - Sidak comparisons are paired t-tests within the shocked group and unpaired t-tests between groups
    per block, corrected for the family; Prism's Sidak test uses the ANOVA's pooled error. A standard
    approximation.
