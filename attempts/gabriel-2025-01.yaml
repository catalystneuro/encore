  output: claim:zenodo-dandiset-link
  notes: All 30 Zenodo sessions have a dandiset NWB file with the same mouse and day. 25 have a trial
    table that gives the Zenodo tone onsets (bout frame divided by 25) up to one offset per session (offsets
    -3.56 to 4.02 s, spread under 0.1 s). The five that do not are F1 and F2 day 1 (no trial table; BehaviorDEPOT
    arrays equal to the Zenodo ones), F6 day 1 (video only), F3 day 2 (9 trials, the first at 0 s, against
