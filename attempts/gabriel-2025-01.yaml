- what: 'The paper''s analysis code (MATLAB and Python), read for method details: batch_PMA_postanalysis_script_BDv15.m,
    calcAvgPerGroup.m, genFeatCellResponses.m, compile_pooled_avg_heatmaps.m, trialAvg.m, calcCueFramesCG.m,
    a_SVM_permousev3ASF.m, calculatePerformance.m and the RW model script. Not run.'
