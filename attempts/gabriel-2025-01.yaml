findings:
- kind: data_missing
  statement: 'Dandiset 001887 holds no calcium imaging: none of its 30 NWB files holds traces, footprints
    or an imaging series, although its description says it holds the data collected for and analyzed in
    the paper. The traces are in the paper''s Zenodo record (doi:10.5281/zenodo.13381210).'
- kind: data_missing
  statement: Only 2 of the 30 NWB files (F1 and F2, day 1) hold the BehaviorDEPOT labels (platform, freezing,
    entries, exits); the other 28 hold a trial table, a video or both, so the behaviour results cannot
    be computed from the dandiset without re-tracking the videos.
- kind: metadata_error
  statement: 'sub-F7_ses-TD2NoShock.nwb was converted from M7''s day 2 timestamp file (v4M7_T2_2022-05-13_14-01-48.mat):
    its trial table equals that of sub-M7_ses-TD2Shock.nwb, with 12 shock trials for a non-shocked mouse,
    and its session start time is M7''s.'
- kind: metadata_error
  statement: sub-F3_ses-TD1NoShock.nwb (non-shocked mouse) lists 9 shock trials and shock intervals; sub-F3_ses-TD2NoShock.nwb
    lists 9 trials, the first at 0 s, where the Zenodo record has 10 tones.
- kind: metadata_error
  statement: sub-F1_ses-TD1Shock.nwb and sub-F2_ses-TD1Shock.nwb give 2026-08-25 as the session start
    time, which is the conversion date, and hold no trial table; sub-F6_ses-TD1NoShock.nwb holds only
    the video.
- kind: code_mismatch
  statement: The paper's behaviour code and its BehaviorDEPOT cue frames assume 25 frames/s (fps = 25
    in batch_PMA_postanalysis_script_BDv15.m, vid_fps 25 in On Plat.mat, 751-frame tone bouts), while
    in six sessions (F5, M5 and F6 on both days) the camera timestamps give 28.2 to 29.8 frames/s. In
    those sessions the tone and shock windows drift from the real tones, and the code's success rule disagrees
    with the hand-scored outcomes on 15 of 60 trials, against 4 with windows placed by the timestamps.
- kind: selection_undocumented
  statement: The Zenodo record holds 9 shocked and 7 non-shocked mice on day 1 and 7 and 7 on day 2 (all
    imaged); the Figure 1 behaviour legend gives 11 and 9, and 8 and 8. The behaviour-only mice are in
    neither archive. The Figure 3 legend gives 7 shocked mice for decoding where 9 are imaged on day 1,
    and which two were left out is not said.
- kind: data_missing
  statement: No cell registration across days (the CellReg output behind the 463 and 322 registered cells
    of Figure 1N and 1O) is in the Zenodo record or the dandiset. Jumping and rearing labels (Figure S2)
    are not in either.
- kind: methods_unavailable
  statement: 'Question for the authors: the ROC routine (run_caAnalyze from the caAnalyze repository),
    the alignment of calcium and behaviour frames, and the frames that make up the BL, D1 and D2 periods
    are not public. Which frames form a period (from the first tone of the period to the next tone, or
    from the end of the previous tone to the end of the last), and are D1 and D2 tones 9 to 12 (Results)
    or the last 3 tones (Methods)? The overall-encoding and tone-proportion claims change outcome between
