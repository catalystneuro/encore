- claim: fig5e-volume
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_robotka_2023.ipynb
  output: claim:fig5e-volume
  measured:
  - 0.1203
  - 1797
  notes: 1,800 random ensembles of 20 good units, each decoded with 100 held-out repetitions. Code
    cross-validation, the Methods' sound window (first 500 ms) and LDA axes (three largest
    eigenvalues), ensembles with PCC above 30% (the code's filter; 1,797 here against the paper's
    1,746), slope 2.38, R2adj 0.120, F(1,68) = 9.60, p = 0.0028; all 1,800 give 0.123. R2adj is
    outside 0.1 +- 0.01 while the slope is positive and significant. The code's window (-500 to 500
    ms) and its eigh axes give R2adj 0.094, F(1,68) = 7.28, p = 0.0088, within tolerance. Under the
    Methods' cross-validation (1,329 ensembles above 30%) R2adj is 0.11 to 0.30, p of 0.008 or
    less. Every reading gives a positive slope with p of 0.011 or less.
  deviations:
  - Rests on the code's cross-validation (see fig4b-ensemble-20).
  - The sound window and the LDA axes follow the Methods for the main result (first 500 ms; the
    first three discriminant dimensions read as those of largest eigenvalue), and the code's
    choices (-500 to 500 ms; numpy eigh's first three columns, which are the smallest eigenvalues
    of a non-symmetric matrix) are variants. Only the code's choices give R2adj within tolerance.
  - The F df are (1, 68) from neff = 89 - 20 + 1 = 70, not the paper's (1, 79).
  - The MPS are computed with soundsig 3.1.1 (the paper cites v1.0.1).
