findings:
- kind: metadata_insufficient
  statement: No file gives the brain area (Field L, CLM, CMM, NCM or the L/NCM border) of a unit,
    though the paper's analyses by area use one. The data descriptor says only that the arrays
    targeted the primary and secondary auditory pallium.
- kind: other
  about: data
  statement: Nine of the 100 good units the paper's code lists come from a site folder named
    ZF4F_2t_190613_101015.old. The dataset's site ZF4F_2t_190613_101015 holds 18 unit pickles, none
    with those names, so the deposited sorting of that site differs from the one the paper
    analysed. The other 91 listed units are in the dataset. Unit counts are near the paper's (726
    units with vocalization trials against 730, 287 auditory against 292, 187 with all 110 stimuli
    against 191).
- kind: other
  about: data
  statement: 34 of the 872 unit pickles hold no stimulus rows (20 of them in site
    ZF4F_4t_190614_094759, whose tar.gz is 17 KB), and 112 hold song stimuli only. The data
    descriptor does not say so.
- kind: metadata_error
  statement: The data descriptor gives KDE_BW as the bandwidth in seconds of the rate estimate; its
    values range from 0.2 to 10, which can only be milliseconds.
- kind: other
  about: data
  statement: Every site tar.gz holds an AppleDouble file (`._goodPlayback-...pkl`, 524 bytes) for each
    unit pickle, 872 in all; they are not pickles and must be skipped. The pickles are written with
    pandas 1.x and need pandas' pickle compatibility layer to be read with pandas 2.
- kind: methods_unavailable
  statement: Question for the authors. The STAR Methods describe the decoder's cross-validation as
    holding out, for each call type, the responses to one exemplar stimulus, while the code
    (decoders.naiveBayes) holds out one random trial of every stimulus. The two differ here by
    about 11 points of PCC for ensembles of 20 (32.0% against 43.2% with Z+T), and only the code's
    scheme gives the paper's values. Which scheme produced Figures 4 and 5? This attempt assumes the
    code's.
- kind: code_mismatch
  statement: The Methods define the per-call-type response zCT as the average of the trial
    z-scores; the code computes mean(d)/sd(d) within the call type, and Figure 3C is built from the
    code's values. Under the Methods' definition song, not distress calls, has the highest average
    response.
- kind: code_mismatch
  statement: The Methods compute the MPS on the first 500 ms of the stimulus and use the first three
    linear discriminant dimensions; the code takes 500 ms before to 500 ms after onset, and takes
    numpy eigh's first three eigenvectors of the non-symmetric matrix pinv(within) times between,
    which eigh orders by ascending eigenvalue. Only the code's choices give the paper's R2adj of
    about 0.1 for the volume here.
- kind: selection_undocumented
  about: paper
  statement: The 1,746 ensembles of Figure 5 are those of the 1,800 with PCC above 30%
    (GenerateMLFilters.ipynb, pcc > 30); the Methods do not state the filter.
- kind: methods_unavailable
  statement: Question for the authors. The good-unit selection (single-unit PCC Z+T above 12%) uses
    one random held-out draw, and the count moves from 87 to 101 between seeds here. How was the
    paper's count of exactly 100 obtained, and is it expected to be stable?
