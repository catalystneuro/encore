- claim: fig4b-ensemble-20
  outcome: reproduced
  assumed: true
  notebook: reproduce_robotka_2023.ipynb
  output: claim:fig4b-ensemble-20
  measured:
  - 43.15
  - 30.36
  notes: Code reading, 10,000 random ensembles of 20 from the 89 good units, mean PCC Z+T 43.15% and
    Z 30.36% (a 42% increase), corrected t(138) = 9.53, p = 7.5e-17; Z+T rises at every size (13.9,
    17.3, 20.2, 22.7, 24.8, 32.8, 38.6 and 43.2% for 1, 2, 3, 4, 5, 10, 15 and 20 units). Methods
    reading, 77 good units, Z+T 32.0% and Z 24.1%, both outside tolerance, with the rise and the
    test holding (t(114) = 5.79), which would be partially reproduced. With the code's 100
    repetitions on 500 of the ensembles, 43.09% and 30.45%. Ensembles drawn from the paper's own
    91 listed good units give 40.67% and 29.44%, t(142) = 7.06.
  deviations:
  - Assumption. The Methods hold out, for each call type, the responses to one exemplar; the code
    (decoders.naiveBayes) holds out one random trial of every stimulus. The two give different
    outcomes here. The code's scheme is adopted for all ensemble claims because the paper's
    printed values come from it (the claims file notes that plotConfusions.ipynb prints 42.28 and
    38.07, and GenerateMLFilters.ipynb the F values of Figure 5), and they match this attempt's
    values under it and not under the Methods' scheme. Both are shown.
  - Each ensemble of the Figure 4B curve is decoded once, as the Methods state ("a single
    leave-one-out per call-type"); the code ran 100 repetitions. The means do not change (shown on
    500 ensembles); the spread over ensembles does (SD 7.7 against 4.8 points).
  - Sizes 1 and 2 use all units and all pairs of the good units, sizes 3 to 20 10,000 random draws
    each, as the code.
