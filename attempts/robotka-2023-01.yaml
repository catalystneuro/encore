- claim: fig3c-peak-call-types
  outcome: reproduced
  assumed: true
  notebook: reproduce_robotka_2023.ipynb
  output: claim:fig3c-peak-call-types
  measured:
  - 53
  - 58
  notes: Under the code's zCT (reading b, mean(d)/sd(d) over the trials of a call type), Di has the
    highest mean over the 287 auditory units (0.623) and So the second (0.564); 53 units peak on Di
    and 58 on So, within tolerance of 51 and 61; the five call types with the most peak units are
    So, Ag, Di, Be and Th, which include Ag, Be, So and Di. Under the Methods' reading (a, the mean
    of the trial Z per call type), So ranks first (0.591), Ag second (0.573) and Di third (0.527),
    with peak counts So 71 and Di 57, so the claim would not be reproduced. The outcome rests on
    reading (b). Four units lack a call type and are ranked on the others.
  deviations:
  - Assumption. The Methods define zCT as the average of the trial z-scores over the trials of a
    call type; the code (GenerateReport.ipynb calc_zscore_category) computes mean(d)/sd(d) within
    the call type, and SummaryStatistics.ipynb (cells 11 and 15) builds Figure 3C from that zcall
    in summarySel.pkl. The two readings give different outcomes; the code's is adopted because it
    is what the figure plots. Both are shown.
- claim: fig4a-unit-z-vs-zt
  outcome: reproduced
  notebook: reproduce_robotka_2023.ipynb
  output: claim:fig4a-unit-z-vs-zt
  measured:
  - 187
  - 10.68
  - 12.05
  notes: 187 auditory units have all 110 stimuli (paper 191); 125 of them have at least 2 trials of
    every stimulus. Methods reading (exemplar held out per call type, PCC as the mean diagonal),
