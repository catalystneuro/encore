findings:
- kind: data_missing
  statement: The dandiset holds only the ten-finger press task (10 sessions of N, 2 of J). The
    alternating-cues task (Figures 1, 4 and 5, Supplementary Figures 2 to 5) and the online BMI
    sessions of J (Figure 6b, Supplementary Figures 6 and 7) are not in it, though the paper's Data
    Availability names only this dandiset. N's BMI sessions of ref 46 appear to be in DANDI:000147.
- kind: format_error
  statement: In 1509 of 1692 units the spike times are not stored in increasing time order, which
    NWB expects. Counts in windows are unaffected once sorted, as this attempt does.
- kind: metadata_insufficient
  statement: The files name the participants P1 (the paper's N) and N1 (the paper's J); no mapping
    to the paper's labels is given, and N1 is not participant N. The mapping follows from the sex
    and electrode locations.
- kind: metadata_insufficient
  statement: The trial columns Run, TrialNumber, cue_on_time, cue_off_time and go_on_time have no
    description. The Delay screen onset, which defines the paper's Delay window, is implied only by
    cue_off_time.
- kind: other
  about: data
  statement: The per-session unit counts the paper reports match the units in the files before
    the 0.5 Hz exclusion that the Methods apply to all analyses; the J-MC session of 2019-02-12 has
    139 units against the paper's stated maximum of 130.
- kind: methods_unavailable
  statement: For the authors. How was the noise precision passed to rsatoolbox for the
    cross-validated Mahalanobis distance (Methods, Neural distance between fingers)? With two
    partitions and each partition's single-trial precision the differences are about a fifth of the
    paper's (N-PPC 0.28 against 1.56); with the precision of the partition mean, as the toolbox
    documents for a list of noises, they match (1.42). This attempt assumed the latter.
- kind: methods_unavailable
  statement: For the authors. Was the standard (within-condition) accuracy compared with CCGP
    computed on the pseudo-population or per session (Methods, Compositionality of finger
    representations)? For J-PPC within-hand accuracy is 0.83 to 0.89 on the pseudo-population and
    0.68 to 0.69 per session, against the paper's 65%. This attempt assumed the pseudo-population.
- kind: methods_unavailable
  statement: For the authors. What did the 1001 label shuffles of the CCGP permutation test permute,
    and how were trials of different sessions matched in the pseudo-population? With condition
    labels permuted across pseudo-trials, J-PPC finger-type CCGP has p from 0.001 to 0.038 over the
    readings, against the paper's p below 0.001.
- kind: methods_unavailable
  statement: For the authors. With the Methods' one-way ANOVA on Go-window rates and FDR over pooled
    neurons, 48%, 38% and 65% of N-PPC, J-PPC and J-MC neurons are discriminative in the ten-finger
    task, against 66%, 57% and 78%. A 1 s window from the Go cue gives 61%, 57% and 83%. Which
    window, exclusion and correction gave the paper's values?
