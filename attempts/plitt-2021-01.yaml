findings:
- kind: data_missing
  statement: Each file holds only the imaged trials of its session, and sessions without imaging (2, 4
    and 6) are absent. The paper's priors and its training statistics use every trial a mouse ran before
    session 8, so these cannot be rebuilt from the dandiset alone. The authors' figshare deposit (doi:10.6084/m9.figshare.31974756.v1)
    holds every VR session, and this attempt uses it, but neither the dandiset nor the paper's data statement
    names it.
- kind: identifier_missing
  statement: The figshare VR deposit names mice by alias (for example 4139265.3) and the dandiset by R1
    to FD4; no NWB file records the alias, so the link rests on the mapping in the authors' 2026 code
    (mouse_metadata.py). The trial sequences confirm that mapping for all 89 files of the rare and frequent
    morph mice.
- kind: other
  about: data
  statement: The deposit's session database flags 26 VR sessions of the rare and frequent morph mice as
    imaged that have no file in the dandiset (12 of them R6's, on seven dates, five before its session
    8 and two after it), without a note on why they were left out.
- kind: data_missing
  statement: Mouse R6 has no session before 8 in the dandiset, R4 and R5 lack session 1, and FD3 has no
    session after 7, so the decision-mouse trial counts cannot match the paper's.
- kind: other
  about: data
  statement: The dandiset holds imaging sessions 5 and 7 for most mice (and session 6 for R4), which the
    paper does not list among its imaging sessions (1, 3 and 8 to N), and 26 rare morph sessions 8 to
    N where the paper counts 24. F6 session 5 has 4,103 cells, above the paper's stated range.
- kind: metadata_error
  statement: The session_start_time of every file is the date of conversion in April 2026, not the date
    of the recording, so the calendar days between sessions cannot be read from the files.
- kind: metadata_insufficient
  statement: The decision mouse FD1's sessions 1 and 3 hold continuous morph values in place of the five
    S-tilde values, and nothing in the files or the dandiset says so.
- kind: other
  about: data
  statement: The JSON annotation of each file stores place cells from the authors' 2026 code. They agree
    with this attempt's no-speed-exclusion reading for about 96% of cell and S-tilde pairs and give 61.5%
    (rare) and 48.6% (frequent) of cells as place cells, against the paper's 43% and 30%.
- kind: other
  about: data
  statement: The published versions of 2021 hold 85 files for 10 of the 16 mice (F4, F6 and the decision
    mice are missing); the versions of April 2026 hold all 16. Version 0.260415.1712 replaced R5's files
    and removed its sessions 1, 5 and 7 relative to 0.260409.0433, without release notes.
- kind: paper_inconsistency
  statement: The Methods give the Hebbian model's input width as "σ 2 = 4.11" in f_h; the paper's code
    uses a width sigma of 0.15 units (4.11 f_h, so a denominator of 16.9 f_h^2) and a stimulus noise of
    0.1 units, and read as a variance in f_h the model's weights decay to zero during training.
- kind: code_mismatch
  statement: The prior reconstruction in the paper's code (SFReg.plot_sfreg at dca5a57; similarity_fraction.single_sess_reconstruction
    at 9230b0a) divides by sum_j L(f, x_j) / Z(f), taking the normalising constant Z at the grid point
    f, where the Methods formula sums L(fhat | f) / Z(fhat) over fhat. The code printed -0.476 +- 0.132
    and 0.453 +- 0.074, the paper's values. On this task's trial design the Methods formula gives a positive
    Delta D_KL even for an ideal observer sampling the rare posterior (+0.547 here).
- kind: metadata_insufficient
  statement: 'The file names'' session days are not the ordinal of the recording date among each mouse''s
    task-track dates in the authors'' VR deposit for R1 to R4, R6 and F4 (one date higher, two for R6):
    the deposit holds eight task-track dates before session 8 for these mice (nine for R6), one more than
    sessions 1 to 7 (two more for R6). Neither the dandiset nor the deposit says how sessions were numbered.'
