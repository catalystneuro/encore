  outcome: reproduced
  notebook: 02_population_inference.ipynb
  output: claim:vr-deposit-link
  notes: A link claim added in this revision, as the answer of 2026-10-22 makes the authors' figshare
    VR deposit the source of the priors (M7) and of training-intermediate-fraction. All 89 NWB files of
    the 12 rare and frequent morph mice match exactly one deposit file of their own mouse (alias of the
    2026 code) and no file of another mouse; in each the deposit file holds exactly the NWB trials (offset
    0, same count), with S-tilde and the three jitters identical (largest difference 0.0), and every matched
    file carries the database's imaging flag. No NWB file names an alias, so the alias mapping comes from
    the 2026 code and the trial sequences confirm it. The deposit holds 352 files of the 12 mice on the
    task track (one listed twice in its database, none missing from the zip), and 26 files with the imaging
    flag that match no NWB file (12 of them R6's). Session numbers (added after the first verification
    round). The file day equals the ordinal of the matched file's date among the mouse's task-track dates
    in the deposit for 60 of 89 files; for R1 to R4, R6 and F4 the imaging sessions 8 to N fall one date
    later (two for R6), as the deposit holds eight task-track dates before session 8 for these mice (nine
    for R6), one more than sessions 1 to 7. The 2020 code's session selection rebuilt from the deposit's
    imaging flags holds every NWB session 8 to N and more (33 rare, 24 frequent; 2,880 and 2,181 NWB trials
    against the code's printed 2,540 and 1,986), so it does not identify the two extra rare sessions.
- claim: training-intermediate-fraction
  outcome: reproduced
  notebook: 02_population_inference.ipynb
  output: claim:training-intermediate-fraction
  measured: 0.5983
  notes: What the answer changed. The claim was blocked (data_missing), as the dandiset holds only the
    imaged trials; the answer makes it `data elsewhere`, counted from the figshare deposit, which holds
    every session. Trials before session 8 are every trial of the mouse's sessions on the task track dated
    before session 8 (date from vr-deposit-link), and of the earlier session numbers of that date; 15
    to 22 sessions over 8 to 10 days per mouse. Reading (a), pooled, holds, rare 3.49% (340 of 9,753 trials)
    below 4% and frequent 59.83% (5,700 of 9,527) within 0.06 of 60%. Reading (b) does not, as R4 (4.12%)
    and R6 (5.66%) are above 4%; the other rare mice are 1.85% to 3.15% and the frequent mice 59.2% to
    60.6%. The 2026 code's variants (sessions with more than 40 rewards; sessions within 8 days of the
    first) give 3.41% and 3.19% rare and 59.8% frequent pooled. The dandiset's imaged trials, the earlier
    run's reference, give 13.85% rare.
  deviations:
  - Sessions with few rewards are kept, as the criterion counts every trial; the code's filter of more
    than 40 rewards is shown as a variant.
- claim: place-cell-fractions
  outcome: not_reproduced
  notebook: 01_sessions_place_cells.ipynb
  output: claim:place-cell-fractions
  measured:
  - 25053
  - 0.685
  - 0.392
  - 0.36
  - 17025
  - 0.567
  - 0.24
  - 0.241
  notes: The recorded cells match the paper's implied totals (36,550 rare and 30,018 frequent against
    about 36,800 and 29,800), but more of them are place cells under every reading. With low-speed frames
    left out (reading a, pooled) rare 25,053 (68.5%; 39.2% for S-tilde 0 and 36.0% for S-tilde 1) and
    frequent 17,025 (56.7%; 24.0% and 24.1%); with all frames (reading b) rare 21,945 (60.0%; 31.0%, 28.2%)
    and frequent 14,345 (47.8%; 17.8%, 16.3%). Per-session means give the same. None of the eight values
    is within tolerance under any combination. The place cells of the authors' 2026 code stored in the
    files give rare 61.5% and frequent 48.6% and agree with reading (b) for about 96% of cell and S-tilde
    pairs. Tiling of the track is not tested by the criterion. After the first verification round two
    checks were added. With the 2020 code's signal for place cells, each cell divided by its 95th percentile,
    the fractions agree within 0.001 (rare 68.5% and frequent 56.7% with low-speed frames left out, 60.0%
    and 47.7% with all frames) and 99.91% of cell and S-tilde decisions are unchanged, so the signal does
    not explain the excess; no cell has a 95th percentile of 0. The numba shuffle gives the same exceedance
    counts as a plain numpy version in 500 of 500 entries (first 50 cells of F3 session 8, 1,000 shuffles,
    no early stopping). Header M2 says a per-cell scale does not change spatial information, which does
    not hold in general for the code's +0.001; a question asks a reader about it.
  deviations:
  - Spatial information follows the code as the criterion says, including its normalisation by the mean
    over bins; in the shuffles the minimum subtracted is the real map's minimum over all cells, which
    is 0 in every session and S-tilde.
  - A cell stops its shuffles once more than 50 of them reach its SI for every S-tilde and both readings;
    the decision is the same as after 1,000 shuffles.
