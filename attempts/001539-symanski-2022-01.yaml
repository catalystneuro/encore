findings:
- kind: format_error
  statement: The units table's electrodes column, a reference to rows of the electrode table, holds tetrode
    numbers (the N of the electrode labels 'tetrodeN') in all 38 files. Read as rows, as NWB tools do,
    it places 131 units on OB tetrodes, which carried no units, and gives 540 CA1 and 752 PFC units; read
    as tetrode numbers it gives 915 CA1, 508 PFC and no OB units, against the paper's 934 and 508 active
    units.
- kind: metadata_error
  statement: Electrode group names and electrode labels disagree in all 38 files (for example group Tetrode5
    is labelled tetrode6), so the tetrode a channel belongs to is ambiguous without the units' values.
- kind: metadata_insufficient
  statement: The trial table has no odor identity and no chosen well; unrewarded trials have no reward
    times. The odor and the choice must be reconstructed from the rewarded well and the position, and
    which side is odor 1 (heptanol) cannot be known.
- kind: selection_undocumented
  statement: The dandiset holds 915 CA1 and 508 PFC units, close to the paper's active units (934 and
    508), not the 1,309 and 717 recorded; the selection is not described. 53 units have fewer than 100
    spikes within the task epochs.
- kind: data_missing
  statement: The files hold no spike waveforms or widths (needed for the paper's cell-type rule), no nasal
    thermocouple signal, no air-only sessions and no sleep epochs. Three claims cannot be tested, and
    every claim that separates pyramidal cells from interneurons rests on a rate-only rule.
- kind: other
  statement: The acquisition ElectricalSeries is a copy of the processed LFP in every file (equal on the
    stretch checked), which doubles the dandiset to 95 GB; the LFP is stored as uncompressed, unchunked
    float64.
- kind: metadata_error
  statement: Position in CS39 session 02 spans 59 by 25 units against about 105 by 45 cm on the other
    CS39 days, and its speeds are lower in proportion, so its stated unit of centimeters does not hold
    for that file.
- kind: other
  statement: Four CS42 trials (sessions 02, 04, 05) end after the last LFP sample; the odor port position
    also moves between epochs in CS31 session 02 and CS34 session 02 (camera frame changes).
- kind: paper_inconsistency
  statement: For non-selective task-responsive cells the Results say the correct-incorrect SI correlation
    is not significant, while the legend of Figure 3-figure supplement 1e reports r = -0.34 with p = 0.001
    and 3.0e-4. On this dataset the Results' version holds with sampling-period SIs and the legend's (in
    CA1) with the code's binned SIs.
- kind: methods_unavailable
  statement: Questions for the paper's authors, each deciding a blocked claim. (1) Figure 2e middle and
    2d-e bottom, which pipeline (the F16 spectrogram code with time-matched windows, or the F7 code with
    fixed 500 ms windows) produced each panel, and which test (signed-rank across sessions, or rank-sum)
    and how many correct-trial subsamples were used for correct against incorrect. (2) Figure 2-figure
    supplement 1e, the odor and run windows and the frequency range searched for the peak. (3) Figure
    3i-j and supplement 1e, whether the SI was computed from sampling-period rates (Methods) or from 50
    ms bins 0.2 to 1 s after onset (cs_odorSelectivity_v2.m). (4) Figure 6e, whether the GLM windows were
    aligned to odor onset (Methods) or to odor port exit (Results, cs_predictChoice_GLM_v3.m), and whether
    sessions needed a minimum number of cells.
- kind: methods_unavailable
  statement: Questions for the paper's authors on choices this attempt assumed. (1) Over which period
    are the epoch mean and s.d. taken for z-scoring power and coherence, and for the ripple threshold
    (task epochs, sleep, or both)? (2) What order of IIR filter was used for the beta and RR band-passes?
    (3) Was the interneuron rule (7 Hz and 0.3 ms) applied with rate over run epochs or over all epochs?
