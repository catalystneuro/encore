outcomes:
- claim: na-cell-table-link
  outcome: partially_reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:na-cell-table-link
  notes: All 35 files match the 35 rows of the code table by file name, and every table cell ID
    agrees with the file's electrode cell_id in session and cell number (35 of 35). The dataset
    carries no cell type, so none can disagree with the table (14 VEN, 21 PC). Under the
    criterion's eight readings at most 2 of 35 computed maxima are within 10% of the table, short
    of the 28 required. The as-recorded readings (a1) are a median 4.15 to 4.61 times the table,
    because the traces keep holding currents of tens of pA. The baseline-subtracted readings (a2)
    are a median 1.32 to 1.40 times the table, Spearman 0.47 to 0.68, and a2b1c1 agrees best. A
    variant that is not a reading of the paper, a 0.75 ms moving average before the peak, gives 26
    of 35 within 10% (median ratio 1.006, Spearman 0.982). So the table's values are consistent
    with a filtered peak of these recordings. The variant was found after the readings were run
    and does not decide.
  deviations:
  - The link's value comparison used the eight readings of fig4d-sodium-current-lower, as the
    criterion says. The smoothing variant is the attempt's own and decides nothing.
- claim: fig4d-sodium-current-lower
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig4d-sodium-current-lower
  notes: The counts are 14 VEN and 21 PC, as stated. The VEN median is lower under all eight
    readings, but significance differs between them. Rank-sum p is 0.045 (a1b1c1) and 0.025
    (a1b1c2), and 0.077 to 0.29 under the six others, so by the criterion the claim is blocked.
    Under the code's example reading (a2 b1 c1), VEN 30.4 against PC 38.1 pA, p = 0.10. By session
    under that reading, VEN is lower in HS (15.9 against 40.3 pA, 7 and 11 cells) and not in AS
    (40.7 against 36.2 pA, 7 and 10 cells). The paper's code table gives 14.9 against 29.3 pA,
    p = 0.001, and the non-deciding smoothed variant 16.0 against 29.9 pA, p = 0.0008. The
    t-test variant gives p = 0.013 to 0.96 over the readings. Current density cannot be computed,
    as no capacitance is stored. Question for the paper's authors (finding methods_unavailable)
    is how the maximal current was measured from the traces. It asks which baseline was used,
    whether the traces were filtered or the peak fitted, and over which steps and window. The
    readings that subtract no baseline find the effect, and the code's own baseline subtraction
    does not, unless the trace is smoothed.
  deviations:
  - Cell types come from the paper's code table through na-cell-table-link, as the files carry
    none.
  - Repetitions were averaged before the peak was taken (criterion). The baseline window of
    reading a2 is 18.0 to 19.0 ms, the first 100 samples of a cut starting 2 ms before the onset
    at 100 kHz, as in Fig4d_plotNaCurrent.m.
- claim: model-na-ratio
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_liu_2026.ipynb
  output: claim:model-na-ratio
  notes: Depends on fig4d-sodium-current-lower, which is blocked. The ratios were computed for
    every reading of the measure. They are 0.68 to 0.99, and in tolerance (0.619 to 0.756) under
    some summary only for the four as-recorded readings (a1). The baseline-subtracted readings give
    0.79 to 0.99. The code table's values give 0.58 (mean) and 0.51 (median), and the smoothed
    variant 0.58 and 0.54, none in tolerance. The Extended Data Fig. 7c legend says the
    conductance range was also set from previous publications, so 55 pS/um2 may not be the
    recorded ratio alone.
- claim: na-patch-capacitance
  outcome: blocked
  blocked_by: data_missing
  notebook: reproduce_liu_2026.ipynb
  output: claim:na-patch-capacitance
  notes: No VoltageClampSeries in any file holds a capacitance, compensation or series resistance
    value (only data, electrode, gain and starting_time), and the asset metadata names none. The
    traces are leak subtracted online, so capacitive transients that could give an estimate are
    removed. The paper's code table holds no capacitance either.
- claim: fig8a-metabolite-gradient
  outcome: not_reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig8a-metabolite-gradient
  measured:
  - 175
  - 84
  notes: On the deposited values, Welch's ANOVA at P < 0.05 followed by Games-Howell at P < 0.05
    gives 175 metabolites for AIC against V1 (expected 205.2 to 250.8) and 84 for AIC against PrC
    (expected 97.2 to 118.8). Games-Howell alone gives 179 and 85. On log2 values the counts are
    190 and 95 (194 and 98 without the ANOVA gate), also outside tolerance. The direction holds
    under every variant, with about twice as many differences against V1 as against PrC. The
    deposited table holds 558 metabolites against the 581 the Results report, which may account
    for part of the shortfall. The samples are 6 AIC, 6 PrC and 7 V1, as the Fig. 8 legend gives.
  deviations:
  - The Methods name no transform of the peak areas. The deposited values are used, and log2
    values are a variant; both fall short.
  - The words "followed by" are read as the pair counted when Welch's ANOVA gives P < 0.05; the pair test
    alone is shown and also falls short. Games-Howell was computed with the studentized range
    for three groups and Welch degrees of freedom.
- claim: fig8de-glycolytic-bias
  outcome: partially_reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig8de-glycolytic-bias
  notes: Citric acid is higher in AIC than in V1 (ratio 1.37, Games-Howell p = 0.00046) and
    L-glutamic acid too (ratio 1.35, p = 0.0001). 2-Ketobutyric acid is lower (ratio 0.37) but
    not significantly (Games-Howell p = 0.18, Welch's ANOVA p = 0.17; on log2 values p = 0.086).
    Two of the three parts hold. A second entry named "Glutamic acid glutamate" is higher (1.18)
    without significance (p = 0.15).
  deviations:
  - Metabolites were found by name in the deposited table; citrate is "Citric acid", glutamate
    "L-Glutamic acid", 2-ketobutyrate "2-Ketobutyric acid". The paper does not say which table
    entries it plotted.
- claim: fig4j-eepsp-amplitude
  outcome: reproduced
  notebook: reproduce_liu_2026.ipynb
  output: claim:fig4j-eepsp-amplitude
  notes: In the 26 VEN-PC pairs of sumData_StimWM.xlsx the VEN amplitudes are higher at each of the
    three stimulation levels (means 0.0067, 0.0133 and 0.0193 against 0.0036, 0.0066 and 0.0128,
    unit not stated) and in 21 of 26 pairs. Cell type effect, ordinary two-way ANOVA F = 7.62,
    p = 0.0065, and repeated-measures ANOVA with the pair as subject F = 8.72, p = 0.0068 (paper
    P = 0.0034). Stimulation level, p = 5.3e-05 and 1.6e-08. The table holds amplitudes already
    measured by the authors, so this checks the statistics, not the selection of monosynaptic
    eEPSPs.
  deviations:
  - Tested on the paper's per-pair amplitude table, as the claims file names it, not on raw
    recordings, whose dandiset the paper does not name. Levels are taken by their order within
    each pair, as 9 rows give no stimulation value.
