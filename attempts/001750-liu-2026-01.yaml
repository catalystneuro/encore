findings:
- kind: metadata_insufficient
  statement: The files carry no cell type, so VENs and PCs cannot be told apart from the dandiset.
    Types come only from the paper's code table metadata_outSideOutSodiumCurrentRec.csv, which
    names each NWB file; the file names and electrode cell IDs agree with it for all 35 patches.
- kind: data_missing
  statement: No file holds the patch capacitance, series resistance or compensation values, so the
    patch size the Methods report (about 50 fF, 5 um2) and current densities cannot be computed.
- kind: methods_unavailable
  statement: How the maximal Na+ current was measured from the traces is not stated in the paper or
    its code. Plain peaks of the repetition-averaged traces, with or without a pre-step baseline,
    do not match the code table (at most 2 of 35 within 10%), and the VEN against PC difference is
    significant only without baseline subtraction. A peak after 0.5 to 1 ms smoothing matches the
    table closely. Question for the authors, which baseline, filter or fit, steps and window gave
    the maximal currents of Fig. 4d?
- kind: metadata_error
  statement: Every file gives the session start time 2018-01-01 01:00, while the session ids and
    the code table's cell IDs date the recordings to 6 December 2022. The series starting_time
    values (0 to 3 s) carry no order.
- kind: other
  statement: The traces keep holding currents of -131 to +92 pA before the step although the
    Methods say they were leak subtracted online, so a baseline must be removed before a peak is
    taken. One file (cell HS018, a VEN) has a positive holding current and noise near 57 pA SD.
    Files hold 28 or 34 steps (to +55 or +85 mV) and 1 to 10 repetitions, where the Methods
    describe steps to 0 mV.
- kind: other
  statement: The MetaboLights metabolite table of MTBLS13927 holds 558 identified metabolites, where
    the Results report 581, and one AIC sample is named A1C-1-Q. The Welch and Games-Howell counts
    on it fall short of the reported 228 and 108.
- kind: other
  statement: In the paper's code repository, AIScmp_PCvsVEN_Fig5c.xlsx has 500 PC and 120 VEN values
    where the Fig. 3c legend gives 430 and 108, and no slice or animal column for its two-way
    ANOVA. sumData_StimWM.xlsx gives stimulation values 0.5, 1 and 2 labelled mA where the Methods
    give 0.05 to 0.2 mA, and no unit for the amplitudes.
