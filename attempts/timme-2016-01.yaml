  - Assumed the gain is normalized by H(I_F) (reading u), as the paper normalizes the PID terms (paragraph after
    Eq 10); the gain in bits (v) is shown.
  - The variants (strict rule, bins t-1 and t-2, random sub-network connections) use 100 sub-networks per recording
