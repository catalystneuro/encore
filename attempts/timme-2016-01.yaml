- claim: data-recordings
  outcome: reproduced
  notebook: reproduce_timme_2016.ipynb
  output: claim:data-recordings
  measured:
  - 25
  - 7735
  - 309.4
  - 2.132
  notes: 25 recordings, 7735 neurons, 309.4 per recording, every neuron with at least 100 spikes, so the deposit
    already applies the 100-spike threshold. Mean rate 2.103 Hz with spikes over 60 min (reading b), 2.132 Hz over
    each recording's own length (reading a); both within tolerance. Rates range from 0.028 to 77.5 Hz.
  deviations:
  - The rate can be read two ways (criterion), spikes over each recording's length (a, 2.132 Hz) or over 60 min
    (b, 2.103 Hz); both match, and the measured value is (a), the first reading the criterion lists.
- claim: fig4ac-te-lognormal
  outcome: partially_reproduced
  notebook: reproduce_timme_2016.ipynb
  output: claim:fig4ac-te-lognormal
  notes: 'With ties counted as exceeding and bins t-2 and t-3, the significant TE values span several orders of
    magnitude: the 99th percentile is 353 to 1160 times the 1st at both time scales, for raw and normalized TE,
    under both readings. Fits of Eq 21 to the distribution averaged over recordings have R2 of 0.935 and 0.957 (raw
    TE) and 0.882 and 0.904 (normalized TE) under (f), and 0.939, 0.960, 0.895 and 0.899 under (s); three of eight
    fall just below the criterion''s 0.9, all for normalized TE. With bins t-1 and t-2 every fit has R2 of 0.90
    to 0.98 and the criterion holds under both readings; with the strict tie rule the averaged fits have R2 of 0.08
    to 0.71.'
  deviations:
  - The TE networks are rebuilt from the deposited spike times; the paper reused the networks of its reference [44]
    (Timme et al. 2014, PLoS One 9 e115764), which are not deposited. Bins of 1.6 and 3.5 ms, past states the OR
    of two bins, a 7-bin uniform jitter, 5000 surrogates and fewer than 5 exceeding are taken from [44], Table 1
    and Transfer Entropy Analysis, paragraphs 3 and 6, as the paper directs (Methods, Effective Connectivity Detection,
    paragraphs 1 and 4).
  - Assumed that a surrogate whose TE equals the real TE counts as exceeding it. [44] takes as the p-value the percentage
    of surrogates 'larger than' the real TE (Transfer Entropy Analysis, paragraph 6), and M-SIG says 'larger'. Taken
    literally, a pair whose counts the jitter cannot change ties in every surrogate and is called significant. On
    circularly shifted trains, where every pair is independent, the strict rule calls 10.8% of pairs significant
    and the tie-counting rule 0.32%, against the 0.1% of the paper's p < 0.001, so the strict rule is not the test
    the paper states. The strict rule is run as a variant.
  - Assumed which two bins form the past state. [44]'s text writes bins t-d and t-d-1 (with d = 1, bins t-1 and
    t-2), while its Table 1 and the paper give a delay window of 1 to 4 bins, which bins t-2 and t-3 give. Bins
    t-2 and t-3 are used; bins t-1 and t-2 are run as a variant.
  - For pairs whose jitter moves more than 50 relevant sender spikes, the surrogate counts are drawn from a normal
    distribution with their exact mean and covariance, not by jittering every spike, to fit the time limit. On DataSet1
    and DataSet7 at both time scales the approximation and the full jitter share 83% to 89% of the connections either
    finds under the tie rule (95.7% to 99.2% under the strict rule), the approximation finding 0.1% to 8.2% more.
    The number of past states equal to 1 is held at its real value in each surrogate, as [44] states the jitter
    preserved it.
  - Sub-networks follow [44], Topology Analysis - Sub-Networks, paragraph 2 (50 random neurons, unconnected ones
    replaced from the pool, the 75 strongest connections by normalized TE kept; reading (a) of M-SUB), and a group
    with fewer than 75 significant connections is redrawn, as M-SUB says. Within 5000 draws four recordings give
    fewer than 500 sub-networks at 1.6 to 6.4 ms (DataSet2 6, DataSet5 0, DataSet10 380, DataSet17 148); these are
    used as they are. Reading (b), 75 connections at random, is run as a variant.
  - The fit starts from the moments of the binned distribution; the paper gives no starting values. 100 log-spaced
    bins span the pooled range of each panel.
  assumed: true
