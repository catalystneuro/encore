findings:
- kind: data_missing
  statement: The paper analysed the TE networks of its reference [44] (Timme et al. 2014), at time scales 2 and
    3 of that study. The networks, the TE values and the sub-networks are not in the data set, which holds spike
    times only, so the paper's networks cannot be checked; they have to be rebuilt, and a rebuilt network may differ
    from the paper's.
- kind: other
  statement: DataSet19 (2013-01-06-1) lasts 2887498 ms (48 min), where the paper describes 60 minute recordings;
    the data description says most recordings are 3600000 ms. The first ten recordings (2012) have no spike in their
    first 8 s.
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: which bins form the past states of the TE? [44] writes the past
    as bins t-d and t-d-1 (d = 1), which gives delays of 0 to 2 bins, while its Table 1 and this paper give delay
    windows of 1.6 to 6.4 ms and 3.5 to 14 ms (1 to 4 bins), which bins t-2 and t-3 give. This attempt used t-2
    and t-3 and shows t-1 and t-2; the log-normal fit (Fig 4A, C) and the information gain in bits (Fig 6) differ
    between them.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: how did the jitter test count a surrogate whose TE equals the real
    TE? [44] takes the percentage of surrogates ''larger than'' the real TE as the p-value. Taken literally, every
    pair whose counts the jitter cannot change is significant; here that rule calls 10.8% of independent (shifted)
    pairs significant, against the 0.1% of p < 0.001, and gives networks about 95 times denser than chance, against
    20 to 47 times when ties count as exceeding. This attempt counted ties as exceeding.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: were the weight distributions (Fig 4A, C), degree distributions
    (Fig 4B, D) and the degree and synergy correlations (Fig 5) computed on the 500 sub-networks per recording or
    on the full networks, and were the correlations Pearson or Spearman? The in-degree correlation (Fig 5A) has
    a significant negative skew under three of four readings but not under sub-networks with Spearman, and the model
    comparison (Fig 7C) holds in full only under sub-networks with Spearman. This attempt assumed sub-networks and
    Pearson.'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: Fig 5 gives N data = 40 correlations per panel; with 25 recordings
    and two time scales there are 50. Which 40 were used?'
- kind: methods_unavailable
  statement: 'Question for the paper''s authors: how was the synergy of the feedforward model computed, given that
    its runs are independent and have no past to condition on, and from how many runs were the model''s synergy
    and mutual information estimated?'
