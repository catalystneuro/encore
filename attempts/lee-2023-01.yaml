- claim: fig4c-calb1-ephys-by-morphology
  outcome: reproduced
  assumed: true
  notebook: reproduce_lee_2023.ipynb
  output: claim:fig4c-calb1-ephys-by-morphology
  notes: 14 SST CALB1 cells with a file (6 DBC, 3 MC, 4 sparse SST, 1 basket). Sparse SST median sag
    0.300 against DBC 0.473 and MC 0.509; isi_adapt_ratio 1.75 against 1.14 and 1.37; latency at
    rheobase 0.187 s against 0.070 and 0.079, at the hero sweep 0.030 against 0.019 and 0.022. MC
    peak is highest (84.0 mV at rheobase, 83.1 at the hero sweep). All four statements hold under
    every reading, by medians as the criterion says; Kruskal-Wallis p is 0.029 (sag), 0.16
    (adaptation), 0.11 (latency) and 0.032 (peak). The adaptation index (adapt_hero) also puts
    sparse SST highest.
  deviations:
  - The ISI adaptation ratio is computed as the second ISI over the first on the lowest sweep with
    four or more spikes (an assumption, Methods "a ratio of the spike features between the first and
    third spike"). It agrees with the paper's table for only 27% of cells. The paper's own values
    for these cells order the types the same way (sparse SST 3.84, MC 1.93, DBC 1.39).
- claim: fig4d-calb1-genes-by-morphology
  outcome: not_reproduced
  notebook: reproduce_lee_2023.ipynb
  output: claim:fig4d-calb1-genes-by-morphology
  measured: 2
  notes: Under the Methods (pairwise Welch t tests, Bonferroni over 50281 genes, adjusted p < 0.05),
    2 genes differ between the 7 DBC, 3 MC and 5 sparse SST cells of SST CALB1, and none among the
    10 culture microglial ones (3, 3, 4; the legend's "10"). The code's one-against-rest variant
    (culture microglial cells, genes of median >= 1, p < 0.01) gives 431 genes, or 451 rows as
    FindAllMarkers counts them; neither is within 228 to 278. Its gene filters (keepGenes and the
    immune genes) need data not in the repository. Clusters cannot be built on 2 genes. On the
    variant genes three clusters form, but under every one of the five seeds MC and sparse SST cells
    have their majority in the same cluster, and DBCs are split (largest share 0.43 to 0.57).
  deviations:
  - Seurat's FindMarkers is run as Welch t tests in Python on the stored log2(CPM + 1); the UMAP
    and clusters use umap-learn and the Louvain method of networkx, not Seurat.
