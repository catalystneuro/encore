outcomes:
- claim: cell-metadata-link
  outcome: reproduced
  notebook: reproduce_lee_2023.ipynb
  output: claim:cell-metadata-link
  notes: Files are matched to metadata rows by nwb_id, which equals the NWB session id. 684 of the
    704 unique rows with Has_ephys (97.2%) have a file; 14 of these rows have no nwb_id and 6 have
    one that is not in the dandiset. 16 files have no metadata row, and 6 rows without Has_ephys
    have a file. Of the cells with values on both sides, rheobase_i agrees within 10% for 92.2%
    (650 cells), input_resistance 94.5%, sag 97.8% and width_rheo 98.8% (586 cells); the median
    relative difference is 0 for all four. All four agree together for 90.6% of 586 cells, a
    stricter reading shown only. Over the 65 features computed, a median of 93.6% of cells agree
    within 10%. Nine features agree for less than 80% of cells (fi_fit_slope 41%, isi_cv_mean 46%,
    adapt_mean 58%, isi_norm_sq_var_mean 60%, isi_norm_sq_var_max 71%, adapt_max 77%,
    isi_adapt_ratio 27%, and upstroke_ramp and threshold_i_ramp just under 80%). For the first seven
    the definitions here (assumptions in the helper) are not the paper's.
  deviations:
  - The criterion is read per feature (each of the four features within 10% for at least 90% of
    the cells with both values), as "the cells with both values" suggests; the joint reading
    (90.6%) also passes.
  - Cell-level QC (seal and access resistance) is not recomputed; the Methods' sweep QC is
    applied (bridge balance, bias current, noise), which may explain part of the rheobase
    disagreement.
- claim: dataset-composition
  outcome: partially_reproduced
  notebook: reproduce_lee_2023.ipynb
  output: claim:dataset-composition
  measured:
  - 778
  - 44
  - 64
  - 101
  - 158
  - 363
  notes: The metadata table holds 778 unique neurons in 44 t-types, as the paper says. Over the 686
    labelled files with a QC-passing long square sweep, reading (a), Revised_subclass_label, gives
    LAMP5/PAX6 64, VIP 101, SST 158 and PVALB 363; three are within tolerance and LAMP5/PAX6 is not
    (64 against 75, tolerance 7.5). Reading (b), subclass_label, gives 69, 96, 231 and 290, two
    within tolerance. The 675 cells with a rheobase computed here equal the paper's total (75 + 99
    + 149 + 352), but split 63, 99, 155 and 358. All 704 rows with Has_ephys give 67, 111, 156 and
    370 under reading (a), so the paper's 75 LAMP5/PAX6 cannot be counted from its own table either.
    The metadata table lists layers 1 and 5_6 for some cells as well as 2 to 6.
  deviations:
  - Cell-level inclusion criteria (seal, access resistance) are not recomputed from the test
    pulses; a cell counts when it has at least one long square sweep passing the Methods' sweep QC.
- claim: fig1b-more-genes-in-culture
  outcome: reproduced
  notebook: reproduce_lee_2023.ipynb
  output: claim:fig1b-more-genes-in-culture
  notes: On the Genes_Detected column, which the code's notebook plots as Genes.Detected of metaPatch
    (equal for all 778 cells), culture median 7318 (n = 467) against acute 6802 (n = 311),
    two-sided Mann-Whitney p = 1.6e-05. On genes above 0 in the expression matrix, a variant, 12203
    against 11259, p = 4.3e-10. Both are below p = 0.0001.
  deviations:
  - The matrix count of genes above 0 does not equal the Genes_Detected column for any cell
    (median difference 4394 genes). The column is used, as the code's notebook plots it; the matrix
    count is shown as a variant, and the test holds for both.
- claim: figs1-microglial-signature
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_lee_2023.ipynb
  output: claim:figs1-microglial-signature
  notes: The criterion's two readings of "less pronounced" give different outcomes, and the criterion
    blocks the claim in that case. The code's Seurat clustering is run with a Python substitute
    (vst variable genes, scaling, 20 PCs, a UMAP with Seurat's defaults, a shared-neighbour graph on
    the UMAP and Louvain at the code's resolutions). At resolution 0.001 the 467 culture cells form
    two clusters under four of the five seeds, the claim's among them, and three under seed +3000 (the
    third splits the cells without the signature); the microglial cluster has 171 to 173 cells with
    mean expression of the 269 Data S2 genes 6.0 against 1.1 (Mann-Whitney p 1.1e-72 to 2.8e-72). The
    calls at resolution 0.1 agree with condition2 for 96.7% to 98.2% of cells. Reading (b) holds, the acute
    microglial cells express the genes less (mean 3.6 to 3.8 against 5.9). Reading (a) fails, a larger
    fraction of acute than culture cells is called microglial (0.40 to 0.47 against 0.38); the
    paper's own calls give the same (0.418 against 0.385).
  deviations:
  - Seurat cannot be installed in the entry's locked Python environment, so its steps are run in
    Python with Seurat's default parameters (vst with a lowess for loess, uwot's defaults in
    umap-learn, Louvain of networkx with one start). The microglial genes for the second step are the
    269 of Data S2 marked used_for_defining_microglial_signature, the set the code's culture_DEX step
    produced, not recomputed.
- claim: fig1c-marker-expression-correlated
  outcome: reproduced
  assumed: true
  notebook: reproduce_lee_2023.ipynb
  output: claim:fig1c-marker-expression-correlated
  notes: Every reading run holds. Per subclass, Pearson r is 0.81 to 0.95 on log2(CPM + 1) and 0.82
    to 0.97 on CPM, Spearman 0.75 to 0.94, all p < 1e-4 with 25 genes; pooled over 100 genes, r =
    0.87 to 0.92. Cells per subclass, acute and culture, are 57 and 25 (LAMP5/PAX6), 145 and 258
    (PVALB), 30 and 141 (SST), 79 and 43 (VIP).
  deviations:
  - The genes are the 25 with the largest difference in mean log2(CPM + 1) between a subclass's
    Patch-seq cells and the other cells, a standard choice. The criterion's other reading, the
    snRNA-seq ranking, could not be run, as the code repository does not hold the dissociated
    nuclei data its notebook loads (complete_facs_data_sets.RData). The outcome rests on the
    Patch-seq readings, an assumption.
- claim: fig1d-nms-no-difference
  outcome: reproduced
  notebook: reproduce_lee_2023.ipynb
  output: claim:fig1d-nms-no-difference
  notes: marker_sum_norm_label, acute median 0.962 (n = 311) and culture 0.962 (n = 467), two-sided
    Mann-Whitney p = 0.38, rank-biserial -0.037.
  deviations:
  - The NMS values are the paper's own column; they were not recomputed from the expression data.
- claim: fig1g-wfdc2-morphology-unchanged
  outcome: reproduced
  notebook: reproduce_lee_2023.ipynb
  output: claim:fig1g-wfdc2-morphology-unchanged
  notes: The feature table has 16 acute and 10 culture PVALB WFDC2 reconstructions, not the paper's
    10 and 9. No feature differs at FDR p < 0.05 under any reading. (a) All 26 cells, smallest FDR p
    0.117 (smallest raw p 0.0029, soma_surface). (b) The 9 and 9 cells inside the depth range both
    groups share, smallest FDR p 0.202. (c) Each culture cell with its nearest-depth acute cell, 10
    and 10, smallest FDR p 0.090. Culture somas are shallower (median 535 against 837 um).
  deviations:
  - Tested on the paper's morphology feature table, not on features recomputed from the
    reconstructions.
  - The 50 features are the table's 51 columns less soma depth, which the matching uses. How the
    paper depth-matched its 9 and 10 cells is not given; two matchings were run, and all readings
    give the same outcome.
- claim: figs2b-wfdc2-ephys-43-of-84
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_lee_2023.ipynb
  output: claim:figs2b-wfdc2-ephys-43-of-84
  notes: 19 of the 84 features (width_suprathresh, postap_slope, sag_area, sag_peak_t, sag_tau,
    sag_depol, ahp_delay_ratio, trough_slowdeltav and adp_v_last features) are not computed by
    public IPFX; the Methods say "custom code used for chirps and some high-level features will be
    released in a future version of IPFX". Over the 65 features computed, 41 differ between 65
    acute and 82 culture PVALB WFDC2 cells at BH-FDR p < 0.05 (63%, the paper 51%). Counting the 19
    missing features as all non-significant or all significant bounds the count over 84 between 39
    and 61, which contains the whole tolerance (38.7 to 47.3), so the outcome cannot be decided. As
    variants, the paper's own table gives 47 of 84 for the same cells (53 of 93), and the computed
    features with the paper's values for the missing 19 give 50. With culture restricted to cells
    without (with) the microglial signature, 37 (30) of 65 differ.
- claim: fig1l-width-sag-differ
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_lee_2023.ipynb
  output: claim:fig1l-width-sag-differ
  notes: The readings give different outcomes, so the claim is blocked as its criterion says. Sag is
    higher in culture (median 0.284 against 0.110, FDR p = 1.2e-14). AP width is wider in culture
    at FDR p < 1e-4 for the rheobase (FDR p = 5.6e-05), hero (6.6e-06) and short square (7.7e-05)
    sweeps; the ramp gives FDR p = 0.0077. Input resistance does not differ (FDR p = 0.81). The ISI
    of the hero sweep does not differ (FDR p = 0.75), but that of the rheobase sweep does (FDR p =
    0.016, 74 cells with two or more spikes at rheobase). Five of the eight readings fail (the four
    with the rheobase ISI, and the ramp width with the hero ISI); under the hero ISI with
    rheobase, hero or short square width the claim holds. All 10 PVALB WFDC2 files at 200 kHz are
    culture cells; over the 50 kHz files only, width differs at FDR p 4.4e-06 to 3.6e-05 for the same
    three sweeps, so the sampling rate does not explain the width difference. With BH over 84
    features and the 19 missing ones at p = 1, the largest FDR p width_short_square can have is
    9.9e-05. Open question for the authors, which sweep's ISI and width Fig. 1L plots.
  deviations:
  - BH-FDR across the 65 computed features, as the 84 cannot all be computed; the bound over 84 is
    shown.
- claim: figs2c-no-change-with-days
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_lee_2023.ipynb
  output: claim:figs2c-no-change-with-days
  notes: It depends on fig1l-width-sag-differ, which is blocked, and its own width readings disagree.
    Over 82 culture PVALB WFDC2 cells, sag does not correlate with days in culture (r = 0.07, FDR p
    0.51 to 0.70). Width does not for the rheobase, hero and ramp sweeps (r -0.05 to 0.08) but does
    for the short square (r = 0.37, FDR p = 0.0015). The one 2 DIC PVALB WFDC2 cell has sag 0.379
    and width 0.54 to 0.61 ms, above the acute medians (0.110, 0.41 to 0.49 ms) as the culture
    group is. Of the 41 features that differ, 4 correlate with days in culture at BH p < 0.05.
- claim: fig1i-wfdc2-ephys-umap-overlap
  outcome: not_reproduced
  notebook: reproduce_lee_2023.ipynb
  output: claim:fig1i-wfdc2-ephys-umap-overlap
  notes: In feature space, culture PVALB WFDC2 cells have a mean of 0.191 acute cells among their 15
    nearest PVALB WFDC2 neighbours, against a shuffle median of 0.446 (ratio 0.43, under the
    criterion's 0.5); acute cells 0.408 against 0.563 (0.72). In the UMAP embedding the ratios are
    0.68 to 0.82 under all five seeds, which passes. With 10 and 30 neighbours the feature-space
    culture ratio is 0.36 and 0.48. The feature-space result does not depend on the seed beyond the
    shuffle (0.43 under all five). With the paper's values for the 19 missing features added, the
    feature-space culture ratio is 0.45, so the missing features do not explain the failure. On the
    paper's own table of all 84 features it is 0.51, which passes narrowly, so the result depends on
    how the 65 shared features are computed (nine of them agree with the paper's table for fewer
    than 80% of cells, cell-metadata-link).
  deviations:
  - The 65 computed features in place of 84; the paper's table is shown as a variant.
- claim: figs2d-seven-channel-genes
  outcome: blocked
  blocked_by: other
  notebook: reproduce_lee_2023.ipynb
  output: claim:figs2d-seven-channel-genes
  notes: The code's linear model (condition + isImmune + interaction, then apply(lm_pval, 2,
    p.adjust)) was run on 168 PVALB WFDC2 transcriptomes and the 40551 genes with mean > 0.01. The
    notebook prints the code's chunk; lm_pval is built by apply over the genes, so it has the three
    model terms as rows and the genes as columns, and apply(lm_pval, 2, p.adjust) adjusts each
    gene's three term p-values with Holm. The code also keeps only its keepGenes, which it builds
    from the dissociated-nuclei data (complete_facs_data_sets.RData) and sex and mitochondrial gene
    lists, none of which is in the repository. Without that filter 142 channel genes are tested,
    against the paper's 114, so the procedure is not the paper's; 22 of them have adjusted p <=
    0.01 (Holm across genes 1, BH across genes 12, unadjusted 34). The count is not judged against
    7. The dissociated-nuclei data are on the Allen portal without a pinned version. Which
    adjustment the criterion means is asked of a reader (questions/lee-2023.yaml).
- claim: fig2b-ephys-umap-subclasses
  outcome: partially_reproduced
  notebook: reproduce_lee_2023.ipynb
  output: claim:fig2b-ephys-umap-subclasses
  notes: PVALB has the highest same-subclass fraction among 15 neighbours in every space and seed
    (0.844 in feature space, 0.876 to 0.880 in UMAP). In feature space the VIP fraction (0.342)
    exceeds its share (0.147) by 0.195, under the criterion's 0.2; the other three exceed by 0.22 to
    0.34. In UMAP all four exceed 0.2 under the claim's seed (smallest SST 0.202) and three other
    seeds, and SST misses under +1000 (0.200, under 0.2 before rounding). The feature space fails
    under every seed, so the outcome does not depend on the seed. With the paper's values for the 19
    missing features added, all four exceed 0.2 in both spaces (smallest excess 0.222 in both), and
    on the paper's own 84-feature table as well (0.211 and 0.256), so the failing part rests on the
    19 features public IPFX does not compute. UMAP numbers differ between machines under the same
    seed; in the run before the second verification SST missed under +1000 and +4000 (0.197, 0.199). 686 cells, PVALB
    363, SST 158, VIP 101, LAMP5/PAX6 64. The four non-positive values set missing (round 2) moved
    the VIP excess from 0.193 to 0.195.
  proposed:
    outcome: blocked
    blocked_by: methods_underspecified
    reason: The only failing part, separability in feature space (VIP excess 0.195), passes in both
      spaces once the paper's values for the 19 features public IPFX does not compute are added
      (smallest excess 0.222) and on the paper's own table (0.211 and 0.256). Separability is then
      not decided on the 65 computable features, the situation of figs2b-wfdc2-ephys-43-of-84, which
      is blocked as methods_underspecified for the same 19 features. The round-2 verifier judged so.
      Notebook cell claim:fig2b-ephys-umap-subclasses prints both variants.
  deviations:
  - The 65 computed features in place of 84; the paper's table is shown as a variant.
