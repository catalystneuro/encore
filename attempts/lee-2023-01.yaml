  outcome: reproduced
  notebook: reproduce_lee_2023.ipynb
  output: claim:fig2e-lamp5-shortest-extent
  notes: LAMP5/PAX6 (13 cells) have the lowest median axon_max_euclidean_distance (434 um; PVALB
