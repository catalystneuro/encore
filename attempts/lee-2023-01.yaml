  deviations:
  - The 65 computed features in place of 84.
- claim: fig2c-morph-umap-subclasses
  outcome: not_reproduced
  notebook: reproduce_lee_2023.ipynb
  output: claim:fig2c-morph-umap-subclasses
  notes: Over 140 reconstructions, PVALB has the highest same-subclass fraction (0.78 in feature
    space, 0.73 in UMAP under the claim's seed). In feature space LAMP5/PAX6 (13 cells) exceed their
    share by 0.10 and VIP by 0.19, under 0.2. In UMAP SST exceeds by 0.175 under the claim's seed
    and 0.14 to 0.21 over the five seeds (all four pass under one seed, +2000); the feature space
