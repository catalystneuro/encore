- claim: fig2f-ap-kinetics
  outcome: partially_reproduced
  notebook: reproduce_lee_2023.ipynb
  output: claim:fig2f-ap-kinetics
  notes: Both readings agree. PVALB has the narrowest AP (short square median 0.48 ms against 0.66
    to 0.74; rheobase 0.52 against 0.74 to 0.80) and the lowest upstroke/downstroke ratio (1.81
    against 2.25 to 2.38; 1.68 against 2.32 to 2.52), with Dunn's FDR p <= 7.1e-14 against every
    subclass. LAMP5/PAX6 has the highest median peak (71.9 mV short square, 70.6 mV rheobase), but
    not significantly against all others, VIP p = 0.08 for the short square and SST p = 0.061 for
    the rheobase sweep, so the peak part fails the criterion. The kinetics part holds and the peak
    part holds by medians only.
