- claim: fig2e-lamp5-shortest-extent
  outcome: reproduced
  notebook: reproduce_lee_2023.ipynb
  output: claim:fig2e-lamp5-shortest-extent
  notes: LAMP5/PAX6 (13 cells) have the lowest median axon_max_euclidean_distance (434 um; PVALB
    639, VIP 707, SST 920) and basal_dendrite_max_euclidean_distance (171 um; SST 300, VIP 345,
    PVALB 348). Kruskal-Wallis p = 4.6e-06 and 2.4e-04. Dunn's FDR p of LAMP5/PAX6 against the others
    is 1.6e-06 to 7.9e-04 for the axon, and 3.5e-04 to 0.053 for the dendrite (SST 0.053).
  deviations:
