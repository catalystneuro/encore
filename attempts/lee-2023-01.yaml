findings:
- kind: metadata_insufficient
  statement: The NWB files hold no cell type, subclass, brain region, cortical layer, slice condition
    (acute or culture), days in culture or virus; their electrode location is empty. Every label
    the paper's analyses need comes from the code repository's metadata table, linked by its nwb_id
    column.
- kind: identifier_missing
  statement: 16 of the 706 files have no row in the paper's metadata table (sessions 567737666,
    567773605, 569870997, 571674350, 591326867, 591342850, 595591210, 595597605, 595715586,
    601916346, 611610562, 611822740, 611901143, 847874997, 847908770, 855354224), so they cannot be
    labelled. 20 metadata rows with Has_ephys have no file (14 without nwb_id, 6 whose nwb_id is
    not in the dandiset).
- kind: metadata_error
  statement: The dandiset's assetsSummary gives numberOfCells 616, but the version holds 706 files of
    one cell each.
- kind: other
  about: data
  statement: 79 files have sweeps sampled at 200 kHz (all recorded in 2020 and 2021), where the Methods
    state that data were digitized at 50 kHz; two files mix rates (25 and 50 kHz, 50 and 200 kHz).
- kind: metadata_error
  statement: The subject species is written "Homo Sapiens" in 581 files and "Homo sapiens" in 125.
- kind: other
  about: paper
  statement: The paper's metadata table (LeeDalley_manuscript_metadata_v2.csv) repeats one row
    (specimen 819133824, a culture microglial cell), giving 779 rows for 778 cells, so a count over
    its rows gives 181 culture microglial cells where metaPatch, stored with the transcriptomes, has
    180. With the repeated row removed, the condition2 calls of the two tables agree for all 778
    cells.
- kind: methods_unavailable
  statement: 19 of the paper's 84 electrophysiology features (width_suprathresh, postap_slope,
    sag_area, sag_peak_t, sag_tau, the depolarizing sag features, ahp_delay_ratio, trough_slowdeltav
    and adp_v_last) are computed by code the paper says "will be released in a future version of
    IPFX"; public IPFX 2.1.2 does not compute them, so counts over 84 features (43 of 84 differ
    between acute and culture) cannot be repeated. The definitions of the adaptation ratios and of
    the mean and maximum ISI summaries are not given precisely enough to match the paper's table
    (isi_adapt_ratio agrees for 27% of cells).
- kind: methods_unavailable
  statement: Which sweep stands for the interspike interval and AP width in Fig. 1L is not given. With
    the rheobase-sweep ISI, the ISI differs between acute and culture PVALB WFDC2 cells (FDR p =
    0.016), and with the hero-sweep ISI it does not (0.75). Could the authors say which sweeps
    Fig. 1L and fig. S2C use?
- kind: methods_unavailable
  statement: The code's gene filter for the ion-channel and morphology-type gene analyses (keepGenes)
    is built from dissociated-nuclei data (complete_facs_data_sets.RData) and sex and mitochondrial
    gene lists that the repository does not hold, so figs. S2D (7 of 114 channel genes) and the
    253 genes of Fig. 4D cannot be repeated from the repository.
- kind: code_mismatch
  statement: In the code's ion-channel analysis, apply(lm_pval, 2, p.adjust) adjusts each gene's three
    term p-values with Holm, not across genes, and its comment calls this FDR correction.
- kind: other
  about: data
  statement: The code repository's Genes_Detected column does not equal the number of genes above 0
    in its own expression matrices for any of the 778 cells (median difference 4394 genes), and no
    threshold from 0 to 5 on the stored log2(CPM + 1) reproduces it for any cell; how it was counted is not documented.
- kind: methods_unavailable
  statement: Whether the SST population of Fig. 5D (morphology UMAP) includes the SST FRZB neurons,
    which the paper moves to the PVALB subclass for subclass-level analyses, is not said. The DBC
    clustering test passes in the UMAP with them (subclass_label) and fails without them
    (Revised_subclass_label). Could the authors say which cells the panel shows?
- kind: methods_unavailable
  statement: Which sweep's average firing rate fig. S8B compares between species is not given. With
    the rate at rheobase + 40 pA, the Sst 5 rates do not differ between human and mouse, and with the
    rate at rheobase they do (FDR p 7.3e-04). Could the authors say which sweep they used?
- kind: data_missing
  statement: The MERFISH data of Fig. 5B are not in the dandiset and the paper gives no public
    location for them.
- kind: other
  about: paper
  statement: The paper reports 75 LAMP5/PAX6, 99 VIP, 149 SST and 352 PVALB neurons with
    electrophysiology. Its own metadata table gives 67, 111, 156 and 370 for the rows with Has_ephys
    under the revised subclasses, and 675 cells with a rheobase here split 63, 99, 155 and 358, so
    the selection behind the paper's counts is not documented.
- kind: other
  about: paper
  statement: The paper's own microglial calls (condition2 of the metadata table) call 0.418 of acute
    and 0.385 of culture cells microglial. The Results say the signature was observed in a subset of
    acute neurons "although the effect was less pronounced"; by the fraction of cells it is not less
    frequent in acute cells, while the mean expression of the 269 signature genes in the called cells
    is lower (3.8 against 5.9).
