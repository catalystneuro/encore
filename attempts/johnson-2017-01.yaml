- claim: patient-factors-no-effect
  outcome: reproduced
  notebook: reproduce_johnson_2017.ipynb
  output: claim:patient-factors-no-effect
  notes: In the repeated-measures ANCOVA (14 patients, 11 between-subject terms as Table S2 lists them,
    factors coded +-1, Type III, sphericity assumed) no term has p < 0.05; the smallest is gender, F(1,2)
    = 7.96, p = 0.106, and the paper's bound is p > 0.14. Individual F values differ from Table S2 (age
    7.27 against 4.38, gender 7.96 against 5.33, IQ 6.40 against 2.56). Coding the lesioned hemifield
    as in Table S1 or as left/right by lesion side (coding B) changes only the hemifield terms, none significant
    under either.
  deviations:
  - The ANCOVA is computed as SPSS GLM does it (Type III, effect-coded factors, raw covariates), reimplemented
    with least squares; the paper ran it in SPSS 20. Etiology is coded stroke against tumour resection,
    as the claims file says (one degree of freedom in Table S2).
  - The analysis runs in Python, not MATLAB and FieldTrip (release 20151205); mtmconvol, mtmfft, the FIR
    low-pass, the cluster test (maxsum, minnbchan 2, correcttail prob) and the models are reimplemented
    from FieldTrip's code at commit b3909bfecc5273652756ed2e41f84e9195f96186 and the paper's scripts.
