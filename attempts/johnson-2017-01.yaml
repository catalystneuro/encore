- claim: accuracy-patients-impaired
  outcome: partially_reproduced
  notebook: reproduce_johnson_2017.ipynb
  output: claim:accuracy-patients-impaired
  measured:
  - 0.952
  - 0.872
  - 11.68
  notes: 'Mean accuracy is 0.952 +- 0.031 in controls and 0.872 +- 0.099 in patients (subject accuracy
    over all trials, or the mean of six cells; identical). In the group-only linear mixed model (204 cells,
    random intercept per subject) the group effect is F(1,202) = 11.68, p = 7.6e-4, patients lower: below
    the Bonferroni level 0.0071 but not below 7e-5. The binomial logit reading gives F(1,202) = 25.83,
    p = 8.5e-7, which meets the bound. F is outside 16.77 +- 1.68 in both. The full model''s group effect
    is F(1,196) = 0.22, p = 0.64 (linear, condition as a number; the paper''s 4.70, p = 0.03), and the
    full binomial model did not converge. Cohen''s d on subject accuracies 1.18 (paper 1.47).'
  deviations:
  - The Results call the model logit, the Methods linear; the readings give different outcomes (p bound
    met only by the logit model), and the Methods' linear model is adopted, as for accuracy-no-hemifield-condition-effect.
    Both are shown.
  - Linear model fitted with statsmodels MixedLM (REML); binomial model by maximum likelihood with 30-point
    Gauss-Hermite quadrature; F = (beta/se)^2 with the residual degrees of freedom, as fitglme reports.
  - The analysis runs in Python, not MATLAB and FieldTrip (release 20151205); mtmconvol, mtmfft, the FIR
    low-pass, the cluster test (maxsum, minnbchan 2, correcttail prob) and the models are reimplemented
    from FieldTrip's code at commit b3909bfecc5273652756ed2e41f84e9195f96186 and the paper's scripts.
  assumed: true
