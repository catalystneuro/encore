- claim: psi-deltatheta-bottomup-encoding
  outcome: not_reproduced
  notebook: reproduce_johnson_2017.ipynb
  output: claim:psi-deltatheta-bottomup-encoding
  notes: No reading gives the PFC (AF7-F5-F7-FC5-FT7, which is also the power-lowtheta cluster) to parieto-occipital
    delta-theta Z at -9 or below within 100 ms of 400 ms in both groups. Trialwise, group means at 300
    to 500 ms stay positive (minima 4.37 to 8.63); Nolte, -0.21 to 0.06; literal code, controls 7.63 and
    12.27, patients -6.24 and -6.64. At most 57% of subjects in a group reach -9 at some point there (literal,
    patients).
  deviations:
  - Assumption, PSI. The Methods compute PSI from the cross-spectral density (Nolte et al. 2008); psianalysis.m
    averages per-trial phase slopes, Z scores them on a null from the frequency-shuffled trial-mean coherency,
    and multiplies the Fourier coefficients without the complex conjugate, so that its normalised cross-spectrum
    depends on channel B's phase alone, up to sign. The adopted reading follows the code's structure with
    the conjugate (trialwise); Nolte's PSI of the trial-averaged coherency and the literal code are shown.
  - Window edges. Under FieldTrip's rule no delta-theta PSI exists in any segment (the 2 Hz window is
    1.5 s), so the padded windows are used; for alpha-beta the fit reading is shown where values exist.
  - The analysis runs in Python, not MATLAB and FieldTrip (release 20151205); mtmconvol, mtmfft, the FIR
    low-pass, the cluster test (maxsum, minnbchan 2, correcttail prob) and the models are reimplemented
    from FieldTrip's code at commit b3909bfecc5273652756ed2e41f84e9195f96186 and the paper's scripts.
