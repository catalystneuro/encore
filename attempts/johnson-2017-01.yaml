- claim: power-anterior-theta-controls
  outcome: reproduced
  notebook: reproduce_johnson_2017.ipynb
  output: claim:power-anterior-theta-controls
  measured: 3.74
  notes: With windows running into the zero padding, the controls' 2 to 7 Hz Z over AF7-F5-F7-FC5-FT7
    (both hemifields pooled, r = trials of the hemifield) has a group mean of 2.2 at 0 to 0.4 s and 1.8
    later in encoding-maintenance, exceeds 3.29 at 50% of processing time points and reaches its maximum,
    3.74, at 0.53 s of processing; per hemifield 3.81 and 3.69. With r = all correct trials the maximum
    is 5.32. At most 55% of controls exceed 3.29 at any processing time point, so reading b of O7 (most
    subjects) holds only narrowly. Under FieldTrip's window rule the baseline has values only from 7 Hz
    and the maximum is 0.81 to 1.36.
  deviations:
  - Assumption, window edges. The deposited segments have no buffers, and FieldTrip's mtmconvol returns
    NaN wherever a 3/f window leaves the segment, so below 7 Hz no baseline value exists and 2 to 6 Hz
    power cannot be Z scored. The values over the zero padding the Methods name ("zero-padded to 7,500
    ms") are kept; this is the only reading under which the 2 to 7 Hz result exists. Both readings are
    shown.
  - The bootstrap of zbaseline.m (1000 draws of r baseline values) is replaced by its expectation, mean
    and sd / sqrt(r) * sqrt((N - r) / (N - 1)).
  - The analysis runs in Python, not MATLAB and FieldTrip (release 20151205); mtmconvol, mtmfft, the FIR
    low-pass, the cluster test (maxsum, minnbchan 2, correcttail prob) and the models are reimplemented
    from FieldTrip's code at commit b3909bfecc5273652756ed2e41f84e9195f96186 and the paper's scripts.
  assumed: true
