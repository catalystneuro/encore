findings:
- kind: format_error
  statement: In data_derived.mat the proc (active processing) segment holds the same trials as the pretrial
    and encmain segments but in another order, in all 34 subjects; its trialinfo is reordered with it.
    Nothing in the descriptor says so.
- kind: code_mismatch
  statement: erp_compute.m and tfr_compute.m select the processing segment's correct trials and hemifields
    with indices taken from encmain.trialinfo, so, given the reordering, they average processing trials
    of the wrong accuracy and hemifield. With the code's selection the processing ERP gives a group main
    effect (p = 0.036) that the matched trials do not (p = 0.636).
- kind: code_mismatch
  statement: psianalysis.m computes the cross-spectrum as the product of the two channels' Fourier coefficients
    without a complex conjugate (in both deposited versions). Its normalised cross-spectrum then equals
    plus or minus exp(2i phase of channel B), independent of channel A except for its sign, which is not
    the phase slope index of Nolte et al. (2008) that the Methods cite. This literal code reproduces the
    paper's alpha-beta PSI pattern (Z about -23 throughout in both groups).
- kind: methods_unavailable
  statement: Question for the authors. The deposited segments are 500, 1500 and 900 ms long with no buffers,
    so FieldTrip's mtmconvol with 3/f windows (tfr_compute.m, psi_compute.m) returns no value where a
    window leaves the segment, no baseline power below 7 Hz, no 3 to 4 Hz power at all in processing,
    and no delta-theta PSI in any segment. Were the analyses run on longer segments (the Methods mention
    1000 ms buffers at epoching), or were windows allowed to run into the zero padding? This attempt assumed
    the latter.
- kind: metadata_error
  statement: The descriptor says trialinfo column 3 of data_derived.mat is 1 intact and 2 lesioned visual
    hemifield, but it equals the trial table's column C (1 left, 2 right) in every trial of every subject,
    for left- and right-lesioned patients alike. The docs summary file (whose patient values are Table
    S1's) gives the patients' lesioned-hemifield accuracy as that of trial-table hemifield 1 in all 9
    single-block patients, left- and right-lesioned, which contradicts the paper's note that the lesioned
    hemifield is the right one for left-lesioned patients. Early visual lateralisation (N1, 150 to 220
    ms) is positive in 6 of 7 left-lesioned and 2 of 7 right-lesioned patients, which hints that the column
    is left/right. The ERP and baseline results reproduce under the descriptor's coding and not under
    the left/right one.
- kind: metadata_insufficient
  statement: Which 10 controls were swapped across the midline is not recorded; in the docs summary file
    10 controls have their 'lesion' accuracy equal to hemifield 1 and 10 to hemifield 2 (with ties), which
    may encode it, but no file says so.
- kind: metadata_insufficient
  statement: Six subjects (ctrl08, pfc03, pfc10 to pfc13) were recorded in two blocks with two trial tables
    whose trial numbers overlap (for example pfc03 numbers 21 to 120 in one and 2 to 240 in the other;
    ctrl08's first table has 240 rows of which 117 are empty). Derived trials can be linked to a table
    row only by trial number together with response time (6369 of 6369 linked this way). For 4 of these
    patients the docs summary and Table S1 accuracies do not match the two tables (differences up to 0.098).
- kind: format_error
  statement: 'The channel order of data_derived.mat differs between subjects: in 13 subjects an interpolated
    channel is moved to the end of the label list. Analyses that index channels by position, across subjects,
    mix channels; the deposited scripts select channels by label for the hemisphere index but grand-average
    the other data by position.'
- kind: metadata_error
  statement: The pretrial segment's fsample field reads 255.64 Hz in 33 subjects (256 in pfc11), though
    its time axis (129 samples over 0 to 0.5 s) and the other segments are at 256 Hz. The descriptor's
    summary gives 6 male patients; the docs summary file and the paper give 5.
- kind: other
  statement: The per-seed PSI cluster test of psi_stat_group.m tests each of the 64 seed channels at a
    cluster level of 0.05 with no correction across seeds; on alpha-beta PSI, which the paper reports
    as unaffected by group, it yields significant clusters in three of four tests here.
- kind: other
  statement: 'Whether the segments share the clock of the trial tables could not be established from the
    data: the posterior ERP, taken from its first 50 ms, departs from zero only at 656 ms of the encoding-maintenance
    segment (threshold from a sign-flip null), with no clear visual response to the stimuli at 0 and 200
    ms; the processing segment has no event inside it to check against. That the ERP and baseline clusters
    match the paper''s channels and p values is consistent with the alignment.'
