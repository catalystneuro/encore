findings:
- kind: metadata_error
  statement: The dandiset description says each file holds spike trains of all 10,073 neurons. The
    units tables hold only the cells that fired, 2,917 to 4,480 M1 cells per file in set
    sM1_12-12-2023 and 2,765 to 4,714 in the others, and input generators that did not fire are
    missing too. The size of each population is not stated and can be recovered only from the gid
    blocks in the unit names (24 gids between blocks are never seen).
- kind: metadata_error
  statement: The dandiset description says each file holds membrane potentials of 400 PT5B
    neurons. The four files of the paper's set, sM1_12-12-2023, hold 20 each (gids 5201 to 6502);
    the other twelve hold 400 (gids 5130 to 5529).
- kind: other
  statement: In the paper's set the PT5B membrane potentials do not belong to the run whose spikes
    are stored. Their 0 mV crossings match the same gid's unit spikes in the first 0.5 s (94.8% to
    100%) but only 1.5% to 5.6% of unit spikes in 2.0 to 4.3 s, while spike counts stay similar. In
    set sM1-04-22-2024 the potentials match the spikes throughout. The potentials of the paper's
    set seem to come from a run that diverged from the stored one.
- kind: other
  statement: sub-001/sub-001.nwb is the same blob as sub-001/sub-001_ses-sM1-04-22-2024-01.nwb, so
    one simulation is deposited twice under two names.
- kind: metadata_insufficient
  statement: Each file holds one LFP trace, "Segment 0 LFP 0", with no electrode position, where
    the model records 11 electrodes at 200 to 1200 um depth. Which electrode it is cannot be told
    from the files, and the mean over electrodes cannot be computed.
- kind: metadata_error
  statement: The files name the bioRxiv preprint as their related publication, the dandiset lists
    no related resource for the published paper, and the archive's summary gives "spike sorting
    technique" as the measurement technique of a simulation, with "Units" as the only variable
    measured though the files hold LFP and membrane potentials.
- kind: data_missing
  statement: The single-cell current-injection simulations of the control and parkinsonian PT5B
    models behind the 64% decrease in excitability (Supplementary Fig. 1) are not in the dandiset.
- kind: methods_unavailable
  statement: Question for the authors. Over which cells is a population's mean rate taken? The
    paper's IT rates match exactly when the cells are those that fired at least once in the 4.3 s
    simulation, with rates over the last 2.3 s (IT2 1.203 +/- 1.649 at control rest against 1.2 +/-
    1.6), and not when all cells or only cells active in the last 2.3 s are counted; nine IT
    outcomes here rest on that reading. Which test gave the rate p-values? Under that reading the
    Welch t-test meets every printed bound except for IT4 at rest (two parkinsonian cells, p =
    0.31), while paired tests do not for IT2.
- kind: methods_unavailable
  statement: Question for the authors. Which PT5B cells, and what definition, gave 1% to 3% of
    spikes coincident within 1 ms and the unitary-event durations of Figs. 4 and 7? Over all 1,435
    PT5B cells (17 to 42 spikes per ms) nearly every spike has another PT5B spike within 1 ms, two
    or more cells fire in 95% to 100% of 1 ms bins, and a joint-surprise test against rate-matched
    Poisson cells finds no significant 100 ms window.
- kind: methods_unavailable
  statement: Question for the authors. How were LFP bursts (Figs. 3 and 6) defined, which
    spectrogram parameters and electrode were used, and was the PT5B spike count histogram smoothed
    before the duty cycle was measured? Unsmoothed 2 ms histograms cross half-height every 10 ms,
    and a half-height rule on band power gives burst rates of 1 to 3 Hz where the paper reports 5
    Hz and 10 to 20 Hz.
- kind: methods_unavailable
  statement: Question for the authors. Does "highest spike rate of any neuron population" cover
    interneurons? PV5A (22.5 to 42.1 spikes/s by all cells) fires faster than PT5B (11.7 to 29.7)
    in control rest and both parkinsonian states; among excitatory types PT5B is highest.
- kind: methods_unavailable
  statement: Question for the authors. How were subthreshold membrane-potential oscillations
    detected, and over which cells is the 57.4% taken? The paper's set holds 20 PT5B potentials per
    file, and 57.4% of 20 is not a whole number.
- kind: paper_inconsistency
  statement: The Results report a significant increase in PT5B rate from control to parkinsonian in
    the activated state (p < 0.001), while the Discussion says there was no significant change in
    PT5B population firing rate in the activated state. On the data, counting all PT5B cells, three
    tests give p below 1e-06 and the Mann-Whitney test 0.0052.
