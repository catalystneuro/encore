- claim: control-coincident-spikes
  outcome: not_reproduced
  notebook: reproduce_doherty_2025.ipynb
  output: claim:control-coincident-spikes
  measured:
  - 100.0
  - 100.0
  notes: Under all six combinations 99.99% to 100% of PT5B spikes have a spike of another PT5B cell
    within 1 ms, against 1% and 3%. The 1,435 PT5B cells fire 17.0 (rest) and 42.3 (activated)
    spikes per ms together, so with the paper's definition over the whole population nearly every
    spike is coincident. Among the 20 cells with recorded potentials (a variant) the share is 24.8%
    to 72.8%. The paper's 1% to 3% must come from a smaller set of cells or another definition,
    which it does not state (findings).
- claim: fig4-control-unitary-events
  outcome: not_reproduced
  notebook: reproduce_doherty_2025.ipynb
  output: claim:fig4-control-unitary-events
  notes: Under all eight combinations no 100 ms window is significant (0 of 3,901 slid windows, 0
    of 40 non-overlapping), so the significant duration is 0 s at rest and activated, against 0.7
    and 1.1 s, and no periodicity can be measured. Two or more PT5B cells fire in 96.5% to 100% of
    1 ms bins, so the observed and expected coincidence counts are both about 100 per window. The
    method of the claims file cannot find excess synchrony over the whole PT5B population; the
    paper does not say which cells it analysed (findings).
