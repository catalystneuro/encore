  - 18.17
  notes: Under R1, 11.69 +/- 9.40 spikes/s at rest and 26.76 +/- 18.17 activated, all within
    tolerance; T1 to T4 give p from 2.7e-116 down to 5.4e-147 (Mann-Whitney 2.2e-99). Under R2 the
