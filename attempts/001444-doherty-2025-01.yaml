- claim: control-duty-cycle
  outcome: not_reproduced
  notebook: reproduce_doherty_2025.ipynb
  output: claim:control-duty-cycle
  measured:
  - 37.53
  - 44.99
  notes: Under none of the eight combinations are both values within tolerance. Measured is the
    first combination (global half-height, 2.0 to 2.25 s, mean of periods). The closest is global
    half-height in 2.0 to 2.25 s with the total summary, 27.88% at rest (tolerance from 27.9) and
