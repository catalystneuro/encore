- claim: edf1h-ring
  outcome: reproduced
  notebook: reproduce_skromne_carrasco_2026.ipynb
  output: claim:edf1h-ring
  notes: With z-scored activity the angle around the Isomap embedding is correlated with head
    direction in all five example sessions (circular-circular correlation, |r| 0.19 to 0.81, p below
    0.05; 1222 to 1300 bins, 32 to 82 cells). With division by the maximum, 4 of 5 sessions keep
    fewer than 51 bins above the 0.1 threshold, too few for 50 neighbours; the fifth gives r -0.63.
    Mouse 1's ring is weak (r -0.19).
  deviations:
  - The test and its counts are the claims file's, not the paper's (which judges the ring by eye).
  - The example session per mouse is the one with the most ROIs whose split-half correlation exceeds
    0.8, a standard choice; the paper does not name its sessions.
  - Normalization is read as z-scoring; division by the maximum leaves too few bins with the
    paper's 0.1 threshold.
- claim: fig1f-example-stable
  outcome: reproduced
  notebook: reproduce_skromne_carrasco_2026.ipynb
  output: claim:fig1f-example-stable
  assumed: true
  measured:
  - 17.01
  - 4.63
  notes: Under the main reading, mouse 2 has 18 compared sessions, V 17.01, median absolute
    deviation 4.6 degrees and two-sided p below 0.001 (reading b). Mouse 4, which Extended Data
    Fig. 1g names as the animal of Fig. 1 (reading a), gives V 14.29 and 7.2 degrees, outside
    tolerance. With raw HDI no mouse with 18 compared sessions matches (mouse 2 then has 19, V 18.35,
    5.3 degrees). The V of mouse 2 also matches the second value of Extended Data Fig. 4b (17.1),
    so the Fig. 1 example appears to be mouse 2.
  deviations:
  - Assumed HDI on the smoothed tuning curve with the 12 degree kernel, as the main reading for
    every HD cell claim. The stored tuning curves of the files match a 4-bin (12 degree) kernel, and
    smoothed HDI gives the paper's numbers of compared sessions (18 here; 84 pooled in Fig. 1g
    against 85 here; 16, 18, 16, 16 in Extended Data Fig. 4a against 16, 18, 16, 17) and of offset
    values (25,901 against 25,441), where raw HDI gives 92 sessions and 92,537 values.
  - Detected in at least six sessions is read as registered by CellReg in at least six sessions,
    and the average HDI is over the registered sessions that pass the split-half rule.
