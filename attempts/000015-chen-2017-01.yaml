findings:
- kind: other
  statement: Every one of the 105 image planes is deposited twice, as two files with different names,
    identifiers and digests (for example an041_2014-08-23_21 and an041_2014-08-23_43) whose contents
    are otherwise identical. The archive's file count (210) is twice the number of recordings.
- kind: metadata_error
  statement: ImagingPlane.location is "ALM" in every file, including the 47 planes whose
    experiment_description says left_vm1 (the paper's MM). The area per plane is given only by
    experiment_description, and with it the counts match the paper (8,837 ALM and 6,594 MM ROIs).
- kind: metadata_insufficient
  statement: The files hold no plane depth, no stereotactic coordinates of the planes or cells, and
    no identifier of the imaging location within a mouse. Four of the paper's findings rest on depth
    and cannot be tested, nor can the depth parts of three others; the 12 imaging locations cannot
    be counted.
- kind: data_missing
  statement: The dandiset holds only the two-photon imaging. The wide-field imaging, the whisker
    tracking, the lick times, the photoinhibition behaviour and the silicon probe recordings (567
    units) are not in it. The paper's Key Resources Table names CRCNS doi 10.6080/K0S180F9 for its
    imaging and electrophysiology, and that DOI resolves to a placeholder record that says the data
    are not yet available.
- kind: metadata_insufficient
  statement: The ROI table's `included` column ("whether to include this roi into later analyses")
    marks 8,655 of 15,431 ROIs, without saying what excluded the others; the paper's counts use all
    15,431.
- kind: metadata_insufficient
  statement: The trial table's start_time is 0.623 s before the sample event in every trial, while
    the paper's trial start is pole movement onset (the sample event, 4.2 s before the go cue). The
    offset is not described. Early-lick trials have instruction and outcome "non-performing", so
    their pole position is not recorded.
- kind: other
  statement: With the stored ROI and neuropil traces and the paper's r = 0.7, the baseline F0 is zero
    or negative on 0.26% of ROI-trials, in 1,262 ROIs, and dF/F reaches thousands; the mean dF/F of MM
    is dominated by these ROIs. The paper does not say how they were treated (a reader confirmed
    this in answer to a question).
