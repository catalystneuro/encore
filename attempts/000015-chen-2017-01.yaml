  notebook: reproduce_chen_2017.ipynb
  output: claim:imaging-sample
  notes: Six mice and 105 distinct planes, as stated. Reading (a), the four analysed trial types,
    gives 92.15 +- 25.98 trials per plane at 73.83% +- 9.03% correct, both within tolerance. Reading
    (b), all trials, gives 107.37 trials, within tolerance, at 63.89% correct, just outside. Planes
