- claim: fig4c-outcome-after-lick
  outcome: not_reproduced
  notebook: reproduce_chen_2017.ipynb
  output: claim:fig4c-outcome-after-lick
  notes: Of 9,431 ROIs purely outcome selective in any bin (T1), 41.3% have their first such bin after
