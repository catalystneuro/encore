      rule run, and other rules, for example the three largest peaks or matching to the paper''s latency windows,
      were not tried. Problem 5: latencies_at reading (b) takes the first current at or above the largest first-pass
      threshold, where all three peaks need not pass.'
    response: Added three peak rules (three largest, the triple inside the paper's ranges, first three of the inverted
