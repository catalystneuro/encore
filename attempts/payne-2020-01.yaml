outcomes:
- claim: anes-ecap-recorded
  outcome: reproduced
  assumed: true
  notebook: reproduce_payne_2020.ipynb
  output: claim:anes-ecap-recorded
  measured: 5
  notes: In all five acute rats (12-005, 12-006, 12-007, 12-008, 12-010) at least one detected
    positive peak after the artefact end reaches 0.05 uV in both recordings at some current and
    is below 0.05 uV at the lowest current, under both artefact-end readings (5 of 5 each). The
    top-current amplitudes of these peaks range from 0.07 to 15.7 uV. The RMS of the 1.2 to 6 ms
    window rises with current in every acute file (Spearman rho 0.84 to 0.998).
  deviations:
  - The acute files have no 0 mA traces; the lowest current (0.0175 mA in four rats, 0.107 mA in
    12-007) stands for 0 mA.
  - The peaks come from a detection rule the paper does not give (assumption; see
    anes-ecap-latencies).
- claim: anes-ecap-latencies
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_payne_2020.ipynb
  output: claim:anes-ecap-latencies
  measured:
  - 1.60
  - 2.50
  - 4.19
  notes: None of the 72 combinations of readings (central value, time origin, stimulus level,
    artefact end, detection margin 2, 3 or 5 noise SD) puts all three central latencies within
    10%. Main reading (artefact end 1 ms, margin 3 SD, highest current, onset origin, median over
    4 rats) gives 1.60, 2.50 and 4.19 ms against 1.80, 3.48 and 3.77; the closest combination
    (mean over 5 rats, margin 2 SD) gives 1.61, 2.98 and 4.18 ms, at worst 14.5% off. 12-008 has
    two peaks under the main reading. Per rat, P2 (2.42 to 3.25 ms) and P3 (3.84 to 4.63 ms) lie
    within the paper's ranges widened by 10% in 4 of 4 rats, P1 (1.12 to 2.33 ms) in 2 of 4. The
    question for the paper's authors is under the methods_unavailable finding on peak detection.
  deviations:
  - Assumption. The paper does not say how P1 to P3 were identified. P1 to P3 are taken as the
    first three positive local maxima after the artefact end, in the mean of the two recordings
    at the highest current, with prominence at least 3 noise SD and amplitude at least 0.05 uV;
    margins of 2 and 5 SD are also run. This follows the Results' description of three positive
    peaks distinguished by latency (Results, Electrically Evoked Compound Action Potentials,
    paragraph 1); the margin is a standard detection choice.
  - The traces start 0.6 ms after pulse onset, so the baseline is the median from 7 to 8.6 ms,
    not a pre-stimulus segment (assumption).
  - The acute files reach 1.6 mA in logarithmic steps, where the Methods give 0 to 2 mA in
    0.1 mA steps; the highest-current reading uses 1.6 mA.
  - Recordings at 200 kHz with a 500 to 3000 Hz filter, where the Methods give 100 kHz and 300
    to 5000 Hz; the data are used as they are.
- claim: anes-conduction-velocity
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_payne_2020.ipynb
  output: claim:anes-conduction-velocity
  measured:
  - 1.82
  - 1.14
  - 0.68
  notes: None of 216 combinations (latency readings by distance 2.85, 2.10 or 3.60 mm by median
    or mean) puts all three velocities within 10% of 1.60, 0.82 and 0.78 m/s. With 2.85 mm and
    the main latency reading the medians are 1.82, 1.14 and 0.68 m/s. The part of the statement
    on fibre classes holds; P1 lies in the A-fibre range (1.6 to 21 m/s) and P2 and P3 in the
    C-fibre range (0.5 to 1.6 m/s) given in the Discussion.
  deviations:
  - Rests on the peak detection assumed for anes-ecap-latencies.
- claim: anes-threshold-order
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_payne_2020.ipynb
  output: claim:anes-threshold-order
  measured:
  - 62
  - 221
  - 280
  notes: No combination of readings (0 of 96; amplitude above baseline or above the preceding
    trough, lowest passing current or interpolated, first passing or sustained, median or mean,
    artefact end, margin) gives rising thresholds with Friedman P below 0.05, and none puts the
    three values within 10% of 377, 648 and 930 uA. Main reading, medians over four rats 62, 221
    and 280 uA, rising, Friedman chi2 = 4.5, P = 0.105. Per rat (uA) 12-005 648, 541, 1335;
    12-006 18, 128, 183; 12-007 107, 315, 377; 12-010 18, 107, 74; 12-008 has no third peak. The
    0.05 uV level lies below three noise SDs in all five rats (noise SD 0.024 to 0.234 uV), so
    several thresholds equal the lowest current. With the pass level raised to three noise SDs
    (variant) thresholds rise from P1 to P3 in 12-005, 12-006 and 12-010 but not in 12-007 (107,
    776 and 452 uA).
  deviations:
  - Rests on the peak detection assumed for anes-ecap-latencies.
  - The files' currents are logarithmic steps (0.074 to 1.6 mA, and 0.0175 mA), so reading (a)
    of the step is the lowest passing file current, not a 0.1 mA step.
  - A peak's amplitude at a lower current is that of the local maximum nearest its latency
    within 0.3 ms (a choice; the paper gives no window).
  - A further reading of threshold, the lowest current from which every higher current passes,
    is shown; it does not change the outcome.
- claim: fig2c-p3-above-p1
  outcome: reproduced
  assumed: true
  notebook: reproduce_payne_2020.ipynb
  output: claim:fig2c-p3-above-p1
  measured: 0.034
  notes: Main threshold reading, Dunn's test on the Friedman mean ranks, P3 above P1, z = 2.12,
    unadjusted P = 0.034 (n = 4 rats); Bonferroni-adjusted over three pairs P = 0.10. Over the 48
    combinations of readings, 4 give P3 higher with unadjusted P below 0.05 and none with the
    adjusted P. The Friedman main effect in the same reading is P = 0.105, so the post hoc
    difference comes without a significant main effect. The criterion asks for P below 0.05
    under one reading, and the outcome rests on the unadjusted reading and on the assumed peak
    detection; the question of the adjustment is put to the paper's authors (finding below).
  deviations:
  - Rests on the peak detection assumed for anes-ecap-latencies; n = 4 rats where the paper has 5.
  - Assumption. The unadjusted reading of Dunn's P is the one that matches; the Statistics
    section names Dunn's test without saying whether its P is adjusted.
