findings:
- kind: data_missing
  about: data
  statement: The dataset holds none of the histology (ATF3, CGRP, synaptophysin), c-Fos counts, post-mortem notes
    or behavioural observations behind Figures 4 and 5 and the safety claims. files/README.txt lists summary derived
    data from c-Fos activation mapping, which no file holds. Stimulation trains are deposited for four rats (9 trains),
    where the paper stimulated eight, and no file records whether urine was released after a train; the 8-week rats
    have no stimulation. Twelve of the claims cannot be tested.
- kind: other
  about: data
  statement: The ECAP files are sampled at 200 kHz and carry a 500 to 3000 Hz filter, where the Methods give 100
    kHz and 300 to 5000 Hz. The acute files step the current on a logarithmic scale up to 1.6 mA (CL 80 to 250,
    and CL0 at 0.0175 mA), not 0 to 2 mA in 0.1 mA steps, and have no 0 mA trace. Several files stimulate E3-E4
    and record E1-E2 (12-008, 12-050, 12-053, 12-056) or stimulate E2 to E1 (12-006, 12-007), where the Methods
    give stimulation on E1-E2.
- kind: metadata_insufficient
  about: data
  statement: The seven awake ECAP recordings are seven subject identifiers (four at day 0, three at day 7) with
    nothing linking a day-7 recording to the rat recorded at day 0, so the week 0 to week 1 comparison of the paper
    (n = 4) cannot be made. The pool_id column of subjects.xlsx is empty. The Methods give three awake rats and
    the Results four.
- kind: other
  about: data
  statement: In the colonic recording of 15-758 the pressure rises by about 0.65 mmHg during the 10 s before each
    recorded stimulus time and returns to baseline at that time, over 33 trains, so the recorded times are 10 s
    (one train) after the response. The files do not say whether the times mark the end of each train. The colonic
    stimulation in all three files (1.114 mA, 200 us, 4 or 5 s; 0.541 mA, 25 us, 15 Hz, 10 s) differs from the Methods
    (1 mA, 100 us, 10 Hz).
- kind: other
  about: data
  statement: The derivative cystometry-dataset.xlsx and the /Voids tables of the same rats give different values
    for most cycles (peak pressure agrees within 0.5 mmHg in 4 of 27 cycles), and neither the files nor the manifests
    say how either was computed. The derivative, and the dataset's own R notebook output from it, do not give Table
    1's means (minimum pressure 11.74 against 10.3 mmHg; inter-void interval 6.66 against 7.6 min), though each
    lies within Table 1's CI, and it has HFPO frequencies for 7 of the 9 rats.
- kind: metadata_insufficient
  about: data
  statement: The manifests of the derivative, code, docs and protocol folders have no descriptions, and the columns
    of the /Voids group (for example ContractionDuration, RelaxationTimeConstant, PostBaselinePressure) and the
    CL scale of the ECAP stimuli are not defined. Some cystometry waves carry an AppliedOffset attribute with no
    description. Neither the ECAP files nor the ECAP schema give the amplifier gain (the Methods give 10^2) or define
    time zero, and the schema gives TimeUnits s where the files have ms.
- kind: other
  about: data
  statement: The dataset lists 29 subjects, where the paper reports 24 rats in all.
- kind: other
  about: data
  statement: The per-array impedance file reproduces the paper's impedance means, spreads and ranges exactly, from
    12, 12 and 10 arrays; the paper describes them as 38 electrodes in 10 arrays, and its spreads are SEMs over
    arrays. Per-electrode impedances are deposited for 8 arrays only.
- kind: methods_unavailable
  about: paper
  statement: The paper does not say how the three ECAP peaks were identified in each recording (which local maxima
    count, from what time after the artefact, at which current), nor where latency is measured from or at which
    current. Question for the authors, how were P1, P2 and P3 picked, and at which stimulus level and time origin
    were their latencies read? This attempt ran four rules (first three peaks, three largest, the triple inside
    the paper's ranges, first three of the inverted traces); under the first, the anaesthetised medians are 1.60,
    2.50 and 4.19 ms, and no rule gives the printed latencies.
- kind: methods_unavailable
  about: paper
  statement: The ECAP threshold is defined as a response of at least 0.05 uV in both recordings, which lies below
    three noise SDs in most deposited files (noise SD 0.02 to 0.7 uV), and the paper does not say how the response
    amplitude was measured. Question for the authors, was the amplitude measured from baseline or peak to trough,
    was the 0.05 uV level applied to the deposited traces in their units, and is Dunn's P (0.034) adjusted for multiple
    comparisons?
- kind: methods_unavailable
  about: paper
  statement: The paper does not define the colonic pressure increase or a response, and the deposited trains differ
    from the Methods. Question for the authors, which rat and which 13 responses give 2.6 mmHg, and how was the
    increase measured?
