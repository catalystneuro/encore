- claim: table1-minimum-pressure
  outcome: reproduced
  notebook: reproduce_payne_2020.ipynb
  output: claim:table1-minimum-pressure
  measured: 11.74
  notes: From the derivative cystometry-dataset.xlsx, the mean of 9 rat means is 11.74 mmHg (95% CI 8.47 to 15.01),
    inside the printed CI (7.4 to 13.2); pooled over 27 cycles also 11.74. It differs from the printed 10.3 by 1.44
    mmHg. The dataset's own R notebook output gives the same 11.741. Recomputed from the pressure traces (the authors'
    /Voids onsets, rat means), the lowest 1 s mean pressure before the next void gives 6.26 mmHg (outside the CI)
    and the lowest within 60 s of the peak 8.00 mmHg (inside).
  deviations:
  - Tested on the authors' derivative table, not recomputed from the pressure traces; its values differ from the
    primary /Voids tables of the same rats.
  - The recomputation from the traces is a check; its definitions (1 s mean pressure, the onsets of /Voids, a 10%
    return margin, HFPOs as a 3 to 30 Hz band reaching three times its pre-onset level) are choices made here.
