inputs:
- what: The Wiedmann et al. (2020) means and 95% CIs for relative threshold pressure, relative
    peak pressure, contraction duration and inter-void interval, as printed in Table 1 of the
    paper and quoted in the claim's criterion; used only by table1-comparable-to-published.
