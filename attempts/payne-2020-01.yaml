outcomes:
- claim: anes-ecap-recorded
  outcome: reproduced
  assumed: true
  notebook: reproduce_payne_2020.ipynb
  output: claim:anes-ecap-recorded
  measured: 5
  notes: Under the main peak rule, in all five acute rats (12-005, 12-006, 12-007, 12-008, 12-010) at least one
    detected positive peak after the artefact end reaches 0.05 uV in both recordings at some current and is below
    0.05 uV at the lowest current, under both artefact-end readings (5 of 5 each). The largest-peaks and inverted
    rules also give 5 of 5; the window rule gives 2 of 5, as it finds a triple inside the paper's ranges in two
    rats only. The top-current amplitudes of these peaks range from 0.07 to 15.7 uV. The RMS of the 1.2 to 6 ms
    window rises with current in every acute file (Spearman rho 0.84 to 0.998).
  deviations:
  - Assumption. The acute files have no 0 mA traces; the lowest current (0.0175 mA in four rats, 0.107 mA in 12-007)
    stands for 0 mA, as the nearest the data allow.
  - The peaks come from identification rules the paper does not give (assumption; see anes-ecap-latencies).
- claim: anes-ecap-latencies
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_payne_2020.ipynb
  output: claim:anes-ecap-latencies
  measured:
  - 1.6
  - 2.5
  - 4.19
  notes: None of the 288 combinations of readings (central value, time origin, stimulus level, artefact end, detection
    margin 2, 3 or 5 noise SD, and four peak rules) puts all three central latencies within 10%. Main reading (first-three
    rule, artefact end 1 ms, margin 3 SD, highest current, onset origin, median over 4 rats) gives 1.60, 2.50 and
    4.19 ms against 1.80, 3.48 and 3.77; the closest combination over all rules (three largest peaks, margin 5 SD,
    mean over 3 rats) gives 1.79, 3.24 and 4.22 ms, 11.9% off at worst, and the closest under the main rule 1.61,
    2.98 and 4.18 ms (14.5%). 12-008 has two peaks under the main reading. Per rat, P2 (2.42 to 3.25 ms) and P3
    (3.84 to 4.63 ms) lie within the paper's ranges widened by 10% in 4 of 4 rats, P1 (1.12 to 2.33 ms) in 2 of
    4. The outcome is the same under every peak rule. The question for the paper's authors is under the methods_unavailable
    finding on peak identification.
  deviations:
  - 'Assumption. The paper does not say how P1 to P3 were identified. P1 to P3 are assigned among the positive peaks
    above k noise SD (k = 2, 3, 5) after the artefact end at the highest current by four rules, all run: the first
    three in time (main rule), the three largest, the triple inside the paper''s P1 to P3 ranges widened by 10%
    with the largest summed amplitude, and the first three of the inverted traces. The main rule follows the Results''
    description of three positive peaks distinguished by latency (Results, Electrically Evoked Compound Action Potentials,
    paragraph 1); the margin is a standard detection choice. The window rule uses the paper''s own ranges.'
  - The traces start 0.6 ms after pulse onset, so the baseline is the median from 7 to 8.6 ms, not a pre-stimulus
    segment (assumption). Neither the files nor the deposited schema define time zero or a gain.
  - Stimulus-level reading (b) is the lowest current at which all three peaks pass in both recordings, and reading
    (c) the mean over currents at or above the P3 threshold.
  - The acute files reach 1.6 mA in logarithmic steps, where the Methods give 0 to 2 mA in 0.1 mA steps; the highest-current
    reading uses 1.6 mA.
  - Recordings at 200 kHz with a 500 to 3000 Hz filter, where the Methods give 100 kHz and 300 to 5000 Hz; the data
    are used as they are.
- claim: anes-conduction-velocity
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_payne_2020.ipynb
  output: claim:anes-conduction-velocity
  measured:
  - 1.82
  - 1.14
  - 0.68
  notes: None of 864 combinations (latency readings under four peak rules by distance 2.85, 2.10 or 3.60 mm by median
    or mean) puts all three velocities within 10% of 1.60, 0.82 and 0.78 m/s. With 2.85 mm and the main latency
    reading the medians are 1.82, 1.14 and 0.68 m/s; the closest combination (three largest peaks, margin 5 SD,
    mean over 3 rats) gives 1.57, 0.93 and 0.68 m/s, 13.1% off. The part of the statement on fibre classes holds
    under the main reading; P1 lies in the A-fibre range (1.6 to 21 m/s) and P2 and P3 in the C-fibre range (0.5
    to 1.6 m/s) given in the Discussion.
  deviations:
  - Rests on the peak identification assumed for anes-ecap-latencies.
- claim: anes-threshold-order
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_payne_2020.ipynb
  output: claim:anes-threshold-order
  measured:
  - 62
  - 221
  - 280
  notes: 'Under the criterion''s threshold (lowest passing current), no combination of readings under any of the
    four peak rules (0 of 192; amplitude above baseline or above the preceding trough, lowest passing current or
    interpolated, median or mean, artefact end, margin) gives rising thresholds with Friedman P below 0.05, and
    none puts the three values within 10% of 377, 648 and 930 uA. Main reading, medians over four rats 62, 221 and
    280 uA, rising, Friedman chi2 = 4.5, P = 0.105. Per rat (uA) 12-005 648, 541, 1335; 12-006 18, 128, 183; 12-007
    107, 315, 377; 12-010 18, 107, 74; 12-008 has no third peak. Twelve of 384 combinations meet the criterion,
    all under a further sustained reading (lowest current from which every higher current passes) that is not the
    criterion''s definition (largest-peaks rule with artefact end b and margin 3, Friedman P = 0.022 and 0.039;
    window rule with margin 2, P = 0.039); none is within tolerance. Band-passed noise alone passes the two-recording
    test in 24 to 28% of current steps at 0.05 uV SD and 63 to 77% at 0.2 to 0.7 uV SD (five seeds), and the noise
    SD of the files is 0.02 to 0.7 uV, so several thresholds equal the lowest current. Variants outside the criterion:
    with the pass level at three noise SDs the main rule gives medians 107, 498 and 691 uA, rising, Friedman chi2
    = 6.5, P = 0.039 (n = 4), outside tolerance; with 5 uV (the stored values read as carrying the 10^2 gain) at
    most one rat has three thresholds.'
  deviations:
  - Rests on the peak identification assumed for anes-ecap-latencies.
  - The files' currents are logarithmic steps (0.074 to 1.6 mA, and 0.0175 mA), so reading (a) of the step is the
    lowest passing file current, not a 0.1 mA step.
  - A peak's amplitude at a lower current is that of the local maximum nearest its latency within 0.3 ms (a choice;
    the paper gives no window).
  - A further reading of threshold, the lowest current from which every higher current passes, is shown; it is not
    the criterion's definition, and the only combinations that meet the criterion use it.
- claim: fig2c-p3-above-p1
  outcome: reproduced
  assumed: true
  notebook: reproduce_payne_2020.ipynb
  output: claim:fig2c-p3-above-p1
  measured: 0.034
  notes: Main threshold reading, Dunn's test on the Friedman mean ranks, P3 above P1, z = 2.12, unadjusted P = 0.034
    (n = 4 rats); Bonferroni-adjusted over three pairs P = 0.10. Of 48 readings per peak rule, P3 is higher with
    unadjusted P below 0.05 in 4 (first-three rule), 4 (largest), 8 (window) and 9 (inverted), and with the Bonferroni
    P in 0, 2, 4 and 0, these last all under the sustained reading. With all five rats in the test (margin 2 SD)
    the smallest unadjusted P is 0.082. The Friedman main effect in the main reading is P = 0.105, so the post hoc
    difference comes without a significant main effect; with the pass level at three noise SDs (variant) Friedman
    P = 0.039 and Dunn P = 0.013. The pass is narrow; it rests on the unadjusted reading, n = 4, and the assumed
    peak identification. The question of the adjustment is put to the paper's authors (finding below).
  deviations:
  - Rests on the peak identification assumed for anes-ecap-latencies; n = 4 rats where the paper has 5.
  - Assumption. The unadjusted reading of Dunn's P is the one that matches; the Statistics section names Dunn's
    test without saying whether its P is adjusted.
