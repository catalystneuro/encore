- claim: fig4b-3m-degs
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_chaunsali_2025.ipynb
  output: claim:fig4b-3m-degs
  measured:
  - 51
  - 141
  notes: 'Under the adopted reading (one model on all 16 samples, unshrunken) 51 genes are up and 141
    down. The down count is within 133 +/- 13.3 and more genes go down than up, but the up count is outside
    98 +/- 9.8. With one model on the 3 M samples (unshrunken) the counts are 98 and 137, both within
    tolerance, which would be reproduced. Shrunken fold changes give 91 and 45 (separate) and 39 and 37
    (joint), which meet neither the full nor the partial criterion. Question for the paper''s authors:
    which DESeq2 design gave Figure 4B, one model per age or one on all samples, and were the fold changes
    shrunken? The exact match of the separate unshrunken reading suggests that design, but an outcome
    cannot be chosen by its match.'
  deviations:
  - The counts are GEO GSE317499 (GSE317499_counts.csv.gz, read and checked against its SHA-256), not
    data in the dandiset; 4 mice per age and genotype, from GEO, as the paper does not give n.
  - DESeq2 1.44.0 in R is replaced by pydeseq2 0.5.4 (Python), with DESeq2's defaults (Cooks refit, independent
    filtering, Benjamini-Hochberg); its shrinkage is pydeseq2's apeglm-type prior. R cannot be pinned
