    session description, keywords, subject); acquisition, processing, analysis and stimulus are empty. The identifiers
    name the original image files of Figures 1, 3, 5 and S1 to S6 and S9, but no image, ROI, table or measurement
    is deposited, although the description says the dandiset includes immunohistochemical imaging data quantifying
    PNN integrity. All 22 IHC claims of the paper are blocked.
- kind: metadata_insufficient
  statement: The 175 behaviour videos are MP4 files outside NWB, named only by figure panel and trial number. They
    carry no subject, genotype, treatment, DPI or trial-type (Novel 1, Familiar, Novel 2; familiarization or test)
    label, several arenas share each video, and the counts do not match the paper's mice (for example 15 videos
    for the 16 mice of Figure 2B, 33 for the 26 of Figure 5E). The scored interaction and exploration times are
    not deposited. None of the 19 behaviour claims can be tested.
- kind: other
  statement: 'The object recognition videos are deposited four times, under Fig 2I, Fig 2J, Fig 2K and Sup Fig 7
    (byte-identical by SHA-256), and in each set Trial 6 and Trial 7 are the same file: 28 assets hold 6 distinct
    recordings.'
- kind: metadata_error
  statement: The description says the dandiset includes bulk RNA-sequencing data with associated metadata; it holds
    none, and the counts are in GEO GSE317499 only. The description also keeps a placeholder sentence naming GEO
    accession "GSEXXXXX" next to the one naming GSE317499.
- kind: identifier_missing
  statement: The NWB subject is a group label, not an animal (82 subject_ids for 481 files, up to 31 files sharing
    one, such as 5xFAD+_6M_Fig1), so slices cannot be grouped by mouse, which the paper's per-mouse tests (Figure
    5I) and five mice per group (Figure 1) need. Sex is U in 476 of 481 files, and session descriptions give the
    region as Unknown.
