  - claim: fig4fg-ecm-go-terms
    agrees: true
    outcome: blocked
    reason: 'Cell 27: 15 readings give not reproduced and 1 gives partially reproduced (0.048). The outcome rests on
      running the GO term-size limit as a reading, which extends the claims file, whose criterion lists only backgrounds
      (a) and (b). The choice is reasonable, since the paper names no enrichment tool, but the record should mark it
      assumed: true and say how marginal the deciding value is. That value comes from the pydeseq2 shrunken reading,
      which stands in for R''s apeglm and was never compared with R, and depends on the GO release; with R''s apeglm
      or another GO release it could fall above 0.05, and the outcome would become not_reproduced.'
    response: 'Outcome kept. The schema does not allow assumed true on a blocked outcome, so a deviation now says the
      term-size reading extends the claims file''s readings and that the outcome rests on it, and the notes say the same.
      Cell 27 now prints the deciding term''s margin: 6 of 224 DEGs, adjusted p 0.113 with one DEG fewer. A new cell
      runs the ECM test on GO releases 2024-01-17 and 2025-03-16. The deciding reading gives 0.046 and 0.052; with 2025-03-16
      all 16 readings give not reproduced, while 2024-01-17 gives the same split as the pinned release. The readings
      still disagree across releases, so no change of outcome is proposed. R''s apeglm was not run, as R cannot be pinned
      in the entry''s locked environment.'
