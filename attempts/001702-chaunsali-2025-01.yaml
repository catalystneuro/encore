  - claim: fig4b-3m-degs
    agrees: true
    outcome: blocked
    reason: 'Cell 13: reproduced, not reproduced, partially reproduced and not reproduced across the four readings, at
      both alphas. Cell 14, the record''s notes, its round-1 response, the methods_unavailable finding and the README
      say 95 up and 136 down and 88 and 45 (separate, shrunken), but cell 13 prints 98 and 137 at alpha 0.1, and 91 and
      45; they must be corrected to 98/137 and 91/45. The outcome itself stands.'
    response: No change to the numbers, which the re-run confirms. Cell 13's first table, filtering at alpha 0.1, prints
      95 and 136 (separate, unshrunken) and 88 and 45 (separate, shrunken); its second table, the alpha 0.05 variant,
      prints 98 and 137 and 91 and 45. Two fits of the 3 M separate model in the locked environment gave the same counts.
      98/137 and 91/45 are also the counts of round 1, which filtered at 0.05. The conclusion, notes, finding and README
      now name the alpha of each count and give 91 and 45 for the variant. Outcome kept.
