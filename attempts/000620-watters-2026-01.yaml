inputs:
- what: Method details cited in the notebooks and wm.py (correctness radius, response location, AUC p-value, firing-rate
    windows, noise-correlation variants, decoder models and configs, synthetic datasets, the code's Ring session
    list) from the paper's code; no data or fitted results from it are used.
  source: https://github.com/jazlab/multi_object_memory_2025 at commit 6e4b333b78cd4461e6373a42378535e8fd392cdb
outcomes:
- claim: fig1b-performance-load
  outcome: reproduced
  notebook: reproduce_watters_2026.ipynb
  output: claim:fig1b-performance-load
  notes: Under both readings and both radii the fraction correct falls from 1 to 2 to 3 objects in both monkeys
    and the 2- and 3-object fractions are above 1/2 and 1/3. Reading (a), Triangle trials on the triangle, code
    radius, gives P 0.953, 0.930, 0.692 and E 0.928, 0.759, 0.561, equal to the values the paper's notebook printed;
    with the Methods radius P 0.901, 0.887, 0.661 and E 0.903, 0.749, 0.555. Reading (b), Triangle and Ring pooled,
    code radius, P 0.958, 0.911, 0.692 and E 0.939, 0.757, 0.561. The smallest margin above chance is 0.222 (E,
    3 objects, Methods radius). The paper gives no test.
  deviations:
  - Physiology sessions only (24 Triangle, 22 Ring); the behaviour-only session Perle 2022-06-08 and the 2-object-only
    session Perle 2022-06-06 are left out, as the Fig. 1b legend says all physiology sessions.
- claim: fig1c-reaction-times
  outcome: reproduced
  notebook: reproduce_watters_2026.ipynb
  output: claim:fig1c-reaction-times
  notes: Reaction times of trials at or above 180 ms have interquartile ranges of 52.0 ms (P) and 69.8 ms (E) under
    reading (a) and 50.6 and 73.1 ms under reading (b), with medians of 230.0, 268.5, 227.4 and 273.4 ms. Before
    the cut, 1.7% (P) and 0.4% (E) of reading (a) trials are under 180 ms. Incorrect trials are faster than correct
    ones in both monkeys (medians P 220.7 against 232.2 ms, E 260.7 against 272.4 ms, reading (a)). The cue phase
    lasts 250 ms in the data, not 180 ms, and 47.9% of completed trials have a reaction time under 250 ms.
  deviations:
  - Reaction time is response_time minus cue onset, as the code computes it; response_time reads as saccade onset
    (the closed-loop response time is 134 ms later at the median), which the paper's legend calls onset of the response
    saccade.
- claim: ext1-misbinding-errors
  outcome: reproduced
  assumed: true
  notebook: reproduce_watters_2026.ipynb
  output: claim:ext1-misbinding-errors
  notes: With the code's radius (0.2 arena widths), errors at a non-target object's vertex are 92.3% (E, 2 objects),
    99.4% (E, 3), 84.5% (P, 2) and 96.5% (P, 3) of errors, the largest class in each, so both readings hold. With
    the Methods radius (2.4 degrees, 0.1 arena widths) both readings hold for E at 2 and 3 objects (86.5%, 96.7%)
    and P at 3 (82.0%), and fail for P at 2 objects, where 207 errors are at the non-target vertex and 249 at no
    vertex (44.9%). The outcome depends on the radius; the code's is adopted (see deviations). The question is put
    to the paper's authors (findings).
  deviations:
  - 'Assumed the correctness radius of 0.2 arena widths (4.8 degrees), the code''s (load_triangle_data.py, correct_threshold
    0.2, also used for response_location), where the Methods (Feedback phase) say 2.4 degrees. Reason: in the data
    every completed trial with a closed-loop error under 0.2 arena widths was rewarded (49,185 trials) and none
    at 0.2 or more (12,469 trials), so 0.2 is the radius the task used to score responses, and the code that made
    Extended Data Fig. 1 assigns responses to vertices with it. The Methods radius is shown and gives a different
    outcome for Monkey P with 2 objects.'
  - Errors at the target vertex but outside the radius cannot occur here, since the vertex radius equals the correctness
    radius; responses at no vertex and at an empty vertex are counted apart.
- claim: triangle-unit-counts
  outcome: reproduced
  notebook: reproduce_watters_2026.ipynb
  output: claim:triangle-unit-counts
  measured:
  - 4688
  - 2937
  - 1751
  - 10
  - 14
  notes: Reading (a), good and multi-units with delay-phase mean rate above 1 Hz over their completed stable trials,
    gives 4,688 units (2,937 DMFC, 1,751 FEF) from 10 Perle and 14 Elgar sessions, exactly the paper's numbers.
    Reading (b), also stable on at least 500 trials, gives 4,473 (2,857, 1,616), within tolerance. Reading (c),
    good units only, gives 1,563 (1,110, 453) and does not match. Of all 4,899 sorted Triangle units, 4,688 pass
    reading (a).
  deviations:
  - DMFC is probe s0 and FEF the V-probes, from the claims file and the code; the dandiset's electrodes tables give
    no location.
- claim: ring-unit-counts
  outcome: reproduced
  notebook: reproduce_watters_2026.ipynb
  output: claim:ring-unit-counts
  measured:
  - 3052
  - 1712
  - 1340
  - 10
  - 12
  notes: Reading (a) gives 3,052 units (1,712 DMFC, 1,340 FEF) from 10 Perle and 12 Elgar Ring sessions, against
    3,051, 1,712 and 1,339. Reading (b) gives 2,936 (1,655, 1,281), within tolerance; reading (c) 1,123 and does
    not match. The Ring sessions are Perle 2022-06-07 and 06-09 to 06-19 (10) and Elgar 2022-09-06 to 09-20 (12);
    the code's model comparison lists 20, without Elgar 2022-09-18 and 09-19 (2,862 units under reading (a)). Adding
    Perle 2022-06-06 would give 3,121 units from 11 Perle sessions.
  deviations:
  - Perle 2022-06-06, which has spike sorting but only 2-object trials, is not counted as a Ring session; the Ring
    design has 1- and 2-object trials (Methods, Behavioral Task).
- claim: ext2-stimulus-delay-activity
  outcome: reproduced
  notebook: reproduce_watters_2026.ipynb
  output: claim:ext2-stimulus-delay-activity
  notes: 'Panel a, Triangle units above 1 Hz, stimulus against delay mean rate: Pearson r 0.898 (P, 1,536 units)
    and 0.971 (E, 3,152), Spearman 0.894 and 0.963, p below 1e-300; 97.5% (P) and 99.1% (E) of units are above 1
    Hz in the stimulus phase. Panel b, normalised 1-object rates per unit and vertex, stimulus against delay: Pearson
    0.600 (P DMFC), 0.488 (P FEF), 0.398 (E DMFC), 0.440 (E FEF), Spearman 0.371 to 0.545, all p below 1e-89; all
    four plots pass both readings.'
  deviations:
  - The stimulus phase is stimulus onset to delay onset, as the code computes it; it lasts 1.000 s at the median
    (0.9997 to 1.4167 s).
- claim: fig2b-selectivity-range
  outcome: partially_reproduced
  notebook: reproduce_watters_2026.ipynb
  output: claim:fig2b-selectivity-range
  notes: 'Position AUCs meet the rule in both monkeys under both p-value methods (lowest decile 0.538 to 0.574,
    highest decile 0.706 to 0.897). Identity AUCs do not: their highest decile is 0.654 (E) and 0.700 (P) with the
    Methods p-value, 0.681 (E) and 0.715 (P) with the code''s, so only P under the code''s p passes. Significant
    and non-significant units are present everywhere (Methods p, P 955 and 581, E 1,156 and 1,996). Identity AUCs
    reach 0.969 (P) and 1.000 (E). With the 500-trial rule no conclusion changes. The deciles are the claims file''s
    reading of a wide range.'
  deviations:
  - AUCs are not cross-validated; the Fig. 2b legend calls them cross-validated but neither the Methods nor the
    code says how (claims file, T6).
  - AUC by ranks with ties as half; the code's trapezoid on value-sorted labels orders ties arbitrarily.
  - The code's p-value (auc.py) resamples labels with replacement in the value-sorted order, a null of 5,000 draws,
    where the Methods shuffle 1,000 times; both are run. Counts of units entering the models under the code's p-value
    run above the counts its selectivity notebook printed for Elgar, for reasons not found.
- claim: fig5ab-ring-behavior
  outcome: reproduced
  notebook: reproduce_watters_2026.ipynb
  output: claim:fig5ab-ring-behavior
  notes: 'Completed Ring trials, all conditions: 2-object fraction correct P 0.903 and E 0.756 (code radius), P
    0.786 and E 0.721 (Methods radius), above 1/2; 1-object P 0.960 and E 0.945 (code radius). Without the left/right
    trials (1,525 of 29,299, 5.2%) P 0.899 and E 0.749. Ring against Triangle interquartile range of reaction time,
    ratio 0.935 (P, 48.6 against 52.0 ms) and 1.098 (E, 76.6 against 69.8 ms).'
  deviations:
  - The Triangle reference for reaction-time variability is reading (a) of fig1c-reaction-times (Triangle trials
    on the triangle, trials at or above 180 ms).
- claim: fig5cd-ring-tuning
  outcome: partially_reproduced
  notebook: reproduce_watters_2026.ipynb
  output: claim:fig5cd-ring-tuning
  notes: 'Variety of receptive fields holds: units with significant position AUC have preferred angles in all three
    sectors in each area of each monkey (Methods p, fewest 48 in a cell; code p, fewest 72). The AUC part judged
    as fig2b fails: the highest decile of identity AUC is 0.611 (E), 0.630 (P) and 0.623 pooled with the Methods
    p (0.638, 0.653, 0.646 with the code''s), and Elgar''s position AUCs reach a highest decile of only 0.658 (0.674);
    Perle''s position AUCs (0.796) and the pooled ones (0.740) pass.'
  deviations:
  - The preferred angle is the peak of the mean of the 100 bootstrapped tuning curves; the Methods describe the
    curves, not how a preference is read from them.
  - AUCs are not cross-validated, as for fig2b-selectivity-range.
- claim: fig2d-signal-noise-triangle
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_watters_2026.ipynb
  output: claim:fig2d-signal-noise-triangle
  notes: 'The criterion''s two methods give different outcomes, which it settles as methods_underspecified. Main
    method (Methods, Noise Correlations), 55,766 P and 328,273 E pairs: lowest bin P -0.0041 (95% interval -0.0071
    to -0.0011), E -0.0230 (-0.0244 to -0.0216); highest bin P 0.0574 (0.0545 to 0.0602), E 0.0490 (0.0475 to 0.0504),
    so it reproduces the claim in both monkeys. Code variant (run_compute_triangle.py): P lowest -0.0189 (-0.0292
    to -0.0085), highest 0.0769; E lowest bin (124 rows) 0.0245 (-0.0296 to 0.0786), highest 0.1412 (0.0975 to 0.1849),
    so only the rise holds for E (partially reproduced). Per session, signal and noise correlation correlate positively
    in all 24 sessions (Pearson 0.100 to 0.442). The question of which signal correlation the figure uses is put
    to the paper''s authors (findings). Counting each pair once, with intervals clustered by pair (up to 18 rows per
    pair in the code variant), changes nothing: E''s lowest bin, 124 rows from 98 pairs, is 0.0245 (-0.0327 to 0.0818),
    its highest 0.1412 (0.0948 to 0.1877), and P''s lowest stays below zero (-0.0309 to -0.0068).'
  deviations:
  - 'Code variant vectorised: the within-condition shuffle permutes trials for all units at once and each pair''s
    shared trials are taken after it, where the code keeps the pair''s shared trials first and then shuffles.'
  - Intervals are normal 95% intervals of the mean, a standard choice; the paper's plots use seaborn's bootstrap
    interval.
- claim: fig5e-signal-noise-ring
  outcome: partially_reproduced
  notebook: reproduce_watters_2026.ipynb
  output: claim:fig5e-signal-noise-ring
  notes: 'Ordered pairs of Ring units above 1 Hz with at least 50 shared 1-object and 200 2-object trials, 294,992
    P and 154,174 E. Both readings agree. P (s = 0.8): highest bin 0.1728 (0.1098 to 0.2359) against lowest -0.1083
    (-0.1424 to -0.0742) under reading (a), 0.1620 against -0.0629 under (b); pooled the same. E (s = 0.3): highest
    0.0238 (0.0151 to 0.0324) against lowest 0.0174 (0.0077 to 0.0271) under (a), 0.0229 against 0.0192 under (b),
    overlapping, so the criterion fails for E. The E means rise over the middle bins (0.0145 to 0.0214, reading
    (a)), and the across-pair Pearson correlation of signal and noise is 0.017 (E) and 0.061 (P). Each unordered pair appears twice (ordered pairs, as run_compute_ring.py); with intervals clustered by
    pair E''s highest bin (0.0131 to 0.0344) still overlaps its lowest (0.0059 to 0.0288), and P''s bins stay apart
    (0.0873 to 0.2584 against -0.1504 to -0.0663, reading (a)).'
  deviations:
  - Units above 1 Hz (T5); the code's run_compute_ring.py takes every unit of its selectivity table.
  - Neighbours within each pair's shared trials are taken from one distance sort per session; ties among equidistant
    trials are broken by trial order, which can differ from the code's argsort.
  - Methods reading (a) uses the 10 nearest neighbours without the trial itself, as the code does for reading (b).
- claim: ext3ab-decoding
  outcome: partially_reproduced
  notebook: decoding_watters_2026.ipynb
  output: claim:ext3ab-decoding
  notes: 'Sessions Perle 2022-06-01, 2022-05-31 and 2022-06-04, the three with the most units entering the models,
    as in the code. Panel a, delay phase: position 99.2%, 95.7% and 82.5% against shuffled 32.9%, 33.3% and 32.1%,
    above control in all ten splits and by more than two standard deviations in each session; identity 50.0%, 46.7%
    and 30.0% against 34.2%, 30.5% and 30.8%, above control in all ten splits only in 2022-05-31 and by two standard
    deviations only in 2022-06-01, so in all three sessions under neither reading. Identity decoders fit their
    training trials little better than decoders trained on shuffled labels (delay, 84.9% against 82.3%, 92.6% against
    86.1%, 63.6% against 66.3%). The stimulus phase gives the same pattern. Panel b: the absent location 78.5% to
    99.7%, above the legend''s 66% in every session and phase; the absent identity 32.4% to 43.6%, below it. Position
    holds and identity does not. With inputs z-scored per unit (variants notebook, not the code''s) identity is again
    above control in one session under each reading (delay 50.8%, 48.1%, 32.9% against 35.0%, 31.4%, 30.8%). Whether
    the criterion''s identity test matches the paper, whose Methods say identity was poorly decodable on single trials,
    is asked of a reader (questions/000620.yaml).'
  deviations:
  - The decoders are models.py's LinearModel1Object written in numpy (wm.train_linear) with the configs' settings
    (panel a SGD lr 0.01, panel b Adam lr 0.001, L1 0.003, batch 512, 10,000 steps), batched over splits; torch's
    random streams are not reproduced.
  - Inputs are rates in Hz with no per-unit normalisation, as the code's dataset.py, where the normalisation lines
    are commented out ("# Normalize neural data").
  - Units entering the models are selected with the Methods' AUC p-value; this picks the same sessions as the code's
    scripts name. Ten seeds as the legend says, where run_1_triangle.py lists twenty.
  - 'The code''s filters (dataset.py, units with 50 trials, trials with 5 units, then greedy removal to a fully observed
    matrix, which with keep_units_weight 1.0 drops units before trials) leave 105 to 121 1-object trials, and 104,
    82 and 20 units; for 2022-06-04, 72 of 116 units have 50 trials and 20 are kept.'
- claim: ext3c-decoder-orthogonality
  outcome: partially_reproduced
  notebook: decoding_watters_2026.ipynb
  output: claim:ext3c-decoder-orthogonality
  notes: 'Median angles between corresponding columns of the two decoders, over sessions, ten seeds and columns,
    with the code''s decoder (rates in Hz, sigmoid outputs). Receptive Field data 92.0 and 91.8 degrees (Triangle
    delay, stimulus) and 96.5 and 96.0 (Ring), within 10 degrees of the Orthogonal data (91.0, 90.7, 92.4, 95.1).
    Ring neural data 88.8 and 93.3, so both readings hold for the Ring. Triangle neural data 106.6 in both phases,
    outside 75 to 105 and 15.6 and 15.9 degrees from the Orthogonal data, so neither reading holds there; per session
    96.8 to 114.6, and without 2022-06-04 (20 units) 109.1 (delay) and 99.2 (stimulus). The claim holds for the
    Ring and fails for the Triangle neural data, so it is partially reproduced; the criterion has no rule for a
    result that holds in one dataset only. The part of the statement about data without slots holds: the Receptive
    Field decoders come out near orthogonal in both datasets. Variants that are not the code''s (variants notebook)
    move the medians: with z-scored inputs the Triangle neural data give 95.2 and 97.6 and pass both readings, while
    the Ring data fail reading (b) in 3 of 4 cases (medians 102.0 to 102.3 against 90.0;
    the Ring neural delay phase, 98.8, passes); without the output sigmoid
    the Ring neural medians are 140.2 and 142.1. So the outcome depends on the decoder''s details.'
  deviations:
  - LinearModel2Objects written in numpy (wm.train_linear_2obj), Adam lr 0.001, L1 0.003, batch 512, 10,000 steps
    (config_2_triangle.py, config_2_ring.py); synthetic datasets as dataset.py with numpy's generator.
  - As in models.py the Ring decoders keep the sigmoid output, though the Ring targets 2x - 1 and 2y - 1 (labelers.py)
    lie in -0.7 to 0.7; inputs are rates in Hz, as dataset.py.
  - Ring sessions Perle 2022-06-10, 06-11 and 06-09, ranked by units entering the models with the Methods p-value,
    the sessions run_2_ring.py names. The code's filters leave 104, 85 and 20 Triangle units and 70, 90 and 44 Ring
    units, below the about 100 simultaneously recorded neurons the Methods describe in 5 of 6 sessions.
- claim: fig4a-gain-best-triangle
  outcome: blocked
  blocked_by: too_large
  notebook: reproduce_watters_2026.ipynb
  output: claim:fig4a-gain-best-triangle
  notes: Needs the paper's encoding models fitted (T7). One gradient step at the paper's sizes (MLPs 512-1024-512,
    batch 4,096 samples of up to 3 objects, 59 modeled units, the median of a Triangle session) takes about 0.98
    s here, so one fit of 10,000 steps takes about 2.7 h; this claim needs the kappa sweep (11 values, two splits,
    10,000 steps) and ten splits for 3 models on 24 sessions, 23,040,000 steps or about 262 days, far over the 60-minute
    notebook limit and the run's 5 hours. The estimate is a lower bound (no Slot assignment losses, evaluation or
    data pipeline); the machine has no GPU, and at 100 times the speed the model-fitting estimates would still be 3.5 to 62.9 h. No fit
    was started.
