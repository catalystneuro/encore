findings:
- kind: code_mismatch
  statement: 'The Methods (Feedback phase) say a response was correct within 2.4 degrees (0.1 arena widths) of the
    target; the paper''s code scores correctness at 0.2 arena widths (4.8 degrees), and the data agree with the
    code: every completed trial with a closed-loop response error under 0.2 arena widths was rewarded (49,185) and
    none at 0.2 or more (12,469).'
- kind: paper_inconsistency
  statement: The Methods say the cue phase lasted 180 ms and the Fig. 1c legend counts saccades earlier than 180
    ms after cue onset as broken fixation; in the trials tables the response phase begins 250 ms after cue onset
    (0.2498 to 0.3167 s), 47.9% of completed trials have a response time under 250 ms, and 1.1% are under 180 ms
    yet are not marked as broken fixation.
- kind: metadata_insufficient
  statement: The trials column response_time is described as the response time from high-resolution eye tracking,
    without saying which event it marks; it precedes closed_loop_response_time by 134 ms at the median and in some
    completed trials precedes cue onset (earliest 12.5 ms before), so it reads as saccade onset.
- kind: metadata_insufficient
  statement: The electrodes tables of all spikesorting files give location 'unknown'; the brain area of each probe
    (s0 in DMFC, vprobe0 and vprobe1 in FEF) is stated only in the paper's code and the claims, not in the dandiset.
- kind: selection_undocumented
  statement: The dandiset holds two Perle sessions the paper does not count, 2022-06-06 (spike sorting, 2,378 trials,
    all with 2 objects, 77 units) and 2022-06-08 (behaviour only, 1,517 trials); neither the dandiset nor the paper
    says what they are. The paper's 22 Ring sessions include Elgar 2022-09-18 and 2022-09-19, which the code's Ring
    model comparison leaves out.
- kind: paper_inconsistency
  statement: 'The paper''s counts of ''well-isolated neurons'' (4,688 Triangle, 3,051 Ring) are recovered only with
    multi-units included: 1,563 of the 4,688 Triangle units and 1,123 of the Ring units are labelled good (single
    units), the rest mua. The counts also do not apply the Methods'' rule of at least 500 stable trials (4,473 with
    it).'
- kind: code_mismatch
  statement: The AUC p-value of the code (phys_processing/selectivity/auc.py) draws labels with replacement in value-sorted
    order 5,000 times, a resampled null, where the Methods shuffle labels 1,000 times; under the code's p-value
    more units pass the modeling threshold than under the Methods' (for Elgar 2022-08-20, 172 against 98).
- kind: methods_unavailable
