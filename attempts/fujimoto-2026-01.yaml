- claim: fig5a-pre-scc-connectivity
  outcome: reproduced
  assumed: true
  notebook: reproduce_fujimoto_2026.ipynb
  output: claim:fig5a-pre-scc-connectivity
  notes: Before DBS, in the stimulated hemisphere, vmFC 0.123, STG 0.099, DLPFC 0.066, dACC 0.064,
    AMY 0.042, HIP 0.038 and PCC 0.038 are positive, the anterior-dorsal insula -0.013 and the
