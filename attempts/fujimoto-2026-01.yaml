findings:
- kind: data_missing
  statement: The Data availability statement says the functional MRI data are deposited in this
    dandiset, but it holds only derived values (seed connectivity of the voxels of 17 target ROIs
    for monkeys N, T and D, and three group-average connectomes). There are no fMRI or DWI images,
    no whole-brain seed maps, no seed connectivity for the nonsurgical controls B, W and H, and no
    per-monkey connectomes, so the voxelwise cluster maps of Fig. 5a, Fig. 6d and Extended Data
    Figs. 7, 8 and 10d cannot be tested.
- kind: metadata_insufficient
  statement: The connectomes in "Source Data FC matrix.xlsx" (123 x 123) carry no ROI names. The
    Fig. 4 script reads them from atlas key and reorder files (CHARM_key_4.txt, SARM_key_4.txt,
    reorder_rois.txt) that are not deposited, so no ROI can be named and the network sorting of
    Fig. 4c cannot be repeated.
- kind: metadata_error
  statement: The legend in dbs_behavior_data_a.xlsx codes foraging as yes 2 and no 1, but every
    foraging value is 0 or 1; read as 1 yes, the values give the paper's statistics. The same
    legend gives group codes 1 (DBS) and 0 (non-stimulation control), while monkey D's rows carry
    group 2.
- kind: other
  statement: In CC1_MCC_CB_data_a.xlsx two fields of monkey T's control side (section T423, fields 3
    and 4) carry CC1/DAPI ratios that do not match their counts (44.9 and 35.4 % against 35.4 and
    44.2 % from the counts); field 4's ratio is field 3's. Two MCC-CB fields have more CC1-positive
    than DAPI-positive cells (ratio above 100 %). The paper's script uses the ratio column; with the
    ratio from the counts the side effect changes from F = 9.00 to 9.03.
- kind: metadata_error
  statement: In dbs_EMgratio_MCC_CB_data_a.xlsx the column headed "diameter of axon(pixel)" holds
    half the mean of the long and short diameters (a radius), and "diameter of axon(nm)" the same
    in nm. The g-ratio column is consistent with the Methods' definition.
- kind: code_mismatch
  statement: The Fig. 4 script counts an ROI as changed when `ranksum` of its changes against a
    vector of zeros gives P < 0.05/nrois (nrois = 123), while the Methods and the Fig. 4b legend
    give a rank-sum test at "P < 0.01 with Bonferroni correction". The script's threshold
    reproduces the 69 and 44 ROIs of Supplementary Tables 1 and 2, whose largest listed P is 3.9e-4,
    above 0.01/122.
- kind: paper_inconsistency
  statement: The Fig. 6a legend gives the PrePost x side x tract interaction as F(1,1238) = 6.02,
    P = 0.0025. The data give F = 6.02 and P = 0.0025 with 2 numerator df, as three tracts imply.
- kind: methods_unavailable
  statement: For fig6e-monkey-d-no-network-reduction, the paper does not say whether "the
    widespread reductions ... were not observed" in monkey D covers the control hemisphere. Its own
    Fig. 6e legend lists a significant control-side CEN difference, which the data show to be a
    decrease (P = 0.0089). The Methods list LIM without area 25, while the script and the legend's
    voxel counts include it. The authors could say which hemisphere the sentence refers to.
- kind: metadata_insufficient
  statement: The dandiset's metadata names the paper only in its title, with no related resource,
    and gives no species, approach, measurement technique or variables measured. The sheets have
    no data dictionary beyond the legends inside some of them.
- kind: methods_unavailable
  statement: The seed connectivity tables hold one value per voxel and session, and the file
    names say "concatenated". The paper does not say whether a session's seed map was computed on
    concatenated runs or averaged over per-run maps, and no per-run maps are deposited.
- kind: code_mismatch
  statement: The FigE1 script computes the foraging standard errors from column 2, the movement
    column (lines 91 to 96), so the error bars of the foraging plot in Extended Data Fig. 1 are
    those of movement.
- kind: other
  statement: Two scripts are deposited twice under two names with identical text
    (`Fig4 Fujimoto_NatNeuro_2026_FCmatrix.m` and `Fig4andE10C_Fujimoto_NatNeuro_2026_FCmatrix.m`;
    `Fig6DandE10D_dbs_FC_25norm_mkD_analysisscript_a.m` and
    `Fig6DandE10Ddbs_FC_25norm_mkD_analysisscript_a.m`).
