findings:
- kind: other
  statement: In four glass sheets of 64455lunar_cryodata.xlsx (g2, ss8, ss39, ss48) the rows given
    as repeated measurements of each step are one row multiplied by factors between 0.95 and 1.03.
    In g2, ss8 and ss39 the same factor multiplies the moment, the declination and the inclination
    of a row; in ss48 each column has its own factors. Every step of these sheets is built this way
    and no step of the other 18 sheets or the 12 crystal files is. These rows are not measurements,
    and the scaling of a declination has no physical meaning (one ss8 declination becomes 361.7
    deg). The deposit does not say how they were made.
- kind: format_error
  statement: Values outside their ranges or format in 64455lunar_cryodata.xlsx; sheet ss19, 10 mT
    step, an inclination of -136 deg (likely -13.6); sheet ss8, NRM, a declination of 361.692 deg;
    sheet ss18, row 41, a 250 C row with no moment, declination or inclination; sheet ss48 has an
    extra column CSD before the moment, so its columns differ from the Data Records' description.
- kind: metadata_insufficient
  statement: The glass sheets hold 2 to 19 repeated measurements per step, and neither the deposit
    nor the paper says how they were combined for Table 2 and Figures 1 and 2. The mean vector
    reproduces most of Table 2; the first measurement does not. Sheet ss6's 250.1 step holds 19 rows
    in two groups of directions (inclination near 71 deg and near -13 deg). NRM is labelled both 0
    and 0.0 in ss27 and ss38.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) Were the repeated measurements of each step
    averaged as vectors for Table 2 and Figures 1 and 2, or was one measurement used? (2) Is MAD a
    free (unanchored) line fit to the field-off vectors, without the three-point smoothing? A free fit
    to averaged replicates gives 8 of the 9 printed MADs. (3) How is the pTRM check percentage
    defined (denominator, and which field-off step the check is referred to)? No single definition
    tried here gives more than 5 of the 11 printed values. (4) Which measure supports "consistent"
    and "inconsistent" for the crystal replicates? (5) Were Table 1's max intensities rounded up?
    Ten of twelve equal the formula rounded up, not rounded.
- kind: paper_inconsistency
  statement: The Technical Validation example of the threshold for 14053g1 uses a TRM of 8e-12 A m2
    and gives 0.2 uT; the data and Table 1 give 3.2e-12 A m2 and 0.50 to 0.51 uT for 14053g1, and the
    example's numbers are those of 12040g1. The text before Figure 3 names 12041g1, which is not a
    specimen of the deposit; the Figure 3 legend has 12040g1.
- kind: paper_inconsistency
  statement: Table 2 gives ss36 a pTRM check at 450 C (25%), but its sheet has no pTRM check step,
    and gives ss27 6 points from 100 to 550 C where its sheet has 5 paired steps (100, 305, 400, 500,
    550 C).
- kind: metadata_insufficient
  statement: The laboratory field of the glass experiments differs between sheets, 18 uT (10
    sheets), 15 uT (11) and 14.4 uT (g2), given in a footnote of each sheet. The paper states only
    the 18 uT of Figure 1.
- kind: other
  statement: The crystals' moments after zero-field heating to 590 C (37 measurements, 1.0e-10 to
    6.0e-10 emu per measurement) are all above the 8e-11 emu magnetometer threshold the paper uses
    for its bound on paleointensity. The directions of these measurements are random by Watson's
    test in every crystal.
- kind: metadata_error
  statement: The item's description lists files named "SI Figure 1 - Other Thelliers n=18.pdf" and
    "SI Figure 2 - All Stereonets copy.pdf", while the files are "SupplFig1 - other Thelliers March
    2024.pdf" and "SuppFig2 - All Stereonet.pdf". The item's title differs from the paper's.
