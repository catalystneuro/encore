- claim: fig2-changing-field
  outcome: reproduced
  assumed: true
  notebook: reproduce_tarduno_2024.ipynb
  output: claim:fig2-changing-field
  notes: With averaged replicates, ss41 (500 to 580 C) turns 33.3 deg between its first and last
    field-off directions against a line MAD of 24.1 deg, and a great circle fits with MAD 15.1 deg;
    ss22 (250 to 500 C) turns 107.8 deg against a line MAD of 35.4 deg, great-circle MAD 32.0 deg.
    Both readings hold for both specimens, also with first measurements. R2 is 0.384 and 0.378
    (0.38 plus or minus 0.038); with first measurements it is 0.16 and 0.44, outside tolerance. Both
    readings are weak tests. For sequences of 4 and 5 vectors with no changing field, reading (a)
