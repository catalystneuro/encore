- claim: glass-directions-not-random
  outcome: partially_reproduced
  notebook: reproduce_tarduno_2024.ipynb
  output: claim:glass-directions-not-random
  measured: 8
  notes: Watson's test rejects randomness of the thermal field-off directions (one per step, 2 to 9
    steps) in 8 of 22 specimens with averaged replicates and 9 of 22 with first measurements,
    between a quarter and a half. Within the Table 2 ranges, 8 of 22 (7 with first measurements).
    Without the four synthetic sheets, 7 of 18. ss38 (k 27.9, p 0.0001), ss45, ss9, ss8, ss19,
    ss41, s11 and ss6 reject; ss39 and ss48 have two thermal steps each.
  deviations:
  - The p-value of Watson's test is computed exactly by simulation (200000 sets of uniform
    directions, fixed seeds), a standard form of the test the claims file names.
