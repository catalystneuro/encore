  notes: With the mean vector of each step's repeated measurements, n matches Table 2 for all nine
    specimens, and 23 of 29 values match under one of the named readings (79%, the criterion asks
    80% for reproduced and 50 to 80% for partially reproduced), MAD 8 of 9, R2 6 of 9, pTRM checks
    9 of 11. Measured values are MAD under reading (a), a free line, and R2, in the claims file's
    order; the last value is the fraction of the 29 values that match. MAD reading (a) alone gives
    all 8 matching MADs (median difference 0.2 deg, six within 0.3 deg); readings (b) and (c) give
    2 and 0. Outside tolerance under every reading are ss10's MAD (33.3 against 42.9 deg) and R2
    (0.23 against 0.15), ss9's R2 (0.89 against 0.74), ss34's R2 (0.03 against 0.06, tolerance
    0.006), and the pTRM checks of ss19 at 250 C (23.7 to 105.9% against 30%) and ss30 at 450 C (8.2
    to 43.8% against 10%). The matching pTRM checks need different readings for different specimens;
    no single reading matches more than 5 of 11. With the first measurement of each step, 11 of 29
    values match (38%), which would not reproduce the claim. Against the stated thresholds,
    reported and not judged, ss30 and ss34 have R2 below 0.9 and n of 4 or more, as their single
    failure "R2" says; ss6 has R2 0.89 here, so its listed R2 failure follows here. Counting ss6's R2
    as a miss, since its 250.1 step averages two groups of directions, gives 22 of 29 (76%). With one
    pTRM reading held fixed the score is 17, 16, 19 and 14 of 29 (readings a_i, a_ii, b_i, b_ii; 48
