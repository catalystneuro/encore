findings:
- kind: metadata_insufficient
  statement: The files do not mark the 914 single auditory units the data description and the paper report, nor
    the 404 units the paper analyses. 1281 h5 files are labelled single units (sortType), 1246 of them with stored
    I_AR of at least 2.3 bits/s, the 2015 auditory threshold. The spike-snippet SNR that defines a single unit is
    not stored; computed from the snippet files as the description defines it, the threshold of 5 leaves 461 or
    274 of the 1401 auditory spike-sorted units (two readings of the definition), not 914. Without a list of units,
    none of the paper's population results can be repeated on its units.
- kind: metadata_error
  statement: 'The data description says the data set holds 688 multi-units and 914 single auditory units, one h5
    file each. The files are 845 unsorted multi-unit files (sortType tdt) and 1453 spike-sorted files (named _ss):
    1281 labelled single, 63 multi and 109 noise.'
- kind: data_missing
  statement: The anatomical area and the x, y, z coordinates of the recording sites, used in the paper's Table 1
    and Figure 10, are not in the data set; only the electrode, site and array depths are stored.
- kind: metadata_error
  statement: The numbers of stimuli and trials differ from the stated ones. In the call protocol (groups Call, Call1,
    Call1c, Call2, Call3) single units have 115.3 stimuli on average (sd 34.2, 34 to 133) against the paper's 114
    (sd 22, 34 to 123), and 90.7 call stimuli of the nine call types (34 to 110); over every group they have 121.9
    stimuli (73 to 137) against the description's 144 (64 to 153). 1874 unit-stimulus pairs of the call protocol
    have 12 trials, against a stated maximum of 11. The other protocols in the files (Sel1 to Sel7, Mask1, STRF1),
    which also hold call stimuli, are not described.
- kind: metadata_error
  statement: Three h5 files store sortType as 'singl'; and the description's section on file organisation names
    a bird WhiBlu5896M, where the files and the summary say WhiBlu5396M.
- kind: metadata_insufficient
  statement: The per-site .f32 files of spike waveforms are described only as the waveform of the action potentials.
    Their layout (18 float32 samples per spike, indexed from 1 by the spike_ids of the h5 files) is documented only
    by the plotting function h5_plot_one_spike.m in the archive's CRCNSCode.tar.gz. There is one per site and protocol;
    bird BlaBro09xxF has two files for site 4 and Call1 (1,956,253 and 33,047 snippets, named with _ and -).
- kind: methods_unavailable
  statement: 'The paper selects its 404 units by a decoding analysis it does not describe, citing Elie and Theunissen
    2015, and its code repository holds neither that selection nor the selection of the 337 units, the locally adaptive
    KDE step, the exponential fits or the CII. The single-unit SNR defined in the Methods, computed from the snippet
    files, does not recover the 914 units. Question for the authors: can the lists of the 914, 404 and 337 units
    be published, with the file names of the data set, and on which snippets and with which noise measure was the
    SNR computed?'
- kind: other
  about: paper
  statement: The paper gives NB = 20 bootstraps of the jackknife for the error on information, while the tutorial
    of its code repository uses 10 for the cumulative and 100 for the instantaneous information. The text does not
    say that the jackknife sets are paired across stimuli at random in each bootstrap, nor that the jackknife sets
    are evaluated on the Monte Carlo samples of the full data; the code does both.
verifications:
- date: '2026-11-13'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: The first executed notebook with the conclusion cells and the summary removed, the helper module elie.py
    and the claims file, with the paper's full text. The verifier listed the archive's S3 bucket, opened CRCNSCode.tar.gz
    (no bird data downloaded) and tested cum_info_mc against exact enumeration on a synthetic case. It had no attempt
    record and took the claims from the claims file. It found no place where the claims file misreads the paper.
  results:
  - claim: units-404
    agrees: true
    outcome: blocked
    reason: 'Cell 12: 1281 files are labelled single units, 1246 of them with I_AR >= 2.3. No file, the data description
      or the CRCNSCode folder lists the 914 or the 404 units. Reading (b), redoing the 2015 decoding, was not attempted,
      and the 914 count was not even approached. Cell 13 says the .f32 snippet files are undocumented; CRCNSCode/h5_plot_one_spike.m
      reads them (18 float32 samples per snippet, indexed by spike_ids), which makes the SNR > 5 criterion, and
      so the 914, computable at least for the sites that have snippets. Cell 12 also never counts the _ss files
      of any sortType at I_AR >= 2.3 against the description''s 1401.'
    response: The helper now reads the snippet files as h5_plot_one_spike.m does and computes each spike-sorted
      unit's SNR on its call-protocol snippets under two readings of the description's definition; the notebook
      lists the 42 snippet files per bird and site (every site has one for its call protocol, so the earlier 'only
      some sites' was wrong) and the SNR distribution by sortType. The threshold of 5 leaves 461 or 274 auditory
      units, not 914. The count of _ss files of any sortType at I_AR >= 2.3 is 1401, as the description says. Notes
      and findings corrected. Outcome unchanged.
  - claim: units-337
    agrees: true
    outcome: blocked
    reason: Depends on units-404. Cell 15 estimates about 124 h on one core for the KDE rates alone; the cost argument
      is a valid second reason (too_large), but the notebook does not name it as a blocking reason.
    response: The cost cell's conclusion now names too_large as a second reason for every claim from units-337 on
      and for fig2a-poisson-test. Outcome unchanged.
  - claim: s1-temporal-resolution
    agrees: true
    outcome: blocked
    reason: Depends on units-404. The variant on 1246 units (65.8 +- 19.0% below 50 Hz, 1245 units losing more than
      5%) decides nothing. It uses the stored class_info curve, which runs from 4 to 496 Hz and may not be the S1
      Fig computation, so the 65.8% says nothing about the paper. The power part was not computed at all.
    response: The conclusion and the notes now say that nothing shows the stored curve is the S1 Fig computation,
      so the number says nothing about the paper, and that the power part was not computed because it needs the
      KDE rates. Outcome unchanged.
  - claim: fig1-model-neurons
    agrees: true
    outcome: partially_reproduced
    reason: 'Cell 21, temporal neuron: mean |KDE - model| is 0.009 spikes/ms (< 0.02); bias-corrected peak instantaneous
      information 0.519 bits (within 0.5 +- 0.05); cumulative information reaches 1.928 bits (>= 1.8). The MATLAB
      tutorial''s saved results agree (0.502; 1.894). The rate and onset neurons are not in the repository, so ''each
      model neuron'' holds for one of three. Cell 21 departs from Method I: a fixed 200,000 samples instead of the
      adaptive chunks targeting 0.2 bits, jackknife SE instead of 20 bootstraps of the jackknife, and no 0.6-bit
      stopping rule. Its common-random-numbers assumption decides the curve: with independent draws it goes to 2.206
      bits, above the 2-bit maximum, and ends at 0.803.'
    response: 'Added a cell that runs the paper''s procedure as its code runs it (cumulative_info_poisson_model_MCJK_wrapper.m
      and _calculus_MCJK.m): a new estimate per end bin, chunks of 100,000 samples up to 5,000,000 until the error
      is below 0.2 bits, NB = 20 bootstraps of the jackknife with random pairing of the sets across stimuli, and
      the 0.6-bit stop. The code evaluates the jackknife sets on the samples drawn for the full data, so common
      random numbers are the paper''s procedure, not an assumption; the docstring, notes and deviations now cite
      it. Under it the cumulative information reaches 1.982 bits (largest error 0.234, all 40 bins computed) and
      the peak instantaneous information is 0.520 bits. Outcome unchanged, now decided by this cell; measured peak
      0.52.'
  - claim: fig2a-poisson-test
    agrees: true
    outcome: blocked
    reason: Depends on units-404. No variant was run.
    response: No change.
  - claim: fig2cd-fano-factor
    agrees: true
    outcome: blocked
    reason: Depends on units-404. The variant on 1246 units gives 1.027 (SEM 0.002), significantly different from
      1; it decides nothing. read_unit took call and song stimuli from every group, not only the Call group its
      docstring names; this affects only the non-deciding variants.
    response: Call stimuli now come from the call protocol only, as the docstring says, and the data check shows
      the call and song stimuli of every group (no stimulus is in two groups of a unit). The variant is now 1.028
      (SEM 0.002). Outcome unchanged.
  - claim: fig2b-noise-correlations
    agrees: true
    outcome: blocked
    reason: Depends on units-404. The variant gives a noise-correlation median of 0.152, outside the +-0.05 band,
      and a stimulus-correlation median of 0.29 (over stimuli) or 0.24 (within stimulus); it decides nothing.
    response: 'Variant re-run on the call protocol only: 0.151, 0.291 and 0.243. Outcome unchanged.'
