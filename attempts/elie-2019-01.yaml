  notes: 'Neither reading of the criterion can be carried out. Reading (a): the files hold no list or flag of the
    404 units, and the data description and the 2015 paper (Elie and Theunissen 2015, read at PMC4347984) give none.
    Reading (b): the 2015 decoding starts from the 914 single auditory units, defined in the 2015 Methods and the
    data description by I_AR of at least 2.3 bits/s among spike-sorted units and a spike-snippet SNR above 5. The
    I_AR reading matches the authors'': 1401 spike-sorted files of any sortType have a stored I_AR of at least 2.3
    bits/s, the 1401 auditory spike-sorted units of the description. The files hold 1281 units labelled single (sortType
    single, or singl in three files), 1246 of them auditory. The SNR is not stored. Computed from the snippet files
    (.f32, one per site and protocol, every site having one for its call protocol; layout from CRCNSCode/h5_plot_one_spike.m
    in the archive) on the call-protocol snippets of 1452 of the 1453 spike-sorted units, the threshold of 5 leaves
    461 auditory units (SNR reading A, the SD of each snippet''s maximum minus minimum) or 274 (reading B, the SD
    of the snippet at the samples of the average''s maximum and minimum), not 914; reading A leaves 772 at a threshold
    of 4 and 1120 at 3. So the data set does not hold 914 identifiable single units (expected 914, tolerance 0),
    and a selection of 404 could only be redone on a different base set. The main reason is the missing unit labels
    (metadata_insufficient); methods_underspecified is the block the criterion names.'
