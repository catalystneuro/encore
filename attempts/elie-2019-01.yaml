outcomes:
- claim: units-404
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_elie_2019.ipynb
  output: claim:units-404
  notes: 'Neither reading of the criterion can be carried out. Reading (a): the files hold no list or flag of the
    404 units, and the data description and the 2015 paper (Elie and Theunissen 2015, read at PMC4347984) give none.
    Reading (b): the 2015 decoding starts from the 914 single auditory units, defined in the 2015 Methods by I_AR
    of at least 2.3 bits/s among spike-sorted units and a spike-snippet SNR above 5. The files hold 1281 units labelled
    single (sortType single, or singl in three files), 1246 of them with stored I_AR of at least 2.3 bits/s; the
    SNR is not stored, and the snippet files (.f32) are undocumented and present for only some sites. So the data
    set does not hold 914 identifiable single units (expected 914, tolerance 0), and a selection of 404 could only
    be redone on a different base set. The main reason is the missing unit labels (metadata_insufficient); methods_underspecified
    is the block the criterion names.'
  measured:
  - 1281
