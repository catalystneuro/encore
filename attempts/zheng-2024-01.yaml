- claim: fig4-glm-deviance
  outcome: partially_reproduced
  notebook: reproduce_zheng_2024.ipynb
  output: claim:fig4-glm-deviance
  measured:
  - 0.202
  - 0.142
  - 5117
  notes: 5117 rows from 45 sessions. In-sample explained deviance is 0.202 (ON) and 0.142 (OFF), both
    within tolerance (reading b, given as measured); held out under repeated 5-fold cross-validation
    0.192 (within) and 0.123 (below 0.126). The three largest held-out drops are position, animal and
    number of fields for ON, as stated, but trial, number of fields and animal for OFF, with position
    fourth. The values hold under a reading and the ranking holds for ON only. Under four other seeds
    the held-out values are 0.191 to 0.193 (ON) and 0.111 to 0.119 (OFF). The code's split (5 shuffle
    splits, 10% held out) gives 0.169 and 0.092, with position, trial and number of fields first for
    OFF.
  deviations:
  - Trials from the fourth on, and the segment cut points, from the code (behavior_and_switching.py).
  - A switch is counted in the segment of its field's peak on the change-point trial; N_field counts
    the fields of the trial's turn and the merged fields with their peak in the segment. The Methods
    say "the number of fields whose peak lied in that arm".
  - Speed and its CV are of the absolute smoothed velocity of the linearised position in the segment.
  - Held-out explained deviance is 1 minus the test deviance over that of the training mean, fitted
    with statsmodels in place of sklearn.
