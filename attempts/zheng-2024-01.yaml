- claim: fig1h-rate-decorrelates-location-stable
  outcome: reproduced
  notebook: reproduce_zheng_2024.ipynb
  output: claim:fig1h-rate-decorrelates-location-stable
  notes: In 52 session and environment units the peak-rate correlation falls with lag (median slope
    -0.0298, 52 of 52 negative, Wilcoxon p = 3.5e-10). The location correlation is 0.984 at lag 1 and
    0.975 at lag 10, median slope -0.00036; the ratio of median slopes is 83, above the criterion's
