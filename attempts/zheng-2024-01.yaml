- claim: fig1d-pv-decorrelation
  outcome: reproduced
  notebook: reproduce_zheng_2024.ipynb
  output: claim:fig1d-pv-decorrelation
  notes: All 90 familiar and all 14 novel session and turn units with at least five lags have a
    negative slope of PV correlation on lags 1 to 10 (median -0.0170 and -0.0252 per lag), Wilcoxon
    signed-rank p = 1.7e-16 and 0.00012. The slope is negative in every animal. Under the four other
    pipeline seeds the place-cell sets change little (see the seed cell).
  deviations:
  - Version 0.261113.1035 in place of the cited 0.230630.2304, which has no cell-type labels; the
    spike times are the same (data check).
  - 45 of the paper's 46 familiar sessions; e13_26m1_210913 is not in the dandiset.
  - Forward locomotion is a smoothed velocity of the linearised position above 1 cm/s in the running
    direction (Methods, Behavior segmentation, smoothing of 10 samples; the code's directed speed
    'v'), as the novel figure-8 maze's x and y have no scale.
