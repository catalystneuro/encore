  outcome: blocked
  blocked_by: too_large
  notes: Needs per-spike amplitudes of neighbouring units around each switch. The processed files hold
    only mean waveforms. The wide-band signal is in the raw files of 11 sessions (52 to 175 GB each),
    which hold 2000 of the 3430 switches; 40 s of one 16-channel shank is 38 MB per switch, about 77 GB
    to stream with spike extraction on top, beyond the run's time and the notebook limit. The other
    sessions have no wide-band signal in the dandiset. Nothing of this test was run.
findings:
- kind: metadata_error
  severity: major
  statement: The version the paper cites (0.230630.2304) has no putative cell type and no
    light-responsive label for its units, which the paper's selection of pyramidal cells and its ChR2
    analysis need, and its trial table marks 28 of the 30 familiar-maze trials of e16_3m1_210201 as
    not familiar. Version 0.261113.1035 adds the labels and corrects the flag; the spike times of that
    session are identical in the two versions.
- kind: data_missing
  severity: minor
  statement: Session e13_26m1_210913, one of the paper's 46 familiar sessions, is not in the dandiset.
- kind: metadata_insufficient
  severity: minor
  statement: On the linear mazes the trials' visited_arm holds the running direction without saying
    so; left is a run toward higher linearised position in all 108 such trials and right toward lower
    in all 110.
- kind: other
  about: data
  severity: minor
  statement: The paper requires at least 50 putative pyramidal cells per session, but by the files'
    CellExplorer labels six of its familiar sessions have fewer (e14_2m3_201118 39, e14_2m3_201121 40,
    e15_10m1_200803 47, e15_9f1_200715 42, e15_9f1_200720 49, e16_2m1_201121 48). The paper's labels
    may differ from the files'.
- kind: other
  about: data
  severity: none
  statement: Spikes share the position clock; the pyramidal cells' spatial information is lower with
    spikes shifted by 5 s or 30 s in all 53 analysed tasks, and highest unshifted in 52 (in
    e16_3m2_211212's linear maze a 1-s shift is slightly higher). Every familiar trial starts in the
    delay zone.
- kind: methods_unavailable
  statement: Which trials enter Figures 4D and 4I is not stated. The legend's 1,029 familiar and 281
    novel trials fit trials from the fourth on (1031 and 288 here), as in the code's GLM, and not all
    trials (1166 and 312). Over all trials switching does not decrease with trial here, so the result
    depends on the choice. Were the first three trials of each session left out?
- kind: methods_unavailable
  statement: For Figure S14 the Results select fields by the average within-field peak rate and the
    legend by the mean within-field rate, and neither says how the bin-wise shuffle threshold is
    reduced to one value for a field. Here 0.43 or 0.25 of switch-OFF fields fall below it, against
    the paper's 20%. Which quantity and which threshold were used?
- kind: methods_unavailable
  statement: For the 781 same-neuron pairs of switching fields the paper does not say whether pairs
    are formed within a turn or across the whole maze; here they number 271 within a turn and 615 over
    the maze. How were the pairs formed?
- kind: code_mismatch
  statement: The Methods detect place fields on trial-averaged rate maps, while the code
    (place_field_analysis.py) compares the map pooled over trials (summed counts over summed
    occupancy) with shuffles pooled the same way.
- kind: code_mismatch
  statement: The Methods and the Figure 4 legend describe repeated 5-fold stratified cross-validation
    for the GLM, while the code uses StratifiedShuffleSplit with 5 splits and 10% held out. The two
    give 0.192 and 0.169 held-out explained deviance for switching ON here.
- kind: paper_inconsistency
  statement: The Results cite Figures 4O and 4P for the relation of head scanning and switching;
    Figure 4 has no panel P (its legend ends at O).
