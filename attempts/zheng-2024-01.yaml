- claim: fig4di-switching-decreases-with-trial
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_zheng_2024.ipynb
  output: claim:fig4di-switching-decreases-with-trial
  measured:
  - -0.065
  - -0.083
  - -0.125
  - -0.145
  - 1031
  - 288
  notes: Under the adopted reading, trials from the fourth on (1031 familiar and 288 novel trials,
    against the legend's 1029 and 281), the correlation of normalised switch count with z-scored
    trial is negative and significant for familiar ON (r = -0.065, p = 0.037), familiar OFF (-0.125, p
    = 6e-05) and novel OFF (-0.145, p = 0.014), and not for novel ON (-0.083, p = 0.16); three of
    four, each smaller in size than the expected r. Over all trials (1166 and 312) none is negative and
    significant (familiar ON r = 0.072, p = 0.014; OFF -0.002; novel 0.051 and -0.021), because a
    change point needs two trials on each side within a turn, so the first trials of a session hold
    no switch. The same holds at the end. The last two trials of a session hold 0.0002 to 0.0009
    switches per field against 0.0037 to 0.0080 on the other trials from the fourth on, and with them
    also left out no correlation is significant (familiar r = 0.051 and -0.051, p = 0.12; novel 0.026
    and -0.055). The decrease seen under the adopted reading rests on these structural zeros. The
    Spearman variant gives the same as Pearson over all trials. The question of which trials is put
    to the paper's authors.
  deviations:
  - Assumed that the trials are those from the fourth on, as the code's GLM uses them; the legend's
    trial counts (1029 and 281) fit this reading (1031 and 288) and not all trials (1166 and 312).
    The outcome rests on this choice; over all trials it would be not reproduced.
