  - 5117
  notes: 5117 rows from 45 sessions. Held out under repeated 5-fold cross-validation, explained
    deviance is 0.192 (ON) and 0.128 (OFF), both within tolerance (reading a, given as measured);
    in-sample 0.202 and 0.145, also within (reading b). The three largest held-out drops are
    position, animal and number of fields for ON, as stated, but trial, number of fields and animal
    for OFF, with position fourth. The values hold and the ranking holds for ON only. The criterion's
    partial clause ("only the ranking holds") does not name this case; partially reproduced is a
    judgment, the verifier's as well. Under four other seeds the held-out values are 0.190 to 0.194
    (ON) and 0.114 to 0.121 (OFF, below 0.126). The code's split (5 shuffle splits, 10% held out)
    gives 0.167 and 0.099, with position, number of fields and trial first for OFF. The paper itself
    says trial contributes more to switching OFF.
  deviations:
  - Trials from the fourth on, and the segment cut points, from the code (behavior_and_switching.py).
  - A switch is counted in the segment of its field's peak on the change-point trial; N_field counts
    the fields of the trial's turn and the merged fields with their peak in the segment. The Methods
    say "the number of fields whose peak lied in that arm".
  - Speed and its CV are of the absolute smoothed velocity of the linearised position in the segment.
  - Held-out explained deviance is 1 minus the test deviance over that of the training mean, fitted
