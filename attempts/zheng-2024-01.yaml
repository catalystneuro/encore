  - -0.123
  - -0.144
  - 1031
  - 288
  notes: Under the adopted reading, trials from the fourth on (1031 familiar and 288 novel trials,
    against the legend's 1029 and 281), the correlation of normalised switch count with z-scored
    trial is negative and significant for familiar ON (r = -0.062, p = 0.046), familiar OFF (-0.123, p
    = 7.2e-05) and novel OFF (-0.144, p = 0.014), and not for novel ON (-0.084, p = 0.15); three of
