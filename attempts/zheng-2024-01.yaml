- claim: switch-step-size-filter
  outcome: not_reproduced
  notebook: reproduce_zheng_2024.ipynb
  output: claim:switch-step-size-filter
  measured:
  - 2825
  - 194
  notes: Over both environments 2825 fields have a significant change point (expected 3184 +- 318)
    and the code's filter removes 194 (6.9%; expected 212 +- 21). Familiar only, 2105 and 175. With the
    raw maximum as the norm, 600 are removed (21.2%). The share removed matches the paper's 7%; the
    putative count is low under every reading and every seed (2794 to 2825; removed 192 to 208). The
    smallest p is tied over several K in 647 of 2825 fields; with ties broken toward the larger K the
    filter removes 230. With the mean of per-trial maps for field detection, 2716 putative and 179
    removed.
  deviations:
  - 45 of 46 familiar sessions, which lowers counts by about 2%.
  - Place fields compare the trial-pooled rate map with shuffles pooled the same way, as the code
    does (place_field_analysis.py, ratemap_from_spk_beh_df_onetrialtype); the Methods say
    trial-averaged. The mean of per-trial maps is run as a variant.
  - A field is significant when its smallest p is at most 0.05 over the number of K, and ties of the
    smallest p go to the smaller K, as the code's test_change_point.get_n_cpd (pval <= alpha / ntest,
    pval.idxmin()). The first version required p below the bound.
  - Turn-common central-arm fields take each trial's peak rate from that trial's turn field.
  - Speed and forward locomotion as for fig1d-pv-decorrelation.
