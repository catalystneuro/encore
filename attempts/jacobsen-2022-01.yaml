- claim: figs4-nonresponsive-cells
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_jacobsen_2022.ipynb
  output: claim:figs4-nonresponsive-cells
  measured:
  - 0.912
  - 0.912
