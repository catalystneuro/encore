      values. The conclusion now says the waveform does not identify the cell and that the identity rests on the
      single curated unit per file and the Methods' statement that the tetrodes were not turned down.
  - claim: figs4-nonresponsive-cells
    agrees: true
    outcome: partially_reproduced
    reason: 'Cell 21: none of the three units is responsive in any reading or epoch. All three open-field rates
      match and the MVL matches (0.912). The peak rate of 9.02 Hz misses in all four tuning readings (10.62 to 13.92).
