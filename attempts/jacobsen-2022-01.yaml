findings:
- kind: data_missing
  statement: The dandiset holds only the optrode recordings of two mice (58313, 70375), and of these only
    the 12 curated units shown in Figures 5C, S3 and S4 (the files say "Only a curated subset of tasks
    and/or units are exported"). The histology of the single-cell tracing (Figures 2 to 4, S1, S2,
    Tables S1, S2) and the two-photon imaging (Figures 6 and 7) are not in it, and the paper names no
    other deposit, so 21 of the paper's 28 claims cannot be tested.
- kind: metadata_insufficient
  statement: The open field part of each session is not an epoch; the epochs table holds only the
    PhotoStim epochs. Its span can only be inferred from the position series.
- kind: metadata_insufficient
  statement: The two laser epochs of the day-17 session of mouse 58313 carry "N/A" for the power label
    that the dandiset description says sessions carry; the other eight files carry "10Hz20mW". Which
    epoch Figure 5C uses cannot be told from the files, as both epochs have the same pulse widths and
    intervals.
- kind: format_error
  statement: The first laser TTL event of every PhotoStim epoch has its onset at exactly the epoch start
    time and lasts 45 ms to 1.9 s (ten such events in nine files), where every other event lasts 1.0 to
    1.1 ms.
- kind: other
  statement: The STAR Methods describe 1 ms light pulses "at 10 Hz continuously"; the TTL events show
    trains of 6 pulses at 10 Hz every 2.6 s (275 pulses in a 120 s epoch).
- kind: format_error
  statement: The LFP timestamps run backwards 2 to 4 times within each file and end at 120 to 180 s,
    although each LFP series has 510,250 to 815,750 samples 4 ms apart (over 2000 s).
- kind: metadata_error
  statement: Units waveform_mean is labelled volts but its values have a peak-to-trough of 31 to 41 for
    the 70375 unit and 34 to 243 for the units of 58313, which cannot be volts; the scale is not stated.
- kind: selection_undocumented
  statement: For day 14 session 2 of mouse 70375 the file holds 2722 s of open field and 413 pulses. The
    paper's printed rate, latency and fidelity for that session (1.06 Hz, 2.95 ms, 48.00%) are what the
    first 1800 s and the first 275 pulses give (1.064 Hz, 2.95 ms, 48.00%); over the whole file the
    values are 0.899 Hz, 3.05 ms and 46.49%. The paper does not say part of the session was left out.
    The first 275 pulses are not a rule applied to every session, as for day 15 session 1 (278 pulses)
    the printed fidelity of 68.71% is what all 278 pulses give.
- kind: other
  statement: Version 0.220426.0814 of the dandiset holds 18 assets, the nine sessions under the subject
    ids 58313 and 70375 and again under the hashed ids of version 0.220422.0713. The pinned version
    0.220506.1516 holds each session once.
- kind: other
  statement: The positions of the day-17 session of mouse 58313 span 76 x 75 cm, where the other eight
    sessions span about 94 x 95 cm, consistent with the 1 x 1 m open field of the Methods. The files do
    not say whether a different box was used.
- kind: methods_unavailable
  statement: Question for the paper's authors. Figure S4 gives T4 C16 a head direction score of 0.81
    and a mean vector length of 0.90, but Rowland et al. (2018), which the STAR Methods cite for both,
    define one quantity, "Mean vector length (head-direction score)". How is the head direction score
    computed, and what binning and smoothing give the tuning curve's peak rate of 9.02 Hz? Here the
    tuning-map mean vector length is 0.912 and the peak rate 10.62 Hz with the archdata parameters; the
    peak reaches 9.02 ± 0.90 Hz only with smoothing sigmas of 4 to 14 degrees, where the mean vector
    length is 0.897 to 0.912.
- kind: methods_unavailable
  statement: Question for the paper's authors. The day-17 session of mouse 58313 has two laser epochs.
    Which epoch, at which power, gives the latency and fidelity of T1 C57 and T1 C52 in Figure 5C? Here
    T1 C57 matches the second epoch (3.90 ms, 35.64%) and T1 C52 the first (2.65 ms, 11.64%).
- kind: methods_unavailable
  statement: Question for the paper's authors. Rowland et al. (2018), cited for the cell classification,
    shift spike trains "by a random interval between ± 20 s". Was the shift within 20 s, or at least 20 s
    as in the papers they cite? The border cell T4 C50 passes the second (0.656 against 0.555) and not
    the first (0.656 against 0.663).
verifications:
- date: '2026-11-15'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The executed notebook of the first run with the conclusion cells and the summary removed, the
    helper module and the claims file, with the paper; the verifier checked the archive for the blocked claims and
    tested the helper functions on synthetic data. Report in transcripts/jacobsen-2022/verifier-1-report.md. Points
    without a claim of their own, with the response. B1 (cell 0 said earlier versions hold the same 9 assets; 0.220426.0814
    holds 18), the header is corrected and a cell lists the assets of every version. B8 (border score walls are
    the edges of the tracked extent; a uniformly firing cell scores 0.48), stated in the helper docstring; the shuffle
    thresholds take in that baseline, so no change to the method. B9 (latency_fidelity uses side="right", immaterial
    at a 48 kHz spike clock), no change. Cell numbers in the reasons below refer to the round-1 notebook;
    in the current notebook cells 11, 14, 16, 19, 21, 23 and 25 are cells 13, 18, 21, 26, 29, 32 and 35.
  results:
  - claim: fig5c-functional-cell-types
    agrees: true
    outcome: reproduced
    reason: 'Cell 11, standard shuffle: grid cells T1 C89 and T1 C50, a head direction cell T4 C16 (MVL 0.912, stability
      0.97) and a border cell T4 C50 (0.656 against a threshold of 0.555). Under the literal ±20 s shuffle, T4 C50
      narrowly fails (0.656 against 0.663), so no border cell is found under that reading. The literal reading includes
      near-zero shifts that leave tuning intact, which inflates thresholds; it is not field practice, and the verifier
      treats standard as the operative reading. The standard shuffle is lenient for MVL (the 70375 unit is a head
      direction cell in one of six sessions with MVL 0.123 against 0.082), which does not change the outcome. The
      curated deposit means "at least one of each type" partly reflects what was deposited (B2, B7).'
    response: Outcome kept. Quoted the shuffle sentence of Rowland et al. (2018) in the notebook and helper and
      noted that the archdata code has no spatial shuffle. Added the shuffled MVL distribution of T4 C16 under both
      readings (literal 95th percentile 0.762, maximum 0.912; standard 0.225 and 0.272), the leniency of the standard
      shuffle for the 70375 unit, and the curated deposit to the conclusion and notes. Ran the classification for
      all 12 units on the first 1800 s of the open field; no class changes.
  - claim: fig5c-responsive-grid-cell
    agrees: true
    outcome: reproduced
    reason: 'Cell 14, onset reading: T1 C89 has latency 2.75 ms and fidelity 40.73%, and is a grid cell under both
      shuffles. Under onset, 9 unit-sessions are responsive; 6 of them are the single unit of 70375.'
    response: No change needed.
  - claim: fig5c-example-cells
    agrees: true
    outcome: reproduced
    reason: 'Cell 16, onset: all nine values are within tolerance. C57 matches on laser epoch 2 and C52 on epoch
      1; no single epoch choice fits both. With both epochs pooled, C52''s latency is 2.358 ms against a floor of
      2.385, which would make this partial. The criterion allows trying each of a day''s sessions, not each laser
      epoch within one session; the verifier accepts the per-epoch choice given the exact matches, but the outcome
      depends on it (B3).'
    response: Outcome kept, marked as resting on the per-epoch choice. Added a cell listing what the file holds
      for each day-17 epoch (power "N/A" in both, the same pulse widths and intervals as each other and the other
      files), the spikes of each unit per epoch, and the latency and fidelity of each unit in each epoch; nothing
      in the file tells the epochs apart. The conclusion and notes now say the per-epoch choice goes beyond the
      criterion.
  - claim: figs3-stable-input-cell
    agrees: true
    outcome: partially_reproduced
    reason: 'Cell 19, onset: 17 of 18 values match and the unit is responsive in 6 of 6 sessions. The miss is the
      day 14 session 2 rate, 0.899 Hz against 1.06 ± 0.106. Over the first 1800 s it is 1.064 Hz, and the first
      275 pulses give 2.95 ms and 48.00% exactly, but that variant was not a declared reading. The open field as
      the full span of the position series is the author''s choice and not stated as an assumption (B4). The waveform
      test does not identify the cell, as correlations with the other mouse reach 0.965, above the within-cell minimum
      of 0.918 (B6).'
    response: Outcome kept. The open field as the whole position series is now stated as an assumption in the notebook,
      helper and record, and the first 1800 s reading is run for every unit (rates and classes) with the first 275
      pulses of each session; under it all 18 values match, and it moves no other rate by more than 0.001 Hz and
