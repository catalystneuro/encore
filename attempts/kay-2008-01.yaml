findings:
- kind: data_missing
  statement: The data set holds the two subjects' five main sessions only. The two later S1 sessions
    and the session about 14 months later, the 999-image library of the set-size analyses, and the
    multifocal retinotopic mapping scans are not in it (the readme says the localizer scans are not
    included). Seven of the paper's findings cannot be tested for this reason.
- kind: metadata_insufficient
  statement: The data set gives the repeated-trial response estimates without their standard errors
    and holds no single-trial estimates, so the SNR of Supplementary Table 1 and the single-trial
    results of Figure 4a can be had only by refitting the BRS model to every voxel's time series.
- kind: metadata_error
  statement: The readme says the .mat files are MATLAB 7.3 (HDF5) files readable with PyTables;
    Stimuli.mat and mask.mat are MATLAB 5 files, which h5py and PyTables cannot open. It gives
    Stimuli_Trn_FullRes_15.mat as 70 x 120 x 120; it holds 70 images of 500 x 500.
- kind: metadata_insufficient
  statement: 345 V1 to V3 voxels of S1 and 214 of S2 (and 15 S1 V4 voxels) have NaN responses in
    EstimatedResponses.mat; the readme does not mention them or say why.
- kind: metadata_insufficient
  statement: The readme does not say whether voxIdx is 0-based or 1-based in the 64 x 64 x 18 volume,
    or how it relates to the paper's voxel numbers (Figure 2 names voxel 42205, which voxIdx holds
    for one S1 V1 voxel).
- kind: metadata_error
  statement: The NIfTI headers of the time series give a TR of 0 (pixdim[4]); the TR of 1 s is only in
    the paper.
- kind: methods_unavailable
  statement: The final model's field of view is "specifically tailored to the estimated RF
    location" (SM 5), with no rule given. Identification depends on it here; with the square of
    +/-2 SD of the fitted Gaussian the paper's 92% and 72% are reproduced (90.8% and 72.5%), with
    the best initial model's field of view the result is 75.8% and 46.7%. Which rule, and at which
    of the 25 resolutions, did the paper use?
- kind: methods_unavailable
  statement: SM 6 does not say whether the grating tuning curves include the DC offset, whether the
    gratings were restricted to the stimulus aperture, or how ROI-averaged curves combine voxels
    whose fields of view, and so whose spatial frequencies in cycles per degree, differ. Here the V1
    average is high-pass under every choice tried, where Supplementary Figure 7 shows it band-pass.
- kind: methods_unavailable
  statement: Supplementary Figure 11 omits voxels whose RF was "not completely within the stimulus
    bounds"; whether the bounds are the 20 degree square or the circular aperture changes whether
    V1 < V2 < V3 holds in most eccentricity bins here.
- kind: paper_inconsistency
  about: paper
  statement: SM 5 gives the initial fields of view as 10.1 and 5.2 degrees, but at 128 px the
    resolution list of SM 6 gives 10.0 (256 px) and 5.12 (500 px) degrees; and a 1-octave bandwidth
    with an isotropic Gaussian gives an orientation bandwidth of about 37 degrees, not the 41 stated.
