- claim: fig4a-single-trial
  outcome: blocked
  blocked_by: too_large
  notes: The data set holds no single-trial responses, only the raw time series (70 runs) and the
    repeated-trial estimates. Single-trial amplitudes need the BRS model (SM 3 and 4) fitted to every
    voxel's time series, first with a Fourier basis per session to get its HRF, then with one
    amplitude per trial (1,024 trials and 28 polynomial terms on 4,752 time points per session)
    and first-order autoregressive noise, iterated to convergence; each voxel has its own design
    after the HRF and the noise transform. The notebook streams one run (2.7 s) and times one
    single-trial solve at 0.24 s, which gives about 615 minutes for the 10,228 V1 to V3 voxels of
    both subjects, 5 sessions and 3 iterations, before the HRF fits. This is over the notebook limit
    and the time left in the run. Nothing was computed on single trials.
- claim: fig4a-noise-ceiling
  outcome: blocked
  blocked_by: too_large
  notes: Needs the single-trial patterns of fig4a-single-trial, which are blocked as too large.
- claim: fig4b-set-size-1000
  outcome: blocked
  blocked_by: data_missing
