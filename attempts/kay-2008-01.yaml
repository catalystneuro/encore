outcomes:
- claim: fig3-s1-repeated-120
  outcome: reproduced
  notebook: reproduce_kay_2008.ipynb
  output: claim:fig3-s1-repeated-120
  measured:
  - 90.8
  notes: Under O1 (a) with O5 (a), 109 of 120 S1 images are identified (90.8%, paper 110 of 120),
    binomial p against chance 1/120 of 2.5e-212; O1 (b) with O5 (a) also gives 109. With the final
    model over the best initial model's field of view (O5 b) it is 91 of 120 (75.8%) under both
    readings of O1, outside tolerance, and the best initial models alone give 96. Ten bootstrap fits
    give 90 under O5 (b). The value holds under the O5 (a) readings, as the criterion allows.
  deviations:
  - Each model is fitted once by gradient descent with early stopping; the paper's final parameters
    are the mean of 100 bootstrap fits (SM 6, "Estimation of variance"), not run for time. Ten
    bootstrap fits, run as a variant under O5 (b), change the result by one image (S1) and three
    (S2).
  - One stopping set (20% of the 1,750 responses) is drawn per fit and shared by the voxels fitted
    together, a standard choice for a random draw (SM 6 draws one per fit).
  - The initial fields of view are 10.0 and 5.12 degrees, from the paper's resolution list
    min(500, round(2^(9 - x/8))) (SM 6); the paper states 10.1 and 5.2 degrees (SM 5), which the
    list does not give.
  - The Gaussian SD of each wavelet follows from a 1-octave spatial frequency bandwidth (full width
    at half maximum), which gives an orientation bandwidth of 37 degrees where SM 6 states 41 (O3,
    standard choice). Wavelet centres at the grid cell centres (O3).
  - Stimulus values are taken as linear in luminance (O4); the goggles' response is not given.
  - Stimuli are resampled by area averaging; SM 6 does not say how.
  - An isotropic Gaussian with a constant offset is fitted to each initial model's envelope at 32 x
    32; SM 5 says only "an isotropic two-dimensional Gaussian".
  - The significance of predictive power is by 1,000 bootstrap resamples of the 120 image pairs
    (O2, standard choice).
  - The responses are the data set's estimated repeated-trial responses, z-scored per voxel by the
    data set; the paper standardized per session (SM 3). Voxels with NaN responses are left out
    (S1 345, S2 214 of V1 to V3).
  - The p-values that pick the O1 (a) candidate voxels use all 120 identification images, the one
    being identified included, where P5 leaves that image out; O1 (b), which has no such step,
    gives the same S1 count and one image fewer for S2.
  - The stopping rule is read as stopping at the first iteration whose stopping-set error does not
    decrease, so a fit whose first step raises that error keeps the zero kernel and the voxel has
    no model (about 30% of the initial fits).
