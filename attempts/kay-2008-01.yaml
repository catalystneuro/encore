- claim: fig2-representative-voxel
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_kay_2008.ipynb
  output: claim:fig2-representative-voxel
  notes: The data set's voxIdx holds 42205 for one S1 voxel, in V1, taken to be the paper's voxel.
    Its best initial model has r = 0.75 and its Gaussian centre is (-3.89, -0.57) deg. Under O5 (a),
    the reading adopted, the envelope peaks at (-3.42, +0.24) deg, left of the vertical meridian but
    0.24 degrees above the horizontal one; the SF tuning is highest at the highest frequency, 2.94
    cycles/deg; the orientation tuning's max/min is 2.23 without the DC offset and 16.2 with it, so
    the broadband rule fails. Left hemifield and high-pass hold; just below and broadband do not.
    Under O5 (b) the peak is at (-4.22, -0.47), SF tuning is highest at the highest frequency (0.80
    cycles/deg) and the max/min is 1.77 without the DC offset (6.54 with it), so all three parts hold
    without the DC offset.
  deviations:
  - The readings differ in outcome. O5 (a) is adopted as an assumption, as the paper best supports
    it; its 5.45 degree field of view gives a highest frequency of 2.94 cycles/deg, the end of the
    spatial frequency axis of Figure 2b (2.9), where the O5 (b) model's ends at 0.80, and only O5
    (a) reproduces the identification results.
  - Tuning curves are taken without the DC offset, as an assumption; SM 6 does not say whether the
    tuning curves include it, and with it the minimum of the orientation curve is near zero, which
    makes the max/min rule fail under both readings.
  - The paper does not say how it numbers voxels; voxIdx is assumed to be its numbering.
- claim: suppfig7-roi-tuning
  outcome: not_reproduced
  notebook: reproduce_kay_2008.ipynb
  output: claim:suppfig7-roi-tuning
  notes: Over all V1 voxels with a final model (1,084 in S1 and 1,083 in S2), the mean spatial
    frequency curve rises to the highest level (16 cycles per field of view) under O5 (a) and (b), in
    both subjects, with or without the DC offset, with gratings over the field of view or inside the
    stimulus aperture, and for the median over voxels; it is high-pass, not band-pass. The
    orientation curve's range is 31% to 449% of its mean, against the 10% rule. Under O5 (a) a few
    voxels with very large responses to full-field gratings dominate the mean (SE up to about 740);
    gratings inside the aperture remove them (orientation range 42.5% in S1 and 31.4% in S2) without
    changing the spatial frequency curve's shape. Reading (b) of the models (model I of the
    constrained models) and reading (b) of the voxels were not run.
  deviations:
  - The curves are averaged over each model's five spatial frequency levels in cycles per field of
    view, as the fields of view differ between voxels; the paper does not say how the curves of
    voxels with different fields of view are combined.
  - Grating amplitude 0.5, a standard choice that scales but does not shape the curves.
