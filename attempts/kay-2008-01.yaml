- claim: suppfig11-rf-size-eccentricity
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_kay_2008.ipynb
  output: claim:suppfig11-rf-size-eccentricity
  notes: RF size increases with eccentricity in each area under both filters run (Spearman rho
    0.535 to 0.676, p < 1e-26). With RFs inside the circular aperture (V1 626, V2 684, V3 285 voxels
    over both subjects) the medians order V1 < V2 < V3 in 3 of the 6 shared 1 degree bins and 3 of 9
    shared 0.5 degree bins, not most. Only with RFs inside the 20 degree square and 1 degree bins
    does the order hold in most bins (5 of 8; 6 of 12 with 0.5 degree bins). The first part of the
    claim holds and the area order does not.
  deviations:
  - The legend's "estimated RF location was not completely within the stimulus bounds" is read as
    the RF inside the circular aperture, as an assumption; Figure 2's legend calls the white circle
    "the bounds of the stimulus". The filter run requires a disc of 2 SD around the RF centre to lie
    inside the mask's radius (9.5 degrees, from its area), not the +/-2 SD square of SM 5 inside the
    paper's 10 degree radius; that filter was not run in the executed notebook. The first version of
    this record adopted the 20 degree square, under which the order holds in most 1 degree bins.
- claim: suppdisc1-classification-extension
  outcome: not_reproduced
  notebook: reproduce_kay_2008.ipynb
  output: claim:suppdisc1-classification-extension
  notes: The luminance metric is not above chance under any reading (0 to 3 of 120, p >= 0.08), as
    in the paper. The contrast metric is above chance at p < 0.0001 only for S1 with the 500 voxels
    of P5 and the SD measure (9 of 120, p = 8.8e-07, paper 6); for S2 it is 1 or 2 of 120 (p >= 0.26)
    under every reading, against 7 in the paper. No reading gives the paper's significance pattern.
  deviations:
  - For the relative contrast reading, stimulus values are shifted to start at 0, as the absolute
    luminance is not given. Image similarity uses the full 500 px images, blocks of 15 px (0.6
    degrees).
- claim: suppm7-selected-voxels-v1
  outcome: not_reproduced
  notebook: reproduce_kay_2008.ipynb
  output: claim:suppm7-selected-voxels-v1
  notes: Under O1a-O5a, 48% of the selected voxels lie in V1 in both subjects under both readings of
    the selection (V2 41 to 42%, V3 10 to 11%); O1b-O5a gives the same, and the O5 (b) readings give
    42 to 43%. V1 holds the largest share but not more than half.
findings:
- kind: data_missing
  statement: The data set holds the two subjects' five main sessions only. The two later S1 sessions
    and the session about 14 months later, the 999-image library of the set-size analyses, and the
    multifocal retinotopic mapping scans are not in it (the readme says the localizer scans are not
    included). Seven of the paper's findings cannot be tested for this reason.
- kind: metadata_insufficient
  statement: The data set gives the repeated-trial response estimates without their standard errors
    and holds no single-trial estimates, so the SNR of Supplementary Table 1 and the single-trial
    results of Figure 4a can be had only by refitting the BRS model to every voxel's time series.
- kind: metadata_error
  statement: The readme says the .mat files are MATLAB 7.3 (HDF5) files readable with PyTables;
    Stimuli.mat and mask.mat are MATLAB 5 files, which h5py and PyTables cannot open. It gives
    Stimuli_Trn_FullRes_15.mat as 70 x 120 x 120; it holds 70 images of 500 x 500.
- kind: metadata_insufficient
  statement: 345 V1 to V3 voxels of S1 and 214 of S2 (and 15 S1 V4 voxels) have NaN responses in
    EstimatedResponses.mat; the readme does not mention them or say why.
- kind: metadata_insufficient
  statement: The readme does not say whether voxIdx is 0-based or 1-based in the 64 x 64 x 18 volume,
    or how it relates to the paper's voxel numbers (Figure 2 names voxel 42205, which voxIdx holds
    for one S1 V1 voxel).
- kind: metadata_error
  statement: The NIfTI headers of the time series give a TR of 0 (pixdim[4]); the TR of 1 s is only in
    the paper.
- kind: methods_unavailable
  statement: The final model's field of view is "specifically tailored to the estimated RF
    location" (SM 5), with no rule given. Identification depends on it here; with the square of
    +/-2 SD of the fitted Gaussian the paper's 92% and 72% are reproduced (90.8% and 72.5%), with
    the best initial model's field of view the result is 75.8% and 46.7%. Which rule, and at which
    of the 25 resolutions, did the paper use?
- kind: methods_unavailable
  statement: SM 6 does not say whether the grating tuning curves include the DC offset, whether the
    gratings were restricted to the stimulus aperture, or how ROI-averaged curves combine voxels
    whose fields of view, and so whose spatial frequencies in cycles per degree, differ. Here the V1
    average is high-pass under every choice tried, where Supplementary Figure 7 shows it band-pass.
- kind: methods_unavailable
  statement: Supplementary Figure 11 omits voxels whose RF was "not completely within the stimulus
    bounds"; whether the bounds are the 20 degree square or the circular aperture changes whether
    V1 < V2 < V3 holds in most eccentricity bins here.
- kind: paper_inconsistency
  about: paper
  statement: SM 5 gives the initial fields of view as 10.1 and 5.2 degrees, but at 128 px the
    resolution list of SM 6 gives 10.0 (256 px) and 5.12 (500 px) degrees; and a 1-octave bandwidth
    with an isotropic Gaussian gives an orientation bandwidth of about 37 degrees, not the 41 stated.
verifications:
- date: '2026-11-14'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: The first executed notebook with the conclusion cells and the summary removed, the helper
    module vim1.py and the claims file, with the paper under paper/. The verifier read the archive's
    file list and tested the helpers on synthetic inputs (area_matrix, resize_stack, gwp, fit_gd,
    loo_power, identify_repeated, boot_p, fit_gaussian). It had no attempt record.
  results:
  - claim: fig3-s1-repeated-120
    agrees: true
    outcome: reproduced
    reason: Cell 11 gives 109/120 (90.8%) under O1a-O5a and O1b-O5a, within 92 +/- 9.2. Both O5b
      readings give 75.8%, outside tolerance. Chance is 1/120, as in the paper. The O1a candidate
      p-values use all 120 identification images, including the one being identified, where P5
      leaves it out; O1b, which has no such leak, gives 109. The 10-fit bootstrap variant was run
      only for O5b, not for O5a. Every result comes from one seed.
    response: The leak and the stopping-rule reading (about 30% of initial fits stop at iteration 0)
      are now deviations, and the stopping rule is stated in the helper's docstring. Not run, for
      time, the bootstrap variant under O5 (a) (one fit per voxel already takes about 28 minutes for
      the 7,905 voxels) and other seeds.
  - claim: fig4a-s2-repeated-120
    agrees: true
    outcome: reproduced
    reason: Cell 11 gives 87/120 (72.5%, O1a-O5a) and 86/120 (71.7%, O1b-O5a), within 72 +/- 7.2. O5b
      gives 46.7%. O1b gives 86 against 87 under O1a.
    response: As fig3-s1-repeated-120.
  - claim: fig4a-single-trial
    agrees: true
    outcome: blocked
    reason: Not run. The cost estimate in cell 16 is inflated; it times lstsq on a random dense matrix
      and scales it to all 10,228 V1 to V3 voxels of both subjects and to the training runs as well.
      Reading O6 (a) needs single-trial amplitudes only from the identification runs, and only for
      candidate voxels. The 70 raw runs are on the archive, and reading O6 (a) is testable.
    response: Agreed that the estimate overstated the cost; the notebook and the record now say so.
      A vectorized BRS fit (repeated-trial HRF and amplitudes with standard errors, single-trial
      amplitudes) was written and run while preparing on two S1 sessions, and a second notebook was
      built on it, but the full run of the entry with it did not finish within this revision's
      time, so the entry was returned to the verified notebook and the claim stays blocked.
  - claim: fig4a-noise-ceiling
    agrees: true
    outcome: blocked
    reason: Needs single-trial patterns. It becomes testable once those exist. The claims file gives
      13 or 14 trials per image; cell 4 shows 13, 14 or 15 presentations per image across all runs.
    response: Stays blocked with fig4a-single-trial. The trial counts are asked of a reader in
      questions/kay-2008.yaml, with a second question on the sample size of the predicted patterns
      in SM 7's simulation.
