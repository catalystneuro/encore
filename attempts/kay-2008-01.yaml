    outcome: blocked
    reason: The archive listing has no 999-image library.
    response: No change.
  - claim: fig4b-extrapolation
    agrees: true
    outcome: blocked
    reason: Needs the library.
    response: No change.
  - claim: fig4c-retinotopy-only-extrapolation
    agrees: true
    outcome: blocked
    reason: Needs the library.
