  notes: Under O1 (a) with O5 (a), 87 of 120 S2 images are identified (72.5%, paper 86); O1 (b) with
    O5 (a) gives 86 (71.7%). Under O5 (b) it is 56 of 120 (46.7%) for both readings of O1, and 59
