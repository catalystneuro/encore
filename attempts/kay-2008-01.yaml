- claim: errors-similar-images
  outcome: reproduced
  notebook: reproduce_kay_2008.ipynb
  output: claim:errors-similar-images
  notes: Under reading (b), local RMS contrast in 0.6 degree blocks, the 44 errors of O1a-O5a pooled
