findings:
- kind: metadata_error
  statement: The trial-table column rule_belief equals P(rule A) - P(rule B) in all 300 sessions, recomputed from
    the stored association matrix, and correlates negatively with the current rule being B (median r -0.73). The
    paper's Methods and the dataset's tutorial notebook both define it as positive for rule B. The other strategy
    columns match the Methods' formulas exactly.
- kind: selection_undocumented
  statement: The paper's session counts cannot be recovered from the files. With session fraction correct excluding
    visually guided trials (the Methods' rule for all analyses) there are 291 sessions above 0.5, 154 above 0.65
    and 100 layer 2/3 sessions above 0.65 (69,707 neurons), against the paper's 253, 216 and 141 (93,881 neurons).
    With all trials there are 297, 238 and 150 (97,989 neurons). Only the last matches the neuron counts within
    10%. No file marks which sessions the paper analysed.
- kind: paper_inconsistency
  statement: The paper says the fraction of visually guided trials typically varied from 0 to 20%; in the files
    the median session has 23% and 222 of 300 sessions have more than 20% (up to 78%).
- kind: data_missing
  statement: The photoinhibition experiments (7 VGAT-ChR2 mice, 164 sessions; Figures 1J to 1M, S1K to S1M, S2M)
    are not in the dandiset, and the paper names no other archive for them. Three of the paper's findings cannot
    be tested.
- kind: other
  statement: The dandiset holds no GLM fits, encoding strengths or population decoders, on which 29 of the 43 claims
    rest. Refitting them is estimated at several hundred CPU hours, so these findings cannot be checked against
    the deposit without the derived results or far more compute.
- kind: other
  statement: 7 of 300 sessions have a 150-unit (1.5 m) maze stem where the paper describes a 200-unit stem; the
    TaskParam metadata records it. The analyses here use each session's own stem length.
- kind: methods_unavailable
  statement: Question for the paper's authors. How was the rule update per trial (Δ rule belief) of visually guided
    and normal trials computed (STAR Methods, Decision-making strategy variables)? Taking it as the change from
    trial t to t + 1 gives a larger update for visually guided trials (0.055 against 0.022, p < 0.001); from t -
    1 to t gives none (0.030 against 0.027, p = 0.48); both give values 2 to 5 times the reported 0.013 and 0.0080.
- kind: methods_unavailable
  statement: Question for the paper's authors. Was the 65% session threshold applied to fraction correct over all
    trials, including visually guided ones? Only that reading comes near the 141 sessions and 93,881 neurons, but
    it gives 238 sessions where the supplement reports 216, and no reading gives the 253 sessions above 0.5.
