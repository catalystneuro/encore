  assumed: true
  notes: With session fraction correct over all trials, 150 layer 2/3 sessions above 0.65 hold 97,989 neurons from 8 mice
    (V1 15,497, PM 10,313, AM 15,225, MM 10,654, RSC 23,728, A 22,572), each within its tolerance; the area shares are within
