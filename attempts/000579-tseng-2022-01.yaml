outcomes:
- claim: neuron-counts
  outcome: reproduced
  notebook: reproduce_tseng_2022.ipynb
  output: claim:neuron-counts
  measured:
  - 97989
  - 150
  - 8
  - 15497
  - 10313
  - 15225
  - 10654
  - 23728
  - 22572
  assumed: true
  notes: With session fraction correct over all trials, 150 layer 2/3 sessions above 0.65 hold 97,989 neurons from
    8 mice (V1 15,497, PM 10,313, AM 15,225, MM 10,654, RSC 23,728, A 22,572), each within its tolerance; the area
    shares are within 0.006 of the paper's. With visually guided trials excluded from fraction correct, 100 sessions
    and 69,707 neurons remain and only the mouse count is within tolerance. The files hold 278,155 neurons in 300
    sessions, the paper's total, so the stored sources are the paper's neurons; the paper's list of 141 sessions
    cannot be recovered.
  deviations:
  - Sessions above 0.65 are selected on fraction correct over all trials, an assumption (Methods, Classification
    of the sources, gives 141 layer 2/3 sessions above 65% correct; Behavioral training says visually guided trials
    are excluded from all analyses). Only fraction correct over all trials gives counts near the paper's (150 layer
    2/3 sessions, 97,989 neurons); with visually guided trials excluded there are 100 and 69,707. Both selections
    are shown.
  - The paper's cell-body classifier is not in the files; the stored sources are taken as the cell bodies, since
    their total equals the paper's 278,155 neurons.
- claim: fig1d-switch-performance
  outcome: reproduced
  notebook: reproduce_tseng_2022.ipynb
  output: claim:fig1d-switch-performance
  notes: Over 601 switches in 297 sessions above 0.5 (fraction correct over all trials), the end of the block before
    the switch is 0.807, the fitted initial performance after the switch 0.226 ± 0.016 (no bootstrap sample at or
    above 0.5), the fitted end performance 0.727 ± 0.026, and end minus initial 0.501 ± 0.038 (p < 1e-4). With visually
    guided trials excluded from the selection, 589 switches give 0.225 and 0.730. The end mean is above 0.7, but
    15% of bootstrap samples are at or below it. With a free sigmoid midpoint the initial value is 0.317. The paper
    reports 506 to 513 switches.
  deviations:
  - The sigmoid's t0 is fixed at the block's first trial, as the Methods state (Task performance analysis); a free
    midpoint is shown as a variant. Rates are kept in (0, 1) by the fit's parametrisation, the claims file's standard
    choice.
  - The session selection above 0.5 matches no reading of the paper's 253 sessions (291 or 297 here); both readings
    are shown and agree.
- claim: lstm-choice-accuracy
  outcome: reproduced
  notebook: reproduce_tseng_2022.ipynb
  output: claim:lstm-choice-accuracy
  measured: 0.772
  assumed: true
  notes: Accuracy of the stored predictions is 0.772 over all 300 sessions (SD 0.064 over sessions; 0.771, SD 0.043
    over mice). Above 0.65 it is 0.792 (visually guided excluded from the selection, 154 sessions) and 0.769 (all
    trials, 238 sessions). Every reading is within 0.051 of 0.802. Per mouse 0.705 to 0.826.
  deviations:
  - The LSTM was not refit. The association matrices stored in the trial tables are taken as the paper's held-out
    (leave-one-session-out) predictions, an assumption, as the files do not say how they were produced; the Methods
    (LSTM model) describe only held-out predictions being used for analysis.
- claim: figs1h-lstm-beats-rl
  outcome: reproduced
  notebook: reproduce_tseng_2022.ipynb
  output: claim:figs1h-lstm-beats-rl
  notes: On the 238 sessions above 0.65 (all trials), held-out log2 likelihood per trial is -0.710 for the LSTM
    and -0.732 for RL model 4; the LSTM is higher in 185 sessions, Wilcoxon p = 4.65e-22 (paper 5.95e-22, 216 sessions).
    On the 154 sessions of the other selection, -0.667 against -0.691, p = 1.42e-17. The LSTM is ahead in all 8
    mice.
  deviations:
  - RL model 4 was refit in Python (L-BFGS-B with bounds, three starting points) in place of Matlab's fminunc, leave-one-session-out
    over all sessions of each mouse (Methods, Reinforcement learning model). The lapse is the mixture (1 - lambda)
    P + lambda/2 (claims file), the bias inside the inverse temperature as printed, and visually guided trials update
    the model but are left out of the likelihood, as for the LSTM.
  - The LSTM side uses the stored predictions (see lstm-choice-accuracy).
- claim: fig1i-strategy-after-switch
  outcome: reproduced
  notebook: reproduce_tseng_2022.ipynb
  output: claim:fig1i-strategy-after-switch
  notes: Under both windows (10 and 20 trials) and both session selections, rule-following before the switch is
    0.23 to 0.26 (p < 1e-4 against zero) with choice bias 0.13 to 0.16; the probability of the actual choice drops
    by 0.14 to 0.17 (p < 1e-4) with a switch-aligned minimum of 0.570 to 0.578; bias-following rises by 0.029 to
    0.045 (p <= 4e-4); rule-following rises from 0.04 to 0.07 in the first window to 0.21 to 0.22 at the end of
    the block (p < 1e-4). Recovered switches number 320 (all-trial selection) and 251, against the paper's 265.
  deviations:
  - Strategy variables are those stored in the files, not refit.
  - The end of the block is taken as its last W non-visually guided trials; the claims file says only 'by the end
    of the block'.
- claim: visually-guided-rule-update
  outcome: not_reproduced
  notebook: reproduce_tseng_2022.ipynb
  output: claim:visually-guided-rule-update
  measured:
  - 0.0545
  - 0.0215
  assumed: true
  notes: With the update of trial t taken as rule belief on t + 1 minus that on t, visually guided trials update
    more than normal trials over the 30 trials after a switch, 0.0545 ± 0.0075 against 0.0215 ± 0.0029, difference
    0.0329, p < 0.001 (302 switches; the other selection gives 0.0591 against 0.0236, p = 0.002). On correct trials
    only there is no difference (0.068 against 0.076, p = 0.22; paper p = 0.89). With the update taken as t minus
    t - 1, no difference is found (0.0295 against 0.0267, p = 0.48). Both values are 2 to 5 times the paper's 0.013
    and 0.0080 under every reading, outside the tolerances. The question of how the update was defined is put to
    the paper's authors (findings).
  deviations:
  - Assumed. The Methods (Decision-making strategy variables) do not say which difference of rule belief is a trial's
    update. The LSTM's belief on trial t is conditioned on trials 1 to t - 1 (Methods, LSTM model), so the change
    from t to t + 1 is the one trial t causes; this reading is adopted. The change from t - 1 to t is shown.
  - Rule belief is recomputed from the stored association matrix with the Methods' sign, as the stored column has
    the opposite sign (findings).
  - Sessions above 0.65 are selected on fraction correct over all trials, an assumption (Methods, Classification
    of the sources, gives 141 layer 2/3 sessions above 65% correct; Behavioral training says visually guided trials
    are excluded from all analyses). Only fraction correct over all trials gives counts near the paper's (150 layer
    2/3 sessions, 97,989 neurons); with visually guided trials excluded there are 100 and 69,707. Both selections
    are shown.
