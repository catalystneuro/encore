findings:
- kind: metadata_error
  statement: The trial-table column rule_belief equals P(rule A) - P(rule B) in all 300 sessions, recomputed from the stored
    association matrix, and correlates negatively with the current rule being B (median r -0.73). The paper's Methods and
    the dataset's tutorial notebook both define it as positive for rule B. The other strategy columns match the Methods'
    formulas exactly.
- kind: metadata_error
  statement: In the single-plane sessions the timestamps of the deconvolved activity, labelled seconds, are 2000 times the
    behaviour clock (for example 25356 against 12.678 s at the first frame), while the planes have exactly one frame per
    behaviour frame. Matching activity to behaviour by these timestamps puts every frame at the end of the session.
- kind: selection_undocumented
  statement: The paper's session counts cannot be recovered from the files. With session fraction correct excluding visually
    guided trials (the Methods' rule for all analyses) there are 291 sessions above 0.5, 154 above 0.65 and 100 layer 2/3
    sessions above 0.65 (69,707 neurons), against the paper's 253, 216 and 141 (93,881 neurons). With all trials there are
    297, 238 and 150 (97,989 neurons). Only the last matches the neuron counts within 10%. No file marks which sessions
    the paper analysed.
- kind: paper_inconsistency
  statement: The paper says the fraction of visually guided trials typically varied from 0 to 20%; in the files the median
    session has 23% and 222 of 300 sessions have more than 20% (up to 78%).
- kind: data_missing
  statement: The photoinhibition experiments (7 VGAT-ChR2 mice, 164 sessions; Figures 1J to 1M, S1K to S1M, S2M) are not
    in the dandiset, and the paper names no other archive for them. Three of the paper's findings cannot be tested.
- kind: other
  statement: The dandiset holds no GLM fits, encoding strengths or population decoders, on which 29 of the 43 claims rest.
    Refitting the GLM is estimated at about 730 CPU hours, so the 24 GLM claims cannot be checked against the deposit without
    the derived results or far more compute; the decoders were refit here on a subsample of sessions.
- kind: other
  statement: 7 of 300 sessions have a 150-unit (1.5 m) maze stem where the paper describes a 200-unit stem; the TaskParam
    metadata records it. The analyses here use each session's own stem length.
- kind: methods_unavailable
  statement: Question for the paper's authors. How was the rule update per trial (Δ rule belief) of visually guided and
    normal trials computed (STAR Methods, Decision-making strategy variables)? Taking it as the change from trial t to t
    + 1 gives a larger update for visually guided trials (0.055 against 0.022, p < 0.001); from t - 1 to t gives none (0.030
    against 0.027, p = 0.48); both give values 2 to 5 times the reported 0.013 and 0.0080.
- kind: methods_unavailable
  statement: Question for the paper's authors. Was the 65% session threshold applied to fraction correct over all trials,
    including visually guided ones? Only that reading comes near the 141 sessions and 93,881 neurons, but it gives 238 sessions
    where the supplement reports 216, and no reading gives the 253 sessions above 0.5.
- kind: metadata_insufficient
  statement: The Figure 8C legend has 698 decoders (100 in V1) from sessions with the cue offset at 0.76 of the maze, but
    the TaskParam cue delay length gives that offset (60 of 250 maze units) for only 8 of the 184 layer 2/3 sessions, none
    with a field in V1 or AM; most sessions have a delay of 10 units (offset 0.96) or none. Which variable marks the paper's
    cue offset is not described.
verifications:
- date: '2026-10-31'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The executed notebook with the conclusion cells and the summary removed, the helper module and the
    claims file, with the paper. The verifier checked the archive's asset list for the blocked claims and tested hboot and
    fit_block_sigmoid on synthetic inputs. 38 of its 43 outcomes agree with the record; it disagreed with the too_large
    block of fig3q-cue-decoding, fig4d-partial-correlation, figs5f-dynamic-choice-decoding and fig8cd-position-specific-decoders,
    and gave fig4h-activity-by-epoch as not reproduced.
  results:
  - claim: neuron-counts
    agrees: true
    outcome: reproduced
    reason: 'Under selection (b), session fraction correct over all trials, all 9 quantities are within tolerance: 97,989
      neurons, 150 sessions, 8 mice, and all six area counts. Under (a) everything except mice fails. The file total of
      278,155 equals the paper''s, so no cell-body filter is missing. Neither fraction-correct definition reproduces the
      paper''s session counts, the neuron counts support (b), yet the notebook treats (a) as the main reading.'
    response: No change of outcome. Reading b is now stated as the adopted reading in the session-selection section, the
      helper's docstring and the summary, with reading a shown throughout.
  - claim: fig1d-switch-performance
    agrees: true
    outcome: reproduced
    reason: Initial 0.225 (< 0.5). End 0.730 (> 0.7). End minus initial 0.50, p < 1e-4. The end value is only just above
      0.7 (12 to 15% of bootstrap samples at or below 0.7, and 2 of 8 mice below 0.7). Switch count is 589 against the paper's
      506/513. The sigmoid fit overestimates initial performance on synthetic blocks, a conservative bias.
    response: No change of outcome. The conclusion and notes now state how close the end value is to 0.7, the two mice below
      it, and the fit's bias.
  - claim: lstm-choice-accuracy
    agrees: true
    outcome: reproduced
    reason: Mean accuracy is 0.772 to 0.792 under every reading, within 0.802 ± 0.051. This scores the authors' stored LSTM
      outputs, assumed to be held-out predictions; that is plausible but unverified, and accuracy would be inflated if the
      outputs were in-sample.
    response: No change. The assumption stays stated on the outcome; the files give no way to check it.
  - claim: figs1h-lstm-beats-rl
    agrees: true
    outcome: reproduced
    reason: LSTM -0.667 against RL -0.691 log2 likelihood; Wilcoxon p = 1.4e-17 and 4.65e-22. Whether the RL fits converged
      could not be checked (a_unrew sits at its bound of 0 in the median); it asked for per-fold optimiser status and the
      spread of negative log likelihood across the three starts.
    response: 'Added the optimiser output: the best start converged in all 238 folds, the starts agree in the median fold
      (spread 0.000, at most 480 of a median 8,262), a_unrew is at 0 in 198 folds and beta at its bound of 50 in 50 folds.
      The RL fits now run in parallel processes. No change of outcome.'
  - claim: fig1i-strategy-after-switch
    agrees: true
    outcome: reproduced
    reason: All four conditions hold under both windows and both selections with p <= 4e-4. The post-switch minimum of P(actual
      choice) is 0.570 to 0.578, within 0.1 of 0.5. 251/320 switches against the paper's 265. Whether is_switch marks the
      first trial of the new rule could not be checked.
    response: 'Added a check: is_ruleA changes exactly at the is_switch trials and nowhere else in all 300 sessions (607
      switches). No change of outcome.'
  - claim: visually-guided-rule-update
    agrees: true
    outcome: not_reproduced
    reason: Under the forward Δ (t to t+1), visually guided trials update more than normal ones (p = 0.002; under (b) p
      < 0.001). Under the backward reading p = 0.68, but no reading gets the magnitudes (about 3 to 4 times larger). The
      forward reading's p should decide the outcome; the backward reading should not be read as support. It asked for the
      switch-aligned rule-belief curve and Δ split by visually guided / normal × correct / incorrect.
