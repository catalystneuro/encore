- claim: fig2c-running-variability-after-switch
  outcome: reproduced
  notebook: reproduce_tseng_2022.ipynb
  output: claim:fig2c-running-variability-after-switch
  notes: Δ trajectory correlation after minus before the switch is -0.077 ± 0.013 (11 bins) and -0.074 ± 0.012 (20
    bins) with the all-trial selection (320 and 317 switches), -0.090 and -0.087 with the other (251 and 248), p
    < 1e-4 in each, and negative in all 8 mice. Trials with an empty position bin are dropped (1,066 to 2,556 trials).
  deviations:
