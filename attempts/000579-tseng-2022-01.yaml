- claim: fig2f-latency-strategy
  outcome: reproduced
  notebook: reproduce_tseng_2022.ipynb
  output: claim:fig2f-latency-strategy
  measured: 9.31
  assumed: true
  notes: The maze epoch matches the legend's trial duration (9.31 ± 2.14 s, all-trial selection; 8.98 ± 1.93 s, the other;
    expected 8.95 ± 2.04), and trial start_time is maze onset (first frame with a position at median -0.004 s). With the
    all-trial selection (70,410 trials crossing threshold, paper 85,463), latency falls with rule-following (Spearman rho
    -0.113; highest against lowest bin p = 0.0045 with 5 bins and p < 0.0001 with 10) and with bias-following (rho -0.102;
    p = 0.0011 and p < 0.0001). With the other selection every test holds except bias-following with 5 bins (0.587 against
    0.656, p = 0.058), so the outcome rests on the session selection; the hierarchical bootstrap with 8 mice is liberal
    near 0.05 (verifier), so p values near it are fragile. One mouse has a positive rho for rule-following.
  deviations:
  - Dynamic choice is the stored velocity LSTM output, not refit.
  - Trial duration is the maze epoch, the duration that matches the legend's 8.95 s (the whole trial is 14.9 s).
  - Trials whose dynamic choice never crosses threshold are left out (4,015 of 74,425).
  - Sessions above 0.65 are selected on fraction correct over all trials, an assumption (Methods, Classification of the
    sources, gives 141 layer 2/3 sessions above 65% correct; Behavioral training says visually guided trials are excluded
    from all analyses). Only fraction correct over all trials gives counts near the paper's (150 layer 2/3 sessions, 97,989
    neurons); with visually guided trials excluded there are 100 and 69,707. Both selections are shown.
- claim: fig2g-choice-commitment
  outcome: reproduced
  notebook: reproduce_tseng_2022.ipynb
  output: claim:fig2g-choice-commitment
  notes: In the first position bin the bias-following coefficient is 0.28 to 0.42 (p <= 0.001) and the rule-following coefficient
    -0.016 to 0.000 (p >= 0.36, at most 0.05 of the bias coefficient); in the last stem bin the rule-following coefficient
    is 0.85 to 0.90 (p < 0.0001), above its first-bin value (p < 0.0001). Holds for 11 and 20 bins, both session selections,
    and the local reward rate with or without the current trial.
  deviations:
  - Choice commitment uses the stored dynamic choice.
  - Local reward rate is the fraction correct over the 9 non-visually guided trials centred on the trial (Figure S2L legend
    says 'adjacent 9 trials'); the 8 neighbours without the trial itself are run as a variant and give the same result.
- claim: cue-biased-running-uncorrelated
  outcome: partially_reproduced
  notebook: reproduce_tseng_2022.ipynb
  output: claim:cue-biased-running-uncorrelated
  notes: Cue-biased running varies across mice (mean cue log likelihood by mouse -0.92 to -0.36) and in direction across
    and within mice (roll coefficient positive in 79 of 238 sessions; all 30 negative in mouse 5; 27 positive and 11 negative
    in mouse 10). Per-mouse slopes of performance on cue decoding are not different from zero (mean 0.024, bootstrap p =
    0.35; other selection -0.048, p = 0.35), but the pooled correlation over sessions is positive (r = 0.224, p = 0.0005;
    other selection r = 0.207, p = 0.010). The criterion's two readings disagree, so the claim holds in part. The Figure
    S2G part was reported, not judged; choice decoding rises with cue decoding in the third quadrant of the maze by 0.17.
  deviations:
  - Cue decoding uses the stored cue-biased running. The pooled-correlation and per-mouse readings are the claims file's;
    the per-mouse test is a bootstrap over mice (the Methods' default), with a t-test shown.
  - The logistic decoder is fit with scikit-learn (unpenalised in effect, C = 1e6) on z-scored velocities in place of Matlab's
    fitglm.
- claim: fig4h-activity-by-epoch
  outcome: partially_reproduced
  notebook: reproduce_tseng_2022.ipynb
  output: claim:fig4h-activity-by-epoch
  notes: 'Two parts of the claim hold and one does not. In the feedback period/ITI RSC is the least active area (-0.042)
    and A the most (0.023), A above RSC (p < 0.001) in both selections and in all 8 mice; within RSC the feedback period/ITI
    is the lowest epoch (p < 0.001). RSC is not shown to be most active in the stem: within RSC the arm mean exceeds the
    stem mean (0.042 against 0.023, p = 0.07; other selection p = 0.18; arm higher in 7 of 8 mice), and between areas RSC''s
    stem mean is the highest and above V1, PM, MM and A (p <= 0.016) but not AM (p = 0.29); with the other selection only
    PM and A differ. The criterion asks for every comparison under every reading, and the well-fit reading was not run.
    The verifier would call this not reproduced; it is kept as partially reproduced because two of the claim''s three parts
    hold (see verifications).'
  deviations:
  - Only the all-neuron reading was run; the well-fit reading of the claims file needs the GLM fits (blocked).
  - 'Epochs are taken from the frame-aligned position and time from the choice point in the files: stem below the stem length,
    arm from there to the choice point (including 913,421 frames just past the 2.5 m maze end), feedback/ITI after the choice
    point. Frames of the 1 s feedback delay have no position (0 of 3,673,732), so they fall in feedback/ITI.'
  - Sessions above 0.65 are selected on fraction correct over all trials, an assumption (Methods, Classification of the
    sources, gives 141 layer 2/3 sessions above 65% correct; Behavioral training says visually guided trials are excluded
    from all analyses). Only fraction correct over all trials gives counts near the paper's (150 layer 2/3 sessions, 97,989
    neurons); with visually guided trials excluded there are 100 and 69,707. Both selections are shown.
  - In the 12 single-plane sessions the deconvolved activity timestamps run 2000 times the behaviour clock (findings); their
    frames are matched to behaviour by index, one frame per behaviour frame.
- claim: fig3i-glm-fit
  outcome: blocked
  blocked_by: too_large
  notes: Needs the Poisson GLM of the Methods fit to every layer 2/3 neuron (5-fold cross-validation over 21 penalties plus
    a final fit, 106 fits per neuron). The dandiset holds no fitted coefficients, deviances or encoding strengths. The notebook
    times one L2 Poisson fit of the median session's training frames by 1,310 predictors at about 0.3 s, which puts the
    97,989 neurons at about 730 CPU hours, a random subsample of 2,000 neurons at 15 CPU hours (3.7 h on the run's 4 cores)
    and one of 200 at 1.5 CPU hours (0.4 h), each a lower bound since the Methods' group lasso is slower; even the smallest
    is over the 30-minute notebook limit on top of the 19-minute notebook. The design matrix (27 task variables on raised-cosine
    bases, 336 movement predictors, drift terms) and the predictor grouping are not in the paper's public code. Not run.
  notebook: reproduce_tseng_2022.ipynb
