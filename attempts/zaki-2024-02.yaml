  notebook: reproduce_zaki_2024.ipynb
  output: claim:source-data-link
  measured:
  - 64.09
  - 8.82
  - 17.40
  - 15.06
  notes: Both deposited mice, Ca_EEG2-1 and Ca_EEG3-4, are in ExtData9b.csv and ExtData9c.csv under
