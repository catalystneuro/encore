findings:
- kind: metadata_error
  about: data
  severity: critical
  statement: In sub-Ca-EEG2-1 the behaviour sessions are timestamped about 1 h later than the
    offline recordings and the telemetry. The offline file's EEG is the Week file's EEG from the
    OfflineDay2Session1 epoch start (offset +0.002 s, difference 0 V), so they share one clock. On it
    the telemetry drops out (EEG constant, the mouse off its home-cage receiver) from 3780 to 2560 s
    before the NeutralExposure start time, 3710 to 2930 s before FC's and 3730 to 2850 s before
    Recall1's, and is normal during the FC epoch itself; each session fits in its dropout if it
    started 1 h before its timestamp. By the timestamps (session_start_time and the Week file's
    epochs), OfflineDay2Session1, described as recorded after fear conditioning, starts at 09:24:27,
    47 min before FC (10:11:24), and 113 s after the telemetry dropout ends; OfflineDay2Session2 also
    precedes FC, and OfflineDay1Session1 to 4 precede NeutralExposure. The files do not say which
    clock is right. No analysis here combines sessions in time, but one that orders the offline
    recordings by FC's time would drop the first two after aversive encoding.
- kind: other
  about: data
  severity: minor
  statement: The sleep_state column of SleepIntervals in the offline files uses four states, "quiet
    wake", "wake", "sws" and "rem", where the paper scores wake, NREM and REM (Methods, Sleep
    recordings and sleep scoring) and names no quiet wake state. The column's description defines
    quiet wake as a waking state ("The animal is awake and alert but at rest"), and the Methods'
    sleep/wake split scores 64 of the 68 quiet-wake epochs of Ca_EEG2-1's offline recording as wake,
    so quiet wake is part of the paper's wake. A user who takes "wake" for the paper's wake leaves
    out 61 of 87 bursts in Ca_EEG2-1, and the overlap-neutral against overlap-aversive comparison of
    Fig. 5c reverses. (The first version of this finding said the column had no description of quiet
    wake; it has one.)
- kind: data_missing
  about: data
  severity: major
  statement: The dataset holds 2 of the 9 mice of the calcium imaging and EEG/EMG experiment and one
    offline recording per offline period (for Ca_EEG2-1, 1 of the 24 recordings after aversive
    encoding, with cell-registration tables for 19 recordings of that day whose imaging is not
    deposited). Ca_EEG3-4 has no cell registration, Ca_EEG2-1 has no neutral or novel recall, and
    the deposited recordings hold no NREM or REM. The mice of the one-hour offline, behaviour-only,
    chemogenetic, cocaine, inhibitory tagging and no-shock experiments are not in it; 20 of the 26
    claims cannot be tested, and the paper names no archive for the rest of its data.
- kind: metadata_error
  about: data
  severity: minor
  statement: The telemetry (ActivitySignal, EEGSignal, EMGSignal, TemperatureSignal) is stored at a
    rate of 500 Hz, and the sample counts match the recordings' durations at that rate (299931 to
    300065 samples for 600 s); the Methods say the HD-X02 implants recorded at 100 Hz.
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: The FC session descriptions give the shock amplitude as "three 2s foot shocks of 1.5"
    and "of 0.25", without a unit; the experiment description gives the two amplitudes in mA.
- kind: metadata_error
  about: data
  severity: minor
  statement: The session_start_time of sub-Ca-EEG2-1_ses-Week.nwb is 2021-10-08T07:00:00+00:00, but
    its epochs fall at the local (-04:00) clock times of the session files (OfflineDay2Session1 at
    09:24:27.677 on both), so the start is local time labelled UTC, 4 h off.
- kind: other
  about: data
  severity: none
  statement: Checks that passed. The cell registration of Ca_EEG2-1 gives 97 neutral, 80 aversive,
    166 overlap and 282 remaining cells in its offline recording, each of its 625 ROIs once; the
    freezing of both mice agrees with the paper's source data (reading b equal to two decimals for
    Ca_EEG3-4); the FC shock times of the description show in Ca_EEG2-1's motion (3387 to 3848 in the
    2 s after each shock against a 95th percentile of 843 elsewhere); no asset shares a digest and no
    two sessions of equal length have correlated motion (largest r 0.131), so no recording is
    deposited twice; and the three files that changed since version 0.260825.1902 hold the same
    values in every array used here. A shared clock for imaging and behaviour could not be
    established in four sessions (Ca_EEG2-1 FC and NeutralExposure, Ca_EEG3-4 Recall2 and Recall3),
    where the correlation of population activity with motion peaks away from lag 0; no claim here
    uses imaging and behaviour together. The offline file's sleep labels of Ca_EEG2-1 agree with a
    scoring of the Week telemetry by the Methods' procedure (70 of 74 epochs labelled wake or quiet
    wake are scored wake).
- kind: methods_unavailable
  statement: The Extended Data Fig. 3l legend does not say whether the shuffled mean population
    activity is z-scored again before bursts are counted at z = 2, or thresholded at the true trace's
