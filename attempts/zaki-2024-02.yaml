  - claim: offline-bursts-above-shuffle
    agrees: true
    outcome: reproduced
    reason: Reproduced, under reading (b) only. Under (b) the true rates of 8.73/6.42/5.31 per min are
      above every surrogate, whose 95th percentiles are 0.30/0.10/0.00, for all 5 seed sets; under (a)
      the true rate is below the surrogate mean in all 3 recordings, which is not reproduced. The criterion
      lets one reading decide, but (problem 1) a circular shift keeps each cell's mean, so the surrogate
      mean trace has the true trace's mean but a smaller SD, and a threshold at the true mean + 2 SD almost
      never fires on a surrogate once cells share any positive covariance, burst-like or not. On independent
      AR(1) cells with only a slow shared drift and no bursts, reading (b) gives a reproduced result (true
      2.40/min against a surrogate 95th percentile of 0.00) and reading (a) the same reversal as the real
      data. So the reproduced outcome is near-guaranteed and does not show burst structure. The Extended
      Data Fig. 3l legend reads most naturally as running the full detection, z-scoring included, on each
      surrogate, reading (a), and under it the claim fails clearly. This comes from the claims file.
    response: Outcome kept, as the criterion gives it and the verifier agreed, marked as resting on reading
      (b). A synthetic check is added to the notebook (cell 27). On 600 AR(1) cells with no bursts and
      a shared slow drift, reading (b) puts the true frequency above the surrogates (5.90 against a 95th
      percentile of 2.60) and reading (a) below them (mean 8.55); on independent cells neither does. The
      notes, the deviation, the notebook's conclusion and the methods_unavailable finding now say that
      the result under (b) shows positive co-variation, not burst structure, and the deviation no longer
      calls (b) the better-supported reading. The verifier's point that the claims file's reading (b)
      cannot fail is added to questions/zaki-2024.yaml for a reader; the claim is not changed.
