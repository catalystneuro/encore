- claim: ed9b-aversive-freezing-high-vs-low
  outcome: reproduced
  notebook: reproduce_zaki_2024.ipynb
  output: claim:ed9b-aversive-freezing-high-vs-low
  notes: In Recall1 (aversive context) the high-shock mouse froze in 64.09% of frames and the
    low-shock mouse in 8.82%. Over ten 30-s bins each, the high-shock mouse froze more in all 10
    (bins 32.0 to 87.0% against 2.2 to 13.4%), Mann-Whitney U = 100, two-sided p = 1.8e-04. The
    paper's t-test over 5 and 4 mice cannot be run with one mouse per group; the result compares
    two animals.
  deviations:
  - One mouse per group of the paper's 5 high-shock and 4 low-shock mice; bins within a session
    stand in for mice, as the criterion says.
  - The last of the ten bins holds 29.9 s, as the sessions hold 8998 and 8999 frames at 30 Hz.
  - The 30 s bins of one session are autocorrelated, so the criterion's Mann-Whitney test treats
    dependent samples as independent and its p-value is too small; the direction (all 10 bins) does
    not depend on it.
- claim: offline-bursts-above-shuffle
  outcome: reproduced
  assumed: true
  notebook: reproduce_zaki_2024.ipynb
  output: claim:offline-bursts-above-shuffle
  notes: Under reading (b), each surrogate thresholded at the true trace's mean plus 2 SD, the true
    burst frequency is above the 95th percentile of 1000 circular-shift surrogates in all three
    deposited offline recordings (Ca_EEG2-1 Day 2, 8.73 against a surrogate mean of 0.11 bursts per
    minute, 95th percentile 0.30, maximum 0.50; Ca_EEG3-4 Day 1, 6.42 against 0.01, 0.10 and 0.30;
    Ca_EEG3-4 Day 2, 5.31 against 0.00, 0.00 and 0.20), and no surrogate reaches the true value.
    Under the second generator's seed (the claim's plus 1) and that seed plus 1000 to 4000 the
    surrogate means range 0.10 to 0.11, 0.00 to 0.01 and 0.00, the 95th percentiles 0.30, 0.00 to
    0.10 and 0.00, and the outcome is the same under all five. Under reading (a), each surrogate
    z-scored again, the true frequency is below the surrogate mean in all three (10.94, 8.81 and
    8.48, 95th percentiles 12.14, 9.92 and 9.52; fraction of surrogates at or above the true value
    0.999, 1.000 and 1.000), with surrogate means 10.91 to 10.96, 8.78 to 8.85 and 8.48 to 8.57 under
    the claim's seed and the four others; that reading alone gives not reproduced. What the answer
    changed. This attempt first tested the criterion as it then stood, reading (a) only, and recorded
    not reproduced, with reading (b) as a variant, and asked a reader whether the criterion should
    list both. The reader answered (questions/zaki-2024.yaml, 2026-11-25) that the paper does not fix
    the detail and amended the criterion to name both readings, reproduced under either, with the
    outcome marked as resting on the reading that gives it. The outcome changes from not reproduced
    to reproduced, resting on reading (b). All 625, 711 and 858 cells have activity and none is
    dropped. Reading (b) is a weak test, as the verifier found. A circular shift keeps each cell's
    mean, so a surrogate trace has the true trace's mean and, for positively co-varying cells, a
    smaller SD. On synthetic cells with no bursts (600 AR(1) cells, 9000 frames) sharing a slow drift,
    reading (b) puts the true frequency above the surrogates (5.90 against a 95th percentile of 2.60)
    and reading (a) below them (5.90 against a mean of 8.55), the pattern of the real data; on
    independent cells neither does (8.30 against 95th percentiles of 9.80 and 11.40). The result
    under (b) therefore shows that the cells co-vary positively, not that they burst together; the
    reading that tests burst structure, (a), does not hold here. The outcome is the criterion's, and a
    reader is asked whether reading (b) belongs in it (questions/zaki-2024.yaml).
  deviations:
  - The paper shows this on the eight mice of the one-hour offline experiment (Extended Data Fig. 3),
    none of which is in the dataset; it is tested on the three offline recordings of the two EEG/EMG
    mice, each 10 min at 15 Hz, as the criterion says.
  - Assumed that each shuffled mean population trace is held to the burst threshold of the true
    trace (its mean plus 2 SD), reading (b) of the criterion. The Extended Data Fig. 3l legend says
    only that "the mean population activity was re-computed each time" and that "The burst frequency
    was computed for each of these shuffles", and the Methods (Burst participation analysis) z-score
    the true trace and threshold it at z = 2, without saying what is done to a shuffle. The criterion
    names both readings and is met under either. Reading (b) is not the better-supported one. The
    legend's "The burst frequency was computed for each of these shuffles" reads most naturally as
    the full detection, z-scoring included (the verifier's reading), and reading (b) is passed by
    cells that only share a slow drift (notes). The outcome is kept as the criterion gives it, marked
    as resting on reading (b), and a reader is asked whether that reading belongs in the criterion.
    The analysis code is not public, so the authors are asked which was done (a methods_unavailable
    finding). Under reading (a) the outcome would be not reproduced.
  - The circular-shift offsets are drawn uniformly from 0 to T-1 frames, independently for each cell;
    the legend gives no range ("circularly shuffled 1000 times relative to one another"). This is the
    standard choice; under either reading the true value lies beyond every surrogate or nearly every
    one, so no range of offsets that decorrelates the cells is likely to change the outcome.
- claim: offline-skew-above-shuffle
  outcome: reproduced
  notebook: reproduce_zaki_2024.ipynb
  output: claim:offline-skew-above-shuffle
  notes: The true skew of the population trace is 1.645, 1.339 and 1.721 in the three recordings,
    against surrogate means of 0.601, 0.404 and 0.360, 95th percentiles of 0.708, 0.508 and 0.466,
    and maxima of 0.798, 0.682 and 0.633; no surrogate reaches the true value. Under the five seeds
    the surrogate means range 0.596 to 0.604, 0.401 to 0.404 and 0.360 to 0.369, and the outcome is
    the same under all five. Skew is unchanged by z-scoring, so the question on the burst claim
    does not bear on this one. The reader's answer on that claim (questions/zaki-2024.yaml) says the
    same, and this claim is unchanged by it. Unlike reading (b) of the burst claim, this test is not
    passed by co-variation alone. On the synthetic cells with a shared slow drift and no bursts the
    true skew is -0.276 against a surrogate 95th percentile of 0.105, and on independent cells 0.095
    against 0.103 (200 surrogates each).
  deviations:
  - Tested on the EEG/EMG mice's offline recordings, not the one-hour experiment's mice of Extended
    Data Fig. 3n and 3o, as for offline-bursts-above-shuffle; offsets drawn uniformly, the same
    standard choice.
- claim: burst-locomotion-pause
  outcome: not_reproduced
  notebook: reproduce_zaki_2024.ipynb
  output: claim:burst-locomotion-pause
  notes: Under neither reading of time zero is movement in the second before a burst lower than 3
    to 5 s before it in any recording. With the peak frame, one-sided Wilcoxon p = 0.763, 0.922 and
    0.452 (85, 62 and 51 bursts; medians 0.0303 against 0.0356, 0.0430 against 0.0364, 0.0761 against
    0.0917); with the first frame, p = 0.885, 0.920 and 0.481. Two bursts per recording near its edges
    are dropped. In all three recordings the mean absolute ActivitySignal at -5 and -1 s around bursts
    (0.13 to 0.36) is higher than around 1000 random times (0.08 to 0.21). Around random times
    movement in the later window is lower in Ca_EEG2-1 (p < 0.001), as movement declines over the
    recording, and not in the other two (p = 1.000 and 0.511). The test assumes that imaging and
    telemetry in the offline files share a clock; the data check found this consistent (population
    activity and movement correlate positively at lag 0, +0.03 to +0.15, with peaks 1.5 to 6.5 s
    later) but could not show it. With the telemetry moved to each recording's lag of peak
    correlation (+1.5, +5.5 and +6.5 s), p = 0.805, 0.982 and 0.863 (peak) and 0.798, 0.977 and
    0.853 (onset). Over shifts of -8 to +8 s in 1 s steps, Ca_EEG3-4 Day 1 never reaches p < 0.05
    (smallest 0.514), so no shift gives the result in all three recordings; two recordings reach it
    at -3 s (peak) and at -3 and -4 s (onset), shifts that move movement earlier, against the
    direction of the correlation. With a 1 s baseline (-4 to -3 s) in place of the criterion's 2 s,
    p = 0.809, 0.997 and 0.306 at lag 0 (random times 0.009, 1.000 and 0.307). The file describes
    ActivitySignal as "the motion of the probe relative to the receiver" that "can be used as a
    proxy for locomotion", unit n.a.
  deviations:
  - The paper shows this on webcam locomotion of the one-hour offline experiment (Fig. 2d,e,
    Extended Data Fig. 6e), whose mice are not in the dataset; the movement measure here is the
    telemetry ActivitySignal of the EEG/EMG mice, the only one in the offline files, as the
    criterion says.
- claim: fig5c-wake-overlap-neutral-coburst
  outcome: partially_reproduced
  notebook: reproduce_zaki_2024.ipynb
  output: claim:fig5c-wake-overlap-neutral-coburst
  notes: In the one deposited offline recording of Ca_EEG2-1 there are 87 bursts, 61 peaking in
    quiet wake, 24 in wake and 2 outside any sleep interval. Under reading (b), wake alone, OxN
    exceeds OxA under both co-participation readings (i, 33.3% against 29.2%; ii, 8.3% against
    4.2%), with 2 bursts having OxN only and 1 OxA only, exact McNemar p = 1.0. Under reading (a),
    wake and quiet wake (85 bursts), OxN is below OxA (i, 25.9% against 35.3%; ii, 8.2% against
    17.6%; 7 against 15 discordant bursts, p = 0.134). The criterion's partial outcome is met under
    reading (b) alone, on 3 discordant bursts. The paper's source data give this mouse 10.37%
    against 8.39% in wake over all 24 recordings, the direction of reading (b); NREM and REM are not
    in the deposited recording. Reading (a) is the better match to the paper's wake. The file's
    sleep_state description defines quiet wake as a waking state ("awake and alert but at rest");
    the Methods' sleep/wake split (two-state Gaussian mixture on the EMG, 6 s epochs) scores 64 of
    the 68 quiet-wake epochs of this recording as wake; and the Results place the effect "during
    brief periods of quiet wake". Under reading (a) OxN is below OxA. The outcome is kept as the
    criterion gives it, and a reader is asked whether reading (b) belongs in the criterion
    (questions/zaki-2024.yaml). Outside bursts, in wake and quiet wake, overlap and neutral are above
    z = 2 together in 0.18% of frames and overlap and aversive in 0.27%.
  deviations:
  - One of the paper's five high-shock mice and one of its 24 offline recordings; ensembles are
    z-scored over this recording alone, where the paper z-scores over the 24 concatenated recordings
    (Methods, Ensemble co-participation analysis).
  - The ensemble mean trace is the mean over the ensemble's cells of each cell's z-scored trace, then
    z-scored (Methods, Ensemble reactivation analysis and Ensemble co-participation analysis); the
    Methods do not say whether the cells are z-scored before averaging for Fig. 5.
