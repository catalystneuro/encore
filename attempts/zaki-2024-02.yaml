  - claim: burst-locomotion-pause
    agrees: true
    outcome: not_reproduced
    reason: 'p < 0.05 in 0 of 3 recordings under both the peak and onset readings, with p from 0.45 to
      0.92 (cell 26). The mean traces rise at time zero, and do not dip, in Ca_EEG2-1 (0.22 to 0.26). Problem
      3: activity correlates best with |ActivitySignal| at lags of +1.5, +5.5 and +6.5 s, and a few seconds
      of offset between imaging and telemetry would move the windows by more than their width; the notebook
      never tests the outcome''s sensitivity to it. Problem 4: the test compares a 1 s window with a 2
      s window, which on heavy-tailed movement leans towards lower before (false-positive rate 0.195 on
      synthetic data; Ca_EEG2-1''s random-time reference gives p = 0.000); the outcome is negative anyway.
      Problem 5: the claim is tested on the EEG mice''s 10-min recordings with the telemetry signal, not
      the paper''s one-hour webcam experiment. What ActivitySignal measures was not printed (C1).'
    response: Outcome unchanged. A new cell (34) moves the telemetry to each recording's lag of peak correlation
      (p = 0.805, 0.982 and 0.863 at the peak) and over -8 to +8 s; no shift gives p < 0.05 in all three
      recordings (Ca_EEG3-4 Day 1 never below 0.514), and at most two reach it, at shifts that move movement
      earlier, against the correlation. A variant with a 1 s baseline (-4 to -3 s) gives p = 0.809, 0.997
      and 0.306, with random-time references. The data check prints the ActivitySignal description ("the
      motion of the probe relative to the receiver", "a proxy for locomotion", unit n.a.). Problems 4
      and 5 are the criterion's; the deviation already records 5.
  - claim: fig5c-wake-overlap-neutral-coburst
    agrees: true
    outcome: partially_reproduced
    reason: 'Partially reproduced, under wake reading (b) only. Wake alone (24 bursts) has OxN above OxA
      (33.3 vs 29.2; 8.3 vs 4.2) on only 2 against 1 discordant bursts, McNemar p = 1.0; wake + quiet
      wake (85 bursts) has OxN below OxA under both co-participation readings (25.9 vs 35.3; 8.2 vs 17.6),
      p = 0.134 (cell 28). Problem 2: the paper''s sleep scoring has only wake, NREM and REM, and the
      source data only those three states, so the files'' quiet wake has no counterpart and the paper''s
      wake most plausibly corresponds to reading (a), under which OxN is below OxA; the Methods also count
      the triple combination separately, which favours co-participation reading (ii). The partial outcome
      rests on (b), with 3 discordant bursts. The criterion permits this, so the outcome stands, but it
      is fragile. Problem 7: ensembles are z-scored over one session, not 24, which is unavoidable. What
      quiet wake means was not printed (C3).'
    response: Outcome kept as the criterion gives it. The data check now prints the sleep_state description,
      which defines quiet wake as a waking state ("awake and alert but at rest"), and scores the Week
      telemetry by the Methods' procedure, which puts 64 of the 68 quiet-wake epochs of this recording
      in wake. The notes and conclusion now say that reading (a) is the better match to the paper and
      that under it OxN is below OxA. The verifier's point that reading (b) has no counterpart in the
      paper is added to questions/zaki-2024.yaml for a reader. Finding 2, which said quiet wake had no
