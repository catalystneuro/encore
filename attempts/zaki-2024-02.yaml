    tolerance under both readings; measured gives reading (a), the first the criterion lists.
- claim: ed9b-aversive-freezing-high-vs-low
  outcome: reproduced
  notebook: reproduce_zaki_2024.ipynb
  output: claim:ed9b-aversive-freezing-high-vs-low
  notes: In Recall1 (aversive context) the high-shock mouse froze in 64.09% of frames and the
    low-shock mouse in 8.82%. Over ten 30-s bins each, the high-shock mouse froze more in all 10
    (bins 32.0 to 87.0% against 2.2 to 13.4%), Mann-Whitney U = 100, two-sided p = 1.8e-04. The
    paper's t-test over 5 and 4 mice cannot be run with one mouse per group; the result compares
    two animals.
  deviations:
  - One mouse per group of the paper's 5 high-shock and 4 low-shock mice; bins within a session
    stand in for mice, as the criterion says.
  - The last of the ten bins holds 29.9 s, as the sessions hold 8998 and 8999 frames at 30 Hz.
- claim: offline-bursts-above-shuffle
  outcome: not_reproduced
  notebook: reproduce_zaki_2024.ipynb
  output: claim:offline-bursts-above-shuffle
  notes: In all three deposited offline recordings the true burst frequency is below the mean of
    1000 circular-shift surrogates whose population trace is z-scored again, as the criterion says
    (Ca_EEG2-1 Day 2, 8.73 against a surrogate mean of 10.94 bursts per minute, 95th percentile
    12.14; Ca_EEG3-4 Day 1, 6.42 against 8.81 and 9.92; Ca_EEG3-4 Day 2, 5.31 against 8.48 and 9.52).
    The fraction of surrogates at or above the true value is 0.999, 1.000 and 1.000. Under the
    claim's seed and the seed plus 1000 to 4000 the surrogate means range 10.91 to 10.96, 8.78 to
    8.85 and 8.48 to 8.57, and the outcome is the same under all five. As a variant, with each
    surrogate thresholded at the true trace's mean plus 2 SD (not z-scored again), the surrogates
    hold 0.11, 0.01 and 0.00 bursts per minute (95th percentiles 0.30, 0.10, 0.00), and the claim
    would be reproduced in all three. The Extended Data Fig. 3l legend does not say which was done;
    a question for a reader is in questions/zaki-2024.yaml. All 625, 711 and 858 cells have activity
    and none is dropped.
  deviations:
  - The paper shows this on the eight mice of the one-hour offline experiment (Extended Data Fig. 3),
    none of which is in the dataset; it is tested on the three offline recordings of the two EEG/EMG
    mice, each 10 min at 15 Hz, as the criterion says.
  - The circular-shift offsets are drawn uniformly from 0 to T-1 frames, independently for each cell;
    the legend gives no range ("circularly shuffled 1000 times relative to one another"). This is the
    standard choice; with the true value below 99.9% or more of the surrogates, no range of offsets
    that decorrelates the cells is likely to change the outcome.
- claim: offline-skew-above-shuffle
  outcome: reproduced
  notebook: reproduce_zaki_2024.ipynb
  output: claim:offline-skew-above-shuffle
  notes: The true skew of the population trace is 1.645, 1.339 and 1.721 in the three recordings,
    against surrogate means of 0.601, 0.404 and 0.360, 95th percentiles of 0.708, 0.508 and 0.466,
    and maxima of 0.798, 0.682 and 0.633; no surrogate reaches the true value. Under the five seeds
    the surrogate means range 0.596 to 0.604, 0.401 to 0.404 and 0.360 to 0.369, and the outcome is
    the same under all five. Skew is unchanged by z-scoring, so the question on the burst claim
    does not bear on this one.
  deviations:
  - Tested on the EEG/EMG mice's offline recordings, not the one-hour experiment's mice of Extended
    Data Fig. 3n and 3o, as for offline-bursts-above-shuffle; offsets drawn uniformly, the same
    standard choice.
- claim: burst-locomotion-pause
  outcome: not_reproduced
  notebook: reproduce_zaki_2024.ipynb
  output: claim:burst-locomotion-pause
  notes: Under neither reading of time zero is movement in the second before a burst lower than 3
    to 5 s before it in any recording. With the peak frame, one-sided Wilcoxon p = 0.763, 0.922 and
    0.452 (85, 62 and 51 bursts; medians 0.0303 against 0.0356, 0.0430 against 0.0364, 0.0761 against
    0.0917); with the first frame, p = 0.885, 0.920 and 0.481. Two bursts per recording near its edges
    are dropped. In all three recordings the mean absolute ActivitySignal at -5 and -1 s around bursts
    (0.13 to 0.36) is higher than around 1000 random times (0.08 to 0.21). Around random times
    movement in the later window is lower in Ca_EEG2-1 (p < 0.001), as movement declines over the
    recording, and not in the other two (p = 1.000 and 0.511). The test assumes that imaging and
    telemetry in the offline files share a clock; the data check found this consistent (population
    activity and movement correlate positively at lag 0, +0.03 to +0.15, with peaks 1.5 to 6.5 s
    later) but could not show it.
  deviations:
  - The paper shows this on webcam locomotion of the one-hour offline experiment (Fig. 2d,e,
    Extended Data Fig. 6e), whose mice are not in the dataset; the movement measure here is the
    telemetry ActivitySignal of the EEG/EMG mice, the only one in the offline files, as the
    criterion says.
- claim: fig5c-wake-overlap-neutral-coburst
  outcome: partially_reproduced
  notebook: reproduce_zaki_2024.ipynb
  output: claim:fig5c-wake-overlap-neutral-coburst
  notes: In the one deposited offline recording of Ca_EEG2-1 there are 87 bursts, 61 peaking in
    quiet wake, 24 in wake and 2 outside any sleep interval. Under reading (b), wake alone, OxN
    exceeds OxA under both co-participation readings (i, 33.3% against 29.2%; ii, 8.3% against
    4.2%), with 2 bursts having OxN only and 1 OxA only, exact McNemar p = 1.0. Under reading (a),
    wake and quiet wake (85 bursts), OxN is below OxA (i, 25.9% against 35.3%; ii, 8.2% against
    17.6%; 7 against 15 discordant bursts, p = 0.134). The criterion's partial outcome is met under
    reading (b). The paper's source data give this mouse 10.37% against 8.39% in wake over all 24
    recordings, the direction of reading (b); NREM and REM are not in the deposited recording. The
    dataset's "quiet wake" is a state the paper does not name, and which of the readings matches the
    paper's "wake" cannot be told from the files (a finding). Outside bursts, in wake and quiet wake,
    overlap and neutral are above z = 2 together in 0.18% of frames and overlap and aversive in
    0.27%.
  deviations:
  - One of the paper's five high-shock mice and one of its 24 offline recordings; ensembles are
    z-scored over this recording alone, where the paper z-scores over the 24 concatenated recordings
    (Methods, Ensemble co-participation analysis).
  - The ensemble mean trace is the mean over the ensemble's cells of each cell's z-scored trace, then
    z-scored (Methods, Ensemble reactivation analysis and Ensemble co-participation analysis); the
    Methods do not say whether the cells are z-scored before averaging for Fig. 5.
