inputs:
- what: Names of the stimulus codes (the conversion of stimulus names to codes, its printed list of
    codes, and its own labels for codes 9 to 13), the trial processing parameters, the spatial
    scale of 10 pixels per mm, the per-stimulus medians it printed, used as reference values
    for the link claim, and the DC pairs its printed Tukey test for Figure 1D finds significant,
    used as reference values for fig1d-dc-no-modulation. From the paper's analysis notebook
    Fig1-S1.ipynb.
  source: https://gitlab.oit.duke.edu/ean26/danionella_omr_neuralcircuits2025 at commit
    33a5c297ff4ab6ff49f6bdd96139e9fdd867025c
- what: Stimulus names in protocol order, from the protocol file
    resources/protocols/sevenrep_twentyonestim.hdf of the stimulus software pandastim.
  source: https://github.com/Naumann-Lab/pandastim at commit 7d9d1610be442c5a933e2575c071c64577e6312f
outcomes:
- claim: stimulus-code-link
  outcome: reproduced
  notebook: reproduce_fouke_2025.ipynb
  output: claim:stimulus-code-link
  notes: Codes are matched by their integer value. All 21 codes are in the dandiset, including
    every code the analysis uses. Through the link, 17 of 18 species and stimulus speed medians
    are within 10% of the values printed by Fig1-S1.ipynb (DC static is 10.52 against 11.9
    mm/s), and the angular velocities differ from the printed ones by a median of 0.02 deg/s.
    The fish counts (25 ZF, 12 DC) match the code's lists; fish cannot be matched one by one, as
    no identifier links the dandiset's subjects to the code's folders. The static window is the
    code's (first 35 s of the code-20 block, measured from 3 s), and no fish median is exactly 0,
    so the code's exclusion of zero medians changes nothing. On codes 9 and 11 the ZF medians
    are 0.02 and 1.59 deg/s. Over 3 to 35 s DC turn more to the right for code 11 than for code 9
    (median difference 5.82 deg/s, 10 of 12 fish, Wilcoxon p = 0.0093), and ZF go the same way
    without significance (1.66 deg/s, 16 of 25 fish, p = 0.141). If fish turn with lateral motion
    as they do with medial motion, code 11 is lateral right, as the protocol file has it; the
    data do not show that they do, so the assignment is not settled.
  deviations:
  - The code's filter on a `vel` column is not applied to DC trials, as the DC files have no such
    series; this is the remaining difference that may explain the one DC static value outside
    10%.
  - The timing of the DC stimulus labels could not be confirmed from the turning response (the
    contrast is 4.6 deg/s with true labels and 0.1 with shifted ones); the DC labels are taken as
    they are.
- claim: fig1d-dc-faster-all-codes
  outcome: reproduced
  notebook: reproduce_fouke_2025.ipynb
  output: claim:fig1d-dc-faster-all-codes
  notes: Over all 21 codes, the median over fish and code values is 94.0 pixels/s for DC and 55.2
    for ZF; species effect F = 78.4, p = 6.3e-18. The ANOVA treats each fish and code value as
    independent; with one value per fish, DC 87.4 against ZF 52.9 pixels/s, Mann-Whitney p = 0.02.
    With positions resampled to 30 Hz, 95.2 against 53.8 (p = 1.3e-08). DC are faster within
    each frame-rate group.
  deviations:
  - Tested over all stimulus codes without their names; the paper's figure uses nine whole-field
    stimuli.
  - The comparison assumes one spatial scale for all rigs, which the files do not state.
- claim: fig1d-median-velocity
  outcome: reproduced
  notebook: reproduce_fouke_2025.ipynb
  output: claim:fig1d-median-velocity
  measured:
  - 9.87
  - 6.41
  notes: All four readings put both values within tolerance; (a) median of stimulus medians DC
    10.02 and ZF 6.39 mm/s, (b) median of fish and stimulus values 9.87 and 6.41 (given as
    measured), (c) median of fish medians 9.36 and 6.33, (d) median of trials 9.88 and 6.28.
    Species effect F = 20.8, p = 7.5e-06. With 30 Hz positions DC 9.43 to 10.15 and ZF 6.07 to
    6.30 (p = 0.0011). Without the trial rejection (4487 trials in place of 4458) readings (a) to
    (c) are unchanged and (d) gives DC 9.85 and ZF 6.30 (p = 6.7e-06).
  deviations:
  - The paper does not say how the overall median is taken; four readings are shown, and all
    match.
  - 25 ZF, where the paper states 26.
  - Speeds rely on the code's scale of 10 pixels per mm, which the dandiset does not state.
- claim: fig1d-zf-forward-faster-than-static
  outcome: reproduced
  notebook: reproduce_fouke_2025.ipynb
  output: claim:fig1d-zf-forward-faster-than-static
  measured:
  - 4.84
  - 8.78
  notes: ZF static 4.84 mm/s over 18 fish and forward 8.78 mm/s over 25 fish. Of 18 fish with
    both, 14 are faster to forward motion (median difference 3.67 mm/s, Wilcoxon p = 0.0077).
    The static value is 8.31 mm/s in the 5 fish from 167 to 171 Hz files and 4.50 in the 13
    from 32 to 35 Hz files. Static is the start of the blank block after all motion trials (4 hours
    in the protocol, 0.2 to 787.3 min in the files), one period per fish, and 7 ZF have none.
  deviations:
  - 25 ZF, where the paper states 26.
- claim: fig1d-dc-no-modulation
  outcome: not_reproduced
  notebook: reproduce_fouke_2025.ipynb
  output: claim:fig1d-dc-no-modulation
  notes: By the paper's test (Tukey's HSD over the 18 species and stimulus groups) 3 of 36 DC
    pairs differ, all static against a motion direction (backward left, backward right, forward
    left; adjusted p 0.030 to 0.049). The DC static values come from 9 fish and include one at
    106.5 mm/s and two near 0. Among the eight directions no DC pair differs (smallest adjusted
    p 0.999), DC per-stimulus medians span 8.81 to 10.52 mm/s (ratio 1.19, ZF 2.03), and a
    one-way ANOVA across the nine DC stimuli gives p = 0.479 (ZF p = 0.00082). With values above
    100 mm/s left out, no DC pair differs. The same Tukey test finds no ZF pair over the 18
    groups (smallest p 0.835). The printed output of Fig1-S1.ipynb finds the same three DC pairs
    significant (adjusted p 0.0236, 0.0373 and 0.0397), so the paper's own test disagrees with
    the claim and this result matches the paper's computation. The DC-sub-2 static value of 106.5
    mm/s is one trial measured over a 14.6 s motion phase in a 100 mm dish, likely a tracking
    artefact. It passes the code's speed check because the check covers 0 to 35 s (21.9 mm/s from
    the stored `dist`, 92.5 from positions); computing the check from positions, or leaving out zero
    medians as the code does, gives the same 3 pairs. The outcome is a property of the paper's test
    on this data, not evidence that DC modulate their speed with stimulus direction.
  deviations:
  - The DC static block is the code's window, but the code's filter on DC `vel` cannot be
    applied (DC static 10.52 against the code's printed 11.9 mm/s).
- claim: fig1d-dc-faster-oblique
  outcome: reproduced
  notebook: reproduce_fouke_2025.ipynb
  output: claim:fig1d-dc-faster-oblique
  notes: Under reading (b), motion at 90 degrees or more, DC are significantly faster than ZF for
    right (p = 0.0002) and backward right (p = 0.0047), 2 of 4; under reading (a), the
    intercardinal directions, for 1 of 4 (backward right). Backward motion also differs
    (p = 0.0002).
  deviations:
  - The legend's "oblique" can be read two ways; the claim is reproduced under one of them (b)
    and not under the other (a).
- claim: fig1g-follow-direction
  outcome: partially_reproduced
  notebook: reproduce_fouke_2025.ipynb
  output: claim:fig1g-follow-direction
  notes: ZF turn with the motion; the rightward minus leftward difference is positive in 23 of 25
    fish (median 29.51 deg/s, one-sided Wilcoxon p = 9.8e-07). DC do not by this test; 7 of 12
    positive, median 0.88 deg/s, p = 0.151, and the DC median for left motion is +0.25 deg/s,
    the same sign as the paper's code printed (+0.3). DC turn right to right motion (8.67 deg/s).
  deviations:
  - The paper gives no test for following the direction; the per-fish rightward minus leftward
    difference and its test were chosen here before the analysis.
- claim: fig1h-zf-higher-angular-acceleration
  outcome: not_reproduced
  notebook: reproduce_fouke_2025.ipynb
  output: claim:fig1h-zf-higher-angular-acceleration
  notes: With angular acceleration as the Methods define it, DC are higher than ZF for all nine
    stimuli (medians 143 to 191 against 55.4 to 66.4 deg/s2, Kruskal-Wallis p below 0.05/9 for
    each), the reverse of the claim. Per-fish medians, and the files at 128 to 171 Hz alone
    (ZF 84.9, DC 178.6 deg/s2, p = 6.3e-05), give the same. The quantity Fig1-S1.ipynb computes
    gives ZF higher with p below 0.05/9 for 7 of 9 stimuli; it divides the heading change per
    frame by the file's mean frame interval, which in DC files is a median 8.73 times the frame
    interval (ZF 1.37), as DC files hold only trial frames. Part of the DC values may be tracking
    noise. In the 3 s stationary phase the DC median is 205 deg/s2, higher than the 171 during
    motion (per fish median ratio 1.24, p = 0.016), but ZF are also higher at rest (66.9 and 60.8,
    ratio 1.07, p = 0.00012), so this does not separate the species. In frames where the fish is
    still (below 1 mm/s) DC are higher than ZF (per-fish medians 72.4 and 34.9 deg/s2, Mann-Whitney
    p = 0.00014), and DC are higher in every speed band (at 5 mm/s or more, 207 and 85.8). The
    outputs cannot say whether the higher values in moving DC are noise or turning during
    continuous swimming. With the heading from the unwrapped `f0_theta` DC are higher still (218
    to 278 against ZF 61.8 to 77.3 deg/s2, 0 of 9). The reversal should not be read as evidence
    against the paper.
  deviations:
  - Follows the Methods' definition (degrees per second squared) on heading resampled to 30 Hz;
    the code's quantity, which disagrees with the Methods, is shown as a variant.
  - Heading is taken from the cumulative sum of `f0_vtheta`, as the code does; in DC files it does
    not match `f0_theta`.
- claim: figs1e-dc-respond-less-monocular
  outcome: reproduced
  notebook: reproduce_fouke_2025.ipynb
  output: claim:figs1e-dc-respond-less-monocular
  notes: Species effect F = 23.3, p = 2.5e-06. DC turn less toward the stimulus than ZF for
    medial stimuli (3.26 against 13.48 deg/s, p = 0.0003) and binocular ones (2.87 against 21.87,
    p = 0.0002). For lateral stimuli DC are below ZF only nominally (-1.07 against -0.13 deg/s,
    p = 0.96); neither species turns toward lateral motion. With the protocol file's assignment of
    codes 9 and 11, the lateral medians change sign and DC are no longer below ZF there, which
    would make the claim partially reproduced. The DC turning to codes 9 and 11 leans toward the
    protocol file's assignment (see stimulus-code-link), so the lateral part is fragile.
  deviations:
  - Codes 9 and 11 are assigned as the figure code has them; the stimulus software's conversion
    has them the other way, and the data do not settle it.
- claim: fig1c-continuous-vs-bouts
  outcome: reproduced
  notebook: reproduce_fouke_2025.ipynb
  output: claim:fig1c-continuous-vs-bouts
  notes: The median-to-mean ratio of instantaneous speed is 0.306 in ZF (25 fish, 0.244 to 0.580)
    and 0.908 in DC (12 fish, 11 above 0.74, one at 0.140), Mann-Whitney p = 5.4e-05. It holds in
    files at 128 to 171 Hz alone (0.298 against 0.898, p = 0.0028) and in forward trials alone.
  deviations:
  - The paper shows this with representative traces and a bout analysis whose bout files are not
    in the dandiset; the measure was chosen here before the analysis.
- claim: fig1cef-representative-values
  outcome: blocked
  blocked_by: metadata_insufficient
