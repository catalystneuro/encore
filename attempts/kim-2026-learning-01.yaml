- claim: figs2ef-control-stable
  outcome: not_reproduced
  notebook: reproduce_kim_2026_learning.ipynb
  output: claim:figs2ef-control-stable
  notes: 'A claim of absence, judged on the count test. In the control mice the number of activated ROIs per channel-session
    at 5 uA is a median of 12.5 in weeks 0 and 1 (n 54) and 2.0 in weeks 2 and 3 (n 60), two-sided p = 0.00378,
    r = 0.31; as a fraction of ROIs, 0.063 against 0.027 (p = 0.00875). The ROIs per session range from 1 to 721.
    The pooled test mixes mice: ICMS48 has only early sessions (medians 67 and 46); with the five mice seen in both
    phases the medians are 4.0 and 2.0 (p = 0.444), and on percentile ranks within mouse p = 0.0658. Within mice
    the counts change in three of five: down in ICMS45 (4.5 to 1.0, p = 0.00502) and ICMS54 (8.0 to 1.0, p = 0.00628),
    up in ICMS56 (0.0 to 8.5, p = 0.00212), so the stability fails within mice too. Without sessions of fewer than
    10 ROIs, 19.0 against 2.0 (p = 9.87e-06). The density within 200 um and the 800 um limit were not applied (see
    deviations), and the side-by-side with the behavioural early weeks could not be made, as their volumetric activation
    cannot be derived.'
  deviations:
  - The activation is the files' binary per-ROI table (RegionMetrics.mat in the description), not recomputed.
  - 'The density test cannot be run: the control files give ROI voxels in pixel and plane indices with no pixel
    size or plane spacing, and contact positions by contact index with no mapping from the Ripple stimulation channel;
    2 to 9 contacts per session sit at the origin. The outcome is decided by the count test alone, which finds the
    change.'
  - Weeks count from each control mouse's first session in the dandiset.
