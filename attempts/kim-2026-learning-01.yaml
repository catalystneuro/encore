findings:
- kind: metadata_insufficient
  about: data
  severity: major
  statement: The volumetric dF/F (DfOverF_Volumetric) holds 6 to 8 samples per trial placed within 0.25 s of stimulation
    onset at the per-plane rate, with the value -1 at three or four of the eight positions in about half of the
    ROIs. The files do not say which samples are pre-stimulus and which stimulation volumes, and the catch-trial
    pattern over the samples matches the stimulation one, so ICMS-evoked activation cannot be derived. The voxel
    data the Methods' activation rule uses are not in the files. Six claims on Figure 2 are blocked.
- kind: identifier_missing
  about: data
  severity: major
  statement: The planar ROIs are segmented separately in each session with no identifier linking them across sessions,
    and the mean images used for the paper's registration are not included, so the longitudinal tracking of Figure
    3 and fig. S6 cannot be repeated. Ten claims are blocked.
- kind: data_missing
  about: data
  severity: major
  statement: The behavioural imaging files give no position of the stimulation contact in the imaging volume, which
    the distances, densities and activation radius of Figure 2 need; the control files have a stim_electrode_positions
    table, the behavioural ones do not.
- kind: metadata_insufficient
  about: data
  severity: major
  statement: The control survey files give ROI voxels in pixel and plane indices with no pixel size or plane spacing,
    and probe contact positions by contact index 0 to 31 with no mapping from the Ripple stimulation channel to
    the contact; 2 to 9 contacts per session are at the origin. Distances to the stimulation site cannot be computed.
- kind: other
  about: data
  severity: major
  statement: In the control recordings the stimulation table lists 3 bursts per trial ending 1.2 s after the first,
    but the summed firing rate peaks every 0.5 s for about 5 s after the first burst, at a lower amplitude after
    the third. Either the table omits stimulation that was delivered or another stimulus followed; the files do
    not say which.
- kind: metadata_insufficient
  about: data
  severity: major
  statement: The control trials (3 bursts of 10 pulses at 50 Hz) differ from the 700 ms 100 Hz train of the trained
    mice, and the trial_index of the control stimulation tables repeats across recording blocks, so trials must
    be counted from burst_index_in_trial. Neither is said in the dataset description.
- kind: data_missing
  about: data
  severity: major
  statement: ICMS83's sessions have no catch trials and no block structure (180 to 480 ephys-block trials, trial_index
    up to 625), and its wheel barely moves at the recorded response times (median 1.2 wheel units against 15.4 to
    18.5 in the other mice), so its false-alarm rates and movement onsets cannot be measured.
- kind: data_missing
  about: data
  severity: major
  statement: Units carry one mean waveform on one channel (90 samples). Per-spike waveforms, waveforms in and out
    of stimulation, and multi-channel templates are not in the files, so the waveform separation of Figure 4D and
    the UnitMatch tracking of fig. S8 cannot be repeated.
- kind: metadata_error
  about: data
  severity: minor
  statement: The electrodes table, described as holding the contacts below 1 MOhm, lacks stimulation channel 3 of
    ICMS100 in all seven sessions and channel 9 of ICMS101 on 2023-10-27, though the Methods stimulate only contacts
    below 1 MOhm.
- kind: other
  about: data
  severity: minor
  statement: In ICMS101's session of 2023-10-27 the stimulation trains start 56.0 to 84.9 ms after the trial start
    time; in the other sessions of five mice they start a median of 5.8 to 5.9 ms after it (5.5 to 37.4 ms), and
    in ICMS83's at it; this session also uses stimulation channels 7, 9 and 10 where the later ones use 10, 11 and
    12.
- kind: metadata_error
  about: data
  severity: minor
  statement: The stimulation table rows of planar-block trials have stop times up to 8.1 s after their start, though
    each train is 700 ms; the stimulation table also carries its own imaging_modality column.
- kind: metadata_error
  about: data
  severity: minor
  statement: The stored cell_type uses two vocabularies (pyramidal and interneuron in most files, Pyramidal Cell
    and Narrow Interneuron in others) and 7 units are unknown.
- kind: other
  about: data
  severity: minor
  statement: The six trained mice hold 999 sorted units against the paper's 973 (732 pyramidal and 260 interneurons
    by the stored label, against 672 and 301).
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: The wheel position is in arbitrary units and the angular response threshold of the task is not given,
    so wheel deviations cannot be expressed in degrees or compared with the threshold without estimating it.
- kind: other
  about: data
  severity: none
  statement: 'In the behavioural sessions spikes, trials and wheel share one clock as far as the contrasts show:
    the fraction of modulated responses is higher at the true onsets than at onsets shifted by 2 s either way in
    61 of 68 sessions, and the wheel moves more on hits than on misses in every block. No recording is deposited
    twice (no identical spike trains or stimulation tables).'
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. The length of the pre-stimulus window of the modulation test and score is
    not given (Methods, Quantifying neuromodulation metrics); this attempt used 700 ms before onset, as long as
    the train. Was it 700 ms, or the whole 1 to 1.5 s pre-stimulus period?
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. The angular response threshold of the wheel in encoder units, and which five
    mice had reliable rotary encoders (fig. S5), are not given. This attempt estimated the threshold from the wheel
    at the recorded response times and left out ICMS83.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. For Figure 6D, the bin width and how trial-median firing rates were formed
    (raw binned counts or smoothed rates) are not given; the code's data file holding them is not public. This attempt
    smoothed each trial with a Gaussian of sigma 20 ms before the median, and finds significant PL clusters.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. The control mice received 3 bursts of 10 pulses at 50 Hz per trial (dandiset),
    which the paper does not describe; the response windows and pulse-locking window used for them in fig. S7 and
    S9C are not given. This attempt counted spikes inside the bursts, against 600 ms before the first burst.
- kind: methods_unavailable
  about: paper
  statement: Question for the authors. For the 120 ms pre-movement analysis (fig. S5E to H), are the responses those
    modulated in the 700 ms analysis, or those passing the modulation test in the 120 ms windows? The two give different
    NPL results here.
- kind: methods_unavailable
  about: paper
  statement: 'Question for the authors. The cell type used in Figures 4 and 5: the dandiset''s stored t2p label,
    or a trough-to-peak from another waveform (multi-channel or upsampled)? The stored label and a trough-to-peak
    from the stored mean waveform disagree for 10% of units and change the 6 uA pyramidal latency result of Figure
    4J.'
