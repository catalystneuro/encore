- claim: fig4h-unit-counts
  outcome: not_reproduced
  notebook: reproduce_kim_2026_learning.ipynb
  output: claim:fig4h-unit-counts
  measured:
  - 999
  - 732
  - 260
  - 588
  - 406
  - 179
  notes: '999 units (973 +- 97.3): 732 pyramidal and 260 interneurons by the stored label, 7 unknown (724 and 275
    by the trough-to-peak recomputed from the mean waveform). Modulated units 588 (484 +- 48.4): 406 pyramidal,
    179 interneurons (402 and 186 by trough-to-peak); with all channels 588, with a one-sided test 599, with pre-stimulus
    windows of 300 and 500 ms 653 and 633. Both histograms have a mode below 0.45 ms (0.383 ms) and one above (0.717
    ms for all units, 0.617 ms for modulated), with a dip between. The modulated total is outside its tolerance
    under every variant, so the claim fails by its criterion. Per mouse, recorded and modulated units are ICMS92
    208/154, ICMS93 302/118, ICMS98 212/115, ICMS100 93/57, ICMS101 127/108, ICMS83 57/36.'
  deviations:
  - The pre-stimulus window is 700 ms before onset, as long as the train. The Methods say pre-stimulus without a
    length (Quantifying neuromodulation metrics); the Results define the delta spikes of Figure 6 with the pre-stimulation
    spikes in the preceding 700-ms window. This is an assumption; 300 and 500 ms are shown as variants for fig4h-unit-counts
    and fig4g-modulated-count-mouse1.
  - Responses are selected by the code's filters that the claims file follows (more than 5 trials, 0 < z below 100
    or 50, stimulation channels used on at least 5 session days); the modulation test is two-sided with the stimulation
    count higher, and at least 50 spikes are counted in the stimulation window summed over trials.
  - Cell type by the stored cell_type label (main, as for every claim) and by the recomputed trough-to-peak (variant);
    they agree for 90% of units.
  assumed: true
- claim: figs3-modulation-all-cells
  outcome: partially_reproduced
  notebook: reproduce_kim_2026_learning.ipynb
  output: claim:figs3-modulation-all-cells
  notes: Modulation is higher late at 4, 5 and 6 uA (medians 2.68 to 3.77, 3.40 to 3.88, 3.56 to 4.57; p = 6.84e-05,
    0.00853, 0.000404). Time to maximum is shorter late at 5 uA (85 to 45 ms, p = 0.00441), not significantly at
    4 and 6 uA (p = 0.0523, 0.168). At the current nearest each session threshold, from every current presented
    (2 to 10 uA), modulation is stable under both threshold readings (2.85 to 2.99, p = 0.484; 2.95 to 3.25, p =
    0.461), so all three parts hold. Restricted to 4 to 6 uA, the at-threshold modulation is higher late (2.53 to
    4.13, p = 2.59e-05; 2.64 to 4.21, p = 4.96e-06), which would make the claim partially reproduced. The representative
    recordings of the supplement are not identified; all mice are pooled.
  deviations:
  - The pre-stimulus window is 700 ms before onset, as long as the train. The Methods say pre-stimulus without a
    length (Quantifying neuromodulation metrics); the Results define the delta spikes of Figure 6 with the pre-stimulation
    spikes in the preceding 700-ms window. This is an assumption; 300 and 500 ms are shown as variants for fig4h-unit-counts
    and fig4g-modulated-count-mouse1.
  - Responses are selected by the code's filters that the claims file follows (more than 5 trials, 0 < z below 100
    or 50, stimulation channels used on at least 5 session days); the modulation test is two-sided with the stimulation
    count higher, and at least 50 spikes are counted in the stimulation window summed over trials.
  - At threshold, the response at the session threshold rounded to the nearest integer current, kept when that current
    was presented, from every current presented, as the criterion refers to fig2g-at-threshold-stable; the Methods
    analyse only 4, 5 and 6 uA (Analysis of behavioral data), and that restriction, which drops thresholds rounding
    to 2 or 3 uA, is shown as a variant. This choice is an assumption; the two give different outcomes.
  assumed: true
