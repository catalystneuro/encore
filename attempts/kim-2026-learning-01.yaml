- claim: fig2a-threshold-decrease
  outcome: reproduced
  notebook: reproduce_kim_2026_learning.ipynb
  output: claim:fig2a-threshold-decrease
  measured:
  - 5.7
  - 3.91
  notes: Under reading (a), guess rate fixed at the catch-trial rate, the median session threshold is 5.70 uA early
    (n 43) and 3.91 uA late (n 80), the paper's counts, p = 2.1e-07, r = 0.57; under reading (b), hit proportions
    corrected for false alarms, 5.78 and 4.07 uA (n 46 and 89), p = 9.97e-08, r = 0.56. Both medians are within
    tolerance under both readings. 18 of 1152 block fits have no finite threshold (reading a, 3 failed fits and
    15 with no 50% point), and a session with such a block has none; averaging the finite blocks gives 5.56 and
    3.97 uA under (a). psignifit's own threshold parameter under (a) gives 5.77 and 3.95 uA (p = 5e-08). Thresholds
    are lower late in each of the six mice. Without ICMS83, reading (a) gives 5.85 and 3.73 uA, reading (b) 5.89
    and 4.09 uA.
  deviations:
  - ICMS83's files have no catch trials and no block structure (180 to 480 trials, trial_index up to 625), so its
    sessions are fitted as one block with a false-alarm rate of 0; other mice use blocks of 100 trials by trial_index.
  - Blocks are fitted with all amplitudes presented (1 to 14 uA); the Methods' restriction to 4, 5 and 6 uA is read
    as applying to the neural analyses.
  - psignifit 4.3 with its default priors; the threshold is where the fitted curve gives 50% hits.
  - A session with a block without a finite threshold (a failed fit, or no 50% point) has no session threshold,
    as the session threshold is the mean of the four block thresholds (Methods, Analysis of behavioral data); the
    mean of the finite blocks is a variant.
- claim: figs1e-response-time
  outcome: reproduced
  notebook: reproduce_kim_2026_learning.ipynb
  output: claim:figs1e-response-time
  notes: Hit-trial response times at 4 to 6 uA are shorter late. (a) trials, 192.3 ms early (n 1644) against 179.2
    ms late (n 3764), p = 2.83e-11, r = 0.11; (b) channel-session medians, 222.8 (n 42) against 181.7 ms (n 87),
    p = 0.00256. Weekly medians are 231.6, 182.2, 198.5, 185.0 and 158.1 ms in weeks 0 to 4. Five mice are faster
    late; ICMS83 is slower late (254.9 against 356.0 ms).
  deviations:
  - The supplementary panel was not supplied; the test is the claims file's (two-sided Mann-Whitney U, early against
    late).
- claim: fig2b-representative-recruitment
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The volumetric dF/F is one value per ROI and stored sample, with 6 to 8 samples per trial placed within
    0.25 s of onset, and -1 in about half of the ROIs at three or four of the eight positions (sanity check, ICMS92
    2023-09-06). The files do not say which samples are pre-stimulus and which stimulation volumes; the catch-trial
    pattern across samples is the same as at 6 uA. The Methods' activation (at least 50% of an ROI's voxels above
    twice their baseline STD) needs voxel data that are not in the files, so the activated counts cannot be derived.
    The full description of the series says the DF/F is an A1 footprint average of pre/mid 4D stacks with baseline
    the mean of pre frames, without saying which samples are which; read as four pre and four mid samples, mid minus
    pre is 0.114 on catch trials and 0.080 to 0.320 at 2 to 6 uA, in no order by current. The segmentation tables
    of all 45 behavioural files with imaging hold only masks, sizes and source identifiers, with no activation or
    distance column.
