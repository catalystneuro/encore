- claim: fig4h-unit-counts
  outcome: not_reproduced
  notebook: reproduce_kim_2026_learning.ipynb
  output: claim:fig4h-unit-counts
  measured:
  - 999
  - 732
  - 260
  - 588
  - 406
  - 179
  notes: '999 units (973 +- 97.3): 732 pyramidal and 260 interneurons by the stored label, 7 unknown (724 and 275
    by the trough-to-peak recomputed from the mean waveform). Modulated units 588 (484 +- 48.4): 406 pyramidal,
    179 interneurons (402 and 186 by trough-to-peak); with all channels 588, with a one-sided test 599. Both histograms
    have a mode below 0.45 ms (0.383 ms) and one above (0.717 ms for all units, 0.617 ms for modulated), with a
    dip between. The recorded counts are within tolerance by trough-to-peak and the stored-label interneuron count
    (260) is just below 270.9; the modulated total is outside under every variant, so the claim fails by its criterion.
    Per mouse, recorded and modulated units are ICMS92 208/154, ICMS93 302/118, ICMS98 212/115, ICMS100 93/57, ICMS101
    127/108, ICMS83 57/36.'
  deviations:
  - The pre-stimulus window is 700 ms before onset, as long as the train; the Methods say pre-stimulus without a
    length (Methods, Quantifying neuromodulation metrics). This is an assumption.
  - Responses are selected by the code's filters that the claims file follows (more than 5 trials, 0 < z below 100
    or 50, stimulation channels used on at least 5 session days); the modulation test is two-sided with the stimulation
    count higher, and at least 50 spikes are counted in the stimulation window summed over trials.
  - Cell type by the stored cell_type label (main) and by the recomputed trough-to-peak (variant); they agree for
    90% of units.
  assumed: true
