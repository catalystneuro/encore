- claim: figs5-movement-onset
  outcome: reproduced
  notebook: reproduce_kim_2026_learning.ipynb
  output: claim:figs5-movement-onset
  measured:
  - 125.0
  - 143.0
  - 135.0
  notes: 'At 4 to 6 uA, in the five mice other than ICMS83: Mouse 1 (ICMS92) is the fastest, 125.0 ms (others 139.5
    to 196.5 ms); all hit trials 143.0 ms (n 4750); late 135.0 ms (n 2897), faster than early 155.0 ms (n 1306),
