    onset) are choices; the paper does not state them.
  - All seven STN mice have 10 trials per condition, where the Methods state 5.
- claim: fig2-gaba-frequency
  outcome: reproduced
  notebook: reproduce_hadjas_2025.ipynb
  output: claim:fig2-gaba-frequency
  notes: 1 s trains of the frequencies protocol. STN means rise from 4.07 to 32.66 % between 5 and
    40 Hz, Friedman 21.00, p = 0.00011, 7 of 7 mice higher at 40 than 5 Hz; PPN 1.57 to 6.10 %,
    Friedman 18.15, p = 0.00041, 8 of 8 (paper 21.0 and 18.2). A repeated-measures ANOVA variant
