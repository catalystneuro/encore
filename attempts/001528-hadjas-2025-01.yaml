findings:
- kind: data_missing
  statement: For the Anxa1 mice the dandiset holds DLS terminal recordings for 5 (STN) and 4 (PPN)
    mice where the paper analyses 8 and 10. Nine mice (C5903, C5906, C5992, C6900, C6902, C7244,
    C7245, C7248, C7249) have only recordings labelled SNc, without a site suffix in the file
    name. Their signals resemble SNc recordings, and the paper's cell-body statistics are
    reproduced exactly by the other nine mice's SNc recordings, so the DLS recordings of these nine
    mice appear not to be deposited, and the nine SNc recordings were not used in the paper.
- kind: selection_undocumented
  statement: The dandiset includes Anxa1 SNc recordings from nine mice that the paper's cell-body
    analysis (n = 5 and 4) leaves out, and it does not say which recordings the paper used.
- kind: data_missing
  statement: The human RNAscope and immunofluorescence counts of Figure 1 and Figure S1 and the
    histology of Figure S2 are not in the dandiset, and the preprint has no data availability
    statement.
- kind: data_missing
  statement: DA terminals in DLS have 8 mice where Figure S3 gives 9, and Vglut2+ neurons with STN
    stimulation 9 where Figure 5 gives 10.
- kind: data_missing
  statement: Subject C4608 (SNr GABA, PPN) has no 4 s trains in its frequencies session; the
    conversion notes say they were recorded in a separate session, which is not in the dandiset.
- kind: metadata_error
  statement: The dF/F series are stated in a.u. but hold percent (100 times (Gc - fit) / fit); a
    recomputation from the stored signals agrees with a median correlation of 0.9999 (durations)
    and 0.9988 (frequencies).
- kind: metadata_error
  statement: Every session start time carries the offset -00:01, the local mean time of London that
    pytz gives when a time zone is attached with replace; the true offset is lost.
- kind: metadata_error
  statement: The session description of the frequencies protocol gives an interval of 10 s between
    trains; the epochs and the Methods give 20 s.
- kind: other
  statement: Thirteen mice (SNr GABA and pan-DA, ids starting with B) have 10 trials per condition
    where the Methods state 5, and 30 mice have 16 s trains that the paper does not mention.
- kind: code_mismatch
  statement: The conversion code names the 1 s block of the STN to SNr GABA frequencies sessions
    s1s10mW, suggesting 10 mW, while the epoch tables and the Methods give 5 mW.
- kind: code_mismatch
  statement: The conversion repository's Python re-implementation of the dF/F forces the robust fit
    through the origin, saying the MATLAB version does so, while its own description of the MATLAB
    scripts includes an intercept.
- kind: metadata_error
  statement: The files describe the modulation inconsistently. The excitation source descriptions
    give 465 nm modulated at 210 Hz and 405 nm at 330 Hz, as the Methods do, while the processed
    series descriptions give the calcium signal as demodulated at 330 Hz and the isosbestic signal at
    210 Hz, as the conversion repository's description of the MATLAB scripts does. This attempt did
    not check which is right against the raw signal.
- kind: metadata_insufficient
  statement: The file names and session ids of nine Anxa1 mice carry no recording site, and every
    Anxa1 file lists both an SNc and a DLS fiber in its fiber photometry table, so the site rests
    on the name of the dF/F series alone.
- kind: other
  statement: Eight subject ids are written in lower case (c3015, c3016, c4379, c4708, c4709, c4977,
    c4978, c5113) while the others are upper case.
- kind: paper_inconsistency
  statement: The Results give F1,11 = 12.8 for the DLS frequency effect with 1 s trains for both STN
    (p = 0.0005) and PPN (p = 0.002); F(1, 11) = 12.8 gives p = 0.0043, and the data give F = 26.2
    for STN. Two Friedman entries for Anxa1 terminals also do not fit their p-values (F = 11.5 with
    p = 0.0002, F = 15.5 with p = 0.015; with 3 df these give 0.0093 and 0.0014).
- kind: methods_unavailable
  statement: The lab's MATLAB analysis scripts are not public; the preprint names custom MATLAB code
    and has no code availability statement. The conversion repository describes them.
- kind: other
  statement: The dandiset has no published version; this attempt used the draft as modified on
    2026-09-01T15:27:47Z.
