- claim: fig2-gaba-excited
  outcome: reproduced
  notebook: reproduce_hadjas_2025.ipynb
  output: claim:fig2-gaba-excited
  notes: 1 s 40 Hz trains, mean during the train against the 1 s before onset. STN mean 18.89 %
    dF/F, paired t = 3.86, p = 0.0083, n = 7 (paper t = 3.8, p = 0.008); PPN 6.45 %, t = 9.19, p =
    3.7e-05, n = 8 (paper t = 9.2). The 0.25 and 4 s trains also give significant increases (p
    1.4e-05 to 0.0066).
  deviations:
