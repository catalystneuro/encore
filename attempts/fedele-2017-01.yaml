- claim: fig2-patient17
  outcome: partially_reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:fig2-patient17
  notes: The FRandR area of patient 17 is FPR10-11 alone (threshold 2.00 per minute), which is not
