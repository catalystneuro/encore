- claim: fig3-patient1
  outcome: reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:fig3-patient1
  measured: 0.992
  notes: The FRandR area is PHR1-2 in each of the 4 nights; per-interval areas are inside the
    resected channels in 28 of 28 intervals; 99.2% of 378 interval pairs are significant with a null
    per pair and 97.6% with a pooled null.
- claim: test-retest-group
  outcome: partially_reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:test-retest-group
  assumed: true
  measured: [99.5, 55.0, 100, 91.7]
  notes: With FRandR and a null per pair, the interval median 99.5%, night median 100% and night
    lower quartile 91.7% are within tolerance, the interval lower quartile 55.0% is not (67 plus or
    minus 6.7). With the pooled null 93.4, 58.3, 100 and 91.7; with ripples or FR the values are
    further off (FR 87.3 and 57.5; ripples 100 and 100). 17 of 18 per-patient FRandR interval
    values are within 0.1 of Table 1; patient 8 has 0.55 against 0.67, which moves the lower
    quartile. No pair lacked a scalar product.
  deviations:
  - The HFO type of Table 1's test-retest values and the form of the permutation null are not given
    by the paper. All readings were run; FRandR with a null per pair is reported as the main one,
    as it matches Table 1's per-patient values best (17 of 18 within 0.1), Fig. 3 shows FRandR, and
    the Methods permute "for each interval". This is an assumption.
  - Interval rates use each interval's actual length; night rates are the mean of the night's
    interval rates (Methods, "we took the mean HFO rate for each night").
- claim: test-retest-by-group
  outcome: reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:test-retest-by-group
  assumed: true
  measured: [99.5, 100, 35.9]
  notes: Under FRandR with a null per pair, the medians are 99.5% (8 TLE patients with pairs), 100%
    (7 ETE good outcome) and 35.9% (3 ETE poor outcome with pairs), all within tolerance, the last
    the lowest. Split by outcome the TLE medians are 99.5% and 77.5%, which, as the claims file
    notes, Table 1 itself also implies (reading b is not supported by the paper's table).
  deviations:
  - Uses the reading adopted in test-retest-group (FRandR, null per pair), an assumption stated
    there.
- claim: spectral-classes
  outcome: partially_reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:spectral-classes
  assumed: true
  measured: [20421, 57.7, 341.7, 8.3, 175.0, 34.0]
  notes: The selected channels (one per patient, the highest FRandR rate in its FRandR area) hold
    20421 FRandR events, 3.3 times the paper's 6182. Under the main reading (raw signal, magnitude
    of S, fixed starting values, peaks of the fitted curve) 57.7% are bimodal, 8.3% unimodal and
    34.0% without a peak; under the ten readings run, bimodal 29.0 to 62.0%, unimodal 0.2 to 17.4%,
    none 28.2 to 53.7%, and no share is within tolerance except 28.2% without a peak in one reading.
    Bimodal is the largest class in 9 of 10 readings. The unimodal peak median (140 to 178 Hz across
    readings, 175.0 main) is within tolerance in the main reading; the bimodal second peak is not
    (312 to 456 Hz as the highest-frequency peak, 80 to 148 Hz as the most prominent). Fits that did
    not converge, 180 to 470 per reading, are classified from their last estimate.
  deviations:
  - The Stockwell transform is a port of st.m from the data set's detector.zip (no edge removal,
    factor 1), on 1200 samples centred on the event. In the deposit the FR and FRandR of an event
    share start and end, so both readings of the window centre are the same.
  - Open details, every reading run, none adopted on evidence; the main reading (raw signal,
    magnitude of S averaged over the event, fixed starting values at 100, 200, 300 and 400 Hz with
    50 Hz widths, amplitudes non-negative, widths 5 to 200 Hz, peaks as local maxima of the fitted
    curve) is an assumption. A fitted centre counts as a peak in the "centres" reading when its
    amplitude is at least 10% of the curve's maximum, a threshold chosen here. The power spectrum
    was run with fixed starting values only. High-passing is a 4th-order Butterworth at 80 Hz.
  - All FRandR events of all intervals on the channel are used; the paper's 6182 implies a smaller
    set that it does not describe.
- claim: spectral-tle-ete-no-difference
  outcome: not_reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:spectral-tle-ete-no-difference
  assumed: true
  notes: The criterion's main test, chi2 of spectral class by epilepsy type over events, finds a
    difference under every reading (main reading chi2 = 299.3, p of order 1e-65, 11153 TLE and 9268
    ETE events; bimodal 53.9% in TLE against 62.2% in ETE). The variant, a rank sum test of the
    per-patient bimodal fraction between 9 TLE and 11 ETE channels, finds none (p = 0.362 main; 0.149
    to 0.447 in the other readings except 0.023 for power with fitted centres). It rests on the
    spectral classification, which does not reproduce the paper's shares.
  deviations:
  - Uses the spectral readings of spectral-classes, an assumption stated there.
- claim: tp-patients-hfo-area-location
  outcome: blocked
  blocked_by: metadata_insufficient
  notebook: reproduce_fedele_2017.ipynb
  output: claim:tp-patients-hfo-area-location
  notes: The FRandR areas of patients 18 (PLL2-3), 19 (PL22-23, PL23-24) and 20 (OTL10-11) are
    outside the resected channels of Table 1S, but the electrode schemes (docs/electrode_schemes.pdf)
    draw the electrodes without the region of each contact, and patient 20's grid has no contact
    numbers, so occipital, parietal or anterior placement cannot be read.
findings:
- kind: data_missing
  statement: The data set holds no seizure outcome, postoperative follow-up, epilepsy type,
    resected channels or seizure onset zone, although its title names the outcome of epilepsy
    surgery. The outcome analyses can be run only with the paper's Table 1 and the colours of its
    supplementary Table 1S; the seizure onset zone is not available anywhere.
- kind: metadata_error
  statement: The data description says each file contains 5 minutes of recording. 93 of the 385
    intervals are not 300 s long; they range from 204 to 720 s. Rates computed as counts over 5
    minutes are off for these intervals.
- kind: metadata_insufficient
  statement: The data description does not give the unit of the signal x. The values (median
    absolute bipolar signal 20 to 93 per patient) and the HFO amplitudes are consistent with
    microvolts.
- kind: metadata_insufficient
  statement: The electrode schemes show where electrodes lie but not the region of each contact,
    and some grids (patient 20) have no contact numbers, so channels cannot be placed in a lobe or
    gyrus.
- kind: format_error
  statement: 745 event markings (667 R, 49 FR, 29 FRandR) end after the last sample of their
    interval, by up to 926 samples. Some event samples are not whole numbers (the data set's
    view_data.m rounds them).
- kind: metadata_insufficient
  statement: The data description does not say that each FRandR event is also listed, with the
    same channel, start and end, among the R and the FR events (true of all 93604 FRandR events), so
    that the FR part of an FRandR event cannot be told apart from the ripple part.
- kind: paper_inconsistency
  statement: Table 1S lists under patient 11 fifteen grayed (excluded) channels, IAR3-4 to PMR15-16,
    that are not patient 11's channels in the data set but are exactly the 15 channels of patient
    14 that Table 1S does not list.
- kind: paper_inconsistency
  statement: Table 1S and Table 1 disagree on whether the HFO area was resected. Ripple area of
    patients 7, 11 and 15, and FR area of patient 11, are green but not red (not resected) in Table
    1S and marked resected in Table 1; the FR area of patient 1 is red in Table 1S and marked not
    resected in Table 1. Table 2's ripple values follow Table 1.
- kind: paper_inconsistency
  statement: The Methods select up to six intervals per night, but the data set, like Table 1, has
    more than six intervals in some night for 14 patients, up to 16.
- kind: methods_unavailable
  statement: Question for the authors. Which HFO type and which permutation null give Table 1's
    test-retest values? The Methods permute the channel order "for each interval" and Fig. 3B plots
    one random distribution. With FRandR and a null per interval pair, 17 of 18 patients are within
    0.1 of Table 1 (patient 8 gives 0.55 against 0.67); a null pooled over a patient's pairs, or
    ripples or FR, match less well. This attempt assumed FRandR with a null per pair.
- kind: methods_unavailable
  statement: Question for the authors. How were the 6182 FRandR events of the spectral analysis
    selected, and how was the spectrum fitted? The highest-rate FRandR channel of each patient's
    FRandR area holds 20421 events over all intervals. The Methods do not give the starting values
    or bounds of the four gaussians, whether the magnitude or the power of the Stockwell transform
    was averaged, whether the signal was filtered, or how peaks and troughs were found on the fit;
    under ten combinations run here the shares are 29 to 62% bimodal, 0.2 to 17% unimodal and 28 to
    54% without a peak, against 45, 28 and 27%.
