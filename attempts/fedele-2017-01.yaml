    cells (HFO areas) are reference values.
  source: doi:10.1038/s41598-017-13064-1 (supplementary information)
- what: Table 1 of the paper (epilepsy type, ILAE outcome, follow-up months, nights, intervals,
    resection of each HFO area, test-retest values), parsed from the Europe PMC full text of
    PMC5653833 at run time. The outcome, epilepsy type and follow-up are not in the deposit.
  source: doi:10.1038/s41598-017-13064-1 (Europe PMC PMC5653833, fullTextXML)
outcomes:
- claim: table-s1-link
  outcome: reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:table-s1-link
  measured: [20, 1.0, 0.981]
  notes: Patients are matched by number; all 20 have Table 1's nights and intervals. All 600 rated
    channels of Table 1S are found among the deposit's bipolar labels once patient 18's PML contacts,
    which the table writes both as PML and PM, are given one spelling. 1766 of 1800 channel and type
    rates agree with Table 1S within 10% or 0.1 per minute (98.1%). Of the 37 gray channels of
    Table 1S, 22 are in the deposit; the 15 listed under patient 11 are patient 14's channels in the
    deposit.
- claim: cohort
  outcome: partially_reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:cohort
  measured: [20, 9, 11, 13]
  notes: The deposit holds 20 patients. Epilepsy type and outcome are not in it; the counts 9 TLE,
    11 ETE and 13 seizure free (65%, Clopper-Pearson 40.8 to 84.6%) come from Table 1, and Table 1S
    gives the same ILAE class for all 20. In the deposit the channels of patients 2 to 9 are all
    named after mesial temporal depth electrodes and patient 1 adds IAR and IPR strips, consistent
    with 9 TLE patients but not proof of it. The outcome part cannot be tested on the deposit.
  deviations:
  - Epilepsy type and ILAE class are taken from Table 1, as the deposit does not hold them.
- claim: table1-nights-intervals
  outcome: reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:table1-nights-intervals
  notes: All 20 patients have the nights and intervals of Table 1 (58 nights, 385 intervals). 14
    patients have more than six intervals in some night, up to 16 in night 5 of patient 5.
- claim: hfo-amplitudes
  outcome: reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:hfo-amplitudes
  measured: [27.35, 14.99, 9.13, 7.37]
  notes: Reading (a)(i), band-passed signal over all 3215247 ripples and 316872 FR, gives all four
    values within tolerance; reading (a)(ii), channels not grayed, also does (26.53, 14.26, 8.81,
    6.96). On the unfiltered signal the medians are 134.04 and 111.13 microvolt, far outside.
  deviations:
  - Filters are the data set's FIR_2kHz.mat (scripts.zip), applied forward and backward as in its
    view_data.m, in place of the detector's Filter_AsBurnos2016.mat named in the claims file; both
    implement the bands of the Methods (ripples 80-240 Hz, FR 250-490 Hz). The forward-backward
    filter is one convolution with conv(b, reversed b) on the oddly padded signal, differing from
    Matlab filtfilt only at the ends of each interval.
  - The unit of the signal is not stated by the data description; microvolts are assumed, which
    the match of the amplitudes supports.
- claim: followup-not-different
  outcome: reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:followup-not-different
  measured: [29.3, 22.8, 15.3, 10.7]
  notes: The follow-up is not in the deposit, so the test runs on Table 1's months, as the
    criterion allows. Rank sum p = 0.250 with the normal approximation and continuity correction
    and 0.275 exact, both above 0.05; difference of means 6.4 months. This checks the paper's table,
    not the data set.
- claim: table-s1-rates
  outcome: reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:table-s1-rates
  measured: 0.981
  notes: Pooling (a), all events over the total recorded time, matches 1766 of 1800 channel and
    type values (98.1%); (b) 98.1% (1765) and (c) 94.7%. With 5 minutes per interval in place of the
    actual length, 97.8% under (a). The mismatches under (a) are 33 values of patient 10, which
    Table 1S prints in whole numbers (1799 of 1800 match with 0.5 per minute for that patient),
    and one of patient 3. With pooling (a), the channels not grayed and the rule "greater than", the
    HFO areas equal Table 1S's green cells for all 60 patient and type pairs (59 with pooling c, 56
    with "greater or equal", 48 with all bipolar channels). Pooling (a) and channel set (a) with
    the strict rule are used for every dependent claim.
  deviations:
  - Rates use each interval's actual length, as 93 of 385 intervals are not 5 minutes long; the
    detector code in detector.zip divides by the analysed duration.
- claim: fig1-patient4
  outcome: reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:fig1-patient4
  notes: The FRandR area of patient 4 is AR1-2 alone (threshold 12.85 per minute), which is
    resected; the ripple area is PL2-3, outside the resected channels; 9 of 24 channels have FRandR
    rate 0.0 at one decimal.
- claim: frandr-area-resection-per-patient
  outcome: reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:frandr-area-resection-per-patient
  measured: [13, 3]
  notes: All 20 patients agree with Table 1; fully resected in 13 of 13 seizure-free patients and
    in 3 of 7 with recurrent seizures (7, 8, 9). Pooling (b) and (c) give the same; "greater or
    equal" gives 19 of 20, all bipolar channels 17 of 20, and variant (d), per-interval areas held
    in at least half the intervals, 18 of 20.
  deviations:
  - The resected channels are Table 1S's red cells, as the deposit does not mark them.
- claim: ripple-fr-area-resection-per-patient
  outcome: partially_reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:ripple-fr-area-resection-per-patient
  measured: [5, 3, 9, 5]
  notes: The ripple area agrees with Table 1 for 17 of 20 patients and the FR area for 18 of 20.
    The FR counts match; the ripple counts are 5 and 3 against 7 and 4. Every disagreement is one
    between the paper's own tables; the computed areas equal Table 1S's green cells, but in patients
    7, 11 and 15 those ripple cells are not red while Table 1 says resected, in patient 1 the FR cell
    is red while Table 1 says not resected, and in patient 11 one of three green FR cells is not red
    while Table 1 says resected. No other reading raises the agreement.
- claim: table2-frandr-prediction
  outcome: reproduced
  notebook: reproduce_fedele_2017.ipynb
  output: claim:table2-frandr-prediction
  measured: [100, 57, 81, 100, 85]
  notes: TP 4, FP 0, FN 3, TN 13. Clopper-Pearson intervals 18.4 to 90.1 (sensitivity), 54.4 to
    96.0 (NPV), 62.1 to 96.8 (accuracy), as printed, and 75.3 to 100 for specificity against the
    printed 78 to 100. The asymptotic intervals do not match the printed ones. Chi2 p = 0.0023
