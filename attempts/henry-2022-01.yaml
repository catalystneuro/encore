  notes: The data set holds 11 sessions and 22 populations per area, with exactly 396 V1 and 691 V4
    units (264 and 132, 288 and 403 per animal, as in Figure S7) and mean population sizes 18.0
    +/- 1.7 and 31.4 +/- 3.4, all within tolerance (given as measured). The deposited units are the
    paper's selected units. The Methods' rule applied to them, with blank epochs as the spontaneous
    condition, keeps 115 V1 and 147 V4 units under reading (a) and 133 and 174 under reading (b),
    mean sizes 5.2 to 7.9, outside tolerance. So sessions and populations hold under both readings
    and the unit counts hold only for the deposit as it is. In 12 of 22 populations per area
    (sessions 1, 2, 8 to 11) the epochs labelled blank respond like the target epochs, so no unit
    there can pass the rule.
  assumed: true
  deviations:
  - Assumed that the spontaneous rate is the count in the blank epochs (target and distractor
    contrast 0), the only spontaneous data in the files; the Methods do not say how it was
    measured. The question is recorded for the paper's authors as a methods_unavailable finding.
  - All later analyses use every deposited unit, since the stated selection does not regenerate the
    paper's counts and the deposit holds exactly those counts.
