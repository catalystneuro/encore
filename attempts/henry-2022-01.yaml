- claim: fig2f-v1-threshold-elevation
  outcome: not_reproduced
  notebook: reproduce_henry_2022.ipynb
  output: claim:fig2f-v1-threshold-elevation
  measured:
  - 1.685
  - 1.669
  notes: V1 threshold elevation 1.685 +/- 0.351 at 1.3 degrees and 1.669 +/- 0.314 at 2.6 (mean of
    AL 1.888 and CA 1.483; AL 2.062 and CA 1.277), outside 1.31 +/- 0.10 and 1.15 +/- 0.08. The
    permutation test gives p < 0.05 only at 2.1 degrees (0.048 and 0.047), not at 1.3 or 1.6 (0.18
    to 0.42) or 2.6 (0.059 and 0.062); with 5 folds none. Both trial-count readings give the same
    estimates, since they differ only in scale of the likelihood, so they are one reading for the
    estimate. 62 of 84 AL and 34 of 48 CA points have target-alone performance above 0.5 and enter
    the fit. With no crowding (true k = 1, binomial draws around the recorded performances) the
    estimate is biased upward, mean 1.17 to 1.18 in V1 (95th percentile 1.26 to 1.29), and the
    permutation nulls have medians of 1.37 to 1.63; the V1 estimates exceed the calibration but lie
    near their null medians (1.63 at 1.3 degrees, 1.49 at 2.6). The null is shifted much further
    than the calibration, so it is not calibrated by it; against the calibration every V1 estimate
    would count as elevated, against the null only 2.1 degrees does. The significance pattern
    therefore says little either way, and the outcome rests on the values. With each decoder that
    has no nonzero coefficient replaced by the nearest one that has one, V1 gives 1.688 and 1.575,
    also outside, with the same significance pattern.
  deviations:
  - The binomial trial count is read as (a) the held-out trials of one fold and (b) all trials of
    the pair; the maximum-likelihood k is the same under both, and only the bootstrap and
    permutation draws differ.
  - The paper's code is not public; the decoder's standardisation and penalty grid and the k grid
    (0.2 to 20) are standard choices that could change the estimates. Under the paper's penalty
    rule the chosen penalty leaves no nonzero coefficient in 9.9% to 14.5% of V1 and 4.8% to 18.4%
    of V4 outer folds, where the decoder predicts one class; how often depends on the grid's lower
    bound (C = 0.01). Replacing these decoders changes mean performances by at most 0.007 and the
    estimates little (variant in the notebook).
