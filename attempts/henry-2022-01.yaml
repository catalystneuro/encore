findings:
- kind: metadata_error
  statement: In sessions 1, 2 and 8 to 11 of the separation file (12 of 22 populations in each
    area, both animals) the epochs labelled blank (target and distractor contrast 0) and those
    labelled distractor-only give the same mean counts as the target epochs (mean z against blank
    -0.18 to 0.16), while in sessions 3 to 7 targets drive the units 1.7 to 3.7 SD above the blank
    epochs. The labels are aligned with the counts in all sessions (orientation tuning appears with
    the true labels and not with labels shifted by one epoch), so the blank and distractor-only
    labels of these six sessions cannot describe what was shown, or their counts are not those
    epochs'. The spontaneous rate the Methods' selection needs cannot be measured there.
- kind: metadata_insufficient
  statement: The V1 and V4 entries of each population hold the same number of epochs of every
    condition but in different orders (the condition agrees at the same index for 3 to 5% of
    epochs, the level of unrelated orders). The V1 order carries slow fluctuations consistent with
    recording order (median residual autocorrelation 0.11 at a lag of 10 epochs, 13 of 22
    populations above 0.1); the V4 order carries none (0 of 22). The description does not say how
    epochs are ordered, so V1 and V4 epochs cannot be matched and the even/odd split of V4 cannot be
    repeated (244 V4 units pass the paper's tuning criterion against its 198, while V1 gives
    exactly its 146).
- kind: metadata_insufficient
  statement: Each column is one stimulus epoch, and each trial had two epochs, but the files do
    not mark which epochs form a trial or which came first. The orientation experiment's file does
    not store the distractor spacing. The description mentions neither the blank nor the
    distractor-only epochs the files hold.
- kind: selection_undocumented
  statement: The data set holds exactly the paper's 396 V1 and 691 V4 units, but the Methods' rule
    (responses at least 1 SD above spontaneous) applied to them keeps only 115 to 133 V1 and 147 to
    174 V4 units, using blank epochs as the spontaneous condition. Figure S6A, which uses the same
    definition, shows only 0.3 to 0.5 of each population driven. How the deposited units were
    selected is not documented.
- kind: data_missing
  statement: The receptive-field mapping sessions (Figure 1B), the per-session coarse mapping of
    the target and each distractor (Figure S4) and the waveforms or SNR used for the well-isolated
    subset are not deposited; three claims cannot be tested.
- kind: paper_inconsistency
  statement: The Results state that the additive term was significantly larger in V4 than in V1 as
    "t test, p > 0.001", in a sentence that calls the difference significant.
- kind: methods_unavailable
  statement: For the paper's authors. (1) How was the spontaneous rate of the selection ("responses
    at least 1 SD above spontaneous rate") measured, and against which response; the deposited
    units cannot be regenerated from the blank epochs. (2) The decoders' feature scaling, penalty
    grid and folds, and the binomial trial count of the threshold-elevation fit, are not given;
    the threshold elevations here (V1 1.69, V4 7.30 at 1.3 degrees) differ from the reported ones.
    (3) How the tuning model's means and fit quality were averaged; V1 gives the paper's 146 fitted
    neurons but m = 0.41 against 0.59. The analysis code, which the paper offers on request, would
    settle these.
