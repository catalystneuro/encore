outcomes:
- claim: code-dataset-link
  outcome: reproduced
  notebook: reproduce_kaku_2025.ipynb
  output: claim:code-dataset-link
  notes: Every input of process_mat.py is in the files (spike times per trial with the per-trial counts, the six
    quality metrics, CCF coordinates and region names, the 25 kHz airflow with timestamps and per-trial sample counts,
    side and bottom DLC jaw, tongue and lickport with likelihoods, 3D jaw, tongue and lickport tracks). get_good_units
    keeps 20,109 units over the 335 files, 0.9% below 20,300; with the Methods' drift metric added, 16,957 (16.5%
    below). All 173 sessions ran through the code's steps. The spike index must be read as start offsets (finding).
  deviations:
  - The files are read directly; the code's nwb2mat converter (a Windows MATLAB executable) was not used.
- claim: units-count
  outcome: partially_reproduced
  notebook: reproduce_kaku_2025.ipynb
  output: claim:units-count
  measured:
  - 20109
  - 60.0
  - 4157
  - 3021
  - 8992
  - 335
  - 31
  notes: Code filter 20,109 units (tolerance 18,270 to 22,330), 60.0 per probe (SD 32.9 against 22), 31 mice; 335
    insertions, not 339. Cerebellum 4,157 (5,385 with the arbor vitae, within tolerance), pons 3,021 and medulla
    8,992, both below tolerance; 2,711 good units lie outside these regions. With the drift metric 16,957 units
    (CB 3,292, P 2,698, MY 7,626).
  deviations:
  - Regions are taken from the Allen structure tree (iblatlas copy, pinned) by the unit's region name; whether the
    paper counts the arbor vitae as cerebellum is not stated, and both counts are shown.
- claim: region-spike-rates
  outcome: partially_reproduced
  notebook: reproduce_kaku_2025.ipynb
  output: claim:region-spike-rates
  measured:
  - 21.26
  - 27.24
  - 10.91
  notes: 'Reading (a), avg_firing_rate: cerebellum 21.3 +- 28.8 (n 4,157), vestibular nuclei 27.2 +- 28.8 (n 1,276),
    medulla without VNC 10.9 +- 14.5 (n 7,716), with VNC 13.2. Reading (b), spikes in the first 5 s of good trials:
    21.4, 27.2, 11.3 and 13.6. Cerebellum and medulla (ii) are within tolerance; the vestibular nuclei are not (38
    +- 3.8) under any reading, though they still fire faster than the medulla.'
  deviations:
  - Reading (b) uses spikes in the code's analysis window (the first 5.0014 s of each good trial) over that time,
    since the trials carry no session times.
- claim: fig1d-lick-breath-frequencies
  outcome: not_reproduced
  notebook: reproduce_kaku_2025.ipynb
  output: claim:fig1d-lick-breath-frequencies
  measured:
  - 8.06
  - 3.89
  - 3.5
  - 13.37
  - 2.1
  - 6.68
  notes: 'Reading (a), within trials: licking 26.96 +- 38.48 Hz (95% range 1.11 to 147.06), breathing 3.89 +- 1.15
    Hz (2.10 to 6.68). Reading (b), within bouts: licking 8.06 +- 14.92 Hz (3.50 to 13.37), breathing 4.15 +- 1.01
    Hz (2.37 to 6.39). Breathing is within tolerance on all three values under (a); the licking mean is outside
    under both readings. The code''s tongue onsets include onsets a few milliseconds apart (tongue detection flickering
    between frames), which inflate the mean of inverse intervals. The per-session median lick frequency within bouts
    is 6.13 Hz (5th to 95th percentile over sessions 5.16 to 6.54).'
  deviations:
  - measured gives licking under reading (b) and breathing under reading (a), the readings closest to the paper's
    values for each; no single reading matches all six.
- claim: fig1f-inspiration-between-licks
  outcome: not_reproduced
  notebook: reproduce_kaku_2025.ipynb
  output: claim:fig1f-inspiration-between-licks
  notes: 70,298 of 231,563 in-bout inspiration onsets (30.4%) fall between a tongue onset and the next tongue offset;
    per session 3.3% to 46.1% (median 30.0%); no session has none, so readings (a) and (b) both fail. The median
    latency from the last lick in a cycle to the next inspiration is 133 ms (1 lick), 92 ms (2), 82 ms (3) and 109
    ms (4).
  deviations:
  - A protrusion is taken from each tongue onset to the first tongue offset after it, both as the code detects them
    (likelihood > 0.95 in both views); the paper does not define the interval.
- claim: fig1g-lick-delayed-before-slow-breath
  outcome: partially_reproduced
  notebook: reproduce_kaku_2025.ipynb
  output: claim:fig1g-lick-delayed-before-slow-breath
  measured: 0.022
  notes: '71 of 173 sessions give a value (83 have at least 40 two-lick cycles per half; the others lack a peak
    in a window). Reading (a), sessions: mean 22.0 ms, t = 3.68, p = 4.5e-4. Reading (b), mice: mean 13.6 ms, p
    = 0.18 (n = 20). 16 of 20 mice have a positive mean, 1 zero and 3 negative (DL008 -120 ms from one session,
    DL011 -50, DL027 -33). 60 sessions are positive, 6 zero, 5 negative.'
- claim: fig1f-licking-mode-switch
  outcome: partially_reproduced
  notebook: reproduce_kaku_2025.ipynb
  output: claim:fig1f-licking-mode-switch
  notes: The median inter-breath interval rises from 1 to 2 to 3 licks per cycle in 116 of 117 sessions that have
    all three (median session medians 0.228, 0.296, 0.418 s; 4 licks 0.558 s), so licks are added as breathing slows.
    The latency from the last lick to the next inspiration differs by 62.5% between the groups (pooled medians 133,
    92 and 82 ms), and only 1 of 117 sessions keeps it within 20%, so the fixed-latency part of the criterion fails.
- claim: fig1i-breath-delayed-before-slow-lick
  outcome: reproduced
  notebook: reproduce_kaku_2025.ipynb
  output: claim:fig1i-breath-delayed-before-slow-lick
  measured: 0.0105
  notes: '86 sessions give a value. Reading (a): mean 10.5 ms, t = 6.79, p = 1.5e-9; reading (b), 23 mice: 9.6 ms,
    p = 0.0012. 44 sessions positive, 37 zero (the PSTH bins are 20 ms), 5 negative; 18 of 23 mice positive.'
- claim: ed1-unidirectional-models-fail
  outcome: reproduced
  notebook: reproduce_kaku_2025.ipynb
  output: claim:ed1-unidirectional-models-fail
  notes: 'Inter-breath intervals from fig1d reading (a), inter-lick intervals from reading (b); ranges 0.150 to
    0.476 s and 0.075 to 0.286 s (2.5th to 97.5th percentiles); latencies 112 ms (last lick to inspiration) and
    119 ms (inspiration to next lick). Breathing-driven model: Fig 1i difference 0.0 ms in all 162 simulated sessions
    with a value (no variance, so no test). Licking-driven model: a Fig 1g value in only 2 sessions (no second-lick
    peak in the code''s windows otherwise), so no positive significant effect. Data: 22.0 and 10.5 ms, both p <
    0.001. The breathing-driven model does give a Fig 1g effect (48.4 ms, p = 6e-19, 31 sessions) and the licking-driven
    model a Fig 1i effect (33.7 ms, 169 sessions), each producing one direction only.'
  deviations:
  - Simulated sessions match the data sessions in the number of in-bout inspirations (breathing model) or licks
    (licking model); sessions with fewer than 50 in-bout inspirations are skipped.
  - Licks are added evenly inside inter-lick intervals longer than the 97.5th percentile (breathing model), and
    an inspiration is omitted when it would follow the previous one by less than the 2.5th percentile inter-breath
    interval (licking model); the Methods describe both steps without numbers.
