findings:
- kind: format_error
  statement: In all 335 files units/spike_times_index holds the offset where each unit's spikes start, not where
    they end as NWB requires; standard readers (pynwb) therefore give every unit the spikes of the unit before it.
    The per-unit, per-trial spike counts in 'unit and trial pairs' agree with the start-offset reading in every
    file.
- kind: format_error
  statement: In 19 files the units/histology table (region and CCF position) has more rows than the units (for example
    680 against 613 in DL034 session 20220205 probe p2), so its rows cannot be matched to units with certainty;
    the paper's code, and this attempt, take them by position.
- kind: metadata_error
  statement: The subject age field reads P210W to P303W (210 to 303 weeks) for every file, which does not fit adult
    mice in an acute recording study; the general/stimulus field says 'photostim' in every file, but no file holds
    photostimulation or cue data.
- kind: metadata_error
  statement: The 'left'/'right' hemisphere text of unit_location and of the insertion's recordable_brain_regions
    puts 99.3% of units on the side opposite to the one ccf_x gives if it increases to the right (midline 5,700
    um); the files do not name the CCF axes or their direction, so the side of a unit cannot be fixed.
- kind: metadata_insufficient
  statement: The 3D tracking (jaw_side, tongue_bottom, lickport_bottom) has no stated axes, origin or units, and
    the trial tables have no target position, so the lick direction of Extended Data Fig 8 cannot be computed.
- kind: other
  statement: Every trial in the trial tables starts at 0 and spikes, tracking and airflow are stored per trial relative
    to its start, so trials cannot be placed on one session clock and inter-trial periods are absent.
- kind: other
  statement: In every two-probe session (162) the airflow and DLC tracking of the two files are the same recording
    deposited twice (identical samples and lengths). The 3D tracking holds one trial fewer than the trial table
    in 211 files, and the side-camera DLC rows differ from trials x 1471 in 25 files.
- kind: data_missing
  statement: The dandiset holds only the multi-directional licking task recordings (335 insertions, where the paper
    reports 339). The cued licking task, the ALM, latSC and brainstem photostimulation experiments, the rat recordings,
    the raw videos used by the autoencoder and the premotor tracing data are not in it, and the paper names no other
    deposit; 15 of the 48 claims are blocked for missing data.
- kind: code_mismatch
  statement: The Methods list a drift metric < 0.5 among the unit filters and a 4-pole Butterworth filter for phase
    tuning; the paper's code applies no drift filter and uses a 5th-order filter. The code's filter gives 20,109
    units, close to the paper's 20,300; with the drift metric it gives 16,957.
- kind: methods_unavailable
  statement: 'Question for the authors (fig2-licking-breathing-tuned-counts): the Methods compare the measured MI
    against 1000 MIs from resampled phases with a Wilcoxon rank-sum test. Is the test between MIs of resampled spike
    phases and MIs of random session phases (as process_mat.py does, 100 of each), or of the measured MI against
    the random-phase MIs? The first reproduces 3,517 / 1,021 / 177 tuned units here, the second 2,757 / 602 / 69.'
- kind: methods_unavailable
  statement: 'Question for the authors (fig2h-swallow-units-location, fig2-swallow-modulated-counts): is the swallow
    MI normalised by the larger of the two window rates (the code) or by the peak of the swallow PSTH (the Methods''
    ''peak spike rate during swallowing'')? Here the first gives three of five enriched regions, the second two.
    Neither reproduces the counts 427 / 175 / 55; how were swallow-only units defined?'
- kind: methods_unavailable
  statement: 'Question for the authors (fig2f, ed8bc, fig4d, fig4e, fig4f): how were units ''near the preBotzinger
    complex'' and in ''posterior-dorsal IRN/PARN'' selected, since the CCF does not label them, and which 43 recordings
    form Fig 4d? With a region built below the AMB-labelled units only 16 units qualify and 1 or 2 recordings, and
    this attempt adopted the all-session reading of Fig 4e-f where the simultaneous reading leaves too few units.'
