  outcome: not_reproduced
  notebook: reproduce_kaku_2025.ipynb
  output: claim:ed1bc-licks-pause-at-swallows
  notes: '90 sessions with at least 20 swallows. Tongue-onset probability per 3.4 ms bin, 0 to 100 ms after onset:
    0.0308 around swallows against 0.0211 around in-bout expiration onsets (median ratio 1.50); lower around swallows
    in 4 of 90 sessions; Wilcoxon p = 4.0e-16 in the opposite direction. The code''s detector keeps swallows with
    a lick within 0.25 s after the detected peak, which may favour licks after the onset.'
  deviations:
  - Expiration onset is the Hilbert phase (code filter, plus pi) wrapping through 2 pi, the claims file's choice.
