- claim: fig2-licking-breathing-tuned-counts
  outcome: partially_reproduced
  notebook: reproduce_kaku_2025.ipynb
  output: claim:fig2-licking-breathing-tuned-counts
  measured:
  - 3517
  - 1021
  - 177
  notes: 'Counts with licking and breathing including the units tuned to both (i). V3(a): order 4 3,517 / 1,021
    / 177; order 2 3,584 / 1,030 / 193; code order 5 3,500 / 1,026 / 177; all within tolerance of 3,551 / 1,015
    / 182. The code''s 100-resample scheme gives the same (3,515 / 1,020 / 177 at order 4). V3(b): order 4 2,757
    / 602 / 69, order 2 2,806 / 604 / 70, outside. Under (ii) no reading matches. As the criterion asks for every
    reading of V3, the counts do not hold; the partial rule holds under every reading (both-tuned 2.5% to 5.4% of
    licking units, 11.5% to 18.7% of breathing units). V3(b) ranks the measured MI against random-phase MIs, which
    for noisy units are often as large as the measured one; V3(a) compares resampled-spike MIs with random-phase
    MIs, as the Methods'' rank-sum test and the code do.'
  deviations:
  - The 1000 resampled tuning curves per unit are fitted by a grid search over width and preferred phase with amplitude
    and baseline in closed form, not curve_fit; the measured MI uses curve_fit as the code. On 300 random units
    the two fits differ by a median of 0.0015 in MI and fall on the same side of 0.6 in 99%; on 24 units with MI
    > 0.6 the code's 100-resample test gives the same decision with either fit.
  - Resampled histograms are drawn as multinomials on the measured histogram's bins, which has the distribution
    of the code's resampling; the code's bin edges follow each resample's range.
  - Significance resamples are computed only for units whose measured MI exceeds 0.6, the only units that can count.
