inputs:
- what: Allen CCF structure tree (names, acronyms and parent regions), to map the files' region names to the regions
    the claims name.
  source: https://github.com/int-brain-lab/iblatlas at commit b88da5d8541d77285565fdb3f86f4f69c50b9e68 (iblatlas/allen_structure_tree.csv)
- what: The paper's analysis code, whose steps are ported in kaku.py (as the claims file adopts them); no data from
    it.
