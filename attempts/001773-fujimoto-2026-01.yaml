- claim: fig4b-roi-changes-counts
  outcome: reproduced
  assumed: true
  notebook: reproduce_fujimoto_2026.ipynb
  output: claim:fig4b-roi-changes-counts
  measured:
  - 69
  - 44
  notes: The paper's Fig. 4 script tests each ROI with `ranksum` of its off-diagonal changes against
    a vector of zeros, significant at P < 0.05/nrois, with nrois = 123. Computed as MATLAB's
    ranksum (tie and continuity corrected), this gives 69 ROIs for the DBS group (41 of 54
    cortical, 28 of 69 subcortical) and 44 for the controls, the reported counts, with or without
    the diagonal. The largest P counted is 3.88e-04 in both groups, the largest value listed in
    Supplementary Tables 1 and 2 (3.9e-4), which the text's threshold (0.01/122 = 8.2e-05) would
    exclude. None of the readings the criterion names puts both counts in tolerance (62.1 to 75.9
    and 39.6 to 48.4). Pre against post rank-sum gives 10 to 44 (DBS) and 4 to 15 (controls);
    signed-rank of the changes 60 to 85 and 27 to 49; both over the thresholds 0.01/122 and 0.01
    uncorrected and with or without the diagonal. The script's test at the text's threshold gives
    62 and 36. The outcome rests on taking the test and threshold from the script, which a question
    to a reader asks about (questions/001773.yaml).
  deviations:
  - Assumption. The per-ROI test and threshold are those of the paper's Fig. 4 script in the
    dandiset (rank-sum of the changes against zeros, P < 0.05/123). The Methods and the Fig. 4b
    legend say "Rank-sum test ... (P < 0.01 with Bonferroni correction)" and "changes ... from
    zero"; the script and the paper's Supplementary Tables 1 and 2 agree with each other and
    not with the 0.01 of the text. The readings the criterion names were all run and none
    matches.
  - The matrices have 123 ROIs, so each ROI has 122 values, the n of the legend; the threshold
    uses 123 as the script does (0.01/122 is also shown).
