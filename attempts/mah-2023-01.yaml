- claim: fig3f-inferential-model-not-sensitive-to-previous-offer
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_mah_2023.ipynb
  output: claim:fig3f-inferential-model-not-sensitive-to-previous-offer
  notes: The inferential model of GenerateSynthData_Bayes.m fitted to each rat (100 random starts) predicts wait times,
    one noisy draw as Figure3.m uses, that are longer after offers below 20 uL (+0.033 z) than above (-0.032 z); rank-sum
    on per-rat means p = 9.52e-11 (signed-rank 3.51e-09), so by the claim's test the model is sensitive to the previous
    offer. Without noise the difference is +0.448 z (p = 1.49e-68). The rats' own difference is -0.012 z. The effect
    comes from the mixed-block trials the model labels high or low (median 8.5% per rat), with kappa_high > kappa_mixed
    > kappa_low in 197 of 291 rats. It is small (+0.065 z, about a quarter of the rats' initiation time sensitivity of
    +0.248 z), and 16 rats reach p < 0.05 against the rats' 38. On J004 the fit recovers its generating parameters to
    within 0.004. 6 of 291 fits have a parameter within 1e-4 of a bound. Changed from blocked after the round 1 verification,
    which found the fit feasible.
  deviations:
  - The fitting code is not in the paper's repository. The model and its parameter scaling follow GenerateSynthData_Bayes.m
    (params in [0, 1], kappa = params C log2(min reward) / tau, D = 10 params, R = log2 of the raw volume, C = max(1
    - catch probability), tau = 2.5 s) and the noise the Methods give (log-normal, variance 8). The likelihood is taken
    over opt-out catch trials, the trials where the wait time is the rat's choice, an assumption.
  - scipy's bounded L-BFGS-B from 100 random starts in place of fmincon from 100 random seeds (Methods, Fitting and evaluating
    models).
