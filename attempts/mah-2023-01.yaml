findings:
- kind: selection_undocumented
  statement: The dandiset holds only the sessions that pass the paper's inclusion criterion (it was converted from the
    lab's A_Structs_Final), which neither its description nor its files say. The sessions that fail it, which the paper's
    learning analyses (Fig. 4) and pre-cue analyses (Fig. 5) use, are not in it.
- kind: metadata_insufficient
  statement: Nothing marks the sessions run on the pre-initiation cue task. The 16 rats of Fig. 5 are among the 291,
    their pre-cue sessions are included, and all sessions have protocol RWTautowait2. The switch dates in the paper's
    Figure5.m mark them for 14 of the 16 rats, as initiation times depend on the current offer only after the date.
- kind: metadata_error
  statement: One session is deposited twice, sub-L011_ses-RWTautowait2-20221004-095612.nwb and the same name with a "-x"
    suffix, with identical trial data.
- kind: metadata_insufficient
  statement: The processed trial table has no catch probability. The conversion maps the A struct field under the misspelled
    name prob_cacth, so prob_catch is dropped; the value is only in the raw trial table (catch_percentage), which has
    the same rows.
- kind: other
  statement: The raw trial table's is_catch differs from the processed is_catch on 176,009 trials; the processed flag
    is reward_delay == 100, as the lab's parser defines it, and the raw flag is set on trials with ordinary delays. Neither
    description says which to use.
- kind: metadata_insufficient
  statement: The subject age is empty in 21,853 of 23,034 files and is the range P6M/P24M in the others, so no rat's
    age is given.
- kind: other
  statement: 360 sessions of 8 rats have catch probability 0.3, which is not among the five cohorts the paper lists (0.1,
    0.15, 0.2, 0.25, 0.35).
- kind: methods_unavailable
  statement: The code that fits the wait time models (inferential, belief state, sub-optimal and retrospective) is not
    in the paper's repository, which loads the fits from files. Question for the authors - which trials enter the likelihood
    (opt-out catch trials only, as assumed here for fig3f and fig3l, or hit trials as censored), what bounds and starting
    ranges are used, and how the 5 folds are formed (whole sessions, as assumed here for suppfig9, or trials)?
- kind: code_mismatch
  statement: Equation 6 lets a mixed block become a low (or high) block with probability H0, while every model script
    uses H0/2 for each (p_b in GenerateSynthData_Bayes.m). Question for the authors - which was used for the fits? Both
    give the same outcome for the Bayes observer claim here.
- kind: code_mismatch
  statement: Figure5.m lists 16 rats but 20 start dates, and the Methods' 30-session offset for switched rats is not
    in it; the code uses the first 16 dates. Question for the authors - are the dates paired with the rats in order,
    and were sessions before the 30th pre-cue session left out?
- kind: paper_inconsistency
  statement: The correlation of the two time constants is r = 0.08, p = 0.18 in the Results and r = -0.03, p = 0.53 in
    the Figure 2f legend; this attempt finds r = -0.032 and +0.023 under the two readings.
- kind: code_mismatch
  statement: myTauShuffleTest.m refits the shuffled groups' mean coefficients times 10 with D at most 1, and the observed
    groups' coefficients unscaled; for wait times the coefficients include the current offer (about 0.2, so about 2 after
    scaling), and every shuffled fit sits at the bound, so the null is not on the observed scale. The Methods describe
    the fits on previous trial coefficients only. Question for the authors - was the wait time test meant to include
    the current offer?
