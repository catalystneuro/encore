- claim: fig3i-retrospective-model-captures-initiation
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_mah_2023.ipynb
  output: claim:fig3i-retrospective-model-captures-initiation
  notes: On rat J004's trials (as Figure3.m and FigureS7.m simulate), the Equation 10 model shows an overshoot (+0.016
    with noise variance 8, +0.081 with 4) and a persistent post-high above post-low gap (+0.239, +0.287). The static
    learning rate lacks one feature at alpha_0 0.05 and 0.4 but shows both at 0.8 (gap +0.0041 with noise, -0.0001 without).
    The unsigned prediction error gain lacks the gap at 0.05 but shows both at 0.4 and 0.8, with gaps +0.012 and +0.006
    (+0.025 and +0.013 without noise). The criterion, which sets no threshold, asks each alternative to lack one feature
    at every alpha_0, which fails at three of six settings, so the alternatives' part holds only in part. Controls added
    in revision - a noise-only flat time gives mean overshoots of +0.011 to +0.019 (95th percentiles +0.029 to +0.058)
    and gap 95th percentiles of +0.010 to +0.020. Judged against these, every alternative lacks one feature at every
    alpha_0, and the Equation 10 model shows both at noise 4 but not at noise 8 (overshoot +0.016 against +0.046). Without
    noise or smoothing, all models overshoot (+0.43 for Equation 10, +0.21 to +0.31 for the alternatives at 0.4 and 0.8)
    and the alternatives at 0.4 and 0.8 show gaps of +0.11 to +0.21 against +1.24. The two controls point different ways,
    and the outcome follows the criterion as written. For Fig. 3i, the model's initiation times are higher after offers
    below 20 uL (+0.052 z) than above (-0.049 z) in 290 of 291 rats, as the rats' are.
  deviations:
  - For the Fig. 3i part, Figure3.m simulates each rat with its own retrospective parameters fitted to wait times, which
    are not in the dandiset (they are in the Zenodo deposit) and were not refitted (see fig3j). J004's parameters (alpha_0
    0.1042, D 0.2527) are used for every rat, an assumption; the direction of the effect follows from the model's update
    rule for any small positive alpha_0.
  - Each script's own scaling of D, initial kappa and reset at session starts is used (D times 25, 10 and 15; kappa starting
    at mean(log(rewards)), 20 and 0.5), as GenerateLatencyData_AlphaPHModel.m, _VanillaAlpha.m and _RPEAlpha.m set them.
    The static model averages 10 noise draws per trial, as its script does.
  - The overshoot and gap measures are the claims file's; their signs only are judged, so values near 0 decide the alternatives'
    part.
- claim: bayes-observer-offer-reduces-uncertainty
  outcome: reproduced
  notebook: reproduce_mah_2023.ipynb
  output: claim:bayes-observer-offer-reduces-uncertainty
  notes: With the code's and Equation 6's transition matrices, the posterior is less uncertain than the prior in every
    rat under both readings. Variance of block probabilities rises from 0.157 to 0.169 and variance of block value falls
    from 0.104 to 0.082 (code's matrix), per-rat signed-rank p = 1.8e-49 for each; over the trials of J004 p = 5.31e-257
    and p = 0, and over all rats' 6,037,811 trials pooled p = 0 for both readings (mean change +0.0124 and -0.0222).
  deviations:
  - The inference follows GenerateSynthData_Bayes.m (trials with a wait time; belief reset to 1/2, 1/4, 1/4 at session
    starts, where there is no prior). The code's transition matrix moves from mixed to high or low with H0/2 each, where
    Equation 6 gives H0; both were run.
  - Under the reading by variance of the block probabilities, a less uncertain posterior has a larger variance, so the
    test is for an increase there and a decrease for the variance of block value.
