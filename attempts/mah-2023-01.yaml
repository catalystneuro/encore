- claim: fig2a-wait-time-converges-in-mixed-blocks
  outcome: reproduced
  notebook: reproduce_mah_2023.ipynb
  output: claim:fig2a-wait-time-converges-in-mixed-blocks
  notes: The wait time gap between curves after high and after low blocks over trials 1 to 20 is 0.325 of its size
    over trials -20 to -1 (0.082 over 10 to 20); for initiation times it is 2.31 times that size with the code's
