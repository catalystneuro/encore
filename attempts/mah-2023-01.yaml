  notebook: reproduce_mah_2023.ipynb
  output: claim:fig3l-lambda-groups-wait-time-dynamics
  notes: The fitted lambdas pile up at the bounds (59 rats at 0, 69 at 1, median 0.775), so the 20th and 80th percentiles
    are 0 and 1 and the groups are the rats at them (59 and 69, N = 128 against 116). At mixed to low the wait time slope
    C does not differ (shuffle p = 0.242; 0.197 with the 40/60 split), which the criterion needs. At mixed to high the
    wait time upper asymptote D differs (p = 0.000 under both splits) but C does not (0.355, 0.237). Initiation times
    also differ in D at mixed to high (p = 0.028; 0.007 with per-session detrending, 0.006 with the 40/60 split), so
    their absence fails under the legend's reading; their C does not differ (0.129 to 0.494). Neither reading holds under
    either split. Changed from blocked after the round 1 verification.
  deviations:
  - The sub-optimal model follows GenerateSynthData_Bayes_subopt_onlylambda_flat.m and is fitted with the likelihood
    of fig3f (opt-out catch trials, log-normal noise of variance 8), an assumption, as the fitting code is not public.
  - The likelihood changes with lambda only in steps, so lambda is profiled over 41 values from 0 to 1 and the other
    4 parameters fitted at each (2 starts, one warm-started), in place of fmincon from 100 random starts.
  - Figure3.m forms the groups with strict inequalities (lambda above or below the percentile); with ties at 0 and 1
    both groups would be empty, so the rats at the percentile join the group (a tie-break).
  - Logistic fits with scipy's bounded least_squares from 10 random starts in place of fmincon (my_fit_sigmoid.m), with
    its bounds; transition curves with 30 trials either side and 10-trial smoothing (Figure3.m).
