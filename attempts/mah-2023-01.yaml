- claim: fig3j-inferential-beats-retrospective-for-wait-times
  outcome: blocked
  blocked_by: too_large
  notebook: reproduce_mah_2023.ipynb
  output: claim:fig3j-inferential-beats-retrospective-for-wait-times
  notes: The refit needs each rat's wait times fitted by the inferential and retrospective models with 100 random starts
    (Methods, Fitting and evaluating models), on all data and on 5 folds. Revised after the round 1 verification - with
    the retrospective likelihood compiled (numba), one evaluation on J004 takes 0.15 ms (19 ms in pure Python), and an
    inferential fit with 100 starts takes about 0.65 s per rat (fig3f). From the 192 evaluations per start counted in
    those fits, the refit on all data and 5 folds is estimated at 2.6 h on one core for the retrospective model (0.64
    h on 4) and 0.6 h for the inferential and belief state models, about 3 h in all, beyond the notebook limit of 1 h
    with the 26 minutes the notebook already takes. The first run's 138 h estimate timed a pure Python loop and an assumed
    200 evaluations per start. The fitting code is not in the paper's repository, so the trials in the likelihood, the
    bounds, the starting ranges and the folds are also open. The paper's fits are in the Zenodo deposit (doi:10.5281/zenodo.10031483)
    as BestFit.mat files of about 1.1 GB each inside a 12.4 GB zip; using them would test the paper's fits, not the dandiset,
    and was not tried.
