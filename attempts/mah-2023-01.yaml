- claim: fig2e-tau-differ
  outcome: reproduced
  notebook: reproduce_mah_2023.ipynb
  output: claim:fig2e-tau-differ
  notes: Signed-rank p = 1.7e-45 (Methods' reading) and 2.28e-44 (code's reading), against the paper's 1.3e-49.
    Mean initiation tau 2.06 and 2.04, mean wait time tau 0.066 and 0.098; the wait time tau is 0 in 248 of 291 rats,
    the initiation tau in 19 and 26. 266 and 261 rats have a larger initiation tau.
  deviations:
  - The exponential is fitted by an exact least-squares profile (D solved for each tau on a grid within the bounds,
    then a bounded search over tau) in place of fmincon from 10 random starts. A gradient search from random
    starts was tried while preparing and stalled at D = 0 in many rats, where the error does not depend on tau;
    the profile finds the optimum the random starts look for.
