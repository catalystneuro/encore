- claim: monkey-l-perturbations
  outcome: blocked
  blocked_by: data_missing
  notes: No monkey L (Leu) file marks a torque perturbation; torque_perturbation_type is "none"
    and the onset NaN in every Leu trial. The Leu torque command is NaN in all 98 pre-MPTP files
    with analog data, and 15 of 51 post-MPTP Leu files have no analog data. The joint moves by
    more than 2 deg in the hold window in 15% (pre) and 1% (post) of Leu trials, against 66 to 86%
    of monkey V perturbed trials. The perturbations may exist in the lab's source files; they are
    not in the dandiset.
- claim: baseline-rate
  outcome: reproduced
  notebook: reproduce_pasquereau_2013.ipynb
  output: claim:baseline-rate
  measured: [12.42, 8.87, 18.03, 14.48, 3.42, 3.36]
  notes: All six monkey V means are within tolerance. PTN rates are lower after MPTP (Mann-Whitney
    p = 0.034), CSN rates do not differ (p = 0.73), and the M1 rate is lower (p = 0.0033, below
    the paper's 0.05/2). The statement's p < 0.001 for PTNs, from both monkeys, is not reached
    in monkey V alone.
  deviations:
  - Monkey V only.
  - The baseline is the mean SDF over the 500 ms before onset over all perturbation trials, a
    reading of the Methods.
- claim: ptn-faster-than-csn
  outcome: reproduced
  notebook: reproduce_pasquereau_2013.ipynb
  output: claim:ptn-faster-than-csn
  notes: Pre-MPTP monkey V PTNs 18.03 spikes/s (n = 49), CSNs 3.42 (n = 31), Mann-Whitney p =
    1.3e-11. The paper's pooled means differ between its text (16.3 and 3.6) and Table 1 (18.3
    and 3.2).
  deviations:
  - Monkey V only.
