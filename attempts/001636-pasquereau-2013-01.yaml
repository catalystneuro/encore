  output: claim:antidromic-latency
  measured: [1.96, 1.86, 4.89, 6.85]
  notes: The four means are within tolerance and PTN latencies do not differ (p = 0.54). CSN
    latencies are longer after MPTP with p = 0.018, just above the paper's 0.05/3 = 0.0167, so
