  measured: [112, 159, 49, 54, 31, 48, 3]
  notes: Monkey V units with at least 5 perturbations of each direction number 112 before and 159
    after MPTP, with 49 and 54 PTNs and 31 and 48 CSNs, exactly the supplementary table's counts.
    The files hold 3 units activated from both the peduncle and the putamen, all in monkey V and
