findings:
- kind: data_missing
  statement: The monkey L (Leu) files mark no torque perturbation; torque_perturbation_type is
    "none" in every Leu trial, the Leu torque command is NaN in every pre-MPTP file, and 15 of 51
    post-MPTP Leu files have no analog data. The monkey L half of the paper (115 and 73 cells,
    and its EMG and kinematics) cannot be tested.
- kind: format_error
  statement: The analog streams (ElbowAngle, ElbowTorque, ElbowVelocity, EMG) are not on the clock
    of the trials table and spikes. The conversion lays each trial's analog samples end to end by
    sample count, while trials and spikes use the behavioural trial end, about 5 ms later per
    trial, so the stored analog clock falls behind by up to 365 ms within a session. Moving each
    analog segment to its trial's start puts the torque command step 4 to 7 ms after every
    labelled onset; on the stored clock it falls up to 108 ms before it.
- kind: other
  statement: The torque command's 50 ms pulse has three sizes (about 46, 91 and 183 units above
    rest). Most pre-MPTP monkey V sessions have the smallest (108 of 157) and most post-MPTP
    sessions the largest (129 of 141), and post-MPTP pulses are followed by an opposite swing.
    The paper describes one 0.1 Nm, 50 ms impulse; the command's scale is not given, so the
    change may be of the torque or of the command's recording. Movement and EMG results differ
    between command sizes.
- kind: metadata_error
  statement: The ElbowAngle reference_frame says positive is extension; active flexion movements
    and flexion torques raise the angle in both monkeys, so positive is flexion. The series are
    named Elbow for monkey L, whose task used the wrist.
- kind: metadata_error
  statement: Four monkey V files (v4527b, v4810b, v5604b, v5812) repeat a block of another file's
    trials. In two of them the same unit, with identical spikes in every repeated trial, is
    stored twice with different projection types (v4527 unit 2 not_tested and v4527b unit 2 a
    PTN; v5811 unit 2 a PTN and v5812 unit 2 no_response).
- kind: metadata_error
  statement: unit_also_in_session_id uses the prefixes V and L where session ids use Venus and
    Leu, and 35 of its 43 references name files that are not in the dandiset. Where the file is
    present, it holds a different unit (another unit number, spike count and often projection
    type), not the same neuron.
- kind: metadata_error
  statement: The dandiset description says MPTP was given systemically, that both monkeys made
    elbow movements and that Leu was recorded in 1993. The files and the paper say unilateral
    intracarotid MPTP, monkey L used the wrist, and Leu files date from August 1992.
- kind: other
  statement: The monkey L analog streams are sampled at 100 Hz; the paper says 200 Hz. The EMG is
    described as sample-hold integrated over 10 ms in the files and low-pass filtered at 100 Hz in
    the paper, and is stored in uncalibrated A/D units.
- kind: other
  statement: The torque onset comes 1.70 to 1.73 s after center_target_appearance_time in 90% of
    monkey V perturbations, where the Methods put it 1 to 2 s after center capture at random.
    Either the column marks another event or the torque was predictable from the target's
    appearance.
- kind: methods_unavailable
  statement: No analysis code is published. The response detection as described gives a
    false-positive rate near 0.2 over the 200 ms epoch, against the 0.01 its threshold implies,
    and stationary Poisson spike trains give 0.15, most of it,
    so the paper's exact procedure cannot be recovered, and single-trial latencies are not
    defined.
- kind: paper_inconsistency
  statement: The pre-MPTP PTN and CSN resting rates are 16.3 and 3.6 spikes/s in the text and 18.3
    and 3.2 in Table 1. Table 1 marks the CSN change in the fraction of excitatory responses p <
    0.01, but its own counts (23 of 24 against 19 of 22) give p = 0.54 with the Yates-corrected
    chi-square test that reproduces its other chi-square values.
