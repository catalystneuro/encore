- claim: kinematics-slower
  outcome: not_reproduced
  notebook: reproduce_pasquereau_2013.ipynb
  output: claim:kinematics-slower
  measured: [28.76, 15.15]
  notes: Over 294 monkey V sessions (repeated files left out), torque-induced movements are faster
    and larger after MPTP; session-mean peak velocity +28.8% and amplitude +15.2% (flexion +30.3%
    and +12.0%), MPTP F = 103 and 26, p < 0.0001. The torque command's pulse is about four times
    larger in most post-MPTP sessions; in the sessions with the same command size (43 pre, 12
    post) the increases are +101.9% and +113.4%. Session-mean peak velocities (8.5 to 145.3
    deg/s) are lower than the 130 to 200 deg/s of the paper's matched sessions, and mean
    displacements (about 3 deg) smaller than its 10 deg.
  deviations:
  - Monkey V only; the paper's ANOVA has animal as a third factor.
  - The peak velocity and amplitude windows (0 to 200 and 0 to 300 ms) and the FIR length are
    choices; the Methods give the filter and velocity threshold only.
  - Perturbations with the joint moving before onset (490 of 5413) are kept.
- claim: kinematic-latency-unchanged
  outcome: not_reproduced
  notebook: reproduce_pasquereau_2013.ipynb
  output: claim:kinematic-latency-unchanged
  notes: Movement onset is earlier after MPTP (session means 9.8 and 3.2 ms for flexion, 11.0 and
    6.0 ms for extension; MPTP F = 1032, p < 0.0001), with an MPTP by direction interaction (F =
    19.1; the paper reports F > 94). In sessions with the same command size it does not differ
    (7.81 and 7.73 ms, p = 0.79). The latencies are short because the zero-phase filter spreads
    the movement back in time.
  deviations:
  - Monkey V only.
  - Zero-phase (forward and backward) filtering; the Methods do not say how the filter was
    applied.
