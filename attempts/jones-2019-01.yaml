inputs:
- what: The ripple filter kernels of the paper's code, Preprocessing/agripplefilter.mat (150-250 Hz, 199
    taps) and agripplefilter3.mat (125-250 Hz, 396 taps), a method detail named in the claims file (method
    A).
  source: https://github.com/emilyasterjones/Jones_2019 at commit ca056a835631a8fea44a30cbf9845b53457dcbd1
outcomes:
- claim: fig1e-swr-abundance-genotype
  outcome: reproduced
  notebook: reproduce_jones_2019.ipynb
  output: claim:fig1e-swr-abundance-genotype
  notes: Reproduced. E4 mice had lower SWR abundance than E3 mice, 0.113 against 0.245 Hz, t(27) = 8.21,
    p = 8.2e-09 (paper t(27) = 8.42, p < 0.0001). The 3 SD and 125-250 Hz variants agree in direction
    and significance.
- claim: fig1f-sg-power-genotype
  outcome: reproduced
  notebook: reproduce_jones_2019.ipynb
  output: claim:fig1f-sg-power-genotype
  notes: "Reproduced. SG power during SWRs was lower in E4 mice in all three regions under every reading:\
    \ CA1-sr t(27) = 6.48, CA3 t(27) = 4.82, DG U = 40 (p = 0.0054) under the Methods reading. The data's\
    \ site labels give CA3 sites in all 29 mice, where the paper has 11 E3 and 13 E4 (t(22)), so the CA3\
    \ test has 5 more mice than the paper's."
  deviations:
  - CA3 sites are the deposited chinfo sites with area ca3 and layer pyr or sr (plotRTSstats.m); they
    do not give the CA3 membership of Table S1 (screen cohort 16 E4 mice with CA3 labels, paper 13; replication
    at 13-17 months 4 E3 and 11 E4, paper 9 and 14), so the CA3 tests use the mice the labels give.
  - SG power read as in Claims method B, both open readings run (per session as the Methods, pooled over
    sessions as plotRTSstats.m); they gave the same outcome. Code variants (3 SD trigger, 54.7 Hz bin)
    shown.
  - DG sites are the chinfo dg sites with layer gc or hil; the Methods' check for dentate spikes was not
    run. Restricting DG to the sites labelled 'val' (perhaps validated) gives the same screen-cohort genotype
    test (U = 40, p = 0.0054).
- claim: figs1a-mua-during-swrs
  outcome: reproduced
  notebook: reproduce_jones_2019.ipynb
  output: claim:figs1a-mua-during-swrs
  notes: Reproduced. MUA rose from before to during SWRs in both genotypes (E3 paired t(12) = 5.30, E4
    t(15) = 3.91, whole 400 ms baseline; the same with the -400 to -300 ms bin), and the genotypes did
    not differ before (p = 0.72) or during SWRs (p = 0.49).
- claim: fig1g-mwm-impaired
  outcome: reproduced
  notebook: reproduce_jones_2019.ipynb
  output: claim:fig1g-mwm-impaired
  notes: Reproduced. The aligned rank transform ANOVA gives a genotype effect F(1,37) = 13.08, p = 0.0009,
    as printed, with E4 slower; Sidak-adjusted Mann-Whitney tests are significant on days 1, 3 and 5 (adjusted
    p 0.022, 0.039, 0.030) and not on days 2 and 4.
