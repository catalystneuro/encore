findings:
- kind: metadata_error
  statement: The data descriptor gives the MUA spike times in ms; in every Cohort 1 session the values
    are spike times in samples at 30 kHz (they fall inside the recording only when divided by 30000, as
    the paper's RTMUA.m does).
- kind: format_error
  statement: All_Figures.pzfx is named as a Prism XML file but is Prism's binary format (header PCFFGRA4),
    so the per-mouse values the descriptor says it holds cannot be read without Prism.
- kind: selection_undocumented
  statement: The deposited site labels (chinfo) do not give the CA3 membership of Table S1. In the screen
    cohort all 29 mice have sites labelled ca3 pyr or sr, where the paper analyses CA3 SG power in 11
    E3 and 13 E4 mice; at 13-17 months 4 E3 and 11 E4 mice have such labels, where the paper has 9 and
    14. Labels also change across ages for the same mouse (for example JellyBean and KitKat have CA3 sites
