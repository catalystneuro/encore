    in A1, wS1 and wS2, so the criterion holds. The Methods' grid search (1 run, 2 baseline bins)
    gives wM2 from 1.040 s and ALM from 1.035 s, so wM2 does not precede ALM and the claim is not
    reproduced. Neither reading shows the single significant bins at 15 ms in A1 and wS2 (wS2 has an
    isolated bin at 1.020 s with the grid search).
  deviations:
  - 1 run in place of the code's 5; the grid search uses 2 of the 10 baseline bins.
