  notes: The lick latency is 330.1 +/- 20.2 ms over 35 sessions, the paper's value. The movement
    latencies are shorter than reported under both readings of the criterion; reading (a) gives whisker
    48.2, jaw 81.5 and tongue 140.0 ms (34, 34 and 27 sessions with a latency), reading (b) 65.2, 83.3
    and 153.6 ms; only the reading (b) whisker value is within tolerance. The order whisker, jaw,
    tongue, spout contact holds under both, so the criterion's partial case applies. The tongue trace
    keeps rising after 1.2 s, so a maximum over 1.0 to 1.2 s cannot give the reported 231 ms; with the
    maximum over 1.0 to 2.0 s (a variant outside the criterion) reading (a) gives 54.4, 115.3 and
    192.4 ms. A question on the window is in questions/001530.yaml. The code's mean absolute deviation
    for the quiet rule is shown as a variant.
  deviations:
