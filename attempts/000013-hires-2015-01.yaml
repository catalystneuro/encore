findings:
- kind: metadata_error
  statement: In 36 files the SpikeTrain timestamps run 10 ms before the CurrentClampSeries
    timestamps of the same samples (the spike samples line up with the voltage one for one); in 16
    files they agree. Under the spike timestamps the median L4 C2 touch-response peak is 8 ms in
    the files without the offset and 12 ms in those with it (rank sum p = 0.016); under the voltage
    timestamps it is 8 and 22 ms. The data are consistent with the voltage timestamps of the 36
    files being 10 ms late, and a residual 4 ms difference under the spike timestamps is not
    explained.
- kind: metadata_error
  statement: In 38 files the CurrentClampSeries data, with the stated conversion of 0.001 to volts,
    span only 2 to 26 microvolts, so the conversion is off by 1000; in the other 14 they span 3 to
    28 mV.
- kind: metadata_error
  statement: In 38 files theta_filt, described as theta_at_base filtered 6 to 60 Hz, is not the
    signal the stored amplitude and phase come from (up to 46 deg apart); in 14 it equals
    amplitude times cos(phase). The stored amplitude and phase match a 6 to 60 Hz Butterworth
    band-pass and Hilbert transform of theta_at_base.
- kind: metadata_error
  statement: set_point is described as the amplitude of the Hilbert transform of theta_at_base but
    follows theta minus its band-passed part (r 0.96 to 1.00), and holds missing values in 23 files.
- kind: metadata_error
  statement: pole_position is described in mm, but its values range over several scales between
    files, 0.2 to 1.6 in some, 992 to 13888 (motor steps) in others, about 1e8 in others, and up to
    1.4e12 in one.
- kind: metadata_insufficient
  statement: Three subjects (anm211295, anm215592, anm217330; six cells) have no genotype, the
    paper's VGAT-ChR2 mice by their counts. The files hold 23 subjects where the paper reports 21
    mice, and the C57BL6 and Ai32 x PV-Cre counts differ from the paper's by one cell each, so the
    mapping of subjects to the paper's animals is not given.
- kind: other
  statement: 30 files are named with an ogen suffix, but no file holds an optogenetic stimulus
    series and stim_present is 0 in every trial.
- kind: other
  statement: first_lick_time disagrees with the lick onset series in some trials, by up to 3.1 s;
    47 trials have licks in the series and no first_lick_time, and 136 have a first_lick_time and
    no lick in the series.
- kind: methods_unavailable
  statement: The paper's analysis code (touch windows, phase decomposition, decoders, clustering,
    Fano factors) is not public; the repository it links holds only the contact detection, so
    several procedures could not be fixed and are asked about.
