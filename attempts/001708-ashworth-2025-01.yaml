- claim: fig5b-train-r2
  outcome: reproduced
  notebook: gp.ipynb
  output: claim:fig5b-train-r2
  assumed: true
  notes: >-
    Median training pseudo-R2 is 0.0478 (ON), 0.0497 (OFF) and 0.0216 (NEUTRAL). The paper's stored
    fits give 0.0448, 0.0479 and 0.0281. 23, 24 and 30 cells are above 0. Sign-flip p by animal is
    0.0079, 0.0021 and 0.0001, and by file 0.0028, 0.0006 and 0.0000. With ongoing NEUTRAL cells
    on the code's 1500 s segments the NEUTRAL median is 0.0303.
  deviations:
  - >-
    Assumed for every Gaussian-process claim: the code's settings were run, with 100 inducing points
    and p_noise 0.01, for 5000 iterations. Every loss history the code saved has 5000 steps. The
    Methods give 200 inducing points and p_noise 0.001, and params.json gives 10000 iterations. Those
    were estimated, on 50 to 100 timed iterations, at about 90 min, over the 60 min notebook limit,
    and were not run. Results at 2500 iterations are shown and differ little.
  - >-
    The model is written in plain torch, as a batch of independent GPs, for speed. On 100 iterations
    it gave the same class medians as the gpytorch classes ported from the code (checked while
    preparing, not run here). Expected log likelihoods use draws from each bin's marginal, where
    gpytorch draws jointly. The expectation is the same.
- claim: fig5b-train-no-difference
  outcome: not_reproduced
  notebook: gp.ipynb
  output: claim:fig5b-train-no-difference
  assumed: true
  notes: >-
    The main reading is the paper's test, permuting class labels within recording files, on the
    main inputs (ongoing NEUTRAL cells over their whole recordings). It finds a difference. ON against
    NEUTRAL has U = 568 and p = 0.012, which is 0.036 after Bonferroni. Kruskal-Wallis has H = 8.46
    and p = 0.034. ON against OFF has p = 0.52, and OFF against NEUTRAL has corrected p = 0.138. Two
    variants find no difference. With blocks by animal, the corrected pairs give 1, 0.111 and 0.207
    and Kruskal-Wallis gives p = 0.075. With ongoing NEUTRAL cells on the code's 1500 s segments,
