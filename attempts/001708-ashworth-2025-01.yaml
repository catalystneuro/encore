outcomes:
- claim: dataset-composition
  outcome: reproduced
  notebook: evoked.ipynb
  output: claim:dataset-composition
  measured: [104, 53, 62, 30]
  notes: >-
    Under reading (a), the Methods, the counts are exact. The evoked set ('evoked' and
    'evoked/ongoing' files) has 104 cells (45 ON, 35 OFF, 24 NEUTRAL) in 53 animals and 53 files. The
    ongoing set has 62 cells (25 ON, 25 OFF, 12 NEUTRAL) in 30 animals and 48 files (12 rats with two
    sessions, 3 with three). Under reading (b), Table S11's three sets, the cells match (45/35/4,
    0/0/20, 25/25/12) but the animals are 35, 18 and 30, not 35, 18 and 50. The archive lists 83
    subjects, 77 male and 6 female, weighing 191 to 348 g, as the Methods say. No recording is
    deposited twice. No two units have the same spike count and first and last spike, no two files
    share heat-onset times, and identifiers and start times are unique.
- claim: fig1c-psth-counts
  outcome: reproduced
  notebook: evoked.ipynb
  output: claim:fig1c-psth-counts
  measured: [68, 60, 180, 151, 177, 147]
  notes: >-
    The criterion's first reading (window from -30 s, pinches truncating windows) gives 180 ON and
    151 OFF withdrawal-aligned trials and 177 and 147 heat-aligned trials, from 68 ON and 60 OFF
    cells (the dataset has 70 ON and 60 OFF units). All are within 10%. With pinches left out of the
    rule, as the code runs, the counts are exactly the paper's: 185, 155, 182 and 151. From -10 s
    they are 182, 153, 183 and 157 with pinches and 187, 157, 188 and 161 without. All are within 10%.
  deviations:
  - >-
    The code builds its event list from events named "Keyboard", while its NWB loader renames
    pinches "keyboard" (Spike2Tools.get_tail_to_heat_lengths, data_loaders.rename_blocks_to_old_labels),
    so its trial rule never sees a pinch. Both rules are shown. Only the rule without pinches gives
    the paper's counts exactly.
