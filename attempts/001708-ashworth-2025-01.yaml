- claim: figs3-neutral-unmodulated
  outcome: reproduced
  notebook: evoked.ipynb
  output: claim:figs3-neutral-unmodulated
  measured: [32, 67, 68]
  notes: >-
    Re-run after a reader's answer (questions/001708.yaml) amended the criterion. It first took all
