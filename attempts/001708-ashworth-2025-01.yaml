- claim: figs8-null-model-worse
  outcome: reproduced
  notebook: evoked.ipynb
  output: claim:figs8-null-model-worse
  notes: >-
    The ELPD-LOO of the constant-mean model is -11704.9 for ON cells, against -7192.7 (double
    exponential) and -7439.2 (single exponential). The differences are 4512 (dse 204) and 4266
    (dse 193). For OFF cells the null is -9241.4, and every piecewise model is above it by 2736 to
    2988, with z = 24 to 25. Both readings of "significantly" (more than 1 or 2 dse) hold under LOO
    and under WAIC. The paper's notebooks print -11683 and -9237 for the nulls.
- claim: fig2g-switch-times
  outcome: reproduced
  notebook: evoked.ipynb
  output: claim:fig2g-switch-times
  measured: [-0.191, 1.35]
  assumed: true
  notes: >-
    The ON switch time is -0.191 s (97% HDI -0.283 to -0.106), inside the paper's HDI. The OFF
    switch time from the linear plus exponential model with the code's priors (on log k and log k2)
    is 1.350 s (0.836 to 1.887), inside the paper's HDI. With the Methods' priors read literally on
    k and k2 (half-normal), the OFF fit does not converge: 1121 divergences, r_hat up to 1.69, and
    t_switch -0.636 s (-1.126 to 0.620), outside the HDI. On the code's trial set (no pinches) the
    switch times are -0.183 and 1.326 s.
  deviations:
  - >-
    Assumed: the OFF priors are the code's, N(0, 1) on log k and log k2 (bayesian_cell_models.py,
    build_linear_slope_recovery_off_model). The Methods (Piecewise Bayesian modeling) write k, k2 ~
    N(0, 1). The criterion runs the Methods' prior as the main reading. That prior had to be
    truncated at 0 to keep the sigmoid slope and the recovery rate positive, and it gives no
    converged posterior. The code's prior converges (r_hat 1.003, no divergence) and reproduces
    every OFF number of Table S7. This choice applies to every claim that uses the OFF fit, and it is
    asked of the paper's authors.
