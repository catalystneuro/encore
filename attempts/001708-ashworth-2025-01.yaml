inputs:
- what: >-
    Reference values only, never data. The stored period scan of the paper's code
    (notebooks/gpytorch_models/PERIOD_SCOPE_RESULTS_200.npz), compared with the scan run here for
    fig4-nlml-minima, and the code's stored Gaussian-process fits
