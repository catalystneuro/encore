- claim: fig3bc-psd-peaks
  outcome: partially_reproduced
  notebook: ongoing.ipynb
  output: claim:fig3bc-psd-peaks
  measured: [286.86, 90.22, 298.33, 102.71]
  notes: >-
    The peaks of the class-mean spectra match: 286.86 s for ON and 298.33 s for OFF, the paper's
    values to the second decimal. The FFT length of 50 times the spike count of the first ON cell,
    in archive order, gives the paper's frequency grid. The FWHMs match under no reading. Mean
