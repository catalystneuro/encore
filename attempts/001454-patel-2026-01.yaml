- claim: fig2c-male-blampfc-excitability-up
  outcome: partially_reproduced
  notebook: ephys_patel_2026.ipynb
  output: claim:fig2c-male-blampfc-excitability-up
  notes: With the 2022 cohort as the group-housed group (21 neurons from 7 mice) against 29 isolated neurons
    from 9 mice, the current by housing interaction is significant under both spike readings (F(25, 1200)
    = 4.70 and 5.38, p < 0.0001) and isolated neurons fire more at 14 of 26 steps (60 to 320 pA, up to
    2.6 spikes at 180 pA) but fewer from 340 pA up (1.7 fewer at 500 pA). No step is significant after
    Sidak adjustment, with per-step t-tests (smallest adjusted p 0.116) or pooled error (0.23 and 0.33),
    so the Sidak part of the criterion fails. With all 37 group-housed neurons the interaction holds (F
    = 4.65 and 5.69), isolated neurons fire more at 17 and 16 steps, and per-step Sidak tests are significant
    at 120 to 180 pA.
  deviations:
  - Figure 2c's 21 group-housed neurons from 7 mice are taken to be the 2022 cohort, which holds exactly
    that many; the dandiset holds 37 from 12, and does not mark which enter Figure 2c (an assumption,
    all 37 shown as a variant).
  - Spikes are upward crossings of 0 mV or -20 mV (M6) with a 5 mV re-arm, a standard choice; the paper
    used Clampfit.
  - Sidak post hoc tests are run two ways (per-step unpaired t-test; error pooled over steps), as the
    paper does not say which Prism used.
  - One isolated file holds only the -120 pA sweep, so 29 of the 30 isolated neurons enter.
  assumed: true
- claim: fig2d-female-blampfc-excitability-down
  outcome: blocked
  blocked_by: data_unreadable
  notes: 11 of the 14 isolated female BLA-mPFC files (5 of 6 mice) hold no recording, a flat voltage at
    about 0.2, 0 or -209 mV with no step in the stimulus trace, so only 3 neurons from one mouse remain
    (paper 15 from 7). For information, the notebook shows that these 3 fire less than the 16 group-housed
    neurons at 25 of 26 steps (0 mV threshold) with no significant interaction (p = 0.98); this decides
    nothing.
