- claim: ed5d-cue-response-modest
  outcome: not_reproduced
  notebook: imaging_patel_2026.ipynb
  output: claim:ed5d-cue-response-modest
  notes: Mean z over all 30 cues. BLA-mPFC (cohort 16, 347 ROIs) peaks at 0.106 (3-s baseline) and 0.118
    (5-s) within 3 s, below 0.5, but the trace rises through the cue and peaks at 2.9 s, so it does not
    fall back by the end of the cue. Nonspecific (cohorts 9 and 10, 1113 ROIs) is negative after the cue
    (largest value within 3 s -0.520 and -0.412); the four cohort-10 mice peak at -0.003 to 0.082 and
    the six cohort-9 mice at -0.87 to -0.29. Neither population shows a transient increase.
  deviations:
  - The files do not say which BLA cohort expressed GCaMP in all BLA neurons and which only in BLA-mPFC
    projectors (the virus field is empty). Cohorts 9 and 10 (10 mice) are taken as nonspecific BLA and
    cohort 16 (11 mice) as BLA-mPFC, from the paper's N of 10 and 11 and the fewer ROIs per mouse in cohort
    16. This is an assumption.
  - Every CNMF-E ROI in the files is used (1113 nonspecific, 347 BLA-mPFC ROIs, against the paper's 540
    and 196 curated neurons), as the curation (Methods, Calcium imaging data acquisition and calcium signal
    extraction) is not in the dandiset.
  - Cohort 16 M2-1 and M3-4 hold the traces of M1-4 and M3-3 (identical arrays; the traces follow the
    licks of M1-4 and M3-3), so they are left out and BLA-mPFC has 9 mice, not 11.
  - A bout's z-score is set undefined where the baseline s.d. is under 5% of the neuron's session s.d.
    (the paper does not say how flat baselines were treated); the notebook counts the pairs removed.
  - All 30 cues are used; the claim names no trial subset.
  assumed: true
- claim: fig3f-blampfc-distinct-clusters
  outcome: reproduced
  notebook: imaging_patel_2026.ipynb
  output: claim:fig3f-blampfc-distinct-clusters
  notes: '1266 of 1460 ROIs have a defined mean alcohol trace. Ward clustering cut at the highest linkage
    giving a nonresponsive cluster yields 2 clusters under both spans; population by cluster chi-square(1)
    = 18.30, p = 1.9e-05 (-3 to 5 s) and 11.20, p = 0.00082 (0 to 3 s). The difference lies in the small
    responsive cluster, 66 (43) nonspecific and 3 (2) BLA-mPFC ROIs, a BLA-mPFC depletion of 84%. The
    statement''s ''several functional clusters'' does not hold under the paper''s cut: there are two.'
  deviations:
  - The files do not say which BLA cohort expressed GCaMP in all BLA neurons and which only in BLA-mPFC
    projectors (the virus field is empty). Cohorts 9 and 10 (10 mice) are taken as nonspecific BLA and
    cohort 16 (11 mice) as BLA-mPFC, from the paper's N of 10 and 11 and the fewer ROIs per mouse in cohort
    16. This is an assumption.
  - Every CNMF-E ROI in the files is used (1113 nonspecific, 347 BLA-mPFC ROIs, against the paper's 540
    and 196 curated neurons), as the curation (Methods, Calcium imaging data acquisition and calcium signal
    extraction) is not in the dandiset.
  - Cohort 16 M2-1 and M3-4 hold the traces of M1-4 and M3-3 (identical arrays; the traces follow the
    licks of M1-4 and M3-3), so they are left out and BLA-mPFC has 9 mice, not 11.
  - A bout's z-score is set undefined where the baseline s.d. is under 5% of the neuron's session s.d.
    (the paper does not say how flat baselines were treated); the notebook counts the pairs removed.
  - Mean alcohol traces use alcohol and water bouts matched per session at random (M3 reading a); ROIs
    with no isolated alcohol bout are left out.
  assumed: true
