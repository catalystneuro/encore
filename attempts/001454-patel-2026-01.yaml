- claim: fig3h-nonspecific-decoding-85
  outcome: blocked
  blocked_by: other
  notes: Under M5 an animal needs at least five decoding bouts (longer than 1 s, at least 2 s from other
    bouts) of each liquid, one per fold. Only 1 of 10 nonspecific mice and 2 of 9 BLA-mPFC mice have them;
