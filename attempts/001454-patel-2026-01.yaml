findings:
- kind: data_missing
  statement: The dandiset holds the current clamp recordings, the cued-2BC imaging sessions and the resident-intruder
    imaging sessions only. The home-cage 2BC licks, the tube-test ranks of the drinking and imaged mice,
    the blood alcohol values, the unimplanted control mice, the optogenetic behaviour sessions (ChR2,
    ChrimsonR, NpHR), the stability imaging of Extended Data Fig. 7 and the pose tracking and interaction
    annotation of the resident-intruder sessions are not in it, although the description lists pose tracking.
    28 of the 61 claims cannot be tested for this reason.
- kind: data_missing
  statement: '13 of the 205 current clamp files hold no recording: a flat voltage at about 0.2, 0 or -209
    mV and no step in the stimulus trace. They are 11 isolated female BLA-mPFC neurons (subjects M3.1,
    M3.3, M4.1, M4.2, M4.3, September 2024) and 2 group-housed ones (M2.2, August 2024), so only 3 isolated
    female neurons from one mouse remain. One isolated male file (M6.3, 2022-07-27) holds only the -120
    pA sweep.'
- kind: metadata_error
  statement: Three pairs of cued-2BC files hold identical fluorescence traces with different licks. Cohort16-M2-1
    and Cohort16-M1-4, Cohort16-M3-4 and Cohort16-M3-3, and the isolation sucrose sessions of Cohort13b-M3-2
    and Cohort13b-M2-2. In each pair the traces respond to the licks of the second file, so the first
    file carries another mouse's imaging.
- kind: metadata_error
  statement: All 53 cued-2BC files carry the same 30 cue timestamps and one of two trial-type sequences.
    The licks fall in the access windows of those cues, but in every session of 5 of the 9 mPFC mice (Cohort13b
    M2-1, M2-2, M2-3, M3-2, M3-3) and in 10 of 11 cohort-16 sessions there are licks on the bottle that
    a forced trial, by its stored type, does not offer (up to 453 licks). In those sessions the trial
    types, and so which choice trials were stimulated, do not describe the session.
- kind: selection_undocumented
  statement: The imaging files hold every CNMF-E ROI (1113 in the nonspecific BLA mice against the paper's
    540 neurons, 347 against 196 in the BLA-mPFC mice, 748 and 439 against 240 and 281 in the mPFC alcohol
    sessions). The visual curation the Methods describe is not recorded, so the paper's neurons cannot
    be selected.
- kind: selection_undocumented
  statement: The dandiset holds 37 group-housed male BLA-mPFC neurons from 12 mice; Figure 2c uses 21
    from 7. The 2022 cohort holds exactly 21 from 7, but nothing in the files marks the neurons of Figure
    2c or Supplementary Table 1.
- kind: metadata_insufficient
  statement: The BLA imaging files do not say whether GCaMP was expressed in all BLA neurons or only in
    BLA-mPFC projectors; the virus and experiment description fields are empty in the cued-2BC files.
    Cohorts 9 and 10 (10 mice) and cohort 16 (11 mice) match the paper's N for the two populations, which
    is the only basis for telling them apart.
- kind: metadata_insufficient
  statement: The ranks of the imaged mice are not given (subject descriptions say only cage and mouse
    number), and 29 nonspecific current clamp neurons from the four 2021 mice carry no rank. The subject
    name M3.1 is used for two group-housed males recorded on 2024-07-18 (rank 1) and 2024-07-19 (rank
    3).
- kind: format_error
  statement: The lick times are stored as the data of TimeSeries that also declare a starting time of
    0 and a rate of 100 Hz, so a reader that takes the series at face value gets lick indices, not times.
    The values are times in seconds on the imaging clock.
- kind: other
  statement: Cohort 9 fluorescence traces are nonnegative with exact zeros, while the other cohorts' traces
    take negative values, and the Methods say CNMF-E was run without nonnegativity constraints. Four mPFC
    sessions hold 44791 to 65535 frames at 10 Hz (75 to 109 min) for 1-h sessions whose last lick is before
    3900 s, two of them exactly 65535, the largest 16-bit count.
- kind: other
