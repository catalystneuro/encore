- claim: fig2e-female-higher-baseline-excitability
  outcome: partially_reproduced
  notebook: ephys_patel_2026.ipynb
  output: claim:fig2e-female-higher-baseline-excitability
  notes: Against the 21 group-housed males (2022 cohort), the 16 recorded group-housed female neurons
    (8 mice) give a strong current by sex interaction (F(25, 875) = 19.8 and 20.1, p < 0.0001). Females
    fire more at low and middle currents (up to 4.5 spikes more at 180 pA, Sidak significant at 140 to
    180 pA under both post hoc readings) and fewer at the top currents (7.7 fewer at 500 pA, significant).
    Females fire more at 16 of 26 steps with the 0 mV threshold, at 12 of 26 with -20 mV, so 'most steps'
    holds under one spike reading only. With all 37 males, 19 and 13 of 26.
  deviations:
  - 2 of the paper's 18 group-housed female neurons are in files without a recording; 16 are used.
  - Group-housed males are the 2022 cohort, as for fig2c (assumption; all 37 shown).
  assumed: true
- claim: supt1-male-input-resistance-up
  outcome: not_reproduced
  notebook: ephys_patel_2026.ipynb
  output: claim:supt1-male-input-resistance-up
  notes: Isolated male BLA-mPFC neurons have higher input resistance than the 2022 group-housed cohort
    (118.0 against 97.6 MOhm, difference 20.5), but the unpaired t-test gives t(48) = -1.99, p = 0.052
    with the last 100 ms and p = 0.053 with the last 50 ms. With all 37 group-housed neurons (90.6 MOhm)
    p = 0.0019 and 0.0018. The direction holds; significance depends on which group-housed neurons enter.
  deviations:
  - Group-housed neurons are the 2022 cohort, as in Figure 2c (assumption); which neurons Supplementary
    Table 1 used is not stated.
  - The baseline for the -120 pA deflection is the 50 ms before the step, a standard choice.
  assumed: true
