      direction, no shift, and random folds with the shift all pass. Z-scored rates fail. The assumption (counts
      and contiguous folds) is stated and reasonable: the paper''s input holds counts and run_model.m forms contiguous
      folds. One part of it is asserted but not shown: that the z-scored failure comes from the 1e-6 learning rate.
      Z-scored rates give 0 of 9 AUCs above 0.5, which is systematically below chance, not at chance; in synthetic
      tests of the ported hmmglm.py on counts carrying no information about the labels, the HMM-GLM AUCs were about
      0.50, so the one-step predictor does not leak the true label. Remaining: a z-scored run with an adjusted learning
      rate, or on the paper''s input, to back the learning-rate explanation; a re-run without 20191029-chrimson2-2-2v3;
      and the measured values should be the analysed set (512, 17, 10), since 965, 34 and 14 are the counts of all
      labelled files and the test ran on 512 trials, 17 files and 10 mice, outside every tolerance.'
    response: Outcome kept. measured is now 512, 17 and 10, and the notes say these are outside the tolerances.
      Cell 54 adds the run without 20191029-chrimson2-2-2v3 (482 trials; every test passes, HMM-GLM median 0.693)
      and z-scored runs at learning rates of 1e-6, 1e-5 and 1e-4 on this input and on the paper's. At the code's
      1e-6 a second seed gives median 0.511 and 7 of 9 above 0.5 (against 0.475 and 0 of 9), and the paper's input
