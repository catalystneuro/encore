- claim: units-20min
  outcome: blocked
  blocked_by: too_large
  notebook: reproduce_bellvila_2026.ipynb
  output: claim:units-20min
  notes: The 20-minute files hold a 16-channel stream at 12207 Hz that carries spikes (negative 500 to
    3000 Hz peaks with troughs of 50 to 180 uV, up to 44 per second on one channel), but no sorted units.
    SpyKING CIRCUS 2 (spikeinterface 0.103.0) sorts 5 and 15 minutes of one rat in 77 and 168 s and finds
    24 and 28 units; extrapolated to the first series of the 13 rats, sorting takes about 118 minutes,
    beyond the 60-minute limit of a notebook, before the permutation tests. It was not run on the whole
    recordings. SpyKING CIRCUS 1, which the paper used, installs (1.1.0) but its mpi4py finds no MPI library
    here, so it is also not runnable.
  deviations:
  - The timing uses SpyKING CIRCUS 2 in place of SpyKING CIRCUS 1, with the paper's band (500 to 3000
    Hz) and detection threshold (6), on 5 and 15 minutes of one rat (sub-2023-04-28).
