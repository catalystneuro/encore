- claim: fig5-yp-lorentzian-pr-gaussian
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_silkuniene_2025.ipynb
  output: claim:fig5-yp-lorentzian-pr-gaussian
  measured:
  - 0.822
  - 0.731
  - 0.932
  - 0.750
  notes: On the mean diagonal profiles of the 600-ns wells, fitted from -5 to 5 mm, the Lorentzian
    fits YP better than the Gaussian under all 12 readings (R2 0.93 to 0.99 against 0.75 to 0.97),
    as the paper reports, but it also fits Pr better under all 12 (R2 0.81 to 0.95 against 0.72 to
    0.86), the reverse of the paper. The Pr Gaussian R2 is within its tolerance (0.864 to 1.056)
    under none; the Pr Lorentzian R2 under 6 of 12, the YP Lorentzian under 12 and the YP Gaussian
    under 6. Measured values are for the first reading (1-mm steps, YP from all 7 wells, Pr from all
    5). All fits have p < 0.001. The Pr images show diffuse staining over most of the area between
    the electrodes with a faint central spot, so the Pr profiles have broad shoulders (for example
    P1_20240926_A3, 789 at the centre and 260 to 360 at 3 to 5 mm).
  deviations:
  - Assumed that the dandiset's 600-ns wells are the 0-mm group of Fig. 5. The protocol is the same
    (MHz-CANCAN, 600-ns packets with no interval, 2 bursts (x4), CT26, Results 3.2), and the counts
    match the Fig. 5 legend (7 YP wells against n=6-7, 5 Pr wells against n=4-5), but the dandiset
    describes only the pulse-duration experiment and names no figure.
  - Readings run because the wells are not identified are YP from all 7 or the 5 main wells, and
    Pr from all 5, the 4 without P1_20240926_B3 (central cell loss at 2 h) or the 3 in the main rows.
    The fits are to the mean of the wells' background-subtracted profiles; R2 does not depend on
    the scaling to 100% of Fig. 5B.
  - ROI placement and background as for fig6b-peak-900ns-not-significant, with footprints found in
    each Pr image (the plate was moved between the YP and Pr images).
