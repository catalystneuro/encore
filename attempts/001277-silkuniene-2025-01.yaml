outcomes:
- claim: fig6b-peak-900ns-not-significant
  outcome: reproduced
  assumed: true
  notebook: reproduce_silkuniene_2025.ipynb
  output: claim:fig6b-peak-900ns-not-significant
  notes: With the five complete plate rows as the Fig. 6 wells, background-subtracted YP at the
    centre ROI is 551 +/- 126 (300 ns), 866 +/- 249 (600 ns) and 899 +/- 308 (900 ns) camera units
    (mean +/- s.e., n=5 each), highest at 900 ns. Reading (a), Bonferroni-corrected t-tests over
    three pairs, gives p = 0.975 for 900 against 300 ns and 1.000 for 900 against 600 ns (Cohen's d
    0.66 and 0.05); reading (b), one-way ANOVA, gives F = 0.64, p = 0.54. Both readings find no
    difference. The same holds with all 7 wells at 600 ns (ANOVA p = 0.52), with the background from
    all four footprints, and with the fitted Lorentzian centre (variant). Over the 21 choices of 5 of
    the 7 600-ns wells no test is significant, and 900 ns is highest in 14. Centre YP differs more
    between plates than between durations (plate P3 is two to four times P1 and P2).
  deviations:
  - The paper reports n=5 per duration; the dandiset has 7 wells at 600 ns and does not say which
    five were analysed. Assumed that the Fig. 6 experiments are the five plate rows that each hold
    one well of 300, 600 and 900 ns (P1 row A, P2 rows A and B, P3 rows A and B); plate P1 row B
    holds the sham well and two more 600-ns wells. The plate layout is the only basis in the data
    that does not depend on the results. All 7 wells and every choice of 5 are shown.
  - ROIs are placed by an algorithm on electrode footprints it finds in each image (centre of the
    square they form, diagonals joining them), not by eye in MetaMorph (Methods 2.5), and are
    rounded to a 40.6-um grid.
  - The background is the mean of 3 ROIs in the darkest electrode footprint (Methods 2.5 says 3
    ROIs within a footprint, not which one); the mean over all four footprints is shown as a
    variant and changes no outcome.
- claim: fig6c-normalized-decline-similar
  outcome: not_reproduced
  notebook: reproduce_silkuniene_2025.ipynb
  output: claim:fig6c-normalized-decline-similar
  notes: Under every reading (1-mm or contiguous ROIs; -5 to 5 mm or every measured distance to
    7 mm; the gap judged against the mean or the longer of the two s.e. bars; the main wells, all 7
    at 600 ns, or any 5 of the 7) at least one distance shows two durations' normalized profiles
    separated by a gap longer than the bars (main wells, 1-mm steps to 5 mm, 3 distances; contiguous
    ROIs, 12). The gaps are mostly between 300 and 900 ns at 1 to 2 mm from the centre, the 900-ns
    profile falling faster (19.6% against 12.5% of the centre at +2 mm with 1-mm steps, gap 4.6
    against bars of 1.3); with contiguous ROIs 300 and 600 ns also differ at 1.6 to 4.9 mm. The
    difference is the sharper peak at longer pulses that the paper reports for Fig. 6D. The paper's
    "similar" is a visual reading of Fig. 6C with no test; by the error-bar rule the criterion
    names, the declines differ.
  deviations:
  - The well selection, ROI placement and background are as for fig6b-peak-900ns-not-significant;
    the outcome is the same under every well selection, so it does not rest on the assumption.
  - When the two s.e. bars differ in length the gap is compared with their mean (Cumming et al.
    2007, cited by Methods 2.5, uses the average arm); the longer bar is shown as a variant and
    gives the same outcome.
- claim: fig6d-longer-pulses-sharper-peak
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_silkuniene_2025.ipynb
  output: claim:fig6d-longer-pulses-sharper-peak
  notes: The criterion blocks the claim when its readings differ, and they do. With the five complete
    plate rows, mean FWHM is 2.11 to 2.13 mm at 300 ns, 1.80 to 1.91 mm at 600 ns and 1.69 to 1.80 mm
    at 900 ns, and the slope is negative under all 48 readings. It is significant (p < 0.05) under 28
    of them. These are every reading fitted to the 15 individual values with contiguous ROIs (p 0.0020
    to 0.0037, against the paper's 0.003), 10 of 12 with 1-mm steps (p 0.042 to 0.050), and the log
    trend on the 3 means with 1-mm steps (p 0.012 to 0.016). The other readings on 3 means give p
    0.08 to 0.18. FWHM falls with duration on each plate. With all 7 wells at 600 ns the slope is
    significant under none of the 48 readings (p 0.83 to 1.00), as the two P1 row B wells have FWHMs
    of 5.2 to 5.5 and 18.4 to 19.0 mm; of the 21 choices of 5 of the 7, only the one leaving out both
    gives a significant slope. Diagonals averaged before fitting and all points fitted give the same
    fit, as both diagonals are sampled at the same distances. No Lorentzian fit failed (204 fits).
    Questions for the paper's authors (finding methods_unavailable) are which wells form Fig. 6 at
    600 ns, how far apart the ROIs were along the diagonals, and whether the trend of Fig. 6D was
    fitted to the 15 values or to the 3 means.
  deviations:
  - Well selection, ROI placement and background as for fig6b-peak-900ns-not-significant.
  - Distances along each diagonal are scaled so that the footprint centre is at 9.05 mm from the
    centre (7.65 mm to the footprint edge, Results 3.1, plus the 1.4-mm needle radius, Methods 2.2).
    The footprint diagonals measured at the stated 1.625 um per pixel are 17.7 to 18.5 mm against
    18.1 mm, so the scaling changes distances by less than 3%.
- claim: fig6d-600-900-differ-from-300
  outcome: blocked
  blocked_by: methods_underspecified
  notebook: reproduce_silkuniene_2025.ipynb
  output: claim:fig6d-600-900-differ-from-300
  notes: Blocked by its own criterion (the readings differ) and because it depends on
    fig6d-longer-pulses-sharper-peak, which is blocked. In the main wells, 900 against 300 ns is
    significant after Bonferroni correction with contiguous ROIs (p 0.0053 to 0.0089 over 2 or 3
    comparisons, close to the paper's 0.0072) but not with 1-mm steps (p 0.077 to 0.131). 600 against
    300 ns is significant under no reading (p 0.058 to 0.092 with contiguous ROIs, 0.44 to 0.66 with
    1-mm steps, against the paper's 0.028). So 12 readings give one significant comparison and 12
    give none; FWHM is smaller at both longer durations under every reading (Cohen's d -0.84 to
    -2.71). With all 7 wells at 600 ns, 600 against 300 ns gives p 0.69 to 1.00.
  deviations:
  - Well selection, ROI placement and background as for fig6b-peak-900ns-not-significant.
