findings:
- kind: data_missing
  statement: The dandiset holds only the pulse-duration experiment of Fig. 6 (18 wells of CT26 cells
    on three plates, 2 bursts (x4) with packets delivered with no interval). The packet-rate series
    and controls (Figs 3 and 4), the raised-electrode wells (Fig. 5), the burst-number series and
    the CHO cells (Fig. 7) and the thermometry (Fig. 2) are not in it, and the paper names no other
    public deposit.
- kind: metadata_error
  statement: Every well's subject description says "Protocol consisted of 9 packets of pulses
    delivered at 0.2MHz frequency", including the 300-ns and 900-ns wells and the sham well. The
    dandiset description and the paper (Fig. 6A legend) give 18, 9 and 6 packets for 300, 600 and
    900 ns, delivered with no interval (0.4, 0.2 and 0.14 MHz).
- kind: selection_undocumented
  statement: The dandiset has 5 wells at 300 ns, 7 at 600 ns and 5 at 900 ns, where the paper
    reports n=5 per duration (Fig. 6B legend). Nothing says which five 600-ns wells were analysed,
    and the Fig. 6D trend depends on it. With the five plate rows that hold one well of each duration,
    the FWHM trend is close to the paper's (p 0.002 to 0.004 with contiguous ROIs); with all 7 it is
    absent (p 0.83 to 1.00). Nor does anything say whether the 600-ns wells, with their propidium
    images, are also the 0-mm group of Fig. 5.
- kind: other
  statement: Two 600-ns wells, P1_20240926_B2 and P1_20240926_B3 (plate P1 row B, with the sham
    well), show YO-PRO-1 uptake over the whole electrode array (YP at 6 and 7 mm is 78% and 36% of
    the centre, against 3 to 11% in the other 15 exposed wells) and Lorentzian FWHMs of about 18 and
    5 mm. P1_20240926_B3 also shows a loss of Hoechst-stained cells over the centre at 2 h (central
    to whole-image median 0.78, against 1.25 to 1.69 in the other 600-ns wells) and a propidium
    image without a central spot. The metadata give no reason for the difference.
- kind: other
  statement: The propidium and Hoechst image of well P2_20240925_B3 is deposited twice, as
    sub-P2-20240925-B3_image.nwb and sub-P2-20240925-B3_obj-w6fqmq_image.nwb. The pixel data are
    identical (same size; checked on 1500 rows of both channels); the files differ in NWB identifier
    and session start time.
- kind: metadata_error
  statement: The OME metadata in every file give 12 significant bits per pixel, but the YP images
    hold values far above 4095 (the largest 25 x 25 pixel block means are 3500 to 22600), so the
    stored values are not raw 12-bit camera counts. The ImageSeries unit is "n.a." and no scaling is
    described.
- kind: metadata_insufficient
  statement: The dandiset gives no electrode positions, ROI coordinates or measured profiles, so the
    paper's ROI placement cannot be repeated exactly; the footprints had to be found in the images.
    The plate layout (wells A1 to B3 on plates P1 to P3) is recoverable only from the subject ids.
- kind: methods_unavailable
  statement: Questions for the paper's authors. Which five 600-ns wells form Fig. 6, and are the
    600-ns wells with propidium images the 0-mm group of Fig. 5? How far apart were the ROIs placed
    along the diagonals (the text names only 0, 6 and 7 mm; 1-mm steps and contiguous ROIs give
    different significance in Fig. 6D)? Was the Fig. 6D trend fitted to the 15 per-well FWHM values
    or to the 3 means, and was it linear in pulse duration (legend) or logarithmic (Results 3.3)?
    This attempt ran every reading; the readings disagree for fig6d-longer-pulses-sharper-peak and
    fig6d-600-900-differ-from-300.
