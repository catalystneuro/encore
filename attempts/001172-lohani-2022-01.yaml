findings:
- kind: metadata_error
  statement: The ΔF/F series (DFFOnePhotonSeriesBlue, Green and Violet) are given the starting time
    of the first LED pulse, the time of raw frame 0, but their frame 0 is raw frame 499, as the
    detrending drops the first frames. Their times are 49.9 s early in every session; both the raw
    movies and the alignment of calcium with wheel speed show it.
- kind: metadata_error
  statement: The FaceMap, pupil, eye and video timestamps are spaced 111 ms (9 Hz) where the camera
    pulses are 100 ms apart, span about 10% longer than the session, and end with two values equal
    to the first camera pulse. With these timestamps face movement and wheel speed are misaligned
    by 23 to 60 s; with frame i at camera pulse i, as the paper's code does, they align.
- kind: metadata_error
  statement: RoiResponseSeriesParcellated holds the calcium (green excitation) ΔF/F averaged over
    its ROIs, but its segmentation is linked to the ACh imaging plane. Its image masks are
    transposed relative to the ΔF/F images, and its starting time is that of the first green pulse,
    64.9 s before its first frame (150 frames after the ΔF/F's first frame).
- kind: metadata_insufficient
  statement: The ΔF/F descriptions mention detrending only; the blue and green ΔF/F are also
    hemodynamically corrected and registered to the Allen atlas, rotated by 180 degrees, as the
    paper's code shows. The Allen parcels the paper analyses are not in the files; they come from
    the paper's code. The parcellation in the files is a different, functional one with 89 to 107
    ROIs per session and no area names.
- kind: metadata_error
  statement: In the VisualStimulus tables the columns from stimulus_size on are shifted by one;
    stimulus_size holds the duration (2) and the first screen coordinate holds the size (20
    degrees).
- kind: data_missing
  statement: The air-puff session grabAM07 11262019 has no Airpuff table, so its puff times are
    unknown.
- kind: selection_undocumented
  statement: No air puff in the Airpuff tables is followed by a locomotion onset within 5 s (29
    puffs), which fits the paper's code keeping only puffs without running. The tables then hold a
    selection of the puffs given, which the files do not say.
- kind: metadata_insufficient
  statement: WheelSpeed and pupil_area have the unit "unknown"; the paper's code treats wheel speed
    as m/s, and its range fits that.
- kind: data_missing
  statement: The dandiset holds 4 of the 6 ACh3.0 and jRCaMP1b mice of the paper's code (grabAM05
    to grabAM08, not grabAM09 and grabAM10), and no ECoG, drug sessions, control mice or ChAT-GCaMP6s
    mice. Five of the paper's findings cannot be tested.
