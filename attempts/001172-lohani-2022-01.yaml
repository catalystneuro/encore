inputs:
- what: The Allen parcel masks parcells_updated121519.mat and the brain mask brainMask.mat of the
    paper's code, which name the pixels of the dandiset's atlas-registered ΔF/F. The procedures
    (frame timing, locomotion change points, face normalisation, sustained states, onsets,
    cross-correlation and permutation statistics) follow the same code where the Methods are silent.
    Its Figure2Regression/Fig2RawData.mat, the paper's per-mouse R2 values, is used only for a
    comparison in the Figure 2 section and decides no outcome.
  source: https://github.com/cardin-higley-lab/Lohani_Moberly_et_al_2022 at commit
    c337686fb3776112f1609ec1a19256d277c930fd
outcomes:
- claim: allen-parcel-link
  outcome: partially_reproduced
  notebook: reproduce_lohani_2022.ipynb
  output: claim:allen-parcel-link
  notes: Per session (pixels non-zero in either ΔF/F movie) the non-zero pixels equal the code's
    brainMask.mat rotated by 180 degrees in all 9 sessions (agreement 1.0; best other orientation
    0.98). Per movie, 25 of the 26 movies of the 13 sessions (the 9 state sessions and the 4 visual
    stimulus sessions) agree at 1.0; the calcium movie of grabAM08 11232019 spont agrees at 0.996, as
    263 pixels inside the mask, all in the right AUD parcel, are zero in every frame and none outside
    is non-zero. With 100% contrast
    gratings in one visual stimulus session per mouse (47 to 49 trials), the largest calcium
    response of the 46 parcels is in a left visual parcel in all 4 mice and left VISp exceeds right
    VISp in all 4 (0.108 to 0.216 against -0.024 to 0.065 percent ΔF/F), but left VISp ranks 1, 1,
    3 and 2, so first in 2 of 4 mice where the criterion asks 3 for reproduced. The dependent claims
    are tested; the partial result bears on parcel borders, not on which areas are where.
  deviations:
  - The criterion's "pixels with non-zero ΔF/F in the blue and green movies" can be read per movie
    or per session; the per-session reading was chosen after seeing that one movie fails the 99.9%
    bar under the per-movie reading. Under the per-movie reading the mask part fails on that movie
    and the claim would be not reproduced by the letter of the criterion. The failing pixels are
    all in the right AUD parcel, which the left-hemisphere analyses do not use.
- claim: fig2a-r2-differs-across-areas
  outcome: reproduced
  notebook: reproduce_lohani_2022.ipynb
  output: claim:fig2a-r2-differs-across-areas
  notes: Friedman across the 23 left parcels with 4 mice, ACh chi2 = 67.98, p = 1.4e-06, calcium
    chi2 = 63.51, p = 6.7e-06. Full-model R2 ranges 0.030 to 0.397 (ACh) and 0.084 to 0.387
    (calcium). Spontaneous sessions alone give p = 6e-07 and 0.005. With |speed| as the wheel
    predictor p = 1.3e-06 and 7.7e-06. For the three mice that match rows of the paper's own R2
    file (grabAM05, grabAM07, grabAM08), mean full-model R2 is 0.182, 0.126 and 0.140 (ACh) and
    0.207, 0.216 and 0.227 (calcium) against the file's 0.166, 0.126 and 0.142 and 0.193, 0.229 and
    0.254.
  deviations:
  - 4 of 6 mice; spontaneous and air-puff sessions (9) averaged per mouse, as the Methods do not say
    which sessions were used.
  - The ridge regression code is not public; the penalty is chosen per parcel by marginal likelihood
    over a grid of 91 values, as ridgeMML does by optimisation.
  - The wheel predictor is the files' WheelSpeed, which is signed, as the Methods ("a differential
    of distance") and the code's wheel_changepoints.m (db1SpeedMpS) define speed. The first revision
    had switched to |speed|; the second revision returned to the signed series, and |speed| is a
    variant.
  - Predictors are scaled with the training folds' statistics; the first run z-scored them over the
    whole session.
