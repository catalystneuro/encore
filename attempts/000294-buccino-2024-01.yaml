findings:
- kind: metadata_error
  statement: The dandiset's metadata name the paper by its title but link it to
    doi:10.1162/neco_a_01676, which Crossref gives as "Energy Complexity of Convolutional Neural
    Networks". The paper is doi:10.1162/neco_a_01672.
- kind: metadata_error
  statement: The CurrentClampSeries are stated in volts with conversion 1 but hold millivolts (-100 to
    +46), and the CurrentClampStimulusSeries are stated in amperes with conversion 1 but hold
    picoamperes (holding levels of 12 and -37, steps up to about 1000).
- kind: other
  statement: The patch timestamps are at 20.41 kHz (49 us) for every protocol except IDthres (20 kHz)
    and APWaveform (125 kHz, 8 us). The paper states digitization at 20 kHz, and APWaveform at high
    rates, typically 200 kHz. The intervals are regular and agree with the nominal step durations.
- kind: metadata_error
  statement: The icephys sequential recordings table leaves out the first sweep of every protocol after
    IDthres in each run and every PosCheops sweep (35 of 300 recordings for cell 1, 28 of 240 for
    cell 2), so the grouping tables do not describe the protocols. The protocol_name and run columns
    of the intracellular recordings table are complete.
- kind: metadata_insufficient
  statement: No culture age, plating date or days in vitro is given in the files or the dandiset's
    metadata; the subject has only an id, a species and a description.
- kind: metadata_insufficient
  statement: The electrodes table's x, y and z are empty (NaN), location is "unknown" and impedance -1;
    electrode positions are only in the custom columns rel_x and rel_y, without a description of their
    frame.
- kind: selection_undocumented
  statement: Cell 2's file holds runs 3 to 6 of the recording, renamed run1 to run4; only the
    descriptions of its MEA series and the paper's export notebook say so. Runs 1 and 2 of cell 2 are
    not deposited, and the dandiset does not say why.
- kind: other
  statement: In every run 117 to 132 of the 675 to 678 MEA channels are constant for at least one of
    ten one-second segments (the channels the paper's code removes before computing templates); the
    deposited series keep them, with nothing marking them.
- kind: other
  statement: In the deposited sweeps the stimulus starts 50 ms earlier than the timings of the
    paper's feature code (350 ms against ton 400 ms for IDrest, 450 against 500 for firepattern), so
    the code's timings cannot be applied to the files as they are.
- kind: paper_inconsistency
  statement: Methods 5.2 describe IV as 11 steps from -140 to 20% by 20%, which is 9 steps; the data
    hold 11 steps from -140 to 60%.
- kind: paper_inconsistency
  statement: Methods 5.4 give 79 intracellular features for optimization and Table 1 gives 76; the
    code's feature files have 79 before it drops three sag features of IV -20%, and 76 after.
