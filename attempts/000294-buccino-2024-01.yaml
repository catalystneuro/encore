inputs:
- what: The paper's code repository, which the paper names for its scripts, model files,
    morphologies and extracted features. Used for the reconstructed morphologies
    (cell_models/<cell>/morphology_corrected.swc), the released ground-truth model hay_ais (its
    mechanisms, parameters and morphology, simulated here), its template, electrode locations and
    feature and protocol files, and for method parameters of the template method, spike detection,
    stimulus timings and the optimization settings, each cited in the helpers.
  source: https://github.com/alejoe91/multimodalfitting at commit 24e8e6168b2d5be45c551bcc08b62fde187d01c7
outcomes:
- claim: recordings-two-cells-runs
  outcome: reproduced
  notebook: reproduce_buccino_2024.ipynb
  output: claim:recordings-two-cells-runs
  measured:
  - 2
  - 195.8
  notes: Two NWB files, one neuron each; cell 1 (sub-3148, the code's cell1_211006_3148) has 5 runs
    and cell 2 (sub-3436, cell1_211011_3436) 4. The median run lasts 195.8 s from the first to the
    last patch sample (195.7 to 195.8 s, the same span as each run's MEA series). The runs are those
    the code used; cell 2's runs 3 to 6 are stored as run1 to run4, and the descriptions of its MEA
    series keep the original numbers.
- claim: ecode-protocol-structure
  outcome: reproduced
  notebook: reproduce_buccino_2024.ipynb
  output: claim:ecode-protocol-structure
  notes: In all 9 runs, all eight protocols are present with 21, 2, 11, 11, 6, 4, 4 and 1 sweeps
    (IDthres, firepattern, IV, IDrest, APWaveform, HyperDepol, sAHP, PosCheops). Step durations
    measured on the timestamps are within 0.1 ms of 270, 3600, 3000, 1350, 50, 450 and 270, and 250,
    225 and 450 ms; the PosCheops ramps rise in 3925 to 3975, 1965 to 1988 and 1307 to 1322 ms
    measured from 5 pA above holding. Against the IDthres scale (120.4 to 120.8 pA for cell 1, 301.2
    to 301.7 pA for cell 2) every amplitude is within 1.2 percentage points of its stated
    percentage. IV has 11 steps from -140 to 60% (reading a); reading (b), 9 steps to 20%, does not
    match the sweep count.
  deviations:
  - The 0% IV step of reading (a) has no relative tolerance; 10% of the IV increment (2% of the
    scale) was used. Its measured level is within 2% of holding in every run.
  - APWaveform's sweep count (6) and PosCheops' (1) are not stated in the Methods; 6 is the number
    of amplitudes from 200 to 350% by 30%.
- claim: holding-potential
  outcome: reproduced
  notebook: reproduce_buccino_2024.ipynb
  output: claim:holding-potential
  measured: -69.54
  notes: The median pre-stimulus membrane potential is -69.54 mV for cell 1 (given as measured) and
    -69.12 mV for cell 2, over 300 and 240 sweeps, within -70 +/- 7 mV (reading a). Run medians range
    from -71.0 to -66.6 mV. Neither cell is within -84 +/- 8.4 mV (reading b), so the stored voltages
    are the uncorrected read-out. The window before the code's ton gives the same values to within
    0.1 mV.
  deviations:
  - The pre-stimulus window ends at the first change of the injected current found in each sweep (350
    ms for most protocols), which in these files is 50 ms before the code's ton (400 ms for IDrest);
    the window ending at the code's ton is shown as a variant.
- claim: extracellular-spikes-above-50uv
  outcome: reproduced
  notebook: reproduce_buccino_2024.ipynb
  output: claim:extracellular-spikes-above-50uv
  measured: 159.2
  notes: With the template method on the run with the most channels after denoising (cell 1 run 4,
    561 channels; cell 2 run 1, 545), the largest channel reaches a negative peak of 217.0 uV
    (peak-to-peak 274.0 uV) for cell 1 and 159.2 uV (192.2 uV) for cell 2; the smaller, cell 2's, is
    given as measured. Every run of both cells is above 50 uV under both readings (negative peaks
    159.2 to 218.0 uV). 125 to 217 patch spikes per run outside PosCheops, 92 to 98% of waveforms kept
    by the 2 SD rule. The code's mean template is higher by up to 13.3 uV. The largest channel of
    cell 1 is the channel the export notebook plots (ch885); for cell 2 that notebook plots ch384,
    adjacent to the largest channel found here (156.8 uV). The patch and MEA clocks stay aligned
    within sweeps; all 1616 spikes have their MEA trough 0.15 to 0.70 ms before the patch peak,
    none at the +/- 2 ms edge of the search, with medians of -0.35 to -0.25 ms in every window of
    the sweep up to 4.5 s, and per-run slopes of -0.003 to 0.023 ms per s of sweep, against the 20.4
    ms per s a clock mismatch of 20 against 20.41 kHz would give.
  deviations:
  - The band-pass filter is applied forward and backward (sosfiltfilt), the default of the code's
    filtering library; the Methods give only the order and cut-offs. A standard choice that cannot
    move amplitudes of 159 uV and more below 50 uV.
- claim: mea-electrodes-and-rates
  outcome: partially_reproduced
  notebook: reproduce_buccino_2024.ipynb
  output: claim:mea-electrodes-and-rates
  measured:
  - 20000
  - 20408.2
  notes: The MEA recorded 678 (cell 1) and 675 (cell 2) electrodes, above 500 and at most 1024, at
    20000 Hz in every run. The patch timestamps are at 20000 Hz only for IDthres; firepattern, IV,
    IDrest, HyperDepol, sAHP and PosCheops are at 20408.2 Hz (49 us intervals) and APWaveform at
    125000 Hz (8 us), neither 20 nor 200 kHz. The intervals are exact within each sweep and the step
    durations measured on them are the nominal ones, so they are the sampling of the deposited data.
    The electrode and MEA parts hold; the patch rate, with tolerance 0, does not. The criterion has
    no partial clause; partially_reproduced is used because the claim holds in part (electrodes and
    MEA rate) and fails in part (patch rate). Whether APWaveform at 125 kHz fits the paper's
    "typically 200 kHz" is asked of a reader (questions/000294.yaml); it cannot change the outcome,
    since six protocols at 20.41 kHz already fail.
- claim: culture-age
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The NWB subject has only subject_id, species and description ("Rat cortical embryonic cell
    culture"); neither the files nor the dandiset's metadata give an age, a date of birth or plating,
    or days in vitro. The session dates (2021-10-06 and 2021-10-11) are 5 days apart, which fits
    either reading but does not give the age.
- claim: fig6-ais-from-dendrite
  outcome: reproduced
  notebook: reproduce_buccino_2024.ipynb
  output: claim:fig6-ais-from-dendrite
  notes: In the repository's morphology_corrected.swc of both cells, the single AIS path (type 4,
    184 and 192 points) starts from a dendrite point (type 3), 42.9 and 39.1 um from the soma point,
    and the axon (type 2) starts from the AIS. The NeuroMorpho.org copies were not used.
- claim: gt-rheobase
  outcome: reproduced
  notebook: reproduce_buccino_2024.ipynb
  output: claim:gt-rheobase
  measured: 150
  notes: With the ground-truth notebook's series (from 0.15 nA by 0.005 nA), the first step, 150 pA,
    fires one spike in the 270 ms step. Because that series starts at the stated value, a series
    from 0.10 nA was also run; the model first fires at 140 pA, also within 150 +/- 15 pA. The
    code's own compute_rheobase_for_model on the LFPy cell model gives the same 150 and 140 pA. The
    repository's IDrest 300% step of 0.45 nA implies the same 150 pA scale.
  deviations:
  - Simulated with BluePyOpt 1.14.26 (NEURON 9) on the repository's model definition, in place of
    BluePyOpt 1.13.88; the main series uses its NEURON simulator, and the code's
    compute_rheobase_for_model on its LFPy simulator, as the notebook uses, is shown and agrees.
- claim: fig3b-ap-initiates-distal-ais
  outcome: reproduced
  assumed: true
  notebook: reproduce_buccino_2024.ipynb
  output: claim:fig3b-ap-initiates-distal-ais
  notes: Run as 7-AIS-test.ipynb runs it (the repository's IDrest_300 protocol with the AIS
    recordings on the LFPy cell model, get_peak_cutout over 12 spikes, first and last left out).
    The code's cut-outs have 0.05 ms samples. At the sample the distal and middle AIS tie under both
    readings (-0.35 ms at -20 mV, -0.25 ms at the peak, from the somatic peak sample), and the soma
    follows 0.15 and 0.25 ms later. Between samples (linear crossing, parabolic peak) the distal AIS
    leads the middle by 0.0042 and 0.0202 ms. A fixed-step run (dt 0.005 ms) of the whole protocol
    times each of the 12 spikes; the distal AIS leads the middle by 0.0051 to 0.0070 ms at the
    crossing and 0.020 to 0.025 ms at the peak, and the middle leads the soma by 0.162 to 0.168 and
    0.23 to 0.24 ms, in 12 of 12 spikes. The order distal, middle, soma holds under both readings at
    every resolution that separates the two AIS points.
  deviations:
  - Assumed. The paper does not say how the initiation site is read from Figure 3B (Results 3.2,
    "The AP is initiated at the distal end of the AIS and travels back toward the soma"), nor at what
    resolution. The times are read between the 0.05 ms samples of the code's cut-outs and checked on
    a fixed-step run at 0.005 ms, because a 0.05 ms grid cannot order two points 15 um apart that the
    simulation separates by 5 to 7 us; read at the sample, the two AIS points tie under both
    readings and the claim's strict order would not be met.
  - Simulated with BluePyOpt 1.14.26 in place of 1.13.88; the code's protocol, recordings and
    get_peak_cutout run unchanged on its LFPy simulator. The fixed-step check uses its NEURON
    simulator (dt 0.005 ms, a standard choice).
- claim: fig3a-largest-channel-at-ais
  outcome: reproduced
  notebook: reproduce_buccino_2024.ipynb
  output: claim:fig3a-largest-channel-at-ais
  notes: The template recomputed with the code (IDrest 300%, calculate_eap with get_extra_kwargs, the
    code's planar probe, LFPy cell model) matches the repository's template.npy with correlation
    0.99992 and an RMS difference of 1.3% of the template; with the probe moved by 2 or 5 um the
    difference rises to 6.6 to 16.1%, so the file was simulated in the frame of the LFPyCellModel. In
    that frame the AIS segment midpoints run from (11.8, -1.0) to (13.8, -28.3) um and its midpoint is
    (12.6, -13.7) um. The nearest electrode is channel 43 at (25, -25) um, 16.8 um away against 39.3
    um for the next, and it is the nearest electrode to every AIS segment. Channel 43 has the largest
    peak-to-peak and the largest negative peak of the repository's template. The second-largest
    peak-to-peak, 0.939 of the largest, is channel 24 at (-25, 25) um, 54.0 um from the AIS midpoint;
    moving the probe by 2 um in x makes channel 24 the largest, so the largest channel depends on the
    placement, which the match to the file fixes.
  deviations:
  - The AIS is placed with the segment midpoints of the instantiated LFPyCellModel (BluePyOpt 1.14.26,
    LFPy 2.3.7), where LFPy puts the soma midpoint at the origin. In the first round it was placed
    from NEURON's 3D points relative to the mean soma point, which puts the AIS midpoint at (1.7,
    -23.4) um, about 14 um off; that placement also gives channel 43 as nearest (23.3 um, next 26.8
    um) and is shown as a variant.
- claim: table1-feature-counts
  outcome: reproduced
  notebook: reproduce_buccino_2024.ipynb
  output: claim:table1-feature-counts
  measured:
  - 76
  - 87
  - 109
  - 153
  notes: The code's create_evaluator for hay_ais has 76 intracellular objectives for every strategy
    and 0, 11, 33 and 77 extracellular ones, totals 76, 87, 109 and 153; the feature files
