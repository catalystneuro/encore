findings:
- kind: other
  statement: Eight of the 54 spinal cord cells, all those of donors sub-1435396971 (3 cells) and sub-1435397039
    (5 cells), carry the genotype wt/wt in their NWB files and C57BL6J in their sample names, where the
    Methods (Patch-seq, Transgenic mice and labelling projection neurons) describe Dbh-Cre;Ai65 mice labelled
    with AAVrg-DIO-FLPo. Either the metadata or the paper's description is wrong, or these cells were
    labelled another way. The waveform results depend on them (spinal cord against cortex in the code's
    computation, p = 0.0097 with them and 0.14 without).
- kind: code_mismatch
  statement: The Methods give a sweep inclusion rule (bridge balance, bias current within +-100 pA, noise)
    that the paper's code (LCNE-patchseq-figures at 79fa20a) does not apply. 19 of the 96 cells have no
    sweep within +-100 pA of bias, yet the paper's frozen time-constant table has values for 17 of them.
    Under the rule as written the time-constant comparisons reach p = 0.0071 and 0.0025, not the p < 0.001
    the paper reports.
- kind: data_missing
  statement: 32 of the 96 cells have no library identifier in mapping.tsv and no transcriptome in the
    deposit, though the paper says it confirmed the identity of each recorded cell from its RNA.
- kind: identifier_missing
  statement: The NeMO collection the paper's Data availability names (col-p9d5w39), and which the dandiset
    lists as a related resource, holds no files. The Patch-seq FASTQ files are in collection col-s96tk9a,
    and the processed sequencing counts of the grant sit in folders whose manifest names collection col-afgz110;
    neither the paper nor the dandiset links these to the paper's snRNA-seq and retro-seq data.
- kind: selection_undocumented
  statement: The paper's frozen time-constant table lacks a value for 14 of the 96 cells without saying
    why; IPFX gives a value for 13 of them from the dandiset's sweeps.
- kind: metadata_insufficient
  statement: The filtering field of all 96 NWB files reads PLACEHOLDER; the Methods give a 10 kHz Bessel
    filter.
- kind: metadata_error
  statement: participants.tsv gives no sex, age or donor NHash identifier for sub-1435396971; its NWB
    files give female, P62.
- kind: metadata_error
  statement: datasets.tsv gives dandiset 001858 the URL of dandiset 001748.
