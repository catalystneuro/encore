- claim: triphasic-pattern
  outcome: partially_reproduced
  notebook: reproduce_russo_2025.ipynb
  output: claim:triphasic-pattern
  measured: 171.52
  notes: 'The pattern is present in every mouse: initial peak at 2.5 to 9.5 ms, rate below baseline over a mean
    99% (RS, 9 mice) and 88% (relay, 7 mice) of 10 to 140 ms, rebound peak at 150.5 to 193.5 ms. The silence does
    not match 127.8 +- 4.1 ms under either reading of the criterion: (a) 171.5 ms for RS (given as measured) and
    160.8 ms for relay units; (b) 57.9 and 71.4 ms. Reading (b) on 1 ms bins is degenerate (threshold 0.05 to 6.51
    Hz, below zero for the one-unit relay population of 551399; 7 of 16 populations give 0 to 5 ms). On PSTHs smoothed
    by a running mean of 2, 5, 10 and 20 ms the RS silence is 113.8, 134.1, 132.8 and 127.9 ms, within tolerance
    only at 20 ms, and the relay silence 86.4 to 98.7 ms (100.8 to 107.3 without 551399). The smoothing width is
    not a reading of the criterion, which fixes 1 ms bins, and no width brings the relay value near. How the paper
    measured the 127.8 ms is not stated (asked of the authors in the findings).'
  deviations:
  - The dandiset holds 10 deep MOs sessions from 10 mice (9 with units), where the paper reports 26 EEG sessions
    from 15 mice and units from 21 mice.
  - Responsive units use the Methods' 7 SD rule on trial-averaged rates in 10 ms bins; the paper estimates rates
    with an adaptive kernel (Methods, Unit analyses, ref. 138). Unit analyses use the trials the file marks valid.
  - Reading (b) is also shown on PSTHs smoothed by running means of 2 to 20 ms, a variant asked for by the verifier;
    the criterion's 1 ms bins decide the outcome.
