    0.95). Under the five seeds HF is 277 to 278 (a) and 281 (b), threshold 6.63 to 6.93 (a) and 7.50 (b); the outcome
    is the same under all. TRN with the RT unit (19 units) is unimodal too (p = 0.80 and 0.18). The LF group behind
    every HF and LF claim has 18 units (8 at 17.88 ms) from 4 mice, against 700 in the paper.
