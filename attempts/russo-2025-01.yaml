  notes: 'Figure 2B part holds, Figure 1C part does not. The five per-mouse mean latencies (all high-intensity
    valid trials) are within 10% of the Source Data means: CSD 170.3 against 173.8 ms, EEG 173.4 against
    171.3, LFP 169.9 against 170.2, MOs 171.8 against 170.7, SM-TH 168.5 against 153.8 (+9.5%), from 9
