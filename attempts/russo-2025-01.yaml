findings:
- kind: data_missing
  severity: major
  statement: 'The dandiset holds part of the paper''s mouse data: 10 sessions from 10 mice with deep MOs stimulation
    (9 with Neuropixels), where the paper reports EEG from 26 sessions of 15 mice and units from 21 mice. The posterior
    stimulation sessions of Figure S6 (12 sessions, 6 mice) are not in it, and the optogenetic sessions are on figshare.
    The dataset''s description cites Claar et al. 2023 and does not say which sessions Russo et al. 2025 used.'
- kind: metadata_error
  severity: minor
  statement: The units' waveform_duration is described as the mean duration in seconds; its values (0.11 to 2.07)
    are milliseconds.
- kind: other
  about: data
  severity: minor
  statement: The trial table's is_running marks a trial as running when the mean speed from -0.5 to +0.5 s is above
    0 cm/s, as its description says; the paper uses 0.1 cm/s. The classification here was recomputed from running_speed,
    and agrees with is_running at 0 cm/s for every trial.
- kind: other
  about: data
  severity: none
  statement: 'The EEG, the LFP, the units and the trial table share a clock: each trial onset is within 0.4 ms of
    an EEG and LFP sample, in the raw trial-averaged signals the stimulation artifact sits within 0.2 ms of the
    onset in the EEG and within 0.6 ms (1.5 samples at 2.5 kHz) in the LFP of every session, and units fire at 18 to 41 Hz in 2 to 10 ms after the pulse against 2 to 7 Hz
    before it, in every mouse.'
- kind: selection_undocumented
  about: data
  severity: minor
  statement: Besides the deep MOs sessions, the dandiset holds superficial MOs and SSp stimulation sessions that
    the paper's analysis does not use; nothing in the files marks the sessions or the trials and channels the paper
    kept. The is_valid and is_data_valid flags are the files' own.
- kind: paper_inconsistency
  statement: The depth of the stimulating electrode is 1.06 +- 0.05 mm below the surface in the Results and 1.4
    +- 0.24 mm below the brain surface in the Methods.
- kind: methods_unavailable
  statement: 'Question for the authors: how was the 127.8 +- 4.1 ms silence of the triphasic pattern measured? Neither
    the first rebound spike latency minus 10 ms (171.5 ms for RS, 160.8 ms for relay units here) nor the time below
    baseline minus 2 SD (57.9 and 71.4 ms) gives it.'
- kind: methods_unavailable
  statement: 'Question for the authors: what is the unit of the rest against active tests of evoked firing rate
    (Figures 3A, S9A, S10A)? The legends say across subjects, the Source Data hold unequal numbers of rest and active
    values (per trial), and the code compares per-session medians. Here the SM-TH increase is significant per trial
    (p = 0.00054) and not per unit (p = 0.41) or per mouse (p = 0.30), and the FS decrease is significant per unit
    and per mouse but not per trial. Within sessions (van Elteren) the SM-TH increase gives p = 0.19 and the FS
    decrease p = 1.3e-08.'
- kind: methods_unavailable
  statement: 'Question for the authors: which baseline window sets the GFP peak threshold of the EEG, LFP and CSD
    latencies (Figure 2B), and how are the two columns of a Neuropixels probe handled in the CSD depth smoothing
    of 26 and 4 channels? Here the baseline was -1 to -0.01 s and the two sites of a row were averaged; both are
    assumptions.'
- kind: methods_unavailable
  statement: The optogenetic deposit (figshare 28440311 v1) has no description of its layout or of the event the
    spike latencies are timed from; one mouse's unit tables (673553) lack the area column, and it holds no LFP,
    so the LFP latencies of Figure 2G cannot be checked. It has light-over-MOs sessions in five mice, where the
    Figure S8B legend reports two.
- kind: other
  about: data
  severity: none
  statement: In the optogenetic deposit the four protocol folders of each probe list the same cluster_ids, with
    the same peak channel, duration, area and quality metrics for every unit (1432 of 1432), so they are cut from
    one spike sort and units can be paired across protocols by cluster_id.
