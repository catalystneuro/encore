outcomes:
- claim: screen-single-mutations-improved
  outcome: not_reproduced
  notebook: reproduce_dana_2016.ipynb
  output: claim:screen-single-mutations-improved
  measured:
  - 230
  - 934
  - 58
  - 692
  notes: Supplementary file 1 holds 934 single-mutation RCaMP1h variants and file 2 holds 692 single-mutation R-GECO1
    variants, within tolerance of 934 and 689. By the criterion's rule (1 AP ratio above 1, 1 AP p below 0.01) 230 RCaMP1h
    and 58 R-GECO1 variants are improved, against 353 and 187. Other rules do not reach them either (ratio above 1 alone
    637 and 207; ratio above 1 with p below 0.05, 334 and 91; any of 1, 3, 10 or 160 AP, 307 and 66; all variant rows,
    334 and 122). The claims check had found the same counts before the analysis.
  deviations:
  - The parent's own row, whose mutation column reads 'base', is not counted as a single mutation.
- claim: culture-jrgeco1a-sensitivity
  outcome: reproduced
  notebook: reproduce_dana_2016.ipynb
  output: claim:culture-jrgeco1a-sensitivity
  measured: 8.57
  notes: The jRGECO1a row of Supplementary file 2 gives a 1 AP ratio of 8.57 against R-GECO1 (p 2.3e-09), a 10 AP half
    decay time ratio of 1.05 (p 0.32) and a 160 AP dF/F0 ratio of 1.10 (p 0.47), both inside 0.8 to 1.25 and both with
    p at or above 0.01. The faster rise time in the statement is not in the table and is not tested.
  deviations:
  - Tested on the paper's supplementary table, not on recordings; the culture recordings are not deposited.
