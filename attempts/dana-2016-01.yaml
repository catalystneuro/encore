- claim: fig4d-event-counts
  outcome: not_reproduced
  notebook: reproduce_dana_2016.ipynb
  output: claim:fig4d-event-counts
  measured:
  - 191
  - 62
  - 28
  - 30
  - 36
  - 20
  - 12
  - 17
  - 158
  - 83
  - 79
  - 58
  - 38
  - 24
  - 16
  - 11
  - 320
  - 246
  notes: 'Under the main reading (isolation (a), more than 1 s on each side as the Methods say, with the script''s noise
    traces) 6 of the 18 counts are within tolerance, the best of the six combined readings of the claim (0 to 6): jRGECO1a
    191, 62, 28, 30, 36, 20, 12, 17 events (1, 3, 5 and 6 AP within) and 320 noise traces (within); jRCaMP1a 158, 83,
    79, 58, 38, 24, 16, 11 (only 8 AP within) and 246 noise traces against 274. The data set''s script, with 0.8 s isolation
    after the event, gives all nine jRGECO1a counts exactly (199, 70, 29, 34, 35, 22, 14, 21 and 320) and 11 of 18 in
    all, but that isolation disagrees with the Methods and is not a reading of the claim. Reading (b) gives far more events.
    A sweep of jRCaMP1a isolation intervals (1 to 2 s before, 0.8 to 2 s after) matches at most 7 of the 8 event counts,
    and no noise rule tried gives 274. Counting the duplicate jRCaMP1a file twice raises the counts. Before verification
    this outcome was partially_reproduced, on the script''s isolation as the main reading; it was changed after round
    1 (see verifications).'
  deviations:
  - Events are isolated by reading (a), more than 1 s before the first and after the last spike, as the Methods say ("isolated
    from other APs by >1 s"). The script's isolation (1 s before, 0.8 s after, a spike needed on each side, events past
    sample 3.15e6 dropped) disagrees with the Methods and with its own comment (">1000ms after the last spike"); the claims
    file makes the Methods the main reading where they and the script disagree, so it is shown as a variant.
  - The noise traces of the main reading are the script's (find_no_event.m, one per gap between spikes longer than the
    bin, at its midpoint), with the jRCaMP1a 5 s bin of the Figure 4e legend; the script uses 4 s (interval_pre*4) for
    jRGECO1a.
  - The duplicate jRCaMP1a recording data_20150526_cell2_002.mat is counted once (protocol, author step 1.2).
  - Under readings (a) and (b) the start and end of a recording count as spikes for the isolation, a standard choice.
- claim: fig4e-jrgeco1a-1ap-detection
  outcome: reproduced
  notebook: reproduce_dana_2016.ipynb
  output: claim:fig4e-jrgeco1a-1ap-detection
  measured: 84.3
  notes: Under the main reading (isolation (a), the script's noise traces and frame window, template from all events,
    95th percentile threshold) 84.3% of 191 single spikes are detected against 319 noise traces. The script's isolation
    gives 82.4% of 199. Leave-one-out templates give 84.3%, balanced accuracy 89.6%, the script's 99th percentile 60.7%.
    Of the 36 combinations of the claim's named segment readings (a), (b), (c) with isolation (a) or (b), the noise and
    the template readings, 1 is within tolerance (isolation a, noise ii, segment b, 76.3%), and it is among the 16 whose
    noise traces cannot hold a spike transient. By recording date the main rate is 78.3 to 91.1% on the five dates with
    23 or more events (one event on 20150708).
  deviations:
  - Events are isolated by reading (a), more than 1 s before the first and after the last spike, as the Methods say ("isolated
    from other APs by >1 s"). The script's isolation (1 s before, 0.8 s after, a spike needed on each side, events past
    sample 3.15e6 dropped) disagrees with the Methods and with its own comment (">1000ms after the last spike"); the claims
    file makes the Methods the main reading where they and the script disagree, so it is shown as a variant.
  - Noise traces and the projected frame window of the main reading are those of the data set's script data_analysis_for_CRCNS_jRGECO1a.m
    with find_no_event.m (one noise trace per spike-free gap longer than the bin, at its midpoint; 10 frames before to
    20 frames after the frame nearest the event, interpolated ten-fold, F0 from the 10 frames before, noise traces with
    |dF/F0| >= 0.3 dropped), printed in the notebook. The Methods (Simultaneous electrophysiology and functional imaging
    in V1, paragraph 2) do not give them, and the claims file names the script's reading as the main one where it settles
    a detail the Methods leave open.
  - The detection threshold is the 95th percentile of the noise projections, the 5% false-positive rate the Results and
    the criterion state; the script uses the 99th (prctile(proj_noise,99), '1% false positive'), shown as a variant. The
    Methods come before the code (protocol, reader step 2).
  - Segments of the named readings use the nominal 30 Hz frame rate for their length (120 frames for 4 s, 30 for 1 s),
    a standard choice; the recordings run at 29.6 to 30.0 Hz.
