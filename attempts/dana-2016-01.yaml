    from other APs by >1 s"). The script's isolation (1 s before, 0.8 s after, a spike needed on each side, events past
    sample 3.15e6 dropped) disagrees with the Methods and with its own comment (">1000ms after the last spike"); the claims
    file makes the Methods the main reading where they and the script disagree, so it is shown as a variant.
  - Noise traces and the projected frame window of the main reading are those of the data set's script data_analysis_for_CRCNS_jRGECO1a.m
    with find_no_event.m (one noise trace per spike-free gap longer than the bin, at its midpoint; 10 frames before to
    20 frames after the frame nearest the event, interpolated ten-fold, F0 from the 10 frames before, noise traces with
    |dF/F0| >= 0.3 dropped), printed in the notebook. The Methods (Simultaneous electrophysiology and functional imaging
    in V1, paragraph 2) do not give them, and the claims file names the script's reading as the main one where it settles
    a detail the Methods leave open.
  - Peak dF/F0 of the script segment is the maximum over its samples after the event (frames 0 to 20); the script's own
    amplitude, the maximum of the median trace, is printed as a variant.
- claim: fig4g-jrgeco1a-faster
  outcome: reproduced
  notebook: reproduce_dana_2016.ipynb
  output: claim:fig4g-jrgeco1a-faster
  notes: With 2 AP events preceded by 2 s without spikes and the 16 best-fitted traces, under isolation (a), the main
    reading, jRGECO1a has the shorter mean half rise (15 against 47 ms), fitted half decay (225 against 2300 ms) and trace
    half decay (155 against 312 ms); the script's isolation gives the same (19 against 50, 172 against 969, 135 against
    176 ms). Under reading (b) the half rise is longer for jRGECO1a (262 against 129 ms) and both decays are shorter.
    Fitting to 2 s after the first spike, all three measures are shorter for jRGECO1a under every reading. 32 to 84 jRGECO1a
    and 54 to 86 jRCaMP1a events were fitted, depending on the reading. Half rise times under one frame rest on interpolation
    with the frame before the spike. The fitted jRCaMP1a decay is unstable (s.e.m. up to 1115 ms), as the fit ends 1 s
    after the event; on the trace the slowest jRCaMP1a traces never reach half peak (15 of 16 measured under reading (a)),
    which works against the claim. Ranking by RMS residual relative to the peak gives the same order under readings (a)
    and script.
  deviations:
  - The fit ends at the first spike plus the 2 AP bin plus the post-event isolation (1 s, or 0.8 s for the script reading),
    a standard choice the paper leaves open; a 2 s window is shown as a variant and gives the same result.
  - The script's fitting function fit_dynamic_fitting is not in the data set, so the fit, the fit-error rule and the half
    rise of the paper's code could not be followed; the claim's readings are used.
- claim: fig4g-kinetics-like-gcamp6
  outcome: not_reproduced
  notes: Chen et al. (2013b) Supplementary Table 3 (V1 in vivo, cell-attached) gives GCaMP6f a 1 AP half decay of 142
    ms and rise time to peak of 45 ms, GCaMP6s 550 and 179 ms. Under the main reading (isolation (a), the 16 best fitted
    2 AP traces, half rise, fitted half decay) none of the four times is within 25% of the matching value (jRGECO1a 15
    and 225 ms, jRCaMP1a 47 and 2300 ms). With the trace half decay, jRGECO1a's 155 ms is within 9% of GCaMP6f but jRCaMP1a's
    312 ms is 43% short of GCaMP6s. None of the 8 readings of the claim, and none of 24 combinations including the time
    to peak of the same traces (77 and 285 ms) and the culture values of Chen et al.'s Supplementary Table 1, has all
    four pass; at most 2 do. Chen et al. give 1 AP time to peak, not 2 AP half rise; this is asked of a reader (questions/dana-2016.yaml).
    Before verification this claim was blocked (other), as the values had not been entered.
  notebook: reproduce_dana_2016.ipynb
  output: claim:fig4g-kinetics-like-gcamp6
  deviations:
  - The GCaMP6 values are those of Chen et al. (2013b) Supplementary Table 3, mouse V1 in vivo, the preparation of Figure
    4; the Results passage cites Chen et al. without naming a table. The culture values of their Supplementary Table 1
    (10 AP) are shown as a variant and give the same outcome.
  - Chen et al. report a rise time to peak, so the claim's half rise is compared with it as the criterion directs; the
    time to peak of the same traces is shown as a variant and gives the same outcome.
