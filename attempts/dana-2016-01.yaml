  output: claim:fig4df-jrgeco1a-better-than-jrcamp1a
  notes: Under the main reading jRGECO1a has the higher median peak dF/F0 (1 s window and segment window) and the higher
    d-prime (both formulas) for all 8 values of n; at 1 AP the median peak is 0.211 against 0.107 and d-prime (i) 2.37
