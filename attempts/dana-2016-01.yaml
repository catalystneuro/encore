findings:
- kind: other
  about: data
  statement: Two jRCaMP1a files, data_20150526_cell2_001.mat and data_20150526_cell2_002.mat, hold the same recording,
    with identical soma fluorescence and raw ephys, the same 75 spikes. Counted twice it adds 7 one-spike events and 12
    noise traces to the jRCaMP1a analysis.
- kind: identifier_missing
  statement: The files name the cell and the recording date but not the animal. The paper reports 6 and 5 mice, which
    match the number of recording dates, but that each date is one mouse cannot be checked.
- kind: other
  about: data
  statement: In data_20150707_cell1_001.mat (jRCaMP1a, 304 spikes) the corrected soma fluorescence shows no relation to
    the spikes (peak correlation of spike counts with the fluorescence rise 0.028 at a lag of 14 frames, below the 0.050
    of shifted spike trains), and in data_20150605_cell7_003.mat (15 spikes) it falls just below it (0.047 against 0.048).
    The shared clock of spikes and frames could not be established for these two; all other 44 recordings peak at lags
    of -1 to +1 frame, above the null. The first contributes 31 of the 162 jRCaMP1a one-spike events.
- kind: other
  about: data
  statement: The analysis script data_analysis_for_CRCNS_jRGECO1a.m calls rawf2df_f and fit_dynamic_fitting, which are
    not in the data set, so it cannot run as deposited; and there is no script for the jRCaMP1a files.
- kind: code_mismatch
  statement: The data set's Figure 4 script differs from the paper's Methods and Results in three places. Its detection
    threshold is the 99th percentile of the noise projections (1% false positives) where the paper reports rates at 5%;
    its events need more than 0.8 s without spikes after the last spike (interval_post=800*fs/1000) where the Methods,
    and the script's own comment (">1000ms after the last spike"), say more than 1 s; and its noise traces are one per
    spike-free gap longer than 4 s, taken at the gap's midpoint and dropped if any |dF/F0| reaches 0.3, which the Methods
    do not say. The script's 0.8 s gives the paper's jRGECO1a event counts exactly (199, 70, 29, 34, 35, 22, 14, 21),
    the Methods' 1 s does not (191, 62, 28, 30, 36, 20, 12, 17), so the published counts appear to come from the script.
    With the script's own threshold the jRGECO1a single-spike rate is 60.8%, not the 82% reported; with the 5% threshold
    it is 82.4%.
- kind: methods_unavailable
  statement: For the paper's authors, on the jRCaMP1a analysis of Figure 4. Which isolation intervals, noise rule and
    frame window were used? The jRGECO1a script reproduces the paper's jRGECO1a event and noise counts exactly, but the
    same rule on the jRCaMP1a files gives 162, 89, 86, 62, 44, 26, 15 and 11 events and 246 noise traces, and the Methods'
    1 s isolation 158, 83, 79, 58, 38, 24, 16 and 11, against the reported 135, 65, 71, 52, 33, 20, 14, 11 and 274. This
    attempt assumed the script's 30-frame window for jRCaMP1a, which gives detection rates of 63.3% and 80.7% (reported
    65% and 80%); the windows the Methods allow (4 or 5 s after the event, or 1 s) give at most 41.6% for one spike. Was
    data_20150707_cell1_001.mat, whose fluorescence does not follow its spikes, included?
- kind: methods_unavailable
  statement: For the paper's authors, on Figure 4g. How was the exponential fitted (from the peak or from the spike, over
    what window), which fitting error selected the 16 traces, and how was the half rise time defined? The function the
    script calls for this, fit_dynamic_fitting, is not in the data set. This attempt fitted from the peak to the end of
    the isolation interval, kept the 16 traces with the smallest RMS residual, and measured the half rise from the first
    spike by linear interpolation; jRGECO1a is faster under these and under a 2 s window.
- kind: paper_inconsistency
  statement: The Results say 353 of 934 single RCaMP1h mutations and 187 of 689 single R-GECO1 mutations improved the
    1 AP response (p < 0.01, Wilcoxon rank sum), citing Supplementary files 1 and 2. Those tables list 934 and 692 single
    mutants, but only 230 and 58 with a 1 AP ratio above 1 and a 1 AP p-value below 0.01, and no other rule tried (p <
    0.05, any stimulus, all variants) gives 353 and 187.
- kind: data_missing
  statement: cai-2 holds only the simultaneous imaging and cell-attached recordings of Figure 4, as its description says,
    and not the visual stimulus of those recordings. The cultured neuron screen recordings, the purified protein data,
    the V1 grating imaging (Figures 3, 5, 6 and the Figure 4 supplements), and the Drosophila, zebrafish and C. elegans
    imaging are not in it, and the paper names no other deposit of them; the eLife site holds only summary tables (Figure
    2, source data 1; Figure 7, source data 1 to 3). 24 of the paper's 35 claims are blocked as data missing.
verifications:
- date: '2026-11-13'
  kind: agent
  by: Independent agent run by CatalystNeuro (same harness, separate context, did not write the notebook)
  reviewed: Round 1. The executed notebook of the first run with the conclusion cells and the summary removed, the helper
    module and the claims file, with the paper's full text and Supplementary files 1 and 2 under paper/. The verifier
    queried the S3 listing and filelist.txt, recounted the screen from the local xlsx files and tested the event, noise
    and kinetics helpers on synthetic inputs. Its report gave its own outcome for each claim; all 35 agree with the record
    as it then stood. It reported problems 1 to 3 as affecting a conclusion and 4 to 8 as not. Problem 8 (script fidelity)
    is answered by a new cell that prints the three .m files; problem 7 (claims file) by two questions for a reader. Report
    in transcripts/dana-2016/verifier-1-report.md.
  results:
  - claim: screen-single-mutations-improved
    agrees: true
    outcome: not_reproduced
    reason: Cell 12 counts 230 improved single mutants against 353 ± 35.3 for RCaMP1h, and 58 against 187 ± 18.7 for R-GECO1.
      The totals match (934, and 692 against 689). I got the same 230 and 58 from the local xlsx files. None of the looser
      rules gives 187 for R-GECO1; "ratio > 1" alone gives 207.
    response: No change.
  - claim: culture-jrgeco1a-sensitivity
    agrees: true
    outcome: reproduced
    reason: Cell 14. The 1 AP ratio is 8.57 (tolerance 8.5 ± 0.85). The decay ratio is 1.053 (p = 0.32) and the 160 AP
      ratio is 1.098 (p = 0.47), both inside the "similar" bound.
    response: No change.
  - claim: culture-jrcamp1-sensitivity
    agrees: true
    outcome: reproduced
    reason: Cell 16. The 1 AP ratios are 24.02 and 12.96. jRCaMP1a has both the larger 1 AP ratio and the larger decay
      ratio (3.13 against 1.15).
    response: No change.
  - claim: fig4-recorded-cells
    agrees: true
    outcome: reproduced
    reason: Cell 18. 11 cells on 6 dates for jRGECO1a and 10 cells on 5 dates for jRCaMP1a. The criterion counts a mouse
      as a recording date, so all four counts match. Whether two recording dates came from one mouse cannot be checked,
      since the data set does not name animals.
    response: No change.
  - claim: fig4d-event-counts
    agrees: true
    outcome: partially_reproduced
    reason: Under the script's isolation and noise readings, 11 of 18 counts are within tolerance. All 8 jRGECO1a event
      counts and its 320 noise events match exactly. Six of eight jRCaMP1a event counts, and its noise count (246 against
      274), are outside. Under the claim's readings (a) and (b), at most 6 of 18 are within, which would be not_reproduced.
      The main isolation reading takes the script's 0.8 s after the event; the Methods say "isolated from other APs by
      >1 s", and the claims-file header says the Methods win where they and the script disagree (problem 1).
    response: Outcome changed to not_reproduced. Isolation reading (a), more than 1 s on each side, is now the main reading,
      as the claims-file header directs where the Methods and the script disagree; the script's own comment also says
      1000 ms. Under it 6 of 18 counts are within tolerance, the best of the six readings of the claim. The script's isolation
      is kept as a variant and reported (11 of 18, jRGECO1a exact); the combined table now labels which combinations are
      readings of the claim. The three .m files are printed in a new cell, and the code_mismatch finding notes that the
      published jRGECO1a counts appear to come from the script's 0.8 s.
  - claim: fig4e-jrgeco1a-1ap-detection
    agrees: true
    outcome: reproduced
    reason: 82.4% under the main reading. The result holds with leave-one-out templates and with isolation (a), at 84.3%.
      It depends on the script's segment; under the claim's own segments (a) to (c), only 1 of 54 combinations is within
      tolerance (problem 2).
    response: 'Outcome unchanged; measured is now 84.3% (191 events), under isolation (a) as the main reading, with the
      script''s isolation (82.4%) as a variant. The script segment stays the main reading for this indicator: the Methods
      do not give the segment and the claims-file header makes the script''s reading the main one where it settles an
      open detail. The notebook now also counts the named-segment combinations with the claim''s isolation readings only
      (1 of 36) and those whose noise traces cannot hold a spike transient (1 of 16); the one combination within tolerance
      is in both.'
  - claim: fig4e-jrgeco1a-2ap-detection
    agrees: true
    outcome: reproduced
    reason: Cell 29. 100% under the main reading; the tolerance range is 92 to 100%.
    response: Outcome unchanged; 100% of 62 events under isolation (a), 100% of 70 under the script's isolation.
  - claim: fig4e-jrcamp1a-detection
    agrees: true
    outcome: reproduced
    reason: 63.0% for 1 AP and 75.3% for 2 AP, both within tolerance, but fragile. This rests on three weak points (problems
      2 and 3). The script's segment is applied to jRCaMP1a, for which no script was deposited. The event set is not the
      paper's (162 against 135, 89 against 65). The 1 AP rate goes to 75.4%, outside tolerance, if one recording with
      no spike-fluorescence relation is dropped. The notebook keeps it and never discusses the result.
    response: 'Outcome unchanged, still marked assumed; measured is now 63.3% and 80.7% under isolation (a). A new cell
      gives the jRCaMP1a counts and rates under each isolation reading with all recordings, without data_20150707_cell1_001.mat
      and without both recordings that failed the clock check: without it the 1 AP rate is 71.7 to 75.4%, outside tolerance,
      under every reading. The recording is kept, as it is the only one of cell 20150707_cell1 and without it 9 cells
      remain where the paper reports 10; the conclusion, notes and deviations now say that the outcome depends on it,
      and the methods_unavailable finding asks the paper''s authors whether it was included.'
  - claim: fig4df-jrgeco1a-better-than-jrcamp1a
    agrees: true
    outcome: reproduced
    reason: Cell 36. Under the main reading jRGECO1a is higher for 8 of 8 values of n, for both peak windows and both
      d' formulas. Across all combinations, 152 of 288 give 8 of 8.
    response: Outcome unchanged; under isolation (a) all 8 values of n still favour jRGECO1a for both windows and formulas.
      The tallies are now also given over the claim's isolation readings (94 of 192 give all 8) and over the clean combinations
      (66 of 96), as problem 4 asked.
  - claim: fig4g-jrgeco1a-faster
