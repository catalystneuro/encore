- claim: fig4d-event-counts
  outcome: partially_reproduced
  notebook: reproduce_dana_2016.ipynb
  output: claim:fig4d-event-counts
  measured:
  - 199
  - 70
  - 29
  - 34
  - 35
  - 22
  - 14
  - 21
  - 162
  - 89
  - 86
  - 62
  - 44
  - 26
  - 15
  - 11
  - 320
  - 246
  notes: Under the data set's script reading (isolation and noise) the nine jRGECO1a counts are exactly the paper's
    (199, 70, 29, 34, 35, 22, 14, 21 events, 320 noise traces). Of the jRCaMP1a counts only 7 AP (15) and 8 AP (11)
    are within tolerance; 1 to 6 AP are higher (162, 89, 86, 62, 44, 26 against 135, 65, 71, 52, 33, 20) and the
    noise count is lower (246 against 274). That is 11 of 18, in the 10 to 14 band; the other eight combined readings
    give 0 to 10. Isolation (a) gives 191, 62, 28, 30, 36, 20, 12, 17 for jRGECO1a and reading (b) far more events.
    Counting the duplicate jRCaMP1a file twice raises the counts (169 one-spike events). A sweep of jRCaMP1a isolation
    intervals (1 to 2 s before, 0.8 to 2 s after) matches at most 7 of the 8 event counts, and no noise rule tried
    gives 274.
  deviations:
  - The script's reading (1 s before, 0.8 s after, a spike on each side, events past 315 s dropped; noise as one
    trace per gap longer than the bin) is run as the main reading, as the claims file directs where the script settles
    a detail. The script is written for jRGECO1a and is applied to jRCaMP1a with the jRCaMP1a bins of the Methods
    and the 5 s noise bin of the Figure 4e legend.
  - The duplicate jRCaMP1a recording data_20150526_cell2_002.mat is counted once (protocol, author step 1.2).
  - Under readings (a) and (b) the start and end of a recording count as spikes for the isolation, a standard choice.
- claim: fig4e-jrgeco1a-1ap-detection
  outcome: reproduced
  notebook: reproduce_dana_2016.ipynb
  output: claim:fig4e-jrgeco1a-1ap-detection
  measured: 82.4
  notes: Under the main reading (script events, noise traces and frame window, template from all events, 95th percentile
    threshold) 82.4% of 199 single spikes are detected against 319 noise traces. Leave-one-out templates give 82.4%,
    balanced accuracy 88.7%, the script's 99th percentile 60.8%. Of the 54 combinations of the claim's named segment
    readings (a), (b), (c) with the isolation, noise and template readings, 1 is within tolerance (isolation a,
    noise ii, segment b, 76.3%); they range from 0 to 76.3%. By recording date the main rate is 71.4 to 92.6% on
    the five dates with 28 or more events (one event on 20150708).
  deviations:
  - Event isolation, noise traces and the projected frame window of the main reading are those of the data set's
    script data_analysis_for_CRCNS_jRGECO1a.m with find_nspike_event.m and find_no_event.m (1 s before and 0.8 s
    after the event, a spike needed on each side, events past sample 3.15e6 dropped; one noise trace per spike-free
    gap longer than the bin, at its midpoint; 10 frames before to 20 frames after the frame nearest the event, interpolated
    ten-fold, F0 from the 10 frames before, noise traces with |dF/F0| >= 0.3 dropped). The Methods (Simultaneous
    electrophysiology and functional imaging in V1, paragraph 2) do not give the window, and the claims file names
    the script's reading as the main one where it settles a detail.
  - The detection threshold is the 95th percentile of the noise projections, the 5% false-positive rate the Results
    and the criterion state; the script uses the 99th (prctile(proj_noise,99), '1% false positive'), shown as a
    variant. The Methods come before the code (protocol, reader step 2).
  - Segments of the named readings use the nominal 30 Hz frame rate for their length (120 frames for 4 s, 30 for
    1 s), a standard choice; the recordings run at 29.6 to 30.0 Hz.
