findings:
- kind: other
  about: data
  statement: Two jRCaMP1a files, data_20150526_cell2_001.mat and data_20150526_cell2_002.mat, hold the same recording,
    with identical soma fluorescence and raw ephys, the same 75 spikes. Counted twice it adds 7 one-spike events
    and 12 noise traces to the jRCaMP1a analysis.
- kind: identifier_missing
  statement: The files name the cell and the recording date but not the animal. The paper reports 6 and 5 mice,
    which match the number of recording dates, but that each date is one mouse cannot be checked.
- kind: other
  about: data
  statement: In data_20150707_cell1_001.mat (jRCaMP1a, 304 spikes) the corrected soma fluorescence shows no relation
    to the spikes (peak correlation of spike counts with the fluorescence rise 0.028 at a lag of 14 frames, below
    the 0.050 of shifted spike trains), and in data_20150605_cell7_003.mat (15 spikes) it falls just below it (0.047
    against 0.048). The shared clock of spikes and frames could not be established for these two; all other 44 recordings
    peak at lags of -1 to +1 frame, above the null. The first contributes 31 of the 162 jRCaMP1a one-spike events.
- kind: other
  about: data
  statement: The analysis script data_analysis_for_CRCNS_jRGECO1a.m calls rawf2df_f and fit_dynamic_fitting, which
    are not in the data set, so it cannot run as deposited; and there is no script for the jRCaMP1a files.
- kind: code_mismatch
  statement: The data set's Figure 4 script differs from the paper's Methods and Results in three places. Its detection
    threshold is the 99th percentile of the noise projections (1% false positives) where the paper reports rates
    at 5%; its events need more than 0.8 s without spikes after the last spike where the Methods say more than 1
    s; and its noise traces are one per spike-free gap longer than 4 s, taken at the gap's midpoint and dropped
    if any |dF/F0| reaches 0.3, which the Methods do not say. With the script's own threshold the jRGECO1a single-spike
    rate is 60.8%, not the 82% reported; with the 5% threshold it is 82.4%.
- kind: methods_unavailable
  statement: For the paper's authors, on the jRCaMP1a analysis of Figure 4. Which isolation intervals, noise rule
    and frame window were used? The jRGECO1a script reproduces the paper's jRGECO1a event and noise counts exactly,
    but the same rule on the jRCaMP1a files gives 162, 89, 86, 62, 44, 26, 15 and 11 events and 246 noise traces
    against the reported 135, 65, 71, 52, 33, 20, 14, 11 and 274. This attempt assumed the script's 30-frame window
    for jRCaMP1a, which gives detection rates of 63.0% and 75.3% (reported 65% and 80%); the windows the Methods
    allow (4 or 5 s after the event, or 1 s) give at most 41.6% for one spike.
- kind: methods_unavailable
  statement: For the paper's authors, on Figure 4g. How was the exponential fitted (from the peak or from the spike,
    over what window), which fitting error selected the 16 traces, and how was the half rise time defined? The function
    the script calls for this, fit_dynamic_fitting, is not in the data set. This attempt fitted from the peak to
    the end of the isolation interval, kept the 16 traces with the smallest RMS residual, and measured the half
    rise from the first spike by linear interpolation; jRGECO1a is faster under these and under a 2 s window.
- kind: paper_inconsistency
  statement: The Results say 353 of 934 single RCaMP1h mutations and 187 of 689 single R-GECO1 mutations improved
    the 1 AP response (p < 0.01, Wilcoxon rank sum), citing Supplementary files 1 and 2. Those tables list 934 and
    692 single mutants, but only 230 and 58 with a 1 AP ratio above 1 and a 1 AP p-value below 0.01, and no other
    rule tried (p < 0.05, any stimulus, all variants) gives 353 and 187.
- kind: data_missing
  statement: cai-2 holds only the simultaneous imaging and cell-attached recordings of Figure 4, as its description
    says, and not the visual stimulus of those recordings. The cultured neuron screen recordings, the purified protein
    data, the V1 grating imaging (Figures 3, 5, 6 and the Figure 4 supplements), and the Drosophila, zebrafish and
    C. elegans imaging are not in it, and the paper names no other deposit; 24 of the paper's 35 claims cannot be
    tested.
