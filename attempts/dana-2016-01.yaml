- claim: fig4e-jrcamp1a-detection
  outcome: reproduced
  assumed: true
  notebook: reproduce_dana_2016.ipynb
  output: claim:fig4e-jrcamp1a-detection
  measured:
  - 63.0
  - 75.3
  notes: Under the main reading the 1 AP and 2 AP detection rates are 63.0% (162 events) and 75.3% (89 events) against
    242 noise traces, both within tolerance; the event counts are above the paper's 135 and 65 (fig4d-event-counts).
    Leave-one-out gives 61.7% and 75.3%; the 99th percentile 25.3% and 56.2%. Under the claim's named segment readings
    no combination puts the 1 AP rate within tolerance (at most 41.6%) and 9 of 54 put the 2 AP rate within it,
    so the outcome rests on the script's frame window. By date the 1 AP rate is 85.7% on 20150605 (84 events) and
    33.9% on 20150707 (59). Without the two recordings that failed the clock check the rates are 75.4% (130 events)
    and 82.9% (76), the 1 AP rate then outside tolerance. Open for the paper's authors (see findings) is which window,
    isolation and noise traces the jRCaMP1a analysis used.
  deviations:
  - Event isolation, noise traces and the projected frame window of the main reading are those of the data set's
    script data_analysis_for_CRCNS_jRGECO1a.m with find_nspike_event.m and find_no_event.m (1 s before and 0.8 s
    after the event, a spike needed on each side, events past sample 3.15e6 dropped; one noise trace per spike-free
    gap longer than the bin, at its midpoint; 10 frames before to 20 frames after the frame nearest the event, interpolated
    ten-fold, F0 from the 10 frames before, noise traces with |dF/F0| >= 0.3 dropped). The Methods (Simultaneous
    electrophysiology and functional imaging in V1, paragraph 2) do not give the window, and the claims file names
    the script's reading as the main one where it settles a detail.
  - The detection threshold is the 95th percentile of the noise projections, the 5% false-positive rate the Results
    and the criterion state; the script uses the 99th (prctile(proj_noise,99), '1% false positive'), shown as a
    variant. The Methods come before the code (protocol, reader step 2).
  - Assumed, that the jRCaMP1a analysis used the jRGECO1a script's frame window (10 frames before to 20 after),
    which at 15 Hz is 0.67 s before to 1.33 s after the event. The paper's only analysis code is written for jRGECO1a;
    using the same code for the second indicator is the reading best supported by the data description, which presents
    it as the code for Figure 4. The Methods do not give the window, and the claim's named readings give 1 AP rates
    of 0.6 to 41.6%.
- claim: fig4df-jrgeco1a-better-than-jrcamp1a
  outcome: reproduced
  notebook: reproduce_dana_2016.ipynb
  output: claim:fig4df-jrgeco1a-better-than-jrcamp1a
  notes: Under the main reading jRGECO1a has the higher median peak dF/F0 (1 s window and segment window) and the
    higher d-prime (both formulas) for all 8 values of n; at 1 AP the median peak is 0.210 against 0.112 and d-prime
    (i) 2.35 against 1.16, at 8 AP 1.185 against 0.375 and 3.86 against 2.23. Of 288 combined readings 152 give
    all 8 and 84 give 6 or 7, including readings that use only the claim's named segments. The paper reports no
    test and none is made.
  deviations:
  - Event isolation, noise traces and the projected frame window of the main reading are those of the data set's
    script data_analysis_for_CRCNS_jRGECO1a.m with find_nspike_event.m and find_no_event.m (1 s before and 0.8 s
    after the event, a spike needed on each side, events past sample 3.15e6 dropped; one noise trace per spike-free
    gap longer than the bin, at its midpoint; 10 frames before to 20 frames after the frame nearest the event, interpolated
    ten-fold, F0 from the 10 frames before, noise traces with |dF/F0| >= 0.3 dropped). The Methods (Simultaneous
    electrophysiology and functional imaging in V1, paragraph 2) do not give the window, and the claims file names
    the script's reading as the main one where it settles a detail.
  - Peak dF/F0 of the script segment is the maximum over its samples after the event (frames 0 to 20); the script's
    own amplitude, the maximum of the median trace, is printed as a variant.
- claim: fig4g-jrgeco1a-faster
  outcome: reproduced
  notebook: reproduce_dana_2016.ipynb
  output: claim:fig4g-jrgeco1a-faster
  notes: With 2 AP events preceded by 2 s without spikes and the 16 best-fitted traces, under the script and (a)
    isolation readings jRGECO1a has the shorter mean half rise (19 against 50 ms, script), fitted half decay (172
    against 969 ms) and trace half decay (135 against 176 ms). Under reading (b) the half rise is longer for jRGECO1a
    (262 against 129 ms) and both decays are shorter. Fitting to 2 s after the first spike, all three measures are
    shorter for jRGECO1a under every reading. 32 to 84 jRGECO1a and 54 to 86 jRCaMP1a events were fitted, depending
    on the reading. Half rise times under one frame rest on interpolation with the frame before the spike. The fitted
    jRCaMP1a decay is unstable (s.e.m. up to 1115 ms).
  deviations:
  - The fit ends at the first spike plus the 2 AP bin plus the post-event isolation (1 s, or 0.8 s for the script
    reading), a standard choice the paper leaves open; a 2 s window is shown as a variant and gives the same result.
  - The script's fitting function fit_dynamic_fitting is not in the data set, so the fit, the fit-error rule and
    the half rise of the paper's code could not be followed; the claim's readings are used.
- claim: fig4g-kinetics-like-gcamp6
  outcome: blocked
  blocked_by: other
  notes: The comparison needs the GCaMP6f and GCaMP6s half rise and half decay times of Chen et al. (2013b). The
    main text of that paper (PMC3777791, read in preparation) gives no in vivo rise or decay value; its Figure 3f
    legend shows a half decay time and a rise time to peak, with values in a supplementary table this run did not
    obtain in a form the notebook can read, and for a measure (time to peak) other than this claim's half rise.
    The jRGECO1a and jRCaMP1a values it would use are in fig4g-jrgeco1a-faster. Chen et al.'s recordings are in
    CRCNS cai-1, but the claim compares with their published values.
