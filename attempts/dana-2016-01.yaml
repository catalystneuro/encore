- claim: fig4e-jrcamp1a-detection
  outcome: reproduced
  assumed: true
  notebook: reproduce_dana_2016.ipynb
  output: claim:fig4e-jrcamp1a-detection
  measured:
  - 63.3
  - 80.7
  notes: 'Under the main reading the 1 AP and 2 AP detection rates are 63.3% (158 events) and 80.7% (83 events) against
    242 noise traces, both within tolerance; the event counts are above the paper''s 135 and 65 (fig4d-event-counts).
    The script''s isolation gives 63.0% and 75.3%. Leave-one-out gives 62.0% and 79.5%; the 99th percentile 41.1% and
    67.5%. Under the claim''s named segment readings with isolation (a) or (b) no combination puts the 1 AP rate within
    tolerance (at most 41.6%) and 7 of 36 put the 2 AP rate within it, so the outcome rests on the script''s frame window.
    By date the 1 AP rate is 80.5% on 20150605 (82 events) and 40.0% on 20150707 (55). The outcome also depends on data_20150707_cell1_001.mat,
    whose fluorescence shows no relation to its spikes in the clock check: without it the rates are 74.6% (130 events)
    and 87.3% (71), the 1 AP rate outside tolerance, and the 1 AP rate is outside under every isolation reading (71.7
    to 75.4%, with or without data_20150605_cell7_003.mat). It is kept because it is the only recording of cell 20150707_cell1,
    and without it 9 cells remain where the paper reports 10. Open for the paper''s authors (see findings) is which window,
    isolation and noise traces the jRCaMP1a analysis used.'
  deviations:
  - Events are isolated by reading (a), more than 1 s before the first and after the last spike, as the Methods say ("isolated
    from other APs by >1 s"). The script's isolation (1 s before, 0.8 s after, a spike needed on each side, events past
    sample 3.15e6 dropped) disagrees with the Methods and with its own comment (">1000ms after the last spike"); the claims
    file makes the Methods the main reading where they and the script disagree, so it is shown as a variant.
  - Noise traces and the projected frame window of the main reading are those of the data set's script data_analysis_for_CRCNS_jRGECO1a.m
    with find_no_event.m (one noise trace per spike-free gap longer than the bin, at its midpoint; 10 frames before to
    20 frames after the frame nearest the event, interpolated ten-fold, F0 from the 10 frames before, noise traces with
    |dF/F0| >= 0.3 dropped), printed in the notebook. The Methods (Simultaneous electrophysiology and functional imaging
    in V1, paragraph 2) do not give them, and the claims file names the script's reading as the main one where it settles
    a detail the Methods leave open.
  - The detection threshold is the 95th percentile of the noise projections, the 5% false-positive rate the Results and
    the criterion state; the script uses the 99th (prctile(proj_noise,99), '1% false positive'), shown as a variant. The
    Methods come before the code (protocol, reader step 2).
  - Assumed, that the jRCaMP1a analysis used the jRGECO1a script's frame window (10 frames before to 20 after), which
    at 15 Hz is 0.67 s before to 1.33 s after the event. The paper's only analysis code is written for jRGECO1a; using
    the same code for the second indicator is the reading best supported by the data description, which presents it as
    the code for Figure 4. The Methods do not give the window, and the claim's named readings give 1 AP rates of 1.9 to
    41.6%.
  - data_20150707_cell1_001.mat is kept although its shared clock could not be established (no relation of fluorescence
    to spikes above a shifted-spike null), since the paper's 10 jRCaMP1a cells include its cell; the rates without it
    are given in the notes.
