- claim: fig4s7-error-signal-persists
  outcome: reproduced
  notebook: reproduce_gonzalez_2024.ipynb
  output: claim:fig4s7-error-signal-persists
  notes: On 510 isolated units with more than 5 incorrect outbound trials, inbound runs conditioned on
