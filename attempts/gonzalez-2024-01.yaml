findings:
- kind: data_missing
  about: data
  severity: major
  statement: The files hold smoothed firing rates in 20 ms bins and no spike times, waveforms or
    electrode tables. Units cannot be matched across sessions (Figure 7) or re-sorted, and any analysis
    that needs spikes or waveforms cannot be run on the dandiset.
- kind: data_missing
  about: data
  severity: major
  statement: The repository's session table lists 288 sessions; 12 Tree-Maze sessions with units are not
    in the dandiset (Li_T3i_061218_0001, Li_T3g_070518_0001, NE_T3g_053018_0001, Ne_T3g_060118_0001,
    NE_T3g_062618_0001, NE_T3gj_062718_0001, NE_T3gj_062818_0001, Cl_T3g_112118_0001, Cl_T3g_120118_0001,
    Cl_T3g_121218_0001, Al_T3g_101018_0002, Ca_T3g_031419), with 224 units, 65 of them isolated. The
    attempt has 510 isolated units where the paper counts 565 (Figure 4c), and the repository's unit
    match table refers to Li_T3i_061218_0001.
- kind: metadata_insufficient
  about: data
  severity: major
  statement: No column of the trial, event or unit tables has a description ("no description"). The
    trial markers t0, tD, tE, tE_1, tE_2 and tR, and the columns grw, long and vsw, are defined only in
    the paper's code; the analyses need tE_2 and tR to cut outbound and inbound runs.
- kind: metadata_error
  about: data
  severity: minor
  statement: In Tree-Maze files, track_data is described as "columns=x,y,hd" but holds four columns, a
    clock in seconds, x and y in mm, and head angle in radians. It starts one sample after the firing
    rates (its first row is sample 1). Its starting_time rate attribute is 0.02, the sample period, not
    a rate. The firing rates are labelled "uv" but are rates in spikes per second. Open-field track_data
    is labelled mm but holds x and y in cm (-63 to 63 and -6 to 135) and speed in cm/s.
- kind: metadata_error
  about: data
  severity: minor
  statement: Every session_start_time is in year 0018 or 0019; the dates were written with a two-digit
    year.
- kind: selection_undocumented
  about: data
  severity: minor
  statement: Cl_T3g_121418 and Cl_T3g_121418_0 are two recordings of the same day with different trials
    and units. The paper's code leaves Cl_T3g_121418_0 out as invalid (SummaryInfo.invalid_sessions);
    the dandiset does not say so.
- kind: format_error
  about: data
  severity: minor
  statement: The last trial of Ca_T3g_040119 starts at sample 177666, after the file's last sample
    (165216), with a negative duration. It has no correct flag and no outbound samples, so it adds
    nothing to the zone rates, but it is listed as a trial in an included session.
- kind: other
  about: data
  severity: minor
  statement: The dandiset has no published version; only the draft can be read, and it can still change.
- kind: other
  about: data
  severity: none
  statement: The checks support the files otherwise. Trial and unit counts of all 143 Tree-Maze sessions
    match the repository's tables; trial markers fall in the expected zones (medians over sessions, Home
    at the start in 100% of trials, the goal well matching the recorded decision in 98.3% against 42.6%
    with decisions shifted by one trial); and zone maps of even and odd trials agree best with rates
    unshifted against tracking in 114 of 124 sessions (median Kendall 0.53 against 0.22 with a 5 s
    shift). In 10 sessions, most with few units, the alignment could not be shown this way.
- kind: code_mismatch
  about: paper
  statement: The paper's median of 110 trials per session (Figure 1d) and 54 Switch trials disagree with
    the repository's own perf_table.csv, which gives 152 and 69 under the paper's rule, as do the
    dandiset's trial tables. The accuracies agree (73.0% and 73.8% against 72.6% and 76.9%).
- kind: methods_unavailable
  about: paper
  statement: The paper calls Switch and non-Switch performance "similar" without a test or threshold
    (Results, Tree-Maze behavior, paragraph 2). The attempt uses the claims file's 10-point threshold;
    which comparison did the authors mean?
- kind: paper_inconsistency
  about: paper
  statement: The Figure 4d paragraph says the reward null has "an equal number of rewarded and unrewarded
    trials", while the Methods and the code balance the null by left and right cue. Both give a mean
    reward remapping score below zero (-1.02 and -0.61 for isolated units).
