inputs:
- what: The paper's analysis code, read for every method detail the claims file takes from it and ported
    into the entry's helper (maze zones, trial windows, blanking, balanced resampling, remapping scores,
    segment rate comparisons, zone encoders, statistics). The notebook also reads the repository's
    metadata/session_table.csv and metadata/perf_table.csv, to compare the session list and trial
    counts with the dandiset; no outcome rests on them.
  source: https://github.com/alexgonzl/TMA at commit 6f935935d93a9a27f931f6e73c05d965dfbb862a
outcomes:
- claim: fig1d-task-performance
  outcome: partially_reproduced
  notebook: reproduce_gonzalez_2024.ipynb
  output: claim:fig1d-task-performance
  measured:
  - 73.0
  - 152.0
  notes: Over the 124 Tree-Maze sessions with at least one unit and 50 trials, the median of the five
    subjects' median accuracies is 73.0% (expected 72.6 +- 7.26) and the median of their median trial
    counts is 152.0 (expected 110 +- 11). Pooled sessions give 76.4% and 150.5. Thresholds of 40 to 60
    trials give 135 to 152 trials. The repository's perf_table.csv gives the same 152 under the same rule,
    and the trial and unit counts of every session agree between it and the dandiset, so the paper's 110
    did not come from these session tables. The paper's notebook printed 110.25, which as a median of
    five subject medians of whole or half trial counts cannot arise; it suggests the printed table held a
    different set of subjects or sessions. The aggregation the claims file gives for the 110 is asked
    of a reader (questions/gonzalez-2024.yaml).
  deviations:
  - The dandiset lacks 12 Tree-Maze sessions with units that the repository's session table lists; one
    (Ca_T3g_031419) has no trials in perf_table.csv and the other 11 are not in it.
- claim: fig1-switch-performance
  outcome: partially_reproduced
  notebook: reproduce_gonzalez_2024.ipynb
  output: claim:fig1-switch-performance
  measured:
  - 73.8
  - 69.0
  assumed: true
  notes: The median of subject medians of Switch-trial accuracy is 73.8% (expected 76.9 +- 7.69) and of
    Switch trials per session 69.0 (expected 54 +- 5.4). Non-Switch accuracy is 71.4%, 2.4 points below,
    so the similarity holds under the claims file's 10-point threshold. The sw column equals "cue differs
    from the previous trial" in every session. Per session, Switch accuracy is a median 7.6 points higher
    than non-Switch (Wilcoxon p = 4.8e-11, not the paper's test). The helper's Switch accuracy
    (tma.session_perf, pct_sw_correct) divides by all Switch trials, including change-of-mind trials
    that have no correct flag, so it is biased slightly downward (the round-1 verifier showed 1/3 where
    the answer is 1/2 on synthetic input); the fix was written in the revision but not run (see
    verifications), so 73.8% is a slight underestimate. The outcome rests on the trial count, which
    the fix does not change.
  deviations:
  - The 10-point threshold for "similar" is the claims file's, not the paper's; the paper gives no test,
    so this part rests on that assumption, as the criterion says.
- claim: fig1-training-to-criterion
  outcome: blocked
  blocked_by: data_missing
  notes: Needs the training sessions before surgery. Every Tree-Maze file in the dandiset is a recording
    session with units and a trial table; the code reads the training sessions from a spreadsheet
    (experiment_info.py, get_all_behav_perf, all_behavior_perf) that is not in the repository's metadata
    folder or anywhere public that the paper names.
- claim: fig2c-cue-error-coding
  outcome: reproduced
  notebook: reproduce_gonzalez_2024.ipynb
  output: claim:fig2c-cue-error-coding
  notes: For 510 isolated units the segment effects on U_Z (CR against CL, outbound) are left 0.600, stem
    0.285, right -0.226; LRT 89.3, df 2, p = 4.0e-20; Wald test of the two ordering contrasts 89.0,
    p = 4.8e-20; one-sided left > stem p = 1.8e-4 and stem > right p = 3.6e-9. With MUA (1744 units)
    0.556, 0.325, -0.228, LRT 276.8, p = 7.7e-61. By subject, left > stem > right holds in Cl and Li;
    in Al, Ca and Ne the stem mean is above the left. The paper reports chi2(3) = 85.25; the code's LRT
    function gives df 2 for these models (p with df 3 is 3.0e-19).
  deviations:
  - U_Z is computed with the U statistic of the first sample, as current scipy returns it; the code's
    counts of U_Z <= 0 (Figure 4c) are only possible with that convention.
