  notebook: reproduce_gonzalez_2024.ipynb
  output: claim:fig2e-unit-remap-behaviour
  measured:
  - -0.266
  - -0.145
  notes: Isolated units (n = 507) give Kendall tau -0.266 and LMEM slope on logit performance -0.145
