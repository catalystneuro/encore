findings:
- kind: data_missing
  statement: The dandiset holds 10 of the 12 wild-type extinction mice and 4 of the 6 DREADD mice, and
    none of the time-control mice, dark sessions, pupil recordings, tdTomato control mice or VTA axon
    imaging. Nine of the 41 claims cannot be tested for this reason, and the dark part of a tenth.
- kind: format_error
  statement: sub-014 has 129000 behaviour rows for 135000 fluorescence frames. Decoding position from
    the fluorescence shows the behaviour matches with no shift up to frame 71000 and matches 6000 frames
    later fluorescence from there on, so 6000 behaviour rows are missing at the start of BeforeCNO and
    every later row is misaligned in the file. sub-NR6 has 8 extra behaviour rows and sub-CFC4 one row
    fewer, at the end.
- kind: metadata_insufficient
  statement: Conditions are given only as frame counts in the free-text description of the fluorescence
    series (for example 'Rewarded 15000, Unrewarded 20000', written with colons); there are no epochs
    or trial tables. The behaviour channels have no units ('behavior'); position is in volts with no scale
    to cm, and reward and lick are voltage traces.
- kind: metadata_insufficient
  statement: The DREADD files' raw fluorescence carries a constant offset of about 16400 to 17000 counts
    (file minima 16415 to 16471) that the wild-type files do not have (minima 57 to 678) and the description
    does not mention; dF/F computed without removing it is about ten times too small.
- kind: metadata_insufficient
  statement: The files hold raw suite2p fluorescence only, without neuropil, dF/F, transients or the place
    cells the paper used, and the subjects carry no label for the mice in each figure (for example the
    3 mice of Figures 2 and 3).
- kind: metadata_error
  statement: The ImagingPlane indicator is given as 'GFP' while the description says GCaMP6f, every file
    has the same session_start_time (2021-12-13T02:30:00-06:00) and age P12W, and the DREADD files' session
    description reads 'Reward expectation extinction' for four days of recordings.
- kind: methods_unavailable
  statement: Question for the authors - how was dF/F computed from the suite2p traces (baseline window
    and percentile, neuropil), and what rule defined a significant transient and a candidate place field
    (refs. 44, 67 and 75 are cited)? This attempt used the 8th percentile in a 15 s window, transients
    from 2 to 0.5 SD of at least 0.5 s, and bins above 25% of the way from baseline to peak; its fields
    are about twice as wide as the paper's (94 against 53 cm in R).
- kind: methods_unavailable
  statement: Question for the authors - how is the position voltage converted to cm, and is lap time the
    time from 0 to 200 cm including stops? Reading the top of the voltage range as 200 cm gives R laps
    of 12.2 s (8.5 s counting running frames only) against the paper's 7.34 s, and DREADD lap speeds of
    about 26 cm/s against 42.
- kind: methods_unavailable
  statement: Question for the authors - is the approach ratio computed over the whole lap including the
    reward pause at the end, or over the traversal? Neither reading gives the reported 1.3 and 1.22 (5.2
    and 4.4 whole lap, 2.2 and 1.75 traversal); the whole-lap reading gives the reported 70% engaged laps.
- kind: methods_unavailable
  statement: Question for the authors - what defines a reward cell (ref. 24) - what counts as firing in
    the 40 cm reward zone and within 2 s (or 1.5 s, Supplementary Fig. 14a) of reward delivery?
- kind: methods_unavailable
  statement: Question for the authors - how were stable and remapped fields told apart in Figure 2e, and
    which mice and laps form Figures 2 and 3?
- kind: other
  statement: In 4 of the 10 extinction mice (NR6, NR14, NR23, CFC16) a reward is delivered at the end
    of the first lap of the Unrewarded condition as the description's frame counts delimit it, so either
    the boundary is one lap early or the reward was switched off one lap after imaging of UR began.
- kind: selection_undocumented
  statement: The paper's code keeps only part of some sessions (task_framestokeep in AnimalDetails/AnimalDetailsWT.py;
    for NR6 only the first 11100 of 20000 R frames) and changes some lick stops by hand (change_lick_stop);
    the paper does not mention either, and the dandiset holds the full sessions.
