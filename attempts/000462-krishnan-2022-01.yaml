  notebook: reproduce_krishnan_2022.ipynb
  output: claim:disengaged-laps-uniform
  notes: Main engagement split. Under L1 the fraction of disengaged laps is 0.383 in the first and 0.541
    in the second half of RE low (10 mice; Shapiro-Wilk p = 0.086, paired t p = 0.094, Wilcoxon p = 0.094),
    and the positions of the 125 disengaged laps do not differ from uniform (KS D = 0.053, p = 0.853).
    L2 and L3 give p from 0.078 to 0.975. Both tests give p >= 0.05 under every reading, as the criterion
    asks for a claim of absence, though the second half has 0.16 to 0.17 more disengaged laps under L1
    and L2. The code's ratio (variant) gives 0.284 and 0.324 (paired t p = 0.639, KS p = 0.541).
  deviations:
  - The dandiset holds 10 of the 12 extinction mice (5 of the 6 with RR and a novel session).
  - Engaged laps are defined by the Methods approach ratio taken over the traversal of the track, from
    the lap start to the first frame at the track end, which leaves out the 1.5 s pause after the reward
    (Methods, Engagement with VR, 'instantaneous velocity was calculated at each point along the 2 m track');
    laps whose ratio is undefined are neither engaged nor disengaged. The Methods do not say where the
    lap ends, so this is an assumption. It gives 46% engaged RE low laps under L1 and 2 of the 5 R-UR-RR
    mice with more than 12 engaged laps (paper 70%, 3 of 6); the code's ratio over the traversal, a variant,
    gives 67% and 4 mice. The whole-lap reading of the first version took in the pause and counted laps
    with an undefined ratio as disengaged; it is shown as a variant only.
  - The reward zone, which sets the lick stop and so the RE high and RE low laps, starts at the mean
    position of the first lick before the reward in each R lap, ignoring licks before 20 cm, which
    follow the teleport (Methods, Licking behavior, 'the average track position at which the animal
    started pre-licking in R'). The 20 cm is an assumption. Counting the first lick whenever it
    falls moves the zone by 0.3 to 3.9 cm and changes no lick stop under L1, L2 or L3 (printed in
    lick-persistence-ur).
  assumed: true
