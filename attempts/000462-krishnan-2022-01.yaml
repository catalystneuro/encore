- claim: lick-persistence-ur
  outcome: not_reproduced
  notebook: reproduce_krishnan_2022.ipynb
  output: claim:lick-persistence-ur
  measured:
  - 6.6
  - 4
  notes: RE high laps per mouse average 6.60 +/- 2.62 under L1, 7.60 under L2 and 8.60 under L3, outside
    5 +/- 1 under every reading; per mouse 2 to 12 laps (L1). Counting the rewarded first UR lap of NR6
    and NR14 as R gives 6.40 to 8.40. Random licking after the lick stop, read as a reward-zone lick in
    an RE low lap (reading a), is found in 4 of 10 mice, the paper's count, under every lick stop reading;
    reading (b), any lick on the track, gives 7, and reading (c) 9. The criterion needs both the mean
    and the count, and the mean fails. The index of the first UR lap with no zone lick, a reading the
    criterion does not list, averages 4.80 +/- 1.99, within 5 +/- 1; it is shown, not judged, and asked
    of a reader. The reward zone (first lick before the reward) starts at 184.5 to 196.9 cm in 8 mice,
    167.7 cm in NR14 and 129.0 cm in CFC17. With the code's reward zone (0 cm in every mouse, as licks
    after the teleport fill the first bin) the means are 6.8, 7.8 and 8.8.
  deviations:
  - The dandiset holds 10 of the 12 extinction mice (5 of the 6 with RR and a novel session).
  - The reward zone starts at the mean position of the first lick before the reward in each R lap, ignoring
    licks before 20 cm, which follow the teleport and belong to the previous reward (Methods, Licking
    behavior, says 'the average track position at which the animal started pre-licking in R'). The 20
    cm is an assumption. Counting the first lick whenever it falls, as the first version did, moved the
    zone by 0.3 to 3.9 cm and changed no lick stop.
  assumed: true
- claim: fig1d-decoder-drop-ur
  outcome: reproduced
  notebook: reproduce_krishnan_2022.ipynb
  output: claim:fig1d-decoder-drop-ur
  notes: With the Methods decoder (first 60% of R laps, circular track) the first 3 UR laps are within
    0.1 of the held-out R laps and RE low laps are below both in 8 of 10 mice under L1, L2 and L3. The
    criterion asks for 9 of 12 mice (75%); applied as the same fraction of the 10 mice here it needs ceil(0.75
    x 10) = 8, which holds; a literal 9 of 10 does not. The code's decoder (first 50% of R frames) gives
    6 of 10, and the decoder without the circular treatment 2 of 10.
  deviations:
  - The dandiset holds 10 of the 12 extinction mice (5 of the 6 with RR and a novel session).
  - The decoder takes each prediction at its nearest copy of the true bin before R2 and error, as the
    criterion's 'track treated as circular' (Methods, Position decoding) implies; without it R2 is far
    lower (shown).
  - dF/F, significant transients and the place field search follow ref. 75 (Dombeck et al. 2010), which
    the Methods cite without the details (Methods, Image processing and ROI selection; Defining place
    fields) - 8th percentile baseline in a 15 s window, transients from 2 to 0.5 robust SD lasting 0.5
    s or more, candidate fields above 25% of the way from baseline to peak, 100 circular-shift shuffles.
    Assumption, as the files hold raw fluorescence only and the paper does not give these values.
  - The criterion's 9 of 12 mice is applied as the same fraction, 75%, of the 10 mice in the dandiset,
    at least 8 (ceil(0.75 x 10)); a literal 9 of 10 is not reached (shown).
  - The reward zone, which sets the lick stop and so the RE high and RE low laps, starts at the mean
    position of the first lick before the reward in each R lap, ignoring licks before 20 cm, which
    follow the teleport (Methods, Licking behavior, 'the average track position at which the animal
    started pre-licking in R'). The 20 cm is an assumption. Counting the first lick whenever it
    falls moves the zone by 0.3 to 3.9 cm and changes no lick stop under L1, L2 or L3 (printed in
    lick-persistence-ur).
  assumed: true
