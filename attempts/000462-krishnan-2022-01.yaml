- claim: approach-ratio
  outcome: not_reproduced
  notebook: reproduce_krishnan_2022.ipynb
  output: claim:approach-ratio
  notes: Only R and UR could be tested; the dark sessions are not in the dandiset. The ratio of mean binned
    velocity at 100 to 150 cm over 175 to 200 cm, taken over the traversal (lap start to the first frame
    at the track end, main reading), is 2.214 +/- 0.092 in R (352 laps, 1 undefined) and 1.745 +/- 0.072
    in UR (297 laps), over mice 2.224 and 1.735, against 1.3 and 1.22. Over the whole lap, which takes
    in the 1.5 s pause at 200 cm, it is 5.17 and 4.44, with 74 R and 76 UR laps undefined (zero mean speed
    in the end bins) and ratios up to 150.7. The code's ratio (velocity normalised to its peak) over the
    traversal gives 1.259 and 1.199, the closest but outside the tolerance of 0.02. On a synthetic lap
    with a true ratio of 1.600 the helper returns 1.601 over the traversal and 1.895 over the whole lap.
    In every reading R is above UR. No measured value is given for the dark.
  deviations:
  - The dandiset holds 10 of the 12 extinction mice (5 of the 6 with RR and a novel session).
  - Position is stored in volts with no scale; the top of the range, where the reward is delivered at
    the track end (Methods, Behavior and virtual reality), is read as 200 cm. Assumption. The 30 Hz clock
    agrees with the 1.5 s pause after the reward (46 to 49 frames from reward onset to teleport in every
    rewarded condition), and lap time does not depend on the scale.
  - The dark sessions of the claim are not in the dandiset.
  - Engaged laps are defined by the Methods approach ratio taken over the traversal of the track, from
    the lap start to the first frame at the track end, which leaves out the 1.5 s pause after the reward
    (Methods, Engagement with VR, 'instantaneous velocity was calculated at each point along the 2 m track');
    laps whose ratio is undefined are neither engaged nor disengaged. The Methods do not say where the
    lap ends, so this is an assumption. It gives 46% engaged RE low laps under L1 and 2 of the 5 R-UR-RR
    mice with more than 12 engaged laps (paper 70%, 3 of 6); the code's ratio over the traversal, a variant,
    gives 67% and 4 mice. The whole-lap reading of the first version took in the pause and counted laps
    with an undefined ratio as disengaged; it is shown as a variant only.
  assumed: true
