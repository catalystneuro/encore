- claim: fig1e-cohort-size
  outcome: partially_reproduced
  notebook: reproduce_souza_2026.ipynb
  output: claim:fig1e-cohort-size
  measured:
  - 10822
  - 34959
  - 7378
  - 3444
  - 68.2
  - 11108
  - 286
  notes: Split-half positive 46,263 of 54,045 units (85.6%; 438 with r_split undefined). Family A significant
    24,492, Family B 13,640, both 11,108, of which 286 discordant, leaving 10,822 (20.0% of tested), 7,378
    suppressed (68.2%) and 3,444 enhanced (31.8%). Testable in both contrasts 34,959 under reading (a)
    (cohort 31.0% of it), 37,892 under (b), 45,785 under (c). All counts are within tolerance under reading
    (a) except the 286 discordant units (239, tolerance 24); per the criterion this is partially reproduced.
    43,025 units are at the minimum p of 1/101; the BH threshold per area is 0.0396. The seed sensitivity
    of the null was not computed under the four further seeds (it needs the spike times again). With 1,000
    permutations on 300 units of three sessions, 229 units have p at most 0.05 against 225 with 100 (224
    under both). Reading (1b) of the null, over the whole recording, run on 12 of the 104 sessions (6,553
    units, BH per area over them); cohort 1,268 against 1,272 under (1a), 1,266 in both (6 only under 1a,
    2 only under 1b), 74 and 63 units split-half positive under only one reading, 19 discordant under each,
    suppressed 66.6% against 66.5%, so the outcome is the same under both readings.
  deviations:
  - The analysis uses the 104 sessions of the Sst-Cre and Vip-Cre mice and their units of quality good
    with presence ratio at least 0.95 in the six areas, the selection that fits the paper's counts (claim
    data-sessions-units); the paper does not say how its sessions and units were chosen, and its 103rd
    session could not be identified.
  - The ISI-shuffle null uses 100 permutations per unit, not the paper's 1,000 (M&M 2.3), as 1,000 for
    54,045 units is about nine CPU hours, over the notebook limit; on 300 units of three sessions, 225
    units have p at most 0.05 with 100 permutations and 229 with 1,000 (Spearman of the p values 0.913).
    The null rebuilds the train over the active block from its first spike (reading 1a of the criterion);
    the whole-recording reading (1b) takes over an hour for all sessions and was run on 12 of the 104.
  - Responsiveness uses the Wilcoxon signed-rank test with the normal approximation and tie correction
    for every trial count (scipy uses an exact test for 50 trials or fewer without ties or zeros).
  - Miss pseudo-reward time is the change plus the session median latency (reading 3, M&M 2.4). The trial's
    image change is the start of its change presentation in the block 0 stimulus table.
  - The session median latency for the pseudo-reward times uses the change presentation's start time (claim
    latency-change-to-reward).
  assumed: true
- claim: fig1d-split-half-above-null
  outcome: reproduced
  notebook: reproduce_souza_2026.ipynb
  output: claim:fig1d-split-half-above-null
  notes: Per area the cohort's median r_split is 0.853 (VISrl) to 0.902 (VISp) against a pooled null median
    of 0.074 to 0.092 and a 95th percentile of 0.380 to 0.409 (null maximum 0.770 to 0.849); every cohort
    unit's r_split exceeds the median of its own null in every area (minimum r_split 0.255). Both readings
    hold. The pooled null has 100 values per unit. Reading (b) holds by construction, since a cohort unit
    passed the gate at p_split at most 0.0396, so at most 3 of its 100 null values reach its r_split; reading
    (a) carries the claim.
  deviations:
  - Sessions and units as claim data-sessions-units finds them (an assumption).
  - The paper gives no measure of well above; both readings in the criterion are run and agree.
  - The ISI-shuffle null uses 100 permutations per unit, not the paper's 1,000 (M&M 2.3), as 1,000 for
    54,045 units is about nine CPU hours, over the notebook limit; on 300 units of three sessions, 225
    units have p at most 0.05 with 100 permutations and 229 with 1,000 (Spearman of the p values 0.913).
    The null rebuilds the train over the active block from its first spike (reading 1a of the criterion);
    the whole-recording reading (1b) takes over an hour for all sessions and was run on 12 of the 104.
