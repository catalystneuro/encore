findings:
- kind: methods_unavailable
  about: paper
  statement: Question for the paper's authors. Which 103 sessions and which units were analysed? The dandiset
    version holds 153 sessions from 81 mice. The 104 sessions of the Sst-Cre and Vip-Cre mice, with units
    of quality good and presence ratio at least 0.95 in the six areas, give 104 sessions, 54 mice and
    54,045 units, close to the paper's 103, 54 and 54,039; was this the selection, and which session was
    left out? Every outcome of this attempt rests on the assumption.
- kind: methods_unavailable
  about: paper
  statement: Question for the paper's authors. How were the peak time of an archetype (Figure 3A) and
    the sign of a unit's pre against post-reward ramp (Figure 3D) defined? Peaks as the maximum absolute
    value of the signed archetype fit the paper's six roles; peaks as the signed maximum do not. Mean
    responses over -0.5 to 0 against 0 to 1.5 s match the anticipatory fractions; 0 to 0.5 s and the archetype
    weights do not.
- kind: methods_unavailable
  about: paper
  statement: Question for the paper's authors. How was a lick bout defined (Discussion, paragraph 7),
    and did the ISI-shuffle null rebuild the spike train over the active block or the whole recording?
    Bouts split at 500 ms gaps give the paper's 415 bouts per session (438 here); 250 ms gives 737. The
    null was run over the active block only.
- kind: paper_inconsistency
  about: paper
  statement: The paper's counts do not add up in two places. The Figure 1H legend classifies 2,308 narrow
    and 8,716 broad cohort units, 11,024, more than the 10,805 cohort units left after the 227 ambiguous
    ones (Materials and methods 2.5). The unmatched layer-4 excess in the rate-matching control is +0.148,
    against +0.116 for the same comparison in the preceding sentence (Results 3.2); here both are about
    +0.12.
- kind: selection_undocumented
  about: paper
  statement: The paper states that it analysed 103 sessions from 54 mice but not how they were chosen
    from the dandiset's 153 sessions from 81 mice, nor which units entered (54,039 of 110,563 units in
    the six areas). The counts fit the Sst-Cre and Vip-Cre mice and units with quality good and presence
    ratio at least 0.95.
- kind: metadata_insufficient
  about: data
  severity: minor
  statement: 1,508 of the 54,045 analysed units (quality good, presence ratio at least 0.95, in the six
    visual areas) have a CCF coordinate (electrodes table x, y or z) of 0 or below, a value that falls
    outside the brain; the files do not say that 0 marks a missing registration, while these units still
    carry an area label in the location column.
- kind: other
  about: data
  severity: minor
  statement: The units table's waveform_duration and the trough-to-peak duration measured on the stored
    mean waveform of the peak channel agree only at r = 0.66 (median difference -0.004 ms). The stored
    mean waveforms are sampled at 30 kHz (82 samples), so their durations take 60 distinct values and
    a two-component mixture on them does not separate narrow from broad units, while the stored waveform_duration
    (151 values) does; the files do not say how waveform_duration was computed. Upsampled to 200 points,
    the measured durations agree with the stored ones within 0.02 ms for 97.5% of units, but 1,263 units
    differ by more than 0.1 ms (median 1.421 against 0.371 ms).
- kind: other
  about: data
  severity: none
  statement: Checks that passed. In all 104 sessions analysed, block 0 is the active natural-image block
    and block 5 its passive replay with the same image sequence and no licks or rewards; water follows
    the nearest lick by 1.3 to 53.5 ms (median 9.78 ms), so rewards and licks share a clock; and the summed
    spiking of each session's units rises after the image changes of the stimulus table (post to pre ratio
    1.19 to 4.12, against 0.52 to 1.29 with the times shifted 0.25 s), so spikes and stimuli share a clock.
- kind: methods_unavailable
  about: paper
  statement: Question for the paper's authors. Were cortical layers assigned only where the CCF structure
    at the unit's coordinates is a visual area? Assigning a layer in any laminar CCF structure, as Materials
    and methods 2.5 reads, gives 97.2% of tested units and 97.4% in VISrl; keeping only visual-area structures
    gives 87.0%, 84.3% of the cohort, 96.5% in VISam and 45.5% in VISrl, close to the paper's 87.5%, 84.9%,
    96.6% and 48.0%.
