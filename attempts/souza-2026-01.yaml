  outcome: partially_reproduced
  notebook: reproduce_souza_2026.ipynb
  output: claim:data-sessions-units
  measured:
  - 104
  - 54
  - 54045
  notes: Readings (a) and (b) of the criterion give 153 sessions from 81 mice, with 110,563 units in the
    six areas, or 45,354 with the Allen default thresholds; neither is within 10%. The 104 sessions of
    the 54 Sst-Cre and Vip-Cre mice, with units of quality good and presence ratio at least 0.95, give
    104 sessions, 54 mice and 54,045 units (differences of 1, 0 and 6), within 10% but not exact; the
    other selections tried (quality good alone 66,388, Allen thresholds 30,705, all units 76,151 in those
    sessions) are further off. The files give no reason to leave out one of the 104 sessions. The selection
    is used by every other claim. Open for the paper's authors, asked as a methods_unavailable finding.
  deviations:
  - The selection that fits (Sst-Cre and Vip-Cre mice, quality good, presence ratio at least 0.95) is
    not one of the criterion's two readings; it was found by comparing the counts of several selections
    with the paper's, and is adopted as an assumption.
  assumed: true
- claim: blocks-no-reward-in-replay
  outcome: reproduced
  notebook: reproduce_souza_2026.ipynb
  output: claim:blocks-no-reward-in-replay
  notes: In all 104 sessions block 0 is the natural-image block with every presentation active and block
    5 the same image sequence with none active; every trial lies within 1 s of block 0's bounds, every
    reward is in block 0, and no lick or reward time falls in block 5. The other blocks are spontaneous
    (1, 3), gabor (2) and flash (4) in every session.
  deviations:
  - Sessions and units as claim data-sessions-units finds them (an assumption).
  assumed: true
