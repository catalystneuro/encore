- claim: fig1e-cohort-size
  outcome: partially_reproduced
  notebook: reproduce_souza_2026.ipynb
  output: claim:fig1e-cohort-size
  measured:
  - 10822
  - 34959
  - 7378
  - 3444
  - 68.2
  - 11108
  - 286
  notes: Split-half positive 46,263 of 54,045 units (85.6%; 438 with r_split undefined). Family A significant
    24,492, Family B 13,640, both 11,108, of which 286 discordant, leaving 10,822 (20.0% of tested), 7,378
    suppressed (68.2%) and 3,444 enhanced (31.8%). Testable in both contrasts 34,959 under reading (a)
    (cohort 31.0% of it), 37,892 under (b), 45,785 under (c). All counts are within tolerance under reading
    (a) except the 286 discordant units (239, tolerance 24); per the criterion this is partially reproduced.
    43,025 units are at the minimum p of 1/101; the BH threshold per area is 0.0396. The seed sensitivity
    of the null was not computed under the four further seeds (it needs the spike times again); the 100
    against 1,000 permutation check on 100 units changes 4 of 80 calls.
  deviations:
  - The analysis uses the 104 sessions of the Sst-Cre and Vip-Cre mice and their units of quality good
    with presence ratio at least 0.95 in the six areas, the selection that fits the paper's counts (claim
    data-sessions-units); the paper does not say how its sessions and units were chosen, and its 103rd
    session could not be identified.
  - The ISI-shuffle null uses 100 permutations per unit, not the paper's 1,000 (M&M 2.3), as 1,000 for
    54,045 units is about nine CPU hours, over the notebook limit; on 100 units of session 0, 76 units
    have p at most 0.05 with 100 permutations and 80 with 1,000 (Spearman of the p values 0.932). The
    null rebuilds the train over the active block from its first spike (reading 1a of the criterion);
    the whole-recording reading (1b) was not run.
  - Responsiveness uses the Wilcoxon signed-rank test with the normal approximation and tie correction
    for every trial count (scipy uses an exact test for 50 trials or fewer without ties or zeros).
  - Miss pseudo-reward time is the change plus the session median latency (reading 3, M&M 2.4). The trial's
    image change is the start of its change presentation in the block 0 stimulus table.
  - The session median latency for the pseudo-reward times uses the change presentation's start time (claim
    latency-change-to-reward).
  assumed: true
