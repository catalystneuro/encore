- claim: fig1c-learning
  outcome: reproduced
  notebook: reproduce_gu_2026.ipynb
  output: claim:fig1c-learning
  notes: Per day, the fraction of adjacent-trial transitions that are transitions of the rat's rewarded cycle (sessions
    with at least 20 trials) rises from 0.268, 0.338, 0.312, 0.416 and 0.408 on the first day to 0.511, 0.629, 0.598,
    0.581 and 0.537 on the peak day for rats M, E, J, K and L, all above 0.25. The Spearman correlations with day
    are 1.00, 0.97, 0.72, 0.67 and 0.77, all positive (p = 0.071 and 0.072 for K and L; the criterion asks only
    for a positive sign). The peak day is every rat's last day in the dandiset. The dandiset holds 5, 9, 12, 8 and
    6 days, against about 6, 9, 11, 8 and 6 in Figure 1C. The rats almost never repeat an arm (52 of 14708 transitions),
    so chance without repeats is 1/3, not the 25% of the paper and the criterion; the first day is above 1/3 in
    3 rats (E, K, L) and the peak day in all 5.
  deviations:
  - The rat's cycle is read from the reward log (claims file, opening comment); a reward is followed by a reward
    at the cycle's next arm in 96 to 100% of cases, and trials are rewarded exactly when the final arm is the cycle's
    next arm after the last reward in 99.96% of the 14627 trials where that arm is defined.
  - Trials are built from the digital poke and pump events of the raw files (Methods, Behavioral analysis), a trial
    running from a home reward to the next outer poke. Against the Statescript logs of rats E, J, K and L the rewarded
    trials and the trials differ by at most one per session. Rat M's logs hold no counts to compare.
