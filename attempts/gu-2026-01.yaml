findings:
- kind: data_missing
  statement: The decoder output behind Figures 4, 5 and S3 to S11 (the posterior per 2 ms bin over whole sessions,
    the continuous and fragmented state probabilities, the detected remote and local extended events) is not deposited,
    nor are the spike marks or MUA times. The triggered tables hold only the MAP position in windows around COM
    times and outer pokes. The rest would have to be recomputed from the raw voltage, 12.5 TB of raw files.
- kind: metadata_insufficient
  statement: 'None of the 2415 Spyglass analysis files (`obj-*.nwb`) says what it holds; the file names carry only
    an object id, and their tables have empty descriptions. By content they are head position, velocity and orientation
    (750), linearized position at about 23 Hz and at 500 Hz (446), and decodes triggered on events (1219). The triggered
    tables could be read only with the paper''s code and by aligning their trigger times with COM times and outer
    pokes: 720 are triggered at COM times, 353 at outer pokes, and 146 at times that match neither. The parameters
    that made each (trigger, window, restriction to the arm, MAP or mean, which decoder) are in the lab''s database,
    not the files; the whole-track tables come in pairs with different decodes, and which decoder made each can
    be told only from which member agrees with the arm-restricted tables, not named. The track graph of the linearization
    is not deposited.'
- kind: data_missing
  statement: The dandiset holds fewer trials than the paper reports for three rats. Built from the poke and pump
    events, it holds 2083, 3519, 4578, 2959 and 1816 trials for rats M, E, J, K and L, against 2370, 3554, 4628,
    3779 and 2087 in the Figure 1E inset (0.88, 0.99, 0.99, 0.78 and 0.87 of them). Rat M has 5 days against the
    6 the paper says were collected; rat J has 12 days against about 11 in Figure 1C. Rat M's 5 days of about 400
    trials would account for its shortfall; rats K and L have the days of Figure 1C, and no epoch is tagged other
    than Session or Sleep, so where their trials are missing is not known.
- kind: other
  statement: Rat M's 500 Hz linearizations are each deposited twice, in 26 pairs of files with identical values,
    one pair per run epoch. They are counted once.
- kind: metadata_error
  statement: Rat M's Statescript logs are named "syayescript Seq2Session1" and so on, a misspelling of "statescript",
    and hold no trial or reward counts, unlike the other rats' logs. Rat M's days also have 4 LFP files for 5 days.
- kind: paper_inconsistency
  statement: The reward log gives the cycle 3-4-2-1-3 for rats M, E and J and 1-2-4-3-1 for rats K and L. This fits
    the Results (1-2-4-3-1 in 2 rats, 3-4-2-1-3 in 3) and the Figure 1B legend (rat E, 3-4-2-1-3), while Figure
    S1E labels Seq2 (1-2-4-3-1) for M, E and J. The files name the epochs of K and L "Rev2" and those of M, E and
    J "Seq2".
- kind: metadata_error
  statement: The head orientation series (`scratch/CompassDirection/head_orientation`) gives its unit as meters.
- kind: metadata_insufficient
  statement: The electrode table of the LFP files has no locations, so the CA1 tetrodes and the corpus callosum
    reference used for ripple detection (Methods, SWR detection) cannot be identified; the reference named by `ref_elect_id`
    is in the LFP file on some days only (never for rat K).
- kind: metadata_error
  statement: The LFP series (`scratch/filtered data`) gives its unit as volts with a conversion of 1.0, while the
    data are int16 values with a standard deviation of about 240.
- kind: methods_unavailable
  statement: For Figure 3D, which decoder (run_time or all_maze) made the whole-track tables the paper used, and
    which made the arm-restricted tables? The deposited whole-track tables come in pairs with different decodes; one
    member of each pair (A) agrees with every arm-restricted table. Under A the claim is at the edge of its partial
    bar (3 or 4 rats at p < 0.05 depending on the random draw of arm ranges), under the other decoder it holds in
    full (4 rats at p < 0.0001). Which tables around COM time entered Figure 3 (146 tables have rows mostly not at
    this attempt''s COM times) is also not said.
- kind: methods_unavailable
  statement: For Figure S7B, which tetrodes and which reference channel entered SWR detection, and over what period
    was the session baseline taken? This attempt used every tetrode of the LFP file, the `ref_elect_id` channel
    where present or none, and 20 sampled windows per run epoch; ripples came out rare (0.13 to 0.34 per second
    of immobility).
