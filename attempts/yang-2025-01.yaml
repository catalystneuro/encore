  output: claim:fig5b-iis-post-seizure
  notes: 'With spikes within 0.5 s of a stimulation train dropped and that time left out of the rate (7
    of 249 seizures lose time in the window), the IIS rate over 15 to 45 s after the seizure end is 0.171
    per s after target and 0.261 per s after non-target stimulation across 1 s bins; under reading (b)
