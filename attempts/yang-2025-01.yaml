- claim: fig6e-ictal-ripples-no-difference
  outcome: reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:fig6e-ictal-ripples-no-difference
  notes: Under pairing (a), by rat, in the main reading (guarded windows, threshold over the clip, all
    channels) the paired t-test finds no difference between target and non-target (3.31 against 12.84,
    p = 0.17), nor in any of the 6 readings with all channels (p = 0.17 to 0.96) or any pooled variant
    (p = 0.07 to 0.81). With the stimulated channel and the threshold taken outside the trains, 2 of the
    12 readings give p < 0.05 (0.037 and 0.039, target lower), so the absence rests on the channel reading.
    The normalized ripple rates are large and positive in every condition (baseline 12.1), unlike the
    -0.16 and -0.04 of Figure 6E; 71 to 266 seizures with no ripple in the pre window are dropped. With
    7 rat pairs and no manual review, this is weak evidence for the absence.
  deviations:
  - HFOs are counted by the HFO App's short line length detector at the defaults of its detector dialog,
    as the claims file says for fig6cd (window 5 ms, 97.5th percentile threshold over the epoch, here
