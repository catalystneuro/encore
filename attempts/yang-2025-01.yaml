  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:fig3a-target-reduces-each-rat
  notes: Three of the 8 target groups have a mean normalized duration below their preceding
    baseline (R3 CA3 -0.043, R6 CA3 -0.257, R7 ANT -0.256, relative change); R1 DG +0.011, R2 DG
    +0.178, R2 CA1 +0.092, R4 CA3 +0.058 and R5 ANT +0.116 are above. The sign is the same under all
