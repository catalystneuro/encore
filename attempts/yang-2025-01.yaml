    rests on R7, whose non-target rate (1.12 per s) is far above every other rat''s: without R7 the time-bin
    test gives 0.139 against 0.152, p = 0.16 (5 s bins p = 0.47), while reading (a) gives p = 0.0019.
    Target is lower in R1, R2, R6 and R7 and higher in R3, R4 and R5. The bins of one curve are not independent
    samples, so reading (b) overstates the evidence. With the device end, reading (a) gives 0.142 against
    0.211 (p = 0.0010).'
