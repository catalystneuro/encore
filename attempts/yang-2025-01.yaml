- claim: fig6e-ictal-ripples-no-difference
  outcome: reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:fig6e-ictal-ripples-no-difference
  notes: Under pairing (a), by rat, the paired t-test finds no difference between target and
    non-target (97.5th percentile threshold, all channels, 5.72 against 7.46, p = 0.73; the other
