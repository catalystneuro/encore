- claim: fig3a-per-rat-site-differences
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:fig3a-per-rat-site-differences
  notes: At most 5 of the 11 pairs of Figure 3A are significant (relative change or difference,
    unadjusted Dunn), which meets the criterion's partial outcome; with Bonferroni adjustment 2 or
    3. Under the readings that find 5, R1 and R6 have 4 to 6 significant pairs, where the paper
    shows none; only the z-score with adjustment leaves R1 and R6 without pairs, and it finds 2 of
