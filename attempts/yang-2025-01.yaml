- claim: fig4b-psd-target-bands
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:fig4b-psd-target-bands
  notes: Of the 96 readings (change measure, Welch segment, total range, channels, post hoc
    adjustment, and the two band readings), none has alpha and gamma both holding; alpha holds
    under none, gamma under 22, beta under 6, theta under none. In the main reading (1 s segments,
    0.5-120 Hz, all channels, relative change) the alpha ratio rises after target stimulation
    (median 0.52) more than after non-target (0.19, Dunn p = 0.008) but not more than after sham
    (0.58, p = 0.50), and the gamma ratio falls after target (-0.20) as after sham (-0.19, p = 1.0)
    and more than after non-target (-0.10, p = 0.006).
  deviations:
  - Seizure onset from the line-length rule (assumption), and stimulation times from the
    artefact, as the dandiset holds neither.
  - The post-stimulation window "5s after the first stimulation train" (Methods D) is read as the
    5 s from the end of the first train (assumption; it is the pause before the next detection,
    free of artefact).
