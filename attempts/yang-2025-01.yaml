findings:
- kind: data_missing
  statement: The dandiset holds only 600 s ictal clips. It has no seizure onset or end times, no
    stimulation times, no interictal recordings and no recording durations, although the paper
    analyses 30 min interictal segments (IIS, HFO) and seizures per hour of recording. Five claims
    cannot be tested, and every seizure-based measure needs an onset and end rule the paper does not
    give.
- kind: metadata_error
  statement: Baseline groups hold stimulated seizures. Eleven baseline clips carry stimulation
    artefact; in R1 base2 (2023-8-29 ictal1, 8-30 ictal1), R4 base0 (9-6 ictal1 to 3), R5 base0
    (10-25 ictal1) and R6 base1 (9-17 ictal1) they are 4.25 to 6 s trains with 5 s pauses, like
    those of the stimulation groups. Two clips of R7's CA3 stimulation group carry no train.
- kind: metadata_error
  statement: Sixteen clip names (date and seizure number) occur in two groups of the same rat with
    different contents, for example R1_2023_9_20-ictal1 to 3 in both R1 base3 and R1 DG-stim, and
    R3_2023_10_18-ictal1 and 10_20-ictal1 and 2 in both R3 DG-stim and CA1-stim. Some groups' clip
    dates fall outside their place in the order; R3's CA1-stim group (07) is dated 18 to 20
    October, before its base3 group (06, from 22 October), and R5's base0 runs from 8 September to
    25 October.
- kind: other
  statement: The stimulation order of R5 and R6 in the dandiset (R5 CA1, ANT, DG, CA3; R6 ANT, DG,
    CA1, CA3) differs from the order in the paper's Figure S2 (R5 ANT, DG, CA1, CA3; R6 CA1, ANT,
    DG, CA3). The other five rats agree.
- kind: selection_undocumented
  statement: How the 600 s clips were chosen, and whether each group holds every seizure recorded,
    is not documented. Two groups hold fewer than the 6 seizures Methods C states (R1 base2 5, R7
    CA3-stim 4). Twenty clips are named -small and two -large, with no explanation.
- kind: metadata_error
  statement: The electrodes table gives the ANT depth as DV -5.6 mm, where the paper gives -6.0
    mm. Every session gives the subject's age as P2M and weight as 300-350 g, though a rat's
    sessions span up to four months.
- kind: methods_unavailable
  statement: Questions for the paper's authors. (1) How were seizure onset and end marked offline
    for seizure duration, the GC window and the PSD, IIS and HFO windows? This attempt used a line
    length rule; the detected onset precedes the first train by a median 6.5 s. (2) Is cf_w out-
    minus in-strength (Figure 2, Discussion) or in- minus out-strength (Methods B)? Only the former
    recovers the Figure S2 targets here (20 of 28 groups against 0 or 1). (3) What VAR model order
    and test for "significantly high" cf_w were used? (4) How was seizure duration normalized
    (relative change, difference, z-score), and was the unit the seizure or the group? (5) Which
    post hoc test follows the Kruskal-Wallis tests of Figures 3A and 4B, and what are the PSD change
    measure, Welch segment and total range? (6) Is the post-stimulation window the 5 s after the
    first train ends? (7) What settings of the HFO App's short line length detector were used? (8)
    What does the pairing of the Figure 6 paired t-tests pair, given independent groups?
