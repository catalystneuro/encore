- claim: tables1-network-stable-short-term
  outcome: reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:tables1-network-stable-short-term
  measured:
  - 0.553
  - 0.173
  - 0.309
  - -0.025
  - 0.656
  - 0.388
  - 0.297
  - 0.208
  - 0.634
  - 0.324
  - 0.758
  - 0.588
  - 0.613
  - 0.514
  notes: Under reading (d) of the criterion (self-pairs included in the intra-group set), each
    pair once and BIC model order, intra-group r exceeds inter-group r with Mann-Whitney p < 0.05
    in all 7 rats (R4 p = 0.003, the others p < 0.001) and 11 of the 14 means lie within the Table
    S1 SDs (R4 intra 0.297 against 0.81, R4 inter 0.208 against 0.79 and R5 inter 0.324 against
    0.71 do not). The measured values are this reading's intra and inter means, R1 to R7. With
    self-pairs excluded (reading c), 5 of 7 rats hold (R4 0.154 against 0.208, p = 0.24; R7 0.534
    against 0.514, p = 0.15) and 10 of 14 means are within tolerance; with each pair counted twice
    and self-pairs excluded, 6 of 7. Including self-pairs adds values of 1 to the intra-group set,
    which favours the claim; the claims file names it as a reading the paper allows. The cf_w sign
    does not change Pearson r. Without the clips named -small the result per rat is unchanged.
  deviations:
  - Seizure onset is marked by a line-length rule (yang2025.detect_seizure), as the dandiset
    holds no onset times and the paper gives no rule for marking them; an assumption on which this
    outcome rests.
  - Conditional GC is computed by a numpy reimplementation of the MVGC time-domain estimator (OLS
    VAR fits, log ratio of residual variances), with the model order chosen per window by BIC up
    to 20 (AIC as a variant); the paper used the MATLAB toolbox and states no order.
  - The readings of the criterion (pairs once or twice, self-pairs excluded or included) were all
    run; the claim holds under self-pairs included only.
- claim: fig2-r1-target-shifts
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:fig2-r1-target-shifts
  notes: With cf_w as out-strength minus in-strength and AIC order, R1's top nodes in baseline
    groups 0 to 3 are CA1, ANT, CA3 and DG, 3 of the 4 named (ANT, ANT, CA3, DG). With BIC order
    they are CA1, ANT, ANT, DG (2 of 4), and with cf_w as in minus out none match. The mean
    within-group r of the cf_w vectors is 0.26, 0.36, 0.29 and 0.66. R1's groups hold 9, 10, 5 and
    11 seizures (Figure 2A 9, 9, 7, 9).
  deviations:
  - Seizure onset marked by the line-length rule (assumption), and GC as in
    tables1-network-stable-short-term.
  - The sign of cf_w is not settled by Methods B, which says in-degree minus out-degree while
    Figure 2 and the Discussion describe causal outflow; both were run and only out minus in
    matches.
- claim: figs2-target-assignment
  outcome: partially_reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:figs2-target-assignment
  measured:
  - 9
  - 19
  notes: Under reading (a) (the node with the largest mean cf_w), cf_w as out minus in and AIC order,
    20 of the 28 baseline groups give the Figure S2 target (BIC order 16); the misses are R1 base0,
    R2 base0, all four R5 groups (CA3 or CA1 computed where Figure S2 has ANT) and two R6 groups.
    With the dataset's group order, the computed targets give 9 target and 19 non-target
    stimulation groups, 21 of the 28 labels agreeing with Figure S2. Reading (b) (significance
    test) matches 6 groups, and cf_w as in minus out matches 0 or 1, so the data support cf_w as
    causal outflow. The dataset's stimulation order differs from Figure S2 in R5 and R6 (see
    findings), so the baseline group before a site is not always the one Figure S2 pairs it with.
  deviations:
  - Seizure onset marked by the line-length rule (assumption), GC as in
    tables1-network-stable-short-term.
  - The test behind "significantly high" cf_w is not given (Methods B, C); both readings of the
    claims file were run.
- claim: fig3a-target-reduces-each-rat
