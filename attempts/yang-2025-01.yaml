    groups 0 to 3 are CA1, ANT, CA3 and DG, 3 of the 4 named (ANT, ANT, CA3, DG). With BIC order they
    are CA1, ANT, ANT, DG (2 of 4), and with cf_w as in minus out none match. The outcome rests on AIC
    order. The mean within-group r of the cf_w vectors is 0.26, 0.36, 0.29 and 0.66. R1's groups hold
    9, 10, 5 and 11 seizures (Figure 2A 9, 9, 7, 9).
  deviations:
  - Seizure onset and end are marked by a line-length rule (yang2025.detect_seizure), as the dandiset
    holds no seizure times and the paper gives no rule; an assumption on which this outcome rests. After
