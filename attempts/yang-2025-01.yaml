- claim: tables1-network-stable-short-term
  outcome: reproduced
  assumed: true
  notebook: reproduce_yang_2025.ipynb
  output: claim:tables1-network-stable-short-term
  measured:
  - 0.553
  - 0.173
  - 0.309
  - -0.025
  - 0.656
  - 0.388
  - 0.297
  - 0.208
  - 0.634
  - 0.324
  - 0.758
  - 0.588
  - 0.613
  - 0.514
  notes: Under reading (d) of the criterion (self-pairs included in the intra-group set), each pair once
    and BIC model order, intra-group r exceeds inter-group r with Mann-Whitney p < 0.05 in all 7 rats
    (R4 p = 0.003, the others p < 0.001) and 11 of the 14 means lie within the Table S1 SDs (R4 intra
    0.297 against 0.81, R4 inter 0.208 against 0.79 and R5 inter 0.324 against 0.71 do not). The same
    holds with AIC order capped at 20 or 30. The measured values are this reading's intra and inter means,
    R1 to R7. With self-pairs excluded (reading c), 5 of 7 rats hold under every order criterion (R4 0.154
    against 0.208, p = 0.24; R7 0.534 against 0.514, p = 0.15) and 10 of 14 means are within tolerance;
    with each pair counted twice and self-pairs excluded, 6 of 7. So the outcome rests on counting the
    self-pairs (r = 1) as intra-group pairs, which adds values of 1 to the intra-group set and favours
    the claim; the claims file names it as a reading the paper allows. The cf_w sign does not change Pearson
    r. Without the clips named -small the result per rat is unchanged.
  deviations:
  - Seizure onset and end are marked by a line-length rule (yang2025.detect_seizure), as the dandiset
    holds no seizure times and the paper gives no rule; an assumption on which this outcome rests. After
    verification round 1 the notebook checks it further (first-train times, ends against the last train,
    example clips) and shows a device-end variant.
  - Conditional GC is computed by a numpy reimplementation of the MVGC time-domain estimator (OLS VAR
    fits, log ratio of residual variances), with the model order chosen per window by BIC up to 20, and
    by AIC up to 20 and up to 30 as variants (AIC reaches 20 in 422 of 2403 windows and 30 in 53); the
    paper used the MATLAB toolbox and states no order.
  - The readings of the criterion (pairs once or twice, self-pairs excluded or included) were all run;
    the claim holds with self-pairs included only, an assumption on which the outcome rests.
