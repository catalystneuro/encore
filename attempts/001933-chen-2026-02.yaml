inputs:
- what: The paper's source data file (Source data.xlsx, md5 c26fe3de8f340a3db5fa29a40e5a8c10). In source-data-link, the
    triggered traces, evoked integrals and spontaneous transient values of Figure 6 and Supplementary Figures 7 and 8,
    as reference values. For the claims of Figures 1, 2, 4 and 5, the per-section, per-area and per-blot values the
    tests run on.
  source: Zenodo, doi:10.5281/zenodo.19930567
- what: The paper's Supplementary data (Supplementary files.zip, md5 98f11f6ea1fdd13e56807ff1f639c9a4), for the volcano
    table of Figure 2B and to check that the PRIDE peptide table equals Supplementary data 1; and the proteomics R code
    (analysis code.zip), read, not run.
  source: Zenodo, doi:10.5281/zenodo.19930567
- what: The peptide groups table of the synaptosome phosphoproteomics
    (020623-Loukia-mouse-synaptosome-phos-quant_phosphopeptides.xlsx, md5 1ceefa5fc576c1991f07f7d637f83fae).
  source: PRIDE PXD065006
- what: The RAB3A and p-RAB3A pulldown intensities (FilteredDataset.pg_matrix.Brain_Rab3A.csv, md5
    cd060787ee1d324f77d151ef0c1e54f1), the DIA-NN report (report.pg_matrix.tsv, md5 454a9e2c72ed558533d74caae09b4579),
    the SDRF (md5 ef4a075a02271a9417f0539348639750) and the deposited limma table
    (Brain_Rab3A.DifferentialAbundance_volcano.csv, md5 ee6cd6c85e025bbc28d0c0d22beb7f45).
  source: PRIDE PXD065125
- what: The 168 synaptosome images of Figure 4D and 4E (1.07 GB, streamed and measured), and the file lists of the
    image studies of Figures 1 and 5 (S-BIAD2070, S-BIAD2071, S-BIAD2072), matched to the source data by file name.
  source: BioImage Archive S-BIAD2074, doi:10.6019/S-BIAD2074; S-BIAD2070, S-BIAD2071 and S-BIAD2072
    (doi:10.6019/S-BIAD2070 to doi:10.6019/S-BIAD2072)
- what: The paper's analysis code (preprocess_and_binning.m, triggered_analysis.m, group_tables.m, plot_results.m and
    the snippets), read to fix the measures and the windows; not run. The Zenodo release 10.5281/zenodo.20244434 is
    commit 1b551d1, which differs from the commit read only by a licence file.
  source: https://github.com/DombeckLab/lrrk2_photometry_analysis at commit d34558fdde4b6665bd631c8fe47b8a1ef18f6a73
outcomes:
- claim: source-data-link
  outcome: not_reproduced
  notebook: reproduce_chen_2026.ipynb
  output: claim:source-data-link
  notes: All 27 mice of the source data are in the dandiset with the same genotype and line. The Anxa1 half links.
    120 of 120 traces of Figure 6C and 479 of 480 of Supplementary Figure 7B equal the dandiset's dF/F from 1 s before
    onset (largest difference among matched traces 5.7e-13 in each), the evoked integrals equal the code's measure times 0.0001 for all Anxa1
    records but one, and the transient counts match for 15 of 15 mice. The one miss in each is the last 4 mW
    stimulation of mouse 4398, whose processed series ends 0.8 s after onset. The Calb1 half does not link; 0 of 384
    traces, 0 of 384 integrals and the transient counts of 1 of 12 mice match. dF/F recomputed from the raw signal
    with the code's processing reproduces the stored Calb1 series (largest difference 1.47 % dF/F) but not the
    published traces (median differences 66 to 519 % dF/F; 22 to 88 at the best background fraction per mouse). The
    published spontaneous values are 0.005 times the mean dF/F over each transient (ratio 0.004994 to 0.004999), so
    part (4) as fixed, with integrals, matches for no mouse; with the transient mean it matches for 13 of 27 mice
    within 1% (Anxa1 13 of 15; 4398 and 4007 each fail by one sorted value, 1.03% and 1.67%), and for none within the
    1e-4 of part (3); integrals match for none at either tolerance. The four parts match for 1.0, 0.609, 0.609 and 0
    of their records (0.481 with the transient mean), so the outcome is not reproduced under either measure. The
    Calb1 mismatch is not one of epoch or power labels; searched over all 64 epochs and 8 powers of each mouse, no
    epoch is within 1e-6 of any of the 384 S8D traces (closest 15.7 to 150.8 % dF/F), and against the matched epochs
    the per-mouse median slopes are 0.21 to 0.75 and offsets -13.8 to 16.2 % dF/F. The Figure 6E integrals match the 0.5 mW epochs (120 of 120)
    and none of the 4 mW ones. The published values reproduce the paper's statistics (Figure 6E p = 1.1e-20, Cohen's d
    2.06 and 0.765), so the Calb1 differences come from the data, not from the paper's computation on them.
  deviations:
  - The criterion fixed the integral of each spontaneous transient; the published values turned out to be the mean
    dF/F over the transient. The mean is shown as a variant and does not change the outcome.
- claim: fig6e-anxa1-evoked-reduced
  outcome: reproduced
  notebook: reproduce_chen_2026.ipynb
  output: claim:fig6e-anxa1-evoked-reduced
  measured:
  - 64
  - 56
  notes: Light-on integrals at 0.5 mW, GS 48.8 against WT 128.0 % dF/F x s, one-tailed p = 1.16e-22 (paper 1.10e-20),
    Cohen's d 2.21. The code's window gives p = 1.1e-20, the paper's value. It holds at 4 mW (p = 4.08e-18), without the
    two GS mice given 0.33 s trains (p = 4.16e-17), and with mouse means (Welch p = 0.000434). The window
    chunking_index.m computes as written reverses the sign (p = 1).
  deviations:
  - The integral is over each train's light-on period, as the Methods state; the paper's values come from the code's
    window, -0.1 to 1.0 s, shown as a variant. The baseline, which the Methods do not give, is the code's.
  - The paper's plotting code selects power code 'h' for this panel; the panel is tested at the 0.5 mW of the legend,
    which the source data confirm, and 4 mW is shown as a variant.
- claim: fig6e-anxa1-evoked-per-mouse
  outcome: reproduced
  notebook: reproduce_chen_2026.ipynb
  output: claim:fig6e-anxa1-evoked-per-mouse
  measured: 7
  notes: Under all four readings (Welch or Student, one- or two-tailed) 7 of 8 GS mice are below the WT group at
    p < 0.05/8 and 3743 is the exception (mean 125 against 128, Welch one-tailed p = 0.362). The count is the same with
    the code's window. Two of the seven, 3742 and 4885, received the paper's powers as 0.33 s trains, unlike every WT
    mouse, and their responses do not follow the labelled power; the other five significant mice were stimulated as
    the WT mice were.
  deviations:
  - The Methods name Welch's test, the legend's p-values are one-tailed and the code runs a two-tailed Student test;
    all four readings are shown and all give 7.
