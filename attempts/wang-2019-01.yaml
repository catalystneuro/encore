- claim: fig2a-rabbit-monotonic
  outcome: partially_reproduced
  notebook: reproduce_wang_2019.ipynb
  output: claim:fig2a-rabbit-monotonic
  notes: 4 rabbit hearts, 10 time points (0 to 60 s). At 60 s all three differ from time 0 in the stated
    direction by paired t-test (HR +65.75 bpm, p = 0.0004; APD80 -31.3 ms, p = 0.021; CaTD80 -33.75 ms,
    p = 0.0028); after the repeated measures ANOVA with Holm-Sidak comparisons HR and CaTD80 hold (p =
    0.0015 and 0.025) and APD80 does not (p = 0.18); with the ANOVA's pooled error (SigmaPlot's
    Holm-Sidak) all three hold at 60 s (APD80 p = 6e-5). APD80 is monotonic under both readings. Heart rate
    is not monotonic under either; its mean peaks at 20 s (206.5 bpm) and falls to 194.75 at 60 s, and
    the 50 to 60 s fall is significant (paired t-test p = 0.047). CaTD80 is monotonic under reading (b)
    but not (a); its mean is lowest at 25 s (159.75 ms) and rises to 165.65 at 60 s. No combination of
    readings makes all three monotonic and significant at 60 s, so the criterion is not met. The
    criterion has no rule for a partial result; by the protocol's definition (holds only in part) the
    outcome is partial, because the increase in heart rate and the shortening of APD and CaTD from
    time 0 hold under every significance reading and APD80 is monotonic. The verifier would give
    not_reproduced; the disagreement is recorded under verifications.
  deviations:
  - The comparisons against time 0 after a repeated measures ANOVA are not named in the paper; Holm-Sidak
    adjusted paired t-tests were used (a standard choice, after SigmaPlot's default comparison against a
    control), and as a variant Holm-Sidak comparisons on the ANOVA's pooled residual mean square, as
    SigmaPlot computes them. Neither corrects for sphericity. The outcome does not depend on the
    choice, as heart rate fails monotonicity under both readings.
- claim: fig2d-mouse-biphasic-apd
  outcome: reproduced
  notebook: reproduce_wang_2019.ipynb
  output: claim:fig2d-mouse-biphasic-apd
  measured:
  - 50.52
  - 61.18
  - 49.54
  notes: 5 mouse hearts. APD80 50.52 +- 4.52 ms at 0 s, 61.18 +- 3.24 at 15 s, 49.54 +- 4.94 at 60 s, all
    within tolerance. The mean peaks at 15 s, as does every heart. 15 s against 0 s +10.66 ms (paired
