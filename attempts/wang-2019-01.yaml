- claim: fig2a-rabbit-monotonic
  outcome: partially_reproduced
  notebook: reproduce_wang_2019.ipynb
  output: claim:fig2a-rabbit-monotonic
  notes: 4 rabbit hearts, 10 time points (0 to 60 s). At 60 s all three differ from time 0 in the stated
    direction by paired t-test (HR +65.75 bpm, p = 0.0004; APD80 -31.3 ms, p = 0.021; CaTD80 -33.75 ms,
    p = 0.0028); after the repeated measures ANOVA with Holm-Sidak comparisons HR and CaTD80 hold (p =
    0.0015 and 0.025) and APD80 does not (p = 0.18). APD80 is monotonic under both readings. Heart rate
    is not monotonic under either; its mean peaks at 20 s (206.5 bpm) and falls to 194.75 at 60 s, and
    the 50 to 60 s fall is significant (paired t-test p = 0.047). CaTD80 is monotonic under reading (b)
    but not (a); its mean is lowest at 25 s (159.75 ms) and rises to 165.65 at 60 s. No combination of
    readings makes all three monotonic and significant at 60 s, so the criterion is not met; the
    increase in heart rate and the shortening of APD and CaTD from time 0 hold, so the outcome is
    partial.
  deviations:
  - The comparisons against time 0 after a repeated measures ANOVA are not named in the paper; Holm-Sidak
    adjusted paired t-tests were used (a standard choice, SigmaPlot's default comparison against a
    control). The outcome does not depend on it, as heart rate fails monotonicity under both readings.
- claim: fig2d-mouse-biphasic-apd
  outcome: reproduced
  notebook: reproduce_wang_2019.ipynb
  output: claim:fig2d-mouse-biphasic-apd
  measured:
  - 50.52
  - 61.18
  - 49.54
  notes: 5 mouse hearts. APD80 50.52 +- 4.52 ms at 0 s, 61.18 +- 3.24 at 15 s, 49.54 +- 4.94 at 60 s, all
    within tolerance. The mean peaks at 15 s, as does every heart. 15 s against 0 s +10.66 ms (paired
    t-test p = 0.0002; repeated measures ANOVA p = 2.3e-16, Holm-Sidak p = 0.0018); 60 s against 0 s
    -0.98 ms (p = 0.47; Holm-Sidak p = 0.72). Heart rate rises and CaTD80 falls at every step of the
    mean, with no significant step against. The deposited 60 s SD (4.94 ms) is about half the
    Abstract's 9.1.
- claim: fig2cf-cat-amplitude-similar
  outcome: reproduced
  notebook: reproduce_wang_2019.ipynb
  output: claim:fig2cf-cat-amplitude-similar
  notes: 6 hearts per species. Relative amplitude above 1 by paired t-test against time 0 in the rabbit at
    every time from 5 s (1.122 at 20 s, p = 0.0006) and in the mouse from 10 to 30 s (1.107 at 20 s, p =
    0.0027; 1.067 at 60 s, p = 0.080). Similarity under reading (b) holds at every time point (unpaired
    t-tests, p = 0.16 to 0.56). Under reading (a) it fails at 5, 10 and 15 s, where the rabbit mean
    exceeds the mouse mean by more than the smaller SD (at 15 s 1.098 against 1.072, mouse SD 0.018),
    and holds from 20 s on. The rabbit mean peaks at 30 s (1.123), the mouse mean at 20 s (1.107).
- claim: fig3abc-tyramine-na-mimic-sns
  outcome: partially_reproduced
  notebook: reproduce_wang_2019.ipynb
  output: claim:fig3abc-tyramine-na-mimic-sns
  notes: 4 hearts each (one noradrenaline heart has no value at 12.33 s). Tyramine meets the pattern under
    both monotonic readings; HR and CaTD80 move in the stated direction at every step of the mean,
    APD80 is above time 0 at 6.75 s (+8.38 ms, p = 0.017), peaks at 17.75 s and is +2.13 ms at 59.5 s
    (p = 0.085). Noradrenaline gives the APD response (+9.53 ms at 6.25 s, p = 0.010; peak at 12.33 s;
    -3.20 ms at 59.75 s, p = 0.046) and CaTD80 falls at every step, but heart rate falls from 29.75 to
    59.75 s in all 4 hearts (mean -26.75 bpm), so it is not monotonic under reading (a); under reading
    (b) the fall is not significant and the pattern holds. The criterion's "both agents" is met under
    reading (b) and only tyramine under reading (a); the outcome is partial because the
    noradrenaline heart rate response is not sustained to 60 s as with SNS.
  deviations:
  - The time points are those of the table (mean times across hearts, 6.25 to 59.75 s), not round
    times.
- claim: fig3d-propranolol-abolishes
  outcome: not_reproduced
  notebook: reproduce_wang_2019.ipynb
  output: claim:fig3d-propranolol-abolishes
  notes: 3 hearts. A claim of absence judged by the claims file's rule (any time point, either test).
    By unadjusted paired t-tests APD80 differs from time 0 at 10 s (+1.43 ms, p = 0.010); no other time
    point of any variable reaches p < 0.05. The repeated measures ANOVA is significant for heart rate
    (p = 0.031) and not for APD80 (p = 0.11) or CaTD80 (p = 0.28), and after it no Holm-Sidak comparison
    against time 0 reaches p < 0.05 (smallest 0.088). The largest mean changes are +16.7 bpm heart rate
    (+6.2%), +3.5 ms APD80 (+9.4%) and -0.73 ms CaTD80, against +87.4 bpm, +10.7 ms and -7.2 ms with SNS
    alone (Figure 2D table). The one significant result is one of 27 unadjusted tests on 3 hearts, and
    the responses are much smaller than without propranolol.
- claim: fig3e-rate-step-biphasic
  outcome: reproduced
  notebook: reproduce_wang_2019.ipynb
  output: claim:fig3e-rate-step-biphasic
  notes: 3 hearts. Without SNS the mean APD80 rises from 56.74 to 66.02 ms at 10 s and falls to 53.83 at
    35 s; with SNS it rises to 71.57 ms at 10 s and falls to 57.27 at 35 s. Both are biphasic. The peak
    rise is larger with SNS (+14.83 against +9.28 ms) in the mean and in each heart (reading a). Under
    reading (b) SNS exceeds no SNS at 10 s by 5.55 ms, paired t-test p = 0.13, which does not hold.
  deviations:
  - The table ends at 35 s; the claims file's "by 60 s" is read as the end of the record.
- claim: fig3f-constant-pacing-sns-prolongs
  outcome: reproduced
  assumed: true
  notebook: reproduce_wang_2019.ipynb
  output: claim:fig3f-constant-pacing-sns-prolongs
  notes: The no-SNS series has 4 hearts, the SNS series 5. Paired by column position (4 pairs), APD80
    with SNS exceeds APD80 without SNS at every time point (0.5 to 3.9 ms) and at p < 0.05 at 0, 5, 10,
    15 and 20 s (smallest p = 0.0023, at 15 s), so reading (a) holds. Reading (b) fails; with SNS APD80
    is never above its own time 0. APD80 shortens over 60 s in both conditions (-11.55 ms without SNS,
    -13.78 ms with), and the SNS mean never rises above time 0, so no biphasic response. Unpaired
    (Welch) tests find no time point at p < 0.05 (smallest p = 0.068). The SNS series is already 2.7 ms
    longer at time 0 (paired p = 0.036).
  deviations:
  - The pairing of the no-SNS and SNS columns as the same hearts in the same order is assumed; the
    table does not identify hearts and one no-SNS column is empty. The outcome rests on it, as the
    unpaired variant finds no difference.
