- claim: fig3d-propranolol-abolishes
  outcome: not_reproduced
  notebook: reproduce_wang_2019.ipynb
  output: claim:fig3d-propranolol-abolishes
  notes: 3 hearts. A claim of absence judged by the claims file's rule (any time point, either test).
    By unadjusted paired t-tests (reading i) APD80 differs from time 0 at 10 s (+1.43 ms, p = 0.010;
    per heart +1.2, +1.4 and +1.7 ms); no other time point of any variable reaches p < 0.05. The outcome
    rests on this test. It is one of 27 tests on 3 hearts (chance of at least one p < 0.05 with no
    effect 0.75 if independent). The repeated measures ANOVA is significant for heart rate (p = 0.031)
    and not for APD80 (p = 0.11) or CaTD80 (p = 0.28); with the Greenhouse-Geisser correction none is
    (heart rate p = 0.23). After the ANOVA no Holm-Sidak adjusted paired t-test against time 0 reaches
    p < 0.05 (smallest 0.088). Holm-Sidak comparisons on the ANOVA's pooled error, a variant, follow only
    the significant heart rate ANOVA; they find heart rate above time 0 at 30 to 60 s (smallest
    p = 0.0048, at 60 s), on the uncorrected ANOVA, with heart rate rising from time 0 to 60 s in 2 of
    the 3 hearts (+32 and +20 bpm; the third -2 bpm). The largest mean changes are +16.7 bpm heart rate
    (+6.2%), +3.5 ms APD80 (+9.4%) and -0.73 ms CaTD80, against +87.4 bpm, +10.7 ms and -7.2 ms with SNS
    alone (Figure 2D table). The responses are much smaller than without propranolol.
- claim: fig3e-rate-step-biphasic
  outcome: reproduced
  notebook: reproduce_wang_2019.ipynb
  output: claim:fig3e-rate-step-biphasic
  notes: 3 hearts. Without SNS the mean APD80 rises from 56.74 to 66.02 ms at 10 s and falls to 53.83 at
    35 s; with SNS it rises to 71.57 ms at 10 s and falls to 57.27 at 35 s. Both are biphasic. The peak
    rise is larger with SNS (+14.83 against +9.28 ms) in the mean and in each heart (reading a). Under
    reading (b) SNS exceeds no SNS at 10 s by 5.55 ms, paired t-test p = 0.13, which does not hold. The
    no-SNS value at 5 s equals that at 0 s in all 3 hearts, and both conditions share the time-0
    value; neither bears on the peak at 10 s or the end of the record.
  deviations:
  - The table ends at 35 s; the claims file's "by 60 s" is read as the end of the record.
- claim: fig3f-constant-pacing-sns-prolongs
  outcome: reproduced
  assumed: true
  notebook: reproduce_wang_2019.ipynb
  output: claim:fig3f-constant-pacing-sns-prolongs
  notes: The no-SNS series has 4 hearts, the SNS series 5. Paired by column position (4 pairs), APD80
    with SNS exceeds APD80 without SNS at every time point (0.5 to 3.9 ms) and at p < 0.05 at 0, 5, 10,
    15 and 20 s (smallest p = 0.0023, at 15 s), so reading (a) holds. Reading (b) fails; with SNS APD80
    is never above its own time 0. APD80 shortens over 60 s in both conditions (-11.55 ms without SNS,
    -13.78 ms with), and the SNS mean never rises above time 0, so no biphasic response. Unpaired
    (Welch) tests find no time point at p < 0.05 (smallest p = 0.068). The SNS series is already 2.7 ms
    longer at time 0 (paired p = 0.036), in each of the 4 pairs (1.65 to 4.84 ms), and on the change
    from time 0 SNS and no SNS do not differ at any time (paired p 0.18 to 0.94). Reading (a) compares
    the series at the same times, as the claims file writes it, so the gap at time 0 counts towards it.
    The pairing by column position is the 4th closest of the 120 ways of assigning the 4 no-SNS columns
    to the 5 SNS columns (sum of squared differences 400.9 against a smallest 380.3).
  deviations:
  - The pairing of the no-SNS and SNS columns as the same hearts in the same order is assumed; the
    table does not identify hearts and one no-SNS column is empty. The outcome rests on it, as the
    unpaired variant finds no difference. It is the better supported choice; the empty no-SNS column
    keeps its place beside the SNS columns, which suggests the blocks are laid out by heart, and the
    position pairing is among the closest of the possible assignments.
