- claim: fig8e-rabbit-sim-apd-shortening-cat
  outcome: blocked
  blocked_by: not_runnable
  notes: The rabbit model of Bartos et al. (2017) is MATLAB code (solver ode15s); it is in the dataset
    itself (files/code/rabbit, with instructions for Figure 8) as well as on the Bers lab page. MATLAB
    cannot be installed in the entry's locked Python environment, and porting the model (about 100 kB
    of ODE code over six files) to Python is a new implementation, not the paper's method. GNU Octave
    is not on the machine that runs the notebook (the notebook checks the PATH for matlab and octave
    and finds neither). It can be installed without root from conda-forge, but the entry's
    environment is a Python virtual environment built from a pip lock file (tools/entry.py), which
    cannot hold it, so the simulations cannot run as part of the entry. A trial outside the notebook,
    not part of the entry and not deciding the outcome, found that the mouse model starts under Octave
    after a one-line change to its ode15s call and runs far slower than real time, so its 70 s
    simulations would likely not fit the notebook's time limit. The notebook prints the code files and
    the instructions, which cover the Figure 8 AP-clamp (APD fixed, mouse-like or rabbit-like) and
    current-clamp simulations. The claims file marks the claim as data elsewhere; that the code is
    in the dataset is asked of a reader in questions/wang-2019.yaml.
