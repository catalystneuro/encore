- claim: fig1bc-rabbit-ap-cat-response
  outcome: reproduced
  assumed: true
  notebook: reproduce_wang_2019.ipynb
  output: claim:fig1bc-rabbit-ap-cat-response
  notes: Tested on the first 20 s of the 60 s SNS series (Fig2 sheet; APD80 and CaTD80 4 hearts, CaT
    amplitude 6 hearts). Under every window reading APD80 and CaTD80 are below time 0 in 4 of 4 hearts
    and the relative amplitude above 1 in 6 of 6, so the majority reading holds. By paired t-test APD80
    at 20 s is -24.6 ms, p = 0.13 (mean of 5 to 20 s, -16.7 ms, p = 0.14), CaTD80 at 20 s -39.5 ms,
    p = 0.020, and amplitude at 20 s 1.122, p = 0.0006; the paired t-test reading holds for CaTD80 and
    amplitude, not APD80.
  deviations:
  - The dataset holds no APD80, CaTD80 or CaT amplitude for the 20 s SNS hearts of Figure 1. The claim
    is tested on the first 20 s of the 60 s SNS series of Figure 2, assuming that the first 20 s of a 60
    s stimulation stands for a 20 s stimulation (Methods, Sympathetic nerve stimulation, give one
    protocol of 5 to 15 Hz for up to 60 s). The Figure 2 hearts are not those of Figure 1 (their
    baseline heart rates differ).
  - Window readings as the claims file gives them, at 20 s, the mean of 5 to 20 s, and the most
    extreme value from 5 to 20 s; the series is sampled at 0, 5, 10, 15 and 20 s.
