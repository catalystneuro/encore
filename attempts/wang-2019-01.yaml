  outcome: reproduced
  notebook: reproduce_wang_2019.ipynb
  output: claim:fig1a-rabbit-hr-increase
  notes: Fig1 sheet, 5 rabbit hearts. Heart rate 140.2 +- 11.9 bpm at baseline and 237.2 +- 28.2 with
