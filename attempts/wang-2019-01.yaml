findings:
- kind: data_missing
  statement: The dataset holds no optical maps, traces or ECG. Its derivative workbook gives per-heart
    summary values for Figure 1 (heart rate only), Figure 2, Figure 3B to 3F and Figures 5F and 7F. The
    data behind Figure 1 APD, CaTD and CaT amplitude, the paced experiments of Figures 4 and 6, and all
    activation, repolarization, APD and CaTD maps (Figures 4 to 7) are absent, so 8 of the paper's
    claims cannot be tested.
- kind: metadata_error
  statement: dataset_description.xlsx gives 0 subjects and 0 samples, subject.csv and sample.csv are
    empty, and the curator's note calls the dataset a computational modelling dataset, although the
    workbook holds measurements from mouse and rabbit hearts (the Methods report 13 mice and 9
    rabbits).
- kind: identifier_missing
  statement: No table identifies a heart or animal, so hearts cannot be followed across figures or
    conditions. In the Figure 3F table the no-SNS and SNS columns can be paired only by position, and the
    second no-SNS column is empty.
- kind: other
  about: data
  statement: The Figure 3F table has 4 hearts in its no-SNS series where the legend gives n = 5, and one
    noradrenaline heart (Figure 3C) has no values at 12.33 s.
- kind: other
  about: data
  statement: The deposited mouse APD80 at 60 s of SNS is 49.54 +- 4.94 ms (n = 5), where the Abstract
    reports 46.5 +- 9.1 ms; the values at 0 s (50.52 +- 4.52) and 15 s (61.18 +- 3.24) are close to the
    Abstract's 50.9 +- 5.1 and 60.6 +- 4.1. The deposited values are not exactly those the paper
    summarises.
- kind: other
  about: data
  statement: In the Figure 3E table every heart's no-SNS APD80 at 5 s equals its value at 0 s (56.9,
    56.02 and 57.3 ms), consistent with the 0 s value being carried over in place of a measurement.
- kind: metadata_insufficient
  statement: The tyramine and noradrenaline tables (Figure 3B and 3C) label time "SNS Time (sec)" though
    these hearts were not stimulated, and each has an unlabelled column B (0, 3.5, 3.403, 4.435, 9.469
    for tyramine) consistent with the spread of the time points across hearts but not described. The
    Figure 1 heart rates have no unit and no statement of which part of the 20 s SNS they are.
- kind: methods_unavailable
  statement: Question for the authors. The paper uses "Repeated measures ANOVA or paired t-tests" but
    does not say which test gives each "*p<0.05 vs. time 0" or which comparison follows the ANOVA. This
    attempt runs both, with Holm-Sidak comparisons after the ANOVA (a standard choice). For the
    propranolol claim (Figure 3D) the two disagree; an unadjusted paired t-test finds APD80 at 10 s
    above time 0 (p = 0.010), and the adjusted comparisons find nothing. The claims file's rule (either
    test) makes the claim not reproduced. Which test and comparison were used?
- kind: methods_unavailable
  statement: Question for the authors. Are the columns of the Figure 3F no-SNS and SNS tables the same
    hearts in the same order, and why is the second no-SNS column empty? The test of SNS against no SNS
    is significant when paired by position (p = 0.0023 at 15 s) and not when unpaired.
