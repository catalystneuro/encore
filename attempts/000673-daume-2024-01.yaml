- claim: category-cell-counts
  outcome: partially_reproduced
  notebook: reproduce_daume_2024.ipynb
  output: claim:category-cell-counts
  measured:
  - 94
  - 181
  - 40
  - 18
  - 13
  notes: Category neurons 94 of 360 in the hippocampus (26.11%), 181 of 496 in the amygdala
    (36.49%), 40 of 206 in the vmPFC (19.42%), 18 of 204 in the pre-SMA and 13 of 188 in the dACC,
    all within 10% of the paper's 89, 181, 37, 18 and 14. Against 500 label shuffles the hippocampus,
    amygdala and vmPFC exceed the 99th percentile (p = 0.002 each) and the dACC does not (p = 0.088),
    but the pre-SMA's 18 also exceeds its 99th percentile of 17 (p = 0.010), where the paper reports
    no excess. With a post hoc threshold of two-sided p < 0.05 the counts are 87, 174, 41, 18 and 14.
  deviations:
  - The shuffle permutes the category labels of all presentations of a session together, one
    shuffle for all its units; the Methods say only that labels were shuffled across presentations.
    The permutation null of each test is drawn once per unit and reused for the shuffled labellings
    (the permutation distribution depends only on the values and group sizes).
- claim: fig3b-persistent-activity
  outcome: partially_reproduced
  notebook: reproduce_daume_2024.ipynb
  output: claim:fig3b-persistent-activity
  notes: 275 MTL category neurons (paper 270). Maintenance rates exceed baseline in preferred and
    non-preferred trials under both readings of O6 (p = 0.0001 each). Preferred exceeds non-preferred
    in % of baseline (32.0 against 20.5%, t = 2.26, p = 0.0013; paper t269 = 2.93, p = 0.001) but not
    in Hz (2.81 against 2.76 Hz, t = 1.74, p = 0.072). The criterion asks for all three tests under
    both readings, so the claim holds in part. In 24 of 34 patients the preferred rate is higher.
  deviations:
  - Rates are compared in Hz and in % of each neuron's baseline (O6); the paper does not say which
    its tests use.
- claim: edf4b-persistent-activity-by-area
  outcome: partially_reproduced
  notebook: reproduce_daume_2024.ipynb
  output: claim:edf4b-persistent-activity-by-area
  notes: In % of baseline the hippocampus (94 neurons) and amygdala (181) pass all three tests
    (baseline tests p <= 0.0001; preferred against non-preferred p = 0.019 and 0.039; paper 0.025
    and 0.037) and the vmPFC (40) passes none (p = 0.064, 0.24, 0.12). In Hz the vmPFC again passes
    none, but preferred against non-preferred fails in the hippocampus (p = 0.24) and amygdala (p =
    0.18). The criterion, through fig3b, asks for both readings, so the claim holds in part.
  deviations:
  - As fig3b-persistent-activity (O6 readings).
- claim: fig3c-category-load
  outcome: not_reproduced
  assumed: true
  notebook: reproduce_daume_2024.ipynb
  output: claim:fig3c-category-load
  notes: In % of baseline, the reading adopted, preferred trials do not differ between loads (35.29
    against 30.85%, t = 0.47, p = 0.77; paper t269 = 2.65, p = 0.004) and non-preferred trials do
    not either (p = 0.26). In Hz the claim holds (preferred 2.90 against 2.78 Hz, t = 2.20, p =
    0.022; non-preferred p = 0.20). The question of the units is for the paper's authors (finding
    on O6).
  deviations:
  - Assumed that the tests use the percentage change from baseline. The readings give different
