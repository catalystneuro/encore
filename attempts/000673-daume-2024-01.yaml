- claim: edf3e-nesting
  outcome: reproduced
  assumed: true
  notebook: reproduce_daume_2024_lfp.ipynb
  output: claim:edf3e-nesting
  measured: 105
  notes: Aligning the 500 ms windows on the gamma peak in each run of the preferred theta bin, 105 of
    144 hippocampal PAC channels (72.92%) are nested under artefact reading (a), within tolerance of
    110, and PAC is lower in load 3 in them (4.29 against 3.48, t = -3.61, p = 0.0002; paper t109 =
    -4.10, p = 0.0001); under (b) 94 of 125 (75.20%), p = 0.0051. Aligning on the maximum of gamma
    amplitude, as the Methods' words read, only 9 of 144 (6.25%) are nested and the load test fails
    (p = 0.77). The count depends on the alignment and not on the window - with local maxima counted
    within 35 to 85 ms the peak alignment gives 104 to 114 nested channels (30 within 25 ms), and
    the amplitude alignment 4 to 15 for every window.
  deviations:
  - Assumed that the windows are aligned on the peak of the gamma-filtered signal. The Methods
    say "the precise timepoint at which the concurrent instantaneous gamma amplitude (70-140 Hz) was
    maximal"; aligned on amplitude maxima, gamma cycles of random phase cancel in the average, so few
    local maxima remain (most channels have 0 or 1), which cannot give the paper's 80%. Aligned on
    gamma peaks, the average keeps the gamma cycle, as the method of Vaz et al. (ref. 69) needs.
