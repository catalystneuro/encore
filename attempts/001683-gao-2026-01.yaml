findings:
- kind: metadata_error
  statement: The seizure label table (intervals/custom_intervals_table_name) of all 70 labelled
    EEG blocks gives start and stop times in minutes, while NWB prescribes seconds; the stops reach
    62.7 in blocks of 3750 s. Read as minutes the labels match the EEG (30 to 80 Hz power 2.5 to 50
    times higher inside them in all 136 block-hemispheres); read as seconds they do not. The EP and
    PLV files' interval tables are in seconds.
- kind: metadata_error
  statement: The five block files of sham rat BH635 are labelled BASELINE, SHAM, SHAM, BH636_post1
    (another rat's number) and BH635_post2, with no post3, while every other sham rat has
    BASELINE, SHAM, post1, post2, post3. The files follow each other at 63 to 68 min like the other
    rats' blocks. BH649's post 3 file has the session id None in its path.
- kind: metadata_error
  statement: Every file gives the subject as "HSD:WI rat" (Envigo's Wistar code) of age P24W, while
    the paper used Sprague-Dawley rats (Envigo) of 3 to 6 months.
- kind: metadata_error
  statement: The ElectricalSeries of the EP files is described as "EEG data" though the files hold
    the 64 intracranial channels of left S1 (location Left S1, notes "LFP signal for EP test"). The
    PLV files are labelled 1Hz but 19 of 20 carry their pulses every 2 s.
- kind: metadata_insufficient
  statement: The files do not say which EEG channels were used to label the seizures (channels 8
    and 25, read from the drawing of Fig. S1) or which channels cover S1 (given only in the notes of
    the PLV files, not in the electrode tables of the labelled blocks).
- kind: metadata_insufficient
  statement: The target-confirmation recordings do not say which transducer position was chosen
    for the experiment ("the coordinates with the clearest EP", supplement), so the tFUS EPs of
    Fig. 5B cannot be selected.
- kind: data_missing
  statement: The EEG of the pre-4-AP baseline state (Figs. S5 and S7) and of the resting baseline
    of the target confirmation (the sham of Figs. 5E-F) are not in the dandiset; the resting
    recordings hold only the intracranial LFP, and the first monitoring block after the first
    injection was not deposited. PLV EEG files exist for 20 of the 23 wild-type rats (not BH638,
    BH642, BH644), while Fig. 5 gives N = 23.
- kind: methods_unavailable
  statement: Question for the authors. Was the two-way ANOVA of Figs. 2 to 4 and 6 ordinary or
    repeated measures (or Prism's mixed-effects model), and which comparisons formed each
    Bonferroni family? The paper's within-group significance in Fig. 3 appears here only under a
    repeated-measures reading, and no single family reading gives every significance the Results
    state; this attempt assumed repeated measures for the claims of absence.
- kind: methods_unavailable
  statement: Question for the authors. For Fig. 5B, which LFP channel or channels, which
    target-confirmation recording, which sham onsets in the resting recording and what time
    resolution were tested? Under the readings tried here the result ranges from no significant
    time point to 13 of 610 points from 66.5 ms.
- kind: methods_unavailable
  statement: Question for the authors. Over which segment were band power, AI and seizure PLI
    computed (whole block or seizure periods, and for two hemispheres whose labels differ, which
    periods), what total was the band power divided by, and was AI normalized to the group's
    baseline by division or by subtraction? With a negative baseline AI the two normalizations give
    opposite directions.
- kind: paper_inconsistency
  statement: Methods E gives the wild-type tFUS window as "20 ms of stimulation" of "200 EPs from the
    target confirmation procedure", but the target-confirmation bursts last 67 ms (supplement). The
    dandiset resolves it with separate EEG recordings of 20 ms pulses made in the wild-type phase,
    labelled EEG data for PLV analysis, which the paper does not describe.
- kind: other
  statement: The baseline AI of the labelling channels is strongly negative in both groups (whole
    block, sham -0.58 to -0.61, tFUS -0.24 to -0.29), so the contralateral band power is 1.7 to 4
    times the ipsilateral; the paper reports only AI normalized to the baseline.
