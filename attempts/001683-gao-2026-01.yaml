outcomes:
- claim: fig2c-sham-duration-stable
  outcome: not_reproduced
  notebook: seizure_metrics.ipynb
  output: claim:fig2c-sham-duration-stable
  notes: The block effect on sham seizure duration is significant under every reading. Per seizure
    (1046 seizures) F = 30.45, p = 5.5e-24 ordinary and p = 2.4e-31 repeated, with 12 and 13 of 25
    Bonferroni post hoc comparisons significant; per rat p = 0.00145 ordinary (no post hoc
    comparison significant) and p = 3.9e-05 repeated (contralateral baseline against post 3,
    p = 0.012). The hemisphere effect is not significant (p = 0.16 to 0.63). Mean durations fall
    from 49.6 to 53.0 s at baseline to 34.8 to 35.7 s at post 3. The readings agree, so the
    outcome rests on none of them.
  deviations:
  - The seizure labels are the dandiset's own; their times are in minutes and are multiplied by
    60 (checked against the EEG in eeg_blocks.ipynb).
  - Durations leave out the 6 seizures that start at a block's first sample (Methods C, "Seizures
    that either started before or continued after the recording were excluded").
  - BH635's five files are taken in time order (see fig2f-sham-percent-time-post3).
  - The repeated-measures reading of M3 is a linear mixed model with a random intercept per rat
    and Wald tests of the contrasts, a standard stand-in for Prism's repeated-measures and
    mixed-effects analysis.
