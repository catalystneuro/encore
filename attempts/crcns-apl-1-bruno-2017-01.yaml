- claim: fig1d-slow-oscillation
  outcome: reproduced
  notebook: reproduce_bruno_2017.ipynb
  output: claim:fig1d-slow-oscillation
  measured: 0.0486
  notes: Power-weighted peak of the grand mean spectrum 0.0486 Hz; per recording 0.0131 to 0.0789 Hz,
    30 of 30 above 0 and at or below 0.11 Hz. Variant, frequency of maximum power above 0 Hz, 0.0076 to
    0.0992 Hz, 30 of 30 at or below 0.11 Hz. The frequency grid step is 0.0076 Hz. The grand mean spectrum's
    maximum is at the lowest bin and the spectrum is nearly flat over its first bins (7.54 at 0.0076 Hz,
    7.24 at 0.053 Hz), so the decay of the rate contributes to it. A detrended check, not judged, shows
    an oscillation besides the decay. With a quadratic trend removed from the population rate after offset,
    the frequency of maximum power above 0.02 Hz is 0.034 to 0.156 Hz (median 0.064 Hz), at or below 0.11
    Hz in 27 of 30, and the power in 0.05 to 0.11 Hz exceeds that in 0.2 to 1 Hz in 30 of 30 (median ratio
    9.8).
  deviations:
  - Chronux mtspectrumpt is ported to Python (apl.mtspectrumpt) with its defaults, tapers [3 5], the time
    grid from the first to the last spike, the mean rate subtracted; it was not checked against MATLAB
    output.
