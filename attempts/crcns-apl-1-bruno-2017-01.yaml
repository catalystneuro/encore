- claim: fig8-caudolateral
  outcome: blocked
  blocked_by: metadata_insufficient
  notes: The criterion needs the orientation of the array. The paper's text, the code (ParticipationMapsSummary.m
    plots the coordinates on the diode template without labels), the data description and the files (Coordinates.mat,
    diode_template.mat, plot_maps.m) do not say which direction of x or y is rostral, caudal, medial or
    lateral. The notebook prints the counts of top-fifth neurons by quadrant of the array coordinates,
    which decide nothing without it. Shown for the verifier, not judged, the top-fifth neurons of each
    side concentrate in one quadrant of the array coordinates, the same for maximum under both divisions
    and for range under true quintiles (left x-y-, right x-y+); under true quintiles that quadrant holds
    34% to 41% of the top fifth against 19% to 20% of all neurons, and under the code's equal-width fifths
    71% (left, maximum, 15 of 21) and 54% (right, 15 of 28). The code's equal-width division leaves 1
    or 2 neurons in the top fifth of the range, so that half of the test is nearly empty as the code defines
    it.
findings:
- kind: paper_inconsistency
  statement: The paper gives 120 to 180 neurons per recorded population and 1131 neurons in all over 10
    preparations; ten preparations of at least 120 would hold at least 1200. The data set holds 75 to
    160 neurons per preparation, 1131 in all, as its description says.
- kind: metadata_insufficient
  statement: Coordinates.mat gives each neuron's x and y on a 0 to 50 scale without a unit, and neither
    the files, plot_maps.m nor the data description say which directions of the array are rostral, caudal,
    medial or lateral, so the paper's caudo-lateral quadrant cannot be located.
- kind: other
  statement: The P10 spike times are on a grid of 0.614 ms (1629.7 Hz), which agrees with the data description's
    1630 Hz sampling; the paper says 1600 Hz.
- kind: identifier_missing
  statement: The P10 files of preparation 2 are named Jun0414da0Np10.mat while its spike and coordinate
    files are Jun0414B; they can be matched only by the first seven characters, as the paper's code does.
- kind: methods_unavailable
  statement: Question for the authors. The Methods give the Gaussian width as the median ISI divided by
    12 (the extracted text; possibly the square root of 12), but the code uses the median ISI itself,
    computed as a running median over the recordings of the same bout number read so far. With median
    ISI / 12 or / sqrt(12) the recordings need 21 to 76 PCs for 80% of the variance, not the paper's 4
    to 8. Which width was used for the published figures, and was the median meant to be per recording?
- kind: methods_unavailable
  statement: Question for the authors. The Methods say the projection kept the dimensions needed for at
    least 80% of the variance; the recurrence and participation code keeps those whose cumulative variance
    is at most 80% (one fewer), while the manifold code keeps the smallest number reaching 80%. Which
    rule produced Figures 2 to 5? The linear-model period of Figure 4C is 10.45 s under the first and
    12.2 to 13.6 s under the second.
- kind: methods_unavailable
  statement: Question for the authors. For removing divergent periods within two oscillation cycles of
    the end, is the cycle the mean or the median recurrence time of the dominant peak, and is the rule
    applied to all divergent periods (Methods) or only to those that never return (code)? The counts change
    from 16 to 21 kept periods with these choices.
- kind: methods_unavailable
  statement: Question for the authors. The permutation test of the weighted Spearman correlation (Tracking
    changes in periodicity) is not described beyond 10000 permutations; the code permutes the pooled time
    and period values with 100000 permutations and tests one side. Which test gave Figure 5B?
- kind: code_mismatch
  statement: Figure 6D reports N = 173 forecast windows. The Methods' windowing (40 s fit, 10 s forecast,
    1 s steps from 33 s) gives 40 windows per response here; the code's windowing (training on 50% of
    the series, 0.2 s steps) gives 174 per response, close to 173, so the figure appears to use the code's
    windowing, not the Methods'.
- kind: code_mismatch
  statement: In What_is_Participation.m the rate changes are ordered (1,2), (1,3), (2,3) and the participation
    changes (1,2), (2,3), (1,3), so two of three pairs are mismatched in the correlation behind Figure
    7, figure supplement 1D. With matched pairs the mean R-squared is 0.239, with the code's pairing 0.205.
- kind: code_mismatch
  statement: LocalLinearDynamics.m finds the contiguous neighbourhood of a point from abs(currixs - ixPt),
    the time indices minus the point's position within the neighbourhood, so gaps among neighbours earlier
    than that position are not detected and the fitted run can extend past them. The Methods describe
    a run contiguous in time.
