- claim: ms1-uncertain-first-faster
  outcome: reproduced
  assumed: true
  notebook: reproduce_yemini_2021.ipynb
  output: claim:ms1-uncertain-first-faster
  notes: Head only. With the most uncertain neurons annotated first, the mean accuracy over worms is
    above the mean of 100 random orders at all 50 annotation counts, under both rankings and both
    alignments, and its mean over 1 to 50 annotations is higher (68.0 against 62.4% with the CELL_ID
    alignment and entropy ranking, 52.2 against 48.5% with Algorithm 5). At 50 annotations it is
    79.1 against 69.5%; at 8, 58.8 against 57.3%. The tail half cannot be tested. The statement's
    "much faster" is a gap of 4 to 10 points here.
  deviations:
