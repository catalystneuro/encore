findings:
- kind: metadata_error
  statement: Every file gives strain OH16230 (the NeuroPAL;GCaMP6s strain of the whole-brain
    recordings), a spinning disk confocal, a worm "in microfluidic chip", birth on 2021-01-05 and
    imaging on 2021-01-07. The files are the heads of the paper's ten otIs669 (OH15262) atlas
    worms imaged on a Zeiss LSM 880; the volumes of 7_YAaLR and 76_YAaDV are identical, voxel for
    voxel, to the Zenodo volumes of those otIs669 worms, and the ten identifiers match.
- kind: metadata_error
  statement: The third channel is labelled GFP-GCaMP, with GFP emission settings, but its mean is
    17,000 to 21,000 in every file, far above the fluorescence channels, and the Zenodo copies mark
    that channel as the DIC (transmitted light) channel. The worms carry no GCaMP.
- kind: data_missing
  statement: The dandiset holds only the heads. The tails of the same ten worms, used for the
    paper's tail atlas and tail accuracies, are on the paper's Zenodo record, and so is the
    whole-brain activity of Figure 6. Eight of the claims tested here need the tails in part or in
    full.
- kind: metadata_insufficient
  statement: The files carry no per-neuron colors (the Zenodo files have a color readout per
    neuron), no orientation of the worm (the Zenodo files have the viewer's rotation), and do not
    say whether the stored voxel indices are 0- or 1-based (the panneuronal channel is brightest at
    the stored voxel, which fits 0-based centres). Colors had to be recomputed from the volumes.
- kind: metadata_insufficient
  statement: 0 to 6 of the 189 to 196 stored neurons per file have an empty name, with no
    description of what they are; the paper reports 195 annotated head neurons per worm.
- kind: other
  statement: Neuron names are stored as a ragged array of single characters (ID_labels with
    ID_labels_index), so each name must be joined from its characters.
- kind: identifier_missing
  statement: The dandiset metadata name no related publication (relatedResource is empty); the
    description and the files' related_publications give the paper's title only, without a DOI.
- kind: methods_unavailable
  statement: Question for the paper's authors. Algorithm 4 of Methods S1 as written does not
    converge on these data, because the regression of the atlas means on each worm shrinks the
    atlas along its minor axes at every alternation. How was the atlas kept from shrinking, and
    after how many alternations was it stopped? This attempt kept it in the initial worm's frame
    and stopped after 20 alternations.
- kind: methods_unavailable
  statement: Question for the paper's authors. Algorithm 5 starts the alignment of a held-out worm
    at the identity, which fails on worms imaged in the other orientation (5 to 12% accuracy on the
    five dorsal-ventral heads against an atlas in a left-right worm's frame), and the CELL_ID
    rotation search fails on three of them. How were held-out worms oriented before
    identification in the cross-validation of Figure 7B-C?
- kind: paper_inconsistency
  statement: Methods S2 section 4.3 defines the color violation percentage as the share of
    neighboring pairs below the discrimination margin, but the reported 3.5% for NeuroPAL is the
    mean shortfall below the margin computed by find_optimal_colors.m. On the paper's own data.mat
    the share is 21.5% and the mean shortfall 3.47%.
- kind: methods_unavailable
  statement: Question for the paper's authors. Methods S1 section 6.4 says confidence and accuracy
    are "largely in good agreement" without a measure. Which measure of agreement was meant, and
    which left/right pairs were scored by class under footnote 1?
- kind: methods_unavailable
  statement: Question for the paper's authors, on the Zenodo activity data. When neurons within 5
    um had traces correlated at 0.95 or more, were both removed or one, and on which traces? Which
    window defines the post-stimulus period, which five worms and which peak rule underlie Figure
    S1H? The outcomes of two claims depend on the first point.
