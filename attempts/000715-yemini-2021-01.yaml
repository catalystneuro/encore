  outcome: not_reproduced
  assumed: true
  notebook: reproduce_yemini_2021.ipynb
  output: claim:ms1-position-only-accuracy
  notes: Head only. With positions alone, accuracy is 20.4 to 22.8% with Algorithm 5 and 24.3 to
