- claim: fig6d-ase-nacl-asymmetry
  outcome: reproduced
  notebook: wholebrain_zenodo.ipynb
  output: claim:fig6d-ase-nacl-asymmetry
  notes: On the Zenodo record (21 OH16230 heads, histogram-normalised traces), ASEL's mean change
