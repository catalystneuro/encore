- claim: fig6d-ase-nacl-asymmetry
  outcome: reproduced
  notebook: wholebrain_zenodo.ipynb
  output: claim:fig6d-ase-nacl-asymmetry
  notes: On the Zenodo record (21 OH16230 heads, histogram-normalised traces), ASEL's mean change
    from the 10 s before NaCl to the 10 s of NaCl is 1.01 and ASER's 0.42; the two-tailed unpaired
    t test gives t = 3.82, p = 0.00046 (21 against 21). ASER rises in 14 of 21 worms (one-sample
    p = 0.0032). With similar neurons removed (both members) p = 0.0019 (17 against 17) and ASER
    rises by 0.46; with one member removed the numbers are those without removal.
  deviations:
  - The response is the mean during the stimulus minus the mean of the identical period before it,
    as the STAR Methods define a response; the asymmetry test is applied to these changes.
