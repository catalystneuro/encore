<!doctype html>
<!-- The social card, tools/site_assets/social-card.png, is a screenshot of this page at 1200 x 630:
     NODE_PATH=$(npm root -g) node -e "require('playwright').chromium.launch().then(async b => { const p = await b.newPage({viewport: {width: 1200, height: 630}}); await p.goto('file://' + process.cwd() + '/tools/social_card.html'); await p.screenshot({path: 'tools/site_assets/social-card.png'}); await b.close(); })" -->
<html lang="en"><head><meta charset="utf-8"><title>Social card</title>
<style>
  :root { --surface: #1a1a19; --panel: #232322; --line: #3a3a37; --text: #ffffff; --text2: #c3c2b7; --muted: #898781;
          --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --blocked: #898781; --accent: #6fd0d4; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--surface); }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); box-sizing: border-box;
         padding: 72px 80px 64px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 600; color: var(--text2); }
  .mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); display: grid; place-items: center;
          color: var(--surface); font-size: 22px; font-weight: 800; }
  h1 { font-size: 68px; line-height: 1.08; font-weight: 750; letter-spacing: -0.01em; margin: 48px 0 0; max-width: 1000px; }
  .bar { display: flex; gap: 6px; height: 22px; margin-top: auto; }
  .bar span { border-radius: 6px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; margin-top: 26px; font-size: 26px;
          color: var(--text2); }
  .foot b { color: var(--text); font-weight: 600; }
</style></head><body>
  <div class="brand"><span class="mark">E</span>Encore Science</div>
  <h1>Can the findings of a paper be reproduced from its open data?</h1>
  <div class="bar" aria-hidden="true">
    <span style="flex:36;background:var(--good)"></span><span style="flex:19;background:var(--warning)"></span>
    <span style="flex:14;background:var(--critical)"></span><span style="flex:31;background:var(--blocked)"></span>
  </div>
  <div class="foot"><span>AI agents test published findings against <b>their open data</b></span><span>CatalystNeuro</span></div>
</body></html>
