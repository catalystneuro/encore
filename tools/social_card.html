<!doctype html>
<!-- The social card, tools/site_assets/social-card.png, is a screenshot of this page at 1200 x 630:
     NODE_PATH=$(npm root -g) node -e "require('playwright').chromium.launch().then(async b => { const p = await b.newPage({viewport: {width: 1200, height: 630}}); await p.goto('file://' + process.cwd() + '/tools/social_card.html'); await p.evaluate(() => document.fonts.ready); await p.screenshot({path: 'tools/site_assets/social-card.png'}); await b.close(); })"
     The mark is MARK_LOOP and MARK_TICK of tools/build_site.py, the type and colours are the site's dark theme
     (site_assets/app.css), and the bar has the outcome colours in the site's order. -->
<html lang="en"><head><meta charset="utf-8"><title>Social card</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 100 900; src: url(site_assets/fonts/inter-latin-wght-normal.woff2) format("woff2"); }
  @font-face { font-family: "Source Serif 4"; font-weight: 200 900; src: url(site_assets/fonts/source-serif-4-latin-wght-normal.woff2) format("woff2"); }
  :root { --surface: #0e1014; --text: #eef0f3; --text2: #bcc3cd; --accent: #cbb0ee;
          --good: #0ca30c; --warning: #fab219; --unresolved: #2b6cb0; --blocked: #898781; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--surface); }
  body { font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); box-sizing: border-box;
         padding: 72px 80px 64px; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 650; letter-spacing: -0.01em; }
  .mark { width: 40px; height: 40px; }
  h1 { font-family: "Source Serif 4", Georgia, serif; font-size: 84px; line-height: 1.04; font-weight: 600;
       letter-spacing: -0.022em; margin: 52px 0 0; max-width: 1000px; }
  .bar { display: flex; gap: 6px; height: 22px; margin-top: auto; }
  .bar span { border-radius: 6px; }
  .foot { display: flex; justify-content: space-between; align-items: baseline; margin-top: 26px; font-size: 26px;
          color: var(--text2); }
  .foot b { color: var(--text); font-weight: 600; }
</style></head><body>
  <div class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M20.2 5.9A11 11 0 1 0 27 16"
    fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path d="M10.4 16.2l4.4 4.4L26.6 7.2"
    fill="none" stroke="var(--accent)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Encore Science</div>
  <h1>Do the deposited data support the paper?</h1>
  <div class="bar" aria-hidden="true">
    <span style="flex:36;background:var(--good)"></span><span style="flex:13;background:var(--warning)"></span>
    <span style="flex:15;background:var(--unresolved)"></span><span style="flex:36;background:var(--blocked)"></span>
  </div>
  <div class="foot"><span>Each finding of a paper, tested on <b>the data its authors deposited</b></span><span>CatalystNeuro</span></div>
</body></html>
