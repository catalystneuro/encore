notebooks:
- path: reproduce_asari_2009.ipynb
  title: Reproducing Asari and Zador (2009) from CRCNS ac-1
  runtime_minutes: 45
- path: strf_wehr.ipynb
  title: Encoding models on Wehr's A1 recordings in CRCNS ac-1 (Figure 4)
  runtime_minutes: 22
