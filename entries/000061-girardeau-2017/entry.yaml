name: 000061-girardeau-2017
type: reproduction
title: Hippocampus and amygdala reactivation during sleep (Girardeau et al. 2017)
description: Tests the claims of Girardeau, Inema and Buzsaki (2017), written from the full text,
  the supplement and the paper's code, on dandiset 000061, which holds sorted units of the
  hippocampus and the amygdala, sleep states, ripple, air puff and reward events from four rats on
  an air puff linear track task. It tests the unit counts, habituation over days, BLA firing by
  sleep state, hippocampus-BLA and hippocampus-central nuclei reactivation (explained variance)
  with all cells, and the ripple rate before and after training. Claims on putative pyramidal cells
  and on position are blocked, as the dandiset holds neither.
