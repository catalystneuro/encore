schema_version: 1
name: 001754-knierim-2000
type: reproduction
title: Place cells during space flight on the Neurolab mission (Knierim et al. 2000)
description: Tests the findings of Knierim, McNaughton and Poe (2000) on dandiset 001754, version
  0.260728.1352, which holds sorted units, task epochs, the original rate and occupancy maps, and
  spike-time positions of three rats recorded before and during the Neurolab shuttle mission. It
  compares spatial information in flight with preflight for each rat, tests abnormal selectivity on
  flight day 4 and the stability of fields across two sessions, and records why the direction,
  EEG and three-surface claims could not be tested. The claims come from the paper's full text.
