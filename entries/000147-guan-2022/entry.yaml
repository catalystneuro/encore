schema_version: 1
name: 000147-guan-2022
type: reproduction
title: Finger representations in human posterior parietal cortex after paralysis (Guan et al. 2022)
description: Tests the findings of Guan, Aflalo et al. (2022) that dandiset 000147 can support. It
  checks online and offline finger decoding, single-unit tuning and whether the cue location can be
  decoded, builds the cross-validated finger RDMs of the ten sessions, compares them with the
  able-bodied fMRI models from the authors' repository, and tests whether the representation
  changed across sessions and runs. The calibration and control tasks, the component model RDMs
  and sorting quality metrics are not in the dandiset, so the claims that need them are blocked.
