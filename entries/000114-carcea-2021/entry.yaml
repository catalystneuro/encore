name: 000114-carcea-2021
type: reproduction
title: PVN units and maternal behaviour in co-housed virgin mice (Carcea et al. 2021)
description: Tests the findings of Carcea et al. (2021) that dandiset 000114 can support. The
  dandiset holds PVN single units and video annotations from virgin mice co-housed with a dam and
  litter, and fibre photometry from virgins watching dam retrievals. The entry tests the fraction
  of units activated during nest entry, shepherding and dam retrieval, the firing after shepherded
  against voluntary nest entries, and the rates of shepherding and dam retrieval. OT-PVN identity,
  the behavioural cohorts and the auditory cortex data are not in the dandiset.
