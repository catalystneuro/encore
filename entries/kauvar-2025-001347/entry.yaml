schema_version: 1
name: kauvar-2025-001347
type: reproduction
title: Eyepuff affect under ketamine in humans and mice (Kauvar, Richman, Liu et al. 2025)
description: Tests the findings of Kauvar, Richman, Liu et al. (2025) on dandiset 001347, which holds
  the human eyepuff behaviour, the iEEG recordings of seven participants with spectrogram products
  aggregated across them, and the mouse eyepuff behaviour, and on dandiset 001326, which holds the
  mouse Neuropixels recordings. It tests the eye-closure effects of ketamine and other drugs, the
  behavioural inclusion of iEEG participants, the NMF factors and cluster tests of the iEEG
  spectrograms, the human and mouse coding dimensions, timescales and coupling, and the mouse
  emotion-like dimension.
