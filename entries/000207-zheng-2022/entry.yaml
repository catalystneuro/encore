name: 000207-zheng-2022
type: reproduction
title: Cognitive boundaries and human medial temporal lobe neurons (Zheng et al. 2022)
description: Tests the findings of Zheng et al. (2022) that can be tested on dandiset 000207, which
  holds spike times of medial temporal lobe neurons and the behaviour of 19 patients in a task
  with video clips that contain no boundary, a soft boundary or a hard boundary. It compares
  memory for temporal order and for scenes across the three kinds of clip, looks for boundary
  cells and event cells with the paper's definitions, counts neurons that respond to clip
  onsets, and measures how far the population state moves after a boundary. Eleven of the
  paper's twenty findings cannot be tested, because the dandiset has no local field potentials,
  no neurons outside the medial temporal lobe, no labels for the paper's cell classes, and no
  way to link test trials with soft or hard boundaries to the clips they came from.
