# Papers that reuse a dataset, queued after every primary target (tools/build_reuse_targets.py, from
# catalystneuro/find_reuse's classifications; docs/paper-first.md). Each is listed for its dataset in
# papers/datasets/<key>.yaml with relation: reuses.
schema_version: 1
papers:
- key: alasfour-2024
  doi: 10.3389/fnhum.2024.1388267
  dataset: dandi:000055
  reuse_type: NOVEL_ANALYSIS
  evidence: Neurophysiological recordings were obtained from the publicly available AJILE12 dataset ( Peterson et
    al., 2022 ).
  reasoning: The Methods explicitly state that the authors obtained and analyzed recordings from the publicly available
    AJILE12 dataset and used synchronized video annotations to define behavioral classes, establishing actual data
    reuse. The DANDI Archive URL and dataset identifier provide the data provenance. This paper performs a new spectro-spatial
    decoding analysis of the existing data, and its authors do not overlap with the AJILE12 primary-paper authors.
  source: find_reuse
- key: zhong-2026
  doi: 10.7554/elife.109538
  dataset: dandi:000207
  reuse_type: NOVEL_ANALYSIS
  evidence: Thanks to advances in single-neuron recording technologies, we can now test our hypothesis using data
    collected from drug-resistant epilepsy patients [41].
  reasoning: The paper explicitly downloaded the target dataset from the DANDI Archive and analyzed single-neuron
    firing-rate recordings around movie boundaries. This is a new analysis of existing neurophysiological data rather
    than a reuse of behavioral or other modalities, and the current authors do not overlap with the Zheng et al.
    author list.
  source: find_reuse
- key: burman-2023
  doi: 10.1016/j.neuron.2023.08.005
  dataset: dandi:000458
  reuse_type: NOVEL_ANALYSIS
  evidence: From the resulting dataset, we sub-selected all neurons that were in somatosensory cortex (annotations
    "SSp-ll" & "SSp-tr") or secondary motor cortex (annotations "MOs"), depending on which of the two areas had
    been electrically stimulated.
  reasoning: The authors explicitly analyzed and re-selected neurons from a public Neuropixels dataset rather than
    merely citing the related work. They computed stimulus-evoked firing rate, synchrony, and entropy from those
    recordings, so the reused modality is neurophysiology. This is a novel analysis of the existing data by a different
    author group, with provenance identifying DANDI Archive dataset 000458.
  source: find_reuse
- key: kussovska-2025
  doi: 10.1101/2025.10.31.684900
  dataset: dandi:000469
  reuse_type: NOVEL_ANALYSIS
  evidence: We analyzed the open-access dataset released by Kyzar et al. [59].
  reasoning: The Methods explicitly state that the authors analyzed the open-access dataset released by Kyzar et
    al. and obtained the de-identified data from the DANDI Archive. They reprocessed single-neuron spike recordings
    and analyzed accompanying task behavior, including accuracy and reaction time. This is a novel scientific reanalysis
    of an external dataset, and the listed authors do not overlap with the cited Kyzar et al. dataset authors.
  source: find_reuse
- key: okuno-2025
  doi: 10.7554/elife.107990.1
  dataset: dandi:000727
  reuse_type: NOVEL_ANALYSIS
  evidence: Whole-brain calcium imaging data of D. melanogaster were acquired by Brezovec et al. [14] and downloaded
    from DANDI (https://dandiarchive.org/dandiset/000727/0.240106.0043). 4D NIfTI image data (256×128×49 voxels,
    3384 frames) were extracted from a NWB file by an in-house MATLAB script.
  reasoning: The authors explicitly downloaded dataset 000727 from DANDI and extracted and preprocessed its whole-brain
    calcium-imaging recordings. They also extracted movement-velocity data and analyzed the walking task with a
    whole-brain GLM. The author lists do not overlap with the Brezovec et al. dataset paper, indicating reuse by
    a different lab.
  source: find_reuse
