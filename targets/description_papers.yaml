# Papers that a dandiset's description names as the source of its data, but that its DANDI metadata
# (relatedResource) does not list, found by reading the descriptions. tools/build_targets.py adds
# each to the dandiset's papers, with the relation "IsDescribedBy" and `source: description`, so
# the dandisets with no paper in their metadata become targets. The note says what the description
# says. DOIs that a description names only as related work, as papers that use a resource dataset,
# or for an experimental setup are left out.
