# Pilot targets: the first dandisets to attempt, by hand, with a person
# watching (docs/design.md, "Phasing", step 1).
#
# Chosen from targets/dandisets.json to be small (under 4 GB), in NWB, with a
# published version and a peer-reviewed paper, and to differ in technique,
# species and number of files. Open-access status is from OpenAlex on
# 2026-10-13. Nothing has been attempted yet.

schema_version: 1
targets:
- dandiset: "000127"
  paper: doi:10.7554/elife.48198
  title: Area 2 of primary somatosensory cortex encodes kinematics of the whole arm
  why: Monkey extracellular recordings with reaching behavior, in 2 files. Open access (eLife).
- dandiset: "000207"
  paper: doi:10.1038/s41593-022-01020-w
  title: Neurons detect cognitive boundaries to structure episodic memories in humans
  why: Human single neurons, 19 small files. Free to read (Nature Neuroscience).
- dandiset: "000147"
  paper: doi:10.7554/elife.74478
  title: Stability of motor representations after paralysis
  why: Human intracortical brain-computer interface data, 10 files. Open access (eLife).
- dandiset: "001097"
  paper: doi:10.1038/s41586-024-07916-w
  title: Encoding of female mating dynamics by a hypothalamic line attractor
  why: Mouse calcium imaging with behavior, 107 files; tests many small files and a population-dynamics analysis. Open access (Nature).
- dandiset: "000625"
  paper: doi:10.1016/j.neuron.2020.09.013
  title: Large-Scale 3D Two-Photon Imaging of Molecularly Identified CA1 Interneuron Dynamics in Behaving Mice
  why: Two-photon imaging with behavior in 3 files; likely a subset of the paper's data, which tests the "data missing" outcome. Free to read (Neuron).
- dandiset: "000035"
  paper: doi:10.1038/s41586-020-2907-3
  title: Phenotypic variation of transcriptomic cell types in mouse motor cortex
  why: Patch-clamp recordings (Patch-seq), 185 files; a different data type, and the paper also depends on transcriptomic data that is not on DANDI. Open access (Nature).
- dandiset: "001453"
  paper: doi:10.1016/j.cub.2025.04.027
  title: Neural circuits underlying divergent visuomotor strategies of zebrafish and Danionella cerebrum
  why: Zebrafish behavior, 37 files, 3.8 GB; a different species and the largest of the pilot. Free to read (Current Biology).
- dandiset: "000582"
  paper: doi:10.1126/science.1125572
  title: Conjunctive Representation of Position, Direction, and Velocity in Entorhinal Cortex
  why: Calibration case. A person has already written a notebook on this dandiset (grid cells), so it is known to be workable. The paper is not open access, which tests that path.
