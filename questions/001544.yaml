# Questions from attempt 001544-kim-2024-01 (author, 2026-11-03) about the claims file
# claims/001544/10.1016-j.celrep.2024.114009.yaml. Each is asked under docs/protocol.md, Author, step 1.6;
# the attempt tests the claim as the file has it and shows the paper's reading as a variant.
dandiset: "001544"
paper: doi:10.1016/j.celrep.2024.114009
questions:
- claim: figs12-other-features-shared
  asked: 2026-11-03
  question: >-
    The claims file was written without the supplement, so its criterion tests fourteen features (the
    eighteen of the Methods less max firing rate, sag, membrane potential and AHP amplitude) and says
    which features Figure S12 shows is not known. The supplement is now in paper/, and the Figure S12
    legend names fifteen features, five that differ (sag for both groups; input resistance, action
    potential width, downstroke and f-I slope for APP against ALL) and ten that are similar (threshold,
    upstroke, spike amplitude, spike latency, AHP latency, AHP width, CV of ISIs, rheobase, tau,
    adaptation index). Should the claim's "most other features are shared" be judged on the legend's
    ten similar features, with the four APP-specific differences as part of the finding, in place of
    the fourteen?
  passage: >-
    Figure S12 legend, "Both APP and AV activated VP neurons significantly differ from ALL VP
    cholinergic neurons in (A) sag potential. APP odor activated VP cholinergic neurons significantly
    differ from ALL VP cholinergic neurons in (B) input resistance, C) action potential width, (D)
    action potential downstroke and (E) frequency-current slope. Similarities between APP, AV and ALL
    VP cholinergic neurons are observed in (F) threshold, ... and (O) adaptation index."
  why: >-
    Four of the fourteen features are ones the paper itself reports as different, so the criterion's
    count of "more than half" mixes in features the paper does not claim are shared. On all cells, 9 of
    14 features show no difference (reproduced) and 9 of the legend's 10 do; without the three `_FL`
    cells, 7 of 14 (not reproduced) and 7 of 10. The attempt tests the fourteen and shows the ten as a
    variant.
  answered: 2026-11-03
  answer: >-
    Yes; the claim changed. The supplement now in paper/ shows that Figure S12 has fifteen panels,
    and its legend says "APP odor activated VP cholinergic neurons significantly differ from ALL VP
    cholinergic neurons in (B) input resistance, C) action potential width, (D) action potential
    downstroke and (E) frequency-current slope" and "Similarities ... are observed in (F) threshold
    ... and (O) adaptation index". The fourteen features of the old criterion included four the
    paper reports as different, so the criterion tested more than the paper claims. The claim's
    statement, source and quote now name the legend's ten similar features, and the criterion is a
    claim of absence over those ten (one-way ANOVA per feature at alpha 0.05, reproduced when more
    than half show no difference, with every feature listed). The four APP-specific differences
    are a separate finding, so they are a new claim, figs12-app-differs-from-all, judged on the
    APP against ALL comparison by the test readings of fig6f-max-firing-rate, and not folded into
    the absence claim; sag stays with figs12a-sag-higher. The criterion also notes that panel O
    (adaptation index) carries an asterisk in the figure though the legend calls it similar; it is
    counted with the ten, as the legend says.
- claim: figs12a-sag-higher
  asked: 2026-11-03
  question: >-
    The test readings of fig6f-max-firing-rate, which figs12a-sag-higher, figs12-app-differs-from-all,
    fig6g-av-more-hyperpolarized, fig6h-av-smaller-ahp, fig6-app-less-excitable and
    figs12-other-features-shared also use, are (a) a cell-level one-way ANOVA with t-tests and (b) the
    nested ANOVA. The STAR Methods also say that normality was tested and that non-parametric tests were
    run when the data failed it. Should the criteria include that rule, as a reading of its own or as
    the test that applies when Shapiro-Wilk fails, and which non-parametric tests (Kruskal-Wallis with
    Mann-Whitney pairs, or another)?
  passage: >-
    STAR Methods, Quantification and statistical analysis, "For electrophysiology and neuronal
    morphology data, a nested ANOVA was run to account for replicate values obtained from the same
    mouse. Shapiro-Wilk and Smirnov-Kolmogorov tests were used to assess normality of the data.
    Non-parametric tests were conducted if the data failed these tests."
  why: >-
    Shapiro-Wilk fails (p < 0.05) for nearly every feature in the dandiset. For sag on all 44 cells the
    parametric tests give APP above ALL (p = 0.011; mixed model p = 0.0041), while Kruskal-Wallis gives
    p = 0.12 and Mann-Whitney ALL against APP p = 0.10. The verifier of round 1 raised this as a gap in
    the claims file. Here the rule changes no outcome (figs12a-sag-higher is not reproduced either way,
    as AV does not exceed ALL by any test), but it would decide the APP half of sag, and it moves the
    count of figs12-other-features-shared (7 of 10 on all cells by Kruskal-Wallis against 9 of 10 by
    ANOVA). The attempt tests the readings as the claims file has them and shows the rank tests beside
    them in every table.
- claim: figs13-other-morphometrics
  asked: 2026-11-03
  question: >-
    The criterion says which features Figure S13 shows is not known and that the claim is testable only
    if they are named, which needs the supplement. The supplement now in paper/ names them. Should the
    criterion list the seven panels of the Figure S13 legend (number of primary, secondary and tertiary
    dendrites; branching angle; convex hull volume; mean dendrite length; number of branch points; number
    of terminal points; maximum segment length) as the features of the claim of absence?
  passage: >-
    Figure S13 legend, "A. Assay of the number of 1°, 2°, and 3° dendrites revealed no statistically
    significant differences between APP vs. AV VP cholinergic neurons Despite differences in proximal
    complexity (see Fig 6), there were no significant differences between groups in (B) branching angle,
    (C) volume of the convex hull, (D)mean dendrite length, (E) number of dendrite branch points, (F)
    number of dendrite terminal points or (G) max length of segment."
  why: >-
    Raised by the round-2 verifier. The claim is blocked as data_missing (no reconstructions are in the
    dandiset), so the answer changes no outcome here, but a later attempt with the reconstructions would
    need the features named.
