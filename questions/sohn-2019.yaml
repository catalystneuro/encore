questions:
- claim: beh-slopes
  question: The criterion requires all 8 per-condition slopes to lie between 0 and 1 with 95%
    intervals excluding 0 and 1, from a regression with an intercept. Table S1, which the claim
    cites and which the claims header says was not available, states the regression as tp = βts +
    ε, without an intercept, and tests the median slope across sessions with a Wilcoxon signed-rank
    test (null hypotheses βShort > 1, βLong > 1 and so on). Does the per-condition rule read the
    paper correctly, or should the criterion test the median slope across conditions (here, the 4
    datasets of one session), and should the regression have an intercept?
  passage: 'Table S1 legend, "We used a weighted linear regression (tp= βts+ε) and Wilcoxon
    signed-rank test to evaluate the median slope for the Short and Long prior conditions (βShort
    and βLong)." The table rows are "βShort > 1 2346, 1176 <1e-10, <1e-9" and "βLong > 1 2346,
    1176 <1e-12, <1e-9" for monkeys H and G.'
  why: Under the criterion as written the claim is not reproduced (6 of 8 slopes in (0, 1) with an
    intercept, 2 of 8 without). Under the Table S1 reading the median slope over the 4 datasets is
    0.936 (Short) and 0.729 (Long) with an intercept and 1.036 and 1.011 without, and the
    one-sided signed-rank p for a slope below 1 cannot go below 0.0625 with 4 values, so the
    outcome would depend on how the reading is adapted to one session. The no-intercept form also
    decides beh-long-more-bias (4 of 4 with an intercept, 3 of 4 without).
- claim: beh-bayes-model
  question: The criterion says "Table S3 was not available for comparison", and the claims header
    says the supplementary tables were not available. Table S3 is in the supplement and gives
    monkey H's fitted wm and wp per effector and direction (mean and SD over sessions). Should the
    criterion compare the fitted parameters with Table S3, for example within its SD?
  passage: 'Table S3, monkey H, wm "0.085 ± 0.025" (Hand Left), "0.062 ± 0.026" (Hand Right),
    "0.043 ± 0.016" (Eye Left), "0.027 ± 0.009" (Eye Right); wp "0.086 ± 0.020", "0.084 ± 0.021",
    "0.086 ± 0.022", "0.077 ± 0.033". Legend, "We fit the model to each session separately and
    computed mean ± standard deviation of each parameter across sessions."'
  why: The fitted wm here is 0.013 (Eye Right, z = -1.56 against Table S3) and 0.025 (Eye Left, z =
    -1.13); a small wm makes the model's estimate nearly linear in ts, which also weakens
    encoding-r2, encoding-bayes-beats-linear and short-in-long-control. A comparison with Table S3
    would add a test the current criterion does not make, and could change the outcome from
    partially reproduced.
- claim: short-in-long-control
  question: The criterion judges the control only by the post-hoc signed-rank test of the RMSE
    difference over datasets. The paper's main evidence for the control is the prior x model
    interaction of a two-way repeated-measures ANOVA (F1,7 = 161.43, p < 1e-5), which the claims
    file lists under statistics but does not test. With 4 datasets the signed-rank test cannot go
    below p = 0.125, so the criterion cannot fail. Should the criterion also test the interaction?
  passage: 'Figure 4D legend and Results, "Encoding Bayesian estimate along curved trajectory",
    paragraph 1, as quoted in the claims file, with the statistics "two-way repeated-measures
    ANOVA, F1,7 = 161.43, p < 1e-5" (interaction of prior condition and model on RMSE) and
    "post-hoc signed-rank test, p = 0.74" (Bayesian against linear for Short In Long).'
  why: The criterion gives reproduced (p = 0.25). The interaction over the 4 datasets of this
    session is F(1, 3) = 0.56, p = 0.510, so the control does not separate from the Short prior
    here; a criterion that included the interaction would likely give not reproduced or partially
    reproduced.
