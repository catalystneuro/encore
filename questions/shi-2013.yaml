# Questions from attempt shi-2013-01 (author revision after verifier round 1, 2026-11-09) about
# claims/shi-2013.yaml, asked under docs/protocol.md, "Hand over for verification". The verifier
# reported this as a place where the claims file may misread the paper; the claim was tested as
# the file has it.
dataset: CRCNS:ppc-1
paper: doi:10.1152/jn.00223.2012
questions:
- claim: fig5-fano-factor
  asked: 2026-11-09
  question: Do the outlier readings of the criterion match the cells the paper plotted in Fig. 5?
    The criterion names (a) the 5 cells removed for Fig. 4 and (b) Tukey outliers (1.5 IQR) on the
    count means or variances. Both axes of Fig. 5 (count mean and count variance) run from 0 to 80,
    which suggests that every cell left after outlier removal had a count variance of at most about
    80. Removing only the 5 Fig. 4 cells, whose outliers are defined on the index INDX1 and not on
    the counts, keeps cells far outside those axes. Should a reading that removes cells outside
    the plotted range (or outliers on the count variance alone) be part of the criterion? Raised by
    the round-1 verifier of attempt shi-2013-01.
  passage: Fig. 5. Fano factors (FFs) in the V and NV conditions. Shown are scatterplots of the spike
    count mean vs. the spike count variance for all cells (after outlier removal) for the location
    defined by the peak rate in the NV condition (Fig. 5 legend; axes 0 to 80 in the figure).
    Note that N represents no. of neurons after outlier removal (5 neurons total), defined as
    indexes ... 1.5 times the interquartile range (Fig. 4 legend).
  why: Under reading (a) (356 cells) the count variances reach 2,188, a few high-rate cells set the
    slopes, and FF is 1.84 in V and 3.19 in NV (P = 0.28). Under reading (b) (295 cells) FF is 0.98
    and 1.24 (P = 0.020). With the 331 cells whose count means and variances lie within 0 to 80, a
    variant shown in the notebook, FF is 1.03 and 1.21 (P = 0.17). None puts both FFs within
    tolerance with P < 0.05, so the outcome would not change on present numbers, but the reading
    decides which cells enter the test.
