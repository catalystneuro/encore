paper: doi:10.64898/2026.08.04.742876
questions:
- claim: maze-gain
  asked: 2026-11-22
  question: The expected replacement gain is -0.00004 with tolerance 0.000004. The paper prints the value
    to one significant figure, so any value from -0.000045 to -0.000035 rounds to it, a range wider than
    the tolerance (-0.000044 to -0.000036). Should the tolerance cover at least the rounding of the
    printed value, as for the claim's other expected values? The criterion also states no reproduction
    rule ("Not on this attempt's datasets"); should it say that every expected value must lie within its
    tolerance, as the attempt assumed from rtt-gain?
  passage: Results 2.6, paragraph 2, and Table 1, the MC_Maze row, replacement gain -0.00004 (a 10%
    tolerance on a value printed to one significant figure).
  why: Under the paper's estimator seed the attempt measures -0.0000371, inside both ranges, so the
    outcome does not change at that seed. A value between -0.000045 and -0.000044, or between -0.000036
    and -0.000035, would round to the paper's figure and still fail the claim. Under four other estimator
    seeds the value is -0.0027212, 0.0000294, -0.0000190 and 0.0000075, outside both ranges. The
    verifier of round 2 reported the tolerance as tighter than the paper's rounding.
