dandiset: "000574"
paper: doi:10.1126/sciadv.aav3687
questions:
- claim: neurons-recorded
  asked: 2026-10-30
  question: >-
    The criterion assigns units to regions by the name of their electrode (AH and PH
    hippocampus, EC entorhinal cortex, A amygdala, from Table 1 of the data descriptor). Does the
    paper assign them that way, or by the atlas location of the recording site, as its Methods
    describe for the electrode contacts? If the latter, should the region of a unit be the
    Brainnetome label of the contact nearest the microwires (contact 1)?
  passage: >-
    "The contact positions were normalized to the MNI space and assigned to a brain region using
    the Brainnetome Atlas" (Methods, Depth electrode localization); "Location of the
    microelectrodes at the tip of the depth electrodes in MNI's MNI152 space ... color-coded
    (cyan, hippocampus; magenta, entorhinal cortex; yellow, amygdala)" (Fig. 1D legend).
  why: >-
    By electrode name the dataset's 1487 units split 446 hippocampus, 456 entorhinal cortex and
    585 amygdala (paper 676, 449, 401); by the atlas label of each bundle's contact 1 they split
    640, 421 and 398, with 28 under fusiform gyrus. Several electrodes named for amygdala or
    entorhinal cortex have their deepest contact labelled hippocampus (for example AR of subject
    8, 186 units). The criterion's counts are exact, so the reading decides the outcome of this
    claim, and the region of every neuron in the other neuron and decoding claims.
