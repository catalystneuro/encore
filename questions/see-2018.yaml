# Questions from attempt see-2018-01 (author-revise-1, 2026-11-13) about claims/see-2018.yaml, asked
# under docs/protocol.md, Author, step 1.6, and "Hand over for verification". The claim is tested as
# the claims file has it.
paper: doi:10.7554/elife.35587
questions:
- claim: fig6j-sharpness-cne-pairs
  attempt: see-2018-01
  asked: 2026-11-13
  question: The criterion defines a non-cNE pair as "two units of the penetration that share no
    cNE". Should it be two cNE members that share no cNE? The pair counts of Supplementary file 1
    total 3087 cNE and 8838 non-cNE pairs, 11925 in all, fewer than the 14174 pairs of all units
    of the 16 penetrations. The verifier of round 1 reported this as a likely misreading, since
    11925 is close to the number of pairs among cNE members at the paper's 91% membership.
  passage: Results, Synchrony between cNE members cannot be fully explained by receptive field
    overlap, paragraph 2 ("The PWCs were significantly narrower for cNE pairs than for non-cNE
    pairs"); Figure 6J and Figure 6-figure supplement 1; Supplementary file 1 (n per penetration).
  why: Restricting the non-cNE pairs changes the comparison group. In this attempt it does not
    change the outcome (14 of 16 penetrations at p < 0.001 with +-50 ms lags and 12 with +-100 ms,
    under both definitions), but with the paper's larger cNEs the two groups would differ more.
