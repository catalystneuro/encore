  attempt: qu-2025-01
  asked: 2026-11-02
  question: The opening comment reads the session rule as the ROC AUC separating 470 nm samples
    from rescaled 415 nm samples, above 0.9. The rescaled 415 nm signal is the regression of the
    470 nm signal onto the 415 nm signal, so both series have the same centre and that AUC is near
    0.5 in any session (0.46 to 0.51 here; the verifier found 0.4998 on synthetic raw-scale data).
    No session can pass 0.9 under this reading. Does the paper's AUC refer to another quantity, and
    if the paper does not say which, should the opening comment state that the rule cannot be
    applied, so that the session set is an assumption in every dopamine claim?
  passage: After baseline correction, we visually inspected both 415 nm channel recording and
    470 nm channel recording, as well as the AUC-ROC scores between the rescaled baseline values
    against signal channel recordings. We picked sessions that meets the following conditions
    AUC-ROC higher than 0.9, longer tail in distributions in 470 nm recording compared to rescaled
    415 nm recordings suggesting clear fluorescence increases, and no sharp discontinuity in both
    channels' recordings. (Methods, Neural data analysis)
  why: The session set decides every dopamine claim. Under the claims file's reading no session is
    kept; this attempt used the 38 sessions with an outcome response (assumption) and shows 34 and
    46 sessions as variants. With all 46 sessions the fig4i R_unchosen:Switch CI includes 0 and
    figs5 has 3 animals with the pattern, so those two outcomes depend on the set.
- claim: fig2c-complex-rl-beat-rl4p
  also: [fig2c-no-bayes-vs-complex-rl, fig2b-model-identifiability, figs2-parameter-recovery,
    fig4f-bayesian-rpe-fit, figs3-other-metrics, fig4h-rpe-only-llk, fig4h-nonnegative-rpe-aaa,
    fig4-consistent-after-reward, fig4i-model-runchosen]
  attempt: qu-2025-01
  asked: 2026-11-02
  question: The opening comment follows the Methods' RLFQ3p forgetting rule, zeta = (alpha+ +
    alpha-)/2, and makes the rule of Table 1 and the code, zeta = 1 - (alpha+ + alpha-)/2, a
    variant. On the data the code's rule gives the paper's relative AIC for RLFQ3p (-645.17 against
    -646.45 +- 53.62) and the Methods' rule does not (-460.66). Should the code's rule be the main
    one, with the Methods' formula read as a misprint, or should the claim say that both rules are
    readings of a method detail?
  passage: However, Q value of the unchosen option decays as Q t ( - c t ) = zeta Q t - 1 ( - c t ).
    For model simplicity, we take zeta = (alpha+ + alpha-)/2. (Methods, Computational modeling).
    Table 1 and RL_Forgetting3p in github.com/Wilbrecht-Lab/cogmodels at 589555c use 1 - (alpha+
    + alpha-)/2.
  why: Under the header rule that readings of a method detail must agree, fig2c-complex-rl-beat-rl4p
    is reproduced with the code's rule and partially reproduced with the Methods' rule (RLFQ3p
    outside tolerance). This attempt adopted the code's rule as an assumption; the verifier gave
    partially reproduced, following the claims file's Methods-primary rule.
