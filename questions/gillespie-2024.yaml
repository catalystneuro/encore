dandiset: "000115"
paper: doi:10.7554/elife.90944
questions:
- claim: fig1s1c-prereward-dwell-matched
  asked: 2026-11-26
  question: >-
    Does a 10% limit on the difference of the per-rat median NF and delay pre-reward durations
    fit "approximately matched"? The paper calls the durations approximately matched while its
    own tests find significant NF against delay differences in rats 3 and 4 (p = 0.005 and
    0.002), and it gives no threshold. Here bernard (rat 3) differs by 10.2% under the adopted
    plateau reading, just over the limit.
  passage: >-
    The delay period length was randomly chosen from the pre-reward duration of recent
    neurofeedback trials, such that the amount of time spent waiting at each of the center ports
    was approximately matched (Figure 1-figure supplement 1C; and see Methods). (Results, A
    neurofeedback paradigm to promote SWRs)
  why: >-
    The claim is not reproduced because one rat is 0.2 percentage points outside the 10% limit.
    A wider limit, or a criterion that follows the paper's description of the ranksums, could
    make it reproduced on the three rats that can be tested. The round-3 verifier raised this.
