questions:
- claim: rebound-delta-phase-trend
  asked: 2026-11-06
  question: >-
    The criterion is met when r for the rebound is negative with p >= 0.05 and the before-KC
    regression gives p >= 0.05, with no lower bound on the size of r. The statement is that the
    rebound "tends to correlate" with earlier delta phase, with r = -0.32. Should the criterion
    ask for a negative r of about that size (for example r <= -0.2, or r within a tolerance of
    -0.32), so that a correlation near zero does not count as the paper's trend?
  passage: >-
    The amplitude of the thalamic rebound after KCs (reported above) had a tendency to correlate
    with a preference for earlier phases of delta; although the correlation was not significant
    (p=0.08, r = -0.32), we did not observe such a trend when we regressed mean phase preference
    to the cell firing rate in a time window of the same length but before KCs (p=0.65, r =
    0.08). (Results, Phase-locking of thalamic units, paragraph 2)
  why: >-
    On the 5 thalamic units here, reading (i)(a) gives r = -0.011 (p = 0.99) for the rebound
    and p = 0.17 for the before-KC control, so the claim is reproduced by the letter of the
    criterion although no trend appears; reading (ii)(a) gives r = -0.086. With a bound on r
    the outcome would be not reproduced. Raised by the round-1 verifier, who called the
    criterion weak.
