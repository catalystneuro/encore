# Questions from attempt 000139-churchland-2010-01 (author revisions after verifier rounds 1 and 2,
# 2026-10-28) about claims/000139/10.1016-j.neuron.2010.09.015.yaml, asked under docs/protocol.md,
# "Hand over for verification". The verifier reported each as a place where the claims file may
# misread the paper; the claims were tested as the file has them.
dandiset: "000139"
paper: doi:10.1016/j.neuron.2010.09.015
questions:
- claim: j-array-recordings
  asked: 2026-10-28
  question: Should the criterion's partial outcome ("the units match and the dataset holds a subset of
    the 108 conditions") apply to a dataset of 27 conditions? The paper says the J-array dataset
    interleaved all 108 conditions in one recording, and that 27-condition subsets were used only for
    the single-electrode monkey J dataset. A session that ran only 27 conditions would then be a
    different recording from the J-array dataset, and a match of its unit count with the paper's 146
    would not bear on the claim. Should the claim instead be not reproduced, or blocked as the J-array
    recording not being in the dataset, when the conditions are not the 108?
  passage: For the monkey J-array dataset, all 108 conditions were interleaved in the standard way
    (Methods, Task design); The same 108 conditions were used for the J and J-array datasets. For the
    former a given neuron was recorded using one of four 27-condition subsets (Figure 3 legend). The
    criterion cites Methods, Task design for the 27-condition subsets.
  why: The dandiset holds 152 units over 27 conditions (9 mazes in 3 versions) from a session of
    2009-09-29, with a rebuilt trial timeline that cannot show whether the session held other mazes.
    The attempt gives partially reproduced under the criterion as written; the verifier agreed but
    noted the session is almost certainly a different recording and the unit match a coincidence. If
    the partial clause does not apply, the outcome would be not reproduced or blocked.
- claim: fig7c-anterior-posterior-performance
  asked: 2026-10-28
  question: The criterion reads "only slightly different" as within 10% of the random halves'
    normalized value. On this dataset the random halves themselves vary far more than that (SD 0.153
    around 0.455 with S fixed, range 0.067 to 0.869 over 40 halves), so a band of +/- 0.046 would
    usually reject a random half. Should "only slightly different" instead be judged against the
    spread of the random halves (for example within their central 95%, or within a number of SD),
    or does the paper, which averages over four datasets with far more trials, support a fixed 10%
    band?
  passage: The ability of the peri-movement space to capture tuning also held for both anterior and
    posterior sites (Results, Comparison of anterior versus posterior sites, paragraph 1); Figure 7C
    and its legend compare each half's normalized performance with that of randomly divided data.
  why: Raised by the verifier in round 2. The outcome (not reproduced) does not depend on it here,
    as array 2 lies 3 to 5.6 SD below the random halves under both readings of S, but the 10% band
    is narrower than the variation of the reference it is applied to, so it could fail a half that
    performs like random halves. The claim was tested as the file has it.
