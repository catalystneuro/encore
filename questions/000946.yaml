dandiset: "000946"
paper: doi:10.1523/jneurosci.2218-24.2025
questions:
- claim: fig11b-ac-responses
  asked: 2026-11-01
  question: The header names N2 (the per-trial ratio of window to baseline count, averaged over the
    trials with a nonzero baseline) as a reading of the normalized spiking rate. Does the paper allow
    it? Averaging per-trial ratios over the trials with a nonzero baseline keeps the trials whose
    baseline is larger than average, so N2 sits well below 100% with no stimulus. If the paper does
    not allow it, should N2 be dropped from the header? The same reading is named for every spiking
    claim (Figs. 4 to 9 and 11B).
  passage: The spiking rates were normalized to the pre-stim period (67 ms pre-stim) for comparison
    across different conditions using Kruskal-Wallis H test. (Materials and Methods, Statistical
    analysis)
  why: On the AC units with trial starts shifted by 1 s, where there is no stimulus, N2 gives 49.8% to
    61.7% and N1 gives 94.3% to 99.0%; a verifier's simulation of Poisson spiking with no effect gives
    about 45% under N2 against 86% under N1. N2 gives a Kruskal-Wallis p of 0.0213 during sonication
    for Fig. 11B, where N1 gives 7.83e-06. Dropping N2 alone would not change the outcome of fig11b,
    since the two baseline readings under N1 also disagree, but it could change the outcome of a
    spiking claim in a later attempt on data with cell types.
- claim: fig11b-ac-responses
  asked: 2026-11-01
  question: Under N1 the header's baseline reading B1 (the units' normalized rates in the 67 ms before
    stimulation) is exactly 100% for every unit, so the two-sample Wilcoxon test the paper names becomes
    a test of the window's values against a constant. Is B1 a reading the paper allows, or does the
    paper's two-sample test imply a baseline sample that varies across units (such as B2, or the units'
    raw pre-stimulus rates)?
  passage: Post hoc one-tail two-sample Wilcoxon tests with Bonferroni's correction were employed.
    (Materials and Methods, Statistical analysis); The spiking rates were normalized to the pre-stim
    period (67 ms pre-stim) (same paragraph)
  why: For Fig. 11B, N1 with B1 gives 1500, 3000 and 4500 Hz above baseline during sonication
    (partially reproduced) and N1 with B2 adds 300 Hz (not reproduced); the claim is blocked because the
    readings disagree. A verifier's simulation with no effect found a false-positive rate of 2.3% at
    alpha 0.01 for B1 and 0% for B2.
