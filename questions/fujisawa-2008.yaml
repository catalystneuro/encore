# Questions from attempt fujisawa-2008-03 (author revision after verifier round 1, 2026-11-16) about
# the claims file claims/fujisawa-2008.yaml. The point was raised by the verifier as a reading of the
# paper repeated by the claims file (verifier-1 report, problem B3). The attempt tests the claims as
# the file has them, takes the side of each significant pair from the Figure 6c legend, and shows the
# literal reading as a variant; the outcomes stay as tested.
paper: doi:10.1038/nn.2134
questions:
- claim: fig6-facilitation-depression
  also: [fig6b-convergent-examples]
  asked: 2026-11-16
  question: >-
    The criterion says "depression is first above later", and fig6b-convergent-examples asks for
    197-201 to have "a first-spike height above its later-spike height" and 186-201 the reverse.
    Read literally, this labels a pair by the sign of the raw difference of the two standardized
    heights. The Figure 6c legend instead assigns the label by the side of the two-sided
    permutation test the pair falls on. Should the criteria say that depression is the tail of the
    permutation distribution where first spikes are relatively stronger (the observed difference
    above the permutation distribution), and facilitation the other tail, in place of the sign of
    the raw difference?
  passage: >-
    Figure 6c legend, "Significant differences of peak heights were computed by a permutation test
    (shuffling the first spike, second~ spike labels, P < 0.10, two-sided test; one side corresponds
    'facilitation', the other to 'depression')"; Supplementary Figure 9B, the standardized peak height
    (h - mu_jitter) / sigma_jitter, "proportional to the log p-values computed by jittering method".
  why: >-
    The standardized height grows with the number of spikes, and first spikes usually outnumber
    later ones (cell 197, 2,311 against 252), so the raw difference is positive under the null: here
    the permutation median of the difference is above 0 in 76% of the tests, and the raw difference
    is positive in 62% while the observed value lies above the permutation median in only 43%.
    Labelled by sign, almost every significant pair whose first spikes are not much weaker is called
    depressing. With the shared jitter, labelling by the tail gives depressing 4.0% to 5.9% and
    facilitating 6.8% to 12.5%; labelling by sign (presynaptic jitter) gave 4.5% to 7.2% and 5.5% to
    10.2%. Neither reading meets the criterion's partial outcome, so the fig6 outcome is the same,
    but for fig6b the literal reading has 197 first above later under every reading while the tail
    reading puts it on the depressing side under one of four.
