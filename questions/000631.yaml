dandiset: "000631"
paper: doi:10.3390/ijms241310921
questions:
- claim: fig2-60-fold-co-counter
  asked: 2026-10-31
  question: >-
    The claims file keeps background reading (a), the ROI's YP intensity with no correction for
    spontaneous uptake, as a reading of equal standing with (b), subtraction of the footprint
    value, and blocks a Figure 2 claim whenever the two give different outcomes. Methods 4.4 says
    the footprint measurements were made "to account for" spontaneous uptake, so the paper did
    correct for it in some way. Is reading (a) a reading the paper allows, or should the Figure 2
    criteria use a corrected value only (subtraction, or another correction the paper supports)?
    The same rule is in the criteria of fig2-180-cancellation, fig2-crossover-angle,
    fig2-facilitation-plateau and fig2-frequency-dependence.
  passage: >-
    To account for "spontaneous" YP uptake, measurements were also performed within the hollow
    electrodes' footprints, where cells were shielded from the electric field. (Materials and
    Methods, 4.4)
  why: >-
    In these images every ROI holds 200 to 270 counts of camera offset and spontaneous uptake
    (the footprint values), so without a correction no ratio can approach the paper's 20-fold or
    60-fold: reading (a) gives 2.7 to 3.4-fold cancellation at 833 kHz and a co- to
    counter-directional ratio of 3.6 to 5.8, against 11.8 to 22.0 and 32.7 to 61.6 with
    subtraction. fig2-60-fold-co-counter is blocked only because (a) disagrees with (b); under (b)
    alone it is within 60 +- 6 on one reading of the 180 degree value. The outcomes of the other
    Figure 2 claims do not change, as (a) and (b) agree on them.
