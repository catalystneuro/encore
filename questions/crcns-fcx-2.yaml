# Questions from attempt crcns-fcx-2-johnson-2018-01 (author run, 2026-11-08) about
# claims/crcns-fcx-2/10.1371-journal.pbio.2004274.yaml, asked under docs/protocol.md, Author, step 1.6.
# The claim was tested as the file has it.
dataset: crcns:fcx-2
paper: doi:10.1371/journal.pbio.2004274
questions:
- claim: behavior-no-difficulty-difference
  asked: 2026-11-08
  question: Should the criterion also name the reading in which condition enters the two models as a
    single numeric term? The criterion names (a) each relation condition against identity and (b) one
    3-level condition term, and notes that the printed F(1,28) does not fit a 3-level factor. One value
    per subject and condition (30 rows) with an intercept and a single condition slope gives exactly
    28 residual degrees of freedom and one numerator degree of freedom.
  passage: 'mixed-effects model, accuracy: F 1,28 < 0.10, p > 0.75; correct-trial response time: F
    1,28 < 2.55, p > 0.12 (Results, paragraph 2); Accuracy and correct-trial response time data were
    submitted to logit and linear mixed-effects models, respectively, with 3 condition-fixed effects
    and 10 subject-random effects (Materials and methods, Behavioral task, paragraph 3)'
  why: On the per-subject response times of the data set's summary_file.csv, whose condition means
    are the paper's (1659, 1335, 1475 ms), condition as a numeric term gives p = 0.12 (z = -1.55,
    z squared 2.41, below the paper's 2.55), the paper's "p > 0.12", while readings (a) and (b) find
    an effect (spatial against identity p = 0.0018; 3-level p = 0.0076). Accuracy as a numeric term
    gives p = 0.69. The claim is not reproduced under the criterion's readings and would be
    reproduced under the numeric one.
