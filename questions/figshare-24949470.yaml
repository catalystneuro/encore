# Questions from attempt figshare-24949470-mintal-2024-01 (author-revise-1, 2026-10-27) about the claims file
# claims/figshare-24949470/10.1038-s41597-024-03777-0.yaml, asked under docs/protocol.md, "Hand over for
# verification", where the round-1 verifier reported a possible misreading. The claim is tested as the file
# has it.
questions:
- claim: age-education-inconsistencies
  asked: 2026-10-27
  question: The paper says that upon initial review the team broadened the acceptable age range for a university
    degree to include 21-24, reports the 40 and 400 inconsistent cases, and says they were "acknowledged during
    further data curation and refinement of the data collection tool". Do the counts
    describe the deposited User Responses Dataset, or an earlier state of the data before that curation? If the
    latter, should the criterion say that the deposited file may not reproduce them, or should the claim be
    marked as not testable on the deposited data?
  passage: Upon initial review, we broadened the acceptable age range for those reporting a 'University
    degree/Academic higher education' to also include the '21-24' category, which accounts for early
    graduates. We identified inconsistencies in the age-education relationship, specifically n = 40 cases
    under the age of 18 and n = 400 cases aged '18-20', which were not congruent with university-level
    education attainment. These discrepancies were acknowledged during further data curation and refinement
    of the data collection tool. (Technical Validation, Structural validation, paragraph 3)
  why: The criterion counts rows of the deposited file, on the cleaned or the raw rows. The deposited file gives
    27 under 18 and 378 (cleaned) or 382 (raw) aged 18-20 with a university degree, so the 18-20 count is
    within tolerance and the under-18 count is not, and the outcome is partially_reproduced. If the counts
    describe an earlier state of the data, a difference from the deposited file is expected and the claim
    tests the paper's history of the data, not the dataset. The deposited R code has no age-by-education rule.
