questions:
- claim: structural-stack, z-drift-under-10um, unique-neurons-75909
  asked: 2026-10-30
  question: Should these claims be marked as data elsewhere? They are marked as dataset claims and blocked as
    data_missing, because the dandiset holds no structural stack. The BossDB open data bucket
    serves a structural stack of the mouse without an account
    (iarpa_microns/minnie/functional_data/two_photon_structural_stacks/two_photon_stack_17797_9_19_v1.tiff,
    1.25 GB, with a technical document), and the paper lists the 2P structural images among the
    publicly available data resources.
  passage: Fig. 1 legend, "a, The nine data resources that are publicly available at
    https://www.microns-explorer.org/ . b, ... The primary in vivo data resource consists of 2P
    calcium images, 2P structural images, natural and parametric video stimuli used as visual
    input, and behavioural measurements"; Data availability, "EM imagery, segmentation and
    annotation data is available via https://www.micronsexplorer.org/cortical-mm3 and from
    https://bossdb.org/project/microns-minnie".
  why: Under the protocol, data that are public elsewhere are marked as data elsewhere, never
    data_missing. structural-stack could then be tested on the stack's size and resolution. The
    other two also need the registration of each field into the stack, which this attempt did not
    find on the bucket, so they might stay blocked for another reason.
