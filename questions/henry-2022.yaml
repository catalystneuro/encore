# Questions from attempt henry-2022-01 (author-revise-1, 2026-11-11) about the claims file
# claims/henry-2022.yaml. Each was raised by the round-1 verifier and is asked under
# docs/protocol.md, "Hand over for verification"; the claims are tested as written.
paper: doi:10.1016/j.cub.2022.10.049
questions:
- claim: fig4a-v1-modulation-indices
  asked: 2026-11-11
  question: The far-spacing facilitation is expected at 2.5% with a tolerance of 0.25 percentage
    points, and the far suppression at 13% with 1.3 points. Over the paper's 396 V1 neurons, 0.25
    points is about one neuron, finer than the counts can resolve (2.5% is 9.9 neurons). The paper
    calls 2.5% "the expected false positive rate", which reads as a statement that facilitation
    was at chance, not a value measured to a quarter of a point. Should the far pair be judged
    with a tolerance no finer than the counting resolution, or against the false-positive rate
    (facilitation not above what the two-sided test gives by chance)?
  passage: Results, Distractors modulate neuronal responsivity and variability, paragraph 4, "only
    2.5% cases of significant facilitation were observed (the expected false positive rate) and 13%
    cases of suppression."
  why: At 2.6 degrees, two-sided, pooled within orientation, the attempt finds 8 of 396 neurons
    facilitated (2.0%) and 57 suppressed (14.4%); the tolerances allow 9 or 10 and 47 to 56, so each
    value misses by one neuron and the outcome is partially reproduced. With a tolerance of a few
    neurons, or with facilitation judged against the 2.5% false-positive rate, the far pair would
    hold and the outcome would be reproduced.
