dandiset: "001773"
paper: doi:10.1038/s41593-026-02301-4
questions:
- claim: fig4b-roi-changes-counts
  asked: 2026-11-03
  question: The paper's Fig. 4 script in the dandiset (code/Fig4 Fujimoto_NatNeuro_2026_FCmatrix.m)
    counts an ROI as changed when `ranksum(sbj_data_mean, zeros(length(sbj_data_mean),1))` is below
    0.05/nrois, that is a rank-sum of the ROI's changes against zeros at 0.05 over the number of
    ROIs (123 in the deposited matrices). The criterion lists a pre against post rank-sum, a
    signed-rank of the changes, and thresholds 0.01/122 and 0.01, but not this test or threshold.
    Should the criterion include the script's test and threshold as a reading? And is "of the 122
    ROIs" right, when the deposited connectomes have 123 ROIs and the legend's n = 122 is the
    number of values per ROI?
  passage: Rank-sum test was conducted to determine statistical significance ( P < 0.01 with
    Bonferroni correction). (Fig. 4b legend) Colors represent significant negative (blue) and
    positive changes (orange) of functional connectivity from zero in each ROI ( P < 0.01 with
    Bonferroni correction, rank-sum test). (Extended Data Fig. 10c legend) The claims file's own
    header notes that Supplementary Tables 1 and 2 list P values up to 3.9e-4 as significant.
  why: Under the criterion's readings the counts are 10 to 85 (DBS) and 4 to 49 (controls), never
    both in tolerance, so the claim would be not reproduced. The script's test and threshold give
    69 and 44, the reported counts, with a largest significant P of 3.88e-04 in both groups, which
    matches the 3.9e-4 of the Supplementary Tables. The attempt recorded the claim as reproduced,
    resting on the assumption that the script's procedure is the paper's.
  answer: Yes to both, and the claim is amended. The paper's Fig. 4 script tests each ROI's
    changes against zeros, "ranksum(sbj_data_mean,zeros(length(sbj_data_mean),1))>=0.05/nrois",
    and Supplementary Tables 1 and 2 fit it, with largest listed P 3.9e-4, above 0.01/123 and
    below 0.05/123. The criterion now judges that test and threshold alone, the diagonal
    excluded, and keeps the Methods' P < 0.01 Bonferroni, the pre against post rank-sum and the
    signed-rank as reported variants. Supplementary Tables 3 and 4 list 123 ROIs, so the
    statement now says "of the 123", and the legend's n = 122 is the values per ROI. The
    header and fig4c-network-sorted-reduction now say 123 too. Expected counts (69, 44)
    are unchanged.
  answered: 2026-11-03
- claim: fig6e-monkey-d-no-network-reduction
  asked: 2026-11-03
  question: The criteria of fig6e-monkey-d-no-network-reduction and fig5c-dmn-lim-cen-decrease
    run LIM with area 25 (reading a) and without it (reading b). The voxel counts the legends
    give fit only reading (a). In monkey D's seed table the LIM hubs sum to 438 voxels on the sham
    side and 383 on the control side with area 25, and 428 and 375 without it; the Fig. 6e legend
    gives 438 and 383. For N and T the sums are 821 with area 25 and 803 without, and the Fig. 5c
    legend gives 821. The claims file's header notes the Fig. 5c count and keeps (b) for the
    Methods' hub list; the Fig. 6e counts are a second legend that fits (a) only, and the
    Fig5BCandE9 script also lists ROI 8 (area 25) in LIM. Should reading (b)
    be dropped from both criteria, so that LIM is judged with area 25 only?
  passage: LIM, n = 438 (pre), 438 (post) ... control side ... LIM, n = 383 (Fig. 6e legend);
    stimulation side ... LIM, n = 821 (pre), 821 (post) ... control side ... LIM, n = 821 (Fig. 5c
    legend); SCC, dACC and PCC were counted as hubs for the LIM (blue hubs) as well (Fig. 5c
    legend, where SCC is area 25 and area 32).
  why: For fig5c-dmn-lim-cen-decrease both readings give the same outcome, reproduced. For
    fig6e-monkey-d-no-network-reduction reading (b) adds a sham-side LIM decrease (P = 6.9e-04).
    Under reading (a) alone the claim is still blocked, because the sham-side scope (0 of 3
    decreases) and the both-sides scope (control-side CEN decrease, P = 0.0089) disagree, so
    dropping (b) does not change an outcome in this attempt but removes one of the readings
    behind the block. The verifier of round 1 reported this.
