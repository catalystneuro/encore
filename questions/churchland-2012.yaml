questions:
- claim: fig3-phase-from-prep-state
  question: The criterion compares the cross-validated R2 of the state at +150 ms predicted from
    the state at -50 ms with the median R2 of shuffle 3. The Supplementary Figure 2 legend puts the
    dividing point of shuffle 3 at 50 ms after the go cue, which in the array datasets is 268 to
    320 ms before movement onset, so the whole window from -50 to +150 ms lies after it. Under
    shuffle 3 the states at -50 and +150 ms then both carry the same reassigned movement pattern,
    and the one predicts the other by construction. Should the reference test the paper's point,
    that the preparatory state predicts the phase, for example by predicting from the state at the
    dividing point, or by projecting the shuffled data onto the original data's jPCA plane?
  passage: 'Supplementary Figure 2 legend, "We picked a time-point 50 ms after the go cue as the
    dividing point between preparatory and peri-movement activity ... any true relationship between
    rotation phase and initial state is expected to be disrupted"; Results, "If one knows the
    initial population-level preparatory state (fig. 3, circles) subsequent states are reasonably
    predictable".'
  why: Under the criterion as written the claim is partially reproduced, as in J-array the shuffled
    data predict better than the data (shuffle-3 median 0.686 against 0.568). With the shuffled
    runs projected onto the original plane the shuffle-3 medians are 0.429 (J-array) and 0.611
    (N-array), below the data in both, which would make the claim reproduced. Predicted from the
    state at the dividing point, the data reach 0.103 and 0.252, below the 0.5 bar, against
    shuffle-3 medians of 0.055 and 0.058, which would make it not reproduced.
- claim: suppfig3-shuffle-controls
  question: The criterion measures rotation strength by R2(M_skew) and asks each shuffle to bring
    it to at most 75% of the original. The Supplementary Figure 2 legend says shuffles 2 and 3 are
    not expected to remove all rotational structure, and that what they are expected to reduce is
    the consistency of rotations across conditions and the relationship between phase and initial
    state. Should the criterion judge shuffles 2 and 3 by those measures, with R2(M_skew) applied
    to shuffle 1 only, or as the paper's Supplementary Figure 3 shows them?
  passage: 'Supplementary Figure 2 legend, "This manipulation is not expected to remove all
    rotational structure (most such structure is merely sign-inverted). However, this manipulation
    is expected to largely remove any consistent relationship (assuming there is one) between the
    preparatory state and the phase of subsequent oscillations ... this shuffle control is
    expected to greatly reduce the consistency of any true rotations, especially the relationship
    between phase and initial state."'
  why: The outcome is partially reproduced because in N-array shuffles 2 and 3 keep 0.76 and 0.87
    of the original R2(M_skew), the two shuffles the paper does not expect to remove it. A
    criterion on consistency or on the phase-state relationship could give a different outcome.
- claim: var-captured-jpc-plane
  question: Reading (b) of the criterion takes the range "typically 20-35%" as the range of the
    variance captured by the first jPCA plane of the whole population. In the paper that sentence
    is in the Supplementary Figure 5 legend, which is about the analysis of the PMd and M1 arrays
    separately. Does the range apply to the whole-population claim?
  passage: 'Supplementary Figure 5 legend, "Variance captured refers to the proportion of total
    data variance that lies within the jPCA plane. This was typically 20-35%."; Results, "Those
    projections captured an average of 28% of the total data variance".'
  why: Under the main reading the claim fails both readings (J-array 14.9%). Under the
    move_begins_time readings it passes only through reading (b), with J-array at 18.7 to 19.0%,
    so without (b) it would not be reproduced under any reading.
