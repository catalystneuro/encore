questions:
- claim: fig3c-spindles-over-sleep
  question: The claim and its expected value take spindle incidence as 1.94 per minute, from the Results, and the
    criterion judges the claim on that value though Table S1 gives 0.049 +- 0.008 Hz (2.94 per minute). Is 1.94 the
    value the paper means for this claim, or is it a misprint for 2.94, so that the expected value should be the one
    of Table S1? Raised by the verifier of watson-2016-03, round 1.
  passage: Results, Firing pattern and LFP changes across the course of sleep, paragraph 3, "Incidence of spindles
    (1.94±0.39/min) decreased (R = – 0. 093; p < 10 −5 ), while spindle duration (0.52±0.32 sec), frequency
    (13.93±0.93 Hz) and amplitude (203.3±87.71 µV) did not change over SLEEP"; Table S1, spindle incidence 0.049 +-
    0.008 Hz.
  why: The deposited CRCNS spindles give 2.85 per minute of nonREM pooled and 2.95 as the median over sessions, which
    match Table S1, along with Table S1's count (5203) and the duration, frequency and amplitude above. Judged on 2.94
    the incidence value would hold. The outcome would not change in this attempt, as the incidence decrease, the main
    part of the claim, fails (per packet R = -0.022, p = 0.56).
- claim: fig2c-acg-peaks
  question: The criterion sets 1 ms bins and a tolerance of "7 to 9 ms in whole bins" for the nonREM peak, but does
    not say how a bin's lag is named. A peak in the bin [9, 10) ms is at 9 ms if a bin is named by its start, at 9.5
    ms by its centre, and with bins centred on whole milliseconds the same data peak at 10 ms. Which does the criterion
    mean? Raised by the verifier of watson-2016-03, round 1.
  passage: Results, Assessment of firing patterns in different brain states, paragraph 3, "a large peak occurred at
    approximately 8ms inter-spike interval during nonREM, whereas smaller peaks were present at ~125 ms (i.e., theta
    frequency) during REM and WAKE ( Figure 2C )".
  why: On both datasets the nonREM peak is in the [9, 10) ms bin, and with bins centred on whole ms at 10 ms. Named
    by its start the peak is within tolerance and the claim is reproduced; by its centre it is outside and the claim
    is partially reproduced (the outcome recorded); with centred bins the WAKE theta maximum also moves to 99 ms and
    the claim would not be reproduced.
- claim: fig4cd-packet-rate-lfp-correlations
  question: The criterion reproduces the claim "when the six correlations and the four absences hold" and partially
    "when at least four of the six correlations hold", judged by M4. M4 has two levels for a correlation (sign and the
    reported bound, reproduced; sign and p < 0.05, partial). Does a correlation "hold" only at the first level, or at
    either? The same word is used in fig4e-within-up-sextiles ("reproduced when all three hold under one reading,
    partially when two do"). Raised by the verifier of watson-2016-03, round 1.
  passage: Results, Firing rate and LFP changes within nonREM episodes and packets, paragraph 5, which gives each
    correlation its own bound, "whole-packet delta power (Z-scored per session; Figure 4C ; R= – 0.28; p < 10 −10 ),
    DOWN state duration (R = – 0.16, p < 10 −4 ) ... gamma power ( Figure 4D ; R = 0.44; p < 10 −10 ) ... sigma
    power in the last 20 sec of the packet (R = 0.25; p < 10 −10 )".
  why: On CRCNS all six correlations have the paper's sign at p < 0.05 and the four absences hold, but only three
    meet their bounds. Holding at the bound, the claim is not reproduced (recorded); holding at p < 0.05, it would be
    reproduced. For fig4e-within-up-sextiles, one group holds at its bound and two at p < 0.05, so the outcome would
    be partially reproduced against not reproduced (recorded).
- claim: synchrony-skew
  question: The statement and criterion read "more than 15% of pE cells rarely fire synchronously" and "fewer than
    4.2% ... at least half of the windows" as bounds to be passed in the stated direction, so any larger share of
    rarely synchronous cells passes. Does the paper report 15% and 4.2% as the observed shares (about 15%, about 4%),
    so that the expected values are values to match within tolerance? Raised by the verifier of watson-2016-03,
    round 1.
  passage: Results, Assessment of firing patterns in different brain states, paragraph 4, "The fraction of principal
    cells firing in 50 ms overlapping time windows (‘population synchrony’) showed a skewed distribution. More than
    15% of principal neurons rarely fired synchronously with others (4% of windows), while less than 4.2% discharged
    synchronously in at least half of the windows".
  why: Under both of the criterion's readings of the per-cell measure, 47% to 72% of pE cells fire with another in at
    most 4% of windows and 0.0% to 0.2% in at least half, so the claim is reproduced on the bounds; read as values to
    match, neither share is within tolerance and the claim would not be reproduced, or would show that the per-cell
    measure is not the paper's.
- claim: figs2d-interneurons-unchanged
  question: The expected value is a slope of 1.0005 with tolerance 0.0045, from a 95% interval of 0.996 to 1.005 in
    the Figure S2D legend. For about 126 interneurons, with log rates whose first-on-last packet correlation is about
    0.86 to 0.88 here, an interval this narrow is implausible (here the intervals are 0.07 to 0.17 wide). Does the
    legend's interval belong to this regression, or to another quantity (for example a test of the slope against 1,
    or a pooled fit), and should the expected value and criterion change? Raised by the verifier of watson-2016-03,
    round 1.
  passage: Figure S2D legend, "Comparison of log firing rates of individual putative interneurons during the first
    and last packets of SLEEP. Unlike for pE cells (Figure 2B) the regression line is not different from unity (slope
    95% confidence interval ... 0.996-1.005)".
  why: The claim is judged by whether the slope's 95% interval includes 1. Here it excludes 1 (CRCNS 0.836 [0.766,
    0.906], reading a), and the reverse regression is also below 1 (0.892), so part of the shortfall is regression to
    the mean, which an interval of 0.996 to 1.005 would not allow. If the legend's interval is of another quantity,
    the test would change and so might the outcome.
