# Questions from attempt grosmark-2016-02 (author revision after verifier round 2, 2026-11-26) about
# the claims file claims/grosmark-2016.yaml. Each is asked under docs/protocol.md, Author, step 1.6.
# The attempt applied the criteria as written and showed the reading the question raises as a variant.
questions:
- claim: place-cell-count
  asked: 2026-11-26
  question: The opening comment of the claims file reads the "5 cm Gaussian kernel" of the place-field
    method as its SD and says the SD-or-width choice "should not change outcomes". In this attempt
    it does change them. Should the kernel be an open reading (a) SD 5 cm, (b) 5 cm full width at
    half maximum, for place-cell-count and for the claims that use its place cells
    (fig2b-strong-contributors, fig2-pre-post-overlap, rigid-plastic-counts and those after them)?
  passage: 'Materials and Methods, Place Field Analysis, "This vector was smoothed with a 5 cm Gaussian
    kernel, and divided by the smoothed (5 cm Gaussian kernel) occupancy-by-position"; the paper does
    not say whether 5 cm is the SD or the width.'
  why: Raised by the round-2 verifier. With the SD the method finds 573 place cells per running direction
    (63.0%), outside the tolerance of 491 (54%), so place-cell-count is not reproduced; with 5 cm as
    the full width at half maximum it finds 507 (55.7%), both within tolerance. Carried into the per
    cell contribution under the main direction reading D-a, the width reading gives 232, 102, 200 and
    70 strongly contributing cells (all four within the tolerance of fig2b-strong-contributors, now
    not reproduced with 246, 120, 212 and 86) and 112 rigid and 112 plastic cells (within the
    tolerance of rigid-plastic-counts, now not reproduced with 120 and 120). The overlap is 68.6%
    against 71.7%, within tolerance under both. Three outcomes would be reproduced under the width
    reading.
