questions:
- claim: fig4c-cckdti-pc-silent-single-ap
  asked: 2026-11-07
  question: >-
    The criterion counts a pair as transmitting to the single AP before RIP when any sweep has a
    success. In the protocol every single AP after the first sweep comes 1600 ms after the RIP
    burst of the previous sweep, and the paper says the facilitating effect of a burst lasts at
    least that long. Should the criterion judge the single AP only where no burst precedes it
    (the first sweep), or the first sweeps before transmission builds up, so that a pair is
    silent when it fails there?
  passage: >-
    CCK+DTIs (seven of eight) did not transmit either for a single AP or for an AP following a
    RIP protocol AP burst (Results, The type of interneuron determines the properties of uIPSCs
    onto PCs, paragraph 1). This suggests that the facilitating effect of the burst is
    long-lasting because 1600 ms elapsed between the burst and the test impulse ... the first AP
    of stimulation trains resulted in an IPSC starting from the fourth trace on average (Results,
    Cell type-specific short-term plasticity, paragraph 7). Repeated 10 or 20 times, with 1600
    ms intervals between the last pulse of the trains and the subsequent single pulses (Methods,
    protocols paragraph).
  why: >-
    As written, 3 of the 7 CCK+DTI to PC pairs are silent (43%, criterion at least 85%), since
    the four pairs with a RIP recording succeed in 55 to 85% of sweeps. None of the four succeeds
    in the first sweep, so judging the first sweep gives 7 of 7 silent and the claim would be
    reproduced; judging sweeps 1 to 3 gives 5 of 7 (71%). Raised by the round-1 verifier.
- claim: fig5c-pv-rip-depression
  asked: 2026-11-07
  question: >-
    Reading (b) of the test is a Mann-Whitney U test of the per-pair relative amplitudes at AP n
    against those at AP 1, which are all 1 by construction. A two-sample test against a constant
    sample returns its smallest p whenever all values lie on one side of 1 (p 0.00106 for 7
    pairs), whatever their spread. Should reading (b) be kept, or replaced by a one-sample test
    against 1 (reading a), or a test on the raw amplitudes at AP n against AP 1?
  passage: >-
    PV+BC-PC pairs (n = 8) expressed short-term depression in response to the 3rd and 4th APs of
    the RIP protocol, whereas AAC-PC pairs (n = 9) expressed short-term depression in response to
    the 2nd AP (Results, Transmission of PV+ cells is depressing and homogenous; Figure 5C). The
    Statistical analysis paragraph of the Methods names Kruskal-Wallis and Mann-Whitney U tests.
  why: >-
    Under the authors' amplitudes (M4 a) the claim holds only with reading (b) (AAC 2nd AP p
    0.0204, against p 0.109 with the Wilcoxon test). The outcome here also holds under M4 b with
    the Wilcoxon test, so it does not change, but reading (b) would pass any set of values that
    all lie below 1. The same reading is used for fig5c-cck-rip-facilitation. Raised by the
    round-1 verifier.
- claim: fig6-cckbc-async-onset
  asked: 2026-11-07
  question: >-
    Both onset rules the criterion gives, a charge threshold of 2 SD over three APs on the
    reconstructed asynchronous current (a) and a failure of the current to return within 10% of
    the first IPSC peak before the next AP (b), mark release from the 1st to 4th AP of the EPI
    burst in the PV+BC and AAC to PC pairs, which the paper calls synchronous, and in the 160 Hz
    trains of nearly every pair of every type. Do these rules stand for the paper's procedure,
    or should the criterion say that the paper does not give one, so that the claim is blocked
    as methods_underspecified? The same rules decide cckdti-async-onset,
    fig10-cck-cck-heterogeneity and fig10-cck-cck-async.
  passage: >-
    Asynchronous release at CCK+BC-PC pairs appeared only during the EPI protocol between the
    10th and 19th AP [median (interquartile range) 11 (10-14)] (Results, Cell type-specific
    short-term plasticity, paragraph 6). By contrast to PV+BCs and AACs that reliably and
    precisely evoke IPSCs, CCK+ cells can release GABA asynchronously in a stimulation-dependent
    manner (same section). The Methods (Asynchronous charge calculation) define the immediate and
    delayed charge but no onset rule.
  why: >-
    Judged on the rules, the four claims are not reproduced (CCK+BC EPI median onset 1 to 3.5
    against 10 to 12; 9 of 9 CCK+ to CCK+ pairs asynchronous against 45 to 66%). If the rules do
    not stand for the paper's procedure, the claims are blocked. The data set's own AR marks in
    the _EPA tables give a CCK+BC median onset of 12 (quartiles 10 to 12.8) and a CCK+DTI median of
    8, close to the paper, but they are undocumented. Raised by the round-1 verifier. The
    round-2 verifier added that with the trains cut at the 10th AP, rule (b) flags the 1st AP
    of the 160 Hz train in nearly every pair of every type (11 of 12 PV+BC to PV+BC pairs), which
    summation of synchronous IPSCs at 160 Hz alone would do, so the rule cannot separate
    asynchronous release from summation.
