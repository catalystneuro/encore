- claim: fig6-peri-movement-space-best
  also: [fig3-maze-most-not-maintained, fig6-each-dimensionality, fig6-performance-vs-dimensionality,
    fig7a-shuffled-space-poor]
  attempt: 000128-churchland-2010-01
  asked: 2026-10-22
  question: Header M1 gives two readings of the proto-trial selection, T1 (each velocity component
    must correlate with the condition mean at r > 0.9) and T2 (the two components concatenated). On
    the dataset T1 keeps 1452 of 1967 trials with delay > 400 ms (73.8%), leaves two conditions (the
    straight leftward reaches, whose vertical velocity is flat) with no trial and several with one or
    two, while T2 keeps 1786 (90.8%) and at least 10 per condition. The paper says the selection kept
    typically about 90% of trials. Does that sentence allow T1 to be set aside, or are both readings
    to stand?
  passage: Supplemental Experimental Procedures, Task design and behavioral control ("Subsequent
    analysis was thus restricted to the subset of trials (typically ~90% of all trials) where the
    horizontal and vertical velocity profiles correlated with those of a reference 'proto-trial' with
    r > 0.9.").
  why: Five claims change outcome between the readings and are blocked as methods_underspecified.
    Under T2 the peri-movement space is best (0.518 against 0.424 kinematic), the shuffled control
    holds, and one maze neuron keeps its tuning; under T1 the peri-movement space falls below the
    kinematic and kitchen-sink spaces and below zero at k of 10 or more, the shuffled control fails
    and no neuron reaches r = 0.72. Performance against dimensionality goes the other way (holds under
    T1, not under T2).
  answer: >-
    T1 can be set aside; T2 alone stands. The paper does not say how the two components combine
    ("the horizontal and vertical velocity profiles correlated with those of a reference
    'proto-trial' with r > 0.9"), but it fixes two properties of its selection. It kept "typically
    ~90% of all trials", and every one of the 108 maze conditions stayed in the analyses. A third
    of the maze conditions are straight reaches without barriers, and for a straight horizontal
    reach the vertical velocity is flat, so a per-component threshold cannot keep those conditions.
    A reading that empties conditions is not the paper's selection. Header M1, and the criteria of
    fig4d-mean-correlation-jarray and fig6-peri-movement-space-best, now run T2 only. Claims and
    expected values unchanged.
  answered: 2026-10-22
- claim: fig4d-mean-correlation-jarray
  also: [fig3-maze-most-not-maintained, fig4-no-separate-populations, fig4e-correlation-time-course,
    suppfig1-population-averages, fig6-each-dimensionality]
  attempt: 000128-churchland-2010-01
  asked: 2026-10-22
  question: Header M6 reads "tuning" as the range over conditions (S1) or the SD over conditions (S2).
    With the J-array threshold of more than 5 spikes/s, S2 selects 6 of 182 units, and none that also
    has peri-movement tuning at least 1.5 times as strong, so the correlation claims have no neuron
    under S2. Does the paper allow S2 with these thresholds, or is it to be dropped?
  passage: Methods, Neural recordings and datasets ("restricted to neurons with at least 10 spikes/s of
    preparatory tuning" and ">5 spikes/s of preparatory tuning" for the arrays); Methods,
    Correlations ("at least 1.5 times as strong as preparatory tuning").
  why: S2 gives no result for fig3, fig4d, fig4-no-separate-populations, fig4e and suppfig1, which are
    decided on S1 alone; in fig6-each-dimensionality, S2 under T2 makes L1 fail where S1 makes it
    hold.
  answer: >-
    S2 is to be dropped. The paper never defines the measure of tuning; it gives only the
    thresholds ("at least 10 spikes/s of preparatory tuning", ">5 spikes/s of preparatory tuning"
    for the arrays, and peri-movement tuning "at least 1.5 times as strong as preparatory
    tuning"). With those thresholds the paper had J-array neurons tuned in both epochs, since
    Figure 4D gives their distribution with mean r = 0.13 and p = 0.03. A measure that leaves no
    such neuron is not the paper's. The Methods use one measure for both thresholds, so S2 is
    set aside throughout. Header M6 and the criteria of fig3-maze-most-not-maintained,
    fig4d-mean-correlation-jarray, fig6-peri-movement-space-best and prep-dimensionality now use
    S1 only. Claims and expected values unchanged.
  answered: 2026-10-22
- claim: suppfig1-population-averages
  attempt: 000128-churchland-2010-01
  asked: 2026-10-22
  question: The criterion divides each neuron's rates by "its maximum rate" without saying over what.
    Is it the maximum over all conditions and times (the attempt's reading a) or over the four plotted
    conditions (reading b)?
  passage: Supplemental Figure 1 legend, as cited in the criterion.
  why: R2 (below a quarter) holds under (a) and not under (b); R1 holds under both, so the outcome
    does not change at present, but would if R1 were dropped.
  answer: >-
    The paper does not say. The Supplemental Figure 1 legend has only "normalizing each neuron's
    activity by its maximum rate (results were similar without normalization)". The criterion
    of suppfig1-population-averages now names both readings, (a) the maximum over all conditions
    and plotted times and (b) over the four plotted conditions, and both are run. The claim and
    its rule are unchanged.
  answered: 2026-10-22
