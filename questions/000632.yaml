- claim: fig2-180-cancellation
  attempt: 000632-kim-2023-01
  asked: 2026-10-31
  question: The opening comment says all claims use the paper's own recordings (data dataset). The
    Figure 2 recordings are not in 000632 but are public in DANDI:000631 (version 0.231012.1508, 15
    assets, single- and paired-pulse trains at 1 Hz and 833 kHz), whose metadata name this paper's DOI
    as IsPublishedIn. Should fig2-180-cancellation, fig2-crossover-angle, fig2-facilitation-plateau and
    fig2-60-fold-co-counter be marked data elsewhere, with DANDI:000631 at that version as where?
  passage: Data Availability Statement ("The data presented in this study are available on request
    from the corresponding author"); Results 2.1 and the Figure 2 legend; the dandiset's title names
    only the Figure 3 experiment.
  why: As the file has them the four claims are scoped to 000632, which does not hold their data, so
    they are blocked. Marked elsewhere they would be tested on 000631, unless the ROI angles, which
    come from a simulation the paper does not give, block them for metadata.
