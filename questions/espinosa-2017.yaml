questions:
- claim: fig1-bf-response-classes
  asked: 2026-11-09
  question: >-
    The opening comment defines a unit's percent change as its mean normalized rate over the pulse
    minus 1, times 100, where the rate is normalized by the spikes in the whole 30-s window, which
    includes the pulse. The paper calls the same scale the "percentage of change in firing rate from
    baseline" (Supplementary Figure 5A). Should the percent change be read against the baseline, for
    example the rate during the pulse over the rate before it, and should the criterion name that as
    a reading?
  passage: >-
    We found a minor fraction of basal forebrain cells (8.8%, n = 29 units) responding ... by robustly
    decreasing their activity (49.2 ± 5.1%). Along with somatostatin cells decreasing their firing
    rate, another neuronal population (17%, n = 56 units) increased its activity (39.6 ± 7.9%)
    (Results, Synaptic output of the basal forebrain, paragraph 2). Vertical scale depicts percentage
    of change in firing rate from baseline (Supplementary Figure 5A legend).
  why: >-
    A window total that includes the pulse moves toward the pulse rate, so the measure in the claims
    file understates a change against baseline (the round-1 verifier found +33% for a true +40% on
    synthetic units). On the data set's own classes (column 17 of data_correlation.mat, 56 excited and
    30 inhibited), the claims file's measure gives an increase of 33.5 to 35.7% and a decrease of 43.1
    to 46.4%; the rate during the pulse against the 5 s before gives 39.1% and 51.9%, both within
    tolerance of 39.6 and 49.2. The outcome of fig1-bf-response-classes does not change, since its
    counts are outside tolerance under every reading, but a later attempt that recovers the classes
    would be judged on this measure. Raised by the round-1 verifier.
