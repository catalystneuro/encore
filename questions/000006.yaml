- claim: pt-types-transcriptomic
  attempt: 000006-economo-2018-02
  asked: 2026-10-20
  question: The claim is tested on the single-cell annotation in Seq.zip (SingleCellAnnotation.txt). The
    claims file gives no rule for counting the ALM glutamatergic clusters. The attempt counts 27 with
    the clusters not named for VISp (the Cajal-Retzius cluster included), 26 without it, 25 with most of
    their cells in ALM and 45 with any ALM cell. Which rule does the paper's 27 follow?
  passage: Results, Two types of PT neuron in layer 5, paragraph 1; Fig. 1 legend ("The transcriptomic
    cluster corresponding to Cajal-Retzius cells was excluded here"); Methods, scRNA-seq analysis.
  why: The attempt took the count as a reading of a reported number (reproduced under the matching
    reading); a rule from a reader would decide it.
- claim: pt-projection-cluster-mapping
  attempt: 000006-economo-2018-02
  asked: 2026-10-20
  question: The annotation has two injection-site fields, inj_primary_label and inj_roi_label, and a cell
    must be grouped into medulla, thalamus, superior colliculus or pons. With inj_primary_label and the
    Allen ontology (medulla IRN, GRN, PARN; thalamus VAL, PF, MD; pons PG, PRNc) the medulla, thalamus
    and pons counts match the paper; with inj_roi_label the medulla count is 58 and the superior
    colliculus count matches. Which grouping did the paper use?
  passage: Results, Two types of PT neuron in layer 5, paragraph 4; Methods, scRNA-seq (n = 62 medulla
    injection; n = 94 thalamus; n = 100 pons; n = 97 superior colliculus).
  why: Under both fields all medulla-labelled cells are Slco2a1 and 91 of 94 thalamus-labelled cells are
    Npsr1 or Hpgd; the medulla count of 62 holds under one.
