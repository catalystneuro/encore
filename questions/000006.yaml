  question: The claim is tested on the single-cell annotation in Seq.zip (SingleCellAnnotation.txt). The
    claims file gives no rule for counting the ALM glutamatergic clusters. The attempt counts 27 with
    the clusters not named for VISp (the Cajal-Retzius cluster included), 26 without it, 25 with most of
