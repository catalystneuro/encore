# Questions from attempt 000006-economo-2018-02 (author, 2026-10-20) about
# claims/000006/10.1038-s41586-018-0642-9.yaml. Each claim was run under every reading named here;
# the attempt record says which ones decide the outcome.
dandiset: "000006"
paper: doi:10.1038/s41586-018-0642-9
questions:
- claim: pt-tagged-units
  attempt: 000006-economo-2018-02
  asked: 2026-10-20
  question: The criterion says the reading of the unit selection that reproduces the 61 and 69 units is
    the one the other electrophysiology claims use. On the dandiset neither does (the code's rule keeps
    44 PTupper and 56 PTlower units, the Methods' session rule 42 and 63), because 11 of the paper's
    sessions are not in it. Which selection should the other claims use when neither reading matches?
  passage: Methods, Electrophysiology data analysis ("Units recorded during behavioural sessions in which
    performance was not greater than 65% ... 13 units were rejected; 130 were kept"); the claims file's
    opening comment, Unit inclusion.
  why: pt-spike-rates-similar, pt-variance-explained and pt-single-neuron-early-selectivity give
    different outcomes under the two selections, and are blocked until it is fixed. On the paper's
    processed data the code's rule gives 61 and 69.
  answered: 2026-10-20
  answer: Use the code's per-unit rule. The Methods report the selection's outcome ("13 units were
    rejected; 130 were kept"), and on the paper's processed data the code's rule (loadAndProcessData.m)
    is the one that gives it, with 61 and 69, as the attempt reports. The Methods' session rule is a
    variant. Missing sessions on the dandiset do not change which rule is the paper's. Recorded in the
    opening comment (Unit inclusion) and the pt-tagged-units criterion.
- claim: pt-single-neuron-early-selectivity
  attempt: 000006-economo-2018-02
  asked: 2026-10-20
  question: The go-cue aligned rates come precomputed in the paper's data files, so the claims file leaves
    their trial range open (the unit's range, or all trials). Can the code settle it? In the processed
    file data_structure_anm372906_WR40_psth.mat, every unit of a session has rates for the same trials,
    the eleventh to the tenth before the session's last correct trial.
  passage: The claims file's opening comment, Trial range per unit; loadAndProcessData.m (getData reads
    the precomputed psth; ObjToLickPSTH builds the lick-aligned rates over the unit's range).
  why: With the code's selection, reading (a) of the measure is reproduced with the unit's range and not
    reproduced with all trials (Mann-Whitney p 0.0041 against 0.026), so the claim is blocked.
  answered: 2026-10-20
  answer: Yes. The premise holds for that session but not for the files as
    a whole. In the processed files (Ephys.zip, Code/ProcessedData, variable psth, which getData reads),
    the go-cue rates of units in one session often start and end on different trials (WR29.5 session 2
    starts at trial 12 for one unit and 41 for another; WR33 session 2 ends at 110, 159 and 188 for
    different units). Every range starts at trial 11 or later and ends 10 or more trials before the
    session's last correct trial. That fits the unit's range of ObjToLickPSTH, reading (a); all trials
    is a variant. The claim's criterion and the opening comment (Trial range per unit) now say so.
- claim: pt-upper-early-preparatory
  attempt: 000006-economo-2018-02
  asked: 2026-10-20
  question: The criterion gives two rules for "larger" ((i) medians; (ii) the PTupper 5th percentile above
    the PTlower median) and outcomes for each, and "more consistent" as a smaller s.d. over median of the
    bootstrap. Under (i) the claim is partially reproduced in 31 of 32 combinations of the other readings
    and under (ii) not reproduced in 27. Which rule decides?
  passage: Results, Preparatory activity, paragraph 2 ("selectivity was larger and more consistent across
    trials in the PTupper population"); Fig. 5b.
  why: The two rules give different outcomes, so the claim is blocked, and with it pt-upper-persistent,
    pt-cohort-control and pt-types-differ-in-timing, which depend on it.
  answered: 2026-10-20
  answer: The paper does not give it. The Results say "selectivity was larger
    and more consistent across trials in the PTupper population" with no number or test. Fig. 5b and its
    legend give only the bootstrap median and 5-95% band, and Projections.m makes no comparison between
    the populations. Both rules stay, and the claim is methods_underspecified while they differ. Noted in
    the criterion.
- claim: pt-cd-change-at-go-cue
  attempt: 000006-economo-2018-02
  asked: 2026-10-20
  question: The levels 0.5 and 0.75 give different outcomes. At 0.5 PTupper's correlation falls below the
    level 0.37 to 0.40 s after the go cue (reproduced); at 0.75 it falls at 0.17 to 0.19 s, under the
    0.2 s bound (partially reproduced). Can the paper or its code fix the level, or the measure of how
    fast the coding direction changes?
  passage: Results, Movement commands, paragraph 2; Extended Data Fig. 7c, e legends; CDCorrelation.m.
  why: The claim is blocked until one reading decides.
  answered: 2026-10-20
  answer: The paper does not give it. The Extended Data Fig. 7c legend says the
    change is abrupt "immediately after the go cue onset" in PTlower and, in PTupper, "more slowly (over
    several hundred milliseconds), largely after initiation of movement". The 7e legend gives no level,
    and CDCorrelation.m only plots the normalised correlation, with a dotted line at 0.05 s, and computes
    no crossing time. Both levels stay, and the claim is methods_underspecified while they differ. Noted
    in the criterion.
- claim: pt-lower-movement-termination
  attempt: 000006-economo-2018-02
  asked: 2026-10-20
  question: The two window readings give different outcomes for CDgo (window (a) holds with the code's
    selection and the 4 and 8 mice; window (b) does not under any reading). Can the paper fix the
    windows? Also, the files do not assign licks to trials; the attempt rebuilds each trial's last lick
    from the stored order (98.1% agreement with the processed data). Is that acceptable for this claim?
  passage: Results, Movement commands, paragraph 3; Extended Data Fig. 10a, b legends.
  why: The claim is blocked until one reading decides.
  answered: 2026-10-20
  answer: The paper gives no windows. The Extended Data Fig. 10a, b legends
    give only the 5-95% band, and Projections.m plots the lick-aligned selectivity with no window or
    test, so both readings stay. The last lick is the code's (getLickInfo), the latest left or right lick
    after the go cue in the trial. The paper says nothing about rebuilding it when licks are not assigned
    to trials. A rebuilt last lick is a deviation, acceptable if the outcome is the same when the trials
    where it disagrees with the processed data are left out; show that. Noted in the criterion.
