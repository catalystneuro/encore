- claim: pt-bulk-sc-fold-change-correlation
  attempt: 000006-economo-2018-02
  asked: 2026-10-20
  question: The claim has no criterion or method. The attempt follows the code (Seq/bulkVsSC.m on
    Seq.zip), which takes the bulk values as stored, and also the legend's log2(CPM + 1). Is the code's
    method the one to use?
  passage: Extended Data Fig. 4i legend; Seq/bulkVsSC.m.
  why: Both give r within tolerance (0.867 and 0.874), so the outcome does not depend on it.
  answered: 2026-10-20
  answer: Partly. The legend fixes the measure, fold change "measured as
    log2(CPM + 1)". The code (bulkVsSC.m) applies log2(x + 1) to bulk_data.txt as stored, which holds
    counts, not CPM (columns sum to about 1e7). Where they differ the legend is followed. The genes,
    cells and replicates are taken from the code, and the code's bulk values are a variant. Recorded in
    the criterion.
- claim: pt-upper-thalamus-projection
  attempt: 000006-economo-2018-02
  asked: 2026-10-20
  question: What counts as innervating the thalamus in the reconstructions? With any axon terminus, 11 of
    the code's 12 neurons do; with axon length, 11; with more termini in the thalamus than in the medulla,
    8, the code's thalamus group. The same question holds for pt-lower-medulla-projection ("bypassed the
    thalamus"). The paper's code groups the neurons by hand (AxonReconstructions.m) and reports termini
    and lengths per structure.
  passage: Results, Two types of PT neuron in layer 5, paragraph 2; Extended Data Fig. 2a-d legends;
    Axons/AxonReconstructions.m.
  why: The readings give different counts, so both claims are blocked.
  answered: 2026-10-20
  answer: The paper gives no rule. Supplementary data table 1 (read in the
    publisher's Supplementary Information PDF) assigns the 12 complete neurons to the two types, the same
    as the hand grouping in AxonReconstructions.m. Extended Data Fig. 2a, c plot thalamic lengths and
    termini for both groups. The criteria of both claims now name three readings (any terminus, any
    length, more termini in the thalamus than in the medulla, and the converse for "bypassed"). The 8
    and the 4 are reported counts, so each holds if it matches under one reading.
