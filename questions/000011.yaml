# Questions from attempt 000011-li-2016-01 (author, 2026-10-21) about the claims file
# claims/000011/10.1038-nature17643.yaml. Each is asked under docs/protocol.md, Author, step 1.6; the
# attempt runs every reading it can see, and a claim whose readings give different outcomes is
# blocked as methods_underspecified until the answer.
dandiset: "000011"
paper: doi:10.1038/nature17643
questions:
- claim: selective-fraction, ed4-return-to-trajectory, fig1f-spike-rate-recovery, fig1g-selectivity-recovery,
    ed2b-silencing-strength, ed2e-no-rebound, fig2-recordings-recovery, fig2e-selectivity-recovery-times,
    ed7-larger-photoinhibition, ed7e-roc-larger-photoinhibition and the claims on convention A
  asked: 2026-10-21
  question: Do lick-early trials enter the neural analyses (selectivity tests, rate-change tests,
    selectivity time courses, activity space)? In the files they are 18% of behaving trials; in them
    the delay restarts after the early lick, so the go cue comes later than in other trials, and the
    photostimulus event is logged at the restarted delay, up to 1.6 s after the light in the laser
    trace.
  passage: Methods, Behavioral data analysis, "Performance was computed as the fraction of correct
    reports, excluding 'lick early' trials" (for behaviour only); Methods, Electrophysiology data
    analysis, "We therefore used all trials (correct and incorrect) to compute selectivity when
    quantifying selectivity changes caused by photoinhibition". No passage says whether lick-early
    trials enter the neural analyses.
  why: Counts and times move with it; for example the early-delay recovery time of fig1g is 250 to
    550 ms with lick-early trials dropped and 650 to 1400 ms with them kept, and with the units of the
    unlabelled sessions added the selective-fraction counts are all within tolerance only when they
    are dropped. Both readings are run.
- claim: fig1g-selectivity-recovery, fig2e-selectivity-recovery-times, fig2-recordings-recovery,
    ed7-larger-photoinhibition
  asked: 2026-10-21
  question: Convention D determines each neuron's preferred trial type from 10 trials. From the spike
    counts of which window, the whole trial (sample onset to the end of the response epoch), the
    delay epoch, or each time bin separately?
  passage: Methods, Electrophysiology data analysis, "we first determined each neuron's preferred
    trial type using spike counts from a subset of the trials (10 trials), selectivity is calculated
    as the spike rate difference between the trial types on the remaining data."
  why: The sign of a weakly selective neuron's selectivity, and so the population selectivity and the
    recovery times, depend on the window. The whole trial and the delay epoch are run; with lick-early
    trials kept, fig1g holds with one and not with the other.
- claim: fig1g-selectivity-recovery, fig2e-selectivity-recovery-times, ed7-larger-photoinhibition
  asked: 2026-10-21
  question: '"Selective neurons tested for >3 trials in all conditions": more than 3 trials in each
    condition, or in each condition and trial type (lick left, lick right)? Either way, 138 to 173
    neurons pass in experiment 1 (paper 55), 221 to 293 in experiment 2 (paper 143) and 58 to 62 in
    experiment 3 (paper 40). Is there a further selection behind the legend counts?'
  passage: Figure 1g legend, "selective neurons tested for >3 trials in all conditions, n=55"; Figure
    2e legend, "n=143"; Extended Data Fig. 7d, "n=40".
  why: The included population sets the recovery times. The claims file's words (per condition) decide
    the outcomes here; per condition and trial type is shown as a variant.
- claim: fig1g-selectivity-recovery, fig2e-selectivity-recovery-times, fig2-recordings-recovery,
    ed7-larger-photoinhibition
  asked: 2026-10-21
  question: Which time is a selectivity bin given when the recovery time is read, its centre or its
    end? And how far after the offset does the search for the first bin above 80% of control run (to
    the go cue, or into the response epoch)?
  passage: Methods, "we looked for the first time bin when selectivity on photoinhibition trials
    reached 80 % of the control selectivity"; the late-delay recovery of Fig. 1g (327 ms after an
    offset 0.3 s before the go cue) falls after the go cue, so the search here runs to the end of the
    windows (1.6 s after the go cue).
  why: The two labels differ by half the bin (100 or 200 ms). For ed7 the ipsilateral four-spot time
    is within tolerance with centre labels and outside it with end labels.
- claim: cd-stable-over-epochs, cd-captures-selectivity, fig3c-cd-recovery-roc, ed8-roc-during-photoinhibition,
    fig3c-cd-predicts-movement, fig3d-persistent-mode, fig3e-ramping-mode, fig4-bilateral-cd-predicts-movement,
    ed6b-session-bias-predicted, ed9c-cd-window-robust
  asked: 2026-10-21
  question: Convention A's rule (more than 5 neurons recorded simultaneously for more than 5 trials per
    condition) selects 24 of the 26 experiment-2 sessions here, with 6 to 37 putative pyramidal
    neurons (19 to 23 sessions when trials are counted per trial type), against the paper's 16
    sessions with 6 to 20 neurons (mean 11). Which neurons and sessions did the paper use (only
    selective neurons, only neurons recorded over the whole session, a cap on the number of neurons)?
  passage: Results, "6-20 neurons recorded simultaneously; average, 11 neurons; 16 sessions"; Methods,
    "with > 5 neurons recorded simultaneously for > 5 trials per condition (16/38 sessions)".
  why: The ROC values depend on the neurons projected; the control ROC here is 0.65 to 0.68 against
    the paper's 0.76. The claims file's rule is followed.
- claim: ed4-return-to-trajectory
  asked: 2026-10-21
  question: Is the selection test (end against beginning of the delay, 400 ms windows) paired over
    trials or unpaired? What bin is the normalised rate time course, whose RMS is taken, computed in?
  passage: Extended Data Fig. 4b, "significant spike rate decrease at the end of the delay epoch
    compared to the beginning of the delay epoch (p < 0.05, two-tailed t-test; 400 ms windows; pooled
    across trial types)"; Fig. 1e, "PSTH, averaged over 200 ms".
  why: The selection gives 47 to 67 neurons here (paper 27). Both tests and 200 ms and 400 ms bins
    are run; none of them makes the time-matched RMS smaller.
- claim: ed6a-bilateral-inconsistent-bias
  asked: 2026-10-21
  question: The criterion counts sessions whose bias is significant by Fisher's exact test, without
    saying which 2 x 2 table. Is it, on bilateral trials, trial type by correct, or licked side by
    condition (control against bilateral)?
  passage: Extended Data Fig. 6a, "Behavioral performance on control and bilateral photoinhibition
    trials"; no test is given.
  why: The number of significant sessions differs (12 or 13). Both are run and both reproduce.
- claim: cd-captures-selectivity, fig3d-persistent-mode, fig3e-ramping-mode
  asked: 2026-10-21
  question: (1) Are the ipsilateral trials that build modes 2 and 3 split like the control trials, so
    that projections use other ipsilateral trials? (2) Which trials give the trial-averaged activity
    whose captured selectivity and variance are reported (the training trials, or all correct control
    trials)? (3) The sign of the ramping mode (an SVD eigenvector) is arbitrary; how is it oriented
    before judging that it rises over the delay?
  passage: Methods, "The modes were computed using a subset of control trials (correct trials only)
    and ipsilateral perturbation trials. The projections in the figures are for independent control
    trials and perturbation trials."
  why: Without a rule for the sign, "rises" cannot be judged; here the mode is oriented to a positive
    weight sum, and the change over the delay is small with either sign.
- claim: ed9f-reaction-time
  asked: 2026-10-21
  question: The files hold no lick times, only `lick_trace` (an analogue signal in 5 s chunks per
    trial, described as the tongue movement when licking). What rule gives the first lick after the go
    cue from it (a threshold on the raw signal, or a number of standard deviations above a baseline,
    and over which window)?
  passage: No passage of the paper gives it.
  why: The reaction time moves with the threshold. The claim is blocked as methods_underspecified
    until answered.
- claim: fig6-modular-models-recover
  asked: 2026-10-21
  question: The modular attractor's noise has variance 0.01. Is it white noise of that intensity
    (Euler-Maruyama increments of sd sqrt(0.01 dt)/tau), or a sample of variance 0.01 drawn every
    integration step and integrated like an input? And what is the integration step?
  passage: Methods, Modular attractor, "All neurons received a non-selective tonic input T i (t) with
    amplitude 0.5 and noise ξ i ( t ) with variance 0.01."
  why: With 1 ms steps, Euler-Maruyama noise overwhelms the 50 ms input, and the network ends at the
    instructed fixed point in about half of unperturbed trials; with per-step samples it ends there in
    all of them and the claim's attractor part holds.
