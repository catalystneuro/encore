- claim: fig6-modular-models-recover
  asked: 2026-10-21
  question: The modular attractor's noise has variance 0.01. Is it white noise of that intensity
    (Euler-Maruyama increments of sd sqrt(0.01 dt)/tau), or a sample of variance 0.01 drawn every
    integration step and integrated like an input? And what is the integration step?
  passage: Methods, Modular attractor, "All neurons received a non-selective tonic input T i (t) with
    amplitude 0.5 and noise ξ i ( t ) with variance 0.01."
  why: With 1 ms steps, Euler-Maruyama noise overwhelms the 50 ms input, and the network ends at the
    instructed fixed point in about half of unperturbed trials; with per-step samples it ends there in
    all of them and the claim's attractor part holds.
  answer: The paper does not give either. The Methods say "ξ i ( t ) is Gaussian random noise"
    and "noise ξ i ( t ) with variance 0.01", with no integration step and no scaling with step.
    The criterion now names n1 (Euler-Maruyama white noise) and n2 (a variance 0.01 sample each
    step, integrated as an input), with steps h1 (1 ms) and h2 (0.1 ms), and requires the
    outcome under all, else methods_underspecified.
  answered: 2026-10-21
