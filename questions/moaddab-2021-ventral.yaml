questions:
- claim: fig5d-f-low-reward-cue-correlations
  asked: 2026-11-06
  question: >-
    The expected R2 values carry a 10% tolerance (0.08 +- 0.008, 0.16 +- 0.016, 0.006 +- 0.0006).
    Is a tolerance of 10% of R2 what the paper's numbers support, given that the paper reports
    each R2 with its p value only, and that the sampling error of R2 over 72 to 74 neurons is far
    larger (for R2 = 0.006 the tolerance is 0.0006)? The same question applies to
    fig6g-excited-reward-cue-correlations (0.09, 0.12, 0.08 over 131 neurons).
  passage: >-
    Results, Low firing neurons show opposing responses to threat and reward, paragraph 3,
    "showed greater danger firing decreases (R2 = 0.08, p = 0.01; Fig. 5d). Reward and
    uncertainty firing were also negatively correlated (R2 = 0.16, p = 4.63 x 10-4; Fig. 5e), but
    zero firing relationship was observed for reward and safety (R2 = 0.006, p = 0.51"; Results,
    Cue-excited neurons increase firing to reward, "(R2 = 0.09, p = 6.44 x 10-4), uncertainty (R2
    = 0.12, p = 5.75 x 10-5), and safety peak (R2 = 0.08, p = 8.20 x 10-4".
  why: >-
    Both claims are partially reproduced only because of the R2 tolerance. Under every reading
    the signs and p values hold (Low, reward against danger r = -0.25 to -0.33, against
    uncertainty -0.37 to -0.51, both p < 0.05, safety p >= 0.48; cue-excited, all three r = 0.19
    to 0.36, p < 0.05). For example the main reading gives R2 = 0.067, 0.154, 0.005 for Low
    neurons, against 0.08, 0.16, 0.006. A tolerance set from the sampling error of r would make
    both claims reproduced.
- claim: supp5-low-cue-correlations
  asked: 2026-11-06
  question: >-
    The criterion correlates the onset period as the first 1 s of cue. The Results point to
    Supplementary Fig. 5, which the claims file did not read, and the authors' script correlates
    these clusters over the first 5 s of cue, the late cue and the delay (vpAnalysis.m, lines
    1719-1727, variables named firstFive). Which periods does Supplementary Fig. 5 use?
  passage: >-
    Results, Differential inhibition of firing is maximal to danger, paragraph 5, "positive firing
    relationships were commonly observed for threat cues, danger and uncertainty, but zero or even
    negative firing relationships were observed for uncertainty and safety" (Supplementary Fig. 5).
  why: >-
    The claim is not reproduced because the Low cluster's onset uncertainty-safety correlation
    over the first 1 s is positive (r = 0.36, p = 0.0014, three-cue pool). Over the first 5 s it
    is 0.03 (p = 0.82), and the criterion would be met for both clusters (Low danger-uncertainty
    r = 0.36, 0.49, 0.53, all p < 0.002; Intermediate 0.74 and 0.35 in two periods).
- claim: fig6b-excited-period-firing
  asked: 2026-11-06
  question: >-
    The criterion asks that the late-cue and delay safety intervals contain zero. The paper says
    only that firing increases were limited to the threat cues after onset. Does the paper say
    that safety firing did not differ from baseline, or only that it did not increase? A safety
    interval below zero would not contradict the second reading.
  passage: >-
    Results, Differential increases in firing are maximal to danger, paragraph 2, "Firing
    increases were observed to all cues at onset, but only to the threat cues, danger and
    uncertainty, in the remaining periods (Fig. 6b)."
  why: >-
    The delay safety interval lies below zero under every reading (three-cue pool -0.162 [-0.254,
    -0.077]; the authors' normalization -0.094 [-0.148, -0.042]), and the late-cue safety interval
    under the three-cue pool ([-0.150, -0.004]) and the authors' normalization ([-0.098, -0.008]).
    With the authors' normalization every other part of the criterion holds, so under the second reading that variant would meet
    it. With the Methods' normalization the six difference means are still outside tolerance,
    so the outcome on the claims file's main readings would not change.
- claim: kmeans-three-clusters
  asked: 2026-11-06
  question: >-
    Reading O7 names 100 replicates and a fixed seed as standard choices, and the header says
    the seed cannot change a conclusion beyond the edge of an interval. The Methods name Matlab's
    kmeans function, whose default is one start (k-means++), and the authors' script runs it
    once after rng(1). Should the reading be Matlab's default of one start, as the Methods name
    it, in place of 100 replicates?
  passage: >-
    Methods, Firing and waveform characteristics, "Clustering was performed using the Matlab
    kmeans function. K-means clustering used baseline firing rate and four additional
    characteristics ... and identified three clusters within the population."
  why: >-
    With 100 restarts no reading gives counts within tolerance (58/46/22 or 56/48/22 on the
    paper's 126 neurons). One start after rng(1) gives 74/34/18 and the paper's F values to the
    printed digits. Over 300 seeds one start reaches that partition in 98, so the seed does
    change the clusters, and every claim on the clusters depends on it.
- claim: fig6-excited-peak-cue-vs-reward
  asked: 2026-11-06
  question: >-
    The criterion compares cue and reward peak values under readings O4 (i) and (ii). Under
    (i) the cue values are Z-scored over the cue bins and the reward values over the 16 reward
    bins of the neuron, so their difference has no common unit. Should (i) be left out of this
    claim's readings?
  passage: >-
    Results, Cue-excited neurons increase firing to reward, paragraph 1, "peak danger firing
    (M = 0.40, 95% CI [0.13, 0.65]), but not peak uncertainty (M = 0.13, 95% CI [-0.07, 0.35]),
    and safety (M = -0.08, 95% CI [-0.30, 0.13]) firing, differed from peak reward firing".
  why: >-
    Scaling (i) is the only claims-file reading under which the pattern holds (three-cue pool,
    O5 (b), danger 0.632 [0.256, 1.063]), with the means outside tolerance. Under (ii) no reading
    gives the pattern. Without (i) the claim would be not reproduced on the claims file's
    readings, and the authors' normalization (a variant) would still give the paper's values.
