# Questions from attempt semenov-2026-02 (author revision after verifier round 1, 2026-11-02)
# about claims/001516/10.1016-j.bioelechem.2026.109283.yaml, asked under docs/protocol.md, "Hand over
# for verification". The verifier reported this as a place where the claims file's premise is not
# supported; the claims were tested as the file has them.
dataset: DANDI:001516
paper: doi:10.1016/j.bioelechem.2026.109283
questions:
- claim: fig7a-cosine-profiles
  asked: 2026-11-02
  question: The claims file's header reads the dandiset's title and description as pointing at the
    two-pulse recovery experiment of Fig. 7 (Results 3.7), adds fig7a-cosine-profiles because "Fig. 7 is
    this dandiset's experiment", and plans collapsing 20 and 40 images as the only deviation. The files
    name FluoVolt with a FITC cube in all 72 sets, 1.00-mm electrodes, single pulses and pairs at 50 to
    250 V (described as 0.15 to 1.57 kV/cm) and intervals of 1, 5, 25, 125 and 250 us, where Fig. 7 used
    Di-8-ANEPPS, 1.6-mm electrodes, conditioning at 150 to 1400 V/cm and a 5-us interval only. Should the
    header and the Fig. 7 claims (fig7a-cosine-profiles, fig7b-charging-during-pulse,
    fig7ab-test-pulse-recovery, fig7c-fast-conductivity-drop, fig7c-full-reseal-mild) say that the
    dandiset holds a FluoVolt two-pulse experiment the paper does not report, and that no claim can be
    tested on it?
  passage: Each conditioning pulse was followed in 5 us with a 1-us, 150 V/cm test pulse (Results 3.7);
    Cells loaded with Di-8-ANEPPS (Fig. 7 legend); two tungsten rods 1.6 mm apart (Methods 2.2); and
    Future studies should focus on the time course of membrane recovery, perhaps using the same two-pulse
    protocol as in Fig. 7, but varying the time interval between the pulses (Discussion).
  why: The outcomes do not change. All five Fig. 7 claims are blocked as data_missing because the dye,
    field levels, electrode spacing and number of cells differ from the paper's, as the claims file's
    criteria name Di-8-ANEPPS and n = 5. If the reader kept the premise, a later attempt might be asked
    to test the Fig. 7 criteria on the dataset's FluoVolt 5-us pairs (c2, c9), which the notebook shows
    only as a variant.
