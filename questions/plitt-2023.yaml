dandiset: "001710"
paper: doi:10.1101/2023.11.20.567978
questions:
- claim: vr-reward-location-learning
  asked: 2026-11-05
  question: The criterion's day part asks for a significant day main effect "with the day 6 mean
    above the day 1 mean". The paper reports only the day main effect of the familiar-trial
    anticipatory licking ANOVA, and the claim's statement says licking "changed over days". Should
    the day part ask for an increase, or only for the day effect?
  passage: Mixed effects ANOVA, virus main effect F(1,15)=10.66 p=5.22x10-4, day main effect
    F(5,75)=7.55 p=8.61x10-6, interaction F(5,75)=.801 p=.55 (Figure 1F legend). Both Cre and
    control mice rapidly learned the context-dependent reward locations (Results, paragraph 4).
  why: Here the day effect is significant (p=0.007 and p=0.0006 under the two rate readings), but
    the day 6 mean (2.67 and 2.38 licks/s) is below the day 1 mean (3.22 and 3.17). With an increase
    required, the day part fails and the claim is partially reproduced; with only the day effect
    required, both parts hold under speed reading (ii) and it would be reproduced.
- claim: fig6d-field-com-shift-larger-control
  asked: 2026-11-05
  question: The criterion takes the COM on "trial 1" relative to the field's mean COM over laps
    from the formation lap on, and asks for the control value to be "more negative (backward)".
    Under that measure a field that moves backward after its formation lap has a positive value on
    the formation lap (it starts ahead of its later mean). Which sign does the paper's "greater
    shift" in control mean, and is "trial 1" the formation lap or the lap after it?
  passage: The COM of place cell activity on each trial, relative to the average place field COM,
    following the place field's formation lap ... After controlling for formation lap running speed
    through the place field, COM shifts were significantly greater on day 1 for control animals
    (Figure 6D legend; also Figure S8E, "Wald test for significant mean effect of virus on trial 1
    COM shift").
  why: Here the outcome does not depend on it, as the day 1 virus term is far from significant
    under every reading and sign (p=0.815, 0.984 and 0.956 for the formation lap, the next lap, and
    next minus formation lap; effects under 0.1 cm). A later attempt that finds an effect would
    need the sign to judge it.
- claim: fig7h-no-trial-correlation-boost-cre
  asked: 2026-11-05
  question: The paper's statement is that Cre reactivated cells "do not have higher" trial by trial
    correlation (Holm-corrected p>.05). The criterion takes both Cre one-sample tests two-sided and
    asks for p >= 0.05. Should the absence be judged by a one-sided test (higher than 0), so that a
    significant decrease does not count against it?
  passage: In Cre animals, reactivated cells do not have higher trial x trial correlation than
    non-reactivated cells for either trial type (Holm-corrected p>.05) (Figure 7H legend).
  why: Here the Cre differences are negative under every reading (-0.022 to -0.121) and
    significantly so under five of six (Holm p=0.0006 to 0.044), so the two-sided test fails and a
    one-sided test would pass. The claim is now blocked for another reason (the HSE detector, see
    figs9a-hse-trial-proportion-no-difference), so the answer bears on a later attempt.
