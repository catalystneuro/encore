dandiset: "000978"
paper: doi:10.1038/s41593-025-02183-y
questions:
- claim: fig7f-theory-vs-empirical
  asked: 2026-11-10
  question: >-
    The criterion judges "good agreement" by a mean absolute difference between theoretical and
    empirical error below 10% of the mean empirical error. The paper's own results files for
    Fig. 7f (results/PFC_results_nu_dt_0.5_ns_500_P_300.npy and the CA1 file in the paper's
    repository at commit 9674a6c) give 11.55% in PFC and 9.04% in CA1, so the bound fails on the
    paper's own numbers in PFC, while the legend calls the agreement good. The legend also names
    a bias at low error values, which a bound on the mean difference counts against the claim.
    Does the 10% bound misread the legend? A bound that the paper's own figure passes (for
    example a positive correlation with the theory tracking the empirical error, the bias being
    the one the legend allows) would fit the legend better.
  passage: >-
    "Empirical generalization error versus our estimate from equation ( 1 ). Although there is a
    small bias for low error values, we find a good agreement overall." (Fig. 7f legend.)
  why: >-
    This attempt gives r = 0.983 (PFC) and 0.948 (CA1) and mean differences of 11.55% and 10.69%
    (24 CA1 units; 8.91% with the code's 19), almost the same as the paper's file, and the claim is
    not reproduced under the criterion. Under the correlation part of the criterion alone it would
    be reproduced in both areas.
  answer: >-
    Changed. The question is right. The legend says "Although there is a small bias for low error
    values, we find a good agreement overall", and the paper gives no bound on the size of the
    difference. Computed from the paper's own results files at commit 9674a6c (64 rat and session
    means over the 500 subsets per area), the theory lies above the empirical error by a mean of
    0.034 (PFC) and 0.028 (CA1), which is 11.6% and 9.0% of the mean empirical error, and the gap
    is largest in the lowest-error quarter. The 10% bound therefore fails the figure the legend
    calls good, so it misreads the legend. The criterion now asks for a positive Pearson
    correlation with p < 0.05 and r of at least 0.9 in each area (the paper's files give 0.98
    and 0.96). The signed and absolute mean differences and the low-error difference are reported
    but not judged, because the legend allows that bias.
  answered: 2026-11-10
