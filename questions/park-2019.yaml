# Questions from attempt park-2019-01 (author-revise-1, 2026-11-12) about the claims file
# claims/park-2019.yaml, asked under docs/protocol.md, "Hand over for verification". The verifiers of
# rounds 1 and 3 reported these as places where the claims file may misread the paper. The attempt
# tests each claim as written.
dataset: crcns:hc-20
paper: doi:10.1016/j.neuron.2018.11.019
questions:
- claim: fig5-error-inhomogeneous
  asked: 2026-11-12
  question: The criterion takes the resultant r of 0.589 and 0.653 as the Rayleigh resultant of the
    signed decoding error angles (decoded minus actual direction) of the rotating trial, tested
    against the sampled head directions by Kuiper's test. Does the paper instead mean a distribution
    over head direction, such as the head directions at which decoding is accurate, or the decoding
    error as a function of head direction, which is what it compares with the sampled head-direction
    distribution and what Figure 5C places at 110 and 350 degrees "in the room frame"?
  passage: Results, paragraph on Figure 5, "The angular distribution of the decoded directional
    error was not homogeneous in the room frame (Figure 5A; resultant vector r = 0.589; Rayleigh's
    test; z = 236.36; p = 0.000); nor was the error distribution similar to the head-direction
    distribution (Kuiper's test; V = 4.17 x 10^7 ...)", and "the room frame direction decoding error
    distribution showed strong minima at 110 and 350 in the room frame". Figure 5 legend, "The polar
    distribution of room-frame directional error ... is inhomogeneous ... and different from the
    behavioral distribution".
  why: Kuiper's test against the head-direction distribution, and minima placed at room-frame
    directions, suggest that the polar distribution is over head direction. A distribution of signed
    error angles has no natural comparison with head directions. Under the claims file's reading
    the attempt finds error r of 0.014 to 0.211 against 0.589 and 0.653. Under a head-direction
    reading (head directions of windows decoded within 15, 30 or 45 degrees) it finds r of 0.10 to
    0.55, the highest (0.53 to 0.55) in the arena frame at 133 ms, for the exemplar ensemble and the
    median over ensembles, still below 0.653. The reading decides which numbers are compared with the expected values, so
    it could change the outcome.
  answer: Amended. The claims file fixed one reading where the paper allows more. The paragraph
    sets out to test whether, "when the rat faces the directions at which the internal
    representation registers, the associated ensemble discharge would tend to accurately decode to
    the current head direction", compares the error distribution with "the head-direction
    distribution" by Kuiper's test, and places its minima "at 110 and 350 in the room frame", all of
    which point to a distribution over head direction. The text also says "angular distribution of
    the decoded directional error", so the signed error angles remain a reading. The criterion of
    fig5-error-inhomogeneous now lists three readings, (i) mean absolute error per 10 degree
    head-direction bin as weights over the bin directions, (ii) head directions of accurately
    decoded windows (threshold not stated, 15, 30 and 45 degrees), (iii) the signed error angles,
    and the claim is reproduced under any distribution reading combined with any pooling reading.
    Expected values and tolerances are unchanged.
  answered: 2026-11-13
- claim: figs3-no-head-direction-bias
  asked: 2026-11-12
  question: The criterion counts the claim reproduced when every weighted Rayleigh test has
    p ≥ 0.05. The paper reports p > 0.17. Should every test instead have p > 0.17, the threshold the
    paper states?
  passage: Results, Degraded Directional Tuning, paragraph 4, "did not significantly differ from
    uniform (average r = 0.17 ± 0.02; p > 0.17; Figure S3)".
  why: Reported by the round 3 verifier. The criterion's threshold is looser than the paper's
    reported p. The attempt finds one of 14 tests at p = 0.0134 with n the number of bins, so the
    claim fails under either threshold and the outcome does not depend on this.
  answer: Not changed. The finding is that the distribution "did not significantly differ from
    uniform"; p > 0.17 is the support the paper reports for it, and the claim records it under
    statistics. A claim of no effect is judged on non-significance at the usual 0.05 level, and
    the paper's average r = 0.17 ± 0.02 is the number the attempt must match, which stays in
    expected. Requiring p > 0.17 would turn a reported bound into a target the protocol does not
    ask for.
  answered: 2026-11-13
- claim: fig1d-preference-change
  asked: 2026-11-13
  question: The statement and criterion take the order in the Figure 1D legend, "stable1-stable2 =
    stable1-rotating-room frame > stable1-rotating-arena frame", literally, so that the
    stable1-arena change in preferred direction must be the smallest of the three trial pairs.
    Could the legend be garbled, with the stable1-arena change meant to be the largest (stable1-stable2
    = stable1-room < stable1-arena)? The arena frame is where directional tuning is most degraded
    (Figure 1C, stable1 = stable2 > room > arena), and a degraded curve would be expected to move
    its peak more. The Results text (page 4) states only that every pair exceeds the stable1
    halves and gives no order.
  passage: Figure 1 legend, (D), "The rotation-induced change in (left) directional preference
    differs across trial pairs (F2, 228 = 10.54; p = 10-5; stable1-stable2 = stable1-rotating-room
    frame > stable1-rotating-arena frame)." Results, page 4, "the change in preferred direction of
    directional tuning and the overall change in directional tuning ("instability") was greater
    across the two stable conditions and between the stable and rotating conditions than it was
    between the two halves of the first stable session (Figure 1D)."
  why: Reported by the round 1 verifier of park-2019-02. The order decides between reproduced and
    partially reproduced. The attempt finds both ANOVAs and all three Dunnett tests significant,
    stable1-stable2 and stable1-room equal (58 and 60 degrees, Tukey p = 0.94), and stable1-arena
    larger (91 degrees, p below 0.0001), the reverse of the legend's order.
