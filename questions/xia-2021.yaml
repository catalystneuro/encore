questions:
- claim: fig7-peak-timing
  asked: 2026-11-18
  question: >-
    The criterion reads "10 to 15 s" in two ways, from stimulation onset (i) or from each event's own
    onset (ii), and counts a pass under either. It flags the paper's contradiction only for the most
    caudal region. But the paper's own Figure 7B and text times do not fit reading (ii) for the
    rostral-most region either. It rises at 13.20 s and peaks at 22.0 s, 8.80 s after its own onset
    and outside 9 to 16.5 s, while from stimulation onset (10.45 s) it peaks after 11.55 s, inside the
    window. Should reading (ii) stand, or does the paper mean reading (i) only, with the most caudal
    region as the one exception the criterion already names?
  passage: >-
    The rostral-most region started to increase fluorescence at 13.20 and 2.75 s after the start of
    10 s stimulation and peaked at t = 22.0 s, 1.65 s after the last stimulation. ... The decay of
    fluorescence intensity of the most caudal region begins at t = 44.55 and 24.2 s after the last
    stimulation (Fig. 7B). ... All evoked nanosensor responses in Fig. 7A climbed to the peak around
    ~10 to 15 s, an observation consistent with Fig. 5 B-E. (Results, ACh nanosensor response reflects
    physiological ACh propagation, paragraph 1)
  why: >-
    The attempt passes only under reading (ii). The four regions of sub-3, with block onsets in place
    of AQuA, peak 11.8 to 18.1 s after their own onsets (all four within 9 to 16.5 s in 30 of 36
    variants), and 18.0 to 26.4 s after stimulation onset (0 of 36 variants, none even with the most
    caudal region left out). If reading (ii) is dropped, the outcome would be not reproduced. Raised by the round-2 verifier, who would give partially reproduced at most.
