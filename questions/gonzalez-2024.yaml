dandiset: "000405"
paper: doi:10.7554/elife.85646
questions:
- claim: fig1d-task-performance
  asked: 2026-11-25
  question: >-
    The claims file's change log says that Notebooks/TM/fig1.ipynb takes the median of the subject
    medians and prints 0.726 and 110.25 trials per session, and the criterion reads the expected
    110 that way. A median of five subject medians of whole trial counts is one of the five
    subject medians, each a whole or half number, so it cannot be 110.25. Does the notebook's
    110.25 come from another aggregation (for example a mean of subject medians, a median over a
    different table, or a different set of subjects or sessions), and should the criterion's
    aggregation of the trial count say so?
  passage: >-
    "Across subjects, the median session accuracy on the Tree-Maze was 72.6%" with a median of 110
    trials per session (Results, Tree-Maze behavior, paragraph 2; Figure 1d). The claims file's
    check entry for fig1d-task-performance cites fig1.ipynb printing 0.726 and 110.25.
  why: >-
    The attempt measures 152 trials per session as the median of subject medians (and 150.5 pooled,
    135 to 152 under thresholds of 40 to 60 trials), against 110 +- 11, so the trial count fails and
    the claim is partially reproduced. If the paper's 110.25 comes from another aggregation or
    selection, the criterion should state it, and the count might then match. The round-1 verifier
    raised this (problem 6 of transcripts/gonzalez-2024/verifier-1-report.md).
