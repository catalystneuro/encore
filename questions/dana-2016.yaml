# Questions from attempt dana-2016-01 (author revision after verifier round 1, 2026-11-13) about the
# claims file claims/dana-2016.yaml. Asked under docs/protocol.md, Author, step 1.6, and "Hand over
# for verification". The attempt tested or blocked the claims as the file has them.
dataset: crcns:cai-2
paper: doi:10.7554/elife.12727
questions:
- claim: culture-jrcamp1-dynamic-range
  asked: 2026-11-13
  question: The claim is marked `data` set to `dataset` and so is blocked as data missing, and the header says
    no claim rests on a number found only in Figure 2, source data 1. Yet the criterion says the
    dynamic range "is the value of Figure 2, source data 1", and that table is public on the eLife
    site (elife-12727-fig2-data1-v2.docx, doi:10.7554/eLife.12727.005), with a column "Dynamic range
    (Fmax/Fmin)" per sensor. Should the claim be `data` set to `elsewhere`, on that file, at least for the
    value in solution?
  passage: Results, Protein engineering, paragraph 6 ("Both jRCaMP1a and jRCaMP1b have higher calcium
    affinities than RCaMP1h (Figure 2, source data 1). However, jRCaMP1a has very limited dynamic
    range in cultured neurons and solution (160 ± 25% and 320 ± 10% respectively, mean ± s.d.)");
    the legend of Figure 2, source data 1 ("Biophysical properties of purified jRGECO1 and jRCaMP1
    sensors ... mean ± s.d.").
  why: As `data` set to `dataset` the claim is blocked as data missing; as `data` set to `elsewhere` its solution
    value could be tested on the eLife table, so the outcome could change from blocked to tested.
    The verifier of round 1 raised it (report, problem 7).
- claim: fly-single-ap-amplitude
  also: [fly-improved-over-parents, fly-decay-like-gcamp6f, fig7b-5hz-amplitude, fig7c-frequency-tuning]
  asked: 2026-11-13
  question: The Drosophila claims are marked `data` set to `dataset` and blocked as data missing, but the
    paper's Figure 7, source data 1 to 3 are public on the eLife site (elife-12727-fig7-data1-v2.xlsx,
    -data2- and -data3-, doi:10.7554/eLife.12727.022 to .024). They hold, per construct and stimulus
    frequency (1 to 160 Hz), the mean and s.e.m. of dF/F0 and other measures for R-GECO1, jRGECO1a,
    jRGECO1b, RCaMP1h, jRCaMP1a, jRCaMP1b, GCaMP6s and GCaMP6f. Should this claim, and
    fly-improved-over-parents, fly-decay-like-gcamp6f, fig7b-5hz-amplitude and fig7c-frequency-tuning,
    be `data` set to `elsewhere` on these files, for the parts the summaries can test?
  passage: Results, Red protein calcium indicators in Drosophila, zebrafish, and C. elegans,
    paragraph 1, which cites "Figure 7, source data 1 – 2" for the single AP boost and "Figure 7,
    source data 3" for the single AP amplitudes and the 160 Hz half decay times; the legends of
    Figure 7, source data 1 to 3 ("Summary of results shown in Figure 7, figure supplement 1 to 3").
  why: As `data` set to `dataset` the five claims are blocked as data missing. The summary tables give the
    means the statements quote (for example the 1 Hz dF/F0 of jRGECO1a, 0.116, against the 11.6% of
    fly-single-ap-amplitude), so some of them could be tested and their outcomes could change. The
    verifier of round 1 raised it (report, problem 7).
- claim: fig4g-kinetics-like-gcamp6
  asked: 2026-11-13
  question: The criterion compares the 2 AP half rise and half decay times of fig4g-jrgeco1a-faster
    with "the GCaMP6f and GCaMP6s values Chen et al. (2013b) report". Chen et al. report, for V1 in
    vivo (Supplementary Table 3), a 1 AP half decay and a 1 AP rise time to peak, and no half rise
    and no 2 AP values. Is the comparison meant to be with those 1 AP values, half rise against time
    to peak, or with some other measure (for example the time to peak of the 2 AP traces)?
  passage: Results, Relationship between spikes and fluorescence dynamics, paragraph 1 ("Measured
    rise and decay time of jRGECO1a and jRCaMP1a were similar to GCaMP6f and GCaMP6s, respectively
    (Chen et al., 2013b)"); Figure 4g legend ("Comparison of mean half rise (left) and decay (right)
    times of jRGECO1a and jRCaMP1a for 2 AP response"); Chen et al. (2013b) Supplementary Table 3
    ("Decay t1/2 1 AP (ms)", "Rise tpeak 1AP (ms)").
  why: Tested as written, the claim is not reproduced; the half rise times (15 and 47 ms) are a third
    or less of Chen et al.'s times to peak (45 and 179 ms), as a half rise is by construction shorter
    than a time to peak. With the time to peak of the same traces (77 and 285 ms) the rise times are
    still outside 25%, so the outcome does not change under the variants run, but the measure
    compared is not the one the claims file names.
