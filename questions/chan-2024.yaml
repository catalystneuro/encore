questions:
- claim: fig2d-no3-degrades-monoterpenes
  also:
  - fig2d-other-compounds-unchanged
  - figs5-blend-oxidation
  asked: 2026-11-26
  question: The criterion says the windows of the O3 and NO3 stages "are not given in the paper or
    its code" and names two readings of its own, the last half of each stage and the whole stage.
    The paper's Dryad deposit, which it cites for its data (ref. 40), holds the notebook
    Fig_S4_Table_S9_VOCUS_analysis_and_plotting.ipynb, whose cells 29 to 33 compute Table S9 with
    fixed index windows for each compound (for example b-pinene clean 0 to 200, O3 500 to 800, NO3
    1100 to 1300 of the section 350 to 1750), and print the Table S9 percentages and p values.
    Should the criteria of these claims take the notebook's windows as the paper's method, in place
    of or beside readings (a) and (b)?
  passage: Table S9 legend (Supplementary Materials), "Statistical testing (p-values) of the changes
    were computed using the t-test if possible, using the Welch t-test if variances were not
    equal ... and using the Mann-Whitney U-test if the data were not normally distributed"; the
    procedure and windows are those of the Dryad notebook.
  why: For fig2d-other-compounds-unchanged the outcome depends on it. Under readings (a) and (b) the
    aldoxime changes by less than 1% but with p below 0.05 (0.00017 and 5.2e-05), so the absence
    claim is not reproduced; under the notebook's windows every p is 0.065 or more and the claim is
    reproduced, as Table S9 reports. The monoterpene claim is reproduced either way. The reader
    could not have seen the notebook, as readers do not see the dataset.
