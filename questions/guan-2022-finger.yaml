dandiset: "000252"
paper: doi:10.1101/2022.12.07.22283227
questions:
- claim: tenfinger-discriminative-fraction
  asked: 2026-11-04
  question: The criterion corrects J-PPC and J-MC separately, citing the array neuron counts of the
    legends. The Methods correct over the neurons of each participant. Should participant J's
    Benjamini-Hochberg correction run over the J-PPC and J-MC neurons together?
  passage: We corrected for m = N comparisons, where N is the number of neurons for each
    participant. (Methods, Single-neuron selectivity)
  why: Raised by the round-2 verifier. The legends that give an array's own count belong to the
    alternating-cues task. No outcome of this attempt depends on it, because even uncorrected p
    below 0.05 gives 46.5% for J-PPC, below the lower bound of 51.3%. A later attempt could depend
    on it.
