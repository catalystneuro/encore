dandiset: "001037"
paper: doi:10.1038/s41586-024-07915-x
questions:
- claim: ed10g-follower-decoding
  asked: 2026-11-17
  question: >-
    The criterion decodes the targeted x1 neurons' activity from "non-targeted neurons", following
    the legend of Extended Data Fig. 10g. The Results decode from "follower x1 neurons", which the
    paper defines as non-targeted neurons activated by the stimulation, excluding cells within a
    50 um radius of the targeted cell. Should the criterion use follower x1 neurons with the 50 um
    exclusion, as the Results do, or all non-targeted x1 neurons, as it now says?
  passage: >-
    "optogenetically evoked integrated activity in targeted x1 neurons could be reliably decoded
    from the activity of their follower x1 neurons (Extended Data Fig. 10d-f). This decoding was
    significantly better than that obtained using the activity of non-targeted x2 neurons"
    (Results, Line-attractor neurons form ensembles, paragraph 1); "putative x1 follower cells
    (that is, non-targeted neurons that were photoactivated by stimulation of targeted x1 neurons)
    ... even after excluding the targeted x1 neurons themselves as well as potentially off-target
    neurons located within a 50 um radius of the targeted cell" (same paragraph).
  why: >-
    The two-photon files hold no cell positions, so the 50 um exclusion cannot be applied. Under
    the Results' reading the claim stays blocked (it also depends on ed10c-followers-integrate,
    blocked for the same reason). Under the criterion's reading, without the dependency, it could
    be tested from the ActivatedNeurons lists the files hold. The verifier of round 2 found the
    criterion looser than the paper; the attempt follows the paper.
