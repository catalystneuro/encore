dandiset: "000623"
paper: doi:10.1038/s41597-024-03029-1
questions:
- claim: confidence-accuracy
  asked: 2026-11-10
  question: >-
    The statement says accuracy was "significantly higher" for high-confidence than for
    low-confidence judgments, and the criterion asks for high above low. The paper's sentence, which
    the claim quotes, says only "significantly different". Should the statement and criterion drop
    the direction, or does another passage of the paper (Fig. 3c itself) give it?
  passage: >-
    "Accuracy was significantly different between high- versus low-confidence trials (p < 0.001,
    paired t-test)" (Technical Validation, New-old task performance (behavior) in EMU, paragraph 1,
    and the Fig. 3c legend). Raised by the round-1 verifier.
  why: >-
    It does not change this attempt's outcome. High is above low (89.9% against 72.0%, higher in 18
    of 22 sessions, paired t-test p = 0.00027), so the claim is reproduced with or without the
    direction. It would matter only for an attempt where low confidence came out more accurate.
