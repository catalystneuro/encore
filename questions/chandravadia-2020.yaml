# Questions from attempt chandravadia-2020-02 (author-revise-1, 2026-11-15) about the claims file
# claims/chandravadia-2020.yaml, raised by the first verification round (docs/protocol.md, "Hand
# over for verification"). The attempt tests the claim as the file has it.
dandiset: "000004"
paper: doi:10.1038/s41597-020-0415-9
questions:
- claim: fig5f-site-proportions
  asked: 2026-11-15
  question: The claim compares the percentages of VS, MS and dual cells between CS and TWH sessions.
    The sentence it quotes says the percentages "were comparable to previously reported percentages in
    our locally recorded dataset", which reads as a comparison with the earlier publications on the
    locally recorded data (reference 10), not between the two sites of this dataset. The Figure 5f
    legend splits the values by site, which supports the claim's reading. Should the claim stay a
    comparison of CS with TWH, or compare this dataset's percentages with those previously reported?
  passage: Technical Validation, proportion of selective cells, paragraph 3, "We found that the
    percentages of VS, MS, and dual VS/MS cells were comparable to previously reported percentages in
    our locally recorded dataset (Fig. 5f)", and the Figure 5f legend.
  why: The verifier of round 1 found that the claim recasts the sentence. Under the claim's reading
    the attempt finds no difference between sites (Fisher p 0.133 to 0.398 with the main tests) and
    3 of 6 values within tolerance. A comparison with the previously reported percentages would need
    those percentages as expected values, which the claims file does not give, and could give a
    different outcome.
