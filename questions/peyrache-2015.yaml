questions:
- claim: fig4d-ole-near-bayesian
  question: The criterion takes the signal OLE's Q "from the tuning curves read at the head direction".
    The paper contrasts "tuning curve covariances (i.e., signal correlation only)" with "spike train
    covariances (i.e., including noise correlation)", which excludes the noise correlations between
    cells, not each cell's own variance. Should the criterion say that the signal Q keeps the observed
    variances on its diagonal (independent neurons, the usual signal-only OLE), with the tuning curves
    giving only the off-diagonal terms? The same estimator decides fig4e-ole-covariance.
  passage: 'Results, paragraph 5, "Optimal linear estimates (OLE, see Methods ) of the head-direction
    were enhanced when using spike train covariances (i.e., including noise correlation) instead of
    the tuning curve covariances (i.e., signal correlation only)."'
  why: Read as the criterion words it (Q from the tuning curves throughout), the signal decoder errs
    by up to 103 degrees in some ensembles, beyond the 90 degrees of chance, so the covariance OLE wins
    by default (fig4e median ratio 0.25 in ADn). With the observed variances on the diagonal the two
    OLEs barely differ (ratio 0.99), and the first part of fig4d holds only with the ensembles of hd-b
    cells. The round-2 verifier reported the wording as inviting the reading that does not work; the
    attempt now adopts the observed-variance reading and shows the other as a variant.
- claim: recording-sample
  question: The criterion defines only "reproduced" (all four values within tolerance under one reading,
    or the total matching the table's 50 sessions). It gives no rule for "partially reproduced" or "not
    reproduced". Should it say which applies when the mice and session counts match and the counts of
    sessions and mice with both structures do not?
  passage: 'Results, paragraph 1, "in 7 mice foraging for food in an open environment (42 sessions) and
    in their home cages during sleep ... In 3 mice (21 sessions) ADn and PoS recordings were performed
    simultaneously."'
  why: The files label units of four mice ADn and PoS, so 24 sessions in 4 mice hold both structures,
    against 21 in 3; 7 mice and 41 sessions are within tolerance. The attempt records partially reproduced
    by its own judgement, which the round-2 verifier found reasonable but noted is not set by the criterion.
