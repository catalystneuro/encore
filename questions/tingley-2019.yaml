dandiset: "000218"
paper: doi:10.1016/j.neuron.2019.10.012
questions:
- claim: fig7e-ca1-spikes
  asked: 2026-11-18
  question: The criterion counts a neuron when a two-sided t-test of the shuffled MSEs against the
    actual MSE gives p < 0.05, which uses the standard error of the mean of the 100 shuffles. The
    Figure 7E axis gives the actual MSE in standard deviations of the shuffled distribution. Should
    the neuron count when the actual MSE lies more than 1.96 SD of the shuffled MSEs below their mean
    (a z-score against the shuffle SD), with chance as one shuffle scored the same way? The same
    question applies to fig7e-state and fig7e-duration, and to the black and red points of
    fig7e-content-independent.
  passage: Y-axis is the number of standard deviations that the mean squared error (MSE) was from a
    distribution of MSE values calculated from shuffled data for the same neuron. For every feature,
    each neuron is shown twice, as a black dot (actual data vs shuffled distribution) and as a red
    dot (one shuffled iteration vs shuffled distribution). The percentage of neurons surpassing P <
    0.05 (two-way T-test) are shown above for each ripple feature. (Figure 7E legend); and the
    content-based features predict 6.6% to 8.1% of neurons and are "not significantly different from
    chance" (Results, Figure 7 paragraphs 3 and 4).
  why: On synthetic null data the t-test calls 42.2% of neurons significant and the z-score 2.5%.
    With the t-test the chance rate in the data is 22% to 44%, so the paper's 6.6% to 8.1% for the
    content features could not be at chance; with the z-score it is 1.9% to 7.4%. Under the t-test
    no combination is within tolerance for any of the three features (47.0% to 80.0%, 44.4% to 63.9%,
    41.1% to 89.0%; partially reproduced); under the z-score 3, 4 and 2 of 16 combinations are
    within tolerance (15.2% to 64.6%, 16.8% to 39.5%, 11.1% to 79.2%), which the criterion would
    count as reproduced. The verifier of round 1 reported the t-test reading as a misreading of the
    legend.
