questions:
- claim: fig4a-swr-counts
  asked: 2026-11-08
  question: >-
    The opening comment's O5 reads the "envelope power" whose histogram is mirrored at its mode as
    either (a) the smoothed Hilbert envelope amplitude or (b) its square, z-scored over immobility.
    Does the paper allow another reading of that distribution, for example a histogram of the
    logarithm of the envelope or of the power, or a mode and mirror taken over the raw envelope
    before z-scoring, that the claims file should list? The same reading is used by every claim that
    rests on detected SWRs (fig3c, fig4a to fig4e and their supplements, and the PFC claims fig5,
    fig5dg, fig5s1d and pfc-regression-joint-swr).
  passage: >-
    We assumed that the full distribution of the envelope power was the result of a lower power
    noise component and a higher power signal component that contributes to the long tail. We
    approximated the noise distribution by finding the mode for the histogrammed consensus envelope
    power and creating a symmetric distribution by mirroring the histogram below the peak around
    the mode. We then used a cutoff (99.99th percentile) (Methods, SWR detection, paragraph 3).
    Left column shows the distribution of normalized SWR-band envelope power (black line) from -2 to
    3 standard deviations from the mean (z-score units). The right column shows the distribution up
    to 30 z, with counts on a log scale (Figure 3, supplement 1 legend).
  why: >-
    Under reading (a) the threshold is 0.04 to 0.84 z, 13 to 20% of immobile samples exceed it, and
    there are 1.3 to 2.4 events per second of immobility; the same rule on the envelope of pure
    Gaussian noise passes 13% of noise samples. Under reading (b) the threshold falls below the mean
    on every day and the detection is degenerate. If neither is what the paper did, the event set
    differs, and with it every SWR-based outcome. A fixed 3 SD threshold (not a reading of the
    paper) gives about 0.2 events per second; it leaves the outcomes of fig4a, fig3c, fig5 and fig5dg
    unchanged. Raised by the round-1 verifier, who wrote that the claims file may be misreading the
    paper's "power" histogram.
- claim: fig2s1cd-theta-autocorrelation
  asked: 2026-11-08
  question: >-
    The opening comment's O1 reading (b) makes the start and end of every immobility period (speed
    below 4 cm/s) a well entry and exit. The paper's entries and exits appear to be those of visits
    to a well, the "periods at wells" of Figure 1, supplement 1B and C, which alternate with
    "periods between wells". Should reading (b) take entries and exits from visits to a well (for
    example immobility periods at a well, merged or filtered by position and duration) and not from
    every pause in movement? The same reading is used by fig1s1d, fig2c, fig2s1ij and fig4s3.
  passage: >-
    Distribution of the animal's mean speed during periods at wells (red) and periods between wells
    (black) ... Subjects are immobile during periods at the well and are moving during periods
    between wells. ... In the foraging task, the two smaller peaks at 0 and 3 s for periods at
    wells correspond to visits for which no reward was delivered (incorrect trials) as the rats
    departed the well quickly after discovering the absence of reward (Figure 1, supplement 1B and C
    legend). Autocorrelation of times of entry into and exit from wells (Figure 1, supplement 1D
    legend).
  why: >-
    Under reading (b) as written there are 326 to 1977 immobility periods a day, with a median length
    of 0.23 to 0.37 s, and their +-1.5 s windows cover 32 to 62% of task time (median 53%), so they
    do not isolate transitions at wells. Taking visits (immobility periods of at least 0.5 s whose
    mean position is within 15 cm of a well, an attempt's own choice, as the paper gives no radius or
    duration) the windows cover 9 to 37%. For fig2s1cd the outcome differs between the two, all four
    depth comparisons holding with every immobility period and three of four with visits (IAPs at
    entry 0.00089 against 0.00093). The outcomes of fig2c, fig2s1ij and fig4s3 do not change. The
    paper's peak at 0 s for periods at wells suggests that a 0.5 s minimum would leave out some real
    visits. Raised by the round-2 verifier.
