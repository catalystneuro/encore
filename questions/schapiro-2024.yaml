# Questions from attempt schapiro-2024-01 (author-revise-1, 2026-11-25) about the claims file
# claims/schapiro-2024.yaml, asked under docs/protocol.md, Author, step 1.6, and "Hand over for
# verification".
questions:
- claim: fig1f-two-saline-frequency-change-same
  asked: 2026-11-25
  question: The claims file (header, data, and the statement of this claim) describes the control
    experiments as "two consecutive saline step protocols". The paper says "two consecutive
    temperature changes in saline" and does not say both were steps. Should the statement and the
    header say temperature changes, as the paper does, and should the criterion say how the 11 and
    21 degrees C values are formed when the second change is a ramp, which has no 11 degrees C hold?
    The same wording bears on fig1e-two-saline-q10-same and fig1e-saline-q10-same-across-designs.
  passage: 'Results, The steady-state frequency increase in response to elevated temperature was
    decreased by Cs+, paragraph 4: "we performed two consecutive temperature changes in saline. The
    mean difference in frequency between 21°C and 11°C for the first (0.9±0.3 Hz) and second
    temperature changes (0.8±0.3 Hz) were not significantly different (Figure 1F)."'
  why: Raised by the round-1 verifier. The deposited ControlTable (SummaryStatistics.mat) gives the
    second protocol as a ramp in three of the six experiments (965_146, 981_025, 982_005). In this
    attempt the claim is tested on the table's per-experiment values, because five of the six
    experiments have no spike file, so the outcome does not change (paired t p = 0.137). It would
    matter for an attempt with the spike data, where a hold-based criterion cannot be applied to a
    ramp as written, and the two Q10 claims are blocked for that reason already.
