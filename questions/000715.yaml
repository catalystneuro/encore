dandiset: "000715"
paper: doi:10.1016/j.cell.2020.12.012
questions:
- claim: ms2-neuropal-color-violations
  asked: 2026-10-31
  question: The criterion takes the Methods measure (the share of neighboring pairs closer in color
    than the margin) as the main result and the code's measure (the mean shortfall below the margin
    over neighboring pairs, find_optimal_colors.m) as a variant. Should the code's measure be the
    main result, since the paper's own inputs give 3.5% only under it?
  passage: To evaluate approximately optimal coloring solutions, we measure the percentage of their
    color violations, defined as neighboring neuron pairs which fall below the discrimination
    margin ... NeuroPAL, which comprehensively identifies all neuron types, exhibited a theoretical
    color violation of 3.5%. (Methods S2, section 4.3); find_optimal_colors.m computes
    sum(max(margin*A - D.*A, 0)) / sum(A) and prints it as the NeuroPAL color margin violation.
  why: With the paper's own data.mat (its 235-neuron adjacency and the NeuroPAL colors) the
    Methods measure is 21.50% and the code's measure 3.47%; with neighbors from the dandiset's head
    atlas they are 21.50% and 3.64%. Under the criterion as written the claim is not reproduced;
    with the code's measure as the main result it is reproduced. The same question bears on
    fig7de-optimal-coloring-violations, which uses the same measure.
  answer: Changed. The claims file followed the Methods wording ("the percentage of their color
    violations, defined as neighboring neuron pairs which fall below the discrimination margin",
    Methods S2 section 4.3) as the main measure, but the 3.5% the paper reports is the code's
    measure. find_optimal_colors.m (Optimal_Coloring 990c597) computes sum(max(margin*A - D.*A,
    0)) / sum(A) and prints it as "NeuroPAL color margin violation", and the share of neighboring
    pairs below the margin, computed on the same repository's data.mat (its stored 235-neuron
    adjacency and NeuroPAL colors), is about 19%, so it cannot be the measure behind the reported
    number. The criterion of ms2-neuropal-color-violations now takes the code's mean shortfall as
    the measure that decides the claim and reports the Methods share as a variant; its statement
    now says "theoretical color margin violation of 3.5%" in place of "3.5% of neighboring pairs".
    The text is not fully consistent (its 0.3% lower bound from eight left-right pairs and its
    all-same-color example of 100% follow the share), which is why the share is kept as a variant.
    fig7de-optimal-coloring-violations, whose numbers come from the same code, now refers to the
    same measure. Expected values and tolerances are unchanged.
  answered: 2026-10-31
