dandiset: "000715"
paper: doi:10.1016/j.cell.2020.12.012
questions:
- claim: ms2-neuropal-color-violations
  asked: 2026-10-31
  question: The criterion takes the Methods measure (the share of neighboring pairs closer in color
    than the margin) as the main result and the code's measure (the mean shortfall below the margin
    over neighboring pairs, find_optimal_colors.m) as a variant. Should the code's measure be the
    main result, since the paper's own inputs give 3.5% only under it?
  passage: To evaluate approximately optimal coloring solutions, we measure the percentage of their
    color violations, defined as neighboring neuron pairs which fall below the discrimination
    margin ... NeuroPAL, which comprehensively identifies all neuron types, exhibited a theoretical
    color violation of 3.5%. (Methods S2, section 4.3); find_optimal_colors.m computes
    sum(max(margin*A - D.*A, 0)) / sum(A) and prints it as the NeuroPAL color margin violation.
  why: With the paper's own data.mat (its 235-neuron adjacency and the NeuroPAL colors) the
    Methods measure is 21.50% and the code's measure 3.47%; with neighbors from the dandiset's head
    atlas they are 21.50% and 3.64%. Under the criterion as written the claim is not reproduced;
    with the code's measure as the main result it is reproduced. The same question bears on
    fig7de-optimal-coloring-violations, which uses the same measure.
