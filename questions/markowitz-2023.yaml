questions:
- claim: ed10i-no-place-preference
  question: The criterion tests the target-onset JSD by pairs and by mice, and reads the statement's
    experiment-wide comparison (n = 32 mice, U = 114, P = 0.41) as the per-mouse mean of the
    target-onset JSD. The Extended Data Fig. 10i legend describes the second test as a JSD computed
    over experiment-wide centroid locations for each mouse, that is over all of a mouse's positions,
    not only at target onsets. Should the experiment-wide test use all centroid locations of each
    mouse on stimulation days against other days?
  passage: 'Extended Data Fig. 10i legend, "Right: JSD of centroid location distributions computed
    over experiment-wide centroid locations for each mouse (n = 32 mice, p = 0.41, U = 114, f = 0.48,
    two-sided Mann-Whitney U test)."'
  why: Under the criterion as written both tests give P >= 0.05 (pairs P = 0.174, mice P = 0.425)
    and the claim is reproduced. The comparison over all instance onsets of each mouse, computed in
    optoda.ipynb as a variant, gives U = 48, f = 0.20, P = 0.005, with Opto-DA mice lower than
    controls, so under the legend's reading the claim would not be reproduced.
