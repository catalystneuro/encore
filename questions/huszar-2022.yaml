dandiset: "000552"
paper: doi:10.1038/s41593-022-01138-x
questions:
- claim: sessions-durations
  asked: 2026-11-19
  question: The criterion gives reproduced when the count, median and range hold under one reading
    and every session holds non-REM sleep, partially reproduced when the durations hold and the
    count holds under none, and not reproduced otherwise. It has no category for the case where
    the count, the median and the range all hold but some session lacks non-REM sleep, so read
    literally that case is not reproduced, an outcome below the criterion's own partial case.
    Should the sleep condition be judged apart (for example, partially reproduced when the numbers
    hold and the sleep condition does not)?
  passage: All recordings (92 sessions ranging in duration from 113.7 min to 475.6 min; median
    duration = 309.1 min) included a homecage period of sleep and wake. (Methods, Implantation and
    recording, paragraph 2)
  why: In this attempt the 96 sessions of the 15 homecage mice give a count within tolerance, a
    median of 309.9 min and the paper's exact range, but two sessions (e13_1f1_200305 and
    e13_1f1_200307) hold only wake in their sleep states. The literal criterion gives not
    reproduced; a criterion that judged the sleep condition apart would give partially reproduced.
    Raised by the round 1 verifier (problem 11).
- claim: fig1f-rem-shift
  asked: 2026-11-19
  question: The statistics give n = 123, 106, 143 and 76 modulated neurons for Figure 1f, the cells
    locked in both wake and REM that form the denominators of the REM-shift fractions. These exceed
    the REM-locked counts the paper gives for Figure 2d (REM n per birthdate), and Figure 1f (top)
    gives n = 95 for E13.5. Which counts belong to the fractions, and should the claim say that
    the legend's n cannot all be the both-locked counts?
  passage: Figure 1f legend (n = 123, 106, 143 and 76 modulated neurons) against the REM theta-depth
    counts of Figure 2d and the n of Figure 1f (top).
  why: The denominators decide the fractions, and a reader comparing this attempt's both-locked
    counts (about 93, 81, 76 and 65 at the Methods' threshold) with the claim's n cannot tell which
    count the paper's fractions used. The outcome is decided on the fractions and the slope, so it
    does not change, but the claim's n may be misread from the legend. Raised by the round 1
    verifier (problem 10).
- claim: ed10-waveform-matched-controls
  asked: 2026-11-19
  question: The claim lists ed2-waveform-validation under depends_on, so it is blocked whenever
    that claim is. ed2-waveform-validation is blocked here because the waveforms of light-evoked
    spikes need the wide-band signal, but this claim's criterion takes the waveform profile
    distance "on spontaneous spikes", and its other parts are SPW-R, theta and ratemap
    correlations of same-shank pairs. Should the dependency on ed2-waveform-validation be dropped
    (keeping fig2c, fig2g and fig5c), so that the claim is tested on the spontaneous mean
    waveforms the dataset holds?
  passage: Extended Data Fig. 10 legend (waveform profile distances of same-shank SBD and DBD
    pairs, all and >60 um apart, and the waveform-matched resamplings of panels c and f), with
    Extended Data Fig. 2d-f for how the waveform profile distance is formed.
  why: The claim's own parts were run in this attempt for the record. Under its criterion they
    give not reproduced, as the familiar ratemap comparison of pairs more than 60 um apart has
    p = 0.078 (SBD 0.0143 against DBD -0.0278), while the SPW-R and theta comparisons hold and
    their four medians are within tolerance. With the dependency the claim stays blocked and
    this result is not counted. Raised by the round 2 verifier.
