dandiset: "001169"
paper: doi:10.1038/s41467-023-43250-x
questions:
- claim: cohort-size
  asked: 2026-11-10
  question: >-
    The claims file's opening comment says "A further 16 rats ran a pre-initiation cue task (Fig. 5;
    12 switched from the standard task, 4 trained only on it)", which reads as 16 rats beside the
    291. The paper says a subset of rats ran that task. Should the comment say that the 16 rats are
    among the 291, so that the Fig. 1 and Fig. 2 analyses include their pre-cue sessions?
  passage: >-
    "To modulate the subjective uncertainty in the rat’s estimate of state (block) before trial
    initiation time, we ran a subset of rats on a variation of the task where we cued reward offer
    before rats initiated a trial ( N = 16)." (Methods, Pre-initiation cue task; the Results, Reducing
    state uncertainty did not change trial initiation times, also speak of a subset.)
  why: >-
    Raised by the round 1 verifier. In the dandiset the 291 rats include all 16, among them M045 to
    M048, who trained only on the pre-cue task, and the median trial and session counts match the
    paper exactly with them included. If the 16 were extra, the cohort count and the Fig. 1 and 2
    analyses would have to leave them out. With 16 of 291 rats no outcome here changes either way;
    the attempt tests the claims as written and keeps the pre-cue rats in the 291.
