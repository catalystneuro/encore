questions:
- claim: fig4a-noise-ceiling
  question: The criterion gives the available trials per image as 13, or 14 for an image among the
    first 6 trials of a run. In the data set's presentation sequences (seqVal), the 120
    identification images have 13, 14 or 15 trials over the 10 runs (70 images 13, 40 images 14,
    10 images 15), counting the 6 trials repeated at the end of each run. Should the sample size be
    the number of trials each image has, whatever it is, or exactly 13 or 14?
  passage: 'SM 1, "Each identification run used 12 distinct images presented 13 times each ...
    During stimulus presentation the first 6 trials were repeated at the end of the 168-trial
    sequence ... In the single-trial analysis, all data were used."'
  why: The sample size of the repeated-trial ceiling sets how far its mean patterns average out
    the noise; an image with 15 trials gets a less noisy pattern than one with 13. The difference
    is small, but the criterion's wording does not cover 10 of the 120 images.
- claim: fig4a-noise-ceiling
  question: The criterion's readings draw the predicted pattern of each candidate image with the
    same sample size as the measured one, so the single-trial ceiling compares one trial with one
    trial. SM 7 says the predicted patterns stand in for model predictions whose quality is "limited
    only by intrinsic measurement variability, not by the predictive power of receptive-field
    models", which fits predicted patterns averaged over all of an image's trials (a bootstrap of
    the available trials) and a single-trial measured pattern. Should the single-trial ceiling use
    one measured trial against predicted patterns averaged over all trials?
  passage: 'SM 7, "Estimation of the noise ceiling", "In each simulation, the first step was to
    generate a measured voxel activity pattern for the correct image. This was accomplished by
    taking the mean of a random sample drawn from the single-trial activity patterns evoked by the
    correct image. The next step was to generate a predicted voxel activity pattern for each
    potential image ... by taking the mean of a random sample drawn from the single-trial activity
    patterns evoked by each potential image. (The intuition here is that the quality of the
    predicted voxel activity patterns is limited only by intrinsic measurement variability, not by
    the predictive power of receptive-field models.)"'
  why: A ceiling computed from two single trials is noisier on both sides and can fall below the
    single-trial identification performance of the models themselves, which a ceiling should not.
    The paper's single-trial ceilings (about 80% and 64%) sit above its single-trial performance
    (51% and 32%); which reading gives values near them decides the outcome once single-trial
    responses are computed.
