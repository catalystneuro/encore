# Questions from attempt drieu-2018-01 (author-revise-1, 2026-11-16) about the claims file
# claims/drieu-2018.yaml, raised by the round-1 verifier. Asked under docs/protocol.md, Author,
# step 1.6 and "Hand over for verification"; the claims are tested as the file has them.
paper: doi:10.1126/science.aat2952
questions:
- claim: fig2cd-spike-bursts-slower
  also: [figs4b-proportions-oscillating-precessing]
  asked: 2026-11-16
  question: The criterion takes "a multitaper spectrum of this spike train" per place cell, and its mode
    within 0.75 to 1.25 cycle^-1. The Methods say spectrograms. Should the measure be the spectrum of the
    whole train, or a spectrogram of the train (spectra in successive windows, then averaged or read per
    window), with the window to be stated as open?
  passage: Methods, Theta burst frequency, "Spike times were converted to unwrapped theta phases and divided
    by 2 pi, yielding units of theta cycles. Spectrograms computed on the resulting spike trains measured
    frequencies relative to theta, compensating for moment-to-moment variations in theta frequency over the
    course of a given experiment (fig. 2C,D and fig. S4A)."
  why: A spectrum over a whole travel session peaks at 1.000 cycle^-1 within 0.001 for nearly every cell
    here (the cell's preferred phase is the same on every pass through its field), so whether a mode is above
    1 is close to chance, and both claims fail on that measure. Spectrograms with windows of 16 or 32 cycles
    give modes spread over 0.8 to 1.2 cycle^-1 and different proportions above 1. The attempt tests the
    claims file's spectrum and shows the spectrogram readings as variants.
