dandiset: "000939"
paper: doi:10.1038/s41593-024-01588-5
questions:
- claim: ed3k-robust-to-controls
  asked: 2026-10-31
  question: The statement says that ADN-HD cells have higher multipeak scores than PoSub-HD cells.
    The legend of Extended Data Fig. 3j gives a test without a direction. Does the paper say which
    population scores higher, or should the statement only say that the scores differ?
  passage: (j) Multipeak scores in PoSub-HD and ADN-HD cells (Mann-Whitney U, n = (1602, 97), z =
    4.25). (Extended Data Fig. 3 legend). The k panel keeps cells with a score below 0.05, n =
    789 of 1,602 PoSub-HD cells and 69 of 97 ADN-HD cells.
  why: The paper's own counts keep 49% of PoSub-HD and 71% of ADN-HD cells below 0.05, which
    implies lower scores in ADN-HD cells. Here ADN-HD scores are lower (median 0.022 against
    0.049, p = 3e-5), so the claim as written is only partially reproduced; with the direction
    left out it would be reproduced.
  answer: The claims file misread the paper, and the claim is amended. The legend gives only
    "Multipeak scores in PoSub-HD and ADN-HD cells (Mann-Whitney U, n = (1602, 97), z = 4.25)",
    with no direction, and the text never says which population scores higher. The counts kept
    below 0.05 in panel k (789 of 1,602 PoSub-HD, 69 of 97 ADN-HD) point to lower ADN-HD scores,
    the opposite of the statement. The statement now says only that multipeak scores differ
    between ADN-HD and PoSub-HD cells; the criterion notes the missing direction and what the
    counts suggest, and accepts the multipeak test at p < 0.05 in either direction. The three
    Fourier distance tests keep the paper's direction.
  answered: 2026-11-02
- claim: fig5e-hd-multiplicative-fs-additive
  asked: 2026-11-02
  question: The criterion requires every exclusion reading to hold, including reading (b), which
    excludes an ArchT cell when either the light modulation or the tuning correlation is not
    significant. The Methods say the exclusion removed 1 of 47 PoSub-FS cells and no cells from
    other populations, which reading (b) cannot match. Should reading (b) be dropped from the
    criterion, leaving (a) and the code's (c)?
  passage: Significance of the tuning curve correlation was determined by the Pearson correlation
    coefficient (significance threshold of 0.05). This led to the exclusion of 1 of 47 PoSub-FS
    cells and no cells from other populations. (Methods, Gain modulation analysis, experiment)
  why: Here reading (b) excludes 31 of 62 ArchT HD cells and 4 of 33 FS cells, and under it the
    HD additive factors differ from control (p = 0.015), the one condition that fails; readings
    (a) and (c) exclude 0 HD and 0 or 1 FS cells, as the Methods report, and every condition
    holds under them. Without reading (b) the claim would be reproduced; as written it is
    partially reproduced. The verifier of round 1 reported this as a misreading.
