questions:
- claim: fig3b-home-cage-gamma-increases-with-movement
  asked: 2026-11-06
  question: >-
    The criterion judges the home-cage rise on a one-way ANOVA over quartiles whose observations are
    the per-rat quartile means, without normalization. Does the paper support that reading, or
    should the epoch-level test (which the criterion shows as a variant for the arena claim) or a
    test on per-animal normalized values be a reading that can decide the outcome? The same choice
    decides fig3b-matched-movement and, for the absence, fig3b-arena-gamma-unrelated-to-movement.
  passage: >-
    BF gamma activity increased with locomotor behavior in the home cage (one-way ANOVA...), and
    gamma suppression during exploration remained highly significant when LFP epochs matched for
    movement were analyzed (e.g., the fourth and third movement quartiles for home cage and arena,
    respectively; one-way ANOVA (Results, BF Gamma Deactivation During Exploration, paragraph 2;
    Figure 3B). The SI Materials and Methods say the quartile means were "averaged across animals".
  why: >-
    With six rats whose home-cage gamma ranges from 36 to 145, the per-rat one-way ANOVA puts the
    between-rat spread in the error term: the home-cage rise gives p = 0.82 (eta squared 0.045)
    although gamma rises from Q1 to Q4 in 6 of 6 rats, and the matched comparison gives p = 0.070
    although the home cage is higher in 6 of 6 rats. The ANOVA over epochs gives p = 3.9e-46 for
    the rise, the one-way ANOVA on values divided by each rat's mean p = 1.6e-09 for the rise and
    7.5e-08 for the matched comparison, and a repeated-measures ANOVA p = 2.0e-05. Both claims
    would be reproduced under any of these; the arena absence holds under all of them (p > 0.1).
    Raised by the round-1 verifier.
