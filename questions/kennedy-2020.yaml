dandiset: "001182"
paper: doi:10.1038/s41586-020-2728-4
questions:
- claim: imaging-cell-counts
  asked: 2026-11-10
  question: >-
    The expected value "cells imaged per day", 187.3 +/- 8.1, has the unit "cells per mouse per
    day". Is the paper's 187.3 the number of cells per mouse and day, or the number of cells imaged
    on each day summed over the five mice? The sentence gives "n=5 mice" and "187.3±8.1 cells
    imaged per day" side by side, and the Methods say "Roughly half of all cells could be
    registered across all three days", against 78 tracked cells. Should the unit be cells per day
    summed over the five mice, and the 78 tracked cells the total over the five mice?
  passage: >-
    "Head-fixed mice were imaged on three consecutive days, during ten second presentations with a
    pseudorandomized set of stimuli (cf. Fig. 1f ; n=5 mice, 187.3±8.1 cells imaged per day, 78
    cells tracked across days.)" (Results, paragraph 5). "Roughly half of all cells could be
    registered across all three days of imaging." (Methods, Microendoscopic imaging data
    acquisition and processing).
  why: >-
    Per mouse and day the dataset holds 37.47 cells (SEM 3.26), outside 187.3 +/- 8.1, so the claim
    is not reproduced as the file has it. Summed over the five mice the three days hold 203, 183
    and 176 cells, a mean of 187.33 with an SEM over days of 8.09, the paper's numbers exactly. If
    78 tracked cells were per mouse, every mouse would need at least 78 cells on each day; all five
    have fewer (20 to 47 on their smallest day), while 78 in total is 42% of 187.3, the "roughly
    half" of the Methods. With the unit corrected, the cells per day would match and only the
    tracked count, which the dataset cannot give, would remain untested.
  answer: >-
    Changed. The claims file misread the unit. The sentence alone allows both readings, but the
    paper's other counts rule out cells per mouse and day. Fig 2j gives "n = 202 rat-responsive cells
    from 5 mice across 3 days" and Fig 3e "n = 133 USS-responsive cells", and the text says 74.4% of
    neurons respond to at least one stimulus. At 187.3 cells per mouse and day the 5 mice would hold
    about 2810 cell-days, and about 2090 of them would have to respond, far beyond those per-stimulus
    counts. At 187.3 cells per day summed over the mice there are about 562 cell-days and 418
    responders, which fits. So the unit is now "cells per day, summed over the 5 mice". The 78
    tracked cells are a total over the five mice, 42% of 187.3, the "Roughly half of all cells could
    be registered" of the Methods. The statement and criterion now say this, the two-reading clause
    for the tracked count is gone, and the claim is reproduced when both counts are within tolerance.
    The dataset's numbers in the question were not used.
  answered: 2026-11-10
