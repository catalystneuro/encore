# Questions from attempt hernandez-perez-2020-01 (author-revise-1, 2026-11-11) about the claims file
# claims/hernandez-perez-2020.yaml. Raised by the round-1 verifier and asked under
# docs/protocol.md, "Hand over for verification"; the claim is tested as written.
dataset: crcns:hc-27
paper: doi:10.7554/elife.52289
questions:
- claim: fig5c-rise-decay-gradient
  asked: 2026-11-11
  question: >-
    The criterion takes the index as log10 of rise over decay duration, from the Methods. The
    Figure 5A legend says only "log". Should the criterion also allow the natural log as a reading,
    and so the same for fig5c-peak-trough-gradient, whose index the criterion takes from the Figure
    5A legend?
  passage: >-
    Methods, Asymmetry analysis, "The log 10 transform of this ratio was then taken to create the
    index." Figure 5A legend, "The rise/decay asymmetry was calculated as the log of the ratio
    between the duration of the rising and decaying phases ... The peak/trough asymmetry was
    calculated as the log of the ratio of the peak and trough durations".
  why: >-
    With log10 the main reading gives -0.171 (dorsal) and -0.049 (ventral), outside -0.43 +/- 0.14
    and -0.11 +/- 0.02 in every combination, and the claim is recorded as partially reproduced.
    With the natural log the same medians are 2.303 times larger, -0.393 and -0.112, both within
    tolerance, and 5 of 12 combinations meet every part. The peak/trough claim is reproduced either
    way (0.253 and -0.088 with the natural log).
