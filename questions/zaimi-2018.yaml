dandiset: "001436"
paper: doi:10.1038/s41598-018-22181-4
questions:
- claim: macaque-myelin-underestimated
  asked: 2026-11-10
  question: >-
    The statement says the TEM model "slightly" underestimates the myelin of the macaque sample,
    but the criterion tests only the direction (predicted myelin area below the ground truth's).
    Should the criterion also bound the size of the underestimate, for example a predicted myelin
    area not far below the ground truth's, so that "slightly" is tested? The verifier of round 1
    reported that the claims file drops "slightly".
  passage: >-
    "Note that myelin sheaths of the macaque TEM sample are slightly underestimated when compared
    to the ground truth segmentation." (Discussion, Performance metrics, paragraph 1). Table 3 gives
    a myelin Dice of 0.7519 for the macaque sample.
  why: >-
    On the 7 macaque images of the White Matter Microscopy Database whose masks fit them, the
    predicted myelin area is 0.352 to 0.512 of the ground truth's, so the direction holds on every
    image and the claim is reproduced as the criterion stands. An underestimate of about half is not
    slight; with a bound on the size, the claim would not be reproduced on these images.
