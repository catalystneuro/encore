# Questions from attempt pakhomov-2023-05 (author revision after verifier round 1, 2026-11-18)
# about claims/pakhomov-2023.yaml. Each was reported by the round-1 verifier as a gap in the claims
# file and is asked under docs/protocol.md, "Hand over for verification"; the claims are tested as
# written.
paper: doi:10.1016/j.bioelechem.2023.108437
questions:
- claim: fig6a-more-packets-more-uptake
  asked: 2026-11-18
  question: >-
    The criterion gives the reproduced outcome when the rise 4 < 20 < 40 packets holds at all three
    places and the centre exceeds the trough for every treatment, and the partial outcome when the
    rise holds at one or two places. It gives no outcome when the rise holds at all three places
    and the centre-above-trough test fails for some treatments. Should that case be partially
    reproduced, or not reproduced?
  passage: >-
    "Increasing the total number of applied packets from 4 to 20 and 40 profoundly enhanced the
    electroporative YP dye uptake throughout the electrode array (Fig. 6A). The peak of
    electroporation in the center was clearly discernable for all tested treatments." (Results
    3.3, paragraph 1)
  why: >-
    This is the case in the data. The rise holds at all three places in all 48 readings, and the
    centre is above the trough for 10Px4 but not for 1Px4 (paired p = 0.20) or 5Px4 (p = 0.13).
    The attempt reads it as partially reproduced; a rule that the peak test is required would make
    it not reproduced.
- claim: fig9c-restricted-to-center
  asked: 2026-11-18
  question: >-
    The criterion requires the centre to be the highest point of the mean profile at each of 1, 2
    and 3 mm. At the ROI spacing (33 or 65 um), a single noisy ROI near the centre can exceed the
    centre ROI even when the profile peaks there. Is a strict maximum at the ROI resolution the
    intended reading of "restricted almost exclusively to the remote target (center)", or should
    the peak be allowed within some distance of the centre?
  passage: >-
    "Consistent with these measurements, YP fluorescence images in Fig. 9C show that
    electroporation is restricted almost exclusively to the remote target (center) when
    electrodes are placed above the cell monolayer." (Results 3.5, paragraph 1)
  why: >-
    The centre is the highest point at all three gaps in none of 96 readings; in the main reading
    the maximum at 2 mm is 0.44 mm from the centre. The paired centre-above-periphery test also
    fails at 3 mm in every supported reading (and at 2 mm in the main reading, p = 0.051), so a looser peak rule would not by itself change the outcome, but it
    changes what the criterion tests.
- claim: fig8a-equal-center-uptake
  asked: 2026-11-18
  question: >-
    The expected ranges of fig8a-equal-center-uptake (193.5 to 258.5 a.u.) and
    fig8a-more-uptake-near-electrodes (225 to 385 and 108 to 132 a.u.) assume that the paper's a.u.
    from MetaMorph are on the scale of the raw pixel values of the deposited images. The paper does
    not say how its a.u. relate to the camera counts, or whether a background was subtracted.
    Should these absolute values be compared with the deposited pixel values, or should the
    criteria rest on the comparisons between packets only?
  passage: >-
    "Packets 1, 2, and 3 caused the same YP uptake in the center of the array (215-235 a.u.), but
    packets 1 and 3 caused much more uptake near the electrodes (250-350 a.u. vs. ~120 a.u. for
    packet 1, p<0.01)" (Results 3.4, paragraph 2); "Fluorescence intensity was measured with
    MetaMorph 7.8.13" (Methods 2.4)
  why: >-
    The deposited centre values are 378 to 692 a.u. in the main reading and outside the range in
    all 576 readings, so the absolute ranges fail whatever the analysis. Both claims also fail on
    the comparisons (a pair of centres differs, p = 0.0009; Packet 3 is below Packet 2 near the
    electrodes), so the outcome would not change, but the criteria mix a scale check with the
    finding.
