dandiset: "001605"
paper: doi:10.1038/nn.4390
questions:
- claim: supp9-preserved-representation
  asked: 2026-11-03
  question: >-
    The criterion reads the legend's "difference" between the distance preference in continuous
    and in intermittent trials as an absolute difference. Is the paper's measure the signed
    difference instead? If so, what does "preserved the distance representation ... more than
    neurons in PM" compare: the signed values, PPC against PM, as the box plots show?
  passage: >-
    Supplementary Figure 9b legend, "Stability of distance representations. Plots show the
    difference in distance preference between continuous and intermittent conditions and compare
    PPC and PM". The y axis of Supplementary Fig. 9b is labelled "Difference to continuous
    condition (cm)" and runs from 37.7 to -58.6, with boxes on both sides of zero.
  why: >-
    A signed difference can be compared between areas in either direction, and its median can be
    near zero while its spread is large, so a Mann-Whitney test on signed values can differ in
    sign and significance from one on absolute values. In this attempt the after-reaching neurons
    of intermittent 1 have a median signed difference (continuous minus intermittent 1) of -2.10
    cm in PPC and -5.04 cm in PM, while the claim is tested on absolute differences, as the
    claims file has it.
  answered: 2026-11-03
  answer: >-
    Changed. Supplementary Fig. 9b plots the signed difference, "Plots show the difference in
    distance preference between continuous and intermittent conditions and compare PPC and PM",
    with the y axis "Difference to continuous condition (cm)" running from -58.6 to 37.7 and the
    Mann-Whitney stars placed on those signed boxes. So the test is most directly read as one on
    the signed values. The claims file was wrong to say that only an absolute difference can show
    which area preserved more, because a signed difference nearer zero also shows a better
    preserved preference. The criterion now tests PPC against PM on signed differences and judges
    "preserved more" by which area's median is nearer zero. It is reproduced when, in intermittent
    1, the after-reaching groups differ with P < 0.05 in at least one layer with the PPC median
    nearer zero, and no significant comparison has the PM median nearer zero. In the figure every
    starred box pair has PPC nearer zero, including the layer 2 group nearest 67 cm, where both
    medians are positive and PM's is the larger. The absolute-difference test stays as a variant
    that is reported but not judged. The statement, source, quote and statistics are unchanged.
