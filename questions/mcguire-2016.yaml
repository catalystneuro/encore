# Questions from attempt mcguire-2016-01 (author, 2026-11-11) about the claims file
# claims/mcguire-2016.yaml. The claims are tested as written.
questions:
- claim: fig2d-fixed-panel-impairs
  asked: 2026-11-11
  question: The claim has the default `data` (the data set), but CRCNS ssc-4 holds no fixed-panel
    trials, while the paper's S2 Data (doi:10.1371/journal.pbio.1002549.s002, sheet "Fig S2",
    section S2B) gives each rat's FFF minus SSS right-choice fraction for moving-panel and
    fixed-panel trials, the values the S2B Fig paired t test uses. Should the claim's data field be `elsewhere`, with `where` naming S2 Data, as for
    fig3-fsfs-sffs-intensity-only and s6-head-position-choice?
  passage: S2 Fig legend, "B, Behavioral effect of fixed panel trials ... Discrimination was
    reduced on fixed panel trials (p = 0.012, two-sided paired t test) ... Data are in S2 Data";
    Figure 2 legend, "Data for this figure are in S1 Data".
  why: As written the claim is blocked (data_missing), since the data set lacks the fixed-panel
    sessions. Tested on S2 Data, which the attempt shows as a variant, fixed-panel discrimination
    is lower in all six rats and the paired t test gives p = 0.0120 with the rat at 0 kept (0.0308
    without it), so the claim would be testable and would match the paper under reading (ii), and
    the criterion's readings (a) to (c) of the comparison could not all be told apart from these
    summaries.
  answer: Changed. The claim's data field is now elsewhere, with `where` naming S2 Data (S2B Fig) and S1
    Data (Figure 2D) of the PLOS supporting information. The paper's test of this finding is the
    S2B Fig paired t test, whose per-rat values the legend places in S2 Data ("Discrimination was
    reduced on fixed panel trials (p = 0.012, two-sided paired t test) ... Data are in S2 Data"),
    and the fixed-panel control was behaviour only, so the recorded data set does not hold it. The
    criterion now takes the per-rat values from S2 Data, so readings (a) to (c) need not be told
    apart; readings (i) and (ii) for the rat that completed no fixed-panel trials stay. The
    criterion also now asks for a lower fixed-panel value in at least five of six rats, since the
    legend says only that one rat "was not significantly impaired", which allows all six to be
    lower. The d-prime variant now comes from S1 Data.
  answered: 2026-11-11
