dandiset: "001266"
paper: doi:10.1038/s41467-025-55819-9
questions:
- claim: fig3d-distal-first-bap
  asked: 2026-11-01
  question: The claims file's shared method, item (4), sets the somatic spike threshold at 5 robust
    s.d. of the filtered trace and says this "cannot change the outcome" because the paper reports
    zero false positives and negatives at the soma (Fig. S2). Does the paper support that the
    threshold cannot change the outcome for the Fig. 3 counts? The Fig. 3 legend gives bAP totals
    (167 for soma, 170 for Soma + D2) that the recordings meet only with a lower threshold. The same
    item bears on fig3e-soma-third-bap, fig3f-soma-plus-distal and the other bAP-position counts.
  passage: Spikes were found by high-pass filtering and a threshold with a maximum; the threshold was
    set by hand (Methods, Counting bAPs and dSpikes). Fig. 3 legend, bAP totals soma 161 + 6 and
    Soma + D2 116 + 54. Fig. S2 reports no false positives or negatives for optical spikes at 1 kHz,
    measured on patched cells with their own hand-set threshold.
  why: In the soma and D4+soma files, 5 robust s.d. finds 139 to 150 bAPs, against the legend's 167
    and 170, and 4 s.d. finds 161 to 167. The missed spikes shift the bAP positions, so the outcome
    of fig3e and fig3f changes with the threshold (fig3f, 30 to 31 third-bAP dSpikes at 5 s.d.
    against 46 at 4 s.d.), and fig3d is within tolerance under both filters only at 4 s.d. (31 and
    32 of 54 at 5 s.d., 32 and 33 at 4 s.d.). The Fig. S2 result does not carry over, as it was
    obtained with the authors' own threshold. The attempt tests the claims as written, shows both
    thresholds, and adopts 4 s.d. as an assumption where the counts depend on it.
- claim: figs15-stochastic
  asked: 2026-11-01
  question: The criterion requires somatic spike times to stay "within 2 ms of each other across
    trials for the same bAP index". Does the paper claim that somatic spike times repeat across
    trials, or only that the somatic spike train is regular within a trial while the pattern of
    bAP propagation varies between trials?
  passage: Fig. S15 legend (Supplementary Information), "The spike train in the soma was regular,
    but the pattern of bAP propagation showed trial-to-trial variability, indicative of chaotic
    back-propagation." Results, Dendritic spike-rate accelerometer, period-doubling, and stochastic
    back-propagation, paragraph 3, "Even stronger stimuli evoked an epoch of seemingly random
    interplay of bAPs and dSpikes (Fig. S15), followed by sustained dSpike failures."
  why: The verifier of round 2 reads the legend as regularity within a train, which the criterion
    does not test. Across trials, somatic spike times at the same bAP position span 14 to 85 ms in
    the recording (s.d. 2.8 to 24 ms), which fails the 2 ms condition in every reading. Within a
    trial, the coefficient of variation of the somatic inter-spike intervals has a median of 0.29 to
    0.34; the paper gives no bound for "regular", so a within-train reading would need one before
    it could decide the claim. The other conditions (sequences that differ between trials, later
    bAPs that fail) also bear on the outcome, as the dSpike sequences differ only between 300 and
    400 µm.
