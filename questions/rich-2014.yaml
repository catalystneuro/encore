# Questions from attempt rich-2014-01 (author, 2026-11-12) about the claims file
# claims/rich-2014.yaml, asked under docs/protocol.md, Author, step 1.6. The attempt tests each claim
# as the file has it and shows the other reading as a variant; the outcomes stay as tested.
paper: doi:10.1126/science.1255635
questions:
- claim: fig4b-single-field-proportion
  asked: 2026-11-12
  question: >-
    The criterion reads "a wide range of environment sizes" as an interval of sizes spanning at least
    a factor of 10 over which the single-field proportion stays inside 4.5 to 11%. The factor of 10 is
    not in the text read, and the paper's own printed parameters (r 0.57, p 0.14) give a factor of 5.5
    under X-a (about 118 to 649 m) and 4.3 under X-b, so the claim cannot be reproduced even by the
    paper's fit. Is the factor of 10 a reading of the paper, or should the claim be judged on whether
    the proportion stays near 5 to 10% over the sizes Fig. 4B plots, once its legend is available?
  passage: >-
    Main text, page 817, paragraph 4, "the proportion of cells with single fields would remain at ~5 to
    10% over a wide range of environment sizes, potentially enabling a simple readout of location (Fig.
    4B)"; Materials and Methods, Active subset simulation, "The proportion of cells with exactly one
    place field in environments of different sizes was calculated exactly from the gamma-Poisson
    model (fig. 4B)". The Fig. 4B legend is missing from the text read.
  why: >-
    The fitted model here gives 5 to 10% from 133 to 750 m (factor 5.7, X-a), close to what the
    printed parameters give, so the outcome (not reproduced) is set by the factor-of-10 threshold, not
    by the data. With a threshold of a factor of 5, or with the range of Fig. 4B, it could be
    reproduced.
- claim: fig4c-active-subsets
  asked: 2026-11-12
  question: >-
    The criterion judges the claim on the mean exclusive-OR proportion over pairs of environments both
    larger than 10 m, gamma-Poisson against the fitted equal-rate model. With each cell's propensity
    fixed across environments the gamma-Poisson cells are correlated between environments, and with
    the fitted equal rate (about 3.1 to 3.5 fields per 48 m) not all cells are recruited even at 50 m,
    so this mean is lower for the gamma-Poisson model (0.269 against 0.371, logarithmic sizes). The
    paper's statement is that the observed propensities let environments over a wider range of sizes
    be distinguished, and Fig. S18 contrasts the gamma-Poisson with equal rates that are low or high.
    Is the mean over pairs larger than 10 m against the fitted equal rate a reading of Fig. 4C, or
    should the comparison be the range of size pairs that are distinguished, or the equal-rate
    conditions of Fig. S18?
  passage: >-
    Main text, page 817, paragraph 4, "equal propensities would lead to difficulties in distinguishing
    environments based on their active subsets, because large-enough environments would recruit all
    cells. Instead, the observed distribution of propensities allows environments with a wider range of
    sizes to be distinguished based on their active subsets"; Fig. S18 legend, "The equal-rate-Poisson
    high rate condition has an almost zero proportion of cells distinguishing active subsets in between
    larger environments since all cells are recruited." The Fig. 4C legend is missing from the text
    read.
  why: >-
    Under the criterion the claim is not reproduced. As a variant, the share of all pairs of different
    environments with an exclusive-OR proportion above 0.2 is 0.662 for the gamma-Poisson and 0.701
    for the fitted equal rate with logarithmic sizes, but 0.948 against 0.830 with linear sizes; against
    twice the fitted rate the gamma-Poisson is higher under both (mean over pairs above 10 m 0.269
    against 0.153). Another reading of the comparison could change the outcome.
