dandiset: "001746"
paper: doi:10.1038/s41556-026-02009-4
questions:
- claim: fig3e-phase-peak-index
  asked: 2026-11-03
  question: The criterion reads the Methods' "the point with the lowest derivative value" as the
    point of the rising phase where d2V/dt2 is lowest before the global maximum (the shoulder).
    Does the passage name a point of the second derivative, or the point of lowest dV/dt (the
    derivative of the phase plot)? Taken literally, d2V/dt2 falls towards 0 at the dV/dt maximum,
    so its lowest point before the maximum lies next to the SD peak and a monophasic AP scores
    about 0, the most saddle-like value.
  passage: We selected the peak point of each phase to calculate the peak of each phase. If there
    was no clear phase peak, the point with the lowest derivative value was defined as the phase
    peak. (Methods, Calculation of the phase peak index)
  why: The verifier of round 2 found that the shoulder branch, which reads 195 of the 237 first APs,
    gives APs without an AIS phase an index near 0 at the noise level of the files, and that the
    outcome changes with this reading. Under the lowest dV/dt of the rising phase such an AP scores
    about 0.8, the least saddle-like value. The attempt proposes to block the claim as
    methods_underspecified.
- claim: fig3e-phase-peak-index
  asked: 2026-11-03
  question: The criterion takes Psd as "the largest maximum after" the first local maximum (Pais) and
    does not require Psd > Pais. Should it? Without it the index can be negative (down to -0.897 in
    this attempt), and a negative index is read as more saddle-like than any positive one, where
    the paper's index of a saddle-like AP (AIS phase decaying before the SD phase) is a small
    positive number.
  passage: Ind = (Psd - Pais)/(Psd + Pais). Here, Ind is the phase peak index, Psd denotes the peak
    of the SD phase and Pais denotes the peak of the AIS phase. (Methods, Calculation of the phase
    peak index)
  why: Negative indices enter the group medians and the Dunn tests of fig3e-phase-peak-index and the
    regression of fig4i-peak-index-ais-distance-real; on the first APs with two resolved maxima the
    L6 PC median is -0.438.
- claim: fig7c-tau-rna-distance
  asked: 2026-11-03
  question: The criterion takes "the 12 clusters with more than five mapped Patch-seq neurons, as the
    code's notebook lists them (0, 1, 2, 4, 5, 6, 8, 14, 15, 16, 17, 18)". Clusters 1 and 4 hold 4
    and 5 Patch-seq cells in the cell table, so the rule and the list disagree. Which decides?
  passage: Pooling the pairs across all clusters revealed a high correlation (r = 0.53) between the
    membrane time constant (tau) distances and RNA distances (Fig. 7a-c). (Results, Transcriptomic
    distinctions underlie phenotypic variation, paragraph 1); the Methods give no minimum number of
    cells.
  why: Under the rule, clusters 1 and 4 drop out and 10 clusters (45 pairs) remain; under the list
    the attempt uses 12 clusters (66 pairs). The attempt's r is far from 0.53 under the list, but a
    later attempt could differ.
