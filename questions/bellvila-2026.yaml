dandiset: "001678"
paper: doi:10.1162/imag.a.1066
questions:
- claim: efield-20min-median
  asked: 2026-11-03
  question: >-
    Does the claims file read Methods 2.8 right in listing reading (i), each neighbour pair, for the
    "maximal electric fields in both directions"? The phrase reads most literally as reading (ii),
    the largest difference along each axis, combined by vector addition. And which rule decides a
    claim whose readings disagree? The opening comment says a claim whose readings give different
    outcomes is blocked as methods_underspecified, while the criterion of efield-1min-medians, which
    this claim follows, says it is reproduced when the medians are within tolerance under one
    reading.
  passage: >-
    "we calculated the difference in the aforementioned average peak voltages between neighboring
    electrodes along both axes and divided this difference by the distance between electrodes to
    compute the maximal electric fields in both directions ... The orthogonal electric field estimates were then combined using vector
    addition." (Methods 2.8). Figure 1D shows a distribution and a heatmap of fields, which fits
    one value per electrode pair or cell.
  why: >-
    Under reading (i) the median is 1.525 to 1.890 mV/mm depending on the pairing and whether the
    median is over rats or over estimates, within 1.65 +/- 0.21 in most variants; under reading
    (ii) it is 3.698, outside. If (ii) is the paper's method the outcome is not_reproduced; if the
    opening comment's rule applies, the claim is blocked as methods_underspecified. This attempt
    follows the criterion as written and records reproduced. The verifier of round 1 raised it.
