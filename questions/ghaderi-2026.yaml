dandiset: "001530"
paper: doi:10.1038/s41467-026-73622-y
questions:
- claim: fig1f-movement-latencies
  asked: 2026-11-02
  question: The criterion takes the maximum of each movement trace over 1.0 to 1.2 s and the latency as
    the first bin after 1.0 s that reaches 20% of it. With that window the latency cannot exceed
    200 ms, yet the paper reports 231 +/- 29 ms for the tongue, and the tongue trace keeps rising after
    1.2 s. Does the paper's "time to 20% max" take the maximum over a longer window (for example the
    1 s response window, 1.0 to 2.0 s), so that the criterion's window should change?
  passage: In quiet Hit trials, following the whisker deflection in Go-tone trials, mice rapidly
    initiated a sequence of movements starting with whisker protraction after ~30 ms (time to 20% max =
    58 +/- 8 ms), followed by jaw opening (115 +/- 17 ms) and then protrusion of the tongue (231 +/- 29
    ms) (Results, A short-term memory context-dependent whisker detection task, paragraph 3); the code
    Ghaderi2025_Figure1_f_Movements_Hit.m plots 0.9 to 1.2 s and computes no latency.
  why: Under the criterion's window the latencies are 48.2, 81.5 and 140.0 ms (reading a) and 65.2,
    83.3 and 153.6 ms (reading b), partially reproduced. With the maximum over 1.0 to 2.0 s, reading
    (a) gives 54.4, 115.3 and 192.4 ms, which would put the whisker and jaw values within tolerance
    and the tongue value closer.
  answer: Changed. The criterion took the maximum over 1.0 to 1.2 s, the window Fig. 1f plots (code,
    Ghaderi2025_Figure1_f_Movements_Hit.m, 0.8 to 1.2 s), but the paper reports "protrusion of the
    tongue (231 ± 29 ms)", a crossing past 1.2 s that no maximum over that window can give, so the
    window is not the paper's. Neither the text nor the code fixes it; the only post-stimulus
    window the paper states is the "1 s response window following the whisker stimulus" (Methods,
    Mouse behavior), which is also where the binned traces end (2 s). The criterion now takes the
    maximum over 1.0 to 2.0 s under both readings (a) and (b), and keeps 1.0 to 1.2 s as a
    variant only. Statement, quote and expected values are unchanged.
  answered: 2026-11-03
- claim: figs18-later-lick-coding
  asked: 2026-11-03
  question: The criterion reads the effect size as (a) Cohen's d of the lick against the no-lick groups
    or (b) the Kruskal-Wallis statistic. Could the paper's effect size be the plain difference of the
    mean projections of lick and no-lick trials, which neither reading covers?
  passage: at later times, neuronal activity in the lick coding direction showed significant
    differentiation between lick and no-lick trials in ALM, wM2, wS2 and wS1 ranked according to the
    effect size quantified at 0.2-0.4 s after the whisker stimulus with ALM being largest (Results,
    Context-dependent processing of the whisker stimulus, paragraph 4); the code
    Ghaderi2025_Sup_Figure18_SpontLick_CD_LickvsNolick_200mswindow.m computes no effect size.
  why: Both criterion readings put wM2 first (Cohen's d wM2 3.80, ALM 1.95; Kruskal-Wallis statistic
    wM2 49.2, ALM 24.5), so the claim is not reproduced, while the difference of the means ranks ALM
    0.46, wM2 0.35, wS2 0.18 and wS1 0.11, the paper's order, which would reproduce it.
- claim: fig8b-lick-coding-direction
  asked: 2026-11-03
  question: The criterion of fig8b-lick-coding-direction (and of figs18-later-lick-coding, which
    depends on it) takes the lick times and lick mask from data_helpers/Lick_times.mat on the Zenodo
    record, which the dandiset does not hold, but the claims carry no data field and so count as
    data dataset. Should they be marked data with_inputs?
  passage: Spontaneous licks are licks outside 0 to 6 s of any trial start, in bouts (lick mask, from
    Lick_times.mat) longer than 0.5 s (claims file, fig8b-lick-coding-direction criterion); code
    Coding_direction_SpontLick.m loads data_helpers/Lick_times.mat.
  why: It does not change the outcomes (fig8b reproduced, figs18 not reproduced), but it decides
    whether they count towards what is said about the dataset; the dandiset holds the piezo lick trace
    and the jaw trace but no detected lick times.
