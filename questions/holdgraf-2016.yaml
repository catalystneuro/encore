questions:
- claim: supp6a-connectivity-increase
  question: The criterion takes the seeds to be "the included electrodes". The Supplementary
    Methods restrict them to included electrodes on the temporal lobe ("Temporal seeds"), and the
    Supplementary Figure 6 legend says the same. Should the seeds be the included electrodes on
    the temporal lobe only? The criterion also explains the paper's 39 seeds (against 41 included)
    as seeds without a target in a region, which the paper does not say; with temporal seeds only,
    the paper's 39 would come from the location rule. Here, with the 9 included electrodes as
    seeds, frontal targets give P = 0.0039 and temporal targets P = 0.039 (reproduced); with the 6
    included temporal electrodes, P = 0.031 and 0.094 (temporal part not significant).
  passage: Supplementary Methods, Inter- and Intra-regional Coherence Analysis, "conducted with the
    HFB activity of electrodes included in eSTRF analysis as seeds (Speech-R and STRF-R, located on
    the temporal lobe, hereafter called Temporal seeds)"; Supplementary Figure 6 legend, "We
    defined a set of "seed" electrodes in the temporal lobe that were Speech-R and STRF-R."
  why: The seed set decides the temporal-temporal test here (P = 0.039 with all included
    electrodes, 0.094 with temporal ones), so the reading could change the outcome from reproduced
    to partially or not reproduced.
- claim: fig9-rms-increase
  question: The expected value is a mean RMS increase of 0.12 with an absolute tolerance of 0.03,
    but the paper gives no unit or scale for the RMS. The RMS of a standardized eSTRF convolved
    with a spectrogram depends on the number of features and the scale of the spectrogram, which
    the Methods do not fix; here it is about 105, and the increase 12.0 (0.12 to 0.13 of the BEFORE
    RMS). Should the criterion compare the increase as a fraction of the BEFORE RMS, or judge only
    its direction and P, since 0.12 cannot be put on a known scale?
  passage: Results, Filtered speech eSTRFs increase response to speech features, "the power in the
    AFTER condition was higher than power in the BEFORE condition (mean RMS increase 0.12±0.03";
    Methods, eSTRF unfiltered speech output power analysis (each eSTRF standardized to zero mean and
    unit s.d., convolved with the unfiltered spectrograms, RMS of the output); Figure 9c axis, about
    3.6 to 5.0.
  why: Under the absolute tolerance the claim cannot pass on any scale but the paper's unknown one;
    as a relative increase it is within tolerance (P = 0.031 to 0.034 under two readings), which
    would change the outcome from partially reproduced to reproduced.
- claim: speech-r-count
  question: The claims file lists the total of 468 electrodes as an expected value with a
    tolerance of 46.8, while the criterion says the total "is reported" and decides the outcome on
    the Speech-R count alone. Is the total meant to be judged? The data set holds 416 channels (377
    marked good), with grids of at most 64 channels against the paper's 48 to 110, so the total
    cannot match whatever the analysis does.
  passage: Results, HFB activity, paragraph 2, "These electrodes are subsequently called
    speech-responsive (Speech-R) and made up 92 of 468 total electrodes (19.6%"; Methods,
    Participants (grids of 48 and 64 channels at JH, 68, 68 and 62 at UCI, 110 and 104 at CU).
  why: The count, 101, is within 92 +/- 9.2, so the claim is reproduced on the criterion; if the
    total were judged, it would be partially reproduced (the verifier's outcome).
