  asked: 2026-11-03
  question: The criterion says the ATAC trajectories are run separately on WT (LL) and V321L (VV)
    cells. Does the paper say that LL is the wild type? The GEO sample records of GSE280167 give
    genotype VV with treatment Wild-type and genotype LL with treatment Homozygous V321L mutant, and
    the dandiset's surgery field says the same, so the parenthesis seems reversed.
  passage: Methods, Single-nucleus ATAC-Seq analysis ("(2) using cells for "VV" samples only, and (3)
    using cells for "LL" samples only"); the paper does not name the genotypes behind VV and LL.
  why: A later attempt that follows the parenthesis would run the WT analysis on the mutant samples and
    reverse the claim's two halves (three end points in WT, one in V321L). The claim is blocked in this
    attempt for another reason, so no outcome here changes.
  answered: 2026-11-03
  answer: The claims file changed. The parenthesis was reversed, and the criterion now reads WT (VV)
    and V321L (LL). The paper only names the samples ("using cells for "VV" samples only, and (3)
    using cells for "LL" samples only"), but V321L replaces valine with leucine at residue 321, so VV
    is the wild-type genotype and LL the homozygous mutant, and the paper's code
    (RajNINDS/V321L-snMultiome at c124726, Rcode_20230522.txt line 3532) merges the DG VV samples
    with project="WT". This agrees with the GEO records the question cites. The statement and
    expected values (three end points in WT, one in V321L, cluster 9 maximal) are unchanged.
