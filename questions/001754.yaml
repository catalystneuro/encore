# Questions from attempt 001754-knierim-2000-03 (author, 2026-10-20) about the claims file
# claims/001754/10.1038-72910.yaml. Each is asked under docs/protocol.md, Author, step 1.6; the
# attempt runs every reading it can see and records the claims whose outcome depends on the answer.
dandiset: "001754"
paper: doi:10.1038/72910
questions:
- claim: si-comparable-to-preflight
  also: [si-rat1-fd9-vs-preflight, si-rat3-fd4-vs-preflight, fd4-abnormal-selectivity, fig3-stability-across-sessions]
  asked: 2026-10-20
  question: Reading M-b recomputes rate maps from spikes and position. The dandiset gives position
    only at the spike times of each file's units, so no occupancy time can be computed from it,
    and the preflight files hold no position at all. Should M-b divide spike counts by the
    deposited occupancy map of the epoch (the attempt does this for the flight epochs), and when
    M-b cannot be computed for the preflight cells, is a comparison with preflight judged on M-a
    alone?
  passage: The Fig. 1 legend says all statistical analyses kept off-track positions; the paper
    gives no bin size, smoothing or occupancy rule.
  why: Unsmoothed 64 x 64 maps give a spatial information about twice that of the deposited maps
    (2.9 to 4.0 bits per spike in flight against 0.7 to 1.6 for M-a), so a test of M-b flight values against
    M-a preflight values finds a difference in every rat, and judging on M-a alone does not. The
    attempt judges these claims on M-a and shows the M-b flight values and the mixed test as
    variants.
  answered: 2026-10-20
  answer: The paper does not say. It is a two-page brief communication with no Methods, no
    supplement and no code; it gives the measure only by citation to Skaggs et al. (ref. 13),
    whose formula needs occupancy, and says only that "all statistical analyses included these
    off-track data" (Fig. 1 legend). Dividing spike counts by the epoch's deposited occupancy map
    is a reading it allows for M-b. It compares one index computed alike for both groups ("An
    index of spatial tuning specificity ... did not significantly differ between cells recorded
    preflight and those recorded on FD9"), so a comparison uses the same map reading on both
    sides; where M-b cannot be computed for preflight, the comparison is judged on M-a and the
    mixed test is a variant. Written into the criteria of si-comparable-to-preflight (which the
    rat 1 and rat 3 claims follow) and fd4-abnormal-selectivity, and into the opening comment.
- claim: si-comparable-to-preflight
  also: [si-rat1-fd9-vs-preflight, si-rat3-fd4-vs-preflight, fd4-abnormal-selectivity]
  asked: 2026-10-20
  question: Each preflight file holds one recording day with one epoch labelled ES and one
    labelled MC. Is each epoch a candidate session under S-a (as the attempt reads it), and under
    S-b, is the session closest before launch the later epoch of that day (MC in every rat) or the
    whole day?
  passage: The paper says rat 2 ran a flat rectangular track 4 days before launch (Fig. 2b) and
    names no track for rats 1 and 3.
  why: For rat 1 the flight day 9 cells do not differ from the preflight ES epoch (p = 0.50) and do
    differ from the preflight MC epoch (p = 0.0055), so the claim is blocked until the session is
    fixed.
  answered: 2026-10-20
  answer: The paper does not say. It never mentions ES or MC epochs; for rat 2 it says only that
    the preflight cells were "recorded 4 days before launch as the rat ran clockwise on a flat,
    rectangular track", and for rats 1 and 3 it says "that rat's preflight data" and "this rat's
    place cells before the flight". Each epoch is a candidate under S-a. Under S-b each epoch of
    the day closest before launch is run on its own, as the paper describes one track for rat 2
    and prefers neither epoch; the later epoch is not given. When the epochs disagree the claim
    stays blocked as the criterion says. Written into the criterion of si-comparable-to-preflight.
- claim: fig3-stability-across-sessions
  asked: 2026-10-20
  question: The criterion reads "most" as at least 4 of the 7 active cells of session 2. On the
    dandiset session 2 has 11 active cells under M-a and 16 under M-b, not 7. Is "most" then a count
    of at least 4, or a fraction of at least 4/7 (or a majority) of the active cells?
  passage: Fig. 3 legend, "Most place cells maintained the same firing locations, although the
    fourth cell lost its field".
  why: Under M-b, 6 of 16 cells keep their field by reading (a) and 1 of 16 by reading (b); as a
    count reading (a) passes and (b) fails, as a fraction both fail.
  answered: 2026-10-20
  answer: The paper gives it as a fraction of the cells shown. "Most" refers to "the same seven
    cells" of Fig. 3, the active cells of session 2, and the legend says "Most place cells
    maintained the same firing locations, although the fourth cell lost its field", so 6 of 7.
    "Most" is more than half of the active cells of session 2; the count of 4 in the criterion
    was that majority for the paper's 7 cells, not a fixed count. Cells that gained a field in
    session 3 are "not shown" and are not in the denominator. The criterion now reads more than
    half; the statement and the expected count of 7 are unchanged.
- claim: fig3-stability-across-sessions
  asked: 2026-10-20
  question: In the pinned version every Rat3 flight day 4 ES rate map has cell_number -1, and the
    table's link from cell_number to cluster_id fails elsewhere, so the deposited maps of session 2
    and session 3 cannot be paired by cell from the dandiset's identifiers. May reading M-a pair
    them through the unit whose spike-count map each deposited map matches best (shown as a
    variant), or is M-a not run?
  why: Paired this way, 6 and 5 of 11 cells keep their field under readings (a) and (b), which
    passes a count reading of "most" and fails a fraction reading.
  answered: 2026-10-20
  answer: The paper does not address it. It only requires that the maps of both sessions are of
    the same unit ("the same seven cells", Fig. 3 legend); how the dandiset's maps are tied to
    units is a question about the data. The criterion now allows M-a with the best-match pairing
    when each deposited map is tied to one unit and no unit to two maps, reported with the match;
    otherwise M-a is not run for this claim.
- claim: direction-selectivity
  asked: 2026-10-20
  question: The criterion computes, per bin, a counterclockwise rate and a clockwise expected
    count, which need the time spent in each bin in each direction. The dandiset has position only
    at spike times and one occupancy map per epoch, not split by direction, and nothing gives the
    track's layout in the image from which the circuit's direction could be read. Is there a reading
    the paper allows with these data, or does the claim stay blocked?
  why: Without a time base per direction no rate can be formed, so the attempt blocks the claim.
  answered: 2026-10-20
  answer: The paper gives no method, only "Some cells demonstrated place fields when the rat was
    moving only counterclockwise through a single location", and no track layout or time base by
    direction. It allows no reading that does without time spent per bin in each direction, so
    the claim stays blocked as methods_underspecified; the criterion now says so.
