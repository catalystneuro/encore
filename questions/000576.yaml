dandiset: "000576"
paper: doi:10.1016/j.neuroimage.2020.116705
questions:
- claim: hgp-soz-sensitivity-specificity
  asked: 2026-10-30
  question: The criterion reads the paper's 95% confidence intervals as two-sided exact
    (Clopper-Pearson) intervals. For the paper's own counts these are 59-100, 42-100 and 66-100%,
    against the printed 66-100, 42-99 and 66-99%. Is that the paper's interval, or does the paper
    use another binomial interval that the criterion should name?
  passage: With sensitivity (7/7 = 100% CI [66-100]%), high specificity (6/7 = 86% CI [42 99]%) and
    accuracy 93% (13/14, CI [66-99]%), HGP enhancement indicated amygdalar functional integrity
    (Results 2.1, paragraph 3); confidence intervals from the binomial distribution (Methods 4.11).
  why: The verifier of round 1 noted that the printed lower bound for 7/7 matches a one-sided 95%
    bound (0.05^(1/7), about 65%) and not the two-sided interval of the criterion. No single method
    run here (two-sided or one-sided Clopper-Pearson, Wilson, Jeffreys) gives all three printed
    intervals. The intervals are reported, not judged, so no outcome of this attempt changes; a
    later attempt would report against the right interval.
- claim: fig1e-hgp-not-delta-distinguishes-soz
  asked: 2026-10-30
  question: Does the claims file name the right tests for Fig. 1E? Run on the paper's own printed
    Table 2 values, the rank-sum test gives HGP p = 0.004 and DELTA p = 0.035, and the unpaired
    t-test HGP p = 0.002 and DELTA p = 0.013. Neither gives the legend's p = 0.019 for HGP, and both
    find DELTA different, against "HGP but not DELTA distinguishes". Is there a reading of the test
    (another test, a correction, a subset of amygdalae) under which the printed values give the
    legend's result?
  passage: HGP but not DELTA distinguishes between amygdalae within SOZ and outside SOZ (p = 0.019,
    not corrected) (Fig. 1E legend).
  why: Under the criterion's readings the claim fails on the paper's own values, so the claim as
    written cannot be reproduced even from Table 2. With these data the HGP MI does not differ under
    any counted reading (smallest p 0.084), so the outcome here does not change, but a test that
    matches the printed values could.
