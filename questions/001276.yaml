  question: The criterion asks that "Hoechst intensity inside the footprint is above background", without
    saying when the Hoechst image was taken or what the background is. The paper's Hoechst check was
    made on images taken after exposure, to show that cells inside the footprint had not detached.
    Should the criterion require post-exposure Hoechst images, and if so, name the reference level?
  passage: Methods 2.4, the Pr samples "were also re-imaged for Hoechst fluorescence, to check for
    possible cell loss due to detachment"; Results 3.2, Hoechst "proved that cells were still present
    and the lack of YP staining was not a result of cell detachment".
  why: This dandiset holds Hoechst images taken before exposure only. Under the criterion as written,
    with the camera offset as the background, both parts hold (center YP 1985 a.u. against at most 244
    from 2 to 7 mm; footprint Hoechst 20 to 60 times the camera offset and 0.74 to 0.99 of the
    monolayer), and the claim would be reproduced. If the criterion requires post-exposure images, the
    claim is blocked here, since those images are not in the dandiset.
