# Questions from attempt crcns-ofc-4-schuck-2016-01 (author revision after verification round 1,
# 2026-11-04) about the claims file claims/crcns-ofc-4/10.1016-j.neuron.2016.08.019.yaml, asked under
# docs/protocol.md, "Hand over for verification".
questions:
- claim: supp-errors-by-trial-class
  asked: 2026-11-04
  question: The verifier of round 1 reports that the claims file does not note a conflict in the paper
    on which trial was repeated after an error. The Figure 1B legend says errors on Internal and Exit
    trials led to a repetition of the preceding trial; the Methods (Task) say errors on Internal and
    Enter trials led to a repetition of the same trial and only errors on Exit trials to a repetition
    of the preceding trial. Should the claims file record this conflict, and which account do the
    claims on errors by trial class and on error trials follow?
  passage: Figure 1B legend, "Wrong responses led to a repetition of the same (Enter trials) or
    preceding trial (Internal and Exit trials)". Experimental Procedures, Task, "Erroneous or time-out
    responses led to feedback (0.7 s) and, for Internal and Enter trials, a repetition of the trial
    ... the trial preceding the error was repeated in these cases".
  why: The data set merges each error with its repetitions into one 'err' block, and the class of an
    error that does not follow an Exit trial, and so the class error rates, is read from the trials
    around its block. Which trial is repeated after an Internal error changes how a block is read. The
    attempt follows the Methods, which the data descriptor matches.
