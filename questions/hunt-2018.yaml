questions:
- claim: figs1cd-fewer-cues-more-accurate
  question: The criterion measures accuracy as the choice of the higher true expected value (as
    choice-accuracy-ev, reading a). The paper's script for Supplementary Figure 1c
    (InfoGathering_Behaviour.m, `out.accuracyNPV`, plotted by Fig1_2_S1_behaviour.m) judges each
    choice on the expected values of the pictures seen (unseen pictures at 0.5, the same measure as
    the reported 86.3% and 87.4%), per session, and averages over sessions. Should the criterion
    use that measure?
  passage: 'Supplementary Figure 1 legend, "(C) Subjects paradoxically were more likely to choose
    optimally, on average, on trials where 2 pictures were viewed rather than 3 or 4 pictures. (D)
    This effect can be straightforwardly explained by subjects terminating information sampling
    earlier, on average, on trials where the first two cues are more informative"; Results,
    Experimental paradigm and subject behaviour, paragraph 2, "Choice accuracy based upon the
    pictures observed".'
  why: With the criterion's measure, accuracy on 2-picture trials is not the highest (F 74.96%
    against 76.10% and 79.62%; M 78.83% against 78.79% and 81.51%) and the claim is not reproduced.
    With the script's measure it is highest in both monkeys (F 90.19% against 82.63% and 82.27%; M
    93.65% against 85.20% and 83.69%), and the claim would be reproduced.
- claim: fig7a-ofc-value-difference-neurons
  question: The criterion requires the OFC proportion to be the largest at both significance levels
    of O2 (p < 0.05 and p < 0.01). The paper's script for Figure 7 (Fig7_single_neurons_cue2and3.m)
    uses one threshold for the value difference tests, |T| > 1.64 on each of the three T-statistics
    (its comment, `norminv(0.05)`), and 1.96 for belief confirmation. Should the criterion use the
    script's threshold, or require one of the two readings, in place of both?
  passage: 'Results, Single neuron analyses recapitulate core findings at population level,
    paragraph 2, "To consider a neuron as representing value difference, we required that the
    contrast of parameter estimates (i.e. (Value Attended) - (Value Unattended)) be significant,
    and also that (Value Attended) and (Value Unattended) be independently significant with
    opposing signs. At all three relevant timepoints, we found that a greater proportion of single
    neurons passed these criteria in OFC than in ACC/DLPFC ( Fig. 7a )."'
  why: With the Figure 5 trial types, OFC has the largest proportion at all three tests at 250 ms
    for p < 0.05 and at 300 ms for p < 0.01, but no single bin passes at both levels, so the claim
    is partially reproduced. With the script's threshold it passes at both bins and would be
    reproduced.
