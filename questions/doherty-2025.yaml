paper: doi:10.1038/s41531-025-01070-4
questions:
- claim: fig2c-control-it23-rate-activated
  asked: 2026-11-02
  question: The claims file reads the population rates in two ways, R1 (all cells of the
    population, silent ones at 0) and R2 (cells with at least one spike in the last 2.3 s). Does
    the paper's text also allow a third reading, R3, the cells that fired at least once in the
    4.3 s simulation, with rates over the last 2.3 s? If so, should R3 be added to the readings of
    the rate claims? The same question applies to fig2c-control-it6-rate-activated,
    control-it5-silenced-activated, control-it4-rate-activated, fig5c-pd-it23-rate-activated,
    pd-it5-silenced-activated, pd-it6-rate-unchanged, rest-it4-rate-pd-vs-control,
    rest-it5a-rate-pd-vs-control, activated-it6-rate-pd-vs-control and pt5b-highest-rate.
  passage: >-
    Statistically significant change was found for firing rates for excitatory cell types
    going from rest to activated ... (mean, std dev, range shown; *** p < 0.001; #, truncated
    maximum rate 73 spikes/s; calculated from the last 2.3 s of 4.3 s simulation to avoid
    initialization transients). (Fig. 2C legend; also Fig. 5C legend.) The paper does not say
    which cells enter a population's mean, and the dandiset's units tables hold only the cells that
    fired at some time in the simulation.
  why: Under R1 and R2 none of the IT claims has its values within tolerance (for example IT2 at
    control rest, 0.095 and 1.555 spikes/s against 1.2). Under R3 every IT value the claims give
    is matched to the printed decimal, including the standard deviations (IT2 1.203 +/- 1.649 and
    6.662 +/- 8.858 against 1.2 +/- 1.6 and 6.7 +/- 8.9; IT6 5.82, IT5A 3.25, IT5B 3.08, IT4 2.57,
    parkinsonian IT2 0.783 +/- 1.105 and 4.295 +/- 7.066). For PT5B all 1,435 cells fire, so R1
    and R3 coincide and match. Ten claims are not reproduced under R1 and R2, and
    pt5b-highest-rate is blocked; they would be decided again under R3, whose values and tests are
    in the notebook as a variant.
  answer: >-
    Changed. The legends say only that rates are "calculated from the last 2.3 s of 4.3 s
    simulation to avoid initialization transients" (mean, std dev). That fixes the window of the
    spikes counted. It does not fix the neurons averaged over, and the paper's code
    (pd_m1_6ohda at 0a1f0e8) holds no rate analysis. Neurons that fired at least once in the
    4.3 s simulation, with those silent in the window counted at 0, fit this text as well as R1
    and R2 do, and they fit the 0 spikes/s IT5A and IT5B activated rates. NetPyNE 1.0.5
    plotSpikeStats, the software the Methods name, gives R2 by default and R1 with includeRate0,
    but the paper does not say it was used, so this does not rule R3 out. R3 is added to the
    definitions in the opening comment. Every rate criterion that read "readings R1 and R2" now
    reads "readings R1, R2 and R3", including the three PT5B rate claims, where R3 changes
    nothing when every PT5B neuron fires. control-it5-silenced-activated (and so
    pd-it5-silenced-activated) now uses R1 and R3, and pt5b-highest-rate accepts R1, R2 or R3.
    Expected values, tolerances and tests are unchanged. This answer was reached from the paper's
    text. The fit to the data reported in the question played no part in it, and an outcome that
    holds only under R3 rests on that reading as an assumption.
