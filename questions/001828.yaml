# Questions from attempt 001828-mantas-2024-01 (author, 2026-10-21) about the claims file
# claims/001828/10.1101-2024.12.22.629963.yaml. Each is asked under docs/protocol.md, Author, step 1.6;
# the attempt runs every reading it can see, or blocks the claim until the answer.
dandiset: "001828"
paper: doi:10.1101/2024.12.22.629963
questions:
- claim: fig3d-anxa1-ramp-to-touch
  asked: 2026-10-21
  question: The photometry sessions of the water drop task are stored as reaching sessions whose
    annotated events (all made with the mouth) are labelled correct (drop retrieved), drop,
    semidrop, miss and empty (reach to an empty spout). Which of these is the "water drop touch"
    the signals are aligned to, (a) correct only, or (b) every contact with a drop (correct, drop
    and semidrop)? The same question applies to fig3e-dlight-dcp-ccp-reward and
    fig3fg-auc-change-from-baseline.
  passage: Results, Anxa1+ DANs do not encode motivational value, paragraph 1, "The recorded
    signals were synchronized with licking behavior, tracked via a high-speed camera"; legend of
    Figure 3D, "Z-scores of FP signals aligned to the water drop touch". No passage names the
    event types.
  why: Drop and semidrop events are few in most sessions but make up most events in some (for
    example 29 drops against 6 correct in one Anxa1 session), so the mean AUC per recording can
    change. The attempt runs both readings.
- claim: fig3d-anxa1-ramp-to-touch
  asked: 2026-10-21
  question: The dataset holds more recordings of this task than the legend of Figure 3D and 3E
    counts (Anxa1 GCaMP-dCP 15 sessions of 6 mice against 10 of 7; DAT GCaMP-dCP 8 of 5 against
    4 of 3; dLight-dCP 21 of 7 against 13 of 6; dLight-cCP 15 of 6 against 11 of 6). Does the
    paper say which sessions were kept (for example one session per day, the first sessions, or
    a minimum number of events), and does "Artifacts and instances of signal intensity loss were
    excluded" remove whole recordings or only stretches of signal?
  passage: Methods, Fiber photometry recordings, "Artifacts and instances of signal intensity loss
    were excluded from the final data set."
  why: The RM ANOVA and the Sidak tests depend on which recordings enter. The attempt uses every
    session of the right group and site with at least one event, and reports the result per mouse.
- claim: figs2-evoked-da-dcp-ccp
  asked: 2026-10-21
  question: The dataset holds 20 sessions of evoked dLight release, two Anxa1-Flp mice with the
    fiber in dCP and two in cCP, each at five laser powers (0.1, 0.2, 0.5, 1 and 2 mW), with 144
    to 175 trains per session. Which powers enter the dCP against cCP comparison (all, pooled per
    session, or one power), is the unit the session or the mouse, and over which window before
    the train is the pre-stimulus baseline taken?
  passage: Results, Specialized organization of Anxa1+ DANs, paragraph 2, "Optogenetic activation
    of Anxa1+ DANs at varying intensities elicited DA release in the dCP (Figure S2)." Figure S2
    is not in the text read.
  why: With two mice per site, a test over mice has no power and a test over sessions pools
    powers; the outcome can differ between them. The attempt runs sessions pooled over powers (10
    against 10), each power alone, and a per-mouse summary, with a 1 s baseline before each train.
- claim: fig6j-reaching-accuracy
  asked: 2026-10-21
  question: The reaching sessions carry manually annotated events labelled correct, drop,
    semidrop, miss, empty (a reach to an empty spout) and unknown, each with the paw used and its
    distance from the spout in cm. Which of these are the "grasp attempts" of the target accuracy
    fraction (all labelled reaches, or all but empty and unknown), and is the preferred forelimb
    chosen per mouse over all its sessions or per session?
  passage: Methods, Forelimb reaching task, "Behavioral events and distances from the waterspout
    were manually analyzed and measured using Kinovea"; legend of Figure 6J. No passage defines a
    grasp attempt or the preferred forelimb.
  why: Empty-spout reaches are a large share in some sessions (up to 191 of 400), and their
    distances may differ from reaches to a drop. The attempt runs both event sets with the
    preferred limb per mouse, and per session as a variant.
- claim: fig6j-reaching-accuracy
  asked: 2026-10-21
  question: The sessions are labelled by test phase (test1, test2, test4, test8), and the dataset
    holds more mice than the legend (TeTx cohort 10 TeTx and 10 controls; Arch cohort 10 Arch and
    7 controls, recorded from 2023 to 2025). In the Arch cohort the session metadata say the laser
    was switched on after the first reach in test1, on in test2 and test4, and off in test8,
    while the Methods say it was off on the first day and on for the last three. Which test
    phases are the first and the fourth session of Figure 6J, and are the controls of Figure 6J
    the TeTx littermates, the Arch littermates, or both?
  passage: Methods, Forelimb reaching task, "For Arch experiments, the laser remained off during
    the initial 4 days (habituation and the first day of reaching) and was activated during the
    final 3 days of the experiment."
  why: The group sizes and the day-1 and day-4 values depend on it. With test1 and test4, mice
    with annotated reaches on both days, and the controls of both cohorts pooled, the mice
    recorded before the preprint was posted number 8 controls and 4 TeTx, as in the legend, and 5
    Arch against 6. The attempt runs all mice with both days and, as a variant, those recorded
    before the preprint.
- claim: fig1b-anxa1-downregulated-rnaseq
  asked: 2026-10-21
  question: GEO GSE282753 is public (since 2026-10-20) but holds only MitoPark and control counts
    (7 control and 6 MitoPark mice at 10 weeks, each with 3 to 12 technical libraries), not the
    cMfn2KO-early data the claim also needs. Does the paper name where the cMfn2KO counts are
    deposited, and how are the technical libraries of a mouse combined before the differential
    expression test?
  passage: Code and data availability, "The RNA-seq dataset generated and analyzed during the
    current study will be available upon publication (NCBI Gene Expression Omnibus, accession
    number GSE282753)"; legend of Figure 1A, "MP-early (n = 5) and cMfn2KO-early (n = 5)".
  why: The claim holds only if Anxa1 is down in both models. Without the cMfn2KO counts it cannot
    be tested, and the MitoPark result can depend on whether libraries are summed per mouse or
    treated as samples. The claim is blocked until answered.
