- claim: fig6j-reaching-accuracy
  asked: 2026-10-21
  question: The reaching sessions carry manually annotated events labelled correct, drop,
    semidrop, miss, empty (a reach to an empty spout) and unknown, each with the paw used and its
    distance from the spout in cm. Which of these are the "grasp attempts" of the target accuracy
    fraction (all labelled reaches, or all but empty and unknown), and is the preferred forelimb
    chosen per mouse over all its sessions or per session?
  passage: Methods, Forelimb reaching task, "Behavioral events and distances from the waterspout
    were manually analyzed and measured using Kinovea"; legend of Figure 6J. No passage defines a
    grasp attempt or the preferred forelimb.
  why: Empty-spout reaches are a large share in some sessions (up to 191 of 400), and their
    distances may differ from reaches to a drop. The attempt runs both event sets with the
    preferred limb per mouse, and per session as a variant.
  answer: >-
    The paper does not say. Accuracy is "the percentage of grasping attempts made within the target
    (< 0.2 cm) with the preferred forelimb" (Results), and an attempt is described as start,
    "grasping upon contact with the water droplet", and retraction; Figure 6F shows on- and
    off-target efforts. No passage lists event types or how the preferred forelimb is chosen. The
    criterion of fig6j-reaching-accuracy now names (a) every labelled reach with a distance and (b)
    all but empty and unknown, each with the preferred limb (i) per mouse and (ii) per session.
    Claim unchanged.
  answered: 2026-10-21
- claim: fig6j-reaching-accuracy
  asked: 2026-10-21
  question: The sessions are labelled by test phase (test1, test2, test4, test8), and the dataset
    holds more mice than the legend (TeTx cohort 10 TeTx and 10 controls; Arch cohort 10 Arch and
    7 controls, recorded from 2023 to 2025). In the Arch cohort the session metadata say the laser
    was switched on after the first reach in test1, on in test2 and test4, and off in test8,
    while the Methods say it was off on the first day and on for the last three. Which test
    phases are the first and the fourth session of Figure 6J, and are the controls of Figure 6J
    the TeTx littermates, the Arch littermates, or both?
  passage: Methods, Forelimb reaching task, "For Arch experiments, the laser remained off during
    the initial 4 days (habituation and the first day of reaching) and was activated during the
    final 3 days of the experiment."
  why: The group sizes and the day-1 and day-4 values depend on it. With test1 and test4, mice
    with annotated reaches on both days, and the controls of both cohorts pooled, the mice
    recorded before the preprint was posted number 8 controls and 4 TeTx, as in the legend, and 5
    Arch against 6. The attempt runs all mice with both days and, as a variant, those recorded
    before the preprint.
  answer: >-
    In part. Day 1 and day 4 are the first and fourth of the training sessions, which ran "for 4
    consecutive days in 15-minute sessions" after habituation, with "the laser remained off during
    the initial 4 days (habituation and the first day of reaching) and was activated during the
    final 3 days" (Methods); the paper does not use the labels test1 to test8, so the first and
    fourth training sessions of each mouse are used and laser labels that differ are reported.
    The legend has one control group, "Ctrl mice (n = 8)", in one RM two-way ANOVA with both
    silenced groups, so the controls are one pooled group; the cohort they come from is not
    given. Data recorded after the preprint cannot be in the figure, so the criterion now takes
    the mice recorded before it as the main run and all mice as a variant. Of note, 8 + 4 + 5 = 17
    mice fits the printed F(2,14), where 8 + 4 + 6 does not. Claim and expected values unchanged.
  answered: 2026-10-21
