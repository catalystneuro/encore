dandiset: "000469"
paper: doi:10.1101/2025.10.31.684900
questions:
- claim: fig6cd-celltype-epochs
  asked: 2026-11-10
  question: >-
    The criterion reads M1 to M3 as the Methods' three consecutive 1 s windows from maintenance
    onset or as the code's thirds of the whole concatenated train. The Fig. 6c legend defines them
    as "the first, second, and final thirds of the maintenance epoch", that is, thirds of each
    trial's own maintenance (2.53 to 2.84 s here). Should the criterion list this as a third reading
    of M1 to M3, here and in the claims that use the same windows (fig4f-all-cells-epochs,
    fig4hj-group-epochs, ext2-bursts-loads23, ext5bd-in-load-dependence)?
  passage: >-
    Fig. 6 legend, panel c, "Burst counts across task epochs (encoding; maintenance M1, M2, M3;
    probe) in load 1 trials for pyramidal neurons (PY), where M1, M2, and M3 denote the first,
    second, and final thirds of the maintenance epoch." The Results (Distinct temporal activity
    patterns, paragraph 3) say "Dividing the maintenance period into three consecutive 1 s windows
    (M1-M3) yielded the same pattern", and the Methods (Burst detection) give 1 s windows.
  why: >-
    The three readings count different bursts in M3: the Methods' third window runs from 2 s to
    the end of maintenance (0.5 to 0.8 s), the code's thirds split the trials and not the
    maintenance, and the legend's thirds last 0.84 to 0.95 s each. The verifier of round 2 noted
    that the claims file misses the legend's reading. It was run here as a variant (M-trial) for
    all five claims and gives the same outcomes as the readings the criteria list (for fig6cd, PY
    have no significant pair at any load and IN rise at M1 to M3 but not at the probe), so it does
    not change an outcome here.
- claim: fig4f-all-cells-epochs
  asked: 2026-11-10
  question: >-
    As for fig6cd-celltype-epochs, the criterion's M1 to M3 are the Methods' 1 s windows or the
    code's thirds of the concatenated train; should the per-trial thirds of the maintenance epoch,
    the definition of the Fig. 6c legend, be added as a reading?
  passage: >-
    Fig. 6 legend, panel c, "M1, M2, and M3 denote the first, second, and final thirds of the
    maintenance epoch"; Methods, Burst detection, three 1 s windows.
  why: >-
    The M3 count depends on the window: under the Methods' windows M3 lasts 0.67 s on average and
    its count is lower. Under the legend's thirds (run here as a variant, M-trial) all neurons
    burst more in M1, M2 and M3 than in encoding (BH p 0.0006 to 0.0007) and the probe does not
    differ (0.68), as under the listed readings, so the outcome does not change here.
