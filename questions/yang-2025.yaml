dandiset: "001212"
paper: doi:10.1109/tnsre.2025.3614867
questions:
- claim: fig3a-per-rat-site-differences
  asked: 2026-11-10
  question: >-
    The statement has two parts, the 11 significant pairs of Figure 3A in R2, R3, R4, R5 and R7,
    and no significant pair in R1 and R6. The reproduced clause requires both ("at least 8 of the
    11 ... and R1 and R6 have none"), but the partial clause ("at least 5 are") does not mention
    R1 and R6. Should the partial outcome also require that R1 and R6 have no significant pair, or
    at most a stated number, so that it tests the second part of the statement?
  passage: >-
    Figure 3A of the paper marks significance bars between stimulation sites for R2, R3, R4, R5 and
    R7 and none for R1 and R6; the legend names the Kruskal-Wallis test. The claims file reads the
    11 pairs from these bars (claim fig3a-per-rat-site-differences, inferred).
  why: >-
    The readings that find 5 of the 11 pairs (unadjusted Dunn, relative change or difference) also
    find 4 to 6 significant pairs in R1 and R6. The only reading that leaves R1 and R6 without pairs
    (z-score, Bonferroni-adjusted Dunn) finds 2 of the 11. Read as written the outcome is partially
    reproduced; if the partial clause required R1 and R6 to have none, it would be not reproduced.
    The verifier of round 1 raised the point.
