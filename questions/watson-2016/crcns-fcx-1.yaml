# Questions from attempt watson-2016-02 (author revision after verifier round 1,
# 2026-11-07) about claims/crcns-fcx-1/10.1016-j.neuron.2016.03.036.yaml, asked under docs/protocol.md,
# "Hand over for verification". The verifier reported these as places where the claims file misreads
# the paper; the claims were tested as the file has them.
dataset: crcns:fcx-1
paper: doi:10.1016/j.neuron.2016.03.036
questions:
- claim: post-sleep-wake-lower
  attempt: watson-2016-02
  asked: 2026-11-07
  question: Should the post-sleep window be the first 5 min after SLEEP ends, as the paper's wording
    reads, in place of the first 5 min of the next scored WAKE interval of 7 min or more? The same
    window is used by fig3e-wake-before-after-sextiles and the WAKE slope of figs3a-first-last-rem-ma-slopes,
    which take their windows from this claim.
  passage: the significantly decreased discharge rate of pE neurons in a 5-min post-sleep WAKE compared
    to a 5-min pre-sleep WAKE epoch (Results, Firing pattern and LFP changes across the course of sleep),
    and "5 minutes of WAKE immediately after SLEEP" (Results, Sleep sub-states induce differential lasting
    firing rate changes).
  why: In the data only 23 of 51 cycles have a later scored WAKE, and in 17 of them it starts 166 to 10344
    s after SLEEP ends. Under the claims file's reading the signed-rank p is 0.018 (partially reproduced);
    with the first 5 min after SLEEP (47 cycles) it is 3.9e-10, which would make the claim reproduced.
    For fig3e the same change gives 3 of 4 parts under M2 reading (a) (now 2 of 4); the figs3a WAKE slope
    stays outside tolerance (0.793 against 0.83 +- 0.03). Most of those 5 min are not scored as WAKE in
    the files (0.18 on average), so the reader may also judge whether that window is the paper's.
- claim: fig2a-pe-rate-distribution
  attempt: watson-2016-02
  asked: 2026-11-07
  question: Should the range test (0.05 to 5 Hz within 10% of each bound) apply to the pE distribution
    of each state, or only to the distribution the sentence describes? The paper says in the next sentence
    that the right tail is shorter in nonREM, so a nonREM range ending below 4.5 Hz agrees with the paper.
  passage: the distribution of per-cell mean firing rates for putative pyramidal neurons was strongly
    positively skewed ... spanning three orders of magnitude range from 0.05 Hz to 5 Hz (Figure 2A), followed
    by "The right tail extended toward higher rates during WAKE and REM compared to nonREM" (Results, Assessment
    of firing patterns in different brain states).
  why: The nonREM 1st to 99th percentile range ends at 4.17 Hz (reading b) and 4.05 Hz (reading a), so
    the shape fails in nonREM only, and with it both outcomes the criterion names; the claim is not reproduced.
    With the range judged on WAKE and REM, or on all states pooled, the shape holds and five of six medians
    are within tolerance, which would make it partially reproduced.
- claim: synchrony-skew
  attempt: watson-2016-02
  asked: 2026-11-07
  question: Is "more than 15%" a lower bound that any larger value meets, or a reported value with a tolerance?
    The criterion takes it as a bound, and the expected value of 15 with a tolerance of 1.5 is not used.
  passage: More than 15% of principal neurons rarely fired synchronously with others (4% of windows), while
    less than 4.2% discharged synchronously in at least half of the windows (Results, Assessment of firing
    patterns in different brain states; Figure S2F).
  why: The data give 62.9% (reading a) and 54.2% (reading b), four times the paper's figure, and the claim
    is reproduced only because 15% is read as a bound. If the per-cell measure behind 15% differs from both
    readings, a value this far from it suggests a different measure, and the claim would not be reproduced
    on the expected value.
- claim: fig2de-fast-before-slow
  attempt: watson-2016-02
  asked: 2026-11-07
  question: Should the criterion control for the dependence of first-spike latency on rate? A cell that
    fires more has an earlier first spike after an UP onset by chance alone, so the negative correlation
    between latency and rate holds for any spike trains, sequences or not.
  passage: the spike onset times of individual neurons in the sequences were negatively correlated with
    their firing rates (Results, Assessment of firing patterns in different brain states; Figure 2D and 2E).
  why: The correlation is negative here (R = -0.127 with log10 WAKE rate, -0.238 with nonREM rate), but the
    test cannot fail for the reason given, so the claim is reproduced on a part that carries no information.
    A test against latencies of rate-matched shuffled spike trains, or of the latency rank within each UP
    state, would decide it.
- claim: table1-dataset-counts
  attempt: watson-2016-02
  asked: 2026-11-07
  question: The criterion says only "Reproduced when the counts match" and names no partial outcome. Should
    a partial outcome apply when some of the six counts match, and if so how many?
  passage: This resulted in 995 putative pyramidal (pE) cells (mean of 36.9 cells/session ... 10-104) and
    126 putative interneurons (pI) (4.67 cells/session ... 0-13) (Results), and the 54 WAKE-SLEEP episodes
    of Table S1.
  why: Five of six counts match and the WAKE-SLEEP cycles number 51, not 54. The attempt and the verifier
    both record partially reproduced, a rule the criterion does not state; read strictly, the claim is not
    reproduced.
