dandiset: "001425"
paper: doi:10.1101/2025.02.03.631599
questions:
- claim: fig6b-movement-order
  asked: 2026-11-10
  question: >-
    The criterion's onset rule (the first time the trial average leaves the mean +/- 2 or 3 s.d. of
    the -1 to -0.5 s window) is not in the paper, and it cannot tell movement from noise. On
    synthetic trial averages with no movement it gives an onset before 0 in 66% (white noise) to 85%
    (smooth noise) of runs at 2 s.d., and in 28% to 58% at 3 s.d. Requiring the crossing to last
    100 ms brings white noise down to 3%, but smooth noise stays at 42%. The paper judges the order
    from the traces of Figure 6b. Should the criterion judge onset some other way, for example
    against a threshold scaled to the trace's range, or by the displacement at a fixed time before
    0 against the baseline spread?
  passage: >-
    "While some body parts, such as forepaws and nose, began moving before the lever-pull onset,
    others, including jaw and pupil diameter, moved afterward at least in this session" (Technical
    Validation, paragraph 5; Figure 6b). The Methods give no onset rule.
  why: >-
    Under the rule as written every keypoint's grand onset is -0.5 s, the first sample after the
    baseline window, so the test says nothing about the order. The claim is blocked either way, as
    the example session is not identified, but a sound rule would show whether the order fails in
    the mean: the grand jaw displacement is 6.4 pixels at -0.2 s against a baseline s.d. of 0.27, so
    the jaw moves before the pull in the mean over sessions.
- claim: fig4d-auditory-map
  asked: 2026-11-10
  question: >-
    The criterion is reproduced when the 80th-percentile region of the mean map over 44 ROIs
    includes a parietal ROI (VISa, VISrl or PTLp, either hemisphere) and more than one ROI. That
    region always holds about 9 ROIs, so "more than one ROI" always holds, and a random set of 9 ROIs
    includes one of the 4 parietal ROIs with probability 0.61. The criterion gives no chance level.
    Should it compare the parietal response with a null, such as the response at shifted stimulus
    onsets or a random set of ROIs?
  passage: >-
    "Auditory stimuli evoked spreading activity, including a multimodal sensory area in the
    parietal cortex" (Technical Validation, paragraph 3; Figure 4d).
  why: >-
    The claim is reproduced under the criterion as written (left VISa is in the region under every
    reading), but the pass carries little evidence. With a null the outcome could differ: the
    code-2 response of VISa is larger at the true onsets than at onsets shifted by 3 or 6 s in only
    10 of 19 mice.
