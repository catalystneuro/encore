dandiset: "000458"
paper: doi:10.7554/elife.84630
questions:
- claim: fig4-unit-counts
  asked: 2026-10-30
  question: Does the Figure 4 legend count each RS unit once per current intensity, so that the
    fractions of Figure 4 and its supplement are taken over unit x intensity? The claims file counts
    units once and lists only the highest and the medium intensity as readings, which leaves this
    reading out of fig4-unit-counts, fig4ad-initial-excitation, fig4be-off-period, fig4cf-rebound and
    fig4-supp1-fs-like-rs.
  passage: Panels A-C are derived from 870 RS neurons from stimulated cortex and 4110 RS neurons from
    non-stimulated cortical regions in N=7 mice and panels D-F from 2559 RS neurons from stimulated
    cortex and 9363 RS neurons from non-stimulated cortical regions in N=17 mice (Figure 4 legend).
    Pulses were delivered at three different current intensities (360 pulses total) (Methods,
    Cortical stimulation).
  why: The files hold 290, 1370, 853 and 3162 RS units; every site has three currents, and counting
    each unit once per current gives 870, 4110, 2559 and 9486, the legend's first three counts exactly
    and within tolerance of the fourth. Under the claims file's count, fig4-unit-counts is not
    reproduced; under unit x current its four counts are within tolerance. The fractions of the other
    Figure 4 claims, run with the currents pooled as a variant, stay far from the paper's, so only
    fig4-unit-counts would change.
- claim: fig5c-burst-probability-depth
  asked: 2026-10-30
  question: The criterion requires the superficial median to be exactly 0 (tolerance 0). The paper
    prints burst probabilities to two decimals, so any median below 0.005 prints as 0. Should the
    tolerance be the printing precision (0.005), as the claims file does for SEMs printed as 0.0
    elsewhere (fig1e-erp-duration, fig7c-erp-duration-state)?
  passage: superficial stimulation, median 0 [0-0.02 IQR]; deep stimulation, median 0.12 [0.02-0.2
    IQR]; Mann-Whitney U test, p=0.0258 (Results, CTC interactions underlie features of the ERPs,
    paragraph 2; Figure 5C).
  why: Reading (b) gives a superficial median of 0.003 at the high current (0.002 at the medium
    current), a deep median of 0.131 (0.117) within 0.12 +/- 0.012, and p = 0.025 (0.018). With a
    tolerance of 0.005 the claim would be reproduced; with 0 it is partially reproduced.
- claim: fig3d-magnitudes
  asked: 2026-10-30
  question: The criteria of fig3d-magnitudes and fig3abc-decay-with-distance take the spiking magnitude
    as the area under the signed z-scored spike density, in which a fall below baseline cancels a rise.
    Should the integral of |z| be listed as a second reading?
  passage: Notably, our magnitude metric accounts for both reductions as well as increases in activity
    (Results, Global ERPs are associated with widespread evoked cortical activity, paragraph 1).
  why: The Methods call the signal rectified, which does nothing to a non-negative spike density, so the
    text leaves the sign open. In the example session the signed integral gives 0.31 to 3.96 in MO and
    the integral of |z| 28.31 to 31.37 with the 5 ms kernel and the -2 to 0 s baseline, against 30.9.
    Over all sites only |z| gives the deep medians and the spiking significance pattern of Figure 3D.
    The outcome of fig3abc-decay-with-distance does not change, since its ordering holds under both.
