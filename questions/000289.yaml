dandiset: "000289"
paper: doi:10.1073/pnas.2210622120
questions:
- claim: noise-effects-on-mu-and-kappa
  asked: 2026-10-30
  question: >-
    Condition (2) of the criterion compares the mean end amplitude of the full released network
    (RNN_filter_Run, with its rectified global inhibition) with a noise-free run. Does the paper
    claim that upward drift for the full network, or only for the noise's direct effect on the
    first Fourier mode, with the remaining dynamics unchanged, as SI section 5 derives it? If the
    latter, should condition (2) be tested with the global inhibition held at its noise-free level,
    or against the drift of SI Eqs. S122 and S123?
  passage: >-
    "With neural noise, the population dynamics equation Eq. [S49] becomes dr_t(phi) = ... +
    I_ext(phi) + eta_t(phi) [S107] ... This shows that we can interpret neural noise as yet another
    stochastic input to the network." (SI Appendix, section 5A); "<dkappa> = sigma_nn^2 / (kappa N)
    dt" (Eq. S123); "it causes a positive drift and random diffusion of kappa_t" (Results, The
    Impact of Neural Noise on Inference Accuracy).
  why: >-
    In the full network the noise also raises the rectified sum that drives the global inhibition
    (from 0.5 to 0.57 to 0.76 after 1 s), and the mean amplitude falls to 0.42 to 0.83 after 5 s,
    so (2) fails and the claim is partially reproduced. With the inhibition held at its noise-free
    level the mean amplitude rises to 1.01 to 1.33, matching the mean that SI Eq. S124 implies
    (1.02 to 1.35), so (2) would hold and the claim would be reproduced.
