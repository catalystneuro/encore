- claim: fig2h-proportion-learned-40-days
  also: [cohort-counts, fig2g-days-to-proficiency, fig2g-days-differ-across-labs,
    fig2s1-trials-to-proficiency, fig2bc-threshold-bias-iqr, fig2-abs-bias-threshold-during-training,
