  question: The claims file defines P1b as "the code's 'biased' criterion, the first
    biased-protocol session with status trained_1b". The dataset has no status. Is P1b, without
    it, the first full-task (biased protocol) session on or after P1 (as run here), or the first
    full-task session at which the recomputed status is 1b, which under the 1a reading may never
    come?
  passage: Figure 3, figure supplement 5 legend, "the first three sessions of the full task";
    Methods, "Once an animal was proficient in the basic task, it proceeded to the full task."
  why: The window of every claim listed is counted from P1b. Under the reading run here, 51 to 71
    mice have a P1b; under the 1b-status reading, fewer would, and the first-session windows would
    move.
  answer: >-
    The legend's reading, the first full-task session on or after P1, is the main one; the
    legend says "the first three sessions of the full task" and the Methods "Once an animal was
    proficient in the basic task, it proceeded to the full task". The code's "biased" criterion
    ('task_protocol LIKE "%biased%" AND training_status="trained_1b"') is a variant; in the
    pipeline a 1a-only mouse keeps trained_1a on biased sessions until its last three sessions
    meet the 1b criteria, and has no P1b if they never do. Header P1b and the criterion of
    fig3s5-first-full-sessions now say so; claims unchanged.
  answered: 2026-10-22
- claim: fig2bc-threshold-bias-iqr
  also: [fig2s2-variability-decreases]
  asked: 2026-10-22
  question: The criteria use "50:50 sessions". In this dataset, every basic-task session has trials
    whose probabilityLeft is not 0.5 (0 to 1 in steps of 0.1, 24% of basic-task trials, with
    the stimulus side following it), apparently from the bias-correcting repeat trials. Are 50:50
    sessions the basic-task sessions (as run here), or only sessions in which every trial has
    probabilityLeft 0.5 (none here)?
  passage: Results, Training progression, "a basic task ... where the probability of a stimulus
    appearing on the left or the right was equal (50:50)"; Methods, "If the response was incorrect
    and the contrast was 'easy' (>=50%), a 'repeat' trial followed".
  why: Under the second reading no session qualifies and the claims cannot be tested.
  answer: >-
    The basic-task sessions, with all their trials, as run. The Results define the basic task
    as the one where left and right were "equal (50:50)"; the pipeline's per-day summary gives
    prob_left 0.5 to all trials of a training-protocol day ("0.5 for trainingChoiceWorld") and
    never reads the trial's probability, and the code's prob_left == 0.5 selects those days.
    Header and the criterion of fig2bc-threshold-bias-iqr now say so.
  answered: 2026-10-22
