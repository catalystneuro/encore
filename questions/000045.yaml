  asked: 2026-10-22
  question: The dataset carries no training status, so P1 is recomputed from the trials with the
    'Trained 1a/1b' criteria of Appendix 1, table 1d. One of them is "all contrasts introduced".
    Is it met when each of the three sessions presents every contrast of the final set (100, 25,
    12.5, 6.25 and 0%), or when the three sessions together do (a session can present fewer, for
    example when a mouse is moved back a stage)?
  passage: Appendix 1, table 1d, "For each of the last three sessions ... >80%/90% correct on 100%
    contrast and all contrasts introduced". The Methods and the claims file do not say more.
  why: P1 is reached by 75 mice when each session must present all contrasts and by 84 when the
    three together must (1a criteria; 52 and 58 with 1a/1b). The Kaplan-Meier proportion at day 40
    is 0.67 under the first reading and 0.76 under the second, so fig2h-proportion-learned-40-days
    is blocked until this is answered; the other claims listed have the same outcome under both.
  answer: >-
    Each of the three sessions, as the main reading. Appendix 1, table 1d, puts the criterion
    under "For each of the last three sessions: >200/400 trials completed, and >80%/90% correct
    on 100% contrast and all contrasts introduced". The code that set the paper's status
    (SessionTrainingStatus in IBL-pipeline, which the paper's code imports) checks only the
    current session, for 0% and a contrast between 0.1 and 6.5% ("training in progress if the
    current session does not have low contrasts"); that is a variant. Pooling the three sessions
    is given by neither. Header P1 and the criterion of fig2h-proportion-learned-40-days now say
    so; claims and expected values unchanged.
  answered: 2026-10-22
- claim: cohort-counts
  also: [fig2g-days-to-proficiency, fig3cde-no-lab-difference-medians]
  asked: 2026-10-22
  question: The claims file's second P1 reading applies "the 1b criteria from their introduction
    (Methods, September 2019, no day given)". From which day are the 1b criteria applied, and do
    they replace the 1a criteria for a mouse still in training on that day (as run here), or is a
    mouse proficient when it meets either?
  passage: Methods, "The second set, called '1b', was introduced shortly afterwards (September
    2019) and was applied to 60 of the 140 mice."
  why: With 1b from 2019-09-01, 52 and 58 mice reach P1 under the two contrast readings; with
    2019-09-30, 60 and 66. Under the 1a/1b readings with pooled contrasts, easy-trial performance
    differs across labs (corrected p = 0.047), so the outcome of
    fig3cde-no-lab-difference-medians depends on this reading.
  answer: >-
    The code settles it: a mouse is proficient at the first session that meets either set, at any
    date. The paper's P1 is the first status trained_1a or trained_1b, and SessionTrainingStatus
    tests the 1b criteria and then the 1a criteria at every session, with no date. The 1b
    criteria were implemented on 2019-09-12 (text_trained1a_to_1b_sessions.py, "Date at which
    trained_1b was implemented in DJ pipeline"); the Methods say only "September 2019" and do
    not say 1b replaced 1a, so replacement from 2019-09-12 is a variant. Header P1 and the
    criterion of cohort-counts now say so; claims unchanged.
  answered: 2026-10-22
- claim: cohort-counts
  asked: 2026-10-22
  question: The 1a/1b criteria require more than 200/400 "trials completed" in each session. Are
    these all trials, or only trials with a response (no-response trials, choice 0, left out)?
    The attempt counts all trials.
  passage: Appendix 1, table 1d, ">200/400 trials completed"; Methods, "200/400 completed trials".
  why: Counting only trials with a response changes P1 for 1 to 3 mice under the four readings;
    no outcome is expected to change, but the counts move.
  answer: >-
    All trials, no-response trials included. The paper does not define "completed"; the status
    code compares the session's n_trials with 200/400, and the pipeline sets n_trials =
    len(trials['choice']), every trial of the session. Header P1 and the criterion of
    cohort-counts now say so.
  answered: 2026-10-22
