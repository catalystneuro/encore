  question: The classifier draws 8 mice from each laboratory. In this dataset some laboratories
    hold fewer than 8 proficient mice under every reading (Lab 7 has only 7 mice with their whole
    training in the dataset). The Methods say 8 was "the lowest number of mice over all different
    datasets". May the subsample be the smallest laboratory's count here (6 or 7), or is the
    claim blocked?
  passage: Methods, Classification of laboratory membership, "The size of the subsample was chosen
    because eight mice was the lowest number of mice over all different datasets for which
    classification was performed."
  why: The four classifier claims are blocked (other); with 6 mice per lab the Naive Bayes
    classifier on the basic task is not above chance (2.5th percentile 0.071 against a null mean
    of 0.113), shown as a variant that decides nothing. fig3s4 and fig3s5 are decided by their lab
    tests without the classifier.
  answer: >-
    The subsample may be the smallest count. The Methods give the size as a rule, "eight mice
    was the lowest number of mice over all different datasets for which classification was
    performed", and the code hard-codes N_MICE = 8, the rule's value on the paper's data. Here
