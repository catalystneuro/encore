questions:
- claim: fig3d-stg-frequency
  question: The criterion judges "relatively invariant across pH values in the presence of acid"
    as a non-significant acid ANOVA on PD burst frequency, with silent bins counted as 0. Under that
    rule the paper's own acid ANOVA was very likely significant, since 14 of 15 STG preparations
    stopped firing at pH 5.5 and their bins enter as 0 Hz. Does the sentence claim a non-significant
    acid ANOVA, or only that frequency changed little across the acid steps where the rhythm
    continued (for example from 7.2 to 6.1)?
  passage: 'Results, "The pyloric rhythm is surprisingly robust to extreme changes in pH",
    paragraph 7, "Mean pyloric burst frequency was relatively invariant across pH values in the
    presence of acid, but varied significantly across base steps ( Figure 3D )"; and "The
    cardiac and pyloric rhythms are differentially sensitive to pH", paragraph 2, "14 of 15 STG
    preparations ceased firing after 15 min of exposure to pH 5.5".'
  why: In this attempt the acid ANOVA gives p = 1.6e-07, driven by 5.5 (-0.84 Hz against
    control, where several preparations are silent), while the steps 7.2 to 6.1 differ from
    control by 0.003 to -0.135 Hz (corrected p = 1). Under the criterion as written the acid part
    fails and the claim is not reproduced; under a reading limited to the steps with a rhythm the
    acid part would hold. The base part fails at 9.3 either way, so the outcome would not change in
    this attempt, but it could in another. Raised by the verifier (round 1, problem 4).
- claim: fig3s2-stg-control-variability
  question: Reading (b) of the criterion, a Kruskal-Wallis test of the 48 control bins on
    preparation with p < 0.05, is met by almost any set of preparations, since 48 bins per
    preparation give the test power to find very small differences between preparations. Does
    reading (b) test what the paper says, that the control distributions are "similarly variable"
    to the pooled distributions across pH? The same applies to fig7s2-cg-control-variability,
    which uses the same readings.
  passage: 'Results, "The pyloric rhythm is surprisingly robust to extreme changes in pH",
    paragraph 8, "The pooled distributions for these three measures were highly variable for all
    pH conditions reflecting the animal-to-animal variability in the pyloric rhythm. We plotted the
    distributions for all 15 STG preparations at control pH 7.8 and found similarly variable
    activity at baseline conditions"; Figure 7, figure supplement 2 legend.'
  why: Both claims are reproduced here under reading (b) only (H = 491 to 625, p below double
    precision), while reading (a) fails for frequency and duty cycle in the STG and for frequency in
    the CG. If reading (b) were dropped or replaced by a comparison of spreads, both outcomes could
    change. Raised by the verifier (round 1, problem 11).
- claim: fig8a-ganglion-difference
  question: The criterion's partial condition needs the three t-tests (STG lower at 5.5, higher at
    9.3 and 9.8) and allows some ANOVA effect to fail. It has no condition for the opposite case,
    where all six ANOVA effects hold and some of the t-tests do not, which is what this attempt
    finds. Should that case count as partially reproduced?
  passage: 'Results, "The cardiac and pyloric rhythms are differentially sensitive to pH",
    paragraph 1, "There were significant main effects of pH and ganglion as well as an interaction
    between pH and ganglion on rhythmicity in both acidic and basic solutions ... The pyloric
    rhythm was significantly less rhythmic at pH 5.5, but significantly more rhythmic at pH 9.3 and
    9.8 compared to the cardiac rhythm".'
  why: With sum-to-zero contrasts all six effects are significant and the STG is significantly
    less rhythmic at 5.5 (corrected p = 0.029), while 9.3 and 9.8 are higher in the STG but not
    significantly (p = 0.36 and 0.21). The criterion gives not reproduced; with a partial
    condition for this case it would be partially reproduced. Raised by the verifier (round 1,
    problem 11).
