questions:
- claim: fig4c-spontaneous-activity
  asked: 2026-11-08
  question: >-
    The criterion's main reading of spontaneous activity is the median over blank trials of the
    baseline-subtracted evoked-window response, as for whisker trials, with the raw evoked-window
    dF/F as a variant. The Figure 4C legend defines spontaneous activity as the "median ΔF/F during
    blank trials", which reads as the level of dF/F, not a change from a baseline taken on the same
    blank trial. A baseline-subtracted blank response is centred near zero by construction and
    measures fluctuation within a trial, not the level of activity. Should the main reading be the
    median dF/F during blank trials without baseline subtraction?
  passage: >-
    ( C ) Effect of enrichment on spontaneous activity, defined as median ΔF/F during blank trials.
    P-values computed by permutation test. (Figure 4 legend.) In addition to these changes in
    tuning shape, EN also decreased spontaneous (blank trial) activity relative to NH (Results,
    Enrichment sharpens whisker receptive fields, paragraph 1.)
  why: >-
    The two readings give opposite results in L2/3. Baseline-subtracted, EN is higher than NH
    (-0.0027 against -0.0064, p = 0.0001) and L4 C1-C3 is also higher in EN (p = 0.015). Without
    subtraction, L2/3 EN is lower (0.0835 against 0.0914, p = 0.0002) and L4 C1-C3 does not differ
    (p = 0.33), as the paper reports. The outcome, reproduced, rests on the variant under the
    criterion's any-reading rule; with the main reading alone it would be not reproduced. The
    verifier of round 1 raised it.
