questions:
- claim: fig4c-spontaneous-activity
  asked: 2026-11-08
  question: >-
    The criterion's main reading of spontaneous activity is the median over blank trials of the
    baseline-subtracted evoked-window response, as for whisker trials, with the raw evoked-window
    dF/F as a variant. The Figure 4C legend defines spontaneous activity as the "median ΔF/F during
    blank trials", which reads as the level of dF/F, not a change from a baseline taken on the same
    blank trial. A baseline-subtracted blank response is centred near zero by construction and
    measures fluctuation within a trial, not the level of activity. Should the main reading be the
    median dF/F during blank trials without baseline subtraction?
  passage: >-
    ( C ) Effect of enrichment on spontaneous activity, defined as median ΔF/F during blank trials.
    P-values computed by permutation test. (Figure 4 legend.) In addition to these changes in
    tuning shape, EN also decreased spontaneous (blank trial) activity relative to NH (Results,
    Enrichment sharpens whisker receptive fields, paragraph 1.)
  why: >-
    The two readings give opposite results in L2/3. Baseline-subtracted, EN is higher than NH
    (-0.0027 against -0.0064, p = 0.0001) and L4 C1-C3 is also higher in EN (p = 0.015). Without
    subtraction, L2/3 EN is lower (0.0835 against 0.0914, p = 0.0002) and L4 C1-C3 does not differ
    (p = 0.33), as the paper reports. The outcome, reproduced, rests on the variant under the
    criterion's any-reading rule; with the main reading alone it would be not reproduced. The
    verifier of round 1 raised it.
- claim: fig5eh-l23-correlation-gradient-at-edge
  asked: 2026-11-08
  question: >-
    The criterion counts the gradient as steeper when the EN minus NH difference is more negative
    outside the reference column than inside it, without a test of the two differences. The paper
    says EN reduced correlations substantially outside the column and only modestly within it, and
    that this "generated a stronger gradient". For noise correlation the two differences here are
    -0.0454 and -0.0450 (stored responsiveness -0.0430 and -0.0409), which pass the criterion's
    comparison, while a permutation test of their difference gives p = 0.96 and 0.81. Should the
    criterion require the outside reduction to be larger than the inside one by a test (for
    example a permutation test of the difference of differences at p < 0.05), or by a stated
    margin, so that equal reductions do not count as a steeper gradient?
  passage: >-
    EN substantially reduced these signal and noise correlations for neurons outside the column,
    while preserving signal correlation and only modestly reducing noise correlation among neurons
    within the reference column ( Figure 5E–F ). This generated a stronger gradient of signal- and
    noise-correlation in L2/3 at the reference column edge ( Figure 5G–H ). (Results, Enrichment
    strengthens functional column boundaries in L2/3, paragraph 3.)
  why: >-
    With the criterion as written the claim is reproduced on a noise difference of 0.0004 or
    0.002 that a test cannot tell from zero; with a tested comparison the noise half fails and
    the claim holds for signal only. The round-2 verifier raised it.
