dandiset: "001955"
paper: doi:10.64898/2026.02.17.706301
questions:
- claim: fig3b-photometry-continuous-only
  asked: 2026-11-10
  question: >-
    The criterion's reading (d) allows the two-way ANOVA "with repeated measures on both factors or
    without" but asks for a "post hoc paired Pre against Stim per frequency". The paper says only
    "two-way ANOVA with FDR-corrected post hoc comparisons" and does not say the comparisons were
    paired. After an ordinary two-way ANOVA (no repeated measures), the post hoc comparison in
    GraphPad Prism, which the Methods name, is not paired: it uses the residual mean square of the
    model. Should the criterion's "paired" apply only to the repeated-measures reading, so that the
    ordinary ANOVA is read with its own, unpaired, post hoc comparisons?
  passage: >-
    Figure 3b legend: "continuous ( p < 0.0001) and 5-20 Hz stimulations ( p > 0.05, two-way ANOVA
    with FDR-corrected post hoc comparisons)". Where the paper used repeated measures it says so,
    as in the Figure 2f and 2i legends ("one-way ANOVA with repeated measures, FDR-corrected post
    hoc tests"). Quantification and statistical analysis names GraphPad Prism v10.
  why: >-
    The outcome depends on it. With the ordinary two-way ANOVA and Prism's comparisons on its
    residual mean square, continuous light gives BH p 3.8e-06 to 3.8e-05 in all 32 readings and the
    trains p > 0.05, so the claim is reproduced; this is the attempt's adopted reading. With the
    paired forms, the repeated-measures ANOVA with Prism's error (sphericity assumed) gives p 2.0e-04
    to 5.3e-04, partially reproduced under the criterion, and separate paired t-tests give p 0.072
    to 0.11, not reproduced. A paired form that pools the Stim - Pre variance over the four frequencies
    (df 16, not one of Prism's forms) gives p < 0.0001 with the trains not significant in 20 of 32
    readings, the main reading among them (BH p 9.4e-05). The round-2 verifier reported the same point
    (transcripts/gonzalez-cabrera-2026/verifier-2-report.md).
