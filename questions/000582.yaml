dandiset: "000582"
paper: doi:10.1126/science.1125572
questions:
- claim: layer2-grid
  also: [grid-all-layers, gridness-range-similar, grid-stable, grid-phase-orientation, deep-hd-conjunctive,
    gridness-hd-continuous, conj-tuning-similar, speed, speed-slope-steeper, speed-intercept]
  asked: 2026-10-20
  question: Reading O3 sets the gridness circle by "the distance from the centre to the outermost
    peak's centre plus that peak's radius", and removes the central peak "as a disc of the radius
    of that peak". Is a peak's centre the pixel of its maximum correlation or the centroid of its
    pixels, and is its radius that of a disc of the same area, or the largest distance from its
    centre to one of its pixels? The same choice sets the spacing (median distance to the six inner
    peaks) and the orientation.
  passage: SOM, Autocorrelation of rate maps, "peaks defined as 100 or more contiguous pixels of 1.5
    x 1.5 cm2 above a fixed threshold"; "the circle was fitted around the outermost peak". The SOM
    gives no rule for a peak's position or size.
  why: The attempt runs both centres (maximum and centroid) and takes the radius as that of a disc
    of the same area. Between the two centres the fraction of grid cells changes by up to 0.06 in a
    layer (layer II 0.620 to 0.718 over all readings), and the readings decide whether layer II is
    within tolerance (13 of 32 readings) and whether layers V and VI hold the orientation part of
    grid-phase-orientation.
  answer: The paper does not give it. The SOM defines spacing as "the distance from the central
    peak to the vertices of the inner hexagon" and the circle as fitted "around the outermost peak",
    with peaks "100 or more contiguous pixels", and says nothing of a peak's centre or radius. Both
    centres (the pixel of highest correlation, the centroid) and both radii (the disc of the same
    area, the largest distance to a pixel of the peak) are now named as readings under O3 in the
    claims file, and the same centre serves spacing and orientation.
  answered: 2026-10-20
- claim: hd-tuning-breadth-layers
  asked: 2026-10-20
  question: The claims file says breadth is "the angular standard deviation of the mean vector".
    Batschelet (1981, the SOM's reference S8) defines two such quantities from the mean vector
    length r, the angular deviation s = sqrt(2(1 - r)) and the circular standard deviation
    s0 = sqrt(-2 ln r). Which one do the paper's means (55.9, 52.2 and 58.2 degrees) use?
  passage: SOM, Analysis of head-direction cells, "The breadth of directional tuning was expressed by
    the angular standard deviation of the mean vector"; fig. S2 and S4 legends, "Angular deviation
    refers to the circular standard deviation as defined in the Supplementary Materials and
    Methods".
  why: The circular standard deviation is larger than the angular deviation for the same cells (layer III means 62.5 to 76.2 against 49.1 to 56.5), so only the angular deviation
    can come near the paper's means, and the two give different numbers of significant layer
    differences (ANOVA 28 against 45 of 68 rows). The attempt runs both.
  answer: The paper does not settle it. The SOM says "the angular standard deviation of the mean
    vector" and cites Batschelet (S8); the fig. S2 and S4 legends say "Angular deviation refers to
    the circular standard deviation", which names one of Batschelet's quantities in the label and
    the other in the gloss, and the histogram axes (0 to 100 degrees) fit both. The criterion now
    names both, sqrt(2(1 - r)) and sqrt(-2 ln r), as readings; the claim's rule for readings
    applies.
  answered: 2026-10-20
- claim: speed
  also: [speed-slope-steeper, speed-intercept]
  asked: 2026-10-20
  question: The criterion says the claim is reproduced "when, under a combination of readings, all
    three fractions are within tolerance", and methods_underspecified "when readings disagree
    between these outcomes". Under counting reading (b), positive slope, all three fractions are
    within tolerance under 54 combinations of the other readings (speed measure, positions,
    trials, cell classes) and only the order holds under 200. Is the claim then reproduced (some
    combination matches) or methods_underspecified (the combinations disagree)? Which of the
    readings are readings of the reported number (where any one matching suffices) and which are
    method details (where all must agree)?
  passage: Main text, paragraph 6, "141/150 cells, P < 0.001"; Fig. 4B legend, "Nearly all grid
    cells, head-direction cells, and grid x head-direction cells had positive slope values".
  why: The attempt follows the last sentence and blocks speed as methods_underspecified, which by
    the protocol also blocks speed-slope-steeper and speed-intercept, whose analyses ran (partially
    reproduced and not reproduced under every reading). Under the first sentence speed would be
    reproduced.
  answer: This is a question of the criterion, which was unclear, and it is now rewritten. The
    counting readings (a) and (b) and the three significance measures are readings of the
    reported number (what "141/150 cells, P < 0.001" counts), so for given method details the best
    of them is taken. The speed measure, the positions, the trials and the cell classes are
    method details, and the outcome must agree across all their combinations, or the claim is
    methods_underspecified. The statement and expected values are unchanged.
  answered: 2026-10-20
- claim: hd-with-grid-colocalized
  asked: 2026-10-20
  question: Are the "head-direction cells" whose units are counted the pure head-direction cells of
    table S1B, or every cell passing the head-direction criteria including conjunctive cells; and
    must the grid or conjunctive cell in the same unit be another cell?
  passage: Main text, paragraph 4, "Head-direction cells were usually encountered together with grid
    cells (fig. S6)"; fig. S6 counts grid cells, head-direction cells and grid x head-direction
    cells as three classes.
  why: With conjunctive cells counted as head-direction cells and allowed to stand for the grid cell
    themselves, every unit holding a conjunctive cell passes, which raises the tetrode fraction
    (0.39 to 0.48 for pure head-direction cells, below the criterion's one half). The attempt uses
    pure head-direction cells and another cell.
  answer: The paper gives the first part. Fig. S6 counts "grid cells, head-direction cells and
    grid x head-direction cells" as three classes, and table S1B and the speed paragraph
    ("headdirection cells (153/220 cells") use head-direction cells for the 220 pure ones, so the
    cells are the pure head-direction cells, and the cell with them is another cell. Whether that
    cell must be a pure grid cell (fig. S6's class) or may be a conjunctive cell (which meets the
    grid criterion) is not given; the criterion now names both readings.
  answered: 2026-10-20
- claim: grid-phase-orientation
  asked: 2026-10-20
  question: Orientation within files is compared with "the differences between sessions of
    different rats". Are those pairs taken within the same layer as the simultaneous pairs, or from
    all layers? And does "Reproduced when both parts hold under every reading" cover readings O1 to
    O3 as well as the two phase readings?
  passage: Fig. S2 legend, "The broad range of orientations could be due to differences in preferred
    grid-cell orientation between rats".
  why: Orientation holds in layer VI under 59% of the O1 to O3 readings with the layer's own rats
    and 44% with all layers; both parts hold in every layer under 14 or 12 of 32 readings. The
    attempt runs both pools and blocks the claim as methods_underspecified.
  answer: The paper does not name the pool. The fig. S2 legend ("The broad range of orientations
    could be due to differences in preferred grid-cell orientation between rats") explains the
    per-layer histograms of fig. S2 but fixes no comparison, and the test is a standard choice;
    the criterion now names both pools, the same layer and all layers, as readings. "Every
    reading" covers O1 to O3 as well as the phase readings, and the criterion now says so.
  answered: 2026-10-20
