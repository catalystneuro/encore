dandiset: "001641"
paper: doi:10.1523/jneurosci.6157-08.2009
questions:
- claim: fig9-reward-information
  asked: 2026-11-03
  question: The criterion requires reward information to be below the threshold before the L or R
    entry. Does the paper say that? It says only that reward information "started to increase at the
    presentation" of the reward or no-reward tone, and that it was "sustained until the subsequent
    trial". If reward information from the previous trial lasts into the next one, and rewards are
    correlated across trials within a block, some information above the threshold before entry
    follows from the paper's own account. Should the criterion test the rise at the tone (for example
    a pre-entry level well under the peak) in place of an absence before entry?
  passage: Information related to the reward started to increase at the presentation of
    reward/no-reward tone, which was presented at the time of entry to the left or right hole. The
    reward information gradually decreased, but was sustained until the subsequent trial (previous
    reward shown in Fig. 8C,D). (Results, Neuronal activity in the NAc and VP, paragraph 9)
  why: Before the median entry, reward information is above the threshold in 16 to 28 of 23 to 28
    windows (up to 0.0044 bits/s in the NAc and 0.0070 in the VP, against thresholds up to 0.0023 and
    0.0033), but it is 5 to 7% of the peak (0.093 and 0.106 bits/s), and the rise after entry and
    the persistence into the next trial hold in every reading. Aligned to each trial's own entry the
    result is the same (12 to 21 of 16 to 21 windows above threshold). As the claims file has it the
    claim is not reproduced; a criterion on the rise would reproduce it.
- claim: table3-parameter-averages
  asked: 2026-11-03
  question: The criteria of table1-lsq-parameters and table2-ml-parameters treat O1 as the
    parameterization of the reported values, so a match under one O1 reading suffices. The criterion
    of table3-parameter-averages requires every O1 reading, yet under O1 (b) the kappas are on a
    different scale by construction (kappa1 and -kappa2 added without the factor alpha1), so the
    same fit gives kappas of about half the size. Should table3 also be judged under the O1 reading
    that matches, as tables 1 and 2 are?
  passage: The averages and SDs of the estimated parameters are summarized in Table 3. (Results,
    Prediction of choices by models, paragraph beginning "With time-varying parameters"); the claims
    file's opening comment, O1, says the readings "give the same fits under a reparameterization with
    fixed parameters but different parameter values".
  why: Under O1 (a) all nine means are within tolerance in all 8 readings of O5, O13 and the
    averaging; under O1 (b) 6 of 9 are, the three kappa1 means falling outside at about half the
    paper's values (for example F-Q kappa1 0.77 against 1.61). The paper's Table 2 values are within 0.0003 of the
    training optimum under O1 (a) and 0.010 to 0.027 below it under O1 (b), so the paper's values are
    on the O1 (a) scale. As the claims file has it the claim is blocked; with the table 1 and 2 rule it
    would be reproduced.
