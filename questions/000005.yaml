dandiset: "000005"
paper: doi:10.1038/nn.4412
questions:
- claim: fs-vm-touch-whisking
  asked: 2026-10-20
  question: At what resolution is dVm/dt of the touch-aligned average Vm taken for the latency rule,
    the recording's own sampling rate (10 or 20 kHz) or the average in 1 ms bins as for the spike
    PSTH? The same question applies to the laser-onset latencies of exc-thalamus-photoinhibition and
    to exc-vm-touch-whisking.
  passage: Touch latency was identified as the latency from touch onset to the time when dVm/dt
    crossed baseline (3x s.d. of the dVm/dt between 0 and 25 ms before touch). All touch-spike PSTHs
    were constructed with a bin size of 1 ms. (Online Methods, Data analysis)
  why: At the full sampling rate two of the five whole-cell FS cells cross the threshold at 0.0 and
    0.3 ms and the mean latency is 1.88 ms (not reproduced); in 1 ms bins the mean over three cells
    is 3.67 to 4.17 ms (within 4.0 +- 0.4). For the thalamic and cortical light the full rate gives
    0.1 ms for both, the 1 ms bins 5.0 and 2.0 ms.
- claim: fs-touch-response
  asked: 2026-10-20
  question: The dPSTH/dt latency is found in 1 ms bins. Is the latency the bin's left edge or its
    centre? It applies also to vpm-touch and pv-enphr-suppression.
  passage: Latency for touch-evoked spikes was defined as the latency from touch onset to the time
    when dPSTH/dt crossed a threshold (Online Methods, Data analysis); the medians the paper reports
    (2.5 ms for VPM, 4.5 ms for FS) fall on half milliseconds.
  why: The two differ by 0.5 ms, more than the 0.32 ms tolerance of vpm-touch. No outcome of this
    attempt changes with it, but a later attempt could.
- claim: fs-touch-response
  asked: 2026-10-20
  question: The claims file defines FS cells as cells "driven by 5 ms light pulses within 5 ms of
    onset" and inside the waveform boundary of Supplementary Fig. 6. What test, against what
    baseline and at what threshold, decides that a cell is driven, and how are the peak, the trough
    and the spike duration of the boundary measured (the polarity of the cell-attached spike, the
    baseline, and whether duration is the time from peak to trough)? This decides the FS group of
    every FS claim and the excitatory group of every excitatory claim.
  passage: We recorded from neurons that were directly driven by light within 5 ms after
    photostimulus onset (Online Methods, Barrel cortex recordings); Supplementary Fig. 6, "Definition
    of peak and trough is given in inset".
  why: Here a cell is driven when a one-sided binomial test of a spike 0 to 5 ms after isolated
    pulses against the same 5 ms 50 ms earlier gives p < 0.001 (24 VGAT-ChR2 cells; 27 at p < 0.01),
    and duration is peak-to-trough time on the 300 Hz high-passed mean spike. With these, 8 of 20
    driven cell-attached cells fall outside the boundary, leaving 12 where Supplementary Table 2 has
    24, and the outcome of thalamus-drives-fs turns on it (5 cells inside, 9 without the boundary).
- claim: behavior-false-alarms
  asked: 2026-10-20
  question: Is the chi-squared test of no-lick performance with and without light corrected for
    continuity (Yates)?
  passage: In 8 mice tested, 6 showed a significant decrease of performance during Nolick trials with
    PV interneuron inactivation (p < 0.05, Chi-squared test, solid lines) (Supplementary Fig. 14c)
  why: With the correction, 4 mice (trials pooled) or 5 (any session) show a significant decrease;
    without it, 5 or 6, which moves the outcome between not reproduced, partially reproduced and
    reproduced.
- claim: thalamus-drives-fs
  asked: 2026-10-20
  question: Are the paired tests of light against control one-sided (light lower) or two-sided?
  passage: Photoinhibition reduced spike rates in FS interneurons during nonwhisking (to 4% of
    control ... (Results, Inhibition is driven by thalamus, paragraph 2)
  why: Only 5 FS cells by the claims file's rule have thalamic light; a two-sided signed-rank test
    with 5 cells cannot go below p = 0.0625, a one-sided one can reach 0.031.
- claim: behavior-touches
  asked: 2026-10-20
  question: Do the touch counts and the performance include the trials with light?
  passage: "Mice touched the pole at a proximal location multiple times (number of touches: 5.7 +- 5.3,
    mean +- s.d., 4,147 trials) (Online Methods, Behavior)"
  why: With every trial (all sessions, principal whisker) the counts are 6.04 and 0.85, both within
    tolerance; without the light trials they are 5.74 and 0.80, and the no-lick count falls outside,
    which moves the outcome from partially reproduced to not reproduced.
- claim: exc-vm-touch-whisking
  asked: 2026-10-20
  question: For whisking onsets, over which windows is "the average whisking amplitude increased by
    at least 2 degrees" judged, and which touches (onset or offset, which whiskers) bound the -10 to
    100 ms exclusion around touches in the whisking epochs?
  passage: Transitions from nonwhisking to whisking ... were defined as the end of a nonwhisking epoch
    followed by a period in which the average whisking amplitude increased by least 2 degrees and no
    touch occurred within 250 ms (Online Methods, Data analysis)
  why: Here the amplitude 100 to 300 ms after the end of the nonwhisking period is compared with 0 to
    200 ms before it, and touches of every tracked whisker are excluded from 10 ms before onset to
    100 ms after offset. These set the onsets and epochs behind every whisking measure; the attempt
    did not run other readings of them.
