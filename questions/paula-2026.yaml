dandiset: "000713"
paper: doi:10.1103/wndc-k654
questions:
- claim: table1-sample
  asked: 2026-11-27
  attempt: paula-2026-01
  question: The opening comment gives unit reading (b) as "the Allen default filters for this dataset
    (ISI violations < 0.5, amplitude cutoff < 0.1, presence ratio > 0.9)". The verifier of attempt
    paula-2026-01 reports that the AllenSDK default presence-ratio cutoff is 0.95, not 0.9, and the
    claims file's own check says the defaults were not verified. The Allen Institute's Visual Behavior
    Neuropixels quickstart tutorial filters units by snr > 1, ISI violations < 1 and firing rate > 0.1
    spikes/s instead. Should reading (b) give the defaults that apply to this dataset, and should the
    tutorial's filter be a reading of its own?
  passage: Methods II.A, "local neuronal populations from each brain region with at least 30 recorded
    neurons sampled across a minimum of eight recording sessions"; Table I, "Neurons analyzed". The
    paper states no unit filter.
  why: The criterion decides between the unit readings by Table I's neuron counts. Scaled to the paper's
    102 sessions, all units give 1.28 to 1.43 times Table I's area counts and reading (b) 0.34 to 0.55
    times (0.31 to 0.51 with presence ratio > 0.95), while the tutorial's filter gives 0.93 to 1.02
    times, with neurons per population within 5% of Table I's in each area. The attempt adopts the
    tutorial's filter as an assumption and runs both of the claims file's readings as variants; ten
    claims come out differently under one of them.
- claim: fig3a-reference-systems
  asked: 2026-11-27
  attempt: paula-2026-01
  question: The criterion places the sine "near H 0" and asks that the positions fall in the quoted
    ranges widened by 10% of each bound. With D = 6 a sine gives at least two ordinal patterns (rising
    and falling), so its H cannot be below ln 2 / ln 720 = 0.105, and a range around 0 widened by 10% of
    0 cannot be met. How should "H near 0" be read for the sine?
  passage: Results III.C, paragraph 2, "deterministic periodic signals (sine wave) exhibit minimum
    entropy (H ≈0) and low complexity (C ≈0.1)"
  why: The attempt reads "near 0" as at most the floor plus 0.05 (0.155); under that reading the sine
    matches at 10 000 points per period (H 0.107, C 0.106) and not at 1000 or 100 (C 0.113 and 0.165).
    The claim is partially reproduced in either case, because the Ikeda map and some correlated walks
    miss, but the sine's part of the outcome depends on this reading.
