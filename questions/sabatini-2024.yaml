questions:
- claim: suppfig3-model-comparison
  question: The criterion's main reading compares a cross-validated value for the factorization (the
    held-out variance at the chosen k) with in-sample values for jPCA and the single-condition LDS,
    and makes the all-in-sample comparison a variant. The Supplementary Figure 3 legend says the LDR
    model "explains greater neural variance when cross-validated" than the condition-specific LDS, and
    gives as reasons the more stable eigenvalues and the objective, which speaks of all three models
    under the same validation. Should all three models be compared under the same validation, either
    all cross-validated (held-out variance for jPCA and the LDS as well, if the paper or code fixes how)
    or all in sample, in place of the mix?
  passage: 'Supplementary Figure 3 legend, "Note that while the "different planes, shared eigenvalues"
    (LDR) model is a subset of the "different planes and eigenvalues" (condition-specific LDS) model,
    the "different planes, shared eigenvalues" explains greater neural variance when cross-validated.
    This improvement has two sources. First, as this model assumes that eigenvalues are shared across
    conditions, it gets to estimate rotational frequencies using every condition, leading to more
    stable estimates of eigenvalues. Second, LDS models predict the population state''s derivative
    from the state, which does not directly optimize variance explained." Results, Identifying
    rotations with varying planes, paragraph 4, "Our method also explained greater variance than jPCA
    or even single-condition LDSs (due to lower overfitting and differences in objective function;
    Supplementary Fig. 3 )."'
  why: The outcome turns on the reading. Under the main reading the held-out factorization value (73.9
    to 88.0%) is below the in-sample single-condition LDS (85.3 to 94.6%) in every dataset, so the
    claim is not reproduced; with all three in sample the factorization (94.1 to 96.9%) is highest in
    every dataset and the claim is reproduced. The claims file's check already noted the mix as open.
    The verifier of round 1 reported it as a reading of the claims file that affects the conclusion.
