dataset: DANDI:000070
paper: doi:10.1038/s41467-024-51308-7
questions:
- claim: suppfig3-model-comparison
  asked: 2026-11-28
  question: The criterion's main reading compares the cross-validated TBF variance with the in-sample
    variance of the single-condition LDS and jPCA, and its variant compares all three in sample. The
    Supplementary Figure 3 legend says the LDR model explains more variance than the condition-specific
    LDS "when cross-validated", which reads as both models scored on held-out data. Should the main
    reading compare held-out TBF with held-out single-condition LDS (and jPCA), as the verifier of
    round 1 proposed?
  passage: Supplementary Figure 3 legend, "Note that while the "different planes, shared eigenvalues"
    (LDR) model is a subset of the "different planes and eigenvalues" (condition-specific LDS) model,
    the "different planes, shared eigenvalues" explains greater neural variance when cross-validated.";
    Results, Identifying rotations with varying planes, paragraph 4, "Our method also explained greater
    variance than jPCA or even single-condition LDSs (due to lower overfitting and differences in
    objective function; Supplementary Fig. 3)". The claims check already noted this as open.
  why: Under the main reading the held-out TBF (73.5% to 88.8%) is below the in-sample LDS (83.4% to
    94.4%) in all four datasets and the claim is not reproduced. With both scored on the held-out half
    of an even split from -160 ms on, the TBF (74.0%, 80.8%, 88.1%, 81.2%) is above the held-out LDS
    (67.5%, 77.0%, 83.6%, 78.6%) and jPCA in all four, which would make it reproduced.
