# Questions from attempt crcns-stc-1-gu-2011-01 (author, 2026-11-06) about the claims file
# claims/crcns-stc-1/10.1016-j.neuron.2011.06.015.yaml. Each was raised by the round-2 verifier
# and is asked under docs/protocol.md, "Hand over for verification"; the claims are tested as
# written.
questions:
- claim: fig4dh-lateral-more-sensitive
  asked: 2026-11-06
  question: >-
    The criterion does not include the selection that the Figure 4 legend applies to the
    neurons of Figures 4D and 4H, significant heading tuning at p < 0.05 by ANOVA. Should the
    criterion restrict the test to neurons with significant tuning?
  passage: >-
    Figure 4 legend, (D and H), "Data were culled from a large database of MSTd neurons recorded
    with a single electrode. Only neurons with significant heading tuning (p < 0.05, ANOVA) were
    included (visual: n = 992; vestibular: n = 556)."
  why: >-
    Without the selection, poorly tuned units enter the test with very large thresholds and
    arbitrary preferred headings. The data set holds only trial-averaged curves, so the
    selection can be approximated at best. With a proxy (one-way ANOVA from the mean curve,
    five repetitions, variance equal to the mean) 252 of 258 values are kept, and with a
    stricter one (three repetitions, variance twice the mean) 169; the one reading that passes
    (vector-sum preference, spline threshold, log10, two factors) gives p = 1.2e-07 and 9.6e-08,
    and no other reading passes, so the outcome here does not change. Raised by the round-2
    verifier.
- claim: fig8ab-choice-probability-lateral
  asked: 2026-11-06
  question: >-
    The criterion compares the raw choice probabilities of fore-aft and lateral neurons. The
    Figure 8A legend describes lateral neurons' choice probabilities as "more deviated away from
    the chance level of 0.5". Is the comparison meant on the raw values, or on their distance
    from 0.5?
  passage: >-
    Figure 8 legend, (A), "Choice probability tends to be more deviated away from the chance
    level of 0.5 for neurons with lateral heading preferences." Results, Possible rsignal
    Distributions in Area MSTd, "neurons with a preference for fore-aft movement show
    significantly smaller choice probabilities (p = 0.019, t test, Figures 8A and 8B)".
  why: >-
    The two readings differ when choice probabilities below 0.5 are common. On the 258 values of
    the data set, the distance from 0.5 is larger for lateral units under every preference
    reading (0.072 to 0.074 against 0.062 to 0.063) but not significantly (p = 0.10 to 0.17),
    as the raw values are not (p = 0.14 to 0.80), so the outcome here does not change. Raised by
    the round-2 verifier.
