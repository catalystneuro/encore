dandiset: "000463"
paper: doi:10.1523/jneurosci.2218-24.2025
questions:
- claim: fig11b-ac-prf-responses
  asked: 2026-10-30
  question: Should reading O2b of the header (the mean over trials of per-trial ratios, trials with no
    prestimulation spike left out) stay a reading of the normalized spiking rate? The verifier reports
    it as a problem with the claims file. On units with no stimulus effect it does not give 100%, and
    its value depends on the firing rate, while the paper reports normalized rates on a scale where
    100% is no change. The same reading applies to every claim on normalized rates (Figures 4 to 9 and
    11B).
  passage: The normalized spiking rate which was normalized to 67 ms before each stimulation was used
    to show the neuronal response pattern and to quantify the parameter effect. (Methods, Neuronal type
    classification and neuronal response quantification) The spiking rates were normalized to the
    pre-stim period (67 ms pre-stim) for comparison across different conditions (Methods, Statistical
    analysis)
  why: On synthetic Poisson units without a stimulus effect (500 trials) O2a gives 99.9 to 101.6% at 2 to
    40 Hz and O2b gives 13, 31, 77 and 127% at 2, 5, 15 and 40 Hz. On the AC units O2a gives partially
    reproduced under every O3 and O4 reading and O2b gives not reproduced. The claims file's header
    blocks a claim as methods_underspecified when method readings give different outcomes, so whether
    O2b is a reading decides between partially_reproduced (assumed O2a, as recorded) and blocked.
