# Questions from attempt figshare-24639285-tarduno-2024-01 (author, revision after verifier round 1,
# 2026-10-27) about the claims file claims/figshare-24639285/10.1038-s41597-024-03626-0.yaml, asked
# under docs/protocol.md, "Hand over for verification". The claim is tested as the file has it.
dataset: FIGSHARE:24639285
paper: doi:10.1038/s41597-024-03626-0
questions:
- claim: no-alteration-recording-efficiency
  asked: 2026-10-27
  question: Reading (b) says the 590.4 TRM (40 uT) should be "no more than about twice" the 590.1 TRM
    (20 uT), but its cutoff fails a crystal only when the ratio of the 590.4 TRM to twice the 590.1
    TRM is above 2, that is when the 40 uT TRM exceeds four times the 20 uT TRM. Is the cutoff meant
    to be on TRM40/TRM20 (fail above 2, matching "about twice") or on TRM40/(2 TRM20) as written?
    The verifier of round 1 raised this.
  passage: If alteration had resulted in the formation of new magnetic minerals, apparent recording
    efficiencies ≫ 100% should have be observed (but these were not), and alteration checks should
    fail (Background & Summary, paragraph 5).
  why: TRM40/TRM20 is 1.54 to 2.35 over the twelve crystals, and three (12053g1 2.35, 14053g3 2.08,
    12053g2 2.06) are above 2. With a cutoff of 2 on TRM40/TRM20 reading (b) would fail three crystals
    and reading (a) fails one or two, so the claim would not pass under either reading. As written,
    TRM40/(2 TRM20) is 0.77 to 1.17 and every crystal passes, so the claim is reproduced.
