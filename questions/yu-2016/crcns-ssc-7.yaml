questions:
- claim: ion-cut-l4e-touch
  asked: 2026-11-06
  question: >-
    The criterion tests the touch PSP amplitude (peak of the average 0 to 50 ms after touch minus
    the mean 0 to 5 ms before) against zero. That measure is positive with no response at all,
    since the peak of a noisy average lies above its baseline. Does the paper's statement, that
    ION-cut neurons "did not depolarize after touch" next to a grand average compared with 15
    controls, support a test against zero, or should the reference be the same measure at times
    without touch (or the controls)? Should a reading be added that can decide the outcome?
  passage: >-
    As expected, L4 excitatory neurons did not depolarize after touch (Fig. 7b). (Results,
    Inhibition is driven by sensory input, paragraph 2.) Fig. 7b legend, "grand average of
    touch-aligned responses of 8 L4 excitatory neurons (black trace) and 15 L4 excitatory neurons
    recorded in control mice with matched resting membrane potential range".
  why: >-
    Against zero the amplitude is 0.321 mV, p = 0.0078 (not reproduced, as the criterion has it).
    The same measure at 200 random times per neuron gives 0.208 mV, and touch does not differ from
    it (p = 0.148), which would make the claim reproduced. The verifier of round 1 found the
    criterion biased in the same way.
- claim: thalamus-inhibition-dose
  asked: 2026-11-06
  question: >-
    The criterion correlates light power with rate per neuron, with control trials as zero power.
    Most FS neurons have one or two light powers, so the correlation mostly tests light against
    no light, which thalamus-inhibition-fs already tests, and not a dependence on dose. Does the
    paper's "dose-dependent" (Supplementary Fig. 9i,j, rate as a function of laser power) call
    for a test among light powers only, without control trials?
  passage: >-
    Photoinhibition reduced spike rates in FS interneurons ... in a dose-dependent manner
    (Supplementary Fig. 9i,j). (Results, Inhibition is driven by thalamus, paragraph 2.)
    Supplementary Fig. 9j legend, "Spike rate of FS interneurons as a function of laser power,
    separated into different behavioral epochs."
  why: >-
    With control as zero, all three epochs give p < 0.0013 (reproduced). Among light trials only,
    in the neurons with two powers, one epoch of three is significant (touch, p = 0.031;
    nonwhisking p = 0.31, whisking p = 0.074), which would not meet the criterion's two of three.
- claim: enphr-auc
  asked: 2026-11-06
  question: >-
    The criterion correlates the control touch-evoked rate with the AUC change (eNpHR minus
    control). The control rate and the control AUC come from the same trials, so noise shared by
    them biases the correlation negative (regression to the mean). Does the paper's statement
    (Fig. 8g) call for that test as written, or for one that takes the rate and the control AUC
    from different trials, or compares with a no-light null?
  passage: >-
    suppression of PV interneurons improved AUC for neurons with weak responses to touch and
    diminished AUC for neurons with robust responses to touch (Fig. 8f,g). (Results, Layer 4 FS
    interneurons suppress reafference in L4, paragraph 3.) Fig. 8g legend, "Relationship between
    change in AUC induced by eNpHR stimulation and the spike rate evoked by touch".
  why: >-
    Here the bias looks small: with control trials split in halves, the rate of one half does not
    correlate with the AUC difference between the halves (rho = 0.02). With rate and control AUC
    from different halves the correlation is rho = -0.19, p = 0.27, against rho = -0.28, p = 0.09
    as written (reading b). Both are not reproduced in this attempt, but a criterion without the
    shared trials could decide a later one differently. The verifier of round 1 raised it.
