questions:
- claim: fig7c-fold-edge-equivalence
  question: Under reading (b), RMS contrast times 100 at the ten RMS levels, the criterion asks that
    the Edge level nearest the S40 mean lie "within one step of 90%". The levels are 61.0, 64.7, ...,
    90.6 and 94.3, so 90 is not one of them. Is "90%" the value 90, so that a level must lie within
    3.7 of it, or the level 0.906, so that the level next to it (0.943) also passes? The paper's
    next sentence calls the 0.943 level a "94% contrast Edge" and the 0.684 level "68%", which
    suggests its "90%" is the 0.906 level.
  passage: 'Results, Neuron responses to corner-folds vs. different contrasts along edge, paragraph
    3, "Fig 7C shows that neural responses to P180° are roughly equivalent to neural responses to a
    50% contrast Edge, while neural responses to S40° are close to neural responses to a 90%
    contrast Edge. In addition, the neural responses to P180° are significantly lower than the
    responses to a 94% contrast Edge, and the neural responses to S40° are significantly higher
    than the responses to an Edge of less than 68% contrast."'
  why: The level nearest the S40 mean is 94.3. Read with 90 as the target it is 4.3 away, more than
    one step, and the claim is not reproduced; read with 90.6 as the target it is one level away
    and, with P180 matched at the lowest level as the criterion allows, the claim is reproduced.
    The attempt keeps the first reading as an assumption. Under (b) both matches are forced, since
    S40 is above every Edge level and P180 below every one, so the reader may also wish to say
    whether reading (b) can test the claim at all.
- claim: fig4a-above-baseline
  question: The claims file's checks say "Whether the Corners S40 midpoint averages the two S40
    folds is not stated", while the criteria of fig4a-above-baseline and the other S40 claims take
    the bright fold only. The Methods state it. Should the checks note be corrected?
  passage: 'Methods, Corners, paragraph 2, "Finally, we only analyzed symmetric bright corner-folds
    (i.e. bright folds aligned with the neuron''s preferred orientation) and P180° ... We did not
    analyze dark corner-folds (due to the relative scarcity of neurons with a preference for dark
    vs. bright stimuli in our sample)."'
  why: It cannot change an outcome here, as every criterion fixes the bright fold and the attempt
    uses it. A later attempt that followed the checks note and averaged the bright and dark folds
    would get a lower S40 midpoint (median 25.34 against 12.32 spikes/s for the bright and dark
    folds in this attempt).
