questions:
- claim: fig7a-rms-contrast-fit
  question: The criterion gives two readings of local RMS contrast, (a) the SD of pixel luminance
    over its mean and (b) the SD of luminance normalised to 0 to 1. Reading (b) cannot exceed 0.5
    for any image, so it cannot give the paper's 0.943, and reading (a) is independent of the
    luminance scale for a box centred on the Edge with a 0% background, so it cannot rise from
    0.61 to 0.943 with luminance. Does the paper allow another reading, for example contrast in
    physical luminance (the Methods give 14.07 cd/m2 at 50%), or a box that does not straddle the
    Edge, and should the criterion name it?
  passage: 'Results, Neuron responses to corner-folds vs. different contrasts along edge,
    paragraph 1, "Local RMS contrast was computed in a 1 x 1 DVA (16 x 16 DU) square area,
    centered on the Edge, moving from 0% to 100% luminance in 1.5% luminance steps (Fig 7A). This
    resulted in smooth contrasts ranging from 0.61 to 0.943." Methods, Square and edge, "at the
    50% luminance (14.07 cd per m 2) line".'
  why: Under the claims file's readings the claim cannot be reproduced on any stimulus image, so
    the outcome (not reproduced) says nothing about the data. The verifier of attempt
    martinez-conde-2019-02 reported this as a gap in the readings. A variant on physical luminance
    with a black level from 0 to 10 cd/m2, run by the attempt, did not give the paper's curve
    either (0.55 to 1.33 at 0.5 cd/m2), so a reading closer to the paper's reference [21] may be
    needed. The levels of fig7c-fold-edge-equivalence and fig7c-fold-edge-significance rest on
    this fit.
