# Questions from attempt martinez-conde-2019-02 (author-revise-1, 2026-11-15) about the claims file
# claims/martinez-conde-2019.yaml, reported by the round-1 verifier. Asked under docs/protocol.md,
# "Hand over for verification". The attempt tested the claims as the file has them.
dataset: crcns:pvc-12
paper: doi:10.1371/journal.pone.0210941
questions:
- claim: fig7c-fold-edge-equivalence
  asked: 2026-11-15
  question: Can reading (a) of the criterion, "contrast" as Edge luminance in percent at 10% steps, be
    the paper's meaning? The paper's own Table 1 gives the Edge midpoint, at 50% luminance, as 22.01
    spikes/s against a P180 mean of 4.87, so under reading (a) P180 cannot be "roughly equivalent" to a
    50% Edge. If only reading (b) (RMS contrast) is meant, should the criterion also say whether "within
    one step of 90%" means a distance of at most one step (0.037 x 100) from 90, or the level nearest 90
    or one next to it, since the RMS levels do not include 90?
  passage: Fig 7C shows that neural responses to P180° are roughly equivalent to neural responses to a
    50% contrast Edge, while neural responses to S40° are close to neural responses to a 90% contrast
    Edge (Results, Neuron responses to corner-folds vs. different contrasts along edge, paragraph 3);
    Table 1, rows Edge and P180, Midpoint column
  why: Under reading (a) P180 (4.64 spikes/s) is below every Edge level (9.01 to 20.80), so the claim
    fails on that reading. Under reading (b) S40 is nearest the 94.3 level, 4.3 from 90 against a step
    of 3.7, which fails on the distance reading and passes on the level reading. The outcome, kept as
    not reproduced, turns on these two points.
- claim: table1-s40
  asked: 2026-11-15
  question: The checks block of the claims file still lists "whether the Corners S40 midpoint averages
    the two S40 folds" as open, while the opening comment and the criteria of fig4b-spike-rate-difference
    and table1-s40 fix the Corners response as that of the bright S40 fold alone. Should the checks entry
    be removed or reworded so that the file says one thing?
  passage: We did not analyze dark corner-folds (Methods, Corners, paragraph 2)
  why: The attempt follows the criteria (bright fold only). The dark fold gives 12.54 spikes/s against
    26.32 for the bright fold, so an average of the two would change fig4b, Table 1 for S40 and the
    tests that use S40.
- claim: s4-baseline-no-difference
  asked: 2026-11-15
  question: The Methods give the Star ROI as 10 x 10 DVA (160 x 160 DU), while the Star's 0% polygon has
    a circumscribed radius of 150 DU, and the baseline squares are "at the corners of the circumscribing
    square". The claims file does not note this inconsistency. Should the Star baseline criterion say
    which square is meant (the square circumscribing the Star, 300 DU, or the ROI), given that the
    registered Star maps in the data set use a 321 x 321 DU frame?
  passage: The radius of the circumscribed circle of the 0% equal luminance polygon was 9.38 DVA (150 DU)
    ... We measured the neural activity within the ROI (which measured 10 × 10 DVA (160 × 160 DU)) ... the
    average activity in each of the four 1 × 1 DVA (16 × 16 DU) 0% luminance square areas at the corners
    of the circumscribing square (Methods, Visual stimuli, Star)
  why: The corners of a 160 DU square around the Star centre lie 113 DU from it, among the inner
    vertices of the 0% polygon (inscribed radius 100 DU), so whether squares there fall in a 0% area
    depends on the Star's rotation; the attempt places them at the corners of the 300 DU square
    circumscribing the Star. The Star baseline enters s4-baseline-no-difference, fig4a, fig4b, Table 1
    for S52 and the tests that use S52.
