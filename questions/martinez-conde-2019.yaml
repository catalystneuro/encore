# Questions from attempt martinez-conde-2019-01 (author, 2026-11-12) about the claims file
# claims/martinez-conde-2019.yaml, asked under docs/protocol.md, author step 1.6. The claims are
# tested as written; the attempt runs every reading it can see and records the claims whose outcome
# depends on the answer.
dataset: crcns:pvc-12
paper: doi:10.1371/journal.pone.0210941
questions:
- claim: fig4b-spike-rate-difference
  asked: 2026-11-12
  question: >-
    The criterion's reading (a) for Corners averages "the two S40 fold midpoints, as for Square and
    Star", and reading (b) takes "the single S40 fold midpoint at the ROI centre". In the data the
    Corners pattern has two 40 degree folds of opposite polarity, one bright (the contours point
    towards lower luminance) and one dark, and neither lies at the ROI centre (both are 22.5 DU from
    it). The paper says it analysed only bright folds and that Corners gives a matching dark and
    bright pair. Should reading (a) be dropped, as it averages a dark fold the paper says it did not
    analyse, and should reading (b) read "the bright S40 fold" in place of "the fold at the ROI
    centre"?
  passage: >-
    "Finally, we only analyzed symmetric bright corner-folds (i.e. bright folds aligned with the
    neuron's preferred orientation) and P180 ... We did not analyze dark corner-folds" (Methods,
    Corners, paragraph 2); "The Corners stimulus provided a matching set of dark and bright illusory
    corner-folds (i.e. same dimensions/properties for the dark/bright corner-folds, only reversing
    the polarity of the illusion)" (Results, paragraph 5); "Each angle in the lower panels indicates
    that of a bright illusory fold (S90, S52, S40)" (Fig 2 legend).
  why: >-
    With the bright fold the S40 mean is 26.27 spikes/s (paper 25.60 +- 4.18) and the order S40 >
    S52 > S90 > P180 holds; with the two folds averaged it is 19.09, below S52 (20.30), and the order
    fails. The attempt takes the bright fold, as the Methods say, and records the outcome as resting
    on that choice.
- claim: table1-s40
  asked: 2026-11-12
  question: >-
    As for fig4b-spike-rate-difference, reading (i) averages the bright and the dark S40 fold block
    by block, and reading (ii) takes "the fold at the ROI centre alone", but neither fold is at the
    ROI centre. Should the claim be tested on the bright S40 fold only?
  passage: >-
    "Finally, we only analyzed symmetric bright corner-folds ... We did not analyze dark
    corner-folds" (Methods, Corners, paragraph 2).
  why: >-
    With the bright fold all five values are within the paper's SEM under reading (a) (10.54, 34.25,
    23.01, 23.02, 26.27 spikes/s); with the two folds averaged at most one is.
