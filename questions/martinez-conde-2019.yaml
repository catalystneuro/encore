questions:
- claim: fig7c-fold-edge-significance
  question: The criterion is met when P180 is significantly lower than the Edge at RMS 0.943 and S40
    significantly higher than the Edge at 0.610 and 0.647. Does the paper's wording also set limits
    the criterion does not check? "An Edge of less than 68% contrast" may mean that S40 does not
    differ from the Edge at 0.684 and above, and "a 94% contrast Edge" may mean that P180 is lower
    only near 0.943. Should the criterion also require that S40 is not significantly higher at
    0.684 and above, and say whether P180 may also be lower at the other levels?
  passage: Results, Neuron responses to corner-folds vs. different contrasts along edge, paragraph
    3, "In addition, the neural responses to P180° are significantly lower than the responses to a
    94% contrast Edge, and the neural responses to S40° are significantly higher than the responses
    to an Edge of less than 68% contrast (two sample t -test corrected; S2 Table)."
  why: The claim is reproduced under BH over 40 tests, BH over 10 per fold and Bonferroni over 10.
    Under every one of them S40 is also significantly higher at 0.684 (BH up to 0.795, Bonferroni
    over 10 up to 0.721), and under BH P180 is lower at all ten levels. With the upper limit on S40
    added, no reading would meet the criterion (Bonferroni over 40, the only reading with S40
    significant below 0.68 alone, has S40 significant at 0.610 only and fails at 0.647), so the
    outcome would change from reproduced to not reproduced. The verifier of round 2 raised this.
