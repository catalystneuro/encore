dandiset: "000935"
paper: doi:10.1038/s42003-021-02981-7
questions:
- claim: fig7d-contacts-exceeding-baseline
  question: The criterion takes the baseline as "the 1 s spectrogram steps of the 180 s before onset"
    as a standard choice and lists only the band and the bound as open readings. The Methods do not
    say which baseline values are bootstrapped. Should the resampled unit (for example 1 s steps, non
    overlapping windows, or blocks) be listed as an open reading, so that the claim is blocked as
    methods_underspecified when the readings differ?
  passage: 'Methods, Statistical analysis, "A given electrode contact was considered to have exceeded
    baseline if its mean value in the period after bioluminescence onset was above the bootstrapped
    95th confidence interval of the mean of the baseline period."'
  why: With the 1 s steps, nearly every contact exceeds baseline in both groups (Opsin (-) 25.3 to
    29.3 per mouse against the paper's 2.7), and the claim is not reproduced under every reading. On
    the paper's own Fig. 7d group-mean series (Supplementary Data 7) the same rule counts 20 of 25
    Opsin (-) contacts above baseline. The round-3 verifier found that this fixed choice likely drives
    the result, and that blocked as methods_underspecified would be the outcome if the resampled unit
    were an open reading.
