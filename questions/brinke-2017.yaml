# claims/brinke-2017.yaml. Asked under docs/protocol.md, Author, step 1.6. The attempt tested the
# claims as the file has them and blocked the four claims below as data_missing.
dataset: crcns:cb-1
paper: doi:10.7554/elife.28132
questions:
- claim: firing-rate-depth
  also: [fig4s1-cs-peak-suppression-not-different, fig5ej-cs-pause-cells-shallower, fig6g-us-response-depth]
  asked: 2026-11-13
  question: These claims need each recording's depth, which CRCNS cb-1 does not hold (its data
    structure has no depth field). The paper's Source data 1, elife-28132-data1-v2.mat on the eLife
    site (https://cdn.elifesciences.org/articles/28132/elife-28132-data1-v2.mat), is a structure
    `ipn` of 51 variables for the 372 cells in the same order, and one of its variables is named
    `Depth`. The opening comment of the claims file mentions Source data 1 but lists only the Purkinje
    cell data as outside data. Should these claims be `data elsewhere` (or `with_inputs`, with a link
    claim that matches the 372 cells by order and checks shared values such as baseline rate and
    valid trial count), with Source data 1 as the pinned input, so that a later attempt can test them?
  passage: Additional files, Source data 1, "For 51 variables relevant to the analyses in this paper,
    the values for each trial for each cell are contained in a data structure ... The two IpN datasets
    central to this study are combined, with the first 270 cells denoting the first dataset, and the
    remaining 102 cells denoting the second dataset."
  why: As the file stands, each of the four claims is blocked as data_missing, although the paper
    deposited the depths in a public file. The attempt read only the variable names of Source data 1,
    to ask this question; it used none of its values.
