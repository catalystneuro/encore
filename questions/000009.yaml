# attempt runs every reading it can see and records the claims whose outcome depends on the answer.
dandiset: "000009"
paper: doi:10.1038/nature22324
questions:
- claim: alm-unit-classes
  also: [fig2e-alm-selectivity, fig2e-alm-contra-ipsi-balance, thalamus-unit-classes, fig2f-vmval-selectivity,
    fig3-alm-collapse, fig3d-all-layers, fig3b-selectivity-types-equally-inhibited, fig3f-thalamus-silenced,
    fig3-onset-latencies, fig6c-vmval-reduced, fig6b-selectivity-types-equally-inhibited,
    fig6c-unmodulated-less-selective, fig6d-localized, fig6e-onset-latencies, snr-photoinhibition,
    snr-unit-properties, selectivity-time-course]
  asked: 2026-10-20
  question: The deposited mean waveforms are 29 to 38 samples at 25 kHz with the trough at sample 15
    to 19, so trough-to-peak widths above about 0.5 ms cannot be measured (the peak is the last
    sample in 78% of ALM units labelled wide). The files carry a `cell_type` label ('Wide width
    spiking', 'Narrow width spiking', 'Cannot be determined') whose rule is not stated. Should the
    unit classes (ALM pyramidal > 0.6 ms, thalamic > 0.5 ms, SNr GABAergic < 0.45 ms) be taken from
    widths computed on the deposited waveforms (P1), or from the files' labels (P2)?
  passage: Methods, Electrophysiology data analysis, "Spike widths were computed as the
    trough-to-peak interval in the mean spike waveform."
  why: P1 gives 577 ALM pyramidal and 148 thalamic units, P2 gives 810 and 682 (paper 1006 of 1214
    and 672 of 790). Selections downstream change size, for example 20 against 222 VM/VAL units, and
    the ALM populations of Fig. 6e are empty under P1. The attempt runs both.
  answered: 2026-10-20
  answer: The paper gives the rule, not the label. Widths are "computed as the trough-to-peak interval in
    the mean spike waveform" and the classes "separated based on the histogram of spike widths"
    (Extended Data Fig. 4b); the paper never mentions a deposited cell_type label or how long the
    stored waveforms are. P1 is the Methods' rule; P2 is a reading only because the paper does not
    say how the label was made. For thalamus the Methods add "our conclusions ( Fig. 2 , 6 ) are
    valid if all the units were pooled", a further reading (P3) for the thalamic claims of Fig. 2
    and 6. Written as convention C in the opening comment and into alm-unit-classes,
    thalamus-unit-classes and snr-photoinhibition.
- claim: fig3-alm-collapse
  also: [fig3d-all-layers, fig3b-selectivity-types-equally-inhibited, fig3-onset-latencies]
  asked: 2026-10-20
  question: Besides the 18 VGAT-ChR2-EYFP ALM sessions (thalamus photostimulation at 10 mW), the
    dandiset holds 21 ALM sessions of four PV-Cre x Ai32 mice with thalamic photostimulation at 10,
    22.5 and 45 mW. Do these belong to the ALM recordings during thalamus photoinhibition of Fig. 3
    (n = 314), and at which power?
  passage: Results, Thalamus drives ALM preparatory activity, paragraph 1, "using VGAT-ChR2-EYFP
    mice"; Methods, Photoinhibition, "photoinihibition in the PV-IRES-Cre x Ai32 mice was
    indistinguishable from the VGAT-ChR2-EYFP mice" (said of cortical photoinhibition).
  why: VGAT units alone number 234 to 261 (below 314 +/- 31) and fall to 2.1 to 2.5% of control;
    adding the PV-Cre x Ai32 units at 10 mW gives 360 to 522 units at 5.5 to 11.1% (Q1) with up to 7
    significantly activated. The attempt follows the claims file (VGAT) and shows the others as a
    variant.
  answered: 2026-10-20
  answer: No, by the text. The Results say "using VGAT-ChR2-EYFP mice" for Fig. 3, and the Methods list
    PV-IRES-Cre x Ai32 mice only for ALM photoinhibition ("Fig. 1 and 6 , Extended Data Fig. 8 ,
    10"); the "indistinguishable" sentence is about cortical photoinhibition. The power is 10 mW
    ("Laser power at the tip of optical fiber 10mW, n = 314 cells", Extended Data Fig. 2e).
    Supplementary Table 1, which lists animals and powers per experiment, is not in the text read.
    The PV-IRES-Cre x Ai32 sessions stay a variant, not a reading. Written into the criterion of
    fig3-alm-collapse.
- claim: fig6c-vmval-reduced
  also: [fig1c-alm-photoinhibition-bias, fig6b-selectivity-types-equally-inhibited, fig6c-unmodulated-less-selective,
    fig6d-localized, fig6e-onset-latencies, snr-photoinhibition, vm1-photoinhibition-no-effect]
  asked: 2026-10-20
  question: ALM photoinhibition trials are at 1.5 mW in most sessions, but some sessions interleave
    0.75 or 0.79 mW. Do the lower-power trials enter the photoinhibition condition?
  passage: Methods, Photoinhibition, "We used 40 Hz photostimulation with a sinusoidal temporal
    profile (1.5mW average power)".
  why: VM/VAL activity falls to 47.5% of control at 1.5 mW and to 57.7% with all powers pooled
    (P2, T1). The attempt uses 1.5 mW and shows all powers as a variant.
  answered: 2026-10-20
  answer: No. The Methods give one power for ALM photoinhibition, "1.5mW average power", for Fig. 1, 6 and
    Extended Data Figs 8 and 10, and name no other; trials at 0.75 or 0.79 mW are outside the
    condition, and pooling all powers is a variant. Supplementary Table 1 gives powers per experiment
    and is not in the text read. Written into convention P in the opening comment, which these
    claims use.
- claim: wc-thalamus-hyperpolarization
  also: [wc-m1-small-effect, wc-contra-alm-small-effect, thalamus-stronger-than-cortex]
  asked: 2026-10-20
  question: The whole-cell files record no photostimulus time (their photostimulus columns are
    empty; `stim_present` marks the trials). Convention E puts the onset 1.3 s after `pole_in_time`,
    but there the 20 to 120 ms window precedes the effect; thalamus photoinhibition hyperpolarizes
    ALM neurons from about 1.49 s after `pole_in_time` (15 of 16 cells between 1.47 and 1.51 s), just
    before 0.1 s after `pole_out_time` (1.5 s), the sample-epoch end of the Methods. Where should
    the photostimulus onset be placed in these files?
  passage: Methods, Behavior, "The sample epoch (1.3 s total) was the time from onset of pole
    movement to 0.1 s after the pole started to retract"; Methods, Photoinhibition, the photostimulus
    starts "at the beginning of the delay epoch".
  why: With onset E thalamus photoinhibition changes Vm by +0.31 mV in the window; with onset M by
    -16.83 mV (paper -18.7 +/- 1.1). Onsets in milliseconds need the true laser time, which no
    reading of the paper gives. The attempt blocks these claims (metadata insufficient) and shows
    both readings.
  answered: 2026-10-20
  answer: The paper gives the onset relative to the task, not to the files' fields. The photostimulus
    starts "at the beginning of the delay epoch", 1.3 s after the onset of pole movement and 0.1 s
    after the pole started to retract; the pole travels 0.2 s, stays 1 s and retracts 0.2 s
    (Methods, Behavior), so the delay begins 0.1 s before retraction is complete. The paper does not
    say which events pole_in_time and pole_out_time mark and gives no laser time for these
    recordings. Both E (pole_in_time as the onset of pole movement) and M (pole_out_time as the start
    of retraction) are readings it allows; placing the onset from the Vm change is not. The onset in
    milliseconds cannot be fixed from the paper. Written into the criterion of
    wc-thalamus-hyperpolarization.
- claim: vm1-photoinhibition-no-effect
  asked: 2026-10-20
  question: The files do not name a vM1 site. In mouse anm00264943, photostimulation at galvo
    position (0.5, 0.5) mm at 0.79 mW is interleaved with ALM photoinhibition at 0.79 and 1.5 mW. Is
    this the vM1 condition of Extended Data Fig. 8f, g, and is vM1 compared with ALM photoinhibition
    at the same power or at 1.5 mW?
  passage: Extended Data Fig. 8f, g legends, "Photoinhibition conditions were interleaved"; the vM1
    coordinates are in Supplementary Table 1, not in the text read.
  why: Against ALM at 1.5 mW the vM1 reduction is smaller (p < 0.0001) and the claim would hold;
    against ALM at 0.79 mW it is not (p = 0.73). The attempt blocks the claim (metadata insufficient).
  answered: 2026-10-20
  answer: The paper does not say which condition is vM1. It gives no vM1 photoinhibition coordinate or
    power in the text (Supplementary Table 1 is not in the text read); the only vM1 coordinate,
    "AP1, ML 0.75", is an Allen tracer injection (Extended Data Fig. 8e), and the frame of the galvo
    positions is not given. On power, the Methods give only 1.5 mW for cortical photoinhibition in
    Extended Data Fig. 8, so vM1 is compared with ALM at 1.5 mW; ALM at matched power is a variant.
    The site stays open. Written into the criterion of vm1-photoinhibition-no-effect.
- claim: selectivity-time-course
  asked: 2026-10-20
  question: The criterion says correct trials. In sessions with photoinhibition, do the
    photoinhibition trials enter the population selectivity time course, or only control trials?
  passage: Extended Data Fig. 4c legend gives the method without naming the trials.
  why: In ALM the delay increase holds in 4 of 4 unit and neuron readings with all correct trials and
    in 2 of 4 with control trials only; the VM/VAL result does not change. The
    attempt runs both.
  answered: 2026-10-20
  answer: The paper does not say. The Extended Data Fig. 4c legend names no trials, and the Methods say
    only "Only trials in which mice correctly reported pole locations were included to compute
    selectivity". Readings (t1) correct control trials only and (t2) all correct trials both stand,
    as for fig2e-alm-selectivity. Written into the criterion of selectivity-time-course.
