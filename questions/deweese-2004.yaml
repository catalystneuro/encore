questions:
- claim: culling-controls
  question: Does the paper's random culling control apply the 10-trial tone criterion again after
    the random removal? The criterion says "the tone criteria are then applied". Read that way, a
    control that removes as many trials per tone as LFP-based culling drops exactly the tones that
    LFP-based culling drops, and here it gives 3.82 mV, not the paper's 4.5 mV with "no effect".
    Without the criterion applied again (every tone included before culling kept), the
    LFP-matched control gives 4.83 mV (SD over 20 simulations 0.97). The paper's own results
    point both ways. Random culling of 38% of trials leaves q unchanged, while the PSP-matched
    control (29%) lowers it, which fits a control that does not drop tones. But the next
    paragraph explains the reductions by "the removal of ensembles of responses corresponding to
    tones that elicited fewer than 10 nonaberrant PSPs", which fits one that does. The same
    question applies to large-responses-controls, which follows culling-controls.
  passage: Methods, LFP-based culling and PSP-based culling procedures, paragraphs 3 and 4, "As a
    control for the possibility that the variability index was reduced partly because of
    undersampling after the LFP-based culling procedure, we randomly culled an equal number of
    traces as the LFP-based culling procedure from each ensemble of responses corresponding to a
    given neuron and a given tone, and found no effect (after random culling ... 4.5 +- 0.1 mV,
    n = 20 simulations ...). Repeating this control for the PSP-based culling procedure did reduce
    the variability index (after random culling ... 3.67 +- 0.02 mV ...)" and "These reductions
    did not result from an undersampling bias, but were instead due to the removal of ensembles
    of responses corresponding to tones that elicited fewer than 10 nonaberrant PSPs from at
    least one neuron." Earlier in the same section, "In computing q values after each culling
    procedure, we avoided undersampling effects by including only those tones with at least 10
    trials that remained after culling."
  why: The LFP-matched value is the control's main expected value and decides the outcome. It is
    3.82 mV with the criterion applied again and 4.83 mV without it, against 4.5 +- 0.1 (the
    criterion counts a miss of less than three SEs as partial). The PSP-matched and both-matched
    values move as well, so the reading the claims file takes could change culling-controls and
    large-responses-controls from not reproduced.
- claim: fig4c-psp-culling-can-increase
  question: The criterion says the Figure 4 neuron is not named and identifies it by a search. The
    panels of Figure 4 carry the label 030301md03b (under 4A, and in 4C), as Figures 2 and 3A carry
    022801md01b. Should the Figure 4 example values be taken from 030301md03b? There the 9,188-Hz
    tone gives q 0.470 mV before PSP-based culling and 0.502 mV after it (0.47 and 0.57 in the
    paper). Its 31,118-Hz tone, the tone of Figure 4A and 4B, fits the Figure 4B legend (PSP-based
    culling removes one trace, LFP-based culling that trace and three others) only when the
    negative scale factor rule is left out of PSP-based culling (open detail 4, reading b); with it,
    PSP-based culling removes two traces.
  passage: Figure 4 panel labels "030301md03b" (A, under the 31 KHz stimulus bar; C, beside the 9.2
    kHz bar), and the Figure 4 legend, "In this example, PSP-based culling removes only the most
    aberrant trace, whereas LFP culling removes that trace and 3 others" and "for this tone,
    PSP-based culling increased the variability index (q9.2 Hz = 0.47 mV, q9.2 Hz-PSP-culled = 0.57
    mV)".
  why: The example values are reported and do not decide the outcome, so the outcome does not change.
    The label settles which neuron the example is, and the 31-kHz tone of that neuron bears on open
    detail 4, which moves psp-culling-reduction, anesthesia-comparison and
    overfitting-correction-example.
