dandiset: "001552"
paper: doi:10.64898/2026.04.07.716149
questions:
- claim: fig4b-long-iti-dip-below-baseline
  asked: 2026-11-25
  question: The criterion reads "did not resolve" as the across-subject mean ΔF/F of the last kept
    bin before the next cue being above zero. Under a session-wide 405 nm regression the mean ΔF/F
    of a session is zero, so zero is not a resting level. Does the paper's comparison for the
    short-ITI part instead set the short-ITI late trace against the long-ITI late-ITI level (the
    other trace in Figure 4B), so that the criterion should test that the short-ITI last bin is
    above the long-ITI late-ITI level?
  passage: During the ITI itself, long-ITI dopamine settled reliably below baseline, the tonic dip
    predicted by -ρV̂, while the short-ITI trace showed a slowly decaying reward response that did
    not resolve before the next trial (Fig. 4B). (Results, paragraph on tonic dopamine)
  why: Raised by the round 2 verifier. In this attempt the short-ITI part fails under both
    comparisons (last bin -0.0067 against zero, and against the long-ITI late level of -0.0046,
    paired t(17) = -1.87, p = 0.078, higher in 5 of 18 mice), so the outcome does not change here,
    but a later attempt with another correction could.
- claim: fig4b-long-iti-dip-below-baseline
  asked: 2026-11-25
  question: The criterion reads "baseline" as ΔF/F of zero. With the session-wide 405 nm
    regression the criterion names, a session's mean ΔF/F is zero by construction, so stretches
    without transients come out below zero whether or not there is a tonic dip. Does the paper's
    "below baseline" mean below zero on this scale, or below some other reference level (for
    example the level before the cue, or a level outside the task)? The paper names no baseline
    window.
  passage: During the ITI itself, long-ITI dopamine settled reliably below baseline, the tonic dip
    predicted by -ρV̂ (Results, paragraph on tonic dopamine); the tonic measure is the mean from the
    midpoint to 1s before the next cue in long-ITI trials with ITI duration ≥ 30 s (Methods,
    Floeder (2025) dataset).
  why: Raised by the round 2 verifier. Against zero the long-ITI part holds in 18 of 18 mice under
    every reading. Against the level 5 to 0 s before the cue, the late-ITI level is not lower
    (difference 0.0003, t(17) = 1.03, p = 0.32, lower in 8 of 18 mice), so under that reading the
    long-ITI part would fail and the claim would not be reproduced.
