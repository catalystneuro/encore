dandiset: "001025"
paper: doi:10.1016/j.bioelechem.2023.108437
questions:
- claim: fig7a-amplitude-scales-uptake
  asked: 2026-11-02
  question: The criterion says "the paper does not say whether background is subtracted from the
    a.u. values, and none is, as in the Methods". The Methods for the monolayer experiments
    (Section 2.4) say nothing either way, and Section 2.2 does correct for background (F - F0) for
    the single-cell data. Does the paper support "none is subtracted", or should the criterion
    leave the background open, as a reading (none, or a background such as the camera offset or
    the unlabelled area removed) the way the opening comment treats the ROI layout? The same
    question bears on fig7b-targeting-independent-of-amplitude and fig7cd-holds-for-large-array,
    whose normalised values change with it.
  passage: Section 2.4, "Fluorescence intensity was measured with MetaMorph 7.8.13 (Molecular
    Devices, Foster City, CA) as a function of the distance from the geometrical center of the
    electrode array" (no word on background). Section 2.2, "Emission intensity corrected for the
    background (F-F0) was used for graphs and statistical analyses." Section 3.4 gives Packet 2 at
    4 kV, 1Px4 as about 120 a.u. near the electrodes and 215 to 235 a.u. in the centre.
  why: The images carry an offset that varies by session (dark floor 33 to 81 a.u., median inside
    the needle footprints 140 to 425 a.u.). Without subtraction the 5.6 over 2.4 kV ratios of fig7a
    are 5.99, 5.65 and 7.25 (none within tolerance in 18 readings); with the footprint median
    subtracted they are 13.37, 15.87 and 15.16 under the main reading, and 14.88, 17.10 and 15.16
    (all within tolerance) when the end ROIs inside the paper's exclusion zone are also dropped.
    For fig7b the one significant pair under the main reading (p = 0.0037) disappears with the
    background subtracted (smallest p = 0.18; 30 of 36 readings find no pair). The dataset's 4.0
    kV 1Px4 dishes read about 615 a.u. at the periphery and 719 a.u. in the centre, so the paper's
    a.u. do not look like raw values. The verifier of round 1 reported this as a possible
    misreading of the paper by the claims file.
