  question: The dandiset gives no electrode positions relative to the central sulcus or the Sylvian
    fissure. EC2 and GP31 have x, y, z coordinates with no unit or frame (spacing about 4 mm), GP33
    has none, and the labels are atlas gyri (precentral, postcentral and others; none marks the
    guenon). Does the paper give any way to obtain the anterior-posterior and dorsal-ventral
    distances from such data, for example from the grid geometry?
  passage: Methods, Spatial Organization Derived from a General Linear Model, "We used a Cartesian
    plane defined by the Anterior-Posterior distance from the Central Sulcus (ordinate) and the
    Dorsal-Ventral distance from the Sylvian Fissure (azimuth)."
  why: Without them the seven spatial claims are blocked as metadata_insufficient. For information
    only, the median z coordinate of the top lips weights lies above that of the tongue weights in
    EC2 and GP31 (36.6 against 15.6 in EC2 under the first reading).
  answer: >-
    No. The paper measures position on each subject's MRI reconstruction, as "the
    Anterior-Posterior distance from the Central Sulcus ... and the Dorsal-Ventral distance from the
    Sylvian Fissure" (Methods), and gives no way to derive these distances from grid
    geometry, unlabelled coordinates or atlas labels. The header's vSMC definition now says
    so; the spatial claims stay blocked as metadata_insufficient when the dataset lacks
    these positions. Claims unchanged.
  answered: 2026-10-22
