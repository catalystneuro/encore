questions:
- claim: figs6-train-test-uncorrelated
  question: The criterion compares the median of the signed inter-trial correlations with 0.2 or
    0.1. Any distribution centred on zero passes it, however large the single correlations are.
    Does "largely uncorrelated" in the paper mean that the correlations are small in magnitude (for
    example the median of their absolute values, or a share of them below a level), so that the
    criterion should test their magnitude?
  passage: Results, Functional characterization of thermoregulatory circuits, paragraph 4, "due to
    the random nature of both our stimulus and the elicited behavior, test and training data were
    largely uncorrelated (Figure 6, figure supplement 1B)".
  why: Raised by the round-1 verifier. In the attempt the temperature correlations run from -0.909
    to 0.873 (5th to 95th percentile -0.620 to 0.544), with a median of -0.051, which passes both
    readings, and a median absolute value of 0.266, which would fail both. The behavior traces pass
    either way (median absolute 0.025 or less). A criterion on the magnitude would change the
    outcome from reproduced to not reproduced or partially reproduced.
