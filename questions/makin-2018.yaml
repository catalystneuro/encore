dandiset: "000129"
paper: doi:10.1088/1741-2552/aa9e95
questions:
- claim: fig2-gross-failures
  asked: 2026-10-28
  question: The criterion judges gross failures at 64 ms only. Should it cover every configuration
    the paper ran (bin widths of 16 to 128 ms, 80 and 160 s of training, fractions of the neurons),
    as "in our experiments" may mean?
  passage: Nevertheless, it should be emphasized that, in our experiments, such gross failures
    occurred only for the UKF and KFlatent (+KF), so reporting SNR yields a conservative appraisal
    of the merits of the rEFH. (Results, after the definition of SNR)
  why: At 64 ms with all units and 320 s of training no decoder has a negative R2 on this session,
    so the claim holds trivially. In the other configurations negative R2 also occurs for linear
    regression, KFobs, static KFlatent and the static rEFH (binwidth_training_neurons.ipynb), so
    the claim would not be reproduced under the wider reading.
- claim: fig2-refh-kf-best
  asked: 2026-10-28
  question: The paper's 47 Sabes-lab sessions are public on Zenodo (doi:10.5281/zenodo.583331),
    and the dandiset holds one session that is not in the paper's session list. Should the claims
    that need the paper's sessions (this one, intro-gain-over-nearest, fig4-advantage-grows,
    fig4-position, fig5-vel-acc-all-bins, fig5-position-bins, fig6-training-time,
    fig7-vel-acc-neurons, fig7-position-neurons, fig8-position-variants, fig9-taps,
    static-refh-position-worse) be marked `data elsewhere` with that deposit, or stay on the
    dataset?
  passage: O'Doherty J E, Cardoso M M B, Makin J G and Sabes P N 2017 Nonhuman primate reaching
    with multichannel sensorimotor cortex electrophysiology (https://doi.org/10.5281/zenodo.583331)
    (reference 26, cited for the data in Methods)
  why: On the dataset these claims are blocked as data_missing, since it holds one session. Marked
    `elsewhere`, they would be tested on the Zenodo sessions, or blocked as too_large if the eight
    decoders on 47 sessions do not fit the time limit (here they take about 2 min on one session
    of 111 units, and the paper's sessions have 171 to 523).
