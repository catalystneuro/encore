dandiset: "000294"
paper: doi:10.1162/neco_a_01672
questions:
- claim: mea-electrodes-and-rates
  asked: 2026-10-30
  question: The criterion allows the APWaveform patch series only at 20 or 200 kHz. The Methods say
    "high sampling rates (typically 200 kHz)", which reads as a range of high rates, not one value.
    Should any rate well above 20 kHz (the deposited APWaveform sweeps are at 125 kHz, 8 us) count as
    matching for APWaveform?
  passage: 'APWaveform: This protocol was defined to precisely record one to two action potentials
    at high sampling rates (typically 200 kHz). (Methods 5.2); Whole-cell current-clamp recordings
    were low-pass-filtered at 10 kHz and digitized at 20 kHz. (Methods 5.6.5)'
  why: Under the claims file APWaveform at 125 kHz fails; under the wider reading it passes. The
    outcome of this attempt does not change, since six other protocols are at 20.41 kHz (49 us) and
    already fail the 20 kHz requirement with tolerance 0, but the APWaveform part would. The
    independent verifier raised it (round 1, problem 3).
