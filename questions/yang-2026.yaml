# Questions from attempt yang-2026-01 (author revision after verifier round 1, 2026-11-21) about
# claims/yang-2026.yaml, asked under docs/protocol.md, Author, step 1.6, and "Hand over for
# verification". The claims were tested as the file has them.
dataset: DANDI:000363
paper: doi:10.21203/rs.3.rs-11447300/v1
questions:
- claim: fig3-1c-alm-early-residual
  asked: 2026-11-21
  question: The criterion scores the early-window residual in "the M4, M5 window", which reads as one
    20 to 120 ms window, and the claims file does not list the binning as open. The Methods divide
    the primary window into 50 ms bins, score the same pairs in the early window, and compute the
    distance curve in 50 ms bins. Should the criterion name the binning of the early window as open,
    with readings (a) one 100 ms window and (b) two 50 ms bins with the per-bin distances averaged as
    for the pre-lick window (M9)?
  passage: The primary window was the 200 ms before the lick, divided into 50 ms bins. The same pairs
    were scored in the early window (Methods, Matched distance); Distance used 50 ms bins (Methods,
    Time courses).
  why: The outcome turns on it. On the matched pairs the ALM early residual is 12.59 (SEM 2.0) in two
    50 ms bins, within 12.6 +- 2.0 (reproduced), and 18.36 (SEM 2.7) as one 100 ms window, outside
    tolerance (partially reproduced). The attempt adopts the binned reading as an assumption. The
    verifier of round 1 reported that the claims file misses this open detail.
- claim: fig2d-choice-share-flat
  asked: 2026-11-21
  question: The reproduced clause uses the SEM as the line between "rose" and "stayed flat" (the
    pre-lick mean exceeds the early mean by more than its SEM). The partial clause, "the mouse-level
    choice fraction does not rise in at least four regions", does not say whether the same SEM rule
    applies or whether any increase of the mean counts as a rise. Which is meant?
  passage: Before the lick, the share fell or stayed flat in four regions and rose only in medulla,
    from 0.036 to 0.058 (Results, Lick decoding rises without a matching rise on the choice axis,
    paragraph 2).
  why: In midbrain the mean rises by 0.006, less than its SEM of 0.006. With the SEM rule four regions
    do not rise and the outcome is partially reproduced; counting any increase as a rise, three
    regions do not rise and the outcome is not reproduced. The attempt applies the criterion's own
    SEM rule to both clauses, as an assumption. The verifier of round 1 reported the ambiguity.
