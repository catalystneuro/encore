name: Send a run from a fork of encore-runner
description: Ask the registry to take a run your organization made from its fork of encore-runner.
title: "Outside run: "
labels: [outside-run]
body:
  - type: markdown
    attributes:
      value: |
        The runs that begin an attempt (claims, claims-check and the author's first run) can be made from a fork of [encore-runner](https://github.com/encorescience/encore-runner), with your own API key (encore-protocol's docs/outside-runs.md). The registry's intake checks the run's signed submission and commits it to the attempt's branch. Runs from a fork wait until someone at CatalystNeuro approves them; the intake comments here with what it found, and closes this issue once the run is taken. Send each run once it has finished, and start the next run only after this one is taken.
  - type: input
    id: run
    attributes:
      label: Run
      description: "The run's address in your fork."
      placeholder: "https://github.com/OWNER/encore-runner/actions/runs/123456789"
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: Note
      description: "Anything the reviewer should know, such as who ran it."
