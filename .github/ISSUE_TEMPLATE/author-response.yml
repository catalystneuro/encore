name: Respond to an attempt (paper authors)
description: "For an author of the paper: say whether an attempt's outcomes are right, and what it got wrong."
title: "Author response: "
labels: [author-response]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for looking at the attempt. Your response is public, here and, once we have confirmed that you are an author of the paper, on the paper's page in the registry and on your own page there. We confirm authorship from the ORCID iD below, which the paper's page lists for its authors (or by writing to you), and then add the `author-confirmed` label. What happens next is in docs/author-responses.md: an author's agreement is recorded on the attempt as an endorsement, and a disagreement leads us to re-run it, correct the claims or withdraw the attempt.

        A failure to reproduce in this registry may be a failure of the agent, and is not a judgement of the paper. Telling us where it went wrong is the most useful thing you can do.
  - type: input
    id: paper
    attributes:
      label: Paper
      description: "The paper's key in the registry, such as sargolini-2006, or its DOI. The link on the paper's page fills it in."
    validations:
      required: true
  - type: input
    id: attempt
    attributes:
      label: Attempt
      description: "The attempt's id, such as sargolini-2006-02. The link on the page fills it in; leave it empty if you mean the paper's attempts in general."
  - type: input
    id: name
    attributes:
      label: Your name
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role in the paper
      options:
        - first author
        - corresponding or senior author
        - co-author
        - not an author (for example, a maintainer of the dataset)
    validations:
      required: true
  - type: input
    id: orcid
    attributes:
      label: ORCID iD
      description: "So that we can confirm you are on the paper, such as 0000-0002-1825-0097: the paper's page lists its authors by ORCID iD, and your response is linked to your page in the registry. Without one we will write to you through your institution."
  - type: dropdown
    id: view
    attributes:
      label: Your view of the attempt
      options:
        - The outcomes look right
        - Some outcomes are wrong
        - The attempt misread what the paper claims
        - The dataset is incomplete or differs from what the paper used
        - Other
    validations:
      required: true
  - type: input
    id: claims
    attributes:
      label: Claims you are responding to
      description: "Their ids from the paper's page (such as C3, C7), or 'all'."
  - type: textarea
    id: response
    attributes:
      label: Your response
      description: "What the attempt got right or wrong, and why. Point to the paper, its methods, its code or the data where you can."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Supporting links
      description: "Code, corrected data, errata, or anything else that helps."
  - type: checkboxes
    id: consent
    attributes:
      label: Publication
      options:
        - label: "I agree that this response may be shown on the paper's page in the registry, with my name."
          required: true
