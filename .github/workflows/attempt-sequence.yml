name: Attempt sequence

# A whole attempt on one dataset, given by its folder name (000147, or <archive>-<id>): the paper match, which goes on only when
# a paper is the paper behind the data (docs/pipeline.md step 1), the reader's claims and their check (papers.yml), the author,
# the first verification round,
# the author's revision, the second round and the final revision, each an Agent
# run (attempt.yml), and a third round when the final revision proposed changes. Each step starts when the one before has succeeded, so a
# failure stops this dataset's attempt and leaves its branch as the last good
# step left it. Called by pipeline.yml, once per dataset.

on:
  workflow_call:
    inputs:
      dataset:
        type: string
        required: true
      model:
        type: string
        default: claude-opus-5-5
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  paper-match:
    uses: ./.github/workflows/papers.yml
    with: {dataset: "${{ inputs.dataset }}", role: paper-match, model: "${{ inputs.model }}"}
    secrets: inherit
  paper-matched:
    # The claims are read only from a paper whose data the dataset holds.
    needs: paper-match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "attempt/${{ inputs.dataset }}", persist-credentials: false}
      - run: |
          pip install -q pyyaml
          status=$(python tools/paper_match.py status "${{ inputs.dataset }}")
          [ "$status" = matched ] || { echo "::error::No paper matches the dataset ($status): see papers/match/${{ inputs.dataset }}.yaml"; exit 1; }
  claims:
    needs: paper-matched
    uses: ./.github/workflows/papers.yml
    with: {dataset: "${{ inputs.dataset }}", role: claims, model: "${{ inputs.model }}"}
    secrets: inherit
  claims-check:
    needs: claims
    uses: ./.github/workflows/papers.yml
    with: {dataset: "${{ inputs.dataset }}", role: claims-check, model: "${{ inputs.model }}"}
    secrets: inherit
  claims-ready:
    # The attempt starts only on a claims file whose last check says it is ready. Questions the
    # author raises are taken up by the queue runner (tools/runner/chain.sh), not here.
    needs: claims-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "attempt/${{ inputs.dataset }}", persist-credentials: false}
      - run: |
          pip install -q pyyaml
          python - <<'PY'
          import glob, sys, yaml
          files = glob.glob("claims/${{ inputs.dataset }}/*.yaml")
          last = ((yaml.safe_load(open(files[0])) or {}).get("checks") or [{}])[-1] if files else {}
          if not last.get("ready"):
              sys.exit("::error::The claims check says the claims file is not ready")
          PY
  author:
    needs: claims-ready
    uses: ./.github/workflows/attempt.yml
    with: {dataset: "${{ inputs.dataset }}", role: author, model: "${{ inputs.model }}"}
    secrets: inherit
  verifier-1:
    needs: author
    uses: ./.github/workflows/attempt.yml
    with: {dataset: "${{ inputs.dataset }}", role: verifier-1, model: "${{ inputs.model }}"}
    secrets: inherit
  author-revise-1:
    needs: verifier-1
    uses: ./.github/workflows/attempt.yml
    with: {dataset: "${{ inputs.dataset }}", role: author-revise-1, model: "${{ inputs.model }}"}
    secrets: inherit
  verifier-2:
    needs: author-revise-1
    uses: ./.github/workflows/attempt.yml
    with: {dataset: "${{ inputs.dataset }}", role: verifier-2, model: "${{ inputs.model }}"}
    secrets: inherit
  author-revise-2:
    needs: verifier-2
    uses: ./.github/workflows/attempt.yml
    with: {dataset: "${{ inputs.dataset }}", role: author-revise-2, model: "${{ inputs.model }}"}
    secrets: inherit
  proposals:
    # Whether the final revision proposed changes of outcome, which a third round settles.
    needs: author-revise-2
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.look.outputs.found }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: attempt/${{ inputs.dataset }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: look
        env:
          DATASET: ${{ inputs.dataset }}
        run: |
          pip install --no-cache-dir pyyaml
          echo "found=$(python tools/agent_run.py proposals author "$DATASET")" >> "$GITHUB_OUTPUT"
  verifier-3:
    needs: proposals
    if: needs.proposals.outputs.found == 'true'
    uses: ./.github/workflows/attempt.yml
    with: {dataset: "${{ inputs.dataset }}", role: verifier-3, model: "${{ inputs.model }}"}
    secrets: inherit
  author-revise-3:
    needs: verifier-3
    uses: ./.github/workflows/attempt.yml
    with: {dataset: "${{ inputs.dataset }}", role: author-revise-3, model: "${{ inputs.model }}"}
    secrets: inherit
  repeat:
    # Whether the attempt has one before it, which the reconcile step compares it with. After the last round
    # that ran: the third round is skipped when no changes were proposed.
    needs: [author-revise-2, author-revise-3]
    if: always() && needs.author-revise-2.result == 'success' && needs.author-revise-3.result != 'failure' && needs.author-revise-3.result != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.look.outputs.found }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: attempt/${{ inputs.dataset }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: look
        env:
          DATASET: ${{ inputs.dataset }}
        run: |
          pip install --no-cache-dir pyyaml
          echo "found=$(python tools/agent_run.py repeat reconcile "$DATASET")" >> "$GITHUB_OUTPUT"
  reconcile:
    needs: repeat
    if: always() && needs.repeat.outputs.found == 'true'
    uses: ./.github/workflows/attempt.yml
    with: {dataset: "${{ inputs.dataset }}", role: reconcile, model: "${{ inputs.model }}"}
    secrets: inherit
