name: Publish the dashboard

# Rebuilds the public dashboard from the registry's files and publishes it to
# GitHub Pages on every push to main, and again when the entry checks finish,
# so the executed notebooks they produce are included.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Check entries"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install --no-cache-dir pyyaml

      - name: Fetch the executed notebooks
        run: |
          mkdir -p site/notebooks
          if git fetch --depth 1 origin executed 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C site/notebooks
            rm -f site/notebooks/.nojekyll
          else
            echo "No executed branch yet"
          fi

      - name: Build the site
        run: python tools/build_site.py --output site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
