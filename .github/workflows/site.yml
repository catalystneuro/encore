name: Publish the dashboard

# Rebuilds the public dashboard from the registry's files and publishes it to
# the root of the gh-pages branch, which GitHub Pages serves, on every push to
# main, and again when the entry checks finish, so the executed notebooks they
# produce are included. Previews of pull requests live in pr-preview/ on the
# same branch (preview.yml) and are left in place.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Check entries"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Shared with preview.yml: both push to gh-pages.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install --no-cache-dir pyyaml

      - name: Fetch the executed notebooks
        run: |
          mkdir -p site/notebooks
          if git fetch --depth 1 origin executed 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C site/notebooks
            rm -f site/notebooks/.nojekyll
          else
            echo "No executed branch yet"
          fi

      - name: Build the site
        run: |
          python tools/build_site.py --output site
          touch site/.nojekyll

      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
