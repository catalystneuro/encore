name: Publish the dashboard

# Rebuilds the public dashboard from the registry's files and publishes it to the
# R2 bucket encore-site, which a Cloudflare Worker serves as encorescience.org
# (tools/site_worker/), on every push to main, and again when the entry checks
# finish, so the executed notebooks they produce are included, and when a needs-you
# issue opens or closes, so that the pipeline page links the datasets waiting on a
# person. Previews of pull requests live under pr-preview/ in the same bucket
# (preview.yml) and are left in place.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Check entries"]
    types: [completed]
    branches: [main]
  # A needs-you issue opened or closed (tools/notify.py) changes the pipeline page's links; an author response
  # (docs/author-responses.md) labelled, closed or edited changes its paper's page.
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read

# One publish at a time; previews (preview.yml) have their own groups.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'issues' || github.event.label.name == 'needs-you' ||
      contains(github.event.issue.labels.*.name, 'needs-you') ||
      contains(github.event.issue.labels.*.name, 'author-response')
    runs-on: ubuntu-latest
    steps:
      # The whole history, so that the queue can tell the attempt branches merged into main from the open ones.
      - uses: actions/checkout@v4
        with:
          # Every commit, without the contents of files that are not checked out: the queue needs the history
          # of the branches, and the files of every earlier commit made this checkout take over five minutes.
          fetch-depth: 0
          filter: blob:none

      - name: Lay the protocol over the checkout (tools/protocol.sh, at the version protocol.lock names)
        run: bash tools/protocol.sh

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install --no-cache-dir pyyaml

      - name: Fetch the executed notebooks
        run: |
          mkdir -p site/notebooks
          if git fetch --depth 1 origin executed 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C site/notebooks
            rm -f site/notebooks/.nojekyll
          else
            echo "No executed branch yet"
          fi

      - name: List the datasets waiting on a person
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --label needs-you --state open --limit 500 \
            --json title,url > "$RUNNER_TEMP/issues.json" || echo '[]' > "$RUNNER_TEMP/issues.json"
          gh issue list --repo "$GITHUB_REPOSITORY" --label author-response --state all --limit 1000 \
            --json url,body,labels,state,createdAt > "$RUNNER_TEMP/responses.json" || echo '[]' > "$RUNNER_TEMP/responses.json"

      # The runners' queues and how long a chain takes, for the pipeline page's estimates. The numbers of
      # lanes come from the repository variables RUNNER_LANES and CLAIMS_LANES, when they are set.
      - name: Work out the queues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { gh run list --repo "$GITHUB_REPOSITORY" --workflow attempt.yml --limit 1000 \
              --json displayTitle,createdAt,updatedAt,status,conclusion
            gh run list --repo "$GITHUB_REPOSITORY" --workflow papers.yml --limit 1000 \
              --json displayTitle,createdAt,updatedAt,status,conclusion; } \
            | python tools/runner/describe.py queue "${{ vars.RUNNER_LANES || 3 }}" "${{ vars.CLAIMS_LANES || 1 }}" \
            > "$RUNNER_TEMP/queue.json" || rm -f "$RUNNER_TEMP/queue.json"

      - name: Build the site
        run: |
          # Page views are counted only when the repository variable CF_ANALYTICS_TOKEN is set (tools/build_site.py, beacon).
          python tools/build_site.py --output site --issues "$RUNNER_TEMP/issues.json" --queue "$RUNNER_TEMP/queue.json" \
            --responses "$RUNNER_TEMP/responses.json" \
            --analytics "${{ vars.CF_ANALYTICS_TOKEN }}"

      # Only the files that changed are uploaded, and those the build no longer makes are deleted
      # (tools/publish_site.py). The bucket's access key is in the secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY.
      - name: Publish to the site's bucket
        env:
          R2_ACCOUNT_ID: 008449f3dd09bf4fea5f86ee82695b6e
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install --no-cache-dir boto3
          python tools/publish_site.py site
