name: Agent run
run-name: "Agent run: ${{ inputs.paper || inputs.dataset || inputs.dandiset }}${{ inputs.replicate && format('/{0}', inputs.replicate) || '' }} ${{ inputs.role }}${{ inputs.account && inputs.account != 'verified' && format(' ({0})', inputs.account) || '' }}"

# Starts one agent run on a paper: the author's attempt, a verification round, the author's revision
# after one, the reconcile run or the recorder (docs/protocol.md). The run itself is
# encore-protocol's attempt.yml, at the version protocol.lock names; this workflow only takes the inputs, by hand
# from the Actions tab or from the queue runner, as
#   gh workflow run attempt.yml -f paper=guan-2022 -f role=...
# The version here, in attempt-sequence.yml and in protocol.lock must agree (tests/test_protocol_pin.py).
# A reusable workflow's version cannot come from a file, so it is written out in each.

on:
  workflow_dispatch:
    inputs:
      paper:
        description: "The paper's key (tingley-2021; docs/paper-first.md)"
        required: false
      dataset:
        description: "Unused since records are by paper; runners started before then send it"
        required: false
      dandiset:
        description: "The same, under its old name"
        required: false
      role:
        description: "Which run"
        required: true
        type: choice
        options: [author, author-answers, verifier-1, author-revise-1, verifier-2, author-revise-2, verifier-3, author-revise-3, reconcile, recorder]
      model:
        description: "Model"
        default: claude-opus-5-5
      version:
        description: "Dataset version for the author (empty: a published version it chooses)"
        default: ""
      account:
        description: "Account: verified, unverified (a run it flags fails, for the runner to repeat on verified), or api (the API key with prepaid credits, ANTHROPIC_API_KEY_CREDITS)"
        type: choice
        options: [verified, unverified, api]
        default: verified
      replicate:
        description: "For a replicate (docs/replicates.md): its name, r1, r2, ... Empty for an attempt"
        default: ""

permissions:
  contents: write   # the called workflow's commit job pushes to the attempt's branch
  # id-token and attestations: the called workflow's submit job, which signs a run's results, runs only for
  # encore-runner (input `registry`), but GitHub checks every job's permissions against these.
  id-token: write
  attestations: write

jobs:
  attempt:
    uses: encorescience/encore-protocol/.github/workflows/attempt.yml@v0.1.4
    with:
      paper: ${{ inputs.paper }}
      dataset: ${{ inputs.dataset }}
      dandiset: ${{ inputs.dandiset }}
      role: ${{ inputs.role }}
      model: ${{ inputs.model }}
      version: ${{ inputs.version }}
      account: ${{ inputs.account }}
      replicate: ${{ inputs.replicate }}
    secrets: inherit
