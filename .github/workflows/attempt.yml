name: Agent run
run-name: "Agent run: ${{ inputs.paper || inputs.dataset || inputs.dandiset }} ${{ inputs.role }}${{ inputs.account && inputs.account != 'verified' && format(' ({0})', inputs.account) || '' }}"

# One agent run on a target, in a clean environment: the author's attempt, a
# verification round, or the author's revision after one (docs/protocol.md).
# Started by hand from the Actions tab or with
#   gh workflow run attempt.yml -f paper=guan-2022 -f role=author
# or as one step of a whole attempt by attempt-sequence.yml and pipeline.yml.
#
# The agent runs on a fresh runner with no personal configuration, on the
# subscription token in the CLAUDE_CODE_OAUTH_TOKEN secret. Its job can read the
# repository but not write to it, keeps no GitHub credentials in the checkout,
# and strips credentials from the commands the agent runs. A verifier sees only
# its materials: the checkout is deleted before it starts.
#
# The job runs in the `papers` environment (docs/pipeline.md): the author and the
# verifiers get the dataset's papers under paper/, which is never committed and
# which their transcripts leave out. The claims file still decides what is tested.
#
# The second job, which runs no agent, commits what the run produced to the
# branch attempt/<paper>: the author's changes, and the run's transcript and
# final report under transcripts/<paper>/, cleaned by tools/transcript.py.
# The raw transcript is not uploaded. A person reads the transcript and opens
# the pull request.

on:
  workflow_dispatch:
    inputs:
      paper:
        description: "The paper's key (tingley-2021; docs/paper-first.md)"
        required: false
      dataset:
        description: "Unused since records are by paper; runners started before then send it"
        required: false
      dandiset:
        description: "The same, under its old name"
        required: false
      role:
        description: "Which run"
        required: true
        type: choice
        options: [author, author-answers, verifier-1, author-revise-1, verifier-2, author-revise-2, verifier-3, author-revise-3, reconcile, recorder]
      model:
        description: "Model"
        default: claude-opus-5-5
      version:
        description: "Dataset version for the author (empty: a published version it chooses)"
        default: ""
      account:
        description: "Account: verified, unverified (a run it flags fails, for the runner to repeat on verified), or api (the API key with prepaid credits, ANTHROPIC_API_KEY_CREDITS)"
        type: choice
        options: [verified, unverified, api]
        default: verified
  # Called by attempt-sequence.yml, which runs the five roles of one attempt in order.
  workflow_call:
    inputs:
      paper:
        type: string
        default: ""
      dataset:
        type: string
        default: ""
      dandiset:
        type: string
        default: ""
      role:
        type: string
        required: true
      model:
        type: string
        default: claude-opus-5-5
      version:
        type: string
        default: ""
      account:
        type: string
        default: verified
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED:
        required: false
      ANTHROPIC_API_KEY_CREDITS:
        required: false

permissions:
  contents: read

concurrency:
  group: attempt-${{ inputs.paper || inputs.dataset || inputs.dandiset }}
  cancel-in-progress: false

env:
  PAPER: ${{ inputs.paper }}
  ROLE: ${{ inputs.role }}
  MODEL: ${{ inputs.model }}
  ACCOUNT: ${{ inputs.account || 'verified' }}
  VERSION: ${{ inputs.version }}
  CLAUDE_CODE_VERSION: 2.1.284
  # The tools the agent may use without asking. With CLAUDE_CODE_SUBPROCESS_ENV_SCRUB set, Claude
  # Code forces permission mode `default`, so this list and --permission-prompts none decide what
  # runs: anything else is refused.
  TOOLS: Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Agent,TodoWrite
  # Tools that only make sense in a session someone comes back to. In a headless run, ending the
  # turn ends the run, so an agent that schedules a wakeup or watches a background job loses it.
  NOT_TOOLS: ScheduleWakeup,CronCreate,CronDelete,CronList,Monitor,RemoteTrigger,Workflow

jobs:
  run:
    runs-on: ubuntu-latest
    environment: papers
    # GitHub's most for a job. The agent step has 300 of it; a verifier's notebooks run before it (up to
    # 60 minutes each, tools/entry.py), so an entry with long notebooks leaves its verifier less time.
    timeout-minutes: 360
    outputs:
      started: ${{ steps.agent.outputs.started }}
      folder: ${{ steps.start.outputs.folder }}
      flagged: ${{ steps.flag.outputs.flagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Start from the attempt's branch if it exists
        id: start
        run: |
          # The paper's key (docs/paper-first.md) names its files and branch.
          FOLDER=$PAPER
          [[ "$FOLDER" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || { echo "::error::Not a paper key: '$PAPER'"; exit 1; }
          BRANCH="attempt/$FOLDER"
          { echo "FOLDER=$FOLDER"; echo "BRANCH=$BRANCH"; } >> "$GITHUB_ENV"
          echo "folder=$FOLDER" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH" && git checkout -B "$BRANCH" FETCH_HEAD
            # The registry's tools as the workflow has them, not as the branch had them when its attempt began: a
            # branch made before a fix would otherwise run without it. Working files only, so they are never committed.
            git restore --worktree --source "$GITHUB_SHA" -- tools
          elif [ "$ROLE" != author ]; then
            echo "::error::No branch $BRANCH; run the author first"; exit 1
          fi
          git log --oneline -1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code and the registry's tools
        run: |
          # The credential scrub runs the agent's commands in a sandbox built on bubblewrap and
          # socat. Bubblewrap needs unprivileged user namespaces; Ubuntu 24.04 restricts them.
          # The runner's DNS can fail for a few minutes (2026-11-11: six author runs stopped here in an hour, on
          # "Temporary failure resolving archive.ubuntu.com"). Each download is tried again, then the whole install.
          for try in 1 2 3 4; do
            sudo apt-get install -y -q -o Acquire::Retries=3 bubblewrap socat && break
            [ $try = 4 ] && { echo "::error::could not install bubblewrap and socat (the network?)"; exit 1; }
            sleep $((try * 30)); sudo apt-get update -q || true
          done
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-all true && echo "bubblewrap works"
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          pip install --no-cache-dir uv pyyaml jsonschema nbformat

      - name: Write the prompt
        run: |
          python tools/agent_run.py prompt "$ROLE" "$FOLDER" --model "$MODEL" ${VERSION:+--version "$VERSION"} > "$RUNNER_TEMP/prompt.md"
          # The paper's datasets, read now: a verifier's step removes the repository before the papers are fetched.
          echo "DATASETS=$(python tools/paper_records.py datasets "$FOLDER" --available | paste -sd, -)" >> "$GITHUB_ENV"
          echo "PAPER_DOI=$(python tools/paper_records.py doi "$FOLDER")" >> "$GITHUB_ENV"
          # The workflow's own tools, copied before the agent can change the checkout.
          cp tools/transcript.py tools/progress.py tools/flagged.py tools/get_papers.sh tools/blind.sh "$RUNNER_TEMP/"

      - name: Put the dataset's files in place, for an archive that needs credentials
        if: inputs.role != 'recorder'
        env:
          # Each archive adapter with a stage() (tools/archives/) names the secrets it needs; add them here.
          DRYAD_CLIENT_ID: ${{ secrets.DRYAD_CLIENT_ID }}
          DRYAD_CLIENT_SECRET: ${{ secrets.DRYAD_CLIENT_SECRET }}
        run: |
          # Before the agent starts, and before the verifier's notebooks run: the files go to
          # /tmp/<archive>/<id>/<version>/, and the credentials go no further than this step.
          python tools/stage_files.py ${DATASETS//,/ }

      - name: Prepare the verifier's materials, and remove the repository
        if: startsWith(inputs.role, 'verifier')
        run: |
          set -euo pipefail
          entry=$(python tools/agent_run.py entry "$ROLE" "$FOLDER")
          # The author keeps each notebook under 60 minutes (docs/protocol.md); a re-run is allowed 80, so that a
          # slower download from the archive than in the author's run does not stop the attempt (drieu-2018,
          # 2026-11-10: a 45-minute notebook stopped at 60 here).
          python tools/entry.py run "entries/$entry" --max-minutes 80 --timeout 4800
          python tools/entry.py handover "entries/$entry"
          python tools/agent_run.py package "$ROLE" "$FOLDER" "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP" && find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          ls -la "$RUNNER_TEMP/work"

      - name: Put the papers under paper/
        if: inputs.role != 'recorder'
        env:
          PAPERS_DEPLOY_KEY: ${{ secrets.PAPERS_DEPLOY_KEY }}
        run: |
          if [[ "$ROLE" == verifier* ]]; then dest="$RUNNER_TEMP/work/paper"; else dest=paper; fi
          "$RUNNER_TEMP/get_papers.sh" "$DATASETS" "$dest" "$PAPER_DOI"

      - name: Hide the earlier attempts from a repeat attempt's author
        if: startsWith(inputs.role, 'author')
        run: |
          # A repeat attempt is made blind, up to its reconcile step (docs/protocol.md, "Repeat attempts"): its
          # author's runs see no earlier attempt, nor the history. Put back before the changes are collected.
          bash "$RUNNER_TEMP/blind.sh" hide "$FOLDER" "$ROLE" "$RUNNER_TEMP/hidden"

      - name: Check that the unverified account has a token
        if: ${{ inputs.account == 'unverified' }}
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED != '' }}
        run: |
          # The runner reads this message and repeats the run on the verified account.
          [ "$HAS_TOKEN" = true ] || { echo "::error::UNVERIFIED-UNAVAILABLE: no CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED secret"; exit 1; }

      - name: Check that the api account has its key
        if: ${{ inputs.account == 'api' }}
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY_CREDITS != '' }}
        run: |
          [ "$HAS_KEY" = true ] || { echo "::error::API-UNAVAILABLE: no ANTHROPIC_API_KEY_CREDITS secret"; exit 1; }

      - name: Check the token, the permission mode and the agent's shell
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.account != 'api' && (inputs.account == 'unverified' && secrets.CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED || secrets.CLAUDE_CODE_OAUTH_TOKEN) || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.account == 'api' && secrets.ANTHROPIC_API_KEY_CREDITS || '' }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
          DISABLE_AUTOUPDATER: '1'
          DISABLE_TELEMETRY: '1'
        run: |
          set +e -uo pipefail
          cd "$RUNNER_TEMP"
          # The agent runs one shell command that counts how many of the two credential variables its commands can
          # see, by name, without reading a value (0 when the scrub removed them), and prints a marker that shows
          # the sandboxed shell started. On 2026-11-06 the model often declined the earlier command, which read the
          # values, so the prompt says what the check is for, the command reads names only, and it is tried 3 times.
          for try in 1 2 3; do
            claude -p 'Before your task, this is the workflow'"'"'s own self-test that the credentials of this job are hidden from your shell. Use the Bash tool to run exactly this command, which prints only how many of two variable names are set in your shell, never a value: printf "%s:" "$(env | cut -d= -f1 | grep -c -x -e CLAUDE_CODE_OAUTH_TOKEN -e ANTHROPIC_API_KEY)"; echo shell-ok. Then reply with only the line it printed.' \
              --model "$MODEL" --max-turns 3 \
              --output-format stream-json --verbose --permission-prompts none --allowedTools "$TOOLS" \
              > preflight.jsonl 2> preflight.err
            mode=$(jq -r 'select(.type=="system" and .subtype=="init") | .permissionMode' preflight.jsonl)
            result=$(jq -r 'select(.type=="result") | .result' preflight.jsonl)
            echo "try $try: permission mode: $mode; reply: $result"
            case "$result" in
              *"Failed to authenticate"*|*"Invalid API key"*) echo "::error::The $ACCOUNT account's secret did not authenticate: $result"; exit 1;;
            esac
            [[ "$result" =~ [0-9]+:shell-ok ]] && break
          done
          tail -c 1000 preflight.err
          [[ "$result" =~ [0-9]+:shell-ok ]] || { echo "::error::The agent did not run the self-test in 3 tries; its reply: $result"; exit 1; }
          [[ "$result" =~ (^|[^0-9])0:shell-ok ]] || { echo "::error::The token is visible to the agent's commands"; exit 1; }
          [ "$mode" = default ] || { echo "::error::Claude Code started in permission mode $mode, not default"; exit 1; }

      - name: Run the agent
        id: agent
        # Shorter than the job's limit, so that the transcript is still exported when it is reached.
        timeout-minutes: 300
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.account != 'api' && (inputs.account == 'unverified' && secrets.CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED || secrets.CLAUDE_CODE_OAUTH_TOKEN) || '' }}
          ANTHROPIC_API_KEY: ${{ inputs.account == 'api' && secrets.ANTHROPIC_API_KEY_CREDITS || '' }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: '1'
          DISABLE_AUTOUPDATER: '1'
          DISABLE_TELEMETRY: '1'
          # Commands run in the foreground until they finish: a notebook run can take many minutes.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
          BASH_DEFAULT_TIMEOUT_MS: '3600000'
          BASH_MAX_TIMEOUT_MS: '7200000'
        run: |
          set +e -uo pipefail     # keep going when claude fails, to report how
          echo "started=true" >> "$GITHUB_OUTPUT"
          if [[ "$ROLE" == verifier* ]]; then cd "$RUNNER_TEMP/work"; fi
          # The registry's published record of earlier attempts, kept from a blind author (tools/blind.sh).
          not_tools=$NOT_TOOLS
          [[ "$ROLE" != author* ]] || not_tools+=",WebFetch(domain:encorescience.org),WebFetch(domain:catalystneuro.github.io)"
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --model "$MODEL" \
            --output-format stream-json --verbose --forward-subagent-text \
            --permission-prompts none --allowedTools "$TOOLS" --disallowedTools "$not_tools" \
            2> "$RUNNER_TEMP/stderr.txt" | tee "$RUNNER_TEMP/run.jsonl" | python "$RUNNER_TEMP/progress.py"
          status=$?
          echo "claude exited with $status"
          tail -c 2000 "$RUNNER_TEMP/stderr.txt" || true
          # What the run cost at API prices, which the pacer adds up for an account with a budget (pools.yaml).
          cost=$(jq -r 'select(.type=="result") | .total_cost_usd // empty' "$RUNNER_TEMP/run.jsonl" 2>/dev/null | tail -n 1)
          echo "ENCORE_COST_USD=${cost:-unknown} account=$ACCOUNT"
          exit $status

      - name: Check whether the account flagged the run
        id: flag
        if: always() && steps.agent.outputs.started == 'true' && env.ACCOUNT != 'verified'
        run: |
          # On an account other than the verified one, a run its safety checks flagged (a refusal, or a switch
          # to another model) is not kept: the job fails with FLAGGED, and the runner repeats it on the verified
          # account, or leaves the dataset when it has no fallback.
          if reason=$(python "$RUNNER_TEMP/flagged.py" "$RUNNER_TEMP/run.jsonl" "$RUNNER_TEMP/stderr.txt" --model "$MODEL"); then
            echo "not flagged"
          else
            echo "flagged=true" >> "$GITHUB_OUTPUT"
            echo "::error::FLAGGED on the $ACCOUNT account: $reason"
            echo "Flagged on the $ACCOUNT account: $reason. Not committed; repeat on the verified account." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Export the transcript and collect the changes
        if: always() && steps.agent.outputs.started == 'true' && steps.flag.outputs.flagged != 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"; mkdir -p "$out/transcripts/$FOLDER"
          tool="$RUNNER_TEMP/transcript.py"
          name="$FOLDER · $ROLE · run ${{ github.run_id }}"
          # The earlier attempts a blind author did not see go back first, so that only its own changes are collected.
          if [[ "$ROLE" == author* ]]; then bash "$RUNNER_TEMP/blind.sh" restore "$FOLDER" "$ROLE" "$RUNNER_TEMP/hidden"; fi
          # The author's changes first, so that nothing in the transcript can lose them.
          if [[ "$ROLE" == author* || "$ROLE" == reconcile ]]; then
            # Only the registry's own files: the sandbox leaves placeholder files for the paths it
            # protects (.bashrc, .gitconfig, ...) in the working directory.
            paths=(attempts claims entries README.md); [ ! -d questions ] || paths+=(questions)
            git add -A -- "${paths[@]}" && git diff --cached --binary > "$out/changes.patch"
            git diff --cached --stat
          elif [ "$ROLE" = recorder ]; then
            git add -A -- docs/pilot-notes summaries && git diff --cached --binary > "$out/changes.patch"
            git diff --cached --stat
          fi
          python "$tool" "$RUNNER_TEMP/run.jsonl" "$out/transcripts/$FOLDER/$ROLE.md" --omit paper/ \
            --report "$out/transcripts/$FOLDER/$ROLE-report.md" --title "$name"
          rm -f "$RUNNER_TEMP/run.jsonl"
          cat "$out/transcripts/$FOLDER/$ROLE-report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Named for the dataset and role: in a pipeline, several datasets run inside one
          # workflow run, and an artifact name shared between them made a commit job pick up
          # another dataset's results.
          name: agent-run-${{ env.FOLDER }}-${{ inputs.role }}
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: ignore

  commit:
    needs: run
    # Whenever the agent was started, also when the run was cancelled or failed, so that its
    # transcript and partial work are kept; the commit message says how the run ended.
    if: always() && needs.run.outputs.started == 'true' && needs.run.outputs.flagged != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FOLDER: ${{ needs.run.outputs.folder }}
      BRANCH: attempt/${{ needs.run.outputs.folder }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          # Named for the dataset and role: in a pipeline, several datasets run inside one
          # workflow run, and an artifact name shared between them made a commit job pick up
          # another dataset's results.
          name: agent-run-${{ needs.run.outputs.folder }}-${{ inputs.role }}
          path: out

      - name: Commit to the attempt's branch
        run: |
          set -euo pipefail
          # Take the archiving script from the workflow's own ref: a branch made before it existed lacks it.
          cp tools/archive_transcripts.sh "$RUNNER_TEMP/"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH" && git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -b "$BRANCH"
          fi
          # Refuse anything that is not this dataset's: a guard against results being mixed up.
          others=$(ls out/transcripts | grep -vx "$FOLDER" || true)
          [ -z "$others" ] || { echo "::error::Transcripts for other datasets: $others"; exit 1; }
          # An attempt's first run moves the earlier attempt's transcripts aside before this one's land.
          # That is the claims run (papers.yml) when there was one: then its transcripts stay.
          if [ "$ROLE" = author ] && [ ! -e "transcripts/$FOLDER/claims.md" ]; then
            "$RUNNER_TEMP/archive_transcripts.sh" "$FOLDER"
          fi
          if [ -s out/changes.patch ]; then
            allowed="^(attempts/$FOLDER-[0-9]{2}\.yaml$|claims/$FOLDER\.yaml$|entries/$FOLDER/|questions/$FOLDER\.yaml$|README\.md$)"
            [ "$ROLE" != recorder ] || allowed="^(docs/pilot-notes|summaries)/$FOLDER-[0-9]{2}\.md$"
            stray=$(git apply --numstat out/changes.patch | cut -f3 | grep -vE "$allowed" || true)
            [ -z "$stray" ] || { echo "::error::Changes outside paper $FOLDER: $stray"; exit 1; }
            git apply --index out/changes.patch
          fi
          # A transcript with nothing but its title means the agent never started; keep it out.
          for f in out/transcripts/*/*.md; do [ "$(wc -l < "$f")" -gt 2 ] || rm "$f"; done
          cp -r out/transcripts . && git add transcripts
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -m "Agent run on $FOLDER: $ROLE (${{ needs.run.result }})" \
            -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -m "Account: $ACCOUNT"
          git push origin "$BRANCH"
