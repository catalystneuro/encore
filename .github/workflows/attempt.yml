name: Agent run
run-name: "Agent run: ${{ inputs.dandiset }} ${{ inputs.role }}${{ inputs.account == 'unverified' && ' (unverified)' || '' }}"

# One agent run on a target, in a clean environment: the author's attempt, a
# verification round, or the author's revision after one (docs/protocol.md).
# Started by hand from the Actions tab or with
#   gh workflow run attempt.yml -f dandiset=000147 -f role=author
# or as one step of a whole attempt by attempt-sequence.yml and pipeline.yml.
#
# The agent runs on a fresh runner with no personal configuration, on the
# subscription token in the CLAUDE_CODE_OAUTH_TOKEN secret. Its job can read the
# repository but not write to it, keeps no GitHub credentials in the checkout,
# and strips credentials from the commands the agent runs. A verifier sees only
# its materials: the checkout is deleted before it starts.
#
# The job runs in the `papers` environment (docs/pipeline.md): the author and the
# verifiers get the dandiset's papers under paper/, which is never committed and
# which their transcripts leave out. The claims file still decides what is tested.
#
# The second job, which runs no agent, commits what the run produced to the
# branch attempt/<dandiset>: the author's changes, and the run's transcript and
# final report under transcripts/<dandiset>/, cleaned by tools/transcript.py.
# The raw transcript is not uploaded. A person reads the transcript and opens
# the pull request.

on:
  workflow_dispatch:
    inputs:
      dandiset:
        description: "Dandiset id, e.g. 000147"
        required: true
      role:
        description: "Which run"
        required: true
        type: choice
        options: [author, author-answers, verifier-1, author-revise-1, verifier-2, author-revise-2, verifier-3, author-revise-3, recorder]
      model:
        description: "Model"
        default: claude-opus-5-5
      version:
        description: "Dandiset version for the author (empty: a published version it chooses)"
        default: ""
      account:
        description: "Account: verified, or unverified (a run it flags fails, for the runner to repeat on verified)"
        type: choice
        options: [verified, unverified]
        default: verified
  # Called by attempt-sequence.yml, which runs the five roles of one attempt in order.
  workflow_call:
    inputs:
      dandiset:
        type: string
        required: true
      role:
        type: string
        required: true
      model:
        type: string
        default: claude-opus-5-5
      version:
        type: string
        default: ""
      account:
        type: string
        default: verified
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED:
        required: false

permissions:
  contents: read

concurrency:
  group: attempt-${{ inputs.dandiset }}
  cancel-in-progress: false

env:
  DANDISET: ${{ inputs.dandiset }}
  ROLE: ${{ inputs.role }}
  MODEL: ${{ inputs.model }}
  ACCOUNT: ${{ inputs.account || 'verified' }}
  VERSION: ${{ inputs.version }}
  BRANCH: attempt/${{ inputs.dandiset }}
  CLAUDE_CODE_VERSION: 2.1.284
  # The tools the agent may use without asking. With CLAUDE_CODE_SUBPROCESS_ENV_SCRUB set, Claude
  # Code forces permission mode `default`, so this list and --permission-prompts none decide what
  # runs: anything else is refused.
  TOOLS: Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Agent,TodoWrite
  # Tools that only make sense in a session someone comes back to. In a headless run, ending the
  # turn ends the run, so an agent that schedules a wakeup or watches a background job loses it.
  NOT_TOOLS: ScheduleWakeup,CronCreate,CronDelete,CronList,Monitor,RemoteTrigger,Workflow

jobs:
  run:
    runs-on: ubuntu-latest
    environment: papers
    timeout-minutes: 340
    outputs:
      started: ${{ steps.agent.outputs.started }}
      flagged: ${{ steps.flag.outputs.flagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Start from the attempt's branch if it exists
        run: |
          [[ "$DANDISET" =~ ^[0-9]{6}$ ]] || { echo "::error::Not a dandiset id: $DANDISET"; exit 1; }
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH" && git checkout -B "$BRANCH" FETCH_HEAD
          elif [ "$ROLE" != author ]; then
            echo "::error::No branch $BRANCH; run the author first"; exit 1
          fi
          git log --oneline -1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code and the registry's tools
        run: |
          # The credential scrub runs the agent's commands in a sandbox built on bubblewrap and
          # socat. Bubblewrap needs unprivileged user namespaces; Ubuntu 24.04 restricts them.
          sudo apt-get install -y -q bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-all true && echo "bubblewrap works"
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          pip install --no-cache-dir uv pyyaml jsonschema nbformat

      - name: Write the prompt
        run: |
          python tools/agent_run.py prompt "$ROLE" "$DANDISET" --model "$MODEL" ${VERSION:+--version "$VERSION"} > "$RUNNER_TEMP/prompt.md"
          # The workflow's own tools, copied before the agent can change the checkout.
          cp tools/transcript.py tools/progress.py tools/flagged.py tools/get_papers.sh "$RUNNER_TEMP/"

      - name: Prepare the verifier's materials, and remove the repository
        if: startsWith(inputs.role, 'verifier')
        run: |
          set -euo pipefail
          entry=$(python tools/agent_run.py entry "$ROLE" "$DANDISET")
          python tools/entry.py run "entries/$entry"
          python tools/entry.py handover "entries/$entry"
          python tools/agent_run.py package "$ROLE" "$DANDISET" "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP" && find "$GITHUB_WORKSPACE" -mindepth 1 -delete
          ls -la "$RUNNER_TEMP/work"

      - name: Put the papers under paper/
        if: inputs.role != 'recorder'
        env:
          PAPERS_DEPLOY_KEY: ${{ secrets.PAPERS_DEPLOY_KEY }}
        run: |
          if [[ "$ROLE" == verifier* ]]; then dest="$RUNNER_TEMP/work/paper"; else dest=paper; fi
          "$RUNNER_TEMP/get_papers.sh" "$DANDISET" "$dest"

      - name: Check that the unverified account has a token
        if: ${{ inputs.account == 'unverified' }}
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED != '' }}
        run: |
          # The runner reads this message and repeats the run on the verified account.
          [ "$HAS_TOKEN" = true ] || { echo "::error::UNVERIFIED-UNAVAILABLE: no CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED secret"; exit 1; }

      - name: Check the token, the permission mode and the agent's shell
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.account == 'unverified' && secrets.CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
          DISABLE_AUTOUPDATER: '1'
          DISABLE_TELEMETRY: '1'
        run: |
          set +e -uo pipefail
          cd "$RUNNER_TEMP"
          # The agent runs one shell command: the length of the token as its commands see it (0 when
          # the scrub removed it), and a marker that shows the sandboxed shell started.
          claude -p 'Use the Bash tool to run exactly this command: printf "%s:" "$(printenv CLAUDE_CODE_OAUTH_TOKEN | wc -c)"; echo shell-ok. Then reply with only the line it printed.' \
            --model "$MODEL" --max-turns 3 \
            --output-format stream-json --verbose --permission-prompts none --allowedTools "$TOOLS" \
            > preflight.jsonl 2> preflight.err
          mode=$(jq -r 'select(.type=="system" and .subtype=="init") | .permissionMode' preflight.jsonl)
          result=$(jq -r 'select(.type=="result") | .result' preflight.jsonl)
          echo "permission mode: $mode; reply: $result"
          tail -c 1000 preflight.err
          case "$result" in
            *"Failed to authenticate"*) echo "::error::The CLAUDE_CODE_OAUTH_TOKEN secret did not authenticate: $result"; exit 1;;
          esac
          [[ "$result" == *shell-ok* ]] || { echo "::error::The agent's shell did not run: $result"; exit 1; }
          [[ "$result" =~ (^|[^0-9])0:shell-ok ]] || { echo "::error::The token is visible to the agent's commands"; exit 1; }
          [ "$mode" = default ] || { echo "::error::Claude Code started in permission mode $mode, not default"; exit 1; }

      - name: Run the agent
        id: agent
        # Shorter than the job's limit, so that the transcript is still exported when it is reached.
        timeout-minutes: 300
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.account == 'unverified' && secrets.CLAUDE_CODE_OAUTH_TOKEN_UNVERIFIED || secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: '1'
          DISABLE_AUTOUPDATER: '1'
          DISABLE_TELEMETRY: '1'
          # Commands run in the foreground until they finish: a notebook run can take many minutes.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
          BASH_DEFAULT_TIMEOUT_MS: '3600000'
          BASH_MAX_TIMEOUT_MS: '7200000'
        run: |
          set +e -uo pipefail     # keep going when claude fails, to report how
          echo "started=true" >> "$GITHUB_OUTPUT"
          if [[ "$ROLE" == verifier* ]]; then cd "$RUNNER_TEMP/work"; fi
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --model "$MODEL" \
            --output-format stream-json --verbose --forward-subagent-text \
            --permission-prompts none --allowedTools "$TOOLS" --disallowedTools "$NOT_TOOLS" \
            2> "$RUNNER_TEMP/stderr.txt" | tee "$RUNNER_TEMP/run.jsonl" | python "$RUNNER_TEMP/progress.py"
          status=$?
          echo "claude exited with $status"
          tail -c 2000 "$RUNNER_TEMP/stderr.txt" || true
          exit $status

      - name: Check whether the account flagged the run
        id: flag
        if: always() && steps.agent.outputs.started == 'true' && inputs.account == 'unverified'
        run: |
          # On the unverified account, a run its safety checks flagged (a refusal, or a switch to another
          # model) is not kept: the job fails with FLAGGED, and the runner repeats it on the verified account.
          if reason=$(python "$RUNNER_TEMP/flagged.py" "$RUNNER_TEMP/run.jsonl" "$RUNNER_TEMP/stderr.txt" --model "$MODEL"); then
            echo "not flagged"
          else
            echo "flagged=true" >> "$GITHUB_OUTPUT"
            echo "::error::FLAGGED on the unverified account: $reason"
            echo "Flagged on the unverified account: $reason. Not committed; repeat on the verified account." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Export the transcript and collect the changes
        if: always() && steps.agent.outputs.started == 'true' && steps.flag.outputs.flagged != 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"; mkdir -p "$out/transcripts/$DANDISET"
          tool="$RUNNER_TEMP/transcript.py"
          name="$DANDISET · $ROLE · run ${{ github.run_id }}"
          # The author's changes first, so that nothing in the transcript can lose them.
          if [[ "$ROLE" == author* ]]; then
            # Only the registry's own files: the sandbox leaves placeholder files for the paths it
            # protects (.bashrc, .gitconfig, ...) in the working directory.
            paths=(attempts claims entries README.md); [ ! -d questions ] || paths+=(questions)
            git add -A -- "${paths[@]}" && git diff --cached --binary > "$out/changes.patch"
            git diff --cached --stat
          elif [ "$ROLE" = recorder ]; then
            git add -A -- README.md docs/pilot-notes.md && git diff --cached --binary > "$out/changes.patch"
            git diff --cached --stat
          fi
          python "$tool" "$RUNNER_TEMP/run.jsonl" "$out/transcripts/$DANDISET/$ROLE.md" --omit paper/ \
            --report "$out/transcripts/$DANDISET/$ROLE-report.md" --title "$name"
          rm -f "$RUNNER_TEMP/run.jsonl"
          cat "$out/transcripts/$DANDISET/$ROLE-report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Named for the dandiset and role: in a pipeline, several dandisets run inside one
          # workflow run, and an artifact name shared between them made a commit job pick up
          # another dandiset's results.
          name: agent-run-${{ inputs.dandiset }}-${{ inputs.role }}
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: ignore

  commit:
    needs: run
    # Whenever the agent was started, also when the run was cancelled or failed, so that its
    # transcript and partial work are kept; the commit message says how the run ended.
    if: always() && needs.run.outputs.started == 'true' && needs.run.outputs.flagged != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          # Named for the dandiset and role: in a pipeline, several dandisets run inside one
          # workflow run, and an artifact name shared between them made a commit job pick up
          # another dandiset's results.
          name: agent-run-${{ inputs.dandiset }}-${{ inputs.role }}
          path: out

      - name: Commit to the attempt's branch
        run: |
          set -euo pipefail
          # Take the archiving script from the workflow's own ref: a branch made before it existed lacks it.
          cp tools/archive_transcripts.sh "$RUNNER_TEMP/"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH" && git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -b "$BRANCH"
          fi
          # Refuse anything that is not this dandiset's: a guard against results being mixed up.
          others=$(ls out/transcripts | grep -vx "$DANDISET" || true)
          [ -z "$others" ] || { echo "::error::Transcripts for other dandisets: $others"; exit 1; }
          # An attempt's first run moves the earlier attempt's transcripts aside before this one's land.
          # That is the claims run (papers.yml) when there was one: then its transcripts stay.
          if [ "$ROLE" = author ] && [ ! -e "transcripts/$DANDISET/claims.md" ]; then
            "$RUNNER_TEMP/archive_transcripts.sh" "$DANDISET"
          fi
          if [ -s out/changes.patch ]; then
            allowed="^((attempts|claims|entries|questions)/.*$DANDISET|README\.md$)"
            [ "$ROLE" != recorder ] || allowed="^(README\.md|docs/pilot-notes\.md)$"
            stray=$(git apply --numstat out/changes.patch | cut -f3 | grep -vE "$allowed" || true)
            [ -z "$stray" ] || { echo "::error::Changes outside dandiset $DANDISET: $stray"; exit 1; }
            git apply --index out/changes.patch
          fi
          # A transcript with nothing but its title means the agent never started; keep it out.
          for f in out/transcripts/*/*.md; do [ "$(wc -l < "$f")" -gt 2 ] || rm "$f"; done
          cp -r out/transcripts . && git add transcripts
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -m "Agent run on $DANDISET: $ROLE (${{ needs.run.result }})" \
            -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -m "Account: $ACCOUNT"
          git push origin "$BRANCH"
