name: Check entries

# Every push and pull request: the tooling's unit tests, and the metadata and
# convention checks for every entry. Entries whose files changed are also
# executed from a clean environment built from their lock file.
#
# On main, the executed notebooks are rendered to HTML and kept on the
# `executed` branch, one folder per entry, for the dashboard to publish.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      entry:
        description: "Run this entry (its directory name), or `all`; empty to run none"
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.changed.outputs.entries }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install --no-cache-dir uv pyyaml jsonschema nbformat pytest

      - name: Unit tests
        run: python -m pytest -q tests

      - name: Check every entry
        # One process for all entries, so the claims files and attempt records they share are read once.
        run: python tools/entry.py check entries/*/

      - name: List the entries to run
        id: changed
        run: |
          if [ '${{ github.event_name }}' = 'workflow_dispatch' ]; then
            names='${{ inputs.entry }}'
            if [ "$names" = 'all' ]; then names=$(ls entries); fi
          else
            if [ '${{ github.event_name }}' = 'pull_request' ]; then
              base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
            else
              base='${{ github.event.before }}'
              git cat-file -e "$base^{commit}" 2>/dev/null || base='HEAD~1'
            fi
            names=$(git diff --name-only "$base" HEAD -- entries | cut -d/ -f2 | sort -u)
          fi
          entries=$(for n in $names; do [ -f "entries/$n/entry.yaml" ] && echo "$n"; done \
            | python -c "import json,sys; print(json.dumps(sys.stdin.read().split()))")
          echo "entries=$entries" >> "$GITHUB_OUTPUT"
          echo "Entries to run: $entries"

  run:
    needs: check
    if: needs.check.outputs.entries != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.check.outputs.entries) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install --no-cache-dir uv pyyaml jsonschema nbformat

      - name: Put the files of archives that need credentials in place
        env:
          # As in attempt.yml: the secrets of each archive adapter with a stage() (tools/archives/).
          DRYAD_CLIENT_ID: ${{ secrets.DRYAD_CLIENT_ID }}
          DRYAD_CLIENT_SECRET: ${{ secrets.DRYAD_CLIENT_SECRET }}
        run: python tools/stage_files.py --all

      - name: Execute the entry's notebooks
        run: python tools/entry.py run "entries/${{ matrix.entry }}" --output-dir "$RUNNER_TEMP/executed"

      - name: Keep the executed notebooks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executed-${{ matrix.entry }}
          path: |
            ${{ runner.temp }}/executed/*.ipynb
            ${{ runner.temp }}/executed/result.json

  publish:
    # Keep the executed notebooks of this run, rendered to HTML, on the
    # `executed` branch. Only for main: a pull request's code is not trusted
    # with write access.
    needs: [check, run]
    if: always() && needs.check.outputs.entries != '[]' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: executed-branch
      cancel-in-progress: false
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install --no-cache-dir nbconvert

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: executed-*

      - name: Render to HTML
        run: |
          set -euo pipefail
          mkdir -p out
          for dir in artifacts/executed-*/; do
            entry=$(basename "$dir"); entry=${entry#executed-}
            mkdir -p "out/$entry"
            cp "$dir/result.json" "out/$entry/" 2>/dev/null || true
            for nb in "$dir"*.ipynb; do
              [ -f "$nb" ] || continue
              jupyter nbconvert --to html --output-dir "out/$entry" "$nb"
            done
          done
          find out -type f | sort

      - name: Push to the executed branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: executed
          publish_dir: ./out
          keep_files: true
          commit_message: "Executed notebooks from ${{ github.sha }}"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
