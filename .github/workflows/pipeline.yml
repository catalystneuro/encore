name: Attempt pipeline

# Whole attempts on several papers at once:
#   gh workflow run pipeline.yml -f datasets="tingley-2021 000939 DANDI:001075" -f max_parallel=3
# Each is a paper key, or a dataset listed for a paper in papers/datasets/ (docs/paper-first.md). Each paper goes
# through attempt-sequence.yml (author, two verification
# rounds, two revisions), and at most max_parallel papers run at the same
# time. A dataset that fails stops on its own; the others go on. Every agent
# run uses the same subscription token, so its usage limits are shared: the
# more in parallel, the sooner they are reached. When a dataset's sequence is
# done, its branch attempt/<folder> is ready for a person to read and open
# as a pull request.

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "Papers (tingley-2021), or datasets listed for one (000147, DANDI:000147), separated by spaces or commas"
        required: true
      max_parallel:
        description: "How many datasets to run at the same time"
        default: "3"
      model:
        description: "Model"
        default: claude-opus-5-5

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.list.outputs.folders }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: list
        env:
          DATASETS: ${{ inputs.datasets }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
        run: |
          pip install -q pyyaml
          python3 - <<'PY'
          import json, os, re, sys
          sys.path.insert(0, "tools")
          import paper_records
          given = [d for d in re.split(r"[\s,]+", os.environ["DATASETS"]) if d]
          folders, bad = [], []
          for d in given:
              try:
                  folders.append(paper_records.resolve(d))
              except (ValueError, SystemExit):
                  bad.append(d)
          if bad or not folders:
              sys.exit(f"::error::Not papers: {bad or 'none given'}")
          if not re.fullmatch(r"[1-9][0-9]?", os.environ["MAX_PARALLEL"]):
              sys.exit("::error::max_parallel must be a number from 1 to 99")
          folders = list(dict.fromkeys(folders))
          print("Papers:", ", ".join(folders))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"folders={json.dumps(folders)}\n")
          PY

  attempt:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        paper: ${{ fromJSON(needs.plan.outputs.folders) }}
    uses: ./.github/workflows/attempt-sequence.yml
    with:
      paper: ${{ matrix.paper }}
      model: ${{ inputs.model }}
    secrets: inherit
