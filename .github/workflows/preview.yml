name: Preview the dashboard
run-name: "${{ github.event.action == 'closed' && 'Remove the preview' || 'Preview' }} of PR #${{ github.event.pull_request.number }}"

# Builds the dashboard from a pull request's branch and publishes it under
# pr-preview/pr-<number>/ in the R2 bucket encore-site, which encorescience.org
# is served from (tools/publish_site.py), then comments the link on the pull
# request. The preview is removed when the pull request is closed or merged, and
# closing it cancels any build of it still running or waiting. Pull requests
# from forks have no access to the bucket's key and get no preview.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write
  actions: read

# One run per pull request: a newer push, or closing the pull request, cancels the
# run before it. Not shared with site.yml: in a shared group a queued preview
# would replace a queued publish. A preview writes only under its own folder of
# the bucket, so previews and the site's publish do not collide.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lay the protocol over the checkout (tools/protocol.sh, at the version protocol.lock names)
        run: bash tools/protocol.sh

      - uses: actions/setup-python@v5
        if: github.event.action != 'closed'
        with:
          python-version: '3.13'

      # The runners' queues, as in site.yml, for the pipeline page's Queue and Done in columns.
      - name: Work out the queues
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --no-cache-dir pyyaml
          { gh run list --repo "$GITHUB_REPOSITORY" --workflow attempt.yml --limit 1000 \
              --json displayTitle,createdAt,updatedAt,status,conclusion
            gh run list --repo "$GITHUB_REPOSITORY" --workflow papers.yml --limit 1000 \
              --json displayTitle,createdAt,updatedAt,status,conclusion; } \
            | python tools/runner/describe.py queue "${{ vars.RUNNER_LANES || 3 }}" "${{ vars.CLAIMS_LANES || 1 }}" \
            > "$RUNNER_TEMP/queue.json" || rm -f "$RUNNER_TEMP/queue.json"

      - name: Build the site
        if: github.event.action != 'closed'
        run: |
          mkdir -p site/notebooks
          if git fetch --depth 1 origin executed 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C site/notebooks
            rm -f site/notebooks/.nojekyll
          fi
          python tools/build_site.py --output site --noindex --queue "$RUNNER_TEMP/queue.json" \
            --notebooks-from https://encorescience.org/
          # The executed notebooks (some 400 MB) are only read to know which exist: the preview links
          # to the published ones. Copied into every preview they took gh-pages past the 1 GB
          # GitHub Pages allows, and its builds failed.
          rm -rf site/notebooks

      - name: Publish the preview to the site's bucket
        if: github.event.action != 'closed'
        env:
          R2_ACCOUNT_ID: 008449f3dd09bf4fea5f86ee82695b6e
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          pip install --no-cache-dir boto3
          python tools/publish_site.py site --prefix "pr-preview/pr-$PR/"

      # An empty folder published under the preview's prefix deletes everything there.
      - name: Remove the preview from the site's bucket
        if: github.event.action == 'closed'
        env:
          R2_ACCOUNT_ID: 008449f3dd09bf4fea5f86ee82695b6e
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 -m pip install --no-cache-dir --quiet boto3
          mkdir -p "$RUNNER_TEMP/empty"
          python3 tools/publish_site.py "$RUNNER_TEMP/empty" --prefix "pr-preview/pr-$PR/"

      # One comment for the pull request, kept up to date: the last one this workflow made is edited.
      - name: Say where the preview is
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ "$ACTION" = closed ]; then
            body="The preview of this pull request was removed when it was closed."
          else
            body="Preview: https://encorescience.org/pr-preview/pr-$PR/ (built from $(git rev-parse --short HEAD), $(date -u +'%Y-%m-%d %H:%M UTC'))"
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" 2>/dev/null \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
