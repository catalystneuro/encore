name: Paper run
run-name: "Paper run: ${{ inputs.dandiset }} ${{ inputs.role }}"

# One reader run on a target (docs/protocol.md, "Reader"): writing the claims file from the
# paper (`claims`), checking it against the paper (`claims-check`), or answering an attempt's
# questions (`answer`). Started by hand from the Actions tab or with
#   gh workflow run papers.yml -f dandiset=000147 -f role=claims
#
# These are the only runs that read the papers. The job runs in the `papers` environment, whose
# deploy key reads the private paper store (catalystneuro/registry-papers); the environment can
# be used only from main. Before the agent starts, the dandiset's papers are copied to paper/
# and the key and the store's checkout are deleted. A run commits only claims/<dandiset>/, and
# its transcript leaves out everything under paper/ (tools/transcript.py). The attempt's other
# runs (attempt.yml) have no access to the papers.
#
# Otherwise the same as attempt.yml: a fresh runner, the subscription token, credentials
# stripped from the agent's commands, and a second job that commits to attempt/<dandiset>.

on:
  workflow_dispatch:
    inputs:
      dandiset:
        description: "Dandiset id, e.g. 000147"
        required: true
      role:
        description: "Which run"
        required: true
        type: choice
        options: [claims, claims-check, answer]
      papers_only:
        description: "Only check that the papers reach the job; run no agent"
        type: boolean
        default: false
      model:
        description: "Model"
        default: claude-opus-5-5
  # Called by attempt-sequence.yml, before the author.
  workflow_call:
    inputs:
      dandiset:
        type: string
        required: true
      role:
        type: string
        required: true
      model:
        type: string
        default: claude-opus-5-5
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: attempt-${{ inputs.dandiset }}
  cancel-in-progress: false

env:
  DANDISET: ${{ inputs.dandiset }}
  ROLE: ${{ inputs.role }}
  MODEL: ${{ inputs.model }}
  BRANCH: attempt/${{ inputs.dandiset }}
  CLAUDE_CODE_VERSION: 2.1.284
  # The tools the agent may use without asking. With CLAUDE_CODE_SUBPROCESS_ENV_SCRUB set, Claude
  # Code forces permission mode `default`, so this list and --permission-prompts none decide what
  # runs: anything else is refused.
  TOOLS: Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch,Agent,TodoWrite
  # Tools that only make sense in a session someone comes back to. In a headless run, ending the
  # turn ends the run, so an agent that schedules a wakeup or watches a background job loses it.
  NOT_TOOLS: ScheduleWakeup,CronCreate,CronDelete,CronList,Monitor,RemoteTrigger,Workflow

jobs:
  run:
    runs-on: ubuntu-latest
    environment: papers
    timeout-minutes: 180
    outputs:
      started: ${{ steps.agent.outputs.started }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Start from the attempt's branch if it exists
        run: |
          [[ "$DANDISET" =~ ^[0-9]{6}$ ]] || { echo "::error::Not a dandiset id: $DANDISET"; exit 1; }
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH" && git checkout -B "$BRANCH" FETCH_HEAD
          elif [ "$ROLE" != claims ]; then
            echo "::error::No branch $BRANCH; run claims first"; exit 1
          fi
          git log --oneline -1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code and the registry's tools
        run: |
          # The credential scrub runs the agent's commands in a sandbox built on bubblewrap and
          # socat. Bubblewrap needs unprivileged user namespaces; Ubuntu 24.04 restricts them.
          sudo apt-get install -y -q bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-all true && echo "bubblewrap works"
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          pip install --no-cache-dir uv pyyaml jsonschema nbformat

      - name: Write the prompt
        run: |
          python tools/agent_run.py prompt "$ROLE" "$DANDISET" --model "$MODEL" > "$RUNNER_TEMP/prompt.md"
          # The workflow's own tools, copied before the agent can change the checkout.
          cp tools/transcript.py tools/progress.py "$RUNNER_TEMP/"

      - name: Put the papers under paper/
        env:
          KEY: ${{ secrets.PAPERS_DEPLOY_KEY }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/papers_key"; store="$RUNNER_TEMP/store"
          printf '%s\n' "$KEY" > "$key"; chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --depth 1 --filter=blob:none --sparse git@github.com:catalystneuro/registry-papers.git "$store"
          git -C "$store" sparse-checkout set "$DANDISET"
          git -C "$store" lfs pull --include "$DANDISET/*" || true
          rm -f "$key"
          if ! ls "$store/$DANDISET"/*.txt >/dev/null 2>&1; then
            rm -rf "$store"
            echo "::error::No full text for $DANDISET in the paper store: supply the paper (docs/pipeline.md)"; exit 1
          fi
          mkdir -p paper && cp "$store/$DANDISET"/* paper/ && rm -rf "$store"
          ls -la paper
          head -n 6 paper/*.txt

      - name: Check the token, the permission mode and the agent's shell
        if: ${{ !inputs.papers_only }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
          DISABLE_AUTOUPDATER: '1'
          DISABLE_TELEMETRY: '1'
        run: |
          set +e -uo pipefail
          cd "$RUNNER_TEMP"
          # The agent runs one shell command: the length of the token as its commands see it (0 when
          # the scrub removed it), and a marker that shows the sandboxed shell started.
          claude -p 'Use the Bash tool to run exactly this command: printf "%s:" "$(printenv CLAUDE_CODE_OAUTH_TOKEN | wc -c)"; echo shell-ok. Then reply with only the line it printed.' \
            --model "$MODEL" --max-turns 3 \
            --output-format stream-json --verbose --permission-prompts none --allowedTools "$TOOLS" \
            > preflight.jsonl 2> preflight.err
          mode=$(jq -r 'select(.type=="system" and .subtype=="init") | .permissionMode' preflight.jsonl)
          result=$(jq -r 'select(.type=="result") | .result' preflight.jsonl)
          echo "permission mode: $mode; reply: $result"
          tail -c 1000 preflight.err
          case "$result" in
            *"Failed to authenticate"*) echo "::error::The CLAUDE_CODE_OAUTH_TOKEN secret did not authenticate: $result"; exit 1;;
          esac
          [[ "$result" == *shell-ok* ]] || { echo "::error::The agent's shell did not run: $result"; exit 1; }
          [[ "$result" =~ (^|[^0-9])0:shell-ok ]] || { echo "::error::The token is visible to the agent's commands"; exit 1; }
          [ "$mode" = default ] || { echo "::error::Claude Code started in permission mode $mode, not default"; exit 1; }

      - name: Run the agent
        if: ${{ !inputs.papers_only }}
        id: agent
        # Shorter than the job's limit, so that the transcript is still exported when it is reached.
        timeout-minutes: 300
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: '1'
          DISABLE_AUTOUPDATER: '1'
          DISABLE_TELEMETRY: '1'
          # Commands run in the foreground until they finish: a notebook run can take many minutes.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
          BASH_DEFAULT_TIMEOUT_MS: '3600000'
          BASH_MAX_TIMEOUT_MS: '7200000'
        run: |
          set +e -uo pipefail     # keep going when claude fails, to report how
          echo "started=true" >> "$GITHUB_OUTPUT"
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --model "$MODEL" \
            --output-format stream-json --verbose --forward-subagent-text \
            --permission-prompts none --allowedTools "$TOOLS" --disallowedTools "$NOT_TOOLS" \
            2> "$RUNNER_TEMP/stderr.txt" | tee "$RUNNER_TEMP/run.jsonl" | python "$RUNNER_TEMP/progress.py"
          status=$?
          echo "claude exited with $status"
          tail -c 2000 "$RUNNER_TEMP/stderr.txt" || true
          exit $status

      - name: Export the transcript and collect the changes
        if: always() && steps.agent.outputs.started == 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/out"; mkdir -p "$out/transcripts/$DANDISET"
          tool="$RUNNER_TEMP/transcript.py"
          name="$DANDISET · $ROLE · run ${{ github.run_id }}"
          # The reader's changes first, so that nothing in the transcript can lose them. Only the
          # dandiset's claims: never paper/.
          paths=("claims/$DANDISET"); [ ! -e "questions/$DANDISET.yaml" ] || paths+=("questions/$DANDISET.yaml")
          git add -A -- "${paths[@]}" && git diff --cached --binary > "$out/changes.patch"
          git diff --cached --stat
          python "$tool" "$RUNNER_TEMP/run.jsonl" "$out/transcripts/$DANDISET/$ROLE.md" --omit paper/ \
            --report "$out/transcripts/$DANDISET/$ROLE-report.md" --title "$name"
          rm -f "$RUNNER_TEMP/run.jsonl"
          cat "$out/transcripts/$DANDISET/$ROLE-report.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Named for the dandiset and role: in a pipeline, several dandisets run inside one
          # workflow run, and an artifact name shared between them made a commit job pick up
          # another dandiset's results.
          name: agent-run-${{ inputs.dandiset }}-${{ inputs.role }}
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: ignore

  commit:
    needs: run
    # Whenever the agent was started, also when the run was cancelled or failed, so that its
    # transcript and partial work are kept; the commit message says how the run ended.
    if: always() && needs.run.outputs.started == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          # Named for the dandiset and role: in a pipeline, several dandisets run inside one
          # workflow run, and an artifact name shared between them made a commit job pick up
          # another dandiset's results.
          name: agent-run-${{ inputs.dandiset }}-${{ inputs.role }}
          path: out

      - name: Commit to the attempt's branch
        run: |
          set -euo pipefail
          # Take the archiving script from the workflow's own ref: a branch made before it existed lacks it.
          cp tools/archive_transcripts.sh "$RUNNER_TEMP/"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH" && git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -b "$BRANCH"
          fi
          # Refuse anything that is not this dandiset's: a guard against results being mixed up.
          others=$(ls out/transcripts | grep -vx "$DANDISET" || true)
          [ -z "$others" ] || { echo "::error::Transcripts for other dandisets: $others"; exit 1; }
          # The claims run starts an attempt: it moves an earlier attempt's transcripts aside first.
          if [ "$ROLE" = claims ]; then "$RUNNER_TEMP/archive_transcripts.sh" "$DANDISET"; fi
          if [ -s out/changes.patch ]; then
            allowed="^(claims/$DANDISET/|questions/$DANDISET\.yaml$)"
            stray=$(git apply --numstat out/changes.patch | cut -f3 | grep -vE "$allowed" || true)
            [ -z "$stray" ] || { echo "::error::Changes outside dandiset $DANDISET: $stray"; exit 1; }
            git apply --index out/changes.patch
          fi
          # A transcript with nothing but its title means the agent never started; keep it out.
          for f in out/transcripts/*/*.md; do [ "$(wc -l < "$f")" -gt 2 ] || rm "$f"; done
          cp -r out/transcripts . && git add transcripts
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' \
            commit -m "Agent run on $DANDISET: $ROLE (${{ needs.run.result }})" \
            -m "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin "$BRANCH"
