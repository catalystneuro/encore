name: Paper run
run-name: "Paper run: ${{ inputs.paper || inputs.dataset || inputs.dandiset }}${{ inputs.replicate && format('/{0}', inputs.replicate) || '' }} ${{ inputs.role }}${{ inputs.account && inputs.account != 'verified' && format(' ({0})', inputs.account) || '' }}"

# Starts one reader run: the paper match, the claims, their check, or the answers to an author's
# questions (docs/protocol.md). The run itself is
# encore-protocol's papers.yml, at the version protocol.lock names; this workflow only takes the inputs, by hand
# from the Actions tab or from the queue runner, as
#   gh workflow run papers.yml -f paper=guan-2022 -f role=...
# The version here, in attempt-sequence.yml and in protocol.lock must agree (tests/test_protocol_pin.py).
# A reusable workflow's version cannot come from a file, so it is written out in each.

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "For the paper match: the dataset, 000147, DANDI:000147 or <archive>:<id>"
        required: false
      paper:
        description: "For the other roles: the paper's key (tingley-2021; docs/paper-first.md)"
        required: false
      dandiset:
        description: "The same, under its old name (runners started before the rename use it)"
        required: false
      role:
        description: "Which run"
        required: true
        type: choice
        options: [paper-match, claims, claims-check, answer]
      papers_only:
        description: "Only check that the papers reach the job; run no agent"
        type: boolean
        default: false
      model:
        description: "Model"
        default: claude-opus-5-5
      account:
        description: "Account: verified, unverified (a run it flags fails, for the runner to repeat on verified), or api (the API key with prepaid credits, ANTHROPIC_API_KEY_CREDITS)"
        type: choice
        options: [verified, unverified, api]
        default: verified
      replicate:
        description: "For a replicate's answer run (docs/replicates.md): its name, r1, r2, ... Empty otherwise"
        default: ""

permissions:
  contents: write   # the called workflow's commit job pushes to the attempt's branch

jobs:
  papers:
    uses: encorescience/encore-protocol/.github/workflows/papers.yml@v0.1.1
    with:
      dataset: ${{ inputs.dataset }}
      paper: ${{ inputs.paper }}
      dandiset: ${{ inputs.dandiset }}
      role: ${{ inputs.role }}
      papers_only: ${{ inputs.papers_only }}
      model: ${{ inputs.model }}
      account: ${{ inputs.account }}
      replicate: ${{ inputs.replicate }}
    secrets: inherit
